labels:
  poem: पद्य
  author: कृतिकारर परिचय
  exercise-A: अ. कॊट्टिरुव प्रश्नॆगळिगॆ ऒंदु वाक्यदल्लि उत्तरिसि.
poem-s1l1: आडिसि नोडु, बीळिसि नोडु, उरुळि होगदु
poem-s1l2: एने बरलि, यारिगु सोतु तलॆय बागदु
poem-s1l3: ऎंदिगू नानु हीगे इरुवॆ ऎंदु नगुवुदु, हीगे नगुतलिरुवुदु
poem-s2l1: गुडिसले आगलि अरमनॆयागलि, आट निल्लदु
poem-s2l2: हिरियरॆ इरलि किरियरॆ बरलि, भेद तोरदु
poem-s2l3: कष्टवॊ सुखवॊ अळुकदॆ आडि तूगुतिरुवुदु
poem-s3l1: मैयनु हिंडि नॊंदरु कब्बु, सिहिय कॊडुवुदु
poem-s3l2: तेयुतलिद्दरू गंधद परिमळ, तुंबि बरुवुदु
poem-s3l3: तानॆ उरिदरू दीपवु मनॆगॆ बॆळक तरुवुदु
poem-s4l1: आडिसुवातन कैचळकदलि ऎल्ल अडगिदॆ
poem-s4l2: आतन करुणॆयु जीवव तुंबि, कुणिसि नलिसिदॆ
poem-s4l3: आ कै सोतरॆ, बॊंबॆय कथॆयु, कॊनॆयागुवुदे!
author-1: चिट्टनहळ्ळि सदाशिवय्य उदयशंकर, चि. उदयशंकर् ऎंदे प्रसिद्धरु. इवरु 1934र फॆब्रवरि 18रंदु हॊळॆनरसीपुरदल्लि जनिसिदरु. सुमारु 4,000दष्टु सिनॆमा गीतॆगळन्नु रचिसिद कीर्ति इवरदु. कन्नडद चित्रसाहितियागिद्द चि. सदाशिवय्यनवर पुत्रराद उदयशंकर् तम्म ऎळवॆय दिनगळिंदले सिनॆमा क्षेत्रवन्नु हत्तिरदिंद नोडिदवरु. “संत तुकाराम्” सिनॆमाद मूलक अवर साहित्यकृषि प्रारंभवायितु. डा. राज्कुमार् अवर सिनॆमागळिगागि सुमारु 400क्कू हॆच्चु गीतॆगळन्नु बरॆदुकॊट्ट उदयशंकर्, राजकुमार् अवर जॊतॆ सहनटनागियू कॆल चलनचित्रगळल्लि अभिनयिसिद्दरु. राजकुमार् अवर 88 चित्रगळिगॆ संभाषणॆ बरॆदद्दु कूड चि. उदयशंकर्. “मामरवॆल्लो कोगिलॆयॆल्लो”, “बाडिहोद बळ्ळियिंद हूवु अरळबल्लुदॆ”, “स्नेहद कडलल्लि”, “इन्नादरू जीवनदल्लि मुंदॆ बन्नि” मुंताद अवर हलवु गीतॆगळु कन्नड जनमानसदल्लि अच्चळियदॆ उळिदिवॆ. कुलगौरव, नागरहावु, जीवनचैत्र, प्रेमद काणिकॆ, आनंद् मुंताद चलनचित्रगळल्लि कॆलस माडिद्दक्कागि अवरु हलवु प्रशस्तिगळन्नु पडॆदिद्दारॆ. तम्म 59नॆय वयस्सिनल्लि (1993 जुलै 3) चि. उदयशंकर् तीरिकॊंडरु.
ex-a-q1: जीवनदल्लि सोतवरिगॆ गॊंबॆयु कॊडुव धैर्यवेनु?
ex-a-q2: गॊंबॆयु हेगॆ तूगुत्तिरुत्तदॆ?
ex-a-q3: तावु कष्टपट्टरू लोकक्कॆ उपकार माडुव मूरु संगतिगळु यावुवु?
ex-a-q4: गॊंबॆयु निश्चलवागुवुदु यावाग?
ex-a-q5: गॊंबॆयु हेळुव नीतिय सारांशवेनु?
