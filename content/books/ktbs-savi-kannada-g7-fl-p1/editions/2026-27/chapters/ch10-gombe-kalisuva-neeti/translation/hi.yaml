labels:
  poem: 'पद्य'
  author: 'कृतिकार परिचय'
  exercise-A: 'अ. दिए गए प्रश्नों के एक वाक्य में उत्तर दीजिए।'

poem-s1l1: 'खिलाओ, गिराओ—लुढ़ककर नहीं जाता'

poem-s1l2: 'जो भी आए, किसी से हारकर सिर नहीं झुकाता'

poem-s1l3: 'हमेशा ऐसा ही रहूँगा कहकर हँसता है, ऐसे ही हँसता रहता है'

poem-s2l1: 'झोंपड़ी हो या महल, खेल नहीं रुकता'

poem-s2l2: 'बड़े हों या छोटे आएँ, भेद नहीं दिखाता'

poem-s2l3: 'कष्ट हो या सुख, बिना घबराए खेलता झूलता रहता है'

poem-s3l1: 'शरीर पिसकर दुखे तो भी गन्ना मिठास देता है'

poem-s3l2: 'घिसते रहने पर भी चंदन की सुगंध भर आती है'

poem-s3l3: 'स्वयं जलकर भी दीपक घर को प्रकाश देता है'

poem-s4l1: 'खेलाने वाले की कुशलता में सब छिपा है'

poem-s4l2: 'उसकी करुणा जीवन भरती है, नचाकर आनंदित करती है'

poem-s4l3: 'वह हाथ हार जाए तो कठपुतली की कथा समाप्त!'

author-1: 'चि. उदयशंकर 18 फ़रवरी 1934 को होलेनरासीपुर में जन्मे। लगभग 4,000 सिनेमा गीत रचे। डॉ. राजकुमार की फ़िल्मों के लिए 400 से अधिक गीत लिखे। 3 जुलाई 1993 को निधन।'

ex-a-q1: 'जीवन में हारे हुए को गुड़िया क्या साहस देती है?'

ex-a-q2: 'गुड़िया कैसे झूलती रहती है?'

ex-a-q3: 'स्वयं कष्ट सहकर भी लोक का उपकार करने वाली तीन बातें क्या हैं?'

ex-a-q4: 'गुड़िया कब निश्चल होती है?'

ex-a-q5: 'गुड़िया की नीति का सार क्या है?'
