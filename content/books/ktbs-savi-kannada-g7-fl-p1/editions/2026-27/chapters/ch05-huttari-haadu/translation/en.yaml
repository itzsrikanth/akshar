ex-a-q1: 'How does the Kaveri shine?'

ex-a-q2: 'Who are the unbeaten saviors?'

ex-a-q3: 'From which hill to which hill has Kodagu grown?'

ex-a-q4: 'What is Kaveri’s maternal home?'

