  exercise-A: 'अ. निम्नलिखित प्रश्नों के उत्तर दीजिए।'

intro-1: 'हुत्तरी गीत कोडव और कोडगु जीवन को प्रतिबिंबित करता है। कोडव कटाई के उत्सव में गाते हैं। यह कोडगु की प्राकृतिक सुंदरता और वीरता का वर्णन करता है।'

poem-s1l5: 'वहाँ उस ओर देखो!'

poem-s1l6: 'वहाँ कोडग भूमि है'

poem-s1l7: 'वहाँ कोडव का घर है!'

poem-s5l7: 'हमारा कोडगु जिए'

competency: 'कौशल: बोलना। सामर्थ्य: परिस्थिति-घटनाओं का वर्णन करना।'

author-1: 'श्री पंजे मंगेशराव ‘कविशिश्य’ काव्यनाम से प्रसिद्ध। 1874 में दक्षिण कन्नड़ के बंटवाल में जन्म। 1934 में 20वें अखिल भारत कन्नड़ साहित्य सम्मेलन के अध्यक्ष रहे।'

