ex-a-q1: kāveriyu hegè hòḻèyuttāḻè?
ex-a-q2: solu sāvariyadavaru yāru?
ex-a-q3: kòḍagu yāva giriyiṃda yāva giriya paryaṃta bèḻèdidè?
ex-a-q4: kāveriya tavarmanè yāvudu?
ex-a-q5: yāva hòyligè kuṇiva pada hòra hòmmabeku?
