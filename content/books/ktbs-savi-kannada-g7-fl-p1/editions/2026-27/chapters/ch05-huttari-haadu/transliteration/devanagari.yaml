  exercise-A: अ. कॆळगिन प्रश्नॆगळिगॆ उत्तरिसि.
intro-1: कॊडवर हागू कॊडगिन जीवनवन्नु प्रतिबिंबिसुव हुत्तरि हाडु ऒंदु. कॊडवरु सुग्गिय हब्बद संदर्भदल्लि हाडुव हाडु इदागिदॆ. इदु कॊडगिन प्राकृतिक सौंदर्यवन्नु, वीरश्रीयन्नु वर्णिसुवुदु. कॊडगिन संस्कृति, संप्रदायद लेपन हागू जनपद हिन्नॆलॆयन्नु इदु ऒळगॊंडिदॆ.
poem-s1l1: ऎल्लि भूरमॆ देव सन्निधि बयसि बिम्मनॆ बंदळो?
poem-s1l2: ऎल्लि मोहन गिरिय बॆरगिन रूपिनिंदलि निंदळो?
poem-s1l3: ऎल्लि मुगिललि मिंचिनोल् कावेरि हॊळॆ हॊळॆ हॊळॆवळो?
poem-s1l4: ऎल्लि नॆलवनु तणिसि जनमन हॊलद कळॆकळॆ कळॆवळो?
poem-s1l5: अल्लॆ आ कडॆ नोडला!
poem-s1l6: अल्लॆ कॊडगर नाडला
poem-s1l7: अल्लॆ कॊडवर बीडला!
poem-s2l1: सविदु मॆद्दरॊ यारु पूर्वदि हुलिय हालिन मेवनु?
poem-s2l2: कवणॆ तिरिकल्लाट हग्गकॆ सॆळॆदरो हॆब्बावनु?
poem-s2l3: सवरि आनॆय सॊंडलिन रणकॊंबनार् भोर्गरॆदरो?
poem-s2l4: सवॆदु सवॆयद साहसत्वद क्षात्र बेटॆय मॆरॆदरो?
poem-s2l5: अवरु सोल् सावरियरु!
poem-s2l6: अवरु कडुगलि गरियरु!
poem-s2l7: अवरॆ कॊडगिन हिरियरु!
poem-s3l1: तम्म नाडिन कॊरळु दास्यद नॊगद भारकॆ बग्गदोल्
poem-s3l2: हॆम्मॆहगॆगळ हॊडॆदु हिरियरु हसिदु हारुव बग्गदोल्
poem-s3l3: बॊम्मगिरियिं पुष्पगिरि पर्यंत बॆळॆदी देशवु
poem-s3l4: धर्मदानव कट्टु कट्टळॆ रीति नीतिय कोशवु
poem-s3l5: नम्म कॊडगिदु जम्मदु;
poem-s3l6: जम्म कॊडगिदु नम्मदु;
poem-s3l7: नम्मॊडल् बिडलम्मदु !
poem-s4l1: इदु अगस्त्यन तपद मनॆ, कावेरि ताय तवर्मनॆ,
poem-s4l2: कदन सिरिगुय्यालॆ तूगिदनिल्लि चंदरवर्मनॆ!
poem-s4l3: इदकॊ! चॆंगाळ्वरसराडंबरवु कुणिद श्रीरंगवु
poem-s4l4: इदॊ! इदॊ! इल्लरुळ्द हालेरियर बलगिरिशृंगवु
poem-s4l5: विधिय माटद कॊडगिदु
poem-s4l6: मॊदलॆ नम्मदु, कडॆगिदु
poem-s4l7: कदलदॆम्मनु; बॆडगिदु.
poem-s5l1: ऒम्मतवु ऒग्गट्टु ऒंदे मनवु ऎल्लिदॆ हेळिरि?
poem-s5l2: सुम्मनित्तरॊ दट्टिकुप्पस? हाडुहुत्तरिगेळिरि!
poem-s5l3: चिम्मि पातुरॆकोल हॊय्लिगॆ कुणिव पद हॊर हॊम्मलि!
poem-s5l4: अम्मॆ हरसिद सीमॆ नमगिदु इरलि नम्मदॆ नम्मलि!
poem-s5l5: नॆम्मदियनिदु ताळलि
poem-s5l6: अम्मॆया बलतोळलि
poem-s5l7: नम्म कॊडगिदु बाळलि
competency: 'कौशल: मातनाडुवुदु. सामर्थ्य: सन्निवेश घटनॆगळन्नु विवरिसुवुदु.'
author-1: 'श्री पंजॆ मंगेशराव्: ‘कविशिष्य’ ऎंब काव्यनामदिंद प्रसिद्धराद श्री पंजॆ मंगेशराव् अवरु सा. श. 1874 रल्लि दक्षिण कन्नड जिल्लॆ बंट्वाळदल्लि जनिसिदरु. मक्कळ कवितॆगळ कण्मणि ऎंदु प्रसिद्धराद इवरु हुत्तरिय हाडु, नागर हावे, कोटि चॆन्नय्य, गुडुगुडु गुम्मट देवरु, माताडो रामप्प मॊदलाद कृतिगळन्नु रचिसिद्दारॆ. इवरु सा. श. 1934 रल्लि नडॆद 20 नॆय अखिल भारत कन्नड साहित्य सम्मेळनद अध्यक्षरागिद्दरु.'
