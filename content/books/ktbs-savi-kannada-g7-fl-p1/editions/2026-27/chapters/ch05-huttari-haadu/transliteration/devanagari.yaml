ex-a-q1: कावेरियु हेगॆ हॊळॆयुत्ताळॆ?
ex-a-q2: सोलु सावरियदवरु यारु?
ex-a-q3: कॊडगु याव गिरियिंद याव गिरिय पर्यंत बॆळॆदिदॆ?
ex-a-q4: कावेरिय तवर्मनॆ यावुदु?
ex-a-q5: याव हॊय्लिगॆ कुणिव पद हॊर हॊम्मबेकु?
