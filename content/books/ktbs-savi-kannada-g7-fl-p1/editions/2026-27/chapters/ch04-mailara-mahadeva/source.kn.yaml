- id: competency
  type: competency
  section: competency
  text: "ಕೌಶಲ: ಮಾತನಾಡುವುದು. ಸಾಮರ್ಥ್ಯ: ಸಮಾರಂಭದ ಕಾರ್ಯಕ್ರಮಗಳನ್ನು ನಿರೂಪಣೆ ಮಾಡುವುದು. ಆಶಯ: ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಾಗಿ ಹೋರಾಟ ಮಾಡಿದವರನ್ನು ಸ್ವಾತಂತ್ರ್ಯಯೋಧರು ಎಂದು ಕರೆಯುತ್ತಾರೆ. ಒಂದು ಉದ್ದೇಶಕ್ಕಾಗಿ ತಮ್ಮ ಬದುಕನ್ನೇ ಮೀಸಲಾಗಿಟ್ಟ ಇಂಥ ಯೋಧರು ಭಾರತದಲ್ಲಿ ಹಲವಾರು ಮಂದಿ ಇದ್ದಾರೆ. ದೇಶವೇ ಮುಖ್ಯ ಅದರ ಮುಂದೆ ಉಳಿದೆಲ್ಲವೂ ಗೌಣ. ದೇಶದ ಉಳಿವಿಗಾಗಿ ಎಂಥ ತ್ಯಾಗಕ್ಕೂ ಸಿದ್ಧರಾಗಿದ್ದವರು ಈ ಹಿರಿಯರು. ಸ್ವಾರ್ಥವನ್ನು ಮರೆತು ದೇಶದ ಪ್ರಗತಿಯನ್ನೇ ಮುಖ್ಯ ಗುರಿಯಾಗಿರಿಸಿಕೊಂಡರು ಇಂಥ ಅಸಂಖ್ಯಾತ ಯೋಧರನ್ನು ನಾವು ಕೃತಜ್ಞತೆಯಿಂದ ಸ್ಮರಿಸಬೇಕು."
