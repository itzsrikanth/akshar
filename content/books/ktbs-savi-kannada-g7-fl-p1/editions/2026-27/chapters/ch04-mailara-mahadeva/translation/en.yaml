intro-1: 'We are now in free India. Before 1947 India’s administration was in British hands. Many people fought to free India from the British. Under Mohandas Karamchand Gandhi’s leadership a non-violent struggle took place. Across India many took part in this movement. From Karnataka too many answered Gandhiji’s call and joined the freedom movement. Some became martyrs in this struggle. Among those who fought and became martyrs was one Mailara Mahadeva. You can see his life story here. As the fruit of all their struggle and sacrifice we gained freedom on 15 August 1947. Remembering the elders who brought us freedom is our duty.'

story-n1: 'It was the time India was under British rule. Many Indians were fighting to free India and make it an independent country. Motebennur is a village in Haveri district. In that village a patriot was speaking. In his speech he said foreign clothes should be given up and clothes made in our own country should be worn. An 8–10 year old boy listening touched his head. On his head was a foreign cap. At once he took off the cap and threw it on the ground. The boy who threw the cap was Mailara Mahadeva. He was born on 8 June 1911 in Motebennur. Father Martandappa, mother Basamma a patriot. By then that mother who had fought the British had experienced jail. A son fit for that mother—Mahadeva. Primary education finished in Motebennur. For further study he went to the school in nearby Hamsabhavi. But studies did not appeal. Thoughts of swadeshi cloth always hummed in his mind. Mahatma Gandhi favored khadi and promoted it everywhere. Young Mahadeva’s desire to promote khadi grew.'

story-n2: 'Mahadeva was twelve or thirteen. In Vijayapura district is a village Kaladagi. There at that time they made khadi cloth. Mahadeva went there. He learned how to make khadi. Carrying khadi he went village to village selling it. He also promoted use of khadi.'

story-n3: 'A call came to Mahadeva from Sabarmati Ashram. He went there. By then the famous Dandi satyagraha was on. He walked in the Dandi march with Gandhiji. Those who took part in Dandi satyagraha got jail sentences. Mahadeva spent six months in jail. After Dandi march ended Mahadeva returned to his birthplace. By then he had the name of Karnataka’s freedom fighter who took part in Dandi. In the village he got a grand welcome.'

story-n4: 'Mahadeva called his wife Siddamma Siddhamati. Wanting Sabarmati’s good life not only for himself but for his wife too, he took her to Sabarmati. There Siddamma took part in the non-cooperation movement against the British government and went to jail. Mahadeva who had come to the village also joined non-cooperation and went to jail. While in Hindalga jail Gandhiji visited and seeing Mahadeva encouraged him.'

story-n5: 'Mahadeva was released from jail. Having gone to jail many times he began to care about bodily health. He felt he should learn disciplined exercise. He learned exercise. While learning exercise he also studied the science of medicines. Aiming to serve villagers he started a seva ashram. Husband and wife as directors of the ashram taught villagers spinning on the charkha, nature cure, exercise and so on. They took khadi made at the ashram to villages and sold it. It became famous as ‘Mahadeva’s khadi’. Along with it the couple’s freedom yearning and struggle became popular.'

poem-s1l1: 'Though young he speaks so well|'

poem-s1l2: 'Like a bird kissing its chicks|'

poem-s1l3: 'His laugh is one charm|'

poem-s1l4: 'His speech another charm for us|'

poem-s1l5: 'Nowhere have we found such pure-gold-like one||'

story-n6: 'The freedom struggle grew day by day. In 1942 Gandhiji gave the slogan ‘British, quit India’. Across the country Indians supported Gandhiji’s slogan. Mailara Mahadeva led this movement in the southern part. Going village to village he promoted Gandhiji’s slogan. His words awakened patriotism.'

story-n7: 'For the British to leave India, their administration had to be hit so they felt they could not rule. Mahadeva with his companions prepared for such daring. They watched train movement. At Savanur they burned the railway station without British police knowing. At Honnatti they seized police guns. They burned the police station at Balehosur. These acts of Mahadeva and companions made the British government tremble. A reward was announced for those who caught Mahadeva. Day and night British police searched for Mahadeva and his team.'

story-n8: 'At Hosaritti in Haveri district there was a government centre forcibly collecting tax and tormenting people. It was decided to capture it. He sent his wife Siddamma and daughter Kasturidevi who were with him to Hubballi. Morning of 1 April 1943. Near Hosaritti at Virabhadra temple there was a police squad. Beside it the treasury. Mahadeva with companions laid siege. Fearing Mahadeva’s courage many police fled. Mahadeva was busy breaking the treasury lock. A policeman hiding shot Mahadeva in the chest. Mahadeva fell in a pool of blood. Companions went to strike the policeman who shot. Mahadeva stopped them saying ours is a non-violent struggle, do not kill police, do not do violence. Mahadeva’s breath stopped. News spread across the country. Wife Siddhamma bravely faced her husband’s sacrifice. The country mourned for Mahadeva. That grief flowed as song.'

poem-s2l1: 'For India’s release from bondage they endured great hardship'

poem-s2l2: 'Spending all youth in prison the great hero Mailara fell'

poem-s2l3: 'Rogue among rogues, warrior among warriors, captain among the pure!'

poem-s2l4: 'Even naming a newborn after the brave does not finish the debt!'

competency: 'Skill: speaking. Ability: narrating ceremonial programmes. Intent: Those who fought for freedom are called freedom fighters. Such fighters who dedicated their lives to a purpose are many in India. The country is foremost; all else is secondary. These elders were ready for any sacrifice for the country’s survival. Forgetting selfishness they kept the country’s progress as the main goal. We should gratefully remember such countless fighters.'

