intro-1: 'हम अब स्वतंत्र भारत में हैं। 1947 से पहले भारत का प्रशासन ब्रिटिशों के हाथ में था। ब्रिटिशों से भारत छुड़ाने के लिए अनेक लोगों ने संघर्ष किया।'

story-n1: 'हावेरी जिले के मोटेबेन्नूर गाँव में जन्मे मैलार महादेव ने विदेशी टोपी फेंककर स्वदेशी का संदेश अपनाया। 8 जून 1911 को जन्म। माता बसम्मा देशप्रेमी थीं।'

story-n3: 'सबर्मती आश्रम से बुलावा आया। दांडी सत्याग्रह में गांधीजी के साथ चले। छह महीने जेल रहे।'

story-n6: '1942 में गांधीजी ने ‘ब्रिटिश भारत छोड़ो’ का नारा दिया। दक्षिण भाग में मैलार महादेव ने नेतृत्व किया।'

story-n8: '1 अप्रैल 1943 को होसरित्ति में कोषागार पर घेरा डालते समय पुलिस की गोली से महादेव शहीद हुए। अहिंसात्मक संघर्ष कहते हुए साथियों को पुलिस मारने से रोका।'

competency: 'कौशल: बोलना। आशय: स्वतंत्रता के लिए लड़ने वालों को स्वतंत्रता योद्धा कहते हैं। ऐसे योद्धाओं को कृतज्ञता से स्मरण करना चाहिए।'

