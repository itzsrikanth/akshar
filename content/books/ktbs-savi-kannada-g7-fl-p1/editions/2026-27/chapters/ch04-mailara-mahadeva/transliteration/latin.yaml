ex-a-q1: moṭèbènnūru èṃba haḻḻi yāva jillèyallidè?
ex-a-q2: yāva baṭṭègaḻa vicāra yāvāgalū mailārara manassinalli gunuguḍuttittu?
ex-a-q3: mahādevanigè gāṃdhiyavaròḍanè yāva āśramadalli irabekèṃdu āsèyāyitu?
ex-a-q4: vijayapura jillèyalli yāva grāmadalli khādi baṭṭègaḻannu tayāru māḍuttiddaru?
ex-a-q5: 1942ralli gāṃdhījiyavaru yāva ghoṣaṇè māḍidaru?
ex-a-q6: mahādeva avaru èlli pòlīsara baṃdūku apaharisidaru?
ex-b-q1: mahādeva kalādagi èṃba òṃdu grāmakkè hogi enu tiḻidukòṃḍaru?
ex-b-q2: daṃḍiyātrèyalli hèjjè hākida mahādevarigè āda śikṣè enu?
ex-b-q3: mahādeva mattu siddhamati ibbarū sevāśramada saṃcālakarāgi māḍida kèlasagaḻenu?
ex-b-q4: mahādeva raktada maḍuvinalli biddaddu ekè?
ex-c-q1: mahādeva avaru jailiniṃda biḍugaḍèyāda melè māḍida kāryagaḻāvuvu?
ex-c-q2: briṭiṣaru bhārata biṭṭu tòlagabekādarè enu māḍabekèṃdu mahādeva yocisidaru?
ex-c-q3: hòsarittiyalli naḍèda ghaṭanègaḻāvuvu?
