intro-1: नावीग स्वतंत्र भारतदल्लिद्देवॆ. 1947क्किंत हिंदॆ भारतद आडळित ब्रिटिषर कैयल्लित्तु. ब्रिटिषरिंद भारतवन्नु बिडिसिकॊळ्ळलु हलवारु मंदि होराडिदरु. मोहनदास करमचंद गांधि अवर नेतृत्वदल्लि अहिंसात्मक होराटवे नडॆयितु. भारतदाद्यंत हलवरु ई चळवळियल्लि भागवहिसिद्दरु. कर्नाटकदिंदलू हलवारु जन गांधीजियवर करॆगॆ ओगॊट्टु स्वातंत्र्यक्कागि नडॆद चळवळियल्लि भागवहिसिदरु. कॆलवरु ई होराटदल्लि हुतात्मरू आदरु. हीगॆ होराटमाडि हुतात्मरादवरल्लि ऒब्बरु मैलार महादेव. अवर जीवन चरित्रॆयन्नु नीविल्लि काणबहुदु. इवरॆल्लर होराट मत्तु त्यागद फलवागि नमगॆ 1947र आगस्ट् 15रंदु स्वातंत्र्य लभिसितु. नमगॆ स्वातंत्र्यवन्नु तंदुकॊट्ट हिरियरन्नु स्मरिसुवुदु नम्म कर्तव्य.
story-n1: भारत ब्रिटिषर आडळितक्कॆ सेरिद्द काल. अवर आडळितदिंद बिडिसिकॊंडु भारतवन्नु स्वतंत्रवाद देशवन्नागि माडलु हलवारु भारतीयरु होराट माडुत्तिद्दरु. हावेरि जिल्लॆय मोटॆबॆन्नूरु ऎंबुदॊंदु हळ्ळि. आ हळ्ळियल्लि देशभक्तरॊब्बरु भाषण माडुत्तिद्दरु. अवर भाषणदल्लि “विदेशी वस्त्रगळन्नु त्यजिसि नम्म देशदल्ले तयारु माडिद बट्टॆगळन्नु तॊडबेकु” ऎंदॆल्ल हेळुत्तिद्दरु. आ मातु केळुत्तिद्द 8-10 वर्षद ऒब्ब बालक तन्न तलॆ मुट्टि नोडिद. अवन तलॆय मेलॆ विदेशि टॊप्पिगॆ इत्तु. कूडलॆ टॊप्पिगॆयन्नु तॆगॆदु नॆलक्कॆसॆद. हीगॆ टॊप्पिगॆ नॆलक्कॆसॆद हुडुगन हॆसरु मैलार महादेव. 8नॆय जून् 1911रंदु मोटॆबॆन्नूरिनल्लि जनिसिदरु. तंदॆ मार्तंडप्प, महादेवन तायि बसम्म देशप्रेमि. आ हॊत्तिगॆ ब्रिटिषर विरुद्ध होराडिद्द आ तायि जैलुवासवन्नु अनुभविसिदवरु. आ तायिगॆ तक्क मग महादेव. प्राथमिक विद्याभ्यासवन्नु मोटॆबॆन्नूरिनल्लि मुगिसिदरु. मुंदिन विद्याभ्यासक्कागि हत्तिरविद्द हंसभाविय शालॆगॆ होदरु. आदरॆ अवरिगॆ ओदु रुचिसलिल्ल. स्वदेशी बट्टॆगळ विचार यावागलू मनस्सिनल्लि गुनुगुडुत्तित्तु. महात्मा गांधीजि खादि बट्टॆय बगॆगॆ ऒलवु हॊंदिद्दु, ऎल्ल कडॆयल्लू
  आ विचार प्रचार माडुत्तिद्दरु. बालक महादेवरिगॆ खादि बट्टॆयन्नु कुरितु प्रचारमाडबेकॆंब आसॆ हॆच्चायितु.
story-n2: महादेवरवरिगॆ हन्नॆरडु-हदिमूरर हरॆय. विजयपुर जिल्लॆयल्लि कलादगि ऎंब ऒंदु ग्रामविदॆ. अल्लि आ कालदल्लि खादि बट्टॆगळन्नु तयारु माडुत्तिद्दरु. महादेवरु अल्लिगॆ होदरु. अल्लि खादियन्नु तयारिसुवुदु हेगॆ ऎंदु तिळिदुकॊंडरु. खादियन्नु हॊत्तु ऊरूरु तिरुगि माराट माडिदरु. खादि बळकॆयन्नु कुरितु प्रचारवन्नू नडॆसिदरु.
story-n3: महादेव अवरिगॆ सबरमति आश्रमदिंद करॆ बंदितु. महादेव अल्लिगॆ होदरु. आ वेळॆगॆ प्रसिद्ध दंडि सत्याग्रह नडॆयुत्तित्तु. गांधीजियवरॊडनॆ दंडियात्रॆयल्लि हॆज्जॆ हाकिदरु. दंडि सत्याग्रहदल्लि भागवहिसिदवरिगॆ सॆरॆमनॆ वासद शिक्षॆयायितु. महादेव आरु तिंगळु सॆरॆमनॆयल्लि कळॆदरु. दंडियात्रॆ मुगिदु महादेव हुट्टूरिगॆ वापस्सु बंदरु. आ हॊत्तिगागले दंडियात्रॆयल्लि भागवहिसिद्द कर्नाटकद स्वातंत्र्य सेनानि ऎंबुदागि अवरिगॆ हॆसरु बंदित्तु. ऊरिनल्लि महादेव अवरिगॆ अद्दूरिय स्वागत सिक्कितु.
story-n4: महादेव तम्म हॆंडति सिद्दम्म अवरन्नु सिद्धमति ऎंदु करॆयुत्तिद्दरु. सबरमतिय सुखवास तनगष्टे अल्लदॆ हॆंडतिगू आगबेकॆंदु अवरन्नू सबरमतिगॆ करॆदुकॊंडु होदरु. अल्लि सिद्दम्म ब्रिटिष् सरकारक्कॆ असहकार नीडुव चळवळियल्लि भागवहिसि जैलु सेरिदरु. ऊरिगॆ बंदिद्द महादेव इल्लि असहकार चळवळियल्लि भागवहिसि जैलु सेरिदरु. हिंडलगा जैलिनल्लिद्दाग गांधीजियवरु अल्लिगॆ भेटि नीडि महादेवरन्नु कंडु अवरन्नु प्रोत्साहिसिदरु.
story-n5: महादेवरिगॆ जैलिनिंद बिडुगडॆयायितु. हलवारु बारि जैलिगॆ होगिद्दरिंद देहद आरोग्यद बगॆगॆ अवरिगॆ काळजि उंटायितु. शिस्तुबद्धवाद व्यायामवन्नु कलियबेकॆनिसितु. व्यायामवन्नु कलितरु. व्यायाम कलियुवागले औषधगळ शास्त्रवन्नु अभ्यास माडिदरु. हळ्ळिगर सेवॆ माडुव उद्देशदिंद ऒंदु सेवाश्रमवन्नु प्रारंभिसिदरु. गंड-हॆंडति इब्बरू सेवाश्रमद संचालकरागि चरकदिंद नूलु तॆगॆयुवुदु, प्रकृति चिकित्सॆ, व्यायाम मुंतादवुगळन्नु हळ्ळिय जनरिगॆ अभ्यास माडिसिदरु. सेवाश्रमदल्लि तयारियागुत्तिद्द खादियन्नु ऊरूरिगॆ कॊंडु होगि माराट माडिदरु. ‘महादेवन खादि’ ऎंदे इदु प्रसिद्धियायितु. इदर जॊतॆयल्लि पति-पत्नियर स्वातंत्र्यद तुडित, होराट जनप्रियवायितु. ऊरिन जनरु इवर गुणगान माडिदरु.
