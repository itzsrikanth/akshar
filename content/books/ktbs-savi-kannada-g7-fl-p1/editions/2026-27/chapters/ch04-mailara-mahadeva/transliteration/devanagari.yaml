poem-s1l2: हक्कि तन्न मरिगॆ मुद्दुकॊट्टांग|
poem-s1l3: नक्करॊंदु चंद अवनु|
poem-s1l4: नुडिदरॊंदु चंद नमगॆ|
poem-s1l5: सिक्कॊदिल्लॊ इंथा चॊक्कबंगारदंथवा||
story-n6: स्वातंत्र्य होराट दिन दिन बॆळॆयुत्त होयितु. 1942रल्लि गांधीजियवरु ‘ब्रिटिषरे भारत बिट्टु तॊलगि’ ऎंब घोषणॆ माडिदरु. देशदॆल्लॆडॆ गांधीजियवर घोषणॆगॆ भारतीयर बॆंबल दॊरॆयितु. दक्षिण भागद ई चळुवळिगॆ मैलार महादेव नेतृत्व वहिसिदरु. हळ्ळि हळ्ळिगळल्लि तिरुगि गांधीजियवर घोषणॆयन्नु प्रचार माडिदरु. अवर मातुगळु देशभक्तियन्नु बडिदॆब्बिसिदवु.
story-n7: ब्रिटिषरु भारत बिट्टु तॊलगबेकादरॆ अवरु नडॆसुत्तिरुव आडळितक्कॆ धक्कॆ उंटुमाडि अवरिगॆ आडळित नडॆसुवुदु साध्यविल्ल ऎनिसबेकित्तु. महादेव तम्म संगडिगरॊंदिगॆ इंथ साहसक्कॆ अणियादरु. रैलु ओडाटद मेलॆ इवरु गमनविट्टरु. सवणूरु ऎंबल्लि रैलु निल्दाणवन्नु ब्रिटिष् पॊलीसरिगॆ गॊत्तागदंतॆ सुट्टुहाकिदरु. हॊन्नत्ति ऎंबल्लि पॊलीसर बंदूकु अपहरिसिदरु. बाळॆहॊसूरिन पॊलीस् केंद्रवन्नु सुट्टरु. महादेव मत्तु संगडिगर ई कृत्यगळिंद ब्रिटिष् सर्कार नडुगितु. महादेवप्पनवरन्नु हिडिदुकॊट्टवरिगॆ बहुमान घोषिसितु. हगलिरुळॆन्नदॆ ब्रिटिष् पॊलीसरु महादेव हागू अवर तंडदवरिगागि शोध नडॆसिदरु.
story-n8: हावेरि जिल्लॆय हॊसरित्तियल्लि कंदायवन्नु बलवंतवागि वसूलि माडि जनरन्नु हिंसिसुत्तिद्द सरकारद केंद्रवित्तु. अदन्नु आक्रमिसिकॊळ्ळबेकॆंदु निर्धारवायितु. तम्मॊट्टिगे इद्द पत्नि सिद्दम्मनन्नु हागू मगळाद कस्तूरिदेवियन्नु हुब्बळ्ळिगॆ कळुहिसिदरु. 1943र एप्रिल् 1 रंदु बॆळगिन समय. हॊसरित्तिय समीपद वीरभद्र देवालयदल्लि पॊलीसर तुकडियित्तु. अदर पक्कदल्ले खजानॆ. महादेव तन्न संगडिगरॊंदिगॆ मुत्तिगॆ हाकिदरु. महादेव अवर धैर्यक्कॆ हॆदरि हलवु पॊलीसरु ओट कित्तरु. महादेव खजानॆय बीग मुरियुवुदरल्लि निरतरागिद्दरु. अडगि कुळितिद्द ऒब्ब पॊलीस् महादेवन ऎदॆगॆ गुंडु हॊडॆद. महादेव रक्तद मडुविनल्लि बिद्दरु. अवर संगडिगरु गुंडु हॊडॆद पॊलीसनन्नु हॊडॆयलु होदरु. नम्मदु अहिंसात्मक होराट, पॊलीसरन्नु कॊल्लदिरि, हिंसॆ माडदिरि ऎंदु महादेव संगडिगरन्नु तडॆदरु. महादेवन उसिराट निंतितु. देशदॆल्लॆडॆ ई सुद्दि हरडितु. पत्नि सिद्धम्म गंडन बलिदानद त्यागवन्नु धैर्यवागि ऎदुरिसिदरु. महादेवरिगागि देश मरुगितु. ई मरुक हाडागि हरियितु.
poem-s2l1: भारत देशद बंध विमोचनॆगॆ भारी कष्टव सोसिदरु
poem-s2l2: तारुण्यवॆल्लव तुरंगदलि कळॆदु मडिद महाशूर मैलाररु
poem-s2l3: तुंटर तुंटनु, भंटर भंटनु, सात्विकरॊळगॆ सरदार!
poem-s2l4: दिट्टन हॆसरनु हुट्टिद कूसिगॆ इट्टरू तीरदु उपकार!
competency: 'कौशल: मातनाडुवुदु. सामर्थ्य: समारंभद कार्यक्रमगळन्नु निरूपणॆ माडुवुदु. आशय: स्वातंत्र्यक्कागि होराट माडिदवरन्नु स्वातंत्र्ययोधरु ऎंदु करॆयुत्तारॆ. ऒंदु उद्देशक्कागि तम्म बदुकन्ने मीसलागिट्ट इंथ योधरु भारतदल्लि हलवारु मंदि इद्दारॆ. देशवे मुख्य अदर मुंदॆ उळिदॆल्लवू गौण. देशद उळिविगागि ऎंथ त्यागक्कू सिद्धरागिद्दवरु ई हिरियरु. स्वार्थवन्नु मरॆतु देशद प्रगतियन्ने मुख्य गुरियागिरिसिकॊंडरु इंथ असंख्यात योधरन्नु नावु कृतज्ञतॆयिंद स्मरिसबेकु.'
