  text: ಆ ಯುವತಿ ಸಂತಸದಿಂದಲೇ ಇದೆಲ್ಲವನ್ನು ನುಡಿದಳು. ಆ ಯುವಕ ತಾನು ಚುಕ್ಕಿಯನ್ನ ಉಳಿಸಿದ ಕತೆ ಹೇಳಿದ. ಹುಲಿಗೂ ತನಗೂ ನಡೆದ ಹೋರಾಟದಲ್ಲಿ ತನಗಾದ ಗಾಯಗಳನ್ನು ತೋರಿಸಿದ. ಚುಕ್ಕಿಯು ಕಾಡಿನಲ್ಲಿ ಮದ್ದು ಮಾಡಿದ್ದನ್ನು ಹೇಳಿದ.
