  text: ಇದು ನಾವು ಸಾಕಿಕೊಂಡ ಜಿಂಕೆ.... ಇದರ ಮೇಲಿನ ಈ ಚುಕ್ಕೆಯ ಗುರುತಿಗೆ ಇದಕ್ಕೆ ನಾವು ಚುಕ್ಕಿ ಎಂದು ಕರೆದೆವು.... ಇದು ಕೆಲ ದಿನಗಳ ಹಿಂದೆ ಕಾಡಿಗೆ ಬಂದುಬಿಟ್ಟಿತು..... ಇದನ್ನ ಒಂದು ಹುಲಿ ಅಟ್ಟಿಸಿಕೊಂಡು ಬಂದುದನ್ನ ಕೆಲ ಹಳ್ಳಿ ಜನ ನೋಡಿದರು... ಚುಕ್ಕಿಯ ಕತೆ ಮುಗಿಯಿತು ಅಂತ ನಾವು ತಿಳಿದೆವು..... ಆದರೂ ನನಗೆ ಏನೋ ನಂಬಿಕೆ ..... ಚುಕ್ಕಿ ಬದುಕಿದೆ ಎಂದು.... ನಾನು ಆವತ್ತಿನಿಂದ ಅದನ್ನ ಹುಡುಕುತ್ತಿದ್ದೆ. ಇಂದು ಇದು ಸಿಕ್ಕಿದೆ....
