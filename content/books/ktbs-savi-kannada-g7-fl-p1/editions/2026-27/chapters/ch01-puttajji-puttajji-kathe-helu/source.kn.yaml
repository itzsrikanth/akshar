labels:
  intro: ಪ್ರವೇಶ
  story: ಕತೆ
  competency: ಕೌಶಲ / ಸಾಮರ್ಥ್ಯ / ಆಶಯ
  author: ಕೃತಿಕಾರರ ಪರಿಚಯ
  vocab: ಪದಗಳ ಅರ್ಥ
  exercise-A: ಅ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-B: ಆ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು-ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-C: ಇ. ಈ ವಾಕ್ಯಗಳನ್ನು ಯಾರು-ಯಾರಿಗೆ? ಹೇಳಿದರು ಎಂಬುದನ್ನು ಬರೆಯಿರಿ.
  exercise-D: ಈ. ಕೆಳಗೆ ನೀಡಿರುವ ಸೂಚನೆಯಂತೆ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-E: ಉ. ಕೆಳಗಿನ ಪದಗಳಿಗೆ ಅರ್ಥ ಬರೆಯಿರಿ.
  exercise-F: ಊ. ಹೊಂದಿಸಿ ಬರೆಯಿರಿ.
segments:
- id: intro-1
  type: prose
  section: intro
  text: ಬೆಳಗ್ಗೆ ಶಾಲೆಗೆ ಬಂದ ವಿದ್ಯಾರ್ಥಿನಿಯರು ಶಾಲಾ ಆವರಣದಲ್ಲಿ ಕುಳಿತು ಮಾತಿಗಿಳಿಯುತ್ತಾರೆ.
- id: story-d1
  type: dialogue
  section: intro
  speaker: ಮಾಲಾ
  text: ನಿನ್ನೆ ನಮ್ಮ ಮನೆಯ ಸಮೀಪದ ದೇವಸ್ಥಾನದಲ್ಲಿ ಪುರಾಣದ ಕತೆ ಹೇಳುವ ಕಾರ್ಯಕ್ರಮ ಇತ್ತು. ನಾನು ನಮ್ಮಮ್ಮ ಹೋಗಿದ್ದೆವು. ತುಂಬಾ ಚೆನ್ನಾಗಿತ್ತು.
- id: story-d2
  type: dialogue
  section: intro
  speaker: ರೇಖಾ
  text: ಪುರಾಣದ ಕತೆ ಹೇಳುವಾಗ ಮಧ್ಯೆ ಮಧ್ಯೆ ದೇವರನಾಮಗಳನ್ನು ಹಾಡುತ್ತಾರೆ. ನನಗದು ತುಂಬಾ ಇಷ್ಟ.
- id: story-d3
  type: dialogue
  section: intro
  speaker: ಮೇರಿ
  text: ರೇಖಾ.... ನನಗೆ ನೀತಿಕತೆಗಳು ಎಂದರೆ ಇಷ್ಟ. ನನ್ನ ಬಳಿ ಕೆಲವು ನೀತಿಕತೆಗಳ ಪುಸ್ತಕಗಳು ಇವೆ.
- id: story-d4
  type: dialogue
  section: intro
  speaker: ಫಾತಿಮಾ
  text: ಮಾಲಾ.... ಕೆಲವು ಕತೆಗಳನ್ನು ಹಾಡಿನ ರೂಪದಲ್ಲಿ ಹೇಳುತ್ತಾರಲ್ಲಾ....
- id: story-d5
  type: dialogue
  section: intro
  speaker: ಮಾಲಾ
  text: "ಹೌದು, ಇದನ್ನು ಕಥನ-ಕವನ ಎನ್ನುತ್ತಾರೆ."
- id: story-d6
  type: dialogue
  section: intro
  speaker: ರೇಖಾ
  text: ಕೆಲವು ಕಡೆಗಳಲ್ಲಿ ಜಾನಪದ ಹಾಡುಗಳ ರೂಪದಲ್ಲಿ ಕತೆ ಹೇಳುತ್ತಾರೆ. ಇವು ತುಂಬಾ ಚೆನ್ನಾಗಿರುತ್ತವೆ.
- id: story-d7
  type: dialogue
  section: intro
  speaker: ಮಾಲಾ
  text: "ನಾನು ಚಿಕ್ಕವಳಿರುವಾಗ ನಮ್ಮಜ್ಜ ನನಗೆ ರಾಮಾಯಣ, ಮಹಾಭಾರತದ ಕತೆ ಹೇಳುತ್ತಿದ್ದರು. ಬೇರೆ ಬೇರೆ ಕತೆ ಪುಸ್ತಕಗಳನ್ನೆಲ್ಲಾ ತಂದುಕೊಟ್ಟು ಓದಿಸುತ್ತಿದ್ದರು."
- id: story-d8
  type: dialogue
  section: intro
  speaker: ಫಾತಿಮಾ
  text: ನನಗಂತೂ ಕತೆಗಳೆಂದರೆ ತುಂಬಾ ಇಷ್ಟ.
- id: story-d9
  type: dialogue
  section: intro
  speaker: ಮೇರಿ
  text: ನನಗೂ ಅಷ್ಟೆ.
- id: intro-2
  type: prose
  section: intro
  text: ವಿದ್ಯಾರ್ಥಿನಿಯರು ಮಾತಾಡುತ್ತಿರುವಾಗ ಅಲ್ಲಿಗೆ ಬಂದ ತರಗತಿ ಶಿಕ್ಷಕಿಯ ಕಿವಿಗೆ ವಿದ್ಯಾರ್ಥಿನಿಯರ ಮಾತುಗಳು ಕೇಳಿದವು.
- id: story-d10
  type: dialogue
  section: intro
  speaker: ಶಿಕ್ಷಕಿ
  text: ನಿಮಗೆಲ್ಲಾ ಕತೆಗಳೆಂದರೆ ಅಷ್ಟೊಂದು ಇಷ್ಟವೇ? ಇವತ್ತಿನ ನಮ್ಮ ಪಾಠ ಕೂಡಾ ಸ್ವಾರಸ್ಯಕರವಾದ ಕತೆಯೇ; ಪುಟ್ಟಜ್ಜಿ ಹೇಳುವ ಕತೆ ಕೇಳುವ ಆಯ್ತೇ?
- id: intro-3
  type: prose
  section: intro
  text: ಇದನ್ನು ಕೇಳಿದ ಮಕ್ಕಳ ಮುಖ ಅರಳಿತು.
- id: story-n1
  type: prose
  section: story
  text: "ಪುಟ್ಟಜ್ಜಿ ಪುಟ್ಟಜ್ಜಿ ಕತೆ ಹೇಳು ಅಂದರೆ, ‘ಬಾ ಮಗ ಹೇಳ್ತೀನಿ ಒಳ್ಳೇದೊಂದು ಕತೆಯ’ ಅಂತಾಳೆ ಪುಟ್ಟಜ್ಜಿ. ಕತೆಹೇಳುವುದರಲ್ಲಿ ನಮ್ಮ ಪುಟ್ಟಜ್ಜಿ ಯಾವಾಗಲೂ ಫಷ್ಟು. ದೊಡ್ಡ ಕತೆ, ಸಣ್ಣ ಕತೆ, ಪುಟಾಣಿ ಕತೆ, ತಮಾಷೆ ಕತೆ, ಹಾಡ್ಗತೆ ಹೀಗೆ ತರಾವರಿ ಕತೆ ಹೇಳುತ್ತಾಳೆ ಪುಟ್ಟಜ್ಜಿ. ಮೊನ್ನೆ ನಾನು ಪುಟ್ಟಜ್ಜಿ ಮನೆ ಕಡೆ ಹೋಗಿದ್ದೆ."
- id: story-n2
  type: prose
  section: story
  text: ಪುಟ್ಟಜ್ಜಿ ಮನೆ ಜಗಲಿ ಮೇಲೆ ಕೂತಿದ್ದಳು. ಅವಳು ಸಂತಸದಿಂದ ಇದ್ದಾಳೆ ಅಂತ ಅವಳ ಮುಖವೇ ಹೇಳುತ್ತಿತ್ತು.
- id: story-d11
  type: dialogue
  section: story
  speaker: ಹುಡುಗ
  text: ಪುಟ್ಟಜ್ಜಿ ಪುಟ್ಟಜ್ಜಿ ಕತೆ ಹೇಳುತೀಯಾ?
- id: story-d12
  type: dialogue
  section: story
  speaker: ಪುಟ್ಟಜ್ಜಿ
  text: ಬಾ ಮಗ ಹೇಳ್ತೀನಿ ಒಳ್ಳೇದೊಂದು ಕತೆಯಾ
- id: story-n3
  type: prose
  section: story
  text: ಅವಳ ಮನೆ ಜಗಲಿ ಹತ್ತಿ ಕಂಬಕ್ಕೆ ಒರಗಿ ಕೂತು ಅವಳ ಮುಖ ನೋಡಿದೆ.
- id: story-d13
  type: dialogue
  section: story
  speaker: ಪುಟ್ಟಜ್ಜಿ
  text: ಯಾವ ಕತೆ ಹೇಳಲಿ?
- id: story-d14
  type: dialogue
  section: story
  speaker: ಹುಡುಗ
  text: ಯಾವುದಾದರೂ ಒಂದು ಹಾಡ್ಗತೆ ಹೇಳು
- id: story-n4
  type: prose
  section: story
  text: "ಪುಟ್ಟಜ್ಜಿ ಸ್ಪೆಷಾಲಿಟಿ ಅಂದರೆ ಹಾಡ್ಗತೆ. ಅದರಲ್ಲಿ ಹಾಡೂ ಇರುತ್ತೆ, ಕತೇನೂ ಇರುತ್ತೆ. ಪುಟ್ಟಜ್ಜಿ ಗಂಟಲು ಸರಿಪಡಿಸಿಕೊಂಡಳು. ಹಾಗೇ ತಣ್ಣನೆ ಗಾಳಿ ಬೀಸಿದ ಹಾಗೆ ಹೇಳಲಿಕ್ಕೆ ಪ್ರಾರಂಭ ಮಾಡಿದಳು."
- id: poem-s1l1
  type: poem_line
  section: story
  stanza: 1
  text: ಪುಟ್ಟದೊಂದು ಊರ ಹೊರಗೆ
- id: poem-s1l2
  type: poem_line
  section: story
  stanza: 1
  text: ಒಂದು ಹಳ್ಳ ಹರಿದಿದೆ
- id: poem-s1l3
  type: poem_line
  section: story
  stanza: 1
  text: ಹಳ್ಳ ಅಲ್ಲಿ ಹರಿದು ಹರಿದು
- id: poem-s1l4
  type: poem_line
  section: story
  stanza: 1
  text: ಊರ ಜನರ ಪೆರೆದಿದೆ
- id: poem-s1l5
  type: poem_line
  section: story
  stanza: 1
  text: ಹರಿವ ಹಳ್ಳ ಊರಿಗೊಂದು
- id: poem-s1l6
  type: poem_line
  section: story
  stanza: 1
  text: ಸೊಬಗ ತಂದು ಕೊಟ್ಟಿದೆ
- id: poem-s1l7
  type: poem_line
  section: story
  stanza: 1
  text: ಹಸಿರು ಕಾಡು ಮರಗಳಲ್ಲಿ
- id: poem-s1l8
  type: poem_line
  section: story
  stanza: 1
  text: ಹಕ್ಕಿ ಹಾಡು ಕೇಳಿದೆ
- id: story-n5
  type: prose
  section: story
  text: "ಇಂತಹ ಒಂದು ಸೊಗಸಾದ ಸ್ಥಳದಲ್ಲಿ ಒಂದು ಕಾಲದಲ್ಲಿ ಜನ ಇರಲಿಲ್ಲ. ಹಳ್ಳ ತನ್ನ ಪಾಡಿಗೆ ತಾನು ಹರಿದು ಹೋಗುತ್ತಾ ಇತ್ತು. ಹಕ್ಕಿಗಳು ಹಾಡಿಕೊಂಡಿದ್ದವು. ಒಂದು ದಿನ ಬಹಳ ದೂರದಿಂದ ಒಬ್ಬ ಯುವಕ ಅಲ್ಲಿಗೆ ಬಂದ. ಇಲ್ಲಿ ಇಷ್ಟೊಂದು ಚೆನ್ನಾಗಿದೆಯಲ್ಲ ಅಂತ ಅಲ್ಲಿ ಉಳಿಯೋ ಯೋಚನೆ ಮಾಡಿದ. ಒಂದು ಮನೆ ಕಟ್ಟಿದ. ಮನೆ ಮುಂದೆ ತೋಟ ಮಾಡಿದ. ತನಗೆ ಏನು ಬೇಕೋ ಅದನ್ನು ಬೆಳೆಸಿಕೊಂಡು ಅಲ್ಲಿ ಉಳಿದ. ಹಳ್ಳ, ಹಳ್ಳದ ದಡದಲ್ಲಿ ಇವನ ಮನೆ. ಮನೆಯ ಹಿಂದೆಯೇ ಭಾರೀ ಕಾಡು. ಅಲ್ಲಿ ಹುಲಿ, ಚಿರತೆ, ಕಾಡುಕೋಣ, ಆನೆ ಎಂದೆಲ್ಲ ಕಾಡುಪ್ರಾಣಿಗಳು. ಈ ಯುವಕನಿಗೆ ಯಾವುದೇ ಭೀತಿ ಇರಲಿಲ್ಲ. ಏಕೆಂದರೆ ಇವನು ಅವುಗಳ ಸುದ್ದಿಗೇ ಹೋಗುತ್ತಿರಲಿಲ್ಲ. ಅವೂ ಇವನ ಸುದ್ದಿಗೆ ಬರುತ್ತಿರಲಿಲ್ಲ. ಅವರವರ ಪಾಡಿಗೆ ಅವರೆಲ್ಲ ಸುಖವಾಗಿ ಇದ್ದರು. ಇವನ ಮನೆಯ ಹತ್ತಿರವೇ ಪ್ರಾಣಿಗಿಂಡಿ ಇದ್ದಿತು. ಅಲ್ಲಿಗೆ ಬಂದು ಪ್ರಾಣಿಗಳೆಲ್ಲ ನೀರು ಕುಡಿದು ಹೋಗುತ್ತಿದ್ದವು. ಒಂದು ದಿನ ಯುವಕ ಮನೆ ಜಗಲಿ ಮೇಲೆ ಕುಳಿತಿದ್ದಾನೆ. ಆಗ ಹೆದರಿ ಗಾಬರಿಯಾದ ಒಂದು ಜಿಂಕೆ ಅಂಗಳಕ್ಕೆ ಧಾವಿಸಿ ಬಂದಿತು. ಆ ಜಿಂಕೆಯ ಕುತ್ತಿಗೆಯಲ್ಲಿ ಒಂದು ಗೆಜ್ಜೆ ಬೇರೆ ಇತ್ತು. ಜಿಂಕೆಯ ಮೈ ನಡುಗುತ್ತಿತ್ತು. ಈ ಜಿಂಕೆ ಹೀಗೆ ಓಡಿ ಬರಲು ಒಂದು ಕಾರಣವಿತ್ತು."
- id: poem-s2l1
  type: poem_line
  section: story
  stanza: 2
  text: ಕಾಡಿನಲ್ಲಿ ಒಂದು ಹುಲಿ
- id: poem-s2l2
  type: poem_line
  section: story
  stanza: 2
  text: ಜಿಂಕೆಯನ್ನು ಕಂಡಿತು
- id: poem-s2l3
  type: poem_line
  section: story
  stanza: 2
  text: ಅದರ ಬೆನ್ನು ಹತ್ತಿ ಹುಲಿ
- id: poem-s2l4
  type: poem_line
  section: story
  stanza: 2
  text: ಹಳ್ಳದೆಡೆಗೆ ಬಂದಿತು
- id: poem-s2l5
  type: poem_line
  section: story
  stanza: 2
  text: ಪ್ರಾಣಭಯದಿ ಜಿಂಕೆ ಬಂದು
- id: poem-s2l6
  type: poem_line
  section: story
  stanza: 2
  text: ಮನೆಯನೊಂದ ಹೊಕ್ಕಿತು
- id: poem-s2l7
  type: poem_line
  section: story
  stanza: 2
  text: ನನ್ನ ಪ್ರಾಣ ಉಳಿಸು ಎಂದು
- id: poem-s2l8
  type: poem_line
  section: story
  stanza: 2
  text: ಮನೆಯೊಡೆಯನ ಕೇಳಿತು.
- id: story-n6
  type: prose
  section: story
  text: ಈ ಯುವಕನಿಗೆ ಜಿಂಕೆ ಹುಲಿಗೆ ಹೆದರಿ ಇಲ್ಲಿ ಬಂದಿದೆ ಅನ್ನುವುದು ತಿಳಿಯಿತು. ಅವನು ಎದ್ದು ಅದನ್ನ ಅಪ್ಪಿಕೊಂಡು ಅದಕ್ಕೆ ಸಾಂತ್ವನ ನೀಡಿದ. ಅದೇ ಸಮಯಕ್ಕೆ ಒಂದು ಹುಲಿ ಬಂದು ಯುವಕನ ಮನೆಯ ಮುಂದೆ ನಿಂತಿತು.
- id: story-d15
  type: dialogue
  section: story
  speaker: ಹುಲಿ
  text: "ಏಯ್! ಯುವಕ, ಈ ಜಿಂಕೆ ನನ್ನ ಆಹಾರ. ನೀನು ಇದಕ್ಕೆ ರಕ್ಷಣೆ ನೀಡಿದರೆ ಅದು ಅರಣ್ಯ ನಿಯಮಕ್ಕೆ ವಿರೋಧವಾಗುತ್ತದೆ. ಜಿಂಕೆಯನ್ನ ಬಿಟ್ಟುಕೊಡು"
- id: story-d16
  type: dialogue
  section: story
  speaker: ಯುವಕ
  text: "ನೋಡು, ಇದು ಅರಣ್ಯದ ಜಿಂಕೆಯಲ್ಲ. ಯಾರೋ ಸಾಕಿದ ಪ್ರಾಣಿ. ಇದರ ಕುತ್ತಿಗೆಯಲ್ಲಿ ಗೆಜ್ಜೆ ಇದೆ. ಅರಣ್ಯದ ಪ್ರಾಣಿಯನ್ನು ಕೊಂದು ತಿನ್ನಲು ನಿನಗೆ ಅಧಿಕಾರವಿದೆ. ಆದರೆ ಹೀಗೆ ಯಾರೋ ಸಾಕಿದ ಪ್ರಾಣಿಯನ್ನು ಕೊಲ್ಲಲು ನಿನಗೆ ಅಧಿಕಾರವಿಲ್ಲ. ನಾನು ಇದನ್ನ ಬಿಟ್ಟು ಕೊಡುವುದಿಲ್ಲ"
- id: story-n7
  type: prose
  section: story
  text: "ಈ ಮಾತು ಕೇಳಿ ಹುಲಿಗೆ ಸಿಟ್ಟು ಬಂದಿತು. ಆ ಸಿಟ್ಟಿನಲ್ಲಿ ಅದು ಅಬ್ಬರಿಸಿತು. ಯುವಕ ಜಿಂಕೆಗೆ ತನ್ನ ಮನೆಯೊಳಗೆ ಆಶ್ರಯ ನೀಡಿ ಹುಲಿಯನ್ನ ಎದುರಿಸಿದ. ತನ್ನಲ್ಲಿ ರಕ್ಷಣೆ ಬೇಡಿ ಬಂದವರನ್ನು ತಾನು ಬಿಟ್ಟುಕೊಡಲಾರೆ! ಎಂದ."
- id: story-n8
  type: prose
  section: story
  text: ಹುಲಿಗೂ ಆ ಯುವಕನಿಗೂ ಜಗಳವಾಯಿತು. ಹುಲಿ ಯುವಕನನ್ನು ಸಿಕ್ಕಲ್ಲಿ ಕಚ್ಚಿತು. ಗಾಯ ಮಾಡಿತು. ಕಷ್ಟಪಟ್ಟು ಬದುಕು ಸಾಗಿಸುತ್ತಿದ್ದ ಯುವಕ ಸೋಲಲಿಲ್ಲ. ಹುಲಿ ಕೊನೆಗೆ ಸೋತು ಪಲಾಯನ ಪಠಿಸಿತು. ಮತ್ತೆ ನಾನು ನಿನ್ನ ಸಹವಾಸಕ್ಕೆ ಬರುವುದಿಲ್ಲ ಅಂದಿತು ಹುಲಿ. ಅದಕ್ಕೂ ಹೊಡೆದು ಬಡಿದು ಗಾಯ ಮಾಡಿದ್ದ ಯುವಕ. ಜಿಂಕೆ ಯುವಕನ ಸ್ಥಿತಿಯನ್ನು ನೋಡಿತು. ಪಾಪ ಎಂದು ಮರುಗಿತು.
