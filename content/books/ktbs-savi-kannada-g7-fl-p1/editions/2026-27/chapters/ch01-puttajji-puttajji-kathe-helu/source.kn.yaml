- id: competency
  type: competency
  section: competency
  text: "ಕೌಶಲ: ಆಲಿಸುವುದು. ಸಾಮರ್ಥ್ಯ: ಅಪರಿಚಿತ ಸನ್ನಿವೇಶದ ಘಟನೆಗಳನ್ನು ಆಲಿಸಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು. ಆಶಯ: ಕತೆ ಹೇಳುವುದು ಎಂದಾಗ- ಅಜ್ಜಿಯ ನೆನಪಾಗುತ್ತದೆ. ಅನಾದಿಯಿಂದಲೂ ಸುತ್ತಲೂ ಮಕ್ಕಳನ್ನು ಕುಳ್ಳಿರಿಸಿಕೊಂಡು ಹಾವ-ಭಾವದಿಂದ ಕೂಡಿ, ಅಭಿನಯ ಸಹಿತ ಅಜ್ಜಿ ಹೇಳುವ ಕತೆಯ ಗಮ್ಮತ್ತೇ ಗಮ್ಮತ್ತು. ಹೊಟ್ಟೆ ಹುಣ್ಣಾಗುವಂತೆ ನಗುತ್ತಾ, ಕತೆಯ ಪಾತ್ರದ ದುಃಖ ಸನ್ನಿವೇಶಕ್ಕೆ ಕಣ್ಣೀರಿಡುತ್ತ, ಹೆದರಿಕೆಯಿಂದ ನಡುಗುತ್ತ ಕತೆ ಕೇಳುವುದೆಂದರೆ ಮಕ್ಕಳಿಗೆ ನಿದ್ದೆಯೂ ಬಾರದು; ಹಸಿವೆಯೂ ಕಾಣಿಸದು. ಇಂತಹ ಕತೆಗಳು ಮಕ್ಕಳ ಜೀವನದ ಮೇಲೆ ಪ್ರಭಾವ ಬೀರುವ ಸಾಧ್ಯತೆ ಹೆಚ್ಚಾಗಿದೆ. ಹಾಗಾಗಿ ಉದಾತ್ತ ಭಾವನೆಗಳನ್ನೊಳಗೊಂಡ, ಧೈರ್ಯ ಸಾಹಸ ಪ್ರಧಾನವಾದ, ನೀತಿ ಬೋಧನೆಯ ಕಥೆಗಳು ಬಳಕೆಗೆ ಬಂದಲ್ಲಿ ಮುಂದೆ ಉತ್ತಮ ಗುಣನಡತೆಯ ಜನಾಂಗವನ್ನು ನಿರೀಕ್ಷಿಸಲು ಸಾಧ್ಯ."
- id: author-1
  type: prose
  section: author
  text: "ಡಾ. ನಾರ್ಬಟ್ ಡಿಸೋಜರವರು 1937 ಜೂನ್ 6ರಂದು ಜನಿಸಿದರು. ತಂದೆ ಎಫ್.ಪಿ.ಡಿಸೋಜ ತಾಯಿ ರೂಪಿನಾ ಡಿಸೋಜ. ನಾ.ಡಿಸೋಜರವರು ಈವರೆಗೆ 37 ಕಾದಂಬರಿಗಳನ್ನು, ನಾಲ್ಕು ನಾಟಕಗಳನ್ನು, ಇಪ್ಪತ್ತೆಂಟು ಮಕ್ಕಳ ಕೃತಿಗಳನ್ನು ನೂರಾರು ಕತೆಗಳನ್ನು ಬರೆದಿದ್ದಾರೆ. ಇವರ ಕಾದಂಬರಿ ‘ಕಾಡಿನ ಬೆಂಕಿ’ ಹಾಗೂ ‘ದ್ವೀಪ’ ಚಲನಚಿತ್ರಗಳಾಗಿ ‘ರಜತಕಮಲ’ ಹಾಗೂ ‘ಸ್ವರ್ಣಕಮಲ’ ಪ್ರಶಸ್ತಿಗಳನ್ನು ಪಡೆದಿವೆ."
- id: author-2
  type: prose
  section: author
  text: "‘ಬಳುವಳಿ’ ಕಾದಂಬರಿ ಕೊಂಕಣಿಯಲ್ಲಿ ಚಲನಚಿತ್ರವಾಗಿದೆ. ‘ಸಾರ್ಕ್’ ದೇಶಗಳ ಸಾಹಿತಿಗಳ ಸಮ್ಮೇಳನದಲ್ಲಿ ಸ್ವಂತ ಕಥಾವಾಚನ ಮಾಡಿದ್ದರು. ಇವರ ‘ಮುಳುಗಡೆಯ ಊರಿಗೆ ಬಂದವರು’ ಕಿರು ಕಾದಂಬರಿಗೆ 2011ರ ಕೇಂದ್ರ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿಯ ಬಾಲ ಸಾಹಿತ್ಯ ಪುರಸ್ಕಾರ ದೊರೆತಿದೆ. ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿ, ಗುಲ್ವಾಡಿ ವೆಂಕಟರಾವ್ ಪ್ರಶಸ್ತಿ, ಕರ್ನಾಟಕ ರಾಜ್ಯೋತ್ಸವ ಪ್ರಶಸ್ತಿ, ಮಂಗಳೂರು ಸಂದೇಶ ಪ್ರಶಸ್ತಿ, ನವದೆಹಲಿ ಕಥಾ ಪ್ರಶಸ್ತಿ, ಪುತ್ತೂರು ನಿರಂಜನ ಸಾಹಿತ್ಯ ಪ್ರಶಸ್ತಿ ಮುಂತಾದವುಗಳಿಂದ ಪುರಸ್ಕೃತರಾಗಿದ್ದಾರೆ. ಜನವರಿ 2014ರಲ್ಲಿ ಮಡಿಕೇರಿಯಲ್ಲಿ ನಡೆದ ಅಖಿಲ ಭಾರತ ಕನ್ನಡ ಸಾಹಿತ್ಯ ಸಮ್ಮೇಳನದ ಅಧ್ಯಕ್ಷರಾಗಿದ್ದರು."
