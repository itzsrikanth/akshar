  section: story
  text: ಹೀಗೆ ಆ ಜಿಂಕೆಗೂ ಆ ಯುವಕನಿಗೂ ಏನೋ ಸಂಬಂಧಕೂಡಿ ಬಂದಿತು. ಆದರೂ ಜಿಂಕೆಯ ಮನಸ್ಸಿನಲ್ಲಿ ಏನೋ ಚಿಂತೆ ಇರುವುದನ್ನು ಯುವಕ ಗಮನಿಸಿದ. ಒಂದು ದಿನ ಯುವಕ ಏನೋ ಮಾಡುತ್ತ ಅಂಗಳದಲ್ಲಿ ಕುಳಿತಿದ್ದಾನೆ. ಅಷ್ಟು ದೂರದಲ್ಲಿ ಮಲಗಿದ್ದ ಜಿಂಕೆ ತಟ್ಟನೆ ಎದ್ದು ನಿಂತಿದೆ. ಹೊರಗೆ ಕಿವಿಗೊಟ್ಟು ಏನನ್ನೋ ಕೇಳುತ್ತಿದೆ. ಆಗ ಯುವಕನ ಮನೆಯ ಹತ್ತಿರವೇ ಒಂದು ಇಂಪಾದ ದನಿ ಕೇಳಿಸುತ್ತಿದೆ. ಜಿಂಕೆ ಮತ್ತೂ ಸಂಭ್ರಮದಿಂದ ಎದ್ದು ನಿಲ್ಲುತ್ತದೆ.
