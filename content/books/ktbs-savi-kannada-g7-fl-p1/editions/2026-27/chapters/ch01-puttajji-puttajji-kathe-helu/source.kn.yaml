  section: vocab
  text: "ಅಂಗಣ, ಮನೆಯ ಮುಂದಿನ ಅಥವಾ ಹಿಂದಿನ ಬಯಲು ಭಾಗ"
- id: vocab-santvana
  type: vocabulary_term
  section: vocab
  text: ಸಾಂತ್ವನ
- id: vocab-santvana-def
  type: vocabulary_definition
  section: vocab
  text: "ಸಮಾಧಾನ, ಸಂತೈಸುವಿಕೆಯ ನುಡಿ"
- id: vocab-ashraya
  type: vocabulary_term
  section: vocab
  text: ಆಶ್ರಯ
- id: vocab-ashraya-def
  type: vocabulary_definition
  section: vocab
  text: "ಆಸರೆ, ಸಹಾಯ, ರಕ್ಷಣೆ"
- id: vocab-maddu
  type: vocabulary_term
  section: vocab
  text: ಮದ್ದು
- id: vocab-maddu-def
  type: vocabulary_definition
  section: vocab
  text: ಔಷಧ
- id: vocab-palayana
  type: vocabulary_term
  section: vocab
  text: ಪಲಾಯನ ಪಠಿಸು
- id: vocab-palayana-def
  type: vocabulary_definition
  section: vocab
  text: ಓಡಿಹೋಗು
- id: vocab-magu
  type: vocabulary_term
  section: vocab
  text: ಮಾಗು
- id: vocab-magu-def
  type: vocabulary_definition
  section: vocab
  text: "ಒಣಗು, ವಾಸಿಯಾಗು"
- id: vocab-sambhrama
  type: vocabulary_term
  section: vocab
  text: ಸಂಭ್ರಮ
- id: vocab-sambhrama-def
  type: vocabulary_definition
  section: vocab
  text: "ಉತ್ಸಾಹ, ಸಡಗರ, ಸಂತೋಷ"
- id: vocab-bide
  type: vocabulary_term
  section: vocab
  text: ಬಿಡೆ
- id: vocab-bide-def
  type: vocabulary_definition
  section: vocab
  text: ಬಿಡುವುದಿಲ್ಲ
- id: vocab-yavattara
  type: vocabulary_term
  section: vocab
  text: ಯಾವತ್ತಾರ
- id: vocab-yavattara-def
  type: vocabulary_definition
  section: vocab
  text: "ಯಾವತ್ತಾದರೂ, ಇನ್ನೊಂದು ದಿನ"
- id: ex-a-q1
  type: question
  section: exercise-A
  exercise: A
  text: ಪುಟ್ಟಜ್ಜಿಯ ಬಳಿ ಹುಡುಗ ಯಾವ ಕತೆ ಹೇಳಬೇಕೆಂದು ಕೇಳಿದನು?
- id: ex-a-q2
  type: question
  section: exercise-A
  exercise: A
  text: ಯುವಕ ಮನೆಯ ಮುಂದೆ ಏನು ಮಾಡಿದನು?
- id: ex-a-q3
  type: question
  section: exercise-A
  exercise: A
  text: ಜಿಂಕೆಯ ಕುತ್ತಿಗೆಯಲ್ಲಿ ಏನಿತ್ತು?
- id: ex-a-q4
  type: question
  section: exercise-A
  exercise: A
  text: ಹುಲಿ ಸೋತು ಏನು ಮಾಡಿತು?
- id: ex-a-q5
  type: question
  section: exercise-A
  exercise: A
  text: ಯುವತಿ ಕರೆದುಕೊಂಡು ಹೋಗುತ್ತೇನೆ ಎಂದಾಗ ಚುಕ್ಕಿ ಏನು ಮಾಡಿತು?
- id: ex-a-q6
  type: question
  section: exercise-A
  exercise: A
  text: ಹಳ್ಳದ ದಂಡೆಯ ಮೇಲಿನ ಊರು ಏನಾಯಿತು?
- id: ex-b-q1
  type: question
  section: exercise-B
  exercise: B
  text: ಹಳ್ಳ ಹರಿದು ಊರ ಜನರಿಗೆ ಏನು ಮಾಡಿದೆ?
- id: ex-b-q2
  type: question
  section: exercise-B
  exercise: B
  text: ಯುವಕ ಹಳ್ಳದ ಬಳಿಗೆ ಬಂದು ಏನು ಮಾಡಿದನು?
- id: ex-b-q3
  type: question
  section: exercise-B
  exercise: B
  text: ಹುಲಿ ಮತ್ತು ಯುವಕನ ನಡುವೆ ನಡೆದ ಸಂಭಾಷಣೆ ಏನು?
- id: ex-b-q4
  type: question
  section: exercise-B
  exercise: B
  text: ಜಿಂಕೆಯನ್ನು ನೋಡಿದ ಯುವತಿ ಏನು ಮಾಡಿದಳು?
- id: ex-b-q5
  type: question
  section: exercise-B
  exercise: B
  text: ಯುವಕ ಚುಕ್ಕಿಯ ಬಗೆಗೆ ಯುವತಿಗೆ ಏನು ಹೇಳಿದನು?
- id: ex-c-q1
  type: question
  section: exercise-C
  exercise: C
  text: “ಯಾವುದಾದರೊಂದು ಹಾಡ್ಗತೆ ಹೇಳು.”
- id: ex-c-q2
  type: question
  section: exercise-C
  exercise: C
  text: "“ಏಯ್! ಯುವಕ, ಈ ಜಿಂಕೆ ನನ್ನ ಆಹಾರ.”"
- id: ex-c-q3
  type: question
  section: exercise-C
  exercise: C
  text: “ಇದು ನಾವು ಸಾಕಿಕೊಂಡ ಜಿಂಕೆ.”
- id: ex-c-q4
  type: question
  section: exercise-C
  exercise: C
  text: “ನಾನು ಚುಕ್ಕಿಯನ್ನು ಬಿಟ್ಟು ಇರಲಾರೆ.”
- id: ex-d-q1
  type: question
  section: exercise-D
  exercise: D
  text: ಈ ಪಾಠದಲ್ಲಿ ಬಂದಿರುವ ಪ್ರಾಣಿಗಳ ಹೆಸರನ್ನು ಪಟ್ಟಿಮಾಡಿ.
- id: ex-d-q2
  type: question
  section: exercise-D
  exercise: D
  text: ಈ ಪಾಠದಲ್ಲಿ ಬಂದಿರುವ ವ್ಯಕ್ತಿಗಳ ಹೆಸರನ್ನು ಪಟ್ಟಿಮಾಡಿ.
- id: ex-d-q3
  type: question
  section: exercise-D
  exercise: D
  text: ಅಜ್ಜಿ ಮತ್ತು ಕತೆ ಕೇಳುವ ಹುಡುಗನ ಸಂಭಾಷಣೆ ಬರೆಯಿರಿ.
- id: ex-d-q4
  type: question
  section: exercise-D
  exercise: D
  text: ಯುವಕ ಮತ್ತು ಯುವತಿಯ ನಡುವೆ ನಡೆದ ಸಂಭಾಷಣೆಯನ್ನು ಬರೆಯಿರಿ.
- id: ex-e-q1
  type: question
  section: exercise-E
  exercise: E
  text: "ಕೆಳಗಿನ ಪದಗಳಿಗೆ ಅರ್ಥ ಬರೆಯಿರಿ: ಪೆರೆ, ಪ್ರಾಣಿಗಿಂಡಿ, ಭಯ, ತೊಗಟೆ, ಮದ್ದು, ಯಾವತ್ತಾರ."
- id: ex-f-q1
  type: question
  section: exercise-F
  exercise: F
  text: "ಹೊಂದಿಸಿ ಬರೆಯಿರಿ: ಪುಟ್ಟಜ್ಜಿ / ಕತೆ; ಕಾಡು / ಹುಲಿ, ಚಿರತೆ, ಕಾಡುಕೋಣ; ಚುಕ್ಕಿ / ಜಿಂಕೆ; ಮದ್ದು / ಸೊಪ್ಪುಸದೆ, ಬೇರು, ತೊಗಟೆ; ಹಳ್ಳದ ದಂಡೆ / ಊರು ಬೆಳೆಯಿತು; ಜಗಳ / ಹುಲಿಗೂ ಯುವಕನಿಗೂ."
