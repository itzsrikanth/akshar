- id: story-n11
  type: prose
  section: story
  text: ಜಿಂಕೆ ಹೊರ ಓಡುತ್ತದೆ. ಯುವಕ ಗಾಬರಿಯಿಂದ ಅದರ ಹಿಂದೆ ಓಡುತ್ತಾನೆ. ಅಲ್ಲಿ ಓರ್ವ ಯುವತಿ ಜಿಂಕೆಯನ್ನು ತಬ್ಬಿ ಹಿಡಿದಿದ್ದಾಳೆ. ಜಿಂಕೆ ಅವಳ ಕೈ ನೆಕ್ಕುತ್ತಿದೆ. ಅವಳ ಮೈಗೆ ತನ್ನ ಮೈ ತಿಕ್ಕುತ್ತಿದೆ. ಆಕೆ ಜಿಂಕೆಯ ಮುಖಕ್ಕೆ ತನ್ನ ಮುಖ ತಾಗಿಸಿ ಅಳುತ್ತಿದ್ದಾಳೆ. ಆ ಯುವತಿ ಈ ಯುವಕನನ್ನು ನೋಡಿದ ಕೂಡಲೇ ತನ್ನ ಪರಿಚಯ ಹೇಳಿಕೊಂಡಳು.
