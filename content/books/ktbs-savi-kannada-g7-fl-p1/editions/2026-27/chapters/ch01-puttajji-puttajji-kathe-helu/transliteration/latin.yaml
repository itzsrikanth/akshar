ex-a-q1: puṭṭajjiya baḻi huḍuga yāva katè heḻabekèṃdu keḻidanu?
ex-a-q2: yuvaka manèya muṃdè enu māḍidanu?
ex-a-q3: jiṃkèya kuttigèyalli enittu?
ex-a-q4: huli sotu enu māḍitu?
ex-a-q5: yuvati karèdukòṃḍu hoguttenè èṃdāga cukki enu māḍitu?
ex-a-q6: haḻḻada daṃḍèya melina ūru enāyitu?
ex-b-q1: haḻḻa haridu ūra janarigè enu māḍidè?
ex-b-q2: yuvaka haḻḻada baḻigè baṃdu enu māḍidanu?
ex-b-q3: huli mattu yuvakana naḍuvè naḍèda saṃbhāṣaṇè enu?
ex-b-q4: jiṃkèyannu noḍida yuvati enu māḍidaḻu?
ex-b-q5: yuvaka cukkiya bagègè yuvatigè enu heḻidanu?
ex-c-q1: “yāvudādaròṃdu hāḍgatè heḻu.”
ex-c-q2: “ey! yuvaka, ī jiṃkè nanna āhāra.”
ex-c-q3: “idu nāvu sākikòṃḍa jiṃkè.”
ex-c-q4: “nānu cukkiyannu biṭṭu iralārè.”
ex-d-q1: ī pāṭhadalli baṃdiruva prāṇigaḻa hèsarannu paṭṭimāḍi.
ex-d-q2: ī pāṭhadalli baṃdiruva vyaktigaḻa hèsarannu paṭṭimāḍi.
ex-d-q3: ajji mattu katè keḻuva huḍugana saṃbhāṣaṇè barèyiri.
ex-d-q4: yuvaka mattu yuvatiya naḍuvè naḍèda saṃbhāṣaṇèyannu barèyiri.
ex-e-q1: 'kèḻagina padagaḻigè artha barèyiri: pèrè, prāṇigiṃḍi, bhaya, tògaṭè, maddu, yāvattāra.'
ex-f-q1: 'hòṃdisi barèyiri: puṭṭajji / katè; kāḍu / huli, ciratè, kāḍukoṇa; cukki / jiṃkè; maddu / sòppusadè, beru, tògaṭè; haḻḻada daṃḍè / ūru bèḻèyitu; jagaḻa / huligū yuvakanigū.'
