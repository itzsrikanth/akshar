intro-1: bèḻaggè śālègè baṃda vidyārthiniyaru śālā āvaraṇadalli kuḻitu mātigiḻiyuttārè.
story-d1: ninnè namma manèya samīpada devasthānadalli purāṇada katè heḻuva kāryakrama ittu. nānu nammamma hogiddèvu. tuṃbā cènnāgittu.
story-d2: purāṇada katè heḻuvāga madhyè madhyè devaranāmagaḻannu hāḍuttārè. nanagadu tuṃbā iṣṭa.
story-d3: rekhā.... nanagè nītikatègaḻu èṃdarè iṣṭa. nanna baḻi kèlavu nītikatègaḻa pustakagaḻu ivè.
story-d4: mālā.... kèlavu katègaḻannu hāḍina rūpadalli heḻuttārallā....
story-d5: haudu, idannu kathana-kavana ènnuttārè.
story-d6: kèlavu kaḍègaḻalli jānapada hāḍugaḻa rūpadalli katè heḻuttārè. ivu tuṃbā cènnāgiruttavè.
story-d7: nānu cikkavaḻiruvāga nammajja nanagè rāmāyaṇa, mahābhāratada katè heḻuttiddaru. berè berè katè pustakagaḻannèllā taṃdukòṭṭu odisuttiddaru.
story-d8: nanagaṃtū katègaḻèṃdarè tuṃbā iṣṭa.
story-d9: nanagū aṣṭè.
intro-2: vidyārthiniyaru mātāḍuttiruvāga alligè baṃda taragati śikṣakiya kivigè vidyārthiniyara mātugaḻu keḻidavu.
story-d10: nimagèllā katègaḻèṃdarè aṣṭòṃdu iṣṭave? ivattina namma pāṭha kūḍā svārasyakaravāda katèye; puṭṭajji heḻuva katè keḻuva āyte?
intro-3: idannu keḻida makkaḻa mukha araḻitu.
story-n1: puṭṭajji puṭṭajji katè heḻu aṃdarè, ‘bā maga heḻtīni òḻḻedòṃdu katèya’ aṃtāḻè puṭṭajji. katèheḻuvudaralli namma puṭṭajji yāvāgalū phaṣṭu. dòḍḍa katè, saṇṇa katè, puṭāṇi katè, tamāṣè katè, hāḍgatè hīgè tarāvari katè heḻuttāḻè puṭṭajji. mònnè nānu puṭṭajji manè kaḍè hogiddè.
story-n2: puṭṭajji manè jagali melè kūtiddaḻu. avaḻu saṃtasadiṃda iddāḻè aṃta avaḻa mukhave heḻuttittu.
story-d11: puṭṭajji puṭṭajji katè heḻutīyā?
story-d12: bā maga heḻtīni òḻḻedòṃdu katèyā
story-n3: avaḻa manè jagali hatti kaṃbakkè òragi kūtu avaḻa mukha noḍidè.
story-d13: yāva katè heḻali?
story-d14: yāvudādarū òṃdu hāḍgatè heḻu
story-n4: puṭṭajji spèṣāliṭi aṃdarè hāḍgatè. adaralli hāḍū iruttè, katenū iruttè. puṭṭajji gaṃṭalu saripaḍisikòṃḍaḻu. hāge taṇṇanè gāḻi bīsida hāgè heḻalikkè prāraṃbha māḍidaḻu.
poem-s1l1: puṭṭadòṃdu ūra hòragè
poem-s1l2: òṃdu haḻḻa harididè
poem-s1l3: haḻḻa alli haridu haridu
poem-s1l4: ūra janara pèrèdidè
poem-s1l5: hariva haḻḻa ūrigòṃdu
poem-s1l6: sòbaga taṃdu kòṭṭidè
poem-s1l7: hasiru kāḍu maragaḻalli
poem-s1l8: hakki hāḍu keḻidè
story-n5: iṃtaha òṃdu sògasāda sthaḻadalli òṃdu kāladalli jana iralilla. haḻḻa tanna pāḍigè tānu haridu hoguttā ittu. hakkigaḻu hāḍikòṃḍiddavu. òṃdu dina bahaḻa dūradiṃda òbba yuvaka alligè baṃda. illi iṣṭòṃdu cènnāgidèyalla aṃta alli uḻiyo yocanè māḍida. òṃdu manè kaṭṭida. manè muṃdè toṭa māḍida. tanagè enu beko adannu bèḻèsikòṃḍu alli uḻida. haḻḻa, haḻḻada daḍadalli ivana manè. manèya hiṃdèye bhārī kāḍu. alli huli, ciratè, kāḍukoṇa, ānè èṃdèlla kāḍuprāṇigaḻu. ī yuvakanigè yāvude bhīti iralilla. ekèṃdarè ivanu avugaḻa suddige hoguttiralilla. avū ivana suddigè baruttiralilla. avaravara pāḍigè avarèlla sukhavāgi iddaru. ivana manèya hattirave prāṇigiṃḍi idditu. alligè baṃdu prāṇigaḻèlla nīru kuḍidu hoguttiddavu. òṃdu dina yuvaka manè jagali melè kuḻitiddānè. āga hèdari gābariyāda òṃdu jiṃkè aṃgaḻakkè dhāvisi baṃditu. ā jiṃkèya kuttigèyalli òṃdu gèjjè berè ittu. jiṃkèya mai naḍuguttittu. ī jiṃkè hīgè oḍi baralu òṃdu kāraṇavittu.
poem-s2l1: kāḍinalli òṃdu huli
poem-s2l2: jiṃkèyannu kaṃḍitu
poem-s2l3: adara bènnu hatti huli
poem-s2l4: haḻḻadèḍègè baṃditu
poem-s2l5: prāṇabhayadi jiṃkè baṃdu
poem-s2l6: manèyanòṃda hòkkitu
poem-s2l7: nanna prāṇa uḻisu èṃdu
poem-s2l8: manèyòḍèyana keḻitu.
story-n6: ī yuvakanigè jiṃkè huligè hèdari illi baṃdidè annuvudu tiḻiyitu. avanu èddu adanna appikòṃḍu adakkè sāṃtvana nīḍida. ade samayakkè òṃdu huli baṃdu yuvakana manèya muṃdè niṃtitu.
story-d15: ey! yuvaka, ī jiṃkè nanna āhāra. nīnu idakkè rakṣaṇè nīḍidarè adu araṇya niyamakkè virodhavāguttadè. jiṃkèyanna biṭṭukòḍu
story-d16: noḍu, idu araṇyada jiṃkèyalla. yāro sākida prāṇi. idara kuttigèyalli gèjjè idè. araṇyada prāṇiyannu kòṃdu tinnalu ninagè adhikāravidè. ādarè hīgè yāro sākida prāṇiyannu kòllalu ninagè adhikāravilla. nānu idanna biṭṭu kòḍuvudilla
story-n7: ī mātu keḻi huligè siṭṭu baṃditu. ā siṭṭinalli adu abbarisitu. yuvaka jiṃkègè tanna manèyòḻagè āśraya nīḍi huliyanna èdurisida. tannalli rakṣaṇè beḍi baṃdavarannu tānu biṭṭukòḍalārè! èṃda.
story-n8: huligū ā yuvakanigū jagaḻavāyitu. huli yuvakanannu sikkalli kaccitu. gāya māḍitu. kaṣṭapaṭṭu baduku sāgisuttidda yuvaka solalilla. huli kònègè sotu palāyana paṭhisitu. mattè nānu ninna sahavāsakkè baruvudilla aṃditu huli. adakkū hòḍèdu baḍidu gāya māḍidda yuvaka. jiṃkè yuvakana sthitiyannu noḍitu. pāpa èṃdu marugitu.
story-d17: nannannu uḻisalu hogi ninagè hīgāyite!
story-n9: èṃdu kaṇṇīru surisitu. hāgèye kāḍigè hogi -
poem-s3l1: sòppu sadè beru tògaṭè
poem-s3l2: èllavanna taṃditu
poem-s3l3: arèdu kuṭṭi maddumāḍi
poem-s3l4: gāyagaḻigè haccitu
poem-s3l5: gāya māgi avanu mattè
poem-s3l6: èddu naḍèyatòḍagida
poem-s3l7: idannu kaṃḍu jiṃkègāytu
poem-s3l8: aparimita ānaṃda
story-n10: hīgè ā jiṃkègū ā yuvakanigū eno saṃbaṃdhakūḍi baṃditu. ādarū jiṃkèya manassinalli eno ciṃtè iruvudannu yuvaka gamanisida. òṃdu dina yuvaka eno māḍutta aṃgaḻadalli kuḻitiddānè. aṣṭu dūradalli malagidda jiṃkè taṭṭanè èddu niṃtidè. hòragè kivigòṭṭu enanno keḻuttidè. āga yuvakana manèya hattirave òṃdu iṃpāda dani keḻisuttidè. jiṃkè mattū saṃbhramadiṃda èddu nilluttadè.
story-d18: cukki èlliddiyā..... cukki èlliddiyā?
story-n11: jiṃkè hòra oḍuttadè. yuvaka gābariyiṃda adara hiṃdè oḍuttānè. alli orva yuvati jiṃkèyannu tabbi hiḍididdāḻè. jiṃkè avaḻa kai nèkkuttidè. avaḻa maigè tanna mai tikkuttidè. ākè jiṃkèya mukhakkè tanna mukha tāgisi aḻuttiddāḻè. ā yuvati ī yuvakanannu noḍida kūḍale tanna paricaya heḻikòṃḍaḻu.
story-d19: idu nāvu sākikòṃḍa jiṃkè.... idara melina ī cukkèya gurutigè idakkè nāvu cukki èṃdu karèdèvu.... idu kèla dinagaḻa hiṃdè kāḍigè baṃdubiṭṭitu..... idanna òṃdu huli aṭṭisikòṃḍu baṃdudanna kèla haḻḻi jana noḍidaru... cukkiya katè mugiyitu aṃta nāvu tiḻidèvu..... ādarū nanagè eno naṃbikè ..... cukki badukidè èṃdu.... nānu āvattiniṃda adanna huḍukuttiddè. iṃdu idu sikkidè....
story-n12: ā yuvati saṃtasadiṃdale idèllavannu nuḍidaḻu. ā yuvaka tānu cukkiyanna uḻisida katè heḻida. huligū tanagū naḍèda horāṭadalli tanagāda gāyagaḻannu torisida. cukkiyu kāḍinalli maddu māḍiddannu heḻida.
story-d20: cikkaṃdiniṃda cukki namma manèyalliye dòḍḍadāgidè. nānu cukkiyannu biṭṭu iralārè.... idanna manègè karèdòyyuttenè
story-n13: avaḻu hāgè heḻuvāga cukkigè viṣaya tiḻiduhoyitu. adu hogi ā yuvakana manèyòḻagè avitukòṃḍitu.
story-d21: nānū adanna biṭṭu iralārè ..... huli bāyiṃda adannu kāpāḍiddenè..... īga ninagè idanna kòḍalārè....
story-d22: hāgādarè nānū illiye iruttenè.. cukkiya jòtèyalli
story-n14: yuvati yuvakana manèyòḻagè hogi cukkiyanna appikòṃḍaḻu.
poem-s4l1: cukkiyèṃba jiṃkè pāpa
poem-s4l2: huliya kaṇgè bidditu
poem-s4l3: yuvakanòbba adanu uḻisi
poem-s4l4: manèyalirisi sākida
poem-s4l5: huḍukikòṃḍu baṃda huḍugi
poem-s4l6: adanu biḍè èṃdaḻu
poem-s4l7: huḍuga huḍugi òṃdāgalu
poem-s4l8: cukkiye muṃdāyitu
story-n15: hīgè haḻḻada daṃḍèya melina ūru bèḻèyitu. anaṃtara illi èlla sukhavāgiddaru. puṭṭajji katè mugisi èddaḻu.
story-d23: mattè yāvattāra bā. berè berè katè heḻatenè
story-n16: nānu saṃtasadiṃda alliṃda hòraṭè.
competency: 'kauśala: ālisuvudu. sāmarthya: aparicita sanniveśada ghaṭanègaḻannu ālisi arthamāḍikòḻḻuvudu. āśaya: katè heḻuvudu èṃdāga- ajjiya nènapāguttadè. anādiyiṃdalū suttalū makkaḻannu kuḻḻirisikòṃḍu hāva-bhāvadiṃda kūḍi, abhinaya sahita ajji heḻuva katèya gammatte gammattu. hòṭṭè huṇṇāguvaṃtè naguttā, katèya pātrada duḥkha sanniveśakkè kaṇṇīriḍutta, hèdarikèyiṃda naḍugutta katè keḻuvudèṃdarè makkaḻigè niddèyū bāradu; hasivèyū kāṇisadu. iṃtaha katègaḻu makkaḻa jīvanada melè prabhāva bīruva sādhyatè hèccāgidè. hāgāgi udātta bhāvanègaḻannòḻagòṃḍa, dhairya sāhasa pradhānavāda, nīti bodhanèya kathègaḻu baḻakègè baṃdalli muṃdè uttama guṇanaḍatèya janāṃgavannu nirīkṣisalu sādhya.'
author-1: ḍā. nārbaṭ ḍisojaravaru 1937 jūn 6raṃdu janisidaru. taṃdè èph.pi.ḍisoja tāyi rūpinā ḍisoja. nā.ḍisojaravaru īvarègè 37 kādaṃbarigaḻannu, nālku nāṭakagaḻannu, ippattèṃṭu makkaḻa kṛtigaḻannu nūrāru katègaḻannu barèdiddārè. ivara kādaṃbari ‘kāḍina bèṃki’ hāgū ‘dvīpa’ calanacitragaḻāgi ‘rajatakamala’ hāgū ‘svarṇakamala’ praśastigaḻannu paḍèdivè.
author-2: ‘baḻuvaḻi’ kādaṃbari kòṃkaṇiyalli calanacitravāgidè. ‘sārk’ deśagaḻa sāhitigaḻa sammeḻanadalli svaṃta kathāvācana māḍiddaru. ivara ‘muḻugaḍèya ūrigè baṃdavaru’ kiru kādaṃbarigè 2011ra keṃdra sāhitya akāḍèmiya bāla sāhitya puraskāra dòrètidè. karnāṭaka sāhitya akāḍèmi praśasti, gulvāḍi vèṃkaṭarāv praśasti, karnāṭaka rājyotsava praśasti, maṃgaḻūru saṃdeśa praśasti, navadèhali kathā praśasti, puttūru niraṃjana sāhitya praśasti muṃtādavugaḻiṃda puraskṛtarāgiddārè. janavari 2014ralli maḍikeriyalli naḍèda akhila bhārata kannaḍa sāhitya sammeḻanada adhyakṣarāgiddaru.
