poem-s3l4: गायगळिगॆ हच्चितु
poem-s3l5: गाय मागि अवनु मत्तॆ
poem-s3l6: ऎद्दु नडॆयतॊडगिद
poem-s3l7: इदन्नु कंडु जिंकॆगाय्तु
poem-s3l8: अपरिमित आनंद
story-n10: हीगॆ आ जिंकॆगू आ युवकनिगू एनो संबंधकूडि बंदितु. आदरू जिंकॆय मनस्सिनल्लि एनो चिंतॆ इरुवुदन्नु युवक गमनिसिद. ऒंदु दिन युवक एनो माडुत्त अंगळदल्लि कुळितिद्दानॆ. अष्टु दूरदल्लि मलगिद्द जिंकॆ तट्टनॆ ऎद्दु निंतिदॆ. हॊरगॆ किविगॊट्टु एनन्नो केळुत्तिदॆ. आग युवकन मनॆय हत्तिरवे ऒंदु इंपाद दनि केळिसुत्तिदॆ. जिंकॆ मत्तू संभ्रमदिंद ऎद्दु निल्लुत्तदॆ.
story-d18: चुक्कि ऎल्लिद्दिया..... चुक्कि ऎल्लिद्दिया?
story-n11: जिंकॆ हॊर ओडुत्तदॆ. युवक गाबरियिंद अदर हिंदॆ ओडुत्तानॆ. अल्लि ओर्व युवति जिंकॆयन्नु तब्बि हिडिदिद्दाळॆ. जिंकॆ अवळ कै नॆक्कुत्तिदॆ. अवळ मैगॆ तन्न मै तिक्कुत्तिदॆ. आकॆ जिंकॆय मुखक्कॆ तन्न मुख तागिसि अळुत्तिद्दाळॆ. आ युवति ई युवकनन्नु नोडिद कूडले तन्न परिचय हेळिकॊंडळु.
story-d19: इदु नावु साकिकॊंड जिंकॆ.... इदर मेलिन ई चुक्कॆय गुरुतिगॆ इदक्कॆ नावु चुक्कि ऎंदु करॆदॆवु.... इदु कॆल दिनगळ हिंदॆ काडिगॆ बंदुबिट्टितु..... इदन्न ऒंदु हुलि अट्टिसिकॊंडु बंदुदन्न कॆल हळ्ळि जन नोडिदरु... चुक्किय कतॆ मुगियितु अंत नावु तिळिदॆवु..... आदरू ननगॆ एनो नंबिकॆ ..... चुक्कि बदुकिदॆ ऎंदु.... नानु आवत्तिनिंद अदन्न हुडुकुत्तिद्दॆ. इंदु इदु सिक्किदॆ....
story-n12: आ युवति संतसदिंदले इदॆल्लवन्नु नुडिदळु. आ युवक तानु चुक्कियन्न उळिसिद कतॆ हेळिद. हुलिगू तनगू नडॆद होराटदल्लि तनगाद गायगळन्नु तोरिसिद. चुक्कियु काडिनल्लि मद्दु माडिद्दन्नु हेळिद.
story-d20: चिक्कंदिनिंद चुक्कि नम्म मनॆयल्लिये दॊड्डदागिदॆ. नानु चुक्कियन्नु बिट्टु इरलारॆ.... इदन्न मनॆगॆ करॆदॊय्युत्तेनॆ
story-n13: अवळु हागॆ हेळुवाग चुक्किगॆ विषय तिळिदुहोयितु. अदु होगि आ युवकन मनॆयॊळगॆ अवितुकॊंडितु.
story-d21: नानू अदन्न बिट्टु इरलारॆ ..... हुलि बायिंद अदन्नु कापाडिद्देनॆ..... ईग निनगॆ इदन्न कॊडलारॆ....
story-d22: हागादरॆ नानू इल्लिये इरुत्तेनॆ.. चुक्किय जॊतॆयल्लि
story-n14: युवति युवकन मनॆयॊळगॆ होगि चुक्कियन्न अप्पिकॊंडळु.
