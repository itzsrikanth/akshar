intro-1: बॆळग्गॆ शालॆगॆ बंद विद्यार्थिनियरु शाला आवरणदल्लि कुळितु मातिगिळियुत्तारॆ.
story-d1: निन्नॆ नम्म मनॆय समीपद देवस्थानदल्लि पुराणद कतॆ हेळुव कार्यक्रम इत्तु. नानु नम्मम्म होगिद्दॆवु. तुंबा चॆन्नागित्तु.
story-d2: पुराणद कतॆ हेळुवाग मध्यॆ मध्यॆ देवरनामगळन्नु हाडुत्तारॆ. ननगदु तुंबा इष्ट.
story-d3: रेखा.... ननगॆ नीतिकतॆगळु ऎंदरॆ इष्ट. नन्न बळि कॆलवु नीतिकतॆगळ पुस्तकगळु इवॆ.
story-d4: माला.... कॆलवु कतॆगळन्नु हाडिन रूपदल्लि हेळुत्तारल्ला....
story-d5: हौदु, इदन्नु कथन-कवन ऎन्नुत्तारॆ.
story-d6: कॆलवु कडॆगळल्लि जानपद हाडुगळ रूपदल्लि कतॆ हेळुत्तारॆ. इवु तुंबा चॆन्नागिरुत्तवॆ.
story-d7: नानु चिक्कवळिरुवाग नम्मज्ज ननगॆ रामायण, महाभारतद कतॆ हेळुत्तिद्दरु. बेरॆ बेरॆ कतॆ पुस्तकगळन्नॆल्ला तंदुकॊट्टु ओदिसुत्तिद्दरु.
story-d8: ननगंतू कतॆगळॆंदरॆ तुंबा इष्ट.
story-d9: ननगू अष्टॆ.
intro-2: विद्यार्थिनियरु माताडुत्तिरुवाग अल्लिगॆ बंद तरगति शिक्षकिय किविगॆ विद्यार्थिनियर मातुगळु केळिदवु.
story-d10: निमगॆल्ला कतॆगळॆंदरॆ अष्टॊंदु इष्टवे? इवत्तिन नम्म पाठ कूडा स्वारस्यकरवाद कतॆये; पुट्टज्जि हेळुव कतॆ केळुव आय्ते?
intro-3: इदन्नु केळिद मक्कळ मुख अरळितु.
story-n1: पुट्टज्जि पुट्टज्जि कतॆ हेळु अंदरॆ, ‘बा मग हेळ्तीनि ऒळ्ळेदॊंदु कतॆय’ अंताळॆ पुट्टज्जि. कतॆहेळुवुदरल्लि नम्म पुट्टज्जि यावागलू फष्टु. दॊड्ड कतॆ, सण्ण कतॆ, पुटाणि कतॆ, तमाषॆ कतॆ, हाड्गतॆ हीगॆ तरावरि कतॆ हेळुत्ताळॆ पुट्टज्जि. मॊन्नॆ नानु पुट्टज्जि मनॆ कडॆ होगिद्दॆ.
story-n2: पुट्टज्जि मनॆ जगलि मेलॆ कूतिद्दळु. अवळु संतसदिंद इद्दाळॆ अंत अवळ मुखवे हेळुत्तित्तु.
story-d11: पुट्टज्जि पुट्टज्जि कतॆ हेळुतीया?
story-d12: बा मग हेळ्तीनि ऒळ्ळेदॊंदु कतॆया
story-n3: अवळ मनॆ जगलि हत्ति कंबक्कॆ ऒरगि कूतु अवळ मुख नोडिदॆ.
story-d13: याव कतॆ हेळलि?
story-d14: यावुदादरू ऒंदु हाड्गतॆ हेळु
story-n4: पुट्टज्जि स्पॆषालिटि अंदरॆ हाड्गतॆ. अदरल्लि हाडू इरुत्तॆ, कतेनू इरुत्तॆ. पुट्टज्जि गंटलु सरिपडिसिकॊंडळु. हागे तण्णनॆ गाळि बीसिद हागॆ हेळलिक्कॆ प्रारंभ माडिदळु.
poem-s1l1: पुट्टदॊंदु ऊर हॊरगॆ
poem-s1l2: ऒंदु हळ्ळ हरिदिदॆ
poem-s1l3: हळ्ळ अल्लि हरिदु हरिदु
poem-s1l4: ऊर जनर पॆरॆदिदॆ
