ex-a-q1: पुट्टज्जिय बळि हुडुग याव कतॆ हेळबेकॆंदु केळिदनु?
ex-a-q2: युवक मनॆय मुंदॆ एनु माडिदनु?
ex-a-q3: जिंकॆय कुत्तिगॆयल्लि एनित्तु?
ex-a-q4: हुलि सोतु एनु माडितु?
ex-a-q5: युवति करॆदुकॊंडु होगुत्तेनॆ ऎंदाग चुक्कि एनु माडितु?
ex-a-q6: हळ्ळद दंडॆय मेलिन ऊरु एनायितु?
ex-b-q1: हळ्ळ हरिदु ऊर जनरिगॆ एनु माडिदॆ?
ex-b-q2: युवक हळ्ळद बळिगॆ बंदु एनु माडिदनु?
ex-b-q3: हुलि मत्तु युवकन नडुवॆ नडॆद संभाषणॆ एनु?
ex-b-q4: जिंकॆयन्नु नोडिद युवति एनु माडिदळु?
ex-b-q5: युवक चुक्किय बगॆगॆ युवतिगॆ एनु हेळिदनु?
ex-c-q1: “यावुदादरॊंदु हाड्गतॆ हेळु.”
ex-c-q2: “एय्! युवक, ई जिंकॆ नन्न आहार.”
ex-c-q3: “इदु नावु साकिकॊंड जिंकॆ.”
ex-c-q4: “नानु चुक्कियन्नु बिट्टु इरलारॆ.”
ex-d-q1: ई पाठदल्लि बंदिरुव प्राणिगळ हॆसरन्नु पट्टिमाडि.
ex-d-q2: ई पाठदल्लि बंदिरुव व्यक्तिगळ हॆसरन्नु पट्टिमाडि.
ex-d-q3: अज्जि मत्तु कतॆ केळुव हुडुगन संभाषणॆ बरॆयिरि.
ex-d-q4: युवक मत्तु युवतिय नडुवॆ नडॆद संभाषणॆयन्नु बरॆयिरि.
ex-e-q1: 'कॆळगिन पदगळिगॆ अर्थ बरॆयिरि: पॆरॆ, प्राणिगिंडि, भय, तॊगटॆ, मद्दु, यावत्तार.'
ex-f-q1: 'हॊंदिसि बरॆयिरि: पुट्टज्जि / कतॆ; काडु / हुलि, चिरतॆ, काडुकोण; चुक्कि / जिंकॆ; मद्दु / सॊप्पुसदॆ, बेरु, तॊगटॆ; हळ्ळद दंडॆ / ऊरु बॆळॆयितु; जगळ / हुलिगू युवकनिगू.'
