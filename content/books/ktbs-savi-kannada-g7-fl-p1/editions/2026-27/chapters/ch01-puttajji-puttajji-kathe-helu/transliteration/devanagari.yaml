poem-s1l7: हसिरु काडु मरगळल्लि
poem-s1l8: हक्कि हाडु केळिदॆ
story-n5: इंतह ऒंदु सॊगसाद स्थळदल्लि ऒंदु कालदल्लि जन इरलिल्ल. हळ्ळ तन्न पाडिगॆ तानु हरिदु होगुत्ता इत्तु. हक्किगळु हाडिकॊंडिद्दवु. ऒंदु दिन बहळ दूरदिंद ऒब्ब युवक अल्लिगॆ बंद. इल्लि इष्टॊंदु चॆन्नागिदॆयल्ल अंत अल्लि उळियो योचनॆ माडिद. ऒंदु मनॆ कट्टिद. मनॆ मुंदॆ तोट माडिद. तनगॆ एनु बेको अदन्नु बॆळॆसिकॊंडु अल्लि उळिद. हळ्ळ, हळ्ळद दडदल्लि इवन मनॆ. मनॆय हिंदॆये भारी काडु. अल्लि हुलि, चिरतॆ, काडुकोण, आनॆ ऎंदॆल्ल काडुप्राणिगळु. ई युवकनिगॆ यावुदे भीति इरलिल्ल. एकॆंदरॆ इवनु अवुगळ सुद्दिगे होगुत्तिरलिल्ल. अवू इवन सुद्दिगॆ बरुत्तिरलिल्ल. अवरवर पाडिगॆ अवरॆल्ल सुखवागि इद्दरु. इवन मनॆय हत्तिरवे प्राणिगिंडि इद्दितु. अल्लिगॆ बंदु प्राणिगळॆल्ल नीरु कुडिदु होगुत्तिद्दवु. ऒंदु दिन युवक मनॆ जगलि मेलॆ कुळितिद्दानॆ. आग हॆदरि गाबरियाद ऒंदु जिंकॆ अंगळक्कॆ धाविसि बंदितु. आ जिंकॆय कुत्तिगॆयल्लि ऒंदु गॆज्जॆ बेरॆ इत्तु. जिंकॆय मै नडुगुत्तित्तु. ई जिंकॆ हीगॆ ओडि बरलु ऒंदु कारणवित्तु.
poem-s2l1: काडिनल्लि ऒंदु हुलि
poem-s2l2: जिंकॆयन्नु कंडितु
poem-s2l3: अदर बॆन्नु हत्ति हुलि
poem-s2l4: हळ्ळदॆडॆगॆ बंदितु
poem-s2l5: प्राणभयदि जिंकॆ बंदु
poem-s2l6: मनॆयनॊंद हॊक्कितु
