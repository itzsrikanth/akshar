story-n15: हीगॆ हळ्ळद दंडॆय मेलिन ऊरु बॆळॆयितु. अनंतर इल्लि ऎल्ल सुखवागिद्दरु. पुट्टज्जि कतॆ मुगिसि ऎद्दळु.
story-d23: मत्तॆ यावत्तार बा. बेरॆ बेरॆ कतॆ हेळतेनॆ
story-n16: नानु संतसदिंद अल्लिंद हॊरटॆ.
competency: 'कौशल: आलिसुवुदु. सामर्थ्य: अपरिचित सन्निवेशद घटनॆगळन्नु आलिसि अर्थमाडिकॊळ्ळुवुदु. आशय: कतॆ हेळुवुदु ऎंदाग- अज्जिय नॆनपागुत्तदॆ. अनादियिंदलू सुत्तलू मक्कळन्नु कुळ्ळिरिसिकॊंडु हाव-भावदिंद कूडि, अभिनय सहित अज्जि हेळुव कतॆय गम्मत्ते गम्मत्तु. हॊट्टॆ हुण्णागुवंतॆ नगुत्ता, कतॆय पात्रद दुःख सन्निवेशक्कॆ कण्णीरिडुत्त, हॆदरिकॆयिंद नडुगुत्त कतॆ केळुवुदॆंदरॆ मक्कळिगॆ निद्दॆयू बारदु; हसिवॆयू काणिसदु. इंतह कतॆगळु मक्कळ जीवनद मेलॆ प्रभाव बीरुव साध्यतॆ हॆच्चागिदॆ. हागागि उदात्त भावनॆगळन्नॊळगॊंड, धैर्य साहस प्रधानवाद, नीति बोधनॆय कथॆगळु बळकॆगॆ बंदल्लि मुंदॆ उत्तम गुणनडतॆय जनांगवन्नु निरीक्षिसलु साध्य.'
author-1: डा. नार्बट् डिसोजरवरु 1937 जून् 6रंदु जनिसिदरु. तंदॆ ऎफ्.पि.डिसोज तायि रूपिना डिसोज. ना.डिसोजरवरु ईवरॆगॆ 37 कादंबरिगळन्नु, नाल्कु नाटकगळन्नु, इप्पत्तॆंटु मक्कळ कृतिगळन्नु नूरारु कतॆगळन्नु बरॆदिद्दारॆ. इवर कादंबरि ‘काडिन बॆंकि’ हागू ‘द्वीप’ चलनचित्रगळागि ‘रजतकमल’ हागू ‘स्वर्णकमल’ प्रशस्तिगळन्नु पडॆदिवॆ.
author-2: ‘बळुवळि’ कादंबरि कॊंकणियल्लि चलनचित्रवागिदॆ. ‘सार्क्’ देशगळ साहितिगळ सम्मेळनदल्लि स्वंत कथावाचन माडिद्दरु. इवर ‘मुळुगडॆय ऊरिगॆ बंदवरु’ किरु कादंबरिगॆ 2011र केंद्र साहित्य अकाडॆमिय बाल साहित्य पुरस्कार दॊरॆतिदॆ. कर्नाटक साहित्य अकाडॆमि प्रशस्ति, गुल्वाडि वॆंकटराव् प्रशस्ति, कर्नाटक राज्योत्सव प्रशस्ति, मंगळूरु संदेश प्रशस्ति, नवदॆहलि कथा प्रशस्ति, पुत्तूरु निरंजन साहित्य प्रशस्ति मुंतादवुगळिंद पुरस्कृतरागिद्दारॆ. जनवरि 2014रल्लि मडिकेरियल्लि नडॆद अखिल भारत कन्नड साहित्य सम्मेळनद अध्यक्षरागिद्दरु.
