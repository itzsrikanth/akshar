poem-s2l8: मनॆयॊडॆयन केळितु.
story-n6: ई युवकनिगॆ जिंकॆ हुलिगॆ हॆदरि इल्लि बंदिदॆ अन्नुवुदु तिळियितु. अवनु ऎद्दु अदन्न अप्पिकॊंडु अदक्कॆ सांत्वन नीडिद. अदे समयक्कॆ ऒंदु हुलि बंदु युवकन मनॆय मुंदॆ निंतितु.
story-d15: एय्! युवक, ई जिंकॆ नन्न आहार. नीनु इदक्कॆ रक्षणॆ नीडिदरॆ अदु अरण्य नियमक्कॆ विरोधवागुत्तदॆ. जिंकॆयन्न बिट्टुकॊडु
story-d16: नोडु, इदु अरण्यद जिंकॆयल्ल. यारो साकिद प्राणि. इदर कुत्तिगॆयल्लि गॆज्जॆ इदॆ. अरण्यद प्राणियन्नु कॊंदु तिन्नलु निनगॆ अधिकारविदॆ. आदरॆ हीगॆ यारो साकिद प्राणियन्नु कॊल्ललु निनगॆ अधिकारविल्ल. नानु इदन्न बिट्टु कॊडुवुदिल्ल
story-n7: ई मातु केळि हुलिगॆ सिट्टु बंदितु. आ सिट्टिनल्लि अदु अब्बरिसितु. युवक जिंकॆगॆ तन्न मनॆयॊळगॆ आश्रय नीडि हुलियन्न ऎदुरिसिद. तन्नल्लि रक्षणॆ बेडि बंदवरन्नु तानु बिट्टुकॊडलारॆ! ऎंद.
story-n8: हुलिगू आ युवकनिगू जगळवायितु. हुलि युवकनन्नु सिक्कल्लि कच्चितु. गाय माडितु. कष्टपट्टु बदुकु सागिसुत्तिद्द युवक सोललिल्ल. हुलि कॊनॆगॆ सोतु पलायन पठिसितु. मत्तॆ नानु निन्न सहवासक्कॆ बरुवुदिल्ल अंदितु हुलि. अदक्कू हॊडॆदु बडिदु गाय माडिद्द युवक. जिंकॆ युवकन स्थितियन्नु नोडितु. पाप ऎंदु मरुगितु.
story-d17: नन्नन्नु उळिसलु होगि निनगॆ हीगायिते!
story-n9: ऎंदु कण्णीरु सुरिसितु. हागॆये काडिगॆ होगि -
