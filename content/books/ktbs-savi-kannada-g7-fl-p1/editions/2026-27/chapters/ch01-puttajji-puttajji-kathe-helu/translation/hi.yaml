intro-1: 'सुबह स्कूल आई छात्राएँ स्कूल प्रांगण में बैठकर बात करने लगती हैं।'

story-d1: 'कल हमारे घर के पास मंदिर में पुराण की कथा सुनाने का कार्यक्रम था। मैं और मेरी अम्मा गई थीं। बहुत अच्छा था।'

story-d2: 'पुराण की कथा सुनाते समय बीच-बीच में भगवान के नाम गाते हैं। मुझे वह बहुत पसंद है।'

story-d3: 'रेखा.... मुझे नीति-कथाएँ पसंद हैं। मेरे पास कुछ नीति-कथाओं की पुस्तकें हैं।'

story-d4: 'माला.... कुछ कथाएँ गीत के रूप में सुनाई जाती हैं ना....'

story-d5: 'हाँ, इसे कथन-कवन कहते हैं।'

story-d6: 'कुछ जगहों पर लोकगीतों के रूप में कथा सुनाई जाती है। ये बहुत अच्छी होती हैं।'

story-d7: 'जब मैं छोटी थी तो हमारे अज्ज मुझे रामायण, महाभारत की कथाएँ सुनाते थे। अलग-अलग कथा पुस्तकें लाकर पढ़ाते थे।'

story-d8: 'मुझे तो कथाएँ बहुत पसंद हैं।'

story-d9: 'मुझे भी वैसा ही।'

intro-2: 'छात्राएँ बात कर रही थीं तब वहाँ आई कक्षा शिक्षिका के कान में छात्राओं की बातें पड़ीं।'

story-d10: 'तुम सबको कथाएँ इतनी पसंद हैं? आज का हमारा पाठ भी एक रोचक कथा ही है; पुट्टज्जि की कथा सुनने को तैयार हो?'

intro-3: 'यह सुनकर बच्चों के चेहरे खिल उठे।'

story-n1: 'पुट्टज्जि पुट्टज्जि कथा सुनाओ कहने पर पुट्टज्जि कहती है, ‘आओ बेटा, एक अच्छी कथा सुनाती हूँ।’ कथा सुनाने में हमारी पुट्टज्जि हमेशा प्रथम। बड़ी कथा, छोटी कथा, नन्ही कथा, मज़ेदार कथा, गीत-कथा—ऐसे तरह-तरह की कथाएँ सुनाती हैं पुट्टज्जि। परसों मैं पुट्टज्जि के घर की ओर गया था।'

story-n2: 'पुट्टज्जि घर की जगली पर बैठी थीं। उनके चेहरे से ही पता चल रहा था कि वे खुश हैं।'

story-d11: 'पुट्टज्जि पुट्टज्जि, कथा सुनाओगी?'

story-d12: 'आओ बेटा, एक अच्छी कथा सुनाती हूँ।'

story-n3: 'उनके घर की जगली पर चढ़कर खंभे से टेक लगा बैठा और उनका मुँह देखा।'

story-d13: 'कौन-सी कथा सुनाऊँ?'

story-d14: 'कोई भी गीत-कथा सुनाओ।'

story-n4: 'पुट्टज्जि की विशेषता यानी गीत-कथा। उसमें गीत भी होता है, कथा भी। पुट्टज्जि ने गला साफ़ किया। फिर ठंडी हवा बहने जैसी सहजता से सुनाना शुरू किया।'

poem-s1l1: 'एक छोटे गाँव के बाहर'

poem-s1l2: 'एक नाला बह रहा है'

poem-s2l1: 'जंगल में एक बाघ'

poem-s2l2: 'हिरन को देखा'

poem-s4l8: 'चुक्कि ही आगे आई'

competency: 'कौशल: सुनना। सामर्थ्य: अपरिचित परिस्थिति की घटनाएँ सुनकर समझना। आशय: कथा सुनाना कहने पर अज्जि याद आती है। अनादि काल से बच्चों को बैठाकर हाव-भाव और अभिनय सहित अज्जि की कथा का मज़ा ही निराला है। ऐसी कथाएँ बच्चों के जीवन पर प्रभाव डालने की संभावना अधिक रखती हैं।'

author-1: 'डॉ. नॉर्बर्ट डिसोज़ा 6 जून 1937 को जन्म हुए। पिता एफ.पी. डिसोज़ा, माता रूपिना डिसोज़ा। ना. डिसोज़ा अब तक 37 उपन्यास, चार नाटक, अट्ठाईस बाल कृतियाँ और सैकड़ों कथाएँ लिख चुके हैं।'

author-2: '‘बळुवळि’ उपन्यास कोंकणी में फ़िल्म बना। उनके लघु उपन्यास ‘मुळुगडेय ऊरिगे बंदवरु’ को 2011 का केन्द्रीय साहित्य अकादमी बाल साहित्य पुरस्कार मिला। जनवरी 2014 में मडिकेरी में हुए अखिल भारत कन्नड़ साहित्य सम्मेलन के अध्यक्ष रहे।'

