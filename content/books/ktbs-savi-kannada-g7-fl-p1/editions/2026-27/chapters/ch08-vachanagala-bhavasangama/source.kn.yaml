- id: author-1
  type: prose
  section: author
  text: "ಜೇಡರ ದಾಸಿಮಯ್ಯ: ಹನ್ನೊಂದನೆಯ ಶತಮಾನದಲ್ಲಿದ್ದ ಹಿರಿಯ ಶಿವಶರಣ. ಯಾದಗಿರಿ ಸನಿಹದ ಮುದೇನೂರಿನವರು. ದಾಸಿಮಯ್ಯ ಪ್ರಥಮ ವಚನಕಾರರೆಂದೇ ಮಾನ್ಯರಾಗಿದ್ದಾರೆ. ‘ರಾಮನಾಥ’ ಎಂಬ ಅಂಕಿತದಿಂದ ರಚಿಸಿರುವ ಇವರ 150 ವಚನಗಳು ದೊರೆತಿವೆ. ಸರಳ ಮತ್ತು ನೇರ ನಿರೂಪಣೆಯಿಂದ ಕೂಡಿದ ದಾಸಿಮಯ್ಯನವರ ವಚನಗಳು ಸಾಮಾಜಿಕ ಮೌಲ್ಯದಿಂದ ಜನಮಾನ್ಯವಾಗಿದೆ."
- id: author-2
  type: prose
  section: author
  text: "ಜೇಡರದಾಸಿಮಯ್ಯನವರು ಈ ವಚನದಲ್ಲಿ ದೃಢವಿಲ್ಲದ ಭಕ್ತಿ ಹೇಗೆ ಇರುತ್ತದೆ ಎಂಬುದನ್ನು ತಿಳಿಸಿದ್ದಾರೆ. ಮನದಲ್ಲಿ ಕೆಟ್ಟ ಉದ್ದೇಶವನ್ನು ಹೊಂದಿ, ಹೊರನೋಟಕ್ಕೆ ದೇವರಲ್ಲಿ ಒಲವುಳ್ಳವನಂತೆ ನಟಿಸುತ್ತಾ, ಜನರನ್ನು ಮತ್ತು ಸಮಾಜವನ್ನು ವಂಚಿಸುವ ವ್ಯಕ್ತಿಯು ಕಟ್ಟ ಕಡೆಗೆ ಜೀವನದಲ್ಲಿ ಏನನ್ನೂ ಗಳಿಸಲಾಗದೆ, ತನ್ನಲ್ಲಿರುವುದನ್ನೂ ಕಳೆದು ಕೊಳ್ಳುತ್ತಾನೆ."
- id: author-3
  type: prose
  section: author
  text: "ಮಡಿವಾಳ ಮಾಚಯ್ಯ: ಮಡಿವಾಳ ಮಾಚಯ್ಯ 12ನೇ ಶತಮಾನದ ಪ್ರಮುಖ ವಚನಕಾರರಲ್ಲಿ ಒಬ್ಬರು. ಇವರ ಜನ್ಮಸ್ಥಳ ವಿಜಯಪುರ ಜಿಲ್ಲೆಯ ಹಿಪ್ಪರಗಿ. ಬಸವಣ್ಣನವರ ಕೀರ್ತಿ ಕೇಳಿ ಹೊಸ ಧರ್ಮಕ್ಕೆ ಆಕರ್ಷಣೆಗೊಂಡು ಕಲ್ಯಾಣಕ್ಕೆ ಹೋದವರಲ್ಲಿ ಮೊದಲಿಗರು. ಮಾಚಯ್ಯ ಕಲ್ಯಾಣದಲ್ಲಿ ಶಿವಶರಣರ ಬಟ್ಟೆಗಳನ್ನು ಮಾತ್ರ ಮಡಿಮಾಡಿಕೊಂಡಿದ್ದವರು. ಇವರ 353 ವಚನಗಳು ಉಪಲಬ್ಧವಾಗಿವೆ. ಇವರ ವಚನಾಂಕಿತನಾಮ ‘ಕಲಿದೇವರ ದೇವ’ ಎಂಬುದು."
- id: author-4
  type: prose
  section: author
  text: ಶಿವಭಕ್ತರು ಅನೇಕ ಸತ್ವಪರೀಕ್ಷೆಗಳಿಂದ ಪರಿಶುದ್ಧರಾಗಿದ್ದಾರೆ. ಅನ್ಯಾಯ ಮಾರ್ಗವನ್ನಿಡಿದು ನಡೆಯುವ ಸಾಮಾನ್ಯ ಮನುಷ್ಯರು ತಮ್ಮ ಹೀನ ಕೃತ್ಯಗಳಿಂದ ಅನೇಕ ಜನ್ಮಾಂತರಗಳಲ್ಲಿ ಬಳಲುತ್ತಾರೆ. ಶಿವಭಕ್ತರನ್ನು ಈ ಜನ್ಮಾಂತರಗಳಿಂದ ಬಳಲಿಸದೆ ಅವರಿಗೆ ಶಿವಾಚಾರದ ಸನ್ಮಾರ್ಗ ತೋರಿಸು ಎಂಬುದು ಈ ವಚನದಲ್ಲಿದೆ.
- id: author-5
  type: prose
  section: author
  text: "ಮುಕ್ತಾಯಕ್ಕ: 12ನೆಯ ಶತಮಾನದಲ್ಲಿದ್ದ ಅನುಭಾವಿ ಶಿವಶರಣೆ. ಮುಕ್ತಾಯಕ್ಕನ ಜನ್ಮಸ್ಥಳ ಲಕ್ಕುಂಡಿ. ಅಜಗಣ್ಣ ಅಂಕಿತವಿರುವ ಇವರ 37 ವಚನಗಳು ದೊರೆತಿವೆ. ಆಧ್ಯಾತ್ಮ ಸಾಧನೆಯ ಗುಪ್ತಭಕ್ತ ಅಜಗಣ್ಣನವರು ಮುಕ್ತಾಯಕ್ಕನವರ ಸಹೋದರ ಮತ್ತು ಗುರು. ಶಿವಭಕ್ತನಿಗೆ ನಡೆ-ನುಡಿಗಳು ಬಹಳ ಮುಖ್ಯ, ನಡೆನುಡಿಗಳ ಪರಿಶುದ್ಧತೆಯೇ ನಿಜವಾದ ವ್ರತ. ಇದು ಮಹಾಜ್ಞಾನ ಸಂಪಾದನೆಯ ಮಾರ್ಗವೆಂಬುದು ಈ ವಚನದಲ್ಲಿ ವ್ಯಕ್ತವಾಗಿದೆ."
- id: author-6
  type: prose
  section: author
  text: "ಸತ್ಯಕ್ಕ: 12ನೆಯ ಶತಮಾನದಲ್ಲಿದ್ದ ಶಿವಶರಣೆಯರಲ್ಲಿ ಒಬ್ಬರು. ಶಿವಮೊಗ್ಗ ಜಿಲ್ಲೆಯ ಶಿರಾಳಕೊಪ್ಪ ಸಮೀಪದ ಹಿರೇಜಂಬೂರು ಸತ್ಯಕ್ಕನವರ ಜನ್ಮಸ್ಥಳ. ಶಿವಭಕ್ತರ ಮನೆಯಂಗಳ ಕಸಗುಡಿಸುತ್ತ ಶಿವಭಕ್ತಿಯನ್ನು ಆಚರಿಸುವುದು ಇವರ ಕಾಯಕವಾಗಿತ್ತು. “ಶಂಭುಜಕ್ಕೇಶ್ವರ” ಎಂಬುದು ಸತ್ಯಕ್ಕನವರ ವಚನಗಳ ಅಂಕಿತನಾಮ. ಇವರ 27 ವಚನಗಳು ದೊರಕಿವೆ. ಪರರಧನ, ಪರಿಶ್ರಮವಿಲ್ಲದೆ ದೊರಕುವ ಯಾವುದೇ ಆಸೆ-ಆಮಿಷಗಳಿಗೆ ಶಿವಶರಣರು ಒಳಗಾಗಬಾರದು, ಹಾಗೇನಾದರೂ ಒಳಗಾದ ಪಕ್ಷದಲ್ಲಿ ಅಂಥವರಿಗೆ ನರಕ ತಪ್ಪಿದ್ದಲ್ಲ."
