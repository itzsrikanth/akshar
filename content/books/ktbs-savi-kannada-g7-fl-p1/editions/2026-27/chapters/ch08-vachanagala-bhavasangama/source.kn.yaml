segments:
- id: intro-1
  type: prose
  section: intro
  text: "ಕನ್ನಡ ಸಾಹಿತ್ಯ ಚರಿತ್ರೆಯಲ್ಲಿ 12 ನೆಯ ಶತಮಾನ ಅತ್ಯಮೂಲ್ಯವಾದದ್ದು. ವಚನ ಸಾಹಿತ್ಯ ಕನ್ನಡ ಸಾಹಿತ್ಯವನ್ನು ಶ್ರೀಮಂತಗೊಳಿಸಿದ ವಿಶಿಷ್ಟ ಸಾಹಿತ್ಯ ಪ್ರಕಾರ. ಜನಸಾಮಾನ್ಯರು ತಮ್ಮ ಸ್ವಾನುಭೂತಿ, ನಿವೇದನೆಗಳನ್ನು ತಮ್ಮ ತಮ್ಮ ಇಷ್ಟ ದೇವರ ಹೆಸರಿನಲ್ಲಿ ಅಂಕಿತನಾಮನನ್ನಿಟ್ಟುಕೊಂಡು ವಚನಗಳ ರೂಪದಲ್ಲಿ ಹೊರಹೊಮ್ಮಿದ ಕಾಲವಿದು. ಈ ಕಾಲದಲ್ಲಿ ಜಾತಿ ಭೇದವಿಲ್ಲದೆ ಗಂಡು ಹೆಣ್ಣೆಂಬ ತಾರತಮ್ಯವಿಲ್ಲದೇ ಹಲವಾರು ಮಂದಿ ವಚನಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಜೇಡರ ದಾಸಿಮಯ್ಯ, ಬಸವಣ್ಣ, ಅಲ್ಲಮಪ್ರಭು, ಚೆನ್ನಬಸವಣ್ಣ, ಅಕ್ಕಮಹಾದೇವಿ, ಮಡಿವಾಳ ಮಾಚಿದೇವ, ಮುಕ್ತಾಯಕ್ಕ, ಸತ್ಯಕ್ಕ ಮೊದಲಾದವರ ವಚನಗಳು ಕನ್ನಡ ಸಾಹಿತ್ಯದಲ್ಲಿ ಹೇರಳವಾಗಿವೆ. ಈ ವಚನಕಾರರ ವಚನಗಳನ್ನು ಅವರವರ ವಚನಾಂಕಿತದಿಂದ ಸುಲಭವಾಗಿ ಅದರ ಕರ್ತೃವನ್ನು ರಚನೆಕಾರರನ್ನು ಗುರುತಿಸಲು ಸಾಧ್ಯವಾಗಿದೆ. ಇಂಥ ಅಮೂಲ್ಯ ವಚನಗಳ ಭಾವಾಂತರಂಗದಲ್ಲಿ ಭಕ್ತನ ಪರೀಕ್ಷೆ, ಪರಿಶುದ್ಧತೆ, ಆಚಾರ-ವಿಚಾರಗಳು ಹಾಗೂ ಭಕ್ತರ ಪ್ರಾಮಾಣಿಕ ನಡೆನುಡಿಗಳನ್ನು ಈ ವಚನಗಳ ಭಾವಸಂಗಮದಲ್ಲಿ ಕಾಣಬಹುದು."
