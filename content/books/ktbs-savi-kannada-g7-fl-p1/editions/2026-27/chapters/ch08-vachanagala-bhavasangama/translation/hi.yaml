  exercise-A: 'अ. एक वाक्य में उत्तर दीजिए।'
  exercise-B: 'आ. दो-तीन वाक्यों में उत्तर दीजिए।'
  exercise-C: 'इ. पाँच-छह वाक्यों में उत्तर दीजिए।'

intro-1: 'कन्नड़ साहित्य इतिहास में 12वीं शताब्दी अत्यंत अमूल्य है। वचन साहित्य विशिष्ट विधा है। जाति-भेद और स्त्री-पुरुष भेद के बिना अनेक ने वचन रचे।'

author-1: 'जेडर दासिमय्य 11वीं शताब्दी के वरिष्ठ शिवशरण। ‘रामानाथ’ अंकित से 150 वचन उपलब्ध।'

author-3: 'मडिवाल माचय्य 12वीं शताब्दी के प्रमुख वचनकार। अंकितनाम ‘कलिदेवर देव’।'

author-5: 'मुक्तायक्क 12वीं शताब्दी की अनुभावी शिवशरणे। अजगण्ण अंकित से 37 वचन।'

author-6: 'सत्यक्क की कायक शिवभक्तों के आँगन साफ़ करना। अंकित ‘शंभुजक्केश्वर’।'

