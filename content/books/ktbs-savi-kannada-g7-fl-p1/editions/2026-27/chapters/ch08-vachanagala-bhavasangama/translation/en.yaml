ex-a-q1: 'Why did one walk all night with a torn sack?'

ex-a-q2: 'From what did devotion to Shiva become radiant?'

ex-a-q3: 'What is the practice of great knowledge?'

ex-a-q4: 'Desiring what must one be immersed in hell?'

ex-a-q5: 'If gold-cloth has fallen where will one not touch and pick it up?'

ex-b-q1: 'What must be done to show the path of Shivachara?'

ex-b-q2: 'What is Muktayakka’s opinion about walk and speech?'

ex-c-q1: 'How does Jedara Dasimayya explain the devotion of the unsteady-minded?'

ex-c-q2: 'How does Satyakka express becoming free of desire and lure in her vachana?'
