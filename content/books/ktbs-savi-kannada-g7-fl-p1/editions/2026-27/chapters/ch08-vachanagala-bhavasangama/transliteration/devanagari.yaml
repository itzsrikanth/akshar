intro-1: कन्नड साहित्य चरित्रॆयल्लि 12 नॆय शतमान अत्यमूल्यवादद्दु. वचन साहित्य कन्नड साहित्यवन्नु श्रीमंतगॊळिसिद विशिष्ट साहित्य प्रकार. जनसामान्यरु तम्म स्वानुभूति, निवेदनॆगळन्नु तम्म तम्म इष्ट देवर हॆसरिनल्लि अंकितनामनन्निट्टुकॊंडु वचनगळ रूपदल्लि हॊरहॊम्मिद कालविदु. ई कालदल्लि जाति भेदविल्लदॆ गंडु हॆण्णॆंब तारतम्यविल्लदे हलवारु मंदि वचनगळन्नु रचिसिद्दारॆ. जेडर दासिमय्य, बसवण्ण, अल्लमप्रभु, चॆन्नबसवण्ण, अक्कमहादेवि, मडिवाळ माचिदेव, मुक्तायक्क, सत्यक्क मॊदलादवर वचनगळु कन्नड साहित्यदल्लि हेरळवागिवॆ. ई वचनकारर वचनगळन्नु अवरवर वचनांकितदिंद सुलभवागि अदर कर्तृवन्नु रचनॆकाररन्नु गुरुतिसलु साध्यवागिदॆ. इंथ अमूल्य वचनगळ भावांतरंगदल्लि भक्तन परीक्षॆ, परिशुद्धतॆ, आचार-विचारगळु हागू भक्तर प्रामाणिक नडॆनुडिगळन्नु ई वचनगळ भावसंगमदल्लि काणबहुदु.
poem-s1l1: हरिद गोणियलॊब्ब कळवॆय तुंबिद
poem-s1l2: इरुळॆल्ला नडॆदना सुंककंजि
poem-s1l3: कळवॆयॆल्ला होगि बरिगोणि उळियित्तु
poem-s1l4: अळिमनदवन भक्ति इंतायित्तु रामनाथ- जेडर दासिमय्य.
poem-s2l1: अंधकारद दॆसॆयिंद चंद्रन प्रभॆयायितु
poem-s2l2: निंदकर नुडियिंद एडिसलै शिवभक्तिय प्रभॆयायितु
poem-s2l3: अहुदॆंदडॆ अल्लवॆंदतिगळॆवरु
poem-s2l4: कुतर्कशास्त्रदिंद यमगतिगर कूडॆ
poem-s2l5: नाना जन्मक्केरदॆ, शिवाचारद पथव तोरय्या
poem-s2l6: कलिदेवर देव- मडिवाळ माचय्य
poem-s3l1: नुडियलुबारदु कॆट्ट नुडिगळ
poem-s3l2: नडॆयलुबारदु कॆट्ट नडॆगळ
poem-s3l3: नुडिदडेनु, नडॆयदिर्दडेनु
poem-s3l4: हिडिद व्रतव बिडदिरलु
poem-s3l5: अदे महाज्ञानदाचरणॆ ऎंबॆनु अजगण्ण तंदॆ- मुक्तायक्क
poem-s4l1: लंचवंचनक्कॆ कैयानद भाषॆ
poem-s4l2: बट्टॆयल्लि हॊन्नुवस्त्र बिद्दिद्दरॆ
poem-s4l3: नानु कैमुट्टि ऎत्तिदॆनादरॆ
poem-s4l4: निम्माणॆ निम्म प्रमथराणॆ
poem-s4l5: अदेनु कारणवॆंदरॆ नीविक्किद भिक्षदल्लिप्पॆनागि
poem-s4l6: इंतल्लदॆ नानु अळिमनव माडि
poem-s4l7: परद्रव्यक्कॆ आसॆ माडिदॆनादरॆ
poem-s4l8: नीनागलॆ ऎन्न नरकदल्लि अद्दि
poem-s4l9: नीनॆद्दु होगा शंभुजक्केश्वरा.- सत्यक्क
author-1: 'जेडर दासिमय्य: हन्नॊंदनॆय शतमानदल्लिद्द हिरिय शिवशरण. यादगिरि सनिहद मुदेनूरिनवरु. दासिमय्य प्रथम वचनकाररॆंदे मान्यरागिद्दारॆ. ‘रामनाथ’ ऎंब अंकितदिंद रचिसिरुव इवर 150 वचनगळु दॊरॆतिवॆ. सरळ मत्तु नेर निरूपणॆयिंद कूडिद दासिमय्यनवर वचनगळु सामाजिक मौल्यदिंद जनमान्यवागिदॆ.'
author-2: जेडरदासिमय्यनवरु ई वचनदल्लि दृढविल्लद भक्ति हेगॆ इरुत्तदॆ ऎंबुदन्नु तिळिसिद्दारॆ. मनदल्लि कॆट्ट उद्देशवन्नु हॊंदि, हॊरनोटक्कॆ देवरल्लि ऒलवुळ्ळवनंतॆ नटिसुत्ता, जनरन्नु मत्तु समाजवन्नु वंचिसुव व्यक्तियु कट्ट कडॆगॆ जीवनदल्लि एनन्नू गळिसलागदॆ, तन्नल्लिरुवुदन्नू कळॆदु कॊळ्ळुत्तानॆ.
author-3: 'मडिवाळ माचय्य: मडिवाळ माचय्य 12ने शतमानद प्रमुख वचनकाररल्लि ऒब्बरु. इवर जन्मस्थळ विजयपुर जिल्लॆय हिप्परगि. बसवण्णनवर कीर्ति केळि हॊस धर्मक्कॆ आकर्षणॆगॊंडु कल्याणक्कॆ होदवरल्लि मॊदलिगरु. माचय्य कल्याणदल्लि शिवशरणर बट्टॆगळन्नु मात्र मडिमाडिकॊंडिद्दवरु. इवर 353 वचनगळु उपलब्धवागिवॆ. इवर वचनांकितनाम ‘कलिदेवर देव’ ऎंबुदु.'
author-4: शिवभक्तरु अनेक सत्वपरीक्षॆगळिंद परिशुद्धरागिद्दारॆ. अन्याय मार्गवन्निडिदु नडॆयुव सामान्य मनुष्यरु तम्म हीन कृत्यगळिंद अनेक जन्मांतरगळल्लि बळलुत्तारॆ. शिवभक्तरन्नु ई जन्मांतरगळिंद बळलिसदॆ अवरिगॆ शिवाचारद सन्मार्ग तोरिसु ऎंबुदु ई वचनदल्लिदॆ.
author-5: 'मुक्तायक्क: 12नॆय शतमानदल्लिद्द अनुभावि शिवशरणॆ. मुक्तायक्कन जन्मस्थळ लक्कुंडि. अजगण्ण अंकितविरुव इवर 37 वचनगळु दॊरॆतिवॆ. आध्यात्म साधनॆय गुप्तभक्त अजगण्णनवरु मुक्तायक्कनवर सहोदर मत्तु गुरु. शिवभक्तनिगॆ नडॆ-नुडिगळु बहळ मुख्य, नडॆनुडिगळ परिशुद्धतॆये निजवाद व्रत. इदु महाज्ञान संपादनॆय मार्गवॆंबुदु ई वचनदल्लि व्यक्तवागिदॆ.'
author-6: 'सत्यक्क: 12नॆय शतमानदल्लिद्द शिवशरणॆयरल्लि ऒब्बरु. शिवमॊग्ग जिल्लॆय शिराळकॊप्प समीपद हिरेजंबूरु सत्यक्कनवर जन्मस्थळ. शिवभक्तर मनॆयंगळ कसगुडिसुत्त शिवभक्तियन्नु आचरिसुवुदु इवर कायकवागित्तु. “शंभुजक्केश्वर” ऎंबुदु सत्यक्कनवर वचनगळ अंकितनाम. इवर 27 वचनगळु दॊरकिवॆ. पररधन, परिश्रमविल्लदॆ दॊरकुव यावुदे आसॆ-आमिषगळिगॆ शिवशरणरु ऒळगागबारदु, हागेनादरू ऒळगाद पक्षदल्लि अंथवरिगॆ नरक तप्पिद्दल्ल.'
