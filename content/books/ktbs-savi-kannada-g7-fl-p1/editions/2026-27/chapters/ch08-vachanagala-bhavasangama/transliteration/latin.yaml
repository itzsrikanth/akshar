ex-a-q1: harida goṇiyalòbba iruḻèllā ekè naḍèdanu?
ex-a-q2: śivana melina bhakti yāvudariṃda prabhèyāyitu?
ex-a-q3: mahājñānadācaraṇè yāvudu?
ex-a-q4: yāvudakkè āsè māḍidarè narakadalli adda beku?
ex-a-q5: hònnuvastra èlli biddiddarè kaimuṭṭi èttuvudilla?
ex-b-q1: śivācārada pathavannu torisalu enu māḍabeku?
ex-b-q2: naḍè-nuḍigaḻa bagègè muktāyakkana abhiprāyavenu?
ex-c-q1: jeḍaradāsimayyanavaru aḻimanadavana bhaktiyannu hegè tiḻisiddārè?
ex-c-q2: āsè āmiṣagaḻiṃda muktarāguva bagèyannu satyakka tanna vacanadalli hegè vyaktagòḻisiddāḻè?
