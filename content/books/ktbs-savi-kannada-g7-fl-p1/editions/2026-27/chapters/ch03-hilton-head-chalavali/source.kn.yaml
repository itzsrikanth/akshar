segments:
- id: intro-1
  type: prose
  section: intro
  text: "ಯಾವುದೇ ವಸ್ತುವಿರಲಿ, ಅದು ನಮ್ಮ ಬಳಿ ಇದ್ದಾಗ ಅದರ ಬೆಲೆ ತಿಳಿಯುವುದಿಲ್ಲ. ಅದನ್ನು ನಾವು ಕಳೆದುಕೊಂಡಾಗ, ಅದೆಷ್ಟು ಅಮೂಲ್ಯವಾದ ವಸ್ತುವಾಗಿತ್ತೆಂಬುದು ಅರಿವಿಗೆ ಬರುತ್ತದೆ. ಪರಿಸರದ ವಿಷಯದಲ್ಲೂ ಇದು ನಿಜ. ಪರಿಸರವು ಚೆನ್ನಾಗಿದ್ದಾಗ, ಪ್ರಕೃತಿಯು ರಮಣೀಯವಾಗಿದ್ದಾಗ ಅದನ್ನು ನಾವು ಅಷ್ಟೇನೂ ಗಮನಿಸುವುದಿಲ್ಲ. ಅಥವಾ ಗಮನಿಸಿದರೂ ಅದು ವಿಶೇಷವಾದ ಸಂಗತಿ ಎಂದು ನಮಗನ್ನಿಸುವುದಿಲ್ಲ. ಆದರೆ ಪ್ರಕೃತಿ ಹಾಳಾದಾಗ, ಪ್ರದೂಷಣೆಗೆ ಒಳಗಾದಾಗ ನಾವು ಪರಿತಪಿಸತೊಡಗುತ್ತೇವೆ. ಹಿಲ್ಟನ್ ಹೆಡ್ನಲ್ಲಿ ಹಾಗೆ ಪ್ರಕೃತಿಯ ಮೇಲೆ ದೌರ್ಜನ್ಯ ನಡೆಯಲು ಶುರುವಾಗಿ ಹಲವು ದಿನಗಳ ನಂತರವಷ್ಟೇ ಸ್ಥಳೀಯರು ಜಾಗ್ರತರಾದರು. ತಮ್ಮ ಪ್ರಕೃತಿಗಾಗಿ ಅವರು ಹೋರಾಟ ಕೈಗೊಂಡರು. ಹಿಲ್ಟನ್ ಹೆಡ್ನ ಪರಿಸರ ಚಳವಳಿಯು ಯಾವುದೇ ಚಳವಳಿಗೂ ಸಣ್ಣದಲ್ಲ; ಚಳವಳಿಯು ಅದರ ಗಾತ್ರದಿಂದಲ್ಲ ಬದಲಿಗೆ ಉದ್ದೇಶದಿಂದ ದೊಡ್ಡದೋ ಚಿಕ್ಕದೋ ಎಂದು ಪರಿಗಣಿಸಲ್ಪಡುತ್ತದೆ ಎಂಬುದನ್ನು ಸೂಚಿಸುತ್ತದೆ."
- id: story-n1
  type: prose
  section: story
  text: "1986ರಲ್ಲಿ ಅಮೆರಿಕಾಗೆ ಹೋಗುವ ಪ್ರಸಂಗವಾಯಿತು. ಅಲ್ಲಿರುವಾಗ ನನ್ನ ತಮ್ಮ ಬಾಬುವಿನೊಡನೆ ಅಮೆರಿಕಾದ ಪೂರ್ವ ಸಮುದ್ರ ತೀರಕ್ಕಂಟಿದಂತೆ ಅಟ್ಲಾಂಟಿಕ್ ಸಾಗರದಲ್ಲಿರುವ ಹಿಲ್ಟನ್ ಹೆಡ್ ಎನ್ನುವ ಒಂದು ದ್ವೀಪಕ್ಕೆ ಹೋದೆವು. ಸುತ್ತ ಅಟ್ಲಾಂಟಿಕ್ ಸಾಗರ ಹರಡಿರುವ ಹಿಲ್ಟನ್ ಹೆಡ್ ನಿಜಕ್ಕೂ ಸುಂದರವಾದ ಪುಟ್ಟದ್ವೀಪ. ರಸ್ತೆಯಿಂದ ಅದನ್ನು ತಲುಪಲು ಆರು ಲೇನಿನ ಭಾರಿ ಸೇತುವೆ ಇದೆ. ಕಾಡೇ ನಾಡಿಗೆ ಸಾರ್ವಭೌಮವಾಗಿದ್ದಂಥ ಒಂದು ಕಾಲದಲ್ಲಿ ಈ ದ್ವೀಪದಲ್ಲೂ ಸ್ಥಳೀಯ ಅಮೆರಿಂಡಿಯನ್ನರು ವಾಸವಾಗಿದ್ದರು. ಯುರೋಪಿಯನ್ನರ ಆಗಮನವಾದ ಮೇಲೆ ಅಮೆರಿಂಡಿಯನ್ನರ ಧೂಳೀಪಟವಾಯಿತು, ಆಗ ಹಿಲ್ಟನ್ ಹೆಡ್ ದ್ವೀಪವೂ ಬಿಳಿಯರದಾಯಿತು."
- id: story-n2
  type: prose
  section: story
  text: "ಒಳ್ಳೆಯ ಹವೆ ಇರುವ ಈ ದ್ವೀಪದಲ್ಲಿ ಕಾಡು ಕಡಿದು ನೀಲಿ ನಂತರ ಇನ್ನಿತರ ಬೆಳೆಗಳನ್ನು ಬೆಳೆಯುವ ತೋಟಗಳನ್ನಾಗಿ ಯುರೋಪಿಯನ್ನರು ಪರಿವರ್ತಿಸಿಬಿಟ್ಟರು. ಆದರೂ ಅಲ್ಲಲ್ಲಿ ಬೇಕಾದಷ್ಟು ಓಕ್ ಮರಗಳೂ ಇದ್ದವು. ಕಡಲತೀರದ ಸಸ್ಯಗಳಿದ್ದವು. ದಿನ ಕಳೆದಂತೆ ತೋಟತುಡಿಕೆಯಿಂದ ವರಮಾನ ಕಡಿಮೆ; ವರ್ಷವಿಡೀ ಉತ್ತಮ ಹವೆ, ಕಡಲತೀರ, ಒಳ್ಳೆಯ ಬಂದರು ಇರುವ ಈ ದ್ವೀಪದಲ್ಲಿ ತೋಟತುಡಿಕೆಗಳನ್ನು ತೆಗೆದು ರೆಸಾರ್ಟುಗಳು, ಗಾಲ್ಫ್ ಕೋರ್ಸುಗಳು, ಕ್ರೀಡಾಮೈದಾನಗಳು, ಬೋಟಿಂಗ್ ಇತ್ಯಾದಿಗಳನ್ನೆಬ್ಬಿಸಿದರೆ ಲಾಭ ಎನ್ನಿಸಿತೇನೋ."
- id: story-n3
  type: prose
  section: story
  text: "ಸಾಹುಕಾರರ ನಾಡಾದ ಅಮೆರಿಕದಲ್ಲಿ ಇಂಥ ಐಡಿಯಾಗಳಿಗೆ ಪ್ರೋತ್ಸಾಹ ಕೊಡುವವರು ಬೇಕಾದಷ್ಟು ಜನ. ಅರವತ್ತರ ದಶಕದಲ್ಲಿ ಈ ಸುಧಾರಣೆಗಳು ಜಾರಿಗೊಂಡು ತೋಟತುಡಿಕೆಗಳ ಬದಲು ಸೀಬೀಚ್ ಹೋಟೆಲ್ಗಳು, ಸ್ಟೇಹೋಂಗಳು, ಗಾಲ್ಫ್ಕೋರ್ಸ್ಗಳು, ಹೋಟೆಲ್ಗಳಿಗಾಗಿ ತೋಟ, ತುಡಿಕೆ, ಹಿನ್ನೀರ ಕೋವುಗಳು, ಹೊಂಡಗಳು, ಕಾಡು ಕೊಚ್ಚತೊಡಗಿದರು. ಲಕ್ಸುರಿಯ ನವಾವತಾರಗಳ ಆಹುಟ ಹೆಚ್ಚಿದಷ್ಟೂ ಕಾರು, ಪ್ಲೇನು, ಹೆಲಿಗಳಲ್ಲಿ ಬಂದಿಳಿಯುವ ಬೂಟು, ಚೆಡ್ಡಿ, ಟೀಶರ್ಟು, ಕೂಲಿಂಗ್ಗ್ಲಾಸ್, ಸ್ಕಲ್ಕ್ಯಾಪು ತೊಟ್ಟ ದುಡ್ಡುಳ್ಳ ಅಭಿಮಾನಿಗಳ ಭರಾಟೆಯೂ ಹೆಚ್ಚತೊಡಗಿತು."
- id: story-n4
  type: prose
  section: story
  text: "ಈ ರೀತಿಯ ಅತಿಕ್ರಮಣ ಸಲ್ಲದು ಎಂದು ಅಲ್ಲಿಯ ಕೆಲವರಾದರೂ ಪರ್ಯಾವರಣಾಭಿಮಾನಿಗಳಿಗೆ ಅನ್ನಿಸಿತೇನೋ. ಅವರುಗಳೂ ಕೂಡಿ ಇಲ್ಲಿನ ಪುರಾತನ ಸಸ್ಯಸಂಪತ್ತು, ಹಳೆಯ ಕಾಲದ ಹೊಂಡಗಳು, ಹಿನ್ನೀರಿನ ಕೋವುಗಳು, ಓಕ್ಮರ ತೋಪುಗಳು, ಕಡಲತೀರದ ಸಸ್ಯಗಳು ಮತ್ತು ಕಾಡಿನ ಮರಗಳನ್ನು ತರಿಯಲೇಕೂಡದು ಎನ್ನುವ ಚಳವಳಿಯನ್ನು ಆರಂಭಿಸಿದರು. ಆದರೂ ದುಡ್ಡು ಬುಲ್ಡೋಜರುಳ್ಳ ವೀರರ ಮುಂದೆ ಇವರ ಕೈಸಾಗಲಿಲ್ಲ. ಇಲ್ಲಿನ ಗಾಲ್ಫ್ ಕೋರ್ಸುಗಳು, ಕ್ರೀಡಾವಿನೋದಗಳೆಡೆಗಳು ಎಷ್ಟು ಚೆನ್ನಾಗಿದ್ದವೆಂದರೆ ಪ್ರಸಿದ್ಧರು ಮೋಜಿಗೆ ಬರುತ್ತಿದ್ದರು. ಅಮೆರಿಕದ ಪ್ರೆಸಿಡೆಂಟರೂ ಗಾಲ್ಫ್ಗೆ ಬಂದದ್ದುಂಟು."
- id: story-n5
  type: prose
  section: story
  text: "ದುಡ್ಡು ಮತ್ತು ದೌಲತ್ತುಗಳಿಂದ ಪರ್ಯಾವರಣದ ಚಳುವಳಿಗಳಿಗೆ ಹಿನ್ನಡೆ ಆಗತೊಡಗಿದಾಗ ಕೆಲವು ಆಸಕ್ತರು ಕೋರ್ಟಿನ ಮೆಟ್ಟಿಲಿಗೇರುವ ಆಲೋಚನೆ ಮಾಡತೊಡಗಿದರು. ಆಗ ಹೇಗೋ ಒಬ್ಬ ನೆಲದಳ್ಳಾಳಿಗೆ ಪರ್ಯಾವರಣದ ಸುಖದುಃಖಗಳಿಗೂ ಮನಸ್ಸು ಕೊಡುವ ಇಂಬಾಯಿತು. ಅವನೂ ಪರ್ಯಾವರಣದ ಆಸಕ್ತರೊಡನೆ ಕೂಡಿಕೊಂಡು ಕಡಲ ತೀರದ ಸಸ್ಯಸಂಪತ್ತು ಹಳೆಯ ಕಾಲದ ಹೊಂಡಗಳು, ಓಕ್ ಮರಗಳನ್ನು ಹೊಡೆದು ತರಿಯಲೇ ಕೂಡದು ಎನ್ನುವ ಚಳವಳಿ ಆರಂಭಿಸಿದ. ಆದರೆ ಸಾಹುಕಾರರು ಬಗ್ಗಲಿಲ್ಲ. ಇವರು ವಿಧಿಯಿಲ್ಲದೆ ಕೋರ್ಟು ಕಚೇರಿಗಳ ಮೆಟ್ಟಿಲೇರಿದರು."
- id: story-n6
  type: prose
  section: story
  text: "ಈ ಹೊಯ್ದಾಟದಲ್ಲಿ ಕ್ರಮೇಣ ಜನಸಮ್ಮತಿ ಪರ್ಯಾವರಣದತ್ತ ಒಲಿಯಿತು. ರಸ್ತೆ, ಕಟ್ಟಡ, ಕ್ರೀಡಾಂಗಣ, ಸೇತುವೆಗೆ ತೋರುತ್ತಿದ್ದ ಅಭಿಯಂತರ ಶ್ರದ್ಧೆಯನ್ನೇ ಪರಿಸರ ಸೌಂದರ್ಯ, ಗಿಡ, ಮರ, ತಟಸಸ್ಯ ಸಂಕುಲ, ಹೊಂಡಗಳಿಗೂ ತೋರಿಸತೊಡಗಿದರು. ಸ್ಥಳದ ನೆಲ ಜಲ ವನ ಸಂಪತ್ತು ಹೆಚ್ಚುವಂತೆ ನೆಲವನ್ನು ಕಾಪಿಟ್ಟುಕೊಂಡು ದ್ವೀಪದ ಸೌಂದರ್ಯವನ್ನು ಹೆಚ್ಚಿಸಿಕೊಳ್ಳಬೇಕು ಎನ್ನುವ ದೀಡಿನಲ್ಲಿ ಮಂತ್ರಾಲೋಚನೆಗಳಾದವು. ಪುರಾಭಿವೃದ್ಧಿ ಕಾರ್ಯ ಹಾಗೆಯೇ ಜರುಗತೊಡಗಿತು. ಪರಿಣಾಮವಾಗಿ, ನಾಲ್ಕಾರು ವರ್ಷಗಳಲ್ಲಿ ಹಿಲ್ಟನ್ ಹೆಡ್ ನಂದನವನದಂತೆ ಮರ, ಗಿಡ, ಹೊಂಡ, ತೀರದ ಸಸ್ಯಗಳಿಂದ ಕಂಗೊಳಿಸತೊಡಗಿತು. ಅವುಗಳ ನಡುವೆ ಕ್ರೀಡೆಗೆ ಎಡೆಗಳಾದವು. ಪ್ರೆಸಿಡೆಂಟರೂ ಪಚ್ಚೆಯಂತೆ ಹೊಳೆಯುವ ಇಲ್ಲಿಯ ಗಾಲ್ಫ್ ಕೋರ್ಸಿಗೆ ಆಡಲು ಬರುವುದೂ ಸಾಧಾರಣವಾಯಿತು."
- id: story-n7
  type: prose
  section: story
  text: "ದಿನವಿಡೀ ಸುತ್ತಾಡಿ ಸಂತೋಷಪಟ್ಟು ಕಡಲತಡಿಯ ಪುರಾತನ ಲೈಟ್ಹೌಸನ್ನೇರಿ ಅಟ್ಲಾಂಟಿಕ್ ಮಹಾಸಾಗರ, ಸಮುದ್ರದಲ್ಲೋಡಾಡುತ್ತಿದ್ದ ನೌಕೆಗಳು, ಕಡಲ ಕಾಗೆಗಳು, ನಮ್ಮ ಬಡ್ಡೆಗೇ ಬಂದಿಳಿಯುವ ರೇವನ್, ಮೈನಾಗಳನ್ನ ನೋಡಿ ನಾವೂ ಆನಂದಿಸಿದೆವು."
- id: story-n8
  type: prose
  section: story
  text: "ಅಲ್ಲಿಂದ ಕೆಳಗಿಳಿದ ಮೇಲೆ ಅಕಸ್ಮಾತ್ತಾಗಿ ಹಾವು ಬಳುಕಿನ ಹಿನ್ನೀರಿನ ದೊಣೆಯ ಒಂದು ಬದಿಯಲ್ಲಿ ದುಂಡನೆಯ ವೇದಿಕೆಯ ನಡುವೆ ಒಂದು ದೊಡ್ಡ ಓಕ್ ಮರವನ್ನು ಕಂಡೆವು. ಅದೇನೆಂದು ಅಲ್ಲಿಗೆ ಹೋದೆವು. ಅದೊಂದು ಹಳೆಯ ಓಕ್ ಮರ; ಅದರಡಿ ತೆಳ್ಳಗೆ ಅಗೆತ ಮಾಡಿ ದಪ್ಪ ಗೊಬ್ಬರ, ಮರದ ಚೆಕ್ಕೆ ಹರಡಿದ್ದರು. ಯಾರೂ ಕಾಲಿಕ್ಕದಂತೆ ಪರಿಧಿಯ ಸುತ್ತಲೂ ಕಟಕಟೆ ಕಟ್ಟಿದ್ದರು. ಇದು ಲಿಬರ್ಟಿ ಓಕ್ ಮರ. ಐವತ್ತರ ದಶಕದಲ್ಲಿ ಪರಿಸರ ರಕ್ಷಣೆಗಾಗಿ ಜನ ಒಗ್ಗೂಡಿ ಪಣತೊಟ್ಟಿದ್ದು ಈ ಮರದಲ್ಲಿಯೇ. ಇದು ಸಂರಕ್ಷಿತ ಜಾಗ. ದಯವಿಟ್ಟು ಕಟಕಟೆಯ ಒಳಗೆ ಪ್ರವೇಶಿಸಬೇಡಿ ಎನ್ನುವ ಫಲಕವನ್ನು ನೆಟ್ಟಿದ್ದರು. ಹೀಗೆ ಆ ಮರ ನೂರುಕಾಲ ಬಾಳುವಂತೆ ರಕ್ಷಿತವಾಗಿತ್ತು. ನಂತರದ ಕಾಲದಲ್ಲಿ ಈ ಮರದ ಪ್ರಸಿದ್ಧಿ ಎಷ್ಟು ಹರಡಿತೆಂದರೆ ಇದರ ಸಾನ್ನಿಧ್ಯವನ್ನು ಕಂಡು ಮರಳಿದ ಜನ ತಂತಮ್ಮ ಕ್ಷೇತ್ರಗಳಲ್ಲಿ ಪರ್ಯಾವರಣ ರಕ್ಷಣೆಯಲ್ಲಿ ಚುರುಕುಗೊಂಡರು. ಈ ಮರದ ಸಾನ್ನಿಧ್ಯದಲ್ಲಿ ಎಷ್ಟೋ ವಿವಾಹಗಳಾಗಿವೆಯಂತೆ!"
- id: competency
  type: competency
  section: competency
  text: "ಕೌಶಲ: ಆಲಿಸುವುದು. ಸಾಮರ್ಥ್ಯ: ಗುಂಪು ಚಟುವಟಿಕೆಗಳ ನಿರ್ದೇಶನಗಳನ್ನು ಆಲಿಸಿ, ಅರ್ಥಮಾಡಿಕೊಂಡು ಆಂಗಿಕವಾಗಿ ಪ್ರತಿಕ್ರಿಯಿಸುವುದು. ಆಶಯ: ಮನುಷ್ಯನು ನಾಗರೀಕತೆಯ ವ್ಯಾಮೋಹಕ್ಕೆ ಸಿಲುಕಿ ಸುಂದರವಾದ ಪರಿಸರ ತಾಣಗಳನ್ನು ನಾಶಮಾಡುತ್ತಾ ಬಂದಿದ್ದಾನೆ. ಮರಗಿಡಗಳನ್ನು ಕತ್ತರಿಸಿ ಆ ಜಾಗಗಳನ್ನು ವ್ಯಾಪಾರ, ಮನರಂಜನಾ, ಕ್ರೀಡಾ ತಾಣಗಳನ್ನಾಗಿ ಪರಿವರ್ತಿಸುತ್ತಿರುವುದರಿಂದ ನಮ್ಮ ಪರಿಸರ ತಾಣಗಳು ಅಧೋಗತಿಯನ್ನು ಕಾಣುತ್ತಿವೆ. ಪ್ರಕೃತಿಯ ಮೇಲೆ ನಡೆಯುತ್ತಿರುವ ದೌರ್ಜನ್ಯವನ್ನು ತಡೆಗಟ್ಟಲು ಪರಿಸರವಾದಿಗಳು ಮೊದಲಿನಿಂದಲೂ ನಡೆಸುತ್ತಿರುವ ಹೋರಾಟಗಳು ಅವಿಸ್ಮರಣೀಯ. ಪ್ರಸ್ತುತ ಸನ್ನಿವೇಶದಲ್ಲಿ ಪರಿಸರವನ್ನು ಸಂರಕ್ಷಣೆ ಮಾಡಬೇಕಾಗಿರುವುದು ನಮ್ಮೆಲ್ಲರ ಆದ್ಯ ಕರ್ತವ್ಯವಾಗಬೇಕು ಎಂಬುದು ಈ ಪಾಠದ ಮುಖ್ಯ ಆಶಯ."
- id: author-1
  type: prose
  section: author
  text: "ಶಶಿಧರ ವಿಶ್ವಾಮಿತ್ರ 1940ರಲ್ಲಿ ಮೈಸೂರಿನಲ್ಲಿ ಹುಟ್ಟಿದರು. ಸೆಂಟ್ರಲ್ ಕಾಲೇಜಿನಲ್ಲಿ ಪದವೀಧರರಾದ ಮೇಲೆ ಭಾರತ ಸರಕಾರದ ರಾಷ್ಟ್ರೀಯ ಕ್ಷಯರೋಗ ಸಂಸ್ಥೆಯಲ್ಲಿ ಸಂಶೋಧಕರಾಗಿ ವೃತ್ತಿಜೀವನ ಪ್ರಾರಂಭಿಸಿದರು. ಕ್ಷಯರೋಗಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ವಿವಿಧ ಸಂಸ್ಥೆಗಳಲ್ಲಿ, ವಿವಿಧ ಹುದ್ದೆಗಳಲ್ಲಿ ಕಾರ್ಯನಿರ್ವಹಿಸಿದ್ದಾರೆ. ಖಿಲ, ಪದ ಕುಸಿಯೆ ನೆಲವಿಹುದೆ, ಹಿಂದೂ ಧರ್ಮ, ಸೃಷ್ಟಿಯ ರಂಗವಲ್ಲಿ- ಮುಂತಾದವು ಇವರ ಕೆಲವು ಪ್ರಕಟಿತ ಕೃತಿಗಳು. ಸಂಚಿ ಎಂಬ ಆತ್ಮಕತೆಯನ್ನು ಬರೆದಿದ್ದಾರೆ."
