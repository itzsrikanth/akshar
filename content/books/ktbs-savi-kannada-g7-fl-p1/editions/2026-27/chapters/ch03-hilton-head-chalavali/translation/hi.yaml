  exercise-B: 'आ. दो-तीन वाक्यों में उत्तर दीजिए।'
  exercise-C: 'इ. रिक्त स्थान भरिए।'

intro-1: 'कोई भी वस्तु हो, जब वह हमारे पास होती है तब उसका मूल्य नहीं पता चलता। जब खो जाती है तब पता चलता है वह कितनी अमूल्य थी। परिवेश के विषय में भी यही सच है।'

story-n1: '1986 में अमेरिका जाने का प्रसंग आया। वहाँ रहते हुए अपने छोटे भाई बाबू के साथ अटलांटिक महासागर में हिल्टन हेड नामक द्वीप गए।'

story-n8: 'यह लिबर्टी ओक वृक्ष है। पचास के दशक में पर्यावरण रक्षा के लिए लोग यहीं एकजुट होकर प्रण लिए थे। यह संरक्षित स्थान है।'

competency: 'कौशल: सुनना। सामर्थ्य: समूह गतिविधियों के निर्देश सुनकर समझना और प्रतिक्रिया देना। आशय: वर्तमान में पर्यावरण की रक्षा हम सबका प्रधान कर्तव्य होना चाहिए।'

author-1: 'शशिधर विश्वामित्र 1940 में मैसूर में जन्मे। क्षयरोग से संबंधित विभिन्न संस्थाओं में कार्य किया। ‘संचि’ नामक आत्मकथा लिखी।'

