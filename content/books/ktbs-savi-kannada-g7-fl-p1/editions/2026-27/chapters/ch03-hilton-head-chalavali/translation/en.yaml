intro-1: 'Whatever the thing may be, while it is with us we do not know its worth. When we lose it, we realize how precious it was. This is true of the environment too. When the environment is fine and nature beautiful we do not notice much. But when nature is ruined and polluted we begin to repent. At Hilton Head, when violence against nature began, only after many days did the locals wake up. They struggled for their nature. The Hilton Head environmental movement is not small for any movement; it suggests that a movement is judged great or small by its purpose, not its size.'

story-n1: 'In 1986 there came an occasion to go to America. While there, with my younger brother Babu we went to an island called Hilton Head in the Atlantic Ocean along America’s east coast. Surrounded by the Atlantic, Hilton Head is truly a beautiful little island. To reach it by road there is a huge six-lane bridge. In a time when forest was sovereign over the land, local Amerindians lived on this island too. After Europeans arrived the Amerindians were wiped out, and then Hilton Head island too became the whites’.'

story-n2: 'On this island with good climate Europeans cut forest and turned it into gardens growing indigo and other crops. Even so there were enough oak trees here and there. There were coastal plants. As days passed income from plantation fell; with year-round good climate, shore and a good harbour, perhaps it seemed profitable to remove plantations and raise resorts, golf courses, playfields, boating and so on.'

story-n3: 'In America, land of the wealthy, there are plenty who encourage such ideas. In the sixties these reforms were carried out and instead of plantations, sea-beach hotels, stay-homes, golf courses, and for hotels gardens, scrub, backwaters, ponds and forests began to be cut. As the nuisance of luxury incarnations grew, so did the rush of moneyed fans arriving by car, plane and helicopter in boots, shorts, T-shirts, cooling glasses and skullcaps.'

story-n4: 'Some environment lovers there felt such encroachment was wrong. They together began a movement that the ancient plant wealth, old ponds, backwaters, oak groves, coastal plants and forest trees must not be cut. But before heroes with money and bulldozers their hands did not succeed. The golf courses and recreation spots were so fine that famous people came for fun. Even American presidents have come for golf.'

story-n5: 'When money and wealth set back environmental movements, some interested people began thinking of climbing the court steps. Somehow one local ruler also got a mind for environment’s joys and sorrows. He joined the environment-interested and began a movement that coastal plant wealth, old ponds and oak trees must not be cut. But the wealthy did not bend. Without choice they climbed the steps of courts and offices.'

story-n6: 'In this struggle gradually public opinion leaned toward the environment. The engineering devotion shown to roads, buildings, stadiums and bridges began to be shown also to environmental beauty, plants, trees, shore flora and ponds. Consultations happened with the resolve that the island’s beauty should grow by protecting land so that soil, water and forest wealth increase. City development work continued. As a result, in four years Hilton Head began to shine like a garden with trees, plants, ponds and shore plants. Among them places for sport appeared. Presidents coming to play on the golf course shining like emerald also became ordinary.'

story-n7: 'Wandering all day happily, climbing the ancient lighthouse on the shore, we too enjoyed seeing the Atlantic Ocean, ships on the sea, sea crows, and ravens and mynas that came down to our side.'

story-n8: 'After coming down, suddenly on one side of a snake-winding backwater channel, in the middle of a round platform, we saw a large oak tree. Wondering what it was we went there. It was an old oak; under it they had dug lightly and spread thick manure and wood chips. A railing was built around so no one would step in. This is the Liberty Oak. In the fifties people united and vowed for environmental protection under this very tree. This is a protected place. A board said please do not enter inside the railing. Thus the tree was protected to live a hundred years. Later its fame spread so much that people who returned after seeing its presence became active in environmental protection in their own fields. Many marriages have taken place in this tree’s presence!'

competency: 'Skill: listening. Ability: listening to instructions for group activities, understanding and responding physically. Intent: Caught in the lure of civilization, man has been destroying beautiful environmental sites. Cutting trees and turning those places into trade, entertainment and sports sites, our environmental sites are declining. The struggles environmentalists have carried on from the beginning to stop violence against nature are unforgettable. In the present situation protecting the environment should become the foremost duty of us all—this is the main intent of this lesson.'

author-1: 'Shashidhara Vishwamithra was born in Mysore in 1940. After graduating from Central College he began his career as a researcher at the Government of India’s National Tuberculosis Institute. He has worked in various posts in institutions related to tuberculosis. Khila, Pada Kusiye Nelavihude, Hindu Dharma, Srishtiya Rangadalli are some of his published works. He has written an autobiography called Sanchi.'

