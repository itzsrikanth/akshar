ex-a-q1: hilṭan hèḍ dvīpa yāva sāgaradallidè?
ex-a-q2: amèrikadalli vāsavāgidda mūlanivāsigaḻannu enènnuttārè?
ex-a-q3: hilṭan hèḍnalli baṃdiḻiyuva śrīmaṃtara uḍugè tòḍugè hegittu?
ex-a-q4: hilṭan hèḍ dvīpadalli enenu krīḍègaḻannu āyojisalāguttittu?
ex-a-q5: kaḍalataḍiya laiṭhausanneridarè yāva citraṇavu kāṇasiguttadè?
ex-a-q6: hilṭan hèḍnalliruva smāraka yāvudu?
ex-b-q1: yuropiyannaru baṃda melè hilṭan hèḍnalli enenu badalāvaṇègaḻādavu?
ex-b-q2: hilṭan hèḍ mòdalu hegittu?
ex-b-q3: hilṭan hèḍna smāraka marada baggè vivarisi.
ex-b-q4: hilṭan hèḍ dvīpadalli enenu kaṭṭaḍagaḻu nirmāṇagòṃḍavu?
ex-b-q5: hilṭan hèḍnalli parisara horāṭa hegè prāraṃbhavāyitu?
ex-c-q1: yuropiyannara āgamanavāda melè amèriṃḍiyannara samudāyavu ________ āyitu. (abhivṛddhi, śikṣita, dhūḻīpaṭa)
ex-c-q2: aṭlāṃṭik sāgaravu amèrikada ______ bhāgadallidè. (pūrva, uttara, paścima)
ex-c-q3: vidhiyilladè kònègè _____ mòrè hogabekāyitu. (dhanikara, amèrikādhyakṣara, nyāyālayada)
ex-c-q4: kaṭṭaḍagaḻigè toruttidda ________ śraddhèyanne jana parisarakkū nīḍatòḍagidaru. (pāraṃparika, abhiyaṃtara, rājakīya)
ex-c-q5: dvīpada sauṃdaryavannu hèccisikòḻḻalu mòdalu èllarū seri __________ naḍèsidaru. (maṃtrālocanè, jāthā, pratibhaṭanè)
ex-c-q6: horāṭa muṃduvarida baḻika hilṭan hèḍ _________ kaṃgòḻisatòḍagitu. (rājadhāniyaṃtè, naṃdanavanadaṃtè, abhayāraṇyadaṃtè)
