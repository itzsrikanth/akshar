intro-1: यावुदे वस्तुविरलि, अदु नम्म बळि इद्दाग अदर बॆलॆ तिळियुवुदिल्ल. अदन्नु नावु कळॆदुकॊंडाग, अदॆष्टु अमूल्यवाद वस्तुवागित्तॆंबुदु अरिविगॆ बरुत्तदॆ. परिसरद विषयदल्लू इदु निज. परिसरवु चॆन्नागिद्दाग, प्रकृतियु रमणीयवागिद्दाग अदन्नु नावु अष्टेनू गमनिसुवुदिल्ल. अथवा गमनिसिदरू अदु विशेषवाद संगति ऎंदु नमगन्निसुवुदिल्ल. आदरॆ प्रकृति हाळादाग, प्रदूषणॆगॆ ऒळगादाग नावु परितपिसतॊडगुत्तेवॆ. हिल्टन् हॆड्नल्लि हागॆ प्रकृतिय मेलॆ दौर्जन्य नडॆयलु शुरुवागि हलवु दिनगळ नंतरवष्टे स्थळीयरु जाग्रतरादरु. तम्म प्रकृतिगागि अवरु होराट कैगॊंडरु. हिल्टन् हॆड्न परिसर चळवळियु यावुदे चळवळिगू सण्णदल्ल; चळवळियु अदर गात्रदिंदल्ल बदलिगॆ उद्देशदिंद दॊड्डदो चिक्कदो ऎंदु परिगणिसल्पडुत्तदॆ ऎंबुदन्नु सूचिसुत्तदॆ.
story-n1: 1986रल्लि अमॆरिकागॆ होगुव प्रसंगवायितु. अल्लिरुवाग नन्न तम्म बाबुविनॊडनॆ अमॆरिकाद पूर्व समुद्र तीरक्कंटिदंतॆ अट्लांटिक् सागरदल्लिरुव हिल्टन् हॆड् ऎन्नुव ऒंदु द्वीपक्कॆ होदॆवु. सुत्त अट्लांटिक् सागर हरडिरुव हिल्टन् हॆड् निजक्कू सुंदरवाद पुट्टद्वीप. रस्तॆयिंद अदन्नु तलुपलु आरु लेनिन भारि सेतुवॆ इदॆ. काडे नाडिगॆ सार्वभौमवागिद्दंथ ऒंदु कालदल्लि ई द्वीपदल्लू स्थळीय अमॆरिंडियन्नरु वासवागिद्दरु. युरोपियन्नर आगमनवाद मेलॆ अमॆरिंडियन्नर धूळीपटवायितु, आग हिल्टन् हॆड् द्वीपवू बिळियरदायितु.
story-n2: ऒळ्ळॆय हवॆ इरुव ई द्वीपदल्लि काडु कडिदु नीलि नंतर इन्नितर बॆळॆगळन्नु बॆळॆयुव तोटगळन्नागि युरोपियन्नरु परिवर्तिसिबिट्टरु. आदरू अल्लल्लि बेकादष्टु ओक् मरगळू इद्दवु. कडलतीरद सस्यगळिद्दवु. दिन कळॆदंतॆ तोटतुडिकॆयिंद वरमान कडिमॆ; वर्षविडी उत्तम हवॆ, कडलतीर, ऒळ्ळॆय बंदरु इरुव ई द्वीपदल्लि तोटतुडिकॆगळन्नु तॆगॆदु रॆसार्टुगळु, गाल्फ् कोर्सुगळु, क्रीडामैदानगळु, बोटिंग् इत्यादिगळन्नॆब्बिसिदरॆ लाभ ऎन्निसितेनो.
story-n3: साहुकारर नाडाद अमॆरिकदल्लि इंथ ऐडियागळिगॆ प्रोत्साह कॊडुववरु बेकादष्टु जन. अरवत्तर दशकदल्लि ई सुधारणॆगळु जारिगॊंडु तोटतुडिकॆगळ बदलु सीबीच् होटॆल्गळु, स्टेहोंगळु, गाल्फ्कोर्स्गळु, होटॆल्गळिगागि तोट, तुडिकॆ, हिन्नीर कोवुगळु, हॊंडगळु, काडु कॊच्चतॊडगिदरु. लक्सुरिय नवावतारगळ आहुट हॆच्चिदष्टू कारु, प्लेनु, हॆलिगळल्लि बंदिळियुव बूटु, चॆड्डि, टीशर्टु, कूलिंग्ग्लास्, स्कल्क्यापु तॊट्ट दुड्डुळ्ळ अभिमानिगळ भराटॆयू हॆच्चतॊडगितु.
story-n4: ई रीतिय अतिक्रमण सल्लदु ऎंदु अल्लिय कॆलवरादरू पर्यावरणाभिमानिगळिगॆ अन्निसितेनो. अवरुगळू कूडि इल्लिन पुरातन सस्यसंपत्तु, हळॆय कालद हॊंडगळु, हिन्नीरिन कोवुगळु, ओक्मर तोपुगळु, कडलतीरद सस्यगळु मत्तु काडिन मरगळन्नु तरियलेकूडदु ऎन्नुव चळवळियन्नु आरंभिसिदरु. आदरू दुड्डु बुल्डोजरुळ्ळ वीरर मुंदॆ इवर कैसागलिल्ल. इल्लिन गाल्फ् कोर्सुगळु, क्रीडाविनोदगळॆडॆगळु ऎष्टु चॆन्नागिद्दवॆंदरॆ प्रसिद्धरु मोजिगॆ बरुत्तिद्दरु. अमॆरिकद प्रॆसिडॆंटरू गाल्फ्गॆ बंदद्दुंटु.
story-n5: दुड्डु मत्तु दौलत्तुगळिंद पर्यावरणद चळुवळिगळिगॆ हिन्नडॆ आगतॊडगिदाग कॆलवु आसक्तरु कोर्टिन मॆट्टिलिगेरुव आलोचनॆ माडतॊडगिदरु. आग हेगो ऒब्ब नॆलदळ्ळाळिगॆ पर्यावरणद सुखदुःखगळिगू मनस्सु कॊडुव इंबायितु. अवनू पर्यावरणद आसक्तरॊडनॆ कूडिकॊंडु कडल तीरद सस्यसंपत्तु हळॆय कालद हॊंडगळु, ओक् मरगळन्नु हॊडॆदु तरियले कूडदु ऎन्नुव चळवळि आरंभिसिद. आदरॆ साहुकाररु बग्गलिल्ल. इवरु विधियिल्लदॆ कोर्टु कचेरिगळ मॆट्टिलेरिदरु.
story-n6: ई हॊय्दाटदल्लि क्रमेण जनसम्मति पर्यावरणदत्त ऒलियितु. रस्तॆ, कट्टड, क्रीडांगण, सेतुवॆगॆ तोरुत्तिद्द अभियंतर श्रद्धॆयन्ने परिसर सौंदर्य, गिड, मर, तटसस्य संकुल, हॊंडगळिगू तोरिसतॊडगिदरु. स्थळद नॆल जल वन संपत्तु हॆच्चुवंतॆ नॆलवन्नु कापिट्टुकॊंडु द्वीपद सौंदर्यवन्नु हॆच्चिसिकॊळ्ळबेकु ऎन्नुव दीडिनल्लि मंत्रालोचनॆगळादवु. पुराभिवृद्धि कार्य हागॆये जरुगतॊडगितु. परिणामवागि, नाल्कारु वर्षगळल्लि हिल्टन् हॆड् नंदनवनदंतॆ मर, गिड, हॊंड, तीरद सस्यगळिंद कंगॊळिसतॊडगितु. अवुगळ नडुवॆ क्रीडॆगॆ ऎडॆगळादवु. प्रॆसिडॆंटरू पच्चॆयंतॆ हॊळॆयुव इल्लिय गाल्फ् कोर्सिगॆ आडलु बरुवुदू साधारणवायितु.
story-n7: दिनविडी सुत्ताडि संतोषपट्टु कडलतडिय पुरातन लैट्हौसन्नेरि अट्लांटिक् महासागर, समुद्रदल्लोडाडुत्तिद्द नौकॆगळु, कडल कागॆगळु, नम्म बड्डॆगे बंदिळियुव रेवन्, मैनागळन्न नोडि नावू आनंदिसिदॆवु.
story-n8: अल्लिंद कॆळगिळिद मेलॆ अकस्मात्तागि हावु बळुकिन हिन्नीरिन दॊणॆय ऒंदु बदियल्लि दुंडनॆय वेदिकॆय नडुवॆ ऒंदु दॊड्ड ओक् मरवन्नु कंडॆवु. अदेनॆंदु अल्लिगॆ होदॆवु. अदॊंदु हळॆय ओक् मर; अदरडि तॆळ्ळगॆ अगॆत माडि दप्प गॊब्बर, मरद चॆक्कॆ हरडिद्दरु. यारू कालिक्कदंतॆ परिधिय सुत्तलू कटकटॆ कट्टिद्दरु. इदु लिबर्टि ओक् मर. ऐवत्तर दशकदल्लि परिसर रक्षणॆगागि जन ऒग्गूडि पणतॊट्टिद्दु ई मरदल्लिये. इदु संरक्षित जाग. दयविट्टु कटकटॆय ऒळगॆ प्रवेशिसबेडि ऎन्नुव फलकवन्नु नॆट्टिद्दरु. हीगॆ आ मर नूरुकाल बाळुवंतॆ रक्षितवागित्तु. नंतरद कालदल्लि ई मरद प्रसिद्धि ऎष्टु हरडितॆंदरॆ इदर सान्निध्यवन्नु कंडु मरळिद जन तंतम्म क्षेत्रगळल्लि पर्यावरण रक्षणॆयल्लि चुरुकुगॊंडरु. ई मरद सान्निध्यदल्लि ऎष्टो विवाहगळागिवॆयंतॆ!
competency: 'कौशल: आलिसुवुदु. सामर्थ्य: गुंपु चटुवटिकॆगळ निर्देशनगळन्नु आलिसि, अर्थमाडिकॊंडु आंगिकवागि प्रतिक्रियिसुवुदु. आशय: मनुष्यनु नागरीकतॆय व्यामोहक्कॆ सिलुकि सुंदरवाद परिसर ताणगळन्नु नाशमाडुत्ता बंदिद्दानॆ. मरगिडगळन्नु कत्तरिसि आ जागगळन्नु व्यापार, मनरंजना, क्रीडा ताणगळन्नागि परिवर्तिसुत्तिरुवुदरिंद नम्म परिसर ताणगळु अधोगतियन्नु काणुत्तिवॆ. प्रकृतिय मेलॆ नडॆयुत्तिरुव दौर्जन्यवन्नु तडॆगट्टलु परिसरवादिगळु मॊदलिनिंदलू नडॆसुत्तिरुव होराटगळु अविस्मरणीय. प्रस्तुत सन्निवेशदल्लि परिसरवन्नु संरक्षणॆ माडबेकागिरुवुदु नम्मॆल्लर आद्य कर्तव्यवागबेकु ऎंबुदु ई पाठद मुख्य आशय.'
author-1: शशिधर विश्वामित्र 1940रल्लि मैसूरिनल्लि हुट्टिदरु. सॆंट्रल् कालेजिनल्लि पदवीधरराद मेलॆ भारत सरकारद राष्ट्रीय क्षयरोग संस्थॆयल्लि संशोधकरागि वृत्तिजीवन प्रारंभिसिदरु. क्षयरोगक्कॆ संबंधिसिद विविध संस्थॆगळल्लि, विविध हुद्दॆगळल्लि कार्यनिर्वहिसिद्दारॆ. खिल, पद कुसियॆ नॆलविहुदॆ, हिंदू धर्म, सृष्टिय रंगवल्लि- मुंतादवु इवर कॆलवु प्रकटित कृतिगळु. संचि ऎंब आत्मकतॆयन्नु बरॆदिद्दारॆ.
