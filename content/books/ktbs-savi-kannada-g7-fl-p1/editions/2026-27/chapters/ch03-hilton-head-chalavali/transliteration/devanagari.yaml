ex-c-q3: विधियिल्लदॆ कॊनॆगॆ _____ मॊरॆ होगबेकायितु. (धनिकर, अमॆरिकाध्यक्षर, न्यायालयद)
ex-c-q4: कट्टडगळिगॆ तोरुत्तिद्द ________ श्रद्धॆयन्ने जन परिसरक्कू नीडतॊडगिदरु. (पारंपरिक, अभियंतर, राजकीय)
ex-c-q5: द्वीपद सौंदर्यवन्नु हॆच्चिसिकॊळ्ळलु मॊदलु ऎल्लरू सेरि __________ नडॆसिदरु. (मंत्रालोचनॆ, जाथा, प्रतिभटनॆ)
ex-c-q6: होराट मुंदुवरिद बळिक हिल्टन् हॆड् _________ कंगॊळिसतॊडगितु. (राजधानियंतॆ, नंदनवनदंतॆ, अभयारण्यदंतॆ)
