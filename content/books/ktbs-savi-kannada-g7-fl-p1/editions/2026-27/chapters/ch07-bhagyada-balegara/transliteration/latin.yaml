intro-1: śālèyalli nāḍa habbada saṃbhrama. yāva yāva manoraṃjanā kāryakrama nīḍabekèṃdu makkaḻalli carcè prāraṃbhavāyitu. hāḍu, nāṭaka, nṛtya, prahasana hīgè paṭṭi bèḻèyitu. pūrṇimāḻa guṃpigè nṛtyamāḍuva javābdāri nīḍalāyitu. yāva nṛtya èṃdāga janapada nṛtya èṃdu śruti heḻidaḻu. araviṃda sinèmā hāḍigè nṛtya māḍoṇa èṃda. ādarè uḻidavaru òppalilla. nammalli bagèbagèya hāḍugaḻivè, haḻḻiya jana prītiyiṃda adannu racisiddārè. adaralli sògasāda bhāṣè idè. tuṃbā arthavū iruttadè. rāga hākalū cèṃda èṃba mātugaḻu keḻibaṃdavu. makkaḻu abhyāsamāḍi òṃdu janapada nṛtyavannu pradarśana māḍidaru. èllarū adara sògasannu mèccidaru. halavu dinagaḻu halavara bāyalli ā nṛtyada hāḍugaḻu gunuguḍuttiddavu.
poem-s1l1: bhāgyada baḻègāra hogi bā nantavarigè ||
poem-s1l2: ninna tavarūra nānenu ballènu
poem-s1l3: gòttilla ènagè guriyilla èlè bālè
poem-s1l4: torisu bāre tavarūra
