poem-s6l4: bhāgyada baḻègāra hogi bā nantavarīgè
competency: 'kauśala: mātanāḍuvudu. sāmarthya: nāṇṇuḍi, nuḍigaṭṭu, gādègaḻannu baḻasi mātanāḍuvudu. āśaya: baḻègāra ūriṃdūru tirugi baḻègaḻannu māruttānè. hattāru ūrugaḻa, halavu janara paricaya avanigiruttadè. ī gītèyalli tanna tāyigè baḻègaḻèṃdarè iṣṭa. adannu kòṃḍuhogalu baḻègāranigè heḻuva hèṇṇina mattu praśnè keḻuva baḻègārana saṃbhāṣaṇè ī gītèyallidè. tāyiya manèya dāriyannu hèṇṇumagaḻu tiḻisuva rītiyalli sògasidè. haḻḻiya manèya mattu parisarada suṃdaravāda citraṇavidè. tanna tavarina bagègè magaḻigè apāra prītiyidè.'
