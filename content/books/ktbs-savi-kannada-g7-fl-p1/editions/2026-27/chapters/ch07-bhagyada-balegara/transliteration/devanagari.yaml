competency: 'कौशल: मातनाडुवुदु. सामर्थ्य: नाण्णुडि, नुडिगट्टु, गादॆगळन्नु बळसि मातनाडुवुदु. आशय: बळॆगार ऊरिंदूरु तिरुगि बळॆगळन्नु मारुत्तानॆ. हत्तारु ऊरुगळ, हलवु जनर परिचय अवनिगिरुत्तदॆ. ई गीतॆयल्लि तन्न तायिगॆ बळॆगळॆंदरॆ इष्ट. अदन्नु कॊंडुहोगलु बळॆगारनिगॆ हेळुव हॆण्णिन मत्तु प्रश्नॆ केळुव बळॆगारन संभाषणॆ ई गीतॆयल्लिदॆ. तायिय मनॆय दारियन्नु हॆण्णुमगळु तिळिसुव रीतियल्लि सॊगसिदॆ. हळ्ळिय मनॆय मत्तु परिसरद सुंदरवाद चित्रणविदॆ. तन्न तवरिन बगॆगॆ मगळिगॆ अपार प्रीतियिदॆ.'
