intro-1: शालॆयल्लि नाड हब्बद संभ्रम. याव याव मनोरंजना कार्यक्रम नीडबेकॆंदु मक्कळल्लि चर्चॆ प्रारंभवायितु. हाडु, नाटक, नृत्य, प्रहसन हीगॆ पट्टि बॆळॆयितु. पूर्णिमाळ गुंपिगॆ नृत्यमाडुव जवाब्दारि नीडलायितु. याव नृत्य ऎंदाग जनपद नृत्य ऎंदु श्रुति हेळिदळु. अरविंद सिनॆमा हाडिगॆ नृत्य माडोण ऎंद. आदरॆ उळिदवरु ऒप्पलिल्ल. नम्मल्लि बगॆबगॆय हाडुगळिवॆ, हळ्ळिय जन प्रीतियिंद अदन्नु रचिसिद्दारॆ. अदरल्लि सॊगसाद भाषॆ इदॆ. तुंबा अर्थवू इरुत्तदॆ. राग हाकलू चॆंद ऎंब मातुगळु केळिबंदवु. मक्कळु अभ्यासमाडि ऒंदु जनपद नृत्यवन्नु प्रदर्शन माडिदरु. ऎल्लरू अदर सॊगसन्नु मॆच्चिदरु. हलवु दिनगळु हलवर बायल्लि आ नृत्यद हाडुगळु गुनुगुडुत्तिद्दवु.
