ex-a-q2: 'माँ का घर कैसा है?'

ex-a-q3: 'छप्पर के बीच माँ कौन-सा खेल खेलती है?'

ex-a-q4: 'हडेदव्वा को किस रंग की चूड़ी चाहिए?'

