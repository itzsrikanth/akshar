intro-1: 'स्कूल में नाड हब्ब का उत्सव। लोकनृत्य करने का निर्णय हुआ। बच्चों ने अभ्यास कर लोकनृत्य प्रस्तुत किया।'

poem-s1l1: 'भाग्यवान चूड़ीवाले, जा मेरे ननियाल आ ||'

competency: 'कौशल: बोलना। आशय: चूड़ी बेचने वाला गाँव-गाँव घूमता है। इस गीत में माँ के लिए चूड़ियाँ चाहने वाली बेटी और प्रश्न पूछते चूड़ीवाले का संवाद है।'

