labels:
  story: पूरक पाठ
  author: कृतिकारर परिचय
  exercise-A: अ. ई कॆळगॆ कॊट्टिरुव प्रश्नॆगळिगॆ ऒंदु वाक्यदल्लि उत्तरिसि.
story-n1: शरण पंथदल्लि प्रमुखरॆंदरॆ बसवण्णनवरु. अवर जीवनवॊंदु अमर ज्योति. अदर दिव्यप्रभॆयल्लि हलवारु शतमानगळ कोट्यंतर मुमुक्षुगळु सन्मार्गवन्नु कंडुकॊंडु कृतार्थरागिद्दारॆ. कन्नड-साहित्य क्षेत्रदल्लंतू आ जीवज्योतिय प्रभाव अष्टिष्टल्ल.
story-n2: बागेवाडिय मादिराजनॆंब सद्विप्रन धर्मपत्नि मादांबॆय गर्भदल्लि बसवण्णनवरु चिप्पिनल्लि मुत्तू कॊळदल्लि कमलवू केदिगॆयल्लि परिमळवू हुट्टुवंतॆ शिवन शिशुवागि जनिसिदरु. आ बसवशिशु सुमुहूर्तवे गंडुरूपादंतॆ इत्तु. आ मगु हॆत्तवरिगॆ मुद्दागि, ऎत्तिकॊंडवरिगॆ सुखद संपत्तागि बॆळॆयितु. एळॆंटर वयस्सिनल्लि उपनयनवायितु. उपनयनवाद ऎरडु वर्षगळल्लि बसवण्णनवर तंदॆतायिगळिब्बरू सत्तु होदरु. तब्बलियाद बसवण्णनवरु आरु वर्षगळ काल तम्म मुत्तज्जिय रक्षणॆयल्लिद्दरु. अवरु हदिनारु वर्षद हरॆयदल्लि तम्म यौवनवु शिवपूजॆयल्लि सवॆयबेकॆंदू, आदरॆ शिवभक्तियू कर्मवू ऎंदू ऒंदागिरदॆंदू निश्चयिसि, परम वैराग्यमूर्तियागि, कर्मलतॆयंतिद्द जनिवारवन्नु कळॆदु बिसुटु, होतिन गंटलन्नु बिगियुवंतिद्द मौंजियन्नु हरिदु बिसुटु, नव्यदुकूलवन्नु तॆगॆदुट्टु, दिव्यवस्त्रवन्नु हॊद्दु, मनॆय नॆळलन्नु नॆनॆयदॆ, ऐश्वर्यवन्नु लॆक्किसदॆ, वृत्तियन्नु विचारिसदॆ, बंधुबळगवन्नु बगॆयदॆ, ऊरिनवरन्नू नोडदॆ बागेवाडियन्नु बिट्टु हॊरटरु. पूर्वदिक्किगॆ नडॆदु, स्वल्प दूरदल्ले इद्द मलप्रहरि-कृष्णवेणी नदिगळ संगम स्थानदल्लि कूडल संगमेश्वरनिरुव कप्पडिय संगमवन्नु तलुपुवरु.
story-n3: अण्णनवरु चिंतन माडुत्त कुळितिरलु कूडलसंगमद स्थानपतिगळाद ईशानगुरुगळु बंदु आ बसवण्णनवर योग-निद्रामुद्रित अर्धनिमीलित नयनगळन्नु कंडु, कारणिकनिरबेकॆंदु निश्चयिसि, बळिसारि “अय्य, नीनॆल्लिगू होगबेड, एनन्नू चिंतिसबेड, संगमेश्वरनिगॆ हॊस हूवुगळन्नू तिळियग्गवणियन्नू तंदु नित्यवू पूजॆमाडि प्रसाद कायकनागि सुखवागिरु” ऎन्नुवरु. आ मातिगॆ बसवण्णनवरु ऒप्पि, श्री कूडल संगमेश्वर पादकमलदल्लि तुंबियागिद्दरु.
story-n4: कप्पडि संगमदल्लिये संगमेश्वरन पादसेवॆ माडिकॊंडिरुव आशॆ बसवण्णनवरिगॆ. आदरॆ इरगॊड संगमेश्वर. मंगळवाडक्कॆ होगॆंदु मत्तॆ मत्तॆ ऒत्ताय माडिदंतॆ भासवायितु. बसवण्णनवरु होगलारदॆ विरहवेदनॆयिंद नॊंदु, “आगलि संगनु ननगंतू पूजिसिकॊंडिरलु अवकाश कॊडुत्तिल्ल. मंगळवाडक्कॆ होगॆंदु सदा नन्नन्नु पीडिसुत्तिरुवनु, अवन मातिन प्रकार होगि नोडुत्तेनॆ. हेगिद्दरू अपरिचित देशवॆंदु हॆदरबेकागिल्ल, अक्षरज्ञानविदॆ. अदन्ने मारि, बंद हणदिंद शिवभक्तरिगॆ सेवॆ सल्लिसुवॆनु, प्रसादवन्नु पडॆयुवॆनु” ऎंदु निर्धरिसिदरु.
story-n5: बसवण्णनवरिगॆ संगन करुणवे बॆंबलवाय्तु, संगन ध्यानवे संगडवाय्तु. संगनाडिद मातुगळन्ने मत्तॆ मत्तॆ मनदॊळगॆ नॆनॆयुत्त, नडॆद आयासवन्नु मरॆतु, मंगळवाडवन्नु तलुपि, बिज्जळन अरमनॆय कडॆ नडॆदु, करणशालॆगॆ बंदु कुळितिद्दरु. आ समयक्कॆ सरियागि तन्न मेलॆ उळिदिरुव राजधनद विवरवन्नु केळलु अल्लिगॆ बंद भंडारि सिद्धदंडाधिपनु करणिकर तप्पु लॆक्कदिंद मोसहोगुत्तिदुद्दन्नु बसवण्णनवरु गमनिसि, मध्यॆ प्रवेशिसि, सरियाद लॆक्कवन्नु तोरिसि, आगुत्तिद्द अपार नष्टदिंदलू संभविसुत्तिद्द राजाग्रहदिंदलू सिद्धदंडाधिपनन्नु पारुमाडुवरु. गणित शास्त्रदल्लि असदृश नैपुण्यवन्नु प्रदर्शिसिद युवकनाद बसवण्णनवर मेलॆ सिद्धदंडाधिपनिगॆ ममतॆ बंदु, अवरन्नु करॆतंदु, राजनिगॆ काणिसि, भंडारक्कॆ मरिभंडारियन्नागि नेमिसिकॊळ्ळुवनु. वर्षक्कॆ नूरॊंदु हॊन्नु निगदियायितु.
story-n6: काल गतिसितु. सिद्धदंडनायकनु कायिलॆ बिद्दु कैलासवासियादनु. बसवण्णनवरु सिद्धदंडनायकन अंत्य संस्कारवन्नु नॆरवेरिसि, निर्वेगदिंद बंदु बिज्जळनन्नु कंडु, “सिद्धदंडाधिपनु गंडु मक्कळिल्लदॆ कालाधीननाद. ननगीग एनू तोचदागिदॆ. बुद्धिगॊडबेकु” ऎंदु केळिकॊंडनु. आग बिज्जळनु - “आतन आळु कुदुरॆ समस्त वित्तवू निन्नदे. निन्न बरुविकॆयिंद नन्न भंडारवू हॆच्चितु. इन्नु मेलॆ नन्न देशक्कू कोशक्कू नीने अधिकारि” - ऎंदु बसवण्णनवरिगॆ ऒंदु पट्टावळियन्नु उडुगॊरॆयागि कॊट्टु, इन्नॊंदन्नु बाळॆंदु हरसि कॊट्टनु - अवरन्नु कटकमकुटगळिंद सिंगरिसि, पट्टदानॆय मेलॆ कुळ्ळिरिसि - श्वेतच्छत्रवन्नु हिडिसि, पुरद केरिगळॊळगॆ मॆरॆसिदनु. अंदिनिंद बसवण्णनवरु “बसवदंडनाथ”, “भंडारि बसव” ऎनिसिदरु.
story-n7: बसवण्णनवर वचनगळल्लिन भावतीव्रतॆ, एकाग्रतॆ मत्तु आत्मीयतॆ प्रशंसनीयवू, प्रसिद्धवू आगिदॆ! ई अनघ्र्यगुणगळ शतांशवु सिद्धराम, अक्कमहादेवि मुंताद कॆलवर वचनगळल्लिरुवुदरिंदले, अवु उत्तम भावगीतॆगळॆनिसिकॊंडिवॆ. अंबिगर चौडय्यन वचनगळल्लि विडंबनॆयिरबहुदु, नगॆय मारितंदॆय वचनगळल्लि हॊगॆयाडुव नगॆयिरबहुदु, प्रभुदेवर वचनगळल्लि दर्शनविशुद्धियिरबहुदु, चॆन्नबसवण्णनवर वचनगळल्लि विचारधारॆयिरबहुदु, अक्कन वचनगळल्लि मधुरभावविरबहुदु, मिक्क वचनकाररल्लि अवरवर अनुभवानुगुण भावाभिव्यक्तियिरबहुदु. आदरॆ बसवण्णनवरॊब्बर वचनगळल्ले ई ऎल्लवू इद्दु, मेलॆ भक्तिरसक्कॆ पोषकवागि - शक्तिदायवागि मिक्कॆल्ल रसगळ लीलॆयू नडॆदिरुवुदु.
story-n8: सामाजिक मत्तु मतीय संकुचित गणनॆय दुष्परिणामवागि मानवकुलदल्लि तलॆदोरुव मेलु-कीळॆंब विंगडणॆयन्नु बसवण्णनवरु मान्य माडलिल्ल. प्रांत-प्रदेशवागलि, विद्यॆ-पदवियागलि, धन-धान्यवागलि, कॊनॆगॆ प्रकृतिसिद्धवाद हॆण्णु-गंडॆंब भेदवागलि मानवरन्नु विभजिसि, छिन्न-भिन्नगॊळिसि, प्रत्येकिसुवुदन्नु अवरु सहिसलिल्ल. अदक्कॆ बदलागि जनरल्लि ऒग्गट्टन्नू ऒडनाटवन्नू - इवन्नु अभिवृद्धिगॊळिसुवंतह धर्मवन्नु बोधिसिदरु. ई कारणदिंदले, बसवण्णनवरु बोधिसिद धर्मद जीवाळ दान-दयॆ-निराडंबर-विनय-भक्ति-दुडिमॆ, निष्कामकर्म मत्तु सरळजीवन. ऒट्टिनल्लि मनुकुलवॆल्ल ऒंदॆंब भावदिंद परस्पर हित-अभिवृद्धिगागि बाळबेकॆंबुदे अवर दर्शनसार.
author-1: डा. ऎल्. बसवराजु अवरु 1919 रल्लि कोलार जिल्लॆय ऎडगूरु ग्रामदल्लि जनिसिदरु. इवरु वृत्तियिंद प्राध्यापकरु. शिवदास गीतांजलि, बसवण्णनवर वचनगळु, भासन भारत रूपक, अल्लमन वचनगळु मॊदलाद कृतिगळन्नु रचिसिद्दारॆ. श्रीयुतरिगॆ पंप प्रशस्ति, केंद्र साहित्य अकाडमि प्रशस्ति, बसव पुरस्कार, राज्योत्सव पुरस्कारगळन्नु नीडि गौरविसलागिदॆ. प्रस्तुत पाठवन्नु डा. ऎल्. बसवराजु अवरु संपादिसिद ‘बसवण्णनवर वचनगळु’ कृतिय पीठिकॆयिंद आय्द भागवागिदॆ.
ex-a-q1: बसवण्णनवर तंदॆ, तायियवर हॆसरेनु?
ex-a-q2: बसवण्णनवरु बागेवाडियन्नु बिट्टु ऎल्लिगॆ होदरु?
ex-a-q3: ईशान गुरुगळु बसवण्णनवरिगॆ एनु हेळिदरु?
ex-a-q4: बसवण्णनवर वचनगळु एकॆ प्रसिद्धवागिवॆ?
ex-a-q5: बसवण्णनवरु बोधिसिद धर्मद जीवाळ यावुदु?
