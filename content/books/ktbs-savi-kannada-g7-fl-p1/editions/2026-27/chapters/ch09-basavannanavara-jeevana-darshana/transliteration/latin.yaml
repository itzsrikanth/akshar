labels:
  story: pūraka pāṭha
  author: kṛtikārara paricaya
  exercise-A: a. ī kèḻagè kòṭṭiruva praśnègaḻigè òṃdu vākyadalli uttarisi.
story-n1: śaraṇa paṃthadalli pramukharèṃdarè basavaṇṇanavaru. avara jīvanavòṃdu amara jyoti. adara divyaprabhèyalli halavāru śatamānagaḻa koṭyaṃtara mumukṣugaḻu sanmārgavannu kaṃḍukòṃḍu kṛtārtharāgiddārè. kannaḍa-sāhitya kṣetradallaṃtū ā jīvajyotiya prabhāva aṣṭiṣṭalla.
story-n2: bāgevāḍiya mādirājanèṃba sadviprana dharmapatni mādāṃbèya garbhadalli basavaṇṇanavaru cippinalli muttū kòḻadalli kamalavū kedigèyalli parimaḻavū huṭṭuvaṃtè śivana śiśuvāgi janisidaru. ā basavaśiśu sumuhūrtave gaṃḍurūpādaṃtè ittu. ā magu hèttavarigè muddāgi, èttikòṃḍavarigè sukhada saṃpattāgi bèḻèyitu. eḻèṃṭara vayassinalli upanayanavāyitu. upanayanavāda èraḍu varṣagaḻalli basavaṇṇanavara taṃdètāyigaḻibbarū sattu hodaru. tabbaliyāda basavaṇṇanavaru āru varṣagaḻa kāla tamma muttajjiya rakṣaṇèyalliddaru. avaru hadināru varṣada harèyadalli tamma yauvanavu śivapūjèyalli savèyabekèṃdū, ādarè śivabhaktiyū karmavū èṃdū òṃdāgiradèṃdū niścayisi, parama vairāgyamūrtiyāgi, karmalatèyaṃtidda janivāravannu kaḻèdu bisuṭu, hotina gaṃṭalannu bigiyuvaṃtidda mauṃjiyannu haridu bisuṭu, navyadukūlavannu tègèduṭṭu, divyavastravannu hòddu, manèya nèḻalannu nènèyadè, aiśvaryavannu lèkkisadè, vṛttiyannu vicārisadè, baṃdhubaḻagavannu bagèyadè, ūrinavarannū noḍadè bāgevāḍiyannu biṭṭu hòraṭaru. pūrvadikkigè
  naḍèdu, svalpa dūradalle idda malaprahari-kṛṣṇaveṇī nadigaḻa saṃgama sthānadalli kūḍala saṃgameśvaraniruva kappaḍiya saṃgamavannu talupuvaru.
story-n3: aṇṇanavaru ciṃtana māḍutta kuḻitiralu kūḍalasaṃgamada sthānapatigaḻāda īśānagurugaḻu baṃdu ā basavaṇṇanavara yoga-nidrāmudrita ardhanimīlita nayanagaḻannu kaṃḍu, kāraṇikanirabekèṃdu niścayisi, baḻisāri “ayya, nīnèlligū hogabeḍa, enannū ciṃtisabeḍa, saṃgameśvaranigè hòsa hūvugaḻannū tiḻiyaggavaṇiyannū taṃdu nityavū pūjèmāḍi prasāda kāyakanāgi sukhavāgiru” ènnuvaru. ā mātigè basavaṇṇanavaru òppi, śrī kūḍala saṃgameśvara pādakamaladalli tuṃbiyāgiddaru.
story-n4: kappaḍi saṃgamadalliye saṃgameśvarana pādasevè māḍikòṃḍiruva āśè basavaṇṇanavarigè. ādarè iragòḍa saṃgameśvara. maṃgaḻavāḍakkè hogèṃdu mattè mattè òttāya māḍidaṃtè bhāsavāyitu. basavaṇṇanavaru hogalāradè virahavedanèyiṃda nòṃdu, “āgali saṃganu nanagaṃtū pūjisikòṃḍiralu avakāśa kòḍuttilla. maṃgaḻavāḍakkè hogèṃdu sadā nannannu pīḍisuttiruvanu, avana mātina prakāra hogi noḍuttenè. hegiddarū aparicita deśavèṃdu hèdarabekāgilla, akṣarajñānavidè. adanne māri, baṃda haṇadiṃda śivabhaktarigè sevè sallisuvènu, prasādavannu paḍèyuvènu” èṃdu nirdharisidaru.
story-n5: basavaṇṇanavarigè saṃgana karuṇave bèṃbalavāytu, saṃgana dhyānave saṃgaḍavāytu. saṃganāḍida mātugaḻanne mattè mattè manadòḻagè nènèyutta, naḍèda āyāsavannu marètu, maṃgaḻavāḍavannu talupi, bijjaḻana aramanèya kaḍè naḍèdu, karaṇaśālègè baṃdu kuḻitiddaru. ā samayakkè sariyāgi tanna melè uḻidiruva rājadhanada vivaravannu keḻalu alligè baṃda bhaṃḍāri siddhadaṃḍādhipanu karaṇikara tappu lèkkadiṃda mosahoguttiduddannu basavaṇṇanavaru gamanisi, madhyè praveśisi, sariyāda lèkkavannu torisi, āguttidda apāra naṣṭadiṃdalū saṃbhavisuttidda rājāgrahadiṃdalū siddhadaṃḍādhipanannu pārumāḍuvaru. gaṇita śāstradalli asadṛśa naipuṇyavannu pradarśisida yuvakanāda basavaṇṇanavara melè siddhadaṃḍādhipanigè mamatè baṃdu, avarannu karètaṃdu, rājanigè kāṇisi, bhaṃḍārakkè maribhaṃḍāriyannāgi nemisikòḻḻuvanu. varṣakkè nūròṃdu hònnu nigadiyāyitu.
story-n6: kāla gatisitu. siddhadaṃḍanāyakanu kāyilè biddu kailāsavāsiyādanu. basavaṇṇanavaru siddhadaṃḍanāyakana aṃtya saṃskāravannu nèraverisi, nirvegadiṃda baṃdu bijjaḻanannu kaṃḍu, “siddhadaṃḍādhipanu gaṃḍu makkaḻilladè kālādhīnanāda. nanagīga enū tocadāgidè. buddhigòḍabeku” èṃdu keḻikòṃḍanu. āga bijjaḻanu - “ātana āḻu kudurè samasta vittavū ninnade. ninna baruvikèyiṃda nanna bhaṃḍāravū hèccitu. innu melè nanna deśakkū kośakkū nīne adhikāri” - èṃdu basavaṇṇanavarigè òṃdu paṭṭāvaḻiyannu uḍugòrèyāgi kòṭṭu, innòṃdannu bāḻèṃdu harasi kòṭṭanu - avarannu kaṭakamakuṭagaḻiṃda siṃgarisi, paṭṭadānèya melè kuḻḻirisi - śvetacchatravannu hiḍisi, purada kerigaḻòḻagè mèrèsidanu. aṃdiniṃda basavaṇṇanavaru “basavadaṃḍanātha”, “bhaṃḍāri basava” ènisidaru.
story-n7: basavaṇṇanavara vacanagaḻallina bhāvatīvratè, ekāgratè mattu ātmīyatè praśaṃsanīyavū, prasiddhavū āgidè! ī anaghryaguṇagaḻa śatāṃśavu siddharāma, akkamahādevi muṃtāda kèlavara vacanagaḻalliruvudariṃdale, avu uttama bhāvagītègaḻènisikòṃḍivè. aṃbigara cauḍayyana vacanagaḻalli viḍaṃbanèyirabahudu, nagèya māritaṃdèya vacanagaḻalli hògèyāḍuva nagèyirabahudu, prabhudevara vacanagaḻalli darśanaviśuddhiyirabahudu, cènnabasavaṇṇanavara vacanagaḻalli vicāradhārèyirabahudu, akkana vacanagaḻalli madhurabhāvavirabahudu, mikka vacanakāraralli avaravara anubhavānuguṇa bhāvābhivyaktiyirabahudu. ādarè basavaṇṇanavaròbbara vacanagaḻalle ī èllavū iddu, melè bhaktirasakkè poṣakavāgi - śaktidāyavāgi mikkèlla rasagaḻa līlèyū naḍèdiruvudu.
story-n8: sāmājika mattu matīya saṃkucita gaṇanèya duṣpariṇāmavāgi mānavakuladalli talèdoruva melu-kīḻèṃba viṃgaḍaṇèyannu basavaṇṇanavaru mānya māḍalilla. prāṃta-pradeśavāgali, vidyè-padaviyāgali, dhana-dhānyavāgali, kònègè prakṛtisiddhavāda hèṇṇu-gaṃḍèṃba bhedavāgali mānavarannu vibhajisi, chinna-bhinnagòḻisi, pratyekisuvudannu avaru sahisalilla. adakkè badalāgi janaralli òggaṭṭannū òḍanāṭavannū - ivannu abhivṛddhigòḻisuvaṃtaha dharmavannu bodhisidaru. ī kāraṇadiṃdale, basavaṇṇanavaru bodhisida dharmada jīvāḻa dāna-dayè-nirāḍaṃbara-vinaya-bhakti-duḍimè, niṣkāmakarma mattu saraḻajīvana. òṭṭinalli manukulavèlla òṃdèṃba bhāvadiṃda paraspara hita-abhivṛddhigāgi bāḻabekèṃbude avara darśanasāra.
author-1: ḍā. èl. basavarāju avaru 1919 ralli kolāra jillèya èḍagūru grāmadalli janisidaru. ivaru vṛttiyiṃda prādhyāpakaru. śivadāsa gītāṃjali, basavaṇṇanavara vacanagaḻu, bhāsana bhārata rūpaka, allamana vacanagaḻu mòdalāda kṛtigaḻannu racisiddārè. śrīyutarigè paṃpa praśasti, keṃdra sāhitya akāḍami praśasti, basava puraskāra, rājyotsava puraskāragaḻannu nīḍi gauravisalāgidè. prastuta pāṭhavannu ḍā. èl. basavarāju avaru saṃpādisida ‘basavaṇṇanavara vacanagaḻu’ kṛtiya pīṭhikèyiṃda āyda bhāgavāgidè.
ex-a-q1: basavaṇṇanavara taṃdè, tāyiyavara hèsarenu?
ex-a-q2: basavaṇṇanavaru bāgevāḍiyannu biṭṭu èlligè hodaru?
ex-a-q3: īśāna gurugaḻu basavaṇṇanavarigè enu heḻidaru?
ex-a-q4: basavaṇṇanavara vacanagaḻu ekè prasiddhavāgivè?
ex-a-q5: basavaṇṇanavaru bodhisida dharmada jīvāḻa yāvudu?
