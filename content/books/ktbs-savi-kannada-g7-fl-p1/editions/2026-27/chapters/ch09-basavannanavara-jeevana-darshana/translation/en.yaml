  exercise-A: 'A. Answer the following questions in one sentence.'

story-n1: 'Among the foremost in the Sharana path are Basavanna. His life is an immortal flame. In its divine radiance for many centuries crores of seekers have found the right path and become fulfilled. In the field of Kannada literature especially that living flame’s influence is not little.'

story-n2: 'In the womb of Madamba, wife of the good brahmin Madiraja of Bagewadi, Basavanna was born as Shiva’s child as pearl in a shell, lotus in a pond and fragrance in the kedige bloom. That Basava-child at an auspicious moment took male form. The child grew dear to parents and a treasure of joy to those who lifted him. At seven or eight the upanayana happened. Within two years of upanayana both parents died. Orphaned Basavanna spent six years under his great-grandmother’s care. At sixteen deciding that youth should be spent in Shiva-worship and that Shiva-devotion and karma never unite, as the form of supreme renunciation he cast off the sacred thread like a karma-vine, tore the mauñji that bound like a goat’s throat, put off fine cloth, wore divine cloth, and without thinking of home’s shade, wealth, livelihood, kin or townsfolk, left Bagewadi. Walking east he reached the confluence of Malaprahari and Krishnaveni where Kudal Sangameshvara is at Kappadi Sangama.'

story-n3: 'While the elder sat in thought, Ishana Guru, sthana-pati of Kudalasangama, seeing Basavanna’s half-closed yogic eyes decided he must be a man of destiny, approached and said, “Sir, go nowhere, worry about nothing; bring fresh flowers and clear water daily, worship Sangameshvara and live happily as a prasada kayaka worker.” Agreeing, Basavanna became a bee at the lotus feet of Sri Kudal Sangameshvara.'

story-n4: 'Basavanna’s wish was to serve Sangameshvara’s feet at Kappadi Sangama itself. But Sangameshvara would not let him stay. It seemed he kept urging go to Mangalavada. Unable to go, suffering separation-pain, Basavanna decided, “Sangama will not give me chance to worship here. He always torments me saying go to Mangalavada; I will go as he says and see. There is no need to fear an unknown land; I have literacy. Selling that I will serve Shiva devotees with the money and receive prasada.”'

story-n5: 'Sangama’s grace became Basavanna’s support, Sangama’s meditation his companion. Recalling Sangama’s words again and again, forgetting travel fatigue, he reached Mangalavada, went toward Bijjala’s palace, came to the accounts hall and sat. Just then treasurer Siddhadandadhipa who had come to ask remaining royal funds was being cheated by clerks’ wrong accounts; Basavanna noticed, entered mid-way, showed the correct account and saved Siddhadandadhipa from huge loss and royal anger. Affection arose in Siddhadandadhipa for the youth who showed unmatched skill in mathematics; he brought him, showed him to the king and appointed him assistant treasurer. One hundred and one gold coins a year were fixed.'

story-n6: 'Time passed. Siddhadandanayaka fell ill and attained Kailasa. Basavanna performed his last rites, came calmly to Bijjala and said, “Siddhadandadhipa died without sons. I do not know what to do. Give counsel.” Then Bijjala said, “His servants, horses and all wealth are yours. From your coming my treasury too grew. Henceforth you alone are authority for my country and treasury,” and gave Basavanna one decree as gift and blessed another to live—adorning him with ornaments, seating him on the royal elephant, holding the white umbrella, and parading him through the city streets. From that day Basavanna was called “Basavadandanatha,” “Bhandari Basava.”'

story-n7: 'The intensity of feeling, concentration and intimacy in Basavanna’s vachanas are praiseworthy and famous! Because even a hundredth of these rare qualities is in some vachanas of Siddharama, Akkamahadevi and others, they are counted excellent lyric poems. Ambiga Chowdayya may have satire, Negayya Maritande smoking laughter, Prabhudeva purity of vision, Chennabasavanna a stream of thought, Akka sweet feeling, and other vachana poets expression according to their experience. But in Basavanna’s vachanas alone all these are present, and above, nourishing and empowering the rasa of devotion, the play of all other rasas also goes on.'

story-n8: 'Basavanna did not accept the high-low division that appears in humankind as the evil result of social and religious narrow counting. Whether region, learning-degree, wealth-grain, or even the nature-given difference of woman-man—he would not bear dividing, splitting and separating humans. Instead he taught a dharma that develops unity and companionship among people. For this reason the life-essence of the dharma Basavanna taught is gift, compassion, simplicity, humility, devotion, work, desireless action and simple living. In sum, that all humankind is one and should live for mutual good and progress—this is the essence of his vision.'

author-1: 'Dr L. Basavaraju was born in 1919 at Edaguru village, Kolar district. By profession a professor. He composed Shivadasa Gitajniali, Basavannanavara Vachanagalu, Bhasana Bharata Rupaka, Allamana Vachanagalu and others. He has been honoured with the Pampa award, Central Sahitya Akademi award, Basava Puraskar and Rajyotsava Puraskar. The present lesson is a selected portion from the preface of ‘Basavannanavara Vachanagalu’ edited by Dr L. Basavaraju.'

