labels:
  story: 'पूरक पाठ'
  author: 'कृतिकार परिचय'
  exercise-A: 'अ. निम्नलिखित प्रश्नों के एक वाक्य में उत्तर दीजिए।'

story-n1: 'शरण पंथ में प्रमुख बसवणा हैं। उनका जीवन अमर ज्योति है। कन्नड़ साहित्य क्षेत्र में उस जीवज्योति का प्रभाव अल्प नहीं।'

story-n2: 'बागेवाड़ी के मादिराज की धर्मपत्नी मादांबे के गर्भ से बसवणा शिव-शिशु के रूप में जन्मे। सोलह वर्ष की आयु में यज्ञोपवीत त्याग कर कप्पड़ी संगम पहुँचे।'

story-n6: 'बिज्जल ने उन्हें भंडारी नियुक्त कर “बसवदंडनाथ”, “भंडारी बसव” कहा।'

story-n8: 'बसवणा ने ऊँच-नीच का भेद नहीं माना। उनके धर्म का जीवाल दान-दया-निराडंबर-विनय-भक्ति-दुडिम, निष्कामकर्म और सरल जीवन है।'

author-1: 'डॉ. एल. बसवराजु 1919 में कोलार जिले के एडगूरु में जन्मे। प्रस्तुत पाठ उनके संपादित ‘बसवण्णनवर वचनगलु’ की भूमिका से है।'

ex-a-q1: 'बसवणा के माता-पिता के नाम क्या हैं?'

ex-a-q2: 'बागेवाड़ी छोड़कर बसवणा कहाँ गए?'

ex-a-q3: 'ईशान गुरु ने बसवणा से क्या कहा?'

ex-a-q4: 'बसवणा के वचन क्यों प्रसिद्ध हैं?'

ex-a-q5: 'बसवणा द्वारा बोधिता धर्म का जीवाल क्या है?'
