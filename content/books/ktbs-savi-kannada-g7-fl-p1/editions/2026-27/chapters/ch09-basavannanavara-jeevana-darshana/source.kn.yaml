  exercise-A: ಅ. ಈ ಕೆಳಗೆ ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ.
segments:
- id: story-n1
  type: prose
  section: story
  text: ಶರಣ ಪಂಥದಲ್ಲಿ ಪ್ರಮುಖರೆಂದರೆ ಬಸವಣ್ಣನವರು. ಅವರ ಜೀವನವೊಂದು ಅಮರ ಜ್ಯೋತಿ. ಅದರ ದಿವ್ಯಪ್ರಭೆಯಲ್ಲಿ ಹಲವಾರು ಶತಮಾನಗಳ ಕೋಟ್ಯಂತರ ಮುಮುಕ್ಷುಗಳು ಸನ್ಮಾರ್ಗವನ್ನು ಕಂಡುಕೊಂಡು ಕೃತಾರ್ಥರಾಗಿದ್ದಾರೆ. ಕನ್ನಡ-ಸಾಹಿತ್ಯ ಕ್ಷೇತ್ರದಲ್ಲಂತೂ ಆ ಜೀವಜ್ಯೋತಿಯ ಪ್ರಭಾವ ಅಷ್ಟಿಷ್ಟಲ್ಲ.
- id: story-n2
  type: prose
  section: story
  text: "ಬಾಗೇವಾಡಿಯ ಮಾದಿರಾಜನೆಂಬ ಸದ್ವಿಪ್ರನ ಧರ್ಮಪತ್ನಿ ಮಾದಾಂಬೆಯ ಗರ್ಭದಲ್ಲಿ ಬಸವಣ್ಣನವರು ಚಿಪ್ಪಿನಲ್ಲಿ ಮುತ್ತೂ ಕೊಳದಲ್ಲಿ ಕಮಲವೂ ಕೇದಿಗೆಯಲ್ಲಿ ಪರಿಮಳವೂ ಹುಟ್ಟುವಂತೆ ಶಿವನ ಶಿಶುವಾಗಿ ಜನಿಸಿದರು. ಆ ಬಸವಶಿಶು ಸುಮುಹೂರ್ತವೇ ಗಂಡುರೂಪಾದಂತೆ ಇತ್ತು. ಆ ಮಗು ಹೆತ್ತವರಿಗೆ ಮುದ್ದಾಗಿ, ಎತ್ತಿಕೊಂಡವರಿಗೆ ಸುಖದ ಸಂಪತ್ತಾಗಿ ಬೆಳೆಯಿತು. ಏಳೆಂಟರ ವಯಸ್ಸಿನಲ್ಲಿ ಉಪನಯನವಾಯಿತು. ಉಪನಯನವಾದ ಎರಡು ವರ್ಷಗಳಲ್ಲಿ ಬಸವಣ್ಣನವರ ತಂದೆತಾಯಿಗಳಿಬ್ಬರೂ ಸತ್ತು ಹೋದರು. ತಬ್ಬಲಿಯಾದ ಬಸವಣ್ಣನವರು ಆರು ವರ್ಷಗಳ ಕಾಲ ತಮ್ಮ ಮುತ್ತಜ್ಜಿಯ ರಕ್ಷಣೆಯಲ್ಲಿದ್ದರು. ಅವರು ಹದಿನಾರು ವರ್ಷದ ಹರೆಯದಲ್ಲಿ ತಮ್ಮ ಯೌವನವು ಶಿವಪೂಜೆಯಲ್ಲಿ ಸವೆಯಬೇಕೆಂದೂ, ಆದರೆ ಶಿವಭಕ್ತಿಯೂ ಕರ್ಮವೂ ಎಂದೂ ಒಂದಾಗಿರದೆಂದೂ ನಿಶ್ಚಯಿಸಿ, ಪರಮ ವೈರಾಗ್ಯಮೂರ್ತಿಯಾಗಿ, ಕರ್ಮಲತೆಯಂತಿದ್ದ ಜನಿವಾರವನ್ನು ಕಳೆದು ಬಿಸುಟು, ಹೋತಿನ ಗಂಟಲನ್ನು ಬಿಗಿಯುವಂತಿದ್ದ ಮೌಂಜಿಯನ್ನು ಹರಿದು ಬಿಸುಟು, ನವ್ಯದುಕೂಲವನ್ನು ತೆಗೆದುಟ್ಟು, ದಿವ್ಯವಸ್ತ್ರವನ್ನು ಹೊದ್ದು, ಮನೆಯ ನೆಳಲನ್ನು ನೆನೆಯದೆ, ಐಶ್ವರ್ಯವನ್ನು ಲೆಕ್ಕಿಸದೆ, ವೃತ್ತಿಯನ್ನು ವಿಚಾರಿಸದೆ, ಬಂಧುಬಳಗವನ್ನು ಬಗೆಯದೆ, ಊರಿನವರನ್ನೂ ನೋಡದೆ ಬಾಗೇವಾಡಿಯನ್ನು ಬಿಟ್ಟು ಹೊರಟರು. ಪೂರ್ವದಿಕ್ಕಿಗೆ ನಡೆದು, ಸ್ವಲ್ಪ ದೂರದಲ್ಲೇ ಇದ್ದ ಮಲಪ್ರಹರಿ-ಕೃಷ್ಣವೇಣೀ ನದಿಗಳ ಸಂಗಮ ಸ್ಥಾನದಲ್ಲಿ ಕೂಡಲ ಸಂಗಮೇಶ್ವರನಿರುವ ಕಪ್ಪಡಿಯ ಸಂಗಮವನ್ನು ತಲುಪುವರು."
- id: story-n3
  type: prose
  section: story
  text: "ಅಣ್ಣನವರು ಚಿಂತನ ಮಾಡುತ್ತ ಕುಳಿತಿರಲು ಕೂಡಲಸಂಗಮದ ಸ್ಥಾನಪತಿಗಳಾದ ಈಶಾನಗುರುಗಳು ಬಂದು ಆ ಬಸವಣ್ಣನವರ ಯೋಗ-ನಿದ್ರಾಮುದ್ರಿತ ಅರ್ಧನಿಮೀಲಿತ ನಯನಗಳನ್ನು ಕಂಡು, ಕಾರಣಿಕನಿರಬೇಕೆಂದು ನಿಶ್ಚಯಿಸಿ, ಬಳಿಸಾರಿ “ಅಯ್ಯ, ನೀನೆಲ್ಲಿಗೂ ಹೋಗಬೇಡ, ಏನನ್ನೂ ಚಿಂತಿಸಬೇಡ, ಸಂಗಮೇಶ್ವರನಿಗೆ ಹೊಸ ಹೂವುಗಳನ್ನೂ ತಿಳಿಯಗ್ಗವಣಿಯನ್ನೂ ತಂದು ನಿತ್ಯವೂ ಪೂಜೆಮಾಡಿ ಪ್ರಸಾದ ಕಾಯಕನಾಗಿ ಸುಖವಾಗಿರು” ಎನ್ನುವರು. ಆ ಮಾತಿಗೆ ಬಸವಣ್ಣನವರು ಒಪ್ಪಿ, ಶ್ರೀ ಕೂಡಲ ಸಂಗಮೇಶ್ವರ ಪಾದಕಮಲದಲ್ಲಿ ತುಂಬಿಯಾಗಿದ್ದರು."
- id: story-n4
  type: prose
  section: story
  text: "ಕಪ್ಪಡಿ ಸಂಗಮದಲ್ಲಿಯೇ ಸಂಗಮೇಶ್ವರನ ಪಾದಸೇವೆ ಮಾಡಿಕೊಂಡಿರುವ ಆಶೆ ಬಸವಣ್ಣನವರಿಗೆ. ಆದರೆ ಇರಗೊಡ ಸಂಗಮೇಶ್ವರ. ಮಂಗಳವಾಡಕ್ಕೆ ಹೋಗೆಂದು ಮತ್ತೆ ಮತ್ತೆ ಒತ್ತಾಯ ಮಾಡಿದಂತೆ ಭಾಸವಾಯಿತು. ಬಸವಣ್ಣನವರು ಹೋಗಲಾರದೆ ವಿರಹವೇದನೆಯಿಂದ ನೊಂದು, “ಆಗಲಿ ಸಂಗನು ನನಗಂತೂ ಪೂಜಿಸಿಕೊಂಡಿರಲು ಅವಕಾಶ ಕೊಡುತ್ತಿಲ್ಲ. ಮಂಗಳವಾಡಕ್ಕೆ ಹೋಗೆಂದು ಸದಾ ನನ್ನನ್ನು ಪೀಡಿಸುತ್ತಿರುವನು, ಅವನ ಮಾತಿನ ಪ್ರಕಾರ ಹೋಗಿ ನೋಡುತ್ತೇನೆ. ಹೇಗಿದ್ದರೂ ಅಪರಿಚಿತ ದೇಶವೆಂದು ಹೆದರಬೇಕಾಗಿಲ್ಲ, ಅಕ್ಷರಜ್ಞಾನವಿದೆ. ಅದನ್ನೇ ಮಾರಿ, ಬಂದ ಹಣದಿಂದ ಶಿವಭಕ್ತರಿಗೆ ಸೇವೆ ಸಲ್ಲಿಸುವೆನು, ಪ್ರಸಾದವನ್ನು ಪಡೆಯುವೆನು” ಎಂದು ನಿರ್ಧರಿಸಿದರು."
- id: story-n5
  type: prose
  section: story
  text: "ಬಸವಣ್ಣನವರಿಗೆ ಸಂಗನ ಕರುಣವೇ ಬೆಂಬಲವಾಯ್ತು, ಸಂಗನ ಧ್ಯಾನವೇ ಸಂಗಡವಾಯ್ತು. ಸಂಗನಾಡಿದ ಮಾತುಗಳನ್ನೇ ಮತ್ತೆ ಮತ್ತೆ ಮನದೊಳಗೆ ನೆನೆಯುತ್ತ, ನಡೆದ ಆಯಾಸವನ್ನು ಮರೆತು, ಮಂಗಳವಾಡವನ್ನು ತಲುಪಿ, ಬಿಜ್ಜಳನ ಅರಮನೆಯ ಕಡೆ ನಡೆದು, ಕರಣಶಾಲೆಗೆ ಬಂದು ಕುಳಿತಿದ್ದರು. ಆ ಸಮಯಕ್ಕೆ ಸರಿಯಾಗಿ ತನ್ನ ಮೇಲೆ ಉಳಿದಿರುವ ರಾಜಧನದ ವಿವರವನ್ನು ಕೇಳಲು ಅಲ್ಲಿಗೆ ಬಂದ ಭಂಡಾರಿ ಸಿದ್ಧದಂಡಾಧಿಪನು ಕರಣಿಕರ ತಪ್ಪು ಲೆಕ್ಕದಿಂದ ಮೋಸಹೋಗುತ್ತಿದುದ್ದನ್ನು ಬಸವಣ್ಣನವರು ಗಮನಿಸಿ, ಮಧ್ಯೆ ಪ್ರವೇಶಿಸಿ, ಸರಿಯಾದ ಲೆಕ್ಕವನ್ನು ತೋರಿಸಿ, ಆಗುತ್ತಿದ್ದ ಅಪಾರ ನಷ್ಟದಿಂದಲೂ ಸಂಭವಿಸುತ್ತಿದ್ದ ರಾಜಾಗ್ರಹದಿಂದಲೂ ಸಿದ್ಧದಂಡಾಧಿಪನನ್ನು ಪಾರುಮಾಡುವರು. ಗಣಿತ ಶಾಸ್ತ್ರದಲ್ಲಿ ಅಸದೃಶ ನೈಪುಣ್ಯವನ್ನು ಪ್ರದರ್ಶಿಸಿದ ಯುವಕನಾದ ಬಸವಣ್ಣನವರ ಮೇಲೆ ಸಿದ್ಧದಂಡಾಧಿಪನಿಗೆ ಮಮತೆ ಬಂದು, ಅವರನ್ನು ಕರೆತಂದು, ರಾಜನಿಗೆ ಕಾಣಿಸಿ, ಭಂಡಾರಕ್ಕೆ ಮರಿಭಂಡಾರಿಯನ್ನಾಗಿ ನೇಮಿಸಿಕೊಳ್ಳುವನು. ವರ್ಷಕ್ಕೆ ನೂರೊಂದು ಹೊನ್ನು ನಿಗದಿಯಾಯಿತು."
- id: story-n6
  type: prose
  section: story
  text: "ಕಾಲ ಗತಿಸಿತು. ಸಿದ್ಧದಂಡನಾಯಕನು ಕಾಯಿಲೆ ಬಿದ್ದು ಕೈಲಾಸವಾಸಿಯಾದನು. ಬಸವಣ್ಣನವರು ಸಿದ್ಧದಂಡನಾಯಕನ ಅಂತ್ಯ ಸಂಸ್ಕಾರವನ್ನು ನೆರವೇರಿಸಿ, ನಿರ್ವೇಗದಿಂದ ಬಂದು ಬಿಜ್ಜಳನನ್ನು ಕಂಡು, “ಸಿದ್ಧದಂಡಾಧಿಪನು ಗಂಡು ಮಕ್ಕಳಿಲ್ಲದೆ ಕಾಲಾಧೀನನಾದ. ನನಗೀಗ ಏನೂ ತೋಚದಾಗಿದೆ. ಬುದ್ಧಿಗೊಡಬೇಕು” ಎಂದು ಕೇಳಿಕೊಂಡನು. ಆಗ ಬಿಜ್ಜಳನು - “ಆತನ ಆಳು ಕುದುರೆ ಸಮಸ್ತ ವಿತ್ತವೂ ನಿನ್ನದೇ. ನಿನ್ನ ಬರುವಿಕೆಯಿಂದ ನನ್ನ ಭಂಡಾರವೂ ಹೆಚ್ಚಿತು. ಇನ್ನು ಮೇಲೆ ನನ್ನ ದೇಶಕ್ಕೂ ಕೋಶಕ್ಕೂ ನೀನೇ ಅಧಿಕಾರಿ” - ಎಂದು ಬಸವಣ್ಣನವರಿಗೆ ಒಂದು ಪಟ್ಟಾವಳಿಯನ್ನು ಉಡುಗೊರೆಯಾಗಿ ಕೊಟ್ಟು, ಇನ್ನೊಂದನ್ನು ಬಾಳೆಂದು ಹರಸಿ ಕೊಟ್ಟನು - ಅವರನ್ನು ಕಟಕಮಕುಟಗಳಿಂದ ಸಿಂಗರಿಸಿ, ಪಟ್ಟದಾನೆಯ ಮೇಲೆ ಕುಳ್ಳಿರಿಸಿ - ಶ್ವೇತಚ್ಛತ್ರವನ್ನು ಹಿಡಿಸಿ, ಪುರದ ಕೇರಿಗಳೊಳಗೆ ಮೆರೆಸಿದನು. ಅಂದಿನಿಂದ ಬಸವಣ್ಣನವರು “ಬಸವದಂಡನಾಥ”, “ಭಂಡಾರಿ ಬಸವ” ಎನಿಸಿದರು."
- id: story-n7
  type: prose
  section: story
  text: "ಬಸವಣ್ಣನವರ ವಚನಗಳಲ್ಲಿನ ಭಾವತೀವ್ರತೆ, ಏಕಾಗ್ರತೆ ಮತ್ತು ಆತ್ಮೀಯತೆ ಪ್ರಶಂಸನೀಯವೂ, ಪ್ರಸಿದ್ಧವೂ ಆಗಿದೆ! ಈ ಅನಘ್ರ್ಯಗುಣಗಳ ಶತಾಂಶವು ಸಿದ್ಧರಾಮ, ಅಕ್ಕಮಹಾದೇವಿ ಮುಂತಾದ ಕೆಲವರ ವಚನಗಳಲ್ಲಿರುವುದರಿಂದಲೇ, ಅವು ಉತ್ತಮ ಭಾವಗೀತೆಗಳೆನಿಸಿಕೊಂಡಿವೆ. ಅಂಬಿಗರ ಚೌಡಯ್ಯನ ವಚನಗಳಲ್ಲಿ ವಿಡಂಬನೆಯಿರಬಹುದು, ನಗೆಯ ಮಾರಿತಂದೆಯ ವಚನಗಳಲ್ಲಿ ಹೊಗೆಯಾಡುವ ನಗೆಯಿರಬಹುದು, ಪ್ರಭುದೇವರ ವಚನಗಳಲ್ಲಿ ದರ್ಶನವಿಶುದ್ಧಿಯಿರಬಹುದು, ಚೆನ್ನಬಸವಣ್ಣನವರ ವಚನಗಳಲ್ಲಿ ವಿಚಾರಧಾರೆಯಿರಬಹುದು, ಅಕ್ಕನ ವಚನಗಳಲ್ಲಿ ಮಧುರಭಾವವಿರಬಹುದು, ಮಿಕ್ಕ ವಚನಕಾರರಲ್ಲಿ ಅವರವರ ಅನುಭವಾನುಗುಣ ಭಾವಾಭಿವ್ಯಕ್ತಿಯಿರಬಹುದು. ಆದರೆ ಬಸವಣ್ಣನವರೊಬ್ಬರ ವಚನಗಳಲ್ಲೇ ಈ ಎಲ್ಲವೂ ಇದ್ದು, ಮೇಲೆ ಭಕ್ತಿರಸಕ್ಕೆ ಪೋಷಕವಾಗಿ - ಶಕ್ತಿದಾಯವಾಗಿ ಮಿಕ್ಕೆಲ್ಲ ರಸಗಳ ಲೀಲೆಯೂ ನಡೆದಿರುವುದು."
- id: story-n8
  type: prose
  section: story
  text: "ಸಾಮಾಜಿಕ ಮತ್ತು ಮತೀಯ ಸಂಕುಚಿತ ಗಣನೆಯ ದುಷ್ಪರಿಣಾಮವಾಗಿ ಮಾನವಕುಲದಲ್ಲಿ ತಲೆದೋರುವ ಮೇಲು-ಕೀಳೆಂಬ ವಿಂಗಡಣೆಯನ್ನು ಬಸವಣ್ಣನವರು ಮಾನ್ಯ ಮಾಡಲಿಲ್ಲ. ಪ್ರಾಂತ-ಪ್ರದೇಶವಾಗಲಿ, ವಿದ್ಯೆ-ಪದವಿಯಾಗಲಿ, ಧನ-ಧಾನ್ಯವಾಗಲಿ, ಕೊನೆಗೆ ಪ್ರಕೃತಿಸಿದ್ಧವಾದ ಹೆಣ್ಣು-ಗಂಡೆಂಬ ಭೇದವಾಗಲಿ ಮಾನವರನ್ನು ವಿಭಜಿಸಿ, ಛಿನ್ನ-ಭಿನ್ನಗೊಳಿಸಿ, ಪ್ರತ್ಯೇಕಿಸುವುದನ್ನು ಅವರು ಸಹಿಸಲಿಲ್ಲ. ಅದಕ್ಕೆ ಬದಲಾಗಿ ಜನರಲ್ಲಿ ಒಗ್ಗಟ್ಟನ್ನೂ ಒಡನಾಟವನ್ನೂ - ಇವನ್ನು ಅಭಿವೃದ್ಧಿಗೊಳಿಸುವಂತಹ ಧರ್ಮವನ್ನು ಬೋಧಿಸಿದರು. ಈ ಕಾರಣದಿಂದಲೇ, ಬಸವಣ್ಣನವರು ಬೋಧಿಸಿದ ಧರ್ಮದ ಜೀವಾಳ ದಾನ-ದಯೆ-ನಿರಾಡಂಬರ-ವಿನಯ-ಭಕ್ತಿ-ದುಡಿಮೆ, ನಿಷ್ಕಾಮಕರ್ಮ ಮತ್ತು ಸರಳಜೀವನ. ಒಟ್ಟಿನಲ್ಲಿ ಮನುಕುಲವೆಲ್ಲ ಒಂದೆಂಬ ಭಾವದಿಂದ ಪರಸ್ಪರ ಹಿತ-ಅಭಿವೃದ್ಧಿಗಾಗಿ ಬಾಳಬೇಕೆಂಬುದೇ ಅವರ ದರ್ಶನಸಾರ."
- id: author-1
  type: prose
  section: author
  text: "ಡಾ. ಎಲ್. ಬಸವರಾಜು ಅವರು 1919 ರಲ್ಲಿ ಕೋಲಾರ ಜಿಲ್ಲೆಯ ಎಡಗೂರು ಗ್ರಾಮದಲ್ಲಿ ಜನಿಸಿದರು. ಇವರು ವೃತ್ತಿಯಿಂದ ಪ್ರಾಧ್ಯಾಪಕರು. ಶಿವದಾಸ ಗೀತಾಂಜಲಿ, ಬಸವಣ್ಣನವರ ವಚನಗಳು, ಭಾಸನ ಭಾರತ ರೂಪಕ, ಅಲ್ಲಮನ ವಚನಗಳು ಮೊದಲಾದ ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಶ್ರೀಯುತರಿಗೆ ಪಂಪ ಪ್ರಶಸ್ತಿ, ಕೇಂದ್ರ ಸಾಹಿತ್ಯ ಅಕಾಡಮಿ ಪ್ರಶಸ್ತಿ, ಬಸವ ಪುರಸ್ಕಾರ, ರಾಜ್ಯೋತ್ಸವ ಪುರಸ್ಕಾರಗಳನ್ನು ನೀಡಿ ಗೌರವಿಸಲಾಗಿದೆ. ಪ್ರಸ್ತುತ ಪಾಠವನ್ನು ಡಾ. ಎಲ್. ಬಸವರಾಜು ಅವರು ಸಂಪಾದಿಸಿದ ‘ಬಸವಣ್ಣನವರ ವಚನಗಳು’ ಕೃತಿಯ ಪೀಠಿಕೆಯಿಂದ ಆಯ್ದ ಭಾಗವಾಗಿದೆ."
