segments:
- id: intro-1
  type: prose
  section: intro
  text: "ರಾಜುವಿನ ಮನೆಯಲ್ಲಿ ಒಂದು ಪಂಜರ, ಆ ಪಂಜರದಲ್ಲಿ ಒಂದು ಪುಟ್ಟ ಗಿಳಿ. ಆ ಗಿಳಿ ಮನೆಯವರಿಗೆಲ್ಲ ಅಚ್ಚು ಮೆಚ್ಚು. ಕೆಲವು ದಿನಗಳ ಅನಂತರ ಗಿಳಿ ಸರಿಯಾಗಿ ಕಾಳು ತಿನ್ನುತ್ತಿಲ್ಲ, ಲವಲವಿಕೆಯಿಂದ ಇಲ್ಲ ಎಂದು ರಾಜುವಿಗೆ ತುಂಬಾ ಬೇಸರವಾಯ್ತು. ಅದನ್ನು ತನ್ನ ಮನೆಯ ಪಕ್ಕದಲ್ಲಿದ್ದ ಪಶು ವೈದ್ಯರಿಗೆ ಹೇಳಿದ. ಅವರು ಬಂದು ಗಿಳಿಯನ್ನು ಪರೀಕ್ಷೆ ಮಾಡಿ ಹೇಳಿದರು “ಇದಕ್ಕೆ ಯಾವ ರೋಗವೂ ಇಲ್ಲ ಬಂಧನವೇ ರೋಗ ಇದನ್ನು ಪಂಜರದಿಂದ ಹೊರಗೆ ಬಿಟ್ಟರೆ ತನ್ನ ಇತರ ಗಿಳಿಗಳನ್ನು ಕೂಡಿಕೊಂಡು ಸಂತೋಷದಿಂದ ಇರುತ್ತದೆ. ಗಿಡಮರಗಳಿರುವ ಜಾಗದಲ್ಲಿ ಇದನ್ನು ಬಿಟ್ಟು ಬನ್ನಿ ಎಂದರು’’ ರಾಜು ಹಾಗೇ ಮಾಡಿದ. ಬಂಧನದಿಂದ ಬಿಡುಗಡೆಗೊಂಡ ಗಿಳಿ ಪುರ್ರೆಂದು ಹಾರಿ ಹೋಯಿತು. ರಾಜುವಿಗೂ ಅದನ್ನು ನೋಡಿ ಸಂತೋಷವಾಯಿತು. ನನ್ನನ್ನು ನನ್ನ ಮನೆಯಿಂದ ದೂರಮಾಡಿ ಗಿಳಿಯಂತೆ ಬಂಧನದಲ್ಲಿಟ್ಟಿದ್ದರೆ ಏನಾಗಬಹುದಿತ್ತು ಎಂದು ರಾಜು ಯೋಚಿಸತೊಡಗಿದ."
