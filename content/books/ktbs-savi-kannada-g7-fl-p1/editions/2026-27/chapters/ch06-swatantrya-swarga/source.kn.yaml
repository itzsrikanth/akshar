- id: competency
  type: competency
  section: competency
  text: "ಕೌಶಲ: ಆಲಿಸುವುದು. ಸಾಮರ್ಥ್ಯ: ಕವಿತೆ, ಕಥೆ, ನಾಟಕ, ಪ್ರಬಂಧ, ಪ್ರಹಸನ ಇವುಗಳನ್ನು ಆಲಿಸಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು. ಆಶಯ: ‘ಸ್ವಾತಂತ್ರ್ಯವೇ ಸ್ವರ್ಗ’ ಎಂಬ ಮಾತಿದೆ. ಆ ಸ್ವಾತಂತ್ರ್ಯ ಎಂತಹ ಸ್ವರ್ಗವಾಗಬೇಕು ಎಂಬುದು ಪ್ರಶ್ನೆ. ಅದು ಸ್ವೇಚ್ಛೆಯ ಸ್ವರ್ಗವಲ್ಲ. ಅಲ್ಲಿ ಹೆದರಿಕೆ ಇರುವುದಿಲ್ಲ, ನಾವು ನಮ್ಮ ಬಗ್ಗೆ, ನಮ್ಮವರ ಬಗ್ಗೆ, ನಮ್ಮ ನಾಡಿನ ಬಗ್ಗೆ ಹೆಮ್ಮೆಯಿಂದ ತಲೆಯೆತ್ತಿ ನಡೆಯುವಂತಿರಬೇಕು. ಎಲ್ಲರೂ ಒಂದು ಎಂಬ ಭಾವನೆಯಿರಬೇಕು. ಸಂತಸದ ದುಡಿಮೆಯಾಗಬೇಕು. ಒಳ್ಳೆ ವಿಚಾರಗಳು ನಮ್ಮ ಮನಸ್ಸಿಗೆ ಹರಿದು ಬರುವಂತಿರಬೇಕು, ಜೀವಪ್ರೀತಿಗೆ ಅಲ್ಲಿ ಅವಕಾಶ ವಿರಬೇಕು. ಅಂತಹ ಸ್ವಾತಂತ್ರ್ಯವೇ ಸ್ವರ್ಗ."
- id: author-1
  type: prose
  section: author
  text: "ಡಾ. ಎಂ. ಅಕಬರ ಅಲಿ ಅವರು 1925ರ ಮಾರ್ಚ್ 3ರಂದು ಬೆಳಗಾವಿ ಜಿಲ್ಲೆ, ಹುಕ್ಕೇರಿ ತಾಲ್ಲೂಕಿನ ಉಳ್ಳಾಗಡ್ಡಿ ಖಾನಾಪುರದಲ್ಲಿ ಜನಿಸಿದರು. ಬೆಳಗಾವಿ, ಸಾಂಗ್ಲಿ ಹಾಗೂ ಪುಣೆಗಳಲ್ಲಿ ತಮ್ಮ ವಿದ್ಯಾಭ್ಯಾಸ ನಡೆಸಿದರು. ಮೈಸೂರಿನ ಅಂಚೆ ಮತ್ತು ತೆರಪಿನ ಶಿಕ್ಷಣ ಸಂಸ್ಥೆ (ಇಂದಿನ ಕರ್ನಾಟಕ ಮುಕ್ತ ವಿಶ್ವವಿದ್ಯಾನಿಲಯ)ಯಲ್ಲಿ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿ ನಿವೃತ್ತರಾಗಿದ್ದಾರೆ. ಡಾ ಅಕಬರ ಅಲಿಯವರು ‘ವಿಷಸಿಂಧು’ ಎಂಬ ಅಷ್ಟ ಷಟ್ಪದಿಗಳ ಸಂಗ್ರಹವನ್ನೂ, ‘ನವಚೇತನ’ ‘ಗಂಧಕೇಶರ’, ‘ಸುಮನಸೌರಭ’ ಎಂಬ ಕವನ ಸಂಗ್ರಹಗಳನ್ನೂ, ‘ಅವ್ವ’ ಎಂಬ ಚುಟುಕುಗಳ ಸಂಗ್ರಹವನ್ನೂ, ‘ನಿರೀಕ್ಷೆಯಲ್ಲಿ’ ಎಂಬ ಕಾದಂಬರಿಯನ್ನೂ ರಚಿಸಿರುವರು. 1989ರಿಂದ ಕರ್ನಾಟಕ ವಿಧಾನ ಪರಿಷತ್ ಸದಸ್ಯರಾಗಿದ್ದರು. ಇವರಿಗೆ ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಅಕಾಡಮಿ ಪ್ರಶಸ್ತಿ ಲಭಿಸಿದೆ. ಈ ಕವನವನ್ನು ಅವರ ‘ತಮಸಾನದಿ - ಎಡಬಲದಿ’ ಎಂಬ ಕವನ ಸಂಕಲನದಿಂದ ಆರಿಸಲಾಗಿದೆ."
