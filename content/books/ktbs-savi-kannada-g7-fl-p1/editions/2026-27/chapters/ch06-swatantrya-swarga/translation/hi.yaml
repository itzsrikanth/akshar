intro-1: 'राजू के घर में एक पिंजरा, उसमें एक छोटी तोता। कुछ दिनों बाद तोता ठीक से दाना नहीं खा रहा था। पशु चिकित्सक ने कहा बंधन ही रोग है—पिंजरे से बाहर छोड़ दो।'

poem-s1l5: 'वहाँ उस स्वतंत्रता-स्वर्ग में, ओ पिता!'

poem-s1l6: 'उठो, जियो—हमारी भूमि!'

competency: 'कौशल: सुनना। आशय: ‘स्वतंत्रता ही स्वर्ग’—वह स्वर्ग स्वेच्छाचार का नहीं। वहाँ भय न हो; गर्व से सिर उठाकर चल सकें; सब एक हों; आनंद की मेहनत हो। ऐसा स्वतंत्रता ही स्वर्ग है।'

author-1: 'डॉ. एम. अकबर अली 3 मार्च 1925 को बेलगावी जिले में जन्मे। कन्नड़ साहित्य अकादमी पुरस्कार प्राप्त। यह कविता उनके ‘तमसानदी - एडबलदि’ से चुनी गई है।'

