intro-1: राजुविन मनॆयल्लि ऒंदु पंजर, आ पंजरदल्लि ऒंदु पुट्ट गिळि. आ गिळि मनॆयवरिगॆल्ल अच्चु मॆच्चु. कॆलवु दिनगळ अनंतर गिळि सरियागि काळु तिन्नुत्तिल्ल, लवलविकॆयिंद इल्ल ऎंदु राजुविगॆ तुंबा बेसरवाय्तु. अदन्नु तन्न मनॆय पक्कदल्लिद्द पशु वैद्यरिगॆ हेळिद. अवरु बंदु गिळियन्नु परीक्षॆ माडि हेळिदरु “इदक्कॆ याव रोगवू इल्ल बंधनवे रोग इदन्नु पंजरदिंद हॊरगॆ बिट्टरॆ तन्न इतर गिळिगळन्नु कूडिकॊंडु संतोषदिंद इरुत्तदॆ. गिडमरगळिरुव जागदल्लि इदन्नु बिट्टु बन्नि ऎंदरु’’ राजु हागे माडिद. बंधनदिंद बिडुगडॆगॊंड गिळि पुर्रॆंदु हारि होयितु. राजुविगू अदन्नु नोडि संतोषवायितु. नन्नन्नु नन्न मनॆयिंद दूरमाडि गिळियंतॆ बंधनदल्लिट्टिद्दरॆ एनागबहुदित्तु ऎंदु राजु योचिसतॊडगिद.
poem-s1l1: निर्भीत निर्मुक्त मनवु तानॆल्लिहुदु;
poem-s1l2: अभिमानधनवॆनिप मस्तकवदु
poem-s1l3: जग्गदॆयॆ कुग्गदॆयॆ तग्गदॆयॆ बग्गदॆयॆ
poem-s1l4: मेल्मॊगदि नीटागि निंदिरुवुदु;-
poem-s1l5: अल्लि आ स्वातंत्र्य -स्वर्गदलि, ओ तंदॆ!
poem-s1l6: एळलै बाळलै नाडॆम्मदु!
poem-s2l1: अरिवु तान् सर्वस्वतंत्रवागलिहुदु;
poem-s2l2: संकुचिततन मनोवृत्तियळिदु
poem-s2l3: विश्ववॆंबुवुदॆल्ल होळु होळागदॆयॆ
poem-s2l4: ऒंदागि चॆंदागि बाळुतिहुदु;-
poem-s2l5: अल्लि आ स्वातंत्र्य - स्वर्गदलि, ओ तंदॆ!
poem-s2l6: एळलै बाळलै नाडॆम्मदु!
poem-s3l1: नन्नितनदाळदिंदॆल्लि नुडि हॊरबहुदु;
poem-s3l2: दुडिमॆयॆंबुवुदॆल्लि मुंदुवरिदु,
poem-s3l3: दणिवन्नु अरियदॆयॆ दणिविंगॆ मणियदॆयॆ,
poem-s3l4: पूर्णतॆगॆ तन्न कैचाचुतिहुदु;-
poem-s3l5: अल्लि आ स्वातंत्र्य -स्वर्गदलि, ओ तंदॆ!
poem-s3l6: एळलै बाळलै नाडॆम्मदु!
poem-s4l1: संप्रदायदनिष्ट रूढि-नियमगळॆंब
poem-s4l2: निर्जनद मरुभूमि हरहिनल्लि
poem-s4l3: सुविचारवॆंदॆंब परिशुद्ध वाहिनियु
poem-s4l4: हरिगडियदॆयॆ मुंदुवरियुवल्लि;-
poem-s4l5: अल्लि आ स्वातंत्र्य -स्वर्गदलि, ओ तंदॆ!
poem-s4l6: एळलै बाळलै नाडॆम्मदु!
poem-s5l1: नित्य वैशाल्यवह नडॆ-नुडिगळिंदागि
poem-s5l2: मनवरळि तानल्लि मुंदरिवुदु,
poem-s5l3: निन्नॊलवु, निन्न दयॆ, निन्न कृपॆयिंदागि
poem-s5l4: निन्नन्नॆ ध्रुवतारॆयॆंदरिवुदु;-
poem-s5l5: अल्लि आ स्वातंत्र्य -स्वर्गदलि, ओ तंदॆ!
poem-s5l6: एळलै बाळलै नाडॆम्मदु!
competency: 'कौशल: आलिसुवुदु. सामर्थ्य: कवितॆ, कथॆ, नाटक, प्रबंध, प्रहसन इवुगळन्नु आलिसि अर्थमाडिकॊळ्ळुवुदु. आशय: ‘स्वातंत्र्यवे स्वर्ग’ ऎंब मातिदॆ. आ स्वातंत्र्य ऎंतह स्वर्गवागबेकु ऎंबुदु प्रश्नॆ. अदु स्वेच्छॆय स्वर्गवल्ल. अल्लि हॆदरिकॆ इरुवुदिल्ल, नावु नम्म बग्गॆ, नम्मवर बग्गॆ, नम्म नाडिन बग्गॆ हॆम्मॆयिंद तलॆयॆत्ति नडॆयुवंतिरबेकु. ऎल्लरू ऒंदु ऎंब भावनॆयिरबेकु. संतसद दुडिमॆयागबेकु. ऒळ्ळॆ विचारगळु नम्म मनस्सिगॆ हरिदु बरुवंतिरबेकु, जीवप्रीतिगॆ अल्लि अवकाश विरबेकु. अंतह स्वातंत्र्यवे स्वर्ग.'
author-1: डा. ऎं. अकबर अलि अवरु 1925र मार्च् 3रंदु बॆळगावि जिल्लॆ, हुक्केरि ताल्लूकिन उळ्ळागड्डि खानापुरदल्लि जनिसिदरु. बॆळगावि, सांग्लि हागू पुणॆगळल्लि तम्म विद्याभ्यास नडॆसिदरु. मैसूरिन अंचॆ मत्तु तॆरपिन शिक्षण संस्थॆ (इंदिन कर्नाटक मुक्त विश्वविद्यानिलय)यल्लि प्राध्यापकरागि निवृत्तरागिद्दारॆ. डा अकबर अलियवरु ‘विषसिंधु’ ऎंब अष्ट षट्पदिगळ संग्रहवन्नू, ‘नवचेतन’ ‘गंधकेशर’, ‘सुमनसौरभ’ ऎंब कवन संग्रहगळन्नू, ‘अव्व’ ऎंब चुटुकुगळ संग्रहवन्नू, ‘निरीक्षॆयल्लि’ ऎंब कादंबरियन्नू रचिसिरुवरु. 1989रिंद कर्नाटक विधान परिषत् सदस्यरागिद्दरु. इवरिगॆ कर्नाटक साहित्य अकाडमि प्रशस्ति लभिसिदॆ. ई कवनवन्नु अवर ‘तमसानदि - ऎडबलदि’ ऎंब कवन संकलनदिंद आरिसलागिदॆ.
