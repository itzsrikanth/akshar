ex-a-q1: svātaṃtrya svargadali abhimānadhanavènipa mastakavu hegiruttadè?
ex-a-q2: kaviyu bāḻu hegirabekèṃdu āśisiddārè?
ex-a-q3: kaviyu saṃpradāyada aniṣṭa rūḍhi niyamagaḻannu enèṃdu karèyuttārè?
ex-a-q4: dhruvatārè èṃdu kavi yārannu karèyuttārè?
