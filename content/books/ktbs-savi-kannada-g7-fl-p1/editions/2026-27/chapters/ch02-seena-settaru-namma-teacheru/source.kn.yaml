- id: story-n10
  type: prose
  section: story
  text: ಹೀಗೆ ಮತ್ತೆ ಇಡೀ ಪ್ರಶ್ನೆಯುತ್ತರದ ಚಕ್ರ ತಿರುಗುವುದು. ಯಶೋದಳ ಈ ಆಟದಿಂದ ಅಂದು ನಾಟಿ ಮುಗಿಯುವ ವೇಳೆಗೆ ಪ್ರತಿ ಮಕ್ಕಳೂ ನಾಲ್ಕು ಬಾಳೆಹಣ್ಣುಗಳನ್ನಾದರೂ ತಿಂದಿದ್ದರು. ನಾಟಿ ಮುಗಿಯುವವರೆಗೂ ಸೀನಸೆಟ್ರು ಮಕ್ಕಳ ಜೊತೆಗೆ ಇದ್ದು ಅಲ್ಲಿಂದ ಕಾಲಕಾಲಕ್ಕೆ ಅವರು ಗಮನಿಸಿಕೊಳ್ಳಬೇಕಾದ ವಿಷಯಗಳನ್ನೆಲ್ಲಾ ಹೇಳಿಕೊಟ್ಟರು.
- id: story-n11
  type: prose
  section: story
  text: "ನಾಟಿ ಮುಗಿದ ಮೇಲೆ ಇನ್ನು ಯಾವಾಗ ಹೊಡೆ ಹೊರಟಿತೋ, ಯಾವಾಗ ತೆನೆ ಬಂದಿತೋ ಎಂದು ಮಕ್ಕಳ ಚಡಪಡಿಕೆ. ತುಂಗಾಗಂತೂ ಪ್ರತಿದಿನ ಶಾಲೆಗೆ ಬಂದ ತಕ್ಷಣ ಗದ್ದೆಯನ್ನು ನೋಡುವವರೆಗೆ ಎಂತದೋ ಚಡಪಡಿಕೆ. ಅವಳೂ - ಕಿಟ್ಟನೂ ಸೇರಿ ಮನೆಯ ಅಟ್ಟದ ಮೇಲೆ ಹತ್ತಿ ಕಿಟಕಿ ಕಂಡಿಯಲ್ಲಿ ನೋಡಿದರೆ ಗದ್ದೆ ತುಂಬಾ ಚೆನ್ನಾಗಿ ಕಾಣುತ್ತದೆಂದು ಕಂಡುಕೊಂಡಿದ್ದರು. ಈ ರಹಸ್ಯ ಯಾರಿಗೂ ತಿಳಿಯಬಾರದೆಂದೂ ಗುಟ್ಟಾಗಿಡಲು ಪ್ರಯತ್ನಿಸಿದಷ್ಟೂ ಅದು ಬಯಲಾಗಿಬಿಟ್ಟು ಕೊನೆಗೆ ಅಟ್ಟ, ಗದ್ದೆ ವೀಕ್ಷಣೆಯ ಟವರ್ ಆಗಿ ಪರಿವರ್ತಿತಗೊಂಡಿತ್ತು."
- id: competency
  type: competency
  section: competency
  text: "ಕೌಶಲ: ಓದುವುದು. ಸಾಮರ್ಥ್ಯ: ವಿವಿಧ ಪದಗಳ ಉಚ್ಚಾರಣೆಯಲ್ಲಿರುವ ಧ್ವನಿಸಾಮ್ಯತೆ, ಧ್ವನಿವ್ಯತ್ಯಾಸಗಳನ್ನು ಅರ್ಥಮಾಡಿಕೊಂಡು ಓದುವುದು. ಆಶಯ: ನಮ್ಮ ಜೀವನದ ಪ್ರತಿ ಹಂತದಲ್ಲೂ ನಾವು ಕಲಿಯುತ್ತಿರುತ್ತೇವೆ. ನಮ್ಮ ವ್ಯಕ್ತಿತ್ವದ ಬೆಳವಣಿಗೆ ಕೇವಲ ಶಾಲೆಯಿಂದಲ್ಲ; ಮನೆ, ಇತರರ ಒಡನಾಟ, ಪರಿಸರ, ಮಾಧ್ಯಮಗಳಿಂದ ಜೀವನದ ಪಾಠವನ್ನು ಕಲಿಯುತ್ತ ಬೆಳೆಯುತ್ತೇವೆ. ಶಾಲೆಯಲ್ಲಿ ಗುರುಗಳಿದ್ದಂತೆ ಶಾಲೆಯ ಹೊರಗೂ ಹಲವು ಗುರುಗಳು ನಮಗಿರುತ್ತಾರೆ. ಅವರೆಲ್ಲರ ಕೊಡುಗೆಯಿಂದ ಬೋಧನೆಯಿಂದ ನಾವೆಲ್ಲ ಬೆಳೆಯುತ್ತಾ ಹೋಗುತ್ತೇವೆ. ಈ ವಿಚಾರ ಮನದಲ್ಲಿ ಮೂಡಿದಾಗ ಲೋಕವೇ ನಮ್ಮ ಗುರು ಎಂಬ ಭಾವನೆ ಮೂಡುತ್ತದೆ."
- id: author-1
  type: prose
  section: author
  text: "ಶ್ರೀಮತಿ ವಿ. ಗಾಯತ್ರಿ ಲೇಖಕಿ, ಅನುವಾದಕಿ, ಶಿಕ್ಷಣ ಇಲಾಖೆಯ ‘ಮಹಿಳಾ ಸಮಖ್ಯ’ ಮತ್ತು ನೀರಾವರಿ ಇಲಾಖೆಯ ‘ಜಲ ಸಂವರ್ಧನೆ ಯೋಜನೆ’ಗಳಲ್ಲಿ ಹಿರಿಯ ಅಧಿಕಾರಿಯಾಗಿ ಅನೇಕ ವರ್ಷಗಳವರೆಗೆ ಸೇವೆ ಸಲ್ಲಿಸಿದ್ದಾರೆ. ಇವರ ಪ್ರಮುಖ ಪ್ರಕಟಿತ ಕೃತಿಗಳು, ‘ತುಂಗಾ’-ಮಕ್ಕಳ ಸೃಜನಶೀಲ ಕಲಿಕೆಯ ಸುತ್ತ ಹೆಣೆದ ಕಾದಂಬರಿ; ‘ತೊತ್ತೋಚಾನ್’ ವಿಶ್ವವಿಖ್ಯಾತ ಜಪಾನಿ ಕಾದಂಬರಿಯ ಕನ್ನಡ ಅನುವಾದ. ‘ಕರ್ನಾಟಕದಲ್ಲಿ ಸಾವಯವ ಪರಂಪರೆಯ ಕಥನ ಭಾಗ 1 ಮತ್ತು 2’, ‘ಸಹಜ/ಸಾವಯವ ರೈತರ ಕೃಷಿ ಮತ್ತು ಬದುಕುಗಳು’, ಕೇಂದ್ರ ಪರಿಸರ ಮಂತ್ರಾಲಯದ ಪರಿಸರ ಶಿಕ್ಷಣ ಕೇಂದ್ರಕ್ಕಾಗಿ ‘ಪರಿಸರ ಶಿಕ್ಷಣದಲ್ಲಿ ಅಗತ್ಯ ಕಲಿಕೆಗಳು’, ‘ಎಳೆಯರಿಗಾಗಿ ಪರಿಸರ’ ಮುಂತಾದ ಮಹತ್ವದ ಕೃತಿಗಳ ಅನುವಾದ ಮತ್ತು ಸಂಪಾದನೆ. ಇವು ಶಾಲಾ ಶಿಕ್ಷಕರರಿಗೆ ಓದುವ ಸಾಮಗ್ರಿಗಳಾಗಿವೆ. ಮೇಲಿನ ಪಾಠವನ್ನು ಅವರ ‘ತುಂಗಾ’ ಕೃತಿಯಿಂದ ಆರಿಸಲಾಗಿದೆ."
