  competency: ಕೌಶಲ / ಸಾಮರ್ಥ್ಯ / ಆಶಯ
  author: ಕೃತಿಕಾರರ ಪರಿಚಯ
  vocab: ಪದಗಳ ಅರ್ಥ
  exercise-A: ಅ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-B: ಆ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು-ಮೂರು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-C: ಇ. ಕೆಳಗಿನ ಮಾತುಗಳನ್ನು ಯಾರು, ಯಾರಿಗೆ ಹೇಳಿದರು? ತಿಳಿಸಿ.
segments:
- id: intro-1
  type: prose
  section: intro
  text: "ಪ್ರತಿದಿನ ಮಕ್ಕಳಿಗೆ ಒಂದಲ್ಲ ಒಂದು ರೀತಿಯ ಕಲಿಕೆಯಾಗುತ್ತಿರುತ್ತದೆ. ಮನೆಯಲ್ಲಿ ತಾಯಿ, ತಂದೆ, ಬಂಧುಬಳಗ, ಶಾಲೆಯಲ್ಲಿ ಗುರುಗಳು, ಸಹಪಾಠಿಗಳು ಹೀಗೆ ಎಲ್ಲರಿಂದಲೂ ಒಂದಲ್ಲ ಒಂದು ಕಲಿಕೆಯಾಗುತ್ತಿರುತ್ತದೆ. ಸೈಕಲ್ ಹೇಳಿಕೊಟ್ಟ ಸ್ನೇಹಿತನೂ ಕೂಡ ಒಂದು ರೀತಿಯಲ್ಲಿ ಟೀಚರೇ ಆಗಿದ್ದಾನೆ. ಹೀಗಾಗಿ ನಮ್ಮ ಜೀವನದಲ್ಲಿ ಹಲವಾರು ಟೀಚರ್ಗಳು ಬಂದು ಹೋಗುತ್ತಿರುತ್ತಾರೆ."
- id: intro-2
  type: prose
  section: intro
  text: "ಈಜುವುದು, ಹಾಡುವುದು, ಕಸೂತಿ ಕೆಲಸ ಯಾವುದೇ ಆಗಲಿ ಅಲ್ಲಿ ಒಬ್ಬ ಟೀಚರ್ ಇರುತ್ತಾರೆ. ಅದೇ ರೀತಿ ಯಾರಿಂದ ಏನೇ ಕಲಿತರೂ ಅಲ್ಲಿ ಗುರುವಿನ ಸ್ಥಾನದಲ್ಲಿ ಒಬ್ಬರನ್ನು ಕಾಣಬಹುದು. ಇದೇ ರೀತಿ ನಮಗೆ ಅನೇಕ ವ್ಯಕ್ತಿಗಳಿಂದ ಸಹಾಯ, ಸಹಕಾರ, ಮಾರ್ಗದರ್ಶನ ಸಿಕ್ಕೇ ಸಿಕ್ಕಿರುತ್ತದೆ. ಅವರಲ್ಲೂ ಕೂಡ ಟೀಚರ್ರನ್ನು ಕಾಣಬಹುದು. ಅಂತಹ ಒಬ್ಬ ಟೀಚರರ ಕಥೆ ಇಲ್ಲಿದೆ."
- id: story-n1
  type: prose
  section: story
  text: "“ಇವರು ಇವತ್ತಿನಿಂದ ನಿಮ್ಮ ಟೀಚರು. ಇವರು ನಿಮಗೆ ಏನೆಲ್ಲಾ ಕಲಿಸಿಕೊಡುತ್ತಾರೆ ನೋಡ್ತಾ ಇರಿ” - ಮಳೆಗಾಲ ತೀವ್ರಗೊಳ್ಳುತ್ತಿದ್ದ ಆ ದಿನ ಮಾಂಡವಿ ಹೊಸಾ ಟೀಚರನ್ನು ಮಕ್ಕಳಿಗೆ ಪರಿಚಯಿಸಿದರು. ತುಂಗಾ ಅವರನ್ನು ಸರಿಯಾಗಿ ನೋಡಿದಳು. ಮೊದಲನೆಯದಾಗಿ, ಆತ ವೇಷಭೂಷಣದಿಂದ ಟೀಚರರಂತೆ ಕಾಣುತ್ತಿರಲಿಲ್ಲ. ತುಂಬಾ ಹಳೆಯದಾದ ಒಗೆದ ಪಂಚೆಯೊಂದನ್ನು ಸೊಂಟಕ್ಕೆ ಸುತ್ತಿ ಮೇಲಕ್ಕೆ ಎತ್ತಿ ಕಟ್ಟಿದ್ದರು. ಒಗೆದ ಚೌಕುಳಿಯ ಅಂಗಿ, ಅದಕ್ಕಿಂತ ಹಳೆಯ ಟವಲಿನಿಂದ ತಲೆಗೆ ಲಪ್ಪಟೆ ಸುತ್ತಿಕೊಂಡಿದ್ದರು. ಅವರು ಪಂಚೆ ಸುತ್ತಿರುವ ರೀತಿ ಅಭ್ಯಾಸವಿಲ್ಲದ್ದೆಂದು ಎಷ್ಟು ಚೆನ್ನಾಗಿ ಗೊತ್ತಾಗುತ್ತಿತ್ತೆಂದರೆ, ಚಡ್ಡಿಗೆ ದೊರೆತ ಪ್ರಾಮುಖ್ಯ ಪಂಚೆಗೆ ಸಿಗದೆ ಅದು ತುಂಬಾ ಅಮುಖ್ಯನಂತೆ ಮುದುರಿ ಕುಳಿತಿತ್ತು. ಮಕ್ಕಳಿಗೆಲ್ಲಾ “ಇವರೆಂತಾ ಟೀಚರಪ್ಪಾ” ಎಂದು ನಿರಾಸೆಯೂ ಕುತೂಹಲವೂ ಆಗಿತ್ತು."
- id: story-n2
  type: prose
  section: story
  text: "ಮಾಂಡವಿಯ ಆದೇಶದಂತೆ ಮಕ್ಕಳೆಲ್ಲಾ ಹಳ್ಳದ ದಂಡೆಯಲ್ಲಿ ಕೂಡಿಕೊಂಡರು. ತುಂಗಾಗೆ ತಾನು ಆ ಟೀಚರನ್ನು ಎಲ್ಲೋ ನೋಡಿದ್ದೇನೆ ಅನ್ನಿಸುತ್ತಿತ್ತು. ಎಲ್ಲಿ ಎನ್ನುವುದು ಅಷ್ಟು ಸುಲಭವಾಗಿ ಹೊಳೆಯಲಿಲ್ಲ. ಆತನ ಸ್ನೇಹಮಯ ಮುಖ ಬಿಸಿಲು-ಮಳೆ-ಚಳಿಗಳಿಗೆ ಪಕ್ಕಾಗಿ ಕರ್ರಗೆ ಸುಕ್ಕುಗಟ್ಟಿತ್ತು. ಆತ ತಲೆಗೆ ಸುತ್ತಿದ ಲಪ್ಪಟೆಯಂತೂ ತೀರಾ ಪರಿಚಿತವಾಗಿತ್ತು. “ಹಾಂ, ಹೌದು” ನೆನಪಾಯಿತು. ಪ್ರತಿಸಲ ಸಾಮೇರ ಮನೆ ಆಲೆಮನೆಗೆ ಕೋಣ ಹೊಡೆದು ತರುವ ಸೀನಸೆಟ್ಟರು ಇವರು. ತಮ್ಮ ಮೂರೆಕರೆ ಜಮೀನಿನಲ್ಲಿ ತಪ್ಪದೆ ಸಾಸಿವೆ ಬೆಳೆಯುತ್ತಿದ್ದ ಒಬ್ಬರೇ ರೈತ ಇವರು. ತುಂಗಾಳ ದೂರದ ಸಂಬಂಧಿಯಾದ ಸೀನಸೆಟ್ಟರಿಗೂ ಇವಳ ನೆನಪಿತ್ತು. ಪ್ರೀತಿಯಿಂದ ಅವಳ ತಲೆ ಸವರಿ, “ಎಂತಾ, ಮಗಾ, ಆರಾಮಾ? ಅವ್ವ-ಅಪ್ಪಯ್ಯ ಚಂದ ಅದಾರಾ?” ಎಂದು ಕೇಳಿದರು. ‘ಓ’ ತುಂಗಾ ಸ್ವಲ್ಪ ಜೋರಾಗೇ ಹೇಳಿದಳು. ಹೊಸ ಟೀಚರು ತನ್ನ ಪರಿಚಯಸ್ಥರು ಎಂದು ಇತರ ಮಕ್ಕಳೆದುರಿಗೆ ತೋರಿಸಿಕೊಳ್ಳುವುದು ಅವಳಿಗೆ ಹೆಮ್ಮೆಯೆನಿಸಿತ್ತು."
- id: story-d1
  type: dialogue
  section: story
  speaker: ತುಂಗಾ
  text: ಹಂಗಾರೆ ಸೀನಸೆಟ್ರು ಇನ್ನು ನಮ್ಮ ಟೀಚರು
- id: story-d2
  type: dialogue
  section: story
  speaker: ಸೀನಸೆಟ್ಟರು
  text: ನಾ ಟೀಚರಲ್ಲ. ಎಂತಾ ಅಲ್ಲ. ನಾನೊಬ್ಬ ಪಡಪೋಶಿ ರೈತ. ನಿಮ್ಮ ಹೆಡ್ಮೇಡಮ್ಮ ನಿಮ್ಗೆಲ್ಲಾ ಗದ್ದೆ ಕೆಲ್ಸ ಹೇಳ್ಕೊಡಾಕೆ ನನ್ನ ಕರ್ಸಿದಾರೆ
- id: story-d3
  type: dialogue
  section: story
  speaker: ಮಾಂಡವಿ
  text: "ಹೌದು. ಹೌದು, ಇವರು ನಿಮ್ಮ ಬೇಸಾಯದ ಟೀಚರು, ನಿಮಗೆ ಬೇಸಾಯದಲ್ಲಿ ಸಹಾಯ ಮಾಡಲು ಇವರು ಒಪ್ಪಿಕೊಂಡಿರುವುದು ನಮ್ಮ ಪುಣ್ಯ. ಸರಿ ಮೇಷ್ಟ್ರೆ, ಈಗ ನೀವು ಪ್ರಾರಂಭಿಸಬಹುದು"
- id: story-n3
  type: prose
  section: story
  text: ಚಿಣ್ಣರ ಲೋಕದ ಬಹುಪಾಲು ಮಕ್ಕಳು ರೈತ ಕುಟುಂಬದವರೇ. ಒಂದಲ್ಲಾ ಒಂದು ರೀತಿಯಲ್ಲಿ ಬೇಸಾಯದಲ್ಲಿ ತೊಡಗಿಕೊಳ್ಳುತ್ತಿದ್ದ ಅವರಿಗೆ ಹೊಸದಾಗಿ ಬೇಸಾಯವನ್ನೇನೂ ಕಲಿಸಬೇಕಾಗಿರಲಿಲ್ಲ. ಆದರೆ ಶಾಲೆಯ ಕಲಿಕೆಯಲ್ಲಿ ಬೇಸಾಯವನ್ನು ಅಳವಡಿಸುವ ಮಾಂಡವಿಯ ಉದ್ದೇಶವೇ ಬೇರೆಯಾಗಿತ್ತು. ಶಾಲಾ ಶಿಕ್ಷಣ ನಿಜ ಬದುಕಿನ ಜೊತೆಗೆ ಹಾಸುಹೊಕ್ಕಿನ ಸಂಬಂಧ ಹೊಂದಿರಬೇಕೆಂಬುದೇ ಮಾಂಡವಿಯ ನಂಬಿಕೆಯಾಗಿತ್ತು. ಅದೇ ಅವರ ಶಿಕ್ಷಣ ಮಾದರಿಯ ತಳಹದಿ ಕೂಡಾ. ಶಾಲಾ ಶಿಕ್ಷಣದಲ್ಲಿ ಅವರು ಬೇಸಾಯವನ್ನು ಅಳವಡಿಸಲು ಮುಖ್ಯಕಾರಣ ಇದಾಗಿದ್ದರೂ ಕೂಡ ಅದು ಇನ್ನೂ ಅನೇಕ ವಿಚಾರಗಳಿಗೆ ಸಹಾಯವಾಗಿತ್ತು.
- id: story-n4
  type: prose
  section: story
  text: "ಮೊದಲನೆಯದಾಗಿ, ಮಣ್ಣಿನ ಕಣಕಣಗಳೊಟ್ಟಿಗೆ ಸಂವಾದಿಸಬಲ್ಲ ಸೀನಸೆಟ್ಟರಂತಹ ರೈತರ ಅನುಭವಜನ್ಯ ವಿವರಣೆ ತರಗತಿಯೊಳಗೆ ನಡೆಯಬೇಕಾದ ಅರ್ಧಪಾಲು ವಿಜ್ಞಾನದ ಪಾಠವನ್ನು ಗದ್ದೆಯಲ್ಲೇ ಕಲಿಸಿಬಿಡುತ್ತಿತ್ತು. ಎರಡನೆಯದಾಗಿ, ಮಕ್ಕಳು ಕುಟುಂಬದೊಂದಿಗೆ ವ್ಯವಸಾಯದಲ್ಲಿ ಪಾಲ್ಗೊಳ್ಳುತ್ತಿದ್ದರೂ ಅವರಿಗೆ ಸಿಗುತ್ತಿದ್ದುದು ಎರಡನೇ ಸ್ಥಾನ, ಸೀಮಿತ ಒಳಗೊಳ್ಳುವಿಕೆ. ಆದರೆ ಇಲ್ಲಿ ಬೇಸಾಯದ ಎಲ್ಲಾ ಹಂತಗಳಲ್ಲೂ ಎಲ್ಲಾ ಕೆಲಸಗಳನ್ನು, ಜವಾಬ್ದಾರಿಗಳನ್ನು ಸ್ವತಃ ತಾವೇ ಮಾಡಬೇಕಾದ್ದರಿಂದ ಅವರಿಗೆ ಇಡಿಯಾದ ಅನುಭವ ಸಿಗುತ್ತಿತ್ತು."
- id: story-n5
  type: prose
  section: story
  text: ಹಳ್ಳದ ಬದಿಯ ಎರಡೆಕರೆ ಜಮೀನನ್ನು ಮಾಂಡವಿ ಬೇಸಾಯಕ್ಕೆಂದೇ ಕೊಂಡುಕೊಂಡಿದ್ದರು. ಹಾಗೆಯೇ ಮನೆಯಲ್ಲಿ ಮುಂದುಗಡೆಯ ಒಂದು ರೂಮನ್ನು ಮಕ್ಕಳಿಗೆ ಬೇಸಾಯದ ಸಾಮಗ್ರಿಗಳನ್ನು ಇಟ್ಟುಕೊಳ್ಳಲೆಂದು ತೆರವು ಮಾಡಲಾಗಿತ್ತು. ಈಗಾಗಲೇ ಭತ್ತ ಬಿತ್ತಿದ್ದ ಗದ್ದೆಯದು. ನಿಲ್ಲಲಿ ಎಂದರೂ ಕೇಳದೆ ಜಡಿಮಳೆಯಲ್ಲೇ ಶಾಲೆಯ ಐವತ್ತೂ ಮಕ್ಕಳು ಕಂಬಳಿಗೊಪ್ಪೆ ಹಾಕಿಕೊಂಡು ಸಂಭ್ರಮದಿಂದ ಗದ್ದೆಗಿಳಿದರು ಸೀನಸೆಟ್ಟರ ಜೊತೆ.
- id: story-d4
  type: dialogue
  section: story
  speaker: ಸೀನಸೆಟ್ಟರು
  text: ಮುಂಚೆ ನಾವು ಸಸಿಗಳನ್ನು ಕೀಳಾಣ. ಇವತ್ತೇ ಸಸಿ ಕಿತ್ತು ಮುಗೀತಂದ್ರೆ ನಾಳೆಯಿಂದ ನಾಟಿ ಮಾಡಾಣ
- id: story-n6
  type: prose
  section: story
  text: ಮೊದಮೊದಲು ಮಕ್ಕಳಿಗೆ ಹಿಡಿ ತುಂಬಾ ಸಸಿಗಳನ್ನು ಬುಡಸಮೇತ ಕೀಳುವುದು ಸುಲಭವಾಗಲಿಲ್ಲ. ಅನೇಕ ಸಸಿಗಳನ್ನು ಹಾಳು ಮಾಡಿದರು. ಹತ್ತಾರು ಬಾರಿ ಕಿತ್ತು ಕಿತ್ತು ಪ್ರಯತ್ನಿಸಿ ಅನಂತರ ಅವರಿಗೆ ಕೀಳುವುದು ಅಭ್ಯಾಸವಾಗಿ ವೇಗವೂ ಹಿಡಿಯಿತು. ಅವುಗಳನ್ನು ಸಣ್ಣ ಸಣ್ಣ ಕಟ್ಟುಗಳಲ್ಲಿ ಕಟ್ಟಿ ಕೆಸರು ಗದ್ದೆಯಲ್ಲಿಡುವುದನ್ನು ‘ಟೀಚರು’ ಕಲಿಸಿಕೊಟ್ಟರು.
- id: story-n7
  type: prose
  section: story
  text: "ಒಂದು ಗಂಟೆಯ ಕೆಲಸದ ಅನಂತರ ಸೀನಸೆಟ್ಟರು “ಇವತ್ತಿಗೆ ಸಾಕು, ನಾಳೆ ಉಳಿದದ್ದು” ಎಂದರು. ಸಂಭ್ರಮ ಹಿಡಿಸಿಕೊಂಡಿದ್ದ ಮಕ್ಕಳು ಕೇಳಿಯಾರೆ? “ಸೀನ ಸೆಟ್ರೆ, ನಿಮ್ಮ ದಮ್ಮಯ್ಯ, ಇವತ್ತು ಪೂರಾ ಕಿತ್ತೇ ಹೋಗಾಣ” ಎಂದು ಒಕ್ಕೊರಲಿನಿಂದ ಒತ್ತಾಯಪೂರ್ವಕವಾಗಿ ಗೋಗರೆದರು. ಅಷ್ಟರಲ್ಲೇ ಒಂದು ಸಣ್ಣ ಹಾವು ಅವಸರದಿಂದ ಸರಿಯುತ್ತಾ ಹಾಲಪ್ಪ ಎನ್ನುವವನ ಕಾಲನ್ನು ಕಚ್ಚಿಬಿಟ್ಟಿತು. ಅವನು ಹೌಹಾರಿ ಬಿದ್ದ. ತಕ್ಷಣ ಸೀನಸೆಟ್ಟರು ಅವನನ್ನು ಹಿಡಿದುಕೊಂಡರು."
- id: story-d5
  type: dialogue
  section: story
  speaker: ಸೀನಸೆಟ್ಟರು
  text: "ಹೆದರ್ಬೇಡಾ ಮಗಾ, ಎಂತಾ ಆಗಲ್ಲ. ಅದು ನೀರಾವು. ವಿಷದ ಹಾವಲ್ಲ. ಒಂದು ಮೀನು ಕಚ್ಚಿದ್ರೆ ಹೆಂಗೋ ಅಷ್ಟೇ"
- id: story-n8
  type: prose
  section: story
  text: "ಮುಂದಿನ ದಿನಗಳಲ್ಲಿ ನಾಟಿ. ಇದು ಸಸಿ ಕೀಳುವುದಕ್ಕಿಂತಲೂ ಕಷ್ಟಕರವಾದ ಕೆಲಸ. ಅನೇಕ ಸಸಿಗಳನ್ನು ಒಟ್ಟಿಗೆ ಹಿಡಿದು ಒಂದೇ ಸಲಕ್ಕೆ ಬೇರು ನಾಟುವಂತೆ ಹೆಬ್ಬೆಟ್ಟಿನಿಂದ ಗಟ್ಟಿಯಾಗಿ ಒತ್ತಿ ಊರಬೇಕು. ಮೊದಮೊದಲಿಗೆ ಕೆಲ ಮಕ್ಕಳಿಗಂತೂ ಇದು ತಮ್ಮಿಂದ ಸಾಧ್ಯವೇ ಇಲ್ಲ ಎನಿಸಿಬಿಟ್ಟಿತು. ಆದರೆ ಸೀನಸೆಟ್ಟರ ಅಪಾರ ತಾಳ್ಮೆ, ಉತ್ತೇಜನಗಳು ಅವರನ್ನು ಕೆಲಸಕ್ಕೆ ಹೊಂದಿಸಿಬಿಟ್ಟವು. “ಹಾಡು ಹೇಳ್ಕ್ಯಂಡು ಕೆಲಸ ಮಾಡಿ. ಆಗ ಕಷ್ಟಾನೇ ತಿಳಿಯಲ್ಲ” ಎಂದು ಉತ್ತೇಜಿಸಿದರು. ತಕ್ಷಣ ಎಲ್ಲರೂ, “ಚಂದ್ರಕಾಂತ ಸುರು ಮಾಡೋ” ಎಂದು ಕೂಗಿಕೊಂಡರು. ಅವನ ಧ್ವನಿಗೆ ತಮ್ಮ ಧ್ವನಿಯ ಅಲೆ ಸೇರಿಸಿದರು."
- id: story-n9
  type: prose
  section: story
  text: ಮಾರನೆಯ ದಿನ ಯಶೋದ ಹೊಸತನ್ನು ಹುಡುಕಿದ್ದಳು. ಇಬ್ಬರು ಆಡುವ ಆಟವನ್ನು ಎಲ್ಲರೂ ಭಾಗವಹಿಸುವಂತೆ ಪರಿವರ್ತಿಸಿದ್ದಳು. ‘ಕೈ ಎಲ್ಲಿಗ್ ಹೋತು?’ ಎಂದು ಒಬ್ಬ ಪ್ರಾರಂಭಿಸಿದರೆ ಪಕ್ಕದಲ್ಲಿರುವವಳು ‘ಸಂತೆಗೆ’ ಎನ್ನಬೇಕು. ಮತ್ತೆ ಅವಳ ಪಕ್ಕಕ್ಕೆ ನಿಂತವನು “ಸಂತೆಯಿಂದ ಏನ್ತಂದೆ” ಎಂದರೆ ಮುಂದಿನವಳು ‘ಬಾಳೆಹಣ್ಣು’ ಎನ್ನುವಳು. ಹೀಗೆ ಆಟ ಸಾಗುವುದು.
