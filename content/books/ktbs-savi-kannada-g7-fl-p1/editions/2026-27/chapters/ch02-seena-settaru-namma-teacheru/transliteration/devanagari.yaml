poem-s1l20: गुळुंगुळुं तिंदॆ.
story-n10: हीगॆ मत्तॆ इडी प्रश्नॆयुत्तरद चक्र तिरुगुवुदु. यशोदळ ई आटदिंद अंदु नाटि मुगियुव वेळॆगॆ प्रति मक्कळू नाल्कु बाळॆहण्णुगळन्नादरू तिंदिद्दरु. नाटि मुगियुववरॆगू सीनसॆट्रु मक्कळ जॊतॆगॆ इद्दु अल्लिंद कालकालक्कॆ अवरु गमनिसिकॊळ्ळबेकाद विषयगळन्नॆल्ला हेळिकॊट्टरु.
story-n11: नाटि मुगिद मेलॆ इन्नु यावाग हॊडॆ हॊरटितो, यावाग तॆनॆ बंदितो ऎंदु मक्कळ चडपडिकॆ. तुंगागंतू प्रतिदिन शालॆगॆ बंद तक्षण गद्दॆयन्नु नोडुववरॆगॆ ऎंतदो चडपडिकॆ. अवळू - किट्टनू सेरि मनॆय अट्टद मेलॆ हत्ति किटकि कंडियल्लि नोडिदरॆ गद्दॆ तुंबा चॆन्नागि काणुत्तदॆंदु कंडुकॊंडिद्दरु. ई रहस्य यारिगू तिळियबारदॆंदू गुट्टागिडलु प्रयत्निसिदष्टू अदु बयलागिबिट्टु कॊनॆगॆ अट्ट, गद्दॆ वीक्षणॆय टवर् आगि परिवर्तितगॊंडित्तु.
competency: 'कौशल: ओदुवुदु. सामर्थ्य: विविध पदगळ उच्चारणॆयल्लिरुव ध्वनिसाम्यतॆ, ध्वनिव्यत्यासगळन्नु अर्थमाडिकॊंडु ओदुवुदु. आशय: नम्म जीवनद प्रति हंतदल्लू नावु कलियुत्तिरुत्तेवॆ. नम्म व्यक्तित्वद बॆळवणिगॆ केवल शालॆयिंदल्ल; मनॆ, इतरर ऒडनाट, परिसर, माध्यमगळिंद जीवनद पाठवन्नु कलियुत्त बॆळॆयुत्तेवॆ. शालॆयल्लि गुरुगळिद्दंतॆ शालॆय हॊरगू हलवु गुरुगळु नमगिरुत्तारॆ. अवरॆल्लर कॊडुगॆयिंद बोधनॆयिंद नावॆल्ल बॆळॆयुत्ता होगुत्तेवॆ. ई विचार मनदल्लि मूडिदाग लोकवे नम्म गुरु ऎंब भावनॆ मूडुत्तदॆ.'
author-1: श्रीमति वि. गायत्रि लेखकि, अनुवादकि, शिक्षण इलाखॆय ‘महिळा समख्य’ मत्तु नीरावरि इलाखॆय ‘जल संवर्धनॆ योजनॆ’गळल्लि हिरिय अधिकारियागि अनेक वर्षगळवरॆगॆ सेवॆ सल्लिसिद्दारॆ. इवर प्रमुख प्रकटित कृतिगळु, ‘तुंगा’-मक्कळ सृजनशील कलिकॆय सुत्त हॆणॆद कादंबरि; ‘तॊत्तोचान्’ विश्वविख्यात जपानि कादंबरिय कन्नड अनुवाद. ‘कर्नाटकदल्लि सावयव परंपरॆय कथन भाग 1 मत्तु 2’, ‘सहज/सावयव रैतर कृषि मत्तु बदुकुगळु’, केंद्र परिसर मंत्रालयद परिसर शिक्षण केंद्रक्कागि ‘परिसर शिक्षणदल्लि अगत्य कलिकॆगळु’, ‘ऎळॆयरिगागि परिसर’ मुंताद महत्वद कृतिगळ अनुवाद मत्तु संपादनॆ. इवु शाला शिक्षकररिगॆ ओदुव सामग्रिगळागिवॆ. मेलिन पाठवन्नु अवर ‘तुंगा’ कृतियिंद आरिसलागिदॆ.
