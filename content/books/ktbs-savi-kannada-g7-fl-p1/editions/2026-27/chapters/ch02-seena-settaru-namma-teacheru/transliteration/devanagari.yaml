intro-1: प्रतिदिन मक्कळिगॆ ऒंदल्ल ऒंदु रीतिय कलिकॆयागुत्तिरुत्तदॆ. मनॆयल्लि तायि, तंदॆ, बंधुबळग, शालॆयल्लि गुरुगळु, सहपाठिगळु हीगॆ ऎल्लरिंदलू ऒंदल्ल ऒंदु कलिकॆयागुत्तिरुत्तदॆ. सैकल् हेळिकॊट्ट स्नेहितनू कूड ऒंदु रीतियल्लि टीचरे आगिद्दानॆ. हीगागि नम्म जीवनदल्लि हलवारु टीचर्गळु बंदु होगुत्तिरुत्तारॆ.
intro-2: ईजुवुदु, हाडुवुदु, कसूति कॆलस यावुदे आगलि अल्लि ऒब्ब टीचर् इरुत्तारॆ. अदे रीति यारिंद एने कलितरू अल्लि गुरुविन स्थानदल्लि ऒब्बरन्नु काणबहुदु. इदे रीति नमगॆ अनेक व्यक्तिगळिंद सहाय, सहकार, मार्गदर्शन सिक्के सिक्किरुत्तदॆ. अवरल्लू कूड टीचर्रन्नु काणबहुदु. अंतह ऒब्ब टीचरर कथॆ इल्लिदॆ.
story-n1: “इवरु इवत्तिनिंद निम्म टीचरु. इवरु निमगॆ एनॆल्ला कलिसिकॊडुत्तारॆ नोड्ता इरि” - मळॆगाल तीव्रगॊळ्ळुत्तिद्द आ दिन मांडवि हॊसा टीचरन्नु मक्कळिगॆ परिचयिसिदरु. तुंगा अवरन्नु सरियागि नोडिदळु. मॊदलनॆयदागि, आत वेषभूषणदिंद टीचररंतॆ काणुत्तिरलिल्ल. तुंबा हळॆयदाद ऒगॆद पंचॆयॊंदन्नु सॊंटक्कॆ सुत्ति मेलक्कॆ ऎत्ति कट्टिद्दरु. ऒगॆद चौकुळिय अंगि, अदक्किंत हळॆय टवलिनिंद तलॆगॆ लप्पटॆ सुत्तिकॊंडिद्दरु. अवरु पंचॆ सुत्तिरुव रीति अभ्यासविल्लद्दॆंदु ऎष्टु चॆन्नागि गॊत्तागुत्तित्तॆंदरॆ, चड्डिगॆ दॊरॆत प्रामुख्य पंचॆगॆ सिगदॆ अदु तुंबा अमुख्यनंतॆ मुदुरि कुळितित्तु. मक्कळिगॆल्ला “इवरॆंता टीचरप्पा” ऎंदु निरासॆयू कुतूहलवू आगित्तु.
story-n2: मांडविय आदेशदंतॆ मक्कळॆल्ला हळ्ळद दंडॆयल्लि कूडिकॊंडरु. तुंगागॆ तानु आ टीचरन्नु ऎल्लो नोडिद्देनॆ अन्निसुत्तित्तु. ऎल्लि ऎन्नुवुदु अष्टु सुलभवागि हॊळॆयलिल्ल. आतन स्नेहमय मुख बिसिलु-मळॆ-चळिगळिगॆ पक्कागि कर्रगॆ सुक्कुगट्टित्तु. आत तलॆगॆ सुत्तिद लप्पटॆयंतू तीरा परिचितवागित्तु. “हां, हौदु” नॆनपायितु. प्रतिसल सामेर मनॆ आलॆमनॆगॆ कोण हॊडॆदु तरुव सीनसॆट्टरु इवरु. तम्म मूरॆकरॆ जमीनिनल्लि तप्पदॆ सासिवॆ बॆळॆयुत्तिद्द ऒब्बरे रैत इवरु. तुंगाळ दूरद संबंधियाद सीनसॆट्टरिगू इवळ नॆनपित्तु. प्रीतियिंद अवळ तलॆ सवरि, “ऎंता, मगा, आरामा? अव्व-अप्पय्य चंद अदारा?” ऎंदु केळिदरु. ‘ओ’ तुंगा स्वल्प जोरागे हेळिदळु. हॊस टीचरु तन्न परिचयस्थरु ऎंदु इतर मक्कळॆदुरिगॆ तोरिसिकॊळ्ळुवुदु अवळिगॆ हॆम्मॆयॆनिसित्तु.
story-d1: हंगारॆ सीनसॆट्रु इन्नु नम्म टीचरु
story-d2: ना टीचरल्ल. ऎंता अल्ल. नानॊब्ब पडपोशि रैत. निम्म हॆड्मेडम्म निम्गॆल्ला गद्दॆ कॆल्स हेळ्कॊडाकॆ नन्न कर्सिदारॆ
story-d3: हौदु. हौदु, इवरु निम्म बेसायद टीचरु, निमगॆ बेसायदल्लि सहाय माडलु इवरु ऒप्पिकॊंडिरुवुदु नम्म पुण्य. सरि मेष्ट्रॆ, ईग नीवु प्रारंभिसबहुदु
story-n3: चिण्णर लोकद बहुपालु मक्कळु रैत कुटुंबदवरे. ऒंदल्ला ऒंदु रीतियल्लि बेसायदल्लि तॊडगिकॊळ्ळुत्तिद्द अवरिगॆ हॊसदागि बेसायवन्नेनू कलिसबेकागिरलिल्ल. आदरॆ शालॆय कलिकॆयल्लि बेसायवन्नु अळवडिसुव मांडविय उद्देशवे बेरॆयागित्तु. शाला शिक्षण निज बदुकिन जॊतॆगॆ हासुहॊक्किन संबंध हॊंदिरबेकॆंबुदे मांडविय नंबिकॆयागित्तु. अदे अवर शिक्षण मादरिय तळहदि कूडा. शाला शिक्षणदल्लि अवरु बेसायवन्नु अळवडिसलु मुख्यकारण इदागिद्दरू कूड अदु इन्नू अनेक विचारगळिगॆ सहायवागित्तु.
story-n4: मॊदलनॆयदागि, मण्णिन कणकणगळॊट्टिगॆ संवादिसबल्ल सीनसॆट्टरंतह रैतर अनुभवजन्य विवरणॆ तरगतियॊळगॆ नडॆयबेकाद अर्धपालु विज्ञानद पाठवन्नु गद्दॆयल्ले कलिसिबिडुत्तित्तु. ऎरडनॆयदागि, मक्कळु कुटुंबदॊंदिगॆ व्यवसायदल्लि पाल्गॊळ्ळुत्तिद्दरू अवरिगॆ सिगुत्तिद्दुदु ऎरडने स्थान, सीमित ऒळगॊळ्ळुविकॆ. आदरॆ इल्लि बेसायद ऎल्ला हंतगळल्लू ऎल्ला कॆलसगळन्नु, जवाब्दारिगळन्नु स्वतः तावे माडबेकाद्दरिंद अवरिगॆ इडियाद अनुभव सिगुत्तित्तु.
story-n5: हळ्ळद बदिय ऎरडॆकरॆ जमीनन्नु मांडवि बेसायक्कॆंदे कॊंडुकॊंडिद्दरु. हागॆये मनॆयल्लि मुंदुगडॆय ऒंदु रूमन्नु मक्कळिगॆ बेसायद सामग्रिगळन्नु इट्टुकॊळ्ळलॆंदु तॆरवु माडलागित्तु. ईगागले भत्त बित्तिद्द गद्दॆयदु. निल्ललि ऎंदरू केळदॆ जडिमळॆयल्ले शालॆय ऐवत्तू मक्कळु कंबळिगॊप्पॆ हाकिकॊंडु संभ्रमदिंद गद्दॆगिळिदरु सीनसॆट्टर जॊतॆ.
story-d4: मुंचॆ नावु ससिगळन्नु कीळाण. इवत्ते ससि कित्तु मुगीतंद्रॆ नाळॆयिंद नाटि माडाण
story-n6: मॊदमॊदलु मक्कळिगॆ हिडि तुंबा ससिगळन्नु बुडसमेत कीळुवुदु सुलभवागलिल्ल. अनेक ससिगळन्नु हाळु माडिदरु. हत्तारु बारि कित्तु कित्तु प्रयत्निसि अनंतर अवरिगॆ कीळुवुदु अभ्यासवागि वेगवू हिडियितु. अवुगळन्नु सण्ण सण्ण कट्टुगळल्लि कट्टि कॆसरु गद्दॆयल्लिडुवुदन्नु ‘टीचरु’ कलिसिकॊट्टरु.
story-n7: ऒंदु गंटॆय कॆलसद अनंतर सीनसॆट्टरु “इवत्तिगॆ साकु, नाळॆ उळिदद्दु” ऎंदरु. संभ्रम हिडिसिकॊंडिद्द मक्कळु केळियारॆ? “सीन सॆट्रॆ, निम्म दम्मय्य, इवत्तु पूरा कित्ते होगाण” ऎंदु ऒक्कॊरलिनिंद ऒत्तायपूर्वकवागि गोगरॆदरु. अष्टरल्ले ऒंदु सण्ण हावु अवसरदिंद सरियुत्ता हालप्प ऎन्नुववन कालन्नु कच्चिबिट्टितु. अवनु हौहारि बिद्द. तक्षण सीनसॆट्टरु अवनन्नु हिडिदुकॊंडरु.
story-d5: हॆदर्बेडा मगा, ऎंता आगल्ल. अदु नीरावु. विषद हावल्ल. ऒंदु मीनु कच्चिद्रॆ हॆंगो अष्टे
story-n8: मुंदिन दिनगळल्लि नाटि. इदु ससि कीळुवुदक्किंतलू कष्टकरवाद कॆलस. अनेक ससिगळन्नु ऒट्टिगॆ हिडिदु ऒंदे सलक्कॆ बेरु नाटुवंतॆ हॆब्बॆट्टिनिंद गट्टियागि ऒत्ति ऊरबेकु. मॊदमॊदलिगॆ कॆल मक्कळिगंतू इदु तम्मिंद साध्यवे इल्ल ऎनिसिबिट्टितु. आदरॆ सीनसॆट्टर अपार ताळ्मॆ, उत्तेजनगळु अवरन्नु कॆलसक्कॆ हॊंदिसिबिट्टवु. “हाडु हेळ्क्यंडु कॆलस माडि. आग कष्टाने तिळियल्ल” ऎंदु उत्तेजिसिदरु. तक्षण ऎल्लरू, “चंद्रकांत सुरु माडो” ऎंदु कूगिकॊंडरु. अवन ध्वनिगॆ तम्म ध्वनिय अलॆ सेरिसिदरु.
story-n9: मारनॆय दिन यशोद हॊसतन्नु हुडुकिद्दळु. इब्बरु आडुव आटवन्नु ऎल्लरू भागवहिसुवंतॆ परिवर्तिसिद्दळु. ‘कै ऎल्लिग् होतु?’ ऎंदु ऒब्ब प्रारंभिसिदरॆ पक्कदल्लिरुववळु ‘संतॆगॆ’ ऎन्नबेकु. मत्तॆ अवळ पक्कक्कॆ निंतवनु “संतॆयिंद एन्तंदॆ” ऎंदरॆ मुंदिनवळु ‘बाळॆहण्णु’ ऎन्नुवळु. हीगॆ आट सागुवुदु.
