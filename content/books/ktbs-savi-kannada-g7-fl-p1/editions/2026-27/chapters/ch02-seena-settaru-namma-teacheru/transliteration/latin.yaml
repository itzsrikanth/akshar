  exercise-A: a. kòṭṭiruva praśnègaḻigè òṃdu vākyadalli uttarisi.
  exercise-B: ā. kòṭṭiruva praśnègaḻigè èraḍu-mūru vākyadalli uttarisi.
  exercise-C: i. kèḻagina mātugaḻannu yāru, yārigè heḻidaru? tiḻisi.
intro-1: pratidina makkaḻigè òṃdalla òṃdu rītiya kalikèyāguttiruttadè. manèyalli tāyi, taṃdè, baṃdhubaḻaga, śālèyalli gurugaḻu, sahapāṭhigaḻu hīgè èllariṃdalū òṃdalla òṃdu kalikèyāguttiruttadè. saikal heḻikòṭṭa snehitanū kūḍa òṃdu rītiyalli ṭīcare āgiddānè. hīgāgi namma jīvanadalli halavāru ṭīcargaḻu baṃdu hoguttiruttārè.
intro-2: ījuvudu, hāḍuvudu, kasūti kèlasa yāvude āgali alli òbba ṭīcar iruttārè. ade rīti yāriṃda ene kalitarū alli guruvina sthānadalli òbbarannu kāṇabahudu. ide rīti namagè aneka vyaktigaḻiṃda sahāya, sahakāra, mārgadarśana sikke sikkiruttadè. avarallū kūḍa ṭīcarrannu kāṇabahudu. aṃtaha òbba ṭīcarara kathè illidè.
story-n1: “ivaru ivattiniṃda nimma ṭīcaru. ivaru nimagè enèllā kalisikòḍuttārè noḍtā iri” - maḻègāla tīvragòḻḻuttidda ā dina māṃḍavi hòsā ṭīcarannu makkaḻigè paricayisidaru. tuṃgā avarannu sariyāgi noḍidaḻu. mòdalanèyadāgi, āta veṣabhūṣaṇadiṃda ṭīcararaṃtè kāṇuttiralilla. tuṃbā haḻèyadāda ògèda paṃcèyòṃdannu sòṃṭakkè sutti melakkè ètti kaṭṭiddaru. ògèda caukuḻiya aṃgi, adakkiṃta haḻèya ṭavaliniṃda talègè lappaṭè suttikòṃḍiddaru. avaru paṃcè suttiruva rīti abhyāsavilladdèṃdu èṣṭu cènnāgi gòttāguttittèṃdarè, caḍḍigè dòrèta prāmukhya paṃcègè sigadè adu tuṃbā amukhyanaṃtè muduri kuḻitittu. makkaḻigèllā “ivarèṃtā ṭīcarappā” èṃdu nirāsèyū kutūhalavū āgittu.
story-n2: māṃḍaviya ādeśadaṃtè makkaḻèllā haḻḻada daṃḍèyalli kūḍikòṃḍaru. tuṃgāgè tānu ā ṭīcarannu èllo noḍiddenè annisuttittu. èlli ènnuvudu aṣṭu sulabhavāgi hòḻèyalilla. ātana snehamaya mukha bisilu-maḻè-caḻigaḻigè pakkāgi karragè sukkugaṭṭittu. āta talègè suttida lappaṭèyaṃtū tīrā paricitavāgittu. “hāṃ, haudu” nènapāyitu. pratisala sāmera manè ālèmanègè koṇa hòḍèdu taruva sīnasèṭṭaru ivaru. tamma mūrèkarè jamīninalli tappadè sāsivè bèḻèyuttidda òbbare raita ivaru. tuṃgāḻa dūrada saṃbaṃdhiyāda sīnasèṭṭarigū ivaḻa nènapittu. prītiyiṃda avaḻa talè savari, “èṃtā, magā, ārāmā? avva-appayya caṃda adārā?” èṃdu keḻidaru. ‘o’ tuṃgā svalpa jorāge heḻidaḻu. hòsa ṭīcaru tanna paricayastharu èṃdu itara makkaḻèdurigè torisikòḻḻuvudu avaḻigè hèmmèyènisittu.
story-d1: haṃgārè sīnasèṭru innu namma ṭīcaru
story-d2: nā ṭīcaralla. èṃtā alla. nānòbba paḍapośi raita. nimma hèḍmeḍamma nimgèllā gaddè kèlsa heḻkòḍākè nanna karsidārè
story-d3: haudu. haudu, ivaru nimma besāyada ṭīcaru, nimagè besāyadalli sahāya māḍalu ivaru òppikòṃḍiruvudu namma puṇya. sari meṣṭrè, īga nīvu prāraṃbhisabahudu
story-n3: ciṇṇara lokada bahupālu makkaḻu raita kuṭuṃbadavare. òṃdallā òṃdu rītiyalli besāyadalli tòḍagikòḻḻuttidda avarigè hòsadāgi besāyavannenū kalisabekāgiralilla. ādarè śālèya kalikèyalli besāyavannu aḻavaḍisuva māṃḍaviya uddeśave berèyāgittu. śālā śikṣaṇa nija badukina jòtègè hāsuhòkkina saṃbaṃdha hòṃdirabekèṃbude māṃḍaviya naṃbikèyāgittu. ade avara śikṣaṇa mādariya taḻahadi kūḍā. śālā śikṣaṇadalli avaru besāyavannu aḻavaḍisalu mukhyakāraṇa idāgiddarū kūḍa adu innū aneka vicāragaḻigè sahāyavāgittu.
story-n4: mòdalanèyadāgi, maṇṇina kaṇakaṇagaḻòṭṭigè saṃvādisaballa sīnasèṭṭaraṃtaha raitara anubhavajanya vivaraṇè taragatiyòḻagè naḍèyabekāda ardhapālu vijñānada pāṭhavannu gaddèyalle kalisibiḍuttittu. èraḍanèyadāgi, makkaḻu kuṭuṃbadòṃdigè vyavasāyadalli pālgòḻḻuttiddarū avarigè siguttiddudu èraḍane sthāna, sīmita òḻagòḻḻuvikè. ādarè illi besāyada èllā haṃtagaḻallū èllā kèlasagaḻannu, javābdārigaḻannu svataḥ tāve māḍabekāddariṃda avarigè iḍiyāda anubhava siguttittu.
story-n5: haḻḻada badiya èraḍèkarè jamīnannu māṃḍavi besāyakkèṃde kòṃḍukòṃḍiddaru. hāgèye manèyalli muṃdugaḍèya òṃdu rūmannu makkaḻigè besāyada sāmagrigaḻannu iṭṭukòḻḻalèṃdu tèravu māḍalāgittu. īgāgale bhatta bittidda gaddèyadu. nillali èṃdarū keḻadè jaḍimaḻèyalle śālèya aivattū makkaḻu kaṃbaḻigòppè hākikòṃḍu saṃbhramadiṃda gaddègiḻidaru sīnasèṭṭara jòtè.
story-d4: muṃcè nāvu sasigaḻannu kīḻāṇa. ivatte sasi kittu mugītaṃdrè nāḻèyiṃda nāṭi māḍāṇa
story-n6: mòdamòdalu makkaḻigè hiḍi tuṃbā sasigaḻannu buḍasameta kīḻuvudu sulabhavāgalilla. aneka sasigaḻannu hāḻu māḍidaru. hattāru bāri kittu kittu prayatnisi anaṃtara avarigè kīḻuvudu abhyāsavāgi vegavū hiḍiyitu. avugaḻannu saṇṇa saṇṇa kaṭṭugaḻalli kaṭṭi kèsaru gaddèyalliḍuvudannu ‘ṭīcaru’ kalisikòṭṭaru.
story-n7: òṃdu gaṃṭèya kèlasada anaṃtara sīnasèṭṭaru “ivattigè sāku, nāḻè uḻidaddu” èṃdaru. saṃbhrama hiḍisikòṃḍidda makkaḻu keḻiyārè? “sīna sèṭrè, nimma dammayya, ivattu pūrā kitte hogāṇa” èṃdu òkkòraliniṃda òttāyapūrvakavāgi gogarèdaru. aṣṭaralle òṃdu saṇṇa hāvu avasaradiṃda sariyuttā hālappa ènnuvavana kālannu kaccibiṭṭitu. avanu hauhāri bidda. takṣaṇa sīnasèṭṭaru avanannu hiḍidukòṃḍaru.
story-d5: hèdarbeḍā magā, èṃtā āgalla. adu nīrāvu. viṣada hāvalla. òṃdu mīnu kaccidrè hèṃgo aṣṭe
story-n8: muṃdina dinagaḻalli nāṭi. idu sasi kīḻuvudakkiṃtalū kaṣṭakaravāda kèlasa. aneka sasigaḻannu òṭṭigè hiḍidu òṃde salakkè beru nāṭuvaṃtè hèbbèṭṭiniṃda gaṭṭiyāgi òtti ūrabeku. mòdamòdaligè kèla makkaḻigaṃtū idu tammiṃda sādhyave illa ènisibiṭṭitu. ādarè sīnasèṭṭara apāra tāḻmè, uttejanagaḻu avarannu kèlasakkè hòṃdisibiṭṭavu. “hāḍu heḻkyaṃḍu kèlasa māḍi. āga kaṣṭāne tiḻiyalla” èṃdu uttejisidaru. takṣaṇa èllarū, “caṃdrakāṃta suru māḍo” èṃdu kūgikòṃḍaru. avana dhvanigè tamma dhvaniya alè serisidaru.
story-n9: māranèya dina yaśoda hòsatannu huḍukiddaḻu. ibbaru āḍuva āṭavannu èllarū bhāgavahisuvaṃtè parivartisiddaḻu. ‘kai èllig hotu?’ èṃdu òbba prāraṃbhisidarè pakkadalliruvavaḻu ‘saṃtègè’ ènnabeku. mattè avaḻa pakkakkè niṃtavanu “saṃtèyiṃda entaṃdè” èṃdarè muṃdinavaḻu ‘bāḻèhaṇṇu’ ènnuvaḻu. hīgè āṭa sāguvudu.
