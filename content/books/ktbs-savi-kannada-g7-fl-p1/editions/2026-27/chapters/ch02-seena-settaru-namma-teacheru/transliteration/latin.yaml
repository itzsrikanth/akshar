story-n10: hīgè mattè iḍī praśnèyuttarada cakra tiruguvudu. yaśodaḻa ī āṭadiṃda aṃdu nāṭi mugiyuva veḻègè prati makkaḻū nālku bāḻèhaṇṇugaḻannādarū tiṃdiddaru. nāṭi mugiyuvavarègū sīnasèṭru makkaḻa jòtègè iddu alliṃda kālakālakkè avaru gamanisikòḻḻabekāda viṣayagaḻannèllā heḻikòṭṭaru.
story-n11: nāṭi mugida melè innu yāvāga hòḍè hòraṭito, yāvāga tènè baṃdito èṃdu makkaḻa caḍapaḍikè. tuṃgāgaṃtū pratidina śālègè baṃda takṣaṇa gaddèyannu noḍuvavarègè èṃtado caḍapaḍikè. avaḻū - kiṭṭanū seri manèya aṭṭada melè hatti kiṭaki kaṃḍiyalli noḍidarè gaddè tuṃbā cènnāgi kāṇuttadèṃdu kaṃḍukòṃḍiddaru. ī rahasya yārigū tiḻiyabāradèṃdū guṭṭāgiḍalu prayatnisidaṣṭū adu bayalāgibiṭṭu kònègè aṭṭa, gaddè vīkṣaṇèya ṭavar āgi parivartitagòṃḍittu.
competency: 'kauśala: oduvudu. sāmarthya: vividha padagaḻa uccāraṇèyalliruva dhvanisāmyatè, dhvanivyatyāsagaḻannu arthamāḍikòṃḍu oduvudu. āśaya: namma jīvanada prati haṃtadallū nāvu kaliyuttiruttevè. namma vyaktitvada bèḻavaṇigè kevala śālèyiṃdalla; manè, itarara òḍanāṭa, parisara, mādhyamagaḻiṃda jīvanada pāṭhavannu kaliyutta bèḻèyuttevè. śālèyalli gurugaḻiddaṃtè śālèya hòragū halavu gurugaḻu namagiruttārè. avarèllara kòḍugèyiṃda bodhanèyiṃda nāvèlla bèḻèyuttā hoguttevè. ī vicāra manadalli mūḍidāga lokave namma guru èṃba bhāvanè mūḍuttadè.'
author-1: śrīmati vi. gāyatri lekhaki, anuvādaki, śikṣaṇa ilākhèya ‘mahiḻā samakhya’ mattu nīrāvari ilākhèya ‘jala saṃvardhanè yojanè’gaḻalli hiriya adhikāriyāgi aneka varṣagaḻavarègè sevè sallisiddārè. ivara pramukha prakaṭita kṛtigaḻu, ‘tuṃgā’-makkaḻa sṛjanaśīla kalikèya sutta hèṇèda kādaṃbari; ‘tòttocān’ viśvavikhyāta japāni kādaṃbariya kannaḍa anuvāda. ‘karnāṭakadalli sāvayava paraṃparèya kathana bhāga 1 mattu 2’, ‘sahaja/sāvayava raitara kṛṣi mattu badukugaḻu’, keṃdra parisara maṃtrālayada parisara śikṣaṇa keṃdrakkāgi ‘parisara śikṣaṇadalli agatya kalikègaḻu’, ‘èḻèyarigāgi parisara’ muṃtāda mahatvada kṛtigaḻa anuvāda mattu saṃpādanè. ivu śālā śikṣakararigè oduva sāmagrigaḻāgivè. melina pāṭhavannu avara ‘tuṃgā’ kṛtiyiṃda ārisalāgidè.
