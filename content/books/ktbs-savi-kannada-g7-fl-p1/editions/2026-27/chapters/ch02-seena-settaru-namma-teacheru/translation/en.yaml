intro-1: 'Every day children learn something or the other. At home from mother, father and relatives, at school from teachers and classmates—from everyone, some learning keeps happening. Even the friend who taught cycling is in a way a teacher. Thus many teachers keep coming and going in our lives.'

intro-2: 'Whether swimming, singing or embroidery, there is a teacher there. In the same way, whoever you learn from, you can see someone in the place of a guru. Likewise we keep receiving help, cooperation and guidance from many people. In them too we can see teachers. Here is the story of one such teacher.'

story-n1: '"From today this person is your teacher. Keep watching all that he will teach you"—that day when the rainy season was intensifying, Mandavi introduced the new teacher to the children. Tunga looked at him properly. First of all, from dress he did not look like a teacher. He had wrapped a very old washed dhoti around his waist and tucked it up. A washed checkered shirt, and on his head a turban from an even older towel. From the way he wrapped the dhoti it was clear he was unused to it—so much so that the importance the shorts got, the dhoti did not, and it sat crumpled as if unimportant. All the children felt both disappointment and curiosity: "What kind of teacher is this?"'

story-n2: 'As Mandavi ordered, all the children gathered on the stream bank. Tunga felt she had seen that teacher somewhere. Where did not come easily. His friendly face, weathered by sun, rain and cold, was dark and wrinkled. The turban on his head was thoroughly familiar. "Ah, yes," she remembered. Seena Settaru who every time drove buffaloes to Samera’s oil-press house—these were they. The only farmer who without fail grew mustard on his three acres. Seena Settaru, a distant relative of Tunga, also remembered her. Lovingly stroking her head he asked, "How are you, child? Are you well? Are amma and appa well?" "O," Tunga said a bit loudly. Showing before the other children that the new teacher was her acquaintance made her feel proud.'

story-d1: 'So then Seena Settaru is our teacher now'

story-d2: 'I am not a teacher. Not like that. I am just a useless farmer. Your headmistress has called me to teach you all field work'

story-d3: 'Yes, yes, he is your farming teacher; that he has agreed to help you in farming is our good fortune. All right, master, you may begin now'

story-n3: 'Most children of the little ones’ world were from farming families. In one way or another they were already involved in farming, so nothing new about farming needed teaching. But Mandavi’s purpose in fitting farming into school learning was different. Her belief was that school education should have an intertwined relationship with real life. That was also the foundation of her teaching model.'

story-n4: 'First, experiential explanation by farmers like Seena Settaru who can converse with every grain of soil taught half the science lesson that should happen in class right in the field. Second, though children took part in farming with the family they got only a second place, limited inclusion. But here because they themselves had to do all work and responsibilities at every stage of farming, they got the complete experience.'

story-n5: 'Mandavi had bought two acres by the stream just for farming. Likewise a front room at home had been cleared for children to keep farming tools. The field already had paddy sown. Without listening when told to stop, all fifty school children, putting on blanket-hoods in the pouring rain, joyfully entered the field with Seena Settaru.'

story-d4: 'First we will pull up seedlings. If we finish pulling today, from tomorrow we will transplant'

story-n6: 'At first pulling a fistful of seedlings with roots was not easy for the children. They ruined many seedlings. After trying again and again ten times, pulling became practice and speed came. The ‘teacher’ taught tying them in small bundles and placing them in the muddy field.'

story-n7: 'After an hour’s work Seena Settaru said, "Enough for today, the rest tomorrow." The children caught up in excitement—would they listen? "Seena Setru, by your strength, let’s pull everything today," they insisted in one voice. Just then a small snake hurriedly slithering bit Halappa’s foot. He cried out and fell. At once Seena Settaru held him.'

story-d5: 'Don’t fear, child, nothing will happen. That is a water snake. Not a poisonous snake. Like a fish biting, that’s all'

story-n8: 'In the following days, transplanting. This was harder work than pulling seedlings. Holding many seedlings together one must firmly press with the big toe so roots plant at once. At first some children felt this was impossible for them. But Seena Settaru’s immense patience and encouragement fitted them to the work. “Work while singing. Then you won’t even know the hardship,” he encouraged. At once everyone shouted, “Chandrakant, start!” and joined their voices to his.'

story-n9: 'The next day Yashoda had found something new. She turned a two-person game into one everyone joined. When one begins ‘Where did the hand go?’ the one beside should say ‘To the market.’ Then the next asks “What did you bring from the market” and the next says ‘banana.’ Thus the game goes on.'

poem-s1l1: 'What did you do with the banana?'

poem-s1l2: 'Ate it'

poem-s1l3: 'What did you do with the peel?'

poem-s1l4: 'Put it in the corner of the door'

poem-s1l5: 'What did the door-corner give?'

poem-s1l6: 'Gave bark/chips'

poem-s1l7: 'What did you do with the chips?'

poem-s1l8: 'Put them in the stove'

poem-s1l9: 'What did the stove give?'

poem-s1l10: 'Gave ash'

poem-s1l11: 'What did you do with the ash?'

poem-s1l12: 'Put it in the manure pit'

poem-s1l13: 'What did the manure pit give?'

poem-s1l14: 'Gave manure'

poem-s1l15: 'What did you do with the manure?'

poem-s1l16: 'Put it on the banana plant'

poem-s1l17: 'What did the banana plant give?'

poem-s1l18: 'Gave bananas'

poem-s1l19: 'What did you do with the banana?'

poem-s1l20: 'Gulped it down.'

story-n10: 'Thus the whole question-answer cycle turns again. From Yashoda’s this game, by the time transplanting ended that day each child had eaten at least four bananas. Until transplanting ended Seena Settaru stayed with the children and from time to time told them all they needed to watch.'

story-n11: 'After transplanting, the children’s restlessness about when the ear would appear and when the grain-head would come. Tunga especially had some restlessness every day until she saw the field as soon as she came to school. She and Kitta had discovered that climbing to the attic and looking through the window slit the field looked very nice. The more they tried to keep this secret, the more it came out, and finally the attic became a tower for viewing the field.'

competency: 'Skill: reading. Ability: reading while understanding sound similarities and differences in pronunciation of various words. Intent: At every stage of life we keep learning. Our personality does not grow only from school; from home, company of others, environment and media we learn life’s lessons and grow. Just as there are teachers in school, outside school too we have many teachers. From all their gifts and teaching we keep growing. When this thought arises, the feeling that the world itself is our teacher arises.'

author-1: 'Smt V. Gayatri, writer and translator, served for many years as a senior officer in the Education Department’s ‘Mahila Samakhya’ and the Irrigation Department’s ‘Jala Samvardhana Yojane’. Her major published works include ‘Tunga’—a novel woven around children’s creative learning; Kannada translation of the world-famous Japanese novel ‘Totto-chan’. Also translation and editing of important works such as ‘Karnatakadalli Savayava Paramparaya Kathana Parts 1 and 2’, ‘Sahaja/Savayava Raitara Krishi mattu Badukugalu’, ‘Parisara Shikshanadalli Agatya Kalikegalu’ for the central environment ministry’s environmental education centre, and ‘Eleyarigagi Parisara’. These are reading materials for school teachers. The present lesson is selected from her work ‘Tunga’.'

