  exercise-A: 'अ. एक वाक्य में उत्तर दीजिए।'
  exercise-B: 'आ. दो-तीन वाक्यों में उत्तर दीजिए।'
  exercise-C: 'इ. ये बातें किसने किससे कही?'

intro-1: 'प्रतिदिन बच्चों को किसी न किसी तरह की सीख मिलती रहती है। घर में माता-पिता और परिजनों से, स्कूल में गुरुओं और सहपाठियों से—सबसे कुछ न कुछ सीख मिलती रहती है।'

intro-2: 'तैरना हो, गाना हो या कशीदा—वहाँ एक शिक्षक होता है। उसी तरह जिससे भी कुछ सीखा, वहाँ गुरु के स्थान पर किसी को देखा जा सकता है। ऐसे ही एक शिक्षक की कथा यहाँ है।'

story-d1: 'तो फिर सीन सेट्टरु अब हमारे टीचर हैं'

story-d2: 'मैं टीचर नहीं। वैसा नहीं। मैं एक बेकार किसान हूँ। आपकी हेडमिस्ट्रेस ने आपको खेत का काम सिखाने मुझे बुलाया है'

story-d3: 'हाँ हाँ, ये आपके खेती के टीचर हैं; खेती में मदद करने को इन्होंने स्वीकार किया यह हमारा पुण्य है'

story-d4: 'पहले हम पौधे उखाड़ेंगे। आज ही उखाड़ लिया तो कल से रोपाई करेंगे'

story-d5: 'मत डरो बेटा, कुछ नहीं होगा। वह जलसर्प है। विषैला साँप नहीं'

competency: 'कौशल: पढ़ना। सामर्थ्य: विभिन्न शब्दों के उच्चारण में ध्वनि-साम्य और भेद समझकर पढ़ना। आशय: जीवन के प्रत्येक चरण में हम सीखते रहते हैं। व्यक्तित्व का विकास केवल स्कूल से नहीं; घर, संगति, परिवेश और माध्यमों से जीवन के पाठ सीखते हुए हम बढ़ते हैं।'

author-1: 'श्रीमती वी. गायत्री लेखिका और अनुवादिका हैं। प्रस्तुत पाठ उनकी कृति ‘तुंगा’ से चुना गया है।'

