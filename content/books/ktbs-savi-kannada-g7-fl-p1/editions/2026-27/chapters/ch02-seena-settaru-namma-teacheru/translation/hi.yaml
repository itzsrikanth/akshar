ex-a-q1: 'मांडवी टीचर ने किसे परिचय दिया?'

ex-a-q2: 'सीन सेट्टरु ज़मीन में क्या उगाते थे?'

ex-a-q3: 'बच्चे क्या पहनकर खेत में उतरे?'

ex-a-q4: 'हालप्प के पैर को क्या काटा?'

ex-a-q5: 'घर की अटारी बच्चों के लिए किस टॉवर में बदल गई?'

ex-b-q1: 'सीन सेट्टरु का वेष कैसा था?'

ex-b-q2: 'बच्चों ने पौधे कैसे उखाड़े?'

ex-b-q3: 'हालप्प को साँप काटने पर सीन सेट्टरु ने क्या कहा?'

ex-c-q1: '‘तो सीन सेट्टरु हमारे टीचर’'

ex-c-q2: '‘पहले पौधे उखाड़ेंगे’'

ex-c-q3: '‘आज पूरा उखाड़ लें’'

ex-c-q4: '‘हाथ कहाँ गया’'
