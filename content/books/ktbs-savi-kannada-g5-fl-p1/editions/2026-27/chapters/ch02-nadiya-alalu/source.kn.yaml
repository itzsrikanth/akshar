  - id: grammar-p1
    type: prose
    section: grammar
    text: "ಸಂಯುಕ್ತಾಕ್ಷರಗಳು (ಒತ್ತಕ್ಷರಗಳು)\nಎರಡು ಅಥವಾ ಎರಡಕ್ಕಿಂತ ಹೆಚ್ಚು ವ್ಯಂಜನಗಳಿಗೆ ಒಂದು ಸ್ವರ ಸೇರಿ ಆಗುವ ಅಕ್ಷರವೇ ಸಂಯುಕ್ತಾಕ್ಷರ ಅಥವಾ ಒತ್ತಕ್ಷರ. (ವ್ಯಂಜನ + ವ್ಯಂಜನ + ಸ್ವರ = ಸಂಯುಕ್ತಾಕ್ಷರ)"

  - id: grammar-p2
    type: prose
    section: grammar
    text: ಸಂಯುಕ್ತಾಕ್ಷರಗಳಲ್ಲಿ ಎರಡು ವಿಭಾಗಗಳಿವೆ. 1) ಸಜಾತೀಯ ಸಂಯುಕ್ತಾಕ್ಷರಗಳು 2) ವಿಜಾತೀಯ ಸಂಯುಕ್ತಾಕ್ಷರಗಳು

  - id: grammar-p3
    type: prose
    section: grammar
    text: 'ಒಂದೇ ಜಾತಿಯ ಎರಡು ವ್ಯಂಜನಗಳು (ಸ್ವರದ ಸಹಾಯದಿಂದ) ಒಂದಕ್ಕೊಂದು ಸೇರಿದರೆ ಸಜಾತೀಯ ಸಂಯುಕ್ತಾಕ್ಷರಗಳಾಗುವುವು. ಉದಾ :- ಅ + ಕ್ + ಕ್ + ಅ = ಅಕ್ಕ. ಇಲ್ಲಿ ಕ್ + ಕ್ (+ಅ) ಇವು ಸಜಾತೀಯ ವ್ಯಂಜನಗಳಾಗಿದ್ದು, ಇವು ಒಂದಕ್ಕೊಂದು ಕೂಡಿ ‘ಕ್ಕ’ ಎಂಬ ಸಜಾತೀಯ ಸಂಯುಕ್ತಾಕ್ಷರವಾಗಿದೆ. ಉದಾ :- ಅಪ್ಪ, ಅಮ್ಮ, ಅಣ್ಣ, ಅಕ್ಕರ, ಅಕ್ಕಪಕ್ಕ, ರಕ್ಕಸ ಇತ್ಯಾದಿ.'

  - id: grammar-p4
    type: prose
    section: grammar
    text: 'ಬೇರೆ ಬೇರೆ ಜಾತಿಯ ಎರಡು ಅಥವಾ ಹೆಚ್ಚು ವ್ಯಂಜನಗಳು (ಸ್ವರದ ಸಹಾಯದಿಂದ) ಒಂದಕ್ಕೊಂದು ಕೂಡಿಕೊಂಡು ಉಂಟಾಗುವ ಅಕ್ಷರವು ವಿಜಾತೀಯ ಸಂಯುಕ್ತಾಕ್ಷರ ವೆನಿಸುವುದು. ಉದಾ : ಭ್ + ಅ + ಕ್ + ತ್ + ಅ = ಭಕ್ತ. ಇಲ್ಲಿ ಕ್ + ತ್ (+ ಅ).ಇವು ವಿಜಾತೀಯ ಸಂಯುಕ್ತಾಕ್ಷರ ವ್ಯಂಜನಗಳಾಗಿದ್ದು, ಇವೆರಡು ಕೂಡಿ ‘ಕ್ತ’ ಎಂಬ ವಿಜಾತೀಯ ಸಂಯುಕ್ತಾಕ್ಷರವಾಗಿದೆ. ಉದಾ:- ಚಕ್ರ, ಆಜ್ಞೆ, ಸ್ತ್ರೀ, ವಸ್ತ್ರ ಇತ್ಯಾದಿ.'

  - id: grammar-a-q1
    type: question
    exercise: grammar-A
    text: 1. ಸಂಯುಕ್ತಾಕ್ಷರಗಳು ಎಂದರೇನು ?

