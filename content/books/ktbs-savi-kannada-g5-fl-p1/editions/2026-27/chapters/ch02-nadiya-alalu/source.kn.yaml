    text: 2. ಕೆಳಗೆ ಕೊಟ್ಟಿರುವ ಸಂಯುಕ್ತಾಕ್ಷರಗಳನ್ನು ಸಜಾತೀಯ, ವಿಜಾತೀಯ ಸಂಯುಕ್ತಾಕ್ಷರಗಳನ್ನಾಗಿ ವಿಂಗಡಿಸಿ ಬರೆಯಿರಿ. ಕ್ಕ, ಪ್ತ, ಸ್ವ, ರ್ರ, ಜ್ಜ, ಸ್ವ, ಸ್ಥ, ರ್ಯ, ಡ್ಗ, ಮ್ಮ

