segments:
  - id: intro-1
    type: prose
    section: intro
    text: ನಾವು ಇಂದು ನೀರಿನ ಮೂಲಗಳಾದ ಕೆರೆ, ಬಾವಿ, ನದಿ ಮೊದಲಾದವುಗಳನ್ನು ಸರಿಯಾದ ರೀತಿಯಲ್ಲಿ ರಕ್ಷಿಸದೆ ಅವುಗಳನ್ನು ಕಲುಷಿತಗೊಳಿಸುತ್ತಿದ್ದೇವೆ. ಇದರಿಂದಾಗಿ ನಮ್ಮ ಬದುಕಿಗೆ ಸಂಚಕಾರ ಎದುರಾಗುತ್ತಿದೆ. ನಮ್ಮ ಸುತ್ತಲಿನ ನೀರಿನ ಮೂಲಗಳನ್ನು ಶುದ್ಧವಾಗಿಡುವುದು ಅತ್ಯಗತ್ಯ.

  - id: intro-2
    type: prose
    section: intro
    text: "[ಶಾಲಾ ಮಕ್ಕಳು ಗುಂಪುಗುಂಪಾಗಿ ಸೇರಿದ್ದಾರೆ. ಎಲ್ಲರ ಮುಖದಲ್ಲೂ ಆತಂಕ. ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ದಾಖಲಾಗಿರುವ ಸಹಪಾಠಿಗಳ ಆರೋಗ್ಯವನ್ನು ತಿಳಿಯುವ ತವಕ. ಮಕ್ಕಳು ತಮ್ಮ ತಮ್ಮಲ್ಲಿಯೇ ಸಂಭಾಷಿಸುತ್ತಿದ್ದಾರೆ.]"

  - id: story-d1
    type: dialogue
    section: story
    speaker: ಕಲಾವತಿ
    text: ಎಂಥ ಅನಾಹುತ ನಡೆದುಹೋಯಿತು! ನಮ್ಮ ಗೆಳೆಯ ಗೆಳತಿಯರಿಗೆ ಹೀಗೆ ಆಗಬಾರದಿತ್ತು.

  - id: story-d2
    type: dialogue
    section: story
    speaker: ಸ್ನೇಹ
    text: ಅವರಿಗೆ ಏನಾಯಿತು?

  - id: story-d3
    type: dialogue
    section: story
    speaker: ಮನು
    text: ಅಯ್ಯೋ! ನಿನಗೆ ತಿಳಿದಿಲ್ಲವೆ? ಈಜಲು ಹೋದ ಅವರೆಲ್ಲರೂ ಆಸ್ಪತ್ರೆಗೆ ದಾಖಲಾಗಿದ್ದಾರೆ.

  - id: story-d4
    type: dialogue
    section: story
    speaker: ಶಾಂತಲೆ
    text: ಆಸ್ಪತ್ರೆಗೆ ದಾಖಲಾಗಲು ಅವರಿಗೆ ಏನಾಗಿತ್ತು?

  - id: story-d5
    type: dialogue
    section: story
    speaker: ಸಲೀಮುಲ್ಲಾ
    text: ನಿನ್ನೆ ಭಾನುವಾರ ಶಾಲೆಗೆ ರಜೆ ಇತ್ತಲ್ಲವೇ? ಅವರೆಲ್ಲರೂ ಬೆಳಗ್ಗೆ ಆಟವಾಡಲು ಹೋಗಿದ್ದರು. ಮಧ್ಯಾಹ್ನದವರೆಗೂ ಆಟವಾಡಿ ಅನಂತರ ಸೆಕೆಯನ್ನು ತಾಳಲಾರದೆ ಊರಿನ ಪಕ್ಕದ ನದಿಯಲ್ಲಿ ಸ್ನಾನ ಮಾಡಿದರು.

  - id: story-d6
    type: dialogue
    section: story
    speaker: ಸಲೀಮುಲ್ಲಾ
    text: ಪರಿಣಾಮವಾಗಿ ಅವರ ಮೈಮೇಲೆಲ್ಲಾ ದಪ್ಪ ದಪ್ಪ ಗುಳ್ಳೆಗಳು ಎದ್ದು ವಿಪರೀತ ತುರಿಕೆ ಪ್ರಾರಂಭವಾಯಿತು. ನೋವು ತಾಳಲಾರದೆ ದಂಡೆಯಲ್ಲಿ ಬಿದ್ದು ಹೊರಳಾಡಿದರು. ಯಾರೋ ದಾರಿಹೋಕರು ನರಳಾಟ ಕಂಡು ಅವರನ್ನು ಎತ್ತಿಕೊಂಡು ಹೋಗಿ ಆಸ್ಪತ್ರೆಗೆ ಸೇರಿಸಿದರು. ಅವರ ಆರೋಗ್ಯ ತೀರ ಹದಗೆಟ್ಟಿತ್ತು.

  - id: story-n1
    type: prose
    section: story
    text: (ಮಕ್ಕಳು ಆಸ್ಪತ್ರೆಗೆ ಬರುತ್ತಾರೆ. ವೈದ್ಯರು ಪರೀಕ್ಷಾ ಕೊಠಡಿಯಿಂದ ಹೊರಬರುತ್ತಾರೆ.)

  - id: story-d7
    type: dialogue
    section: story
    speaker: ದಿಲೀಪ್
    text: ನಮ್ಮ ಗೆಳೆಯರ ಸ್ಥಿತಿ ಹೇಗಿದೆ ಡಾಕ್ಟರ್?

  - id: story-d8
    type: dialogue
    section: story
    speaker: ವೈದ್ಯರು
    text: ಇನ್ನೂ ಏನನ್ನು ಹೇಳುವಂತಿಲ್ಲ ಮಕ್ಕಳೆ! ಆದರೆ ಚಿಂತೆಗೆ ಕಾರಣವಿಲ್ಲ ಅಂತ ತೋರುತ್ತದೆ.

  - id: story-d9
    type: dialogue
    section: story
    speaker: ರಮ್ಯ
    text: ಅವರಿಗೆ ಏನಾಗಿತ್ತು ಡಾಕ್ಟರ್?

  - id: story-d10
    type: dialogue
    section: story
    speaker: ವೈದ್ಯರು
    text: ಅವರಿಗೆ ನದಿಯ ನೀರಿನ ಮಾಲಿನ್ಯದ ಸೋಂಕು ತಗುಲಿದೆ. ಪರಿಣಾಮವಾಗಿ ಇಡೀ ದೇಹದಲ್ಲಿ ಗುಳ್ಳೆಗಳೆದ್ದಿವೆ. ತುರಿಕೆ ತಡೆಯಲಾರದೆ ಮೂರ್ಛೆ ಹೋಗಿದ್ದಾರೆ.

  - id: story-d11
    type: dialogue
    section: story
    speaker: ದೀಪಕ್
    text: ಹಾಗಾದರೆ ನದಿಯ ನೀರು ಮಲಿನವಾಗಲು ಕಾರಣವೇನು?

  - id: story-d12
    type: dialogue
    section: story
    speaker: ವೈದ್ಯರು
    text: ಮನುಷ್ಯರ ಸ್ವಾರ್ಥವೇ ಇದಕ್ಕೆ ಕಾರಣ.

  - id: story-d13
    type: dialogue
    section: story
    speaker: ದಿಲೀಪ್
    text: ಡಾಕ್ಟರ್, ನಾವು ನದಿಯ ಹತ್ತಿರ ಹೋಗಿ ಬರೋಣವೆ?

  - id: story-d14
    type: dialogue
    section: story
    speaker: ವೈದ್ಯರು
    text: ಆಗಬಹುದು, ಹೋಗಿ ಬನ್ನಿ.

  - id: story-n2
    type: prose
    section: story
    text: (ಮಕ್ಕಳೆಲ್ಲರೂ ನದಿಯ ಹತ್ತಿರ ಬರುತ್ತಾರೆ. ನದಿಯ ದಡದಲ್ಲಿ ನಿಂತು ನೋಡುತ್ತಾರೆ.)

  - id: story-d15
    type: dialogue
    section: story
    speaker: ಶಾಂತಲೆ
    text: ಛೇ! ಎಂಥ ವಾಸನೆ! ಇಲ್ಲಿ ನಿಲ್ಲಲು ಆಗುತ್ತಿಲ್ಲ.

  - id: story-d16
    type: dialogue
    section: story
    speaker: ದೀಪಕ್
    text: ಹೌದು, ಈ ನದಿಯ ನೀರು ಎಷ್ಟು ಕಲುಷಿತವಾಗಿದೆ.

  - id: story-d17
    type: dialogue
    section: story
    speaker: ನದಿ
    text: (ಅಳುತ್ತಾ) ಮಕ್ಕಳೇ, ನೀವು ಹೇಳುತ್ತಿರುವುದು ನಿಜ.

  - id: story-d18
    type: dialogue
    section: story
    speaker: ದಿಲೀಪ್
    text: (ಆಶ್ಚರ್ಯದಿಂದ) ಯಾರು ಮಾತನಾಡುತ್ತಿರುವುದು?

  - id: story-d19
    type: dialogue
    section: story
    speaker: ನದಿ
    text: ನಾನೇ ನದಿ ಮಾತನಾಡುತ್ತಿರುವುದು.

  - id: story-d20
    type: dialogue
    section: story
    speaker: ರಮ್ಯ
    text: ಅಯ್ಯೋ ನದಿಯೇ, ನೀನೇಕೆ ಅಳುತ್ತಿದ್ದೀಯೆ? ನಿನಗೇನಾಗಿದೆ?

  - id: story-d21
    type: dialogue
    section: story
    speaker: ನದಿ
    text: ನನ್ನ ಅಳಲನ್ನು ಯಾರ ಬಳಿ ಹೇಳಿಕೊಳ್ಳಲಿ? ನನ್ನ ಈ ದುಸ್ಥಿತಿಗೆ ಮನುಷ್ಯರೇ ಕಾರಣ.

  - id: story-d22
    type: dialogue
    section: story
    speaker: ದಿಲೀಪ್
    text: ಮನುಷ್ಯರು ನಿನಗೇನು ಮಾಡಿದರು?

  - id: story-d23
    type: dialogue
    section: story
    speaker: ನದಿ
    text: ಹಿಂದೆ ನಾನು ಎಷ್ಟು ಶುದ್ಧವಾಗಿದ್ದೆ ಗೊತ್ತೆ? ನನ್ನ ನೀರು ಗಾಜಿನಂತೆ ಸ್ವಚ್ಛವಾಗಿತ್ತು. ನನ್ನ ಒಡಲಲ್ಲಿ ಜಲಚರಗಳು ನಿರ್ಭಯವಾಗಿ ಜೀವಿಸುತ್ತಿದ್ದವು. ಪ್ರಾಣಿ, ಪಕ್ಷಿಗಳು, ಮನುಷ್ಯರು ನನ್ನ ನೀರನ್ನು ಕುಡಿದು ಸಂತೋಷದಿಂದ ಬದುಕುತ್ತಿದ್ದರು. ಆದರೆ, ಈಗ ನನ್ನ ನೀರು ವಿಷವಾಗಿದೆ.

  - id: story-d24
    type: dialogue
    section: story
    speaker: ಶಾಂತಲೆ
    text: ನಿನ್ನ ನೀರು ವಿಷವಾಗಲು ಕಾರಣವೇನು?

  - id: story-d25
    type: dialogue
    section: story
    speaker: ನದಿ
    text: ಕಾರ್ಖಾನೆಗಳಿಂದ ಹೊರಬರುವ ರಾಸಾಯನಿಕ ವಸ್ತುಗಳು, ಊರಿನ ಚರಂಡಿ ನೀರು, ಕಸಕಡ್ಡಿ, ಪ್ಲಾಸ್ಟಿಕ್ ಎಲ್ಲವೂ ನನ್ನ ಒಡಲು ಸೇರುತ್ತಿವೆ. ಇದರಿಂದ ನನ್ನ ನೀರು ಕಲುಷಿತಗೊಂಡು ವಿಷವಾಗಿದೆ.

  - id: story-d26
    type: dialogue
    section: story
    speaker: ದೀಪಕ್
    text: ಹೌದು, ನಿನ್ನ ನೀರನ್ನು ಕುಡಿದು ಎಷ್ಟೋ ಪ್ರಾಣಿ ಪಕ್ಷಿಗಳು ಸತ್ತಿವೆ. ನಮ್ಮ ಗೆಳೆಯರು ನಿನ್ನ ನೀರಿನಲ್ಲಿ ಈಜಿದ್ದರಿಂದಲೇ ಆಸ್ಪತ್ರೆ ಸೇರಿದ್ದಾರೆ.

  - id: story-d27
    type: dialogue
    section: story
    speaker: ನದಿ
    text: (ದುಃಖದಿಂದ) ನನ್ನಿಂದ ಯಾರಿಗೂ ತೊಂದರೆಯಾಗಬಾರದು ಎಂಬುದು ನನ್ನ ಆಸೆ. ಆದರೆ, ಮನುಷ್ಯರು ನನ್ನನ್ನು ಹಾಳುಮಾಡುತ್ತಿದ್ದಾರೆ.

  - id: story-d28
    type: dialogue
    section: story
    speaker: ಕಲಾವತಿ
    text: ನದಿಯೇ, ಅಳಬೇಡ. ನಿನ್ನನ್ನು ರಕ್ಷಿಸುವ ಜವಾಬ್ದಾರಿ ನಮ್ಮದು. ನಾವು ಇನ್ನು ಮುಂದೆ ನಿನ್ನನ್ನು ಕಲುಷಿತಗೊಳಿಸುವುದಿಲ್ಲ.

  - id: story-d29
    type: dialogue
    section: story
    speaker: ನದಿ
    text: (ಸಂತೋಷದಿಂದ) ಮಕ್ಕಳೇ, ನಿಮ್ಮ ಮಾತು ಕೇಳಿ ನನಗೆ ತುಂಬಾ ಸಂತೋಷವಾಯಿತು. ನೀವು ಹೇಳಿದಂತೆ ನಡೆದರೆ ನನ್ನ ಬದುಕು ಸಾರ್ಥಕವಾಗುತ್ತದೆ.

  - id: story-d30
    type: dialogue
    section: story
    speaker: ಎಲ್ಲರೂ
    text: ಖಂಡಿತವಾಗಿಯೂ ನಾವು ನಿನ್ನನ್ನು ರಕ್ಷಿಸುತ್ತೇವೆ.

