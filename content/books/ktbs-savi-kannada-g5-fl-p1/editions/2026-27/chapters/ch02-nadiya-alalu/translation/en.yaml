grammar-p1: 'Conjunct letters (ottakshara)

  A letter formed when one vowel joins two or more consonants is a conjunct letter or ottakshara. (consonant + consonant + vowel = conjunct letter)'

grammar-p2: 'There are two divisions of conjunct letters. 1) Homogeneous conjunct letters 2) Heterogeneous conjunct letters'

grammar-p3: 'When two consonants of the same class join (with help of a vowel), they become homogeneous conjunct letters. Example: a + k + k + a = akka. Here k + k (+a) are homogeneous consonants and together form the homogeneous conjunct “kka”. Examples: appa, amma, anna, akkara, akkapakka, rakkasa, etc.'

grammar-p4: 'When two or more consonants of different classes join (with help of a vowel), the letter formed is called a heterogeneous conjunct letter. Example: bh + a + k + t + a = bhakta. Here k + t (+a) are heterogeneous consonants and together form the heterogeneous conjunct “kta”. Examples: chakra, ajne, stri, vastra, etc.'

grammar-a-q1: '1. What are conjunct letters?'

grammar-a-q2: '2. Sort the conjunct letters given below into homogeneous and heterogeneous: kka, pta, sva, rra, jja, sva, stha, rya, ḍga, mma'

grammar-a-q3: '3. Write words containing five homogeneous and five heterogeneous conjunct letters.'

