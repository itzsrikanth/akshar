intro-1: 'Today we are not protecting water sources such as lakes, wells and rivers properly; we are polluting them. Because of this, danger faces our lives. Keeping the water sources around us clean is essential.'

intro-2: '[School children have gathered in groups. Anxiety is on every face. They are eager to know the health of classmates admitted to hospital. The children are talking among themselves.]'

story-d1: 'What a disaster happened! This should not have happened to our friends.'

story-d2: 'What happened to them?'

story-d3: 'Oh! Don’t you know? All who went swimming have been admitted to hospital.'

story-d4: 'What happened to them that they were admitted to hospital?'

story-d5: 'Yesterday was Sunday and school was off, wasn’t it? They all went to play in the morning. They played till noon and then, unable to bear the heat, bathed in the river beside the village.'

story-d6: 'As a result thick blisters rose all over their bodies and terrible itching began. Unable to bear the pain they rolled on the bank. Some passers-by saw their groaning, lifted them and took them to hospital. Their health had become very bad.'

story-n1: '(The children come to the hospital. The doctor comes out of the examination room.)'

story-d7: 'Doctor, how are our friends?'

story-d8: 'I cannot say anything yet, children! But there seems no cause for worry.'

story-d9: 'What happened to them, Doctor?'

story-d10: 'They have an infection from the river’s polluted water. As a result blisters have risen all over the body. Unable to bear the itch they have fainted.'

story-d11: 'Then what is the reason the river water became dirty?'

story-d12: 'Human selfishness itself is the reason for this.'

story-d13: 'Doctor, shall we go to the river and come back?'

story-d14: 'You may; go and come.'

story-n2: '(All the children come near the river. They stand on the bank and look.)'

story-d15: 'Ugh! What a smell! One cannot stand here.'

story-d16: 'Yes, how polluted this river’s water is.'

story-d17: '(weeping) Children, what you are saying is true.'

story-d18: '(in surprise) Who is speaking?'

story-d19: 'It is I, the river, speaking.'

story-d20: 'Oh river, why are you crying? What has happened to you?'

story-d21: 'To whom shall I tell my sorrow? Humans themselves are the cause of this wretched state of mine.'

story-d22: 'What did humans do to you?'

story-d23: 'Do you know how pure I once was? My water was clean as glass. Aquatic creatures lived fearlessly in my belly. Animals, birds and humans drank my water and lived happily. But now my water has become poison.'

story-d24: 'What is the reason your water became poison?'

story-d25: 'Chemical substances from factories, town sewage, rubbish and plastic all enter my belly. Because of this my water has become polluted and poisonous.'

story-d26: 'Yes, so many animals and birds have died drinking your water. Our friends are in hospital only because they swam in your water.'

story-d27: '(sadly) My wish is that no one should be troubled because of me. But humans are destroying me.'

story-d28: 'River, do not cry. The responsibility of protecting you is ours. From now on we will not pollute you.'

story-d29: '(happily) Children, hearing your words I am very happy. If you act as you said, my life will be meaningful.'

story-d30: 'We will certainly protect you.'

