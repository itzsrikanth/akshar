intro-1: 'आज हम तालाब, कुआँ, नदी आदि जल स्रोतों की सही रक्षा न कर उन्हें प्रदूषित कर रहे हैं। इससे हमारे जीवन के सामने संकट आ रहा है। आसपास के जल स्रोतों को शुद्ध रखना अत्यंत आवश्यक है।'

intro-2: '[विद्यालय के बच्चे समूहों में इकट्ठे हैं। सबके चेहरे पर चिंता। अस्पताल में भर्ती सहपाठियों के स्वास्थ्य की उत्सुकता। बच्चे आपस में बात कर रहे हैं।]'

story-d1: 'क्या अनर्थ हो गया! हमारे मित्रों के साथ ऐसा नहीं होना चाहिए था।'

story-d2: 'उन्हें क्या हुआ?'

story-d3: 'अरे! तुम्हें पता नहीं? तैरने गए वे सब अस्पताल में भर्ती हैं।'

story-d4: 'अस्पताल भर्ती होने के लिए उन्हें क्या हुआ था?'

story-d5: 'कल रविवार को विद्यालय की छुट्टी थी न? वे सब सुबह खेलने गए थे। दोपहर तक खेलकर फिर गर्मी न सह सकने पर गाँव के किनारे नदी में नहाए।'

story-d6: 'परिणामस्वरूप शरीर पर मोटे-मोटे छाले उठे और भयंकर खुजली शुरू हुई। दर्द न सह सककर किनारे पर लोटने लगे। राहगीरों ने कराह देखकर उन्हें उठाकर अस्पताल पहुँचाया। उनका स्वास्थ्य बहुत बिगड़ गया था।'

story-n1: '(बच्चे अस्पताल आते हैं। डॉक्टर जाँच कक्ष से बाहर आते हैं।)'

story-d7: 'डॉक्टर, हमारे मित्रों की स्थिति कैसी है?'

story-d8: 'अभी कुछ कहने जैसा नहीं, बच्चों! पर चिंता का कारण नहीं लगता।'

story-d9: 'उन्हें क्या हुआ था डॉक्टर?'

story-d10: 'उन्हें नदी के प्रदूषित जल का संक्रमण लगा है। परिणामस्वरूप पूरे शरीर पर छाले उठे हैं। खुजली न सह सककर बेहोश हो गए हैं।'

story-d11: 'तो नदी का जल गंदा होने का कारण क्या है?'

story-d12: 'मनुष्यों का स्वार्थ ही इसका कारण है।'

story-d13: 'डॉक्टर, हम नदी के पास जाकर आएँ?'

story-d14: 'हो सकता है, जाकर आओ।'

story-n2: '(सभी बच्चे नदी के पास आते हैं। किनारे खड़े देख रहे हैं।)'

story-d15: 'छिः! कैसी बदबू! यहाँ खड़ा नहीं रहा जाता।'

story-d16: 'हाँ, इस नदी का जल कितना प्रदूषित है।'

story-d17: '(रोते हुए) बच्चों, तुम जो कह रहे हो सत्य है।'

story-d18: '(आश्चर्य से) कौन बोल रहा है?'

story-d19: 'मैं ही नदी बोल रही हूँ।'

story-d20: 'अरे नदी, तू क्यों रो रही है? तुझे क्या हुआ?'

story-d21: 'अपना दुख किससे कहूँ? मेरी इस दुर्दशा का कारण मनुष्य ही हैं।'

story-d22: 'मनुष्यों ने तुझे क्या किया?'

story-d23: 'पहले मैं कितनी शुद्ध थी, पता है? मेरा जल काँच जैसा स्वच्छ था। मेरे उदर में जलचर निर्भय जीते थे। पशु, पक्षी, मनुष्य मेरा जल पीकर प्रसन्न रहते थे। पर अब मेरा जल विष बन गया है।'

story-d24: 'तेरा जल विष होने का कारण क्या है?'

story-d25: 'कारखानों से निकलने वाले रासायनिक पदार्थ, नगर का नाला जल, कचरा, प्लास्टिक—सब मेरे उदर में आ रहे हैं। इससे मेरा जल प्रदूषित होकर विष हो गया है।'

story-d26: 'हाँ, तेरा जल पीकर कितने पशु-पक्षी मर चुके। हमारे मित्र तेरे जल में तैरने से ही अस्पताल पहुँचे हैं।'

story-d27: '(दुख से) मेरी इच्छा है कि मुझसे किसी को कष्ट न हो। पर मनुष्य मुझे नष्ट कर रहे हैं।'

story-d28: 'नदी, मत रो। तेरी रक्षा का दायित्व हमारा है। अब आगे हम तुझे प्रदूषित नहीं करेंगे।'

story-d29: '(प्रसन्नता से) बच्चों, तुम्हारी बात सुनकर मुझे बहुत खुशी हुई। जैसा कहा वैसा करो तो मेरा जीवन सार्थक होगा।'

story-d30: 'निश्चित रूप से हम तेरी रक्षा करेंगे।'

