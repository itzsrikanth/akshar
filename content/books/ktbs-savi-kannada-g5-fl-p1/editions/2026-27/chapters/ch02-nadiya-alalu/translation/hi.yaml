grammar-p1: 'संयुक्ताक्षर (ओत्तक्षर)

  दो या अधिक व्यंजनों से एक स्वर जुड़कर बना अक्षर संयुक्ताक्षर या ओत्तक्षर। (व्यंजन + व्यंजन + स्वर = संयुक्ताक्षर)'

grammar-p2: 'संयुक्ताक्षर दो विभागों में। 1) सजातीय संयुक्ताक्षर 2) विजातीय संयुक्ताक्षर'

grammar-p3: 'एक ही जाति के दो व्यंजन (स्वर की सहायता से) जुड़ें तो सजातीय संयुक्ताक्षर। उदा.: अ + क् + क् + अ = अक्क। यहाँ क् + क् (+अ) सजातीय व्यंजन हैं और «क्क» सजातीय संयुक्ताक्षर बना। उदा.: अप्प, अम्म, अण्ण, अक्कर, अक्कपक्क, रक्कस आदि।'

grammar-p4: 'भिन्न जाति के दो या अधिक व्यंजन (स्वर की सहायता से) जुड़कर बना अक्षर विजातीय संयुक्ताक्षर कहलाता है। उदा.: भ् + अ + क् + त् + अ = भक्त। यहाँ क् + त् (+अ) विजातीय हैं और «क्त» विजातीय संयुक्ताक्षर बना। उदा.: चक्र, आज्ञे, स्त्री, वस्त्र आदि।'

grammar-a-q1: '1. संयुक्ताक्षर क्या हैं?'

grammar-a-q2: '2. नीचे दिए संयुक्ताक्षरों को सजातीय, विजातीय में बाँटकर लिखिए। क्क, प्त, स्व, र्र, ज्ज, स्व, स्थ, र्य, ड्ग, म्म'

grammar-a-q3: '3. पाँच सजातीय और पाँच विजातीय संयुक्ताक्षर वाले शब्द लिखिए।'

