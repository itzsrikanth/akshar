grammar-p1: 'संयुक्ताक्षरगळु (ओत्तक्षरगळु)

  एरडु अथवा एरडक्किंत हेच्चु व्यंजनगळिगे ओंदु स्वर सेरि आगुव अक्षरवे संयुक्ताक्षर अथवा ओत्तक्षर. (व्यंजन + व्यंजन + स्वर = संयुक्ताक्षर)'

grammar-p2: 'संयुक्ताक्षरगळल्लि एरडु विभागगळिवे. 1) सजातीय संयुक्ताक्षरगळु 2) विजातीय संयुक्ताक्षरगळु'

grammar-p3: 'ओंदे जातिय एरडु व्यंजनगळु (स्वरद सहायदिंद) ओंदक्कोंदु सेरिदरे सजातीय संयुक्ताक्षरगळागुवुवु. उदा :- अ + क् + क् + अ = अक्क. इल्लि क् + क् (+अ) इवु सजातीय व्यंजनगळागिद्दु, इवु ओंदक्कोंदु कूडि ‘क्क’ एंब सजातीय संयुक्ताक्षरवागिदे. उदा :- अप्प, अम्म, अण्ण, अक्कर, अक्कपक्क, रक्कस इत्यादि.'

grammar-p4: 'बेरे बेरे जातिय एरडु अथवा हेच्चु व्यंजनगळु (स्वरद सहायदिंद) ओंदक्कोंदु कूडिकोंडु उंटागुव अक्षरवु विजातीय संयुक्ताक्षर वेनिसुवुदु. उदा : भ् + अ + क् + त् + अ = भक्त. इल्लि क् + त् (+ अ).इवु विजातीय संयुक्ताक्षर व्यंजनगळागिद्दु, इवेरडु कूडि ‘क्त’ एंब विजातीय संयुक्ताक्षरवागिदे. उदा:- चक्र, आज्ञे, स्त्री, वस्त्र इत्यादि.'

grammar-a-q1: '1. संयुक्ताक्षरगळु एंदरेनु ?'

grammar-a-q2: '2. केळगे कोट्टिरुव संयुक्ताक्षरगळन्नु सजातीय, विजातीय संयुक्ताक्षरगळन्नागि विंगडिसि बरेयिरि. क्क, प्त, स्व, र्र, ज्ज, स्व, स्थ, र्य, ड्ग, म्म'

grammar-a-q3: '3. ऐदु सजातीय हागू ऐदु विजातीय संयुक्ताक्षरगळन्नु होंदिरुव शब्दगळन्नु बरेयिरि.'

