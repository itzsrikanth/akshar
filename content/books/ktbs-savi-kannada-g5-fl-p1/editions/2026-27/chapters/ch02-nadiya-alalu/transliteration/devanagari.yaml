lang-ex-b-q2: '2. दिनपत्रिकेयल्लि बरुव नदिगळ मालिन्य कुरिताद लेखनगळन्नु ओदि तिळियिरि हागू निम्म सहपाठिगळोंदिगे चर्चिसिरि.'

