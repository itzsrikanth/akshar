intro-1: 'नावु इंदु नीरिन मूलगळाद केरे, बावि, नदि मोदलादवुगळन्नु सरियाद रीतियल्लि रक्षिसदे अवुगळन्नु कलुषितगोळिसुत्तिद्देवे. इदरिंदागि नम्म बदुकिगे संचकार एदुरागुत्तिदे. नम्म सुत्तलिन नीरिन मूलगळन्नु शुद्धवागिडुवुदु अत्यगत्य.'

intro-2: '[शाला मक्कळु गुंपुगुंपागि सेरिद्दारे. एल्लर मुखदल्लू आतंक. आस्पत्रेयल्लि दाखलागिरुव सहपाठिगळ आरोग्यवन्नु तिळियुव तवक. मक्कळु तम्म तम्मल्लिये संभाषिसुत्तिद्दारे.]'

story-d1: 'एंथ अनाहुत नडेदुहोयितु! नम्म गेळेय गेळतियरिगे हीगे आगबारदित्तु.'

story-d2: 'अवरिगे एनायितु?'

story-d3: 'अय्यो! निनगे तिळिदिल्लवे? ईजलु होद अवरेल्लरू आस्पत्रेगे दाखलागिद्दारे.'

story-d4: 'आस्पत्रेगे दाखलागलु अवरिगे एनागित्तु?'

story-d5: 'निन्ने भानुवार शालेगे रजे इत्तल्लवे? अवरेल्लरू बेळग्गे आटवाडलु होगिद्दरु. मध्याह्नदवरेगू आटवाडि अनंतर सेकेयन्नु ताळलारदे ऊरिन पक्कद नदियल्लि स्नान माडिदरु.'

story-d6: 'परिणामवागि अवर मैमेलेल्ला दप्प दप्प गुळ्ळेगळु एद्दु विपरीत तुरिके प्रारंभवायितु. नोवु ताळलारदे दंडेयल्लि बिद्दु होरळाडिदरु. यारो दारिहोकरु नरळाट कंडु अवरन्नु एत्तिकोंडु होगि आस्पत्रेगे सेरिसिदरु. अवर आरोग्य तीर हदगेट्टित्तु.'

story-n1: '(मक्कळु आस्पत्रेगे बरुत्तारे. वैद्यरु परीक्षा कोठडियिंद होरबरुत्तारे.)'

story-d7: 'नम्म गेळेयर स्थिति हेगिदे डाक्टर्?'

story-d8: 'इन्नू एनन्नु हेळुवंतिल्ल मक्कळे! आदरे चिंतेगे कारणविल्ल अंत तोरुत्तदे.'

story-d9: 'अवरिगे एनागित्तु डाक्टर्?'

story-d10: 'अवरिगे नदिय नीरिन मालिन्यद सोंकु तगुलिदे. परिणामवागि इडी देहदल्लि गुळ्ळेगळेद्दिवे. तुरिके तडेयलारदे मूर्छे होगिद्दारे.'

story-d11: 'हागादरे नदिय नीरु मलिनवागलु कारणवेनु?'

story-d12: 'मनुष्यर स्वार्थवे इदक्के कारण.'

story-d13: 'डाक्टर्, नावु नदिय हत्तिर होगि बरोणवे?'

story-d14: 'आगबहुदु, होगि बन्नि.'

story-n2: '(मक्कळेल्लरू नदिय हत्तिर बरुत्तारे. नदिय दडदल्लि निंतु नोडुत्तारे.)'

story-d15: 'छे! एंथ वासने! इल्लि निल्ललु आगुत्तिल्ल.'

story-d16: 'हौदु, ई नदिय नीरु एष्टु कलुषितवागिदे.'

story-d17: '(अळुत्ता) मक्कळे, नीवु हेळुत्तिरुवुदु निज.'

story-d18: '(आश्चर्यदिंद) यारु मातनाडुत्तिरुवुदु?'

story-d19: 'नाने नदि मातनाडुत्तिरुवुदु.'

story-d20: 'अय्यो नदिये, नीनेके अळुत्तिद्दीये? निनगेनागिदे?'

story-d21: 'नन्न अळलन्नु यार बळि हेळिकोळ्ळलि? नन्न ई दुस्थितिगे मनुष्यरे कारण.'

story-d22: 'मनुष्यरु निनगेनु माडिदरु?'

story-d23: 'हिंदे नानु एष्टु शुद्धवागिद्दे गोत्ते? नन्न नीरु गाजिनंते स्वच्छवागित्तु. नन्न ओडलल्लि जलचरगळु निर्भयवागि जीविसुत्तिद्दवु. प्राणि, पक्षिगळु, मनुष्यरु नन्न नीरन्नु कुडिदु संतोषदिंद बदुकुत्तिद्दरु. आदरे, ईग नन्न नीरु विषवागिदे.'

story-d24: 'निन्न नीरु विषवागलु कारणवेनु?'

story-d25: 'कार्खानेगळिंद होरबरुव रासायनिक वस्तुगळु, ऊरिन चरंडि नीरु, कसकड्डि, प्लास्टिक् एल्लवू नन्न ओडलु सेरुत्तिवे. इदरिंद नन्न नीरु कलुषितगोंडु विषवागिदे.'

story-d26: 'हौदु, निन्न नीरन्नु कुडिदु एष्टो प्राणि पक्षिगळु सत्तिवे. नम्म गेळेयरु निन्न नीरिनल्लि ईजिद्दरिंदले आस्पत्रे सेरिद्दारे.'

story-d27: '(दुःखदिंद) नन्निंद यारिगू तोंदरेयागबारदु एंबुदु नन्न आसे. आदरे, मनुष्यरु नन्नन्नु हाळुमाडुत्तिद्दारे.'

story-d28: 'नदिये, अळबेड. निन्नन्नु रक्षिसुव जवाब्दारि नम्मदु. नावु इन्नु मुंदे निन्नन्नु कलुषितगोळिसुवुदिल्ल.'

story-d29: '(संतोषदिंद) मक्कळे, निम्म मातु केळि ननगे तुंबा संतोषवायितु. नीवु हेळिदंते नडेदरे नन्न बदुकु सार्थकवागुत्तदे.'

story-d30: 'खंडितवागियू नावु निन्नन्नु रक्षिसुत्तेवे.'

