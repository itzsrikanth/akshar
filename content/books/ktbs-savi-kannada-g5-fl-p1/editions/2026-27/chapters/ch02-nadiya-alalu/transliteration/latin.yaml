intro-1: 'nāvu indu nīrina mūlagaḷāda kere, bāvi, nadi modalādavugaḷannu sariyāda rītiyalli rakṣisade avugaḷannu kaluṣitagoḷisuttiddēve. idarindāgi namma badukige sañcakāra edurāguttide. namma suttalina nīrina mūlagaḷannu śuddhavāgiḍuvudu atyagatya.'

intro-2: '[śālā makkaḷu gumpugumpāgi sēriddāre. ellara mukhadallū ātaṅka. āspatreyalli dākhalāgiruva sahapāṭhigaḷa ārōgyavannu tiḷiyuva tavaka. makkaḷu tamma tammalliyē sambhāṣisuttiddāre.]'

story-d1: 'entha anāhuta naḍeduhōyitu! namma geḷeya geḷatiyarige hīge āgabāradittu.'

story-d2: 'avarige ēnāyitu?'

story-d3: 'ayyō! ninage tiḷidillave? ījalu hōda avarellarū āspatrege dākhalāgiddāre.'

story-d4: 'āspatrege dākhalāgalu avarige ēnāgittu?'

story-d5: 'ninne bhānuvāra śālege raje ittallavē? avarellarū beḷagge āṭavāḍalu hōgiddaru. madhyāhnadavaregū āṭavāḍi anantara sekeyannu tāḷalārade ūrina pakkada nadiyalli snāna māḍidaru.'

story-d6: 'pariṇāmavāgi avara maimēlellā dappa dappa guḷḷegaḷu eddu viparīta turike prārambhavāyitu. nōvu tāḷalārade daṇḍeyalli biddu horaḷāḍidaru. yārō dārihōkaru naraḷāṭa kaṇḍu avarannu ettikoṇḍu hōgi āspatrege sērisidaru. avara ārōgya tīra hadageṭṭittu.'

story-n1: '(makkaḷu āspatrege baruttāre. vaidyaru parīkṣā koṭhaḍiyinda horabaruttāre.)'

story-d7: 'namma geḷeyara sthiti hēgide ḍākṭar?'

story-d8: 'innū ēnannu hēḷuvantilla makkaḷe! ādare cintege kāraṇavilla anta tōruttade.'

story-d9: 'avarige ēnāgittu ḍākṭar?'

story-d10: 'avarige nadiya nīrina mālinyada sōṅku tagulide. pariṇāmavāgi iḍī dēhadalli guḷḷegaḷeddive. turike taḍeyalārade mūrche hōgiddāre.'

story-d11: 'hāgādare nadiya nīru malinavāgalu kāraṇavēnu?'

story-d12: 'manuṣyara svārthavē idakke kāraṇa.'

story-d13: 'ḍākṭar, nāvu nadiya hattira hōgi barōṇave?'

story-d14: 'āgabahudu, hōgi banni.'

story-n2: '(makkaḷellarū nadiya hattira baruttāre. nadiya daḍadalli nintu nōḍuttāre.)'

story-d15: 'chē! entha vāsane! illi nillalu āguttilla.'

story-d16: 'haudu, ī nadiya nīru eṣṭu kaluṣitavāgide.'

story-d17: '(aḷuttā) makkaḷē, nīvu hēḷuttiruvudu nija.'

story-d18: '(āścaryadinda) yāru mātanāḍuttiruvudu?'

story-d19: 'nānē nadi mātanāḍuttiruvudu.'

story-d20: 'ayyō nadiyē, nīnēke aḷuttiddīye? ninagēnāgide?'

story-d21: 'nanna aḷalannu yāra baḷi hēḷikoḷḷali? nanna ī dusthitige manuṣyarē kāraṇa.'

story-d22: 'manuṣyaru ninagēnu māḍidaru?'

story-d23: 'hinde nānu eṣṭu śuddhavāgidde gotte? nanna nīru gājinante svacchavāgittu. nanna oḍalalli jalacaragaḷu nirbhayavāgi jīvisuttiddavu. prāṇi, pakṣigaḷu, manuṣyaru nanna nīrannu kuḍidu santōṣadinda badukuttiddaru. ādare, īga nanna nīru viṣavāgide.'

story-d24: 'ninna nīru viṣavāgalu kāraṇavēnu?'

story-d25: 'kārkhānegaḷinda horabaruva rāsāyanika vastugaḷu, ūrina caraṇḍi nīru, kasakaḍḍi, plāsṭik ellavū nanna oḍalu sēruttive. idarinda nanna nīru kaluṣitagoṇḍu viṣavāgide.'

story-d26: 'haudu, ninna nīrannu kuḍidu eṣṭō prāṇi pakṣigaḷu sattive. namma geḷeyaru ninna nīrinalli ījiddarindalē āspatre sēriddāre.'

story-d27: '(duḥkhadinda) nanninda yārigū tondareyāgabāradu embudu nanna āse. ādare, manuṣyaru nannannu hāḷumāḍuttiddāre.'

story-d28: 'nadiyē, aḷabēḍa. ninnannu rakṣisuva javābdāri nammadu. nāvu innu munde ninnannu kaluṣitagoḷisuvudilla.'

story-d29: '(santōṣadinda) makkaḷē, nimma mātu kēḷi nanage tumbā santōṣavāyitu. nīvu hēḷidante naḍedare nanna baduku sārthakavāguttade.'

story-d30: 'khaṇḍitavāgiyū nāvu ninnannu rakṣisuttēve.'

