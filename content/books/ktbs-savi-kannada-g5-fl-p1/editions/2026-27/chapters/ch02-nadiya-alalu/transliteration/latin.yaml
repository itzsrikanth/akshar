grammar-p1: 'sanyuktākṣaragaḷu (ottakṣaragaḷu)

  eraḍu athavā eraḍakkinta heccu vyañjanagaḷige ondu svara sēri āguva akṣaravē sanyuktākṣara athavā ottakṣara. (vyañjana + vyañjana + svara = sanyuktākṣara)'

grammar-p2: 'sanyuktākṣaragaḷalli eraḍu vibhāgagaḷive. 1) sajātīya sanyuktākṣaragaḷu 2) vijātīya sanyuktākṣaragaḷu'

grammar-p3: 'ondē jātiya eraḍu vyañjanagaḷu (svarada sahāyadinda) ondakkondu sēridare sajātīya sanyuktākṣaragaḷāguvuvu. udā :- a + k + k + a = akka. illi k + k (+a) ivu sajātīya vyañjanagaḷāgiddu, ivu ondakkondu kūḍi ‘kka’ emba sajātīya sanyuktākṣaravāgide. udā :- appa, amma, aṇṇa, akkara, akkapakka, rakkasa ityādi.'

grammar-p4: 'bēre bēre jātiya eraḍu athavā heccu vyañjanagaḷu (svarada sahāyadinda) ondakkondu kūḍikoṇḍu uṇṭāguva akṣaravu vijātīya sanyuktākṣara venisuvudu. udā : bh + a + k + t + a = bhakta. illi k + t (+ a).ivu vijātīya sanyuktākṣara vyañjanagaḷāgiddu, iveraḍu kūḍi ‘kta’ emba vijātīya sanyuktākṣaravāgide. udā:- cakra, ājñe, strī, vastra ityādi.'

grammar-a-q1: '1. sanyuktākṣaragaḷu endarēnu ?'

grammar-a-q2: '2. keḷage koṭṭiruva sanyuktākṣaragaḷannu sajātīya, vijātīya sanyuktākṣaragaḷannāgi viṅgaḍisi bareyiri. kka, pta, sva, rra, jja, sva, stha, rya, ḍga, mma'

grammar-a-q3: '3. aidu sajātīya hāgū aidu vijātīya sanyuktākṣaragaḷannu hondiruva śabdagaḷannu bareyiri.'

