poem-s1l1: 'देखो, सूर्य पश्चिम की ओर निकल पड़ा'

poem-s1l2: 'माता के घर पहुँचने के लिए'

poem-s1l3: 'संध्या के समय की फूल-सी धूप'

poem-s1l4: 'आँखों के लिए आनंद की सुंदर बाढ़'

poem-s2l1: 'श्वेत परदे जैसे बादल के किनारे पर'

poem-s2l2: 'जब बूंदाबांदी गिर रही हो'

poem-s2l3: 'बूंद-बूंद जल गिर रहा है।'

poem-s2l4: 'उन्होंने इंद्रधनुष जगा दिया है'

poem-s3l1: 'इंद्रधनुष को देखो'

poem-s3l2: 'वह झुका धनुष आकाश में है'

poem-s3l3: 'नारंगी, केसरिया, पीला, लाल'

poem-s3l4: 'नीला, भूरा, ठंडी हरियाली'

poem-s4l1: 'धरा और आकाश दोनों को छू लिया है'

poem-s4l2: 'आँखों के लिए उत्सव ला दिया है'

poem-s4l3: 'सूर्य डूबा, अंधेरा आ गया'

poem-s4l4: 'बादल बिखर गया, वर्षा भी थम गई'

poem-s5l1: 'इंद्रधनुष छिपकर भाग गया'

poem-s5l2: 'जादुई धनुष अदृश्य हो गया'

author-intro-1: 'निंगप्पा हनुमप्पा कुंटी (इटगि के निंगण्णा कुंटी) का जन्म 1943 में गदग जिले के शिरहट्टी तालुक के इटगि ग्राम में हुआ। उन्होंने प्राथमिक विद्यालय शिक्षक और बाल साहित्यकार के रूप में कन्नड़ सेवा की है। बाल साहित्य में कार्य करते हुए उन्होंने अनेक शिशु-गीत रचे हैं। उनका काव्य संग्रह «चंदप्पन शाले» प्रकाशित हुआ है। बाल साहित्य रचना के लिए उन्हें कई पुरस्कार देकर सम्मानित किया गया है।'

ex-a-q1: '1. सूर्य किस दिशा की ओर निकला?'

ex-a-q2: '2. इंद्रधनुष कहाँ से कहाँ तक फैला है?'

ex-a-q3: '3. इंद्रधनुष में मौजूद रंगों के नाम बताइए।'

ex-a-q4: '4. इंद्रधनुष कब अदृश्य हो गया?'

ex-a-q5: '5. इंद्रधनुष कब प्रकट होता है?'
