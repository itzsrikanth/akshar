author-intro-1: 'निंगप्प हनुमप्प कुंटि (निंगण्ण कुंटि इटगि) इवरु 1943रल्लि गदग जिल्लेय शिरहट्टि ताल्लूकिन इटगिग्रामदल्लि जनिसिदरु. इवरु प्राथमिक शाला शिक्षकरागि हागू मक्कळ साहितिगळागि कन्नड सेवेयन्नु सल्लिसिद्दारे. मक्कळ साहित्यदल्लि कृषि माडिरुव इवरु अनेक शिशुप्रासगळन्नु रचिसिद्दारे. इवर ‘चंदप्पन शाले’ कवन संकलन प्रकटगोंडिदे. श्रीयुतरिगे मक्कळ साहित्य रचनेगागि हलवु प्रशस्तिगळन्नु नीडि गौरविसलागिदे.'

ex-a-q1: '1. रवियु याव दिक्किगे होरटनु?'

ex-a-q2: '2. कामन बिल्लु एल्लिंद एल्लियवरेगे आवरिसिदे?'

ex-a-q3: '3. कामन बिल्लिनल्लिरुव बण्णगळन्नु हेसरिसि.'

ex-a-q4: '4. कामन बिल्लु यावाग मरेयायितु?'

ex-a-q5: '5. कामन बिल्लु यावाग मूडुत्तदे?'
