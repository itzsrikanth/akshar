intro-1: 'We should have pride in the Kannada land and language. Protecting Kannada land and language should be everyone’s duty. For that we must all become one. We must come forward to build the Kannada land. Kannada should become a language that gives food for life. For this, let us all come and join hands—this is the poet’s aim.'

