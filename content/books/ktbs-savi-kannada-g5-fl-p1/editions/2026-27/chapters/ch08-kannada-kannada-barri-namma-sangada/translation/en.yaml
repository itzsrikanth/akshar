author-intro-1: 'Chandrashekhara Patila: Famous by the short name “Champa”, Chandrashekhara Patila was born in 1939 CE in Hattimattur of Savanur taluk, Haveri district. He served as director of the English department at Karnatak University. He has written poetry collections such as Banuli, Madhyabindu, Huvu-Hannu and Ardhasatyada Hudugi; and plays such as Kodegalu, Appa, Kuntakunta Kuruvatti and Tingarabuddanna. He has received the State Sahitya Akademi Award, Rajyotsava Award and Pampa Award.'

