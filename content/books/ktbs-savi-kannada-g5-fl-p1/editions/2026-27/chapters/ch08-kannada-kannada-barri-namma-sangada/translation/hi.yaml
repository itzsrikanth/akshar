author-intro-1: 'चंद्रशेखर पाटील : «चंपा» संक्षिप्त नाम से प्रसिद्ध चंद्रशेखर पाटील का जन्म सन् 1939 में हावेरी जिले के सवणूर तालुक के हत्तिमत्तूर में हुआ। वे कर्नाटक विश्वविद्यालय के अंग्रेज़ी विभाग के निदेशक रहे। उन्होंने बानुली, मध्यबिंदु, हूवु-हण्णु, अर्धसत्यद हुडुगि आदि काव्यसंग्रह; कोडेगळु, अप्प, कुंटकुंट कुरुवत्ति, टिंगरबुड्डण्ण आदि नाटक रचे हैं। उन्हें राज्य साहित्य अकादमी पुरस्कार, राज्योत्सव पुरस्कार, पंप पुरस्कार मिले हैं।'

