intro-1: 'कन्नड़ नाडु और भाषा पर अभिमान होना चाहिए। कन्नड़ नाडु-भाषा की रक्षा सबका कर्तव्य बनना चाहिए। उसके लिए हम सब एक हों। कन्नड़ नाडु को गढ़ने के कार्य में आगे आएँ। कन्नड़ जीवन के लिए अन्न देने वाली भाषा बने। इसके लिए सब आओ, हाथ मिलाएँ—यह कवि का आशय है।'

