author-intro-1: 'candraśēkhara pāṭīla : ‘campā’emba saṅkṣiptanāmadinda prasiddharāda candraśēkhara pāṭīla avaru sā. śa. 1939 ralli hāvēri jilleya savaṇūru tāllūkina hattimattūrinalli janisidaru. ivaru karnāṭaka viśvavidyālayada iṅgliṣ vibhāgada nirdēśakarāgi kārya nirvahisidaru. ivaru bānuli, madhyabindu, hūvu-haṇṇu, ardhasatyada huḍugi modalāda kavana saṅkalanagaḷannu; koḍegaḷu, appa, kuṇṭakuṇṭa kuruvatti, ṭiṅgarabuḍḍaṇṇa modalāda nāṭakagaḷannu racisiddāre. ivarige rājya sāhitya akāḍemi praśasti, rājyōtsava praśasti, pampa praśastigaḷu labhisive.'

