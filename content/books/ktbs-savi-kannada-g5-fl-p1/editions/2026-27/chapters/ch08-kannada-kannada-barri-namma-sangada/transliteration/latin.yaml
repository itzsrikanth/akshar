intro-1: 'kannaḍa nāḍu nuḍiya bagege abhimānavirabēku. kannaḍa nāḍu nuḍiya rakṣaṇe nammellara kartavyavāgabēku. adakkāgi nāvellarū ondāgabēku. kannaḍa nāḍannu kaṭṭuva kāryakke mundāgabēku. kannaḍa bāḷige anna koḍuva bhāṣeyāgabēku. idakkāgi ellarū banni kaijōḍisōṇa embudu kaviya āśayavāgide.'

