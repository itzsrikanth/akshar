author-intro-1: 'चंद्रशेखर पाटील : ‘चंपा’एंब संक्षिप्तनामदिंद प्रसिद्धराद चंद्रशेखर पाटील अवरु सा. श. 1939 रल्लि हावेरि जिल्लेय सवणूरु ताल्लूकिन हत्तिमत्तूरिनल्लि जनिसिदरु. इवरु कर्नाटक विश्वविद्यालयद इंग्लिष् विभागद निर्देशकरागि कार्य निर्वहिसिदरु. इवरु बानुलि, मध्यबिंदु, हूवु-हण्णु, अर्धसत्यद हुडुगि मोदलाद कवन संकलनगळन्नु; कोडेगळु, अप्प, कुंटकुंट कुरुवत्ति, टिंगरबुड्डण्ण मोदलाद नाटकगळन्नु रचिसिद्दारे. इवरिगे राज्य साहित्य अकाडेमि प्रशस्ति, राज्योत्सव प्रशस्ति, पंप प्रशस्तिगळु लभिसिवे.'

