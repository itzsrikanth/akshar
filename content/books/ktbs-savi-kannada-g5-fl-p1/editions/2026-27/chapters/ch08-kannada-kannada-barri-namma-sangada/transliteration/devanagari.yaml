intro-1: 'कन्नड नाडु नुडिय बगेगे अभिमानविरबेकु. कन्नड नाडु नुडिय रक्षणे नम्मेल्लर कर्तव्यवागबेकु. अदक्कागि नावेल्लरू ओंदागबेकु. कन्नड नाडन्नु कट्टुव कार्यक्के मुंदागबेकु. कन्नड बाळिगे अन्न कोडुव भाषेयागबेकु. इदक्कागि एल्लरू बन्नि कैजोडिसोण एंबुदु कविय आशयवागिदे.'

