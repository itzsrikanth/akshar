  - id: author-intro-1
    type: prose
    section: author_intro
    text: 'ಚಂದ್ರಶೇಖರ ಪಾಟೀಲ : ‘ಚಂಪಾ’ಎಂಬ ಸಂಕ್ಷಿಪ್ತನಾಮದಿಂದ ಪ್ರಸಿದ್ಧರಾದ ಚಂದ್ರಶೇಖರ ಪಾಟೀಲ ಅವರು ಸಾ. ಶ. 1939 ರಲ್ಲಿ ಹಾವೇರಿ ಜಿಲ್ಲೆಯ ಸವಣೂರು ತಾಲ್ಲೂಕಿನ ಹತ್ತಿಮತ್ತೂರಿನಲ್ಲಿ ಜನಿಸಿದರು. ಇವರು ಕರ್ನಾಟಕ ವಿಶ್ವವಿದ್ಯಾಲಯದ ಇಂಗ್ಲಿಷ್ ವಿಭಾಗದ ನಿರ್ದೇಶಕರಾಗಿ ಕಾರ್ಯ ನಿರ್ವಹಿಸಿದರು. ಇವರು ಬಾನುಲಿ, ಮಧ್ಯಬಿಂದು, ಹೂವು-ಹಣ್ಣು, ಅರ್ಧಸತ್ಯದ ಹುಡುಗಿ ಮೊದಲಾದ ಕವನ ಸಂಕಲನಗಳನ್ನು; ಕೊಡೆಗಳು, ಅಪ್ಪ, ಕುಂಟಕುಂಟ ಕುರುವತ್ತಿ, ಟಿಂಗರಬುಡ್ಡಣ್ಣ ಮೊದಲಾದ ನಾಟಕಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಇವರಿಗೆ ರಾಜ್ಯ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿ, ರಾಜ್ಯೋತ್ಸವ ಪ್ರಶಸ್ತಿ, ಪಂಪ ಪ್ರಶಸ್ತಿಗಳು ಲಭಿಸಿವೆ.'

