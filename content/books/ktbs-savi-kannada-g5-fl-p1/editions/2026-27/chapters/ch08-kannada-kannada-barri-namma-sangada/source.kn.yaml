segments:
  - id: intro-1
    type: prose
    section: intro
    text: ಕನ್ನಡ ನಾಡು ನುಡಿಯ ಬಗೆಗೆ ಅಭಿಮಾನವಿರಬೇಕು. ಕನ್ನಡ ನಾಡು ನುಡಿಯ ರಕ್ಷಣೆ ನಮ್ಮೆಲ್ಲರ ಕರ್ತವ್ಯವಾಗಬೇಕು. ಅದಕ್ಕಾಗಿ ನಾವೆಲ್ಲರೂ ಒಂದಾಗಬೇಕು. ಕನ್ನಡ ನಾಡನ್ನು ಕಟ್ಟುವ ಕಾರ್ಯಕ್ಕೆ ಮುಂದಾಗಬೇಕು. ಕನ್ನಡ ಬಾಳಿಗೆ ಅನ್ನ ಕೊಡುವ ಭಾಷೆಯಾಗಬೇಕು. ಇದಕ್ಕಾಗಿ ಎಲ್ಲರೂ ಬನ್ನಿ ಕೈಜೋಡಿಸೋಣ ಎಂಬುದು ಕವಿಯ ಆಶಯವಾಗಿದೆ.

