  - id: grammar-p1
    type: prose
    section: grammar
    text: "ಆಗಮ ಸಂಧಿ\nಮಳೆ + ಅನ್ನು = ಮಳೆಯನ್ನು\nಇಲ್ಲಿ ಮಳೆ ಎಂಬ ಪೂರ್ವಪದದ ಅಂತ್ಯದಲ್ಲಿರುವ ‘ಎ’ ಕಾರಕ್ಕೂ, ಅನ್ನು ಎಂಬ ಉತ್ತರಪದದ ಆದಿಯಲ್ಲಿರುವ ‘ಅ’ ಕಾರಕ್ಕೂ ಸಂಧಿ ಆಗುವಾಗ ‘ಯ್’ ಎಂಬ ಅಕ್ಷರ ಹೊಸದಾಗಿ ಬಂದಿದೆ.\nಹೀಗೆ ಸಂಧಿಯಾಗುವಾಗ ಹೊಸದಾಗಿ ಒಂದು ಅಕ್ಷರ ಬಂದರೆ ಅದನ್ನು ಆಗಮಸಂಧಿ ಎನ್ನುವರು. ಇದರಲ್ಲಿ ಯಕಾರಾಗಮ ಸಂಧಿ ಮತ್ತು ವಕಾರಾಗಮ ಸಂಧಿ ಎಂದು ಎರಡು ವಿಧಗಳಿವೆ."

  - id: grammar-p2
    type: prose
    section: grammar
    text: "ಆದೇಶ ಸಂಧಿ\nಮೈ + ತೊಳೆ = ಮೈದೊಳೆ\nಇಲ್ಲಿ ಮೈದೊಳೆ ಎಂಬ ಪದದಲ್ಲಿ ‘ತ’ (ತೊ) ಅಕ್ಷರದ ಬದಲಿಗೆ ‘ದ’ (ದೊ) ಅಕ್ಷರ ಬಂದಿದೆ.\nಹೀಗೆ ಸಂಧಿಯಾಗುವಾಗ ಒಂದು ಅಕ್ಷರದ ಸ್ಥಾನದಲ್ಲಿ ಬೇರೊಂದು ಅಕ್ಷರ ಬಂದರೆ ಅದನ್ನು ಆದೇಶಸಂಧಿ ಎನ್ನುವರು. ಇಲ್ಲಿ ಉತ್ತರ ಪದದ ಮೊದಲನೆಯ ಅಕ್ಷರವು ಬದಲಾಗುತ್ತದೆ. ಸಾಮಾನ್ಯವಾಗಿ ಕ,ತ,ಪ ಗಳಿಗೆ ಕ್ರಮವಾಗಿ ಗ,ದ,ಬ ಗಳು ಆದೇಶವಾಗಿ ಬರುತ್ತವೆ."

  - id: grammar-p3
    type: prose
    section: grammar
    text: "ಈ ರೀತಿಯಾದ ಇನ್ನು ಕೆಲವು ಉದಾಹರಣೆಗಳನ್ನು ಗಮನಿಸೋಣ :\nಕುಡು + ಕೋಲು = ಕುಡುಗೋಲು : ‘ಕ’ ದ ಬದಲು ‘ಗ’ ಆಗಿದೆ.\nಬೆಟ್ಟ + ತಾವರೆ = ಬೆಟ್ಟದಾವರೆ : ‘ತ’ ದ ಬದಲು ‘ದ’ ಆಗಿದೆ.\nಕಣ್ + ಪನಿ = ಕಂಬನಿ : ‘ಪ’ ದ ಬದಲು ‘ಬ’ ಆಗಿದೆ."

