segments:
  - id: intro-1
    type: prose
    section: intro
    text: ಎಲ್ಲ ಜೀವಿಗಳಿಗೂ ಬದುಕಲು ಸಮಾನ ಹಕ್ಕಿದೆ. ಆದರೆ ಮನುಷ್ಯ ತನ್ನ ಸ್ವಾರ್ಥ ನಿಮಿತ್ತನಾಗಿ ಅದಕ್ಕೆ ಅವಕಾಶ ನೀಡುತ್ತಿಲ್ಲ. ಕೆಲವೊಮ್ಮೆ ಆತ ತನ್ನ ಶಾಂತಿ ನೆಮ್ಮದಿಗಳಿಗೆ ತಾನೇ ಅಡ್ಡಿಯಾಗುತ್ತಾನೆ. ಮನುಷ್ಯ ಮಾಡುತ್ತಿರುವ ಸಾಧುವಲ್ಲದ ಕಾರ್ಯಗಳನ್ನು ಪ್ರಾಣಿಗಳ ಮೂಲಕ ಹೇಳಿಸಿ, ಆ ಮೂಲಕ ಆತನನ್ನು ಯೋಚನೆಗೆ ಹಚ್ಚುವುದು ಇಲ್ಲಿನ ಆಶಯವಾಗಿದೆ.

  - id: story-n1
    type: prose
    section: story
    text: ಒಂದಾನೊಂದು ಕಾಡು. ಅಲ್ಲಿ ಬಗೆಬಗೆಯ ಪ್ರಾಣಿಗಳು ವಾಸವಾಗಿದ್ದವು. ಆನೆಯು ಆ ಕಾಡಿನ ಅಧಿಪತಿಯಾಗಿತ್ತು. ಅದು ಆಗಾಗ ಸಭೆ ಕರೆದು ಅವುಗಳ ಕ್ಷೇಮ ಸಮಾಚಾರವನ್ನು ವಿಚಾರಿಸುತ್ತಿತ್ತು. ಊರಿನಲ್ಲಿರುವ ಪ್ರಾಣಿಗಳೊಂದಿಗೂ ಸ್ನೇಹವನ್ನು ಬೆಳೆಸಿತ್ತು. ಅವುಗಳಿಗೂ ಸಭೆಯಲ್ಲಿ ಪಾಲ್ಗೊಳ್ಳಲು ಅವಕಾಶ ನೀಡುತ್ತಿತ್ತು. ಉತ್ತಮ ನಾಯಕತ್ವ ಗುಣ ಹೊಂದಿರುವ ಆನೆಯು ಎಲ್ಲಾ ಪ್ರಾಣಿಗಳಿಂದಲೂ ಮೆಚ್ಚುಗೆಯನ್ನು ಗಳಿಸಿತ್ತು.

  - id: story-n2
    type: prose
    section: story
    text: ಹೀಗೆಯೇ ಒಂದು ದಿನ ಸಭೆ ಕರೆದಿತ್ತು. ಎಲ್ಲ ಪ್ರಾಣಿಗಳು ಅಂದು ಮನುಷ್ಯರ ಮೇಲೆ ಬಹಳವಾಗಿ ದೂರು ಹೇಳುತ್ತಿದ್ದವು. ಮಾನವನಿಂದ ಆಗುತ್ತಿರುವ ತೊಂದರೆ ಹಾಗೂ ಪರಿಹಾರ ಕುರಿತು ಚರ್ಚಿಸಿದ್ದವು. ಮನುಷ್ಯನಿಗೆ ತಿಳಿಹೇಳಲು ಫಲಕದಲ್ಲಿ ವಿವರ ಬರೆದು ತರಲು ಆನೆಯು ಪ್ರಾಣಿಗಳಿಗೆ ಸೂಚನೆ ನೀಡಿತ್ತು. ಅದರಂತೆ ಪ್ರಾಣಿಗಳು ಈ ದಿನದ ಸಭೆಗೆ ಸಿದ್ದವಾಗಿ ಬಂದಿದ್ದವು. ನಾಯಕನ ಸೂಚನೆಯಂತೆ ಅವುಗಳು ತಮ್ಮ ಫಲಕಗಳನ್ನು ಹಿಡಿದುಕೊಂಡು ಸಾಲಾಗಿ ನಿಂತಿದ್ದವು. ಆನೆಯು ಅವುಗಳನ್ನು ಒಂದೊಂದಾಗಿ ಓದುತ್ತಾ ಮುನ್ನಡೆಯಿತು.

  - id: story-d1
    type: dialogue
    section: story
    speaker: ಎತ್ತು
    text: “ನಮ್ಮನ್ನು ಹೆಚ್ಚು ಹೆಚ್ಚು ದುಡಿಸಿಕೊಳ್ಳುತ್ತೀರಿ. ಕಡಿಮೆ ಆಹಾರ ನೀಡುತ್ತೀರಿ. ನಮ್ಮ ಸೇವೆ ಬೇಕು; ನಾವು ಮಾತ್ರ ಬೇಡ ಅಲ್ಲವೇ? ನಮ್ಮ ಸೇವೆಯನ್ನು ಮರೆಯದಿರಿ.” “ದಯೆಯಿರಲಿ ಸಕಲ ಪ್ರಾಣಿಗಳಲ್ಲಿ.”

  - id: story-d2
    type: dialogue
    section: story
    speaker: ಜಿಂಕೆ
    text: “ನಮ್ಮ ಬದುಕಿನ ಆಧಾರತಾಣ ಕಾಡು. ಅದನ್ನು ನಾಶ ಮಾಡುತ್ತಿದ್ದೀರಿ. ನಮಗೆ ತಿನ್ನಲು ಹುಲ್ಲಿಲ್ಲ. ಮಲಗಲು ಮರದ ನೆರಳಿಲ್ಲ. ಕಾಡು ನಿಮಗೂ ಬೇಕು. ನಮಗೂ ಬೇಕು.” “ನಮ್ಮನ್ನು ಉಳಿಸಿರಿ, ನೀವೂ ಉಳಿಯಿರಿ.”

  - id: story-d3
    type: dialogue
    section: story
    speaker: ಆಮೆ
    text: “ನೀರು ಅಮೂಲ್ಯ ಸಂಪತ್ತು. ಅದನ್ನು ಹಾಳು ಮಾಡುತ್ತಿದ್ದೀರಿ. ಕಸಕಡ್ಡಿ ಹಾಕಿ ಕಲ್ಮಷಗೊಳಿಸುತ್ತಿದ್ದೀರಿ. ನಮಗೆ ನೀರಿನಲ್ಲಿರಲು ಆಗುತ್ತಿಲ್ಲ. ಶುದ್ಧ ನೀರು ನಮಗೂ ಬೇಕು, ನಿಮಗೂ ಬೇಕು.” “ನೀರು ಉಳಿಸಿ, ನಾಡು ಬೆಳೆಸಿ.”

  - id: story-d4
    type: dialogue
    section: story
    speaker: ನಾಯಿ
    text: “ನಾನು ನಿಮ್ಮ ಮನೆಯ ಕಾವಲುಗಾರ. ನಿಮ್ಮ ಮನೆಗೆ ಬರುವ ಕಳ್ಳರನ್ನು ಓಡಿಸುವೆ. ಆದರೆ ನೀವು ನನ್ನನ್ನು ಪ್ರೀತಿಯಿಂದ ಕಾಣುವುದಿಲ್ಲ. ಕಲ್ಲುಗಳಿಂದ ಹೊಡೆಯುತ್ತೀರಿ. ಇದು ಸರಿಯೇ?” “ಮೂಕ ಪ್ರಾಣಿಗಳನ್ನು ಪ್ರೀತಿಸಿರಿ.”

  - id: story-d5
    type: dialogue
    section: story
    speaker: ಕರಡಿ
    text: “ನಮ್ಮ ಚರ್ಮ, ಉಗುರು, ಕೂದಲು, ದಂತಗಳಿಗಾಗಿ ನಮ್ಮನ್ನು ಕೊಲ್ಲುವಿರಿ. ನಮ್ಮ ಸಂತತಿಯನ್ನು ನಾಶಮಾಡುವ ಹಕ್ಕು ನಿಮಗಿಲ್ಲ.” “ಪ್ರಾಣಿ ಹಿಂಸೆ ಮಹಾಪಾಪ.”

  - id: story-d6
    type: dialogue
    section: story
    speaker: ಆನೆ
    text: “ಮನುಷ್ಯರೇ, ಅತಿಯಾಸೆ ಬಿಡಿ. ಪ್ರಾಣಿಗಳನ್ನು ಪ್ರೀತಿಸಿ. ಕಾಡನ್ನು ಬೆಳೆಸಿ. ನೀರನ್ನು ಶುದ್ಧವಾಗಿಡಿ. ಪರಿಸರವನ್ನು ರಕ್ಷಿಸಿ. ಆಗ ಮಾತ್ರ ನೀವು ನೆಮ್ಮದಿಯಿಂದ ಬಾಳಲು ಸಾಧ್ಯ.”

