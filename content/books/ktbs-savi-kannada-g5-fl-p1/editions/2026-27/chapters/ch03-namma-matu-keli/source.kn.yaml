  - id: grammar-p1
    type: prose
    section: grammar
    text: "ವಚನಗಳು\nವಚನ ಎಂದರೆ ಸಂಖ್ಯೆ ಎಂದರ್ಥ. ವಚನಗಳಲ್ಲಿ ಎರಡು ವಿಧ.\n1. ಏಕವಚನ\n2. ಬಹುವಚನ"

  - id: grammar-p2
    type: prose
    section: grammar
    text: "1. ಏಕವಚನ\nಒಂದು ವಸ್ತುವನ್ನಾಗಲೀ ಅಥವಾ ಒಬ್ಬ ವ್ಯಕ್ತಿಯನ್ನಾಗಲೀ ಕುರಿತು ಹೇಳುವುದು ಏಕವಚನ.\nಉದಾ: ಮರ, ಹಸು, ಹುಡುಗ, ಪುಸ್ತಕ ಇತ್ಯಾದಿ."

  - id: grammar-p3
    type: prose
    section: grammar
    text: "2. ಬಹುವಚನ\nಒಂದಕ್ಕಿಂತ ಹೆಚ್ಚು ವಸ್ತುಗಳನ್ನಾಗಲೀ ಅಥವಾ ವ್ಯಕ್ತಿಗಳನ್ನಾಗಲೀ ಕುರಿತು ಹೇಳುವುದು ಬಹುವಚನ.\nಉದಾ: ಮರಗಳು, ಹಸುಗಳು, ಹುಡುಗರು, ಪುಸ್ತಕಗಳು ಇತ್ಯಾದಿ."

