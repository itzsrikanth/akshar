intro-1: 'ella jīvigaḷigū badukalu samāna hakkide. ādare manuṣya tanna svārtha nimittanāgi adakke avakāśa nīḍuttilla. kelavomme āta tanna śānti nemmadigaḷige tānē aḍḍiyāguttāne. manuṣya māḍuttiruva sādhuvallada kāryagaḷannu prāṇigaḷa mūlaka hēḷisi, ā mūlaka ātanannu yōcanege haccuvudu illina āśayavāgide.'

story-n1: 'ondānondu kāḍu. alli bagebageya prāṇigaḷu vāsavāgiddavu. āneyu ā kāḍina adhipatiyāgittu. adu āgāga sabhe karedu avugaḷa kṣēma samācāravannu vicārisuttittu. ūrinalliruva prāṇigaḷondigū snēhavannu beḷesittu. avugaḷigū sabheyalli pālgoḷḷalu avakāśa nīḍuttittu. uttama nāyakatva guṇa hondiruva āneyu ellā prāṇigaḷindalū meccugeyannu gaḷisittu.'

story-n2: 'hīgeyē ondu dina sabhe karedittu. ella prāṇigaḷu andu manuṣyara mēle bahaḷavāgi dūru hēḷuttiddavu. mānavaninda āguttiruva tondare hāgū parihāra kuritu carcisiddavu. manuṣyanige tiḷihēḷalu phalakadalli vivara baredu taralu āneyu prāṇigaḷige sūcane nīḍittu. adarante prāṇigaḷu ī dinada sabhege siddavāgi bandiddavu. nāyakana sūcaneyante avugaḷu tamma phalakagaḷannu hiḍidukoṇḍu sālāgi nintiddavu. āneyu avugaḷannu ondondāgi ōduttā munnaḍeyitu.'

story-d1: '“nammannu heccu heccu duḍisikoḷḷuttīri. kaḍime āhāra nīḍuttīri. namma sēve bēku; nāvu mātra bēḍa allavē? namma sēveyannu mareyadiri.” “dayeyirali sakala prāṇigaḷalli.”'

story-d2: '“namma badukina ādhāratāṇa kāḍu. adannu nāśa māḍuttiddīri. namage tinnalu hullilla. malagalu marada neraḷilla. kāḍu nimagū bēku. namagū bēku.” “nammannu uḷisiri, nīvū uḷiyiri.”'

story-d3: '“nīru amūlya sampattu. adannu hāḷu māḍuttiddīri. kasakaḍḍi hāki kalmaṣagoḷisuttiddīri. namage nīrinalliralu āguttilla. śuddha nīru namagū bēku, nimagū bēku.” “nīru uḷisi, nāḍu beḷesi.”'

story-d4: '“nānu nimma maneya kāvalugāra. nimma manege baruva kaḷḷarannu ōḍisuve. ādare nīvu nannannu prītiyinda kāṇuvudilla. kallugaḷinda hoḍeyuttīri. idu sariyē?” “mūka prāṇigaḷannu prītisiri.”'

story-d5: '“namma carma, uguru, kūdalu, dantagaḷigāgi nammannu kolluviri. namma santatiyannu nāśamāḍuva hakku nimagilla.” “prāṇi hinse mahāpāpa.”'

story-d6: '“manuṣyarē, atiyāse biḍi. prāṇigaḷannu prītisi. kāḍannu beḷesi. nīrannu śuddhavāgiḍi. parisaravannu rakṣisi. āga mātra nīvu nemmadiyinda bāḷalu sādhya.”'

