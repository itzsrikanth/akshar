intro-1: 'एल्ल जीविगळिगू बदुकलु समान हक्किदे. आदरे मनुष्य तन्न स्वार्थ निमित्तनागि अदक्के अवकाश नीडुत्तिल्ल. केलवोम्मे आत तन्न शांति नेम्मदिगळिगे ताने अड्डियागुत्ताने. मनुष्य माडुत्तिरुव साधुवल्लद कार्यगळन्नु प्राणिगळ मूलक हेळिसि, आ मूलक आतनन्नु योचनेगे हच्चुवुदु इल्लिन आशयवागिदे.'

story-n1: 'ओंदानोंदु काडु. अल्लि बगेबगेय प्राणिगळु वासवागिद्दवु. आनेयु आ काडिन अधिपतियागित्तु. अदु आगाग सभे करेदु अवुगळ क्षेम समाचारवन्नु विचारिसुत्तित्तु. ऊरिनल्लिरुव प्राणिगळोंदिगू स्नेहवन्नु बेळेसित्तु. अवुगळिगू सभेयल्लि पाल्गोळ्ळलु अवकाश नीडुत्तित्तु. उत्तम नायकत्व गुण होंदिरुव आनेयु एल्ला प्राणिगळिंदलू मेच्चुगेयन्नु गळिसित्तु.'

story-n2: 'हीगेये ओंदु दिन सभे करेदित्तु. एल्ल प्राणिगळु अंदु मनुष्यर मेले बहळवागि दूरु हेळुत्तिद्दवु. मानवनिंद आगुत्तिरुव तोंदरे हागू परिहार कुरितु चर्चिसिद्दवु. मनुष्यनिगे तिळिहेळलु फलकदल्लि विवर बरेदु तरलु आनेयु प्राणिगळिगे सूचने नीडित्तु. अदरंते प्राणिगळु ई दिनद सभेगे सिद्दवागि बंदिद्दवु. नायकन सूचनेयंते अवुगळु तम्म फलकगळन्नु हिडिदुकोंडु सालागि निंतिद्दवु. आनेयु अवुगळन्नु ओंदोंदागि ओदुत्ता मुन्नडेयितु.'

story-d1: '“नम्मन्नु हेच्चु हेच्चु दुडिसिकोळ्ळुत्तीरि. कडिमे आहार नीडुत्तीरि. नम्म सेवे बेकु; नावु मात्र बेड अल्लवे? नम्म सेवेयन्नु मरेयदिरि.” “दयेयिरलि सकल प्राणिगळल्लि.”'

story-d2: '“नम्म बदुकिन आधारताण काडु. अदन्नु नाश माडुत्तिद्दीरि. नमगे तिन्नलु हुल्लिल्ल. मलगलु मरद नेरळिल्ल. काडु निमगू बेकु. नमगू बेकु.” “नम्मन्नु उळिसिरि, नीवू उळियिरि.”'

story-d3: '“नीरु अमूल्य संपत्तु. अदन्नु हाळु माडुत्तिद्दीरि. कसकड्डि हाकि कल्मषगोळिसुत्तिद्दीरि. नमगे नीरिनल्लिरलु आगुत्तिल्ल. शुद्ध नीरु नमगू बेकु, निमगू बेकु.” “नीरु उळिसि, नाडु बेळेसि.”'

story-d4: '“नानु निम्म मनेय कावलुगार. निम्म मनेगे बरुव कळ्ळरन्नु ओडिसुवे. आदरे नीवु नन्नन्नु प्रीतियिंद काणुवुदिल्ल. कल्लुगळिंद होडेयुत्तीरि. इदु सरिये?” “मूक प्राणिगळन्नु प्रीतिसिरि.”'

story-d5: '“नम्म चर्म, उगुरु, कूदलु, दंतगळिगागि नम्मन्नु कोल्लुविरि. नम्म संततियन्नु नाशमाडुव हक्कु निमगिल्ल.” “प्राणि हिंसे महापाप.”'

story-d6: '“मनुष्यरे, अतियासे बिडि. प्राणिगळन्नु प्रीतिसि. काडन्नु बेळेसि. नीरन्नु शुद्धवागिडि. परिसरवन्नु रक्षिसि. आग मात्र नीवु नेम्मदियिंद बाळलु साध्य.”'

