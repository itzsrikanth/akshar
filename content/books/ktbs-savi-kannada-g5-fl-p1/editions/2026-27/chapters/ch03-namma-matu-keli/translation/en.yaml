intro-1: 'Every living being has an equal right to live. But humans, for their selfishness, do not allow that. Sometimes a person becomes an obstacle to their own peace and comfort. Getting animals to speak about the improper acts humans do, and thereby making people think—this is the aim here.'

story-n1: 'Once there was a forest. Many kinds of animals lived there. The elephant was the lord of that forest. It often called meetings and asked after their welfare. It had also made friends with animals of the village and let them take part in the meeting. With fine leadership, the elephant had won the praise of all animals.'

story-n2: 'One day it had called such a meeting. All the animals were complaining heavily about humans that day. They discussed the trouble caused by humans and the remedy. The elephant had told the animals to write details on boards to explain to humans. Accordingly the animals had come prepared for today’s meeting. As the leader directed, they stood in a line holding their boards. The elephant went ahead reading them one by one.'

story-d1: '"You make us work more and more. You give less food. You want our service; but not us, isn’t it? Do not forget our service." "Let there be kindness toward all animals."'

story-d2: '"The base of our life is the forest. You are destroying it. We have no grass to eat. No tree shade to sleep under. The forest is needed for you too. Needed for us too." "Save us, and you will be saved too."'

story-d3: '"Water is a precious treasure. You are spoiling it. You dirty it with rubbish. We cannot stay in the water. Clean water is needed for us and for you." "Save water, grow the land."'

story-d4: '"I am the guard of your house. I drive away thieves who come to your house. But you do not treat me with love. You hit me with stones. Is this right?" "Love the mute animals."'

story-d5: '"You kill us for our skin, nails, hair and tusks. You have no right to destroy our lineage." "Hurting animals is a great sin."'

story-d6: '"O humans, give up greed. Love animals. Grow the forest. Keep water clean. Protect the environment. Only then can you live in peace."'

