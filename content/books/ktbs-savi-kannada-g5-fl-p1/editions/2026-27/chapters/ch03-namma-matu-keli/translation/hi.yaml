intro-1: 'सभी जीवों को जीने का समान अधिकार है। पर मनुष्य अपने स्वार्थ के कारण उसकी अनुमति नहीं देता। कभी-कभी वह अपनी शांति-सुख में स्वयं बाधा बन जाता है। मनुष्य के अनुचित कामों को पशुओं के मुख से कहलाकर उसे सोचने पर मजबूर करना—यही यहाँ का आशय है।'

story-n1: 'एक जंगल था। वहाँ अनेक प्रकार के पशु रहते थे। हाथी उस जंगल का अधिपति था। वह अक्सर सभा बुलाकर उनका कुशल पूछता था। गाँव के पशुओं से भी मित्रता बढ़ाई थी और सभा में भाग लेने का अवसर देता था। उत्तम नेतृत्व गुण वाला हाथी सभी पशुओं की प्रशंसा पा चुका था।'

story-n2: 'इसी तरह एक दिन सभा बुलाई थी। सभी पशु उस दिन मनुष्यों पर बहुत शिकायत कर रहे थे। मनुष्य से हो रही परेशानी और समाधान पर चर्चा की थी। मनुष्य को समझाने के लिए फलकों पर विवरण लिखकर लाने को हाथी ने पशुओं को निर्देश दिया था। उसी के अनुसार पशु आज की सभा के लिए तैयार आकर खड़े थे। नेता के निर्देशानुसार फलके पकड़े पंक्ति में खड़े थे। हाथी उन्हें एक-एक कर पढ़ता आगे बढ़ा।'

story-d1: '«तुम हमें और अधिक काम पर लगाते हो। कम आहार देते हो। हमारी सेवा चाहिए; हम नहीं, है न? हमारी सेवा मत भूलो।» «सभी पशुओं पर दया हो।»'

story-d2: '«हमारे जीवन का आधार जंगल है। तुम उसे नष्ट कर रहे हो। हमें खाने को घास नहीं। सोने को पेड़ की छाया नहीं। जंगल तुम्हें भी चाहिए। हमें भी चाहिए।» «हमें बचाओ, तुम भी बचोगे।»'

story-d3: '«जल अमूल्य संपत्ति है। तुम उसे बर्बाद कर रहे हो। कचरा डालकर गंदा कर रहे हो। हमें जल में रहना कठिन है। शुद्ध जल हमें भी चाहिए, तुम्हें भी।» «जल बचाओ, नाडु बढ़ाओ।»'

story-d4: '«मैं तुम्हारे घर का रक्षक हूँ। घर आने वाले चोरों को भगाता हूँ। पर तुम मुझे प्रेम से नहीं देखते। पत्थरों से मारते हो। क्या यह सही है?» «मूक पशुओं से प्रेम करो।»'

story-d5: '«हमारी खाल, नाखून, बाल, दाँतों के लिए हमें मारते हो। हमारी संतति नष्ट करने का अधिकार तुम्हें नहीं।» «पशु हिंसा महापाप है।»'

story-d6: '«हे मनुष्यों, अति लोभ छोड़ो। पशुओं से प्रेम करो। जंगल बढ़ाओ। जल शुद्ध रखो। पर्यावरण की रक्षा करो। तभी तुम शांति से जी सकोगे।»'

