intro-1: 'We must always protect the freedom we have received. We must always work for our country’s progress. We must guard the nation’s freedom with courage. Our attention must stay on achievement. We must always honour the martyrs who fought for the country—this is the aim of this poem.'

poem-s1l1: 'May the lamp of freedom keep burning always'

poem-s1l2: 'as the people ceaselessly pour the oil of labour'

poem-s1l3: 'How can the dignity of our motherland diminish? || always ||'

poem-s2l1: 'Did freedom come as easily as pulling a thorn from cloth?'

poem-s2l2: 'Like snatching food from a tiger’s mouth—heroic strength'

poem-s2l3: 'The people obtained it; let love of the land bind our lives || always ||'

poem-s3l1: 'Gain did not come along with freedom'

poem-s3l2: 'Absorbing each person’s sweat, the sprout has become a tree,'

poem-s3l3: 'As it rises higher, the house has a firm foundation || always ||'

poem-s4l1: 'As we go on, let attention keep falling toward achievement'

poem-s4l2: 'Our salute to those who staked their very lives,'

poem-s4l3: 'May flowers and fragrant davana rise each day on mother’s hair || always ||'

author-intro-1: 'K. S. Nisar Ahmed: Poet Kokkarehosahalli Sheikh Haider Nisar Ahmed was born on 05-02-1936 in Devanahalli of Bengaluru Rural district. Father Sheikh Haider, mother Hameeda Begum. After graduating in geology he began service as a teacher at Bangalore University. He has written works such as Manasu Gandhibazaaru, Nenedavara Manadalli, Nityotsava and Sumurta. He has been honoured with the Pampa Award, Nadoja Award, and Central and State Sahitya Akademi awards.'

