grammar-a-p1: 'A word that tells or indicates a special quality of a noun is a “qualitative adjective”. Example: Ritesh has a black rabbit. Here “black” tells the colour of the rabbit.'

grammar-a-p2: '1. Kanchana is a beautiful girl.'

grammar-a-p3: '2. Darshini is wearing a red skirt.'

grammar-a-p4: '3. Raghu has a big aeroplane.'

grammar-a-p5: 'Notice the underlined words “beautiful”, “red”, and “big”. They are adjectives that tell colour, quality, manner, or nature. They are called “qualitative adjectives”.'

lang-ex-a-q1: 'A) What is a qualitative adjective? Explain with an example.'

lang-ex-a-q2: 'B) In the given sentences, identify the qualitative adjective and underline it. 1. The lorry can carry a lot of luggage. 2. There are rooms for special guests at the airport. 3. The airport is very beautiful. 4. The ship is very big. 5. Priya’s skirt is bright green.'

