grammar-a-p1: 'संज्ञा के विशेष गुण को बताने या सूचित करने वाला पद ही «गुण विशेषण» है। उदा.: रितेश के पास काला खरगोश है। यहाँ «काला» खरगोश का रंग बताता है।'

grammar-a-p2: '1. कांचना सुंदर लड़की है।'

grammar-a-p3: '2. दर्शिनी ने लाल घागरा पहना है।'

grammar-a-p4: '3. राघु के पास बड़ा विमान है।'

grammar-a-p5: 'यहाँ रेखांकित «सुंदर», «लाल», «बड़ा» पदों पर ध्यान दीजिए। ये रंग, गुण, रीति, स्वभाव बताने वाले विशेषण हैं। इन्हें «गुण विशेषण» कहते हैं।'

lang-ex-a-q1: 'अ) गुणविशेषण क्या है? उदाहरण सहित समझाइए।'

lang-ex-a-q2: 'आ) दिए वाक्यों में गुणविशेषण पहचानकर रेखा खींचिए। 1. लॉरी बहुत सामान ढो सकती है। 2. विमान अड्डे में विशेष अतिथियों के कमरे होते हैं। 3. विमान अड्डा बहुत सुंदर है। 4. जहाज बहुत बड़ा है। 5. प्रिया का घागरा चटख हरा है।'

lang-ex-b-q1: '1. के. एस. निसार अहमद के बारे में अधिक विवरण जानिए।'

lang-ex-b-q2: '2. के. एस. निसार अहमद की कविता «नित्योत्सव» संगृहीत कर गाइए।'

lang-ex-c-q1: '1. देश के लिए परिश्रम करो; देश के लिए प्राण दो।'

lang-ex-c-q2: '2. एकता में बल है।'
