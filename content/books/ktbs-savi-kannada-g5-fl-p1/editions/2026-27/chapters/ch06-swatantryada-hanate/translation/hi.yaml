intro-1: 'हमें मिला स्वतंत्रता सदैव रक्षा करनी चाहिए। देश की उन्नति के लिए सदैव परिश्रम करते रहना चाहिए। वीरता से देश की स्वतंत्रता की रक्षा करनी चाहिए। हमारी दृष्टि उपलब्धि की ओर रहनी चाहिए। देश के लिए लड़े शहीदों को सदैव सम्मान देना चाहिए—यह इस कविता का आशय है।'

poem-s1l1: 'सदैव जलती रहे स्वतंत्रता की दीपिका'

poem-s1l2: 'जनता बिना विश्राम श्रम का तेल डालती रहे'

poem-s1l3: 'कैसे घट सकती है हमारी मातृभूमि की गरिमा || सदैव ||'

poem-s2l1: 'क्या स्वतंत्रता काँटे से कपड़ा निकालने जैसी सहज आई?'

poem-s2l2: 'बाघ के मुँह से चारा छीनने जैसी वीर शक्ति'

poem-s2l3: 'जनता ने उसे पाया; जीवन में जुड़ जाए देशभक्ति || सदैव ||'

poem-s3l1: 'स्वतंत्रता के साथ कमाई नहीं आई'

poem-s3l2: 'व्यक्ति-व्यक्ति का पसीना सोखकर अंकुर वृक्ष बन गया,'

poem-s3l3: 'जैसे ऊपर चढ़े, घर को दृढ़ नींव मिलती है || सदैव ||'

poem-s4l1: 'आगे बढ़ते हुए उपलब्धि की ओर ध्यान बना रहे'

poem-s4l2: 'प्राणों को दाँव पर लगाने वालों को हमारा नमन,'

poem-s4l3: 'माँ की जूड़े पर प्रतिदिन फूल और दवना चढ़ते रहें || सदैव ||'

author-intro-1: 'के. एस. निसार अहमद : कवि कोक्करेहोसहळ्ळि शेख हैदर निसार अहमद का जन्म 05-02-1936 को बेंगलूरु ग्रामीण जिले के देवनहळ्ळि में हुआ। पिता शेख हैदर, माता हमीदा बेगम। भूगर्भशास्त्र में उपाधि लेकर बेंगलूरु विश्वविद्यालय में अध्यापक के रूप में सेवा आरंभ की। उन्होंने मनसु गांधीबाजारु, नेनेदवर मनदल्लि, नित्योत्सव, सुमूर्त आदि कृतियाँ रची हैं। उन्हें पंप पुरस्कार, नादोज पुरस्कार, केंद्रीय एवं राज्य साहित्य अकादमी पुरस्कार देकर सम्मानित किया गया है।'

