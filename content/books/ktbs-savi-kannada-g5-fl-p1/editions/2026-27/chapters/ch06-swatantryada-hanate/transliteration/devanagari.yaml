ex-a-q1: 'नम्म ताय्नाडिन घनते हेगे कुंदबारदु?'

ex-a-q2: 'धीरशक्ति उळ्ळवरु एनु माडबल्लरु?'

ex-a-q3: 'मोळके उंटादुदु हेगे?'

ex-a-q4: 'नम्म गमन यावुदर कडेगे सल्लबेकु?'

