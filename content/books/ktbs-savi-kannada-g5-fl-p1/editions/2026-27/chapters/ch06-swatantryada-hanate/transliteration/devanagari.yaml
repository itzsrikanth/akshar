intro-1: 'नमगे बंदिरुव स्वातंत्र्यवन्नु सदा रक्षणे माडिकोळ्ळबेकु. नम्म देशद अभिवृद्धिगागि सदा दुडियुत्तिरबेकु. धीरतनदिंद देशद स्वातंत्र्यवन्नु कापाडिकोळ्ळबेकु. नम्म साधनेय कडेगे गमनविरबेकु. देशक्कागि होराडिद हुतात्मरिगे गौरववन्नु सदा सल्लिसबेकु एंबुदु ई पद्यद आशयवागिदे.'

poem-s1l1: 'सदा उरियुतिरुव हागे स्वातंत्र्यद हणते'

poem-s1l2: 'दुडिमे तैलवेरेयुतिरलु बिडुविल्लदे जनते'

poem-s1l3: 'एंतु कुंदबहुदु एम्म ताय्नाडिन घनते || सदा ||'

poem-s2l1: 'मुळ्ळिनिंद अरिवे बिडिसिदंते बंते मुक्ति?'

poem-s2l2: 'हुलिय बाय मेव कसियुवंते धीरशक्ति'

poem-s2l3: 'पडेयितदनु जनते, बाळ बेसेये नाड भक्ति || सदा ||'

poem-s3l1: 'स्वातंत्र्यद जोतेगे बंदु कूडलिल्ल गळिके'

poem-s3l2: 'व्यक्ति व्यक्ति बेवर हीरि मरवागिदे मोळके,'

poem-s3l3: 'मेलेरिद हागे भद्र पायवुंटु गृहके || सदा ||'

poem-s4l1: 'सागिदंते सल्लुत्तिरलि साधनेयेडे गमन'

poem-s4l2: 'प्राणवन्ने पगडेयाडिदवरिगेम्म नमन,'

poem-s4l3: 'ताय मुडिगे दिनवु एरुतिरलि हूवु दवन || सदा ||'

author-intro-1: 'के. एस्. निसार् अहम्मद् : कवि कोक्करेहोसहळ्ळि षेक् हैदर् निसार् अहम्मद् अवरु 05-02-1936 रल्लि बेंगळूरु ग्रामांतर जिल्लेय देवनहळ्ळियल्लि जनिसिदरु. तंदे षेक् हैदर्, तायि हमीदा बेगं. भूगर्भशास्त्रदल्लि पदवियन्नु पडेदु बेंगळूरु विश्वविद्यालयदल्लि अध्यापकरागि सेवेयन्नु प्रारंभिसिदरु. इवरु मनसु गांधिबजारु, नेनेदवर मनदल्लि, नित्योत्सव, सुमूर्त मोदलाद कृतिगळन्नु रचिसिद्दारे. इवरिगे पंप प्रशस्ति, नाडोज प्रशस्ति, केंद्र मत्तु राज्य साहित्य अकाडेमि प्रशस्तिगळन्नु नीडि गौरविसलागिदे.'

