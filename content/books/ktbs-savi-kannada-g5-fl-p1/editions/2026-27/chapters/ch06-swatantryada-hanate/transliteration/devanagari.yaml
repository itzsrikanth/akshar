grammar-a-p1: 'नामपदद विशेष गुणवन्नु तिळिसुव अथवा सूचिसुव पदवे `गुण विशेषण''. उदा : रितेशन बळि करिय मोलविदे. इल्लि ‘करिय’ एंबुदु मोलद बण्णवन्नु तिळिसुत्तदे.'

grammar-a-p2: '1. कांचना सुंदर हुडुगि.'

grammar-a-p3: '2. दर्शिनि केंपु लंगवन्नु तोट्टिद्दाळे.'

grammar-a-p4: '3. राघुविन हत्तिर दोड्ड विमानविदे.'

grammar-a-p5: 'इल्लि अडिगेरे एळेयलाद ‘सुंदर’, ‘केंपु’, ‘दोड्ड’ ई पदगळन्नु गमनिसिरि. बण्ण, गुण, रीति, स्वभावगळन्नु तिळिसुव विशेषणगळागिवे. इवुगळन्नु ‘गुण विशेषण’गळेन्नुवरु.'

lang-ex-a-q1: 'अ) गुणविशेषण एंदरेनु? उदाहरणेयोंदिगे विवरिसिरि.'

lang-ex-a-q2: 'आ) कोट्टिरुव वाक्यगळल्लि गुणविशेषणवन्नु गुरुतिसि अडि गेरे हाकिरि. 1. लारियु तुंबा लगेजन्नु होरबल्लदु. 2. विमान निल्दाणदल्लि विशेष अतिथिगळ कोठडिगळिरुत्तवे. 3. विमान निल्दाण तुंबा सुंदरवागिदे. 4. हडगु बहळ दोड्डदागिदे. 5. प्रियाळ लंग हच्च हसुरागिदे.'

lang-ex-b-q1: '1. के. एस्. निसार् अहम्मद् अवर बगेगे हेच्चिन विवरवन्नु तिळियिरि.'

lang-ex-b-q2: '2. के. एस्. निसार् अहम्मद् अवर ‘नित्योत्सव’ कवनवन्नु संग्रहिसि, हाडिरि.'

lang-ex-c-q1: '1. देशक्कागि दुडि; देशक्कागि मडि.'

lang-ex-c-q2: '2. ओग्गट्टिनल्लि बलविदे.'
