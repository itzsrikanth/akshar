intro-1: 'namage bandiruva svātantryavannu sadā rakṣaṇe māḍikoḷḷabēku. namma dēśada abhivr̥ddhigāgi sadā duḍiyuttirabēku. dhīratanadinda dēśada svātantryavannu kāpāḍikoḷḷabēku. namma sādhaneya kaḍege gamanavirabēku. dēśakkāgi hōrāḍida hutātmarige gauravavannu sadā sallisabēku embudu ī padyada āśayavāgide.'

poem-s1l1: 'sadā uriyutiruva hāge svātantryada haṇate'

poem-s1l2: 'duḍime tailavereyutiralu biḍuvillade janate'

poem-s1l3: 'entu kundabahudu emma tāynāḍina ghanate || sadā ||'

poem-s2l1: 'muḷḷininda arive biḍisidante bante mukti?'

poem-s2l2: 'huliya bāya mēva kasiyuvante dhīraśakti'

poem-s2l3: 'paḍeyitadanu janate, bāḷa beseye nāḍa bhakti || sadā ||'

poem-s3l1: 'svātantryada jotege bandu kūḍalilla gaḷike'

poem-s3l2: 'vyakti vyakti bevara hīri maravāgide moḷake,'

poem-s3l3: 'mēlērida hāge bhadra pāyavuṇṭu gr̥hake || sadā ||'

poem-s4l1: 'sāgidante salluttirali sādhaneyeḍe gamana'

poem-s4l2: 'prāṇavanne pagaḍeyāḍidavarigemma namana,'

poem-s4l3: 'tāya muḍige dinavu ērutirali hūvu davana || sadā ||'

author-intro-1: 'ke. es. nisār ahammad : kavi kokkarehosahaḷḷi ṣēk haidar nisār ahammad avaru 05-02-1936 ralli beṅgaḷūru grāmāntara jilleya dēvanahaḷḷiyalli janisidaru. tande ṣēk haidar, tāyi hamīdā bēgaṁ. bhūgarbhaśāstradalli padaviyannu paḍedu beṅgaḷūru viśvavidyālayadalli adhyāpakarāgi sēveyannu prārambhisidaru. ivaru manasu gāndhibajāru, nenedavara manadalli, nityōtsava, sumūrta modalāda kr̥tigaḷannu racisiddāre. ivarige pampa praśasti, nāḍōja praśasti, kēndra mattu rājya sāhitya akāḍemi praśastigaḷannu nīḍi gauravisalāgide.'

