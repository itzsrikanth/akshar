grammar-a-p1: 'nāmapadada viśēṣa guṇavannu tiḷisuva athavā sūcisuva padavē `guṇa viśēṣaṇa''. udā : ritēśana baḷi kariya molavide. illi ‘kariya’ embudu molada baṇṇavannu tiḷisuttade.'

grammar-a-p2: '1. kāñcanā sundara huḍugi.'

grammar-a-p3: '2. darśini kempu laṅgavannu toṭṭiddāḷe.'

grammar-a-p4: '3. rāghuvina hattira doḍḍa vimānavide.'

grammar-a-p5: 'illi aḍigere eḷeyalāda ‘sundara’, ‘kempu’, ‘doḍḍa’ ī padagaḷannu gamanisiri. baṇṇa, guṇa, rīti, svabhāvagaḷannu tiḷisuva viśēṣaṇagaḷāgive. ivugaḷannu ‘guṇa viśēṣaṇa’gaḷennuvaru.'

lang-ex-a-q1: 'a) guṇaviśēṣaṇa endarēnu? udāharaṇeyondige vivarisiri.'

lang-ex-a-q2: 'ā) koṭṭiruva vākyagaḷalli guṇaviśēṣaṇavannu gurutisi aḍi gere hākiri. 1. lāriyu tumbā lagējannu horaballadu. 2. vimāna nildāṇadalli viśēṣa atithigaḷa koṭhaḍigaḷiruttave. 3. vimāna nildāṇa tumbā sundaravāgide. 4. haḍagu bahaḷa doḍḍadāgide. 5. priyāḷa laṅga hacca hasurāgide.'

lang-ex-b-q1: '1. ke. es. nisār ahammad avara bagege heccina vivaravannu tiḷiyiri.'

lang-ex-b-q2: '2. ke. es. nisār ahammad avara ‘nityōtsava’ kavanavannu saṅgrahisi, hāḍiri.'

lang-ex-c-q1: '1. dēśakkāgi duḍi; dēśakkāgi maḍi.'

lang-ex-c-q2: '2. oggaṭṭinalli balavide.'
