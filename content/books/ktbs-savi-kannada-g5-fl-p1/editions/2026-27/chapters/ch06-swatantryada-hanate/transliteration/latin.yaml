ex-a-q1: 'namma tāynāḍina ghanate hēge kundabāradu?'

ex-a-q2: 'dhīraśakti uḷḷavaru ēnu māḍaballaru?'

ex-a-q3: 'moḷake uṇṭādudu hēge?'

ex-a-q4: 'namma gamana yāvudara kaḍege sallabēku?'

