  - id: ex-a-q1
    type: question
    exercise: A
    text: ನಮ್ಮ ತಾಯ್ನಾಡಿನ ಘನತೆ ಹೇಗೆ ಕುಂದಬಾರದು?

  - id: ex-a-q2
    type: question
    exercise: A
    text: ಧೀರಶಕ್ತಿ ಉಳ್ಳವರು ಏನು ಮಾಡಬಲ್ಲರು?

  - id: ex-a-q3
    type: question
    exercise: A
    text: ಮೊಳಕೆ ಉಂಟಾದುದು ಹೇಗೆ?

  - id: ex-a-q4
    type: question
    exercise: A
    text: ನಮ್ಮ ಗಮನ ಯಾವುದರ ಕಡೆಗೆ ಸಲ್ಲಬೇಕು?

  - id: ex-b-q1
    type: fill_blank
    exercise: B
    text: ಸದಾ ________________________________\n____________________________________\n________________________ ಘನತೆ || ಸದಾ ||

  - id: ex-b-q2
    type: fill_blank
    exercise: B
    text: ಸಾಗಿದಂತೆ ____________________________\n____________________________________\n________________________ ದವನ || ಸದಾ ||

  - id: grammar-a-p1
    type: prose
    section: grammar-A
    text: 'ನಾಮಪದದ ವಿಶೇಷ ಗುಣವನ್ನು ತಿಳಿಸುವ ಅಥವಾ ಸೂಚಿಸುವ ಪದವೇ `ಗುಣ ವಿಶೇಷಣ''. ಉದಾ : ರಿತೇಶನ ಬಳಿ ಕರಿಯ ಮೊಲವಿದೆ. ಇಲ್ಲಿ ‘ಕರಿಯ’ ಎಂಬುದು ಮೊಲದ ಬಣ್ಣವನ್ನು ತಿಳಿಸುತ್ತದೆ.'

  - id: grammar-a-p2
    type: prose
    section: grammar-A
    text: 1. ಕಾಂಚನಾ ಸುಂದರ ಹುಡುಗಿ.

  - id: grammar-a-p3
    type: prose
    section: grammar-A
    text: 2. ದರ್ಶಿನಿ ಕೆಂಪು ಲಂಗವನ್ನು ತೊಟ್ಟಿದ್ದಾಳೆ.

  - id: grammar-a-p4
    type: prose
    section: grammar-A
    text: 3. ರಾಘುವಿನ ಹತ್ತಿರ ದೊಡ್ಡ ವಿಮಾನವಿದೆ.

  - id: grammar-a-p5
    type: prose
    section: grammar-A
    text: ಇಲ್ಲಿ ಅಡಿಗೆರೆ ಎಳೆಯಲಾದ ‘ಸುಂದರ’, ‘ಕೆಂಪು’, ‘ದೊಡ್ಡ’ ಈ ಪದಗಳನ್ನು ಗಮನಿಸಿರಿ. ಬಣ್ಣ, ಗುಣ, ರೀತಿ, ಸ್ವಭಾವಗಳನ್ನು ತಿಳಿಸುವ ವಿಶೇಷಣಗಳಾಗಿವೆ. ಇವುಗಳನ್ನು ‘ಗುಣ ವಿಶೇಷಣ’ಗಳೆನ್ನುವರು.

  - id: lang-ex-a-q1
    type: question
    exercise: language-exercise-A
    text: ಅ) ಗುಣವಿಶೇಷಣ ಎಂದರೇನು? ಉದಾಹರಣೆಯೊಂದಿಗೆ ವಿವರಿಸಿರಿ.

  - id: lang-ex-a-q2
    type: question
    exercise: language-exercise-A
    text: ಆ) ಕೊಟ್ಟಿರುವ ವಾಕ್ಯಗಳಲ್ಲಿ ಗುಣವಿಶೇಷಣವನ್ನು ಗುರುತಿಸಿ ಅಡಿ ಗೆರೆ ಹಾಕಿರಿ. 1. ಲಾರಿಯು ತುಂಬಾ ಲಗೇಜನ್ನು ಹೊರಬಲ್ಲದು. 2. ವಿಮಾನ ನಿಲ್ದಾಣದಲ್ಲಿ ವಿಶೇಷ ಅತಿಥಿಗಳ ಕೊಠಡಿಗಳಿರುತ್ತವೆ. 3. ವಿಮಾನ ನಿಲ್ದಾಣ ತುಂಬಾ ಸುಂದರವಾಗಿದೆ. 4. ಹಡಗು ಬಹಳ ದೊಡ್ಡದಾಗಿದೆ. 5. ಪ್ರಿಯಾಳ ಲಂಗ ಹಚ್ಚ ಹಸುರಾಗಿದೆ.

  - id: lang-ex-b-q1
    type: question
    exercise: language-exercise-B
    text: 1. ಕೆ. ಎಸ್. ನಿಸಾರ್ ಅಹಮ್ಮದ್ ಅವರ ಬಗೆಗೆ ಹೆಚ್ಚಿನ ವಿವರವನ್ನು ತಿಳಿಯಿರಿ.

  - id: lang-ex-b-q2
    type: question
    exercise: language-exercise-B
    text: 2. ಕೆ. ಎಸ್. ನಿಸಾರ್ ಅಹಮ್ಮದ್ ಅವರ ‘ನಿತ್ಯೋತ್ಸವ’ ಕವನವನ್ನು ಸಂಗ್ರಹಿಸಿ, ಹಾಡಿರಿ.

  - id: lang-ex-c-q1
    type: question
    exercise: language-exercise-C
    text: 1. ದೇಶಕ್ಕಾಗಿ ದುಡಿ; ದೇಶಕ್ಕಾಗಿ ಮಡಿ.

  - id: lang-ex-c-q2
    type: question
    exercise: language-exercise-C
    text: 2. ಒಗ್ಗಟ್ಟಿನಲ್ಲಿ ಬಲವಿದೆ.
