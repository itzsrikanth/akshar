segments:
  - id: intro-1
    type: prose
    section: intro
    text: ನಮಗೆ ಬಂದಿರುವ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ಸದಾ ರಕ್ಷಣೆ ಮಾಡಿಕೊಳ್ಳಬೇಕು. ನಮ್ಮ ದೇಶದ ಅಭಿವೃದ್ಧಿಗಾಗಿ ಸದಾ ದುಡಿಯುತ್ತಿರಬೇಕು. ಧೀರತನದಿಂದ ದೇಶದ ಸ್ವಾತಂತ್ರ್ಯವನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳಬೇಕು. ನಮ್ಮ ಸಾಧನೆಯ ಕಡೆಗೆ ಗಮನವಿರಬೇಕು. ದೇಶಕ್ಕಾಗಿ ಹೋರಾಡಿದ ಹುತಾತ್ಮರಿಗೆ ಗೌರವವನ್ನು ಸದಾ ಸಲ್ಲಿಸಬೇಕು ಎಂಬುದು ಈ ಪದ್ಯದ ಆಶಯವಾಗಿದೆ.

  - id: poem-s1l1
    type: poem_line
    stanza: 1
    text: ಸದಾ ಉರಿಯುತಿರುವ ಹಾಗೆ ಸ್ವಾತಂತ್ರ್ಯದ ಹಣತೆ

  - id: poem-s1l2
    type: poem_line
    stanza: 1
    text: ದುಡಿಮೆ ತೈಲವೆರೆಯುತಿರಲು ಬಿಡುವಿಲ್ಲದೆ ಜನತೆ

  - id: poem-s1l3
    type: poem_line
    stanza: 1
    text: ಎಂತು ಕುಂದಬಹುದು ಎಮ್ಮ ತಾಯ್ನಾಡಿನ ಘನತೆ || ಸದಾ ||

  - id: poem-s2l1
    type: poem_line
    stanza: 2
    text: ಮುಳ್ಳಿನಿಂದ ಅರಿವೆ ಬಿಡಿಸಿದಂತೆ ಬಂತೆ ಮುಕ್ತಿ?

  - id: poem-s2l2
    type: poem_line
    stanza: 2
    text: ಹುಲಿಯ ಬಾಯ ಮೇವ ಕಸಿಯುವಂತೆ ಧೀರಶಕ್ತಿ

  - id: poem-s2l3
    type: poem_line
    stanza: 2
    text: ಪಡೆಯಿತದನು ಜನತೆ, ಬಾಳ ಬೆಸೆಯೆ ನಾಡ ಭಕ್ತಿ || ಸದಾ ||

  - id: poem-s3l1
    type: poem_line
    stanza: 3
    text: ಸ್ವಾತಂತ್ರ್ಯದ ಜೊತೆಗೆ ಬಂದು ಕೂಡಲಿಲ್ಲ ಗಳಿಕೆ

  - id: poem-s3l2
    type: poem_line
    stanza: 3
    text: ವ್ಯಕ್ತಿ ವ್ಯಕ್ತಿ ಬೆವರ ಹೀರಿ ಮರವಾಗಿದೆ ಮೊಳಕೆ,

  - id: poem-s3l3
    type: poem_line
    stanza: 3
    text: ಮೇಲೇರಿದ ಹಾಗೆ ಭದ್ರ ಪಾಯವುಂಟು ಗೃಹಕೆ || ಸದಾ ||

  - id: poem-s4l1
    type: poem_line
    stanza: 4
    text: ಸಾಗಿದಂತೆ ಸಲ್ಲುತ್ತಿರಲಿ ಸಾಧನೆಯೆಡೆ ಗಮನ

  - id: poem-s4l2
    type: poem_line
    stanza: 4
    text: ಪ್ರಾಣವನ್ನೆ ಪಗಡೆಯಾಡಿದವರಿಗೆಮ್ಮ ನಮನ,

  - id: poem-s4l3
    type: poem_line
    stanza: 4
    text: ತಾಯ ಮುಡಿಗೆ ದಿನವು ಏರುತಿರಲಿ ಹೂವು ದವನ || ಸದಾ ||

  - id: author-intro-1
    type: prose
    section: author_intro
    text: 'ಕೆ. ಎಸ್. ನಿಸಾರ್ ಅಹಮ್ಮದ್ : ಕವಿ ಕೊಕ್ಕರೆಹೊಸಹಳ್ಳಿ ಷೇಕ್ ಹೈದರ್ ನಿಸಾರ್ ಅಹಮ್ಮದ್ ಅವರು 05-02-1936 ರಲ್ಲಿ ಬೆಂಗಳೂರು ಗ್ರಾಮಾಂತರ ಜಿಲ್ಲೆಯ ದೇವನಹಳ್ಳಿಯಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಷೇಕ್ ಹೈದರ್, ತಾಯಿ ಹಮೀದಾ ಬೇಗಂ. ಭೂಗರ್ಭಶಾಸ್ತ್ರದಲ್ಲಿ ಪದವಿಯನ್ನು ಪಡೆದು ಬೆಂಗಳೂರು ವಿಶ್ವವಿದ್ಯಾಲಯದಲ್ಲಿ ಅಧ್ಯಾಪಕರಾಗಿ ಸೇವೆಯನ್ನು ಪ್ರಾರಂಭಿಸಿದರು. ಇವರು ಮನಸು ಗಾಂಧಿಬಜಾರು, ನೆನೆದವರ ಮನದಲ್ಲಿ, ನಿತ್ಯೋತ್ಸವ, ಸುಮೂರ್ತ ಮೊದಲಾದ ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಇವರಿಗೆ ಪಂಪ ಪ್ರಶಸ್ತಿ, ನಾಡೋಜ ಪ್ರಶಸ್ತಿ, ಕೇಂದ್ರ ಮತ್ತು ರಾಜ್ಯ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿಗಳನ್ನು ನೀಡಿ ಗೌರವಿಸಲಾಗಿದೆ.'

