    type: 'prose'
    section: 'grammar-B'
    text: 'ಸ್ವರಾಕ್ಷರಗಳಲ್ಲಿ ಎರಡು ವಿಧ.: 1) ಹ್ರಸ್ವಸ್ವರಗಳು 2) ದೀರ್ಘಸ್ವರಗಳು'

  - id: 'grammar-b-p3'
    type: 'prose'
    section: 'grammar-B'
    text: '1) ಹ್ರಸ್ವಸ್ವರ - ಒಂದು ಮಾತ್ರಾ ಕಾಲದಲ್ಲಿ ಉಚ್ಚರಿಸಲಾಗುವ (ಅ, ಇ, ಉ, ಋ, ಎ, ಒ) ಅಕ್ಷರಗಳು ಹ್ರಸ್ವಸ್ವರಗಳು.'

  - id: 'grammar-b-p4'
    type: 'prose'
    section: 'grammar-B'
    text: '2) ದೀರ್ಘಸ್ವರ - ಎರಡು ಮಾತ್ರಾ ಕಾಲದಲ್ಲಿ ಉಚ್ಚರಿಸಲಾಗುವ (ಆ, ಈ, ಊ, ಏ, ಐ, ಓ, ಔ) ಅಕ್ಷರಗಳು ದೀರ್ಘಸ್ವರಗಳು.'

  - id: 'grammar-c-p1'
    type: 'prose'
    section: 'grammar-C'
    text: 'ಸ್ವರಗಳ ಸಹಾಯದಿಂದ ಉಚ್ಚರಿಸಲಾಗುವ ಅಕ್ಷರಗಳು ವ್ಯಂಜನಾಕ್ಷರಗಳು. (ಉದಾ : ಕ್ + ಅ = ಕ ; ಚ್ + ಅ = ಚ) ಒಟ್ಟು ವ್ಯಂಜನಾಕ್ಷರಗಳು = 34'

  - id: 'grammar-c-p2'
    type: 'prose'
    section: 'grammar-C'
    text: 'ವ್ಯಂಜನಾಕ್ಷರಗಳಲ್ಲಿ ಎರಡು ವಿಧ : 1) ವರ್ಗೀಯ ವ್ಯಂಜನಗಳು 2) ಅವರ್ಗೀಯ ವ್ಯಂಜನಗಳು'

  - id: 'grammar-c-p3'
    type: 'prose'
    section: 'grammar-C'
    text: '1. ವರ್ಗೀಯ ವ್ಯಂಜನ ಕೋಷ್ಟಕ. ಕ್ ವರ್ಗ: ಕ್ ಖ್ ಗ್ ಘ್ ಙ. ಚ್ ವರ್ಗ: ಚ್ ಛ್ ಜ್ ಝ್ ಞ. ಟ್ ವರ್ಗ: ಟ್ ಠ್ ಡ್ ಢ್ ಣ್. ತ್ ವರ್ಗ: ತ್ ಥ್ ದ್ ಧ್ ನ್. ಪ್ ವರ್ಗ: ಪ್ ಫ್ ಬ್ ಭ್ ಮ್. ಒಟ್ಟು 25. ಇವು ಉತ್ಪತ್ತಿಯಾಗುವ ಸ್ಥಾನಗಳಿಗೆ ಅನುಗುಣವಾಗಿ ವರ್ಗ ಮಾಡಿರುವುದರಿಂದ ವರ್ಗೀಯ ವ್ಯಂಜನಗಳು.'

  - id: 'grammar-c-p4'
    type: 'prose'
    section: 'grammar-C'
    text: 'ಅಲ್ಪಪ್ರಾಣಾಕ್ಷರಗಳು = ಕಡಿಮೆ ಉಸಿರಿನಿಂದ ಉಚ್ಚರಿಸಲಾಗುವ ವ್ಯಂಜನಗಳು ಅಲ್ಪಪ್ರಾಣಾಕ್ಷರಗಳು. ಉದಾ : ಕ್, ಚ್, ಟ್, ತ್, ಪ್, ಗ್, ಜ್, ಡ್, ದ್, ಬ್.'

  - id: 'grammar-c-p5'
    type: 'prose'
    section: 'grammar-C'
    text: 'ಮಹಾಪ್ರಾಣಾಕ್ಷರಗಳು = ಹೆಚ್ಚು ಉಸಿರಿನಿಂದ ಉಚ್ಚರಿಸಲಾಗುವ ವ್ಯಂಜನಗಳು ಮಹಾಪ್ರಾಣಾಕ್ಷರಗಳು. ಉದಾ : ಖ್, ಛ್, ಠ್, ಥ್, ಫ್. ಘ್, ಝ್, ಢ್, ಧ್, ಭ್.'

  - id: 'grammar-c-p6'
    type: 'prose'
    section: 'grammar-C'
    text: 'ಅನುನಾಸಿಕಾಕ್ಷರಗಳು = ಮೂಗಿನ ಸಹಾಯದಿಂದ ಉಚ್ಚರಿಸಲಾಗುವ ವ್ಯಂಜನಗಳು ಅನುನಾಸಿಕಾಕ್ಷರಗಳು. ಉದಾ : ಙ, ಞ, ಣ್, ನ್, ಮ್.'

  - id: 'grammar-c-p7'
    type: 'prose'
    section: 'grammar-C'
    text: '2. ಅವರ್ಗೀಯ ವ್ಯಂಜನಗಳು. ‘ಯ್’ ಕಾರದಿಂದ ‘ಳ್’ ಕಾರದವರೆಗಿನ 9 ಅಕ್ಷರಗಳು ಅವರ್ಗೀಯ ವ್ಯಂಜನಗಳು. ಉದಾ : ಯ್, ರ್, ಲ್, ವ್, ಶ್, ಷ್, ಸ್, ಹ್, ಳ್. ಇವು ಉತ್ಪತ್ತಿಯಾಗುವ ಸ್ಥಾನಗಳು ಬೇರೆಬೇರೆಯಾಗಿರುವುದರಿಂದ, ಇವುಗಳನ್ನು ನಿರ್ದಿಷ್ಟವಾದ ವರ್ಗಗಳಲ್ಲಿ ಸೇರಿಸಿ ಹೇಳಲು ಬರುವುದಿಲ್ಲವಾದ್ದರಿಂದ ಇವನ್ನು ಅವರ್ಗೀಯ ವ್ಯಂಜನಗಳು ಎಂದು ಕರೆಯುವರು.'

  - id: 'grammar-d-p1'
    type: 'prose'
    section: 'grammar-D'
    text: '‘ಯೋಗ’ ಎಂದರೆ ‘ಕೂಡು, ‘ವಾಹ’ ಎಂದರೆ ಹೋಗುವ ಎಂದರ್ಥ. ‘ಯೋಗವಾಹ'' ಎಂದರೆ ಕೂಡಿಹೋಗುವ (ಕೂಡಿಕೊಂಡಿರುವ) ಅಂದರೆ ಬೇರೆ ಅಕ್ಷರಗಳ ಜೊತೆಯಲ್ಲಿ ಮಾತ್ರ ಉಚ್ಚರಿಸಬಹುದಾದ ಅಕ್ಷರ ಎಂದರ್ಥ.'

  - id: 'grammar-d-p2'
    type: 'prose'
    section: 'grammar-D'
    text: 'ಯೋಗವಾಹಗಳಲ್ಲಿ ಎರಡು ವಿಧ: 1) ಅನುಸ್ವಾರ (ಂ) 2) ವಿಸರ್ಗ (ಃ) ಉದಾ : ಸಿಂಹ, ದುಃಖ'

