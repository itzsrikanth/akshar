segments:
  - id: 'intro-1'
    type: 'prose'
    section: 'intro'
    text: '‘ಒಗ್ಗಟ್ಟಿನಲ್ಲಿ ಬಲವಿದೆ’. ಎಲ್ಲರೂ ಒಟ್ಟಾಗಿ ಬಾಳಿದರೆ ಎಲ್ಲರೂ ಸುಖವಾಗಿ ಇರಬಹುದು. ನಮ್ಮ ನಮ್ಮ ನಡುವೆ ಇರುವ ದ್ವೇಷ ಅಸೂಯೆಗಳನ್ನು ಮರೆತು ಎಲ್ಲರನ್ನು ಪ್ರೀತಿಸುತ್ತಾ ಬಾಳಿದರೆ ನಮ್ಮ ಬದುಕು ಸುಖಮಯವಾಗಿರುತ್ತದೆ.'

  - id: 'story-n1'
    type: 'prose'
    section: 'story'
    text: 'ಒಂದು ಹಳ್ಳಿ, ಅಲ್ಲಿ ರೈತನೊಬ್ಬನ ಹೊಲ ಇತ್ತು. ಅಲ್ಲಿ ಒಂದು ಬೇವಿನ ಮರವಿತ್ತು. ಹೇಗೋ ಏನೋ ಅದರ ಕೆಳಗೆ ಒಂದು ಗುಂಡನೆಯ ಕಲ್ಲು ಬಂದು ನಿಂತುಕೊಂಡಿತು. ಮರದ ಮೇಲೆ ಕುಳಿತುಕೊಳ್ಳುತ್ತಿದ್ದ ಹಕ್ಕಿಗಳ ಹಿಕ್ಕೆ ಕಲ್ಲಿನ ಮೇಲೆ ಬಿದ್ದು ಬಿದ್ದು, ಆ ಕಲ್ಲು ಬೆಳ್ಳಗಾಗಿ, ವಿಭೂತಿ ಬಳಿದಂತೆ ಕಾಣಿಸುತ್ತಿತ್ತು. ಇದರಿಂದಾಗಿ ಆ ಬಿಳಿಯ ಕಲ್ಲು ಎಲ್ಲರಿಗೂ ಅಮ್ಮನ ಕಲ್ಲಿನಂತೆ ಕಾಣಿಸುತ್ತಿತ್ತು. ಆದ್ದರಿಂದ, ಬೇವಿನ ಮರವನ್ನು ಜನ ‘ಅಮ್ಮನ ಮರ’ ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ಆ ಕಲ್ಲು ಬೇವಿನ ಮರದ ಕೆಳಗಿದ್ದುದರಿಂದ ಅದಕ್ಕೆ ‘ಅಮ್ಮನ ಕಲ್ಲು’ ಎಂಬ ಹೆಸರು ರೂಢಿಗೆ ಬಂದಿತ್ತು. ಹೀಗೆ ಒಂದರಿಂದ ಇನ್ನೊಂದು ಹೆಸರು ಪಡೆದುಕೊಂಡು ಎರಡೂ ಸುಖವಾಗಿದ್ದವು. ‘ಅಮ್ಮನ ಮರ’, ‘ಅಮ್ಮನ ಕಲ್ಲು’ ಎಂದು ಊರಿನ ಜನಗಳು ಅವುಗಳ ತಂಟೆಗೆ ಹೋಗುತ್ತಿರಲಿಲ್ಲ.'

  - id: 'story-n2'
    type: 'prose'
    section: 'story'
    text: 'ಒಂದು ಸಲ, ತನ್ನಿಂದ ಇನ್ನೊಂದು ಸುಖವಾಗಿದೆ ಎಂದು ಎರಡಕ್ಕೂ ಜಂಬ ಬಂತು. ಬೇವಿನ ಮರ “ನಾನು ಅಮ್ಮನ ಮರ, ನೀನು ನನ್ನ ಕೆಳಗಿರುವುದರಿಂದ ನಿನ್ನನ್ನು ಅಮ್ಮನ ಕಲ್ಲು, ಎಂದು ಜನ ಕರೆಯುತ್ತಾರೆ” ಎಂದು ಹೇಳಿತು. ಅದಕ್ಕೆ ಕಲ್ಲು “ನಾನು ಅಮ್ಮನ ಕಲ್ಲು, ನನ್ನ ಪಕ್ಕದಲ್ಲಿ ನೀನಿರುವುದರಿಂದ ನಿನ್ನನ್ನು ಅಮ್ಮನ ಮರ ಎಂದು ಕರೆಯುತ್ತಾರೆ” ಎಂದಿತು. ಹೀಗೆ ಎರಡೂ ಜಗಳ ಮಾಡಿದವು. ಕೊನೆಗೆ ಕಲ್ಲು ಕೋಪದಿಂದ ಉರುಳಿ ಉರುಳಿ ಬೇವಿನ ಮರದಿಂದ ದೂರ ಹೋಗಿ ನಿಂತಿತು. “ನಾನಿಲ್ಲದಿದ್ದರೆ ಮರವನ್ನು ಕಡಿದುಹಾಕುತ್ತಾರೆ” ಎಂದು ಕಲ್ಲು, “ನನ್ನ ಕೆಳಗಿರದಿದ್ದರೆ ಕಲ್ಲನ್ನು ಒಡೆದು ಹಾಕುತ್ತಾರೆ” ಎಂದು ಮರ-ಹೀಗೆ ಎರಡೂ ತಮ್ಮೊಳಗೆ ಆಲೋಚಿಸುತ್ತಿದ್ದವು.'

  - id: 'story-n3'
    type: 'prose'
    section: 'story'
    text: 'ಒಂದು ದಿನ ಹೊಲವನ್ನು ಉಳಲಿಕ್ಕೆ ಆ ಹಳ್ಳಿಯ ರೈತ ತನ್ನ ಮಕ್ಕಳ ಜೊತೆ ಬಂದನು. ಅಮ್ಮನ ಕಲ್ಲು ಇಲ್ಲದ ಆ ಬೇವಿನ ಮರವನ್ನು ನೋಡಿ “ಇದನ್ನು ನಾಳೆ ಕಡಿಸಿ, ನೇಗಿಲು, ಚಕ್ರ ಮಾಡಿಸಿ” ಎಂದು ತನ್ನ ಮಕ್ಕಳಿಗೆ ಹೇಳಿದ. ಬೇವಿನ ಮರದಿಂದ ದೂರ ಬಿದ್ದಿದ್ದ ಕಲ್ಲನ್ನು ನೋಡಿ “ಈ ಕಲ್ಲನ್ನು ನಾಳೆ ಕಲ್ಲು ಒಡೆಯುವವರಿಂದ ಒಡೆಸಿದರೆ ನೇಗಿಲನ್ನು ಕಟ್ಟಿ ಉಳಲು ಬರುತ್ತದೆ” ಎಂದು ತನ್ನ ಮಕ್ಕಳಿಗೆ ಹೇಳಿದ. ಇದನ್ನು ಕೇಳಿ ಮರ ಮತ್ತು ಕಲ್ಲು ಎರಡೂ ಭಯದಿಂದ ನಡುಗಿದವು. ನಾವಿಬ್ಬರೂ ಒಬ್ಬರಿಂದ ಒಬ್ಬರು ದೂರವಾಗಿದ್ದರೆ ಜನರು ನಮ್ಮಿಬ್ಬರನ್ನು ನಾಶಮಾಡುತ್ತಾರೆ. ಆದ್ದರಿಂದ ನಾವಿಬ್ಬರೂ ಉಳಿಯುವುದಿಲ್ಲ ಎಂಬ ತಿಳಿವಳಿಕೆ ಮರ ಮತ್ತು ಕಲ್ಲಿಗೆ ಬಂದಿತು. ರೈತ ಮತ್ತು ರೈತನ ಮಕ್ಕಳು ಅತ್ತ ಹೋಗುವುದನ್ನೇ ಕಾದಿದ್ದು, ಕಲ್ಲು “ಬರಲಾ” ಎಂದು ಬೇವಿನ ಮರವನ್ನು ಕೇಳಿತು. ಮರ “ಬೇಗ ಬಾ” ಎಂದು ಕಲ್ಲಿಗೆ ಹೇಳಿತು. ತಾನು ಇನ್ನೊಂದರಿಂದ ಸುಖವಾಗಿರುವುದು ಎಂದು ಈಗ ಎರಡಕ್ಕೂ ತಿಳಿಯಿತು. ಬೇವಿನ ಮರ ಮತ್ತು ಕಲ್ಲು ಮತ್ತೆ ಸ್ನೇಹಿತರಾದವು.'

  - id: 'story-n4'
    type: 'prose'
    section: 'story'
    text: 'ಮಾರನೆಯ ದಿನ ಮರಕಡಿಯುವವರು ಬಂದು ನೋಡಿದರು. ಕಲ್ಲು ಮರದ ಕೆಳಗೆ ಮೊದಲಿನಂತೆ ನಿಂತಿತ್ತು. ಅವರಿಗೆ ಮರ ಮತ್ತು ಕಲ್ಲಿನ ಬಗೆಗೆ ಭಯ-ಭಕ್ತಿ ಉಂಟಾಯಿತು. “ಇದು ಅಮ್ಮನ ಮರ, ಕಡಿಯುವುದು ಬೇಡ” ಎಂದು ಹೊರಟು ಹೋದರು. ಕಲ್ಲು ಒಡೆಯುವವರು ಬಂದು “ಇದು ಅಮ್ಮನ ಕಲ್ಲು, ಒಡೆಯುವುದು ಬೇಡ” ಎಂದು ಅವರೂ ಹೊರಟು ಹೋದರು.'

  - id: 'story-n5'
    type: 'prose'
    section: 'story'
    text: 'ಬೇವಿನ ಮರ ಮತ್ತು ಕಲ್ಲು ಕಂಟಕದಿಂದ ಪಾರಾದವು. ಈಗ ಎರಡೂ ಸಹ ಯಾರ ಭಯವಿಲ್ಲದೆ ಸುಖವಾಗಿದ್ದವು.'

  - id: 'story-n6'
    type: 'prose'
    section: 'story'
    text: 'ಹೀಗೆ ಎಲ್ಲರೂ ಒಟ್ಟಾಗಿ ಬಾಳಿದರೆ, ಎಲ್ಲರೂ ಸುಖವಾಗಿ ಇರಬಹುದು.'

