grammar-a-p1: 'In Kannada there are 49 letters in all. They are called varnas (phonemes). The ordered arrangement of these letters is called the varnamale or aksharamale (alphabet).'

grammar-a-p2: 'There are three kinds in the alphabet: A) vowels B) consonants C) yogavahas'

grammar-b-p1: 'Letters that can be pronounced independently are vowels. There are 13 vowels in all.'

grammar-b-p2: 'There are two kinds of vowels: 1) short vowels 2) long vowels'

grammar-b-p3: '1) Short vowels — letters pronounced in one matra of time (a, i, u, ṛ, e, o) are short vowels.'

grammar-b-p4: '2) Long vowels — letters pronounced in two matras of time (ā, ī, ū, ē, ai, ō, au) are long vowels.'

grammar-c-p1: 'Letters pronounced with the help of vowels are consonants. (Example: k + a = ka; c + a = ca) Total consonants = 34'

grammar-c-p2: 'There are two kinds of consonants: 1) classified consonants 2) unclassified consonants'

grammar-c-p3: '1. Classified consonant chart. k-group: k kh g gh ṅ. c-group: c ch j jh ñ. ṭ-group: ṭ ṭh ḍ ḍh ṇ. t-group: t th d dh n. p-group: p ph b bh m. Total 25. Because they are grouped according to place of articulation, they are classified consonants.'

grammar-c-p4: 'Alpaprana letters = consonants pronounced with less breath. Examples: k, c, ṭ, t, p, g, j, ḍ, d, b.'

grammar-c-p5: 'Mahaprana letters = consonants pronounced with more breath. Examples: kh, ch, ṭh, th, ph, gh, jh, ḍh, dh, bh.'

grammar-c-p6: 'Anunasika letters = consonants pronounced with help of the nose. Examples: ṅ, ñ, ṇ, n, m.'

grammar-c-p7: '2. Unclassified consonants. The 9 letters from “y” to “ḷ” are unclassified consonants. Examples: y, r, l, v, ś, ṣ, s, h, ḷ. Because their places of articulation differ and they cannot be put in specific groups, they are called unclassified consonants.'

grammar-d-p1: '“Yoga” means “join,” and “vaha” means “that which goes.” “Yogavaha” means that which goes joined—that is, a letter that can be pronounced only together with other letters.'

grammar-d-p2: 'There are two kinds of yogavahas: 1) anusvara (ṁ) 2) visarga (ḥ) Examples: simha, duḥkha'

