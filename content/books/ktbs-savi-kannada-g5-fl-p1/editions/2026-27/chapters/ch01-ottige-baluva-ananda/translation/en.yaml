intro-1: '“There is strength in unity.” If everyone lives together, everyone can be happy. If we forget the hatred and jealousy among us and live loving everyone, our life becomes joyful.'

story-n1: 'There was a village, and there a farmer had a field. In it stood a neem tree. Somehow a round stone came and settled under it. Droppings from birds sitting on the tree fell again and again on the stone, and the stone turned white, looking as if vibhuti had been smeared on it. Because of this, that white stone looked to everyone like the Mother’s stone. So people called the neem tree “Mother’s tree.” Since the stone lay under the neem, the name “Mother’s stone” became common for it. Thus each took a name from the other, and both were happy. Calling them “Mother’s tree” and “Mother’s stone,” the village people did not trouble them.'

story-n2: 'Once, thinking that one was happy because of the other, both grew proud. The neem tree said, “I am Mother’s tree; because you are under me, people call you Mother’s stone.” The stone said, “I am Mother’s stone; because you are beside me, people call you Mother’s tree.” Thus they quarrelled. At last the stone, in anger, rolled away from the neem and stood far off. “If I am not here they will cut the tree,” thought the stone; “If you are not under me they will break the stone,” thought the tree—so both thought within themselves.'

story-n3: 'One day the village farmer came with his children to plough the field. Seeing the neem without Mother’s stone he told his children, “Cut this tomorrow and make a plough and a wheel.” Seeing the stone lying far from the neem he said, “If we get stone-breakers to break this stone tomorrow, we can fix the plough and plough.” Hearing this, both tree and stone trembled with fear. The understanding came to them that if the two of us stay apart from each other, people will destroy us both, so neither of us will survive. Waiting until the farmer and his children went away, the stone asked the neem, “May I come?” The tree said to the stone, “Come quickly.” Now both understood that each was happy because of the other. The neem tree and the stone became friends again.'

story-n4: 'The next day the tree-cutters came and looked. The stone stood under the tree as before. Fear and devotion toward the tree and stone arose in them. “This is Mother’s tree; do not cut it,” they said and went away. The stone-breakers came and said, “This is Mother’s stone; do not break it,” and they too went away.'

story-n5: 'The neem tree and the stone escaped danger. Now both lived happily without fear of anyone.'

story-n6: 'Thus if everyone lives together, everyone can be happy.'

