intro-1: '«एकता में बल है»। सब साथ रहें तो सब सुखी रह सकते हैं। आपस के द्वेष-असूया भूलकर सबको प्रेम करते हुए जिएँ तो हमारा जीवन सुखमय रहता है।'

story-n1: 'एक गाँव था, वहाँ एक किसान का खेत था। वहाँ एक नीम का पेड़ था। कैसे-कैसे उसके नीचे एक गोल पत्थर आकर ठहर गया। पेड़ पर बैठने वाले पक्षियों की बीट पत्थर पर बार-बार गिरकर वह पत्थर सफ़ेद हो गया, जैसे विभूति लगाई हो। इससे वह सफ़ेद पत्थर सबको अम्मा का पत्थर जैसा लगता था। इसलिए लोग नीम को «अम्मा का पेड़» कहते थे। पत्थर नीम के नीचे होने से उसे «अम्मा का पत्थर» नाम पड़ गया। इस तरह एक से दूसरे ने नाम पाकर दोनों सुखी थे। «अम्मा का पेड़», «अम्मा का पत्थर» कहकर गाँव वाले उन्हें छेड़ते नहीं थे।'

story-n2: 'एक बार, एक के कारण दूसरा सुखी है सोचकर दोनों को घमंड आया। नीम ने कहा, «मैं अम्मा का पेड़ हूँ; तू मेरे नीचे है इसलिए लोग तुझे अम्मा का पत्थर कहते हैं।» पत्थर ने कहा, «मैं अम्मा का पत्थर हूँ; तू मेरे पास है इसलिए लोग तुझे अम्मा का पेड़ कहते हैं।» इस तरह दोनों झगड़े। अंत में पत्थर गुस्से में लुढ़क-लुढ़क नीम से दूर जाकर ठहर गया। «मैं न रहूँ तो पेड़ काट डालेंगे» सोचा पत्थर ने, «मेरे नीचे न रहे तो पत्थर तोड़ डालेंगे» सोचा पेड़ ने—दोनों मन में सोचते रहे।'

story-n3: 'एक दिन खेत जोतने गाँव का किसान बच्चों के साथ आया। अम्मा के पत्थर के बिना नीम देखकर बच्चों से कहा, «इसे कल काटना, हल और पहिया बनवाना।» नीम से दूर पड़े पत्थर को देखकर कहा, «इस पत्थर को कल पत्थर तोड़ने वालों से तोड़वाएँ तो हल बाँधकर जोत सकेंगे।» यह सुन दोनों डर से काँपे। समझ आई कि हम दोनों एक-दूसरे से अलग रहें तो लोग हमें नष्ट कर देंगे, इसलिए हम दोनों नहीं बचेंगे। किसान और बच्चे उधर जाने की प्रतीक्षा कर पत्थर ने नीम से पूछा, «आऊँ?» पेड़ ने कहा, «जल्दी आ।» अब दोनों समझ गए कि एक दूसरे से सुखी हैं। नीम और पत्थर फिर मित्र बन गए।'

story-n4: 'अगले दिन पेड़ काटने वाले आए और देखा। पत्थर पहले की तरह पेड़ के नीचे था। उन्हें पेड़ और पत्थर के प्रति भय-भक्ति हुई। «यह अम्मा का पेड़ है, मत काटो» कहकर चले गए। पत्थर तोड़ने वाले आए और «यह अम्मा का पत्थर है, मत तोड़ो» कहकर वे भी चले गए।'

story-n5: 'नीम और पत्थर विपत्ति से बच गए। अब दोनों बिना किसी के भय सुखी थे।'

story-n6: 'इस तरह सब साथ रहें तो सब सुखी रह सकते हैं।'

