grammar-a-p1: 'कन्नड़ में कुल 49 अक्षर हैं। इन्हें वर्ण कहते हैं। इन अक्षरों की क्रमबद्ध व्यवस्था को «वर्णमाला» या «अक्षरमाला» कहते हैं।'

grammar-a-p2: 'वर्णमाला में तीन भेद हैं—अ) स्वराक्षर आ) व्यंजनाक्षर इ) योगवाह'

grammar-b-p1: 'स्वतंत्र रूप से उच्चरित होने वाले अक्षर स्वराक्षर हैं। कुल स्वराक्षर 13।'

grammar-b-p2: 'स्वराक्षर दो प्रकार के—1) ह्रस्वस्वर 2) दीर्घस्वर'

grammar-b-p3: '1) ह्रस्वस्वर — एक मात्रा काल में उच्चरित (अ, इ, उ, ऋ, ए, ओ) अक्षर ह्रस्वस्वर हैं।'

grammar-b-p4: '2) दीर्घस्वर — दो मात्रा काल में उच्चरित (आ, ई, ऊ, ए, ऐ, ओ, औ) अक्षर दीर्घस्वर हैं।'

grammar-c-p1: 'स्वरों की सहायता से उच्चरित अक्षर व्यंजनाक्षर हैं। (उदा.: क् + अ = क; च् + अ = च) कुल व्यंजनाक्षर = 34'

grammar-c-p2: 'व्यंजनाक्षर दो प्रकार के—1) वर्गीय व्यंजन 2) अवर्गीय व्यंजन'

grammar-c-p3: '1. वर्गीय व्यंजन तालिका। क् वर्ग: क् ख् ग् घ् ङ्। च् वर्ग: च् छ् ज् झ् ञ्। ट् वर्ग: ट् ठ् ड् ढ् ण्। त् वर्ग: त् थ् द् ध् न्। प् वर्ग: प् फ् ब् भ् म्। कुल 25। उत्पत्ति-स्थान के अनुसार वर्ग होने से वर्गीय व्यंजन।'

grammar-c-p4: 'अल्पप्राणाक्षर = कम श्वास से उच्चरित व्यंजन। उदा.: क्, च्, ट्, त्, प्, ग्, ज्, ड्, द्, ब्।'

grammar-c-p5: 'महाप्राणाक्षर = अधिक श्वास से उच्चरित व्यंजन। उदा.: ख्, छ्, ठ्, थ्, फ्, घ्, झ्, ढ्, ध्, भ्।'

grammar-c-p6: 'अनुनासिकाक्षर = नाक की सहायता से उच्चरित व्यंजन। उदा.: ङ्, ञ्, ण्, न्, म्।'

grammar-c-p7: '2. अवर्गीय व्यंजन। «य्» से «ळ्» तक 9 अक्षर अवर्गीय व्यंजन हैं। उदा.: य्, र्, ल्, व्, श्, ष्, स्, ह्, ळ्। उत्पत्ति-स्थान अलग-अलग होने से निश्चित वर्गों में नहीं रखे जा सकते, इसलिए अवर्गीय व्यंजन कहलाते हैं।'

grammar-d-p1: '«योग» का अर्थ «जुड़ना», «वाह» का अर्थ «जाने वाला»। «योगवाह» अर्थात् जुड़कर जाने वाला—अन्य अक्षरों के साथ ही उच्चरित होने वाला अक्षर।'

grammar-d-p2: 'योगवाह दो प्रकार के—1) अनुस्वार (ं) 2) विसर्ग (ः) उदा.: सिंह, दुःख'

