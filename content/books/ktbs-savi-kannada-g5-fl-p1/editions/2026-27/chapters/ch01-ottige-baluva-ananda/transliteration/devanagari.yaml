intro-1: '‘ओग्गट्टिनल्लि बलविदे’. एल्लरू ओट्टागि बाळिदरे एल्लरू सुखवागि इरबहुदु. नम्म नम्म नडुवे इरुव द्वेष असूयेगळन्नु मरेतु एल्लरन्नु प्रीतिसुत्ता बाळिदरे नम्म बदुकु सुखमयवागिरुत्तदे.'

story-n1: 'ओंदु हळ्ळि, अल्लि रैतनोब्बन होल इत्तु. अल्लि ओंदु बेविन मरवित्तु. हेगो एनो अदर केळगे ओंदु गुंडनेय कल्लु बंदु निंतुकोंडितु. मरद मेले कुळितुकोळ्ळुत्तिद्द हक्किगळ हिक्के कल्लिन मेले बिद्दु बिद्दु, आ कल्लु बेळ्ळगागि, विभूति बळिदंते काणिसुत्तित्तु. इदरिंदागि आ बिळिय कल्लु एल्लरिगू अम्मन कल्लिनंते काणिसुत्तित्तु. आद्दरिंद, बेविन मरवन्नु जन ‘अम्मन मर’ एंदु करेयुत्तिद्दरु. आ कल्लु बेविन मरद केळगिद्दुदरिंद अदक्के ‘अम्मन कल्लु’ एंब हेसरु रूढिगे बंदित्तु. हीगे ओंदरिंद इन्नोंदु हेसरु पडेदुकोंडु एरडू सुखवागिद्दवु. ‘अम्मन मर’, ‘अम्मन कल्लु’ एंदु ऊरिन जनगळु अवुगळ तंटेगे होगुत्तिरलिल्ल.'

story-n2: 'ओंदु सल, तन्निंद इन्नोंदु सुखवागिदे एंदु एरडक्कू जंब बंतु. बेविन मर “नानु अम्मन मर, नीनु नन्न केळगिरुवुदरिंद निन्नन्नु अम्मन कल्लु, एंदु जन करेयुत्तारे” एंदु हेळितु. अदक्के कल्लु “नानु अम्मन कल्लु, नन्न पक्कदल्लि नीनिरुवुदरिंद निन्नन्नु अम्मन मर एंदु करेयुत्तारे” एंदितु. हीगे एरडू जगळ माडिदवु. कोनेगे कल्लु कोपदिंद उरुळि उरुळि बेविन मरदिंद दूर होगि निंतितु. “नानिल्लदिद्दरे मरवन्नु कडिदुहाकुत्तारे” एंदु कल्लु, “नन्न केळगिरदिद्दरे कल्लन्नु ओडेदु हाकुत्तारे” एंदु मर-हीगे एरडू तम्मोळगे आलोचिसुत्तिद्दवु.'

story-n3: 'ओंदु दिन होलवन्नु उळलिक्के आ हळ्ळिय रैत तन्न मक्कळ जोते बंदनु. अम्मन कल्लु इल्लद आ बेविन मरवन्नु नोडि “इदन्नु नाळे कडिसि, नेगिलु, चक्र माडिसि” एंदु तन्न मक्कळिगे हेळिद. बेविन मरदिंद दूर बिद्दिद्द कल्लन्नु नोडि “ई कल्लन्नु नाळे कल्लु ओडेयुववरिंद ओडेसिदरे नेगिलन्नु कट्टि उळलु बरुत्तदे” एंदु तन्न मक्कळिगे हेळिद. इदन्नु केळि मर मत्तु कल्लु एरडू भयदिंद नडुगिदवु. नाविब्बरू ओब्बरिंद ओब्बरु दूरवागिद्दरे जनरु नम्मिब्बरन्नु नाशमाडुत्तारे. आद्दरिंद नाविब्बरू उळियुवुदिल्ल एंब तिळिवळिके मर मत्तु कल्लिगे बंदितु. रैत मत्तु रैतन मक्कळु अत्त होगुवुदन्ने कादिद्दु, कल्लु “बरला” एंदु बेविन मरवन्नु केळितु. मर “बेग बा” एंदु कल्लिगे हेळितु. तानु इन्नोंदरिंद सुखवागिरुवुदु एंदु ईग एरडक्कू तिळियितु. बेविन मर मत्तु कल्लु मत्ते स्नेहितरादवु.'

story-n4: 'मारनेय दिन मरकडियुववरु बंदु नोडिदरु. कल्लु मरद केळगे मोदलिनंते निंतित्तु. अवरिगे मर मत्तु कल्लिन बगेगे भय-भक्ति उंटायितु. “इदु अम्मन मर, कडियुवुदु बेड” एंदु होरटु होदरु. कल्लु ओडेयुववरु बंदु “इदु अम्मन कल्लु, ओडेयुवुदु बेड” एंदु अवरू होरटु होदरु.'

story-n5: 'बेविन मर मत्तु कल्लु कंटकदिंद पारादवु. ईग एरडू सह यार भयविल्लदे सुखवागिद्दवु.'

story-n6: 'हीगे एल्लरू ओट्टागि बाळिदरे, एल्लरू सुखवागि इरबहुदु.'

