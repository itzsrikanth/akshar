grammar-a-p1: 'कन्नडदल्लि ओट्टु 49 अक्षरगळिवे. इवुगळन्नु वर्णगळेंदु करेयुत्तारे. ई अक्षरगळ क्रमबद्ध जोडणेगे ‘वर्णमाले’ अथवा ‘अक्षरमाले’ एंदु हेसरु.'

grammar-a-p2: 'वर्णमालेयल्लि मूरु विधगळु अ) स्वराक्षरगळु आ) व्यंजनाक्षरगळु इ) योगवाहगळु'

grammar-b-p1: 'स्वतंत्रवागि उच्चरिसलागुव अक्षरगळु स्वराक्षरगळु. ओट्टु स्वराक्षरगळु 13.'

grammar-b-p2: 'स्वराक्षरगळल्लि एरडु विध.: 1) ह्रस्वस्वरगळु 2) दीर्घस्वरगळु'

grammar-b-p3: '1) ह्रस्वस्वर - ओंदु मात्रा कालदल्लि उच्चरिसलागुव (अ, इ, उ, ऋ, ए, ओ) अक्षरगळु ह्रस्वस्वरगळु.'

grammar-b-p4: '2) दीर्घस्वर - एरडु मात्रा कालदल्लि उच्चरिसलागुव (आ, ई, ऊ, ए, ऐ, ओ, औ) अक्षरगळु दीर्घस्वरगळु.'

grammar-c-p1: 'स्वरगळ सहायदिंद उच्चरिसलागुव अक्षरगळु व्यंजनाक्षरगळु. (उदा : क् + अ = क ; च् + अ = च) ओट्टु व्यंजनाक्षरगळु = 34'

grammar-c-p2: 'व्यंजनाक्षरगळल्लि एरडु विध : 1) वर्गीय व्यंजनगळु 2) अवर्गीय व्यंजनगळु'

grammar-c-p3: '1. वर्गीय व्यंजन कोष्टक. क् वर्ग: क् ख् ग् घ् ङ. च् वर्ग: च् छ् ज् झ् ञ. ट् वर्ग: ट् ठ् ड् ढ् ण्. त् वर्ग: त् थ् द् ध् न्. प् वर्ग: प् फ् ब् भ् म्. ओट्टु 25. इवु उत्पत्तियागुव स्थानगळिगे अनुगुणवागि वर्ग माडिरुवुदरिंद वर्गीय व्यंजनगळु.'

grammar-c-p4: 'अल्पप्राणाक्षरगळु = कडिमे उसिरिनिंद उच्चरिसलागुव व्यंजनगळु अल्पप्राणाक्षरगळु. उदा : क्, च्, ट्, त्, प्, ग्, ज्, ड्, द्, ब्.'

grammar-c-p5: 'महाप्राणाक्षरगळु = हेच्चु उसिरिनिंद उच्चरिसलागुव व्यंजनगळु महाप्राणाक्षरगळु. उदा : ख्, छ्, ठ्, थ्, फ्. घ्, झ्, ढ्, ध्, भ्.'

grammar-c-p6: 'अनुनासिकाक्षरगळु = मूगिन सहायदिंद उच्चरिसलागुव व्यंजनगळु अनुनासिकाक्षरगळु. उदा : ङ, ञ, ण्, न्, म्.'

grammar-c-p7: '2. अवर्गीय व्यंजनगळु. ‘य्’ कारदिंद ‘ळ्’ कारदवरेगिन 9 अक्षरगळु अवर्गीय व्यंजनगळु. उदा : य्, र्, ल्, व्, श्, ष्, स्, ह्, ळ्. इवु उत्पत्तियागुव स्थानगळु बेरेबेरेयागिरुवुदरिंद, इवुगळन्नु निर्दिष्टवाद वर्गगळल्लि सेरिसि हेळलु बरुवुदिल्लवाद्दरिंद इवन्नु अवर्गीय व्यंजनगळु एंदु करेयुवरु.'

grammar-d-p1: '‘योग’ एंदरे ‘कूडु, ‘वाह’ एंदरे होगुव एंदर्थ. ‘योगवाह'' एंदरे कूडिहोगुव (कूडिकोंडिरुव) अंदरे बेरे अक्षरगळ जोतेयल्लि मात्र उच्चरिसबहुदाद अक्षर एंदर्थ.'

grammar-d-p2: 'योगवाहगळल्लि एरडु विध: 1) अनुस्वार (ं) 2) विसर्ग (ः) उदा : सिंह, दुःख'

