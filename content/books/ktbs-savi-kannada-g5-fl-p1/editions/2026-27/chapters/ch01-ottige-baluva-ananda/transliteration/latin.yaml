grammar-a-p1: 'kannaḍadalli oṭṭu 49 akṣaragaḷive. ivugaḷannu varṇagaḷendu kareyuttāre. ī akṣaragaḷa kramabaddha jōḍaṇege ‘varṇamāle’ athavā ‘akṣaramāle’ endu hesaru.'

grammar-a-p2: 'varṇamāleyalli mūru vidhagaḷu a) svarākṣaragaḷu ā) vyañjanākṣaragaḷu i) yōgavāhagaḷu'

grammar-b-p1: 'svatantravāgi uccarisalāguva akṣaragaḷu svarākṣaragaḷu. oṭṭu svarākṣaragaḷu 13.'

grammar-b-p2: 'svarākṣaragaḷalli eraḍu vidha.: 1) hrasvasvaragaḷu 2) dīrghasvaragaḷu'

grammar-b-p3: '1) hrasvasvara - ondu mātrā kāladalli uccarisalāguva (a, i, u, r̥, e, o) akṣaragaḷu hrasvasvaragaḷu.'

grammar-b-p4: '2) dīrghasvara - eraḍu mātrā kāladalli uccarisalāguva (ā, ī, ū, ē, ai, ō, au) akṣaragaḷu dīrghasvaragaḷu.'

grammar-c-p1: 'svaragaḷa sahāyadinda uccarisalāguva akṣaragaḷu vyañjanākṣaragaḷu. (udā : k + a = ka ; c + a = ca) oṭṭu vyañjanākṣaragaḷu = 34'

grammar-c-p2: 'vyañjanākṣaragaḷalli eraḍu vidha : 1) vargīya vyañjanagaḷu 2) avargīya vyañjanagaḷu'

grammar-c-p3: '1. vargīya vyañjana kōṣṭaka. k varga: k kh g gh ṅa. c varga: c ch j jh ña. ṭ varga: ṭ ṭh ḍ ḍh ṇ. t varga: t th d dh n. p varga: p ph b bh m. oṭṭu 25. ivu utpattiyāguva sthānagaḷige anuguṇavāgi varga māḍiruvudarinda vargīya vyañjanagaḷu.'

grammar-c-p4: 'alpaprāṇākṣaragaḷu = kaḍime usirininda uccarisalāguva vyañjanagaḷu alpaprāṇākṣaragaḷu. udā : k, c, ṭ, t, p, g, j, ḍ, d, b.'

grammar-c-p5: 'mahāprāṇākṣaragaḷu = heccu usirininda uccarisalāguva vyañjanagaḷu mahāprāṇākṣaragaḷu. udā : kh, ch, ṭh, th, ph. gh, jh, ḍh, dh, bh.'

grammar-c-p6: 'anunāsikākṣaragaḷu = mūgina sahāyadinda uccarisalāguva vyañjanagaḷu anunāsikākṣaragaḷu. udā : ṅa, ña, ṇ, n, m.'

grammar-c-p7: '2. avargīya vyañjanagaḷu. ‘y’ kāradinda ‘ḷ’ kāradavaregina 9 akṣaragaḷu avargīya vyañjanagaḷu. udā : y, r, l, v, ś, ṣ, s, h, ḷ. ivu utpattiyāguva sthānagaḷu bērebēreyāgiruvudarinda, ivugaḷannu nirdiṣṭavāda vargagaḷalli sērisi hēḷalu baruvudillavāddarinda ivannu avargīya vyañjanagaḷu endu kareyuvaru.'

grammar-d-p1: '‘yōga’ endare ‘kūḍu, ‘vāha’ endare hōguva endartha. ‘yōgavāha'' endare kūḍihōguva (kūḍikoṇḍiruva) andare bēre akṣaragaḷa joteyalli mātra uccarisabahudāda akṣara endartha.'

grammar-d-p2: 'yōgavāhagaḷalli eraḍu vidha: 1) anusvāra (ṁ) 2) visarga (ḥ) udā : sinha, duḥkha'

