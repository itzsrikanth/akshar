intro-1: '‘oggaṭṭinalli balavide’. ellarū oṭṭāgi bāḷidare ellarū sukhavāgi irabahudu. namma namma naḍuve iruva dvēṣa asūyegaḷannu maretu ellarannu prītisuttā bāḷidare namma baduku sukhamayavāgiruttade.'

story-n1: 'ondu haḷḷi, alli raitanobbana hola ittu. alli ondu bēvina maravittu. hēgō ēnō adara keḷage ondu guṇḍaneya kallu bandu nintukoṇḍitu. marada mēle kuḷitukoḷḷuttidda hakkigaḷa hikke kallina mēle biddu biddu, ā kallu beḷḷagāgi, vibhūti baḷidante kāṇisuttittu. idarindāgi ā biḷiya kallu ellarigū ammana kallinante kāṇisuttittu. āddarinda, bēvina maravannu jana ‘ammana mara’ endu kareyuttiddaru. ā kallu bēvina marada keḷagiddudarinda adakke ‘ammana kallu’ emba hesaru rūḍhige bandittu. hīge ondarinda innondu hesaru paḍedukoṇḍu eraḍū sukhavāgiddavu. ‘ammana mara’, ‘ammana kallu’ endu ūrina janagaḷu avugaḷa taṇṭege hōguttiralilla.'

story-n2: 'ondu sala, tanninda innondu sukhavāgide endu eraḍakkū jamba bantu. bēvina mara “nānu ammana mara, nīnu nanna keḷagiruvudarinda ninnannu ammana kallu, endu jana kareyuttāre” endu hēḷitu. adakke kallu “nānu ammana kallu, nanna pakkadalli nīniruvudarinda ninnannu ammana mara endu kareyuttāre” enditu. hīge eraḍū jagaḷa māḍidavu. konege kallu kōpadinda uruḷi uruḷi bēvina maradinda dūra hōgi nintitu. “nānilladiddare maravannu kaḍiduhākuttāre” endu kallu, “nanna keḷagiradiddare kallannu oḍedu hākuttāre” endu mara-hīge eraḍū tammoḷage ālōcisuttiddavu.'

story-n3: 'ondu dina holavannu uḷalikke ā haḷḷiya raita tanna makkaḷa jote bandanu. ammana kallu illada ā bēvina maravannu nōḍi “idannu nāḷe kaḍisi, nēgilu, cakra māḍisi” endu tanna makkaḷige hēḷida. bēvina maradinda dūra biddidda kallannu nōḍi “ī kallannu nāḷe kallu oḍeyuvavarinda oḍesidare nēgilannu kaṭṭi uḷalu baruttade” endu tanna makkaḷige hēḷida. idannu kēḷi mara mattu kallu eraḍū bhayadinda naḍugidavu. nāvibbarū obbarinda obbaru dūravāgiddare janaru nammibbarannu nāśamāḍuttāre. āddarinda nāvibbarū uḷiyuvudilla emba tiḷivaḷike mara mattu kallige banditu. raita mattu raitana makkaḷu atta hōguvudannē kādiddu, kallu “baralā” endu bēvina maravannu kēḷitu. mara “bēga bā” endu kallige hēḷitu. tānu innondarinda sukhavāgiruvudu endu īga eraḍakkū tiḷiyitu. bēvina mara mattu kallu matte snēhitarādavu.'

story-n4: 'māraneya dina marakaḍiyuvavaru bandu nōḍidaru. kallu marada keḷage modalinante nintittu. avarige mara mattu kallina bagege bhaya-bhakti uṇṭāyitu. “idu ammana mara, kaḍiyuvudu bēḍa” endu horaṭu hōdaru. kallu oḍeyuvavaru bandu “idu ammana kallu, oḍeyuvudu bēḍa” endu avarū horaṭu hōdaru.'

story-n5: 'bēvina mara mattu kallu kaṇṭakadinda pārādavu. īga eraḍū saha yāra bhayavillade sukhavāgiddavu.'

story-n6: 'hīge ellarū oṭṭāgi bāḷidare, ellarū sukhavāgi irabahudu.'

