intro-1: 'jīvanadalli dēvarannu kāṇalu antaraṅgaśuddhi bahaḷa mukhya. anya cinteginta dēvarannu kāṇabēku emba cinte mukhya. jīvanadalli stuti-nindegaḷu bandāga manadalli kōpa māḍikoḷḷade samādhāniyāgiruvudu mukhya. mānavanu nirahaṅkāriyāgi nuḍige takka naḍeyuḷḷavarāgi, dānigaḷāgi iruvudu mukhya embudu illina āśayavāgide.'

poem-s1l1: 'kaḷabēḍa, kolabēḍa, husiya nuḍiyalu bēḍa,'

poem-s1l2: 'muniyabēḍa, anyarige asahyapaḍabēḍa,'

poem-s1l3: 'tanna baṇṇisabēḍa, idira haḷiyalu bēḍa,'

poem-s1l4: 'idē antaraṅgaśuddhi; idē bahiraṅgaśuddhi;'

poem-s1l5: 'idē namma kūḍala saṅgamadēvanolisuva pari.'

poem-s1l6: '- basavaṇṇa'

poem-s2l1: 'baḍatanakke umbuva cinte, uṇalādare uḍuva cinte,'

poem-s2l2: 'uḍalādare iḍuva cinte, iḍalādare heṇḍira cinte,'

poem-s2l3: 'heṇḍirādare makkaḷa cinte, makkaḷādare badukina cinte,'

poem-s2l4: 'badukādare kēḍina cinte, kēḍādare maraṇada cinte,'

poem-s2l5: 'intī halavu cinteyali ippavaranu kaṇḍenu.'

poem-s2l6: 'śivana cinteyaliddavarobbaranu kāṇenendāta'

poem-s2l7: 'namma ambigara cauḍayya nijaśaraṇa.'

poem-s2l8: '- ambigara cauḍayya'

poem-s3l1: 'beṭṭada mēlondu maneya māḍi,'

poem-s3l2: 'mr̥gagaḷigañjidaḍentayyā?'

poem-s3l3: 'samudrada taḍiyalondu maneya māḍi,'

poem-s3l4: 'noreteregaḷigañjidaḍentayyā?'

poem-s3l5: 'santeyoḷagondu maneya māḍi,'

poem-s3l6: 'śabdakke nācidaḍentayyā?'

poem-s3l7: 'cennamallikārjuna dēva kēḷayyā,'

poem-s3l8: 'lōkadoḷage huṭṭida baḷika stutinindegaḷu bandaḍe'

poem-s3l9: 'manadalli kōpava tāḷade samādhāniyāgirabēku.'

poem-s3l10: '- akkamahādēvi'

poem-s4l1: 'nuḍidare muttina hāradantirabēku.'

poem-s4l2: 'nuḍidare māṇikyada dīptiyantirabēku.'

poem-s4l3: 'nuḍidare sphaṭikada śalākeyantirabēku.'

poem-s4l4: 'nuḍidare liṅga mecci ahudahudenabēku.'

poem-s4l5: 'nuḍiyoḷagāgi naḍeyadiddare'

poem-s4l6: 'kūḍalasaṅgamadēvanentolivanayyā?'

poem-s4l7: '- basavaṇṇa'

poem-s5l1: 'āse embudu arasigallade śivabhaktariguṇṭe?'

poem-s5l2: 'rōṣavembudu yamana kiṅkararigallade ajātariguṇṭe?'

poem-s5l3: 'īsakki āse nimagēke? īśvaranoppa,'

poem-s5l4: 'mārayyapriya amarēśvaraliṅgakke dūra,'

poem-s5l5: 'nuccu tari, bēga naḍeyayyā.'

poem-s5l6: '- āydakki lakkamma'

author-intro-1: 'basavaṇṇa : 12nē śatamānada vacanakāraru. ivaru vijayapura jilleya basavanabāgēvāḍiyalli janisidaru. tande mādarasa, tāyi mādalāmbike. ivara aṅkitanāma kūḍalasaṅgamadēva.'

author-intro-2: 'ambigara cauḍayya : 12nē śatamānada vacanakāraru. ivaru hāvēri jilleya rāṇebennūru tāllūkina cauḍadānapuradalli janisidaru. ivara aṅkitanāma ambigara cauḍayya.'

author-intro-3: 'akkamahādēvi : 12nē śatamānada vacanakārti. śivamogga jilleya śikāripura tāllūkina uḍutaḍiyalli janisidaru. tande nirmalaśeṭṭi, tāyi sumati. ivara aṅkitanāma cennamallikārjuna.'

author-intro-4: 'āydakki lakkamma : 12nē śatamānada vacanakārti. rāyacūru jilleya amarēśvara ivara janmasthaḷa. ivara aṅkitanāma mārayyapriya amarēśvaraliṅga.'

