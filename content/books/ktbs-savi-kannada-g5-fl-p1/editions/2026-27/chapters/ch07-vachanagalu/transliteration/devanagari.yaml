intro-1: 'जीवनदल्लि देवरन्नु काणलु अंतरंगशुद्धि बहळ मुख्य. अन्य चिंतेगिंत देवरन्नु काणबेकु एंब चिंते मुख्य. जीवनदल्लि स्तुति-निंदेगळु बंदाग मनदल्लि कोप माडिकोळ्ळदे समाधानियागिरुवुदु मुख्य. मानवनु निरहंकारियागि नुडिगे तक्क नडेयुळ्ळवरागि, दानिगळागि इरुवुदु मुख्य एंबुदु इल्लिन आशयवागिदे.'

poem-s1l1: 'कळबेड, कोलबेड, हुसिय नुडियलु बेड,'

poem-s1l2: 'मुनियबेड, अन्यरिगे असह्यपडबेड,'

poem-s1l3: 'तन्न बण्णिसबेड, इदिर हळियलु बेड,'

poem-s1l4: 'इदे अंतरंगशुद्धि; इदे बहिरंगशुद्धि;'

poem-s1l5: 'इदे नम्म कूडल संगमदेवनोलिसुव परि.'

poem-s1l6: '- बसवण्ण'

poem-s2l1: 'बडतनक्के उंबुव चिंते, उणलादरे उडुव चिंते,'

poem-s2l2: 'उडलादरे इडुव चिंते, इडलादरे हेंडिर चिंते,'

poem-s2l3: 'हेंडिरादरे मक्कळ चिंते, मक्कळादरे बदुकिन चिंते,'

poem-s2l4: 'बदुकादरे केडिन चिंते, केडादरे मरणद चिंते,'

poem-s2l5: 'इंती हलवु चिंतेयलि इप्पवरनु कंडेनु.'

poem-s2l6: 'शिवन चिंतेयलिद्दवरोब्बरनु काणेनेंदात'

poem-s2l7: 'नम्म अंबिगर चौडय्य निजशरण.'

poem-s2l8: '- अंबिगर चौडय्य'

poem-s3l1: 'बेट्टद मेलोंदु मनेय माडि,'

poem-s3l2: 'मृगगळिगंजिदडेंतय्या?'

poem-s3l3: 'समुद्रद तडियलोंदु मनेय माडि,'

poem-s3l4: 'नोरेतेरेगळिगंजिदडेंतय्या?'

poem-s3l5: 'संतेयोळगोंदु मनेय माडि,'

poem-s3l6: 'शब्दक्के नाचिदडेंतय्या?'

poem-s3l7: 'चेन्नमल्लिकार्जुन देव केळय्या,'

poem-s3l8: 'लोकदोळगे हुट्टिद बळिक स्तुतिनिंदेगळु बंदडे'

poem-s3l9: 'मनदल्लि कोपव ताळदे समाधानियागिरबेकु.'

poem-s3l10: '- अक्कमहादेवि'

poem-s4l1: 'नुडिदरे मुत्तिन हारदंतिरबेकु.'

poem-s4l2: 'नुडिदरे माणिक्यद दीप्तियंतिरबेकु.'

poem-s4l3: 'नुडिदरे स्फटिकद शलाकेयंतिरबेकु.'

poem-s4l4: 'नुडिदरे लिंग मेच्चि अहुदहुदेनबेकु.'

poem-s4l5: 'नुडियोळगागि नडेयदिद्दरे'

poem-s4l6: 'कूडलसंगमदेवनेंतोलिवनय्या?'

poem-s4l7: '- बसवण्ण'

poem-s5l1: 'आसे एंबुदु अरसिगल्लदे शिवभक्तरिगुंटे?'

poem-s5l2: 'रोषवेंबुदु यमन किंकररिगल्लदे अजातरिगुंटे?'

poem-s5l3: 'ईसक्कि आसे निमगेके? ईश्वरनोप्प,'

poem-s5l4: 'मारय्यप्रिय अमरेश्वरलिंगक्के दूर,'

poem-s5l5: 'नुच्चु तरि, बेग नडेयय्या.'

poem-s5l6: '- आय्दक्कि लक्कम्म'

author-intro-1: 'बसवण्ण : 12ने शतमानद वचनकाररु. इवरु विजयपुर जिल्लेय बसवनबागेवाडियल्लि जनिसिदरु. तंदे मादरस, तायि मादलांबिके. इवर अंकितनाम कूडलसंगमदेव.'

author-intro-2: 'अंबिगर चौडय्य : 12ने शतमानद वचनकाररु. इवरु हावेरि जिल्लेय राणेबेन्नूरु ताल्लूकिन चौडदानपुरदल्लि जनिसिदरु. इवर अंकितनाम अंबिगर चौडय्य.'

author-intro-3: 'अक्कमहादेवि : 12ने शतमानद वचनकार्ति. शिवमोग्ग जिल्लेय शिकारिपुर ताल्लूकिन उडुतडियल्लि जनिसिदरु. तंदे निर्मलशेट्टि, तायि सुमति. इवर अंकितनाम चेन्नमल्लिकार्जुन.'

author-intro-4: 'आय्दक्कि लक्कम्म : 12ने शतमानद वचनकार्ति. रायचूरु जिल्लेय अमरेश्वर इवर जन्मस्थळ. इवर अंकितनाम मारय्यप्रिय अमरेश्वरलिंग.'

