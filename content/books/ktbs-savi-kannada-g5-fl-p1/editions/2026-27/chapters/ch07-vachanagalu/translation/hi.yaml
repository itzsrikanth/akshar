intro-1: 'जीवन में ईश्वर को देखने के लिए अंतरंग शुद्धि बहुत महत्वपूर्ण है। अन्य चिंताओं से अधिक ईश्वर को देखना चाहिए—यह चिंता मुख्य है। जीवन में स्तुति-निंदा आने पर मन में क्रोध न कर शांत रहना महत्वपूर्ण है। मनुष्य निरहंकारी होकर वचन के अनुरूप आचरण वाला और दानी बने—यही यहाँ का आशय है।'

poem-s1l1: 'चोरी मत करो, हत्या मत करो, झूठ मत बोलो,'

poem-s1l2: 'क्रोध मत करो, दूसरों से घृणा मत करो,'

poem-s1l3: 'अपनी प्रशंसा मत करो, सामने वाले की निंदा मत करो,'

poem-s1l4: 'यही अंतरंग शुद्धि; यही बहिरंग शुद्धि;'

poem-s1l5: 'यही हमारे कूडलसंगमदेव को प्रसन्न करने का मार्ग।'

poem-s1l6: '— बसवन्ना'

poem-s2l1: 'गरीबी में खाने की चिंता, खा लिया तो पहनने की चिंता,'

poem-s2l2: 'पहन लिया तो रखने की चिंता, रख लिया तो पत्नी की चिंता,'

poem-s2l3: 'पत्नी हो तो बच्चों की चिंता, बच्चे हों तो जीवन की चिंता,'

poem-s2l4: 'जीवन हो तो अनिष्ट की चिंता, अनिष्ट हो तो मृत्यु की चिंता,'

poem-s2l5: 'ऐसी अनेक चिंताओं में रहने वालों को मैंने देखा।'

poem-s2l6: 'शिव की चिंता में रहने वाला एक भी नहीं देखा, कहा उसने,'

poem-s2l7: 'हमारे अम्बिगर चौडय्या सच्चे शरण हैं।'

poem-s2l8: '— अम्बिगर चौडय्या'

poem-s3l1: 'पहाड़ पर घर बनाकर,'

poem-s3l2: 'यदि पशुओं से डरें तो क्या, हे स्वामी?'

poem-s3l3: 'समुद्र तट पर घर बनाकर,'

poem-s3l4: 'यदि झाग वाली लहरों से डरें तो क्या, हे स्वामी?'

poem-s3l5: 'बाजार में घर बनाकर,'

poem-s3l6: 'यदि शोर से लजाएँ तो क्या, हे स्वामी?'

poem-s3l7: 'सुनो, हे चेन्नमल्लिकार्जुन देव,'

poem-s3l8: 'संसार में जन्म लेने के बाद स्तुति-निंदा आएँ'

poem-s3l9: 'तो मन में क्रोध न पालकर शांत रहना चाहिए।'

poem-s3l10: '— अक्कमहादेवी'

poem-s4l1: 'बोलें तो मोतियों की माला जैसा होना चाहिए।'

poem-s4l2: 'बोलें तो माणिक्य की दीप्ति जैसा होना चाहिए।'

poem-s4l3: 'बोलें तो स्फटिक की छड़ जैसा होना चाहिए।'

poem-s4l4: 'बोलें तो लिंग प्रसन्न होकर हाँ-हाँ कहे।'

poem-s4l5: 'यदि वचन के अनुसार आचरण न हो'

poem-s4l6: 'तो कूडलसंगमदेव कैसे प्रसन्न होंगे, हे स्वामी?'

poem-s4l7: '— बसवन्ना'

poem-s5l1: 'आशा क्या राजाओं के सिवा शिवभक्तों को भी है?'

poem-s5l2: 'रोष क्या यम के किंकरों के सिवा अजातों को भी है?'

poem-s5l3: 'आय्दक्कि, तुम्हें आशा क्यों? ईश्वर सहमत हो'

poem-s5l4: 'तो मारय्यप्रिय अमरेश्वर लिंग से दूर हो,'

poem-s5l5: 'टूटे चावल लाओ; जल्दी चलो, हे स्वामी।'

poem-s5l6: '— आय्दक्कि लक्कम्मा'

author-intro-1: 'बसवन्ना : 12वीं शताब्दी के वचनकार। विजयपुर जिले के बसवनबागेवाड़ी में जन्म। पिता मादरसा, माता मादलांबिके। अंकित नाम कूडलसंगमदेव।'

author-intro-2: 'अम्बिगर चौडय्या : 12वीं शताब्दी के वचनकार। हावेरी जिले के राणेबेन्नूर तालुक के चौडदानपुर में जन्म। अंकित नाम अम्बिगर चौडय्या।'

author-intro-3: 'अक्कमहादेवी : 12वीं शताब्दी की वचनकार। शिवमोग्गा जिले के शिकारिपुर तालुक के उडुतडि में जन्म। पिता निर्मलशेट्टी, माता सुमति। अंकित नाम चेन्नमल्लिकार्जुन।'

author-intro-4: 'आय्दक्कि लक्कम्मा : 12वीं शताब्दी की वचनकार। रायचूर जिले का अमरेश्वर जन्मस्थान। अंकित नाम मारय्यप्रिय अमरेश्वर लिंग।'

