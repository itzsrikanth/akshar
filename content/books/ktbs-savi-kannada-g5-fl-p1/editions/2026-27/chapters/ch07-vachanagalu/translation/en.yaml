intro-1: 'To see God in life, purity of the inner self is very important. The thought of seeing God matters more than other worries. When praise and blame come in life, it is important to stay calm without anger in the mind. That humans should be free of ego, match speech with conduct, and be generous—this is the aim here.'

poem-s1l1: 'Do not steal, do not kill, do not speak falsehood,'

poem-s1l2: 'Do not get angry, do not feel disgust toward others,'

poem-s1l3: 'Do not praise yourself, do not abuse the other,'

poem-s1l4: 'This alone is inner purity; this alone is outer purity;'

poem-s1l5: 'This alone is the way to please our Kudalasangama Deva.'

poem-s1l6: '— Basavanna'

poem-s2l1: 'For poverty, worry of food; if fed, worry of clothes,'

poem-s2l2: 'If clothed, worry of storing; if stored, worry of wife,'

poem-s2l3: 'If wife, worry of children; if children, worry of life,'

poem-s2l4: 'If life, worry of harm; if harm, worry of death,'

poem-s2l5: 'I have seen people in so many such worries.'

poem-s2l6: 'I have not seen even one who stayed in thought of Shiva, said he,'

poem-s2l7: 'Our boatman Chaudayya is a true sharana.'

poem-s2l8: '— Ambiga Chaudayya'

poem-s3l1: 'If you build a house on a hill,'

poem-s3l2: 'and fear the beasts—then what, O Lord?'

poem-s3l3: 'If you build a house by the sea shore,'

poem-s3l4: 'and fear the foaming waves—then what, O Lord?'

poem-s3l5: 'If you build a house in the market,'

poem-s3l6: 'and feel shy of noise—then what, O Lord?'

poem-s3l7: 'Listen, O Chennamallikarjuna Deva,'

poem-s3l8: 'After being born in the world, when praise and blame come,'

poem-s3l9: 'one must stay calm without harbouring anger in the mind.'

poem-s3l10: '— Akkamahadevi'

poem-s4l1: 'When one speaks, it should be like a pearl necklace.'

poem-s4l2: 'When one speaks, it should be like the glow of a ruby.'

poem-s4l3: 'When one speaks, it should be like a crystal rod.'

poem-s4l4: 'When one speaks, the Linga should approve saying “yes, yes.”'

poem-s4l5: 'If one does not act according to one’s speech,'

poem-s4l6: 'how will Kudalasangama Deva be pleased, O Lord?'

poem-s4l7: '— Basavanna'

poem-s5l1: 'Is desire only for kings, not for Shiva’s devotees?'

poem-s5l2: 'Is rage only for Yama’s servants, not for the unborn (egoless)?'

poem-s5l3: 'Aydakki, why desire for you? If Ishwara consents,'

poem-s5l4: 'you stay far from Marayya’s beloved Amareshwara Linga,'

poem-s5l5: 'Bring broken rice; walk quickly, O Lord.'

poem-s5l6: '— Aydakki Lakkamma'

author-intro-1: 'Basavanna: A 12th-century vachana poet. Born in Basavan Bagewadi of Vijayapura district. Father Madarasa, mother Madalambike. His signature name is Kudalasangama Deva.'

author-intro-2: 'Ambiga Chaudayya: A 12th-century vachana poet. Born in Chaudadanapura of Ranebennur taluk, Haveri district. His signature name is Ambiga Chaudayya.'

author-intro-3: 'Akkamahadevi: A 12th-century vachana poet. Born in Udutadi of Shikaripur taluk, Shivamogga district. Father Nirmalashetti, mother Sumati. Her signature name is Chennamallikarjuna.'

author-intro-4: 'Aydakki Lakkamma: A 12th-century vachana poet. Amareshwara in Raichur district is her birthplace. Her signature name is Marayyapriya Amareshwara Linga.'

