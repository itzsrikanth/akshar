  - id: ex-a-q1
    type: question
    exercise: A
    text: ಬಸವಣ್ಣನವರ ಪ್ರಕಾರ ಅಂತರಂಗ ಬಹಿರಂಗ ಶುದ್ಧಿ ಯಾವುದು?

  - id: ex-a-q2
    type: question
    exercise: A
    text: ಅಂಬಿಗರ ಚೌಡಯ್ಯನವರ ಪ್ರಕಾರ ನಿಜಶರಣ ಯಾರು?

  - id: ex-a-q3
    type: question
    exercise: A
    text: ಬೆಟ್ಟದ ಮೇಲೆ ಮನೆಮಾಡಿ ಯಾವುದಕ್ಕೆ ಅಂಜಬಾರದು?

  - id: ex-a-q4
    type: question
    exercise: A
    text: ನಮ್ಮ ನುಡಿ ಹೇಗಿರಬೇಕು?

  - id: ex-a-q5
    type: question
    exercise: A
    text: ಆಸೆ ಎಂಬುದು ಯಾರಿಗೆ ಇರಬೇಕು?

  - id: ex-b-q1
    type: question
    exercise: B
    text: ಕೂಡಲಸಂಗಮದೇವನನ್ನು ಒಲಿಸುವ ಬಗೆ ಹೇಗೆ?

  - id: ex-b-q2
    type: question
    exercise: B
    text: ಅಂಬಿಗರ ಚೌಡಯ್ಯನವರು ಯಾವ ಯಾವ ಚಿಂತೆಯಲ್ಲಿರುವವರನ್ನು ಕಂಡಿದ್ದಾರೆ?

  - id: ex-b-q3
    type: question
    exercise: B
    text: ಅಕ್ಕಮಹಾದೇವಿಯವರ ಪ್ರಕಾರ ನಾವು ಸಮಾಧಾನಿಯಾಗಿರಬೇಕಾದದ್ದು ಯಾವಾಗ?

  - id: ex-b-q4
    type: question
    exercise: B
    text: ಕೂಡಲಸಂಗಮದೇವನು ಯಾವಾಗ ಒಲಿಯುವುದಿಲ್ಲ?

  - id: ex-b-q5
    type: question
    exercise: B
    text: ಆಯ್ದಕ್ಕಿ ಲಕ್ಕಮ್ಮ ಮಾರಯ್ಯನಿಗೆ ಏನೆಂದು ಹೇಳಿದಳು?

  - id: ex-c-q1
