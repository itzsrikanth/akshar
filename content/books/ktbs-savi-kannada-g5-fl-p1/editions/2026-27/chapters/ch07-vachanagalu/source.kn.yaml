  language-exercise-B: ಇ. ಶುಭನುಡಿ

segments:
  - id: intro-1
    type: prose
    section: intro
    text: ಜೀವನದಲ್ಲಿ ದೇವರನ್ನು ಕಾಣಲು ಅಂತರಂಗಶುದ್ಧಿ ಬಹಳ ಮುಖ್ಯ. ಅನ್ಯ ಚಿಂತೆಗಿಂತ ದೇವರನ್ನು ಕಾಣಬೇಕು ಎಂಬ ಚಿಂತೆ ಮುಖ್ಯ. ಜೀವನದಲ್ಲಿ ಸ್ತುತಿ-ನಿಂದೆಗಳು ಬಂದಾಗ ಮನದಲ್ಲಿ ಕೋಪ ಮಾಡಿಕೊಳ್ಳದೆ ಸಮಾಧಾನಿಯಾಗಿರುವುದು ಮುಖ್ಯ. ಮಾನವನು ನಿರಹಂಕಾರಿಯಾಗಿ ನುಡಿಗೆ ತಕ್ಕ ನಡೆಯುಳ್ಳವರಾಗಿ, ದಾನಿಗಳಾಗಿ ಇರುವುದು ಮುಖ್ಯ ಎಂಬುದು ಇಲ್ಲಿನ ಆಶಯವಾಗಿದೆ.

  - id: poem-s1l1
    type: poem_line
    stanza: 1
    text: ಕಳಬೇಡ, ಕೊಲಬೇಡ, ಹುಸಿಯ ನುಡಿಯಲು ಬೇಡ,

  - id: poem-s1l2
    type: poem_line
    stanza: 1
    text: ಮುನಿಯಬೇಡ, ಅನ್ಯರಿಗೆ ಅಸಹ್ಯಪಡಬೇಡ,

  - id: poem-s1l3
    type: poem_line
    stanza: 1
    text: ತನ್ನ ಬಣ್ಣಿಸಬೇಡ, ಇದಿರ ಹಳಿಯಲು ಬೇಡ,

  - id: poem-s1l4
    type: poem_line
    stanza: 1
    text: ಇದೇ ಅಂತರಂಗಶುದ್ಧಿ; ಇದೇ ಬಹಿರಂಗಶುದ್ಧಿ;

  - id: poem-s1l5
    type: poem_line
    stanza: 1
    text: ಇದೇ ನಮ್ಮ ಕೂಡಲ ಸಂಗಮದೇವನೊಲಿಸುವ ಪರಿ.

  - id: poem-s1l6
    type: poem_line
    stanza: 1
    text: "- ಬಸವಣ್ಣ"

  - id: poem-s2l1
    type: poem_line
    stanza: 2
    text: ಬಡತನಕ್ಕೆ ಉಂಬುವ ಚಿಂತೆ, ಉಣಲಾದರೆ ಉಡುವ ಚಿಂತೆ,

  - id: poem-s2l2
    type: poem_line
    stanza: 2
    text: ಉಡಲಾದರೆ ಇಡುವ ಚಿಂತೆ, ಇಡಲಾದರೆ ಹೆಂಡಿರ ಚಿಂತೆ,

  - id: poem-s2l3
    type: poem_line
    stanza: 2
    text: ಹೆಂಡಿರಾದರೆ ಮಕ್ಕಳ ಚಿಂತೆ, ಮಕ್ಕಳಾದರೆ ಬದುಕಿನ ಚಿಂತೆ,

  - id: poem-s2l4
    type: poem_line
    stanza: 2
    text: ಬದುಕಾದರೆ ಕೇಡಿನ ಚಿಂತೆ, ಕೇಡಾದರೆ ಮರಣದ ಚಿಂತೆ,

  - id: poem-s2l5
    type: poem_line
    stanza: 2
    text: ಇಂತೀ ಹಲವು ಚಿಂತೆಯಲಿ ಇಪ್ಪವರನು ಕಂಡೆನು.

  - id: poem-s2l6
    type: poem_line
    stanza: 2
    text: ಶಿವನ ಚಿಂತೆಯಲಿದ್ದವರೊಬ್ಬರನು ಕಾಣೆನೆಂದಾತ

  - id: poem-s2l7
    type: poem_line
    stanza: 2
    text: ನಮ್ಮ ಅಂಬಿಗರ ಚೌಡಯ್ಯ ನಿಜಶರಣ.

  - id: poem-s2l8
    type: poem_line
    stanza: 2
    text: "- ಅಂಬಿಗರ ಚೌಡಯ್ಯ"

  - id: poem-s3l1
    type: poem_line
    stanza: 3
    text: ಬೆಟ್ಟದ ಮೇಲೊಂದು ಮನೆಯ ಮಾಡಿ,

  - id: poem-s3l2
    type: poem_line
    stanza: 3
    text: ಮೃಗಗಳಿಗಂಜಿದಡೆಂತಯ್ಯಾ?

  - id: poem-s3l3
    type: poem_line
    stanza: 3
    text: ಸಮುದ್ರದ ತಡಿಯಲೊಂದು ಮನೆಯ ಮಾಡಿ,

  - id: poem-s3l4
    type: poem_line
    stanza: 3
    text: ನೊರೆತೆರೆಗಳಿಗಂಜಿದಡೆಂತಯ್ಯಾ?

  - id: poem-s3l5
    type: poem_line
    stanza: 3
    text: ಸಂತೆಯೊಳಗೊಂದು ಮನೆಯ ಮಾಡಿ,

  - id: poem-s3l6
    type: poem_line
    stanza: 3
    text: ಶಬ್ದಕ್ಕೆ ನಾಚಿದಡೆಂತಯ್ಯಾ?

  - id: poem-s3l7
    type: poem_line
    stanza: 3
    text: ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ದೇವ ಕೇಳಯ್ಯಾ,

  - id: poem-s3l8
    type: poem_line
    stanza: 3
    text: ಲೋಕದೊಳಗೆ ಹುಟ್ಟಿದ ಬಳಿಕ ಸ್ತುತಿನಿಂದೆಗಳು ಬಂದಡೆ

  - id: poem-s3l9
    type: poem_line
    stanza: 3
    text: ಮನದಲ್ಲಿ ಕೋಪವ ತಾಳದೆ ಸಮಾಧಾನಿಯಾಗಿರಬೇಕು.

  - id: poem-s3l10
    type: poem_line
    stanza: 3
    text: "- ಅಕ್ಕಮಹಾದೇವಿ"

  - id: poem-s4l1
    type: poem_line
    stanza: 4
    text: ನುಡಿದರೆ ಮುತ್ತಿನ ಹಾರದಂತಿರಬೇಕು.

  - id: poem-s4l2
    type: poem_line
    stanza: 4
    text: ನುಡಿದರೆ ಮಾಣಿಕ್ಯದ ದೀಪ್ತಿಯಂತಿರಬೇಕು.

  - id: poem-s4l3
    type: poem_line
    stanza: 4
    text: ನುಡಿದರೆ ಸ್ಫಟಿಕದ ಶಲಾಕೆಯಂತಿರಬೇಕು.

  - id: poem-s4l4
    type: poem_line
    stanza: 4
    text: ನುಡಿದರೆ ಲಿಂಗ ಮೆಚ್ಚಿ ಅಹುದಹುದೆನಬೇಕು.

  - id: poem-s4l5
    type: poem_line
    stanza: 4
    text: ನುಡಿಯೊಳಗಾಗಿ ನಡೆಯದಿದ್ದರೆ

  - id: poem-s4l6
    type: poem_line
    stanza: 4
    text: ಕೂಡಲಸಂಗಮದೇವನೆಂತೊಲಿವನಯ್ಯಾ?

  - id: poem-s4l7
    type: poem_line
    stanza: 4
    text: "- ಬಸವಣ್ಣ"

  - id: poem-s5l1
    type: poem_line
    stanza: 5
    text: ಆಸೆ ಎಂಬುದು ಅರಸಿಗಲ್ಲದೆ ಶಿವಭಕ್ತರಿಗುಂಟೆ?

  - id: poem-s5l2
    type: poem_line
    stanza: 5
    text: ರೋಷವೆಂಬುದು ಯಮನ ಕಿಂಕರರಿಗಲ್ಲದೆ ಅಜಾತರಿಗುಂಟೆ?

  - id: poem-s5l3
    type: poem_line
    stanza: 5
    text: ಈಸಕ್ಕಿ ಆಸೆ ನಿಮಗೇಕೆ? ಈಶ್ವರನೊಪ್ಪ,

  - id: poem-s5l4
    type: poem_line
    stanza: 5
    text: ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವರಲಿಂಗಕ್ಕೆ ದೂರ,

  - id: poem-s5l5
    type: poem_line
    stanza: 5
    text: ನುಚ್ಚು ತರಿ, ಬೇಗ ನಡೆಯಯ್ಯಾ.

  - id: poem-s5l6
    type: poem_line
    stanza: 5
    text: "- ಆಯ್ದಕ್ಕಿ ಲಕ್ಕಮ್ಮ"

  - id: author-intro-1
    type: prose
    section: author_intro
    text: "ಬಸವಣ್ಣ : 12ನೇ ಶತಮಾನದ ವಚನಕಾರರು. ಇವರು ವಿಜಯಪುರ ಜಿಲ್ಲೆಯ ಬಸವನಬಾಗೇವಾಡಿಯಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಮಾದರಸ, ತಾಯಿ ಮಾದಲಾಂಬಿಕೆ. ಇವರ ಅಂಕಿತನಾಮ ಕೂಡಲಸಂಗಮದೇವ."

  - id: author-intro-2
    type: prose
    section: author_intro
    text: "ಅಂಬಿಗರ ಚೌಡಯ್ಯ : 12ನೇ ಶತಮಾನದ ವಚನಕಾರರು. ಇವರು ಹಾವೇರಿ ಜಿಲ್ಲೆಯ ರಾಣೆಬೆನ್ನೂರು ತಾಲ್ಲೂಕಿನ ಚೌಡದಾನಪುರದಲ್ಲಿ ಜನಿಸಿದರು. ಇವರ ಅಂಕಿತನಾಮ ಅಂಬಿಗರ ಚೌಡಯ್ಯ."

  - id: author-intro-3
    type: prose
    section: author_intro
    text: "ಅಕ್ಕಮಹಾದೇವಿ : 12ನೇ ಶತಮಾನದ ವಚನಕಾರ್ತಿ. ಶಿವಮೊಗ್ಗ ಜಿಲ್ಲೆಯ ಶಿಕಾರಿಪುರ ತಾಲ್ಲೂಕಿನ ಉಡುತಡಿಯಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ನಿರ್ಮಲಶೆಟ್ಟಿ, ತಾಯಿ ಸುಮತಿ. ಇವರ ಅಂಕಿತನಾಮ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ."

  - id: author-intro-4
    type: prose
    section: author_intro
    text: "ಆಯ್ದಕ್ಕಿ ಲಕ್ಕಮ್ಮ : 12ನೇ ಶತಮಾನದ ವಚನಕಾರ್ತಿ. ರಾಯಚೂರು ಜಿಲ್ಲೆಯ ಅಮರೇಶ್ವರ ಇವರ ಜನ್ಮಸ್ಥಳ. ಇವರ ಅಂಕಿತನಾಮ ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವರಲಿಂಗ."

