labels:
  intro: ಪ್ರವೇಶ
  author_intro: ಕೃತಿಕಾರರ ಪರಿಚಯ
  vocab: ಪದಗಳ ಅರ್ಥ
  exercise-A: ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-B: ಆ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು-ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-C: ಇ. ಯಾರು, ಯಾರಿಗೆ ಹೇಳಿದರು?
  exercise-D: ಈ. ಹೊಂದಿಸಿ ಬರೆಯಿರಿ.
  exercise-E: ಉ. ಬಿಟ್ಟ ಸ್ಥಳಗಳನ್ನು ತುಂಬಿರಿ.
  grammar: ವ್ಯಾಕರಣ ಮಾಹಿತಿ
  grammar-A: ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ.
