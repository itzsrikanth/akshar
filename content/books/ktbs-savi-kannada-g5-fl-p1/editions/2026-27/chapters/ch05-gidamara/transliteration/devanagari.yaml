intro-1: 'नम्म कैयल्लिरुव ऐदु बेरळुगळू ओंदे रीतियिल्ल. प्रतियोंदु बेरळन्नु अदरदे आद कार्यगळिगे नावु बळसुत्तेवे. एनन्नादरू हिडियबेकादरे ऐदू बेरळुगळन्नु ओट्टागि बळसुत्तेवे. बेरळिन आकार, स्वरूप नम्म गमनक्के बरुवुदिल्ल. ओंदु मर कायन्नु, हण्णन्नु, नेरळन्नु नीडबहुदु. हागेये, हलवु हक्किगळु गूडुकट्टलु अवकाश माडबल्लदु. मनुष्यराद नावू सहकारियागि बदुकिदरे एष्टु चंद अल्लवे? प्रकृतियन्नु अनुसरिसुवुदरिंद आगुव प्रयोजन अपार.'

