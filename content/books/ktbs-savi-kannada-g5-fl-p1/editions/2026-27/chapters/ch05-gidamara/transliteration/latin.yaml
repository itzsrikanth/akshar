intro-1: 'namma kaiyalliruva aidu beraḷugaḷū ondē rītiyilla. pratiyondu beraḷannu adaradē āda kāryagaḷige nāvu baḷasuttēve. ēnannādarū hiḍiyabēkādare aidū beraḷugaḷannu oṭṭāgi baḷasuttēve. beraḷina ākāra, svarūpa namma gamanakke baruvudilla. ondu mara kāyannu, haṇṇannu, neraḷannu nīḍabahudu. hāgeyē, halavu hakkigaḷu gūḍukaṭṭalu avakāśa māḍaballadu. manuṣyarāda nāvū sahakāriyāgi badukidare eṣṭu canda allave? prakr̥tiyannu anusarisuvudarinda āguva prayōjana apāra.'

