intro-1: 'हमारे हाथ की पाँच उँगलियाँ एक जैसी नहीं। प्रत्येक उँगली को हम उसके अपने काम के लिए उपयोग करते हैं। कुछ पकड़ना हो तो पाँचों को साथ उपयोग करते हैं। उँगली का आकार-स्वरूप ध्यान में नहीं आता। एक पेड़ फल, छाया दे सकता है। वैसे ही कई पक्षियों को घोंसला बनाने का अवसर दे सकता है। मनुष्य होकर हम भी सहयोग से जिएँ तो कितना सुंदर, है न? प्रकृति का अनुसरण करने से लाभ अपार है।'

