intro-1: 'The five fingers on our hand are not all alike. We use each finger for its own work. To grasp something we use all five together. We do not notice the shape and form of a finger. A tree may give fruit, shade. Likewise it can give many birds a place to nest. If we humans also live cooperatively, how lovely is that? The benefit of following nature is immense.'

