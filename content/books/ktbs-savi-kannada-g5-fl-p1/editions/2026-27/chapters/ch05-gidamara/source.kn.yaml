  - id: ex-c-q1
    type: fill_blank
    exercise: C
    text: ಬೊಡ್ಡೆ ಕರಿದು ______________\n______________ ತರತರ\nಎಂಥ ಸೊಗಸು ______________\n______________ ಗಿಡ ಮರ

  - id: ex-d-q1
    type: question
    exercise: D
    text: "‘ಅ’\n1. ದಿವ್ಯ\n2. ಹಾಳು\n3. ಕಡಲುಕ್ಕುವ\n\n‘ಬ’\nಚೇತನ\nಮೌನ\nಕೊಂಪೆ"

  - id: grammar-p1
    type: prose
    section: grammar
    text: "ಲಿಂಗಗಳು\nಪುರುಷ, ಸ್ತ್ರೀ ಮತ್ತು ಇತರ ವಸ್ತುಗಳನ್ನು ಪ್ರತ್ಯೇಕಿಸಿ ಹೇಳುವುದಕ್ಕೆ ಲಿಂಗ ಎನ್ನುತ್ತಾರೆ."

  - id: grammar-p2
    type: prose
    section: grammar
    text: "ಲಿಂಗಗಳಲ್ಲಿ ಮೂರು ವಿಧ.\n1. ಪುಲ್ಲಿಂಗ\n2. ಸ್ತ್ರೀಲಿಂಗ\n3. ನಪುಂಸಕಲಿಂಗ"

  - id: grammar-p3
    type: prose
    section: grammar
    text: "1. ಪುಲ್ಲಿಂಗ\nಪುರುಷ ವಾಚಕ ಶಬ್ದಗಳೆಲ್ಲವೂ ಪುಲ್ಲಿಂಗಗಳು. ಅಂದರೆ ಗಂಡಸರನ್ನು ಕುರಿತು ಹೇಳುವ ಪದಗಳು ಪುಲ್ಲಿಂಗ.\nಉದಾ: ರಾಮ, ಅರಸ, ಹುಡುಗ, ತಂದೆ, ಅಣ್ಣ ಇತ್ಯಾದಿ."

  - id: grammar-p4
    type: prose
    section: grammar
    text: "2. ಸ್ತ್ರೀಲಿಂಗ\nಸ್ತ್ರೀ ವಾಚಕ ಶಬ್ದಗಳೆಲ್ಲವೂ ಸ್ತ್ರೀಲಿಂಗಗಳು. ಅಂದರೆ ಹೆಂಗಸರನ್ನು ಕುರಿತು ಹೇಳುವ ಪದಗಳು ಸ್ತ್ರೀಲಿಂಗ.\nಉದಾ: ಸೀತೆ, ಅರಸಿ, ಹುಡುಗಿ, ತಾಯಿ, ಅಕ್ಕ ಇತ್ಯಾದಿ."

  - id: grammar-p5
    type: prose
    section: grammar
    text: "3. ನಪುಂಸಕಲಿಂಗ\nಪುರುಷ ವಾಚಕ ಮತ್ತು ಸ್ತ್ರೀ ವಾಚಕ ಶಬ್ದಗಳನ್ನು ಬಿಟ್ಟು ಉಳಿದೆಲ್ಲ ಶಬ್ದಗಳು ನಪುಂಸಕಲಿಂಗಗಳು. (ಪ್ರಾಣಿ, ಪಕ್ಷಿ, ಮರ, ಗಿಡ, ವಸ್ತು ಇತ್ಯಾದಿ)\nಉದಾ: ಹಸು, ಗಿಳಿ, ಮರ, ಕಲ್ಲು, ಮನೆ ಇತ್ಯಾದಿ."

  - id: grammar-a-q1
