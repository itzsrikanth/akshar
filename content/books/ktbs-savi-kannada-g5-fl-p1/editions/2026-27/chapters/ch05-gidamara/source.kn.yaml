    type: fill_blank
    exercise: language-exercise-B
    text: 1. ಕಾ__________ವೇರಿ ಕೊ__________ಡಗಿನ ಭಾಗಮಂಡಲದ ಬೆಟ್ಟದ ಬಳಿ ಸಣ್ಣ__________ರಿದಾಗಿ ಹುಟ್ಟಿ ಕೆ__________ಳಗೆ ಹರಿಯುತ್ತದೆ. (ಕ/ಕಾ/ಕಿ/ಕೀ/ಕೆ/ಕೊ)

