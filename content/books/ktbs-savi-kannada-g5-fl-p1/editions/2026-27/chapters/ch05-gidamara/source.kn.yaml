    stanza: 2
    text: ಕಡಲುಕ್ಕುವ ಚೇತನ

  - id: poem-s3l1
    type: poem_line
    stanza: 3
    text: ಮನುಷ್ಯನಲ್ಲಿ ಮಾತು ಉಂಟು

  - id: poem-s3l2
    type: poem_line
    stanza: 3
    text: ಮಾತಿನಂತೆ ಇಲ್ಲ ಮನ

  - id: poem-s3l3
    type: poem_line
    stanza: 3
    text: ಲಿಂಗ ವರ್ಣ ಜಾತಿ ಧರ್ಮ

  - id: poem-s3l4
    type: poem_line
    stanza: 3
    text: ಹಾಳು ಕೊಂಪೆ ಇವನ ಮನ

  - id: poem-s4l1
    type: poem_line
    stanza: 4
    text: ಜಾತಿ-ಗೀತಿ, ಲಿಂಗ-ಧರ್ಮ

  - id: poem-s4l2
    type: poem_line
    stanza: 4
    text: ಮೀರಿ ಬೆಳೆದ ಗಿಡಮರ

  - id: poem-s4l3
    type: poem_line
    stanza: 4
    text: ಅವನು ಇವಳು ಅದು ಇದು

  - id: poem-s4l4
    type: poem_line
    stanza: 4
    text: ಎಣಿಸುತಿಲ್ಲ ಒಂದು ದಿನ

  - id: poem-s5l1
