  language-exercise: ಭಾಷಾಭ್ಯಾಸ
  language-exercise-A: ಅ. ಕೆಳಗೆ ನೀಡಿರುವ ವಾಕ್ಯಗಳನ್ನು ಆವರಣದಲ್ಲಿ ನೀಡಿರುವ ಪದಗಳಲ್ಲಿ ಸೂಕ್ತವಾದುದನ್ನು ಆರಿಸಿ ವಾಕ್ಯ ಪೂರ್ಣಗೊಳಿಸಿ.
  language-exercise-B: ಆ. ಕೆಳಗೆ ನೀಡಿರುವ ವಾಕ್ಯಗಳನ್ನು ಆವರಣದಲ್ಲಿ ನೀಡಿರುವ ಅಕ್ಷರಗಳಲ್ಲಿ ಸೂಕ್ತವಾದುದನ್ನು ಆರಿಸಿ ಪೂರ್ಣಗೊಳಿಸಿ.

segments:
  - id: intro-1
    type: prose
    section: intro
    text: ನಮ್ಮ ಕೈಯಲ್ಲಿರುವ ಐದು ಬೆರಳುಗಳೂ ಒಂದೇ ರೀತಿಯಿಲ್ಲ. ಪ್ರತಿಯೊಂದು ಬೆರಳನ್ನು ಅದರದೇ ಆದ ಕಾರ್ಯಗಳಿಗೆ ನಾವು ಬಳಸುತ್ತೇವೆ. ಏನನ್ನಾದರೂ ಹಿಡಿಯಬೇಕಾದರೆ ಐದೂ ಬೆರಳುಗಳನ್ನು ಒಟ್ಟಾಗಿ ಬಳಸುತ್ತೇವೆ. ಬೆರಳಿನ ಆಕಾರ, ಸ್ವರೂಪ ನಮ್ಮ ಗಮನಕ್ಕೆ ಬರುವುದಿಲ್ಲ. ಒಂದು ಮರ ಕಾಯನ್ನು, ಹಣ್ಣನ್ನು, ನೆರಳನ್ನು ನೀಡಬಹುದು. ಹಾಗೆಯೇ, ಹಲವು ಹಕ್ಕಿಗಳು ಗೂಡುಕಟ್ಟಲು ಅವಕಾಶ ಮಾಡಬಲ್ಲದು. ಮನುಷ್ಯರಾದ ನಾವೂ ಸಹಕಾರಿಯಾಗಿ ಬದುಕಿದರೆ ಎಷ್ಟು ಚಂದ ಅಲ್ಲವೆ? ಪ್ರಕೃತಿಯನ್ನು ಅನುಸರಿಸುವುದರಿಂದ ಆಗುವ ಪ್ರಯೋಜನ ಅಪಾರ.

