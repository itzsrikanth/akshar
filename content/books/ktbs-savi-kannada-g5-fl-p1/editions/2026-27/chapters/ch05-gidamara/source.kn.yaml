  grammar-A: ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ.
  grammar-B: ಆ. ಲಿಂಗ ಬದಲಿಸಿ ಬರೆಯಿರಿ.
