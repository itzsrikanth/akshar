    exercise: language-exercise-B
    text: 2. ನದಿಯನ್ನು ದಾ__________ಟಿ ಆಚೆಯ ದ__________ಡ ಸೇರಿದರೆ ದೊ__________ಡ್ಡ ಆಲದ ಮರ ಕಾಣುತ್ತ__________ದೆ (ದ/ದಾ/ದೆ/ದೊ)

  - id: lang-ex-b-q3
    type: fill_blank
    exercise: language-exercise-B
    text: 3. ಕಾವೇರಿ ಹಾ__________ವಿನಂತೆ ಹೊ__________ರಳಿ ಹ__________ರಿಯುವ ನದಿ (ಹ/ಹಾ/ಹಿ/ಹೊ)
