intro-1: 'भूमिय मेलिरुव प्रतियोंदु जीविगू बदुकुव हक्किदे. नावु बदुकबेकु. बदुकुवुदक्कू बिडबेकु. जगत्तिनल्लि प्रतियोंदु जीविगू तन्नदे आद विशेषते हागू अनन्यते इद्दे इरुत्तदे. अंगवैकल्य एंबुदु शापवल्ल. अदन्नु मीरि साधने माडबहुदु. तम्म न्यूनतेयन्नु मरेतु याव क्षेत्रदल्लि तम्म सामथ्र्यविदे एंबुदन्नु अरितुकोंडु साधने माडबेकु.'

story-n1: '“ओब्ब व्यक्तिगे गुणवागद कायिले इद्दरे आतनन्नु बदुकिसि उळिसि साधिसुवुदेनिदे? हागे आतनिगे वैद्यकीय उपचार माडुत्त बदुकिसुवुदु शुद्ध अविवेक” - एंबुदु वैद्यकीय विद्यार्थियागिद्दाग तरुण डाक्टर् तेड्डियस् मार्लिनन निश्चित अभिप्रायवागित्तु. “हागे वासियागद कायिलेगळिंद नरळुव रोगिगळिगे मत्तु अतियाद नोवु-नरळुविके अनुभविसुव रोगिगळिगे सुख मरण उंटागुवंते माडुवुदे लेसु”- एंदु अवनु तन्न तरगतिय इतर विद्यार्थिगळोडने वादिसुत्तिद्दनु.'

story-n2: '“आदरे नावु इल्लिरुवुदु अंगहीनराद हतभाग्यर आरैकेगागि!” - एंदु अवरु प्रतिभटिसुत्तिद्दरु.'

story-n3: '“डाक्टररु इरुवुदु रोगिगळन्नु आरोग्यवंतरन्नागि माडलिक्के. निज, ओप्पुत्तेने. आदरे, यावुदू अवरन्नु गुणपडिसुवंतिल्लवादरे अवरु नरळुवुदक्किंत सायुवुदे लेसु!” एंदु मार्लिननु छलदिंद नुडियुत्तिद्दनु.'

story-n4: 'मार्लिनन व्यासंगद कोनेय वर्षवागित्तु. अदोंदु रात्रे मार्लिननु आस्पत्रेय केलसदल्लिद्दनु. नगरद ओंदु कोळकु भागदिंद ओंदु प्रसवक्कागि करे बंतु. मार्लिननु कूडले होगि, जर्मनियिंद वलसे बंद ओर्व हेंगसिन प्रसवदल्लि नेरवादनु. अदु अवळ हत्तनेय मगुवागित्तु. ओंदु कालिगिंत इन्नोंदु कालु गिड्डवागि आ मगु हुट्टित्तु. डाक्टरन अभ्यासदंते, अवनु आ मगुवु उसिराडुवंते माडलु अदर बायियोळगे ऊदिदनु. आदरे, मरुक्षणवे अवनिगनिसितु: “एनु दुरंतवी शिशु! अदु बेळेदाग जीवनविडी कुंटु कालिनल्ले नडेयबेकु. इतर मक्कळु अणकिसि गेलि माडुवरु. ई मगु जीविसुवंते माडुवुदेके? इदु सत्तरे जगत्तिगे एनु नष्ट!”'

story-n5: 'आदरे अवनु हेळिकेळि वैद्य. मगुवन्नु हुट्टिनल्ले सायिसुव योचने बंदरू आतन वैद्य बुद्धि जाग्रतवागित्तु. बेन्नु-होट्टेगळ भागक्के नयवागि बडिदु आत आ मगुविन उसिराटद प्रक्रिये प्रारंभवागुवंते माडिदनु. कोनेगे अवनु निरीक्षिसुत्तिद्द उसिरेळेयु बंतु. मगुविन मुखवु केंपगायितु. मगु हुट्टिद मेले प्रतियोब्बरू निरीक्षिसुव आ मोदल अळु - अदु कोनेगू मगुविनिंद होरटितु. तेड्डियस्गे नेम्मदियायितु.'

story-n6: 'आत तन्न उपकरणगळन्नु चीलदोळगे तुंबि, नगरद कडेगे होरटुहोदनु. तानु माडिद केलसक्कागि अवनु बहळ असमाधानपट्टिद्दनु. “नानेके हागे माडिदेनेंदु ननगे तिळियदु, दारिद्र्य तुंबिद आ मनेयल्लि, ई मोदले, बेकादुदक्किंत हेच्चु मक्कळिरुवरु. न्यूनतेयुळ्ळ इदन्नु नानेके बदुकिसिदे? इंथ कुंटरिल्लदिद्दरे जगत्तु उत्तमवागदे?” एंदु अवनु तन्नोळगे गोणगुत्तिद्दनु.'

story-n7: 'वरुषगळु उरुळिदुवु. डाक्टर् मार्लिननु, ओंदु कैगारिका नगरक्के होगि तन्न वृत्ति स्थापिसिद्दनु. चेन्नागि संपादनेयागुत्तित्तु. तारुण्यदल्लिद्द आ सुधारणा मनोभाव ईग मायवागित्तु.'

story-n8: 'ओंदु दिन बेसिगेय संजे. आस्पत्रेयल्लि रोगिगळ तपासणेय केलस मुगिदित्तु. आत तन्न कोणेयल्लि कुळितु, नुरित संगीतगारनोब्ब नुडिसुत्तिद्द पियानो वादनवन्नु रेडियोदल्लि आलिसुत्तिद्दनु. अदु एंतह अद्भुत संगीत! अदोंदु संगीतद रसदौतण!'

story-n9: 'डाक्टर् मार्लिननु उल्लसितनादनु. अवनल्लिद्द दणिवेल्ला मायवायितु. संगीत मुगिद बळिक रेडियोदल्लि घोषणेयायितु.'

story-n10: '“इदुवरेगे नीवु आलिसिद पियानो वादनवन्नु नुडिसिदवरु प्रवीण मिल्लर् बार्बरा. इवरु हुट्टिनिंदले अंगविकलरु. ओंदु कालु गिड्डवागिरुवुदरिंद नडेयलु साध्यवागदिद्दरू तम्म संगीतद मूलक जगत्तन्ने गेद्दिद्दारे.”'

story-n11: 'डाक्टर् मार्लिननिगे आश्चर्यवायितु. तानु हुट्टिनल्ले सायिसबेकेंदिद्द मगु इदे इरबहुदे? एंदु योचिसिदनु. आतनिगे तन्न हळेय नेनपुगळु मरुकळिसिदवु. “नानु अंदु आ मगुवन्नु सायिसिद्दरे, इंदु इंतह अद्भुत संगीतवन्नु केळलु साध्यवागुत्तित्ते? जीवद मौल्यवन्नु अरियदे नानु एंतह तप्पु माडहोरटिद्दे!” एंदु पश्चात्तापपट्टनु.'

story-n12: 'प्रतियोंदु जीविगू तन्नदे आद मौल्यविदे. यारन्नू कीळागि काणबारदु. अंगवैकल्यवु साधनेगे अड्डियागलारदु एंब सत्यवन्नु डाक्टर् मार्लिननु अरितुकोंडनु.'

