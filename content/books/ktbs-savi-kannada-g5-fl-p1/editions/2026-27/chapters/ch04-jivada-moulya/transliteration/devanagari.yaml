grammar-p1: 'नामपद

  व्यक्ति, वस्तु, स्थळ, प्राणि, पक्षि इत्यादिगळ हेसरन्नु सूचिसुव पदगळिगे नामपद एन्नुवरु.

  उदा: राम, पुस्तक, ऊरु, हसु, गिळि इत्यादि.'

grammar-p2: 'नामपदगळल्लि मुख्यवागि मूरु विध.

  1. वस्तुवाचक

  2. गुणवाचक

  3. संख्यावाचक'

grammar-p3: '1. वस्तुवाचक

  वस्तुगळ हेसरन्नु सूचिसुव पदगळिगे वस्तुवाचक एन्नुवरु. इदरल्लि मूरु विध.

  अ) रूढनाम

  आ) अंकित नाम

  इ) अन्वर्थ नाम'

grammar-p4: 'अ) रूढनाम : रूढियिंद बंद पदगळु रूढनामगळु.

  उदा: नदि, पर्वत, मनुष्य, पट्टण इत्यादि.'

grammar-p5: 'आ) अंकित नाम : गुरुतिगागि हागू व्यवहारद उपयोगक्के इट्टुकोंड हेसरुगळु अंकित नामगळु.

  उदा: गंगा, हिमालय, राम, बेंगळूरु इत्यादि.'

grammar-p6: 'इ) अन्वर्थ नाम : रूप, गुण, स्वभावादि विशेषवाद अर्थक्के अनुगुणवागि बंद हेसरुगळु अन्वर्थ नामगळु.

  उदा: कुंट, कुरुड, किवुड, व्यापारि, शिक्षक इत्यादि.'

grammar-a-q1: 'अ) नामपद एंदरेनु? उदाहरणे कोडि.'

grammar-a-q2: 'आ) नामपदगळल्लि एष्टु विध?'

grammar-a-q3: 'इ) वस्तुवाचक नामपद एंदरेनु? अवुगळल्लि एष्टु विध?'

grammar-b-q1: '1. अंकित नाम - रूढियिंद बंद पदगळु'

grammar-b-q2: '2. रूढनाम - रूप, गुण, स्वभावादि विशेषवाद अर्थक्के अनुगुणवागि बंद हेसरु'

grammar-b-q3: '3. अन्वर्थ नाम - गुरुतिगागि हागू व्यवहारद उपयोगक्के इट्टुकोंड हेसरु'

