intro-1: 'bhūmiya mēliruva pratiyondu jīvigū badukuva hakkide. nāvu badukabēku. badukuvudakkū biḍabēku. jagattinalli pratiyondu jīvigū tannadē āda viśēṣate hāgū ananyate iddē iruttade. aṅgavaikalya embudu śāpavalla. adannu mīri sādhane māḍabahudu. tamma nyūnateyannu maretu yāva kṣētradalli tamma sāmathryavide embudannu aritukoṇḍu sādhane māḍabēku.'

story-n1: '“obba vyaktige guṇavāgada kāyile iddare ātanannu badukisi uḷisi sādhisuvudēnide? hāge ātanige vaidyakīya upacāra māḍutta badukisuvudu śuddha avivēka” - embudu vaidyakīya vidyārthiyāgiddāga taruṇa ḍākṭar tēḍḍiyas mārlinana niścita abhiprāyavāgittu. “hāge vāsiyāgada kāyilegaḷinda naraḷuva rōgigaḷige mattu atiyāda nōvu-naraḷuvike anubhavisuva rōgigaḷige sukha maraṇa uṇṭāguvante māḍuvudē lēsu”- endu avanu tanna taragatiya itara vidyārthigaḷoḍane vādisuttiddanu.'

story-n2: '“ādare nāvu illiruvudu aṅgahīnarāda hatabhāgyara āraikegāgi!” - endu avaru pratibhaṭisuttiddaru.'

story-n3: '“ḍākṭararu iruvudu rōgigaḷannu ārōgyavantarannāgi māḍalikkē. nija, opputtēne. ādare, yāvudū avarannu guṇapaḍisuvantillavādare avaru naraḷuvudakkinta sāyuvudē lēsu!” endu mārlinanu chaladinda nuḍiyuttiddanu.'

story-n4: 'mārlinana vyāsaṅgada koneya varṣavāgittu. adondu rātre mārlinanu āspatreya kelasadalliddanu. nagarada ondu koḷaku bhāgadinda ondu prasavakkāgi kare bantu. mārlinanu kūḍalē hōgi, jarmaniyinda valase banda ōrva heṅgasina prasavadalli neravādanu. adu avaḷa hattaneya maguvāgittu. ondu kāliginta innondu kālu giḍḍavāgi ā magu huṭṭittu. ḍākṭarana abhyāsadante, avanu ā maguvu usirāḍuvante māḍalu adara bāyiyoḷage ūdidanu. ādare, marukṣaṇavē avaniganisitu: “ēnu durantavī śiśu! adu beḷedāga jīvanaviḍī kuṇṭu kālinallē naḍeyabēku. itara makkaḷu aṇakisi gēli māḍuvaru. ī magu jīvisuvante māḍuvudēke? idu sattare jagattige ēnu naṣṭa!”'

story-n5: 'ādare avanu hēḷikēḷi vaidya. maguvannu huṭṭinallē sāyisuva yōcane bandarū ātana vaidya buddhi jāgratavāgittu. bennu-hoṭṭegaḷa bhāgakke nayavāgi baḍidu āta ā maguvina usirāṭada prakriye prārambhavāguvante māḍidanu. konege avanu nirīkṣisuttidda usireḷeyu bantu. maguvina mukhavu kempagāyitu. magu huṭṭida mēle pratiyobbarū nirīkṣisuva ā modala aḷu - adu konegū maguvininda horaṭitu. tēḍḍiyasge nemmadiyāyitu.'

story-n6: 'āta tanna upakaraṇagaḷannu cīladoḷage tumbi, nagarada kaḍege horaṭuhōdanu. tānu māḍida kelasakkāgi avanu bahaḷa asamādhānapaṭṭiddanu. “nānēke hāge māḍidenendu nanagē tiḷiyadu, dāridrya tumbida ā maneyalli, ī modalē, bēkādudakkinta heccu makkaḷiruvaru. nyūnateyuḷḷa idannu nānēke badukiside? intha kuṇṭarilladiddare jagattu uttamavāgadē?” endu avanu tannoḷagē goṇaguttiddanu.'

story-n7: 'varuṣagaḷu uruḷiduvu. ḍākṭar mārlinanu, ondu kaigārikā nagarakke hōgi tanna vr̥tti sthāpisiddanu. cennāgi sampādaneyāguttittu. tāruṇyadallidda ā sudhāraṇā manōbhāva īga māyavāgittu.'

story-n8: 'ondu dina bēsigeya sañje. āspatreyalli rōgigaḷa tapāsaṇeya kelasa mugidittu. āta tanna kōṇeyalli kuḷitu, nurita saṅgītagāranobba nuḍisuttidda piyānō vādanavannu rēḍiyōdalli ālisuttiddanu. adu entaha adbhuta saṅgīta! adondu saṅgītada rasadautaṇa!'

story-n9: 'ḍākṭar mārlinanu ullasitanādanu. avanallidda daṇivellā māyavāyitu. saṅgīta mugida baḷika rēḍiyōdalli ghōṣaṇeyāyitu.'

story-n10: '“iduvarege nīvu ālisida piyānō vādanavannu nuḍisidavaru pravīṇa millar bārbarā. ivaru huṭṭinindalē aṅgavikalaru. ondu kālu giḍḍavāgiruvudarinda naḍeyalu sādhyavāgadiddarū tamma saṅgītada mūlaka jagattannē geddiddāre.”'

story-n11: 'ḍākṭar mārlinanige āścaryavāyitu. tānu huṭṭinallē sāyisabēkendidda magu idē irabahudē? endu yōcisidanu. ātanige tanna haḷeya nenapugaḷu marukaḷisidavu. “nānu andu ā maguvannu sāyisiddare, indu intaha adbhuta saṅgītavannu kēḷalu sādhyavāguttittē? jīvada maulyavannu ariyade nānu entaha tappu māḍahoraṭidde!” endu paścāttāpapaṭṭanu.'

story-n12: 'pratiyondu jīvigū tannadē āda maulyavide. yārannū kīḷāgi kāṇabāradu. aṅgavaikalyavu sādhanege aḍḍiyāgalāradu emba satyavannu ḍākṭar mārlinanu aritukoṇḍanu.'

