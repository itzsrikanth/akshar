grammar-p1: 'nāmapada

  vyakti, vastu, sthaḷa, prāṇi, pakṣi ityādigaḷa hesarannu sūcisuva padagaḷige nāmapada ennuvaru.

  udā: rāma, pustaka, ūru, hasu, giḷi ityādi.'

grammar-p2: 'nāmapadagaḷalli mukhyavāgi mūru vidha.

  1. vastuvācaka

  2. guṇavācaka

  3. saṅkhyāvācaka'

grammar-p3: '1. vastuvācaka

  vastugaḷa hesarannu sūcisuva padagaḷige vastuvācaka ennuvaru. idaralli mūru vidha.

  a) rūḍhanāma

  ā) aṅkita nāma

  i) anvartha nāma'

grammar-p4: 'a) rūḍhanāma : rūḍhiyinda banda padagaḷu rūḍhanāmagaḷu.

  udā: nadi, parvata, manuṣya, paṭṭaṇa ityādi.'

grammar-p5: 'ā) aṅkita nāma : gurutigāgi hāgū vyavahārada upayōgakke iṭṭukoṇḍa hesarugaḷu aṅkita nāmagaḷu.

  udā: gaṅgā, himālaya, rāma, beṅgaḷūru ityādi.'

grammar-p6: 'i) anvartha nāma : rūpa, guṇa, svabhāvādi viśēṣavāda arthakke anuguṇavāgi banda hesarugaḷu anvartha nāmagaḷu.

  udā: kuṇṭa, kuruḍa, kivuḍa, vyāpāri, śikṣaka ityādi.'

grammar-a-q1: 'a) nāmapada endarēnu? udāharaṇe koḍi.'

grammar-a-q2: 'ā) nāmapadagaḷalli eṣṭu vidha?'

grammar-a-q3: 'i) vastuvācaka nāmapada endarēnu? avugaḷalli eṣṭu vidha?'

grammar-b-q1: '1. aṅkita nāma - rūḍhiyinda banda padagaḷu'

grammar-b-q2: '2. rūḍhanāma - rūpa, guṇa, svabhāvādi viśēṣavāda arthakke anuguṇavāgi banda hesaru'

grammar-b-q3: '3. anvartha nāma - gurutigāgi hāgū vyavahārada upayōgakke iṭṭukoṇḍa hesaru'

grammar-c-q1: 'mārlin, millar, vaidya, rōgi, heṅgasu, śiśu, bārbarā, pravīṇa, bālaki, vidyārthi'

