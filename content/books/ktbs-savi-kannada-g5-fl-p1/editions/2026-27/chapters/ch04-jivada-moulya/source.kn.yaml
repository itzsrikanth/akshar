segments:
  - id: intro-1
    type: prose
    section: intro
    text: ಭೂಮಿಯ ಮೇಲಿರುವ ಪ್ರತಿಯೊಂದು ಜೀವಿಗೂ ಬದುಕುವ ಹಕ್ಕಿದೆ. ನಾವು ಬದುಕಬೇಕು. ಬದುಕುವುದಕ್ಕೂ ಬಿಡಬೇಕು. ಜಗತ್ತಿನಲ್ಲಿ ಪ್ರತಿಯೊಂದು ಜೀವಿಗೂ ತನ್ನದೇ ಆದ ವಿಶೇಷತೆ ಹಾಗೂ ಅನನ್ಯತೆ ಇದ್ದೇ ಇರುತ್ತದೆ. ಅಂಗವೈಕಲ್ಯ ಎಂಬುದು ಶಾಪವಲ್ಲ. ಅದನ್ನು ಮೀರಿ ಸಾಧನೆ ಮಾಡಬಹುದು. ತಮ್ಮ ನ್ಯೂನತೆಯನ್ನು ಮರೆತು ಯಾವ ಕ್ಷೇತ್ರದಲ್ಲಿ ತಮ್ಮ ಸಾಮಥ್ರ್ಯವಿದೆ ಎಂಬುದನ್ನು ಅರಿತುಕೊಂಡು ಸಾಧನೆ ಮಾಡಬೇಕು.

  - id: story-n1
    type: prose
    section: story
    text: “ಒಬ್ಬ ವ್ಯಕ್ತಿಗೆ ಗುಣವಾಗದ ಕಾಯಿಲೆ ಇದ್ದರೆ ಆತನನ್ನು ಬದುಕಿಸಿ ಉಳಿಸಿ ಸಾಧಿಸುವುದೇನಿದೆ? ಹಾಗೆ ಆತನಿಗೆ ವೈದ್ಯಕೀಯ ಉಪಚಾರ ಮಾಡುತ್ತ ಬದುಕಿಸುವುದು ಶುದ್ಧ ಅವಿವೇಕ” - ಎಂಬುದು ವೈದ್ಯಕೀಯ ವಿದ್ಯಾರ್ಥಿಯಾಗಿದ್ದಾಗ ತರುಣ ಡಾಕ್ಟರ್ ತೇಡ್ಡಿಯಸ್ ಮಾರ್ಲಿನನ ನಿಶ್ಚಿತ ಅಭಿಪ್ರಾಯವಾಗಿತ್ತು. “ಹಾಗೆ ವಾಸಿಯಾಗದ ಕಾಯಿಲೆಗಳಿಂದ ನರಳುವ ರೋಗಿಗಳಿಗೆ ಮತ್ತು ಅತಿಯಾದ ನೋವು-ನರಳುವಿಕೆ ಅನುಭವಿಸುವ ರೋಗಿಗಳಿಗೆ ಸುಖ ಮರಣ ಉಂಟಾಗುವಂತೆ ಮಾಡುವುದೇ ಲೇಸು”- ಎಂದು ಅವನು ತನ್ನ ತರಗತಿಯ ಇತರ ವಿದ್ಯಾರ್ಥಿಗಳೊಡನೆ ವಾದಿಸುತ್ತಿದ್ದನು.

  - id: story-n2
    type: prose
    section: story
    text: “ಆದರೆ ನಾವು ಇಲ್ಲಿರುವುದು ಅಂಗಹೀನರಾದ ಹತಭಾಗ್ಯರ ಆರೈಕೆಗಾಗಿ!” - ಎಂದು ಅವರು ಪ್ರತಿಭಟಿಸುತ್ತಿದ್ದರು.

  - id: story-n3
    type: prose
    section: story
    text: “ಡಾಕ್ಟರರು ಇರುವುದು ರೋಗಿಗಳನ್ನು ಆರೋಗ್ಯವಂತರನ್ನಾಗಿ ಮಾಡಲಿಕ್ಕೇ. ನಿಜ, ಒಪ್ಪುತ್ತೇನೆ. ಆದರೆ, ಯಾವುದೂ ಅವರನ್ನು ಗುಣಪಡಿಸುವಂತಿಲ್ಲವಾದರೆ ಅವರು ನರಳುವುದಕ್ಕಿಂತ ಸಾಯುವುದೇ ಲೇಸು!” ಎಂದು ಮಾರ್ಲಿನನು ಛಲದಿಂದ ನುಡಿಯುತ್ತಿದ್ದನು.

  - id: story-n4
    type: prose
    section: story
    text: 'ಮಾರ್ಲಿನನ ವ್ಯಾಸಂಗದ ಕೊನೆಯ ವರ್ಷವಾಗಿತ್ತು. ಅದೊಂದು ರಾತ್ರೆ ಮಾರ್ಲಿನನು ಆಸ್ಪತ್ರೆಯ ಕೆಲಸದಲ್ಲಿದ್ದನು. ನಗರದ ಒಂದು ಕೊಳಕು ಭಾಗದಿಂದ ಒಂದು ಪ್ರಸವಕ್ಕಾಗಿ ಕರೆ ಬಂತು. ಮಾರ್ಲಿನನು ಕೂಡಲೇ ಹೋಗಿ, ಜರ್ಮನಿಯಿಂದ ವಲಸೆ ಬಂದ ಓರ್ವ ಹೆಂಗಸಿನ ಪ್ರಸವದಲ್ಲಿ ನೆರವಾದನು. ಅದು ಅವಳ ಹತ್ತನೆಯ ಮಗುವಾಗಿತ್ತು. ಒಂದು ಕಾಲಿಗಿಂತ ಇನ್ನೊಂದು ಕಾಲು ಗಿಡ್ಡವಾಗಿ ಆ ಮಗು ಹುಟ್ಟಿತ್ತು. ಡಾಕ್ಟರನ ಅಭ್ಯಾಸದಂತೆ, ಅವನು ಆ ಮಗುವು ಉಸಿರಾಡುವಂತೆ ಮಾಡಲು ಅದರ ಬಾಯಿಯೊಳಗೆ ಊದಿದನು. ಆದರೆ, ಮರುಕ್ಷಣವೇ ಅವನಿಗನಿಸಿತು: “ಏನು ದುರಂತವೀ ಶಿಶು! ಅದು ಬೆಳೆದಾಗ ಜೀವನವಿಡೀ ಕುಂಟು ಕಾಲಿನಲ್ಲೇ ನಡೆಯಬೇಕು. ಇತರ ಮಕ್ಕಳು ಅಣಕಿಸಿ ಗೇಲಿ ಮಾಡುವರು. ಈ ಮಗು ಜೀವಿಸುವಂತೆ ಮಾಡುವುದೇಕೆ? ಇದು ಸತ್ತರೆ ಜಗತ್ತಿಗೆ ಏನು ನಷ್ಟ!”'

  - id: story-n5
    type: prose
    section: story
    text: ಆದರೆ ಅವನು ಹೇಳಿಕೇಳಿ ವೈದ್ಯ. ಮಗುವನ್ನು ಹುಟ್ಟಿನಲ್ಲೇ ಸಾಯಿಸುವ ಯೋಚನೆ ಬಂದರೂ ಆತನ ವೈದ್ಯ ಬುದ್ಧಿ ಜಾಗ್ರತವಾಗಿತ್ತು. ಬೆನ್ನು-ಹೊಟ್ಟೆಗಳ ಭಾಗಕ್ಕೆ ನಯವಾಗಿ ಬಡಿದು ಆತ ಆ ಮಗುವಿನ ಉಸಿರಾಟದ ಪ್ರಕ್ರಿಯೆ ಪ್ರಾರಂಭವಾಗುವಂತೆ ಮಾಡಿದನು. ಕೊನೆಗೆ ಅವನು ನಿರೀಕ್ಷಿಸುತ್ತಿದ್ದ ಉಸಿರೆಳೆಯು ಬಂತು. ಮಗುವಿನ ಮುಖವು ಕೆಂಪಗಾಯಿತು. ಮಗು ಹುಟ್ಟಿದ ಮೇಲೆ ಪ್ರತಿಯೊಬ್ಬರೂ ನಿರೀಕ್ಷಿಸುವ ಆ ಮೊದಲ ಅಳು - ಅದು ಕೊನೆಗೂ ಮಗುವಿನಿಂದ ಹೊರಟಿತು. ತೇಡ್ಡಿಯಸ್ಗೆ ನೆಮ್ಮದಿಯಾಯಿತು.

  - id: story-n6
    type: prose
    section: story
    text: ಆತ ತನ್ನ ಉಪಕರಣಗಳನ್ನು ಚೀಲದೊಳಗೆ ತುಂಬಿ, ನಗರದ ಕಡೆಗೆ ಹೊರಟುಹೋದನು. ತಾನು ಮಾಡಿದ ಕೆಲಸಕ್ಕಾಗಿ ಅವನು ಬಹಳ ಅಸಮಾಧಾನಪಟ್ಟಿದ್ದನು. “ನಾನೇಕೆ ಹಾಗೆ ಮಾಡಿದೆನೆಂದು ನನಗೇ ತಿಳಿಯದು, ದಾರಿದ್ರ್ಯ ತುಂಬಿದ ಆ ಮನೆಯಲ್ಲಿ, ಈ ಮೊದಲೇ, ಬೇಕಾದುದಕ್ಕಿಂತ ಹೆಚ್ಚು ಮಕ್ಕಳಿರುವರು. ನ್ಯೂನತೆಯುಳ್ಳ ಇದನ್ನು ನಾನೇಕೆ ಬದುಕಿಸಿದೆ? ಇಂಥ ಕುಂಟರಿಲ್ಲದಿದ್ದರೆ ಜಗತ್ತು ಉತ್ತಮವಾಗದೇ?” ಎಂದು ಅವನು ತನ್ನೊಳಗೇ ಗೊಣಗುತ್ತಿದ್ದನು.

  - id: story-n7
    type: prose
    section: story
    text: ವರುಷಗಳು ಉರುಳಿದುವು. ಡಾಕ್ಟರ್ ಮಾರ್ಲಿನನು, ಒಂದು ಕೈಗಾರಿಕಾ ನಗರಕ್ಕೆ ಹೋಗಿ ತನ್ನ ವೃತ್ತಿ ಸ್ಥಾಪಿಸಿದ್ದನು. ಚೆನ್ನಾಗಿ ಸಂಪಾದನೆಯಾಗುತ್ತಿತ್ತು. ತಾರುಣ್ಯದಲ್ಲಿದ್ದ ಆ ಸುಧಾರಣಾ ಮನೋಭಾವ ಈಗ ಮಾಯವಾಗಿತ್ತು.

  - id: story-n8
    type: prose
    section: story
    text: ಒಂದು ದಿನ ಬೇಸಿಗೆಯ ಸಂಜೆ. ಆಸ್ಪತ್ರೆಯಲ್ಲಿ ರೋಗಿಗಳ ತಪಾಸಣೆಯ ಕೆಲಸ ಮುಗಿದಿತ್ತು. ಆತ ತನ್ನ ಕೋಣೆಯಲ್ಲಿ ಕುಳಿತು, ನುರಿತ ಸಂಗೀತಗಾರನೊಬ್ಬ ನುಡಿಸುತ್ತಿದ್ದ ಪಿಯಾನೋ ವಾದನವನ್ನು ರೇಡಿಯೋದಲ್ಲಿ ಆಲಿಸುತ್ತಿದ್ದನು. ಅದು ಎಂತಹ ಅದ್ಭುತ ಸಂಗೀತ! ಅದೊಂದು ಸಂಗೀತದ ರಸದೌತಣ!

  - id: story-n9
    type: prose
    section: story
    text: ಡಾಕ್ಟರ್ ಮಾರ್ಲಿನನು ಉಲ್ಲಸಿತನಾದನು. ಅವನಲ್ಲಿದ್ದ ದಣಿವೆಲ್ಲಾ ಮಾಯವಾಯಿತು. ಸಂಗೀತ ಮುಗಿದ ಬಳಿಕ ರೇಡಿಯೋದಲ್ಲಿ ಘೋಷಣೆಯಾಯಿತು.

  - id: story-n10
    type: prose
    section: story
    text: “ಇದುವರೆಗೆ ನೀವು ಆಲಿಸಿದ ಪಿಯಾನೋ ವಾದನವನ್ನು ನುಡಿಸಿದವರು ಪ್ರವೀಣ ಮಿಲ್ಲರ್ ಬಾರ್ಬರಾ. ಇವರು ಹುಟ್ಟಿನಿಂದಲೇ ಅಂಗವಿಕಲರು. ಒಂದು ಕಾಲು ಗಿಡ್ಡವಾಗಿರುವುದರಿಂದ ನಡೆಯಲು ಸಾಧ್ಯವಾಗದಿದ್ದರೂ ತಮ್ಮ ಸಂಗೀತದ ಮೂಲಕ ಜಗತ್ತನ್ನೇ ಗೆದ್ದಿದ್ದಾರೆ.”

  - id: story-n11
    type: prose
    section: story
    text: ಡಾಕ್ಟರ್ ಮಾರ್ಲಿನನಿಗೆ ಆಶ್ಚರ್ಯವಾಯಿತು. ತಾನು ಹುಟ್ಟಿನಲ್ಲೇ ಸಾಯಿಸಬೇಕೆಂದಿದ್ದ ಮಗು ಇದೇ ಇರಬಹುದೇ? ಎಂದು ಯೋಚಿಸಿದನು. ಆತನಿಗೆ ತನ್ನ ಹಳೆಯ ನೆನಪುಗಳು ಮರುಕಳಿಸಿದವು. “ನಾನು ಅಂದು ಆ ಮಗುವನ್ನು ಸಾಯಿಸಿದ್ದರೆ, ಇಂದು ಇಂತಹ ಅದ್ಭುತ ಸಂಗೀತವನ್ನು ಕೇಳಲು ಸಾಧ್ಯವಾಗುತ್ತಿತ್ತೇ? ಜೀವದ ಮೌಲ್ಯವನ್ನು ಅರಿಯದೆ ನಾನು ಎಂತಹ ತಪ್ಪು ಮಾಡಹೊರಟಿದ್ದೆ!” ಎಂದು ಪಶ್ಚಾತ್ತಾಪಪಟ್ಟನು.

  - id: story-n12
    type: prose
    section: story
    text: ಪ್ರತಿಯೊಂದು ಜೀವಿಗೂ ತನ್ನದೇ ಆದ ಮೌಲ್ಯವಿದೆ. ಯಾರನ್ನೂ ಕೀಳಾಗಿ ಕಾಣಬಾರದು. ಅಂಗವೈಕಲ್ಯವು ಸಾಧನೆಗೆ ಅಡ್ಡಿಯಾಗಲಾರದು ಎಂಬ ಸತ್ಯವನ್ನು ಡಾಕ್ಟರ್ ಮಾರ್ಲಿನನು ಅರಿತುಕೊಂಡನು.

