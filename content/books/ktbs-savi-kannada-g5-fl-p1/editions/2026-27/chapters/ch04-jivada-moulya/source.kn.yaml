  - id: grammar-p1
    type: prose
    section: grammar
    text: "ನಾಮಪದ\nವ್ಯಕ್ತಿ, ವಸ್ತು, ಸ್ಥಳ, ಪ್ರಾಣಿ, ಪಕ್ಷಿ ಇತ್ಯಾದಿಗಳ ಹೆಸರನ್ನು ಸೂಚಿಸುವ ಪದಗಳಿಗೆ ನಾಮಪದ ಎನ್ನುವರು.\nಉದಾ: ರಾಮ, ಪುಸ್ತಕ, ಊರು, ಹಸು, ಗಿಳಿ ಇತ್ಯಾದಿ."

  - id: grammar-p2
    type: prose
    section: grammar
    text: "ನಾಮಪದಗಳಲ್ಲಿ ಮುಖ್ಯವಾಗಿ ಮೂರು ವಿಧ.\n1. ವಸ್ತುವಾಚಕ\n2. ಗುಣವಾಚಕ\n3. ಸಂಖ್ಯಾವಾಚಕ"

  - id: grammar-p3
    type: prose
    section: grammar
    text: "1. ವಸ್ತುವಾಚಕ\nವಸ್ತುಗಳ ಹೆಸರನ್ನು ಸೂಚಿಸುವ ಪದಗಳಿಗೆ ವಸ್ತುವಾಚಕ ಎನ್ನುವರು. ಇದರಲ್ಲಿ ಮೂರು ವಿಧ.\nಅ) ರೂಢನಾಮ\nಆ) ಅಂಕಿತ ನಾಮ\nಇ) ಅನ್ವರ್ಥ ನಾಮ"

  - id: grammar-p4
    type: prose
    section: grammar
    text: "ಅ) ರೂಢನಾಮ : ರೂಢಿಯಿಂದ ಬಂದ ಪದಗಳು ರೂಢನಾಮಗಳು.\nಉದಾ: ನದಿ, ಪರ್ವತ, ಮನುಷ್ಯ, ಪಟ್ಟಣ ಇತ್ಯಾದಿ."

  - id: grammar-p5
    type: prose
    section: grammar
    text: "ಆ) ಅಂಕಿತ ನಾಮ : ಗುರುತಿಗಾಗಿ ಹಾಗೂ ವ್ಯವಹಾರದ ಉಪಯೋಗಕ್ಕೆ ಇಟ್ಟುಕೊಂಡ ಹೆಸರುಗಳು ಅಂಕಿತ ನಾಮಗಳು.\nಉದಾ: ಗಂಗಾ, ಹಿಮಾಲಯ, ರಾಮ, ಬೆಂಗಳೂರು ಇತ್ಯಾದಿ."

  - id: grammar-p6
    type: prose
    section: grammar
    text: "ಇ) ಅನ್ವರ್ಥ ನಾಮ : ರೂಪ, ಗುಣ, ಸ್ವಭಾವಾದಿ ವಿಶೇಷವಾದ ಅರ್ಥಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಬಂದ ಹೆಸರುಗಳು ಅನ್ವರ್ಥ ನಾಮಗಳು.\nಉದಾ: ಕುಂಟ, ಕುರುಡ, ಕಿವುಡ, ವ್ಯಾಪಾರಿ, ಶಿಕ್ಷಕ ಇತ್ಯಾದಿ."

