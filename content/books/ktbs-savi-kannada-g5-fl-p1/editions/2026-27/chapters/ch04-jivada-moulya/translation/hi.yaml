intro-1: 'पृथ्वी पर प्रत्येक जीव को जीने का अधिकार है। हमें जीना चाहिए। जीने भी देना चाहिए। संसार में प्रत्येक जीव की अपनी विशेषता और अनन्यता होती ही है। अंगवैकल्य शाप नहीं। उसे पार करके साधना हो सकती है। अपनी न्यूनता भूलकर जिस क्षेत्र में सामर्थ्य है उसे जानकर साधना करनी चाहिए।'

story-n1: '«यदि किसी व्यक्ति को असाध्य रोग हो तो उसे जिलाकर साधना करवाने का क्या अर्थ? ऐसे व्यक्ति को चिकित्सा देकर जिलाए रखना शुद्ध अविवेक»—यह चिकित्सा छात्र रहते युवा डॉक्टर थड्डियस मार्लिन का निश्चित मत था। «असाध्य रोगों से पीड़ित और अत्यधिक दर्द सहने वाले रोगियों के लिए सुखमृत्यु ही उत्तम»—वे अपनी कक्षा के अन्य छात्रों से वाद-विवाद करते थे।'

story-n2: '«पर हम यहाँ अंगहीन भाग्यहीनों की देखभाल के लिए हैं!» वे विरोध करते थे।'

story-n3: '«डॉक्टर रोगी को स्वस्थ बनाने के लिए होते हैं। सच, मैं मानता हूँ। पर यदि कुछ भी उन्हें ठीक न कर सके तो तड़पने से मरना ही बेहतर!» मार्लिन हठ से कहते थे।'

story-n4: 'मार्लिन के अध्ययन का अंतिम वर्ष था। एक रात मार्लिन अस्पताल ड्यूटी पर थे। नगर के एक गंदे हिस्से से प्रसव के लिए बुलावा आया। मार्लिन तुरंत गए और जर्मनी से आकर बसी एक स्त्री के प्रसव में सहायता की। वह उसका दसवाँ बच्चा था। एक टांग दूसरी से छोटी होकर बच्चा पैदा हुआ। डॉक्टर के अभ्यास के अनुसार उन्होंने बच्चे के मुँह में फूँक मारकर साँस चलवाई। पर अगले क्षण सोचा: «क्या त्रासदी है यह शिशु! बड़ा होकर जीवन भर लंगड़ी टांग से चलेगा। अन्य बच्चे चिढ़ाएँगे। इसे जिलाएँ क्यों? यह मर जाए तो संसार को क्या हानि!»'

story-n5: 'पर वे कहने-सुनने डॉक्टर थे। जन्म में ही मार देने का विचार आया तो भी उनकी चिकित्सकीय बुद्धि जागृत रही। पीठ-पेट पर धीरे थपथपाकर उन्होंने साँस की प्रक्रिया आरंभ कराई। अंत में अपेक्षित साँस आई। बच्चे का मुँह लाल हो गया। जन्म के बाद सबकी प्रतीक्षा वाला पहला रोना—अंततः बच्चे से निकला। थड्डियस को शांति मिली।'

story-n6: 'उन्होंने औजार थैले में रख नगर की ओर निकल पड़े। अपने किए से वे बहुत असंतुष्ट थे। «मैंने ऐसा क्यों किया स्वयं नहीं जानता; दरिद्रता भरे उस घर में पहले से ही जरूरत से अधिक बच्चे थे। इस न्यूनता वाले को मैंने क्यों जिलाया? ऐसे लंगड़े न हों तो संसार बेहतर न हो?» वे मन में बुदबुदाते थे।'

story-n7: 'वर्ष बीत गए। डॉक्टर मार्लिन एक औद्योगिक नगर जाकर व्यवसाय स्थापित कर चुके थे। अच्छी कमाई हो रही थी। यौवन का वह सुधारवादी भाव अब लुप्त हो चुका था।'

story-n8: 'एक ग्रीष्म की शाम। अस्पताल में रोगी जाँच का काम पूरा हो चुका था। वे अपने कमरे में बैठे रेडियो पर कुशल संगीतकार का पियानो वादन सुन रहे थे। कैसा अद्भुत संगीत! वह संगीत का रसभोज था!'

story-n9: 'डॉक्टर मार्लिन प्रसन्न हो उठे। उनकी थकान मिट गई। संगीत समाप्त होने पर रेडियो पर घोषणा हुई।'

story-n10: '«अभी आपने जो पियानो वादन सुना, उसे प्रवीण मिलर बार्बरा ने बजाया। ये जन्म से ही अंगविकल हैं। एक टांग छोटी होने से चलना संभव न होने पर भी अपने संगीत से संसार जीत लिया है।»'

story-n11: 'डॉक्टर मार्लिन आश्चर्यचकित हुए। क्या वही बच्चा है जिसे जन्म में ही मार देना चाहा था? पुरानी स्मृतियाँ लौटीं। «यदि उस दिन उस बच्चे को मार दिया होता तो क्या आज ऐसा अद्भुत संगीत सुन पाता? जीवन का मूल्य न जानकर मैं कैसी भूल करने जा रहा था!» उन्होंने पश्चात्ताप किया।'

story-n12: 'प्रत्येक जीव का अपना मूल्य है। किसी को भी नीचा नहीं देखना चाहिए। अंगवैकल्य साधना में बाधा नहीं बन सकता—यह सत्य डॉक्टर मार्लिन ने समझ लिया।'

