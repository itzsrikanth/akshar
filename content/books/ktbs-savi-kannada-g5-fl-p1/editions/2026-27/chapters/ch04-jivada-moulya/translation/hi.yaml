grammar-p1: 'नामपद

  व्यक्ति, वस्तु, स्थान, पशु, पक्षी आदि के नाम सूचित करने वाले पद नामपद कहलाते हैं।

  उदा.: राम, पुस्तक, गाँव, गाय, तोता आदि।'

grammar-p2: 'नामपद मुख्यतः तीन प्रकार के।

  1. वस्तुवाचक

  2. गुणवाचक

  3. संख्यावाचक'

grammar-p3: '1. वस्तुवाचक

  वस्तुओं के नाम सूचित करने वाले पद वस्तुवाचक। इनमें तीन भेद।

  अ) रूढ़नाम

  आ) अंकित नाम

  इ) अन्वर्थ नाम'

grammar-p4: 'अ) रूढ़नाम : रूढ़ि से आए पद रूढ़नाम।

  उदा.: नदी, पर्वत, मनुष्य, नगर आदि।'

grammar-p5: 'आ) अंकित नाम : पहचान और व्यवहार के लिए रखे नाम अंकित नाम।

  उदा.: गंगा, हिमालय, राम, बेंगलूरु आदि।'

grammar-p6: 'इ) अन्वर्थ नाम : रूप, गुण, स्वभाव आदि विशेष अर्थ के अनुरूप आए नाम अन्वर्थ नाम।

  उदा.: लंगड़ा, अंधा, बहरा, व्यापारी, शिक्षक आदि।'

grammar-a-q1: 'अ) नामपद क्या है? उदाहरण दीजिए।'

grammar-a-q2: 'आ) नामपद कितने प्रकार के?'

grammar-a-q3: 'इ) वस्तुवाचक नामपद क्या है? उनमें कितने भेद?'

grammar-b-q1: '1. अंकित नाम - रूढ़ि से आए पद'

grammar-b-q2: '2. रूढ़नाम - रूप, गुण, स्वभाव आदि विशेष अर्थ के अनुरूप आया नाम'

grammar-b-q3: '3. अन्वर्थ नाम - पहचान और व्यवहार के लिए रखा नाम'

grammar-c-q1: 'मार्लिन, मिलर, वैद्य, रोगी, स्त्री, शिशु, बार्बरा, प्रवीण, बालिका, विद्यार्थी'

