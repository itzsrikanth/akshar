grammar-p1: 'Noun

  Words that indicate the names of persons, things, places, animals, birds etc. are called nouns.

  Examples: Rama, book, town, cow, parrot, etc.'

grammar-p2: 'There are mainly three kinds of nouns.

  1. Concrete (vastuvachaka)

  2. Abstract quality (gunavachaka)

  3. Numeral (sankhyavachaka)'

grammar-p3: '1. Concrete nouns

  Words that indicate names of things are concrete nouns. There are three kinds among them.

  A) Conventional name (rudhanama)

  B) Proper name (ankita nama)

  C) Meaningful name (anvartha nama)'

grammar-p4: 'A) Conventional name: Words that have come by custom are conventional names.

  Examples: river, mountain, human, town, etc.'

grammar-p5: 'B) Proper name: Names given for identity and practical use are proper names.

  Examples: Ganga, Himalaya, Rama, Bengaluru, etc.'

grammar-p6: 'C) Meaningful name: Names that match a special meaning of form, quality or nature are meaningful names.

  Examples: lame, blind, deaf, trader, teacher, etc.'

grammar-a-q1: 'A) What is a noun? Give an example.'

grammar-a-q2: 'B) How many kinds of nouns are there?'

grammar-a-q3: 'C) What is a concrete noun? How many kinds are there among them?'

grammar-b-q1: '1. Proper name - words that have come by custom'

grammar-b-q2: '2. Conventional name - a name matching special meaning of form, quality or nature'

grammar-b-q3: '3. Meaningful name - a name given for identity and practical use'

