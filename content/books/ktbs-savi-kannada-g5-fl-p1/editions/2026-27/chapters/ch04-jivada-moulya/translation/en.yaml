intro-1: 'Every living being on earth has the right to live. We must live. We must also let others live. Every living being in the world has its own special quality and uniqueness. Disability is not a curse. One can achieve beyond it. Forgetting one’s shortcoming, one should know where one’s strength lies and achieve.'

story-n1: '"If a person has an incurable disease, what is the point of keeping him alive and making him achieve? Giving medical care and keeping such a person alive is pure folly"—this was the firm opinion of young Doctor Thaddeus Marlin when he was a medical student. "For patients suffering from incurable diseases and those in extreme pain, it is better to arrange a peaceful death," he would argue with other students in his class.'

story-n2: '"But we are here to care for the disabled and unfortunate!" they would protest.'

story-n3: '"Doctors exist to make patients healthy. True, I agree. But if nothing can cure them, dying is better than suffering!" Marlin would say stubbornly.'

story-n4: 'It was Marlin’s final year of study. One night Marlin was on hospital duty. A call came for a delivery from a filthy part of the city. Marlin went at once and helped a woman who had migrated from Germany with her delivery. It was her tenth child. The baby was born with one leg shorter than the other. As doctors are trained, he blew into the baby’s mouth to make it breathe. But the next moment he thought: "What a tragedy this infant! When it grows it must walk its whole life on a lame leg. Other children will mock and tease. Why make this child live? If it dies, what loss to the world!"'

story-n5: 'But he was a doctor after all. Though the thought of letting the baby die at birth came, his medical sense stayed awake. Gently tapping the back and belly he started the baby’s breathing. At last the breath he awaited came. The baby’s face turned red. The first cry everyone expects after birth—at last it came from the baby. Thaddeus felt peace.'

story-n6: 'He packed his instruments into the bag and set off toward the city. He was very unhappy about what he had done. "I myself do not know why I did that; in that house full of poverty there were already more children than needed. Why did I save this imperfect one? Wouldn’t the world be better without such lame ones?" he muttered to himself.'

story-n7: 'Years rolled by. Doctor Marlin went to an industrial city and set up his practice. He earned well. The reformist spirit of his youth had now vanished.'

story-n8: 'One summer evening. Hospital examination work was over. Sitting in his room he was listening on the radio to piano music played by a skilled musician. What wonderful music! It was a feast of musical delight!'

story-n9: 'Doctor Marlin became joyful. All his tiredness vanished. After the music ended an announcement came on the radio.'

story-n10: '"The piano performance you just heard was by the expert Miller Barbara. She has been disabled from birth. Though one short leg makes walking impossible, through her music she has conquered the world."'

story-n11: 'Doctor Marlin was astonished. Could this be the same child he had thought of letting die at birth? Old memories returned. "If I had let that child die that day, could I hear such wonderful music today? Not knowing the value of life, what a mistake I was about to make!" he felt remorse.'

story-n12: 'Every living being has its own value. No one should be looked down on. Doctor Marlin understood the truth that disability cannot block achievement.'

