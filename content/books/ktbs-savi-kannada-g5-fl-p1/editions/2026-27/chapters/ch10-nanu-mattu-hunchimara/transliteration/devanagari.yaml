labels:
  intro: 'प्रवेश'
  author_intro: 'कृतिकारर परिचय'
  exercise-A: 'अ. केळगिन प्रश्नेगळिगे उत्तरिसि.'

intro-1: 'अनेक बगेय मूढनंबिकेगळु नम्म नडुवे बीडुबिट्टिवे. आ निमित्तवागि नावु माडबारद केलसगळन्नु माडुत्तेवे. परिसर नाश माडुत्तेवे. यावुदे वैज्ञानिक सत्यवन्नु कंडुकोळ्ळलु प्रयत्निसुवुदिल्ल. यारो हेळिद यावुदो मातिगे एनो अर्थ कल्पिसुव जनरिंद एंथेंथ अनाहुतगळु आगिबिडुत्तवे एंबुदन्नु कुरितु एच्चरिके नीडुवुदु प्रस्तुत पाठद आशय.'

story-n1: 'नानु दारियल्लि नडेदु होगुत्तिद्दे. नन्न बूटुगळु इद्दक्किद्दंते निंतुहोदवु. मेल्लने केळगे नोडिदरे... आहा... हुंचिहूवु! नेलद तुंबा हळदिय हुंचिहूवुगळ राशिराशि. चिक्कवनिद्दाग ननगोंदु विचित्र हव्यासवित्तु. अदेंदरे हुंचिहूवु तिन्नुवुदु! एळेय हल्लुगळिंद हुंचिहूवुगळन्नु बकबक तिन्नुव बकपक्षि नानागिद्दे. जुम्मेंदागले हल्लु चळितद्दु गोत्तागुत्तित्तु.'

story-n2: 'नन्न बायल्लि नीरूरितु. मेल्लने बग्गि, ऐदारु हुंचिहूवुगळन्नु आरिसिकोंडु तिन्नुवासे मूडितु. आदरे... नानीग पुट्ट हुडुगनल्ल...दोड्डव.... दोड्ड पगारदव...प्यांटु बूटु... इंथ कालदल्लि... अदू रस्तेयल्लि निंतु... नानु हुंचिहूवु आरिसिदरे जन एनेंदारु? अदन्नु अल्ले बिट्टे.'

story-n3: 'बूटु खट् खट् ऊरुत्ता मुंदे सागिबिट्टे.'

story-n4: 'मुंदे ओंदु वारद अनंतर अदे हुणिसे मरद केळगिनिंद होगुवाग स्वल्प बलित एळनागरकायिगळु कंडवु. केलवु हुडुगरु हुंचिमरक्के कल्लु एसेदु, नागरकायि बीळिसि तिन्नुत्तिद्दरु. नन्न बायल्लि हंडे नीरु छिल्लेंदु चिम्मितु. आ हुडुगरिगे जबरिसुव नेपदल्लि निंतु अवरिगेंदे, “ले...ले...कल्लु होडीब्याड्रि...! यार तले ओडीबेकंत माडिद्दीरि?”'

story-n5: 'नन्न गदरिकेगे आ हुडुगरु अंजि दिक्कापालागि ओडिबिट्टरु. “अय्यय्यो’’ अंदे! अवरु तूरिद कल्लु नेरवागि नन्न तलेगे बडिदिद्दरू नानु बेड अन्नुत्तिरलिल्ल. अष्टु प्रीति ननगे हुंचिकायिय मेले.'

story-n6: 'स्वल्प दिनगळ अनंतर अदे मरद दारिगे बंदे. अब्बा...! इन्नू ओंदु विचित्र कंडे! हुंचिगिडद इळिबिद्द उद्द टोंगेगळन्नु हिडिदु केलवु हुडुगियरु जोकालि जीकुत्तिद्दरु. ओंदु क्षण निंते, हौदु! नानु चिक्कवनिद्दाग हीगेये जोकालि जीकुत्तिद्दे.'

story-n7: 'एरडु मूरु वार दाटिदवु. आ हुंचिमरद बळिगे बंदाग अल्लि हब्बद वातावरण. कारण ‘डोरे हुणिसे’. अंदरे....इत्त कायि हुणिसेयु अल्ल; अत्त हण्णु हुणिसेयु अल्ल ...इदर मध्यद हंतद हळदि-हसिरु बण्णद डोरेहुणिसे हण्णु. ओंदु विशिष्ट रुचिय हण्णु. ई हण्णिन अद्भुत रुचियु आपूस् माविन हण्णिन रुचिगिंत मेलु!'

story-n8: 'मत्तोंदु वार कळेयितु. आ हुणिसेमरद हत्तिर ओंदु दुंडाद बंडेगल्लु इत्तु. नानु संजे गाळि सेविसुव नेपमाडिकोंडु अल्लि होगि कुळिते. अल्लि मरकुटिगन हक्कि, कागे, गुब्बि, मैना, टिट्टिभ मुंताद पक्षिगळु काणिसिकोंडवु. आ हक्किमित्ररोंदिगे माताडिदे. अवेल्लवू आ हुणिसेमरदल्लि हाडि नलियुत्तिद्दवु.'

story-n9: 'आनंतर नानु बेरे ऊरिगे वर्गवागि होदे. मत्ते नन्न ऊरिगे बंदाग आरु तिंगळु कळेदु होगिद्दवु. मोदलिनंते आ दारियल्लि बंदे. अल्लि हुणिसेमर इरलिल्ल. बोळु नेल मात्र काणिसुत्तित्तु!'

story-n10: 'एदे जोरागि बडिदुकोंडितु. अल्लि आट आडुत्तिद्द ओब्ब हुडुगनन्नु करेदु केळिदे: “ए तम्म... इल्लि हुंचि मर इत्तल्ल... एनाय्तु?” आत सप्पे मुख माडिकोंडु हेळिद- ``कडिदरु..कडिदुबिट्टरु..”'

story-n11: '“आं...आं...कडिदरे? याके? याके?” ओंदे उसिरिनल्लि केळिदे.'

story-n12: '``हुंचिमरदल्लि देव्वगोळु इरुत्तावंते. इदरल्लि देव्व वासमाड्तित्तंते, अदक्क कडिदुबिट्रु साव्कार्रु...”'

story-n13: 'आ हुडुग आकाशवन्नु नोडुत्त कंगालागि निंतुबिट्टनु.'

story-n14: 'मेले बिसिलु.. केळगे बोळु नेल...'

story-n15: 'अष्टु काल नानु प्रीतिसुत्तिद्द हुणिसेमर अंदु काणदागित्तु. मूढनंबिकेगे बलियागित्तु. एल्लो दूरदिंद अदे हुणेसेमर कूगि कोंडंते भासवायितु. “मनुष्यरु याके हीगे माडुत्तारे?”'

author-intro-1: 'श्री गुरुसिद्धय्य हुच्चय्य हन्नेरडुमठ अवरु 1940 मार्च् 13रंदु हुब्बळ्ळियल्लि जनिसिदरु. तंदे हुच्चय्य, तायि अन्नपूर्णम्म. 1963रल्लि कर्नाटक विश्व विद्यालयदल्लि एं. ए. पदवि पडेदरु. इळकल्लिन श्री विजय महांतेश्वर कले, विज्ञान हागू वाणिज्य महाविद्यालयदल्लि कन्नड प्राध्यापकरागि कार्यनिर्वहिसिदरु. कवन, कथे, नाटक, कादंबरि, विडंबने, विनोद, संपादने, व्यक्ति चित्रण इत्यादि 80 पुस्तकगळन्नु रचिसिद्दारे. अवुगळल्लि सोम साक्षात्कार, पंचारति, महातपस्वि, बंडेद्द बारकोलु, होळि मुंताद कृतिगळु सेरिवे. महातपस्वि, होळि मुंताद कृतिगळु चलनचित्रगळागि प्रसिद्धि पडेदिवे. प्रस्तुत कथेयन्नु कनकांबरियोंदिगे कंपिन पयण एंब सण्णकथेगळ संकलनदिंद अय्दुकोळ्ळलागिदे.'

ex-a-q1: '1. हुंचिहूवु तिन्नुवुदरिंद हल्लुगळु एनागुत्तवे?'

ex-a-q2: '2. डोरेहुणिसे एंदरेनु?'

ex-a-q3: '3. हुंचिमरद टोंगेगळन्नु हिडिदु हुडुगियरु एनु माडुत्तिद्दरु?'

ex-a-q4: '4. हुंचिमरद बळियल्लि हब्बद वातावरणविरलु यारु कारणवादरु?'

ex-a-q5: '5. मूढनंबिकेगे यावुदु बलियागित्तु?'
