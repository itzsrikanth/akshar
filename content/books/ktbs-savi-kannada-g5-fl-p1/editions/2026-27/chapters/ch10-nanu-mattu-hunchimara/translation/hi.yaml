  intro: 'प्रवेश'
  author_intro: 'कृतिकार का परिचय'
  exercise-A: 'अ. निम्नलिखित प्रश्नों के उत्तर दीजिए।'

intro-1: 'हमारे बीच कई तरह की अंधविश्वास जड़ जमा चुके हैं। उनके कारण हम ऐसे काम करते हैं जो नहीं करने चाहिए। पर्यावरण नष्ट करते हैं। किसी वैज्ञानिक सत्य को जानने का प्रयत्न नहीं करते। किसी के कहे किसी वचन को मनमाना अर्थ देने वाले लोगों से कितनी हानियाँ हो जाती हैं—इसके प्रति सावधान करना इस पाठ का उद्देश्य है।'

story-n1: 'मैं रास्ते पर चल रहा था। अचानक मेरे जूते रुक गए। धीरे से नीचे देखा तो… आह… इमली के फूल! ज़मीन पर पीले इमली के फूलों के ढेर। बचपन में मेरी एक विचित्र आदत थी—इमली के फूल खाना! कोमल दाँतों से फूल चट कर खाने वाला बगुला मैं बन गया था। खट्टा लगते ही पता चल जाता था कि दाँत ठंडे पड़ गए।'

story-n2: 'मेरे मुँह में पानी आ गया। धीरे झुककर पाँच-छह फूल चुनकर खाने की इच्छा हुई। पर… अब मैं छोटा लड़का नहीं… बड़ा हूँ… अच्छी तनख्वाह वाला… पैंट-जूते वाले… ऐसे समय… और सड़क पर खड़े… अगर मैं इमली के फूल चुनूँ तो लोग क्या कहेंगे? मैं उन्हें वहीं छोड़ दिया।'

story-n3: 'जूतों की खट-खट के साथ आगे बढ़ गया।'

story-n4: 'एक सप्ताह बाद उसी इमली के पेड़ के नीचे से जाते समय थोड़ी पकी कच्ची इमली की फलियाँ दिखीं। कुछ लड़के पेड़ पर पत्थर फेंककर फलियाँ गिराकर खा रहे थे। मेरे मुँह में घड़े भर पानी छलक आया। उन्हें डाँटने के बहाने रुककर कहा, “अरे… अरे… पत्थर मत मारो…! किसका सिर फोड़ना चाहते हो?”'

story-n5: 'मेरी डाँट से वे लड़के डरकर भाग निकले। “हाय!” मैंने कहा। उन्होंने जो पत्थर फेंका होता अगर सीधा मेरे सिर पर लगता तो भी मैं मना नहीं करता। इमली के फल से मुझे इतना प्रेम था।'

story-n6: 'कुछ दिनों बाद उसी पेड़ के रास्ते आया। अरे…! एक और विचित्र दृश्य देखा! इमली की झुकी लंबी डालियाँ पकड़कर कुछ लड़कियाँ झूला झूल रही थीं। एक क्षण रुका—हाँ! बचपन में मैं भी ऐसे ही झूला झूलता था।'

story-n7: 'दो-तीन सप्ताह बीत गए। उस इमली के पेड़ के पास पहुँचा तो वहाँ उत्सव का माहौल। कारण था «डोरे हुणिसे»। यानी न पूरी कच्ची इमली, न पूरा पका फल—बीच की अवस्था का पीला-हरा डोरे हुणिसे फल। अनोखे स्वाद का फल। इसका अद्भुत स्वाद आल्फांसो आम से भी बढ़कर!'

story-n8: 'एक और सप्ताह बीता। उस इमली के पेड़ के पास एक गोल चट्टान थी। शाम की हवा लेने के बहाने वहाँ जाकर बैठ गया। कठफोड़वा, कौआ, गौरैया, मैना, टिट्टिभ आदि पक्षी दिखे। उन पक्षी-मित्रों से बात की। वे सब उस इमली के पेड़ पर गा-गाकर आनंद ले रहे थे।'

story-n9: 'बाद में मेरा तबादला दूसरे शहर हो गया। जब फिर अपने शहर आया तो छह महीने बीत चुके थे। पहले की तरह उसी रास्ते आया। वहाँ इमली का पेड़ नहीं था। सिर्फ बंजर ज़मीन दिख रही थी!'

story-n10: 'सीना जोर से धड़कने लगा। वहाँ खेल रहे एक लड़के को बुलाकर पूछा, “अरे भाई… यहाँ इमली का पेड़ था न… क्या हुआ?” उसने फीका मुँह बनाकर कहा, “काट दिया… काट ही डाला…”'

story-n11: '“हाँ… हाँ… काट दिया? क्यों? क्यों?” एक साँस में पूछा।'

story-n12: '“कहते हैं इमली के पेड़ में भूत रहते हैं। इसमें भूत रहता था, इसलिए साहूकारों ने काट दिया…”'

story-n13: 'वह लड़का आकाश देखता हुआ स्तब्ध खड़ा रह गया।'

story-n14: 'ऊपर धूप… नीचे बंजर ज़मीन…'

story-n15: 'इतने समय से प्रेम किया हुआ इमली का पेड़ उस दिन अदृश्य हो चुका था। अंधविश्वास की बलि चढ़ गया था। कहीं दूर से वही इमली का पेड़ पुकारता-सा लगा। “मनुष्य ऐसा क्यों करते हैं?”'

author-intro-1: 'श्री गुरुसिद्धय्या हुच्चय्या हन्नेरडुमठ का जन्म 13 मार्च 1940 को हुब्बल्ली में हुआ। पिता हुच्चय्या, माता अन्नपूर्णम्मा। 1963 में कर्नाटक विश्वविद्यालय से एम.ए. की उपाधि प्राप्त की। इळकल्ल के श्री विजय महांतेश्वर कला, विज्ञान एवं वाणिज्य महाविद्यालय में कन्नड़ प्राध्यापक रहे। कविता, कहानी, नाटक, उपन्यास, व्यंग्य, विनोद, संपादन, व्यक्ति-चित्र आदि लगभग 80 पुस्तकें लिखी हैं। उनमें सोम साक्षात्कार, पंचारति, महातपस्वी, बंडेद्द बारकोलु, होळि आदि कृतियाँ शामिल हैं। महातपस्वी, होळि आदि कृतियाँ फ़िल्म बनकर प्रसिद्ध हुईं। प्रस्तुत कहानी «कनकांबरी» के साथ «कंपिन पयण» नामक लघुकथा संग्रह से चुनी गई है।'

ex-a-q1: '1. इमली के फूल खाने से दाँतों को क्या होता है?'

ex-a-q2: '2. डोरे हुणिसे क्या है?'

ex-a-q3: '3. इमली के पेड़ की डालियाँ पकड़कर लड़कियाँ क्या कर रही थीं?'

ex-a-q4: '4. इमली के पेड़ के पास उत्सव का माहौल होने का कारण कौन था?'

ex-a-q5: '5. अंधविश्वास की बलि क्या बनी थी?'
