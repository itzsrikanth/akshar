  exercise-A: 'A. Answer the following questions.'

intro-1: 'Many kinds of superstitions have settled among us. Because of them we do things we should not do. We destroy the environment. We do not try to find any scientific truth. This lesson aims to warn us about what harm can come from people who invent some meaning for whatever someone has said.'

story-n1: 'I was walking along the road. Suddenly my boots stopped. When I looked down gently… ah… tamarind flowers! The ground was covered with heaps of yellow tamarind flowers. When I was little I had a strange habit—eating tamarind flowers! With my tender teeth I used to gobble the flowers like a crane. As soon as they turned tangy, I knew my teeth were chilled.'

story-n2: 'My mouth watered. Gently bending, I felt like picking five or six flowers to eat. But… I am no longer a little boy… I am grown… well paid… in pants and boots… at a time like this… and standing on the road… if I pick tamarind flowers, what will people say? I left them there.'

story-n3: 'Clicking my boots, I went on.'

story-n4: 'A week later, when I passed under the same tamarind tree, I saw somewhat ripe young tamarind pods. Some boys were throwing stones at the tree, bringing pods down and eating them. A potful of water seemed to splash in my mouth. On the pretext of scolding them I stopped and said, “Hey… hey… don’t throw stones…! Whose head are you trying to break?”'

story-n5: 'Frightened by my scolding, the boys fled in all directions. “Oh dear!” I said. Even if a stone they threw had hit my head straight, I would not have minded. That is how much I loved tamarind fruit.'

story-n6: 'A few days later I came on the same tree’s path again. Oh…! I saw another strange sight! Holding the long drooping branches of the tamarind plant, some girls were swinging. I paused a moment—yes! When I was little I used to swing just like that.'

story-n7: 'Two or three weeks passed. When I came near that tamarind tree there was a festival atmosphere. The reason was “dore hunise”—neither fully raw tamarind nor fully ripe fruit, but the in-between yellow-green stage called dore hunise. A fruit of unique taste. Its wonderful flavour is better than Alphonso mango!'

story-n8: 'Another week passed. Near that tamarind tree there was a round boulder. On the pretext of taking the evening air I went and sat there. A woodpecker, crow, sparrow, myna, lapwing and other birds appeared. I talked with those bird-friends. They were all singing and rejoicing in that tamarind tree.'

story-n9: 'Later I was transferred to another town. When I returned to my town, six months had passed. I came along the same road as before. The tamarind tree was not there. Only bare ground could be seen!'

story-n10: 'My heart beat hard. I called a boy playing there and asked, “Hey little brother… there used to be a tamarind tree here… what happened?” With a blank face he said, “They cut it… they cut it down…”'

story-n11: '“Ah… ah… they cut it? Why? Why?” I asked in one breath.'

story-n12: '“They say ghosts live in tamarind trees. A ghost was living in this one, they say, so the landlords cut it down…”'

story-n13: 'Looking at the sky, that boy stood stunned.'

story-n14: 'Sunlight above… bare ground below…'

story-n15: 'The tamarind tree I had loved so long was gone that day. It had fallen victim to superstition. From somewhere far away that same tamarind tree seemed to cry out, “Why do people do this?”'

author-intro-1: 'Shri Gurusiddhayya Hucchayya Hanneradumatha was born on 13 March 1940 in Hubballi. Father Hucchayya, mother Annapurnamma. He obtained an M.A. from Karnatak University in 1963. He served as a Kannada professor at Shri Vijaya Mahanteshwara College of Arts, Science and Commerce, Ilkal. He has written about 80 books including poetry, stories, plays, novels, satire, humour, editing and character sketches. Among them are Soma Sakshatkara, Pancharati, Mahatapasyi, Bandedda Barakolu and Holi. Works such as Mahatapasyi and Holi became well known as films. The present story is selected from the short-story collection “Kampina Payana” along with “Kanakambari”.'

ex-a-q1: '1. What happens to the teeth from eating tamarind flowers?'

ex-a-q2: '2. What is dore hunise?'

ex-a-q3: '3. Holding the tamarind tree’s branches, what were the girls doing?'

ex-a-q4: '4. Who caused the festival atmosphere near the tamarind tree?'

ex-a-q5: '5. What had fallen victim to superstition?'
