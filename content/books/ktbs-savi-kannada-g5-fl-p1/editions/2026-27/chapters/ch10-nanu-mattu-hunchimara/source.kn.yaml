  exercise-A: ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ.

segments:
  - id: intro-1
    type: prose
    section: intro
    text: ಅನೇಕ ಬಗೆಯ ಮೂಢನಂಬಿಕೆಗಳು ನಮ್ಮ ನಡುವೆ ಬೀಡುಬಿಟ್ಟಿವೆ. ಆ ನಿಮಿತ್ತವಾಗಿ ನಾವು ಮಾಡಬಾರದ ಕೆಲಸಗಳನ್ನು ಮಾಡುತ್ತೇವೆ. ಪರಿಸರ ನಾಶ ಮಾಡುತ್ತೇವೆ. ಯಾವುದೇ ವೈಜ್ಞಾನಿಕ ಸತ್ಯವನ್ನು ಕಂಡುಕೊಳ್ಳಲು ಪ್ರಯತ್ನಿಸುವುದಿಲ್ಲ. ಯಾರೋ ಹೇಳಿದ ಯಾವುದೊ ಮಾತಿಗೆ ಏನೋ ಅರ್ಥ ಕಲ್ಪಿಸುವ ಜನರಿಂದ ಎಂಥೆಂಥ ಅನಾಹುತಗಳು ಆಗಿಬಿಡುತ್ತವೆ ಎಂಬುದನ್ನು ಕುರಿತು ಎಚ್ಚರಿಕೆ ನೀಡುವುದು ಪ್ರಸ್ತುತ ಪಾಠದ ಆಶಯ.

  - id: story-n1
    type: prose
    section: story
    text: ನಾನು ದಾರಿಯಲ್ಲಿ ನಡೆದು ಹೋಗುತ್ತಿದ್ದೆ. ನನ್ನ ಬೂಟುಗಳು ಇದ್ದಕ್ಕಿದ್ದಂತೆ ನಿಂತುಹೋದವು. ಮೆಲ್ಲನೆ ಕೆಳಗೆ ನೋಡಿದರೆ... ಆಹಾ... ಹುಂಚಿಹೂವು! ನೆಲದ ತುಂಬಾ ಹಳದಿಯ ಹುಂಚಿಹೂವುಗಳ ರಾಶಿರಾಶಿ. ಚಿಕ್ಕವನಿದ್ದಾಗ ನನಗೊಂದು ವಿಚಿತ್ರ ಹವ್ಯಾಸವಿತ್ತು. ಅದೆಂದರೆ ಹುಂಚಿಹೂವು ತಿನ್ನುವುದು! ಎಳೆಯ ಹಲ್ಲುಗಳಿಂದ ಹುಂಚಿಹೂವುಗಳನ್ನು ಬಕಬಕ ತಿನ್ನುವ ಬಕಪಕ್ಷಿ ನಾನಾಗಿದ್ದೆ. ಜುಮ್ಮೆಂದಾಗಲೇ ಹಲ್ಲು ಚಳಿತದ್ದು ಗೊತ್ತಾಗುತ್ತಿತ್ತು.

  - id: story-n2
    type: prose
    section: story
    text: ನನ್ನ ಬಾಯಲ್ಲಿ ನೀರೂರಿತು. ಮೆಲ್ಲನೆ ಬಗ್ಗಿ, ಐದಾರು ಹುಂಚಿಹೂವುಗಳನ್ನು ಆರಿಸಿಕೊಂಡು ತಿನ್ನುವಾಸೆ ಮೂಡಿತು. ಆದರೆ... ನಾನೀಗ ಪುಟ್ಟ ಹುಡುಗನಲ್ಲ...ದೊಡ್ಡವ.... ದೊಡ್ಡ ಪಗಾರದವ...ಪ್ಯಾಂಟು ಬೂಟು... ಇಂಥ ಕಾಲದಲ್ಲಿ... ಅದೂ ರಸ್ತೆಯಲ್ಲಿ ನಿಂತು... ನಾನು ಹುಂಚಿಹೂವು ಆರಿಸಿದರೆ ಜನ ಏನೆಂದಾರು? ಅದನ್ನು ಅಲ್ಲೇ ಬಿಟ್ಟೆ.

  - id: story-n3
    type: prose
    section: story
    text: ಬೂಟು ಖಟ್ ಖಟ್ ಊರುತ್ತಾ ಮುಂದೆ ಸಾಗಿಬಿಟ್ಟೆ.

  - id: story-n4
    type: prose
    section: story
    text: ಮುಂದೆ ಒಂದು ವಾರದ ಅನಂತರ ಅದೇ ಹುಣಿಸೆ ಮರದ ಕೆಳಗಿನಿಂದ ಹೋಗುವಾಗ ಸ್ವಲ್ಪ ಬಲಿತ ಎಳನಾಗರಕಾಯಿಗಳು ಕಂಡವು. ಕೆಲವು ಹುಡುಗರು ಹುಂಚಿಮರಕ್ಕೆ ಕಲ್ಲು ಎಸೆದು, ನಾಗರಕಾಯಿ ಬೀಳಿಸಿ ತಿನ್ನುತ್ತಿದ್ದರು. ನನ್ನ ಬಾಯಲ್ಲಿ ಹಂಡೆ ನೀರು ಛಿಲ್ಲೆಂದು ಚಿಮ್ಮಿತು. ಆ ಹುಡುಗರಿಗೆ ಜಬರಿಸುವ ನೆಪದಲ್ಲಿ ನಿಂತು ಅವರಿಗೆಂದೆ, “ಲೇ...ಲೇ...ಕಲ್ಲು ಹೊಡೀಬ್ಯಾಡ್ರಿ...! ಯಾರ ತಲೆ ಒಡೀಬೇಕಂತ ಮಾಡಿದ್ದೀರಿ?”

  - id: story-n5
    type: prose
    section: story
    text: ನನ್ನ ಗದರಿಕೆಗೆ ಆ ಹುಡುಗರು ಅಂಜಿ ದಿಕ್ಕಾಪಾಲಾಗಿ ಓಡಿಬಿಟ್ಟರು. “ಅಯ್ಯಯ್ಯೋ’’ ಅಂದೆ! ಅವರು ತೂರಿದ ಕಲ್ಲು ನೇರವಾಗಿ ನನ್ನ ತಲೆಗೆ ಬಡಿದಿದ್ದರೂ ನಾನು ಬೇಡ ಅನ್ನುತ್ತಿರಲಿಲ್ಲ. ಅಷ್ಟು ಪ್ರೀತಿ ನನಗೆ ಹುಂಚಿಕಾಯಿಯ ಮೇಲೆ.

  - id: story-n6
    type: prose
    section: story
    text: ಸ್ವಲ್ಪ ದಿನಗಳ ಅನಂತರ ಅದೇ ಮರದ ದಾರಿಗೆ ಬಂದೆ. ಅಬ್ಬಾ...! ಇನ್ನೂ ಒಂದು ವಿಚಿತ್ರ ಕಂಡೆ! ಹುಂಚಿಗಿಡದ ಇಳಿಬಿದ್ದ ಉದ್ದ ಟೊಂಗೆಗಳನ್ನು ಹಿಡಿದು ಕೆಲವು ಹುಡುಗಿಯರು ಜೋಕಾಲಿ ಜೀಕುತ್ತಿದ್ದರು. ಒಂದು ಕ್ಷಣ ನಿಂತೆ, ಹೌದು! ನಾನು ಚಿಕ್ಕವನಿದ್ದಾಗ ಹೀಗೆಯೇ ಜೋಕಾಲಿ ಜೀಕುತ್ತಿದ್ದೆ.

  - id: story-n7
    type: prose
    section: story
    text: ಎರಡು ಮೂರು ವಾರ ದಾಟಿದವು. ಆ ಹುಂಚಿಮರದ ಬಳಿಗೆ ಬಂದಾಗ ಅಲ್ಲಿ ಹಬ್ಬದ ವಾತಾವರಣ. ಕಾರಣ ‘ಡೋರೆ ಹುಣಿಸೆ’. ಅಂದರೆ....ಇತ್ತ ಕಾಯಿ ಹುಣಿಸೆಯು ಅಲ್ಲ; ಅತ್ತ ಹಣ್ಣು ಹುಣಿಸೆಯು ಅಲ್ಲ ...ಇದರ ಮಧ್ಯದ ಹಂತದ ಹಳದಿ-ಹಸಿರು ಬಣ್ಣದ ಡೋರೆಹುಣಿಸೆ ಹಣ್ಣು. ಒಂದು ವಿಶಿಷ್ಟ ರುಚಿಯ ಹಣ್ಣು. ಈ ಹಣ್ಣಿನ ಅದ್ಭುತ ರುಚಿಯು ಆಪೂಸ್ ಮಾವಿನ ಹಣ್ಣಿನ ರುಚಿಗಿಂತ ಮೇಲು!

  - id: story-n8
    type: prose
    section: story
    text: ಮತ್ತೊಂದು ವಾರ ಕಳೆಯಿತು. ಆ ಹುಣಿಸೆಮರದ ಹತ್ತಿರ ಒಂದು ದುಂಡಾದ ಬಂಡೆಗಲ್ಲು ಇತ್ತು. ನಾನು ಸಂಜೆ ಗಾಳಿ ಸೇವಿಸುವ ನೆಪಮಾಡಿಕೊಂಡು ಅಲ್ಲಿ ಹೋಗಿ ಕುಳಿತೆ. ಅಲ್ಲಿ ಮರಕುಟಿಗನ ಹಕ್ಕಿ, ಕಾಗೆ, ಗುಬ್ಬಿ, ಮೈನಾ, ಟಿಟ್ಟಿಭ ಮುಂತಾದ ಪಕ್ಷಿಗಳು ಕಾಣಿಸಿಕೊಂಡವು. ಆ ಹಕ್ಕಿಮಿತ್ರರೊಂದಿಗೆ ಮಾತಾಡಿದೆ. ಅವೆಲ್ಲವೂ ಆ ಹುಣಿಸೆಮರದಲ್ಲಿ ಹಾಡಿ ನಲಿಯುತ್ತಿದ್ದವು.

  - id: story-n9
    type: prose
    section: story
    text: ಆನಂತರ ನಾನು ಬೇರೆ ಊರಿಗೆ ವರ್ಗವಾಗಿ ಹೋದೆ. ಮತ್ತೆ ನನ್ನ ಊರಿಗೆ ಬಂದಾಗ ಆರು ತಿಂಗಳು ಕಳೆದು ಹೋಗಿದ್ದವು. ಮೊದಲಿನಂತೆ ಆ ದಾರಿಯಲ್ಲಿ ಬಂದೆ. ಅಲ್ಲಿ ಹುಣಿಸೆಮರ ಇರಲಿಲ್ಲ. ಬೋಳು ನೆಲ ಮಾತ್ರ ಕಾಣಿಸುತ್ತಿತ್ತು!

  - id: story-n10
    type: prose
    section: story
    text: 'ಎದೆ ಜೋರಾಗಿ ಬಡಿದುಕೊಂಡಿತು. ಅಲ್ಲಿ ಆಟ ಆಡುತ್ತಿದ್ದ ಒಬ್ಬ ಹುಡುಗನನ್ನು ಕರೆದು ಕೇಳಿದೆ: “ಏ ತಮ್ಮ... ಇಲ್ಲಿ ಹುಂಚಿ ಮರ ಇತ್ತಲ್ಲ... ಏನಾಯ್ತು?” ಆತ ಸಪ್ಪೆ ಮುಖ ಮಾಡಿಕೊಂಡು ಹೇಳಿದ- ``ಕಡಿದರು..ಕಡಿದುಬಿಟ್ಟರು..”'

  - id: story-n11
    type: prose
    section: story
    text: “ಆಂ...ಆಂ...ಕಡಿದರೆ? ಯಾಕೆ? ಯಾಕೆ?” ಒಂದೇ ಉಸಿರಿನಲ್ಲಿ ಕೇಳಿದೆ.

  - id: story-n12
    type: prose
    section: story
    text: "``ಹುಂಚಿಮರದಲ್ಲಿ ದೆವ್ವಗೋಳು ಇರುತ್ತಾವಂತೆ. ಇದರಲ್ಲಿ ದೆವ್ವ ವಾಸಮಾಡ್ತಿತ್ತಂತೆ, ಅದಕ್ಕ ಕಡಿದುಬಿಟ್ರು ಸಾವ್ಕಾರ್ರು...”"

  - id: story-n13
    type: prose
    section: story
    text: ಆ ಹುಡುಗ ಆಕಾಶವನ್ನು ನೋಡುತ್ತ ಕಂಗಾಲಾಗಿ ನಿಂತುಬಿಟ್ಟನು.

  - id: story-n14
    type: prose
    section: story
    text: ಮೇಲೆ ಬಿಸಿಲು.. ಕೆಳಗೆ ಬೋಳು ನೆಲ...

  - id: story-n15
    type: prose
    section: story
    text: ಅಷ್ಟು ಕಾಲ ನಾನು ಪ್ರೀತಿಸುತ್ತಿದ್ದ ಹುಣಿಸೆಮರ ಅಂದು ಕಾಣದಾಗಿತ್ತು. ಮೂಢನಂಬಿಕೆಗೆ ಬಲಿಯಾಗಿತ್ತು. ಎಲ್ಲೋ ದೂರದಿಂದ ಅದೇ ಹುಣೆಸೆಮರ ಕೂಗಿ ಕೊಂಡಂತೆ ಭಾಸವಾಯಿತು. “ಮನುಷ್ಯರು ಯಾಕೆ ಹೀಗೆ ಮಾಡುತ್ತಾರೆ?”

  - id: author-intro-1
    type: prose
    section: author_intro
    text: ಶ್ರೀ ಗುರುಸಿದ್ಧಯ್ಯ ಹುಚ್ಚಯ್ಯ ಹನ್ನೆರಡುಮಠ ಅವರು 1940 ಮಾರ್ಚ್ 13ರಂದು ಹುಬ್ಬಳ್ಳಿಯಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಹುಚ್ಚಯ್ಯ, ತಾಯಿ ಅನ್ನಪೂರ್ಣಮ್ಮ. 1963ರಲ್ಲಿ ಕರ್ನಾಟಕ ವಿಶ್ವ ವಿದ್ಯಾಲಯದಲ್ಲಿ ಎಂ. ಎ. ಪದವಿ ಪಡೆದರು. ಇಳಕಲ್ಲಿನ ಶ್ರೀ ವಿಜಯ ಮಹಾಂತೇಶ್ವರ ಕಲೆ, ವಿಜ್ಞಾನ ಹಾಗೂ ವಾಣಿಜ್ಯ ಮಹಾವಿದ್ಯಾಲಯದಲ್ಲಿ ಕನ್ನಡ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿ ಕಾರ್ಯನಿರ್ವಹಿಸಿದರು. ಕವನ, ಕಥೆ, ನಾಟಕ, ಕಾದಂಬರಿ, ವಿಡಂಬನೆ, ವಿನೋದ, ಸಂಪಾದನೆ, ವ್ಯಕ್ತಿ ಚಿತ್ರಣ ಇತ್ಯಾದಿ 80 ಪುಸ್ತಕಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಅವುಗಳಲ್ಲಿ ಸೋಮ ಸಾಕ್ಷಾತ್ಕಾರ, ಪಂಚಾರತಿ, ಮಹಾತಪಸ್ವಿ, ಬಂಡೆದ್ದ ಬಾರಕೋಲು, ಹೋಳಿ ಮುಂತಾದ ಕೃತಿಗಳು ಸೇರಿವೆ. ಮಹಾತಪಸ್ವಿ, ಹೋಳಿ ಮುಂತಾದ ಕೃತಿಗಳು ಚಲನಚಿತ್ರಗಳಾಗಿ ಪ್ರಸಿದ್ಧಿ ಪಡೆದಿವೆ. ಪ್ರಸ್ತುತ ಕಥೆಯನ್ನು ಕನಕಾಂಬರಿಯೊಂದಿಗೆ ಕಂಪಿನ ಪಯಣ ಎಂಬ ಸಣ್ಣಕಥೆಗಳ ಸಂಕಲನದಿಂದ ಅಯ್ದುಕೊಳ್ಳಲಾಗಿದೆ.

  - id: ex-a-q1
    type: question
    exercise: A
    text: 1. ಹುಂಚಿಹೂವು ತಿನ್ನುವುದರಿಂದ ಹಲ್ಲುಗಳು ಏನಾಗುತ್ತವೆ?

  - id: ex-a-q2
    type: question
    exercise: A
    text: 2. ಡೋರೆಹುಣಿಸೆ ಎಂದರೇನು?

  - id: ex-a-q3
    type: question
    exercise: A
    text: 3. ಹುಂಚಿಮರದ ಟೊಂಗೆಗಳನ್ನು ಹಿಡಿದು ಹುಡುಗಿಯರು ಏನು ಮಾಡುತ್ತಿದ್ದರು?

  - id: ex-a-q4
    type: question
    exercise: A
    text: 4. ಹುಂಚಿಮರದ ಬಳಿಯಲ್ಲಿ ಹಬ್ಬದ ವಾತಾವರಣವಿರಲು ಯಾರು ಕಾರಣವಾದರು?

  - id: ex-a-q5
    type: question
    exercise: A
    text: 5. ಮೂಢನಂಬಿಕೆಗೆ ಯಾವುದು ಬಲಿಯಾಗಿತ್ತು?
