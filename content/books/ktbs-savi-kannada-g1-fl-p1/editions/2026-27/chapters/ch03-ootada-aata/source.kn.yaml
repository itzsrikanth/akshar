- id: ex-a-intro
  type: prose
  exercise: A
  text: ಅ) ನೀಡಿರುವ ಪದಗಳನ್ನು ಹೇಳಿ, ಮಕ್ಕಳಿಂದ ಹೇಳಿಸಿ.
