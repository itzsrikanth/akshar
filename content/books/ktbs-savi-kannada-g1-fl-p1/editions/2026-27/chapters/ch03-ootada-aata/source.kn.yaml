- id: ex-b-intro
  type: prose
  exercise: B
  text: ಆ) ಈ ಪ್ರಾಸ ಪದಗಳನ್ನು ಹೇಳಿ, ಮಕ್ಕಳಿಂದ ಹೇಳಿಸಿ.
