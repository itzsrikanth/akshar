- id: ex-c-intro
  type: prose
  exercise: C
  text: ಇ) ಪದ್ಯದ ಸಾಲುಗಳನ್ನು ಕೆಳಗೆ ನೀಡಿದೆ. ಆ ಸಾಲುಗಳಲ್ಲಿ ಒಂದೊಂದು ಪದವನ್ನು ಬಿಡಲಾಗಿದೆ. ಬಿಟ್ಟಿರುವ ಪದವನ್ನು ಮಕ್ಕಳಿಂದ ಹೇಳಿಸಿ.
- id: ex-c-q1
  type: fill_blank
  exercise: C
  text: 1) ಒಂದು ಎರಡು _____ ಹರಡು.
- id: ex-c-q2
  type: fill_blank
  exercise: C
  text: 2) ಮೂರು ನಾಲ್ಕು _____ ಹಾಕು.
- id: ex-c-q3
  type: fill_blank
  exercise: C
  text: 3) ಐದು ಆರು _____ ಸಾರು.
- id: ex-c-q4
  type: fill_blank
  exercise: C
  text: 4) ಏಳು ಎಂಟು ______ ದಂಟು.
- id: ex-c-q5
  type: fill_blank
  exercise: C
  text: 5) ಒಂಬತ್ತು ಹತ್ತು _____ ಮುದಿರೆತ್ತು.
- id: ex-d-intro
  type: prose
  exercise: D
  text: ಈ) ಚಿತ್ರಗಳನ್ನು ತೋರಿಸಿ, ಪಕ್ಕದಲ್ಲಿರುವ ಪ್ರಶ್ನೆಗಳನ್ನು ಕೇಳಿ ಮಕ್ಕಳಿಂದ ಉತ್ತರ ಪಡೆಯಿರಿ.
- id: ex-d-q1
  type: question
  exercise: D
  text: ಈ ಹಣ್ಣಿನ ಹೆಸರೇನು?
- id: ex-d-q2
  type: question
  exercise: D
  text: ಇಲ್ಲಿ ಎಷ್ಟು ಹಣ್ಣಿದೆ?
- id: ex-d-q3
  type: question
  exercise: D
  text: ಈ ಚಿತ್ರದಲ್ಲಿರುವ ಹಣ್ಣಿನ ಹೆಸರೇನು?
- id: ex-d-q4
  type: question
  exercise: D
  text: ಇಲ್ಲಿ ಎಷ್ಟು ಹಣ್ಣುಗಳಿವೆ?
- id: ex-d-q5
  type: question
  exercise: D
  text: ಈ ಚಿತ್ರದಲ್ಲಿರುವ ಕಾಯಿಗಳ ಹೆಸರೇನು?
- id: ex-d-q6
  type: question
  exercise: D
  text: ಇಲ್ಲಿ ಎಷ್ಟು ಕಾಯಿಗಳಿವೆ?
- id: ex-d-q7
  type: question
  exercise: D
  text: ಈ ಚಿತ್ರದಲ್ಲಿರುವ ತರಕಾರಿಯ ಹೆಸರೇನು?
