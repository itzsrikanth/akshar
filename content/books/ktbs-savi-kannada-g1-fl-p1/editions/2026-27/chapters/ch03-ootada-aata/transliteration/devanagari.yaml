ex-c-intro: इ) पद्यद सालुगळन्नु कॆळगॆ नीडिदॆ. आ सालुगळल्लि ऒंदॊंदु पदवन्नु बिडलागिदॆ. बिट्टिरुव पदवन्नु मक्कळिंद हेळिसि.
