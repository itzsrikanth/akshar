ex-c-q5: 5) ऒंबत्तु हत्तु _____ मुदिरॆत्तु.
ex-d-intro: ई) चित्रगळन्नु तोरिसि, पक्कदल्लिरुव प्रश्नॆगळन्नु केळि मक्कळिंद उत्तर पडॆयिरि.
ex-d-q1: ई हण्णिन हॆसरेनु?
ex-d-q2: इल्लि ऎष्टु हण्णिदॆ?
