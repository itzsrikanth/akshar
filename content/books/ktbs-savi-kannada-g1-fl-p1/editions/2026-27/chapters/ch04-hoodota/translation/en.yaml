ex-a-intro: A) Lesson sentences are given below. Add the missing word and have the children say them.
ex-a-q1: 1) I like ___________ coming to the flower garden.
ex-a-q2: 2) May I go and play ___________ for a little while?
ex-a-q3: 3) Is your ___________ finished?
ex-a-q4: 4) You are very ___________
ex-b-intro: B) Ask the children questions and have them answer.
ex-b-q1: 1) Where did grandmother go every evening?
ex-b-q2: 2) What is good exercise for the body?
ex-b-q3: 3) Which game did Suma play?
ex-c-intro: C) Ask the children who said/asked whom, and get the answer.
ex-c-q1: 1) “Grandmother, you come to the flower garden every evening, don’t you?” — who asked this?
ex-c-q2: 2) “Walking is good exercise for the body. This exercise is necessary for health.” — who said this?
ex-c-q3: 3) “It is good for children to develop such good habits from childhood.” — who said this?
ex-d-intro: D) Read these sentences aloud and have the children say them.
ex-d-q1: 1) I bathe every day.
ex-d-q2: 2) There are many houses in our town.
ex-d-q3: 3) My friend is very clever.
ex-e-intro: E) Tell them to name the flowers in the pictures.
