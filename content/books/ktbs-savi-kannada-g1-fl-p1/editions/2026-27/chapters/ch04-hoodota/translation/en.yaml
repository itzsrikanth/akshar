intro-1: A) Tell them to colour these pictures.
story-intro: (Read the conversation in this lesson, tell it, and have the children say it)
story-d1: Grandmother, you come to the flower garden every evening, don’t you?
story-d2: Yes, child, I like coming to the flower garden very much.
story-d3: Grandmother, many people walk here, why?
story-d4: Walking is good exercise for the body. This exercise is necessary for health.
story-d5: Grandmother, there is a swing there; may I go and swing for a little while?
story-d6: Play, child. I will walk a little and come.
story-n1: (After a little time)
story-d7: Have you finished swinging, child?
story-d8: Yes, grandmother, is your walk finished?
story-d9: Yes, child, shall we go home now?
story-d10: Grandmother, I will come to the flower garden with you every day.
story-d11: You are very clever; it is good for children to develop such good habits from childhood.
