ex-a-intro: अ) पाठ के वाक्य नीचे दिए हैं। छूटे शब्द जोड़कर बच्चों से बुलवाएँ।
ex-a-q1: 1) बगीचे में आने में मुझे ___________ अच्छा लगता है।
ex-a-q2: 2) क्या मैं जाकर थोड़ी देर ___________ खेलूँ?
ex-a-q3: 3) आपकी ___________ पूरी हुई?
ex-a-q4: 4) तुम बहुत ___________
ex-b-intro: आ) बच्चों से प्रश्न पूछें, उत्तर बुलवाएँ।
ex-b-q1: 1) दादी रोज़ शाम कहाँ जाती थीं?
ex-b-q2: 2) शरीर के लिए अच्छा व्यायाम कौन-सा है?
ex-b-q3: 3) सुमा ने कौन-सा खेल खेला?
ex-c-intro: इ) किसने किससे कहा/पूछा, बच्चों से पूछकर उत्तर लें।
ex-c-q1: 1) “दादी, आप रोज़ शाम बगीचे में आती हैं?” — यह किसने पूछा?
ex-c-q2: 2) “चलना शरीर के लिए अच्छा व्यायाम है…” — यह किसने कहा?
ex-c-q3: 3) “बच्चों को बचपन से ऐसे अच्छे अभ्यास अपनाने चाहिए।” — यह किसने कहा?
ex-d-intro: ई) ये वाक्य पढ़कर सुनाएँ, बच्चों से बुलवाएँ।
ex-d-q1: 1) मैं रोज़ नहाना करता/करती हूँ।
ex-d-q2: 2) हमारे गाँव में बहुत घर हैं।
ex-d-q3: 3) मेरी सहेली बहुत होशियार है।
ex-e-intro: उ) चित्रों में फूलों के नाम बताने को कहें।
