intro-1: अ) इन चित्रों में रंग भरने को कहें।
story-intro: (इस पाठ की बातचीत पढ़कर सुनाएँ, बच्चों से बुलवाएँ)
story-d1: दादी, आप रोज़ शाम फूलों के बगीचे में आती हैं, है न?
story-d2: हाँ बच्ची, बगीचे में आने में मुझे बहुत अच्छा लगता है।
story-d3: दादी, यहाँ बहुत लोग टहलते हैं, क्यों?
story-d4: चलना शरीर के लिए अच्छा व्यायाम है। यह व्यायाम स्वास्थ्य के लिए ज़रूरी है।
story-d5: दादी, वहाँ झूला है, क्या मैं जाकर थोड़ी देर झूलूँ?
story-d6: खेलो बच्ची। मैं थोड़ी टहलकर आती हूँ।
story-n1: (थोड़ी देर बाद)
story-d7: झूल लिया न बच्ची?
story-d8: हाँ दादी, आपकी सैर पूरी हुई?
story-d9: हाँ बच्ची, अब घर चलें?
story-d10: दादी, मैं रोज़ आपके साथ बगीचे में आऊँगी।
story-d11: तुम बहुत होशियार हो; बच्चों को बचपन से ऐसे अच्छे अभ्यास अपनाने चाहिए।
