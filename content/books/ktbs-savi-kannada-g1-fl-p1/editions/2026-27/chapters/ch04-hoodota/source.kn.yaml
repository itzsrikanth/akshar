- id: ex-a-intro
  type: prose
  exercise: A
  text: ಅ) ಪಾಠದ ವಾಕ್ಯಗಳನ್ನು ಕೆಳಗೆ ನೀಡಿದೆ. ಬಿಟ್ಟಿರುವ ಪದವನ್ನು ಸೇರಿಸಿ ಮಕ್ಕಳಿಂದ ಹೇಳಿಸಿ.
- id: ex-a-q1
  type: fill_blank
  exercise: A
  text: 1) ಹೂದೋಟಕ್ಕೆ ಬರಲು ನನಗೆ ___________ ಇಷ್ಟ.
- id: ex-a-q2
  type: fill_blank
  exercise: A
  text: 2) ನಾನು ಹೋಗಿ ಸ್ವಲ್ಪ ಹೊತ್ತು ___________ ಆಡಲೇ?
- id: ex-a-q3
  type: fill_blank
  exercise: A
  text: 3) ನಿಮ್ಮ ___________ ಆಯಿತೇ?
- id: ex-a-q4
  type: fill_blank
  exercise: A
  text: 4) ನೀನು ತುಂಬಾ ___________
- id: ex-b-intro
  type: prose
  exercise: B
  text: ಆ) ಮಕ್ಕಳಿಗೆ ಪ್ರಶ್ನೆ ಕೇಳಿ, ಉತ್ತರ ಹೇಳಿಸಿ.
- id: ex-b-q1
  type: question
  exercise: B
  text: 1) ಅಜ್ಜಿ ದಿನಾಲು ಸಂಜೆ ಎಲ್ಲಿಗೆ ಹೋಗುತ್ತಿದ್ದರು?
- id: ex-b-q2
  type: question
  exercise: B
  text: 2) ದೇಹಕ್ಕೆ ಒಳ್ಳೆಯ ವ್ಯಾಯಾಮ ಯಾವುದು?
- id: ex-b-q3
  type: question
  exercise: B
  text: 3) ಸುಮಾ ಯಾವ ಆಟ ಆಡಿದಳು?
- id: ex-c-intro
  type: prose
  exercise: C
  text: ಇ) ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು/ಕೇಳಿದರು ಎಂದು ಮಕ್ಕಳನ್ನು ಕೇಳಿ, ಉತ್ತರ ಪಡೆಯಿರಿ.
- id: ex-c-q1
  type: question
  exercise: C
  text: 1) ಅಜ್ಜೀ, ನೀವು ದಿನಾಲೂ ಸಂಜೆ ಹೂದೋಟಕ್ಕೆ ಬರುತ್ತೀರಿ ಅಲ್ಲವೆ? - ಎಂದು ಕೇಳಿದವರು ಯಾರು?
- id: ex-c-q2
  type: question
  exercise: C
  text: 2) ನಡೆಯುವುದು ದೇಹಕ್ಕೆ ಒಳ್ಳೆಯ ವ್ಯಾಯಾಮ. ಈ ವ್ಯಾಯಾಮ ಆರೋಗ್ಯಕ್ಕೆ ಅಗತ್ಯ. - ಎಂದು ಹೇಳಿದವರು ಯಾರು?
- id: ex-c-q3
  type: question
  exercise: C
  text: 3) ಮಕ್ಕಳು ಚಿಕ್ಕಂದಿನಿಂದಲೂ ಇಂಥ ಒಳ್ಳೆಯ ಅಭ್ಯಾಸಗಳನ್ನು ಬೆಳೆಸಿಕೊಳ್ಳುವುದು ಒಳ್ಳೆಯದು. - ಎಂದು ಹೇಳಿದವರು ಯಾರು?
- id: ex-d-intro
  type: prose
  exercise: D
  text: ಈ) ಈ ಕೆಳಗಿನ ವಾಕ್ಯಗಳನ್ನು ಓದಿ ಹೇಳಿ, ಮಕ್ಕಳಿಂದ ಹೇಳಿಸಿ.
- id: ex-d-q1
  type: prose
  exercise: D
  text: 1) ನಾನು ದಿನಾಲೂ ಸ್ನಾನ ಮಾಡುತ್ತೇನೆ.
- id: ex-d-q2
  type: prose
  exercise: D
  text: 2) ನಮ್ಮ ಊರಿನಲ್ಲಿ ಹಲವಾರು ಮನೆಗಳಿವೆ.
- id: ex-d-q3
  type: prose
  exercise: D
  text: 3) ನನ್ನ ಗೆಳತಿ ತುಂಬಾ ಜಾಣೆ.
- id: ex-e-intro
  type: prose
  exercise: E
  text: ಉ) ಚಿತ್ರಗಳಲ್ಲಿರುವ ಹೂಗಳನ್ನು ಹೆಸರಿಸಲು ಹೇಳಿ.
