segments:
- id: intro-1
  type: prose
  section: intro
  text: ಅ) ಈ ಚಿತ್ರಗಳಿಗೆ ಬಣ್ಣ ತುಂಬಲು ತಿಳಿಸಿ.
- id: story-intro
  type: prose
  section: story
  text: (ಈ ಪಾಠದಲ್ಲಿರುವ ಸಂಭಾಷಣೆಯನ್ನು ಓದಿ ಹೇಳಿ, ಮಕ್ಕಳಿಂದ ಹೇಳಿಸಿ)
- id: story-d1
  type: dialogue
  section: story
  speaker: ಸುಮಾ
  text: ಅಜ್ಜೀ, ನೀವು ದಿನಾಲೂ ಸಂಜೆ ಹೂದೋಟಕ್ಕೆ ಬರುತ್ತೀರಿ ಅಲ್ಲವೆ?
- id: story-d2
  type: dialogue
  section: story
  speaker: ಅಜ್ಜಿ
  text: ಹೌದು ಮಗು, ಹೂದೋಟಕ್ಕೆ ಬರಲು ನನಗೆ ತುಂಬಾ ಇಷ್ಟ.
- id: story-d3
  type: dialogue
  section: story
  speaker: ಸುಮಾ
  text: ಅಜ್ಜಿ, ಇಲ್ಲಿ ಹಲವಾರು ಮಂದಿ ನಡೆಯುತ್ತಾರಲ್ಲ, ಏಕೆ?
- id: story-d4
  type: dialogue
  section: story
  speaker: ಅಜ್ಜಿ
  text: ನಡೆಯುವುದು ದೇಹಕ್ಕೆ ಒಳ್ಳೆಯ ವ್ಯಾಯಾಮ. ಈ ವ್ಯಾಯಾಮ ಆರೋಗ್ಯಕ್ಕೆ ಅಗತ್ಯ.
- id: story-d5
  type: dialogue
  section: story
  speaker: ಸುಮಾ
  text: ಅಜ್ಜಿ, ಅಲ್ಲಿ ಜೋಕಾಲಿ ಇದೆ, ನಾನು ಹೋಗಿ ಸ್ವಲ್ಪ ಹೊತ್ತು ಜೋಕಾಲಿ ಆಡಲೇ?
- id: story-d6
  type: dialogue
  section: story
  speaker: ಅಜ್ಜಿ
  text: ಆಡು ಮಗು. ನಾನು ಸ್ವಲ್ಪ ನಡೆದಾಡಿ ಬರುತ್ತೇನೆ.
- id: story-n1
  type: prose
  section: story
  text: (ಸ್ವಲ್ಪ ಸಮಯದ ಬಳಿಕ)
- id: story-d7
  type: dialogue
  section: story
  speaker: ಅಜ್ಜಿ
  text: ಜೋಕಾಲಿ ಆಡಿದ್ದು ಆಯಿತೆ ಮಗು?
- id: story-d8
  type: dialogue
  section: story
  speaker: ಸುಮಾ
  text: ಆಯಿತು ಅಜ್ಜಿ, ನಿಮ್ಮ ನಡೆದಾಟ ಆಯಿತೇ?
- id: story-d9
  type: dialogue
  section: story
  speaker: ಅಜ್ಜಿ
  text: ಆಯಿತು ಮಗು, ಈಗ ಮನೆಗೆ ಹೋಗೋಣವೇ?
- id: story-d10
  type: dialogue
  section: story
  speaker: ಸುಮಾ
  text: ಅಜ್ಜಿ, ನಾನು ದಿನಾಲೂ ನಿಮ್ಮ ಜೊತೆ ಹೂದೋಟಕ್ಕೆ ಬರುವೆ.
- id: story-d11
  type: dialogue
  section: story
  speaker: ಅಜ್ಜಿ
  text: ನೀನು ತುಂಬಾ ಜಾಣೆ, ಮಕ್ಕಳು ಚಿಕ್ಕಂದಿನಿಂದಲೇ ಇಂಥ ಒಳ್ಳೆಯ ಅಭ್ಯಾಸಗಳನ್ನು ಬೆಳೆಸಿಕೊಳ್ಳುವುದು ಒಳ್ಳೆಯದು.
