intro-1: a) ī citragaḻigè baṇṇa tuṃbalu tiḻisi.
story-intro: (ī pāṭhadalliruva saṃbhāṣaṇèyannu odi heḻi, makkaḻiṃda heḻisi)
story-d1: ajjī, nīvu dinālū saṃjè hūdoṭakkè baruttīri allavè?
story-d2: haudu magu, hūdoṭakkè baralu nanagè tuṃbā iṣṭa.
story-d3: ajji, illi halavāru maṃdi naḍèyuttāralla, ekè?
story-d4: naḍèyuvudu dehakkè òḻḻèya vyāyāma. ī vyāyāma ārogyakkè agatya.
story-d5: ajji, alli jokāli idè, nānu hogi svalpa hòttu jokāli āḍale?
story-d6: āḍu magu. nānu svalpa naḍèdāḍi baruttenè.
story-n1: (svalpa samayada baḻika)
story-d7: jokāli āḍiddu āyitè magu?
story-d8: āyitu ajji, nimma naḍèdāṭa āyite?
story-d9: āyitu magu, īga manègè hogoṇave?
story-d10: ajji, nānu dinālū nimma jòtè hūdoṭakkè baruvè.
story-d11: nīnu tuṃbā jāṇè, makkaḻu cikkaṃdiniṃdale iṃtha òḻḻèya abhyāsagaḻannu bèḻèsikòḻḻuvudu òḻḻèyadu.
