ex-a-intro: a) pāṭhada vākyagaḻannu kèḻagè nīḍidè. biṭṭiruva padavannu serisi makkaḻiṃda heḻisi.
ex-a-q1: 1) hūdoṭakkè baralu nanagè ___________ iṣṭa.
ex-a-q2: 2) nānu hogi svalpa hòttu ___________ āḍale?
ex-a-q3: 3) nimma ___________ āyite?
ex-a-q4: 4) nīnu tuṃbā ___________
ex-b-intro: ā) makkaḻigè praśnè keḻi, uttara heḻisi.
ex-b-q1: 1) ajji dinālu saṃjè èlligè hoguttiddaru?
ex-b-q2: 2) dehakkè òḻḻèya vyāyāma yāvudu?
ex-b-q3: 3) sumā yāva āṭa āḍidaḻu?
ex-c-intro: i) yāru yārigè heḻidaru/keḻidaru èṃdu makkaḻannu keḻi, uttara paḍèyiri.
ex-c-q1: 1) ajjī, nīvu dinālū saṃjè hūdoṭakkè baruttīri allavè? - èṃdu keḻidavaru yāru?
ex-c-q2: 2) naḍèyuvudu dehakkè òḻḻèya vyāyāma. ī vyāyāma ārogyakkè agatya. - èṃdu heḻidavaru yāru?
ex-c-q3: 3) makkaḻu cikkaṃdiniṃdalū iṃtha òḻḻèya abhyāsagaḻannu bèḻèsikòḻḻuvudu òḻḻèyadu. - èṃdu heḻidavaru yāru?
ex-d-intro: ī) ī kèḻagina vākyagaḻannu odi heḻi, makkaḻiṃda heḻisi.
ex-d-q1: 1) nānu dinālū snāna māḍuttenè.
ex-d-q2: 2) namma ūrinalli halavāru manègaḻivè.
ex-d-q3: 3) nanna gèḻati tuṃbā jāṇè.
ex-e-intro: u) citragaḻalliruva hūgaḻannu hèsarisalu heḻi.
