intro-1: अ) ई चित्रगळिगॆ बण्ण तुंबलु तिळिसि.
story-intro: (ई पाठदल्लिरुव संभाषणॆयन्नु ओदि हेळि, मक्कळिंद हेळिसि)
story-d1: अज्जी, नीवु दिनालू संजॆ हूदोटक्कॆ बरुत्तीरि अल्लवॆ?
story-d2: हौदु मगु, हूदोटक्कॆ बरलु ननगॆ तुंबा इष्ट.
story-d3: अज्जि, इल्लि हलवारु मंदि नडॆयुत्तारल्ल, एकॆ?
story-d4: नडॆयुवुदु देहक्कॆ ऒळ्ळॆय व्यायाम. ई व्यायाम आरोग्यक्कॆ अगत्य.
story-d5: अज्जि, अल्लि जोकालि इदॆ, नानु होगि स्वल्प हॊत्तु जोकालि आडले?
story-d6: आडु मगु. नानु स्वल्प नडॆदाडि बरुत्तेनॆ.
story-n1: (स्वल्प समयद बळिक)
story-d7: जोकालि आडिद्दु आयितॆ मगु?
story-d8: आयितु अज्जि, निम्म नडॆदाट आयिते?
story-d9: आयितु मगु, ईग मनॆगॆ होगोणवे?
story-d10: अज्जि, नानु दिनालू निम्म जॊतॆ हूदोटक्कॆ बरुवॆ.
story-d11: नीनु तुंबा जाणॆ, मक्कळु चिक्कंदिनिंदले इंथ ऒळ्ळॆय अभ्यासगळन्नु बॆळॆसिकॊळ्ळुवुदु ऒळ्ळॆयदु.
