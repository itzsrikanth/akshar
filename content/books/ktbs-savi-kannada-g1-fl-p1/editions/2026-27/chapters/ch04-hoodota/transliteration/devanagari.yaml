ex-a-intro: अ) पाठद वाक्यगळन्नु कॆळगॆ नीडिदॆ. बिट्टिरुव पदवन्नु सेरिसि मक्कळिंद हेळिसि.
ex-a-q1: 1) हूदोटक्कॆ बरलु ननगॆ ___________ इष्ट.
ex-a-q2: 2) नानु होगि स्वल्प हॊत्तु ___________ आडले?
ex-a-q3: 3) निम्म ___________ आयिते?
ex-a-q4: 4) नीनु तुंबा ___________
ex-b-intro: आ) मक्कळिगॆ प्रश्नॆ केळि, उत्तर हेळिसि.
ex-b-q1: 1) अज्जि दिनालु संजॆ ऎल्लिगॆ होगुत्तिद्दरु?
ex-b-q2: 2) देहक्कॆ ऒळ्ळॆय व्यायाम यावुदु?
ex-b-q3: 3) सुमा याव आट आडिदळु?
ex-c-intro: इ) यारु यारिगॆ हेळिदरु/केळिदरु ऎंदु मक्कळन्नु केळि, उत्तर पडॆयिरि.
ex-c-q1: 1) अज्जी, नीवु दिनालू संजॆ हूदोटक्कॆ बरुत्तीरि अल्लवॆ? - ऎंदु केळिदवरु यारु?
ex-c-q2: 2) नडॆयुवुदु देहक्कॆ ऒळ्ळॆय व्यायाम. ई व्यायाम आरोग्यक्कॆ अगत्य. - ऎंदु हेळिदवरु यारु?
ex-c-q3: 3) मक्कळु चिक्कंदिनिंदलू इंथ ऒळ्ळॆय अभ्यासगळन्नु बॆळॆसिकॊळ्ळुवुदु ऒळ्ळॆयदु. - ऎंदु हेळिदवरु यारु?
ex-d-intro: ई) ई कॆळगिन वाक्यगळन्नु ओदि हेळि, मक्कळिंद हेळिसि.
ex-d-q1: 1) नानु दिनालू स्नान माडुत्तेनॆ.
ex-d-q2: 2) नम्म ऊरिनल्लि हलवारु मनॆगळिवॆ.
ex-d-q3: 3) नन्न गॆळति तुंबा जाणॆ.
ex-e-intro: उ) चित्रगळल्लिरुव हूगळन्नु हॆसरिसलु हेळि.
