story-intro: (पाठ पढ़कर सुनाएँ)
story-n1: एक गाँव था। उस गाँव का नाम मल्लिगेहल्ली था। उस गाँव में एक बगीचा था। उस बगीचे में एक मुर्गी अपने बच्चों के साथ रहती थी। उसी बगीचे में गौरैया और कबूतर भी रहते थे।
story-n2: एक दिन मुर्गी को रागी के दाने मिले। मुर्गी को लगा कि खेत में रागी बोने से बहुत रागी मिलेगी।
story-n3: मुर्गी ने रागी बोने के लिए गौरैया से मदद मांगी। गौरैया ने कहा, “मुझसे नहीं होगा।” मुर्गी ने कबूतर से मदद मांगी। उसने भी कहा, “मुझसे नहीं होगा।” मुर्गी ने अपने बच्चों को साथ लेकर रागी बोई।
story-n4: कुछ दिन बीत गए। रागी के पौधे बड़े हो गए। रागी के पौधों में बालियाँ आईं। उन बालियों को काटने का दिन आ गया।
story-n5: मुर्गी ने रागी की बालियाँ काटने के लिए गौरैया से मदद मांगी। गौरैया ने कहा, “मुझसे नहीं होगा।” मुर्गी ने कबूतर से मदद मांगी। उसने भी कहा, “मुझसे नहीं होगा।” मुर्गी ने अपने बच्चों को साथ लेकर रागी की बालियाँ काटीं। दाने इकट्ठा करके रख दिए।
story-n6: एक दिन गौरैया और कबूतरों को बहुत भूख लगी। वे मुर्गी के पास आकर बोले, “दीदी, खाने को रागी दो।” मुर्गी ने पूछा, “तुम न बोने आए, न काटने आए। तुम्हें रागी क्यों दूँ?” गौरैया और कबूतरों को अपनी गलती समझ आई। वे शर्म से सिर झुकाकर खड़े रहे। मुर्गी को दया आई। उसने रागी दे दी।
