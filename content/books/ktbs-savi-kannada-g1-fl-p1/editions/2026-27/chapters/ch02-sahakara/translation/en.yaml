story-intro: (Read and tell the lesson)
story-n1: There was a village. The name of that village was Malligehalli. In that village there was a garden. In that garden a hen lived with her chicks. In the same garden sparrows and pigeons also lived.
story-n2: One day the hen found some ragi grains. She thought that if ragi were sown in the field, a lot of ragi would be obtained.
story-n3: The hen asked the sparrow for help to sow the ragi. The sparrow said, “I cannot.” The hen asked the pigeon for help. It too said, “I cannot.” The hen gathered her chicks and sowed the ragi.
story-n4: A few days passed. The ragi plants grew and became big. Ears of grain appeared on the ragi plants. The day to harvest those ears came.
story-n5: The hen asked the sparrow for help to harvest the ragi ears. The sparrow said, “I cannot.” The hen asked the pigeon for help. It too said, “I cannot.” The hen gathered her chicks and harvested the ragi ears. She collected and stored the grain.
story-n6: One day the sparrows and pigeons became very hungry. They came to the hen and asked, “Sister, give us ragi to eat.” The hen asked, “You did not come to sow, nor to harvest. Why should I give you ragi?” The sparrows and pigeons realized their mistake. They stood ashamed with their heads bowed. The hen felt pity and gave them ragi.
