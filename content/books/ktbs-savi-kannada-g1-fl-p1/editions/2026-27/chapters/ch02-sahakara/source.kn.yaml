- id: story-intro
  type: prose
  section: story
  text: (ಪಾಠವನ್ನು ಓದಿ ಹೇಳಿ)
- id: story-n1
  type: prose
  section: story
  text: ಒಂದು ಊರು. ಆ ಊರಿನ ಹೆಸರು ಮಲ್ಲಿಗೆಹಳ್ಳಿ. ಆ ಹಳ್ಳಿಯಲ್ಲಿ ಒಂದು ತೋಟವಿತ್ತು. ಆ ತೋಟದಲ್ಲಿ ಒಂದು ಕೋಳಿ ತನ್ನ ಮರಿಗಳ ಜೊತೆಯಲ್ಲಿ ವಾಸವಾಗಿತ್ತು. ಅದೇ ತೋಟದಲ್ಲಿ ಗುಬ್ಬಚ್ಚಿ ಮತ್ತು ಪಾರಿವಾಳಗಳೂ ವಾಸವಾಗಿದ್ದವು.
- id: story-n2
  type: prose
  section: story
  text: ಒಂದು ದಿನ ಕೋಳಿಗೆ ರಾಗಿಯ ಕಾಳುಗಳು ಸಿಕ್ಕವು. ರಾಗಿಯನ್ನು ಹೊಲದಲ್ಲಿ ಬಿತ್ತಿದರೆ ತುಂಬಾ ರಾಗಿ ಸಿಗುತ್ತದೆ ಎಂದು ಕೋಳಿಗೆ ಅನಿಸಿತು.
- id: story-n3
  type: prose
  section: story
  text: ಕೋಳಿ ರಾಗಿಯನ್ನು ಬಿತ್ತಲು ಗುಬ್ಬಚ್ಚಿಯ ಸಹಾಯ ಕೇಳಿತು. ಗುಬ್ಬಚ್ಚಿ “ನನ್ನಿಂದ ಆಗದು” ಎಂದಿತು. ಕೋಳಿ ಪಾರಿವಾಳದ ಸಹಾಯವನ್ನು ಕೇಳಿತು. ಅದೂ “ನನ್ನಿಂದ ಆಗದು” ಎಂದಿತು. ಕೋಳಿ ತನ್ನ ಮರಿಗಳನ್ನು ಕೂಡಿಕೊಂಡು ರಾಗಿಯನ್ನು ಬಿತ್ತಿತು.
- id: story-n4
  type: prose
  section: story
  text: ಕೆಲವು ದಿನಗಳು ಕಳೆದವು. ರಾಗಿಯ ಪೈರುಗಳು ಬೆಳೆದು ದೊಡ್ಡದಾದವು. ರಾಗಿಯ ಪೈರಿನಲ್ಲಿ ತೆನೆಗಳು ಬಿಟ್ಟವು. ಆ ತೆನೆಗಳನ್ನು ಕೊಯ್ಯುವ ದಿನ ಬಂದಿತು.
- id: story-n5
  type: prose
  section: story
  text: ಕೋಳಿ ರಾಗಿಯ ತೆನೆಗಳನ್ನು ಕೊಯ್ಯಲು ಗುಬ್ಬಚ್ಚಿಯ ಸಹಾಯ ಕೇಳಿತು. ಗುಬ್ಬಚ್ಚಿ “ನನ್ನಿಂದ ಆಗದು” ಎಂದಿತು. ಕೋಳಿ ಪಾರಿವಾಳದ ಸಹಾಯವನ್ನು ಕೇಳಿತು. ಅದೂ “ನನ್ನಿಂದ ಆಗದು” ಎಂದಿತು. ಕೋಳಿ ತನ್ನ ಮರಿಗಳನ್ನು ಕೂಡಿಕೊಂಡು ರಾಗಿಯ ತೆನೆಗಳನ್ನು ಕೊಯ್ದಿತು. ಕಾಳನ್ನು ಸಂಗ್ರಹಿಸಿ ಇಟ್ಟಿತು.
- id: story-n6
  type: prose
  section: story
  text: 'ಒಂದು ದಿನ ಗುಬ್ಬಚ್ಚಿ ಮತ್ತು ಪಾರಿವಾಳಗಳಿಗೆ ತುಂಬಾ ಹಸಿವಾಯಿತು. ಅವು ಕೋಳಿಯ ಬಳಿಬಂದು “ಅಕ್ಕಾ, ತಿನ್ನಲು ರಾಗಿ ಕೊಡು” ಎಂದು ಕೇಳಿದವು. ಕೋಳಿ “ನೀವು ಬಿತ್ತಲೂ ಬರಲಿಲ್ಲ, ಕೊಯ್ಯಲೂ ಬರಲಿಲ್ಲ. ನಿಮಗೆ ಏಕೆ ರಾಗಿ ಕೊಡಲಿ?” ಎಂದು ಕೇಳಿತು. ಗುಬ್ಬಚ್ಚಿ ಮತ್ತು ಪಾರಿವಾಳಗಳಿಗೆ ತಮ್ಮ ತಪ್ಪು ತಿಳಿಯಿತು. ಅವು ನಾಚಿ ತಲೆತಗ್ಗಿಸಿ ನಿಂತವು. ಕೋಳಿಗೆ ‘ಅಯ್ಯೋ ಪಾಪ!’ ಅನಿಸಿತು. ರಾಗಿಯನ್ನು ಕೊಟ್ಟಿತು.'
