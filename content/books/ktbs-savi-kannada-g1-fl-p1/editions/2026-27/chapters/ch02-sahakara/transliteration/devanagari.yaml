story-intro: (पाठवन्नु ओदि हेळि)
story-n1: ऒंदु ऊरु. आ ऊरिन हॆसरु मल्लिगॆहळ्ळि. आ हळ्ळियल्लि ऒंदु तोटवित्तु. आ तोटदल्लि ऒंदु कोळि तन्न मरिगळ जॊतॆयल्लि वासवागित्तु. अदे तोटदल्लि गुब्बच्चि मत्तु पारिवाळगळू वासवागिद्दवु.
story-n2: ऒंदु दिन कोळिगॆ रागिय काळुगळु सिक्कवु. रागियन्नु हॊलदल्लि बित्तिदरॆ तुंबा रागि सिगुत्तदॆ ऎंदु कोळिगॆ अनिसितु.
story-n3: कोळि रागियन्नु बित्तलु गुब्बच्चिय सहाय केळितु. गुब्बच्चि “नन्निंद आगदु” ऎंदितु. कोळि पारिवाळद सहायवन्नु केळितु. अदू “नन्निंद आगदु” ऎंदितु. कोळि तन्न मरिगळन्नु कूडिकॊंडु रागियन्नु बित्तितु.
story-n4: कॆलवु दिनगळु कळॆदवु. रागिय पैरुगळु बॆळॆदु दॊड्डदादवु. रागिय पैरिनल्लि तॆनॆगळु बिट्टवु. आ तॆनॆगळन्नु कॊय्युव दिन बंदितु.
story-n5: कोळि रागिय तॆनॆगळन्नु कॊय्यलु गुब्बच्चिय सहाय केळितु. गुब्बच्चि “नन्निंद आगदु” ऎंदितु. कोळि पारिवाळद सहायवन्नु केळितु. अदू “नन्निंद आगदु” ऎंदितु. कोळि तन्न मरिगळन्नु कूडिकॊंडु रागिय तॆनॆगळन्नु कॊय्दितु. काळन्नु संग्रहिसि इट्टितु.
story-n6: 'ऒंदु दिन गुब्बच्चि मत्तु पारिवाळगळिगॆ तुंबा हसिवायितु. अवु कोळिय बळिबंदु “अक्का, तिन्नलु रागि कॊडु” ऎंदु केळिदवु. कोळि “नीवु बित्तलू बरलिल्ल, कॊय्यलू बरलिल्ल. निमगॆ एकॆ रागि कॊडलि?” ऎंदु केळितु. गुब्बच्चि मत्तु पारिवाळगळिगॆ तम्म तप्पु तिळियितु. अवु नाचि तलॆतग्गिसि निंतवु. कोळिगॆ ‘अय्यो पाप!’ अनिसितु. रागियन्नु कॊट्टितु.'
