ex-a-intro: अ) प्रश्नॆ केळि, मक्कळिंद उत्तर हेळिसि.
ex-a-q1: 1) हळ्ळिय हॆसरेनु?
ex-a-q2: 2) कोळि ऎल्लि वासवागित्तु?
ex-a-q3: 3) कोळि एनन्नु बित्तलु गुब्बच्चिय सहाय केळितु?
ex-a-q4: 4) रागिय पैरिनल्लि एनु बिट्टितु?
ex-a-q5: 5) कोळि यारन्नु कूडिकॊंडु रागिय तॆनॆगळन्नु कॊय्दितु?
ex-a-q6: 6) गुब्बच्चि मत्तु पारिवाळगळिगॆ एनु तिळियितु?
ex-a-q7: 7) कोळिगॆ एनु अनिसितु?
ex-b-intro: आ) कॊट्टिरुव वाक्यगळल्लि बिट्टिरुव पदगळन्नु हेळिसि.
ex-b-q1: 1) कोळि रागियन्नु बित्तलु गुब्बच्चिय ___________ केळितु.
ex-b-q2: 2) कोळि तन्न मरिगळन्नु कूडिकॊंडु ___________ बित्तितु.
ex-b-q3: 3) ऒंदु दिन गुब्बच्चि मत्तु पारिवाळगळिगॆ तुंबा ___________.
ex-b-q4: 4) गुब्बच्चि मत्तु पारिवाळगळिगॆ तम्म __________ तिळियितु.
