ex-a-q2: 2) koḻi èlli vāsavāgittu?
ex-a-q3: 3) koḻi enannu bittalu gubbacciya sahāya keḻitu?
ex-a-q4: 4) rāgiya pairinalli enu biṭṭitu?
ex-a-q5: 5) koḻi yārannu kūḍikòṃḍu rāgiya tènègaḻannu kòyditu?
ex-a-q6: 6) gubbacci mattu pārivāḻagaḻigè enu tiḻiyitu?
ex-a-q7: 7) koḻigè enu anisitu?
