story-intro: (pāṭhavannu odi heḻi)
story-n1: òṃdu ūru. ā ūrina hèsaru malligèhaḻḻi. ā haḻḻiyalli òṃdu toṭavittu. ā toṭadalli òṃdu koḻi tanna marigaḻa jòtèyalli vāsavāgittu. ade toṭadalli gubbacci mattu pārivāḻagaḻū vāsavāgiddavu.
story-n2: òṃdu dina koḻigè rāgiya kāḻugaḻu sikkavu. rāgiyannu hòladalli bittidarè tuṃbā rāgi siguttadè èṃdu koḻigè anisitu.
story-n3: koḻi rāgiyannu bittalu gubbacciya sahāya keḻitu. gubbacci “nanniṃda āgadu” èṃditu. koḻi pārivāḻada sahāyavannu keḻitu. adū “nanniṃda āgadu” èṃditu. koḻi tanna marigaḻannu kūḍikòṃḍu rāgiyannu bittitu.
story-n4: kèlavu dinagaḻu kaḻèdavu. rāgiya pairugaḻu bèḻèdu dòḍḍadādavu. rāgiya pairinalli tènègaḻu biṭṭavu. ā tènègaḻannu kòyyuva dina baṃditu.
story-n5: koḻi rāgiya tènègaḻannu kòyyalu gubbacciya sahāya keḻitu. gubbacci “nanniṃda āgadu” èṃditu. koḻi pārivāḻada sahāyavannu keḻitu. adū “nanniṃda āgadu” èṃditu. koḻi tanna marigaḻannu kūḍikòṃḍu rāgiya tènègaḻannu kòyditu. kāḻannu saṃgrahisi iṭṭitu.
story-n6: 'òṃdu dina gubbacci mattu pārivāḻagaḻigè tuṃbā hasivāyitu. avu koḻiya baḻibaṃdu “akkā, tinnalu rāgi kòḍu” èṃdu keḻidavu. koḻi “nīvu bittalū baralilla, kòyyalū baralilla. nimagè ekè rāgi kòḍali?” èṃdu keḻitu. gubbacci mattu pārivāḻagaḻigè tamma tappu tiḻiyitu. avu nāci talètaggisi niṃtavu. koḻigè ‘ayyo pāpa!’ anisitu. rāgiyannu kòṭṭitu.'
