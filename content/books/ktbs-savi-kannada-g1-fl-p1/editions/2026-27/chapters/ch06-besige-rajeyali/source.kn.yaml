segments:
- id: intro-1
  type: prose
  section: intro
  text: ಅ) ಚಿತ್ರಕ್ಕೆ (ಕೇಸರಿ ಮತ್ತು ಹಸಿರು) ಬಣ್ಣ ಹಾಕಲು ಹೇಳಿ.
- id: intro-kesari
  type: vocabulary_term
  section: intro
  text: ಕೇಸರಿ
- id: intro-hasiru
  type: vocabulary_term
  section: intro
  text: ಹಸಿರು
- id: intro-2
  type: prose
  section: intro
  text: ಆ) ಮಕ್ಕಳಿಗೆ ಇಷ್ಟವಾದ ಬಣ್ಣದಿಂದ ಚಿತ್ರ ತುಂಬಿಸಲು ಹೇಳಿ.
- id: poem-intro
  type: prose
  section: poem
  text: (ಪದ್ಯವನ್ನು ಹಾಡಿ, ಮಕ್ಕಳಿಂದ ಹಾಡಿಸಿ)
- id: poem-s1l1
  type: poem_line
  stanza: 1
  text: ಬೇಸಿಗೆ ರಜೆಯಲಿ
- id: poem-s1l2
  type: poem_line
  stanza: 1
  text: ಅಪ್ಪನ ಜೊತೆ ನಾ
- id: poem-s1l3
  type: poem_line
  stanza: 1
  text: ಹಳ್ಳಿಗೆ ಹೋಗುವೆನು
- id: poem-s2l1
  type: poem_line
  stanza: 2
  text: ಬೆವರನು ಸುರಿಸುವ
- id: poem-s2l2
  type: poem_line
  stanza: 2
  text: ರೈತರ ಜೊತೆಯಲಿ
- id: poem-s2l3
  type: poem_line
  stanza: 2
  text: ನಾನೂ ದುಡಿಯುವೆನು
- id: poem-s3l1
  type: poem_line
  stanza: 3
  text: ಮುಗಿಲನೆ ಮುಟ್ಟುವ
- id: poem-s3l2
  type: poem_line
  stanza: 3
  text: ಎತ್ತರ ದನಿಯಲಿ
- id: poem-s3l3
  type: poem_line
  stanza: 3
  text: ಹಾಡನು ಹೇಳುವೆನು
- id: poem-s4l1
  type: poem_line
  stanza: 4
  text: ಜಗದಲಿ ನಡೆದಿಹ
- id: poem-s4l2
  type: poem_line
  stanza: 4
  text: ಕೌತುಕ ವಿಷಯವ
- id: poem-s4l3
  type: poem_line
  stanza: 4
  text: ಅವರಿಗೆ ತಿಳಿಸುವೆನು
- id: poem-s5l1
  type: poem_line
  stanza: 5
  text: ತೋಟದಿ ಬೆಳೆದಿಹ
- id: poem-s5l2
  type: poem_line
  stanza: 5
  text: ಬಗೆ ಬಗೆ ಹಣ್ಣಿನ
- id: poem-s5l3
  type: poem_line
  stanza: 5
  text: ಸವಿಯನು ಸವಿಯುವೆನು
- id: poem-s6l1
  type: poem_line
  stanza: 6
  text: ಹಚ್ಚನೆ ಹಸುರಿನ
- id: poem-s6l2
  type: poem_line
  stanza: 6
  text: ಸುಂದರ ಸೃಷ್ಟಿಯ
- id: poem-s6l3
  type: poem_line
  stanza: 6
  text: 'ಸೊಬಗನು ಕಾಣುವೆನು!'
