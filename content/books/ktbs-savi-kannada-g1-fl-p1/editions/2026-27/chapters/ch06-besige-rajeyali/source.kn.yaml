- id: ex-a-intro
  type: prose
  exercise: A
  text: ಅ) ಪದ್ಯದ ಸಾಲುಗಳಲ್ಲಿ ಬಿಟ್ಟಿರುವ ಪದವನ್ನು ಮಕ್ಕಳಿಂದ ಹೇಳಿಸಿ.
- id: ex-a-q1
  type: fill_blank
  exercise: A
  text: 1. ಅಪ್ಪನ ಜೊತೆ ನಾ _____ ಹೋಗುವೆನು.
- id: ex-a-q2
  type: fill_blank
  exercise: A
  text: 2. ಎತ್ತರ ದನಿಯಲಿ _____ ಹೇಳುವೆನು.
- id: ex-a-q3
  type: fill_blank
  exercise: A
  text: 3. ಬಗೆ ಬಗೆ ಹಣ್ಣಿನ _____ ಸವಿಯುವೆನು.
- id: ex-a-q4
  type: fill_blank
  exercise: A
  text: 4. ಸುಂದರ ಸೃಷ್ಟಿಯ _____ ಕಾಣುವೆನು.
- id: ex-b-intro
  type: prose
  exercise: B
  text: ಆ) ಮಕ್ಕಳಿಗೆ ಪ್ರಶ್ನೆ ಕೇಳಿ, ಉತ್ತರ ಹೇಳಿಸಿ.
- id: ex-b-q1
  type: question
  exercise: B
  text: 1. ಕವಿಯು ಯಾರ ಜೊತೆ ದುಡಿಯುವನು?
- id: ex-b-q2
  type: question
  exercise: B
  text: 2. ಕೌತುಕ ವಿಷಯ ಎಲ್ಲಿ ನಡೆದಿದೆ?
- id: ex-b-q3
  type: question
  exercise: B
  text: 3. ಹಳ್ಳಿಗೆ ಯಾವಾಗ ಹೋಗಬೇಕು?
- id: ex-c-intro
  type: prose
  exercise: C
  text: ಇ) ‘ಅ’, ‘ಆ’ ಮತ್ತು ‘ಇ’ ಪಟ್ಟಿಯಲ್ಲಿರುವ ಶಬ್ದಗಳನ್ನು ಜೋಡಿಸಿ ಕವಿತೆಯ ಸಾಲುಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.
- id: ex-c-col-a
  type: prose
  exercise: C
  text: 'ಅ: ಬೇಸಿಗೆ ರಜೆಯಲಿ / ತೋಟದಿ ಬೆಳೆದಿಹ / ಜಗದಲಿ ನಡೆದಿಹ / ಮುಗಿಲನೆ ಮುಟ್ಟುವ'
- id: ex-c-col-aa
  type: prose
  exercise: C
  text: 'ಆ: ಕೌತುಕ ವಿಷಯವ / ಎತ್ತರ ದನಿಯಲಿ / ಅಪ್ಪನ ಜೊತೆ ನಾ / ಬಗೆ ಬಗೆ ಹಣ್ಣಿನ'
- id: ex-c-col-i
  type: prose
  exercise: C
  text: 'ಇ: ಹಾಡನು ಹೇಳುವೆನು. / ಅವರಿಗೆ ತಿಳಿಸುವೆನು. / ಸವಿಯನು ಸವಿಯುವೆನು. / ಹಳ್ಳಿಗೆ ಹೋಗುವೆನು.'
- id: ex-d-intro
  type: prose
  exercise: D
  text: ಈ) ಕೆಳಗಿನ ಸಾಲುಗಳನ್ನು ಮಕ್ಕಳಿಗೆ ಹೇಳಿ, ಅವರಿಂದ ಹೇಳಿಸಿ.
- id: ex-d-q1
  type: prose
  exercise: D
  text: 1. ಬೇಸಿಗೆ ರಜೆಯಲ್ಲಿ ಹಳ್ಳಿಗೆ ಹೋಗಬೇಕು.
- id: ex-d-q2
  type: prose
  exercise: D
  text: 2. ರೈತನು ಬೆವರು ಸುರಿಸಿ ದುಡಿವನು.
- id: ex-d-q3
  type: prose
  exercise: D
  text: 3. ಜಗದಲಿ ಕೌತುಕ ವಿಷಯಗಳು ನಡೆದಿವೆ.
- id: ex-d-q4
  type: prose
  exercise: D
  text: 4. ತೋಟದಲ್ಲಿ ಬಗೆ ಬಗೆ ಹಣ್ಣುಗಳಿವೆ.
- id: ex-d-q5
  type: prose
  exercise: D
  text: 5. ಸೃಷ್ಟಿಯು ಹಚ್ಚನೆ ಹಸುರಾಗಿದೆ.
- id: ex-d-q6
  type: prose
  exercise: D
  text: 6. ಹಾಡನು ಎತ್ತರದ ದನಿಯಲಿ ಹಾಡಬೇಕು.
