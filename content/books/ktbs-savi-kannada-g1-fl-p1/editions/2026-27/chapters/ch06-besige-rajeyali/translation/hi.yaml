ex-a-intro: अ) पद्य की पंक्तियों में छूटे शब्द बच्चों से बुलवाएँ।
ex-a-q1: 1. पिता के साथ मैं _____ जाऊँगा।
ex-a-q2: 2. ऊँची आवाज़ में _____ गाऊँगा।
ex-a-q3: 3. कई तरह के फलों का _____ लूँगा।
ex-a-q4: 4. सुंदर सृष्टि की _____ देखूँगा।
ex-b-intro: आ) बच्चों से प्रश्न पूछें, उत्तर बुलवाएँ।
ex-b-q1: 1. कवि किसके साथ मेहनत करता है?
ex-b-q2: 2. अद्भुत बात कहाँ घटी है?
ex-b-q3: 3. गाँव कब जाना चाहिए?
ex-c-intro: इ) ‘अ’, ‘आ’ और ‘इ’ सूची के शब्दों को जोड़कर कविता की पंक्तियाँ पूरी करें।
ex-c-col-a: 'अ: ग्रीष्म अवकाश में / बगीचे में उगे / जगत में घटी / आकाश छूती'
ex-c-col-aa: 'आ: अद्भुत बातें / ऊँची आवाज़ में / पिता के साथ मैं / कई तरह के फलों का'
ex-c-col-i: 'इ: गीत गाऊँगा। / उन्हें बताऊँगा। / स्वाद लूँगा। / गाँव जाऊँगा।'
ex-d-intro: ई) नीचे की पंक्तियाँ बच्चों को सुनाएँ, उनसे बुलवाएँ।
ex-d-q1: 1. ग्रीष्म अवकाश में गाँव जाना चाहिए।
ex-d-q2: 2. किसान पसीना बहाकर मेहनत करता है।
ex-d-q3: 3. जगत में अद्भुत बातें घटी हैं।
ex-d-q4: 4. बगीचे में कई तरह के फल हैं।
ex-d-q5: 5. सृष्टि घनी हरी है।
ex-d-q6: 6. गीत ऊँची आवाज़ में गाना चाहिए।
