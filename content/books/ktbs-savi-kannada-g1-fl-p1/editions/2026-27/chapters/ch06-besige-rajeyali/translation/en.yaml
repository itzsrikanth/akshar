poem-s1l1: In the summer holiday
poem-s1l2: With father I
poem-s1l3: Will go to the village
poem-s2l1: Sweating
poem-s2l2: With the farmers
poem-s2l3: I too will work
poem-s3l1: Touching the sky
poem-s3l2: In a loud voice
poem-s3l3: I will sing a song
poem-s4l1: Happening in the world
poem-s4l2: Wonderful matters
poem-s4l3: I will tell them
poem-s5l1: Grown in the garden
poem-s5l2: Of many kinds of fruit
poem-s5l3: I will taste the flavour
poem-s6l1: Of deep green
poem-s6l2: Of beautiful creation
poem-s6l3: 'I will see the beauty!'
