ex-a-intro: A) Have the children say the missing word in the poem lines.
ex-a-q1: 1. With father I will go to _____.
ex-a-q2: 2. In a loud voice I will _____ a song.
ex-a-q3: 3. Of many kinds of fruit I will _____ the flavour.
ex-a-q4: 4. Of beautiful creation I will _____ the beauty.
ex-b-intro: B) Ask the children questions and have them answer.
ex-b-q1: 1. With whom does the poet work?
ex-b-q2: 2. Where are the wonderful matters happening?
ex-b-q3: 3. When should one go to the village?
ex-c-intro: C) Join the words in lists A, AA and I to complete the poem lines.
ex-c-col-a: 'A: In the summer holiday / Grown in the garden / Happening in the world / Touching the sky'
ex-c-col-aa: 'AA: Wonderful matters / In a loud voice / With father I / Of many kinds of fruit'
ex-c-col-i: 'I: I will sing a song. / I will tell them. / I will taste the flavour. / I will go to the village.'
ex-d-intro: D) Say the lines below to the children and have them say them.
ex-d-q1: 1. One should go to the village in the summer holiday.
ex-d-q2: 2. The farmer works sweating.
ex-d-q3: 3. Wonderful matters happen in the world.
ex-d-q4: 4. There are many kinds of fruit in the garden.
ex-d-q5: 5. Creation is deep green.
ex-d-q6: 6. One should sing the song in a loud voice.
