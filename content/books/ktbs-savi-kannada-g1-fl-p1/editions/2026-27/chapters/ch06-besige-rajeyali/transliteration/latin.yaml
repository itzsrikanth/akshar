ex-a-intro: a) padyada sālugaḻalli biṭṭiruva padavannu makkaḻiṃda heḻisi.
ex-a-q1: 1. appana jòtè nā _____ hoguvènu.
ex-a-q2: 2. èttara daniyali _____ heḻuvènu.
ex-a-q3: 3. bagè bagè haṇṇina _____ saviyuvènu.
ex-a-q4: 4. suṃdara sṛṣṭiya _____ kāṇuvènu.
ex-b-intro: ā) makkaḻigè praśnè keḻi, uttara heḻisi.
ex-b-q1: 1. kaviyu yāra jòtè duḍiyuvanu?
ex-b-q2: 2. kautuka viṣaya èlli naḍèdidè?
ex-b-q3: 3. haḻḻigè yāvāga hogabeku?
ex-c-intro: i) ‘a’, ‘ā’ mattu ‘i’ paṭṭiyalliruva śabdagaḻannu joḍisi kavitèya sālugaḻannu pūrṇagòḻisi.
ex-c-col-a: 'a: besigè rajèyali / toṭadi bèḻèdiha / jagadali naḍèdiha / mugilanè muṭṭuva'
ex-c-col-aa: 'ā: kautuka viṣayava / èttara daniyali / appana jòtè nā / bagè bagè haṇṇina'
ex-c-col-i: 'i: hāḍanu heḻuvènu. / avarigè tiḻisuvènu. / saviyanu saviyuvènu. / haḻḻigè hoguvènu.'
ex-d-intro: ī) kèḻagina sālugaḻannu makkaḻigè heḻi, avariṃda heḻisi.
ex-d-q1: 1. besigè rajèyalli haḻḻigè hogabeku.
ex-d-q2: 2. raitanu bèvaru surisi duḍivanu.
ex-d-q3: 3. jagadali kautuka viṣayagaḻu naḍèdivè.
ex-d-q4: 4. toṭadalli bagè bagè haṇṇugaḻivè.
ex-d-q5: 5. sṛṣṭiyu haccanè hasurāgidè.
ex-d-q6: 6. hāḍanu èttarada daniyali hāḍabeku.
