ex-a-intro: अ) पद्यद सालुगळल्लि बिट्टिरुव पदवन्नु मक्कळिंद हेळिसि.
ex-a-q1: 1. अप्पन जॊतॆ ना _____ होगुवॆनु.
ex-a-q2: 2. ऎत्तर दनियलि _____ हेळुवॆनु.
ex-a-q3: 3. बगॆ बगॆ हण्णिन _____ सवियुवॆनु.
ex-a-q4: 4. सुंदर सृष्टिय _____ काणुवॆनु.
ex-b-intro: आ) मक्कळिगॆ प्रश्नॆ केळि, उत्तर हेळिसि.
ex-b-q1: 1. कवियु यार जॊतॆ दुडियुवनु?
ex-b-q2: 2. कौतुक विषय ऎल्लि नडॆदिदॆ?
ex-b-q3: 3. हळ्ळिगॆ यावाग होगबेकु?
ex-c-intro: इ) ‘अ’, ‘आ’ मत्तु ‘इ’ पट्टियल्लिरुव शब्दगळन्नु जोडिसि कवितॆय सालुगळन्नु पूर्णगॊळिसि.
ex-c-col-a: 'अ: बेसिगॆ रजॆयलि / तोटदि बॆळॆदिह / जगदलि नडॆदिह / मुगिलनॆ मुट्टुव'
ex-c-col-aa: 'आ: कौतुक विषयव / ऎत्तर दनियलि / अप्पन जॊतॆ ना / बगॆ बगॆ हण्णिन'
ex-c-col-i: 'इ: हाडनु हेळुवॆनु. / अवरिगॆ तिळिसुवॆनु. / सवियनु सवियुवॆनु. / हळ्ळिगॆ होगुवॆनु.'
ex-d-intro: ई) कॆळगिन सालुगळन्नु मक्कळिगॆ हेळि, अवरिंद हेळिसि.
ex-d-q1: 1. बेसिगॆ रजॆयल्लि हळ्ळिगॆ होगबेकु.
ex-d-q2: 2. रैतनु बॆवरु सुरिसि दुडिवनु.
ex-d-q3: 3. जगदलि कौतुक विषयगळु नडॆदिवॆ.
ex-d-q4: 4. तोटदल्लि बगॆ बगॆ हण्णुगळिवॆ.
ex-d-q5: 5. सृष्टियु हच्चनॆ हसुरागिदॆ.
ex-d-q6: 6. हाडनु ऎत्तरद दनियलि हाडबेकु.
