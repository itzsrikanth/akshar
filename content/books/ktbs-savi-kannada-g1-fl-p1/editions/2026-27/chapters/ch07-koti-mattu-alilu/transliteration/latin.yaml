intro-1: a) citragaḻannu torisi, pakkadalliruva praśnègaḻannu keḻi, makkaḻiṃda uttara paḍèyiri.
intro-q1: ī prāṇiya hèsarenu?
intro-q2: ī prāṇiya hèsarenu?
intro-q3: ī citradalliruvudenu?
intro-q4: ī citradalliruvudenu?
story-intro: (pāṭhavannu odi heḻi, makkaḻiṃda heḻisi)
story-n1: òṃdu koti marada melè kuḻitittu. ā kotiya bāla tuṃbā uddavittu. adu nèladavarègè netāḍuttittu.
story-n2: 'òṃdu aḻilu kuṇidāḍuttā alligè baṃditu. adu kotiya bāla noḍitu. “ī jokāli èṣṭu caṃda!” èṃdu yocisitu. kotiya bāla hiḍidu aḻilu jīkatòḍagitu.'
story-n3: kotigè kacaguḻi āyitu. adu kèḻagè noḍitu mattu naguttā heḻitu.
story-d1: taṃgi, enu māḍuttiruvè? nanagè kacaguḻiyāguttidè.
story-n4: āga aḻiligè gābariyāyitu.
story-d2: maṃgaṇṇā, idu ninna bālave? jokāli èṃdu tiḻidu jīkuttiddè. nannannu kṣamisu
story-n5: bālavannu biṭṭitu. aḻilu oḍihogi, marada kòṃbèyannu eritu.
