intro-1: अ) चित्रगळन्नु तोरिसि, पक्कदल्लिरुव प्रश्नॆगळन्नु केळि, मक्कळिंद उत्तर पडॆयिरि.
intro-q1: ई प्राणिय हॆसरेनु?
intro-q2: ई प्राणिय हॆसरेनु?
intro-q3: ई चित्रदल्लिरुवुदेनु?
intro-q4: ई चित्रदल्लिरुवुदेनु?
story-intro: (पाठवन्नु ओदि हेळि, मक्कळिंद हेळिसि)
story-n1: ऒंदु कोति मरद मेलॆ कुळितित्तु. आ कोतिय बाल तुंबा उद्दवित्तु. अदु नॆलदवरॆगॆ नेताडुत्तित्तु.
story-n2: 'ऒंदु अळिलु कुणिदाडुत्ता अल्लिगॆ बंदितु. अदु कोतिय बाल नोडितु. “ई जोकालि ऎष्टु चंद!” ऎंदु योचिसितु. कोतिय बाल हिडिदु अळिलु जीकतॊडगितु.'
story-n3: कोतिगॆ कचगुळि आयितु. अदु कॆळगॆ नोडितु मत्तु नगुत्ता हेळितु.
story-d1: तंगि, एनु माडुत्तिरुवॆ? ननगॆ कचगुळियागुत्तिदॆ.
story-n4: आग अळिलिगॆ गाबरियायितु.
story-d2: मंगण्णा, इदु निन्न बालवे? जोकालि ऎंदु तिळिदु जीकुत्तिद्दॆ. नन्नन्नु क्षमिसु
story-n5: बालवन्नु बिट्टितु. अळिलु ओडिहोगि, मरद कॊंबॆयन्नु एरितु.
