intro-1: अ) चित्र दिखाकर पास के प्रश्न पूछें, बच्चों से उत्तर लें।
intro-q1: इस जानवर का नाम क्या है?
intro-q2: इस जानवर का नाम क्या है?
intro-q3: इस चित्र में क्या है?
intro-q4: इस चित्र में क्या है?
story-intro: (पाठ पढ़कर सुनाएँ, बच्चों से बुलवाएँ)
story-n1: एक बंदर पेड़ पर बैठा था। उस बंदर की पूँछ बहुत लंबी थी। वह ज़मीन तक लटक रही थी।
story-n2: 'एक गिलहरी उछलती-कूदती वहाँ आई। उसने बंदर की पूँछ देखी। उसने सोचा, “यह झूला कितना सुंदर है!” बंदर की पूँछ पकड़कर गिलहरी झूलने लगी।'
story-n3: बंदर को गुदगुदी आई। उसने नीचे देखा और हँसते हुए कहा,
story-d1: बहन, क्या कर रही हो? मुझे गुदगुदी हो रही है।
story-n4: तब गिलहरी डर गई।
story-d2: बंदर भैया, क्या यह तुम्हारी पूँछ है? मैंने झूला समझकर झूल रही थी। मुझे क्षमा करो
story-n5: उसने पूँछ छोड़ दी। गिलहरी भागकर पेड़ की डाल पर चढ़ गई।
