intro-1: A) Show the pictures, ask the questions beside them, and get answers from the children.
intro-q1: What is the name of this animal?
intro-q2: What is the name of this animal?
intro-q3: What is in this picture?
intro-q4: What is in this picture?
story-intro: (Read and tell the lesson, and have the children say it)
story-n1: A monkey was sitting on a tree. That monkey’s tail was very long. It was hanging down to the ground.
story-n2: 'A squirrel came there hopping. It saw the monkey’s tail. It thought, “How lovely this swing is!” Holding the monkey’s tail, the squirrel began to swing.'
story-n3: The monkey felt ticklish. It looked down and said laughing,
story-d1: Little sister, what are you doing? I am getting ticklish.
story-n4: Then the squirrel got frightened.
story-d2: Brother monkey, is this your tail? I thought it was a swing and was swinging. Forgive me
story-n5: It let go of the tail. The squirrel ran away and climbed a branch of the tree.
