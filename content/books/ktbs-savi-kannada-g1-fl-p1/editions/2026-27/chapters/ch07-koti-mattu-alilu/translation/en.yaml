ex-a-intro: A) Have the children say the missing word in these sentences.
ex-a-q1: 1) That monkey’s tail was _____ long.
ex-a-q2: 2) A squirrel ________ came there.
ex-a-q3: 3) The monkey got _______.
ex-a-q4: 4) Brother monkey, is this ____ tail?
ex-b-intro: B) Ask the children questions and have them answer.
ex-b-q1: 1) What was the monkey sitting on?
ex-b-q2: 2) What held the monkey’s tail and began to swing?
ex-b-q3: 3) Who said, “Brother monkey, is this your tail? … Forgive me”?
ex-b-q4: 4) How did the squirrel go and climb the tree branch?
