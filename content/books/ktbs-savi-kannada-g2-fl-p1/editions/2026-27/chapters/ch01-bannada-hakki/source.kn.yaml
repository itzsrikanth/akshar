labels:
  poem: ಪದ್ಯ
  vocab: ಕೇಳಿದ ಪದಗಳು
  notes: ಪದಗಳ ಅರ್ಥ
  exercise-A: "ಅ) ಪದ್ಯದ ಮುಂದಿನ ಸಾಲುಗಳನ್ನು ಹೇಳಿ:"
  exercise-B: "ಆ) ಈ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ಪದದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ:"
  exercise-C: "ಇ) ಆವರಣದಲ್ಲಿ ಇರುವ ಪದಗಳಲ್ಲಿ ಸೂಕ್ತ ಪದ ಆರಿಸಿ ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳದಲ್ಲಿ ಬರೆಯಿರಿ:"
  exercise-D: "ಈ) ಈ ಪ್ರಾಸ ಪದಗಳನ್ನು ಹೇಳು:"

segments:
  - id: poem-s1l1
    type: poem_line
    stanza: 1
    text: ಬಾರಲೆ ಹಕ್ಕಿ ಬಣ್ಣದ ಹಕ್ಕಿ
  - id: poem-s1l2
    type: poem_line
    stanza: 1
    text: ಬಾರಲೆ ಹಕ್ಕಿ ಹಾರುವ ಹಕ್ಕಿ
  - id: poem-s1l3
    type: poem_line
    stanza: 1
    text: ಗೆಳೆಯರು ಆಡಲು ಯಾರೂ ಇಲ್ಲ
  - id: poem-s1l4
    type: poem_line
    stanza: 1
    text: ಕಳೆಯುವುದೆಂತು ವೇಳೆಯನೆಲ್ಲ
  - id: poem-s2l1
    type: poem_line
    stanza: 2
    text: ಬಾ ಬಾ ನನಗೂ ಹಾಡಲು ಕಲಿಸು
  - id: poem-s2l2
    type: poem_line
    stanza: 2
    text: ಬಾ ಬಾ ನನಗೂ ಹಾರಲು ಕಲಿಸು
  - id: poem-s2l3
    type: poem_line
    stanza: 2
    text: ಅವ್ವನು ನೀರಿಗೆ ಹೋಗಿಹಳು
  - id: poem-s2l4
    type: poem_line
    stanza: 2
    text: ಅಪ್ಪನು ಪೇಟೆಗೆ ಹೋಗಿಹನು
  - id: poem-s3l1
    type: poem_line
    stanza: 3
    text: ಅವ್ವನು ಬರಲಿ ಅಪ್ಪನು ಬರಲಿ
  - id: poem-s3l2
    type: poem_line
    stanza: 3
    text: ತಿನ್ನಲು ಹಣ್ಣನು ಕೊಡಿಸುವೆನು
  - id: poem-s3l3
    type: poem_line
    stanza: 3
    text: ನನಗೂ ಎರಡು ರೆಕ್ಕೆಯ ಹಚ್ಚು
  - id: poem-s3l4
    type: poem_line
    stanza: 3
    text: ಹಿಂಗಡೆ ಬಣ್ಣದ ಪುಚ್ಚವ ಚುಚ್ಚು
  - id: poem-s4l1
    type: poem_line
    stanza: 4
    text: ನೆತ್ತಿಯ ಮೇಲೆ ಜುಟ್ಟನು ಹಚ್ಚು
  - id: poem-s4l2
    type: poem_line
    stanza: 4
    text: ಮೆಲ್ಲನೆ ಮೇಲೆ ಹಾರಲು ಹಚ್ಚು
  - id: poem-s4l3
    type: poem_line
    stanza: 4
    text: ನಾನು ನೀನೂ ಇಬ್ಬರು ಕೂಡಿ
  - id: poem-s4l4
    type: poem_line
    stanza: 4
    text: ಮುಗಿಲಿನ ಕಡೆಗೆ ಹಾರುವ ಬಾ
  - id: poem-s5l1
    type: poem_line
    stanza: 5
    text: ಅಲ್ಲಿಂದಿತ್ತ ಇಲ್ಲಿಂದತ್ತ
  - id: poem-s5l2
    type: poem_line
    stanza: 5
    text: ಹಾರುತ ಹಾಡುತ ನಲಿಯುವ ಬಾ

