labels:
  poem: padya
  vocab: kēḷida padagaḷu
  notes: padagaḷa artha
  exercise-A: 'a) padyada mundina sālugaḷannu hēḷi:'
  exercise-B: "ā) ī praśnegaḷige ondu padadalli uttara bareyiri:"
  exercise-C: "i) āvaraṇadalli iruva padagaḷalli sūkta pada ārisi khāli biṭṭa sthaḷadalli bareyiri:"
  exercise-D: "ī) ī prāsa padagaḷannu hēḷu:"
  title: baṇṇada hakki

poem-s1l1: bārale hakki baṇṇada hakki
poem-s1l2: bārale hakki hāruva hakki
poem-s1l3: geḷeyaru āḍalu yārū illa
poem-s1l4: kaḷeyuvudentu vēḷeyanella

poem-s2l1: bā bā nanagū hāḍalu kalisu
poem-s2l2: bā bā nanagū hāralu kalisu
poem-s2l3: avvanu nīrige hōgihaḷu
poem-s2l4: appanu pēṭege hōgihanu

poem-s3l1: avvanu barali appanu barali
poem-s3l2: tinnalu haṇṇanu koḍisuvenu
poem-s3l3: nanagū eraḍu rekkeya haccu
poem-s3l4: hiṅgaḍe baṇṇada puccava cuccu

poem-s4l1: nettiya mēle juṭṭanu haccu
poem-s4l2: mellane mēle hāralu haccu
poem-s4l3: nānu nīnū ibbaru kūḍi
poem-s4l4: mugilina kaḍege hāruva bā

poem-s5l1: allinditta illindatta
poem-s5l2: hāruta hāḍuta naliyuva bā

