labels:
  poem: कविता
  vocab: सुने गए शब्द
  notes: शब्दों के अर्थ
  exercise-A: "अ) कविता की अगली पंक्तियाँ बताएँ:"
  exercise-B: "आ) इन प्रश्नों के उत्तर एक शब्द में लिखें:"
  exercise-C: "इ) कोष्ठक में दिए गए शब्दों में से उचित शब्द चुनकर रिक्त स्थान में लिखें:"
  exercise-D: 'ई) ये तुकांत शब्द बताएँ:'
  title: रंग-बिरंगी चिड़िया

poem-s1l1: आ जा चिड़िया, रंग-बिरंगी चिड़िया
poem-s1l2: आ जा चिड़िया, उड़ने वाली चिड़िया
poem-s1l3: खेलने के लिए कोई दोस्त नहीं है
poem-s1l4: सारा समय कैसे बिताऊँ

poem-s2l1: आ आ मुझे भी गाना सिखा
poem-s2l2: आ आ मुझे भी उड़ना सिखा
poem-s2l3: माँ पानी लेने गई है
poem-s2l4: पिताजी बाज़ार गए हैं

poem-s3l1: माँ को आने दे, पिताजी को आने दे
poem-s3l2: मैं तुझे खाने के लिए फल दिलाऊँगा
poem-s3l3: मुझे भी दो पंख लगा दे
poem-s3l4: पीछे एक रंगीन पंख चुभा दे

poem-s4l1: सिर के ऊपर एक चोटी लगा दे
poem-s4l2: धीरे-से मुझे ऊपर उड़ना सिखा दे
poem-s4l3: मैं और तू दोनों मिलकर
poem-s4l4: आ, आसमान की ओर उड़ें

poem-s5l1: वहाँ से यहाँ, यहाँ से वहाँ
poem-s5l2: आ, उड़ें, गाएँ और खुशियाँ मनाएँ

