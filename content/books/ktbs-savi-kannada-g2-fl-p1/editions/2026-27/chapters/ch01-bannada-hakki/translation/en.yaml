  title: Colorful Bird

poem-s1l1: Come bird, colorful bird
poem-s1l2: Come bird, flying bird
poem-s1l3: There is no one to play with
poem-s1l4: How to spend all the time

poem-s2l1: Come come, teach me to sing too
poem-s2l2: Come come, teach me to fly too
poem-s2l3: Mother has gone to fetch water
poem-s2l4: Father has gone to the market

poem-s3l1: Let mother come, let father come
poem-s3l2: I will buy you fruit to eat
poem-s3l3: Stick two wings on me too
poem-s3l4: Poke a colorful feather behind

poem-s4l1: Stick a tuft on top of the head
poem-s4l2: Gently make me fly up
poem-s4l3: You and I, both together
poem-s4l4: Come, let's fly towards the sky

poem-s5l1: From there to here, from here to there
poem-s5l2: Come, let's fly, sing, and rejoice

