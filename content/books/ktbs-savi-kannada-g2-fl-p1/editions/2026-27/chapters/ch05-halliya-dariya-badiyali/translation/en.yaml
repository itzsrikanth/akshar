  title: By the Side of the Village Path

poem-s1l1: By the side of the village path, there was a
poem-s1l2: Mango tree
poem-s1l3: Spreading its many branches
poem-s1l4: It spread cool shade

poem-s2l1: Birds have built a nest
poem-s2l2: The chicks sang tweet-tweet
poem-s2l3: Mangoes swaying along with the leaves
poem-s2l4: Brought water to the mouth

poem-s3l1: The sweet fragrance under the mango tree
poem-s3l2: Attracted people's minds
poem-s3l3: Even though it is one tree, it does a hundred favors
poem-s3l4: It showed its greatness

poem-s4l1: Pure air, rain, the earth is a garden
poem-s4l2: The power of flowers and greenery
poem-s4l3: If there is greenery, there will be breath
poem-s4l4: Know this today

