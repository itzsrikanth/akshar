labels:
  poem: कविता
  vocab: सुने गए शब्द
  notes: शब्दों के अर्थ
  exercise-A: 'अ) इन प्रश्नों के उत्तर एक वाक्य में दें:'
  exercise-B: 'आ) खाली जगहों में सही शब्द लिखें:'
  exercise-C: 'इ) दिए गए शब्दों के लिए तुकांत शब्द बताएँ और लिखें:'
  title: गाँव के रास्ते के किनारे

poem-s1l1: गाँव के रास्ते के किनारे एक
poem-s1l2: आम का पेड़ था
poem-s1l3: अपनी कई शाखाएँ फैलाकर
poem-s1l4: उसने ठंडी छाया फैलाई थी

poem-s2l1: पक्षियों ने घोंसला बनाया है
poem-s2l2: बच्चे चीं-चीं गा रहे थे
poem-s2l3: पत्तों के साथ कच्चे आम झूलते हुए
poem-s2l4: मुँह में पानी लाते थे

poem-s3l1: आम के पेड़ के नीचे की मीठी महक
poem-s3l2: लोगों के मन को लुभाती थी
poem-s3l3: भले ही यह एक पेड़ है, इसके उपकार सौ हैं
poem-s3l4: इसने अपनी महानता दिखाई

poem-s4l1: शुद्ध हवा, बारिश, यह धरती ही नंदनवन (स्वर्ग) है
poem-s4l2: फूलों और हरियाली की ताकत
poem-s4l3: हरियाली होगी तभी साँस चलेगी
poem-s4l4: यह आज ही जान लो

