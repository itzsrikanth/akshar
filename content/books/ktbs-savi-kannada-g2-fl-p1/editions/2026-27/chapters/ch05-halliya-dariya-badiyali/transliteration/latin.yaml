labels:
  poem: padya
  vocab: kēḷida padagaḷu
  notes: padagaḷa artha
  exercise-A: 'a) ī praśnegaḷige ondu vākyadalli uttara hēḷi:'
  exercise-B: 'ā) khāli biṭṭiruva jāgagaḷalli sariyāda pada bareyiri:'
  exercise-C: 'i) koṭṭiruva padagaḷige prāsa pada hēḷi bareyiri :'
  title: haḷḷiya dāriya badiyali

poem-s1l1: haḷḷiya dāriya badiyali ondu
poem-s1l2: māvina maravittu
poem-s1l3: halavu kombegaḷanu cāci
poem-s1l4: taṇṇeḷalanu haraḍittu

poem-s2l1: hakki pakṣigaḷu gūḍanu kaṭṭide
poem-s2l2: marigaḷa cilipili hāḍittu
poem-s2l3: elegaḷa jotege kāyi tūgi
poem-s2l4: bāyali nīranu tandittu

poem-s3l1: māvina maradaḍi kammina parimaḷa
poem-s3l2: janara manavanu seḷedittu
poem-s3l3: maravondādaru upakāravu nūru
poem-s3l4: hirimeya tōrittu

poem-s4l1: śuddha gāḷi maḷe nandanavē iḷe
poem-s4l2: hū hasirina tākattu
poem-s4l3: hasiriddare usiru nilluvudu
poem-s4l4: tiḷiduko ī hottu

