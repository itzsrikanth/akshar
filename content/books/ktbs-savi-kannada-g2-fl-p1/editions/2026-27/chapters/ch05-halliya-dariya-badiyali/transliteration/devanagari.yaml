  exercise-A: 'अ) ई प्रश्नेगळिगे ओन्दु वाक्यदल्लि उत्तर हेळि:'
  exercise-B: 'आ) खालि बिट्टिरुव जागगळल्लि सरियाद पद बरेयिरि:'
  exercise-C: 'इ) कोट्टिरुव पदगळिगे प्रास पद हेळि बरेयिरि :'
  title: हळ्ळिय दारिय बदियलि

poem-s1l1: हळ्ळिय दारिय बदियलि ओन्दु
poem-s1l2: माविन मरवित्तु
poem-s1l3: हलवु कोम्बेगळनु चाचि
poem-s1l4: तण्णेळलनु हरडित्तु

poem-s2l1: हक्कि पक्षिगळु गूडनु कट्टिदे
poem-s2l2: मरिगळ चिलिपिलि हाडित्तु
poem-s2l3: एलेगळ जोतेगे कायि तूगि
poem-s2l4: बायलि नीरनु तन्दित्तु

poem-s3l1: माविन मरदडि कम्मिंन परिमळ
poem-s3l2: जनर मनवनु सेळेदित्तु
poem-s3l3: मरवोन्दादरु उपकारवु नूरु
poem-s3l4: हिरिमेय तोरित्तु

poem-s4l1: शुद्ध गाळि मळे नन्दनवे इळे
poem-s4l2: हू हसिरिन ताकत्तु
poem-s4l3: हसिरिद्दरे उसिरु निल्लुवुदु
poem-s4l4: तिळिदुको ई होत्तु

