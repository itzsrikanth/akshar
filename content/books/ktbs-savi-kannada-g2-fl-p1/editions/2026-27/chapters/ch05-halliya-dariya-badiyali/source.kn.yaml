labels:
  poem: ಪದ್ಯ
  vocab: ಕೇಳಿದ ಪದಗಳು
  notes: ಪದಗಳ ಅರ್ಥ
  exercise-A: 'ಅ) ಈ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಹೇಳಿ:'
  exercise-B: 'ಆ) ಖಾಲಿ ಬಿಟ್ಟಿರುವ ಜಾಗಗಳಲ್ಲಿ ಸರಿಯಾದ ಪದ ಬರೆಯಿರಿ:'
  exercise-C: 'ಇ) ಕೊಟ್ಟಿರುವ ಪದಗಳಿಗೆ ಪ್ರಾಸ ಪದ ಹೇಳಿ ಬರೆಯಿರಿ :'

segments:
  - id: poem-s1l1
    type: poem_line
    stanza: 1
    text: ಹಳ್ಳಿಯ ದಾರಿಯ ಬದಿಯಲಿ ಒಂದು
  - id: poem-s1l2
    type: poem_line
    stanza: 1
    text: ಮಾವಿನ ಮರವಿತ್ತು
  - id: poem-s1l3
    type: poem_line
    stanza: 1
    text: ಹಲವು ಕೊಂಬೆಗಳನು ಚಾಚಿ
  - id: poem-s1l4
    type: poem_line
    stanza: 1
    text: ತಣ್ಣೆಳಲನು ಹರಡಿತ್ತು

  - id: poem-s2l1
    type: poem_line
    stanza: 2
    text: ಹಕ್ಕಿ ಪಕ್ಷಿಗಳು ಗೂಡನು ಕಟ್ಟಿದೆ
  - id: poem-s2l2
    type: poem_line
    stanza: 2
    text: ಮರಿಗಳ ಚಿಲಿಪಿಲಿ ಹಾಡಿತ್ತು
  - id: poem-s2l3
    type: poem_line
    stanza: 2
    text: ಎಲೆಗಳ ಜೊತೆಗೆ ಕಾಯಿ ತೂಗಿ
  - id: poem-s2l4
    type: poem_line
    stanza: 2
    text: ಬಾಯಲಿ ನೀರನು ತಂದಿತ್ತು

  - id: poem-s3l1
    type: poem_line
    stanza: 3
    text: ಮಾವಿನ ಮರದಡಿ ಕಮ್ಮಿನ ಪರಿಮಳ
  - id: poem-s3l2
    type: poem_line
    stanza: 3
    text: ಜನರ ಮನವನು ಸೆಳೆದಿತ್ತು
  - id: poem-s3l3
    type: poem_line
    stanza: 3
    text: ಮರವೊಂದಾದರು ಉಪಕಾರವು ನೂರು
  - id: poem-s3l4
    type: poem_line
    stanza: 3
    text: ಹಿರಿಮೆಯ ತೋರಿತ್ತು

  - id: poem-s4l1
    type: poem_line
    stanza: 4
    text: ಶುದ್ಧ ಗಾಳಿ ಮಳೆ ನಂದನವೇ ಇಳೆ
  - id: poem-s4l2
    type: poem_line
    stanza: 4
    text: ಹೂ ಹಸಿರಿನ ತಾಕತ್ತು
  - id: poem-s4l3
    type: poem_line
    stanza: 4
    text: ಹಸಿರಿದ್ದರೆ ಉಸಿರು ನಿಲ್ಲುವುದು
  - id: poem-s4l4
    type: poem_line
    stanza: 4
    text: ತಿಳಿದುಕೊ ಈ ಹೊತ್ತು

