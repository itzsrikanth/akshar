  notes: ಪದಗಳ ಅರ್ಥ
  exercise-A: 'ಅ) ಈ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರ ಹೇಳಿ:'
  exercise-B: 'ಆ) ಈ ಕೆಳಗಿನ ವಾಕ್ಯಗಳು ಸರಿ ಅಥವಾ ತಪ್ಪು ಎಂಬುದನ್ನು ಗುರುತಿಸಿ:'
  exercise-C: 'ಇ) ಖಾಲಿ ಬಿಟ್ಟಿರುವ ಜಾಗಗಳಲ್ಲಿ ಸರಿಯಾದ ಪದ ತುಂಬಿ:'
  exercise-D: 'ಈ) ಕೆಳಗೆ ಕೊಟ್ಟಿರುವ ಒತ್ತಕ್ಷರ ಪದಗಳನ್ನು ಓದಿ ನಕಲು ಮಾಡಿ:'
  exercise-E: 'ಉ) ಮಾದರಿಯಂತೆ ಕೆಳಗಿನ ಪದಗಳನ್ನು ಬರೆಯಿರಿ:'
  exercise-F: 'ಊ) ಚೌಕಗಳಲ್ಲಿ ಕೊಟ್ಟಿರುವ ಅಕ್ಷರಗಳನ್ನು ಬಳಸಿ ಅರ್ಥಬರುವ ಒತ್ತಕ್ಷರ ಪದಗಳನ್ನು ರಚಿಸಿ:'
  exercise-G: 'ಋ) ಕೊಟ್ಟಿರುವ ವಾಕ್ಯಗಳನ್ನು ದುಂಡಾಗಿ ನಕಲು ಮಾಡಿ:'

segments:
  - id: prose-p1
    type: prose
    text: ಬೆಂಗಳೂರು ಭಾರತ ದೇಶದ ಸುಂದರ ನಗರಗಳಲ್ಲಿ ಒಂದು. ಅದು ಈಗ ಕರ್ನಾಟಕ ರಾಜ್ಯದ ರಾಜಧಾನಿಯಾಗಿದೆ. ಸುಮಾರು ನಾಲ್ಕನೂರು ವರ್ಷಗಳ ಹಿಂದೆ ಈಗಿನ ಬೆಂಗಳೂರು ನಗರವು ಇರುವ ಸ್ಥಳದಲ್ಲಿ ಒಂದು ಕಾಡು ಇತ್ತು. ಆ ಕಾಡಿನ ಉತ್ತರಕ್ಕೆ ತುಸು ದೂರದಲ್ಲಿ ಬೆಂಗಳೂರು ಎಂಬ ಒಂದು ಚಿಕ್ಕ ಹಳ್ಳಿಯಿತ್ತು. ಕಾಡಿನ ದಕ್ಷಿಣಕ್ಕೆ ಶಿವಸಮುದ್ರವೆಂಬ ಹಳ್ಳಿಯಿತ್ತು. ಇವೆರಡು ಹಳ್ಳಿಗಳ ನಡುವಿದ್ದ ಕಾಡಿನಲ್ಲಿ ಬೆಂಗಳೂರು ಹುಟ್ಟಿತು. ಅದನ್ನು ಕೆಂಪೇಗೌಡರೆಂಬ ದೊರೆಗಳು ಸಾಮಾನ್ಯ ಶಕ 1537ರಲ್ಲಿ ಕಟ್ಟಿಸಿದರು. ಅದನ್ನು ತನ್ನ ರಾಜಧಾನಿಯಾಗಿ ಮಾಡಿಕೊಂಡು ಆಳಿದರು.
  - id: prose-p2
    type: prose
    text: ಕೆಂಪೇಗೌಡರು ಯಲಹಂಕ ನಾಡಿನ ದೊರೆ. ಆಗ ಯಲಹಂಕನಾಡು ವಿಜಯನಗರ ಸಾಮ್ರಾಜ್ಯದ ಒಂದು ಭಾಗವಾಗಿತ್ತು. ಈಗಿನ ಬೆಂಗಳೂರಿನ ಉತ್ತರಕ್ಕಿರುವ ಯಲಹಂಕ ಎಂಬ ಊರೇ ಕೆಂಪೇಗೌಡರ ಮೊದಲಿನ ರಾಜಧಾನಿಯಾಗಿತ್ತು. ಕೆಂಪೇಗೌಡರು ಶೂರರೂ ದಯಾಳುವೂ ದೇವರಲ್ಲಿ ಭಕ್ತಿಯುಳ್ಳವರೂ ಆಗಿದ್ದರು. ಪ್ರಜೆಗಳನ್ನು ತನ್ನ ಮಕ್ಕಳಂತೆ ಪ್ರೀತಿಸುತ್ತಿದ್ದರು. ಪ್ರಜೆಗಳೂ ಅವರನ್ನು ತಂದೆಯಂತೆ ಗೌರವಿಸುತ್ತಿದ್ದರು.
  - id: prose-p3
    type: prose
    text: ಒಂದು ದಿನ ಕೆಂಪೇಗೌಡರಿಗೆ ಒಂದು ಕನಸು ಬಿತ್ತು. ಕನಸಿನಲ್ಲಿ ಒಬ್ಬ ದೇವಿಯು ಬಂದು ಶಿವಸಮುದ್ರದ ಬಳಿಯ ಕಾಡಿನಲ್ಲಿ ಕಾಣದಾದಳು. ಕೆಂಪೇಗೌಡರಿಗೆ ಆ ಕನಸಿನ ಅರ್ಥ ತಿಳಿಯಲಿಲ್ಲ. ಮತ್ತೆ ಮತ್ತೆ ಅದೇ ಕನಸು ಬಿತ್ತು. ಕೆಂಪೇಗೌಡರಿಗೆ ಆಶ್ಚರ್ಯವಾಯಿತು. ಅವರು ದೈವಭಕ್ತರು. ದೇವಿಯ ಅಪ್ಪಣೆ ಏನಿರಬೇಕೆಂದು ತಿಳಿಯಬಯಸಿದರು. ಮರುದಿನ ತನ್ನ ಮಂತ್ರಿಗಳನ್ನೂ ಗುರುಹಿರಿಯರನ್ನೂ ಕರೆಯಿಸಿಕೊಂಡರು. ತನ್ನ ಕನಸನ್ನು ಅವರಿಗೆ ತಿಳಿಸಿದರು. ಅದು ಒಳ್ಳೆಯ ಕನಸೆಂದು ಮಂತ್ರಿಗಳೂ ಗುರುಹಿರಿಯರೂ ಹೇಳಿದರು. ಕನಸಿನಲ್ಲಿ ದೇವಿಯು ಕಾಣಿಸಿಕೊಂಡು ಮರೆಯಾದ ಕಾಡಿನಲ್ಲಿ ಒಂದು ನಗರವನ್ನು ಕಟ್ಟಬೇಕೆಂದು ತಿಳಿಸಿದರು. ಅದರಂತೆ ಕೆಂಪೇಗೌಡರು ಒಂದು ನಗರವನ್ನು ಕಟ್ಟಿಸಲು ನಿಶ್ಚಯಿಸಿದರು.
  - id: prose-p4
    type: prose
    text: ಶಿವಸಮುದ್ರದ ಬಳಿಯಲ್ಲಿ ಸ್ಥಳವನ್ನು ಗುರುತು ಮಾಡಿಕೊಂಡರು. ದೇಶದ ನಾನಾ ಭಾಗಗಳಿಂದ ಶಿಲ್ಪಿಗಳನ್ನು ಕರೆಸಿದರು. ಹೊಸ ನಗರವನ್ನು ಕಟ್ಟಿಸಿದರು. ಹೊಸ ನಗರವು ಶಿವಸಮುದ್ರದ ಬಳಿ ಇದ್ದುದರಿಂದ ಶಿವಸಮುದ್ರವೆಂದು ಅದಕ್ಕೆ ಹೆಸರು ಇಡಬೇಕಾಗಿತ್ತು. ಆದರೆ ಕೆಂಪೇಗೌಡರಿಗೆ ಆ ಹೆಸರು ಒಪ್ಪಿಗೆಯಾಗಲಿಲ್ಲ. ಕೆಂಪೇಗೌಡರ ತಾಯಿ ಲಿಂಗಮಾಂಬೆಯವರ ತವರೂರಾದ ಬೆಂಗಳೂರು ಎಂಬ ಹಳ್ಳಿ ಸಮೀಪದಲ್ಲಿಯೇ ಇತ್ತು. ಕೆಂಪೇಗೌಡರ ಹೆಂಡತಿ ಚೆನ್ನಾಂಬೆ ಹಾಗೂ ಸೊಸೆ ಲಕ್ಷ್ಮಾಂಬೆಯರ ತವರೂರು ಬೆಂಗಳೂರು ಹಳ್ಳಿಯೇ. ತನ್ನ ತಾಯಿ, ಹೆಂಡತಿ ಹಾಗೂ ಸೊಸೆ ಇವರನ್ನು ಕೆಂಪೇಗೌಡರು ಬಹಳವಾಗಿ ಪ್ರೀತಿಸುತ್ತಿದ್ದರು. ಅವರನ್ನು ಬಹು ಗೌರವದಿಂದ ಕಾಣುತ್ತಿದ್ದರು. ಆದುದರಿಂದ ಅವರ ಸವಿನೆನಪಿಗಾಗಿ ತಾನು ಕಟ್ಟಿಸಿದ ಹೊಸ ನಗರಕ್ಕೆ ಬೆಂಗಳೂರೆಂದು ಹೆಸರಿಟ್ಟರು.
  - id: prose-p5
    type: prose
    text: ಬೆಂಗಳೂರು ನಗರವನ್ನು ಕಟ್ಟಿಸಿದ ಸುದ್ದಿಯು ಸುತ್ತಲೂ ಹರಡಿತು. ದೇಶದ ನಾನಾ ಭಾಗಗಳಿಂದ ಕಸಬುದಾರರು ಬಂದರು. ಕಸಬುಗಳು ಚೆನ್ನಾಗಿ ಬೆಳೆಯಲೆಂದು ಬೇರೆ ಬೇರೆ ಕಸಬುದಾರರಿಗೆ ಕೆಂಪೇಗೌಡರು ಬೇರೆ ಬೇರೆ ಕೇರಿಗಳನ್ನು ಕಟ್ಟಿಸಿಕೊಟ್ಟರು. ಕಸಬುದಾರರಿಂದ ಕೈಗಾರಿಕೆಗಳು ಬೆಳೆದವು. ಬೆಂಗಳೂರಿನ ಸಂಪತ್ತು ಹೆಚ್ಚಿತು. ಸಂಪತ್ತಿನೊಡನೆ ಪಟ್ಟಣವೂ ಬೆಳೆಯತೊಡಗಿತು. ಪಟ್ಟಣದ ನಾಲ್ಕು ಮೂಲೆಗಳಲ್ಲಿ ನಾಲ್ಕು ಕಾವಲು ಗೋಪುರಗಳನ್ನು ಕಟ್ಟಿಸಿದರು. ಬೆಂಗಳೂರಲ್ಲಿ ಈ ಗೋಪುರಗಳನ್ನು ಈಗಲೂ ನೋಡಬಹುದು.
  - id: prose-p6
    type: prose
    text: ಕೆಂಪೇಗೌಡರು ಅನೇಕ ಗುಡಿಗಳನ್ನೂ ಕೆರೆಗಳನ್ನೂ ಕಟ್ಟಿಸಿದರು. ಅವುಗಳಲ್ಲಿ ಬೆಂಗಳೂರಿನಲ್ಲಿರುವ ದೊಡ್ಡ ಬಸವಣ್ಣನ ಗುಡಿ, ಗವಿ ಗಂಗಾಧರೇಶ್ವರ ಗುಡಿ ಮತ್ತು ಕೆಂಪಾಂಬುಧಿ ಕೆರೆ ಇವು ಮುಖ್ಯವಾದವು. ಕೆಂಪೇಗೌಡರ ದೈವಭಕ್ತಿ, ಪ್ರಜಾಪ್ರೇಮ, ಬುದ್ಧಿವಂತಿಕೆ ಇವುಗಳನ್ನು ವಿಜಯನಗರದ ಅರಸರಾಗಿದ್ದ ಅಚ್ಯುತರಾಯರು ಬಹಳ ಮೆಚ್ಚಿದರು. ಅಂದವಾದ ಬೆಂಗಳೂರು ನಗರದ ಸುದ್ದಿ ಕೇಳಿ ಅರಸರಿಗೆ ಬಹಳ ಸಂತೋಷವಾಯಿತು. ದಸರೆಯ ಉತ್ಸವಕ್ಕೆ ವಿಜಯನಗರದ ಮಹಾರಾಜರು ಕೆಂಪೇಗೌಡರನ್ನು ಬರಮಾಡಿಕೊಂಡರು. ಬೆಂಗಳೂರು ಸಮೀಪದ ಹತ್ತು ಊರುಗಳನ್ನು ಅವರು ಕೆಂಪೇಗೌಡರಿಗೆ ದಾನವಾಗಿ ಕೊಟ್ಟರು. ಕೆಂಪೇಗೌಡರು ಕಟ್ಟಿಸಿದ ಬೆಂಗಳೂರು ದೊಡ್ಡ ನಗರವಾಗಿ ಬೆಳೆದು ಈಗ ನಮ್ಮ ರಾಜ್ಯದ ರಾಜಧಾನಿಯಾಗಿದೆ.

