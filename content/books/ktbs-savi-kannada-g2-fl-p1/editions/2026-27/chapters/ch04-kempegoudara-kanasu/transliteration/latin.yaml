  title: kempēgauḍara kanasu

prose-p1: beṅgaḷūru bhārata dēśada sundara nagaragaḷalli ondu. adu īga karnāṭaka rājyada rājadhāniyāgide. sumāru nālkanūru varṣagaḷa hinde īgina beṅgaḷūru nagaravu iruva sthaḷadalli ondu kāḍu ittu. ā kāḍina uttarakke tusu dūradalli beṅgaḷūru emba ondu cikka haḷḷiyittu. kāḍina dakṣiṇakke śivasamudravemba haḷḷiyittu. iveraḍu haḷḷigaḷa naḍuvidda kāḍinalli beṅgaḷūru huṭṭitu. adannu kempēgauḍaremba doregaḷu sāmānya śaka 1537ralli kaṭṭisidaru. adannu tanna rājadhāniyāgi māḍikoṇḍu āḷidaru.
prose-p2: kempēgauḍaru yalahaṅka nāḍina dore. āga yalahaṅkanāḍu vijayanagara sāmrājyada ondu bhāgavāgittu. īgina beṅgaḷūrina uttarakkiruva yalahaṅka emba ūrē kempēgauḍara modalina rājadhāniyāgittu. kempēgauḍaru śūrarū dayāḷuvū dēvaralli bhaktiyuḷḷavarū āgiddaru. prajegaḷannu tanna makkaḷante prītisuttiddaru. prajegaḷū avarannu tandeyante gauravisuttiddaru.
prose-p3: ondu dina kempēgauḍarige ondu kanasu bittu. kanasinalli obba dēviyu bandu śivasamudrada baḷiya kāḍinalli kāṇadādaḷu. kempēgauḍarige ā kanasina artha tiḷiyalilla. matte matte adē kanasu bittu. kempēgauḍarige āścaryavāyitu. avaru daivabhaktaru. dēviya appaṇe ēnirabēkendu tiḷiyabayasidaru. marudina tanna mantrigaḷannū guruhiriyarannū kareyisikoṇḍaru. tanna kanasannu avarige tiḷisidaru. adu oḷḷeya kanasendu mantrigaḷū guruhiriyarū hēḷidaru. kanasinalli dēviyu kāṇisikoṇḍu mareyāda kāḍinalli ondu nagaravannu kaṭṭabēkendu tiḷisidaru. adarante kempēgauḍaru ondu nagaravannu kaṭṭisalu niścayisidaru.
prose-p4: śivasamudrada baḷiyalli sthaḷavannu gurutu māḍikoṇḍaru. dēśada nānā bhāgagaḷinda śilpigaḷannu karesidaru. hosa nagaravannu kaṭṭisidaru. hosa nagaravu śivasamudrada baḷi iddudarinda śivasamudravendu adakke hesaru iḍabēkāgittu. ādare kempēgauḍarige ā hesaru oppigeyāgalilla. kempēgauḍara tāyi liṅgamāmbeyavara tavarūrāda beṅgaḷūru emba haḷḷi samīpadalliyē ittu. kempēgauḍara heṇḍati cennāmbe hāgū sose lakṣmāmbeyara tavarūru beṅgaḷūru haḷḷiyē. tanna tāyi, heṇḍati hāgū sose ivarannu kempēgauḍaru bahaḷavāgi prītisuttiddaru. avarannu bahu gauravadinda kāṇuttiddaru. ādudarinda avara savinenapigāgi tānu kaṭṭisida hosa nagarakke beṅgaḷūrendu hesariṭṭaru.
prose-p5: beṅgaḷūru nagaravannu kaṭṭisida suddiyu suttalū haraḍitu. dēśada nānā bhāgagaḷinda kasabudāraru bandaru. kasabugaḷu cennāgi beḷeyalendu bēre bēre kasabudārarige kempēgauḍaru bēre bēre kērigaḷannu kaṭṭisikoṭṭaru. kasabudārarinda kaigārikegaḷu beḷedavu. beṅgaḷūrina sampattu heccitu. sampattinoḍane paṭṭaṇavū beḷeyatoḍagitu. paṭṭaṇada nālku mūlegaḷalli nālku kāvalu gōpuragaḷannu kaṭṭisidaru. beṅgaḷūralli ī gōpuragaḷannu īgalū nōḍabahudu.
prose-p6: kempēgauḍaru anēka guḍigaḷannū keregaḷannū kaṭṭisidaru. avugaḷalli beṅgaḷūrinalliruva doḍḍa basavaṇṇana guḍi, gavi gaṅgādharēśvara guḍi mattu kempāmbudhi kere ivu mukhyavādavu. kempēgauḍara daivabhakti, prajāprēma, buddhivantike ivugaḷannu vijayanagarada arasarāgidda acyutarāyaru bahaḷa meccidaru. andavāda beṅgaḷūru nagarada suddi kēḷi arasarige bahaḷa santōṣavāyitu. dasareya utsavakke vijayanagarada mahārājaru kempēgauḍarannu baramāḍikoṇḍaru. beṅgaḷūru samīpada hattu ūrugaḷannu avaru kempēgauḍarige dānavāgi koṭṭaru. kempēgauḍaru kaṭṭisida beṅgaḷūru doḍḍa nagaravāgi beḷedu īga namma rājyada rājadhāniyāgide.

