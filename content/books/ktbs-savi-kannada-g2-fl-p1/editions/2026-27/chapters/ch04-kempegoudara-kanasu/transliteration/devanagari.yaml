  vocab: केळिद पदगळु
  notes: पदगळ अर्थ
  exercise-A: 'अ) ई प्रश्नेगळिगे उत्तर हेळि:'
  exercise-B: 'आ) ई केळगिन वाक्यगळु सरि अथवा तप्पु एम्बुदन्नु गुरुतिसि:'
  exercise-C: 'इ) खालि बिट्टिरुव जागगळल्लि सरियाद पद तुम्बि:'
  exercise-D: 'ई) केळगे कोट्टिरुव ओत्तक्षर पदगळन्नु ओदि नकलु माडि:'
  exercise-E: 'उ) मादरियन्ते केळगिन पदगळन्नु बरेयिरि:'
  exercise-F: 'ऊ) चौकगळल्लि कोट्टिरुव अक्षरगळन्नु बळसि अर्थबरुव ओत्तक्षर पदगळन्नु रचिगि:'
  exercise-G: 'ऋ) कोट्टिरुव वाक्यगळन्नु दुण्डागि नकलु माडि:'
  title: केम्पेगौडर कनसु

prose-p1: बेङ्गळूरु भारत देशद सुन्दर नगरगळल्लि ओन्दु. अदु ईग कर्णाटक राज्यद राजधानियागिदे. सुमारु नाल्कनूरु वर्षगळ हिन्दे ईगिन बेङ्गळूरु नगरवु इरुव स्थळदल्लि ओन्दु काडु इत्तु. आ काडिन उत्तरक्के तुसु दूरदल्लि बेङ्गळूरु एम्ब ओन्दु चिक्क हळ्ळियित्तु. काडिन दक्षिणक्के शिवसमुद्रवेम्ब हळ्ळियित्तु. इवेरडु हळ्ळिगळ नडुविद्द काडिनल्लि बेङ्गळूरु हुट्टितु. अदन्नु केम्पेगौडरेम्ब दोरेगळु सामान्य शक 1537रल्लि कट्टिसिदरु. अदन्नु तन्न राजधानियागि माडिकोण्डु आळिदरु.
prose-p2: केम्पेगौडरु यलहङ्क नाडिन दोरे. आग यलहङ्कनाडु विजयनगर साम्राज्यद ओन्दु भागवागित्तु. ईगिन बेङ्गळूरिन उत्तरक्किरुव यलहङ्क एम्ब ऊरे केम्पेगौडर मोदलिन राजधानियागित्तु. केम्पेगौडरु शूररू दयाळुवू देवरल्लि भक्तियुळ्ळवरू आगिद्दरु. प्रजेगळन्नु तन्न मक्क़ळन्ते प्रीतिसुत्तिद्दरु. प्रजेगळू अवरन्नु तन्देयन्ते गौरविगसुत्तिद्दरु.
prose-p3: ओन्दु दिन केम्पेगौडरिंगे ओन्दु कनसु बित्तु. कनसिंनल्लि ओब्ब देवियु बन्दु शिवसमुद्रद बळिय काडिनल्लि काणदादळु. केम्पेगौडरिंगे आ कनसिंन अर्थ तिळियलिल्ल. मत्ते मत्ते अदे कनसु बित्तु. केम्पेगौडरिंगे आश्चर्यवायितु. अवरु दैवभक्तरु. देविय अप्पणे एनिरबेकेन्दु तिळियबयसिदरु. मरुदिन तन्न मन्त्रिगळन्नू गुरुहिरियरन्नू करेयिसिकोण्डरु. तन्न कनसुन्नु अवरिगे तिळिसिदरु. अदु ओळ्ळेय कनसेन्दु मन्त्रिगळू गुरुहिरियरू हेळिदरु. कनसिंनल्लि देवियु काणिसिकोण्डु मरेयाद काडिनल्लि ओन्दु नगरवन्नु कट्टबेकेन्दु तिळिसिदरु. अदनन्ते केम्पेगौडरु ओन्दु नगरवन्नु कट्टिसलु निश्चयिसिदरु.
prose-p4: शिवसमुद्रद बळियल्लि स्थळवन्नु गुरुतु माडिकोण्डरु. देशद नाना भागगळिन्द शिल्पिगळन्नु करेसिदरु. होस नगरवन्नु कट्टिसिदरु. होस नगरवु शिवसमुद्रद बळि इद्दुदरिन्द शिवसमुद्रवेन्दु अदक्के हेसरु इडबेकागित्तु. आदरे केम्पेगौडरिंगे आ हेसरु ओप्पिगेयागलिल्ल. केम्पेगौडर तायि लिङ्गमाम्बेयवर तवरूराद बेङ्गळूरु एम्ब हळ्ळि समीपदल्लिये इत्तु. केम्पेगौडर हेण्डति चेन्नाम्बे हागू सोसे लक्ष्माम्बेयर तवरूरु बेङ्गळूरु हळ्ळिये. तन्न तायि, हेण्डति हागू सोसे इवरन्नु केम्पेगौडरु बहळवागि प्रीतिसुत्तिद्दरु. अवरन्नु बहु गौरवदिन्द काणुत्तिद्दरु. आदुदरिन्द अवर सविनेनपिगागि तानु कट्टिसिद होस नगरक्के बेङ्गळूरेन्दु हेसरिट्टरु.
prose-p5: बेङ्गळूरु नगरवन्नु कट्टिसिद सुद्दियु सुत्तलू हरडितु. देशद नाना भागगळिन्द कसबुदाररु बन्दरु. कसबुगळु चेन्नागि बेळेयलेन्दु बेरे बेरे कसबुदाररिगे केम्पेगौडरु बेरे बेरे केरिगळन्नु कट्टिसिकोट्टरु. कसबुदाररिन्द कैगारिकेगळु बेळेदवु. बेङ्गळूरिन सम्पत्तु हेच्चितु. सम्पत्तिनोडने पट्टणवू बेळेयतोडगितु. पट्टणद नाल्कु मूलेगळल्लि नाल्कु कावलु गोपुरगळन्नु कट्टिसिदरु. बेङ्गळूरल्लि ई गोपुरगळन्नु ईगलू नोडबहुदु.
prose-p6: केम्पेगौडरु अनेक गुडिगळन्नू केरेगळन्नू कट्टिसिदरु. अवुगळल्लि बेङ्गळूरिनल्लिरुव दोड्ड बसवण्णन गुडि, गवि गङ्गाधरेश्वर गुडि मत्तु केम्पाम्बुधि केरे इवु मुख्यवादवु. केम्पेगौडर दैवभक्ति, प्रजाप्रेम, बुद्धिवन्तिके इवुगळन्नु विजयनगरद अरसरागिद्द अच्युतरायरु बहळ मेच्चिदरु. अन्दवाद बेङ्गळूरु नगरद सुद्दि केळि अरसरिगे बहळ सन्तोषवायितु. दसरेय उत्सवक्के विजयनगरद महाराजरु केम्पेगौडरन्नु बरमाडिकोण्डरु. बेङ्गळूरु समीपद हत्तु ऊरुगळन्नु अवरु केम्पेगौडरिंगे दानवागि कोट्टरु. केम्पेगौडरु कट्टिसिद बेङ्गळूरु दोड्ड नगरवागि बेळेदु ईग नम्म राज्यद राजधानियागिदे.

