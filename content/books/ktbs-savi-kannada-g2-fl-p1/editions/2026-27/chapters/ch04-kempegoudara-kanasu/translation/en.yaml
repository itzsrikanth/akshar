  title: Kempegowda's Dream

prose-p1: Bengaluru is one of the beautiful cities in India. It is now the capital of Karnataka state. About four hundred years ago, there was a forest in the place where present-day Bengaluru city is. A little distance to the north of that forest, there was a small village called Bengaluru. To the south of the forest, there was a village called Shivasamudra. In the forest between these two villages, Bengaluru was born. The kings named Kempegowda built it in the common era 1537. He made it his capital and ruled.
prose-p2: Kempegowda was the king of Yalahanka Nadu. Then Yalahankanadu was a part of the Vijayanagara empire. The village Yalahanka, to the north of present-day Bengaluru, was Kempegowda's first capital. Kempegowda was brave, kind, and devoted to God. He loved his subjects like his own children. The subjects too respected him like a father.
prose-p3: One day Kempegowda had a dream. In the dream, a Goddess came and disappeared in the forest near Shivasamudra. Kempegowda did not understand the meaning of that dream. He had the same dream again and again. Kempegowda was surprised. He was devoted to God. He wanted to know what the Goddess's command could be. The next day he called his ministers and elders. He told them about his dream. The ministers and elders said it was a good dream. The Goddess who appeared and disappeared in the dream told him to build a city in the forest. Accordingly, Kempegowda decided to build a city.
prose-p4: He marked the place near Shivasamudra. He called sculptors from different parts of the country. He built the new city. Since the new city was near Shivasamudra, it had to be named Shivasamudra. But Kempegowda did not agree to that name. The village Bengaluru, the maternal home of Kempegowda's mother Lingamambe, was nearby. The maternal home of Kempegowda's wife Chennambe and daughter-in-law Lakshmambe was also Bengaluru village. Kempegowda loved his mother, wife, and daughter-in-law very much. He treated them with great respect. Therefore, in their sweet memory, he named the new city he built Bengaluru.
prose-p5: The news of building Bengaluru city spread all around. Artisans came from different parts of the country. Kempegowda built different streets for different artisans so that their crafts could grow well. Industries grew because of the artisans. Bengaluru's wealth increased. Along with wealth, the town also began to grow. He built four watchtowers in the four corners of the town. These towers can still be seen in Bengaluru today.
prose-p6: Kempegowda built many temples and lakes. Among them, the big Basavanna temple, Gavi Gangadhareshwara temple, and Kempambudhi lake in Bengaluru are important. Achyutaraya, the king of Vijayanagara, appreciated Kempegowda's devotion to God, love for subjects, and intelligence very much. The king was very happy to hear the news of the beautiful Bengaluru city. The Maharaja of Vijayanagara invited Kempegowda to the Dasara festival. He donated ten villages near Bengaluru to Kempegowda. The Bengaluru built by Kempegowda grew into a big city and is now the capital of our state.

