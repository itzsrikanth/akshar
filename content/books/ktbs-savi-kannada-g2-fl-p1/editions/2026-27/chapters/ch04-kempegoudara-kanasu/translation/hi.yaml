  title: केम्पेगौड़ा का सपना

prose-p1: बेंगलुरु भारत के सुंदर शहरों में से एक है। यह अब कर्नाटक राज्य की राजधानी है। लगभग चार सौ साल पहले, जहाँ आज बेंगलुरु शहर है, वहाँ एक जंगल हुआ करता था। उस जंगल के उत्तर में थोड़ी दूरी पर बेंगलुरु नाम का एक छोटा सा गाँव था। जंगल के दक्षिण में शिवसमुद्र नाम का एक गाँव था। इन दोनों गाँवों के बीच के जंगल में बेंगलुरु का जन्म हुआ। इसे केम्पेगौड़ा नामक राजा ने सामान्य युग 1537 में बनवाया था। उन्होंने इसे अपनी राजधानी बनाया और शासन किया।
prose-p2: केम्पेगौड़ा येलहंका नाडु के राजा थे। उस समय येलहंका नाडु विजयनगर साम्राज्य का एक हिस्सा था। आज के बेंगलुरु के उत्तर में स्थित येलहंका नामक गाँव ही केम्पेगौड़ा की पहली राजधानी थी। केम्पेगौड़ा वीर, दयालु और भगवान के भक्त थे। वे अपनी प्रजा से अपने बच्चों की तरह प्यार करते थे। प्रजा भी उन्हें पिता के समान सम्मान देती थी।
prose-p3: एक दिन केम्पेगौड़ा ने एक सपना देखा। सपने में एक देवी आईं और शिवसमुद्र के पास के जंगल में गायब हो गईं। केम्पेगौड़ा को उस सपने का अर्थ समझ में नहीं आया। बार-बार वही सपना आया। केम्पेगौड़ा को आश्चर्य हुआ। वे भगवान के भक्त थे। वे जानना चाहते थे कि देवी का आदेश क्या हो सकता है। अगले दिन उन्होंने अपने मंत्रियों और बुजुर्गों को बुलाया। उन्होंने उन्हें अपने सपने के बारे में बताया। मंत्रियों और बुजुर्गों ने कहा कि यह एक शुभ सपना है। सपने में देवी ने प्रकट होकर और गायब होकर यह संकेत दिया कि उस जंगल में एक शहर बनाया जाना चाहिए। इसके अनुसार, केम्पेगौड़ा ने एक शहर बनाने का निश्चय किया।
prose-p4: उन्होंने शिवसमुद्र के पास जगह को चिह्नित किया। देश के विभिन्न हिस्सों से मूर्तिकारों को बुलाया। नया शहर बनवाया। चूँकि नया शहर शिवसमुद्र के पास था, इसलिए इसका नाम शिवसमुद्र रखा जाना था। लेकिन केम्पेगौड़ा को वह नाम पसंद नहीं आया। केम्पेगौड़ा की माँ लिंगमाम्बे का मायका बेंगलुरु नामक गाँव पास में ही था। केम्पेगौड़ा की पत्नी चेन्नाम्बे और बहू लक्ष्माम्बे का मायका भी बेंगलुरु गाँव ही था। केम्पेगौड़ा अपनी माँ, पत्नी और बहू से बहुत प्यार करते थे। वे उनका बहुत सम्मान करते थे। इसलिए, उनकी मधुर स्मृति में, उन्होंने अपने द्वारा बनाए गए नए शहर का नाम बेंगलुरु रखा।
prose-p5: बेंगलुरु शहर के बनने की खबर चारों ओर फैल गई। देश के विभिन्न हिस्सों से कारीगर आए। कारीगरों के शिल्प को अच्छी तरह से विकसित करने के लिए केम्पेगौड़ा ने अलग-अलग कारीगरों के लिए अलग-अलग मोहल्ले बनवाए। कारीगरों से उद्योग फले-फूले। बेंगलुरु की संपत्ति बढ़ी। संपत्ति के साथ-साथ शहर भी बढ़ने लगा। शहर के चारों कोनों में चार निगरानी मीनारें बनवाई गईं। इन मीनारों को आज भी बेंगलुरु में देखा जा सकता है।
prose-p6: केम्पेगौड़ा ने कई मंदिर और झीलें बनवाईं। उनमें से बेंगलुरु में बड़ा बसवन्ना मंदिर, गवी गंगाधरेश्वर मंदिर और केम्पाम्बुधि झील प्रमुख हैं। विजयनगर के राजा अच्युत राय ने केम्पेगौड़ा की देवभक्ति, प्रजा प्रेम और बुद्धिमत्ता की बहुत सराहना की। सुंदर बेंगलुरु शहर की खबर सुनकर राजा बहुत खुश हुए। विजयनगर के महाराजा ने केम्पेगौड़ा को दशहरा उत्सव में आमंत्रित किया। उन्होंने बेंगलुरु के पास के दस गाँव केम्पेगौड़ा को दान में दिए। केम्पेगौड़ा द्वारा बनाया गया बेंगलुरु एक बड़े शहर के रूप में विकसित हुआ और अब हमारे राज्य की राजधानी है।

