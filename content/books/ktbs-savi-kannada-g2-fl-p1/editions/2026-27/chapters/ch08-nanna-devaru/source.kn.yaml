  exercise-A: 'ಅ) ''ನನ್ನ ದೇವರು'' ಪದ್ಯವನ್ನು ರಾಗವಾಗಿ ಹಾಡಿ:'
  exercise-B: 'ಆ) ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಹೇಳಿರಿ:'
  exercise-C: 'ಇ) ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ:'
  exercise-D: 'ಈ) ಗುಂಪಿಗೆ ಸೇರದ ಪದ ಗುರುತಿಸಿ ಬರೆಯಿರಿ :'
  exercise-E: 'ಉ) ಮಾದರಿಯಂತೆ ಪದ ಬರೆ :'
  exercise-F: 'ಊ) ಈ ಕಥೆಯನ್ನು ಓದಿ ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರ ಬರೆಯಿರಿ :'

