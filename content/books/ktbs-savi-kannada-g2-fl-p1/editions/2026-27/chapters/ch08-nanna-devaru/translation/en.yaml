story-n1: A hunter scattered grain and cast a net for birds. The birds saw the grains. Eagerly they went to eat the grain. Some got caught in the net. They cried "chinw chinw". At once they made a plan. All the birds together lifted the net and flew up. Afterwards they went elsewhere and cleverly came out of the net.
ex-f-q1: For what did the hunter cast the net?
ex-f-q2: What did all the birds do together?
