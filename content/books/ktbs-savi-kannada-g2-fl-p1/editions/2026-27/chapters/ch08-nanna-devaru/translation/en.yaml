  title: My God

poem-s1l1: Who gives us light every day
poem-s1l2: the sun is my God
poem-s1l3: Who gives milky light at night
poem-s1l4: the moon is my God
poem-s2l1: Crores of stars, silver dots
poem-s2l2: the meteor is my God
poem-s2l3: Fire, wind, water, sky
poem-s2l4: all are my God
poem-s3l1: Standing wrapped in deep green
poem-s3l2: the earth is my God
poem-s3l3: Hills - mountains, forests, plains
poem-s3l4: the streams are my God
poem-s4l1: Who toils shedding sweat in the field
poem-s4l2: the farmer is my God
poem-s4l3: Who strives for the country
poem-s4l4: the soldier is my God
poem-s5l1: Father - mother, kin and clan-
poem-s5l2: all are my God
poem-s5l3: Who teach knowledge and speak kindly
poem-s5l4: the teachers are my God
poem-s6l1: These gods of mine always
poem-s6l2: are visible to me
poem-s6l3: What is asked with a pure mind
poem-s6l4: they give and protect
