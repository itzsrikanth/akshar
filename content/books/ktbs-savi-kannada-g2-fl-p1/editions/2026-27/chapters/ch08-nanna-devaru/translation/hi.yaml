story-n1: एक शिकारी पक्षियों के लिए अनाज बिखेरकर जाल बिछाया। पक्षियों ने अनाज देखा। लालच से अनाज खाने गए। कुछ जाल में फँस गए। "चिंव् चिंव्" कहकर चिल्लाए। तुरंत उन्होंने एक उपाय किया। सभी पक्षी मिलकर जाल उठाकर ऊपर उड़ गए। इसके बाद दूसरी जगह जाकर चतुराई से जाल से बाहर निकल आए।
ex-f-q1: शिकारी ने किसके लिए जाल बिछाया?
ex-f-q2: सभी पक्षियों ने मिलकर क्या किया?
