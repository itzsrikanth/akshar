story-n1: ओब्ब बेटेगार हक्किगळिगागि काळु चेल्लि बले बीसिदनु. हक्किगळु काळुगळन्नु नोडिदवु. आसेयिंद काळु तिन्नलु होदवु. केलवु बलेयल्लि सिक्किकोंडवु. "चिंव् चिंव्" एंदु कूगिकोंडवु. कूडले ओंदु उपाय माडिदवु. एल्ला हक्किगळु सेरि बलेयन्नु एत्तिकोंडु मेलक्के हारिदवु. अनंतर बेरेडेगे होगि उपायवागि बलेयिंद होरबंदवु.
ex-f-q1: बेटेगार यावुदक्कागि बले बीसिदनु?
ex-f-q2: एल्ला हक्किगळु सेरि एनु माडिदवु?
