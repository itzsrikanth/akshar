story-n1: obba bēṭegāra hakkigaḷigāgi kāḷu celli bale bīsidanu. hakkigaḷu kāḷugaḷannu nōḍidavu. āseyiṁda kāḷu tinnalu hōdavu. kelavu baleyalli sikkikoṁḍavu. "ciṁv ciṁv" eṁdu kūgikoṁḍavu. kūḍalē oṁdu upāya māḍidavu. ellā hakkigaḷu sēri baleyannu ettikoṁḍu mēlakke hāridavu. anaṁtara bēreḍege hōgi upāyavāgi baleyiṁda horabaṁdavu.
ex-f-q1: bēṭegāra yāvudakkāgi bale bīsidanu?
ex-f-q2: ellā hakkigaḷu sēri ēnu māḍidavu?
