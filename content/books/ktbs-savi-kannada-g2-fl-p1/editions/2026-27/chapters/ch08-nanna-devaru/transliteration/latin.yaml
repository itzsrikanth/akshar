  notes: padagaḷa artha
  exercise-A: 'a) ''nanna dēvaru'' padyavannu rāgavāgi hāḍi:'
  exercise-B: 'ā) ondu vākyadalli uttara hēḷiri:'
  exercise-C: 'i) praśnegaḷige ondu vākyadalli uttarisi:'
  exercise-D: 'ī) gumpige sērada pada gurutisi bareyiri :'
  exercise-E: 'u) mādariyante pada bare :'
  exercise-F: 'ū) ī katheyannu ōdi koṭṭiruva praśnegaḷige uttara bareyiri :'
  title: nanna dēvaru

