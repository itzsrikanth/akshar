labels:
  poem: padya
  vocab: kēḷida padagaḷu
  notes: padagaḷa artha
  exercise-A: "a) koṭṭa sālugaḷannu ōdi khāli biṭṭa sthaḷakke sariyāda pada bareyiri:"
  exercise-B: "ā) ī padyabhāgada mundina sālugaḷannu hēḷiri:"
  exercise-C: "i) 'a' paṭṭiyallina padagaḷige sariyāda padavannu 'ā' paṭṭiyinda ārisi hondisi bare:"
  title: ūrigobba rājanante

poem-s1l1: ondānondu ūrittante
