labels:
  poem: ಪದ್ಯ
  vocab: ಕೇಳಿದ ಪದಗಳು
  notes: ಪದಗಳ ಅರ್ಥ
  exercise-A: "ಅ) ಕೊಟ್ಟ ಸಾಲುಗಳನ್ನು ಓದಿ ಖಾಲಿ ಬಿಟ್ಟ ಸ್ಥಳಕ್ಕೆ ಸರಿಯಾದ ಪದ ಬರೆಯಿರಿ:"
  exercise-B: "ಆ) ಈ ಪದ್ಯಭಾಗದ ಮುಂದಿನ ಸಾಲುಗಳನ್ನು ಹೇಳಿರಿ:"
  exercise-C: "ಇ) 'ಅ' ಪಟ್ಟಿಯಲ್ಲಿನ ಪದಗಳಿಗೆ ಸರಿಯಾದ ಪದವನ್ನು 'ಆ' ಪಟ್ಟಿಯಿಂದ ಆರಿಸಿ ಹೊಂದಿಸಿ ಬರೆ:"

segments:
  - id: poem-s1l1
    type: poem_line
    stanza: 1
    text: ಒಂದಾನೊಂದು ಊರಿತ್ತಂತೆ
  - id: poem-s1l2
    type: poem_line
    stanza: 1
    text: ಊರಿಗೊಬ್ಬ ರಾಜನಂತೆ
  - id: poem-s1l3
    type: poem_line
    stanza: 1
    text: ರಾಜಗೊಬ್ಬ ಮಂತ್ರಿಯಂತೆ
  - id: poem-s1l4
    type: poem_line
    stanza: 1
    text: ಮಂತ್ರಿಗೊಬ್ಬ ಮಗಳಂತೆ
  - id: poem-s1l5
    type: poem_line
    stanza: 1
    text: ಮಗಳಿಗೊಂದು ಗೊಂಬೆಯಂತೆ

  - id: poem-s2l1
    type: poem_line
    stanza: 2
    text: ಗೊಂಬೆಗೊಂದು ಅಂಗಿಯಂತೆ
  - id: poem-s2l2
    type: poem_line
    stanza: 2
    text: ಅಂಗಿಗೊಂದು ಗುಂಡಿಯಂತೆ
  - id: poem-s2l3
    type: poem_line
    stanza: 2
    text: ಗುಂಡಿ ಕಿತ್ತು ಹೋಯಿತಂತೆ
  - id: poem-s2l4
    type: poem_line
    stanza: 2
    text: ದರ್ಜಿಯನ್ನು ಕರೆದರಂತೆ
  - id: poem-s2l5
    type: poem_line
    stanza: 2
    text: ದರ್ಜಿ ಬಂದು ನೋಡಿದನಂತೆ

  - id: poem-s3l1
    type: poem_line
    stanza: 3
    text: ಗುಂಡಿ ಬಲು ಹಳೆಯದಂತೆ
  - id: poem-s3l2
    type: poem_line
    stanza: 3
    text: ಬೇರೆ ಗುಂಡಿ ತಂದನಂತೆ
  - id: poem-s3l3
    type: poem_line
    stanza: 3
    text: ಅಂಗಿಗಿಟ್ಟು ಹೊಲಿದನಂತೆ
  - id: poem-s3l4
    type: poem_line
    stanza: 3
    text: ಅಂಗಿ ಸರಿಯಾಯಿತಂತೆ
  - id: poem-s3l5
    type: poem_line
    stanza: 3
    text: ಮಂತ್ರಿ ಮಗಳ ಆಸೆಯಂತೆ

  - id: poem-s4l1
    type: poem_line
    stanza: 4
    text: ಗೊಂಬೆಗಂಗಿ ಹಾಕಿದರಂತೆ
  - id: poem-s4l2
    type: poem_line
    stanza: 4
    text: ತುಂಬ ಚಂದ ಕಂಡಿತಂತೆ
  - id: poem-s4l3
    type: poem_line
    stanza: 4
    text: ಗೊಂಬೆಯಾಟ ಆಡಿದಳಂತೆ
  - id: poem-s4l4
    type: poem_line
    stanza: 4
    text: ಬೇರೆ ಗೊಂಬೆ ತಂದಳಂತೆ
  - id: poem-s4l5
    type: poem_line
    stanza: 4
    text: ಎರಡಕ್ಕೂ ಮದುವೆಯಂತೆ

  - id: poem-s5l1
    type: poem_line
    stanza: 5
    text: ಊರಿನ ರಾಜ ಬರುವನಂತೆ
  - id: poem-s5l2
    type: poem_line
    stanza: 5
    text: ನಿಂತು ಮದುವೆ ಮಾಡುವನಂತೆ
  - id: poem-s5l3
    type: poem_line
    stanza: 5
    text: ನಾನೂ ನೀನೂ ಹೋಗೋಣಂತೆ
  - id: poem-s5l4
    type: poem_line
    stanza: 5
    text: ಮದುವೆ ನೋಡಿ ಬರೋಣಂತೆ

