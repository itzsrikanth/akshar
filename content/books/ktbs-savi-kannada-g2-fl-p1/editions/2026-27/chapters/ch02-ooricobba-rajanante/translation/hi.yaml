labels:
  poem: कविता
  vocab: सुने गए शब्द
  notes: शब्दों के अर्थ
  exercise-A: "अ) दी गई पंक्तियों को पढ़कर खाली स्थान पर सही शब्द लिखें:"
  exercise-B: "आ) इस कविता भाग की अगली पंक्तियाँ बताएँ:"
  exercise-C: "इ) 'अ' सूची के शब्दों के लिए सही शब्द 'आ' सूची से चुनकर मिलाएँ:"
  title: गाँव के एक राजा की तरह

poem-s1l1: एक गाँव था ऐसा कहते हैं
poem-s1l2: गाँव का एक राजा था ऐसा कहते हैं
poem-s1l3: राजा का एक मंत्री था ऐसा कहते हैं
poem-s1l4: मंत्री की एक बेटी थी ऐसा कहते हैं
poem-s1l5: बेटी की एक गुड़िया थी ऐसा कहते हैं

poem-s2l1: गुड़िया की एक कमीज़ थी ऐसा कहते हैं
poem-s2l2: कमीज़ का एक बटन था ऐसा कहते हैं
poem-s2l3: बटन टूट गया ऐसा कहते हैं
poem-s2l4: दर्जी को बुलाया ऐसा कहते हैं
poem-s2l5: दर्जी ने आकर देखा ऐसा कहते हैं

poem-s3l1: बटन बहुत पुराना था ऐसा कहते हैं
poem-s3l2: दूसरा बटन लाया ऐसा कहते हैं
poem-s3l3: कमीज़ पर रखकर सिल दिया ऐसा कहते हैं
poem-s3l4: कमीज़ ठीक हो गई ऐसा कहते हैं
poem-s3l5: मंत्री की बेटी की इच्छा के अनुसार ऐसा कहते हैं

poem-s4l1: गुड़िया को कमीज़ पहनाई ऐसा कहते हैं
poem-s4l2: बहुत सुंदर लग रही थी ऐसा कहते हैं
poem-s4l3: उसने गुड़िया का खेल खेला ऐसा कहते हैं
poem-s4l4: दूसरी गुड़िया लाई ऐसा कहते हैं
poem-s4l5: दोनों की शादी है ऐसा कहते हैं

poem-s5l1: गाँव का राजा आएगा ऐसा कहते हैं
poem-s5l2: खड़े होकर शादी कराएगा ऐसा कहते हैं
poem-s5l3: मैं और तुम जाएँगे ऐसा कहते हैं
poem-s5l4: शादी देखकर आएँगे ऐसा कहते हैं

