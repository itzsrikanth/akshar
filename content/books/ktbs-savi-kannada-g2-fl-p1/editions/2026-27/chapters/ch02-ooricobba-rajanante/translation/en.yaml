  title: Like a King for a Town

poem-s1l1: There was once a town, it seems
poem-s1l2: Like a king for the town, it seems
poem-s1l3: Like a minister for the king, it seems
poem-s1l4: Like a daughter for the minister, it seems
poem-s1l5: Like a doll for the daughter, it seems

poem-s2l1: Like a shirt for the doll, it seems
poem-s2l2: Like a button for the shirt, it seems
poem-s2l3: The button tore and fell off, it seems
poem-s2l4: They called the tailor, it seems
poem-s2l5: The tailor came and saw, it seems

poem-s3l1: The button is very old, it seems
poem-s3l2: He brought another button, it seems
poem-s3l3: He put it on the shirt and sewed it, it seems
poem-s3l4: The shirt was fixed, it seems
poem-s3l5: Like the minister's daughter's wish, it seems

poem-s4l1: They put the shirt on the doll, it seems
poem-s4l2: It looked very beautiful, it seems
poem-s4l3: She played with the doll, it seems
poem-s4l4: She brought another doll, it seems
poem-s4l5: Marriage for both of them, it seems

poem-s5l1: The king of the town will come, it seems
poem-s5l2: He will stand and perform the marriage, it seems
poem-s5l3: Let's you and I go, it seems
poem-s5l4: Let's see the marriage and come back, it seems

