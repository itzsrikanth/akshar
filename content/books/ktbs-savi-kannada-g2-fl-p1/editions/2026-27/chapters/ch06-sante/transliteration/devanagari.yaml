labels:
  prose: गद्य
  vocab: केळिद पदगळु
  notes: पदगळ अर्थ
  exercise-A: 'अ) ई प्रश्नेगळिगे उत्तर हेळि:'
  exercise-B: आ) ई मातन्नु यारु यार्रिगे हेळिदरु?
  exercise-C: 'इ) मादरियन्ते बरेयिरि:'
  title: सन्ते

prose-p1: अन्दु शनिवार शालेगे मध्याह्न रजे. अनिता, जान्, रशीद् मत्तु कुमार नाल्वरू तम्मूरिन सन्ते नोडलु होरटरु. अनिताळ चिक्कप्प जोतेयल्लिरुवुदु अवरिगे तुम्बा सन्तोषवेनिसितु. ऊरञ्चिन मैदानदल्लि सन्ते नेरेदित्तु. अल्लि सद्दु-गद्दल तुम्बित्तु. मक्क़ळिगे सन्तेयोळगे नुग्गुव आतुर. आदरे अनिताळ चिक्कप्प अवरन्नु सन्तेय मुम्भागदल्लि निल्लिसिकोण्डु "मक्क़ळे, अवसरदिन्द चदुरि होगबेडि. नन्न जोतेयल्ले बन्नि, सन्तेयल्लि सुत्तिसुवे" एन्दरु. एल्लरू खुषियिन्द ओप्पिदरु. सन्तेय ओळगे बन्दरु.
prose-p2: अल्लि दिनसि अङ्गडिगळु सालु सालागिद्दवु. अक्कि, जोळ, रागि, तोगरि, कडले मुन्ताद धान्यगळ राशि ओन्दु कडे इदे. इन्नोन्दु बदियल्लि तेङ्गिनकायि, एळनीरु, कोब्बरि इट्टिद्दारे. मुन्दिन सालिनल्लि ईरुळ्ळि, बेळ्ळुळ्ळि गुड्डेगळिवे. अडर पक्कदल्लि मेणसिन कायि, मरद बुडदल्लि वीळ्यदेले, बाळेएले, अडिके इवे. मुन्दे होदरे बदने, सौते, बेण्डेकायि, तोण्डेकायि, टोमेटो मुन्ताद तरकारिगळन्नु इट्टिद्दारे. पक्कदल्लि विविध सोप्पन्नु मारुत्तिद्दारे.
prose-p3: ओहो ! अल्लि नोडि, घमघमिसुव हूगळु.
prose-p4: बिसिलिगे बाडदिरलि एन्दु नेरळल्लि इट्टिद्दारे. अल्लि सेवन्तिगे, मल्लिगे, कनकाम्बर, गुलाबि, चेण्डु हूगळिवे.
prose-p5: इल्लिगे इवेल्लवन्नू एल्लिन्द तरुत्तारे?
prose-p6: इवेल्लवन्नू रैतरु तम्म होल, गद्दे, तोटगळल्लि बेळेयुत्तारे. अल्लिन्द तन्दु इल्लि मारुत्तारे.
prose-p7: चिक्कप्प, अल्लि कैचील, चील, बुट्टि हिडिदु जनरु ओडाडुत्तिद्दारल्ल एके?
prose-p8: अवरेल्ल तमगे बेकाद पदार्थगळन्नु कोळ्ळलु बन्दिद्दारे.
prose-p9: इल्लि एल्ला पदार्थगळु सिगुत्तवेये?
prose-p10: हौदु, बन्नि ई अङ्गडियल्लि रवे, गोधि, बेळे, साम्बार पदार्थगळु, अरिशिन, कुङ्कुम, काफिपुडि, टीपुडि, चाक्लेट्, बिस्कत् इन्नु मुन्ताद पदार्थगळू इवे.
prose-p11: नोडि, नन्न अक्क बळसुव रिब्बन्, बळे, सर, पौडर्गळू इल्लिवे.
prose-p12: हौदु, अडर पक्कद अङ्गडि नोडि. अल्लि एल्ला बगेय सिद्धवाद उडुपिगळु, होदिकेगळु सिगुत्तवे.
prose-p13: अब्बा ! सन्तेयल्लि एष्टेल्ला अङ्गडिगळु.
prose-p14: अल्लि नोडि. गुद्दलि, हारे, पिकासि, कुळ, कुडुगोलु, विविध बगेय हग्गगळिवे. इवेल्लवू रैतरिगे बेकाद सलकरणेगळु. सुत्तमुत्तलिन हळ्ळिय जनरु बन्दु तमगे बेकाद वस्तुगळन्नु इल्लि खरिदिसुत्तारे.
prose-p15: अल्लि एनो रिपेरि माडुत्तिद्दारे, एनदु?
prose-p16: अल्लि हाळागिरुव बीग हागू कोडे रिपेरि माडुत्तिद्दारे.
prose-p17: चिक्कप्पा, आ मूलेयल्लि एनो नडेयुत्तिरुवन्तिदे?
prose-p18: अल्लि 'हगलुवेष' आट नडेयुत्तिदे. सन्ते एन्दरे केवल व्यापार माडुव स्थळ अल्ल. हाडु, आटगळन्तह मनोरञ्जनेगळू इल्लि नडेयुत्तवे.
prose-p19: नावू आ आटवन्नु नोडोणवे? (एल्लरू हगलुवेषद आटवन्नु नोडुवरु)
prose-p20: बन्नि, इल्लि सेबु, कित्तळे, मूसम्बि, पप्पायि, बाळेहण्णुगळन्नु इट्टिद्दारे. निमिगेल्लरिगू हण्णु कोडिसुवे. (एल्लरू बाळे हण्णुतिन्नुवरु. कुमारनु सिप्पेयन्नु दारिगे एसेयुवनु)
prose-p21: कुमार, सिप्पेयन्नु दारिगे एसेयबारदु.
prose-p22: शाले हागू मनेयल्लि बेडवाद वस्तुगळन्नु हाकलु कसद बुट्टिगळिवे. आदरे ई सन्तेयल्लि कसवन्नु एल्लि हाकुवुदु चिक्कप्प?
prose-p23: मक्क़ळे इल्लू कसद तोट्टिगळिवे. अल्लि नोडि, आ तोट्टियल्लि सिप्पे हाकिरि.
prose-p24: बाळेहण्णिन सिप्पेयन्नु कसद तोट्टिगे हाकिदरु. सन्ते नोडिद खुषियल्लि एल्लरू मनेगे होरटरु.

