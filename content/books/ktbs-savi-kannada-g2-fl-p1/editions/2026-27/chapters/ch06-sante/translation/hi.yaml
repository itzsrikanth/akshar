  vocab: सुने गए शब्द
  notes: शब्दों के अर्थ
  exercise-A: 'अ) इन प्रश्नों के उत्तर दें:'
  exercise-B: आ) यह बात किसने किससे कही?
  exercise-C: 'इ) दिए गए उदाहरण के अनुसार लिखें:'
  title: बाज़ार

prose-p1: उस दिन शनिवार था, स्कूल की आधे दिन की छुट्टी थी। अनिता, जॉन, रशीद और कुमार चारों अपने गाँव का बाज़ार देखने निकले। अनिता के चाचाजी का साथ होना उन्हें बहुत खुशी दे रहा था। गाँव के किनारे मैदान में बाज़ार लगा था। वहाँ बहुत शोर-शराबा था। बच्चों को बाज़ार में घुसने की जल्दी थी। लेकिन अनिता के चाचाजी ने उन्हें बाज़ार के सामने खड़ा कर लिया और कहा, "बच्चों, जल्दी में बिछड़ मत जाना। मेरे साथ ही आओ, मैं तुम्हें बाज़ार घुमाऊँगा।" सब खुशी-खुशी मान गए। वे बाज़ार के अंदर आ गए।
prose-p2: वहाँ किराने की दुकानों की लाइन लगी हुई थी। चावल, ज्वार, रागी, अरहर, चना आदि अनाजों का ढेर एक तरफ है। दूसरी तरफ नारियल, कच्चा नारियल और सूखा नारियल रखा हुआ है। अगली लाइन में प्याज और लहसुन के ढेर हैं। उसके बगल में हरी मिर्च, पेड़ के तने के पास पान के पत्ते, केले के पत्ते और सुपारी हैं। आगे जाने पर बैंगन, ककड़ी, भिंडी, कुंदरू, टमाटर आदि सब्जियाँ रखी हुई हैं। बगल में तरह-तरह के साग बेचे जा रहे हैं।
prose-p3: ओहो! वहाँ देखिए, महकते हुए फूल।
prose-p4: धूप से न मुरझाएँ, इसलिए छाया में रखे गए हैं। वहाँ गुलदाउदी, चमेली, अबोली, गुलाब और गेंदे के फूल हैं।
prose-p5: यहाँ यह सब कहाँ से लाते हैं?
prose-p6: किसान ये सब अपने खेतों, खलिहानों और बागों में उगाते हैं। वहाँ से लाकर यहाँ बेचते हैं।
prose-p7: चाचाजी, वहाँ लोग हाथ में थैला, झोला और टोकरी लेकर घूम रहे हैं, क्यों?
prose-p8: वे सब अपना ज़रूरी सामान खरीदने आए हैं।
prose-p9: क्या यहाँ सारा सामान मिलता है?
prose-p10: हाँ, आओ, इस दुकान में सूजी, गेहूँ, दाल, मसाले, हल्दी, कुमकुम, कॉफी पाउडर, चाय पत्ती, चॉकलेट, बिस्कुट और भी बहुत कुछ है।
prose-p11: देखिए, मेरी बहन के इस्तेमाल करने वाले रिबन, चूड़ियाँ, माला और पाउडर भी यहाँ हैं।
prose-p12: हाँ, उसके बगल वाली दुकान देखो। वहाँ हर तरह के रेडीमेड कपड़े और कंबल मिलते हैं।
prose-p13: वाह! बाज़ार में कितनी सारी दुकानें हैं।
prose-p14: वहाँ देखो। कुदाल, सब्बल, गैंती, फाला, हँसिया और तरह-तरह की रस्सियाँ हैं। ये सब किसानों के काम आने वाले उपकरण हैं। आस-पास के गाँवों के लोग आकर अपनी ज़रूरत की चीज़ें यहाँ खरीदते हैं।
prose-p15: वहाँ कुछ मरम्मत कर रहे हैं, वह क्या है?
prose-p16: वहाँ खराब हुए ताले और छतरियों की मरम्मत कर रहे हैं।
prose-p17: चाचाजी, उस कोने में कुछ हो रहा है ऐसा लग रहा है?
prose-p18: वहाँ 'हगलुवेशा' (दिन का वेश) नाटक चल रहा है। बाज़ार का मतलब सिर्फ व्यापार करने की जगह नहीं है। यहाँ गाने और नाटक जैसे मनोरंजन भी होते हैं।
prose-p19: क्या हम भी वह नाटक देखें? (सब हगलुवेशा का नाटक देखते हैं)
prose-p20: आओ, यहाँ सेब, संतरा, मौसमी, पपीता और केले रखे हैं। मैं तुम सबको फल दिलाऊँगा। (सब केले खाते हैं। कुमार छिलका रास्ते पर फेंक देता है)
prose-p21: कुमार, छिलके को रास्ते पर नहीं फेंकना चाहिए।
prose-p22: स्कूल और घर में बेकार चीज़ों को डालने के लिए कूड़ेदान होते हैं। लेकिन इस बाज़ार में कूड़ा कहाँ डालें चाचाजी?
prose-p23: बच्चों, यहाँ भी कूड़ेदान हैं। वहाँ देखो, उस कूड़ेदान में छिलका डालो।
prose-p24: उन्होंने केले का छिलका कूड़ेदान में डाल दिया। बाज़ार देखने की खुशी में सब घर के लिए निकल पड़े।

