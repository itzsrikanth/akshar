  title: Market

prose-p1: It was Saturday, a half-day at school. Anita, John, Rashid, and Kumara, all four of them, set out to see their village market. They felt very happy that Anita's uncle was with them. The market had gathered in the field at the edge of the village. It was full of noise and bustle. The children were eager to rush into the market. But Anita's uncle made them stand at the front of the market and said, "Children, do not scatter in a hurry. Come with me, I will show you around the market." Everyone happily agreed. They came inside the market.
prose-p2: There were rows of grocery shops. Piles of grains like rice, jowar, ragi, tur dal, and gram were on one side. On another side, they had kept coconuts, tender coconuts, and dry coconuts. In the next row, there were heaps of onions and garlic. Next to that, there were green chilies, and betel leaves, banana leaves, and betel nuts at the base of a tree. Going further, they had kept vegetables like brinjal, cucumber, lady's finger, ivy gourd, tomato, etc. Next to it, they were selling various greens.
prose-p3: Oho! Look there, sweet-smelling flowers.
prose-p4: They have kept them in the shade so that they do not wither in the sun. There are chrysanthemum, jasmine, crossandra, rose, and marigold flowers.
prose-p5: Where do they bring all these from to here?
prose-p6: The farmers grow all these in their fields, paddy fields, and farms. They bring them from there and sell them here.
prose-p7: Uncle, people are walking around holding handbags, bags, and baskets there, why?
prose-p8: They have all come to buy the things they need.
prose-p9: Are all things available here?
prose-p10: Yes, come. In this shop, there are semolina, wheat, lentils, spices, turmeric, kumkum, coffee powder, tea powder, chocolates, biscuits, and many more things.
prose-p11: Look, ribbons, bangles, necklaces, and powders that my elder sister uses are also here.
prose-p12: Yes, look at the shop next to it. All kinds of ready-made clothes and blankets are available there.
prose-p13: Wow! So many shops in the market.
prose-p14: Look there. There are pickaxes, crowbars, pickaxes, ploughshares, sickles, and various types of ropes. These are all implements needed by farmers. People from surrounding villages come and buy the things they need here.
prose-p15: They are repairing something there, what is it?
prose-p16: They are repairing broken locks and umbrellas there.
prose-p17: Uncle, something seems to be happening in that corner?
prose-p18: A 'Hagaluvesha' (daytime costume) play is going on there. A market is not just a place for doing business. Entertainment like songs and plays also happen here.
prose-p19: Shall we also watch that play? (Everyone watches the Hagaluvesha play)
prose-p20: Come, they have kept apples, oranges, sweet limes, papayas, and bananas here. I will buy fruits for all of you. (Everyone eats bananas. Kumara throws the peel on the path)
prose-p21: Kumara, you should not throw the peel on the path.
prose-p22: There are dustbins to put unwanted things in school and at home. But where to put the garbage in this market, uncle?
prose-p23: Children, there are dustbins here too. Look there, put the peel in that bin.
prose-p24: They put the banana peel in the dustbin. Happy to have seen the market, everyone left for home.

