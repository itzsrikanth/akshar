ex-a-q1: जंगल में भोजन खोजते हुए कौन आए?
ex-a-q2: लोमड़ी को बाग की ओर से कौन-सी आवाज़ सुनाई दी?
ex-a-q3: लोमड़ी का बच्चा कहाँ फँस गया?
ex-a-q4: लोमड़ी को जाल से बचने में किसने मदद की?
ex-b-q1: लोमड़ी को दूर बाग की ..... दिखाई दी। (एक तालाब, एक गुफा, एक घर)
ex-b-q2: समय साधकर थोड़ी दूर .....। (सोई थी, खड़ी थी, बैठी थी)
ex-b-q3: मुर्गियों को देखकर लोमड़ी का बच्चा मन ही मन .....। (सिकुड़ गया, भाग गया, खुश हो गया)
ex-c-q1: '"अम्मा, कितनी सारी मुर्गियाँ!"'
ex-c-q2: '"तुम्हारे दाँत कमज़ोर हैं, है न?"'
ex-c-q3: '"हमारे दाँत मज़बूत ही हैं।"'
ex-d-q1: 'पालतू जानवरों के नाम लिखें :'
ex-e-q1: कर्नाटक सरकार स्वास्थ्य एवं परिवार कल्याण विभाग द्वारा आयोजित पल्स पोलियो टीकाकरण कार्यक्रम। पाँच वर्ष तक के सभी बच्चों को पोलियो की बूँदें पिलाकर अपने बच्चों को पोलियो रोग से मुक्त करें। आइए, हम सब इस कार्यक्रम में सहयोग करें।
