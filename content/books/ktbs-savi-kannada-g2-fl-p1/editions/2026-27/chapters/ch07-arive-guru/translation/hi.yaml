prose-p1: एक घना जंगल। वहाँ एक लोमड़ी और उसका बच्चा भोजन की खोज में भटक रहे थे। लेकिन कुछ भी नहीं मिला। घूमते-घूमते वे जंगल से बाहर निकले। उन्हें दूर एक बागवाली झोंपड़ी दिखाई दी। कौक्को, कौक्को, कौक्को की आवाज़ भी सुनाई दी। वे उस ध्वनि के पीछे गए। मुर्गियाँ बाग की बाड़ की कतार में दाना चुग रही थीं।
prose-p2: मुर्गियों को देखकर लोमड़ी का बच्चा मन ही मन खुश हो गया। उसी खुशी में "अम्मा.. कितनी सारी मुर्गियाँ!" कहते हुए उस ओर झपट पड़ा। बाड़ के किनारे लगे जाल में लोमड़ी का बच्चा फँस गया। डर से वह चीखने लगा। लोमड़ी अपने बच्चे को छुड़ाने पास आई। इतने में बाग के अंदर से किसान आते दिखे। डर से वह पीछे हट गई। बच्चे को बचाने के लिए समय साधकर थोड़ी दूर बैठ गई। लेकिन लोगों की आवाजाही बढ़ जाने से उसे मजबूरन वहाँ से जगह खाली करनी पड़ी।
prose-p3: माँ लोमड़ी अपने बच्चे से बिछुड़कर रह नहीं पाई। अगले दिन किसी तरह बच्चे को छुड़ाकर लाने के इरादे से बाग आई। शाम तक प्रतीक्षा करती रही। लेकिन अपने बच्चे का कोई सुराग नहीं मिला। दुख से बाग की बाड़ के आसपास घूमी। वहाँ एक छेद था। उसमें चतुराई से घुसकर बाग के अंदर आई और खोज की। वहाँ भी अपने बच्चे का सुराग नहीं मिला। लेकिन घर के पास मुर्गियाँ छिपी बैठी थीं। भूखी लोमड़ी को मुर्गियाँ देखकर लालच हुआ। आसानी से मिला भोजन छोड़ने का मन नहीं हुआ। धीरे से मुर्गी पकड़ने रेंगी। लेकिन वहाँ बिछाए जाल में वह स्वयं फँस गई।
prose-p4: लोमड़ी को किसान की चतुराई का अहसास हुआ। अपनी गलती पर वह दुखी होने लगी। इतने में वहीं कूद-फाँद करते चूहों को देखा। लोमड़ी को तुरंत एक उपाय सूझा। धीरे से चूहों को पास बुलाकर कहा, "तुम्हारे दाँत कमज़ोर हैं, है न?" चूहों ने कहा, "नहीं लोमड़ी भाई, हमारे दाँत मज़बूत ही हैं।" तब लोमड़ी ने कहा, "तो फिर इस जाल को काटकर देखें।" चूहों ने क्षण भर में अपने दाँतों से वह जाल काट डाला।
prose-p5: लोमड़ी जाल से बाहर आई। तब उसने कहा, "चूहे हो, तुम्हारे दाँत मज़बूत ही हैं, मैं किसान द्वारा बिछाए जाल में फँसी थी। तुमने मुझे बचाया। तुम्हें धन्यवाद।"
prose-p6: चूहों ने लोमड़ी की चतुराई की प्रशंसा की। तब लोमड़ी ने दुख से चूहों से कहा, "किसान के जाल में फँसे अपने बच्चे को बचाने आई थी। लेकिन मुर्गी के लालच से मैं भी इस जाल में फँस गई। तुमने मेरा उपकार किया। लेकिन मेरा बच्चा ही नहीं मिला।" तब चूहों ने किसान द्वारा छिपाए लोमड़ी के बच्चे को माँ लोमड़ी को दिखाया। अपने बच्चे को देखकर माँ लोमड़ी बहुत खुश हुई। उन्होंने फिर से चूहों को धन्यवाद दिया। खुशी-खुशी जंगल की ओर भाग गए।
