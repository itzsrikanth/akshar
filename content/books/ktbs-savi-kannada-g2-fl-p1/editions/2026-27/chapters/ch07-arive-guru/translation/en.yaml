  title: Awareness is the Teacher

prose-p1: A dense forest. There a fox and its cub wandered for food. But they didn't get anything. Wandering and wandering, they came out of the forest. They saw a farm house in the distance. They also heard a "Kokko, kokko, kokko" sound. They followed the sound. Chickens were pecking at feed along the farm fence.
prose-p2: Seeing the chickens, the fox cub rejoiced in its mind. In that happiness, saying "Mother.. so many chickens!", it rushed towards that side. The fox cub got caught in the net at the edge of the fence. Out of fear, it started screaming. The fox came near to free its cub. Just then, it saw the farmer coming from inside the farm. Out of fear, it moved back. Biding its time to save the cub, it sat a little distance away. But because people's movement increased, it inevitably vacated the place from there.
prose-p3: The mother fox could not bear to be separated from its cub. The next day, it came to the farm thinking it must somehow free the cub and bring it back. It waited until evening. But there was no sign of its cub. With grief, it roamed around the farm fence. There was a small hole there. It cleverly squeezed through it and came inside the farm and searched. There was no sign of its cub there either. But the chickens were hiding next to the house. The hungry fox felt greedy seeing the chickens. It didn't feel like leaving the easily available food. It crawled slowly to catch a chicken. But it itself got caught in the net spread there.
prose-p4: The fox realized the farmer's cleverness. The fox started feeling distressed for its mistake. Just then, it saw mice jumping around there. A trick suddenly struck the fox. Calling the mice near slowly, it said, "Your teeth are weak, aren't they?". The mice said, "No brother fox, our teeth are indeed strong." To that, the fox said, "Then let's cut this net and see." The mice cut the net with their teeth in a moment.
prose-p5: The fox came out of the net. Then the fox said, "Mice, your teeth are indeed strong, I was caught in the net spread by the farmer. You saved me. Thank you."
prose-p6: The mice praised the fox's cleverness. Then the fox said to the mice with grief, "I came to save my child who got caught in the farmer's net. But out of greed for the chicken, I too got caught in this net. You did me a favor. But I just didn't find my child." Then the mice showed the mother fox her cub that the farmer had hidden. The mother fox was overjoyed to see her cub. They thanked the mice once again. They happily ran towards the forest.

