ex-a-q1: काडिनल्लि आहार हुडुकुत्ता यारु बंदरु?
ex-a-q2: नरिगे तोटद कडेयिंद याव सद्दु केळितु?
ex-a-q3: नरिय मरि एल्लि सिक्किकोंडितु?
ex-a-q4: नरियु बलेयिंद तप्पिसिकोळ्ळलु सहाय माडिदवरु यारु?
ex-b-q1: नरिगे दूरदल्लि तोटद................................. काणिसितु. (कोळवोंदु, गुहेयोंदु, मनेयोंदु)
ex-b-q2: समय साधिसि स्वल्प दूरदल्लि ................................. (मलगित्तु, निंतित्तु, कुळितित्तु)
ex-b-q3: कोळिगळन्नु कंडु नरिय मरियु मनदल्ले ................................. (कुग्गितु, ओडितु, हिग्गितु,)
ex-c-q1: “अम्मा, एष्टोंदु कोळिगळु!”
ex-c-q2: “निम्म हल्लुगळु बलहीनवागिवेयल्लवे?”
ex-c-q3: “नम्म हल्लुगळु गट्टियागिये इवे”.
ex-d-q1: 'साकु प्राणिगळ हेसरन्नु बरेयिरि :'
ex-e-q1: कर्नाटक सर्कार आरोग्य मत्तु कुटुंब कल्याण इलाखे एर्पडिसिरुव पल्स् पोलियो लसिके हाकुव कार्यक्रम ऐदु वर्षदवरेगिन एल्ला मक्कळिगू पोलियो हनि हाकिसि, निम्म मक्कळन्नु पोलियो रोगदिंद मुक्तगोळिसि. बन्नि, ई कार्यक्रमक्के नावेल्लरू सहकरिसोण.
