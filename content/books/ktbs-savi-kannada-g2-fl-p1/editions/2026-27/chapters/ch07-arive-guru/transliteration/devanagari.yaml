  vocab: केळिद पदगळु
  notes: पदगळ अर्थ
  exercise-A: 'अ) ई प्रश्नेगळिगे ओंदु वाक्यदल्लि उत्तर बरेयिरि:'
  exercise-B: 'आ) आवरणदल्लिरुव सूक्त पदवन्नु आरिसि बिट्ट स्थळदल्लि बरेयिरि:'
  exercise-C: इ) ई मातुगळन्नु यारु यारिगे हेळिदरु?
  exercise-D: 'ई) साकु प्राणिगळ हेसरन्नु बरेयिरि :'
  exercise-E: उ) ई भित्ति पत्रवन्नु ओदि.
  title: अरिवे गुरु

prose-p1: ओंदु दट्टवाद काडु. अल्लि नरि मत्तु अदर मरि आहारक्कागि अलेदवु. आदरे एनू सिगलिल्ल. तिरुगुत्ता तिरुगुत्ता काडिनिंद होरबंदवु. अवुगळिगे दूरदल्लि तोटद मनेयोंदु काणिसितु. कोक्को, कोक्को, कोक्को एंब सद्दु सह केळिसितु. अवु ध्वनियन्नु अनुसरिसिकोंडु होदवु. कोळिगळु तोटद बेलि सालिनल्लि मेवु आरिसुत्तिद्दवु.
prose-p2: कोळिगळन्नु कंडु नरिय मरि मनदल्ले हिग्गितु. आ संतोषदल्लि `अम्मा.. एष्टोंदु कोळिगळु!' एन्नुत्ता आ कडेगे नुग्गितु. बेलि अंचिनल्लिद्द बलेयल्लि नरिय मरि सिक्कि हाकिकोंडितु. गाबरियिंद अदु किरुचिकोळ्ळतोडगितु. नरि तन्न मरियन्नु बिडिसिकोळ्ळलु हत्तिर बंदितु. अष्टरल्लि तोटद ओळगिनिंद रैतनु बरुवुदु कंडितु. भयदिंद हिंदे सरियितु. मरियन्नु उळिसलु समय साधिसि स्वल्प दूरदल्लि कुळितित्तु. आदरे जनर ओडाट हेच्चादुदरिंद अनिवार्यवागि अल्लिंद अदु जाग खालि माडितु.
prose-p3: तायि नरिगे तन्न मरियन्नु अगलि इरलागलिल्ल. मरुदिन हेगादरू माडि मरियन्नु बिडिसिकोंडु बरबेकेंदु तोटक्के बंदितु. संजेयवरेगे कादु कुळितित्तु. आदरे तन्न मरिय सुळिवे काणलिल्ल. दुःखदिंद तोटद बेलि सुत्त तिरुगितु. अल्लोंदु कंडि इत्तु. अदरोळगे उपायवागि नुसुळि तोटद ओळगे बंदु हुडुकितु. तन्न मरिय सुळिवु अल्लू सिगलिल्ल. आदरे मनेय पक्कदल्लि कोळिगळु अडगि कुळितिद्दवु. हसिदिद्द नरिगे कोळिगळन्नु कंडु आसे मूडितु. सुलभवागि दोरकिद आहार बिडलु अदक्के मनस्सागलिल्ल. मेल्लने कोळि हिडियलु तेवळितु. आदरे अल्लि ओड्डिद्द बलेगे तानू सिक्किकोंडितु.
prose-p4: नरिगे रैतन जाणतन अरिविगे बंदितु. तन्न तप्पिगे नरि संकट पडतोडगितु. अष्टरल्लि अल्ले जिगिदाडुत्तिद्द इलिगळन्नु कंडितु. नरिगे तक्षण उपायवोंदु होळेयितु. मेल्लने इलिगळन्नु हत्तिर करेदु “निम्म हल्लुगळु बलहीनवागिवेयल्लवे?” एंदितु. इलिगळु ''इल्ल नरियण्णा, नम्म हल्लुगळु गट्टियागिये इवे” एंदवु. अदक्के नरियु “हागादरे ई बलेयन्नु कत्तरिसि नोडोण” एंदितु. इलिगळु क्षणदल्लि आ बलेयन्नु हल्लुगळिंद कत्तरिसि हाकिदवु.
prose-p5: नरि बलेयिंद होर बंदितु. आग नरियु “इलिगळिरा, निम्म हल्लुगळु गट्टियागिये इवे, नानु रैत ओड्डिद्द बलेयल्लि सिक्किकोंडिद्देनु. नीवु नन्नन्नु पारु माडिदिरि. निमगे धन्यवादगळु” एंदु हेळितु.
prose-p6: इलिगळु नरिय जाणतनवन्नु होगळिदवु. आग नरियु इलिगळन्नु कुरितु “रैतन बलेगे सिक्कि हाकिकोंड नन्न कंदनन्नु पारु माडलेंदु बंदे. आदरे कोळिय आसेयिंद नानू ई बलेगे सिक्किहाकिकोंडे. नीवु ननगे उपकार माडिदिरि. आदरे नन्न कंद मात्र सिगलिल्ल” एंदु दुःखदिंद हेळितु. आग इलिगळु रैत बच्चिट्टिद्द नरिय मरियन्नु तायिनरिगे तोरिसिदवु. तन्न मरियन्नु नोडि तायिनरिगे आनंदवायितु. अवु मत्तोम्मे इलिगळिगे धन्यवाद हेळिदवु. संतोषदिंद काडिनत्त ओडिहोदवु.
