labels:
  prose: gadya
  vocab: kēḷida padagaḷu
  notes: padagaḷa artha
  exercise-A: 'a) ī praśnegaḷige ondu vākyadalli uttara bareyiri:'
  exercise-B: 'ā) āvaraṇadalliruva sūkta padavannu ārisi biṭṭa sthaḷadalli bareyiri:'
  exercise-C: i) ī mātugaḷannu yāru yārige hēḷidaru?
  exercise-D: 'ī) sāku prāṇigaḷa hesarannu bareyiri :'
  exercise-E: u) ī bhitti patravannu ōdi.
  title: arivē guru

prose-p1: ondu daṭṭavāda kāḍu. alli nari mattu adara mari āhārakkāgi aledavu. ādare ēnū sigalilla. tiruguttā tiruguttā kāḍininda horabandavu. avugaḷige dūradalli tōṭada maneyondu kāṇisitu. kokko, kokko, kokko emba saddu saha kēḷisitu. avu dhvaniyannu anusarisikoṇḍu hōdavu. kōḷigaḷu tōṭada bēli sālinalli mēvu ārisuttiddavu.
prose-p2: kōḷigaḷannu kaṇḍu nariya mari manadallē higgitu. ā santōṣadalli `ammā.. eṣṭondu kōḷigaḷu!' ennuttā ā kaḍege nuggitu. bēli ancinallidda baleyalli nariya mari sikki hākikoṇḍitu. gābariyinda adu kirucikoḷḷatoḍagitu. nari tanna mariyannu biḍisikoḷḷalu hattira banditu. aṣṭaralli tōṭada oḷagininda raitanu baruvudu kaṇḍitu. bhayadinda hinde sariyitu. mariyannu uḷisalu samaya sādhisi svalpa dūradalli kuḷitittu. ādare janara ōḍāṭa heccādudarinda anivāryavāgi allinda adu jāga khāli māḍitu.
prose-p3: tāyi narige tanna mariyannu agali iralāgalilla. marudina hēgādaru māḍi mariyannu biḍisikoṇḍu barabēkendu tōṭakke banditu. sanjeyavarege kādu kuḷitittu. ādare tanna mariya suḷivē kāṇalilla. duḥkhadinda tōṭada bēli sutta tirugitu. allondu kaṇḍi ittu. adaroḷage upāyavāgi nusuḷi tōṭada oḷage bandu huḍukitu. tanna mariya suḷivu allū sigalilla. ādare maneya pakkadalli kōḷigaḷu aḍagi kuḷitiddavu. hasididda narige kōḷigaḷannu kaṇḍu āse mūḍitu. sulabhavāgi dorakida āhāra biḍalu adakke manassāgalilla. mellane kōḷi hiḍiyalu tevaḷitu. ādare alli oḍḍidda balege tānū sikkikoṇḍitu.
prose-p4: narige raitana jāṇatana arivige banditu. tanna tappige nari saṅkaṭa paḍatoḍagitu. aṣṭaralli allē jigidāḍuttidda iligaḷannu kaṇḍitu. narige takṣaṇa upāyavondu hoḷeyitu. mellane iligaḷannu hattira karedu “nimma hallugaḷu balahīnavāgiveyallave?” enditu. iligaḷu ''illa nariyaṇṇā, namma hallugaḷu gaṭṭiyāgiyē ive” endavu. adakke nariyu “hāgādare ī baleyannu kattarisi nōḍōṇa” enditu. iligaḷu kṣaṇadalli ā baleyannu hallugaḷinda kattarisi hākidavu.
prose-p5: nari baleyinda hora banditu. āga nariyu “iligaḷirā, nimma hallugaḷu gaṭṭiyāgiyē ive, nānu raita oḍḍidda baleyalli sikkikoṇḍiddenu. nīvu nannannu pāru māḍidiri. nimage dhanyavādagaḷu” endu hēḷitu.
prose-p6: iligaḷu nariya jāṇatanavannu hogaḷidavu. āga nariyu iligaḷannu kuritu “raitana balege sikki hākikoṇḍa nanna kandanannu pāru māḍalendu bande. ādare kōḷiya āseyinda nānū ī balege sikkihākikoṇḍe. nīvu nanage upakāra māḍidiri. ādare nanna kanda mātra sigalilla” endu duḥkhadinda hēḷitu. āga iligaḷu raita bacciṭṭidda nariya mariyannu tāyinarige tōrisidavu. tanna mariyannu nōḍi tāyinarige ānandavāyitu. avu mattomme iligaḷige dhanyavāda hēḷidavu. santōṣadinda kāḍinatta ōḍihōdavu.

