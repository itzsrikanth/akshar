  exercise-B: 'ಆ) ಆವರಣದಲ್ಲಿರುವ ಸೂಕ್ತ ಪದವನ್ನು ಆರಿಸಿ ಬಿಟ್ಟ ಸ್ಥಳದಲ್ಲಿ ಬರೆಯಿರಿ:'
  exercise-C: ಇ) ಈ ಮಾತುಗಳನ್ನು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು?
  exercise-D: 'ಈ) ಸಾಕು ಪ್ರಾಣಿಗಳ ಹೆಸರನ್ನು ಬರೆಯಿರಿ :'
  exercise-E: ಉ) ಈ ಭಿತ್ತಿ ಪತ್ರವನ್ನು ಓದಿ.

segments:
  - id: prose-p1
    type: prose
    text: ಒಂದು ದಟ್ಟವಾದ ಕಾಡು. ಅಲ್ಲಿ ನರಿ ಮತ್ತು ಅದರ ಮರಿ ಆಹಾರಕ್ಕಾಗಿ ಅಲೆದವು. ಆದರೆ ಏನೂ ಸಿಗಲಿಲ್ಲ. ತಿರುಗುತ್ತಾ ತಿರುಗುತ್ತಾ ಕಾಡಿನಿಂದ ಹೊರಬಂದವು. ಅವುಗಳಿಗೆ ದೂರದಲ್ಲಿ ತೋಟದ ಮನೆಯೊಂದು ಕಾಣಿಸಿತು. ಕೊಕ್ಕೊ, ಕೊಕ್ಕೊ, ಕೊಕ್ಕೊ ಎಂಬ ಸದ್ದು ಸಹ ಕೇಳಿಸಿತು. ಅವು ಧ್ವನಿಯನ್ನು ಅನುಸರಿಸಿಕೊಂಡು ಹೋದವು. ಕೋಳಿಗಳು ತೋಟದ ಬೇಲಿ ಸಾಲಿನಲ್ಲಿ ಮೇವು ಆರಿಸುತ್ತಿದ್ದವು.
  - id: prose-p2
    type: prose
    text: ಕೋಳಿಗಳನ್ನು ಕಂಡು ನರಿಯ ಮರಿ ಮನದಲ್ಲೇ ಹಿಗ್ಗಿತು. ಆ ಸಂತೋಷದಲ್ಲಿ `ಅಮ್ಮಾ.. ಎಷ್ಟೊಂದು ಕೋಳಿಗಳು!' ಎನ್ನುತ್ತಾ ಆ ಕಡೆಗೆ ನುಗ್ಗಿತು. ಬೇಲಿ ಅಂಚಿನಲ್ಲಿದ್ದ ಬಲೆಯಲ್ಲಿ ನರಿಯ ಮರಿ ಸಿಕ್ಕಿ ಹಾಕಿಕೊಂಡಿತು. ಗಾಬರಿಯಿಂದ ಅದು ಕಿರುಚಿಕೊಳ್ಳತೊಡಗಿತು. ನರಿ ತನ್ನ ಮರಿಯನ್ನು ಬಿಡಿಸಿಕೊಳ್ಳಲು ಹತ್ತಿರ ಬಂದಿತು. ಅಷ್ಟರಲ್ಲಿ ತೋಟದ ಒಳಗಿನಿಂದ ರೈತನು ಬರುವುದು ಕಂಡಿತು. ಭಯದಿಂದ ಹಿಂದೆ ಸರಿಯಿತು. ಮರಿಯನ್ನು ಉಳಿಸಲು ಸಮಯ ಸಾಧಿಸಿ ಸ್ವಲ್ಪ ದೂರದಲ್ಲಿ ಕುಳಿತಿತ್ತು. ಆದರೆ ಜನರ ಓಡಾಟ ಹೆಚ್ಚಾದುದರಿಂದ ಅನಿವಾರ್ಯವಾಗಿ ಅಲ್ಲಿಂದ ಅದು ಜಾಗ ಖಾಲಿ ಮಾಡಿತು.
  - id: prose-p3
    type: prose
    text: ತಾಯಿ ನರಿಗೆ ತನ್ನ ಮರಿಯನ್ನು ಅಗಲಿ ಇರಲಾಗಲಿಲ್ಲ. ಮರುದಿನ ಹೇಗಾದರೂ ಮಾಡಿ ಮರಿಯನ್ನು ಬಿಡಿಸಿಕೊಂಡು ಬರಬೇಕೆಂದು ತೋಟಕ್ಕೆ ಬಂದಿತು. ಸಂಜೆಯವರೆಗೆ ಕಾದು ಕುಳಿತಿತ್ತು. ಆದರೆ ತನ್ನ ಮರಿಯ ಸುಳಿವೇ ಕಾಣಲಿಲ್ಲ. ದುಃಖದಿಂದ ತೋಟದ ಬೇಲಿ ಸುತ್ತ ತಿರುಗಿತು. ಅಲ್ಲೊಂದು ಕಂಡಿ ಇತ್ತು. ಅದರೊಳಗೆ ಉಪಾಯವಾಗಿ ನುಸುಳಿ ತೋಟದ ಒಳಗೆ ಬಂದು ಹುಡುಕಿತು. ತನ್ನ ಮರಿಯ ಸುಳಿವು ಅಲ್ಲೂ ಸಿಗಲಿಲ್ಲ. ಆದರೆ ಮನೆಯ ಪಕ್ಕದಲ್ಲಿ ಕೋಳಿಗಳು ಅಡಗಿ ಕುಳಿತಿದ್ದವು. ಹಸಿದಿದ್ದ ನರಿಗೆ ಕೋಳಿಗಳನ್ನು ಕಂಡು ಆಸೆ ಮೂಡಿತು. ಸುಲಭವಾಗಿ ದೊರಕಿದ ಆಹಾರ ಬಿಡಲು ಅದಕ್ಕೆ ಮನಸ್ಸಾಗಲಿಲ್ಲ. ಮೆಲ್ಲನೆ ಕೋಳಿ ಹಿಡಿಯಲು ತೆವಳಿತು. ಆದರೆ ಅಲ್ಲಿ ಒಡ್ಡಿದ್ದ ಬಲೆಗೆ ತಾನೂ ಸಿಕ್ಕಿಕೊಂಡಿತು.
  - id: prose-p4
    type: prose
    text: ನರಿಗೆ ರೈತನ ಜಾಣತನ ಅರಿವಿಗೆ ಬಂದಿತು. ತನ್ನ ತಪ್ಪಿಗೆ ನರಿ ಸಂಕಟ ಪಡತೊಡಗಿತು. ಅಷ್ಟರಲ್ಲಿ ಅಲ್ಲೇ ಜಿಗಿದಾಡುತ್ತಿದ್ದ ಇಲಿಗಳನ್ನು ಕಂಡಿತು. ನರಿಗೆ ತಕ್ಷಣ ಉಪಾಯವೊಂದು ಹೊಳೆಯಿತು. ಮೆಲ್ಲನೆ ಇಲಿಗಳನ್ನು ಹತ್ತಿರ ಕರೆದು “ನಿಮ್ಮ ಹಲ್ಲುಗಳು ಬಲಹೀನವಾಗಿವೆಯಲ್ಲವೆ?” ಎಂದಿತು. ಇಲಿಗಳು ''ಇಲ್ಲ ನರಿಯಣ್ಣಾ, ನಮ್ಮ ಹಲ್ಲುಗಳು ಗಟ್ಟಿಯಾಗಿಯೇ ಇವೆ” ಎಂದವು. ಅದಕ್ಕೆ ನರಿಯು “ಹಾಗಾದರೆ ಈ ಬಲೆಯನ್ನು ಕತ್ತರಿಸಿ ನೋಡೋಣ” ಎಂದಿತು. ಇಲಿಗಳು ಕ್ಷಣದಲ್ಲಿ ಆ ಬಲೆಯನ್ನು ಹಲ್ಲುಗಳಿಂದ ಕತ್ತರಿಸಿ ಹಾಕಿದವು.
  - id: prose-p5
    type: prose
    text: ನರಿ ಬಲೆಯಿಂದ ಹೊರ ಬಂದಿತು. ಆಗ ನರಿಯು “ಇಲಿಗಳಿರಾ, ನಿಮ್ಮ ಹಲ್ಲುಗಳು ಗಟ್ಟಿಯಾಗಿಯೇ ಇವೆ, ನಾನು ರೈತ ಒಡ್ಡಿದ್ದ ಬಲೆಯಲ್ಲಿ ಸಿಕ್ಕಿಕೊಂಡಿದ್ದೆನು. ನೀವು ನನ್ನನ್ನು ಪಾರು ಮಾಡಿದಿರಿ. ನಿಮಗೆ ಧನ್ಯವಾದಗಳು” ಎಂದು ಹೇಳಿತು.
  - id: prose-p6
    type: prose
    text: ಇಲಿಗಳು ನರಿಯ ಜಾಣತನವನ್ನು ಹೊಗಳಿದವು. ಆಗ ನರಿಯು ಇಲಿಗಳನ್ನು ಕುರಿತು “ರೈತನ ಬಲೆಗೆ ಸಿಕ್ಕಿ ಹಾಕಿಕೊಂಡ ನನ್ನ ಕಂದನನ್ನು ಪಾರು ಮಾಡಲೆಂದು ಬಂದೆ. ಆದರೆ ಕೋಳಿಯ ಆಸೆಯಿಂದ ನಾನೂ ಈ ಬಲೆಗೆ ಸಿಕ್ಕಿಹಾಕಿಕೊಂಡೆ. ನೀವು ನನಗೆ ಉಪಕಾರ ಮಾಡಿದಿರಿ. ಆದರೆ ನನ್ನ ಕಂದ ಮಾತ್ರ ಸಿಗಲಿಲ್ಲ” ಎಂದು ದುಃಖದಿಂದ ಹೇಳಿತು. ಆಗ ಇಲಿಗಳು ರೈತ ಬಚ್ಚಿಟ್ಟಿದ್ದ ನರಿಯ ಮರಿಯನ್ನು ತಾಯಿನರಿಗೆ ತೋರಿಸಿದವು. ತನ್ನ ಮರಿಯನ್ನು ನೋಡಿ ತಾಯಿನರಿಗೆ ಆನಂದವಾಯಿತು. ಅವು ಮತ್ತೊಮ್ಮೆ ಇಲಿಗಳಿಗೆ ಧನ್ಯವಾದ ಹೇಳಿದವು. ಸಂತೋಷದಿಂದ ಕಾಡಿನತ್ತ ಓಡಿಹೋದವು.

