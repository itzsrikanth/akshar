  - id: ex-e-q1
    type: question
    exercise: E
    text: ಕರ್ನಾಟಕ ಸರ್ಕಾರ ಆರೋಗ್ಯ ಮತ್ತು ಕುಟುಂಬ ಕಲ್ಯಾಣ ಇಲಾಖೆ ಏರ್ಪಡಿಸಿರುವ ಪಲ್ಸ್ ಪೋಲಿಯೋ ಲಸಿಕೆ ಹಾಕುವ ಕಾರ್ಯಕ್ರಮ ಐದು ವರ್ಷದವರೆಗಿನ ಎಲ್ಲಾ ಮಕ್ಕಳಿಗೂ ಪೋಲಿಯೋ ಹನಿ ಹಾಕಿಸಿ, ನಿಮ್ಮ ಮಕ್ಕಳನ್ನು ಪೋಲಿಯೋ ರೋಗದಿಂದ ಮುಕ್ತಗೊಳಿಸಿ. ಬನ್ನಿ, ಈ ಕಾರ್ಯಕ್ರಮಕ್ಕೆ ನಾವೆಲ್ಲರೂ ಸಹಕರಿಸೋಣ.