  title: मित्रता

prose-p1: घोड़ा और ऊँट अच्छे दोस्त थे। वे एक ही जगह रहते थे। वे साथ ही भोजन ढूँढकर खाते थे। एक बार घोड़े को एक विचार आया। उसने ऊँट से पूछा, "हम दोनों में कौन बड़ा है?" इस पर ऊँट ने कहा, "भाई घोड़े, क्या हम दोनों समान नहीं हैं?" इस बात से घोड़े को संतुष्टि नहीं हुई। तब उसने कहा, "हाथी भाई वहाँ है, चलो उसी से पूछते हैं।" ऊँट मान गया।
prose-p2: 'वे हाथी के पास गए। घोड़े ने पूछा, "हाथी भाई, तुम्हें बताना है कि हम दोनों में कौन बड़ा है।" हाथी ने थोड़ी देर सोचकर यह सलाह दी: "भाइयो, यूँ ही यह कहना सही नहीं है कि कौन बड़ा है। हम तुम दोनों के लिए दौड़ की प्रतियोगिता आयोजित करते हैं। लेकिन प्रतियोगिता दो बार हो, उसके बाद फैसला करेंगे।" दोनों दोस्त मान गए।'
prose-p3: हाथी ने प्रतियोगिता की जगह और समय तय किया। उसने निर्देश दिया, "तुम इस नीम के पेड़ से शुरू करके, उस तालाब तक दौड़ो। मैं तालाब के पास रहूँगा।"
prose-p4: हाथी वहाँ चला गया। घोड़े और ऊँट ने दौड़ना शुरू किया। घोड़े ने ही तेज़ दौड़कर पहले लक्ष्य छुआ। जीते हुए घोड़े ने घमंड से कहा, "देखा! अब पता चला न कि मैं ही बड़ा हूँ?" हाथी ने कहा, "घोड़े, हमारे समझौते के अनुसार एक और जगह प्रतियोगिता है। वह भी हो जाने दो, उसके बाद फैसला कर सकते हैं कि कौन बड़ा है।" घोड़े ने गर्व से कहा, "ओहो! ऐसा ही हो, मैं तैयार हूँ।"
prose-p5: हाथी ने दूसरी बार की दौड़ प्रतियोगिता अधिक रेत वाली जगह पर आयोजित की। उसने वहाँ प्रतियोगिता के शुरू होने और लक्ष्य छूने की जगहें चिह्नित कीं। हाथी लक्ष्य वाले स्थान पर खड़ा हो गया। दौड़ प्रतियोगिता शुरू हुई। ऊँट रेत पर आसानी से दौड़ा। लेकिन घोड़े को वहाँ दौड़ने में मुश्किल हुई।
prose-p6: ऊँट दूसरी बार की दौड़ प्रतियोगिता जीत गया। तब हारे हुए घोड़े को अपनी गलती का एहसास हुआ। उसने हाथी और ऊँट से माफ़ी माँगी। हाथी ने कहा, "भाइयो, तुममें से न कोई बड़ा है, न छोटा। हर किसी में अपनी ही खासियत होती है। तुम दोनों अच्छे दोस्त रहे हो। आगे भी ऐसे ही रहना। दोस्ती की खुशी बाँटकर जियो।" घोड़े और ऊँट ने हाथी को धन्यवाद दिया। वे हमेशा की तरह दोस्त बनकर खुश रहे।

