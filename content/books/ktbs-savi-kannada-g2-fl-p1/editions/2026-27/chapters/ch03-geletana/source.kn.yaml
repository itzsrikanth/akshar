  exercise-A: "ಅ) ಈ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆ :"
  exercise-B: "ಆ) ಈ ಮಾತನ್ನು ಯಾರು ಯಾರಿಗೆ ಹೇಳಿದರು :"
  exercise-C: "ಇ) ಪಾಠದಲ್ಲಿ ಒತ್ತಕ್ಷರವಿರುವ ಪದಗಳನ್ನು ಗುರುತಿಸಿ ಖಾಲಿ ಜಾಗಗಳಲ್ಲಿ ಬರೆಯಿರಿ:"
  exercise-D: "ಈ) ಕೊಟ್ಟಿರುವ ಅಕ್ಷರಗಳನ್ನು ಸ್ಪಷ್ಟವಾಗಿ ಉಚ್ಚರಿಸಿ :"
  exercise-E: "ಉ) ಕೊಟ್ಟಿರುವ ಅಕ್ಷರಗಳನ್ನು ಸರಿಯಾಗಿ ಜೋಡಿಸಿ ಬರೆಯಿರಿ :"

segments:
  - id: prose-p1
    type: prose
    text: ಕುದುರೆ ಮತ್ತು ಒಂಟೆ ಒಳ್ಳೆಯ ಗೆಳೆಯರಾಗಿದ್ದವು. ಒಂದೇ ಕಡೆ ವಾಸಿಸುತ್ತಿದ್ದವು. ಜೊತೆಯಾಗಿಯೇ ಆಹಾರ ಹುಡುಕಿ ತಿನ್ನುತ್ತಿದ್ದವು. ಒಮ್ಮೆ ಕುದುರೆಗೆ ಒಂದು ಆಲೋಚನೆ ಬಂದಿತು. “ನಮ್ಮಿಬ್ಬರಲ್ಲಿ ಯಾರು ಹೆಚ್ಚು”? ಎಂದು ಒಂಟೆಯನ್ನು ಕೇಳಿತು. ಅದಕ್ಕೆ ಒಂಟೆ “ಕುದುರೆಯಣ್ಣ, ನಾವಿಬ್ಬರೂ ಸಮಾನರು ಅಲ್ಲವೆ?” ಎಂದು ಹೇಳಿತು. ಆ ಮಾತಿನಿಂದ ಕುದುರೆಗೆ ಸಮಾಧಾನವಾಗಲಿಲ್ಲ. ಆಗ ಅದು “ಆನೆಯಣ್ಣ ಅಲ್ಲಿದ್ದಾನೆ, ಅವನನ್ನೇ ಕೇಳೋಣ ಬಾ'' ಎಂದಿತು. ಒಂಟೆ ಒಪ್ಪಿಕೊಂಡಿತು.
  - id: prose-p2
    type: prose
    text: ಅವು ಆನೆಯ ಬಳಿಗೆ ಹೋದವು. ಕುದುರೆಯು “ಆನೆಯಣ್ಣ, ನಮ್ಮಿಬ್ಬರಲ್ಲಿ ಯಾರು ಹೆಚ್ಚು ಎಂದು ನೀನು ಹೇಳಬೇಕು” ಎಂದು ಕೇಳಿತು. ಆನೆಯು ಸ್ವಲ್ಪ ಹೊತ್ತು ಆಲೋಚಿಸಿ “ತಮ್ಮಂದಿರಾ, ಯಾರು ಹೆಚ್ಚು ಎಂದು ಸುಮ್ಮನೆ ಹೇಳುವುದು ಸರಿಯಲ್ಲ. ನಿಮ್ಮಿಬ್ಬರಿಗೆ ಓಟದ ಸ್ಪರ್ಧೆ ಏರ್ಪಡಿಸೋಣ. ಆದರೆ ಸ್ಪರ್ಧೆಯು ಎರಡು ಸಲ ಇರಲಿ, ಅನಂತರ ತೀರ್ಮಾನಿಸೋಣ” ಎಂಬ ಸಲಹೆಯನ್ನು ನೀಡಿತು. ಸ್ನೇಹಿತರಿಬ್ಬರೂ ಒಪ್ಪಿಕೊಂಡರು.
  - id: prose-p3
    type: prose
    text: ಆನೆಯು ಸ್ಪರ್ಧೆಯ ಜಾಗ ಮತ್ತು ಸಮಯವನ್ನು ನಿರ್ಧರಿಸಿತು. “ನೀವು ಈ ಬೇವಿನ ಮರದಿಂದ ಆರಂಭಿಸಿ, ಆ ಕೊಳದವರೆಗೆ ಓಡಿ. ನಾನು ಕೊಳದ ಹತ್ತಿರ ಇರುತ್ತೇನೆ” ಎಂಬ ಸೂಚನೆ ನೀಡಿತು.
  - id: prose-p4
    type: prose
    text: ಆನೆಯು ಅಲ್ಲಿಗೆ ಹೋಯಿತು. ಕುದುರೆ ಮತ್ತು ಒಂಟೆ ಓಡಲು ಶುರು ಮಾಡಿದವು. ಕುದುರೆಯೇ ವೇಗವಾಗಿ ಓಡಿ ಮೊದಲು ಗುರಿ ಮುಟ್ಟಿತು. ಗೆದ್ದ ಕುದುರೆ “ನೋಡಿದಿರಾ! ನಾನೇ ಹೆಚ್ಚು ಅಂತ ಗೊತ್ತಾಯಿತೆ?” ಎಂದು ಜಂಬದಿಂದ ಹೇಳಿತು. ಆನೆಯು “ಕುದುರೆಯೇ, ನಮ್ಮ ಒಪ್ಪಂದದಂತೆ ಇನ್ನೊಂದು ಕಡೆ ಸ್ಪರ್ಧೆ ಇದೆ. ಅದೂ ಆಗಲಿ, ಅನಂತರ ಯಾರು ಹೆಚ್ಚು ಎಂಬುದನ್ನು ತೀರ್ಮಾನಿಸಬಹುದು” ಎಂದಿತು. “ಓಹೋ! ಹಾಗೆಯೇ ಆಗಲಿ, ನಾನು ಸಿದ್ಧ” ಎಂದು ಕುದುರೆ ಹೆಮ್ಮೆಯಿಂದ ಹೇಳಿತು.
  - id: prose-p5
    type: prose
    text: ಆನೆಯು ಎರಡನೆಯ ಸಲದ ಓಟದ ಸ್ಪರ್ಧೆಯನ್ನು ಹೆಚ್ಚು ಮರಳು ಇರುವ ಜಾಗದಲ್ಲಿ ಏರ್ಪಡಿಸಿತು. ಅಲ್ಲಿ ಸ್ಪರ್ಧೆಯ ಆರಂಭ ಮತ್ತು ಗುರಿ ಮುಟ್ಟುವ ಜಾಗಗಳನ್ನು ಗುರುತಿಸಿತು. ಗುರಿ ಮುಟ್ಟಬೇಕಾದ ಸ್ಥಳದಲ್ಲಿ ಆನೆಯು ನಿಂತಿತು. ಓಟದ ಸ್ಪರ್ಧೆ ಪ್ರಾರಂಭವಾಯಿತು. ಮರಳಿನ ಮೇಲೆ ಒಂಟೆ ಸರಾಗವಾಗಿ ಓಡಿತು. ಆದರೆ ಅಲ್ಲಿ ಕುದುರೆಗೆ ಓಡಲು ಕಷ್ಟವಾಯಿತು.
  - id: prose-p6
    type: prose
    text: ಎರಡನೆಯ ಸಲ ಓಟದ ಸ್ಪರ್ಧೆಯಲ್ಲಿ ಒಂಟೆ ಗೆದ್ದಿತು. ಆಗ ಸೋತ ಕುದುರೆಗೆ ತನ್ನ ತಪ್ಪಿನ ಅರಿವಾಯಿತು. ಆನೆ ಮತ್ತು ಒಂಟೆಯ ಹತ್ತಿರ ಕ್ಷಮೆ ಕೇಳಿತು. ಆನೆಯು “ತಮ್ಮಂದಿರಾ, ನಿಮ್ಮಲ್ಲಿ ಯಾರು ಹೆಚ್ಚೂ ಅಲ್ಲ, ಕಡಿಮೆಯೂ ಅಲ್ಲ. ಪ್ರತಿಯೊಬ್ಬರಲ್ಲಿಯೂ ಅವರದೇ ಆದ ವಿಶೇಷತೆ ಇರುತ್ತದೆ. ನೀವಿಬ್ಬರೂ ಒಳ್ಳೆಯ ಗೆಳೆಯರಾಗಿದ್ದವರು. ಮುಂದೆಯೂ ಹಾಗೆಯೇ ಇರಿ. ಗೆಳತನದ ಆನಂದವನ್ನು ಹಂಚಿಕೊಂಡು ಬಾಳಿರಿ” ಎಂದು ಹೇಳಿತು. ಕುದುರೆ ಮತ್ತು ಒಂಟೆ ಆನೆಗೆ ಧನ್ಯವಾದಗಳನ್ನು ತಿಳಿಸಿದವು. ಎಂದಿನಂತೆ ಗೆಳೆಯರಾಗಿ ಖುಷಿಯಾಗಿದ್ದವು.

