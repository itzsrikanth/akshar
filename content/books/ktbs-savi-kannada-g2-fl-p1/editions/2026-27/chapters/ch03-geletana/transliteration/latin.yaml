labels:
  prose: 'gadya'
  vocab: 'kēḷida padagaḷu'
  notes: 'padagaḷa artha'
  exercise-A: 'a) ī praśnegaḷige ondu vākyadalli uttara bare:'
  exercise-B: 'ā) ī mātannu yāru yārige hēḷidaru :'
  exercise-C: 'i) pāṭhadalli ottakṣaraviruva padagaḷannu gurutisi khāli jāgagaḷalli bareyiri:'
  exercise-D: 'ī) koṭṭiruva akṣaragaḷannu spaṣṭavāgi uccarisi :'
  exercise-E: 'u) koṭṭiruva akṣaragaḷannu sariyāgi jōḍisi bareyiri :'
  title: 'geḷatana'

prose-p1: 'kudure mattu oṇṭe oḷḷeya geḷeyarāgiddavu. ondē kaḍe vāsisuttiddavu. joteyāgiyē āhāra huḍuki tinnuttiddavu. omme kudurege ondu ālōcane banditu. "nammibbaralli yāru heccu"? endu oṇṭeyannu kēḷitu. adakke oṇṭe "kudureyaṇṇa, nāvibbarū samānaru allave?" endu hēḷitu. ā mātininda kudurege samādhānavāgalilla. āga adu "āneyaṇṇa alliddāne, avanannē kēḷōṇa bā'''' enditu. oṇṭe oppikoṇḍitu.'
prose-p2: 'avu āneya baḷige hōdavu. kudureyu "āneyaṇṇa, nammibbaralli yāru heccu endu nīnu hēḷabēku" endu kēḷitu. āneyu svalpa hottu ālōcisi "tammandirā, yāru heccu endu summane hēḷuvudu sariyalla. nimmibbarige ōṭada spardhe ērpaḍisōṇa. ādare spardheyu eraḍu sala irali, anantara tīrmānisōṇa" emba salaheyannu nīḍitu. snēhitaribbarū oppikoṇḍaru.'
prose-p3: 'āneyu spardheya jāga mattu samayavannu nirdharisitu. "nīvu ī bēvina maradinda ārambhisi, ā koḷadavarege ōḍi. nānu koḷada hattira iruttēne" emba sūcane nīḍitu.'
prose-p4: 'āneyu allige hōyitu. kudure mattu oṇṭe ōḍalu śuru māḍidavu. kudureyē vēgavāgi ōḍi modalu guri muṭṭitu. gedda kudure "nōḍidirā! nānē heccu anta gottāyite?" endu jambadinda hēḷitu. āneyu "kudureyē, namma oppandadante innondu kaḍe spardhe ide. adū āgali, anantara yāru heccu embudannu tīrmānisabahudu" enditu. "ōhō! hāgeyē āgali, nānu siddha" endu kudure hemmeyinda hēḷitu.'
prose-p5: 'āneyu eraḍaneya salada ōṭada spardheyannu heccu maraḷu iruva jāgadalli ērpaḍisitu. alli spardheya ārambha mattu guri muṭṭuva jāgagaḷannu gurutisitu. guri muṭṭabēkāda sthaḷadalli āneyu nintitu. ōṭada spardhe prārambhavāyitu. maraḷina mēle oṇṭe sarāgavāgi ōḍitu. ādare alli kudurege ōḍalu kaṣṭavāyitu.'
prose-p6: 'eraḍaneya sala ōṭada spardheyalli oṇṭe gedditu. āga sōta kudurege tanna tappina arivāyitu. āne mattu oṇṭeya hattira kṣame kēḷitu. āneyu "tammandirā, nimmalli yāru heccū alla, kaḍimeyū alla. pratiyobbaralliyū avaradē āda viśēṣate iruttade. nīvibbarū oḷḷeya geḷeyarāgiddavaru. mundeyū hāgeyē iri. geḷatanada ānandavannu hancikoṇḍu bāḷiri" endu hēḷitu. kudure mattu oṇṭe ānege dhanyavādagaḷannu tiḷisidavu. endinante geḷeyarāgi khuṣiyāgiddavu.'

