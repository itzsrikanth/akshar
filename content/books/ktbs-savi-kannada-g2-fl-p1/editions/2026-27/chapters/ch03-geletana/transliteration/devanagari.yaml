labels:
  prose: 'गद्य'
  vocab: 'केळिद पदगळु'
  notes: 'पदगळ अर्थ'
  exercise-A: 'अ) ई प्रश्नेगळिगे ओन्दु वाक्यदल्लि उत्तर बरे :'
  exercise-B: 'आ) ई मातन्नु यारु यार्रिगे हेळिदरु :'
  exercise-C: 'इ) पाठदल्लि ओत्तक्षरविरुव पदगळन्नु गुरुतिसि खालि जागगळल्लि बरेयिरि:'
  exercise-D: 'ई) कोट्टिरुव अक्षरगळन्नु स्पष्टवागि उच्चरिसि :'
  exercise-E: 'उ) कोट्टिरुव अक्षरगळन्नु सरियागि जोडिसि बरेयिरि :'
  title: 'गेळतन'

prose-p1: 'कुदुरे मत्तु ओण्टे ओळ्ळेय गेळेयरागिद्दवु. ओन्दे कडे वासिसुत्तिद्दवु. जोतेयागिये आहार हुडुकि तिन्नुत्तिद्दवु. ओम्मे कुदुरेगे ओन्दु आलोचने बन्दितु. "नम्मिब्बरल्लि यारु हेच्चु"? एन्दु ओण्टेयन्नु केळितु. अदक्के ओण्टे "कुदुरेयण्ण, नाविब्बरू समानरु अल्लवे?" एन्दु हेळितु. आ मातिनिन्द कुदुरेगे समाधानवागलिल्ल. आग अदु "आनेयण्ण अल्लिद्दाने, अवनन्ने केळोण बा'''' एन्दितु. ओण्टे ओप्पिकोण्डितु.'
prose-p2: 'अवु आनेय बळिगे होदवु. कुदुरेयु "आनेयण्ण, नम्मिब्बरल्लि यारु हेच्चु एन्दु नीनु हेळबेकु" एन्दु केळितु. आनेयु स्वल्प होत्तु आलोचिसि "तम्मन्दिरा, यारु हेच्चु एन्दु सुम्मने हेळुवुदु सरियल्ल. निम्मिब्बरिगे ओटद स्पर्धे एर्पडिसोण. आदरे स्पर्धेयु एरडु सल इरलि, अनन्तर तीर्मानिसोण" एम्ब सलहेयन्नु नीडितु. स्नेहितरिब्बरू ओप्पिकोण्डरु.'
prose-p3: 'आनेयु स्पर्धेय जाग मत्तु समयवन्नु निर्धारिसितु. "नीवु ई बेविन मरदिन्द आरम्भिसि, आ कोळदवरेगे ओडि. नानु कोळद हत्तिर इरुत्तेने" एम्ब सूचने नीडितु.'
prose-p4: 'आनेयु अल्लिगे होयितु. कुदुरे मत्तु ओण्टे ओडलु शुरु माडिदवु. कुदुरेये वेगवागि ओडि मोदलु गुरि मुट्टितु. गेद्द कुदुरे "नोडिदिरा! नाने हेच्चु अन्त गोत्तायिते?" एन्दु जम्बदिन्द हेळितु. आनेयु "कुदुरेये, नम्म ओप्पन्ददन्ते इन्नोन्दु कडे स्पर्धे इदे. अदू आगलि, अनन्तर यारु हेच्चु एम्बुदन्नु तीर्मानिसबहुदु" एन्दितु. "ओहो! हागेये आगलि, नानु सिद्ध" एन्दु कुदुरे हेम्मेयिन्द हेळितु.'
prose-p5: 'आनेयु एरडनेय सलद ओटद स्पर्धेयन्नु हेच्चु मरळु इरुव जागदल्लि एर्पडिसितु. अल्लि स्पर्धेय आरम्भ मत्तु गुरि मुट्टुव जागगळन्नु गुरुतिसितु. गुरि मुट्टबेकाद स्थळदल्लि आनेयु निन्तितु. ओटद स्पर्धे प्रारम्भवायितु. मरळिन मेले ओण्टे सरागवागि ओडितु. आदरे अल्लि कुदुरेगे ओडलु कष्टवायितु.'
prose-p6: 'एरडनेय सल ओटद स्पर्धेयल्लि ओण्टे गेद्देतु. आग सोत कुदुरेगे तन्न तप्पिन अरिवायितु. आने मत्तु ओण्टेय हत्तिर क्षमे केळितु. आनेयु "तम्मन्दिरा, निम्मल्लि यारु हेच्चू अल्ल, कडिमेयू अल्ल. प्रतियोब्बरल्लियू अवरदे आद विशेषते इरुत्तदे. नीविब्बरू ओळ्ळेय गेळेयरागिद्दवरु. मुन्देयू हागेये इरि. गेळतनद आनन्दवन्नु हञ्चिकोण्डु बाळिरि" एन्दु हेळितु. कुदुरे मत्तु ओण्टे आनेगे धन्यवादगळन्नु तिळिसिदवु. एन्दिनन्ते गेळेयरागि खुषियागिद्दवु.'

