ex-c-q1: sudhāma yāvudannu mānavadharma ènnuttānè?
ex-c-q2: yārigāgi śrīkṛṣṇana baḻi sahāya keḻalu sudhāmana patni heḻuttāḻè?
ex-c-q3: sudhāmana kaṇṇalli nīru ekè baṃtu?
ex-c-q4: manègè maraḻida sudhāmanu enannu kaṃḍanu?
ex-c-q5: sudhāmana manèyannu kaṭṭisidavaru yāru?
ex-d-q1: kṛṣṇa-sudhāmaru gurukuladalli kaḻèda dinagaḻannu paraspara nènapisikòṃḍaddu hegè?
ex-d-q2: kṛṣṇanu sudhāmanigè manè kaṭṭisikòṭṭa saṃdarbhavannu vivarisiri.
