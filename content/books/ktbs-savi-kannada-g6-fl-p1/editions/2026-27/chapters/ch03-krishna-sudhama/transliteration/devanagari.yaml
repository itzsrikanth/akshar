  exercise-A: अ. ई पदगळिगॆ ऎरडु समानार्थक पदगळन्नु बरॆयिरि.
  exercise-B: आ. ई पदगळन्नु बळसि स्वंत वाक्य रचिसिरि.
  exercise-C: इ. कॆळगिन प्रश्नॆगळिगॆ ऒंदु वाक्यदल्लि उत्तरिसिरि.
  exercise-D: ई. कॆळगिन प्रश्नॆगळिगॆ ऐदु-आरु वाक्यगळल्लि उत्तरिसिरि.
  exercise-E: उ. कॆळगिन मातुगळन्नु यारु, यारिगॆ, यावाग हेळिदरु?
intro-1: गॆळॆतनवॆंबुदु पवित्रवाद ऒंदु संबंध. इल्लि बडतन, सिरितन, विद्यावंत, अविद्यावंत इत्यादियाद यावुदे बगॆय भेद भाव इरुवुदिल्ल. हुट्टुत्ता अण्ण तम्मंदिरागियू बॆळॆयुत्ता दायादिगळागियू बदुकु सागिसुववरु नम्म नडुवॆ इद्दारॆ. ऒंदे तरगतियल्लि कलित बाल्य स्नेहितरू सिरितन, बडतन निमित्तवागि बेर्पडुत्तारॆ. निजवाद गॆळॆतनद बॆसुगॆ मुरिदु होगुवंथद्दल्ल ऎंबुदन्नु ऎत्ति तोरिसुवुदु प्रस्तुत पाठद आशयवागिदॆ.
scene-1-stage: 'दृश्य-1: सुधामन गुडिसलु, रात्रिय समय. सुधाम योचिसुत्ता शतपतिसुत्तिद्दानॆ. आतन मुखदल्लि निरासॆ तुंबिदॆ.'
story-d1: (स्वगत) जीवनदल्लि बरी कष्टगळे बरुत्तिवॆयल्ल! सुखद दिनगळु यावाग बरुत्तवॊ? हा! (निट्टुसिरुबिट्टु) अदॆल्ला आ देवरिगे गॊत्तु!
story-d2: बडतन नम्म बॆन्नु हत्तिदॆ. अदु नम्मन्नु बिट्टु होगुवुदिल्ल.
story-d3: ‘बडतन नमगिरलि, मनॆ तुंब मक्कळिरलि’ ऎंदु देवरल्लि नी बेडिकॊंडॆयो हेगॆ?
story-d4: मक्कळिरलि अंदिद्दु निज. आद्रॆ..............
story-d5: (मक्कळ प्रवेश) अम्मा .... अम्मा ..... हसिवाग्तिदॆ.
story-d6: ननगू हसिवु, ऊट कॊडम्म.
story-d7: नोडिद्रा, मक्कळॆल्ला हसिविनिंद कंगालागिवॆ. पांडित्यवुळ्ळ नन्न गंड दुडिदु तर्तारेंत तिळिदिद्दॆ.
story-d8: यावुदक्कू काल कूडि बरबेकल्ल.
story-d9: अंतू इंतू नमगॆ बडतनवे गति.
story-d10: चिंतॆ माडिदरॆ एनु बंतु? जीवनदल्लि बंदद्दन्नु अनुभविसले बेकु. अदे मानव धर्म.
story-d11: नीवु नीति हेळुवुदरल्लि बहळ मुंदु.
story-d12: नीति, नियम, विधेयतॆ, पांडित्य इद्दुदरिंदले गुरुकुलदल्लि श्रीकृष्ण नन्न स्नेहितनादद्दु.
story-d13: मातुमातिगू “श्रीकृष्ण नन्न स्नेहितनागिद्द” अंतीरि.
story-d14: हूं! निजक्कू आत नन्न परम मित्रनागिद्द. गुरुकुलदल्लि ऒट्टिगॆ विद्याभ्यास माडिदॆवु.
story-d15: सत्य हेळुविरा! आ श्रीमंतरॆल्लि, नीवॆल्लि? याकॆ सुम्मनॆ बडायि बिड्तीरा?
story-d16: याकॆ सुळ्ळु हेळलि नानु, कृष्ण सदा नन्न जॊतॆयल्लिये इरुत्तिद्द. ऒट्टिगॆ कलियुत्तिद्दॆवु. नन्नन्नु कंडरॆ अवनिगॆ अपार प्रीति, स्नेह, गौरव.
story-d17: अंतह श्रीमंत स्नेहितनिद्दरू इल्लियवरॆगॆ नीवु एकॆ अवर हत्तिर सहाय केळलिल्ल?
story-d18: (क्षण हॊत्तु मौन) बडवनादव दॊड्डवर मनॆगॆ सहाय केळलु होगबारदु.
story-d19: स्नेहितरॆदुरु ऎंथ स्वाभिमान! दयविट्टु होगि अवरल्लि सहाय केळि.
story-d20: हेगॆ केळुवुदु?
story-d21: आत्मीय गॆळॆय अन्नुत्तीरि, अंद मेलॆ अवरु सहाय माडे माडुत्तारॆ.
story-d22: इल्ल अन्नलार, आदरू केळुवुदक्कॆ संकोच.
story-d23: संकोच बेडारी, हसिदिरुव मक्कळिगोस्करवादरू होगि केळि.
story-d24: आगलि, होगुत्तेनॆ. आदरॆ गॆळॆयनन्नु नोडलु बरिगैयल्लि होगला?
story-d25: निन्नॆ तंद अवलक्कियल्लि स्वल्पवे उळिदिदॆ. मक्कळ उपाहारक्कॆ एनेनू सालदु. अदन्ने कट्टिकॊडलॆ?
story-d26: हसिवु, अदन्नादरू ननगॆ कॊडम्म.
story-d27: तुसु तडॆदुको कंदा, देवर दयॆयिद्दरॆ ई अवलक्किये बंगारवादीतु. (गंडनिगॆ) कट्टिकॊडलॆ?
story-d28: सरि, हागॆ माडु.
scene-2-stage: 'दृश्य-2: कृष्णन अरमनॆ- कावलुगार सुधामनन्नु अरमनॆयॊळक्कॆ बिडदॆ बागिलल्ले निल्लिसुवनु. कृष्ण आकस्मिकवागि हॊरगॆ बरुवनु. सुधामनन्नु नोडुवनु.'
story-d29: (आश्चर्यदिंद) ओहो सुधाम! यावाग बंदॆ? बा ऒळगॆ (सुधामन कै हिडियुवनु. कावलुगार आश्चर्यदिंद दूर सरियुवनु.)
story-d30: श्रीकृष्ण महाराजरु! (अतीव संतोषदिंद आनंदबाष्प सुरियुत्तदॆ. माते हॊरडदंतागिदॆ.)
story-d31: एकॆ सुधाम कण्णल्लि नीरु?
story-d32: बहळ दिनगळ अनंतर निम्मन्नु नोडुत्तिरुवॆनल्ल! अदक्कागि आनंदद कण्णीरु.
story-d33: दूरदिंद दणिदु बंदिद्दीय. स्नान मुगिसि ऊट माडि विश्रांति तॆगॆदुको. अष्टुबेग निन्नन्नु होगगॊडुवुदिल्ल.
story-d34: अय्यो, अल्लि मनॆयल्लि यारू इल्ल. मक्कळिगॆ........
story-d35: सुम्मनिरु, बंद तक्षण होगबेकिद्दरॆ याकॆ बंदॆ? यारल्लि? सुधामनिगॆ विश्रांतिय व्यवस्थॆ माडि. (सुधामनिगॆ) ननगू तुर्तु कॆलसविदॆ. अदु मुगिद तक्षण बंदु बिडुवॆ.
scene-3-stage: 'दृश्य-3: कृष्णन अरमनॆ- सुधामनिरुव कोणॆ.'
story-d36: (स्वगत) श्रीकृष्णनंतह मित्रनन्नु पडॆद नाने धन्यनु, नन्नन्नु मरॆतिल्ल. नानु तंद अवलक्कियन्नु तानू तिंदु हॆंडतिगू प्रीतियिंद तिन्निसिद. इष्टॊंदु प्रीति विश्वासविरुव कृष्णन हत्तिर नन्न बडतन हेळि आतन मनस्सिगॆ बेसरवुंटुमाडबारदु. नन्न बडतन ननगिरलि.
story-d37: (हिंदिनिंद बरुत्त) एनु योचिसुत्तिरुवॆ सुधाम?
story-d38: एनिल्ल कृष्ण ..... एनिल्ल, सुम्मनॆ.
story-d39: नी बंदु नन्न मनस्सिगॆ तुंबा संतोषवन्नुंटुमाडिदॆ. ननगॆ गुरुकुलद जीवन नॆनपागुत्तिदॆ.
story-d40: ऒट्टिगॆ ऊट माडुत्तिद्दॆवु, कूडि कलियुत्तिद्दॆवु, कट्टिगॆ तरलु होगुत्तिद्दॆवु.
story-d41: गुरुमातॆ कॊट्ट हुरिद कडलॆ तिंदिद्दु! निन्न पालिन कडलॆ ना कसिदुकॊंडिद्दु!
story-d42: (तडवरिसुत्ता) हसिवु......बडतन.....(एनो नॆनपु माडिकॊळ्ळलु यत्निसि मौनियागुवनु.)
story-d43: प्रजॆगळ हसिवु हिंगिसलु अवर कष्ट कार्पण्य नीगिसलु राजनादवनु श्रमिसबेकु. आग मात्र अवनु निजवाद राजनागुवनु. निन्नन्नु पीडिसिद्दु तप्पॆंदु क्रमेण नन्न अरिविगॆ बंतु नोडु.
story-d44: कृष्ण, इष्टु दिन इल्लिद्दु अदन्नॆल्ल कण्णारॆ कंडिरुवॆ.
story-d45: सुधाम, निनगेनु बेकु?
story-d46: ननगेनू बेड. निन्न सत्कार जीवनदल्लि मरॆयुवंतिल्ल. निन्न स्नेहवॊंदॆ साकु. इन्नु नन्नूरिगॆ हॊरडुवॆ.
story-d47: इष्टु बेग!
story-d48: नानु इष्टु दीर्घकाल मनॆबिट्टु इद्दवनॆ अल्ल. अल्लि हॆंडति मक्कळु नन्न दारि कादु कंगालागिरबहुदु.
story-d49: इल्लिगॆ बंद विषय अवरिगॆ गॊत्तिदॆयल्ल.
story-d50: गॊत्तिदॆ. आदरॆ ननगॆ मक्कळदे चिंतॆ. हॊरडलु अप्पणॆ कॊडु कृष्णा.
story-d51: निन्न इष्टदंतॆये आगलि, होगि बा. शुभवागलि गॆळॆय. अंद हागॆ निन्न मनॆगॆ नन्नन्नु करॆयले इल्ल! परवागिल्ल. नीनु करॆयदिद्दरू नाने बरुवॆ.
story-d52: अय्यो! नन्न मनॆगॆ! बेड कृष्णा!
story-d53: ईग चिंतॆ बिट्टु हॊरडु. ऒळ्ळॆयदागलि.
scene-4-stage: 'दृश्य-4: सुधामन सुंदरवाद मनॆ. हॆंडति, मक्कळु हॊसबट्टॆ धरिसि मनॆयल्लि संतोषदिंद इरुव सन्निवेश.'
story-d54: (आश्चर्यदिंद हॆंडतिगॆ) नीवु यार मनॆयल्लिद्दीरि?
story-d55: इदु नम्म मनॆ कण्री!
story-d56: नम्म गुडिसलु ऎल्लि?
story-d57: आ गुडिसलिन जागदल्लिये ई अरमनॆयंतह मनॆ निर्माणवागिदॆ.
story-d58: अरॆ! नानु होगि बरुवुदरॊळगॆ इदु हेगॆ साध्यवाय्तु?
story-d59: (नगुत्त) निम्म मित्रन कृपॆयिंद.
story-d60: (आश्चर्यदिंद) नन्न मित्र श्रीकृष्णनिंद!
story-d61: हौदु, आ महाराय श्रीकृष्णनिंदले.
story-d62: नानु अवनिगॆ सहाय माडु ऎंदु केळिये इल्ल.
story-d63: निजवागियू!
story-d64: सत्यवागियू.
story-d65: नीवु द्वारका नगर तलुपिद दिनवे अल्लिंद सेवकर दंडु बंतु. बेकाद ऎल्ल वस्तुगळन्नु तंदरु. चकचकांत मनॆ निर्मिसिदरु. नमगॆल्ल हॊस उडुपु, आभरणगळन्नु सह कॊट्टरु.
story-d66: परमाश्चर्य, नन्न मनद इंगितवन्नु तिळिदुकॊंडु ऎल्ला रीतिय सहाय माडिद्दानॆ श्रीकृष्ण.
story-d67: नीवु तॆगॆदुकॊंडु होद अवलक्कियन्नु अवरिगॆ नीडिदिरा?
story-d68: हूं! कॊट्टॆ. बहळ आनंददिंद तिंदु, हॆंडति रुक्मिणिगू तिन्निसिद.
story-d69: अब्बा.......! बडवर मनॆ अवलक्कियन्नु संतोषवागि तिंदरल्ल. इदु अवर निजवाद स्नेह हागू दॊड्ड गुण. मत्तॆ नीवु याकॆ सहाय केळलिल्ल?
story-d70: आत सत्कार माडिद्दु नोडि नन्न मनस्सु नाचि कुग्गि होयितु. मत्तॆ एनन्नु केळलू मनस्सागलिल्ल.
story-d71: नीवु केळलिल्ल निज, आदरॆ आ श्रीकृष्ण परमात्मने तम्म कर्तव्य माडिद्दारॆ.
story-d72: मक्कळॆल्ला ऎल्लिद्दारॆ?
story-d73: अप्पा.....नन्न हॊस बट्टॆ नोडि, ऎष्टु चॆन्नागिदॆ सर, ओलॆ, बळॆ ऎल्ल......
story-d74: अप्पा..... निमगू रेष्मॆबट्टॆ कॊट्टिद्दारॆ, नोडि.
story-d75: ननगॆ बेड, नीवॆल्ल धरिसिकॊळ्ळि. ननगॆ आ कृष्णदेवन स्नेहवे रेष्मॆ बट्टॆ, अवन मातॆ ननगॆ आभरण. अवनंतह गॆळॆयनन्नु पडॆद नाने धन्य.
author-1: वि.ऎस्. शिरहट्टि मठ अवरु ई नाटकवन्नु रचिसिद्दारॆ. प्रस्तुत पाठवु कृष्ण-सुधामर गॆळॆतनवन्नु नाटक रूपदल्लि तोरिसुत्तदॆ.
