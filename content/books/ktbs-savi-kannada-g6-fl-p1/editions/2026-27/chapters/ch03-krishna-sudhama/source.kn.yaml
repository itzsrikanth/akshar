labels:
  intro: ಪ್ರವೇಶ
  drama: ನಾಟಕ
  author: ಕವಿ ಕೃತಿ ಪರಿಚಯ
  vocab: ಪದಗಳ ಅರ್ಥ
  exercise-A: ಅ. ಈ ಪದಗಳಿಗೆ ಎರಡು ಸಮಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ.
  exercise-B: ಆ. ಈ ಪದಗಳನ್ನು ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸಿರಿ.
  exercise-C: ಇ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿರಿ.
  exercise-D: ಈ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಐದು-ಆರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿರಿ.
  exercise-E: ಉ. ಕೆಳಗಿನ ಮಾತುಗಳನ್ನು ಯಾರು, ಯಾರಿಗೆ, ಯಾವಾಗ ಹೇಳಿದರು?
segments:
- id: intro-1
  type: prose
  text: ಗೆಳೆತನವೆಂಬುದು ಪವಿತ್ರವಾದ ಒಂದು ಸಂಬಂಧ. ಇಲ್ಲಿ ಬಡತನ, ಸಿರಿತನ, ವಿದ್ಯಾವಂತ, ಅವಿದ್ಯಾವಂತ ಇತ್ಯಾದಿಯಾದ ಯಾವುದೇ ಬಗೆಯ ಭೇದ ಭಾವ ಇರುವುದಿಲ್ಲ. ಹುಟ್ಟುತ್ತಾ ಅಣ್ಣ ತಮ್ಮಂದಿರಾಗಿಯೂ ಬೆಳೆಯುತ್ತಾ ದಾಯಾದಿಗಳಾಗಿಯೂ ಬದುಕು ಸಾಗಿಸುವವರು ನಮ್ಮ ನಡುವೆ ಇದ್ದಾರೆ. ಒಂದೇ ತರಗತಿಯಲ್ಲಿ ಕಲಿತ ಬಾಲ್ಯ ಸ್ನೇಹಿತರೂ ಸಿರಿತನ, ಬಡತನ ನಿಮಿತ್ತವಾಗಿ ಬೇರ್ಪಡುತ್ತಾರೆ. ನಿಜವಾದ ಗೆಳೆತನದ ಬೆಸುಗೆ ಮುರಿದು ಹೋಗುವಂಥದ್ದಲ್ಲ ಎಂಬುದನ್ನು ಎತ್ತಿ ತೋರಿಸುವುದು ಪ್ರಸ್ತುತ ಪಾಠದ ಆಶಯವಾಗಿದೆ.
  section: intro
- id: scene-1-stage
  type: prose
  text: 'ದೃಶ್ಯ-1: ಸುಧಾಮನ ಗುಡಿಸಲು, ರಾತ್ರಿಯ ಸಮಯ. ಸುಧಾಮ ಯೋಚಿಸುತ್ತಾ ಶತಪತಿಸುತ್ತಿದ್ದಾನೆ. ಆತನ ಮುಖದಲ್ಲಿ ನಿರಾಸೆ ತುಂಬಿದೆ.'
  section: drama
- id: story-d1
  type: dialogue
  text: (ಸ್ವಗತ) ಜೀವನದಲ್ಲಿ ಬರೀ ಕಷ್ಟಗಳೇ ಬರುತ್ತಿವೆಯಲ್ಲ! ಸುಖದ ದಿನಗಳು ಯಾವಾಗ ಬರುತ್ತವೊ? ಹಾ! (ನಿಟ್ಟುಸಿರುಬಿಟ್ಟು) ಅದೆಲ್ಲಾ ಆ ದೇವರಿಗೇ ಗೊತ್ತು!
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d2
  type: dialogue
  text: ಬಡತನ ನಮ್ಮ ಬೆನ್ನು ಹತ್ತಿದೆ. ಅದು ನಮ್ಮನ್ನು ಬಿಟ್ಟು ಹೋಗುವುದಿಲ್ಲ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d3
  type: dialogue
  text: ‘ಬಡತನ ನಮಗಿರಲಿ, ಮನೆ ತುಂಬ ಮಕ್ಕಳಿರಲಿ’ ಎಂದು ದೇವರಲ್ಲಿ ನೀ ಬೇಡಿಕೊಂಡೆಯೋ ಹೇಗೆ?
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d4
  type: dialogue
  text: ಮಕ್ಕಳಿರಲಿ ಅಂದಿದ್ದು ನಿಜ. ಆದ್ರೆ..............
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d5
  type: dialogue
  text: (ಮಕ್ಕಳ ಪ್ರವೇಶ) ಅಮ್ಮಾ .... ಅಮ್ಮಾ ..... ಹಸಿವಾಗ್ತಿದೆ.
  section: drama
  speaker: ಮಗಳು
- id: story-d6
  type: dialogue
  text: ನನಗೂ ಹಸಿವು, ಊಟ ಕೊಡಮ್ಮ.
  section: drama
  speaker: ಮಗ
- id: story-d7
  type: dialogue
  text: ನೋಡಿದ್ರಾ, ಮಕ್ಕಳೆಲ್ಲಾ ಹಸಿವಿನಿಂದ ಕಂಗಾಲಾಗಿವೆ. ಪಾಂಡಿತ್ಯವುಳ್ಳ ನನ್ನ ಗಂಡ ದುಡಿದು ತರ್ತಾರೇಂತ ತಿಳಿದಿದ್ದೆ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d8
  type: dialogue
  text: ಯಾವುದಕ್ಕೂ ಕಾಲ ಕೂಡಿ ಬರಬೇಕಲ್ಲ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d9
  type: dialogue
  text: ಅಂತೂ ಇಂತೂ ನಮಗೆ ಬಡತನವೇ ಗತಿ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d10
  type: dialogue
  text: ಚಿಂತೆ ಮಾಡಿದರೆ ಏನು ಬಂತು? ಜೀವನದಲ್ಲಿ ಬಂದದ್ದನ್ನು ಅನುಭವಿಸಲೇ ಬೇಕು. ಅದೇ ಮಾನವ ಧರ್ಮ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d11
  type: dialogue
  text: ನೀವು ನೀತಿ ಹೇಳುವುದರಲ್ಲಿ ಬಹಳ ಮುಂದು.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d12
  type: dialogue
  text: ನೀತಿ, ನಿಯಮ, ವಿಧೇಯತೆ, ಪಾಂಡಿತ್ಯ ಇದ್ದುದರಿಂದಲೇ ಗುರುಕುಲದಲ್ಲಿ ಶ್ರೀಕೃಷ್ಣ ನನ್ನ ಸ್ನೇಹಿತನಾದದ್ದು.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d13
  type: dialogue
  text: ಮಾತುಮಾತಿಗೂ “ಶ್ರೀಕೃಷ್ಣ ನನ್ನ ಸ್ನೇಹಿತನಾಗಿದ್ದ” ಅಂತೀರಿ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d14
  type: dialogue
  text: ಹೂಂ! ನಿಜಕ್ಕೂ ಆತ ನನ್ನ ಪರಮ ಮಿತ್ರನಾಗಿದ್ದ. ಗುರುಕುಲದಲ್ಲಿ ಒಟ್ಟಿಗೆ ವಿದ್ಯಾಭ್ಯಾಸ ಮಾಡಿದೆವು.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d15
  type: dialogue
  text: ಸತ್ಯ ಹೇಳುವಿರಾ! ಆ ಶ್ರೀಮಂತರೆಲ್ಲಿ, ನೀವೆಲ್ಲಿ? ಯಾಕೆ ಸುಮ್ಮನೆ ಬಡಾಯಿ ಬಿಡ್ತೀರಾ?
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d16
  type: dialogue
  text: ಯಾಕೆ ಸುಳ್ಳು ಹೇಳಲಿ ನಾನು, ಕೃಷ್ಣ ಸದಾ ನನ್ನ ಜೊತೆಯಲ್ಲಿಯೇ ಇರುತ್ತಿದ್ದ. ಒಟ್ಟಿಗೆ ಕಲಿಯುತ್ತಿದ್ದೆವು. ನನ್ನನ್ನು ಕಂಡರೆ ಅವನಿಗೆ ಅಪಾರ ಪ್ರೀತಿ, ಸ್ನೇಹ, ಗೌರವ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d17
  type: dialogue
  text: ಅಂತಹ ಶ್ರೀಮಂತ ಸ್ನೇಹಿತನಿದ್ದರೂ ಇಲ್ಲಿಯವರೆಗೆ ನೀವು ಏಕೆ ಅವರ ಹತ್ತಿರ ಸಹಾಯ ಕೇಳಲಿಲ್ಲ?
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d18
  type: dialogue
  text: (ಕ್ಷಣ ಹೊತ್ತು ಮೌನ) ಬಡವನಾದವ ದೊಡ್ಡವರ ಮನೆಗೆ ಸಹಾಯ ಕೇಳಲು ಹೋಗಬಾರದು.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d19
  type: dialogue
  text: ಸ್ನೇಹಿತರೆದುರು ಎಂಥ ಸ್ವಾಭಿಮಾನ! ದಯವಿಟ್ಟು ಹೋಗಿ ಅವರಲ್ಲಿ ಸಹಾಯ ಕೇಳಿ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d20
  type: dialogue
  text: ಹೇಗೆ ಕೇಳುವುದು?
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d21
  type: dialogue
  text: ಆತ್ಮೀಯ ಗೆಳೆಯ ಅನ್ನುತ್ತೀರಿ, ಅಂದ ಮೇಲೆ ಅವರು ಸಹಾಯ ಮಾಡೇ ಮಾಡುತ್ತಾರೆ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d22
  type: dialogue
  text: ಇಲ್ಲ ಅನ್ನಲಾರ, ಆದರೂ ಕೇಳುವುದಕ್ಕೆ ಸಂಕೋಚ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d23
  type: dialogue
  text: ಸಂಕೋಚ ಬೇಡಾರೀ, ಹಸಿದಿರುವ ಮಕ್ಕಳಿಗೋಸ್ಕರವಾದರೂ ಹೋಗಿ ಕೇಳಿ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d24
  type: dialogue
  text: ಆಗಲಿ, ಹೋಗುತ್ತೇನೆ. ಆದರೆ ಗೆಳೆಯನನ್ನು ನೋಡಲು ಬರಿಗೈಯಲ್ಲಿ ಹೋಗಲಾ?
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d25
  type: dialogue
  text: ನಿನ್ನೆ ತಂದ ಅವಲಕ್ಕಿಯಲ್ಲಿ ಸ್ವಲ್ಪವೇ ಉಳಿದಿದೆ. ಮಕ್ಕಳ ಉಪಾಹಾರಕ್ಕೆ ಏನೇನೂ ಸಾಲದು. ಅದನ್ನೇ ಕಟ್ಟಿಕೊಡಲೆ?
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d26
  type: dialogue
  text: ಹಸಿವು, ಅದನ್ನಾದರೂ ನನಗೆ ಕೊಡಮ್ಮ.
  section: drama
  speaker: ಮಗ
- id: story-d27
  type: dialogue
  text: ತುಸು ತಡೆದುಕೋ ಕಂದಾ, ದೇವರ ದಯೆಯಿದ್ದರೆ ಈ ಅವಲಕ್ಕಿಯೇ ಬಂಗಾರವಾದೀತು. (ಗಂಡನಿಗೆ) ಕಟ್ಟಿಕೊಡಲೆ?
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d28
  type: dialogue
  text: ಸರಿ, ಹಾಗೆ ಮಾಡು.
  section: drama
  speaker: ಸುಧಾಮ
- id: scene-2-stage
  type: prose
  text: 'ದೃಶ್ಯ-2: ಕೃಷ್ಣನ ಅರಮನೆ- ಕಾವಲುಗಾರ ಸುಧಾಮನನ್ನು ಅರಮನೆಯೊಳಕ್ಕೆ ಬಿಡದೆ ಬಾಗಿಲಲ್ಲೇ ನಿಲ್ಲಿಸುವನು. ಕೃಷ್ಣ ಆಕಸ್ಮಿಕವಾಗಿ ಹೊರಗೆ ಬರುವನು. ಸುಧಾಮನನ್ನು ನೋಡುವನು.'
  section: drama
- id: story-d29
  type: dialogue
  text: (ಆಶ್ಚರ್ಯದಿಂದ) ಓಹೋ ಸುಧಾಮ! ಯಾವಾಗ ಬಂದೆ? ಬಾ ಒಳಗೆ (ಸುಧಾಮನ ಕೈ ಹಿಡಿಯುವನು. ಕಾವಲುಗಾರ ಆಶ್ಚರ್ಯದಿಂದ ದೂರ ಸರಿಯುವನು.)
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d30
  type: dialogue
  text: ಶ್ರೀಕೃಷ್ಣ ಮಹಾರಾಜರು! (ಅತೀವ ಸಂತೋಷದಿಂದ ಆನಂದಬಾಷ್ಪ ಸುರಿಯುತ್ತದೆ. ಮಾತೇ ಹೊರಡದಂತಾಗಿದೆ.)
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d31
  type: dialogue
  text: ಏಕೆ ಸುಧಾಮ ಕಣ್ಣಲ್ಲಿ ನೀರು?
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d32
  type: dialogue
  text: ಬಹಳ ದಿನಗಳ ಅನಂತರ ನಿಮ್ಮನ್ನು ನೋಡುತ್ತಿರುವೆನಲ್ಲ! ಅದಕ್ಕಾಗಿ ಆನಂದದ ಕಣ್ಣೀರು.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d33
  type: dialogue
  text: ದೂರದಿಂದ ದಣಿದು ಬಂದಿದ್ದೀಯ. ಸ್ನಾನ ಮುಗಿಸಿ ಊಟ ಮಾಡಿ ವಿಶ್ರಾಂತಿ ತೆಗೆದುಕೋ. ಅಷ್ಟುಬೇಗ ನಿನ್ನನ್ನು ಹೋಗಗೊಡುವುದಿಲ್ಲ.
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d34
  type: dialogue
  text: ಅಯ್ಯೋ, ಅಲ್ಲಿ ಮನೆಯಲ್ಲಿ ಯಾರೂ ಇಲ್ಲ. ಮಕ್ಕಳಿಗೆ........
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d35
  type: dialogue
  text: ಸುಮ್ಮನಿರು, ಬಂದ ತಕ್ಷಣ ಹೋಗಬೇಕಿದ್ದರೆ ಯಾಕೆ ಬಂದೆ? ಯಾರಲ್ಲಿ? ಸುಧಾಮನಿಗೆ ವಿಶ್ರಾಂತಿಯ ವ್ಯವಸ್ಥೆ ಮಾಡಿ. (ಸುಧಾಮನಿಗೆ) ನನಗೂ ತುರ್ತು ಕೆಲಸವಿದೆ. ಅದು ಮುಗಿದ ತಕ್ಷಣ ಬಂದು ಬಿಡುವೆ.
  section: drama
  speaker: ಕೃಷ್ಣ
- id: scene-3-stage
  type: prose
  text: 'ದೃಶ್ಯ-3: ಕೃಷ್ಣನ ಅರಮನೆ- ಸುಧಾಮನಿರುವ ಕೋಣೆ.'
  section: drama
- id: story-d36
  type: dialogue
  text: (ಸ್ವಗತ) ಶ್ರೀಕೃಷ್ಣನಂತಹ ಮಿತ್ರನನ್ನು ಪಡೆದ ನಾನೇ ಧನ್ಯನು, ನನ್ನನ್ನು ಮರೆತಿಲ್ಲ. ನಾನು ತಂದ ಅವಲಕ್ಕಿಯನ್ನು ತಾನೂ ತಿಂದು ಹೆಂಡತಿಗೂ ಪ್ರೀತಿಯಿಂದ ತಿನ್ನಿಸಿದ. ಇಷ್ಟೊಂದು ಪ್ರೀತಿ ವಿಶ್ವಾಸವಿರುವ ಕೃಷ್ಣನ ಹತ್ತಿರ ನನ್ನ ಬಡತನ ಹೇಳಿ ಆತನ ಮನಸ್ಸಿಗೆ ಬೇಸರವುಂಟುಮಾಡಬಾರದು. ನನ್ನ ಬಡತನ ನನಗಿರಲಿ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d37
  type: dialogue
  text: (ಹಿಂದಿನಿಂದ ಬರುತ್ತ) ಏನು ಯೋಚಿಸುತ್ತಿರುವೆ ಸುಧಾಮ?
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d38
  type: dialogue
  text: ಏನಿಲ್ಲ ಕೃಷ್ಣ ..... ಏನಿಲ್ಲ, ಸುಮ್ಮನೆ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d39
  type: dialogue
  text: ನೀ ಬಂದು ನನ್ನ ಮನಸ್ಸಿಗೆ ತುಂಬಾ ಸಂತೋಷವನ್ನುಂಟುಮಾಡಿದೆ. ನನಗೆ ಗುರುಕುಲದ ಜೀವನ ನೆನಪಾಗುತ್ತಿದೆ.
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d40
  type: dialogue
  text: ಒಟ್ಟಿಗೆ ಊಟ ಮಾಡುತ್ತಿದ್ದೆವು, ಕೂಡಿ ಕಲಿಯುತ್ತಿದ್ದೆವು, ಕಟ್ಟಿಗೆ ತರಲು ಹೋಗುತ್ತಿದ್ದೆವು.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d41
  type: dialogue
  text: ಗುರುಮಾತೆ ಕೊಟ್ಟ ಹುರಿದ ಕಡಲೆ ತಿಂದಿದ್ದು! ನಿನ್ನ ಪಾಲಿನ ಕಡಲೆ ನಾ ಕಸಿದುಕೊಂಡಿದ್ದು!
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d42
  type: dialogue
  text: (ತಡವರಿಸುತ್ತಾ) ಹಸಿವು......ಬಡತನ.....(ಏನೋ ನೆನಪು ಮಾಡಿಕೊಳ್ಳಲು ಯತ್ನಿಸಿ ಮೌನಿಯಾಗುವನು.)
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d43
  type: dialogue
  text: ಪ್ರಜೆಗಳ ಹಸಿವು ಹಿಂಗಿಸಲು ಅವರ ಕಷ್ಟ ಕಾರ್ಪಣ್ಯ ನೀಗಿಸಲು ರಾಜನಾದವನು ಶ್ರಮಿಸಬೇಕು. ಆಗ ಮಾತ್ರ ಅವನು ನಿಜವಾದ ರಾಜನಾಗುವನು. ನಿನ್ನನ್ನು ಪೀಡಿಸಿದ್ದು ತಪ್ಪೆಂದು ಕ್ರಮೇಣ ನನ್ನ ಅರಿವಿಗೆ ಬಂತು ನೋಡು.
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d44
  type: dialogue
  text: ಕೃಷ್ಣ, ಇಷ್ಟು ದಿನ ಇಲ್ಲಿದ್ದು ಅದನ್ನೆಲ್ಲ ಕಣ್ಣಾರೆ ಕಂಡಿರುವೆ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d45
  type: dialogue
  text: ಸುಧಾಮ, ನಿನಗೇನು ಬೇಕು?
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d46
  type: dialogue
  text: ನನಗೇನೂ ಬೇಡ. ನಿನ್ನ ಸತ್ಕಾರ ಜೀವನದಲ್ಲಿ ಮರೆಯುವಂತಿಲ್ಲ. ನಿನ್ನ ಸ್ನೇಹವೊಂದೆ ಸಾಕು. ಇನ್ನು ನನ್ನೂರಿಗೆ ಹೊರಡುವೆ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d47
  type: dialogue
  text: ಇಷ್ಟು ಬೇಗ!
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d48
  type: dialogue
  text: ನಾನು ಇಷ್ಟು ದೀರ್ಘಕಾಲ ಮನೆಬಿಟ್ಟು ಇದ್ದವನೆ ಅಲ್ಲ. ಅಲ್ಲಿ ಹೆಂಡತಿ ಮಕ್ಕಳು ನನ್ನ ದಾರಿ ಕಾದು ಕಂಗಾಲಾಗಿರಬಹುದು.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d49
  type: dialogue
  text: ಇಲ್ಲಿಗೆ ಬಂದ ವಿಷಯ ಅವರಿಗೆ ಗೊತ್ತಿದೆಯಲ್ಲ.
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d50
  type: dialogue
  text: ಗೊತ್ತಿದೆ. ಆದರೆ ನನಗೆ ಮಕ್ಕಳದೇ ಚಿಂತೆ. ಹೊರಡಲು ಅಪ್ಪಣೆ ಕೊಡು ಕೃಷ್ಣಾ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d51
  type: dialogue
  text: ನಿನ್ನ ಇಷ್ಟದಂತೆಯೇ ಆಗಲಿ, ಹೋಗಿ ಬಾ. ಶುಭವಾಗಲಿ ಗೆಳೆಯ. ಅಂದ ಹಾಗೆ ನಿನ್ನ ಮನೆಗೆ ನನ್ನನ್ನು ಕರೆಯಲೇ ಇಲ್ಲ! ಪರವಾಗಿಲ್ಲ. ನೀನು ಕರೆಯದಿದ್ದರೂ ನಾನೇ ಬರುವೆ.
  section: drama
  speaker: ಕೃಷ್ಣ
- id: story-d52
  type: dialogue
  text: ಅಯ್ಯೋ! ನನ್ನ ಮನೆಗೆ! ಬೇಡ ಕೃಷ್ಣಾ!
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d53
  type: dialogue
  text: ಈಗ ಚಿಂತೆ ಬಿಟ್ಟು ಹೊರಡು. ಒಳ್ಳೆಯದಾಗಲಿ.
  section: drama
  speaker: ಕೃಷ್ಣ
- id: scene-4-stage
  type: prose
  text: 'ದೃಶ್ಯ-4: ಸುಧಾಮನ ಸುಂದರವಾದ ಮನೆ. ಹೆಂಡತಿ, ಮಕ್ಕಳು ಹೊಸಬಟ್ಟೆ ಧರಿಸಿ ಮನೆಯಲ್ಲಿ ಸಂತೋಷದಿಂದ ಇರುವ ಸನ್ನಿವೇಶ.'
  section: drama
- id: story-d54
  type: dialogue
  text: (ಆಶ್ಚರ್ಯದಿಂದ ಹೆಂಡತಿಗೆ) ನೀವು ಯಾರ ಮನೆಯಲ್ಲಿದ್ದೀರಿ?
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d55
  type: dialogue
  text: ಇದು ನಮ್ಮ ಮನೆ ಕಣ್ರೀ!
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d56
  type: dialogue
  text: ನಮ್ಮ ಗುಡಿಸಲು ಎಲ್ಲಿ?
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d57
  type: dialogue
  text: ಆ ಗುಡಿಸಲಿನ ಜಾಗದಲ್ಲಿಯೇ ಈ ಅರಮನೆಯಂತಹ ಮನೆ ನಿರ್ಮಾಣವಾಗಿದೆ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d58
  type: dialogue
  text: ಅರೆ! ನಾನು ಹೋಗಿ ಬರುವುದರೊಳಗೆ ಇದು ಹೇಗೆ ಸಾಧ್ಯವಾಯ್ತು?
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d59
  type: dialogue
  text: (ನಗುತ್ತ) ನಿಮ್ಮ ಮಿತ್ರನ ಕೃಪೆಯಿಂದ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d60
  type: dialogue
  text: (ಆಶ್ಚರ್ಯದಿಂದ) ನನ್ನ ಮಿತ್ರ ಶ್ರೀಕೃಷ್ಣನಿಂದ!
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d61
  type: dialogue
  text: ಹೌದು, ಆ ಮಹಾರಾಯ ಶ್ರೀಕೃಷ್ಣನಿಂದಲೇ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d62
  type: dialogue
  text: ನಾನು ಅವನಿಗೆ ಸಹಾಯ ಮಾಡು ಎಂದು ಕೇಳಿಯೇ ಇಲ್ಲ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d63
  type: dialogue
  text: ನಿಜವಾಗಿಯೂ!
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d64
  type: dialogue
  text: ಸತ್ಯವಾಗಿಯೂ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d65
  type: dialogue
  text: ನೀವು ದ್ವಾರಕಾ ನಗರ ತಲುಪಿದ ದಿನವೇ ಅಲ್ಲಿಂದ ಸೇವಕರ ದಂಡು ಬಂತು. ಬೇಕಾದ ಎಲ್ಲ ವಸ್ತುಗಳನ್ನು ತಂದರು. ಚಕಚಕಾಂತ ಮನೆ ನಿರ್ಮಿಸಿದರು. ನಮಗೆಲ್ಲ ಹೊಸ ಉಡುಪು, ಆಭರಣಗಳನ್ನು ಸಹ ಕೊಟ್ಟರು.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d66
  type: dialogue
  text: ಪರಮಾಶ್ಚರ್ಯ, ನನ್ನ ಮನದ ಇಂಗಿತವನ್ನು ತಿಳಿದುಕೊಂಡು ಎಲ್ಲಾ ರೀತಿಯ ಸಹಾಯ ಮಾಡಿದ್ದಾನೆ ಶ್ರೀಕೃಷ್ಣ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d67
  type: dialogue
  text: ನೀವು ತೆಗೆದುಕೊಂಡು ಹೋದ ಅವಲಕ್ಕಿಯನ್ನು ಅವರಿಗೆ ನೀಡಿದಿರಾ?
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d68
  type: dialogue
  text: ಹೂಂ! ಕೊಟ್ಟೆ. ಬಹಳ ಆನಂದದಿಂದ ತಿಂದು, ಹೆಂಡತಿ ರುಕ್ಮಿಣಿಗೂ ತಿನ್ನಿಸಿದ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d69
  type: dialogue
  text: ಅಬ್ಬಾ.......! ಬಡವರ ಮನೆ ಅವಲಕ್ಕಿಯನ್ನು ಸಂತೋಷವಾಗಿ ತಿಂದರಲ್ಲ. ಇದು ಅವರ ನಿಜವಾದ ಸ್ನೇಹ ಹಾಗೂ ದೊಡ್ಡ ಗುಣ. ಮತ್ತೆ ನೀವು ಯಾಕೆ ಸಹಾಯ ಕೇಳಲಿಲ್ಲ?
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d70
  type: dialogue
  text: ಆತ ಸತ್ಕಾರ ಮಾಡಿದ್ದು ನೋಡಿ ನನ್ನ ಮನಸ್ಸು ನಾಚಿ ಕುಗ್ಗಿ ಹೋಯಿತು. ಮತ್ತೆ ಏನನ್ನು ಕೇಳಲೂ ಮನಸ್ಸಾಗಲಿಲ್ಲ.
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d71
  type: dialogue
  text: ನೀವು ಕೇಳಲಿಲ್ಲ ನಿಜ, ಆದರೆ ಆ ಶ್ರೀಕೃಷ್ಣ ಪರಮಾತ್ಮನೇ ತಮ್ಮ ಕರ್ತವ್ಯ ಮಾಡಿದ್ದಾರೆ.
  section: drama
  speaker: ಹೆಂಡತಿ
- id: story-d72
  type: dialogue
  text: ಮಕ್ಕಳೆಲ್ಲಾ ಎಲ್ಲಿದ್ದಾರೆ?
  section: drama
  speaker: ಸುಧಾಮ
- id: story-d73
  type: dialogue
  text: ಅಪ್ಪಾ.....ನನ್ನ ಹೊಸ ಬಟ್ಟೆ ನೋಡಿ, ಎಷ್ಟು ಚೆನ್ನಾಗಿದೆ ಸರ, ಓಲೆ, ಬಳೆ ಎಲ್ಲ......
  section: drama
  speaker: ಮಗಳು
- id: story-d74
  type: dialogue
  text: ಅಪ್ಪಾ..... ನಿಮಗೂ ರೇಷ್ಮೆಬಟ್ಟೆ ಕೊಟ್ಟಿದ್ದಾರೆ, ನೋಡಿ.
  section: drama
  speaker: ಮಗ
- id: story-d75
  type: dialogue
  text: ನನಗೆ ಬೇಡ, ನೀವೆಲ್ಲ ಧರಿಸಿಕೊಳ್ಳಿ. ನನಗೆ ಆ ಕೃಷ್ಣದೇವನ ಸ್ನೇಹವೇ ರೇಷ್ಮೆ ಬಟ್ಟೆ, ಅವನ ಮಾತೆ ನನಗೆ ಆಭರಣ. ಅವನಂತಹ ಗೆಳೆಯನನ್ನು ಪಡೆದ ನಾನೇ ಧನ್ಯ.
  section: drama
  speaker: ಸುಧಾಮ
- id: author-1
  type: prose
  text: ವಿ.ಎಸ್. ಶಿರಹಟ್ಟಿ ಮಠ ಅವರು ಈ ನಾಟಕವನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಪ್ರಸ್ತುತ ಪಾಠವು ಕೃಷ್ಣ-ಸುಧಾಮರ ಗೆಳೆತನವನ್ನು ನಾಟಕ ರೂಪದಲ್ಲಿ ತೋರಿಸುತ್ತದೆ.
  section: author
