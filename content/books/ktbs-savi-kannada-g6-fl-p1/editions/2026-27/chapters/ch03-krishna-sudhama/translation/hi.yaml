  vocab: शब्दार्थ
  exercise-A: अ. दो पर्याय लिखिए।
  exercise-B: आ. अपने वाक्य बनाइए।
  exercise-C: इ. एक वाक्य में उत्तर दीजिए।
  exercise-D: ई. पाँच-छह वाक्यों में उत्तर दीजिए।
  exercise-E: उ. किसने, किसे, कब कहा?
intro-1: मित्रता एक पवित्र संबंध है। यहाँ गरीबी, धन, विद्वान, अविद्वान आदि किसी भेदभाव का स्थान नहीं। जन्म से भाई और बढ़कर संबंधी बन जीवन चलाने वाले हमारे बीच हैं। एक ही कक्षा में पढ़े बचपन के मित्र भी धन-गरीबी से बिछड़ जाते हैं। सच्ची मित्रता का बंधन नहीं टूटता—यह दिखाना इस पाठ का आशय है।
scene-1-stage: 'दृश्य-1: सुदामा की झोपड़ी, रात। सुदामा सोचता घूम रहा है। मुख पर निराशा।'
story-d1: (स्वगत) जीवन में सिर्फ कष्ट ही आते हैं! सुख के दिन कब आएँगे? हा! (आह भर) वह सब उसी भगवान को पता!
story-d2: गरीबी हमारी पीठ चिपकी है। हमें छोड़कर नहीं जाएगी।
story-d3: ‘गरीबी रहे, घर भरा बच्चों से रहे’—क्या तुमने भगवान से यही माँगा?
story-d4: बच्चे हों—यह सच। पर..............
story-d5: (बच्चों का प्रवेश) अम्मा .... अम्मा ..... भूख लगी है।
story-d6: मुझे भी भूख है, खाना दो अम्मा।
story-d7: देखो, बच्चे भूख से व्याकुल हैं। समझा था पंडित पति कमाकर लाएँगे।
story-d8: हर बात के लिए समय का मेल चाहिए।
story-d9: जैसे-तैसे हमें गरीबी ही मिली है।
story-d10: चिंता करने से क्या हुआ? जीवन में जो आए सहना ही चाहिए। वही मानव धर्म।
story-d11: नीति सुनाने में तुम बहुत आगे हो।
story-d12: नीति, नियम, आज्ञाकारिता, पांडित्य होने से ही गुरुकुल में श्रीकृष्ण मेरे मित्र बने।
story-d13: हर बात पर «श्रीकृष्ण मेरे मित्र थे» कहते हो।
story-d14: हाँ! सचमुच वह मेरे परम मित्र थे। गुरुकुल में साथ पढ़े।
story-d15: सच कहते हो? वे धनी कहाँ, तुम कहाँ? व्यर्थ डींग क्यों हाँकते हो?
story-d16: झूठ क्यों बोलूँ? कृष्ण सदा मेरे साथ रहते। साथ पढ़ते। मुझे देखकर अपार प्रेम, स्नेह, गौरव।
story-d17: ऐसे धनी मित्र होते हुए अब तक उनके पास मदद क्यों नहीं माँगी?
story-d18: (क्षण मौन) गरीब को बड़े के घर मदद माँगने नहीं जाना चाहिए।
story-d19: मित्र के सामने कैसा अभिमान! कृपया जाकर उनसे मदद माँगो।
story-d20: कैसे माँगूँ?
story-d21: आत्मीय मित्र कहते हो, तो मदद अवश्य करेंगे।
story-d22: नहीं नहीं कह सकता, पर माँगने में संकोच।
story-d23: संकोच मत करो; भूखे बच्चों के लिए ही सही, जाकर माँगो।
story-d24: अच्छा, जाता हूँ। पर मित्र से मिलने खाली हाथ जाऊँ?
story-d25: कल लाई अवल्ककी में थोड़ी ही बची। बच्चों के नाश्ते को भी नहीं। वही बाँध दूँ?
story-d26: भूख—वही मुझे दो अम्मा।
story-d27: थोड़ा ठहरो बेटा, भगवान की दया हो तो यही अवल्ककी सोना बन जाए। (पति से) बाँध दूँ?
story-d28: ठीक, ऐसा करो।
scene-2-stage: 'दृश्य-2: कृष्ण का महल—पहरेदार सुदामा को अंदर नहीं जाने देते। कृष्ण अचानक बाहर आते हैं, सुदामा को देखते हैं।'
story-d29: (आश्चर्य से) ओहो सुदामा! कब आए? अंदर आओ (हाथ पकड़ते। पहरेदार आश्चर्य से हटते।)
story-d30: श्रीकृष्ण महाराज! (अत्यधिक आनंद से आँसू। बात नहीं निकलती।)
story-d31: सुदामा आँखों में पानी क्यों?
story-d32: बहुत दिनों बाद आपको देख रहा हूँ! इसलिए आनंद के आँसू।
story-d33: दूर से थककर आए हो। स्नान-भोजन कर आराम लो। इतनी जल्दी नहीं जाने दूँगा।
story-d34: अय्यो, घर में कोई नहीं। बच्चों को........
story-d35: चुप रहो—आते ही जाना था तो क्यों आए? किसके पास? सुदामा के लिए आराम की व्यवस्था करो। (सुदामा से) मेरा भी ज़रूरी काम है। खत्म होते ही आऊँगा।
scene-3-stage: 'दृश्य-3: कृष्ण का महल—सुदामा का कमरा।'
story-d36: (स्वगत) श्रीकृष्ण जैसे मित्र पाकर मैं धन्य; भूला नहीं। लाई अवल्ककी खुद खाई पत्नी को भी प्रेम से खिलाई। इतना प्रेम-विश्वास हो तो अपनी गरीबी कह मन दुखाना नहीं चाहिए। गरीबी मेरे पास रहे।
story-d37: (पीछे से आते) क्या सोच रहे हो सुदामा?
story-d38: कुछ नहीं कृष्ण ..... कुछ नहीं, यूँ ही।
story-d39: तुम्हारे आने से मन को बहुत आनंद। गुरुकुल का जीवन याद आता है।
story-d40: साथ खाते, साथ पढ़ते, लकड़ी लाने जाते।
story-d41: गुरुमाता की भुनी चना खाना! तुम्हारा हिस्सा मैं छीन लेना!
story-d42: (हिचकिचाते) भूख......गरीबी.....(याद करने का यत्न कर मौन।)
story-d43: प्रजा की भूख मिटाने, कष्ट-कार्पण्य हटाने राजा को श्रम करना चाहिए। तभी सच्चा राजा। तुम्हें पीड़ित करना गलत था—धीरे-धीरे यह बोध हुआ देखो।
story-d44: कृष्ण, इतने दिन यहाँ रह सब आँखों से देखा।
story-d45: सुदामा, तुम्हें क्या चाहिए?
story-d46: मुझे कुछ नहीं। तुम्हारा सत्कार जीवन में अविस्मरणीय। तुम्हारी मित्रता काफी। अब गाँव जाता हूँ।
story-d47: इतनी जल्दी!
story-d48: मैं इतने लंबे काल घर छोड़ने वाला नहीं। वहाँ पत्नी-बच्चे राह देख व्याकुल हो सकते।
story-d49: यहाँ आने की बात उन्हें पता है।
story-d50: पता है। पर चिंता बच्चों की। जाने की आज्ञा दो कृष्ण।
story-d51: तुम्हारी इच्छा अनुसार; जाओ आओ। शुभ हो मित्र। वैसे तुमने घर नहीं बुलाया! कोई बात नहीं। न बुलाओ तो भी मैं स्वयं आऊँगा।
story-d52: अय्यो! मेरे घर! मत कृष्ण!
story-d53: अब चिंता छोड़कर जाओ। भला हो।
scene-4-stage: 'दृश्य-4: सुदामा का सुंदर घर। पत्नी-बच्चे नए कपड़ों में प्रसन्न।'
story-d54: (आश्चर्य से पत्नी से) तुम किसके घर में हो?
story-d55: यह हमारा घर है प्रिय!
story-d56: हमारी झोपड़ी कहाँ?
story-d57: उसी झोपड़ी की जगह यह महल जैसा घर बना है।
story-d58: अरे! मेरे जाते-आते यह कैसे संभव?
story-d59: (हँसते) तुम्हारे मित्र की कृपा से।
story-d60: (आश्चर्य) मेरे मित्र श्रीकृष्ण से!
story-d61: हाँ, उसी महाराज श्रीकृष्ण से।
story-d62: मैंने मदद करने को कहा ही नहीं।
story-d63: सचमुच!
story-d64: सत्य ही।
story-d65: द्वारका पहुँचने के दिन ही वहाँ से सेवकों का दल आया। जरूरी सब लाए। चमकता घर बनाया। हमें सबको नए वस्त्र-आभूषण भी दिए।
story-d66: परमाश्चर्य—मेरे मन की बात जान हर तरह मदद की श्रीकृष्ण ने।
story-d67: ले गई अवल्ककी उन्हें दी?
story-d68: हाँ! दी। बहुत आनंद से खाई, पत्नी रुक्मिणी को भी खिलाई।
story-d69: अब्बा.......! गरीब घर की अवल्ककी खुशी से खाई। यही सच्ची मित्रता और बड़ा गुण। फिर मदद क्यों नहीं माँगी?
story-d70: सत्कार देख मन शर्म से सिकुड़ गया। फिर कुछ माँगने का मन नहीं हुआ।
story-d71: तुमने नहीं माँगा सच, पर श्रीकृष्ण परमात्मा ने अपना कर्तव्य किया।
story-d72: बच्चे सब कहाँ हैं?
story-d73: अप्पा..... नए कपड़े देखो, कितने अच्छे हार, बाली, चूड़ियाँ सब......
story-d74: अप्पा..... तुम्हें भी रेशमी कपड़े दिए हैं, देखो।
story-d75: मुझे नहीं चाहिए, तुम पहनो। मुझे उस कृष्णदेव की मित्रता ही रेशम, उनकी बात ही आभूषण। ऐसे मित्र पाकर मैं धन्य।
author-1: वी.एस. शिरहट्टि मठ ने यह नाटक रचा। प्रस्तुत पाठ कृष्ण-सुदामा की मित्रता को नाटक रूप में दिखाता है।
