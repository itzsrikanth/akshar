intro-1: Friendship is a sacred bond. Here there is no discrimination of poverty, wealth, the educated or the uneducated. Among us there are those who from birth are brothers and as they grow become relatives. Childhood friends who studied in the same class also separate because of wealth and poverty. The aim of this lesson is to show that the bond of true friendship does not break.
scene-1-stage: 'Scene 1: Sudhama’s hut, night. Sudhama paces thinking. His face is full of despair.'
story-d1: (Aside) In life only hardships keep coming! When will days of happiness come? Ah! (sighs) All that only God knows!
story-d2: Poverty has stuck to our backs. It will not leave us.
story-d3: Did you beg God ‘let us have poverty, but a house full of children’?
story-d4: Asking for children is true. But..............
story-d5: (children enter) Amma .... Amma ..... I’m hungry.
story-d6: I’m hungry too; give food, mother.
story-d7: See, the children are distressed with hunger. I thought my learned husband would earn and bring.
story-d8: For everything the time must come together.
story-d9: One way or another poverty is our lot.
story-d10: What came of worrying? What comes in life must be endured. That is human dharma.
story-d11: You are far ahead in preaching morals.
story-d12: It is because of morals, rules, obedience and learning that Sri Krishna became my friend in the gurukula.
story-d13: At every word you say “Sri Krishna was my friend.”
story-d14: Yes! Truly he was my closest friend. Together we studied in the gurukula.
story-d15: Are you telling the truth? Where are those rich people, where are you? Why do you boast for nothing?
story-d16: Why should I lie? Krishna was always with me. We studied together. Seeing me he had immense love, friendship and respect.
story-d17: Having such a rich friend, why until now did you not ask him for help?
story-d18: (silent a moment) A poor man should not go to the great for help.
story-d19: What self-respect before a friend! Please go and ask him for help.
story-d20: How to ask?
story-d21: You call him a dear friend; then he will surely help.
story-d22: I cannot say no, yet I hesitate to ask.
story-d23: Don’t hesitate; at least for the hungry children go and ask.
story-d24: All right, I will go. But shall I go empty-handed to see a friend?
story-d25: Of the flattened rice I brought yesterday only a little remains. It is not enough for the children’s breakfast. Shall I pack that?
story-d26: Hunger—give me even that, mother.
story-d27: Wait a little, child; if God wills this flattened rice itself may become gold. (to husband) Shall I pack it?
story-d28: All right, do so.
scene-2-stage: 'Scene 2: Krishna’s palace—the guard stops Sudhama at the door. Krishna comes out by chance and sees Sudhama.'
story-d29: (in surprise) Oh Sudhama! When did you come? Come inside (takes Sudhama’s hand. The guard steps aside in surprise.)
story-d30: Sri Krishna Maharaja! (tears of joy flow with intense happiness. Words will not come.)
story-d31: Why tears in your eyes, Sudhama?
story-d32: After so many days I am seeing you! These are tears of joy for that.
story-d33: You have come tired from afar. Bathe, eat and rest. I will not let you go so soon.
story-d34: Alas, there is no one at home. The children........
story-d35: Be quiet—if you had to go at once why did you come? To whom? Arrange rest for Sudhama. (to Sudhama) I too have urgent work. As soon as it is done I will come.
scene-3-stage: 'Scene 3: Krishna’s palace—Sudhama’s room.'
story-d36: (aside) Blessed am I who have a friend like Sri Krishna; he has not forgotten me. He ate the flattened rice I brought and lovingly fed his wife too. With such love and trust I should not tell him my poverty and trouble his mind. Let my poverty stay with me.
story-d37: (coming from behind) What are you thinking, Sudhama?
story-d38: Nothing, Krishna ..... nothing, just so.
story-d39: Your coming has given my mind great joy. Gurukula life comes to my mind.
story-d40: We ate together, studied together, went to fetch firewood.
story-d41: Eating the roasted gram the guru’s wife gave! I snatching your share of gram!
story-d42: (hesitating) Hunger......poverty.....(tries to remember something and becomes silent.)
story-d43: A king must strive to end the people’s hunger and remove their hardship and meanness. Only then is he a true king. That I troubled you was wrong—this gradually came to my awareness, see.
story-d44: Krishna, staying here these days I have seen all that with my own eyes.
story-d45: Sudhama, what do you need?
story-d46: I need nothing. Your hospitality is unforgettable in life. Your friendship alone is enough. Now I will leave for my village.
story-d47: So soon!
story-d48: I am not one who stays away from home so long. There wife and children may be waiting anxiously for me.
story-d49: They know why you came here.
story-d50: They know. But my worry is only the children. Give leave to go, Krishna.
story-d51: As you wish; go and come. May it be well, friend. By the way you never invited me to your house! Never mind. Even if you don’t invite I myself will come.
story-d52: Alas! To my house! Don’t, Krishna!
story-d53: Now leave worry and go. May good happen.
scene-4-stage: 'Scene 4: Sudhama’s beautiful house. Wife and children in new clothes, happy at home.'
story-d54: (surprised, to wife) Whose house are you in?
story-d55: This is our house, dear!
story-d56: Where is our hut?
story-d57: On the very spot of that hut this palace-like house has been built.
story-d58: Oh! How was this possible while I went and came?
story-d59: (laughing) By your friend’s grace.
story-d60: (surprised) From my friend Sri Krishna!
story-d61: Yes, from that great king Sri Krishna himself.
story-d62: I never even asked him to help.
story-d63: Really!
story-d64: Truly.
story-d65: The very day you reached Dwaraka a troop of servants came from there. They brought all needed things. They built a sparkling house. They also gave us all new clothes and ornaments.
story-d66: Wonder of wonders—knowing the wish of my heart Sri Krishna has helped in every way.
story-d67: Did you give them the flattened rice you took?
story-d68: Yes! I gave it. He ate with great joy and fed wife Rukmini too.
story-d69: Ah.......! He happily ate flattened rice from a poor home. That is their true friendship and greatness. Why then did you not ask for help?
story-d70: Seeing his hospitality my mind shrank in shame. I had no heart to ask anything more.
story-d71: You did not ask, true, but that Sri Krishna Paramatma himself has done his duty.
story-d72: Where are all the children?
story-d73: Appa..... look at my new clothes, how nice the chain, earrings, bangles all......
story-d74: Appa..... they have given you silk clothes too, look.
story-d75: I don’t need them; you all wear them. For me that Krishnadeva’s friendship itself is silk cloth, his word itself an ornament. Blessed am I who have such a friend.
author-1: V.S. Shirahatti Matha composed this play. The present lesson shows the friendship of Krishna and Sudhama in dramatic form.
