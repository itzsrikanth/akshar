labels:
  story: पूरक पाठ
  exercise-A: निम्नलिखित प्रश्नों के उत्तर दीजिए।
story-n1: कन्नड़ साहित्य का लगभग 1500 वर्षों का इतिहास है। जनपद गीत, कथाएँ, लावणी और रंगमंच कन्नड़ साहित्य को आम लोगों तक मौखिक रूप से पहुँचाते आए हैं। पुराण, इतिहास आदि प्रसिद्ध साहित्य को मनोरंजन के साथ पहुँचाने का कार्य रंगमंच ने संभाला। श्रव्य-दृश्य माध्यम होने से रंगमंच की भूमिकाएँ बहुत जल्दी लोगों तक पहुँचती हैं। रंगमंच कला को बचाकर बढ़ाने में कई महापुरुषों ने अपना जीवन समर्पित किया। ऐसे महान कलाकारों में मुहम्मद पीर एक हैं।
story-n2: मुहम्मद पीर कन्नड़ वृत्ति रंगमंच के प्रसिद्ध अभिनेता हैं। उनका जन्म मैसूर के एक मध्यमवर्गीय परिवार में हुआ। पिता पहलवान मोहियुद्दीन, माता मुबारकबी। बचपन में माता-पिता खोकर पीर बाद में मामा के आश्रय में पले। वेस्लियन मिशन हाईस्कूल में पढ़ते समय ही नाटक में रुचि लगी। अवसर मिलते ही नाटक देखते; वरदाचार्य, कृष्णमूर्तिराव, बल्लारी राघव का प्रभाव पड़ा। नाटक के पागलपन से विद्याभ्यास रुक गया। 1915 में मैसूर की गिरिधरलाल कंपनी में प्रवेश कर रंगमंच पर कदम रखा।
story-n3: कृष्णलीला उनका पहला अभिनय नाटक था। 1920 में वे कंपनी छोड़ बेंगलूर गए और गुरुकार कंपनी नाम से प्रसिद्ध नटभयंकर गंगाधरराय की भारत जनमनोललासिनी नाटक कंपनी में जुड़े। आठ वर्ष काम किया। वहाँ कालिदास में चरवाहा, सदारमे में चोर, प्रभामणि में विरोचन, सुभद्रा में ब्राह्मण जैसे हास्य पात्र मिले। धीरे-धीरे अभिनेता के साथ सलाहकार, सचिव, स्टेज मैनेजर और अंत में मैनेजर बने। सह-अभिनेताओं के सहयोग से 1932 में चंद्रकला नाटक मंडली स्थापित की।
story-n4: साढ़े पाँच वर्ष तक अस्तित्व में रही इस संस्था ने पीर के नेतृत्व में असामान्य कला-सिद्धि पाई। पहली प्रस्तुति द्विजेंद्रलाल राय का शाजहान अत्यधिक लोकप्रिय हुआ। एक ही नाटक नौ दिन लगातार खेले जाने का गौरव मिला। एच.एल.एन.सिंह का संसार नौके (1932), पुट्टस्वामय्या का गौतम बुद्ध (1934) जैसे नए नाटक खेले। प्रभामणि विजय, वीरसिंह चरित्र, सदारमे, सुभद्रा परिणय भी इसी मंडली के रहे। संसार नौका में सुंदर, शाजहान में दारा, गौतमबुद्ध में गौतम का अभिनय विशेष ख्याति पाकर पीर का नाम कन्नड़ रंगमंच इतिहास में चिरस्थायी हुआ।
story-n5: वरदाचार्य और राघव के बाद रंग-अभिनय कला पीर से ही प्रखर हुई—यह अतिशयोक्ति नहीं। कन्नड़ राघव कहे जाने वाले पीर को 1935 में हुब्बल्ली में मुदवीडु कृष्णराय के नेतृत्व में नाट्य कला दुरंतद्धर पुरस्कार दिया गया।
story-n6: साढ़े पाँच फुट लंबाई, विशाल माथा, चौड़ी आँखें, आकर्षक स्वर वाले पीर का जीवन सरल था। दक्ष अभिनय और स्वर-पूर्ण संवाद शैली उनके नाटकों की जान थी। उनका मत था कि शोरगुल संगीत और गीतों से नाटक की गति अक्सर रुकती है। संगीत-प्रधान नाटकों का महत्व घटने और लोकप्रियता कम होने पर साहित्य-मूल्य वाले गद्य कृति भी अभिनय-योग्य हैं—यह दिखाने का श्रेय पीर को है।
ex-a-q1: कन्नड़ राघव के नाम से प्रसिद्ध कौन थे?
ex-a-q2: मुहम्मद पीर किसके आश्रय में पले?
ex-a-q3: मुहम्मद पीर को नाटक की रुचि कब लगी?
ex-a-q4: मुहम्मद पीर के कौन से पात्र विशेष ख्याति पाए?
ex-a-q5: मुहम्मद पीर के माता-पिता के नाम क्या थे?
