labels:
  story: Supplementary lesson
  exercise-A: Answer the following questions.
story-n1: Kannada literature has a history of about 1500 years. Folk songs, stories, lavani and theatre have carried Kannada literature orally to ordinary people. Theatre has taken on the work of conveying famous literature such as puranas and history along with entertainment. As an audio-visual medium, theatre roles reach people very quickly. Many great people have dedicated their lives to preserving and fostering the art of theatre. Among such great artists is Muhammad Peer.
story-n2: Muhammad Peer is a famous actor of Kannada professional theatre. He was born in a middle-class family in Mysore. His father was wrestler Mohiyuddin; his mother Mubarakbi. Having lost his parents in childhood, Peer later grew up under his maternal uncle’s care. While studying at Wesleyan Mission High School he developed a taste for drama. Whenever he got a chance he never failed to watch plays; Varadacharya, Krishnamurthy Rao and Ballari Raghava influenced him. His obsession with drama hindered his studies. In 1915 he entered Giridharlal Company in Mysore and thus stepped onto the stage.
story-n3: Krishnaleela was the first play he acted in. In 1920 Peer left that company, went to Bengaluru and joined Natabhayankara Gangadhararao’s Bharata Janamanollasini theatre company, known as Gurukar Company. He worked there for eight years. There he got comic roles such as a shepherd in Kalidasa, a thief in Sadarame, Virochana in Prabhamani, and a brahmin in Subhadra. Gradually Peer became not only an actor of the company but its adviser, secretary, stage manager and finally manager. With the help of some fellow actors he founded Chandrakala Nataka Mandali in 1932.
story-n4: In the five-and-a-half years this institution existed, the artistic achievement under Peer’s leadership was extraordinary. The company’s first production, Dwijendralal Ray’s Shahjahan, won huge popularity. It earned the distinction of being performed for nine days continuously. The mandali staged new kinds of plays such as H.L.N. Simha’s Samsara Nauke (1932) and Puttaswamayya’s Gautama Buddha (1934). Besides these three special plays, Prabhamani Vijaya, Veerasimha Charitre, Sadarame and Subhadra Parinaya also belonged to this mandali. Peer’s acting as Sundara in Samsara Nauka, Dara in Shahjahan and Gautama in Gautama Buddha won special fame, and his name became lasting in the history of Kannada theatre.
story-n5: It is no exaggeration to say that after Varadacharya and Raghava, the art of stage acting grew intense through Peer. Peer, famous as the Kannada Raghava, was awarded the Natya Kala Durandhara prize in 1935 at Hubballi under Mudaveedu Krishnaraya’s leadership.
story-n6: Five and a half feet tall, with a broad forehead, wide eyes and an attractive voice, Peer lived simply. Skilled acting and a voice-rich style of dialogue were the life of his plays. He believed that noisy music and songs often hindered a play’s flow. When music-centred plays lost importance and popularity, the credit for showing that literary prose works too can be acted belongs to Peer.
ex-a-q1: Who became famous as the Kannada Raghava?
ex-a-q2: Under whose care did Muhammad Peer grow up?
ex-a-q3: When did Muhammad Peer develop a taste for drama?
ex-a-q4: Which of Muhammad Peer’s roles won special fame?
ex-a-q5: What were Muhammad Peer’s parents’ names?
