labels:
  story: pūraka pāṭha
  exercise-A: a. kèḻagina praśnègaḻigè uttarisiri.
story-n1: namma kannaḍa sāhityakkè sumāru 1500 varṣagaḻa itihāsavidè. janapada gītè, kathègaḻu, lāvaṇi hāgū raṃgabhūmi kannaḍa sāhityavannu janasāmānyarigè maukhikavāgi talupisutta baṃdivè. purāṇa, itihāsa muṃtāda prasiddhavāda sāhityavannu manoraṃjanèya jòtègè ravānisuva kāryavannu raṃgabhūmi vahisikòṃḍidè. śravya dṛśya sādhanavāda raṃgabhūmiya pātragaḻu bahu beganè janarannu taluputtavè. raṃgabhūmi kalèyannu uḻisi bèḻèsuvudaralli halavāru mahanīyaru tamma jīvanavanne muḍupāgirisiddārè. aṃtaha mahān kalāvidaralli mahammad pīr òbbaru.
story-n2: mahammad pīr kannaḍa vṛtti raṃgabhūmiya prasiddha naṭa. maisūrina madhyama vargada kuṭuṃbavòṃdaralli janisidaru. ivara taṃdè pailvān mòhiyuddīn. tāyi mubārakbi. taṃdètāyiyarannu bālyadalliyè kaḻèdukòṃḍa pīr avaru anaṃtara sodaramāvana āśrayadalli bèḻèdaru. ivaru vèsliyan miṣan haiskūlinalli oduttiruvāgalè nāṭakadalli abhiruci hattitu. avakāśa dòrètāgalèllā tappadè nāṭakagaḻannu noḍuttidda ivara melè varadācārya, kṛṣṇamūrtirāv, baḻḻāri rāghava avara prabhāvavāyitu. nāṭakada gīḻiniṃdāgi vidyābhyāsa kuṃṭhitagòṃḍitu. 1915ralli maisūrinalliye idda giridharalāl kaṃpani praveśisuva mūlaka ivaru raṃgabhūmigè padārpaṇa māḍidaru.
story-n3: kṛṣṇalīlā ivaru abhinayisida mòdala nāṭaka. 1920ralli pīr avaru ī saṃsthèyannu biṭṭu bèṃgaḻūrigè hogi gurukār kaṃpani èṃdu prasiddhavāgidda naṭabhayaṃkara gaṃgādhararāyara ‘bhārata janamanollāsini’ nāṭaka kaṃpanigè seridaru. illi èṃṭu varṣagaḻa kāla duḍidaru. illiruvāga ‘kāḻidāsa’dalli kuruba, ‘sadāramè’yalli kaḻḻa, ‘prabhāmaṇi’yalli virocana, ‘subhadrā’dalli brāhmaṇa- iṃtaha hāsya pātragaḻu avara pālinadādavu. barubaruttā pīr avaru kaṃpaniya naṭarāgiyaṣṭe alladè ā kaṃpaniya salahègārarāgi, kāryadarśiyāgi, sṭej myānejar āgi kònègè kaṃpaniya myānejar ādaru. kèlavu saha naṭara sahakāradiṃda 1932ralli caṃdrakalā nāṭaka maṃḍaḻiyannu sthāpisidaru.
story-n4: aidūvarè varṣagaḻa kāla astitvadallidda ī saṃsthè pīrravara netṛtvadalli sādhisida kalāsiddhi asāmānya. ī kaṃpaniya mòdala prayoga dvijeṃdralālrāyara ‘ṣājahāna’ pracaṃḍa janapriyatè paḍèyitu. òṃde nāṭaka òṃbattu dinagaḻu satata pradarśitavāda kīrti idaradāyitu. èc.èl.èn.siṃha avara ‘saṃsāra naukè’ (1932), puṭṭasvāmayyanavara ‘gautama buddha’ (1934) muṃtāda hòsa bagèya nāṭakagaḻannu ī maṃḍaḻi āḍitu. ī mūru viśiṣṭa nāṭakagaḻalladè prabhāmaṇi vijaya, vīrasiṃha caritrè, sadāramè, subhadrā pariṇaya mòdalāda nāṭakagaḻū ī maṃḍaḻiya nāṭakagaḻādavu. ‘saṃsāra nauka’dalli suṃdara, ‘ṣājahān’ nāṭakadalli dārā, ‘gautamabuddha’dalli gautama ī pātragaḻa abhinaya viśeṣa khyātigè pātravāgi pīr avara hèsaru kannaḍa raṃgabhūmiya itihāsadalli cirasthāyiyāyitu.
story-n5: varadācārya, rāghavara anaṃtara raṃgābhinaya kalè prakharavādudu pīr avariṃdale èṃdarè atiśayoktiyalla. kannaḍa rāghava èṃde prasiddharāda pīr avarigè 1935ralli hubbaḻḻiyalli mudavīḍu kṛṣṇarāyara netṛtvadalli nāṭya kalā duraṃdhara praśasti nīḍalāyitu.
story-n6: aidūvarè aḍi èttara, viśāla haṇè, agala kaṇṇugaḻu, ākarṣaka dhvaniya pīr avaradu saraḻa jīvana. dakṣa abhinaya hāgū dhvanipūrṇa saṃbhāṣaṇā vaikhari ivara nāṭakagaḻa jīvāḻa. abbarada saṃgīta, hāḍugaḻiṃda aneka veḻè nāṭakada oṭakkè kuṃdu baruttadè èṃbudu ivara abhiprāya. saṃgīta pradhāna nāṭakagaḻa mahatva kaḍimèyāgiddāga, janapriyatè kuṃduttiddāga, sāhitya maulyavuḻḻa gadya kṛtigaḻū abhinaya yogya èṃdu torisida kīrti pīr avarigè sallabeku.
ex-a-q1: kannaḍa rāghava èṃdu prasiddharādavaru yāru?
ex-a-q2: mahammad pīr avaru yāra āśrayadalli bèḻèdaru?
ex-a-q3: mahammad pīr avarigè nāṭakada abhiruci yāvāga hattitu?
ex-a-q4: mahammad pīr avara yāva pātragaḻu viśeṣa khyātigè pātravāgivè?
ex-a-q5: mahammad pīrravara taṃdè tāyi hèsarenu?
