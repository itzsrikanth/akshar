labels:
  story: पूरक पाठ
  exercise-A: अ. कॆळगिन प्रश्नॆगळिगॆ उत्तरिसिरि.
story-n1: नम्म कन्नड साहित्यक्कॆ सुमारु 1500 वर्षगळ इतिहासविदॆ. जनपद गीतॆ, कथॆगळु, लावणि हागू रंगभूमि कन्नड साहित्यवन्नु जनसामान्यरिगॆ मौखिकवागि तलुपिसुत्त बंदिवॆ. पुराण, इतिहास मुंताद प्रसिद्धवाद साहित्यवन्नु मनोरंजनॆय जॊतॆगॆ रवानिसुव कार्यवन्नु रंगभूमि वहिसिकॊंडिदॆ. श्रव्य दृश्य साधनवाद रंगभूमिय पात्रगळु बहु बेगनॆ जनरन्नु तलुपुत्तवॆ. रंगभूमि कलॆयन्नु उळिसि बॆळॆसुवुदरल्लि हलवारु महनीयरु तम्म जीवनवन्ने मुडुपागिरिसिद्दारॆ. अंतह महान् कलाविदरल्लि महम्मद् पीर् ऒब्बरु.
story-n2: महम्मद् पीर् कन्नड वृत्ति रंगभूमिय प्रसिद्ध नट. मैसूरिन मध्यम वर्गद कुटुंबवॊंदरल्लि जनिसिदरु. इवर तंदॆ पैल्वान् मॊहियुद्दीन्. तायि मुबारक्बि. तंदॆतायियरन्नु बाल्यदल्लियॆ कळॆदुकॊंड पीर् अवरु अनंतर सोदरमावन आश्रयदल्लि बॆळॆदरु. इवरु वॆस्लियन् मिषन् हैस्कूलिनल्लि ओदुत्तिरुवागलॆ नाटकदल्लि अभिरुचि हत्तितु. अवकाश दॊरॆतागलॆल्ला तप्पदॆ नाटकगळन्नु नोडुत्तिद्द इवर मेलॆ वरदाचार्य, कृष्णमूर्तिराव्, बळ्ळारि राघव अवर प्रभाववायितु. नाटकद गीळिनिंदागि विद्याभ्यास कुंठितगॊंडितु. 1915रल्लि मैसूरिनल्लिये इद्द गिरिधरलाल् कंपनि प्रवेशिसुव मूलक इवरु रंगभूमिगॆ पदार्पण माडिदरु.
story-n3: कृष्णलीला इवरु अभिनयिसिद मॊदल नाटक. 1920रल्लि पीर् अवरु ई संस्थॆयन्नु बिट्टु बॆंगळूरिगॆ होगि गुरुकार् कंपनि ऎंदु प्रसिद्धवागिद्द नटभयंकर गंगाधररायर ‘भारत जनमनोल्लासिनि’ नाटक कंपनिगॆ सेरिदरु. इल्लि ऎंटु वर्षगळ काल दुडिदरु. इल्लिरुवाग ‘काळिदास’दल्लि कुरुब, ‘सदारमॆ’यल्लि कळ्ळ, ‘प्रभामणि’यल्लि विरोचन, ‘सुभद्रा’दल्लि ब्राह्मण- इंतह हास्य पात्रगळु अवर पालिनदादवु. बरुबरुत्ता पीर् अवरु कंपनिय नटरागियष्टे अल्लदॆ आ कंपनिय सलहॆगाररागि, कार्यदर्शियागि, स्टेज् म्यानेजर् आगि कॊनॆगॆ कंपनिय म्यानेजर् आदरु. कॆलवु सह नटर सहकारदिंद 1932रल्लि चंद्रकला नाटक मंडळियन्नु स्थापिसिदरु.
story-n4: ऐदूवरॆ वर्षगळ काल अस्तित्वदल्लिद्द ई संस्थॆ पीर्रवर नेतृत्वदल्लि साधिसिद कलासिद्धि असामान्य. ई कंपनिय मॊदल प्रयोग द्विजेंद्रलाल्रायर ‘षाजहान’ प्रचंड जनप्रियतॆ पडॆयितु. ऒंदे नाटक ऒंबत्तु दिनगळु सतत प्रदर्शितवाद कीर्ति इदरदायितु. ऎच्.ऎल्.ऎन्.सिंह अवर ‘संसार नौकॆ’ (1932), पुट्टस्वामय्यनवर ‘गौतम बुद्ध’ (1934) मुंताद हॊस बगॆय नाटकगळन्नु ई मंडळि आडितु. ई मूरु विशिष्ट नाटकगळल्लदॆ प्रभामणि विजय, वीरसिंह चरित्रॆ, सदारमॆ, सुभद्रा परिणय मॊदलाद नाटकगळू ई मंडळिय नाटकगळादवु. ‘संसार नौक’दल्लि सुंदर, ‘षाजहान्’ नाटकदल्लि दारा, ‘गौतमबुद्ध’दल्लि गौतम ई पात्रगळ अभिनय विशेष ख्यातिगॆ पात्रवागि पीर् अवर हॆसरु कन्नड रंगभूमिय इतिहासदल्लि चिरस्थायियायितु.
story-n5: वरदाचार्य, राघवर अनंतर रंगाभिनय कलॆ प्रखरवादुदु पीर् अवरिंदले ऎंदरॆ अतिशयोक्तियल्ल. कन्नड राघव ऎंदे प्रसिद्धराद पीर् अवरिगॆ 1935रल्लि हुब्बळ्ळियल्लि मुदवीडु कृष्णरायर नेतृत्वदल्लि नाट्य कला दुरंधर प्रशस्ति नीडलायितु.
story-n6: ऐदूवरॆ अडि ऎत्तर, विशाल हणॆ, अगल कण्णुगळु, आकर्षक ध्वनिय पीर् अवरदु सरळ जीवन. दक्ष अभिनय हागू ध्वनिपूर्ण संभाषणा वैखरि इवर नाटकगळ जीवाळ. अब्बरद संगीत, हाडुगळिंद अनेक वेळॆ नाटकद ओटक्कॆ कुंदु बरुत्तदॆ ऎंबुदु इवर अभिप्राय. संगीत प्रधान नाटकगळ महत्व कडिमॆयागिद्दाग, जनप्रियतॆ कुंदुत्तिद्दाग, साहित्य मौल्यवुळ्ळ गद्य कृतिगळू अभिनय योग्य ऎंदु तोरिसिद कीर्ति पीर् अवरिगॆ सल्लबेकु.
ex-a-q1: कन्नड राघव ऎंदु प्रसिद्धरादवरु यारु?
ex-a-q2: महम्मद् पीर् अवरु यार आश्रयदल्लि बॆळॆदरु?
ex-a-q3: महम्मद् पीर् अवरिगॆ नाटकद अभिरुचि यावाग हत्तितु?
ex-a-q4: महम्मद् पीर् अवर याव पात्रगळु विशेष ख्यातिगॆ पात्रवागिवॆ?
ex-a-q5: महम्मद् पीर्रवर तंदॆ तायि हॆसरेनु?
