labels:
  story: ಪೂರಕ ಪಾಠ
  exercise-A: ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿರಿ.
segments:
- id: story-n1
  type: prose
  text: ನಮ್ಮ ಕನ್ನಡ ಸಾಹಿತ್ಯಕ್ಕೆ ಸುಮಾರು 1500 ವರ್ಷಗಳ ಇತಿಹಾಸವಿದೆ. ಜನಪದ ಗೀತೆ, ಕಥೆಗಳು, ಲಾವಣಿ ಹಾಗೂ ರಂಗಭೂಮಿ ಕನ್ನಡ ಸಾಹಿತ್ಯವನ್ನು ಜನಸಾಮಾನ್ಯರಿಗೆ ಮೌಖಿಕವಾಗಿ ತಲುಪಿಸುತ್ತ ಬಂದಿವೆ. ಪುರಾಣ, ಇತಿಹಾಸ ಮುಂತಾದ ಪ್ರಸಿದ್ಧವಾದ ಸಾಹಿತ್ಯವನ್ನು ಮನೋರಂಜನೆಯ ಜೊತೆಗೆ ರವಾನಿಸುವ ಕಾರ್ಯವನ್ನು ರಂಗಭೂಮಿ ವಹಿಸಿಕೊಂಡಿದೆ. ಶ್ರವ್ಯ ದೃಶ್ಯ ಸಾಧನವಾದ ರಂಗಭೂಮಿಯ ಪಾತ್ರಗಳು ಬಹು ಬೇಗನೆ ಜನರನ್ನು ತಲುಪುತ್ತವೆ. ರಂಗಭೂಮಿ ಕಲೆಯನ್ನು ಉಳಿಸಿ ಬೆಳೆಸುವುದರಲ್ಲಿ ಹಲವಾರು ಮಹನೀಯರು ತಮ್ಮ ಜೀವನವನ್ನೇ ಮುಡುಪಾಗಿರಿಸಿದ್ದಾರೆ. ಅಂತಹ ಮಹಾನ್ ಕಲಾವಿದರಲ್ಲಿ ಮಹಮ್ಮದ್ ಪೀರ್ ಒಬ್ಬರು.
  section: story
- id: story-n2
  type: prose
  text: ಮಹಮ್ಮದ್ ಪೀರ್ ಕನ್ನಡ ವೃತ್ತಿ ರಂಗಭೂಮಿಯ ಪ್ರಸಿದ್ಧ ನಟ. ಮೈಸೂರಿನ ಮಧ್ಯಮ ವರ್ಗದ ಕುಟುಂಬವೊಂದರಲ್ಲಿ ಜನಿಸಿದರು. ಇವರ ತಂದೆ ಪೈಲ್ವಾನ್ ಮೊಹಿಯುದ್ದೀನ್. ತಾಯಿ ಮುಬಾರಕ್ಬಿ. ತಂದೆತಾಯಿಯರನ್ನು ಬಾಲ್ಯದಲ್ಲಿಯೆ ಕಳೆದುಕೊಂಡ ಪೀರ್ ಅವರು ಅನಂತರ ಸೋದರಮಾವನ ಆಶ್ರಯದಲ್ಲಿ ಬೆಳೆದರು. ಇವರು ವೆಸ್ಲಿಯನ್ ಮಿಷನ್ ಹೈಸ್ಕೂಲಿನಲ್ಲಿ ಓದುತ್ತಿರುವಾಗಲೆ ನಾಟಕದಲ್ಲಿ ಅಭಿರುಚಿ ಹತ್ತಿತು. ಅವಕಾಶ ದೊರೆತಾಗಲೆಲ್ಲಾ ತಪ್ಪದೆ ನಾಟಕಗಳನ್ನು ನೋಡುತ್ತಿದ್ದ ಇವರ ಮೇಲೆ ವರದಾಚಾರ್ಯ, ಕೃಷ್ಣಮೂರ್ತಿರಾವ್, ಬಳ್ಳಾರಿ ರಾಘವ ಅವರ ಪ್ರಭಾವವಾಯಿತು. ನಾಟಕದ ಗೀಳಿನಿಂದಾಗಿ ವಿದ್ಯಾಭ್ಯಾಸ ಕುಂಠಿತಗೊಂಡಿತು. 1915ರಲ್ಲಿ ಮೈಸೂರಿನಲ್ಲಿಯೇ ಇದ್ದ ಗಿರಿಧರಲಾಲ್ ಕಂಪನಿ ಪ್ರವೇಶಿಸುವ ಮೂಲಕ ಇವರು ರಂಗಭೂಮಿಗೆ ಪದಾರ್ಪಣ ಮಾಡಿದರು.
  section: story
- id: story-n3
  type: prose
  text: ಕೃಷ್ಣಲೀಲಾ ಇವರು ಅಭಿನಯಿಸಿದ ಮೊದಲ ನಾಟಕ. 1920ರಲ್ಲಿ ಪೀರ್ ಅವರು ಈ ಸಂಸ್ಥೆಯನ್ನು ಬಿಟ್ಟು ಬೆಂಗಳೂರಿಗೆ ಹೋಗಿ ಗುರುಕಾರ್ ಕಂಪನಿ ಎಂದು ಪ್ರಸಿದ್ಧವಾಗಿದ್ದ ನಟಭಯಂಕರ ಗಂಗಾಧರರಾಯರ ‘ಭಾರತ ಜನಮನೋಲ್ಲಾಸಿನಿ’ ನಾಟಕ ಕಂಪನಿಗೆ ಸೇರಿದರು. ಇಲ್ಲಿ ಎಂಟು ವರ್ಷಗಳ ಕಾಲ ದುಡಿದರು. ಇಲ್ಲಿರುವಾಗ ‘ಕಾಳಿದಾಸ’ದಲ್ಲಿ ಕುರುಬ, ‘ಸದಾರಮೆ’ಯಲ್ಲಿ ಕಳ್ಳ, ‘ಪ್ರಭಾಮಣಿ’ಯಲ್ಲಿ ವಿರೋಚನ, ‘ಸುಭದ್ರಾ’ದಲ್ಲಿ ಬ್ರಾಹ್ಮಣ- ಇಂತಹ ಹಾಸ್ಯ ಪಾತ್ರಗಳು ಅವರ ಪಾಲಿನದಾದವು. ಬರುಬರುತ್ತಾ ಪೀರ್ ಅವರು ಕಂಪನಿಯ ನಟರಾಗಿಯಷ್ಟೇ ಅಲ್ಲದೆ ಆ ಕಂಪನಿಯ ಸಲಹೆಗಾರರಾಗಿ, ಕಾರ್ಯದರ್ಶಿಯಾಗಿ, ಸ್ಟೇಜ್ ಮ್ಯಾನೇಜರ್ ಆಗಿ ಕೊನೆಗೆ ಕಂಪನಿಯ ಮ್ಯಾನೇಜರ್ ಆದರು. ಕೆಲವು ಸಹ ನಟರ ಸಹಕಾರದಿಂದ 1932ರಲ್ಲಿ ಚಂದ್ರಕಲಾ ನಾಟಕ ಮಂಡಳಿಯನ್ನು ಸ್ಥಾಪಿಸಿದರು.
  section: story
- id: story-n4
  type: prose
  text: ಐದೂವರೆ ವರ್ಷಗಳ ಕಾಲ ಅಸ್ತಿತ್ವದಲ್ಲಿದ್ದ ಈ ಸಂಸ್ಥೆ ಪೀರ್ರವರ ನೇತೃತ್ವದಲ್ಲಿ ಸಾಧಿಸಿದ ಕಲಾಸಿದ್ಧಿ ಅಸಾಮಾನ್ಯ. ಈ ಕಂಪನಿಯ ಮೊದಲ ಪ್ರಯೋಗ ದ್ವಿಜೇಂದ್ರಲಾಲ್ರಾಯರ ‘ಷಾಜಹಾನ’ ಪ್ರಚಂಡ ಜನಪ್ರಿಯತೆ ಪಡೆಯಿತು. ಒಂದೇ ನಾಟಕ ಒಂಬತ್ತು ದಿನಗಳು ಸತತ ಪ್ರದರ್ಶಿತವಾದ ಕೀರ್ತಿ ಇದರದಾಯಿತು. ಎಚ್.ಎಲ್.ಎನ್.ಸಿಂಹ ಅವರ ‘ಸಂಸಾರ ನೌಕೆ’ (1932), ಪುಟ್ಟಸ್ವಾಮಯ್ಯನವರ ‘ಗೌತಮ ಬುದ್ಧ’ (1934) ಮುಂತಾದ ಹೊಸ ಬಗೆಯ ನಾಟಕಗಳನ್ನು ಈ ಮಂಡಳಿ ಆಡಿತು. ಈ ಮೂರು ವಿಶಿಷ್ಟ ನಾಟಕಗಳಲ್ಲದೆ ಪ್ರಭಾಮಣಿ ವಿಜಯ, ವೀರಸಿಂಹ ಚರಿತ್ರೆ, ಸದಾರಮೆ, ಸುಭದ್ರಾ ಪರಿಣಯ ಮೊದಲಾದ ನಾಟಕಗಳೂ ಈ ಮಂಡಳಿಯ ನಾಟಕಗಳಾದವು. ‘ಸಂಸಾರ ನೌಕ’ದಲ್ಲಿ ಸುಂದರ, ‘ಷಾಜಹಾನ್’ ನಾಟಕದಲ್ಲಿ ದಾರಾ, ‘ಗೌತಮಬುದ್ಧ’ದಲ್ಲಿ ಗೌತಮ ಈ ಪಾತ್ರಗಳ ಅಭಿನಯ ವಿಶೇಷ ಖ್ಯಾತಿಗೆ ಪಾತ್ರವಾಗಿ ಪೀರ್ ಅವರ ಹೆಸರು ಕನ್ನಡ ರಂಗಭೂಮಿಯ ಇತಿಹಾಸದಲ್ಲಿ ಚಿರಸ್ಥಾಯಿಯಾಯಿತು.
  section: story
- id: story-n5
  type: prose
  text: ವರದಾಚಾರ್ಯ, ರಾಘವರ ಅನಂತರ ರಂಗಾಭಿನಯ ಕಲೆ ಪ್ರಖರವಾದುದು ಪೀರ್ ಅವರಿಂದಲೇ ಎಂದರೆ ಅತಿಶಯೋಕ್ತಿಯಲ್ಲ. ಕನ್ನಡ ರಾಘವ ಎಂದೇ ಪ್ರಸಿದ್ಧರಾದ ಪೀರ್ ಅವರಿಗೆ 1935ರಲ್ಲಿ ಹುಬ್ಬಳ್ಳಿಯಲ್ಲಿ ಮುದವೀಡು ಕೃಷ್ಣರಾಯರ ನೇತೃತ್ವದಲ್ಲಿ ನಾಟ್ಯ ಕಲಾ ದುರಂಧರ ಪ್ರಶಸ್ತಿ ನೀಡಲಾಯಿತು.
  section: story
- id: story-n6
  type: prose
  text: ಐದೂವರೆ ಅಡಿ ಎತ್ತರ, ವಿಶಾಲ ಹಣೆ, ಅಗಲ ಕಣ್ಣುಗಳು, ಆಕರ್ಷಕ ಧ್ವನಿಯ ಪೀರ್ ಅವರದು ಸರಳ ಜೀವನ. ದಕ್ಷ ಅಭಿನಯ ಹಾಗೂ ಧ್ವನಿಪೂರ್ಣ ಸಂಭಾಷಣಾ ವೈಖರಿ ಇವರ ನಾಟಕಗಳ ಜೀವಾಳ. ಅಬ್ಬರದ ಸಂಗೀತ, ಹಾಡುಗಳಿಂದ ಅನೇಕ ವೇಳೆ ನಾಟಕದ ಓಟಕ್ಕೆ ಕುಂದು ಬರುತ್ತದೆ ಎಂಬುದು ಇವರ ಅಭಿಪ್ರಾಯ. ಸಂಗೀತ ಪ್ರಧಾನ ನಾಟಕಗಳ ಮಹತ್ವ ಕಡಿಮೆಯಾಗಿದ್ದಾಗ, ಜನಪ್ರಿಯತೆ ಕುಂದುತ್ತಿದ್ದಾಗ, ಸಾಹಿತ್ಯ ಮೌಲ್ಯವುಳ್ಳ ಗದ್ಯ ಕೃತಿಗಳೂ ಅಭಿನಯ ಯೋಗ್ಯ ಎಂದು ತೋರಿಸಿದ ಕೀರ್ತಿ ಪೀರ್ ಅವರಿಗೆ ಸಲ್ಲಬೇಕು.
  section: story
- id: ex-a-q1
  type: question
  text: ಕನ್ನಡ ರಾಘವ ಎಂದು ಪ್ರಸಿದ್ಧರಾದವರು ಯಾರು?
  section: exercise-A
  exercise: A
- id: ex-a-q2
  type: question
  text: ಮಹಮ್ಮದ್ ಪೀರ್ ಅವರು ಯಾರ ಆಶ್ರಯದಲ್ಲಿ ಬೆಳೆದರು?
  section: exercise-A
  exercise: A
- id: ex-a-q3
  type: question
  text: ಮಹಮ್ಮದ್ ಪೀರ್ ಅವರಿಗೆ ನಾಟಕದ ಅಭಿರುಚಿ ಯಾವಾಗ ಹತ್ತಿತು?
  section: exercise-A
  exercise: A
- id: ex-a-q4
  type: question
  text: ಮಹಮ್ಮದ್ ಪೀರ್ ಅವರ ಯಾವ ಪಾತ್ರಗಳು ವಿಶೇಷ ಖ್ಯಾತಿಗೆ ಪಾತ್ರವಾಗಿವೆ?
  section: exercise-A
  exercise: A
- id: ex-a-q5
  type: question
  text: ಮಹಮ್ಮದ್ ಪೀರ್ರವರ ತಂದೆ ತಾಯಿ ಹೆಸರೇನು?
  section: exercise-A
  exercise: A
