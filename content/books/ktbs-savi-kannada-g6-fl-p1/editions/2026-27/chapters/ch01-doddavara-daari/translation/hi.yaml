intro-1: हर किसी के जीवन में कई अविस्मरणीय घटनाएँ घटती हैं। उनका फल कभी मीठा, कभी कड़वा। कुछ घटनाओं ने दूसरों को अनुभव और जीवन के पाठ सिखाए। उससे मनुष्य सचेत भी हुआ। दार्शनिकों के जीवन की घटनाएँ दूसरों को प्रकाश देने वाले दीप बनती हैं। ऐसे लोगों के जीवन की घटनाओं को अपने जीवन की प्रकाश-किरण बनाना—यही यहाँ का आशय है।
rp-1: डॉ. राजेंद्र प्रसाद भारत के प्रथम राष्ट्रपति थे। सर्वोच्च पद पर पहुँचकर भी सरल जीवन जिया। जनक महाराज की तरह ऋषि-सदृश जीवन। क्रोध दबा सकते थे। जीवन में अनुशासन, संयम, समयपालन को बहुत महत्व देते थे। स्वयं को जनसेवक कहते थे।
rp-2: एक दिन दफ्तर का काम पूरा कर घर आए तो देखा एक पुस्तक के कई पृष्ठ फटे बिखरे पड़े हैं। बच्चों का काम है—समझने में देर नहीं लगी। बच्चों को अपनी गलती का बोध हो—यह चाहा। पर उन्हें अपराधी बनाने को मन नहीं माना। एक उपाय सोचा।
rp-3: प्रसाद मुँह-हाथ-पैर धोकर आए। धीरे-धीरे कमरे में बिखरे पृष्ठ एक-एक उठा मेज पर रखे। फिर बच्चों को पास बुलाया। बच्चे दौड़कर आए। राजेंद्र प्रसाद बोले, «बच्चो, देखो यहाँ कितने कागज फटे हैं। ये सब पुस्तक के पृष्ठ हैं। तुममें जिसने जितने पृष्ठ फाड़े—उतने सिक्के दूँगा। ठीक?»
rp-4: बच्चे एक-दूसरे के मुँह देखने लगे। सिक्के मिलेंगे—इस खुशी में एक-एक ने बताए कितने पृष्ठ फाड़े। प्रसाद ने उतने सिक्के दिए। लड़कों को खुशी ही खुशी! तब प्रसाद बोले, «देखो बच्चो, पुस्तकें ज्ञान का भंडार। समझ बढ़ाने के स्रोत। पृष्ठ फाड़ना अच्छी आदत नहीं। समझे?»
rp-5: बच्चों को गलती का बोध हुआ। सबने राजेंद्र से प्रतिज्ञा की, «दादा, आगे कभी पुस्तक के पृष्ठ नहीं फाड़ेंगे। संभालकर रखेंगे।» प्रसाद संतुष्ट हुए। बच्चों में अपराधी भाव नहीं जगा। बड़े लोग ऐसे ही होते हैं। क्रोध, असहिष्णुता, धैर्य खोना—सब उनसे दूर। प्रगति का राज यही है।
zh-1: डॉ. जाकिर हुसैन ने भारतीय शिक्षा के विकास और सुधार पर कई पुस्तकें लिखीं। स्वतंत्रता के बाद बिहार के राज्यपाल, भारत के उपराष्ट्रपति, फिर राष्ट्रपति बने। कुछ समय अलीगढ़ मुस्लिम विश्वविद्यालय के कुलपति भी रहे। शिक्षा उनका प्रमुख कार्यक्षेत्र था।
zh-2: दिल्ली का जामिया मिलिया विश्वविद्यालय उच्च शिक्षा के लिए प्रसिद्ध। उसके संस्थापक डॉ. जाकिर हुसैन। जीवन का बड़ा भाग वहीं बीता कहा जा सकता है। वहाँ की एक घटना बहुत रोचक है।
zh-3: डॉ. जाकिर हुसैन अनुशासन और स्वच्छता को अपार महत्व देते थे। सब विद्यार्थी प्रतिदिन साफ कपड़े पहनकर और जूते चमकदार पॉलिश कर कॉलेज आएँ—यह कहते। पर कई विद्यार्थी ठीक से नहीं मानते थे। इससे अनुशासन टूटेगा—हुसैन का मत। सिखाने के लिए स्वयं राह निकाली।
zh-4: एक दिन विश्वविद्यालय के प्रवेश द्वार पर जाकिर हुसैन जूता-पॉलिश वाले के वेश में बैठे दिखे। हाथ में पॉलिश डिब्बा और ब्रश लिए कुलपति को देख विद्यार्थी अपनी चाल से शर्मिंदा हुए। कुछ ने पॉलिश भी करवाई।
zh-5: उस दिन से विद्यार्थी साफ कपड़े और पॉलिश किए जूतों से कॉलेज आने लगे। इससे जीवन में अनुशासन बढ़ने में मदद मिली।
zh-6: «अनुशासन अपनाओ»—यह जाकिर हुसैन का आदेश था।
author-1: बे.गो. रमेश का जन्म 22 अगस्त 1945 को मैसूर जिले के कृष्णराजनगर तालुक के दोड्डहनसोगे ग्राम में हुआ। पिता बी.एस. गोविंदराजु, माता राधम्मा।
author-2: रमेश बी.ई. स्नातक होकर कर्नाटक विद्युत निगम में कार्यकारी अभियंता रहे और सेवानिवृत्त हैं। प्रवृत्ति से साहित्यकार, उत्तम भाषांतरकार और गमकी भी हैं। लगभग पाँच सौ पुस्तकें रचीं। जीवनी और व्यक्ति-चित्र लेखन में सिद्धहस्त।
author-3: ‘शांतिप्रिय’ अंकित से रचे छह सौ वचन संग्रह ‘वचनसागर’ को वचन साहित्य अकादमी पुरस्कार मिला। सर एम.वी. पुरस्कार आदि मिले।
author-4: प्रस्तुत पाठ उनके “प्रसिद्ध व्यक्तियों के जीवन में एक घटना” कृति से चुना गया है।
ex-a-q1: बच्चों को अपनी _______________ का बोध हो—यह चाहा।
ex-a-q2: प्रसाद ने सबको उतने ___________ दिए।
ex-a-q3: विद्यार्थियों को सिखाने के लिए स्वयं एक __________ निकाली।
ex-a-q4: कुछ ने ______________ भी करवाई।
ex-c-q1: राजेंद्र प्रसाद स्वयं को किसके सेवक कहते थे?
ex-c-q2: पुस्तक के पृष्ठ फाड़ने वाले बच्चों को प्रसाद ने क्या दिया?
ex-c-q3: प्रसाद ने बच्चों से क्या अच्छी आदत नहीं कहा?
ex-c-q4: जामिया मिलिया कहाँ है?
ex-c-q5: जाकिर हुसैन ने विद्यार्थियों को सिखाने के लिए कौन सा वेश लिया?
ex-e-q1: राजेंद्र प्रसाद के व्यक्तित्व का वर्णन कीजिए।
ex-e-q2: विद्यार्थियों को सिखाने के लिए जाकिर हुसैन ने क्या किया?
