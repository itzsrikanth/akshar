intro-1: In everyone’s life many unforgettable events take place. Their fruit is sometimes sweet, sometimes bitter. Some events have taught others much experience and life lessons. From that, people have also become alert. Events in the lives of visionaries become lamps that give light to others. The hope here is that we should make the events in such people’s lives into rays of light for our own lives.
rp-1: Dr Rajendra Prasad was the first President of India. Even after rising to the highest position he lived a simple life. Like King Janaka, his was a sage-like life. He could restrain anger. In life he gave great importance to discipline, self-control and punctuality. He used to call himself a servant of the people.
rp-2: One day, finishing office work and coming home, Rajendra Prasad saw that many pages of one of his books were torn and scattered here and there. It did not take him long to realize this was children’s work. He felt the children should become aware of their mistake. But his heart would not agree to make those children into culprits. He devised a plan.
rp-3: Prasad washed his face and hands and feet and came. Slowly he picked up one by one the book pages that had fallen torn in the room and placed them on the table. Then he called all the children near. The children came running. Rajendra Prasad said, “Children, look how many papers are torn here. These are all book pages. Whoever among you has torn however many pages—I will give you coins according to the number of those pages. Is that all right?”
rp-4: The children looked at one another’s faces. One by one, happy that they would get coins, they told how many pages they had torn. Prasad gave each of them that many coins. The boys were overjoyed! Then Prasad said, “Look, children, books are storehouses of knowledge. They are sources that increase our understanding. Tearing book pages is not a good habit. Understood?” he told the children so they would understand.
rp-5: The children realized their mistake. They all promised Rajendra, “Grandfather, from now on we will never tear book pages. We will take care of them.” Prasad was satisfied. A sense of guilt did not arise in the children. Great people are like that. Anger, intolerance, losing patience—all these are far from them. That is the secret of progress.
zh-1: Dr Zakir Hussain wrote many books on the development and reform of Indian education. After India gained independence he served as Governor of Bihar, as Vice-President of India, and later as President. For some time he was also Vice-Chancellor of Aligarh Muslim University. Education was his main field of work.
zh-2: Jamia Millia University in Delhi is an institution famous for higher education. Its founder was Dr Zakir Hussain. One may say he spent a large part of his life at that university. One incident there is very interesting.
zh-3: Dr Zakir Hussain gave immense importance to discipline and cleanliness. He used to say that all students should come to college every day wearing clean clothes and with their shoes well polished. But many students were not properly following what Zakir Hussain said. Hussain felt this would damage discipline. To teach the students a lesson he himself found a way.
zh-4: One day at the university entrance Zakir Hussain sitting in the guise of a shoe-polish man came to the students’ notice. Seeing the Vice-Chancellor sitting with a polish tin and brush in hand, the students felt ashamed of their conduct. A few even had their shoes polished.
zh-5: From that day students began coming to college neatly dressed with polished shoes. This helped grow discipline in the students’ lives.
zh-6: “Cultivate discipline”—this was Zakir Hussain’s order.
author-1: Be. Go. Ramesh was born on 22 August 1945 in Doddahanasoge village, Krishnarajanagara taluk, Mysore district. Father B.S. Govindaraju, mother Radhamma.
author-2: Ramesh, a B.E. graduate, served as an executive engineer in the Karnataka Electricity Board and has retired. By inclination a writer, he is also a fine translator and gamaki. He has served as president of the Karnataka Gamaka Kala Parishat and has composed about five hundred books in various literary forms in Kannada. He is skilled at writing biographies and character sketches. Notable works include biographies of world-famous women, our gamakis, the three jewel-poets of Kannada, and scientists and patriots.
author-3: The collection of six hundred vachanas he composed under the pen-name ‘Shantipriya’, ‘Vachanasagara’, received the Vachana Sahitya Academy award. Awards such as the Sir M.V. award and the Deputy Channabasappa state award have come to him.
author-4: The present lesson is selected from his work “An Event in the Lives of Famous People.”
