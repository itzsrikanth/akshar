intro-1: प्रतियॊब्बर जीवनदल्लियू हलवारु मरॆयलागद घटनॆगळु नडॆयुत्तवॆ. अवुगळ फल ऒम्मॆ सिहि, मत्तॊम्मॆ कहि. कॆलवु घटनॆगळु इतररिगॆ ऎष्टो अनुभव, जीवन पाठगळन्नु कलिसिद्दिवॆ. अदरिंद मनुष्य ऎच्चरवादद्दू इदॆ. दार्शनिकर जीवनदल्लि नडॆद घटनॆगळु दारिदीपगळागि इतररिगॆ बॆळकु नीडुत्तवॆ. अंथवर जीवनदल्लिन घटनॆगळन्नु नम्म जीवनद बॆळकिन किरणगळन्नागिसिकॊळ्ळबेकॆंबुदु इल्लिन आशयवागिदॆ.
rp-1: डा. राजेंद्र प्रसादरु भारतद प्रथम राष्ट्रपतिगळु. अत्यंत उन्नत स्थानक्केरिदरू सरळ जीवन नडॆसिदवरु. जनक महाराजनंतॆ अवरदु ऋषिसदृश जीवन. अवरु कोपवन्नु हत्तिक्कबल्लवरागिद्दरु. बाळिनल्लि शिस्तु, संयम, समयपालनॆ इवुगळिगॆ भारि महत्व नीडुत्तिद्दरु. तावु जनर सेवक ऎंदु हेळिकॊळ्ळुत्तिद्दरु.
rp-2: ऒंदु दिन कचेरिय कॆलस मुगिसि राजेंद्र प्रसादरु मनॆगॆ बंदाग अवर ऒंदु पुस्तकद हलवु पुटगळु अल्लल्लि चॆल्लापिल्लियागि हरिदु बिद्दिरुवुदन्नु नोडिदरु. इदॆल्ल मक्कळ कॆलस ऎंबुदु अवरिगॆ हॊळॆयलु हॆच्चु वेळॆ बेकागलिल्ल. मक्कळिगॆ तम्म तप्पिन अरिवागबेकु ऎंदॆनिसितु. आदरॆ आ मक्कळन्नु अपराधिगळागिसलु अवर मन ऒप्पलिल्ल. ऒंदु उपाय हूडिदरु.
rp-3: प्रसादरु मुख कैकालु तॊळॆदु बंदरु. निधानवागि कोणॆयल्लि हरिदु बिद्दिद्द पुस्तकद पुटगळन्नु ऒंदॊंदागि ऎत्ति मेजिन मेलिट्टरु. बळिक मक्कळन्नॆल्ल बळिगॆ करॆदरु. मक्कळु ओडोडि बंदरु. राजेंद्र प्रसादरु “मक्कळे, नोडि इल्लि ऎष्टॊंदु कागदगळु हरिदु होगिवॆ. इवॆल्ल पुस्तकद पुटगळु. निम्मल्लि यारु यारु ऎष्टॆष्टु पुटगळन्नु हरिदिद्दीरॊ अवरिगॆ आ पुटगळ संख्यॆगनुगुणवागि कासु कॊडुत्तेनॆ. आगबहुदॆ?” ऎंदरु.
rp-4: मक्कळु ऒब्बर मुख ऒब्बरु नोडिकॊंडरु. ऒब्बॊब्बरु कासु सिगुवुदल्ल ऎंब संतोषदिंद तावु हरिद पुटगळ संख्यॆयन्नु तिळिसिदरु. प्रसादरु अवरिगॆल्ल अष्टष्टु कासु कॊट्टरु. हुडुगरिगॆ खुषियो खुषि! आग प्रसादरु “नोडि मक्कळे, पुस्तकगळु ज्ञान भंडार. नम्म तिळिवळिकॆयन्नु हॆच्चिसुव आकरगळु. पुस्तकद पुटगळन्नु हरिदु हाकुवुदु ऒळ्ळॆय अभ्यासवल्ल. तिळियितॆ?” ऎंदु मक्कळिगॆ तिळियुवंतॆ हेळिदरु.
rp-5: मक्कळिगॆ तम्म तप्पिन अरिवायितु. अवरॆल्ल राजेंद्ररिगॆ, “ताता नावु इन्नु मुंदॆ ऎंदू पुस्तकगळ पुटगळन्नु हरियुवुदिल्ल. जोपान माडुत्तेवॆ” ऎंदु प्रमाणमाडि हेळिदरु. प्रसादरिगॆ समाधानवायितु. मक्कळल्लि अपराधि मनोभाव मूडलिल्ल. दॊड्ड व्यक्तिगळे हागॆ. कोप, असहनॆ, ताळ्मॆगॆडुवुदु इवॆल्ल अवरिंद दूर. प्रगतिय गुट्टे अदु.
zh-1: डा. जाकिर् हुसेनरु भारतीय शिक्षणद अभिवृद्धि हागू सुधारणॆ कुरितंतॆ हलवु पुस्तकगळन्नु बरॆदवरु. भारतक्कॆ स्वातंत्र्य बंद बळिक बिहारद राज्यपालरागि, भारतद उपराष्ट्रपतिगळागि, अनंतर राष्ट्रपतिगळागि दुडिदवरु. कॆलकाल अलिगढ मुस्लिं विश्वविद्यालयद कुलपतिगळू आगिद्दरु. शिक्षण अवर प्रमुख कार्यक्षेत्रवागित्तु.
zh-2: दॆहलिय जामिया मिलिया विश्वविद्यालय उन्नत शिक्षणक्कॆ हॆसराद संस्थॆ. अदर स्थापकरु डा. जाकिर् हुसेनरु. अवरु तम्म जीवनद बहुभागवन्नु आ विश्वविद्यालयदल्लिये कळॆदरॆन्नबहुदु. अल्लिन ऒंदु घटनॆ तुंबा रोचकवागिदॆ.
zh-3: डा. जाकिर् हुसेनरु शिस्तु मत्तु शुचिगॆ अपार महत्व नीडुत्तिद्दरु. ऎल्ल विद्यार्थिगळू प्रतिनित्य शुचियाद बट्टॆगळन्नु धरिसि कालेजिगॆ बरबेकु हागू कालिगॆ हाकिद बूटुगळन्नु चॆन्नागि पालिश् माडिरबेकु ऎंदु हेळुत्तिद्दरु. आदरॆ ऎष्टो विद्यार्थिगळु जाकिर् हुसेनरु हेळिदुदन्नु सरियागि पालिसुत्तिरलिल्ल. इदरिंद शिस्तिगॆ भंगवागुवुदॆंदु हुसेनरु अभिप्रायपट्टरु. विद्यार्थिगळिगॆ बुद्धिकलिसलु तावे ऒंदु दारि कंडुकॊंडरु.
zh-4: ऒंदु दिन विश्वविद्यालयद प्रवेशद्वारदल्लि जाकिर् हुसेनरु ऒब्ब बूट्पालिश् हाकुववन वेषदल्लि कुळितिद्दु विद्यार्थिगळ गमनक्कॆ बंतु. कुलपतिगळु कैयल्लि पालिश् डब्बि, ब्रष् हिडिदु कुळितिद्द दृश्य कंड विद्यार्थिगळु तम्म वर्तनॆगॆ नाचिदरु. ऒंदिब्बरु पालिश् हाकिसिकॊंडू आगित्तु.
zh-5: अंदिनिंद विद्यार्थिगळु नीटागि बट्टॆ धरिसिकॊंडु, बूटुगळिगॆ पालिश् हाकिकॊंडु कालेजिगॆ बरतॊडगिदरु. इदु विद्यार्थिगळ बाळिनल्लि शिस्तु बॆळॆसिकॊळ्ळलु नॆरवायितु.
zh-6: “शिस्तु मूडिसिकॊळ्ळि” इदु जाकिर् हुसेनर आदेशवागित्तु.
author-1: बॆ. गो. रमेश् अवरु 1945र आगस्ट् 22रंदु मैसूरु जिल्लॆय कृष्णराजनगर ताल्लूकिन दॊड्डहनसोगॆ ग्रामदल्लि जनिसिदरु. तंदॆ बि.ऎस्. गोविंदराजु, तायि राधम्म.
author-2: रमेश् बि.इ. पदवीधररागि कर्नाटक विद्युत् निगमदल्लि कार्यनिर्वाहक अभियंतररागि सेवॆसल्लिसि निवृत्तरागिरुवरु. प्रवृत्तियिंद साहितिगळागिरुव इवरु उत्तम भाषांतरकाररू गमकिगळू आगिरुवरु. कर्नाटक गमक कला परिषत्तिन अध्यक्षरागि कार्यनिर्वहिसिरुवरु, कन्नडदल्लि विविध साहित्य प्रकारगळल्लि सुमारु ऐनूरु पुस्तकगळन्नु रचिसिरुवरु. जीवनचरित्रॆ, व्यक्ति चित्रगळन्नु बरॆयुवुदरल्लि सिद्धहस्तरु. विश्वविख्यात महिळॆयरु, नम्म गमकिगळु, कन्नड कविरत्नत्रयरु, विज्ञानिगळ हागू देशभक्तर जीवन चरित्रॆगळु इवर गमनार्ह कृतिगळु.
author-3: '`शांतिप्रिय'' अंकितदल्लि इवरु रचिसिद आरुनूरु वचनगळ संकलन ‘वचनसागर’ कृतिगॆ वचन साहित्य अकाडॆमिय प्रशस्ति बंदिरुत्तदॆ. सर् ऎं.वि.रवर प्रशस्ति, डॆप्युटि चन्नबसप्प राज्य प्रशस्ति मॊदलाद प्रशस्तिगळु संदिवॆ.'
author-4: प्रस्तुत पठ्यभागवन्नु इवर “प्रसिद्ध व्यक्तिगळ बाळिनल्लि ऒंदु घटनॆ” कृतियिंद आय्दुकॊळ्ळलागिदॆ.
