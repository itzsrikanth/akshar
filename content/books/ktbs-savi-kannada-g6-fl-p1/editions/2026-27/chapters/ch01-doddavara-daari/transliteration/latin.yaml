intro-1: pratiyòbbara jīvanadalliyū halavāru marèyalāgada ghaṭanègaḻu naḍèyuttavè. avugaḻa phala òmmè sihi, mattòmmè kahi. kèlavu ghaṭanègaḻu itararigè èṣṭo anubhava, jīvana pāṭhagaḻannu kalisiddivè. adariṃda manuṣya èccaravādaddū idè. dārśanikara jīvanadalli naḍèda ghaṭanègaḻu dāridīpagaḻāgi itararigè bèḻaku nīḍuttavè. aṃthavara jīvanadallina ghaṭanègaḻannu namma jīvanada bèḻakina kiraṇagaḻannāgisikòḻḻabekèṃbudu illina āśayavāgidè.
rp-1: ḍā. rājeṃdra prasādaru bhāratada prathama rāṣṭrapatigaḻu. atyaṃta unnata sthānakkeridarū saraḻa jīvana naḍèsidavaru. janaka mahārājanaṃtè avaradu ṛṣisadṛśa jīvana. avaru kopavannu hattikkaballavarāgiddaru. bāḻinalli śistu, saṃyama, samayapālanè ivugaḻigè bhāri mahatva nīḍuttiddaru. tāvu janara sevaka èṃdu heḻikòḻḻuttiddaru.
rp-2: òṃdu dina kaceriya kèlasa mugisi rājeṃdra prasādaru manègè baṃdāga avara òṃdu pustakada halavu puṭagaḻu allalli cèllāpilliyāgi haridu biddiruvudannu noḍidaru. idèlla makkaḻa kèlasa èṃbudu avarigè hòḻèyalu hèccu veḻè bekāgalilla. makkaḻigè tamma tappina arivāgabeku èṃdènisitu. ādarè ā makkaḻannu aparādhigaḻāgisalu avara mana òppalilla. òṃdu upāya hūḍidaru.
rp-3: prasādaru mukha kaikālu tòḻèdu baṃdaru. nidhānavāgi koṇèyalli haridu biddidda pustakada puṭagaḻannu òṃdòṃdāgi ètti mejina meliṭṭaru. baḻika makkaḻannèlla baḻigè karèdaru. makkaḻu oḍoḍi baṃdaru. rājeṃdra prasādaru “makkaḻe, noḍi illi èṣṭòṃdu kāgadagaḻu haridu hogivè. ivèlla pustakada puṭagaḻu. nimmalli yāru yāru èṣṭèṣṭu puṭagaḻannu harididdīrò avarigè ā puṭagaḻa saṃkhyèganuguṇavāgi kāsu kòḍuttenè. āgabahudè?” èṃdaru.
rp-4: makkaḻu òbbara mukha òbbaru noḍikòṃḍaru. òbbòbbaru kāsu siguvudalla èṃba saṃtoṣadiṃda tāvu harida puṭagaḻa saṃkhyèyannu tiḻisidaru. prasādaru avarigèlla aṣṭaṣṭu kāsu kòṭṭaru. huḍugarigè khuṣiyo khuṣi! āga prasādaru “noḍi makkaḻe, pustakagaḻu jñāna bhaṃḍāra. namma tiḻivaḻikèyannu hèccisuva ākaragaḻu. pustakada puṭagaḻannu haridu hākuvudu òḻḻèya abhyāsavalla. tiḻiyitè?” èṃdu makkaḻigè tiḻiyuvaṃtè heḻidaru.
rp-5: makkaḻigè tamma tappina arivāyitu. avarèlla rājeṃdrarigè, “tātā nāvu innu muṃdè èṃdū pustakagaḻa puṭagaḻannu hariyuvudilla. jopāna māḍuttevè” èṃdu pramāṇamāḍi heḻidaru. prasādarigè samādhānavāyitu. makkaḻalli aparādhi manobhāva mūḍalilla. dòḍḍa vyaktigaḻe hāgè. kopa, asahanè, tāḻmègèḍuvudu ivèlla avariṃda dūra. pragatiya guṭṭe adu.
zh-1: ḍā. jākir husenaru bhāratīya śikṣaṇada abhivṛddhi hāgū sudhāraṇè kuritaṃtè halavu pustakagaḻannu barèdavaru. bhāratakkè svātaṃtrya baṃda baḻika bihārada rājyapālarāgi, bhāratada uparāṣṭrapatigaḻāgi, anaṃtara rāṣṭrapatigaḻāgi duḍidavaru. kèlakāla aligaḍha musliṃ viśvavidyālayada kulapatigaḻū āgiddaru. śikṣaṇa avara pramukha kāryakṣetravāgittu.
zh-2: dèhaliya jāmiyā miliyā viśvavidyālaya unnata śikṣaṇakkè hèsarāda saṃsthè. adara sthāpakaru ḍā. jākir husenaru. avaru tamma jīvanada bahubhāgavannu ā viśvavidyālayadalliye kaḻèdarènnabahudu. allina òṃdu ghaṭanè tuṃbā rocakavāgidè.
zh-3: ḍā. jākir husenaru śistu mattu śucigè apāra mahatva nīḍuttiddaru. èlla vidyārthigaḻū pratinitya śuciyāda baṭṭègaḻannu dharisi kālejigè barabeku hāgū kāligè hākida būṭugaḻannu cènnāgi pāliś māḍirabeku èṃdu heḻuttiddaru. ādarè èṣṭo vidyārthigaḻu jākir husenaru heḻidudannu sariyāgi pālisuttiralilla. idariṃda śistigè bhaṃgavāguvudèṃdu husenaru abhiprāyapaṭṭaru. vidyārthigaḻigè buddhikalisalu tāve òṃdu dāri kaṃḍukòṃḍaru.
zh-4: òṃdu dina viśvavidyālayada praveśadvāradalli jākir husenaru òbba būṭpāliś hākuvavana veṣadalli kuḻitiddu vidyārthigaḻa gamanakkè baṃtu. kulapatigaḻu kaiyalli pāliś ḍabbi, braṣ hiḍidu kuḻitidda dṛśya kaṃḍa vidyārthigaḻu tamma vartanègè nācidaru. òṃdibbaru pāliś hākisikòṃḍū āgittu.
zh-5: aṃdiniṃda vidyārthigaḻu nīṭāgi baṭṭè dharisikòṃḍu, būṭugaḻigè pāliś hākikòṃḍu kālejigè baratòḍagidaru. idu vidyārthigaḻa bāḻinalli śistu bèḻèsikòḻḻalu nèravāyitu.
zh-6: “śistu mūḍisikòḻḻi” idu jākir husenara ādeśavāgittu.
author-1: bè. go. rameś avaru 1945ra āgasṭ 22raṃdu maisūru jillèya kṛṣṇarājanagara tāllūkina dòḍḍahanasogè grāmadalli janisidaru. taṃdè bi.ès. goviṃdarāju, tāyi rādhamma.
author-2: rameś bi.i. padavīdhararāgi karnāṭaka vidyut nigamadalli kāryanirvāhaka abhiyaṃtararāgi sevèsallisi nivṛttarāgiruvaru. pravṛttiyiṃda sāhitigaḻāgiruva ivaru uttama bhāṣāṃtarakārarū gamakigaḻū āgiruvaru. karnāṭaka gamaka kalā pariṣattina adhyakṣarāgi kāryanirvahisiruvaru, kannaḍadalli vividha sāhitya prakāragaḻalli sumāru ainūru pustakagaḻannu racisiruvaru. jīvanacaritrè, vyakti citragaḻannu barèyuvudaralli siddhahastaru. viśvavikhyāta mahiḻèyaru, namma gamakigaḻu, kannaḍa kaviratnatrayaru, vijñānigaḻa hāgū deśabhaktara jīvana caritrègaḻu ivara gamanārha kṛtigaḻu.
author-3: '`śāṃtipriya'' aṃkitadalli ivaru racisida ārunūru vacanagaḻa saṃkalana ‘vacanasāgara’ kṛtigè vacana sāhitya akāḍèmiya praśasti baṃdiruttadè. sar èṃ.vi.ravara praśasti, ḍèpyuṭi cannabasappa rājya praśasti mòdalāda praśastigaḻu saṃdivè.'
author-4: prastuta paṭhyabhāgavannu ivara “prasiddha vyaktigaḻa bāḻinalli òṃdu ghaṭanè” kṛtiyiṃda āydukòḻḻalāgidè.
