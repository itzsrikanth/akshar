labels:
  intro: ಪ್ರವೇಶ
  story: ಕಥೆ
  vocab: ಪದಗಳ ಅರ್ಥ
  notes: ವಿವರ ತಿಳಿಯಿರಿ
  exercise-A: ಅ. ಸರಿಯಾದ ಪದಗಳನ್ನು ಆಯ್ಕೆ ಮಾಡಿ ಬಿಟ್ಟ ಸ್ಥಳ ತುಂಬಿರಿ.
  exercise-B: ಆ. ಈ ಪದಗಳ ಅರ್ಥ ಬರೆಯಿರಿ.
  exercise-C: ಇ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-D: ಈ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಐದು-ಆರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿರಿ.
  exercise-E: ಉ. ಸಂದರ್ಭ ಸಹಿತ ವಿವರಿಸಿರಿ.
segments:
- id: intro-1
  type: prose
  text: ಎಷ್ಟೋ ಸಂದರ್ಭಗಳಲ್ಲಿ ನಾವು ಮಾತನಾಡುವ ಶೈಲಿ, ದೇಹದ ಹಾವಭಾವಗಳು ನಿಜವಾಗಿ ನೀಡಬೇಕಾದ ಅರ್ಥಕ್ಕಿಂತ ಭಿನ್ನವಾದ ಅರ್ಥಗಳನ್ನು ಕೊಡುವುದಿದೆ. ಮಾತಿನ ಹಿನ್ನೆಲೆಯಲ್ಲಿರುವ ನಿಜವಾದ ಅರ್ಥವನ್ನು ಗ್ರಹಿಸಬೇಕಾದರೆ ಆ ಮಾತಿನ ಅಭಿವ್ಯಕ್ತಿಯಲ್ಲಿ ಸ್ಪಷ್ಟತೆ ಇರಬೇಕು. ಹಾಗಾದಾಗ ಮಾತ್ರವೇ ಭಾಷೆಯು ಸರಿಯಾದ ರೀತಿಯಲ್ಲಿ ಸಂವಹನಗೊಳ್ಳುವುದು.
  section: intro
- id: intro-2
  type: prose
  text: ಇದೊಂದು ಜಾನಪದ ಮೂಲದಿಂದ ಆರಿಸಿಕೊಂಡು ರಚಿಸಲಾದ ಕತೆ.
  section: intro
- id: story-n1
  type: prose
  text: ಒಂದು ದಿನ ಒಬ್ಬ ರಾಜ ಒಡ್ಡೋಲಗದಲ್ಲಿದ್ದಾಗ, ಅವನ ಮಂತ್ರಿ ಗಟ್ಟಿಯಾಗಿ ಅಳುತ್ತಾ ಬಂದನು. ಅವನ ರೋದನಕ್ಕೆ ಕಾರಣವೇನೆಂದು ರಾಜ ಪ್ರಶ್ನಿಸಿದ. ಮಂತ್ರಿಯು ಸಿಂಹಾಸನವನ್ನು ಚುಂಬಿಸಿ, ಭೂಮಿಯನ್ನು ಮುಟ್ಟಿ ನಮಸ್ಕರಿಸಿ ತನ್ನ ನಾಲಗೆಯನ್ನು ಉದ್ದ ಮಾಡಿ - ‘ಮಹಾರಾಜರೇ ಗಂಧರ್ವಸೇನರು ತೀರಿಕೊಂಡರಂತೆ’ ಎಂದು ಉದ್ಗರಿಸುತ್ತಾ ಮೂರ್ಛೆ ಹೋದ. ರಾಜನು ಒಡ್ಡೋಲಗವನ್ನು ಅಲ್ಲಿಗೇ ಪರಿಸಮಾಪ್ತಿಗೊಳಿಸಿ ಕಣ್ಣೀರು ಸುರಿಸುತ್ತ ಗಂಧರ್ವಸೇನರ ಆತ್ಮಶಾಂತಿಗಾಗಿ ನಾಲ್ಕು ದಿನಗಳ ಕಾಲ ರಾಜ್ಯಾದ್ಯಂತ ಎಲ್ಲರೂ ಶೋಕಾಚರಣೆ ಮಾಡಬೇಕೆಂದು ಆಜ್ಞಾಪಿಸಿದ. ಮಂತ್ರಿಯ ಆರೈಕೆಗೆ ವೈದ್ಯರನ್ನು ಕರೆಸಿ ಉಪಚರಿಸುವಂತೆ ರಾಜಭಟರಿಗೆ ತಿಳಿಸಿ ಅಂತಃಪುರಕ್ಕೆ ಬಂದ. ರಾಜ, ಅಲ್ಲಿಯೂ ಕರುಳು ಕಿತ್ತುಬರುವಂತೆ ಅಳತೊಡಗಿದ.
  section: story
- id: story-n2
  type: prose
  text: ರಾಣಿಯರು ಅವನ ಶೋಕಕ್ಕೆ ಕಾರಣವನ್ನು ಕೇಳಿದರು. ‘ಗಂಧರ್ವಸೇನರು ತೀರಿಕೊಂಡರು’ ಎಂದು ರಾಜ ಗದ್ಗದ ಕಂಠದಿಂದ ಹೇಳಿದಾಗ, ‘ರಾಜನ ದುಃಖ ತಮ್ಮ ದುಃಖ’ ಎಂದು ಅವರು ಕೂಡ ಕರುಳು ಹಿಂಡುವಂತೆ ಎದೆ ಬಡಿದುಕೊಂಡು ಅಳಲಾರಂಭಿಸಿದರು. ಇಡೀ ಅಂತಃಪುರ ದುಃಖ ಹಾಗೂ ಗೊಂದಲದಿಂದ ತುಂಬಿತು.
  section: story
- id: story-n3
  type: prose
  text: ರಾಣಿಯ ಸೇವಕಿಯೊಬ್ಬಳಿಗೆ ಈ ಎಲ್ಲಾ ಗೊಂದಲ ಏಕೆಂದು ತಿಳಿಯಲಿಲ್ಲ. ಅವಳು, “ಮಹಾರಾಣಿಯವರೇ, ಎಲ್ಲರು ಏಕೆ ಅಳುತ್ತಿದ್ದಾರೆ?” ಎಂದು ಕೇಳಿದಳು. ರಾಣಿ ನಿಟ್ಟುಸಿರುಬಿಟ್ಟು, “ಪಾಪ! ಗಂಧರ್ವಸೇನರು ತೀರಿಕೊಂಡರಂತೆ” ಎಂದಳು. ಸೇವಕಿ ಚುರುಕು ಬುದ್ಧಿಯವಳು. ಅವಳು ಆಲೋಚನೆ ಮಾಡಿದಳು. ಈ ನಮ್ಮ ಮಹಾರಾಜರಿಗೂ ಆ ಗಂಧರ್ವಸೇನರಿಗೂ ಏನ್ ಸಂಬಂಧ? ಎಂದು ಆತಂಕದಿಂದ ರಾಣಿಯ ಬಳಿ ಕೇಳಿದಳು. ರಾಣಿ ಅದು ತನಗೆ ಗೊತ್ತಿಲ್ಲವೆಂದು ನುಡಿದು ರಾಜನ ಬಳಿಗೆ ಓಡಿಹೋಗಿ, “ಗಂಧರ್ವಸೇನರು ಯಾರು?” ಎಂದು ಕೇಳಿದಳು. ರಾಜನಿಗೂ ಗೊತ್ತಿಲ್ಲ. ಆತ ಕಣ್ ಕಣ್ ಬಿಟ್ಟು “ತಾನೆಂಥ ಮೂರ್ಖತನದ ಕೆಲಸ ಮಾಡಿದೆ” ಅಂದುಕೊಂಡು ಕೂಡಲೇ ಆಸ್ಥಾನಕ್ಕೆ ತೆರಳಿದ.
  section: story
- id: story-n4
  type: prose
  text: ಈಗಾಗಲೆ ವೈದ್ಯರ ಉಪಚಾರದಿಂದ ಸುಧಾರಿಸಿಕೊಂಡಿದ್ದ ಮಂತ್ರಿಯನ್ನು ಕರೆಸಿಕೊಂಡು, “ಮಂತ್ರಿಗಳೇ, ಯಾರು ಈ ಗಂಧರ್ವಸೇನ?” ಎಂದು ಪ್ರಶ್ನಿಸಿದ. “ಮಹಾರಾಜರೆ ದಯವಿಟ್ಟು ಕ್ಷಮಿಸಿ. ಗಂಧರ್ವಸೇನರು ಯಾರೆಂಬುದು ನನಗೂ ತಿಳಿದಿಲ್ಲ. ಆದರೆ ಪಡೆಯ ಮುಖ್ಯಸ್ಥನು ಗಂಧರ್ವಸೇನ ತೀರಿಕೊಂಡರೆಂದು ಗಟ್ಟಿಯಾಗಿ ಗಂಟಲು ಹರಿಯುವಂತೆ ಕೂಗುತ್ತಾ ಅಳುತ್ತಿರುವುದನ್ನು ಕಂಡು ನಾನೂ ಅತ್ತೆ” ಎಂದು ಮಾರ್ನುಡಿದ. ರಾಜನ ಕೋಪ ನೆತ್ತಿಗೇರಿತು. “ನೀನೊಬ್ಬ ಮೂರ್ಖ. ಕೂಡಲೆ ಹೋಗಿ ಗಂಧರ್ವಸೇನ ಯಾರೆಂದು ಪತ್ತೆ ಮಾಡಿಕೊಂಡು ಬಾ” ಎಂದ. ಮಂತ್ರಿ ರಾಜನಿಗೆ ವಂದಿಸಿ, ‘ಕೇಳಿದ ಕಿವಿ ಊರಿಗೆ ಮಾರಿ ತಂದಿತು’ ಅಂದುಕೊಂಡು ಅಲ್ಲಿಂದ ಕಾಲಿಗೆ ಬುದ್ಧಿಹೇಳಿದ.
  section: story
- id: story-n5
  type: prose
  text: ಪಡೆಯ ಮುಖ್ಯಸ್ಥನನ್ನು ಕಂಡು, “ಗಂಧರ್ವಸೇನರು ಯಾರು?” ಎಂದು ಪ್ರಶ್ನಿಸಿದ. “ಸ್ವಾಮಿ, ಅವರು ಯಾರು? ಏನಾಗಿದ್ದರು? ಎಂದು ನನಗೆ ತಿಳಿಯದು. ಆದರೆ ಅವರು ತೀರಿಕೊಂಡರೆಂದು ಸ್ವತಃ ನನ್ನ ಹೆಂಡತಿಯೇ ಅಳುತ್ತಿದ್ದಳು. ಈ ಸುದ್ದಿಯನ್ನು ನಿಮಗೆ ಹೇಳಬೇಕೆನಿಸಿತು. ಬಂದು ಹೇಳಿದೆ” ಎಂದನು. ಮಂತ್ರಿ ತಲೆಯ ಮೇಲೆ ಕೈ ಹೊತ್ತು ಕುಳಿತ. ಇರಲಿ, ಇವನ ಹೆಂಡತಿಯನ್ನು ವಿಚಾರಿಸೋಣ ಎಂದು ಇಬ್ಬರೂ ಆತನ ಮನೆಗೆ ಹೋಗಿ, “ಯಾರಮ್ಮ ಈ ಗಂಧರ್ವಸೇನ?” ಎಂದು ಕೇಳಿದರು. ಅವಳು, “ಸ್ವಾಮೀ, ಗಂಧರ್ವಸೇನರ ಪರಿಚಯ ನನಗಿಲ್ಲ. ಈ ದಿವಸ ಬೆಳಿಗ್ಗೆ ಸ್ನಾನ ಮಾಡಲಿಕ್ಕೆ ಕೆರೆಗೆ ಹೋಗಿದ್ದೆ. ಅಲ್ಲಿ ಮಡಿವಾಳ್ತಿ ತನ್ನ ಗಂಧರ್ವ ಸೇನ ಸತ್ತಿದ್ದಾನೆಂದು ಬಾಯಿ ಬಡಿದುಕೊಂಡು ಒಂದೇ ಸಮನೆ ಅಳುತ್ತಿದ್ದಳು. ಅದನ್ನು ನೋಡಿ ನಾನೂ ಅತ್ತೆ, ಗಂಡನ ಬಳಿ ಹೇಳಿದೆ” ಎಂದಳು. ಮಂತ್ರಿಗೆ ತಲೆಸುತ್ತಿದಂತಾಯ್ತು.
  section: story
- id: story-n6
  type: prose
  text: ಈ ಗಂಧರ್ವಸೇನ ಯಾರು? ತಲೆತಲೆ ಚಚ್ಚಿಕೊಂಡ. ಏನೇ ಆಗಲಿ ಎಂದುಕೊಂಡು ಅವರೆಲ್ಲರೂ ಆ ಮಡಿವಾಳ್ತಿಯ ಮನೆಗೆ ಹೋಗಿ, ‘ಗಂಧರ್ವಸೇನ ಯಾರು?’ ಎಂದು ಕೇಳಿದರು. ಅವಳು ದುಃಖಿಸತೊಡಗಿದಳು. “ಸ್ವಾಮಿ, ನನಗೆ ಅದೃಷ್ಟವಿಲ್ಲ. ಈಗಲೂ ನನ್ನ ಹೃದಯ ಅವನಿಗಾಗಿ ಮಿಡಿಯುತ್ತಿದೆ. ಗಂಧರ್ವಸೇನ ನನ್ನ ಪ್ರೀತಿಯ ಕತ್ತೆ. ನನ್ನ ಮಗನಿಗಿಂತಲೂ ಹೆಚ್ಚಾಗಿ ಅವನನ್ನು ಮುದ್ದಿನಿಂದ ಬೆಳೆಸಿದ್ದೆ. ನಮ್ಮ ಎಲ್ಲಾ ವ್ಯವಹಾರಗಳನ್ನೂ ನೋಡಿಕೊಳ್ಳುತ್ತಿದ್ದ. ಸ್ವಾಮಿ, ನಿನ್ನೆ ರಾತ್ರಿ ಕಣ್ಣು ಮುಚ್ಕೊಂಬಿಟ್ಟ. ನನ್ನ ಹೊಟ್ಟೆ ಮೇಲೆ ಕಲ್ಹಾಕ್ ಬಿಟ್ಟ” ಎಂದು ಬೊಬ್ಬಿಟ್ಟು ಅತ್ತಳು. ಇದನ್ನು ಕೇಳಿದ ಮಂತ್ರಿ, ಮುಖ್ಯಸ್ಥ, ಅವನ ಹೆಂಡತಿ ಒಬ್ಬರ ಮುಖವನ್ನು ಒಬ್ಬರು ನೋಡಿಕೊಂಡು ಅಲ್ಲಿಂದ ಕಂಬಿಕಿತ್ತರು.
  section: story
- id: story-n7
  type: prose
  text: ಮಂತ್ರಿ ಅರಮನೆಗೆ ಬಂದು ರಾಜನ ಕಾಲಿಗೆ ಬಿದ್ದು ನಿಜಾಂಶವನ್ನು ಹೇಳಿದ. “ಗಂಧರ್ವಸೇನರು ಸತ್ತರೆಂದು ನಾವೆಲ್ಲ ಶೋಕಿಸಿದೆವಲ್ಲಾ, ಅದು ಬೇರೆ ಯಾರು ಅಲ್ಲ; ಮಡಿವಾಳ್ತಿಯ ಪ್ರೀತಿಯ ಕತ್ತೆ” ಎಂದು ಹೇಳಿದ. ರಾಜ ಅವನಿಗೆ ಹಿಗ್ಗಾಮುಗ್ಗಾ ಬೈದನು. ಆದರೆ ಶಿಕ್ಷಿಸದೆ ಬಿಟ್ಟುಬಿಟ್ಟ. ಈ ಸುದ್ದಿ ಅಂತಃಪುರದ ರಾಣಿಯರ ಕಿವಿಗೂ ಮುಟ್ಟಿತು. ‘ಒಂದು ಕುರಿ ಹಳ್ಳಕ್ಕೆ ಬಿದ್ದರೆ ಎಲ್ಲಾ ಬಿದ್ದವು’ ಎನ್ನುವಂತೆ ರಾಜ ಮತ್ತು ಅವನ ಆಸ್ಥಾನಿಕರ ಮೂರ್ಖತನಕ್ಕಾಗಿ ರಾಣಿಯರು ತಮ್ಮ ಪಕ್ಕೆಲುಬುಗಳು ನೋಯುವವರೆಗೂ ನಗುತ್ತಲೇ ಇದ್ದರು.
  section: story
