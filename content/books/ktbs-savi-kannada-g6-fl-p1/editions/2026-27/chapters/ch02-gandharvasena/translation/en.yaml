intro-1: In many situations the style of our speech and body language give meanings different from the meaning we should really give. To grasp the true meaning behind speech, there must be clarity in the expression of that speech. Only then does language communicate in the right way.
intro-2: This is a story composed by selecting from a folk source.
story-n1: One day when a king was in court, his minister came weeping loudly. The king asked the cause of his weeping. The minister kissed the throne, touched the earth in salutation, stuck out his tongue long and, crying ‘Maharaja, Gandharvasena has died,’ fainted. The king ended the court then and there and, shedding tears, ordered that for four days everyone throughout the kingdom should mourn for Gandharvasena’s peace. He told the palace guards to call doctors to care for the minister and went to the inner palace. There too the king began to weep as if his guts were torn.
story-n2: The queens asked the cause of his grief. When the king said in a choked voice that Gandharvasena had died, they too, taking the king’s sorrow as their own, beat their chests and began to weep. The whole inner palace filled with sorrow and confusion.
story-n3: 'A maid of the queen did not understand why all this confusion. She asked, “Maharani, why is everyone crying?” The queen sighed, “Alas! Gandharvasena has died, it seems.” The maid was sharp-witted. She thought: what connection do our Maharaja and that Gandharvasena have? Anxiously she asked the queen. The queen said she did not know and ran to the king asking, “Who is Gandharvasena?” The king did not know either. Wide-eyed he thought “What foolishness I have done” and at once went to the court.'
story-n4: Calling the minister who had already recovered with the doctors’ care, he asked, “Minister, who is this Gandharvasena?” “Maharaja, please forgive me. I too do not know who Gandharvasena is. But seeing the army chief loudly weeping that Gandharvasena had died, I too wept,” he replied. The king’s anger rose to his head. “You are a fool. Go at once, find out who Gandharvasena is and come,” he said. The minister saluted, thought ‘the ear that heard sold it to the town,’ and fled.
story-n5: 'Meeting the army chief he asked, “Who is Gandharvasena?” “Swami, who they were, what they were—I do not know. But my own wife was weeping that they had died. I felt I should tell you this news. I came and told,” he said. The minister held his head. Let us ask this man’s wife, they thought, and both went to his house: “Who is this Gandharvasena, mother?” She said, “Swami, I have no acquaintance with Gandharvasena. This morning I had gone to the lake to bathe. There a washerwoman was weeping loudly that her Gandharva Sena had died. Seeing that I too wept and told my husband.” The minister’s head seemed to spin.'
story-n6: Who is this Gandharvasena? He racked his brains. Come what may, they all went to that washerwoman’s house and asked, “Who is Gandharvasena?” She began to grieve. “Swami, I have no luck. Even now my heart beats for him. Gandharvasena is my beloved donkey. I raised him with more affection than my son. He looked after all our work. Swami, last night he closed his eyes. He put a stone on my stomach,” she wailed. Hearing this the minister, the chief and his wife looked at one another’s faces and left stunned.
story-n7: The minister came to the palace, fell at the king’s feet and told the truth. “We all mourned that Gandharvasena had died—that was no one else; the washerwoman’s beloved donkey,” he said. The king scolded him roundly. But he left him without punishing. This news reached the queens’ ears too. As the saying goes ‘if one sheep falls in a ditch all fall,’ the queens laughed till their ribs hurt at the foolishness of the king and his courtiers.
