intro-1: कई स्थितियों में हमारी बोलने की शैली और हावभाव असल अर्थ से भिन्न अर्थ देते हैं। बात के पीछे का सच समझने के लिए अभिव्यक्ति में स्पष्टता चाहिए। तभी भाषा सही ढंग से संवाद करती है।
intro-2: यह लोक स्रोत से चुनकर रची गई कथा है।
story-n1: एक दिन राजा दरबार में थे कि मंत्री जोर-जोर से रोता आया। रोने का कारण पूछा। मंत्री सिंहासन चूम, भूमि छू नमस्कार कर जीभ लंबी करके—‘महाराज, गंधर्वसेन चल बसे’—कहकर मूर्छित हो गए। राजा ने दरबार वहीं समाप्त कर आँसू बहाते चार दिन राज्यभर शोक मनाने का आदेश दिया। मंत्री की देखभाल को वैद्य बुलाए, अंतःपुर गए। वहाँ भी राजा की तरह रोने लगे मानो कलेजा फट रहा हो।
story-n2: रानियों ने शोक का कारण पूछा। गदगद कंठ से ‘गंधर्वसेन चल बसे’ कहते ही वे भी राजा का दुख अपना मान छाती पीटकर रोने लगीं। पूरा अंतःपुर दुख और गड़बड़ी से भर गया।
story-n3: रानी की एक सेविका को यह गड़बड़ी समझ नहीं आई। उसने पूछा, «महारानी, सब क्यों रो रहे हैं?» रानी ने आह भरी, «हाय! गंधर्वसेन चल बसे।» सेविका चतुर थी। सोचा—हमारे महाराज और गंधर्वसेन का क्या नाता? घबराकर रानी से पूछा। रानी ने कहा नहीं पता और राजा के पास दौड़ी, «गंधर्वसेन कौन?» राजा को भी नहीं पता। आँखें फाड़ सोच ‘कैसी मूर्खता की’ और तुरंत दरबार गए।
story-n4: वैद्यों से सुधरे मंत्री को बुलाकर पूछा, «मंत्री, यह गंधर्वसेन कौन?» «महाराज क्षमा करें। मुझे भी नहीं पता। पर सेनापति जोर से चिल्ला-चिल्ला रो रहे थे कि गंधर्वसेन चल बसे—देखकर मैं भी रोया।» राजा का क्रोध चढ़ा। «तू मूर्ख है। अभी जा, पता लगा कौन है गंधर्वसेन।» मंत्री ने प्रणाम किया, ‘सुनी बात गाँव को बेच आई’ सोच भाग निकला।
story-n5: सेनापति से पूछा, «गंधर्वसेन कौन?» «स्वामी, कौन थे क्या थे—नहीं जानता। पर मेरी पत्नी स्वयं रो रही थी कि वे चल बसे। आपको बताना चाहा। आकर बताया।» मंत्री ने सिर पकड़ा। इसकी पत्नी से पूछें—दोनों घर गए, «यह गंधर्वसेन कौन अम्मा?» उसने कहा, «स्वामी, परिचय नहीं। आज सुबह नहाने तालाब गई थी। वहाँ धोबिन जोर से रो रही थी कि उसका गंधर्व सेन मर गया। देखकर मैं भी रोई, पति से कहा।» मंत्री का सिर घूमने लगा।
story-n6: यह गंधर्वसेन कौन? दिमाग खपाया। जो हो, सब धोबिन के घर गए, «गंधर्वसेन कौन?» वह दुखी हुई। «स्वामी, किस्मत नहीं। अब भी दिल धड़कता है। गंधर्वसेन मेरा प्यारा गधा। बेटे से अधिक लाड़ से पाला। सब काम देखता था। स्वामी, कल रात आँखें मूँद लीं। पेट पर पत्थर रख दिया।» सुन मंत्री, सेनापति और पत्नी एक-दूसरे के मुँह देख स्तब्ध निकल गए।
story-n7: मंत्री महल आकर राजा के पैर पड़े और सच कहा। «गंधर्वसेन मर गए कहकर हम सब शोक मनाए—वह और कोई नहीं; धोबिन का प्यारा गधा।» राजा ने खूब डाँटा। पर सज़ा दिए बिना छोड़ दिया। खबर रानियों तक पहुँची। ‘एक भेड़ खाई में गिरे तो सब गिरें’ की तरह राजा और दरबारियों की मूर्खता पर रानियाँ पसलियाँ दुखने तक हँसती रहीं।
