intro-1: ऎष्टो संदर्भगळल्लि नावु मातनाडुव शैलि, देहद हावभावगळु निजवागि नीडबेकाद अर्थक्किंत भिन्नवाद अर्थगळन्नु कॊडुवुदिदॆ. मातिन हिन्नॆलॆयल्लिरुव निजवाद अर्थवन्नु ग्रहिसबेकादरॆ आ मातिन अभिव्यक्तियल्लि स्पष्टतॆ इरबेकु. हागादाग मात्रवे भाषॆयु सरियाद रीतियल्लि संवहनगॊळ्ळुवुदु.
intro-2: इदॊंदु जानपद मूलदिंद आरिसिकॊंडु रचिसलाद कतॆ.
story-n1: ऒंदु दिन ऒब्ब राज ऒड्डोलगदल्लिद्दाग, अवन मंत्रि गट्टियागि अळुत्ता बंदनु. अवन रोदनक्कॆ कारणवेनॆंदु राज प्रश्निसिद. मंत्रियु सिंहासनवन्नु चुंबिसि, भूमियन्नु मुट्टि नमस्करिसि तन्न नालगॆयन्नु उद्द माडि - ‘महाराजरे गंधर्वसेनरु तीरिकॊंडरंतॆ’ ऎंदु उद्गरिसुत्ता मूर्छॆ होद. राजनु ऒड्डोलगवन्नु अल्लिगे परिसमाप्तिगॊळिसि कण्णीरु सुरिसुत्त गंधर्वसेनर आत्मशांतिगागि नाल्कु दिनगळ काल राज्याद्यंत ऎल्लरू शोकाचरणॆ माडबेकॆंदु आज्ञापिसिद. मंत्रिय आरैकॆगॆ वैद्यरन्नु करॆसि उपचरिसुवंतॆ राजभटरिगॆ तिळिसि अंतःपुरक्कॆ बंद. राज, अल्लियू करुळु कित्तुबरुवंतॆ अळतॊडगिद.
story-n2: राणियरु अवन शोकक्कॆ कारणवन्नु केळिदरु. ‘गंधर्वसेनरु तीरिकॊंडरु’ ऎंदु राज गद्गद कंठदिंद हेळिदाग, ‘राजन दुःख तम्म दुःख’ ऎंदु अवरु कूड करुळु हिंडुवंतॆ ऎदॆ बडिदुकॊंडु अळलारंभिसिदरु. इडी अंतःपुर दुःख हागू गॊंदलदिंद तुंबितु.
story-n3: राणिय सेवकियॊब्बळिगॆ ई ऎल्ला गॊंदल एकॆंदु तिळियलिल्ल. अवळु, “महाराणियवरे, ऎल्लरु एकॆ अळुत्तिद्दारॆ?” ऎंदु केळिदळु. राणि निट्टुसिरुबिट्टु, “पाप! गंधर्वसेनरु तीरिकॊंडरंतॆ” ऎंदळु. सेवकि चुरुकु बुद्धियवळु. अवळु आलोचनॆ माडिदळु. ई नम्म महाराजरिगू आ गंधर्वसेनरिगू एन् संबंध? ऎंदु आतंकदिंद राणिय बळि केळिदळु. राणि अदु तनगॆ गॊत्तिल्लवॆंदु नुडिदु राजन बळिगॆ ओडिहोगि, “गंधर्वसेनरु यारु?” ऎंदु केळिदळु. राजनिगू गॊत्तिल्ल. आत कण् कण् बिट्टु “तानॆंथ मूर्खतनद कॆलस माडिदॆ” अंदुकॊंडु कूडले आस्थानक्कॆ तॆरळिद.
story-n4: ईगागलॆ वैद्यर उपचारदिंद सुधारिसिकॊंडिद्द मंत्रियन्नु करॆसिकॊंडु, “मंत्रिगळे, यारु ई गंधर्वसेन?” ऎंदु प्रश्निसिद. “महाराजरॆ दयविट्टु क्षमिसि. गंधर्वसेनरु यारॆंबुदु ननगू तिळिदिल्ल. आदरॆ पडॆय मुख्यस्थनु गंधर्वसेन तीरिकॊंडरॆंदु गट्टियागि गंटलु हरियुवंतॆ कूगुत्ता अळुत्तिरुवुदन्नु कंडु नानू अत्तॆ” ऎंदु मार्नुडिद. राजन कोप नॆत्तिगेरितु. “नीनॊब्ब मूर्ख. कूडलॆ होगि गंधर्वसेन यारॆंदु पत्तॆ माडिकॊंडु बा” ऎंद. मंत्रि राजनिगॆ वंदिसि, ‘केळिद किवि ऊरिगॆ मारि तंदितु’ अंदुकॊंडु अल्लिंद कालिगॆ बुद्धिहेळिद.
story-n5: पडॆय मुख्यस्थनन्नु कंडु, “गंधर्वसेनरु यारु?” ऎंदु प्रश्निसिद. “स्वामि, अवरु यारु? एनागिद्दरु? ऎंदु ननगॆ तिळियदु. आदरॆ अवरु तीरिकॊंडरॆंदु स्वतः नन्न हॆंडतिये अळुत्तिद्दळु. ई सुद्दियन्नु निमगॆ हेळबेकॆनिसितु. बंदु हेळिदॆ” ऎंदनु. मंत्रि तलॆय मेलॆ कै हॊत्तु कुळित. इरलि, इवन हॆंडतियन्नु विचारिसोण ऎंदु इब्बरू आतन मनॆगॆ होगि, “यारम्म ई गंधर्वसेन?” ऎंदु केळिदरु. अवळु, “स्वामी, गंधर्वसेनर परिचय ननगिल्ल. ई दिवस बॆळिग्गॆ स्नान माडलिक्कॆ कॆरॆगॆ होगिद्दॆ. अल्लि मडिवाळ्ति तन्न गंधर्व सेन सत्तिद्दानॆंदु बायि बडिदुकॊंडु ऒंदे समनॆ अळुत्तिद्दळु. अदन्नु नोडि नानू अत्तॆ, गंडन बळि हेळिदॆ” ऎंदळु. मंत्रिगॆ तलॆसुत्तिदंताय्तु.
story-n6: ई गंधर्वसेन यारु? तलॆतलॆ चच्चिकॊंड. एने आगलि ऎंदुकॊंडु अवरॆल्लरू आ मडिवाळ्तिय मनॆगॆ होगि, ‘गंधर्वसेन यारु?’ ऎंदु केळिदरु. अवळु दुःखिसतॊडगिदळु. “स्वामि, ननगॆ अदृष्टविल्ल. ईगलू नन्न हृदय अवनिगागि मिडियुत्तिदॆ. गंधर्वसेन नन्न प्रीतिय कत्तॆ. नन्न मगनिगिंतलू हॆच्चागि अवनन्नु मुद्दिनिंद बॆळॆसिद्दॆ. नम्म ऎल्ला व्यवहारगळन्नू नोडिकॊळ्ळुत्तिद्द. स्वामि, निन्नॆ रात्रि कण्णु मुच्कॊंबिट्ट. नन्न हॊट्टॆ मेलॆ कल्हाक् बिट्ट” ऎंदु बॊब्बिट्टु अत्तळु. इदन्नु केळिद मंत्रि, मुख्यस्थ, अवन हॆंडति ऒब्बर मुखवन्नु ऒब्बरु नोडिकॊंडु अल्लिंद कंबिकित्तरु.
story-n7: मंत्रि अरमनॆगॆ बंदु राजन कालिगॆ बिद्दु निजांशवन्नु हेळिद. “गंधर्वसेनरु सत्तरॆंदु नावॆल्ल शोकिसिदॆवल्ला, अदु बेरॆ यारु अल्ल; मडिवाळ्तिय प्रीतिय कत्तॆ” ऎंदु हेळिद. राज अवनिगॆ हिग्गामुग्गा बैदनु. आदरॆ शिक्षिसदॆ बिट्टुबिट्ट. ई सुद्दि अंतःपुरद राणियर किविगू मुट्टितु. ‘ऒंदु कुरि हळ्ळक्कॆ बिद्दरॆ ऎल्ला बिद्दवु’ ऎन्नुवंतॆ राज मत्तु अवन आस्थानिकर मूर्खतनक्कागि राणियरु तम्म पक्कॆलुबुगळु नोयुववरॆगू नगुत्तले इद्दरु.
