  exercise-A: अ. कॆळगिन प्रश्नॆगळिगॆ उत्तरिसि.
  exercise-B: आ. बिट्टस्थळ तुंबिरि.
  exercise-C: इ. ई पदगळन्नु बिडिसि बरॆयिरि.
  exercise-D: ई. कॆळगिन पद्यभागवन्नु पूर्णगॊळिसि.
intro-1: मानवनिगॆ प्रकृतिये मॊदल गुरु. ऎल्लरिंदलू ऎल्लदरिंदलू मानव पाठ कलियबेकु. प्राणि, पक्षि, मर-गिडगळिंदलू कलियुव विषयगळु बहळष्टिवॆ. ‘ऎल्लरॊळगॊंदु नुडि कलितु विद्यॆय पर्वतवे आद सर्वज्ञ’ ऎन्नुव हागॆ हण्णुगळिंदलू कलियबेकाद पाठगळिवॆ. हण्णिन हागॆ बदुकु मागिदरॆ बाळु सिहियागिरुत्तदॆ ऎंब आशयद पद्यविदु.
poem-s1l1: हण्णिनंगडि मुंदॆ कण्णरळिसुव मगु
poem-s1l2: इल्लि ई तिरुवल्लि थट्टनवतरिसिद कप्पु लारिय हागॆ
poem-s1l3: गाळि कीटलॆ उगुरॊ
poem-s1l4: तुंटरॆसॆयुव कल्लो
poem-s2l1: कायियल्ले निन्न कॆडवदिरलि
poem-s2l2: हण्णिनंगडियागु नीनूनु
poem-s2l3: गिरवियंगडि गुजरिगळ धूळु हब्बिद
poem-s2l4: ऊर मारुकट्टॆय नडुवॆ
poem-s3l1: हण्णागबेकु मगु
poem-s3l2: मैयॆल्ल मागिहुण्णिन सुक्कु बरुववरॆगॆ
poem-s3l3: पक्वतन बिरिद बाळॆहण्णिदॆयल्ल
poem-s3l4: अदर हागे कॊंच बागबेकु
poem-s4l1: कॊब्बिदरॆ चकोतनॆय हागॆ
poem-s4l2: कुग्गिदरॆ निंबॆ हण्णिन हागॆ
poem-s4l3: हुळिगट्टुवुदु निन्नॊळगॆ
poem-s4l4: सरिगात्रवागि समनिसलि निन्नतन
poem-s5l1: कित्तलॆय हागॆ, मोसंबि हागॆ
poem-s5l2: रसपूरि माविन हण्णिनंतॆ
poem-s5l3: अंजूरदंतॆ अपरूपवागु जनर कण्णिगॆ;
poem-s5l4: कंडरॆ काणु कल्लंगडियागि
poem-s6l1: बेसिगॆय कमरिरुव कण्णुगळिगॆ
poem-s6l2: दळदळकॊय्दु अरळिसिद दाळिंबॆयॊळगॆ
poem-s6l3: थळथळ कॆंड बण्ण मणिमणि
poem-s6l4: हनिहनि तनिरसद खनियागु;
poem-s7l1: हब्बिको द्राक्षि बळ्ळिय हागॆ
poem-s7l2: आयुष्यॆ चप्परद उद्दगल;
poem-s7l3: तब्बिको बिडबेड;
poem-s7l4: हण्णु तॊडिसलु निनगॆ
poem-s8l1: तानॆ मण्णागुत-बरलु तोटगाति
poem-s8l2: बॆलॆय राकॆट्टु यान हॊरडदिरु
poem-s8l3: सेबु हण्णिन जॊतॆगॆ
poem-s8l4: ऎल्लरिगू दक्कुव ऎलचियागु
author-1: श्री ऎच्. ऎस्. शिवप्रकाश् अवरु 1954रल्लि बॆंगळूरिनल्लि जनिसिदरु. इंग्लिष् प्राध्यापकरागि सेवॆयन्नु सल्लिसिद्दारॆ. इवरु महाचैत्र, सुल्तान् टिप्पु, नविलु नगर, मळॆबिद्द नॆलदल्लि मॊदलाद कृतिगळन्नु रचिसिद्दारॆ. इवरिगॆ कर्नाटक नाटक अकाडॆमि प्रशस्ति, केंद्र संगीत नाटक अकाडॆमि मत्तु केंद्र साहित्य अकाडॆमि प्रशस्तिगळन्नु नीडि गौरविसलागिदॆ.
