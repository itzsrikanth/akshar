  author: कवि-कृति परिचय
  vocab: शब्दार्थ
  exercise-A: अ. प्रश्नों के उत्तर दीजिए।
  exercise-B: आ. रिक्त स्थान भरिए।
  exercise-C: इ. शब्द अलग करके लिखिए।
  exercise-D: ई. पद्य भाग पूरा कीजिए।
intro-1: मनुष्य का पहला गुरु प्रकृति है। सबसे और सब कुछ से सीखना चाहिए। पशु-पक्षी, पेड़-पौधों से भी बहुत कुछ है। ‘सबमें एक बात सीख पर्वत विद्या वाले सर्वज्ञ’ की तरह फलों से भी पाठ हैं। फल की तरह जीवन पक जाए तो जीवन मीठा—यह आशय का पद्य है।
poem-s1l1: फल की दुकान के आगे आँखें फाड़े बच्चा
poem-s1l2: इस मोड़ पर अचानक उतरी काली लॉरी की तरह
poem-s1l3: क्या हवा का छेड़ने वाला नाखून
poem-s1l4: या शैतानियों का फेंका पत्थर
poem-s2l1: कच्चे में ही न गिराया जाए
poem-s2l2: तुम भी फल की दुकान बनो
poem-s2l3: गिरवी दुकान गुजरी की धूल उड़ी
poem-s2l4: गाँव के बाज़ार के बीच
poem-s3l1: बच्चे को फल बनना चाहिए
poem-s3l2: जब तक पके फल की सिलवटें तन पर न आएँ
poem-s3l3: पकाव से फटा केला है न
poem-s3l4: वैसे ही थोड़ा झुकना चाहिए
poem-s4l1: चकोतरा की तरह मोटे हो तो
poem-s4l2: नींबू की तरह सिकुड़ें तो
poem-s4l3: अंदर खट्टापन बैठ जाता
poem-s4l4: तुम्हारा स्वभाव सम माप में हो
poem-s5l1: संतरे की तरह, मौसंबी की तरह
poem-s5l2: रसभरे आम की तरह
poem-s5l3: अंजीर की तरह दुर्लभ बनो;
poem-s5l4: दिखो तो तरबूज बनकर दिखो
poem-s6l1: गर्मी से झुलसी आँखों के लिए
poem-s6l2: दल-दल खोलकर खिलाया अनार
poem-s6l3: धधकते अंगारे रंग के मनके
poem-s6l4: बूँद-बूँद शुद्ध रस की खान बनो;
poem-s7l1: अंगूर की बेल की तरह फैल
poem-s7l2: आयुष्य की छतरी की लंबाई-चौड़ाई;
poem-s7l3: पकड़ो; मत छोड़ो;
poem-s7l4: तुम पर फल लगाने को
poem-s8l1: स्वयं मिट्टी होते समय माली आए
poem-s8l2: मँहगी रॉकेट यात्रा पर मत निकल
poem-s8l3: सेब के साथ
poem-s8l4: सबको मिलने वाली बेर बनो
author-1: श्री एच.एस. शिवप्रकाश का जन्म 1954 में बेंगलूर में हुआ। अंग्रेज़ी प्राध्यापक रहे। महाचैत्र, सुल्तान टिपू, नविलु नगर, मळे बिद्द नेलदल्लि आदि कृतियाँ लिखीं। कर्नाटक नाटक अकादमी, संगीत नाटक अकादमी और साहित्य अकादमी पुरस्कार से सम्मानित।
