poem-s7l4: अम्मा—तुम्हारा नाम
author-1: ललिता कोत्रेप्पा होसपाटी का जन्म 1964 में हुआ। पिता कोत्रेप्पा, माता नीलम्मा। वे बागलकोट जिले के हुनगुंद तालुक के हिरेबादवागी सरकारी हाईस्कूल में प्रधानाध्यापिका हैं। उन्होंने बच्चों की कविता-संग्रह और नाटक तथा कथा-संग्रह लिखे हैं।
ex-a-q1: कवयित्री माँ के चरणों में क्या लाती है?
ex-a-q2: जगत में सबसे बड़ा क्या है?
ex-a-q3: माँ बच्चे को क्या सिखाती है?
ex-a-q4: बच्चे के गिरने पर माँ कैसे लुभाती है?
ex-a-q5: माँ बच्चे को क्या पिलाती है?
