poem-s1l1: मुट्ठी भर फूल लाकर
poem-s1l2: मैं आपके कमल-चरणों पर झुकती हूँ
poem-s1l3: चरणों में झुककर फिर
poem-s1l4: केवल भाग्य माँगती हूँ
poem-s2l1: गर्भ में मांस का लोथड़ा
poem-s2l2: अ आ इ ई न जानता
poem-s2l3: जन्म लेकर धरती पर गिरते ही
poem-s2l4: गले से ‘अम्मा’ निकला
poem-s3l1: दर्द निगलकर मुझ पर विश्वास कर
poem-s3l2: तुमने दूध पिलाया
poem-s3l3: आँख के आँसू पोंछकर
poem-s3l4: छाती से लगाकर लुभाया
poem-s4l1: गिरते ही दौड़कर आईं
poem-s4l2: उठाकर लुभाया
poem-s4l3: जीतने पर खुशी तुम्हारी
poem-s4l4: गोद में लेकर घोषणा की
