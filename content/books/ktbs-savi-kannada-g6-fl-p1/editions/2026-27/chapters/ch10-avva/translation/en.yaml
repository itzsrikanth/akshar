  exercise-A: Answer the following questions.
poem-s1l1: Bringing flowers cupped in my palms
poem-s1l2: I bow to your lotus feet
poem-s1l3: Bowing at your feet again
poem-s1l4: I ask only for your blessing
poem-s2l1: A lump of flesh in the womb
poem-s2l2: not knowing a, ā, i, ī
poem-s2l3: the moment I fell to earth at birth
poem-s2l4: ‘Amma’ rose in my throat
poem-s3l1: Swallowing pain, trusting me
poem-s3l2: you fed me milk
poem-s3l3: wiping my tears
poem-s3l4: you held me to your chest and soothed me
poem-s4l1: When I fell you ran
poem-s4l2: picked me up and soothed me
poem-s4l3: when I won, joy was yours
poem-s4l4: you lifted me and proclaimed it
poem-s5l1: Teaching me learning, giving wisdom
poem-s5l2: you taught me to attain success
poem-s5l3: blessing behind my triumph
poem-s5l4: you gave your life
poem-s6l1: Money has no measure
poem-s6l2: your debt is countless.
poem-s6l3: One flower for your lotus feet
poem-s6l4: my love is limited
poem-s7l1: Before a mother’s blessing in this world
poem-s7l2: nothing is greater
poem-s7l3: protect me, mother who is a goddess of virtue
poem-s7l4: Amma—that is your name
author-1: Lalitha Kotreppa Hosapati was born in 1964. Father Kotreppa, mother Neelamma. She serves as headmistress at the government high school in Hirebadavagi, Hungund taluk, Bagalkot district. She has written children’s poetry collections such as Kalpanaligondu Edehadu and Hoo Maruva Hudugi, and children’s plays and story collections.
ex-a-q1: What does the poetess bring to her mother’s feet?
ex-a-q2: What is the greatest thing in the world?
ex-a-q3: What does the mother teach the child?
ex-a-q4: How does the mother soothe the child when it falls?
ex-a-q5: What does the mother give the child to drink?
