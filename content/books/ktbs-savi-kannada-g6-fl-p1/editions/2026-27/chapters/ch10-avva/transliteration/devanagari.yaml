author-1: ललिता कॊट्रॆप्प हॊसप्याटि 1964रल्लि जनिसिदरु. तंदॆ कॊट्रॆप्प, तायि नीलम्म. सर्कारि प्रौढशालॆ हिरेबादवाडगि, हुनगुंद ता., बागलकोटॆ जिल्लॆयल्लि मुख्योपाध्यायिनियागि कार्य निर्वहिसुत्तिद्दारॆ. इवरु कल्पनाळिगॊंदु ऎदॆहाडु, हू मारुव हुडुगि ऎंब मक्कळ कवन संकलन हागू मक्कळ नाटक मत्तु कथा संकलनगळन्नु रचिसिद्दारॆ.
ex-a-q1: कवयित्रियु तायिय पादक्कॆ एनु तरुत्ताळॆ?
ex-a-q2: जगत्तिनल्लि मिगिलादुदु यावुदु?
ex-a-q3: तायि मगुविगॆ एनन्नु कलिसुत्ताळॆ?
ex-a-q4: मगु बिद्दाग तायि हेगॆ रमिसुत्ताळॆ?
ex-a-q5: तायि मगुविगॆ एनन्नु कुडिसुत्ताळॆ?
