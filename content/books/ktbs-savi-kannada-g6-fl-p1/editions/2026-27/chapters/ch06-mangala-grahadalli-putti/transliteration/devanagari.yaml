intro-1: मक्कळ मनस्सिनल्लि कुतूहलभरित प्रश्नॆगळु हुट्टुत्तवॆ. विविध कल्पनॆगळु काणिसुत्तवॆ. हॊस हॊस कनसुगळु गूडु कट्टुत्तवॆ. मक्कळु तम्म कल्पनॆयल्लि निर्जीव वस्तुगळॊंदिगू मनबिच्चि माताडबल्लरु! अपरिचित सन्निवेशगळू सह अवर कनसुगळल्लि हत्तिरक्कॆ बंदुबिडुत्तवॆ. हीगिरुव अवर कल्पनॆगळिगॆ मत्तष्टु गरिगळन्नु कट्टि इन्नष्टु ऎत्तरक्कॆ हारलु प्रोत्साहिसि आ मूलक प्रस्तुततॆय अरिवु मूडिसुवुदु इल्लिन आशयवागिदॆ.
poem-s1l1: आगसदल्लि हारुवुदॆंदरॆ
poem-s1l2: पुटाणि पुट्टिगॆ बलु इष्ट
poem-s1l3: रॆक्कॆगळिल्लदॆ हारलु होदरॆ
poem-s1l4: आगदॆ तॊंदरॆ? इदु कष्ट.
poem-s2l1: ऒंदिन इद्दक्किद्दंतॆ
poem-s2l2: पुट्टिगॆ रॆक्कॆयु बंदित्तु.
poem-s2l3: हक्किय हागॆ हारुव मनकॆ
poem-s2l4: हॆच्चिन हरुषव तंदित्तु.
poem-s3l1: कूडलॆ पुट्टि ठण्णनॆ जिगिदु
poem-s3l2: आगसदॊडलिगॆ हारिदळु.
poem-s3l3: हारुत तेलुत मुंदकॆ सागि
poem-s3l4: चंद्रन मडिलनु सेरिदळु.
poem-s4l1: चंद्रन मेलॆ नॆट्टगॆ निंतु
poem-s4l2: भूमिय कडॆगॆ नोडिदरॆ
poem-s4l3: नेरळॆ बण्णद चॆंडिन हागॆ
poem-s4l4: कंडितु अवळिगॆ नम्म धरॆ.
poem-s5l1: चंद्रन बिट्टु मेलकॆ हारि
poem-s5l2: सेरलु मंगळनंगळव
poem-s5l3: कॆंपगॆ बणबणगुट्टुतलित्तु
poem-s5l4: काणलिल्ल यावुदॆ जीव
poem-s6l1: पुट्टियु कंडळु मंगळनल्लि
poem-s6l2: ‘योगि’ हॆसरिन हॆब्बंडॆ
poem-s6l3: ऒडनॆ केळिदळु कॆंपु बंडॆयनु
poem-s6l4: ‘नीनु हेगॆ इल्लिगॆ बंदॆ?’
poem-s7l1: बंडॆयु कण्णीरनु सुरिसुत्ता
poem-s7l2: हेळितु पुट्टिगॆ नोविनलि
poem-s7l3: ‘पुट्टिये, नम्मी मंगळ ग्रहद
poem-s7l4: दुरंत कथॆयनु केळि तिळि’
poem-s8l1: हिंदॊंदु कालदि ई ग्रहदल्लि
poem-s8l2: इत्तु जीवजल हसिरु मर
poem-s8l3: आगिन जनतॆयु नाडनु कट्टलु
poem-s8l4: मरगळ कडियॆ बंतु बर
poem-s9l1: मळॆ बॆळॆ काणदॆ जीवियु अळिदु
poem-s9l2: बंदितु नमगॆ इंथ स्थिति
poem-s9l3: ‘निम्म भूमियलि गिडमर अळिदरॆ
poem-s9l4: मुंदॆ ऒंदु दिन इदे गति’
poem-s10l1: बणबणगुट्टुव बयलनु कंडु
poem-s10l2: ढवढवगुट्टितु ऎळॆ हृदय
poem-s10l3: हसिरनु अळिसदॆ गिडमर बॆळॆसि
poem-s10l4: उळिसुवॆवॆंदळु ई धरॆय
poem-s11l1: भूमिगॆ बंदु जनतॆय कंडु
poem-s11l2: हसिरनु उळिसलु बेडिदळु
poem-s11l3: तानु कूड ऎळॆ ससिगळ नॆट्टु
poem-s11l4: बॆळॆसुत कुणि कुणिदाडिदळु.
author-1: सि.ऎं. गोविंदरॆड्डि अवरु 11-08-1958रल्लि कोलार जिल्लॆय मालूरु तालूकिन चॆन्निगरायपुर ऎंब ऊरिनल्लि जनिसिदरु. मक्कळ साहित्य रचनॆयल्लि विशेष आसक्ति हॊंदिद इवरु ‘बण्णद चिट्टॆ’, ‘मक्कळ मंदार’, ‘पद्य हेळुव मर’ मॊदलाद कृतिगळन्नु रचिसिद्दारॆ. प्रस्तुत पद्यवन्नु ‘मक्कळ मंदार’ ऎंब कृतियिंद आय्कॆमाडिकॊळ्ळलागिदॆ.
