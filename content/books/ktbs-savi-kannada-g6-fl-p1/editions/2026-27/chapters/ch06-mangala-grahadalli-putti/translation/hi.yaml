intro-1: बच्चों के मन में कौतूहल भरे प्रश्न उठते हैं। विविध कल्पनाएँ दिखती हैं। नए सपने घोंसला बनाते हैं। कल्पना में निर्जीव वस्तुओं से भी मन खोलकर बात कर सकते हैं! अपरिचित स्थितियाँ भी सपनों में पास आ जाती हैं। ऐसी कल्पनाओं को और पंख देकर ऊँचा उड़ने को प्रोत्साहित कर वर्तमान का बोध जगाना—यही आशय है।
author-1: सी.एम. गोविंदरेड्डी का जन्म 11-08-1958 को कोलार जिले के मालूर तालुक के चेन्निगरायपुर में हुआ। बाल साहित्य में विशेष रुचि; बण्णद चिट्टे, मक्कळ मंदार, पद्य हेळुव मर आदि कृतियाँ। यह पद्य ‘मक्कळ मंदार’ से लिया गया।
poem-s1l1: आकाश में उड़ना
poem-s1l2: छोटी पुट्टी को बहुत पसंद
poem-s1l3: बिना पंख उड़ने जाए तो
poem-s1l4: न हो—परेशानी? यह कठिन है।
poem-s2l1: एक दिन अचानक
poem-s2l2: पुट्टी को पंख आ गए।
poem-s2l3: चिड़िया की तरह उड़ने वाले मन को
poem-s2l4: और अधिक हर्ष मिला।
poem-s3l1: तुरंत पुट्टी ठन से कूदी
poem-s3l2: आकाश की गोद में उड़ी।
poem-s3l3: उड़ती तैरती आगे बढ़
poem-s3l4: चंद्र की गोद में पहुँची।
poem-s4l1: चंद्र पर सीधे खड़ी
poem-s4l2: धरती की ओर देखा तो
poem-s4l3: बैंगनी रंग की गेंद की तरह
poem-s4l4: उसे हमारी धरती दिखी।
poem-s5l1: चंद्र छोड़ ऊपर उड़
poem-s5l2: मंगल के मैदान पहुँचने
poem-s5l3: लाल खाली चमक रहा था
poem-s5l4: कोई जीवन नहीं दिखी
poem-s6l1: मंगल पर पुट्टी ने देखा
poem-s6l2: ‘योगी’ नाम की बड़ी चट्टान
poem-s6l3: तुरंत लाल चट्टान से पूछा
poem-s6l4: ‘तुम यहाँ कैसे आए?’
poem-s7l1: चट्टान आँसू बहाते
poem-s7l2: दर्द में पुट्टी से कहा
poem-s7l3: ‘पुट्टी, हमारे इस मंगल की
poem-s7l4: दुखांत कथा सुनकर जान’
poem-s8l1: एक समय इस ग्रह पर
poem-s8l2: जीवन जल और हरे पेड़ थे
poem-s8l3: तब लोगों ने देश बनाने
poem-s8l4: पेड़ काटे और अकाल आया
poem-s9l1: बिना वर्षा-फसल जीवन मरा
poem-s9l2: और हम ऐसी स्थिति में आए
poem-s9l3: ‘तुम्हारी धरती पर पेड़ मरें तो
poem-s9l4: आगे एक दिन यही गति’
poem-s10l1: खाली चमकता मैदान देख
poem-s10l2: कोमल हृदय धड़का
poem-s10l3: हरा मिटाए बिना पेड़ उगाकर
poem-s10l4: कहा हम इस धरती को बचाएँगे
poem-s11l1: धरती आकर लोगों से मिली
poem-s11l2: हरा बचाने की विनती की
poem-s11l3: वह भी कोमल पौधे लगाकर
poem-s11l4: उगाते नाचने लगी।
ex-a-q1: एक दिन अचानक पुट्टी को _________ आए।
ex-a-q2: उड़ती तैरती चंद्र की _________ पहुँची।
ex-a-q3: पुट्टी, हमारे मंगल की दुखांत ________ सुनकर जान।
ex-a-q4: हरा मिटाए बिना पेड़ उगाकर कहा हम इस _______ को बचाएँगे
ex-b-q1: पुट्टी किसकी तरह उड़ना चाहती थी?
ex-b-q2: चंद्र छोड़ ऊपर उड़कर पुट्टी कहाँ पहुँची?
ex-b-q3: पुट्टी ने योगी से क्या पूछा?
ex-b-q4: मंगल पर अकाल क्यों आया?
ex-b-q5: पुट्टी ने लोगों से क्या बचाने को कहा?
ex-c-q1: ‘आकाश में…’ से शुरू छंद पूरा करें।
ex-c-q2: ‘वर्षा फसल…’ छंद पूरा करें।
ex-d-q1: सी.एम. गोविंदरेड्डी का स्थान, काल, कृतियाँ बताइए।
