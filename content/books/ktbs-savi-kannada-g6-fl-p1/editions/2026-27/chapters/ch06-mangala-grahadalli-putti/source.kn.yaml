segments:
- id: intro-1
  type: prose
  text: ಮಕ್ಕಳ ಮನಸ್ಸಿನಲ್ಲಿ ಕುತೂಹಲಭರಿತ ಪ್ರಶ್ನೆಗಳು ಹುಟ್ಟುತ್ತವೆ. ವಿವಿಧ ಕಲ್ಪನೆಗಳು ಕಾಣಿಸುತ್ತವೆ. ಹೊಸ ಹೊಸ ಕನಸುಗಳು ಗೂಡು ಕಟ್ಟುತ್ತವೆ. ಮಕ್ಕಳು ತಮ್ಮ ಕಲ್ಪನೆಯಲ್ಲಿ ನಿರ್ಜೀವ ವಸ್ತುಗಳೊಂದಿಗೂ ಮನಬಿಚ್ಚಿ ಮಾತಾಡಬಲ್ಲರು! ಅಪರಿಚಿತ ಸನ್ನಿವೇಶಗಳೂ ಸಹ ಅವರ ಕನಸುಗಳಲ್ಲಿ ಹತ್ತಿರಕ್ಕೆ ಬಂದುಬಿಡುತ್ತವೆ. ಹೀಗಿರುವ ಅವರ ಕಲ್ಪನೆಗಳಿಗೆ ಮತ್ತಷ್ಟು ಗರಿಗಳನ್ನು ಕಟ್ಟಿ ಇನ್ನಷ್ಟು ಎತ್ತರಕ್ಕೆ ಹಾರಲು ಪ್ರೋತ್ಸಾಹಿಸಿ ಆ ಮೂಲಕ ಪ್ರಸ್ತುತತೆಯ ಅರಿವು ಮೂಡಿಸುವುದು ಇಲ್ಲಿನ ಆಶಯವಾಗಿದೆ.
  section: intro
- id: poem-s1l1
  type: poem_line
  text: ಆಗಸದಲ್ಲಿ ಹಾರುವುದೆಂದರೆ
  section: poem
  stanza: 1
- id: poem-s1l2
  type: poem_line
  text: ಪುಟಾಣಿ ಪುಟ್ಟಿಗೆ ಬಲು ಇಷ್ಟ
  section: poem
  stanza: 1
- id: poem-s1l3
  type: poem_line
  text: ರೆಕ್ಕೆಗಳಿಲ್ಲದೆ ಹಾರಲು ಹೋದರೆ
  section: poem
  stanza: 1
- id: poem-s1l4
  type: poem_line
  text: ಆಗದೆ ತೊಂದರೆ? ಇದು ಕಷ್ಟ.
  section: poem
  stanza: 1
- id: poem-s2l1
  type: poem_line
  text: ಒಂದಿನ ಇದ್ದಕ್ಕಿದ್ದಂತೆ
  section: poem
  stanza: 2
- id: poem-s2l2
  type: poem_line
  text: ಪುಟ್ಟಿಗೆ ರೆಕ್ಕೆಯು ಬಂದಿತ್ತು.
  section: poem
  stanza: 2
- id: poem-s2l3
  type: poem_line
  text: ಹಕ್ಕಿಯ ಹಾಗೆ ಹಾರುವ ಮನಕೆ
  section: poem
  stanza: 2
- id: poem-s2l4
  type: poem_line
  text: ಹೆಚ್ಚಿನ ಹರುಷವ ತಂದಿತ್ತು.
  section: poem
  stanza: 2
- id: poem-s3l1
  type: poem_line
  text: ಕೂಡಲೆ ಪುಟ್ಟಿ ಠಣ್ಣನೆ ಜಿಗಿದು
  section: poem
  stanza: 3
- id: poem-s3l2
  type: poem_line
  text: ಆಗಸದೊಡಲಿಗೆ ಹಾರಿದಳು.
  section: poem
  stanza: 3
- id: poem-s3l3
  type: poem_line
  text: ಹಾರುತ ತೇಲುತ ಮುಂದಕೆ ಸಾಗಿ
  section: poem
  stanza: 3
- id: poem-s3l4
  type: poem_line
  text: ಚಂದ್ರನ ಮಡಿಲನು ಸೇರಿದಳು.
  section: poem
  stanza: 3
- id: poem-s4l1
  type: poem_line
  text: ಚಂದ್ರನ ಮೇಲೆ ನೆಟ್ಟಗೆ ನಿಂತು
  section: poem
  stanza: 4
- id: poem-s4l2
  type: poem_line
  text: ಭೂಮಿಯ ಕಡೆಗೆ ನೋಡಿದರೆ
  section: poem
  stanza: 4
- id: poem-s4l3
  type: poem_line
  text: ನೇರಳೆ ಬಣ್ಣದ ಚೆಂಡಿನ ಹಾಗೆ
  section: poem
  stanza: 4
- id: poem-s4l4
  type: poem_line
  text: ಕಂಡಿತು ಅವಳಿಗೆ ನಮ್ಮ ಧರೆ.
  section: poem
  stanza: 4
- id: poem-s5l1
  type: poem_line
  text: ಚಂದ್ರನ ಬಿಟ್ಟು ಮೇಲಕೆ ಹಾರಿ
  section: poem
  stanza: 5
- id: poem-s5l2
  type: poem_line
  text: ಸೇರಲು ಮಂಗಳನಂಗಳವ
  section: poem
  stanza: 5
- id: poem-s5l3
  type: poem_line
  text: ಕೆಂಪಗೆ ಬಣಬಣಗುಟ್ಟುತಲಿತ್ತು
  section: poem
  stanza: 5
- id: poem-s5l4
  type: poem_line
  text: ಕಾಣಲಿಲ್ಲ ಯಾವುದೆ ಜೀವ
  section: poem
  stanza: 5
- id: poem-s6l1
  type: poem_line
  text: ಪುಟ್ಟಿಯು ಕಂಡಳು ಮಂಗಳನಲ್ಲಿ
  section: poem
  stanza: 6
- id: poem-s6l2
  type: poem_line
  text: ‘ಯೋಗಿ’ ಹೆಸರಿನ ಹೆಬ್ಬಂಡೆ
  section: poem
  stanza: 6
- id: poem-s6l3
  type: poem_line
  text: ಒಡನೆ ಕೇಳಿದಳು ಕೆಂಪು ಬಂಡೆಯನು
  section: poem
  stanza: 6
- id: poem-s6l4
  type: poem_line
  text: ‘ನೀನು ಹೇಗೆ ಇಲ್ಲಿಗೆ ಬಂದೆ?’
  section: poem
  stanza: 6
- id: poem-s7l1
  type: poem_line
  text: ಬಂಡೆಯು ಕಣ್ಣೀರನು ಸುರಿಸುತ್ತಾ
  section: poem
  stanza: 7
- id: poem-s7l2
  type: poem_line
  text: ಹೇಳಿತು ಪುಟ್ಟಿಗೆ ನೋವಿನಲಿ
  section: poem
  stanza: 7
- id: poem-s7l3
  type: poem_line
  text: ‘ಪುಟ್ಟಿಯೇ, ನಮ್ಮೀ ಮಂಗಳ ಗ್ರಹದ
  section: poem
  stanza: 7
- id: poem-s7l4
  type: poem_line
  text: ದುರಂತ ಕಥೆಯನು ಕೇಳಿ ತಿಳಿ’
  section: poem
  stanza: 7
- id: poem-s8l1
  type: poem_line
  text: ಹಿಂದೊಂದು ಕಾಲದಿ ಈ ಗ್ರಹದಲ್ಲಿ
  section: poem
  stanza: 8
- id: poem-s8l2
  type: poem_line
  text: ಇತ್ತು ಜೀವಜಲ ಹಸಿರು ಮರ
  section: poem
  stanza: 8
- id: poem-s8l3
  type: poem_line
  text: ಆಗಿನ ಜನತೆಯು ನಾಡನು ಕಟ್ಟಲು
  section: poem
  stanza: 8
- id: poem-s8l4
  type: poem_line
  text: ಮರಗಳ ಕಡಿಯೆ ಬಂತು ಬರ
  section: poem
  stanza: 8
- id: poem-s9l1
  type: poem_line
  text: ಮಳೆ ಬೆಳೆ ಕಾಣದೆ ಜೀವಿಯು ಅಳಿದು
  section: poem
  stanza: 9
- id: poem-s9l2
  type: poem_line
  text: ಬಂದಿತು ನಮಗೆ ಇಂಥ ಸ್ಥಿತಿ
  section: poem
  stanza: 9
- id: poem-s9l3
  type: poem_line
  text: ‘ನಿಮ್ಮ ಭೂಮಿಯಲಿ ಗಿಡಮರ ಅಳಿದರೆ
  section: poem
  stanza: 9
- id: poem-s9l4
  type: poem_line
  text: ಮುಂದೆ ಒಂದು ದಿನ ಇದೇ ಗತಿ’
  section: poem
  stanza: 9
- id: poem-s10l1
  type: poem_line
  text: ಬಣಬಣಗುಟ್ಟುವ ಬಯಲನು ಕಂಡು
  section: poem
  stanza: 10
- id: poem-s10l2
  type: poem_line
  text: ಢವಢವಗುಟ್ಟಿತು ಎಳೆ ಹೃದಯ
  section: poem
  stanza: 10
- id: poem-s10l3
  type: poem_line
  text: ಹಸಿರನು ಅಳಿಸದೆ ಗಿಡಮರ ಬೆಳೆಸಿ
  section: poem
  stanza: 10
- id: poem-s10l4
  type: poem_line
  text: ಉಳಿಸುವೆವೆಂದಳು ಈ ಧರೆಯ
  section: poem
  stanza: 10
- id: poem-s11l1
  type: poem_line
  text: ಭೂಮಿಗೆ ಬಂದು ಜನತೆಯ ಕಂಡು
  section: poem
  stanza: 11
- id: poem-s11l2
  type: poem_line
  text: ಹಸಿರನು ಉಳಿಸಲು ಬೇಡಿದಳು
  section: poem
  stanza: 11
- id: poem-s11l3
  type: poem_line
  text: ತಾನು ಕೂಡ ಎಳೆ ಸಸಿಗಳ ನೆಟ್ಟು
  section: poem
  stanza: 11
- id: poem-s11l4
  type: poem_line
  text: ಬೆಳೆಸುತ ಕುಣಿ ಕುಣಿದಾಡಿದಳು.
  section: poem
  stanza: 11
- id: author-1
  type: prose
  text: ಸಿ.ಎಂ. ಗೋವಿಂದರೆಡ್ಡಿ ಅವರು 11-08-1958ರಲ್ಲಿ ಕೋಲಾರ ಜಿಲ್ಲೆಯ ಮಾಲೂರು ತಾಲೂಕಿನ ಚೆನ್ನಿಗರಾಯಪುರ ಎಂಬ ಊರಿನಲ್ಲಿ ಜನಿಸಿದರು. ಮಕ್ಕಳ ಸಾಹಿತ್ಯ ರಚನೆಯಲ್ಲಿ ವಿಶೇಷ ಆಸಕ್ತಿ ಹೊಂದಿದ ಇವರು ‘ಬಣ್ಣದ ಚಿಟ್ಟೆ’, ‘ಮಕ್ಕಳ ಮಂದಾರ’, ‘ಪದ್ಯ ಹೇಳುವ ಮರ’ ಮೊದಲಾದ ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಪ್ರಸ್ತುತ ಪದ್ಯವನ್ನು ‘ಮಕ್ಕಳ ಮಂದಾರ’ ಎಂಬ ಕೃತಿಯಿಂದ ಆಯ್ಕೆಮಾಡಿಕೊಳ್ಳಲಾಗಿದೆ.
  section: author
