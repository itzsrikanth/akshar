intro-1: We humans have much to learn from nature. Every object in nature is interrelated. Likewise, as the seasons change, the weather rises and falls. Once scorching sun, another time shivering cold, rain, wind—whatever happens, work never stops. Nature keeps its balance and always does its share of work.
poem-s1l1: Summer holidays have come
poem-s1l2: yet there is the sun’s punishment
poem-s1l3: Come, let’s play,
poem-s1l4: let’s sing of the sun’s glory.
poem-s2l1: Why hotter than the sun?
poem-s2l2: On whom is his anger?
poem-s2l3: Don’t blame him so,
poem-s2l4: don’t take the sun as at fault,
poem-s2l5: To gather clouds, to bring rain to the earth
poem-s2l6: he toils, poor thing!
poem-s3l1: The sun, nourisher of the earth
poem-s3l2: is indispensable to the earth
poem-s3l3: He needs no praise,
poem-s3l4: blame does not shrink him.
poem-s3l5: He gives light, he sends heat
poem-s3l6: never forgetting duty.
poem-s4l1: In such fierce heat
poem-s4l2: trees, plants, bushes, vines
poem-s4l3: are not distressed,
poem-s4l4: see—they all look splendid
poem-s4l5: sprouting, flowering, fruit setting,
poem-s4l6: they are in celebration.
poem-s5l1: Let’s learn from the sun.
poem-s5l2: Let’s rejoice like nature.
poem-s5l3: Without fearing hardships,
poem-s5l4: not forgetting our duty,
poem-s5l5: living joyfully, sharing joy,
poem-s5l6: let us earn contentment.
author-1: B.R. Lakshman Rao was born on 09-09-1946 in Cheemangala village, Chikkaballapur district. Father B.R. Raja Rao, mother Venkatalakshmamma. A retired teacher, he continues to serve literature. The poem ‘Besige’ is taken from the lyric collection ‘Subbabhattara Magele’.
