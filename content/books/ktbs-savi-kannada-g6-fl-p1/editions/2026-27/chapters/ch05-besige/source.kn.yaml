  author: ಕವಿ ಕೃತಿ ಪರಿಚಯ
  vocab: ಪದಗಳ ಅರ್ಥ
  exercise-A: ಅ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿರಿ.
  exercise-B: ಆ. ಕೆಳಗಿನ ಪದಗಳಿಗೆ ತಲಾ ಎರಡು ಸಮಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ.
  exercise-C: ಇ. ಈ ಪದಗಳನ್ನು ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ಬರೆಯಿರಿ.
  exercise-D: ಈ. ಬೇಸಿಗೆ ಪದ್ಯದ ಸಾರಾಂಶವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.
segments:
- id: intro-1
  type: prose
  text: ಮಾನವರಾದ ನಾವು ಪ್ರಕೃತಿಯಿಂದ ಕಲಿಯಬೇಕಾದದ್ದು ಅಪಾರ. ಪ್ರಕೃತಿಯ ಪ್ರತಿಯೊಂದು ವಸ್ತುವೂ ಪರಸ್ಪರ ಸಂಬಂಧವುಳ್ಳದ್ದಾಗಿರುತ್ತವೆ. ಅಂತೆಯೇ ಋತುಮಾನಗಳು ಕೂಡ ಅವು ಬದಲಾದಂತೆ ಹವಾಮಾನವು ಏರುಪೇರಾಗುತ್ತಿರುತ್ತದೆ. ಒಮ್ಮೆ ಪ್ರಖರವಾದ ಬಿಸಿಲು, ಮತ್ತೊಮ್ಮೆ ಗಡಗಡ ನಡುಗುವ ಚಳಿ, ಮಳೆ, ಗಾಳಿ-ಹೀಗೆ ಏನೇ ಆದರೂ ಯಾವುದೇ ಕೆಲಸಕಾರ್ಯಗಳು ನಿಲ್ಲುವುದಿಲ್ಲ. ಪ್ರಕೃತಿಯು ಸಮತೋಲನವನ್ನು ಕಾಯ್ದುಕೊಂಡು ತನ್ನ ಪಾಲಿನ ಕೆಲಸವನ್ನು ಸದಾ ನಿರ್ವಹಿಸುತ್ತ ಇರುತ್ತದೆ.
  section: intro
- id: poem-s1l1
  type: poem_line
  text: ಬಂದಿದೆ ಬೇಸಿಗೆ ರಜಾ
  section: poem
  stanza: 1
- id: poem-s1l2
  type: poem_line
  text: ಇದ್ದರೂ ಬಿಸಿಲಿನ ಸಜಾ
  section: poem
  stanza: 1
- id: poem-s1l3
  type: poem_line
  text: ಬನ್ನಿ ಆಡೋಣ,
  section: poem
  stanza: 1
- id: poem-s1l4
  type: poem_line
  text: ಸೂರ್ಯನ ಮಹಿಮೆಯ ಹಾಡೋಣ.
  section: poem
  stanza: 1
- id: poem-s2l1
  type: poem_line
  text: ಏಕೆ ರವಿಗಿಂತ ತಾಪ?
  section: poem
  stanza: 2
- id: poem-s2l2
  type: poem_line
  text: ಯಾರ ಮೇಲವನ ಕೋಪ?
  section: poem
  stanza: 2
- id: poem-s2l3
  type: poem_line
  text: ಎಂದು ಹಳಿಯಬೇಡಿ,
  section: poem
  stanza: 2
- id: poem-s2l4
  type: poem_line
  text: ಸೂರ್ಯನ ತಪ್ಪು ತಿಳಿಯಬೇಡಿ,
  section: poem
  stanza: 2
- id: poem-s2l5
  type: poem_line
  text: ಮೋಡ ಕೂಡಿಸಲು, ಇಳೆಗೆ ಮಳೆ ತರಲು
  section: poem
  stanza: 2
- id: poem-s2l6
  type: poem_line
  text: ದುಡಿಯುತಿಹನು, ಪಾಪ!
  section: poem
  stanza: 2
- id: poem-s3l1
  type: poem_line
  text: ಭೂಮಿಯ ಪೋಷಕ ಸೂರ್ಯ
  section: poem
  stanza: 3
- id: poem-s3l2
  type: poem_line
  text: ಭೂಮಿಗವನು ಅನಿವಾರ್ಯ
  section: poem
  stanza: 3
- id: poem-s3l3
  type: poem_line
  text: ಹೊಗಳಿಕೆ ಬೇಕಿಲ್ಲ,
  section: poem
  stanza: 3
- id: poem-s3l4
  type: poem_line
  text: ತೆಗಳಿದರೆ ಅವ ಕುಗ್ಗುವುದಿಲ್ಲ.
  section: poem
  stanza: 3
- id: poem-s3l5
  type: poem_line
  text: ಬೆಳಕ ನೀಡುವನು, ಬಿಸಿಯನೂಡುವನು
  section: poem
  stanza: 3
- id: poem-s3l6
  type: poem_line
  text: ಮರೆಯದೆ ಕರ್ತವ್ಯ.
  section: poem
  stanza: 3
- id: poem-s4l1
  type: poem_line
  text: ಇಂಥ ಬಿರು ಬಿಸಿಲಿನಲ್ಲಿ
  section: poem
  stanza: 4
- id: poem-s4l2
  type: poem_line
  text: ಮರಾ ಗಿಡಾ ಪೊದೆ ಬಳ್ಳಿ
  section: poem
  stanza: 4
- id: poem-s4l3
  type: poem_line
  text: ಕಂಗಾಲಾಗಿಲ್ಲ,
  section: poem
  stanza: 4
- id: poem-s4l4
  type: poem_line
  text: ನೋಡಿ ರಂಗಾಗಿವೆ ಎಲ್ಲ
  section: poem
  stanza: 4
- id: poem-s4l5
  type: poem_line
  text: ಚಿಗುರು ಹೂತೊಟ್ಟು, ಹಣ್ಣು ಮಿಡಿ ಬಿಟ್ಟು,
  section: poem
  stanza: 4
- id: poem-s4l6
  type: poem_line
  text: ಇವೆ ಸಂಭ್ರಮದಲ್ಲಿ.
  section: poem
  stanza: 4
- id: poem-s5l1
  type: poem_line
  text: ಸೂರ್ಯನಿಂದ ಕಲಿಯೋಣ.
  section: poem
  stanza: 5
- id: poem-s5l2
  type: poem_line
  text: ಪ್ರಕೃತಿಯಂತೆ ನಲಿಯೋಣ.
  section: poem
  stanza: 5
- id: poem-s5l3
  type: poem_line
  text: ಕಷ್ಟಗಳಿಗಂಜದೆ,
  section: poem
  stanza: 5
- id: poem-s5l4
  type: poem_line
  text: ನಮ್ಮ ಕರ್ತವ್ಯ ಮರೆಯದೆ,
  section: poem
  stanza: 5
- id: poem-s5l5
  type: poem_line
  text: ನಲಿಯುತ ಬಾಳಿ, ನಲಿವನು ಹಂಚಿ,
  section: poem
  stanza: 5
- id: poem-s5l6
  type: poem_line
  text: ಧನ್ಯತೆ ಗಳಿಸೋಣ.
  section: poem
  stanza: 5
- id: author-1
  type: prose
  text: ಬಿ.ಆರ್. ಲಕ್ಷ್ಮಣರಾವ್ ಅವರು ಚಿಕ್ಕಬಳ್ಳಾಪುರ ಜಿಲ್ಲೆಯ ಚೀಮಂಗಲ ಗ್ರಾಮದಲ್ಲಿ 09-09-1946ರಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಬಿ.ಆರ್. ರಾಜಾರಾವ್, ತಾಯಿ ವೆಂಕಟಲಕ್ಷ್ಮಮ್ಮ. ಲಕ್ಷ್ಮಣರಾವ್ ನಿವೃತ್ತ ಉಪಾಧ್ಯಾಯರಾಗಿದ್ದು ಸಾಹಿತ್ಯ ಕ್ಷೇತ್ರದಲ್ಲಿ ಸೇವೆ ಮಾಡುತ್ತಿದ್ದಾರೆ. ‘ಬೇಸಿಗೆ’ ಎಂಬ ಪದ್ಯವನ್ನು ‘ಸುಬ್ಬಾಭಟ್ಟರ ಮಗಳೇ’ ಎಂಬ ಭಾವಗೀತೆಗಳ ಸಂಕಲನದಿಂದ ಆಯ್ದುಕೊಳ್ಳಲಾಗಿದೆ.
  section: author
