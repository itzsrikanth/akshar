intro-1: मानवराद नावु प्रकृतियिंद कलियबेकादद्दु अपार. प्रकृतिय प्रतियॊंदु वस्तुवू परस्पर संबंधवुळ्ळद्दागिरुत्तवॆ. अंतॆये ऋतुमानगळु कूड अवु बदलादंतॆ हवामानवु एरुपेरागुत्तिरुत्तदॆ. ऒम्मॆ प्रखरवाद बिसिलु, मत्तॊम्मॆ गडगड नडुगुव चळि, मळॆ, गाळि-हीगॆ एने आदरू यावुदे कॆलसकार्यगळु निल्लुवुदिल्ल. प्रकृतियु समतोलनवन्नु काय्दुकॊंडु तन्न पालिन कॆलसवन्नु सदा निर्वहिसुत्त इरुत्तदॆ.
poem-s1l1: बंदिदॆ बेसिगॆ रजा
poem-s1l2: इद्दरू बिसिलिन सजा
poem-s1l3: बन्नि आडोण,
poem-s1l4: सूर्यन महिमॆय हाडोण.
poem-s2l1: एकॆ रविगिंत ताप?
poem-s2l2: यार मेलवन कोप?
poem-s2l3: ऎंदु हळियबेडि,
poem-s2l4: सूर्यन तप्पु तिळियबेडि,
poem-s2l5: मोड कूडिसलु, इळॆगॆ मळॆ तरलु
poem-s2l6: दुडियुतिहनु, पाप!
poem-s3l1: भूमिय पोषक सूर्य
poem-s3l2: भूमिगवनु अनिवार्य
poem-s3l3: हॊगळिकॆ बेकिल्ल,
poem-s3l4: तॆगळिदरॆ अव कुग्गुवुदिल्ल.
poem-s3l5: बॆळक नीडुवनु, बिसियनूडुवनु
poem-s3l6: मरॆयदॆ कर्तव्य.
poem-s4l1: इंथ बिरु बिसिलिनल्लि
poem-s4l2: मरा गिडा पॊदॆ बळ्ळि
poem-s4l3: कंगालागिल्ल,
poem-s4l4: नोडि रंगागिवॆ ऎल्ल
poem-s4l5: चिगुरु हूतॊट्टु, हण्णु मिडि बिट्टु,
poem-s4l6: इवॆ संभ्रमदल्लि.
poem-s5l1: सूर्यनिंद कलियोण.
poem-s5l2: प्रकृतियंतॆ नलियोण.
poem-s5l3: कष्टगळिगंजदॆ,
poem-s5l4: नम्म कर्तव्य मरॆयदॆ,
poem-s5l5: नलियुत बाळि, नलिवनु हंचि,
poem-s5l6: धन्यतॆ गळिसोण.
author-1: बि.आर्. लक्ष्मणराव् अवरु चिक्कबळ्ळापुर जिल्लॆय चीमंगल ग्रामदल्लि 09-09-1946रल्लि जनिसिदरु. तंदॆ बि.आर्. राजाराव्, तायि वॆंकटलक्ष्मम्म. लक्ष्मणराव् निवृत्त उपाध्यायरागिद्दु साहित्य क्षेत्रदल्लि सेवॆ माडुत्तिद्दारॆ. ‘बेसिगॆ’ ऎंब पद्यवन्नु ‘सुब्बाभट्टर मगळे’ ऎंब भावगीतॆगळ संकलनदिंद आय्दुकॊळ्ळलागिदॆ.
