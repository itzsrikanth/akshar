ex-a-q1: sūrya ekè duḍiyuttiddānè?
ex-a-q2: bhūmiya poṣaka yāru?
ex-a-q3: sūrya marèyadè yāva kartavya māḍuvanu?
ex-a-q4: biru bisiligè yāvuvu kaṃgālāgilla?
ex-a-q5: sūryaniṃda makkaḻu kaliyabekāddenu?
