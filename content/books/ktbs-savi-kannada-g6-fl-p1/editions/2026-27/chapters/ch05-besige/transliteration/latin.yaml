labels:
  intro: praveśa
  poem: padya
  author: kavi kṛti paricaya
  vocab: padagaḻa artha
  exercise-A: a. kèḻagina praśnègaḻigè uttarisiri.
  exercise-B: ā. kèḻagina padagaḻigè talā èraḍu samānārthaka padagaḻannu barèyiri.
  exercise-C: i. ī padagaḻannu baḻasi svaṃta vākya barèyiri.
  exercise-D: ī. besigè padyada sārāṃśavannu nimma mātugaḻalli barèyiri.
intro-1: mānavarāda nāvu prakṛtiyiṃda kaliyabekādaddu apāra. prakṛtiya pratiyòṃdu vastuvū paraspara saṃbaṃdhavuḻḻaddāgiruttavè. aṃtèye ṛtumānagaḻu kūḍa avu badalādaṃtè havāmānavu eruperāguttiruttadè. òmmè prakharavāda bisilu, mattòmmè gaḍagaḍa naḍuguva caḻi, maḻè, gāḻi-hīgè ene ādarū yāvude kèlasakāryagaḻu nilluvudilla. prakṛtiyu samatolanavannu kāydukòṃḍu tanna pālina kèlasavannu sadā nirvahisutta iruttadè.
poem-s1l1: baṃdidè besigè rajā
poem-s1l2: iddarū bisilina sajā
poem-s1l3: banni āḍoṇa,
poem-s1l4: sūryana mahimèya hāḍoṇa.
poem-s2l1: ekè ravigiṃta tāpa?
poem-s2l2: yāra melavana kopa?
poem-s2l3: èṃdu haḻiyabeḍi,
poem-s2l4: sūryana tappu tiḻiyabeḍi,
poem-s2l5: moḍa kūḍisalu, iḻègè maḻè taralu
poem-s2l6: duḍiyutihanu, pāpa!
poem-s3l1: bhūmiya poṣaka sūrya
poem-s3l2: bhūmigavanu anivārya
poem-s3l3: hògaḻikè bekilla,
poem-s3l4: tègaḻidarè ava kugguvudilla.
poem-s3l5: bèḻaka nīḍuvanu, bisiyanūḍuvanu
poem-s3l6: marèyadè kartavya.
poem-s4l1: iṃtha biru bisilinalli
poem-s4l2: marā giḍā pòdè baḻḻi
poem-s4l3: kaṃgālāgilla,
poem-s4l4: noḍi raṃgāgivè èlla
poem-s4l5: ciguru hūtòṭṭu, haṇṇu miḍi biṭṭu,
poem-s4l6: ivè saṃbhramadalli.
poem-s5l1: sūryaniṃda kaliyoṇa.
poem-s5l2: prakṛtiyaṃtè naliyoṇa.
poem-s5l3: kaṣṭagaḻigaṃjadè,
poem-s5l4: namma kartavya marèyadè,
poem-s5l5: naliyuta bāḻi, nalivanu haṃci,
poem-s5l6: dhanyatè gaḻisoṇa.
author-1: bi.ār. lakṣmaṇarāv avaru cikkabaḻḻāpura jillèya cīmaṃgala grāmadalli 09-09-1946ralli janisidaru. taṃdè bi.ār. rājārāv, tāyi vèṃkaṭalakṣmamma. lakṣmaṇarāv nivṛtta upādhyāyarāgiddu sāhitya kṣetradalli sevè māḍuttiddārè. ‘besigè’ èṃba padyavannu ‘subbābhaṭṭara magaḻe’ èṃba bhāvagītègaḻa saṃkalanadiṃda āydukòḻḻalāgidè.
