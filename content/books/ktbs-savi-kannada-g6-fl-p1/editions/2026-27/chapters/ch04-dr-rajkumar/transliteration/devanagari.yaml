intro-1: यावुदे बगॆय मूलभूत सौकर्यगळू इल्लदॆ कडुबडतनदल्लि अरळिद प्रतिभॆयॊंदु नाडिन जनर कण्मणियागुवुदु, ऎत्तरद साधनॆ माडि जनमानसदल्लि शाश्वतवागि नॆलॆ निल्लुवुदु सामान्यद मातल्ल. नाडोज, नटसार्वभौम डा. राजकुमार् अवर बदुकु कूड इंतह असामान्य साधनॆगॆ मादरियागिदॆ. तम्म अपूर्व प्रतिभॆय नटनॆ, गायन, कन्नड परवाद उज्वल प्रीति मत्तु सुसंस्कृत सज्जनिकॆय नडवळिकॆयिंद डा. राजकुमार् अवरु नम्म नाडु कंड मेरु व्यक्तित्ववॆनिसिद्दारॆ. अवर बदुकिन कॆलवु विवरगळ अवलोकनदिंद नाडिन मक्कळु स्फूर्तिहॊंदबल्लरॆंबुदु ई पाठद आशयवागिदॆ.
story-n1: डा. राजकुमार् अवरु चामराजनगर जिल्लॆगॆ सेरिद गाजनूरिनल्लि 24 एप्रिल् 1929रंदु जनिसिदरु. सिंगानल्लूरु मूलद श्रीयुत पुट्टस्वामय्यनवरु राजकुमार् अवर तंदॆ. तायि गाजनूरिनवराद श्रीमति लक्ष्मम्मनवरु. ई दंपति गंडु मगुवन्नु करुणिसॆंदु तम्म इष्टदैव मुत्तत्तिरायनिगॆ हरकॆ हॊत्तिद्दरंतॆ. हागागि आ देवर हॆसरन्ने मगनिगॆ इट्टरु. ‘राज’ ऎंबुदु ‘राय’ ऎंबुदर तद्भव रूपवागिरुवुदरिंद ‘मुत्तुराय’ स्वामिय हॆसरु ‘मुत्तुराज’ ऎंदागिद्दु मात्रवल्ल कन्नडिगर मनगॆद्द राजकुमारने आगिद्दु आकस्मिकवल्ल. मुत्तुराजनॊळगिन प्रतिभॆयु विकासगॊंड परि अदु. मळॆयिल्लदॆ कंगॆट्टिद्द नॆलक्कॆ स्वातिय मळॆसुरिदु तंपॆरॆयुव तॆरदि जोरु मळॆ सुरियुवाग हुट्टिद मुत्तुराजर जननदिंद मनॆमंदियॆल्ल संभ्रमपट्टरु.
story-n2: बाल्यदल्लिये मुत्तुराजरिगॆ बडवर कष्ट कंडु मरुगुव गुणवित्तु. शालॆयल्लि कूतिद्दरू अवर मनस्सु बडतन, हसिवु, कष्टगळत्त हॊरळुत्तित्तु. इदरॊंदिगॆ हळ्ळिगाडिन सुप्रसन्नतॆ, सुंदर परिसर, मुग्ध जनर आचार विचारगळु, हळ्ळ कॊळ्ळ, काडु मुंतादवॆल्ल मुत्तुराजर भावलोकवन्नु हिग्गिसुत्तित्तु. शालॆयल्लि कलितद्दु मूरनॆय तरगतियवरॆगॆ मात्रवादरू आ वयस्सिनिंदले आद लोकानुभवद शिक्षणद पात्र इवर व्यक्तित्ववन्नु रूपिसितु. इवर तंदॆ पुट्टस्वामय्यनवरु अद्भुत रंग कलाविदरागिद्दरु. सोदर मावंदिरु सॊगसाद गायकरागिद्दरु. ई परिसरदल्लि तम्म बाल्यवन्नु कळॆद मुत्तुराजरिगॆ सहजवागिये रंगभूमि कैबीसि करॆयितु.
story-n3: मुत्तुराज अवरु बाल नटनागि कला प्रपंचक्कॆ कालिट्टरु. गुब्बिवीरण्णनवर नाटक कंपनियल्लि मॊदमॊदलु सखि, सेवकियंतह सण्णपुट्ट पात्रगळन्नु माडबेकायितु. आमेलॆ मत्तोर्व हिरिय रंगभूमिय कलाविदराद श्री सुब्बय्यनाय्डु अवर नाटक कंपनिगॆ सेरि अनेक महत्वद पात्रगळन्नु निर्वहिसुत्ता बॆळॆयुत्तिरुवाग तंदॆयवर अकालिक मरणद दुःख ऎदुरायितु. इडी कुटुंबवन्नु कापाडबेकाद जवाब्दारियन्नु आत्मविश्वासदिंद ऎदुरिसिद मुत्तुराजरु, ई अनुभव मत्तु अभिनय ऎरडरिंदलू मागुत्त सागिदरु. कष्टद दिनगळल्लियू कलाविदन कै हिडिदु संसारद बदुकिगॆ हॆगलॆणॆयादवरु मुत्तुराजर सोदर मावन मगळाद पार्वतम्मनवरु.
story-n4: भक्त प्रह्लाद, श्रीनिवास कल्याणदंतह पौराणिक चलनचित्रगळल्लि सण्णपुट्ट पात्रगळल्लि काणिसिकॊंडिद्दरू 1954रल्लि तॆरॆकंड ‘बेडर कण्णप्प’ ऎंब चित्रवु मुत्तुराजर बदुकिनल्लि हॊस अध्याय बरॆयितु. ई चित्रद निर्देशकराद ऎच्.ऎल्.ऎन्. सिंह अवरु ‘मुत्तुराज’ ऎंब हॆसरन्नु ‘राजकुमार’ ऎंदु बदलायिसि, बॆळ्ळितॆरॆगॆ परिचयिसिदरु. तम्म हॆसरन्नु बदलायिसुवुदु मुत्तुराजरिगॆ इष्टविरलिल्लवंतॆ. आदरॆ कन्नडिगरु राजकुमार ऎंब हॆसरन्ने तम्म हृदय सिंहासनदल्लिरिसिकॊळ्ळुवंतॆ तावु अभिनयिसिद प्रतियॊंदु पात्रक्कू राजकुमार् जीव तुंबिदरु.
story-n5: राजकुमार् अवरु अभिनयिसिद भक्तिप्रधानवाद भक्तविजय, ओहिलेश्वर, श्रीकृष्ण गारुडि, भक्तकुंबार, संत तुकारां, भक्त कनकदास मुंताद चित्रगळन्नु नोडिद चित्ररसिकरु राजकुमार् अवर मनोज्ञ अभिनयक्कॆ सोतुहोदरु. अत्यंत यशस्सुगळिसिद भक्तप्रह्लाद, मयूर, बभ्रुवाहन, कविरत्न काळिदास मुंताद चित्रगळल्लिन अभिनयवंतू राजकुमाररिगॆ अपारवाद जनप्रीति, कीर्ति, पुरस्कारगळन्नु हॊत्तु तंदवु. संध्याराग, सनादि अप्पण्ण, जीवनचैत्र, कस्तूरि निवास, बंगारद मनुष्य, देवता मनुष्य मुंताद सामाजिक चित्रगळु कन्नड चित्ररंगदल्लि हॊस दाखलॆयन्नु बरॆदवु. जन मॆच्चिद ‘रसिकर राज’ ऎनिसिद्दु हीगॆ.
story-n6: तम्म सॊगसाद कंठ मत्तु हाडुगारिकॆयिंदलू कन्नडिगर मनसूरॆगॊंड राजकुमार् अवरु ‘गानगंधर्व’ ऎनिसिदरु. ‘संपत्तिगॆ सवाल्’ ऎंब चित्रदल्लि नायक ऎम्मॆय मेलॆ कुळितु हाडिद “यारे कूगाडलि, ऊरे होराडलि” ऎंब गीतॆयु दिन बॆळगागुवुदरॊळगॆ राजकुमार् अवरन्नु हिन्नॆलॆगायकरन्नागि परिचयिसितु. चिक्कंदिनिंदलू इवरिगॆ हाडलु बरुत्तित्तु. जॊतॆगॆ, नाटकगळल्लि हाडिद अनुभववू इत्तु. संपत्तिगॆ सवाल् चित्रदिंद तम्म पात्रगळिगॆ तावे हाडलारंभिसिद राजकुमार् अवरु नूरारु चलनचित्र गीतॆगळन्नू, साविरारु भक्तिगीतॆगळन्नू, अनेक भावगीतॆगळन्नू हाडिद्दारॆ. जीवन चैत्र चित्रद “नादमय ई लोकवॆल्ला नादमय” ऎंब अद्भुत गायनक्कागि राष्ट्रप्रशस्तियन्नु मुडिगेरिसिकॊंड हिरिमॆयू इवरदागिदॆ.
story-n7: नटरागि मात्रवल्लदॆ अनन्य कन्नड प्रीतिगागियू नाडु राजकुमार् अवरन्नु सदा स्मरिसुत्तदॆ. ऎंतह आमिषवॊड्डिदरू राजकुमार् अवरु कन्नड बिट्टु बेरॆ भाषॆय चित्रगळल्लि नटिसलु ऒप्पलिल्ल. अंतह कन्नड प्रीति अवरदु. कर्नाटकदल्लि कन्नड भाषॆगॆ आद्यतॆ, मान्यतॆगळु दॊरकबेकॆंब संकल्पदिंदारंभिसिद गोकाक् चळुवळिगॆ धुमुकिद राजकुमार् अवरु कन्नडिगर भावनॆय स्वरूपद प्रतिरूपदंतॆ काणिसिकॊंडु कन्नडद होराटक्कॆ बल तंदरु. तावु अभिनयिसिद ऎल्ल पात्रगळु आडुव सरळ, सॊगसाद कन्नडद नुडिगळिंद अवरु कन्नडिगर ऎदॆगळल्लि सविगन्नडद कंपु तुंबिद्दन्नु नावु ऎंदिगू मरॆयुवंतिल्ल.
story-n8: अशक्त कलाविदर नॆरविगागि राजकुमार् अवरु अनेक रससंजॆ कार्यक्रमगळन्नु नडॆसि नॆरविगॆ बंदिद्दारॆ. बडतनदल्लि बॆळॆदु बंद अवरिगॆ हसिविन, अन्नद बॆलॆ चॆन्नागि तिळिदित्तु. लॆक्कविल्लदष्टु सह कलाविदरु, तंत्रज्ञरु, चलनचित्र कार्मिकरु, संघ संस्थॆगळु राजकुमार् अवरिंद आर्थिक नॆरवु पडॆद उदाहरणॆगळिवॆ. राजकुमार् अवर करुणामयि हृदय संपन्नतॆगॆ इवु कॆलवु उदाहरणॆगळु मात्र.
story-n9: राजकुमारर कुटुंबवे कन्नड चित्ररंगद दॊड्ड मनॆयॆनिसिदॆ. श्रीमति पार्वतम्मनवरु चित्र निर्मापकरागि वितरकरागि दॊड्ड साधनॆगैदरॆ, मक्कळाद राघवेंद्र राजकुमार्, शिवराजकुमार्, पुनीत् राजकुमार् नटरागि, गायकरागि नाडिन जनर मनगॆद्दवरु. पुनीत् राजकुमार् तम्म बाल्यदल्लिये ‘बॆट्टद हू’ चित्रद अमोघ अभिनयक्कागि राष्ट्रप्रशस्ति पडॆदिद्दरु. अवरु तंदॆयंतॆये ‘कर्नाटक रत्न’ ऎन्निसिद साहसगाथॆ बेरॆयदे इदॆ. राजकुमार् अवर मॊम्मक्कळू सिनिमा नायकरागिरुवुदु ई कलासंपन्नतॆयु मूरने तलॆमारिगू हरिदु बंदिरुवुदर प्रतीकवागिदॆ.
story-n10: राजकुमार् ऎंब सम्मोहक प्रतिभॆगॆ मनसोत कन्नडिगरु अवरन्नु नट सार्वभौम, कला कौस्तुभ, कला केसरि, वरनट, रसिकर राज, गानगंधर्व, कन्नडद कण्मणि मुंताद विशेषणगळिंद करॆदु संतोषपट्टरॆ, 1979रल्लि मैसूरु विश्व विद्यालयवु गौरव डाक्टरेट् पदवि नीडि पुरस्करिसितु. अंदिनिंद इवरु ऎल्लर प्रीतिय ‘डाक्टर् राजकुमार्’ ऎनिसिदरु. केंद्र सर्कार इवर कलासेवॆगॆ ‘पद्मभूषण’ प्रशस्तियन्नित्तु गौरविसितु. जीवमानद साधनॆगागि भारत सर्कारद अत्युच्च प्रशस्तियाद ‘दादा साहेब् फाल्कॆ प्रशस्ति’यू दॊरॆयितु. कर्नाटक सर्कारवु “कर्नाटक रत्न प्रशस्ति” नीडितु.
story-n11: ई मॊदले हेळिदंतॆ बडतनद परिसरदल्लि हुट्टिदरू साधनॆय तपस्सिनल्लि श्रद्धॆयिद्दरॆ यावुदू तॊडकल्लवॆंबुदक्कॆ राजकुमार् अवर बदुकु दॊड्ड मादरियागिदॆ. अदे बगॆय परिसरदल्लि हुट्टिद नम्म नाड मक्कळिगॆ अनुकरणीयवू अनुसरणीयवू आगिदॆ.
author-1: डा. ऎच्.ऎस्. सत्यनारायण अवरु चिक्कमगळूरिनल्लि जनिसिदरु. साहित्य विमर्शॆ, ललित प्रबंध, अंकण बरहगळल्लि कृषि माडि अनेक कृतिगळन्नु रचिसिद्दारॆ. प्रस्तुत चिक्कमगळूरिन बसवनहळ्ळि बालिका सर्कारि पदवि पूर्व कालेजिनल्लि कन्नड उपन्यासकरागिद्दारॆ.
