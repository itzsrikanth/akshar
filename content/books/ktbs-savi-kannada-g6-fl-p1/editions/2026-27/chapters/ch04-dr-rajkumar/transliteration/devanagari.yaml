ex-a-q2: राजकुमार् अवर जन्मस्थळ यावुदु?
ex-a-q3: राजकुमार् अवर तंदॆ-तायि यारु?
ex-a-q4: नायक नटरागि राजकुमार्रवरु नटिसिद मॊदल चित्र यावुदु?
