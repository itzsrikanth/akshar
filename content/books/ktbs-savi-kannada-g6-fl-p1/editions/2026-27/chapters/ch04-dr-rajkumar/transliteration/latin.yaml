ex-a-q1: rājakumār avara mòdala hèsarenu?
ex-a-q2: rājakumār avara janmasthaḻa yāvudu?
ex-a-q3: rājakumār avara taṃdè-tāyi yāru?
ex-a-q4: nāyaka naṭarāgi rājakumārravaru naṭisida mòdala citra yāvudu?
ex-a-q5: yāva citrada gāyanakkè rājakumār avarigè rāṣṭra praśasti dòrètidè?
ex-a-q6: karnāṭaka sarkāra rājakumār avarigè nīḍida atyucca puraskāra yāvudu?
ex-b-q1: yāva nāṭaka kaṃpanigaḻalli rājakumārravaru abhinayisidaru?
ex-b-q2: rājakumār avaru abhinayisida bhakti pradhānavāda citragaḻāvuvu?
ex-b-q3: abhimānigaḻu rājakumārravarigè nīḍida viśeṣaṇa-birudugaḻu yāvuvu?
ex-b-q4: rājakumār avara hṛdaya saṃpannatègè òṃdèraḍu udāharaṇè nīḍi.
ex-c-q1: rājakumār avara bālya jīvanavannu paricayisi.
ex-c-q2: rājakumārravara kuṭuṃbavu calanacitra kṣetrakkè kòṭṭa kòḍugèyannu saṃkṣiptavāgi vivarisi.
ex-c-q3: yāva yāva kṣetrakkè rājakumār avara kòḍugègaḻu saṃdivèyèṃbudannu saṃgrahisi barèyiri.
ex-d-q1: mutturāya svāmiya hèsare mutturāja āyitu.
ex-d-q2: raṃgabhūmi kai bīsi karèyitu.
ex-d-q3: berè bhāṣèya citragaḻalli naṭisalu òppalilla.
ex-d-q4: śraddhèyiddarè yāvudū tòḍakalla.
