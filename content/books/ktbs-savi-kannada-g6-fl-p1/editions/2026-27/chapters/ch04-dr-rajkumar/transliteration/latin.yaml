intro-1: yāvude bagèya mūlabhūta saukaryagaḻū illadè kaḍubaḍatanadalli araḻida pratibhèyòṃdu nāḍina janara kaṇmaṇiyāguvudu, èttarada sādhanè māḍi janamānasadalli śāśvatavāgi nèlè nilluvudu sāmānyada mātalla. nāḍoja, naṭasārvabhauma ḍā. rājakumār avara baduku kūḍa iṃtaha asāmānya sādhanègè mādariyāgidè. tamma apūrva pratibhèya naṭanè, gāyana, kannaḍa paravāda ujvala prīti mattu susaṃskṛta sajjanikèya naḍavaḻikèyiṃda ḍā. rājakumār avaru namma nāḍu kaṃḍa meru vyaktitvavènisiddārè. avara badukina kèlavu vivaragaḻa avalokanadiṃda nāḍina makkaḻu sphūrtihòṃdaballarèṃbudu ī pāṭhada āśayavāgidè.
story-n1: ḍā. rājakumār avaru cāmarājanagara jillègè serida gājanūrinalli 24 epril 1929raṃdu janisidaru. siṃgānallūru mūlada śrīyuta puṭṭasvāmayyanavaru rājakumār avara taṃdè. tāyi gājanūrinavarāda śrīmati lakṣmammanavaru. ī daṃpati gaṃḍu maguvannu karuṇisèṃdu tamma iṣṭadaiva muttattirāyanigè harakè hòttiddaraṃtè. hāgāgi ā devara hèsaranne maganigè iṭṭaru. ‘rāja’ èṃbudu ‘rāya’ èṃbudara tadbhava rūpavāgiruvudariṃda ‘mutturāya’ svāmiya hèsaru ‘mutturāja’ èṃdāgiddu mātravalla kannaḍigara managèdda rājakumārane āgiddu ākasmikavalla. mutturājanòḻagina pratibhèyu vikāsagòṃḍa pari adu. maḻèyilladè kaṃgèṭṭidda nèlakkè svātiya maḻèsuridu taṃpèrèyuva tèradi joru maḻè suriyuvāga huṭṭida mutturājara jananadiṃda manèmaṃdiyèlla saṃbhramapaṭṭaru.
story-n2: bālyadalliye mutturājarigè baḍavara kaṣṭa kaṃḍu maruguva guṇavittu. śālèyalli kūtiddarū avara manassu baḍatana, hasivu, kaṣṭagaḻatta hòraḻuttittu. idaròṃdigè haḻḻigāḍina suprasannatè, suṃdara parisara, mugdha janara ācāra vicāragaḻu, haḻḻa kòḻḻa, kāḍu muṃtādavèlla mutturājara bhāvalokavannu higgisuttittu. śālèyalli kalitaddu mūranèya taragatiyavarègè mātravādarū ā vayassiniṃdale āda lokānubhavada śikṣaṇada pātra ivara vyaktitvavannu rūpisitu. ivara taṃdè puṭṭasvāmayyanavaru adbhuta raṃga kalāvidarāgiddaru. sodara māvaṃdiru sògasāda gāyakarāgiddaru. ī parisaradalli tamma bālyavannu kaḻèda mutturājarigè sahajavāgiye raṃgabhūmi kaibīsi karèyitu.
story-n3: mutturāja avaru bāla naṭanāgi kalā prapaṃcakkè kāliṭṭaru. gubbivīraṇṇanavara nāṭaka kaṃpaniyalli mòdamòdalu sakhi, sevakiyaṃtaha saṇṇapuṭṭa pātragaḻannu māḍabekāyitu. āmelè mattorva hiriya raṃgabhūmiya kalāvidarāda śrī subbayyanāyḍu avara nāṭaka kaṃpanigè seri aneka mahatvada pātragaḻannu nirvahisuttā bèḻèyuttiruvāga taṃdèyavara akālika maraṇada duḥkha èdurāyitu. iḍī kuṭuṃbavannu kāpāḍabekāda javābdāriyannu ātmaviśvāsadiṃda èdurisida mutturājaru, ī anubhava mattu abhinaya èraḍariṃdalū māgutta sāgidaru. kaṣṭada dinagaḻalliyū kalāvidana kai hiḍidu saṃsārada badukigè hègalèṇèyādavaru mutturājara sodara māvana magaḻāda pārvatammanavaru.
story-n4: bhakta prahlāda, śrīnivāsa kalyāṇadaṃtaha paurāṇika calanacitragaḻalli saṇṇapuṭṭa pātragaḻalli kāṇisikòṃḍiddarū 1954ralli tèrèkaṃḍa ‘beḍara kaṇṇappa’ èṃba citravu mutturājara badukinalli hòsa adhyāya barèyitu. ī citrada nirdeśakarāda èc.èl.èn. siṃha avaru ‘mutturāja’ èṃba hèsarannu ‘rājakumāra’ èṃdu badalāyisi, bèḻḻitèrègè paricayisidaru. tamma hèsarannu badalāyisuvudu mutturājarigè iṣṭaviralillavaṃtè. ādarè kannaḍigaru rājakumāra èṃba hèsaranne tamma hṛdaya siṃhāsanadallirisikòḻḻuvaṃtè tāvu abhinayisida pratiyòṃdu pātrakkū rājakumār jīva tuṃbidaru.
story-n5: rājakumār avaru abhinayisida bhaktipradhānavāda bhaktavijaya, ohileśvara, śrīkṛṣṇa gāruḍi, bhaktakuṃbāra, saṃta tukārāṃ, bhakta kanakadāsa muṃtāda citragaḻannu noḍida citrarasikaru rājakumār avara manojña abhinayakkè sotuhodaru. atyaṃta yaśassugaḻisida bhaktaprahlāda, mayūra, babhruvāhana, kaviratna kāḻidāsa muṃtāda citragaḻallina abhinayavaṃtū rājakumārarigè apāravāda janaprīti, kīrti, puraskāragaḻannu hòttu taṃdavu. saṃdhyārāga, sanādi appaṇṇa, jīvanacaitra, kastūri nivāsa, baṃgārada manuṣya, devatā manuṣya muṃtāda sāmājika citragaḻu kannaḍa citraraṃgadalli hòsa dākhalèyannu barèdavu. jana mèccida ‘rasikara rāja’ ènisiddu hīgè.
story-n6: tamma sògasāda kaṃṭha mattu hāḍugārikèyiṃdalū kannaḍigara manasūrègòṃḍa rājakumār avaru ‘gānagaṃdharva’ ènisidaru. ‘saṃpattigè savāl’ èṃba citradalli nāyaka èmmèya melè kuḻitu hāḍida “yāre kūgāḍali, ūre horāḍali” èṃba gītèyu dina bèḻagāguvudaròḻagè rājakumār avarannu hinnèlègāyakarannāgi paricayisitu. cikkaṃdiniṃdalū ivarigè hāḍalu baruttittu. jòtègè, nāṭakagaḻalli hāḍida anubhavavū ittu. saṃpattigè savāl citradiṃda tamma pātragaḻigè tāve hāḍalāraṃbhisida rājakumār avaru nūrāru calanacitra gītègaḻannū, sāvirāru bhaktigītègaḻannū, aneka bhāvagītègaḻannū hāḍiddārè. jīvana caitra citrada “nādamaya ī lokavèllā nādamaya” èṃba adbhuta gāyanakkāgi rāṣṭrapraśastiyannu muḍigerisikòṃḍa hirimèyū ivaradāgidè.
story-n7: naṭarāgi mātravalladè ananya kannaḍa prītigāgiyū nāḍu rājakumār avarannu sadā smarisuttadè. èṃtaha āmiṣavòḍḍidarū rājakumār avaru kannaḍa biṭṭu berè bhāṣèya citragaḻalli naṭisalu òppalilla. aṃtaha kannaḍa prīti avaradu. karnāṭakadalli kannaḍa bhāṣègè ādyatè, mānyatègaḻu dòrakabekèṃba saṃkalpadiṃdāraṃbhisida gokāk caḻuvaḻigè dhumukida rājakumār avaru kannaḍigara bhāvanèya svarūpada pratirūpadaṃtè kāṇisikòṃḍu kannaḍada horāṭakkè bala taṃdaru. tāvu abhinayisida èlla pātragaḻu āḍuva saraḻa, sògasāda kannaḍada nuḍigaḻiṃda avaru kannaḍigara èdègaḻalli savigannaḍada kaṃpu tuṃbiddannu nāvu èṃdigū marèyuvaṃtilla.
story-n8: aśakta kalāvidara nèravigāgi rājakumār avaru aneka rasasaṃjè kāryakramagaḻannu naḍèsi nèravigè baṃdiddārè. baḍatanadalli bèḻèdu baṃda avarigè hasivina, annada bèlè cènnāgi tiḻidittu. lèkkavilladaṣṭu saha kalāvidaru, taṃtrajñaru, calanacitra kārmikaru, saṃgha saṃsthègaḻu rājakumār avariṃda ārthika nèravu paḍèda udāharaṇègaḻivè. rājakumār avara karuṇāmayi hṛdaya saṃpannatègè ivu kèlavu udāharaṇègaḻu mātra.
story-n9: rājakumārara kuṭuṃbave kannaḍa citraraṃgada dòḍḍa manèyènisidè. śrīmati pārvatammanavaru citra nirmāpakarāgi vitarakarāgi dòḍḍa sādhanègaidarè, makkaḻāda rāghaveṃdra rājakumār, śivarājakumār, punīt rājakumār naṭarāgi, gāyakarāgi nāḍina janara managèddavaru. punīt rājakumār tamma bālyadalliye ‘bèṭṭada hū’ citrada amogha abhinayakkāgi rāṣṭrapraśasti paḍèdiddaru. avaru taṃdèyaṃtèye ‘karnāṭaka ratna’ ènnisida sāhasagāthè berèyade idè. rājakumār avara mòmmakkaḻū sinimā nāyakarāgiruvudu ī kalāsaṃpannatèyu mūrane talèmārigū haridu baṃdiruvudara pratīkavāgidè.
story-n10: rājakumār èṃba sammohaka pratibhègè manasota kannaḍigaru avarannu naṭa sārvabhauma, kalā kaustubha, kalā kesari, varanaṭa, rasikara rāja, gānagaṃdharva, kannaḍada kaṇmaṇi muṃtāda viśeṣaṇagaḻiṃda karèdu saṃtoṣapaṭṭarè, 1979ralli maisūru viśva vidyālayavu gaurava ḍākṭareṭ padavi nīḍi puraskarisitu. aṃdiniṃda ivaru èllara prītiya ‘ḍākṭar rājakumār’ ènisidaru. keṃdra sarkāra ivara kalāsevègè ‘padmabhūṣaṇa’ praśastiyannittu gauravisitu. jīvamānada sādhanègāgi bhārata sarkārada atyucca praśastiyāda ‘dādā sāheb phālkè praśasti’yū dòrèyitu. karnāṭaka sarkāravu “karnāṭaka ratna praśasti” nīḍitu.
story-n11: ī mòdale heḻidaṃtè baḍatanada parisaradalli huṭṭidarū sādhanèya tapassinalli śraddhèyiddarè yāvudū tòḍakallavèṃbudakkè rājakumār avara baduku dòḍḍa mādariyāgidè. ade bagèya parisaradalli huṭṭida namma nāḍa makkaḻigè anukaraṇīyavū anusaraṇīyavū āgidè.
author-1: ḍā. èc.ès. satyanārāyaṇa avaru cikkamagaḻūrinalli janisidaru. sāhitya vimarśè, lalita prabaṃdha, aṃkaṇa barahagaḻalli kṛṣi māḍi aneka kṛtigaḻannu racisiddārè. prastuta cikkamagaḻūrina basavanahaḻḻi bālikā sarkāri padavi pūrva kālejinalli kannaḍa upanyāsakarāgiddārè.
