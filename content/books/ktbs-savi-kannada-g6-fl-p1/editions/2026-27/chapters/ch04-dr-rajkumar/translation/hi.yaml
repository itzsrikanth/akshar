intro-1: बिना मूलभूत सुविधाओं के घोर गरीबी में खिली प्रतिभा राष्ट्र की आँख का तारा बने, ऊँची ऊँचाई पाकर जनमानस में स्थायी रहे—यह साधारण बात नहीं। नाडोज, नटसार्वभौम डॉ. राजकुमार का जीवन भी ऐसी असामान्य साधना का आदर्श है। दुर्लभ अभिनय, गायन, कन्नड़-प्रेम और सुसंस्कृत सज्जनता से वे हमारे नाडु की मेरू व्यक्तित्व माने जाते हैं। जीवन के कुछ विवरण देखकर नाडु के बच्चे प्रेरणा पा सकें—यही पाठ का आशय है।
story-n1: डॉ. राजकुमार का जन्म 24 अप्रैल 1929 को चामराजनगर जिले के गाजनूर में हुआ। सिंंगानल्लूर मूल के श्रीयुत् पुट्टस्वामय्या पिता, गाजनूर की श्रीमती लक्ष्मम्मा माता। दंपति ने पुत्र के लिए इष्टदेव मुत्तत्तिराय से मन्नत मांगी थी। इसलिए देवता का नाम ही रखा। ‘राज’ ‘राय’ का तद्भव होने से मुत्तुराय से मुत्तुराज—और कन्नडिगों के मन जीतने वाले राजकुमार बनना संयोग नहीं। मुत्तुराज के भीतर की प्रतिभा का विकास वही है।
story-n2: बचपन से ही मुत्तुराज को गरीबों का कष्ट देखकर करुणा आती थी। स्कूल में बैठे भी मन गरीबी-भूख-कष्ट की ओर जाता। गाँव की शांति, सुंदर परिवेश, भोले लोगों के आचार, नाले-जंगल आदि भावलोक को फैलाते। केवल तीसरी कक्षा तक पढ़े पर उस उम्र से लोकानुभव की शिक्षा ने व्यक्तित्व गढ़ा। पिता अद्भुत रंगकर्मी थे, मामा सुंदर गायक। इस परिवेश में रंगमंच ने स्वाभाविक रूप से बुलाया।
story-n3: मुत्तुराज बाल अभिनेता बन कला जगत में आए। गुब्बि वीरप्प की कंपनी में पहले सखी-सेविका जैसे छोटे पात्र। बाद में सुब्बय्यनायडु की कंपनी में महत्वपूर्ण पात्र निभाते बढ़ते समय पिता की अकाल मृत्यु का दुख आया। पूरे परिवार की जिम्मेदारी आत्मविश्वास से निभाई। कठिन दिनों में भी कलाकार का हाथ पकड़ परिवार के कंधे बनी मामा की पुत्री पार्वतम्मा।
story-n4: भक्त प्रह्लाद, श्रीनिवास कल्याण जैसे पौराणिक चित्रों में छोटे पात्रों में दिखने पर भी 1954 की बेडर कन्नप्प ने जीवन में नया अध्याय लिखा। निर्देशक एच.एल.एन. सिंह ने मुत्तुराज नाम बदलकर राजकुमार रख चांदी की पर्दे पर परिचय कराया। नाम बदलना पसंद नहीं था कहा जाता है। पर कन्नडिगों ने राजकुमार नाम हृदय-सिंहासन पर रखा तो प्रत्येक पात्र में राजकुमार ने जान डाल दी।
story-n5: भक्तिप्रधान चित्रों में उनका मनोज्ञ अभिनय देख रसिक हार गए। भक्तप्रह्लाद, मयूर, बभ्रुवाहन, कविरत्न कालिदास आदि में अपार जनप्रियता-कीर्ति-पुरस्कार आए। सामाजिक चित्रों ने कन्नड़ सिनेमा में नए रिकॉर्ड बनाए। ऐसे ‘रसिकर राज’ कहलाए।
story-n6: सुंदर कंठ और गायकी से भी मन जीते—‘गानगंधर्व’ कहलाए। संपतिगे सवाल में «यारे कूगडलि…» गीत ने उन्हें पृष्ठगायक के रूप में परिचय दिया। बचपन से गाना आता था, नाटकों में अनुभव भी। संपतिगे सवाल से स्वयं गाकर सैकड़ों चित्रगीत, हजारों भक्तिगीत गाए। जीवनचैत्र के «नादमय…» गायन के लिए राष्ट्रीय पुरस्कार भी मिला।
story-n7: केवल अभिनेता नहीं—अनन्य कन्नड़ प्रेम के लिए भी नाडु याद करता है। कोई लालच हो, कन्नड़ छोड़कर अन्य भाषा की फिल्मों में अभिनय को सहमत नहीं हुए। गोकक आंदोलन में कूदकर कन्नडिगों की भावना का स्वरूप बने और संघर्ष को बल दिया। सरल सुंदर कन्नड़ संवादों से हृदयों में सविगन्नड़ की खुशबू भरी—यह कभी नहीं भूलते।
story-n8: अशक्त कलाकारों की मदद को अनेक रससंझ्या कार्यक्रम किए। गरीबी में पले होने से भूख-अन्न का मूल्य अच्छी तरह जानते थे। अनगिनत कलाकार, तकनीशियन, फिल्म मजदूर, संघ संस्थाएँ आर्थिक मदद पाईं। करुणामय हृदय संपन्नता के ये कुछ ही उदाहरण हैं।
story-n9: राजकुमार परिवार ही कन्नड़ सिनेमा का बड़ा घर माना जाता है। श्रीमती पार्वतम्मा निर्मात्री-वितरक बन बड़ी साधना कीं; पुत्र राघवेंद्र, शिवराजकुमार, पुनीत राजकुमार अभिनेता-गायक बन मन जीते। पुनीत ने बचपन में बेट्टद हू के लिए राष्ट्रीय पुरस्कार पाया। कर्नाटक रत्न कहलाने की गाथा अलग है। पोते भी नायक हैं—यह कला संपन्नता तीसरी पीढ़ी तक बहने का प्रतीक है।
story-n10: राजकुमार नाम की सम्मोहक प्रतिभा पर मोहित कन्नडिग उन्हें नटसार्वभौम, कला कौस्तुभ आदि विशेषणों से पुकारे; 1979 में मैसूर विश्वविद्यालय ने मानद डॉक्टरेट दी। तब से सबके प्रिय ‘डॉक्टर राजकुमार’। केंद्र ने पद्मभूषण दिया। जीवनकाल साधना के लिए दादासाहेब फाल्के पुरस्कार भी मिला। कर्नाटक सरकार ने कर्नाटक रत्न दिया।
story-n11: जैसा पहले कहा—गरीबी में जन्म लेकर भी साधना की तपस्या में श्रद्धा हो तो कोई अड़चन नहीं—इसका बड़ा आदर्श राजकुमार का जीवन है। उसी परिवेश में जन्मे नाडु के बच्चों के लिए अनुकरणीय और अनुसरणीय है।
author-1: डॉ. एच.एस. सत्यनारायण का जन्म चिक्कमगलूर में हुआ। साहित्य आलोचना, ललित निबंध, कॉलम लेखन में कृतियाँ रचीं। वर्तमान में चिक्कमगलूर के बसवनहळ्ळि बालिका सरकारी पूर्वस्नातक महाविद्यालय में कन्नड़ व्याख्याता हैं।
ex-a-q1: राजकुमार का पहला नाम क्या था?
ex-a-q2: राजकुमार का जन्मस्थान कौन सा है?
ex-a-q3: राजकुमार के माता-पिता कौन थे?
ex-a-q4: नायक अभिनेता के रूप में पहली फिल्म कौन सी?
ex-a-q5: किस फिल्म के गायन पर राष्ट्रीय पुरस्कार मिला?
ex-a-q6: कर्नाटक सरकार का सर्वोच्च पुरस्कार कौन सा?
ex-b-q1: किन नाटक कंपनियों में अभिनय किया?
ex-b-q2: भक्ति प्रधान चित्र कौन से?
ex-b-q3: प्रशंसकों ने कौन से विशेषण-बिरुद दिए?
ex-b-q4: हृदय संपन्नता के एक-दो उदाहरण दीजिए।
ex-c-q1: राजकुमार के बाल जीवन का परिचय दीजिए।
ex-c-q2: परिवार का सिनेमा को योगदान संक्षेप में बताइए।
ex-c-q3: किन-किन क्षेत्रों में योगदान—संग्रह कर लिखिए।
ex-d-q1: मुत्तुराय स्वामी का नाम ही मुत्तुराज हुआ।
ex-d-q2: रंगमंच ने हाथ हिलाकर बुलाया।
ex-d-q3: अन्य भाषा की फिल्मों में अभिनय को सहमत नहीं हुए।
ex-d-q4: श्रद्धा हो तो कोई अड़चन नहीं।
