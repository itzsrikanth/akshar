intro-1: For a talent that bloomed in extreme poverty without any basic facilities to become the apple of a nation’s eye, to achieve great heights and stand permanently in people’s hearts is no ordinary matter. The life of Nadoja, Natasarvabhauma Dr Rajkumar is also a model for such uncommon achievement. Through his rare talented acting, singing, bright love for Kannada and cultured good conduct, Dr Rajkumar is regarded as a towering personality our land has seen. The hope of this lesson is that by looking at some details of his life, the children of the land may be inspired.
story-n1: Dr Rajkumar was born on 24 April 1929 in Gajanur in Chamarajanagar district. Sriyuta Puttaswamayya of Singanallur origin was Rajkumar’s father. Mother was Srimati Lakshmamma of Gajanur. This couple had vowed to their chosen deity Muttattiraya for the gift of a son. So they gave the child that god’s name. Since ‘Raja’ is a tadbhava form of ‘Raya’, the name Muttaraya becoming Muttaraja—and that becoming the Rajkumar who captured Kannadigas’ hearts—is no accident. It is how the talent within Muttaraja flowered. When rainless land was wilted and Swati rain poured coolness, when heavy rain fell, Muttaraja’s birth filled the whole household with joy.
story-n2: Even in childhood Muttaraja had the nature of pitying the poor’s hardship. Though sitting in school his mind turned toward poverty, hunger and hardship. Along with that the village’s calm beauty, innocent people’s ways, streams, forests and so on expanded Muttaraja’s world of feeling. Though he studied only up to the third class, from that age the education of worldly experience shaped his personality. His father Puttaswamayya was a wonderful stage artist. Maternal uncles were fine singers. Growing in this environment, the stage naturally beckoned Muttaraja.
story-n3: Muttaraja entered the world of art as a child actor. In Gubbi Veeranna’s theatre company he first had to do small roles like companion and maid. Later joining the company of senior stage artist Sri Subbayya Naidu and growing by playing many important roles, he faced the sorrow of his father’s untimely death. With self-confidence he faced the duty of protecting the whole family and matured through both experience and acting. Even in hard days, Parvathamma, daughter of Muttaraja’s maternal uncle, held the artist’s hand and became a shoulder for family life.
story-n4: Though he had appeared in small roles in mythological films like Bhakta Prahlada and Srinivasa Kalyanam, the 1954 film Bedara Kannappa wrote a new chapter in Muttaraja’s life. Director H.L.N. Simha changed the name ‘Muttaraja’ to ‘Rajkumar’ and introduced him to the silver screen. Changing his name was not to Muttaraja’s liking, it is said. But as Kannadigas placed the name Rajkumar on the throne of their hearts, Rajkumar filled life into every role he played.
story-n5: Film lovers who saw Rajkumar’s devotion-centred films such as Bhakta Vijaya, Ohileshwara, Srikrishna Garudi, Bhakta Kumbara, Santa Tukaram and Bhakta Kanakadasa were captivated by his charming acting. Acting in highly successful films such as Bhakta Prahlada, Mayura, Babhruvahana and Kavirathna Kalidasa brought him immense public love, fame and awards. Social films such as Sandhyaraga, Sanadi Appanna, Jeevana Chaitra, Kasturi Nivasa, Bangarada Manushya and Devatha Manushya set new records in Kannada cinema. Thus he came to be called ‘Rasikara Raja’, the king of connoisseurs.
story-n6: Through his fine voice and singing too Rajkumar captured Kannadigas’ hearts and was called ‘Gana Gandharva’. In the film Sampathige Saval the song “Yare Koogadali, Ure Horadali” sung by the hero sitting on a buffalo introduced Rajkumar as a playback singer before daybreak. He could sing from childhood and had stage-singing experience too. From Sampathige Saval he began singing for his own roles and has sung hundreds of film songs, thousands of devotionals and many lyric songs. For the wonderful singing of “Nadamaya Ee Lokavella Nadamaya” in Jeevana Chaitra he also earned the honour of a national award.
story-n7: Not only as an actor but for unmatched love of Kannada the land always remembers Rajkumar. Whatever temptation was offered, Rajkumar would not agree to act in films of other languages leaving Kannada. Such was his love of Kannada. Joining the Gokak movement begun with the resolve that Kannada should get priority and recognition in Karnataka, Rajkumar appeared as the embodiment of Kannadigas’ feeling and gave strength to the Kannada struggle. Through the simple elegant Kannada spoken by all the roles he played he filled Kannadigas’ hearts with the fragrance of sweet Kannada—something we can never forget.
story-n8: To help weak artists Rajkumar conducted many evening programmes of art. Having grown in poverty he knew well the value of hunger and food. Countless artists, technicians, film workers and organisations have received financial help from him. These are only a few examples of Rajkumar’s compassionate rich heart.
story-n9: Rajkumar’s family itself is called a great house of Kannada cinema. Srimati Parvathamma achieved much as producer and distributor; sons Raghavendra Rajkumar, Shivarajkumar and Puneeth Rajkumar won the land’s hearts as actors and singers. Puneeth Rajkumar in childhood itself received a national award for his wonderful acting in Bettada Hoo. His saga of being called ‘Karnataka Ratna’ like his father is another story. That Rajkumar’s grandchildren too are film heroes is a sign that this artistic richness has flowed to the third generation.
story-n10: Kannadigas captivated by the magnetic talent called Rajkumar happily called him Natasarvabhauma, Kala Kaustubha, Kala Kesari, Varanata, Rasikara Raja, Gana Gandharva, Kannada’s apple of the eye and other epithets; in 1979 the University of Mysore honoured him with an honorary doctorate. From then he became everyone’s beloved ‘Doctor Rajkumar’. The central government honoured his art service with the Padma Bhushan. For lifetime achievement he also received the nation’s highest cinema honour, the Dadasaheb Phalke Award. The Karnataka government gave the Karnataka Ratna award.
story-n11: As said earlier, Rajkumar’s life is a great model that if there is faith in the austerity of achievement, nothing is an obstacle even if one is born in poverty. For the children of our land born in similar surroundings it is both worthy of imitation and of following.
author-1: Dr H.S. Satyanarayana was born in Chikkamagaluru. He has worked in literary criticism, light essays and columns and written many works. At present he is a Kannada lecturer at Basavanahalli Balika Government Pre-University College, Chikkamagaluru.
