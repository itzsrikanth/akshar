  exercise-C: ಇ. ಈ ಪದ್ಯದ ಸಾರಾಂಶವನ್ನು ನಿಮ್ಮ ಮಾತುಗಳಲ್ಲಿ ಬರೆಯಿರಿ.
  exercise-D: ಈ. ಕೆಳಗಿನ ಪದ್ಯಭಾಗವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿರಿ.
segments:
- id: intro-1
  type: prose
  text: ಹೊಸಗನ್ನಡ ಸಾಹಿತ್ಯವು ನವೋದಯ, ಪ್ರಗತಿಶೀಲ, ದಲಿತ-ಬಂಡಾಯ, ಮಹಿಳಾ ಸಾಹಿತ್ಯ ಎಂಬ ವಿವಿಧ ದೃಷ್ಟಿಕೋನಗಳಲ್ಲಿ ಬೆಳೆದು ಬಂದಿದೆ. ದಲಿತರು ತಮ್ಮ ಬದುಕಿನ ಶೋಷಣೆ ನೋವುಗಳನ್ನು ಹಾಡಾಗಿ ಹೊಮ್ಮಿಸಿದ್ದೆ ದಲಿತ ಸಾಹಿತ್ಯ. ಸ್ವಾತಂತ್ರ್ಯ, ಸಂವಿಧಾನ ಬಂದರೂ ನಮ್ಮ ಬದುಕು ಇನ್ನೂ ಬದಲಾಗಲಿಲ್ಲ ಎಂಬ ನೋವಿದೆ. ಬದಲಾವಣೆಯ ಗಾಳಿ ಬೀಸಲಿ ಬದುಕು ಹಸನಾಗಲಿ ಎಂಬ ಆಶಯವನ್ನು ಈ ಕವಿತೆ ಹೊಂದಿದೆ.
  section: intro
- id: poem-s1l1
  type: poem_line
  text: ನೀ ಹೋದ ಮರುದಿನ ಮೊದಲಂಗೆ ನಮ ಬದುಕು
  section: poem
  stanza: 1
- id: poem-s1l2
  type: poem_line
  text: ಆಗ್ಯಾದೋ ಬಾಬಾ ಸಾಹೇಬ
  section: poem
  stanza: 1
- id: poem-s1l3
  type: poem_line
  text: ನಿನ್ನಂಗ ದುಡಿದವರು ಕಳಕಳಿಯ ಪಡುವವರು
  section: poem
  stanza: 1
- id: poem-s1l4
  type: poem_line
  text: ಇನ್ನುತನ ಬರಲಿಲ್ಲ ಒಬ್ಬ
  section: poem
  stanza: 1
- id: poem-s2l1
  type: poem_line
  text: ಪ್ರತಿನಿತ್ಯ ಎದ್ದಾಗ ನಮಸುದ್ದಿ ಸಂಭ್ರಮವು
  section: poem
  stanza: 2
- id: poem-s2l2
  type: poem_line
  text: ದೇಕುವುದು ತಪ್ಪಿಲ್ಲ ನಮಗ
  section: poem
  stanza: 2
- id: poem-s2l3
  type: poem_line
  text: ಹೋದ ಹೋದಲ್ಲೆಲ್ಲ ಮೇಲವರ ಆಟಗಳು
  section: poem
  stanza: 2
- id: poem-s2l4
  type: poem_line
  text: ಉರಿಹಚ್ಚಿ ಬಿಡುತಾರ ಒಳಗ
  section: poem
  stanza: 2
- id: poem-s3l1
  type: poem_line
  text: ಎಲ್ಲಿ ಕೇಳಿದರಲ್ಲಿ ಬೂಟುಗಾಲಿನ ಸದ್ದು
  section: poem
  stanza: 3
- id: poem-s3l2
  type: poem_line
  text: ತರತರದ ನೋವುಗಳು ನಮಗ
  section: poem
  stanza: 3
- id: poem-s3l3
  type: poem_line
  text: ತಮ್ಮಂಗ ಇರದಿದ್ರೆ ತಲೆ ಕಡಿದು ಹಾಕುವರು
  section: poem
  stanza: 3
- id: poem-s3l4
  type: poem_line
  text: ಹೆಸರೀಗೆ ಸ್ವಾತಂತ್ರ್ಯ ನಮಗ
  section: poem
  stanza: 3
- id: poem-s4l1
  type: poem_line
  text: ಕೈಕಾಲು ಕಿವಿ ಮೂಗು ಮೈ ಮನಸು ತಲೆ ಕಣ್ಣು
  section: poem
  stanza: 4
- id: poem-s4l2
  type: poem_line
  text: ಕಳಕೊಂಡ ಬರಡು ಗಿಡ ನಾವು
  section: poem
  stanza: 4
- id: poem-s4l3
  type: poem_line
  text: ಮೈ ತುಂಬ ಮನತುಂಬ ಸಿಕ್ಕವರ ಮುಖಮುದ್ರೆ
  section: poem
  stanza: 4
- id: poem-s4l4
  type: poem_line
  text: ಚೀರಾಟ ಹಾರಟ ಸಾವೋ
  section: poem
  stanza: 4
- id: poem-s5l1
  type: poem_line
  text: ಹೋಗ್ಬಾರೋ ದಾರಿಯಲಿ ಅಡುಗಲ್ಲುಗಳು ಸೇರಿ
  section: poem
  stanza: 5
- id: poem-s5l2
  type: poem_line
  text: ಮುಳಕಲ್ಲು ಹಾಸ್ಯಾವೊ ಪೂರ
  section: poem
  stanza: 5
- id: poem-s5l3
  type: poem_line
  text: ಹೆಚ್ಚಿಗೆ ಬೆಳೆದವರ ಉಳಿದವರ ಜೀವಗಳ
  section: poem
  stanza: 5
- id: poem-s5l4
  type: poem_line
  text: ಹಗಲಾಗ ಹೊಡೆದಾರ ಟಾರಾ
  section: poem
  stanza: 5
- id: poem-s6l1
  type: poem_line
  text: ಎಷ್ಟಂತ ಉರಿತಾರ ಎಷ್ಟಂತ ಹರಿತಾರ
  section: poem
  stanza: 6
- id: poem-s6l2
  type: poem_line
  text: ತಾಳದಕ್ಕೂ ಮಿತಿಯುಂಟು ಇಲ್ಲಿ
  section: poem
  stanza: 6
- id: poem-s6l3
  type: poem_line
  text: ತಾಳಿ ತಾಳಿಯೂ ಒಮ್ಮೆ ಚೇಳಾಗಿ ಕುಟುಕುವನು
  section: poem
  stanza: 6
- id: poem-s6l4
  type: poem_line
  text: ಸಾಮಾನ್ಯನಲ್ಲೋ ಬಡಜೀವಿ
  section: poem
  stanza: 6
- id: poem-s7l1
  type: poem_line
  text: ದುಡಿದುಡಿದು ಹುಟ್ಟಿರಲು ಕತ್ತಲಿರುವಾ ತನಕ
  section: poem
  stanza: 7
- id: poem-s7l2
  type: poem_line
  text: ಕೊತ್ತಿಗಳು ಹೊತ್ಯಾವ ಜೋರಾ
  section: poem
  stanza: 7
- id: poem-s7l3
  type: poem_line
  text: ರೋಡಿಗಿದ್ದವರೆಲ್ಲಾ ಗ್ವಾಡ್ಯಾಗ ಕುಂತಾರ
  section: poem
  stanza: 7
- id: poem-s7l4
  type: poem_line
  text: ಇನ್ನಿಲ್ಲ ನಮ ದಾರಿ ದೂರ
  section: poem
  stanza: 7
- id: poem-s8l1
  type: poem_line
  text: ಬಾಬಾ ಸಾಹೇಬರೇನು ಹುಚ್ಚರಲ್ಲವೇ ಅಲ್ಲ
  section: poem
  stanza: 8
- id: poem-s8l2
  type: poem_line
  text: ಗಾಂಧಿಜೊತೆ ಇರಲಿಲ್ಲ ಸುಮ್ಮ
  section: poem
  stanza: 8
- id: poem-s8l3
  type: poem_line
  text: ಅಷ್ಟು ಒದ್ದಾಡಿದಕೆ ಇಂಗೈತೆ ನಮ್ ಬದುಕು
  section: poem
  stanza: 8
- id: poem-s8l4
  type: poem_line
  text: ತಿಳಿಯೀತೆ ಈಗ್ಲಾದ್ರೂ ತಮ್ಮ
  section: poem
  stanza: 8
- id: author-1
  type: prose
  text: ಡಾ. ಚೆನ್ನಣ್ಣ ವಾಲೀಕಾರರವರು 1943 ಏಪ್ರಿಲ್ 6 ರಂದು ಕಲ್ಬುರ್ಗಿ ಜಿಲ್ಲೆಯ ಚಿತ್ತಾಪುರ ತಾಲ್ಲೂಕಿನ ಶಂಕರವಾಡಿಯಲ್ಲಿ ಜನಿಸಿದರು. ದಲಿತ-ಬಂಡಾಯ ಹಿನ್ನೆಲೆಯಲ್ಲಿ ಅನೇಕ ಕವನ ಸಂಕಲನಗಳು, ಕಥಾಸಂಕಲನಗಳು, ಮಹಾಕಾವ್ಯಗಳು ಮತ್ತು ನಾಟಕಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಪ್ರಸ್ತುತ ಕವಿತೆಯನ್ನು ಇವರ ‘ಸಮಗ್ರ ಕಾವ್ಯ ಸಂಪುಟ’ದಿಂದ ಆರಿಸಿಕೊಳ್ಳಲಾಗಿದೆ. ಡಾ. ಚೆನ್ನಣ್ಣ ವಾಲೀಕಾರರವರು 23.11.2019 ರಂದು ನಿಧನರಾಗಿದ್ದಾರೆ.
  section: author
