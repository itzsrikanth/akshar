ex-a-q1: yāru hoda melè namma baduku mòdalinaṃtè āgidè èṃdu kavi heḻiddārè?
ex-a-q2: kavi yāvudu pratinitya tappilla namagè èṃdiddārè?
ex-a-q3: kavi enannu kaḻèdukòṃḍa baraḍu giḍa nāvu èṃdiddārè?
ex-a-q4: tāḻi tāḻi òmmè enāgi kuṭukuvanu?
ex-a-q5: ‘nī hoda marudina’ padyavannu barèdavaru yāru?
ex-b-q1: svātaṃtrya
ex-b-q2: baduku
ex-b-q3: saṃbhrama
ex-b-q4: kuṭuku
