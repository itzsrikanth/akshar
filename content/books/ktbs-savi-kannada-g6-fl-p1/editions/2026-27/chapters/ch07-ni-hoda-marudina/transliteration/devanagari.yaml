intro-1: हॊसगन्नड साहित्यवु नवोदय, प्रगतिशील, दलित-बंडाय, महिळा साहित्य ऎंब विविध दृष्टिकोनगळल्लि बॆळॆदु बंदिदॆ. दलितरु तम्म बदुकिन शोषणॆ नोवुगळन्नु हाडागि हॊम्मिसिद्दॆ दलित साहित्य. स्वातंत्र्य, संविधान बंदरू नम्म बदुकु इन्नू बदलागलिल्ल ऎंब नोविदॆ. बदलावणॆय गाळि बीसलि बदुकु हसनागलि ऎंब आशयवन्नु ई कवितॆ हॊंदिदॆ.
poem-s1l1: नी होद मरुदिन मॊदलंगॆ नम बदुकु
poem-s1l2: आग्यादो बाबा साहेब
poem-s1l3: निन्नंग दुडिदवरु कळकळिय पडुववरु
poem-s1l4: इन्नुतन बरलिल्ल ऒब्ब
poem-s2l1: प्रतिनित्य ऎद्दाग नमसुद्दि संभ्रमवु
poem-s2l2: देकुवुदु तप्पिल्ल नमग
poem-s2l3: होद होदल्लॆल्ल मेलवर आटगळु
poem-s2l4: उरिहच्चि बिडुतार ऒळग
poem-s3l1: ऎल्लि केळिदरल्लि बूटुगालिन सद्दु
poem-s3l2: तरतरद नोवुगळु नमग
poem-s3l3: तम्मंग इरदिद्रॆ तलॆ कडिदु हाकुवरु
poem-s3l4: हॆसरीगॆ स्वातंत्र्य नमग
poem-s4l1: कैकालु किवि मूगु मै मनसु तलॆ कण्णु
poem-s4l2: कळकॊंड बरडु गिड नावु
poem-s4l3: मै तुंब मनतुंब सिक्कवर मुखमुद्रॆ
poem-s4l4: चीराट हारट सावो
poem-s5l1: होग्बारो दारियलि अडुगल्लुगळु सेरि
poem-s5l2: मुळकल्लु हास्यावॊ पूर
poem-s5l3: हॆच्चिगॆ बॆळॆदवर उळिदवर जीवगळ
poem-s5l4: हगलाग हॊडॆदार टारा
poem-s6l1: ऎष्टंत उरितार ऎष्टंत हरितार
poem-s6l2: ताळदक्कू मितियुंटु इल्लि
poem-s6l3: ताळि ताळियू ऒम्मॆ चेळागि कुटुकुवनु
poem-s6l4: सामान्यनल्लो बडजीवि
poem-s7l1: दुडिदुडिदु हुट्टिरलु कत्तलिरुवा तनक
poem-s7l2: कॊत्तिगळु हॊत्याव जोरा
poem-s7l3: रोडिगिद्दवरॆल्ला ग्वाड्याग कुंतार
poem-s7l4: इन्निल्ल नम दारि दूर
poem-s8l1: बाबा साहेबरेनु हुच्चरल्लवे अल्ल
poem-s8l2: गांधिजॊतॆ इरलिल्ल सुम्म
poem-s8l3: अष्टु ऒद्दाडिदकॆ इंगैतॆ नम् बदुकु
poem-s8l4: तिळियीतॆ ईग्लाद्रू तम्म
author-1: डा. चॆन्नण्ण वालीकाररवरु 1943 एप्रिल् 6 रंदु कल्बुर्गि जिल्लॆय चित्तापुर ताल्लूकिन शंकरवाडियल्लि जनिसिदरु. दलित-बंडाय हिन्नॆलॆयल्लि अनेक कवन संकलनगळु, कथासंकलनगळु, महाकाव्यगळु मत्तु नाटकगळन्नु रचिसिद्दारॆ. प्रस्तुत कवितॆयन्नु इवर ‘समग्र काव्य संपुट’दिंद आरिसिकॊळ्ळलागिदॆ. डा. चॆन्नण्ण वालीकाररवरु 23.11.2019 रंदु निधनरागिद्दारॆ.
