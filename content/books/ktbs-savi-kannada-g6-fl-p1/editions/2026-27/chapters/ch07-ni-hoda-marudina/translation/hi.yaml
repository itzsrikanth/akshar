  exercise-A: अ. प्रश्नों के उत्तर दीजिए।
  exercise-B: आ. अपने वाक्यों में प्रयोग कीजिए।
  exercise-C: इ. सार अपने शब्दों में लिखिए।
  exercise-D: ई. पद्य भाग पूरा कीजिए।
intro-1: नवोदय, प्रगतिशील, दलित-बंडाय, महिला साहित्य जैसी दृष्टियों से होसगन्नड़ साहित्य बढ़ा है। दलितों ने जीवन के शोषण-दर्द को गीत बनाकर जो उभारा वही दलित साहित्य है। स्वतंत्रता और संविधान आने पर भी जीवन नहीं बदला—यह दर्द है। परिवर्तन की हवा चले, जीवन सुधरे—यह आशय इस कविता में है।
poem-s1l1: तुम्हारे जाने के अगले दिन हमारा जीवन पहले जैसा
poem-s1l2: हो गया बाबा साहेब
poem-s1l3: तुम्हारे जैसे मेहनती, करुणा वाले
poem-s1l4: और कोई नहीं आया
poem-s2l1: प्रतिदिन उठते ही हमारी खबर और उत्साह
poem-s2l2: हमारे लिए जलना नहीं चूकता
poem-s2l3: जहाँ-जहाँ गए, ऊपर वालों के खेल
poem-s2l4: अंदर आग लगा देते
poem-s3l1: जहाँ सुना वहाँ जूतों की आहट
poem-s3l2: तरह-तरह के दर्द हमें
poem-s3l3: अपनों में न हो तो सिर काट डालते
poem-s3l4: हमें स्वतंत्रता का यही नाम
poem-s4l1: हाथ पैर कान नाक तन मन सिर आँखें
poem-s4l2: इन्हें खोया बंजर पौधा हम
poem-s4l3: तन-मन भरे दूसरों की मुहरों से
poem-s4l4: चीखें उड़ानें मौत
poem-s5l1: मत जाओ—राह में पत्थर जुटे
poem-s5l2: काँटे-पत्थर बिछे पूरे
poem-s5l3: जो बढ़ गए वे बाकियों की जान
poem-s5l4: दिन में डामर की तरह पीटते
poem-s6l1: कितना जलाते कितना काटते
poem-s6l2: सहन की भी सीमा है यहाँ
poem-s6l3: सहन-सहन कर कभी बिच्छू बन डंक मारता
poem-s6l4: गरीब प्राणी साधारण नहीं
poem-s7l1: जन्म से अँधेरे तक मेहनत
poem-s7l2: बिल्लियाँ जोर से चिल्लातीं
poem-s7l3: सड़क वाले सब बाड़े में बैठे
poem-s7l4: हमारी राह अब दूर नहीं
poem-s8l1: बाबा साहेब पागल नहीं थे न?
poem-s8l2: गांधी के साथ चुप नहीं बैठे
poem-s8l3: इतनी जद्दोजहद पर क्या जीवन अंग्रेज़ी जैसा?
poem-s8l4: क्या अब भी वे समझेंगे
author-1: डॉ. चेन्नण्णा वालीकार का जन्म 6 अप्रैल 1943 को कलबुर्गी जिले के चित्तापुर तालुक के शंकरवाड़ी में हुआ। दलित-बंडाय पृष्ठभूमि में अनेक काव्य, कथा, महाकाव्य और नाटक लिखे। यह कविता उनके ‘समग्र काव्य संपुट’ से ली गई। 23.11.2019 को निधन हुआ।
