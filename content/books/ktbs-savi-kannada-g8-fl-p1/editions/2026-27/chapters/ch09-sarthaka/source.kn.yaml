- id: author-1
  type: prose
  section: author
  text: ಹೊಸಗನ್ನಡ ಸಾಹಿತ್ಯದಲ್ಲಿ ಚುಟುಕು ಬ್ರಹ್ಮನೆಂದು ಪ್ರಖ್ಯಾತರಾದವರು ದಿನಕರ ದೇಸಾಯಿಯವರು (1909). ಉತ್ತರ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಅಂಕೋಲ ತಾಲ್ಲೂಕಿನ ಅಲಗೇರಿ ಎಂಬ ಪುಟ್ಟ ಹಳ್ಳಿಯವರು. ತಂದೆ ದತ್ತಾತ್ರೇಯ ದೇಸಾಯಿ ಶಾಲಾ ಮಾಸ್ತರು. ತಾಯಿ ಅಂಬಿಕಾ. ಮೈಸೂರಿನಲ್ಲಿ ಬಿ.ಎ. ಪದವಿಯನ್ನು ಪಡೆದ ಇವರು ಮುಂಬೈನ ಸೈಂಟ್ ಝೇವಿಯರ್ ಕಾಲೇಜಿನಲ್ಲಿ ಎಂ.ಎ. ಪದವಿಯನ್ನು ಪಡೆದರು. ವಿವಿಧ ಸಂಘಟನೆಗಳ ಸಂಘಟಕರಾಗಿ, ಪತ್ರಿಕಾ ವರದಿಗಾರರಾಗಿ, ಸಂಸದರಾಗಿ ದುಡಿದು ನವೆಂಬರ್ 6, 1982 ರಲ್ಲಿ ಇಹಲೋಕ ತ್ಯಜಿಸಿದರು. ಇವರ ಪ್ರಮುಖ ಕೃತಿಗಳು ಹೂಗೊಂಚಲು, ತರುಣರ ದಸರೆ, ಕಡಲ ಕನ್ನಡ, ದಿನಕರನ ಚೌಪದಿ, ನಾಕಂಡ ಪಡುವಣ (ಪ್ರವಾಸ ಸಾಹಿತ್ಯ) ಹೀಗೆ 12 ಕೃತಿಗಳನ್ನು ರಚಿಸಿದ್ದಾರೆ. ಇವರ ದಿನಕರನ ಚೌಪದಿ ಕೃತಿಗೆ ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪುರಸ್ಕಾರ ದೊರೆತಿದೆ.
- id: ex-a-q1
  type: question
  exercise: A
  text: ಗಾಳಿಯಲ್ಲಿ ಬೂದಿಯನ್ನು ತೂರಿದಾಗ ಎಲ್ಲಿ ಬೀಳುತ್ತದೆ?
- id: ex-a-q2
  type: question
  exercise: A
  text: ಬೂದಿಯನ್ನು ಹೊಳೆಯಲ್ಲಿ ಹರಿಯಬಿಟ್ಟಾಗ ಯಾರಿಗೆ ಸಿಗುತ್ತದೆ?
- id: ex-a-q3
  type: question
  exercise: A
  text: ದೇಹ ಏಕೆ ವ್ಯರ್ಥವಾಗಿದೆ?
- id: ex-a-q4
  type: question
  exercise: A
  text: ಬೂದಿಯನ್ನು ಕೊಳದಲ್ಲಿ ಬಿಡುವುದರಿಂದ ಬದುಕು ಧನ್ಯವಾಗುವುದು ಹೇಗೆ? ವಿವರಿಸಿ.
- id: ex-a-q5
  type: question
  exercise: A
  text: ಸಾರ್ಥಕ ಪದ್ಯದ ಯಾವ ಅಂಶಗಳನ್ನು ನೀವು ಮೆಚ್ಚುವಿರಿ?
