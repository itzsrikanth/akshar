labels:
  poem: कविता
  author: कृतिकार परिचय
  exercise-A: अ. निम्नलिखित प्रश्नों के उत्तर दीजिए।
poem-s1l1: मेरे शरीर की राख हवा में बिखेर दो,
poem-s1l2: 'जहाँ धान उगता है वहाँ गिरने दो:'
poem-s1l3: राख-खाद से जब एक बाल उगे,
poem-s1l4: मृत्यु में भी जन्म धन्य हो गया
poem-s2l1: मेरे शरीर की राख को नदी में बहने दो
poem-s2l2: मछली के मुँह में तैरकर गिरे;
poem-s2l3: मुट्ठी भर राख खाकर मछली पुष्ट हो
poem-s2l4: मृत्यु में भी जन्म धन्य हो गया
poem-s3l1: मेरे शरीर की राख को तालाब में जमने दो
poem-s3l2: जहाँ कमल प्रतिदिन खिलता है;
poem-s3l3: राख कीचड़ से मिलकर नया पंकज खिले,
poem-s3l4: मृत्यु में भी जन्म धन्य हो गया
poem-s4l1: मरने के बाद भी शरीर सेवा के लिए खड़ा रहे,
poem-s4l2: आज यह नरजन्म सेवा ही है
poem-s4l3: अपने स्वार्थ को याद कर शरीर व्यर्थ हो गया,
poem-s4l4: सच्ची सेवा करने के लिए आगे आए।
author-1: दिनकर देसाई (1909), आधुनिक कन्नड़ साहित्य में चुटुकु ब्रह्म कहे जाने वाले कवि, उत्तर कन्नड़ ज़िले के अंकोला तालुक के अलगेरी गाँव के थे। उन्होंने मैसूर में बी.ए. और मुंबई के सेंट ज़ेवियर कॉलेज में एम.ए. किया। संगठनकर्ता, पत्रकार और सांसद रहे; 6 नवंबर 1982 को निधन हुआ।
ex-a-q1: हवा में राख बिखेरने पर वह कहाँ गिरती है?
ex-a-q2: राख को नदी में बहाने पर वह किसे मिलती है?
ex-a-q3: शरीर व्यर्थ क्यों हो गया है?
ex-a-q4: तालाब में राख छोड़ने से जीवन कैसे धन्य होता है? समझाइए।
ex-a-q5: सार्थक कविता के किन अंशों की आप प्रशंसा करते हैं?
