labels:
  poem: पद्य
  author: कृतिकारर परिचय
  exercise-A: अ. कॊट्टिरुव प्रश्नॆगळिगॆ उत्तरिसि.
poem-s1l1: नन्न देहद बूदि - गाळियलि तूरिबिडि,
poem-s1l2: 'होगि बीळलि भत्त बॆळॆयुवल्लि:'
poem-s1l3: बूदि-गॊब्बरदिंद तॆनॆयॊंदु नॆगॆदुबरॆ,
poem-s1l4: धन्यवायितु हुट्टु साविनल्लि
poem-s2l1: नन्न देहद बूदि-हॊळॆयल्लि हरिय बिडि
poem-s2l2: तेलि बीळलि मीन बायियल्लि;
poem-s2l3: मुष्टि बूदिय तिंदु - पुष्टवागलु मीनु
poem-s2l4: धन्यवायितु हुट्टु साविनल्लि
poem-s3l1: नन्न देहद बूदि-कॊळदल्लि बीगि बिडि
poem-s3l2: तावरॆयु दिनदिनवू अरळुवल्लि;
poem-s3l3: बूदि कॆसरनु कूडि हॊस पंकजवु मूडॆ,
poem-s3l4: धन्यवायितु हुट्टु साविनल्लि
poem-s4l1: सत्तमेलादरू देह सेवॆगॆ निललि,
poem-s4l2: इंदिगी नरजन्म सेवॆयॆंदु
poem-s4l3: तन्न स्वार्थव नॆनॆदु व्यर्थवागिदॆ देह,
poem-s4l4: निजसेवॆ गैयलिकॆ बरलि मुंदु.
author-1: हॊसगन्नड साहित्यदल्लि चुटुकु ब्रह्मनॆंदु प्रख्यातरादवरु दिनकर देसायियवरु (1909). उत्तर कन्नड जिल्लॆय अंकोल ताल्लूकिन अलगेरि ऎंब पुट्ट हळ्ळियवरु. तंदॆ दत्तात्रेय देसायि शाला मास्तरु. तायि अंबिका. मैसूरिनल्लि बि.ऎ. पदवियन्नु पडॆद इवरु मुंबैन सैंट् झेवियर् कालेजिनल्लि ऎं.ऎ. पदवियन्नु पडॆदरु. विविध संघटनॆगळ संघटकरागि, पत्रिका वरदिगाररागि, संसदरागि दुडिदु नवॆंबर् 6, 1982 रल्लि इहलोक त्यजिसिदरु. इवर प्रमुख कृतिगळु हूगॊंचलु, तरुणर दसरॆ, कडल कन्नड, दिनकरन चौपदि, नाकंड पडुवण (प्रवास साहित्य) हीगॆ 12 कृतिगळन्नु रचिसिद्दारॆ. इवर दिनकरन चौपदि कृतिगॆ कर्नाटक साहित्य अकाडॆमि पुरस्कार दॊरॆतिदॆ.
ex-a-q1: गाळियल्लि बूदियन्नु तूरिदाग ऎल्लि बीळुत्तदॆ?
ex-a-q2: बूदियन्नु हॊळॆयल्लि हरियबिट्टाग यारिगॆ सिगुत्तदॆ?
ex-a-q3: देह एकॆ व्यर्थवागिदॆ?
ex-a-q4: बूदियन्नु कॊळदल्लि बिडुवुदरिंद बदुकु धन्यवागुवुदु हेगॆ? विवरिसि.
ex-a-q5: सार्थक पद्यद याव अंशगळन्नु नीवु मॆच्चुविरि?
