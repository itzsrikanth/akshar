  author: ಕೃತಿಕಾರರ ಪರಿಚಯ
  ashaya: ಆಶಯ
  vocab: ಪದಗಳ ಅರ್ಥ
  notes: ಟಿಪ್ಪಣಿ
  exercise-A: ಅ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-B: ಆ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು-ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-C: ಇ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ನಾಲ್ಕು-ಐದು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-D: ಈ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎಂಟು-ಹತ್ತು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-E: ಉ. ಸಂದರ್ಭಸಹಿತ ಸ್ವಾರಸ್ಯವನ್ನು ವಿವರಿಸಿ.
  exercise-F: ಊ. ಬಿಟ್ಟ ಸ್ಥಳಗಳನ್ನು ಸೂಕ್ತ ಉತ್ತರಗಳಿಂದ ತುಂಬಿರಿ.
segments:
- id: intro-1
  type: prose
  section: intro
  text: ಬಹಳ ಜನಪ್ರಿಯ ಸಾಹಿತ್ಯ ಪ್ರಕಾರಗಳಲ್ಲಿ ಸಣ್ಣ ಕಥೆಯೂ ಒಂದು. ಕಥೆಯನ್ನು ಹೇಳುವುದು ಹಾಗೂ ಕೇಳುವುದು ಮಾನವನ ಹುಟ್ಟುಗುಣ. ನಮ್ಮ ಹಿರಿಯರು ತಮ್ಮ ಮಕ್ಕಳಲ್ಲಿ ಆಸಕ್ತಿ ಕೆರಳಿಸಿ ಕುತೂಹಲ ಉಂಟುಮಾಡಲು, ಮನಸ್ಸಿಗೆ ಮುದ ನೀಡಲು ಮನಸ್ಸನ್ನರಳಿಸುವ ಕಥೆಗಳನ್ನು ಹೇಳುತ್ತಿದ್ದರು.
- id: intro-2
  type: prose
  section: intro
  text: ಈ ಕಥನ ಕಲೆಯು ವಿಸ್ತಾರಗೊಂಡು ಕೆಲವು ಸಾಹಿತಿಗಳು ವಸ್ತು, ಶೈಲಿ, ನಿರೂಪಣೆಗಳೆಲ್ಲದರಲ್ಲಿಯೂ ಪರಿಣಾಮಕಾರಿಯಾದ ಮಾರ್ಪಾಡುಗಳನ್ನು ಮಾಡಿ ಸಣ್ಣಕಥೆ ಎಂಬ ಸಾಹಿತ್ಯ ಪ್ರಕಾರವನ್ನು ಪ್ರಚುರಗೊಳಿಸಿದರು ಮತ್ತು ಸಂಕ್ಷಿಪ್ತತೆ, ವಾಸ್ತವತೆಗಳು ಇದರ ಗುಣಗಳಾಗಿವೆ. ಶಿಕ್ಷಣ, ಬದುಕಿನ ಏಳುಬೀಳುಗಳು, ಸ್ವಉದ್ಯೋಗ, ವಿಜ್ಞಾನ ಮೊದಲಾದವುಗಳು ಸಣ್ಣಕಥೆಗೆ ವಸ್ತುಗಳಾಗಿವೆ. ಪ್ರಸ್ತುತ ಕಥೆಯಲ್ಲಿ ಬಹು ಮುಖ್ಯವಾಗಿ ಇಂದು ವಿನಾಶದ ಅಂಚಿನಲ್ಲಿರುವ ಗುಡಿಕೈಗಾರಿಕೆಗೆ ನಮ್ಮ ಶಿಕ್ಷಣದಲ್ಲಿ ನೀಡಬೇಕಾದ ಮಹತ್ವವನ್ನು ಸಾದರಪಡಿಸುವ ಉದ್ದೇಶವಿದೆ. ತಂದೆಯ ಆಸೆಯಂತೆ ಸರ್ಕಾರಿ ಉದ್ಯೋಗವನ್ನೇ ಅವಲಂಬಿಸದೆ, ಸ್ವಯಂ ಉದ್ಯೋಗ ಕಂಡುಕೊಳ್ಳುವ ಯುವಕನೊಬ್ಬ ರಾಷ್ಟ್ರಮಟ್ಟದ ಗೌರವಾದರಗಳಿಗೆ ಪಾತ್ರನಾಗುವುದೇ ಇಲ್ಲಿಯ ಕಥಾವಸ್ತು.
- id: story-n1
  type: prose
  section: story
  text: ಮಗ್ಗದ ಸಾಹೇಬ ಅಂದರೆ ಅಬ್ದುಲ್ ರಹೀಮ್ ಸಾಹೇಬ್. ಅವನು ಮಗ್ಗವನ್ನು ಮುಟ್ಟದೆ ಇಪ್ಪತ್ತು ವರ್ಷಕ್ಕೂ ಹೆಚ್ಚಾಗಿದೆ. ಆದರೂ ಅವನನ್ನು ಮಗ್ಗದ ಸಾಹೇಬನೆಂದೇ ಕರೆಯುವುದು ವಾಡಿಕೆ. ಅವರ ಪೂರ್ವಜರು ಸಾಹೇಬ್ ಬಹಾದ್ದೂರ್ ಮಗ್ಗದ ಹುಸೇನ್ ಸಾಹೇಬರು ಜನಪ್ರಿಯ ಮತ್ತು ಧನವಂತ ವ್ಯಕ್ತಿಯಾಗಿದ್ದರು. ಅವರು ಮಸೀದಿ ಮಾತ್ರವಲ್ಲ; ದೇವಸ್ಥಾನವನ್ನೂ ಕಟ್ಟಿಸಿದ್ದರು. ಇಂದಿಗೂ ಈ ದೇವಸ್ಥಾನದಲ್ಲಿ ರಥೋತ್ಸವದ ಸಮಯದಲ್ಲಿ ಅವರ ಮನೆತನದ ಹಿರಿಯ ಪ್ರತಿನಿಧಿಗೆ ಎಲ್ಲರಿಗಿಂತಲೂ ಮುಂದಾಗಿ ಪ್ರಸಾದವನ್ನು ಪಡೆಯುವ ಹಕ್ಕಿದೆ. ಇಂತಹ ಸಂಪ್ರದಾಯ ಪದ್ಧತಿಗಳು ಇಂದಿಗೂ ಕರ್ನಾಟಕದಲ್ಲಿ ನಡೆಯುತ್ತಿವೆ. ಇದರಿಂದ ಪೂರ್ವಜರಲ್ಲಿ ಎಂತಹ ಘನತೆ, ಸದಾಚಾರ, ಸದ್ಭಾವನೆಗಳು ಇದ್ದವು ಎಂದು ತಿಳಿಯುವುದು. ಉದಾಹರಣೆಗೆ ನನ್ನದೇ ಹುಟ್ಟೂರಿನ ಪಕ್ಕದಲ್ಲಿ ಮುಸಲ್ಮಾನರ ವಸತಿ ಇದೆ. ಅದರೊಳಗೆ ಒಂದು ಪವಿತ್ರ ಸ್ಥಾನವಿದೆ. ಅಲ್ಲಿ ‘ಉರ್ಸ್’ ಎಂಬ ಮುಸಲ್ಮಾನರ ಧಾರ್ಮಿಕ ಉತ್ಸವದ ಕಾಲದಲ್ಲಿ ನಮ್ಮ ಮನೆತನದ ಒಬ್ಬ ಪ್ರತಿನಿಧಿ ಇದ್ದೇ ಇರಬೇಕೆಂಬ ಸಂಪ್ರದಾಯ ಇತ್ತು.
- id: story-n2
  type: prose
  section: story
  text: ಹಾಗೆಯೇ ಗಣೇಶಚತುರ್ಥಿ, ಕೃಷ್ಣಾಷ್ಟಮಿಗಳ ಮರುದಿನ ಮುಸಲ್ಮಾನ ಸಮಾಜದ ಪ್ರತಿಷ್ಠಿತ ಮುಖ್ಯಸ್ಥರು ನಮ್ಮ ಮನೆಗೆ ಬರುವುದು, ಕುಶಲೋಪಚಾರ ಮಾತನಾಡುವುದು, ನಾವು ಅವರಿಗೆ ಮೋದಕ, ಉಂಡೆ, ಚಕ್ಕುಲಿ ಇತ್ಯಾದಿ ಹಬ್ಬದ ಭಕ್ಷ್ಯ-ಭೋಜ್ಯಗಳನ್ನು ವಿತರಣೆ ಮಾಡುವ ಸಂಪ್ರದಾಯವಿತ್ತು. ಒಂದು ಬಾರಿ ನಮ್ಮ ತಾಯಿ ಕಾಯಿಲೆ ಬಿದ್ದ ಕಾರಣ ತಂದೆಯವರು ಅಂಗಡಿಯಿಂದ ಲಡ್ಡುಗಳನ್ನು ಕೊಂಡು ಕೊಟ್ಟುದಕ್ಕೆ ಅವರಿಗೆ ಬಹಳ ಸಿಟ್ಟು ಬಂತು. ‘ರಾಯರೆ, ಅಂಗಡಿಯಿಂದ ತೆಗೆದುಕೊಳ್ಳಲು ನಮ್ಮಲ್ಲಿ ಹಣವಿಲ್ಲವೆ? ಮನೆಯಲ್ಲಿ ಕಾಯಿಲೆಯಿದ್ದರೆ ಒಂದು ತುಂಡು ಬೆಲ್ಲವನ್ನೋ ಕಲ್ಲುಸಕ್ಕರೆ ಹರಳನ್ನೋ ಕೊಡಿ. ನಿಮ್ಮ ಹಬ್ಬದ ಪೂಜೆಯ ಪ್ರಸಾದವನ್ನು ನಾವು ತೆಗೆದುಕೊಳ್ಳುವುದು ತಲತಲಾಂತರದಿಂದ ಬಂದ ಹಳೆಯ ಸಂಪ್ರದಾಯ. ಅಂಗಡಿಯ ಮಿಠಾಯಿಯನ್ನು ಪ್ರಸಾದವೆಂದು ಕೊಡುವುದು ಸರಿಯೇ?’ ಎಂದು ಕೇಳಿಯೇ ಬಿಟ್ಟಿದ್ದರು. ಅದು ಹೇಗೇ ಇರಲಿ. ಈಗ ಅಬ್ದುಲ್ ರಹೀಮನಿಗೆ ‘ಮಗ್ಗದ ಸಾಹೇಬ’ ಎಂದು ಹೇಳಿದರೆ ಬಹು ಸಿಟ್ಟು ಬರುತ್ತಿತ್ತು. “ಅನಿಷ್ಟ ಮಗ್ಗದ ಹೆಸರೆತ್ತಬೇಡಿ”-“ಮಗ್ಗವಲ್ಲ ಕೊರಳಿಗೆ ಹಗ್ಗ!” ಎಂಬುದು ಆತನ ನಿರಾಶೆ, ರೋಷಗಳ ಉದ್ಗಾರವಾಗಿತ್ತು. ಏಕೆಂದರೆ ಅವನ ಅಜ್ಜನ ಕಾಲದಲ್ಲಿ ಬ್ರಿಟಿಷರು ಅಗ್ಗದ ವಿಲಾಯತಿ ಮಿಲ್ಲಿನ ಬಟ್ಟೆಗಳನ್ನು ನಮ್ಮ ದೇಶದಲ್ಲಿ ಹೇರಿಬಿಟ್ಟರು. ಅವೇನೋ ನಿಜಕ್ಕೂ ನಿಕೃಷ್ಟ ವಸ್ತುಗಳು, ಒಂದು ವರ್ಷದೊಳಗೇ ಕಳೇಬರಗಳಾಗಿ ಹರಕು ಚಿಂದಿಯಾಗುವುವು. ಬಣ್ಣವೋ ಒಂದೇ ತಿಂಗಳಲ್ಲಿ ವಿವರ್ಣವಾಗಿ
    ಎರಡೇ ತಿಂಗಳಲ್ಲಿ ಮಾಯವಾಗುವುದು. ಆದರೇನು? ಬಹು ಅಗ್ಗ. ಜನರಿಗೆ ಬೇಕಾದುದು ಅಗ್ಗದ ವಸ್ತು. ಗುಣವನ್ನು ಯಾರು ಕೇಳುತ್ತಾರೆ? ಅಗ್ಗದ ಮಾಲಿನದೇ ಆಧಿಪತ್ಯವಾಯಿತು. ಮಗ್ಗದವರು ಭಿಕಾರಿಗಳಾದರು. ಅವರ ಅನ್ನಕ್ಕೆ ಸಂಚಕಾರವಾಯಿತು.
- id: story-n3
  type: prose
  section: story
  text: ಪಾಪ! ಅಬ್ದುಲ್ ರಹೀಮನ ಗತಿ? ಹಿರಿಯರು ಕಟ್ಟಿದ ಭವ್ಯವಾದ ಹಳೆಯ ಕಾಲದ ಮನೆ. ವಿಶಾಲವಾದ ತೋಟ. ಆದರೆ ಮಗ್ಗಗಳೆಲ್ಲಾ ಧೂಳು ತುಂಬಿ ಜೇಡನ ಬಲೆಗಳಿಂದ ಆಚ್ಛಾದಿತವಾಗಿವೆ. ಮನೆಯಲ್ಲಿ ಊಟಕ್ಕೆ ಇದೆಯೋ ಇಲ್ಲವೋ ಎಂಬಂತಾಗಿದೆ. ಈಗ ಅವನಿಗೆ ಒಂದೇ ಹಠ, ಒಂದೇ ವ್ರತ. ಅವನ ಮೂವರು ಗಂಡುಮಕ್ಕಳಿಗೆ ಒಂದಿಷ್ಟಾದರೂ ವಿದ್ಯಾಭ್ಯಾಸ ಕೊಡಿಸಿ ಸರಕಾರಿ ನೌಕರರನ್ನಾಗಿ ಮಾಡಬೇಕು ಎಂದು. ಅಂತೆಯೇ ಇಬ್ಬರು ಮಕ್ಕಳು ವಿಧೇಯರಾಗಿ ಅವನ ಅಭೀಷ್ಟವನ್ನು ನೆರವೇರಿಸಿದರು. ಒಬ್ಬ ಸರಕಾರಿ ಕಚೇರಿಯಲ್ಲಿ ಗುಮಾಸ್ತನಾದ. ಇನ್ನೊಬ್ಬ ಪೋಸ್ಟ್ ಮಾಸ್ತರನಾದ. ಆದರೆ ಕೊನೆಯ ಮಗ ಕರೀಮ್ನಿಂದ ಬಹಳ ನಿರಾಸೆ ಉಂಟಾಯಿತು. ಕರೀಮ್ ಆಟದಲ್ಲೂ ಪಾಠದಲ್ಲೂ ಬಹು ಚುರುಕು; ಬುದ್ಧಿವಂತ; ಹಸನ್ಮುಖಿ ಎಲ್ಲರಿಗೂ ಬೇಕಾದವನು. ಆದರೆ ಏನೋ ಕಾರಣದಿಂದ ಅವನಿಗೆ ಅನಿಷ್ಟ ಮಗ್ಗದಲ್ಲಿ ಬಹಳ ಅಭಿರುಚಿ, ಮನೆಯಲ್ಲಾದರೋ ಮಗ್ಗವನ್ನು ಮುಟ್ಟಲೂ ತಂದೆ ಬಿಡುತ್ತಿರಲ್ಲಿಲ್ಲ. ಆದರೆ ಮಗನ ಗ್ರಹಚಾರ ಎನ್ನಿ. ಶಾಲೆಯಲ್ಲಿಯೇ ಮಗ್ಗ ಉದ್ಭವಿಸಬೇಕೇ? ಮಹಾತ್ಮಾ ಗಾಂಧಿ ಪ್ರೇರಣೆಯಿಂದ ಕೆಲವು ಶಾಲೆಗಳಲ್ಲಿ ‘ನವೀನ ಶಿಕ್ಷಣ’ ಆರಂಭವಾಯಿತು. ಈ ವ್ಯವಸ್ಥೆಯಲ್ಲಿ ವಿದ್ಯಾರ್ಥಿಗಳಿಗೆ ಹಲವು ತರಹದ ಔದ್ಯೋಗಿಕ ಶಿಕ್ಷಣವನ್ನು ಕೊಡುವುದು, ಅವರಲ್ಲಿ ಹಸ್ತಕೌಶಲವನ್ನು, ದೇಹಶ್ರಮದಲ್ಲಿ ಗೌರವ-ಭಾವವನ್ನು ಉಂಟು ಮಾಡುವುದು ಒಂದು ಭಾಗವಾಗಿತ್ತು. ಕೆಲವರಿಗೆ ಬಡಗಿಯ ಕೆಲಸ, ಕೆಲವರಿಗೆ ಬೆತ್ತದ ಕುರ್ಚಿ ಕೆಲಸ ಇತ್ಯಾದಿ ಸಾಮಗ್ರಿಗಳನ್ನು ಮಾಡುವ,
    ಕೆಲವರಿಗೆ ಕೃಷಿ, ಕೆಲವರಿಗೆ ಮಗ್ಗದ ಕೆಲಸವನ್ನು ಕಲಿಸತೊಡಗಿದ್ದರು.
- id: story-n4
  type: prose
  section: story
  text: ಹುಡುಗ ಕರೀಮ್ ಮಗ್ಗದ ಕೆಲಸವನ್ನು ಮೀನು ನೀರಿನಲ್ಲಿ ಈಜುವಷ್ಟೇ ಸುಲಭವಾಗಿ ಕಲಿತು ಬಹು ನಿಪುಣನಾಗಿಬಿಟ್ಟ. ಅವನ ತಂದೆಗೆ ರೋಷ ಉಕ್ಕಿಬಂತು. ಮುಖ್ಯೋಪಾಧ್ಯಾಯ ಶಂಕರಪ್ಪ ಅವರೊಡನೆ ನಿಷ್ಠುರವಾಗಿ ಜಗಳವಾಡಿದ್ದನು. ಆದರೆ ಹುಡುಗ ಕರೀಮ್ ಶಾಲೆಯ ಮಗ್ಗದಲ್ಲಿ ಒಂದು ಪರಿವರ್ತನೆಯನ್ನು ತನ್ನದೇ ಬುದ್ಧಿವಂತಿಕೆ ಹಾಗೂ ಕೌಶಲದಿಂದ ಮಾಡಿಬಿಟ್ಟಿದ್ದ. ಅದನ್ನು ಶಂಕರಪ್ಪ ಅವರು ಸ್ವಾಭಾವಿಕವಾಗಿಯೇ ಪ್ರಶಂಸೆ ಮಾಡಿ ಮೇಲಧಿಕಾರಿಗಳಿಗೆ ವರದಿ ಮಾಡಿದ್ದರು. ಅದರ ಫಲಸ್ವರೂಪವಾಗಿ ಸರಕಾರದಿಂದ ಹುಡುಗ ಕರೀಮ್ನಿಗೆ ಒಂದು ಬೆಳ್ಳಿಯ ಪದಕವೂ ಒಂದು ನೂರು ರೂಪಾಯಿಯ ಬಹುಮಾನವೂ ಬಂದುಬಿಟ್ಟವು. ಹುಡುಗನ ಉತ್ಸಾಹ ಆಕಾಶಕ್ಕೇರಿತು. ತಂದೆ ಈ ಹಠಮಾರಿಗೆ ಮಗ್ಗದ ಹುಚ್ಚನ್ನು ಬಿಡಿಸಬೇಕೆಂದು ಶಾಲೆಯಿಂದಲೇ ಬಿಡಿಸಿಬಿಟ್ಟನು. ಹೆಡ್ ಮಾಸ್ಟರ್ ಶಂಕರಪ್ಪ ಅವರ ಎಷ್ಟೋ ಅನುನಯ ವಿನಯಗಳನ್ನು ಗಣಿಸದೆ ನಿರಾಕರಿಸಿದನು.
- id: story-n5
  type: prose
  section: story
  text: ಒಂದು ದಿನ ಶಾಲೆಯ ವಾರ್ಷಿಕೋತ್ಸವ ಸಮಾರೋಪದಲ್ಲಿ ಹಳೆಯ ವಿದ್ಯಾರ್ಥಿಗಳ ಒಂದು ನಾಟಕವಿತ್ತು. ಅದರಲ್ಲಿ ಕರೀಮನದು ಸ್ತ್ರೀಪಾತ್ರ. ಅದಕ್ಕೆಂದು ತಾಯಿಯಿಂದ ಗೌಪ್ಯವಾಗಿ ಹಳೆಕಾಲದ ಚಿನ್ನದ ಸರವನ್ನು ಅಲಂಕಾರಕ್ಕೆಂದು ಎರವಲು ತೆಗೆದುಕೊಂಡ. ನಾಟಕ ಮುಗಿದ ನಂತರ ಮನೆಗೆ ಬರಲಿಲ್ಲ. ಎಲ್ಲೋ ಮಾಯವಾಗಿ ಹೋದ. ತಂದೆಗೆ ಮೈಯಲ್ಲಿ ಅಗ್ನಿಸಂಚಾರವಾಯಿತು. ಮಗನನ್ನು ಕ್ರೂರವಾಗಿ ಶಪಿಸಿದನು. “ಹಾಳಾಗಿ ಹೋಗಲಿ! ಹಠಮಾರಿ. ತಂದೆಯ ಮಾತನ್ನು ಉಲ್ಲಂಘಿಸಿದವನು ಎಂದು ಮಾತ್ರ ತಿಳಿದಿದ್ದೆ. ಈಗ ಕಳ್ಳನೆಂದೂ ತಿಳಿಯಿತು. ನನಗೆ ಇಬ್ಬರೇ ಗಂಡು ಮಕ್ಕಳು ; ಕಳ್ಳನಾದವನು, ಮನೆಬಿಟ್ಟು ಓಡಿಹೋದವನು ಮಗನೇ ಅಲ್ಲ” ಎಂದು ಆಣೆ ಹಾಕಿದನು. ಕೆಲವು ವರ್ಷಗಳ ಅನಂತರ ಕರೀಮ್ - ಈಗ ಬೆಳೆದು ಯುವಕನಾಗಿದ್ದಾನೆ - ಮನೆಗೆ ಬಂದು ಬಾಗಿಲು ತಟ್ಟಿದ. ತಂದೆ ಬಾಗಿಲು ತೆರೆದು ಮುಖ ನೋಡಿ ಫಟಾರನೆ ಬಾಗಿಲು ಮುಚ್ಚಿದ. ಒಂದು ಘಂಟೆ ಬಾಗಿಲು ತಟ್ಟಿದರೂ ತಾಯಿ ಅತ್ತು ಹಂಬಲಿಸಿದರೂ ಬಾಗಿಲು ತೆರೆಯಲೇ ಇಲ್ಲ. ಕೊನೆಗೆ ನಿವೃತ್ತರಾಗಿರುವ ಶಂಕರಪ್ಪ ಅವರ ಮನೆಗೆ ಹೋಗಿ, ಸಂಧಾನ ಮಾಡಿಸಿರಿ ಎಂದು ನಿವೇದಿಸಿದ. ‘ನನ್ನ ಮುಖವನ್ನೇ ನೋಡಬಾರದು ಎಂದು ಹಠವಿದ್ದರೆ ಕೊನೆಗೆ ತಾಯಿಯಾದರೂ ನನ್ನನ್ನು ಕಾಣಬಾರದೆ? ಅಮ್ಮನ ಚಿನ್ನದ ಸರವನ್ನು ತಂದಿದ್ದೇನೆ. ಅದರೊಡನೆ ಹತ್ತುಸಾವಿರ ರೂಪಾಯಿಗಳನ್ನು ತಂದಿದ್ದೇನೆ. ಅವನ್ನಾದರೂ ತಾಯಿಯ ಕಾಲ ಮೇಲೆ ಹಾಕಿ ಹೋಗುತ್ತೇನೆ. ತಂದೆಯವರಿಗೆ ಸಮಾಧಾನ ಹೇಳಿ. ನಿಮ್ಮ ಹಳೆಯ ಶಿಷ್ಯನಿಗೆ
    ಇದೊಂದು ಉಪಕಾರ ಮಾಡಿ’ ಎಂದ.
- id: story-n6
  type: prose
  section: story
  text: ಶಂಕರಪ್ಪ ಅವರು ಮುದುಕನೊಡನೆ ಒಂದು ಗಂಟೆ ಗೋಗರೆದರು, ನಿವೇದಿಸಿದರು, ತರ್ಕಿಸಿದರು, ಚರ್ಚಿಸಿದರು. ಆದರೆ ನಿಷ್ಫಲವಾಯಿತು. ಒಂದು ಪದವನ್ನೂ ಕೇಳುವ ತಾಳ್ಮೆ ಮುದುಕನಿಗೆ ಇರಲಿಲ್ಲ. ‘ಸಾಹೇಬ್ ಬಹಾದ್ದೂರ್ ಹುಸೇನ್ ಸಾಹೇಬರ ಕೀರ್ತಿಗೆ ಮಸಿಹಚ್ಚಿದ್ದಾನೆ. ಈ ಮಾತಿನಲ್ಲಿ ನೀವು ಅಡ್ಡಬಾಯಿ ಹಾಕಬೇಡಿ. ನೀವು ಕಲಿಸಿದ ಪಾಠದಿಂದಲೇ ಈ ಹಠಮಾರಿ ನಮ್ಮ ವಂಶದ ಕೀರ್ತಿಯನ್ನು ಮಣ್ಣುಪಾಲು ಮಾಡಿದ. ಹಣ ತಂದಿದ್ದಾನಂತೆ. ಕಳವಿನ ಹಣವೋ? ದರೋಡೆಯ ಹಣವೋ?’ ಎಂದು ಸಿಡುಕಿದ. ಶಂಕರಪ್ಪ ಅವರು ಮುಖಬಾಡಿಸಿಕೊಂಡು ಹಿಂತೆರಳಿದರು.
- id: story-n7
  type: prose
  section: story
  text: ಕರೀಮ್ನ ಹಣ ಕಳವಿನದೂ ಅಲ್ಲ. ದರೋಡೆಯದೂ ಅಲ್ಲ. ಸಣ್ಣಪ್ರಾಯದಲ್ಲೇ ಮಗ್ಗದ ಸಹಕಾರಿ ಸಂಘವೊಂದನ್ನು ಸ್ಥಾಪಿಸಿ ಅವನೀಗ ಅದರ ಅಧ್ಯಕ್ಷನಾಗಿದ್ದಾನೆ. ಸಾಕಷ್ಟು ಯಶಸ್ವಿಯೂ ಧನವಂತನೂ ಆಗಿದ್ದಾನೆ. ಅದೂ ಅಲ್ಲದೆ ಮಗ್ಗದ ಯಂತ್ರದ ಪ್ರಯೋಗದಲ್ಲಿ ಹೊಸ ಹೊಸ ಸುಧಾರಣೆಗಳನ್ನೂ ಪರಿವರ್ತನೆಗಳನ್ನೂ ತಂದು ಹೆಸರು ಮಾಡಿದ್ದಾನೆ. ಆದರೆ ಈ ವಿಷಯದ ಲವಲೇಶವೂ ತಂದೆಗೆ ತಿಳಿಯದು. ಏಕೆಂದರೆ ಆತ ಕರೀಮ್ನ ಕಡೆಗೆ ತನ್ನ ಹೃದಯವನ್ನು, ಮನೆಯ ಬಾಗಿಲು ಮುಚ್ಚಿದಂತೆ-ಸಂಪೂರ್ಣವಾಗಿ ಮುಚ್ಚಿಬಿಟ್ಟಿದ್ದಾನೆ. ಯಾರಾದರೂ ಕರೀಮ್ನ ಹೆಸರೆತ್ತಿದರೆ ‘ನನಗೆ ಎರಡೇ ಮಕ್ಕಳು, ಕಳ್ಳರ ಪರಿಚಯ ನನಗಿಲ್ಲ’ ಎಂದೇ ಅವನ ನಿಷ್ಠುರದ ಉತ್ತರ. ಕೆಲವು ವರ್ಷಗಳ ಅನಂತರ ಅಬ್ದುಲ್ ರಹೀಮ್ ಹಾಸಿಗೆಯಲ್ಲಿ ಒರಗಿದ್ದಾನೆ. ಅನಾರೋಗ್ಯದಿಂದ ನರಳುತ್ತಾ ಇದ್ದಾನೆ. ಎಲುಬಿನ ಹಂದರವಾಗಿದ್ದಾನೆ. ಕಣ್ಣೂ ಸರಿಯಾಗಿ ಕಾಣಿಸುತ್ತಿಲ್ಲ; ಕಿವಿಯೂ ಸರಿಯಾಗಿ ಕೇಳುತ್ತಿಲ್ಲ. ಶಂಕರಪ್ಪ ಅವರು ಬಾಗಿಲು ತಟ್ಟಿದರು. ಒಳಗೆ ಬಂದರು. ಕೈಯಲ್ಲಿ ಒಂದು ವಾರ್ತಾಪತ್ರಿಕೆ. ‘ರಹೀಮ್ ಸಾಹೇಬರೇ, ಈ ಪತ್ರಿಕೆ ನೋಡಿದಿರಾ? ಈ ಭಾವಚಿತ್ರ ನೋಡಿ?’ ಮುದುಕ ಕಣ್ಣಿನ ಹತ್ತಿರ ತಂದ. ಆದರೆ ಪಾಪ! ಕಣ್ಣು ಮಂಜಾಗಿವೆ. ಏನೂ ತೋರದು. ಅವನ ಹೆಂಡತಿ ಬಂದು ವಾರ್ತಾಪತ್ರಿಕೆ ತೆಗೆದುಕೊಂಡು ಹೋದಳು. “ಕರೀಮ್! ನಮ್ಮ ಕರೀಮ್! ನಮ್ಮ ಕರೀಮ್” ಎಂದು ಗಟ್ಟಿಯಾಗಿ ಉದ್ಗರಿಸಿದಳು. “ಏನು? ಜೇಲಿಗೆ ಹೋದನೇ? ಫಾಶೀ ಆಯಿತೇ? ಇನ್ನೂ ಮನೆತನದ ಮೇಲೆ ಏನು ಅಪಕೀರ್ತಿ
    ಹೇರಿದ್ದಾನೆ?” ಎಂದು ಮುದುಕ ಕೆಮ್ಮುತ್ತ ಕೆಮ್ಮುತ್ತ ಗರ್ಜಿಸಿದ. “ರಹೀಮ್ ಸಾಹೇಬರೇ, ನಿಮ್ಮ ಮಗ ಕರೀಮ್ನಿಗೆ ರಾಷ್ಟ್ರಪತಿ ಅವರು ಪದ್ಮಭೂಷಣ ಬಿರುದನ್ನು ಕೊಟ್ಟಿದ್ದಾರೆ. ಅದರ ಭಾವಚಿತ್ರ ಈ ವಾರ್ತಾಪತ್ರಿಕೆಯಲ್ಲಿದೆ.”
- id: story-n8
  type: prose
  section: story
  text: “ಆಂ! ಪದ್ಮಭೂಷಣ! ಅಂದರೇನು?” “ಪದ್ಮಭೂಷಣ ಅಂದರೆ ಸಾಹೇಬ್ ಬಹಾದ್ದೂರ್ಗಿಂತಲೂ ಮೇಲಿನ ಬಿರುದು. ಖಾನ್ ಸಾಹೇಬ್, ಖಾನ್ ಬಹಾದ್ದೂರ್, ದಿವಾನ್ ಬಹಾದ್ದೂರ್ ಇವೆಲ್ಲದರಿಂದಲೂ ಮೇಲೆ, ದೊಡ್ಡ ಬಿರುದು!” “ಕರೀಮ್! ನನ್ನ ಕರೀಮ್! ಸಾಹೇಬ್ ಬಹಾದ್ದೂರ್ಗಿಂತಲೂ ಮೇಲಾದನೇ? ದೇವರು ದೊಡ್ಡವನು. ದೇವರು ದಯಾಳು. ನನ್ನ ಬಾಯಿಯಿಂದ ಬಿದ್ದ ಕೆಟ್ಟ ಮಾತನ್ನು ದೇವರು ಕಿವಿಗೆ ಹಾಕಿಕೊಳ್ಳಲಿಲ್ಲ. ನನ್ನ ಕರೀಮ್ ಮಗ್ಗದ ಹುಸೇನ್ ಸಾಹೇಬರ ಹೆಸರಿಗೆ ಕೀರ್ತಿ ತಂದ” ಎಂದು ಕೆಮ್ಮುತ್ತ ಕೆಮ್ಮುತ್ತ ಬಿಕ್ಕಿಬಿಕ್ಕಿ ಅಳತೊಡಗಿದ ಭಾವುಕನಾಗಿ.
- id: author-1
  type: prose
  section: author
  text: ಬಾಗಲೋಡಿ ದೇವರಾಯಅವರು(1927) ದಕ್ಷಿಣ ಕನ್ನಡ ಜಿಲ್ಲೆಯ ಬಾಗಲೋಡಿಯವರು. ಮಂಗಳೂರಿನ ಸರ್ಕಾರಿ ಕಾಲೇಜಿನಲ್ಲಿ ಇಂಗ್ಲಿಷ್ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿದ್ದರು. ಆ ಕಾಲಕ್ಕೆ ಐ.ಎ.ಎಸ್. ಪರೀಕ್ಷೆಯಲ್ಲಿ ತೇರ್ಗಡೆ ಹೊಂದಿ ವಿದೇಶಿ ಸೇವೆಗೆ ಆಯ್ಕೆಯಾದರು. ಮಾಸ್ತಿ ಹಾಗೂ ಇವರೂ ಸಮಕಾಲೀನರು. ಅದಲ್ಲದೆ ಸಣ್ಣಕತೆಗಳನ್ನು ಬರೆದವರು.ಅವರು ರಾಯಭಾರಿಯಾಗಿಇಟಲಿ, ನೇಪಾಳ, ನೈಜೀರಿಯಾ, ಫಿಲಿಫೈನ್ಸ್, ನ್ಯೂಜಿಲ್ಯಾಂಡ್, ಬಲ್ಗೇರಿಯಾ ಮೊದಲಾದ ದೇಶಗಳಲ್ಲಿ ಕಾರ್ಯನಿರ್ವಹಿಸಿದರು. ಅವರ ಕಥಾಸಂಗ್ರಹಗಳೆಂದರೆಹುಚ್ಚು ಮುನಸೀಫ ಮತ್ತು ಇತರ ಕತೆಗಳು, ಆರಾಧನಾ, ರುದ್ರಪ್ಪನ ರೌದ್ರ ಮತ್ತು ಇತರ ಕತೆಗಳು.ಬಾಗಲೋಡಿ ದೇವರಾಯ ಅವರು ಒಟ್ಟು 26 ಕತೆಗಳನ್ನು ಬರೆದಿದ್ದಾರೆ. ಇವರು 1985 ರಲ್ಲಿ ನಿಧನರಾದರು.
- id: ashaya-1
  type: prose
  section: ashaya
  text: ಪ್ರಕೃತ ಗದ್ಯಭಾಗ ಧಾರ್ಮಿಕ ಸಹಿಷ್ಣುತೆ, ಗುಡಿಕೈಗಾರಿಕೆಗಳ ವಿನಾಶಕ್ಕೆ ಕಾರಣವಾದ ಅಂಶ, ಶಾಲೆಗಳಲ್ಲಿ ಔದ್ಯೋಗಿಕ ಶಿಕ್ಷಣ, ಮಕ್ಕಳ ಆಸಕ್ತಿಗೆ ಪೂರಕವಾದ ಶಿಕ್ಷಣ ನೀಡುವುದು, ಸ್ವಯಂ- ಉದ್ಯೋಗಕ್ಕೆ ಪ್ರೇರಣೆ ಮೊದಲಾದ ಮಹತ್ವದ ಅಂಶಗಳನ್ನು ಒಳಗೊಂಡಿದೆ. ತಂದೆ ಮಗನಿಗಿದ್ದ ಮಗ್ಗದ ಬಗೆಗಿನ ಒಲವಿಗೆ ವಿರೋಧ ವ್ಯಕ್ತಪಡಿಸಿದರು. ಇದರಿಂದ ಮನನೊಂದ ಮಗ ತನ್ನ ಮಾರ್ಗವನ್ನು ಸ್ವತಂತ್ರವಾಗಿ ಕಂಡುಕೊಂಡ ಆಶಯವನ್ನು ಹೊಂದಿದೆ ಈ ಪಠ್ಯಭಾಗ. ಪ್ರಕೃತ ಮಗ್ಗದ ಸಾಹೇಬಕಥೆಯನ್ನುಬಾಗಲೋಡಿ ದೇವರಾಯಅವg ಸಮಗ್ರ ಕತೆಗಳುಎಂಬ ಕಥಾಸಂಕಲನದಿಂದ (ಪುಟ 185-189) ಆಯ್ದ ಕಥೆಯನ್ನು ಸಂಪಾದಿಸಿ ನಿಗದಿಪಡಿಸಿದೆ.
- id: vocab-va73615a3
  type: vocabulary_term
  text: ಅಭೀಷ್ಟ
