intro-1: bahaḻa janapriya sāhitya prakāragaḻalli saṇṇa kathèyū òṃdu. kathèyannu heḻuvudu hāgū keḻuvudu mānavana huṭṭuguṇa. namma hiriyaru tamma makkaḻalli āsakti kèraḻisi kutūhala uṃṭumāḍalu, manassigè muda nīḍalu manassannaraḻisuva kathègaḻannu heḻuttiddaru.
intro-2: ī kathana kalèyu vistāragòṃḍu kèlavu sāhitigaḻu vastu, śaili, nirūpaṇègaḻèlladaralliyū pariṇāmakāriyāda mārpāḍugaḻannu māḍi saṇṇakathè èṃba sāhitya prakāravannu pracuragòḻisidaru mattu saṃkṣiptatè, vāstavatègaḻu idara guṇagaḻāgivè. śikṣaṇa, badukina eḻubīḻugaḻu, svaudyoga, vijñāna mòdalādavugaḻu saṇṇakathègè vastugaḻāgivè. prastuta kathèyalli bahu mukhyavāgi iṃdu vināśada aṃcinalliruva guḍikaigārikègè namma śikṣaṇadalli nīḍabekāda mahatvavannu sādarapaḍisuva uddeśavidè. taṃdèya āsèyaṃtè sarkāri udyogavanne avalaṃbisadè, svayaṃ udyoga kaṃḍukòḻḻuva yuvakanòbba rāṣṭramaṭṭada gauravādaragaḻigè pātranāguvude illiya kathāvastu.
story-n1: maggada sāheba aṃdarè abdul rahīm sāheb. avanu maggavannu muṭṭadè ippattu varṣakkū hèccāgidè. ādarū avanannu maggada sāhebanèṃde karèyuvudu vāḍikè. avara pūrvajaru sāheb bahāddūr maggada husen sāhebaru janapriya mattu dhanavaṃta vyaktiyāgiddaru. avaru masīdi mātravalla; devasthānavannū kaṭṭisiddaru. iṃdigū ī devasthānadalli rathotsavada samayadalli avara manètanada hiriya pratinidhigè èllarigiṃtalū muṃdāgi prasādavannu paḍèyuva hakkidè. iṃtaha saṃpradāya paddhatigaḻu iṃdigū karnāṭakadalli naḍèyuttivè. idariṃda pūrvajaralli èṃtaha ghanatè, sadācāra, sadbhāvanègaḻu iddavu èṃdu tiḻiyuvudu. udāharaṇègè nannade huṭṭūrina pakkadalli musalmānara vasati idè. adaròḻagè òṃdu pavitra sthānavidè. alli ‘urs’ èṃba musalmānara dhārmika utsavada kāladalli namma manètanada òbba pratinidhi idde irabekèṃba saṃpradāya ittu.
story-n2: hāgèye gaṇeśacaturthi, kṛṣṇāṣṭamigaḻa marudina musalmāna samājada pratiṣṭhita mukhyastharu namma manègè baruvudu, kuśalopacāra mātanāḍuvudu, nāvu avarigè modaka, uṃḍè, cakkuli ityādi habbada bhakṣya-bhojyagaḻannu vitaraṇè māḍuva saṃpradāyavittu. òṃdu bāri namma tāyi kāyilè bidda kāraṇa taṃdèyavaru aṃgaḍiyiṃda laḍḍugaḻannu kòṃḍu kòṭṭudakkè avarigè bahaḻa siṭṭu baṃtu. ‘rāyarè, aṃgaḍiyiṃda tègèdukòḻḻalu nammalli haṇavillavè? manèyalli kāyilèyiddarè òṃdu tuṃḍu bèllavanno kallusakkarè haraḻanno kòḍi. nimma habbada pūjèya prasādavannu nāvu tègèdukòḻḻuvudu talatalāṃtaradiṃda baṃda haḻèya saṃpradāya. aṃgaḍiya miṭhāyiyannu prasādavèṃdu kòḍuvudu sariye?’ èṃdu keḻiye biṭṭiddaru. adu hege irali. īga abdul rahīmanigè ‘maggada sāheba’ èṃdu heḻidarè bahu siṭṭu baruttittu. “aniṣṭa maggada hèsarèttabeḍi”-“maggavalla kòraḻigè hagga!” èṃbudu ātana nirāśè, roṣagaḻa udgāravāgittu. ekèṃdarè avana ajjana kāladalli briṭiṣaru aggada vilāyati millina baṭṭègaḻannu namma deśadalli heribiṭṭaru. aveno nijakkū
  nikṛṣṭa vastugaḻu, òṃdu varṣadòḻage kaḻebaragaḻāgi haraku ciṃdiyāguvuvu. baṇṇavo òṃde tiṃgaḻalli vivarṇavāgi èraḍe tiṃgaḻalli māyavāguvudu. ādarenu? bahu agga. janarigè bekādudu aggada vastu. guṇavannu yāru keḻuttārè? aggada mālinade ādhipatyavāyitu. maggadavaru bhikārigaḻādaru. avara annakkè saṃcakāravāyitu.
story-n3: pāpa! abdul rahīmana gati? hiriyaru kaṭṭida bhavyavāda haḻèya kālada manè. viśālavāda toṭa. ādarè maggagaḻèllā dhūḻu tuṃbi jeḍana balègaḻiṃda ācchāditavāgivè. manèyalli ūṭakkè idèyo illavo èṃbaṃtāgidè. īga avanigè òṃde haṭha, òṃde vrata. avana mūvaru gaṃḍumakkaḻigè òṃdiṣṭādarū vidyābhyāsa kòḍisi sarakāri naukararannāgi māḍabeku èṃdu. aṃtèye ibbaru makkaḻu vidheyarāgi avana abhīṣṭavannu nèraverisidaru. òbba sarakāri kaceriyalli gumāstanāda. innòbba posṭ māstaranāda. ādarè kònèya maga karīmniṃda bahaḻa nirāsè uṃṭāyitu. karīm āṭadallū pāṭhadallū bahu curuku; buddhivaṃta; hasanmukhi èllarigū bekādavanu. ādarè eno kāraṇadiṃda avanigè aniṣṭa maggadalli bahaḻa abhiruci, manèyallādaro maggavannu muṭṭalū taṃdè biḍuttirallilla. ādarè magana grahacāra ènni. śālèyalliye magga udbhavisabeke? mahātmā gāṃdhi preraṇèyiṃda kèlavu śālègaḻalli ‘navīna śikṣaṇa’ āraṃbhavāyitu. ī vyavasthèyalli vidyārthigaḻigè halavu tarahada audyogika śikṣaṇavannu kòḍuvudu, avaralli hastakauśalavannu, dehaśramadalli
  gaurava-bhāvavannu uṃṭu māḍuvudu òṃdu bhāgavāgittu. kèlavarigè baḍagiya kèlasa, kèlavarigè bèttada kurci kèlasa ityādi sāmagrigaḻannu māḍuva, kèlavarigè kṛṣi, kèlavarigè maggada kèlasavannu kalisatòḍagiddaru.
story-n4: huḍuga karīm maggada kèlasavannu mīnu nīrinalli ījuvaṣṭe sulabhavāgi kalitu bahu nipuṇanāgibiṭṭa. avana taṃdègè roṣa ukkibaṃtu. mukhyopādhyāya śaṃkarappa avaròḍanè niṣṭhuravāgi jagaḻavāḍiddanu. ādarè huḍuga karīm śālèya maggadalli òṃdu parivartanèyannu tannade buddhivaṃtikè hāgū kauśaladiṃda māḍibiṭṭidda. adannu śaṃkarappa avaru svābhāvikavāgiye praśaṃsè māḍi meladhikārigaḻigè varadi māḍiddaru. adara phalasvarūpavāgi sarakāradiṃda huḍuga karīmnigè òṃdu bèḻḻiya padakavū òṃdu nūru rūpāyiya bahumānavū baṃdubiṭṭavu. huḍugana utsāha ākāśakkeritu. taṃdè ī haṭhamārigè maggada huccannu biḍisabekèṃdu śālèyiṃdale biḍisibiṭṭanu. hèḍ māsṭar śaṃkarappa avara èṣṭo anunaya vinayagaḻannu gaṇisadè nirākarisidanu.
story-n5: òṃdu dina śālèya vārṣikotsava samāropadalli haḻèya vidyārthigaḻa òṃdu nāṭakavittu. adaralli karīmanadu strīpātra. adakkèṃdu tāyiyiṃda gaupyavāgi haḻèkālada cinnada saravannu alaṃkārakkèṃdu èravalu tègèdukòṃḍa. nāṭaka mugida naṃtara manègè baralilla. èllo māyavāgi hoda. taṃdègè maiyalli agnisaṃcāravāyitu. maganannu krūravāgi śapisidanu. “hāḻāgi hogali! haṭhamāri. taṃdèya mātannu ullaṃghisidavanu èṃdu mātra tiḻididdè. īga kaḻḻanèṃdū tiḻiyitu. nanagè ibbare gaṃḍu makkaḻu ; kaḻḻanādavanu, manèbiṭṭu oḍihodavanu magane alla” èṃdu āṇè hākidanu. kèlavu varṣagaḻa anaṃtara karīm - īga bèḻèdu yuvakanāgiddānè - manègè baṃdu bāgilu taṭṭida. taṃdè bāgilu tèrèdu mukha noḍi phaṭāranè bāgilu muccida. òṃdu ghaṃṭè bāgilu taṭṭidarū tāyi attu haṃbalisidarū bāgilu tèrèyale illa. kònègè nivṛttarāgiruva śaṃkarappa avara manègè hogi, saṃdhāna māḍisiri èṃdu nivedisida. ‘nanna mukhavanne noḍabāradu èṃdu haṭhaviddarè kònègè tāyiyādarū nannannu kāṇabāradè? ammana cinnada saravannu taṃdiddenè. adaròḍanè hattusāvira
  rūpāyigaḻannu taṃdiddenè. avannādarū tāyiya kāla melè hāki hoguttenè. taṃdèyavarigè samādhāna heḻi. nimma haḻèya śiṣyanigè idòṃdu upakāra māḍi’ èṃda.
story-n6: śaṃkarappa avaru mudukanòḍanè òṃdu gaṃṭè gogarèdaru, nivedisidaru, tarkisidaru, carcisidaru. ādarè niṣphalavāyitu. òṃdu padavannū keḻuva tāḻmè mudukanigè iralilla. ‘sāheb bahāddūr husen sāhebara kīrtigè masihacciddānè. ī mātinalli nīvu aḍḍabāyi hākabeḍi. nīvu kalisida pāṭhadiṃdale ī haṭhamāri namma vaṃśada kīrtiyannu maṇṇupālu māḍida. haṇa taṃdiddānaṃtè. kaḻavina haṇavo? daroḍèya haṇavo?’ èṃdu siḍukida. śaṃkarappa avaru mukhabāḍisikòṃḍu hiṃtèraḻidaru.
story-n7: karīmna haṇa kaḻavinadū alla. daroḍèyadū alla. saṇṇaprāyadalle maggada sahakāri saṃghavòṃdannu sthāpisi avanīga adara adhyakṣanāgiddānè. sākaṣṭu yaśasviyū dhanavaṃtanū āgiddānè. adū alladè maggada yaṃtrada prayogadalli hòsa hòsa sudhāraṇègaḻannū parivartanègaḻannū taṃdu hèsaru māḍiddānè. ādarè ī viṣayada lavaleśavū taṃdègè tiḻiyadu. ekèṃdarè āta karīmna kaḍègè tanna hṛdayavannu, manèya bāgilu muccidaṃtè-saṃpūrṇavāgi muccibiṭṭiddānè. yārādarū karīmna hèsarèttidarè ‘nanagè èraḍe makkaḻu, kaḻḻara paricaya nanagilla’ èṃde avana niṣṭhurada uttara. kèlavu varṣagaḻa anaṃtara abdul rahīm hāsigèyalli òragiddānè. anārogyadiṃda naraḻuttā iddānè. èlubina haṃdaravāgiddānè. kaṇṇū sariyāgi kāṇisuttilla; kiviyū sariyāgi keḻuttilla. śaṃkarappa avaru bāgilu taṭṭidaru. òḻagè baṃdaru. kaiyalli òṃdu vārtāpatrikè. ‘rahīm sāhebare, ī patrikè noḍidirā? ī bhāvacitra noḍi?’ muduka kaṇṇina hattira taṃda. ādarè pāpa! kaṇṇu maṃjāgivè. enū toradu. avana hèṃḍati baṃdu vārtāpatrikè tègèdukòṃḍu hodaḻu. “karīm!
  namma karīm! namma karīm” èṃdu gaṭṭiyāgi udgarisidaḻu. “enu? jeligè hodane? phāśī āyite? innū manètanada melè enu apakīrti heriddānè?” èṃdu muduka kèmmutta kèmmutta garjisida. “rahīm sāhebare, nimma maga karīmnigè rāṣṭrapati avaru padmabhūṣaṇa birudannu kòṭṭiddārè. adara bhāvacitra ī vārtāpatrikèyallidè.”
story-n8: “āṃ! padmabhūṣaṇa! aṃdarenu?” “padmabhūṣaṇa aṃdarè sāheb bahāddūrgiṃtalū melina birudu. khān sāheb, khān bahāddūr, divān bahāddūr ivèlladariṃdalū melè, dòḍḍa birudu!” “karīm! nanna karīm! sāheb bahāddūrgiṃtalū melādane? devaru dòḍḍavanu. devaru dayāḻu. nanna bāyiyiṃda bidda kèṭṭa mātannu devaru kivigè hākikòḻḻalilla. nanna karīm maggada husen sāhebara hèsarigè kīrti taṃda” èṃdu kèmmutta kèmmutta bikkibikki aḻatòḍagida bhāvukanāgi.
author-1: bāgaloḍi devarāyaavaru(1927) dakṣiṇa kannaḍa jillèya bāgaloḍiyavaru. maṃgaḻūrina sarkāri kālejinalli iṃgliṣ prādhyāpakarāgiddaru. ā kālakkè ai.è.ès. parīkṣèyalli tergaḍè hòṃdi videśi sevègè āykèyādaru. māsti hāgū ivarū samakālīnaru. adalladè saṇṇakatègaḻannu barèdavaru.avaru rāyabhāriyāgiiṭali, nepāḻa, naijīriyā, philiphains, nyūjilyāṃḍ, balgeriyā mòdalāda deśagaḻalli kāryanirvahisidaru. avara kathāsaṃgrahagaḻèṃdarèhuccu munasīpha mattu itara katègaḻu, ārādhanā, rudrappana raudra mattu itara katègaḻu.bāgaloḍi devarāya avaru òṭṭu 26 katègaḻannu barèdiddārè. ivaru 1985 ralli nidhanarādaru.
ashaya-1: prakṛta gadyabhāga dhārmika sahiṣṇutè, guḍikaigārikègaḻa vināśakkè kāraṇavāda aṃśa, śālègaḻalli audyogika śikṣaṇa, makkaḻa āsaktigè pūrakavāda śikṣaṇa nīḍuvudu, svayaṃ- udyogakkè preraṇè mòdalāda mahatvada aṃśagaḻannu òḻagòṃḍidè. taṃdè maganigidda maggada bagègina òlavigè virodha vyaktapaḍisidaru. idariṃda mananòṃda maga tanna mārgavannu svataṃtravāgi kaṃḍukòṃḍa āśayavannu hòṃdidè ī paṭhyabhāga. prakṛta maggada sāhebakathèyannubāgaloḍi devarāyaavag samagra katègaḻuèṃba kathāsaṃkalanadiṃda (puṭa 185-189) āyda kathèyannu saṃpādisi nigadipaḍisidè.
