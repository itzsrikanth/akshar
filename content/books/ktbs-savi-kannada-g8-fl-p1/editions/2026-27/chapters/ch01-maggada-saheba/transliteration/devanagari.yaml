intro-1: बहळ जनप्रिय साहित्य प्रकारगळल्लि सण्ण कथॆयू ऒंदु. कथॆयन्नु हेळुवुदु हागू केळुवुदु मानवन हुट्टुगुण. नम्म हिरियरु तम्म मक्कळल्लि आसक्ति कॆरळिसि कुतूहल उंटुमाडलु, मनस्सिगॆ मुद नीडलु मनस्सन्नरळिसुव कथॆगळन्नु हेळुत्तिद्दरु.
intro-2: ई कथन कलॆयु विस्तारगॊंडु कॆलवु साहितिगळु वस्तु, शैलि, निरूपणॆगळॆल्लदरल्लियू परिणामकारियाद मार्पाडुगळन्नु माडि सण्णकथॆ ऎंब साहित्य प्रकारवन्नु प्रचुरगॊळिसिदरु मत्तु संक्षिप्ततॆ, वास्तवतॆगळु इदर गुणगळागिवॆ. शिक्षण, बदुकिन एळुबीळुगळु, स्वउद्योग, विज्ञान मॊदलादवुगळु सण्णकथॆगॆ वस्तुगळागिवॆ. प्रस्तुत कथॆयल्लि बहु मुख्यवागि इंदु विनाशद अंचिनल्लिरुव गुडिकैगारिकॆगॆ नम्म शिक्षणदल्लि नीडबेकाद महत्ववन्नु सादरपडिसुव उद्देशविदॆ. तंदॆय आसॆयंतॆ सर्कारि उद्योगवन्ने अवलंबिसदॆ, स्वयं उद्योग कंडुकॊळ्ळुव युवकनॊब्ब राष्ट्रमट्टद गौरवादरगळिगॆ पात्रनागुवुदे इल्लिय कथावस्तु.
story-n1: मग्गद साहेब अंदरॆ अब्दुल् रहीम् साहेब्. अवनु मग्गवन्नु मुट्टदॆ इप्पत्तु वर्षक्कू हॆच्चागिदॆ. आदरू अवनन्नु मग्गद साहेबनॆंदे करॆयुवुदु वाडिकॆ. अवर पूर्वजरु साहेब् बहाद्दूर् मग्गद हुसेन् साहेबरु जनप्रिय मत्तु धनवंत व्यक्तियागिद्दरु. अवरु मसीदि मात्रवल्ल; देवस्थानवन्नू कट्टिसिद्दरु. इंदिगू ई देवस्थानदल्लि रथोत्सवद समयदल्लि अवर मनॆतनद हिरिय प्रतिनिधिगॆ ऎल्लरिगिंतलू मुंदागि प्रसादवन्नु पडॆयुव हक्किदॆ. इंतह संप्रदाय पद्धतिगळु इंदिगू कर्नाटकदल्लि नडॆयुत्तिवॆ. इदरिंद पूर्वजरल्लि ऎंतह घनतॆ, सदाचार, सद्भावनॆगळु इद्दवु ऎंदु तिळियुवुदु. उदाहरणॆगॆ नन्नदे हुट्टूरिन पक्कदल्लि मुसल्मानर वसति इदॆ. अदरॊळगॆ ऒंदु पवित्र स्थानविदॆ. अल्लि ‘उर्स्’ ऎंब मुसल्मानर धार्मिक उत्सवद कालदल्लि नम्म मनॆतनद ऒब्ब प्रतिनिधि इद्दे इरबेकॆंब संप्रदाय इत्तु.
story-n2: हागॆये गणेशचतुर्थि, कृष्णाष्टमिगळ मरुदिन मुसल्मान समाजद प्रतिष्ठित मुख्यस्थरु नम्म मनॆगॆ बरुवुदु, कुशलोपचार मातनाडुवुदु, नावु अवरिगॆ मोदक, उंडॆ, चक्कुलि इत्यादि हब्बद भक्ष्य-भोज्यगळन्नु वितरणॆ माडुव संप्रदायवित्तु. ऒंदु बारि नम्म तायि कायिलॆ बिद्द कारण तंदॆयवरु अंगडियिंद लड्डुगळन्नु कॊंडु कॊट्टुदक्कॆ अवरिगॆ बहळ सिट्टु बंतु. ‘रायरॆ, अंगडियिंद तॆगॆदुकॊळ्ळलु नम्मल्लि हणविल्लवॆ? मनॆयल्लि कायिलॆयिद्दरॆ ऒंदु तुंडु बॆल्लवन्नो कल्लुसक्करॆ हरळन्नो कॊडि. निम्म हब्बद पूजॆय प्रसादवन्नु नावु तॆगॆदुकॊळ्ळुवुदु तलतलांतरदिंद बंद हळॆय संप्रदाय. अंगडिय मिठायियन्नु प्रसादवॆंदु कॊडुवुदु सरिये?’ ऎंदु केळिये बिट्टिद्दरु. अदु हेगे इरलि. ईग अब्दुल् रहीमनिगॆ ‘मग्गद साहेब’ ऎंदु हेळिदरॆ बहु सिट्टु बरुत्तित्तु. “अनिष्ट मग्गद हॆसरॆत्तबेडि”-“मग्गवल्ल कॊरळिगॆ हग्ग!” ऎंबुदु आतन निराशॆ, रोषगळ उद्गारवागित्तु. एकॆंदरॆ अवन अज्जन कालदल्लि ब्रिटिषरु अग्गद विलायति मिल्लिन बट्टॆगळन्नु नम्म देशदल्लि हेरिबिट्टरु. अवेनो निजक्कू निकृष्ट वस्तुगळु, ऒंदु वर्षदॊळगे कळेबरगळागि हरकु चिंदियागुवुवु. बण्णवो ऒंदे तिंगळल्लि विवर्णवागि
  ऎरडे तिंगळल्लि मायवागुवुदु. आदरेनु? बहु अग्ग. जनरिगॆ बेकादुदु अग्गद वस्तु. गुणवन्नु यारु केळुत्तारॆ? अग्गद मालिनदे आधिपत्यवायितु. मग्गदवरु भिकारिगळादरु. अवर अन्नक्कॆ संचकारवायितु.
story-n3: पाप! अब्दुल् रहीमन गति? हिरियरु कट्टिद भव्यवाद हळॆय कालद मनॆ. विशालवाद तोट. आदरॆ मग्गगळॆल्ला धूळु तुंबि जेडन बलॆगळिंद आच्छादितवागिवॆ. मनॆयल्लि ऊटक्कॆ इदॆयो इल्लवो ऎंबंतागिदॆ. ईग अवनिगॆ ऒंदे हठ, ऒंदे व्रत. अवन मूवरु गंडुमक्कळिगॆ ऒंदिष्टादरू विद्याभ्यास कॊडिसि सरकारि नौकररन्नागि माडबेकु ऎंदु. अंतॆये इब्बरु मक्कळु विधेयरागि अवन अभीष्टवन्नु नॆरवेरिसिदरु. ऒब्ब सरकारि कचेरियल्लि गुमास्तनाद. इन्नॊब्ब पोस्ट् मास्तरनाद. आदरॆ कॊनॆय मग करीम्निंद बहळ निरासॆ उंटायितु. करीम् आटदल्लू पाठदल्लू बहु चुरुकु; बुद्धिवंत; हसन्मुखि ऎल्लरिगू बेकादवनु. आदरॆ एनो कारणदिंद अवनिगॆ अनिष्ट मग्गदल्लि बहळ अभिरुचि, मनॆयल्लादरो मग्गवन्नु मुट्टलू तंदॆ बिडुत्तिरल्लिल्ल. आदरॆ मगन ग्रहचार ऎन्नि. शालॆयल्लिये मग्ग उद्भविसबेके? महात्मा गांधि प्रेरणॆयिंद कॆलवु शालॆगळल्लि ‘नवीन शिक्षण’ आरंभवायितु. ई व्यवस्थॆयल्लि विद्यार्थिगळिगॆ हलवु तरहद औद्योगिक शिक्षणवन्नु कॊडुवुदु, अवरल्लि हस्तकौशलवन्नु, देहश्रमदल्लि गौरव-भाववन्नु उंटु माडुवुदु ऒंदु भागवागित्तु. कॆलवरिगॆ बडगिय कॆलस, कॆलवरिगॆ बॆत्तद कुर्चि कॆलस इत्यादि सामग्रिगळन्नु माडुव,
  कॆलवरिगॆ कृषि, कॆलवरिगॆ मग्गद कॆलसवन्नु कलिसतॊडगिद्दरु.
story-n4: हुडुग करीम् मग्गद कॆलसवन्नु मीनु नीरिनल्लि ईजुवष्टे सुलभवागि कलितु बहु निपुणनागिबिट्ट. अवन तंदॆगॆ रोष उक्किबंतु. मुख्योपाध्याय शंकरप्प अवरॊडनॆ निष्ठुरवागि जगळवाडिद्दनु. आदरॆ हुडुग करीम् शालॆय मग्गदल्लि ऒंदु परिवर्तनॆयन्नु तन्नदे बुद्धिवंतिकॆ हागू कौशलदिंद माडिबिट्टिद्द. अदन्नु शंकरप्प अवरु स्वाभाविकवागिये प्रशंसॆ माडि मेलधिकारिगळिगॆ वरदि माडिद्दरु. अदर फलस्वरूपवागि सरकारदिंद हुडुग करीम्निगॆ ऒंदु बॆळ्ळिय पदकवू ऒंदु नूरु रूपायिय बहुमानवू बंदुबिट्टवु. हुडुगन उत्साह आकाशक्केरितु. तंदॆ ई हठमारिगॆ मग्गद हुच्चन्नु बिडिसबेकॆंदु शालॆयिंदले बिडिसिबिट्टनु. हॆड् मास्टर् शंकरप्प अवर ऎष्टो अनुनय विनयगळन्नु गणिसदॆ निराकरिसिदनु.
story-n5: ऒंदु दिन शालॆय वार्षिकोत्सव समारोपदल्लि हळॆय विद्यार्थिगळ ऒंदु नाटकवित्तु. अदरल्लि करीमनदु स्त्रीपात्र. अदक्कॆंदु तायियिंद गौप्यवागि हळॆकालद चिन्नद सरवन्नु अलंकारक्कॆंदु ऎरवलु तॆगॆदुकॊंड. नाटक मुगिद नंतर मनॆगॆ बरलिल्ल. ऎल्लो मायवागि होद. तंदॆगॆ मैयल्लि अग्निसंचारवायितु. मगनन्नु क्रूरवागि शपिसिदनु. “हाळागि होगलि! हठमारि. तंदॆय मातन्नु उल्लंघिसिदवनु ऎंदु मात्र तिळिदिद्दॆ. ईग कळ्ळनॆंदू तिळियितु. ननगॆ इब्बरे गंडु मक्कळु ; कळ्ळनादवनु, मनॆबिट्टु ओडिहोदवनु मगने अल्ल” ऎंदु आणॆ हाकिदनु. कॆलवु वर्षगळ अनंतर करीम् - ईग बॆळॆदु युवकनागिद्दानॆ - मनॆगॆ बंदु बागिलु तट्टिद. तंदॆ बागिलु तॆरॆदु मुख नोडि फटारनॆ बागिलु मुच्चिद. ऒंदु घंटॆ बागिलु तट्टिदरू तायि अत्तु हंबलिसिदरू बागिलु तॆरॆयले इल्ल. कॊनॆगॆ निवृत्तरागिरुव शंकरप्प अवर मनॆगॆ होगि, संधान माडिसिरि ऎंदु निवेदिसिद. ‘नन्न मुखवन्ने नोडबारदु ऎंदु हठविद्दरॆ कॊनॆगॆ तायियादरू नन्नन्नु काणबारदॆ? अम्मन चिन्नद सरवन्नु तंदिद्देनॆ. अदरॊडनॆ हत्तुसाविर रूपायिगळन्नु तंदिद्देनॆ. अवन्नादरू तायिय काल मेलॆ हाकि होगुत्तेनॆ. तंदॆयवरिगॆ समाधान हेळि. निम्म हळॆय शिष्यनिगॆ
  इदॊंदु उपकार माडि’ ऎंद.
story-n6: शंकरप्प अवरु मुदुकनॊडनॆ ऒंदु गंटॆ गोगरॆदरु, निवेदिसिदरु, तर्किसिदरु, चर्चिसिदरु. आदरॆ निष्फलवायितु. ऒंदु पदवन्नू केळुव ताळ्मॆ मुदुकनिगॆ इरलिल्ल. ‘साहेब् बहाद्दूर् हुसेन् साहेबर कीर्तिगॆ मसिहच्चिद्दानॆ. ई मातिनल्लि नीवु अड्डबायि हाकबेडि. नीवु कलिसिद पाठदिंदले ई हठमारि नम्म वंशद कीर्तियन्नु मण्णुपालु माडिद. हण तंदिद्दानंतॆ. कळविन हणवो? दरोडॆय हणवो?’ ऎंदु सिडुकिद. शंकरप्प अवरु मुखबाडिसिकॊंडु हिंतॆरळिदरु.
story-n7: करीम्न हण कळविनदू अल्ल. दरोडॆयदू अल्ल. सण्णप्रायदल्ले मग्गद सहकारि संघवॊंदन्नु स्थापिसि अवनीग अदर अध्यक्षनागिद्दानॆ. साकष्टु यशस्वियू धनवंतनू आगिद्दानॆ. अदू अल्लदॆ मग्गद यंत्रद प्रयोगदल्लि हॊस हॊस सुधारणॆगळन्नू परिवर्तनॆगळन्नू तंदु हॆसरु माडिद्दानॆ. आदरॆ ई विषयद लवलेशवू तंदॆगॆ तिळियदु. एकॆंदरॆ आत करीम्न कडॆगॆ तन्न हृदयवन्नु, मनॆय बागिलु मुच्चिदंतॆ-संपूर्णवागि मुच्चिबिट्टिद्दानॆ. यारादरू करीम्न हॆसरॆत्तिदरॆ ‘ननगॆ ऎरडे मक्कळु, कळ्ळर परिचय ननगिल्ल’ ऎंदे अवन निष्ठुरद उत्तर. कॆलवु वर्षगळ अनंतर अब्दुल् रहीम् हासिगॆयल्लि ऒरगिद्दानॆ. अनारोग्यदिंद नरळुत्ता इद्दानॆ. ऎलुबिन हंदरवागिद्दानॆ. कण्णू सरियागि काणिसुत्तिल्ल; किवियू सरियागि केळुत्तिल्ल. शंकरप्प अवरु बागिलु तट्टिदरु. ऒळगॆ बंदरु. कैयल्लि ऒंदु वार्तापत्रिकॆ. ‘रहीम् साहेबरे, ई पत्रिकॆ नोडिदिरा? ई भावचित्र नोडि?’ मुदुक कण्णिन हत्तिर तंद. आदरॆ पाप! कण्णु मंजागिवॆ. एनू तोरदु. अवन हॆंडति बंदु वार्तापत्रिकॆ तॆगॆदुकॊंडु होदळु. “करीम्! नम्म करीम्! नम्म करीम्” ऎंदु गट्टियागि उद्गरिसिदळु. “एनु? जेलिगॆ होदने? फाशी आयिते? इन्नू मनॆतनद मेलॆ एनु
  अपकीर्ति हेरिद्दानॆ?” ऎंदु मुदुक कॆम्मुत्त कॆम्मुत्त गर्जिसिद. “रहीम् साहेबरे, निम्म मग करीम्निगॆ राष्ट्रपति अवरु पद्मभूषण बिरुदन्नु कॊट्टिद्दारॆ. अदर भावचित्र ई वार्तापत्रिकॆयल्लिदॆ.”
story-n8: “आं! पद्मभूषण! अंदरेनु?” “पद्मभूषण अंदरॆ साहेब् बहाद्दूर्गिंतलू मेलिन बिरुदु. खान् साहेब्, खान् बहाद्दूर्, दिवान् बहाद्दूर् इवॆल्लदरिंदलू मेलॆ, दॊड्ड बिरुदु!” “करीम्! नन्न करीम्! साहेब् बहाद्दूर्गिंतलू मेलादने? देवरु दॊड्डवनु. देवरु दयाळु. नन्न बायियिंद बिद्द कॆट्ट मातन्नु देवरु किविगॆ हाकिकॊळ्ळलिल्ल. नन्न करीम् मग्गद हुसेन् साहेबर हॆसरिगॆ कीर्ति तंद” ऎंदु कॆम्मुत्त कॆम्मुत्त बिक्किबिक्कि अळतॊडगिद भावुकनागि.
author-1: बागलोडि देवरायअवरु(1927) दक्षिण कन्नड जिल्लॆय बागलोडियवरु. मंगळूरिन सर्कारि कालेजिनल्लि इंग्लिष् प्राध्यापकरागिद्दरु. आ कालक्कॆ ऐ.ऎ.ऎस्. परीक्षॆयल्लि तेर्गडॆ हॊंदि विदेशि सेवॆगॆ आय्कॆयादरु. मास्ति हागू इवरू समकालीनरु. अदल्लदॆ सण्णकतॆगळन्नु बरॆदवरु.अवरु रायभारियागिइटलि, नेपाळ, नैजीरिया, फिलिफैन्स्, न्यूजिल्यांड्, बल्गेरिया मॊदलाद देशगळल्लि कार्यनिर्वहिसिदरु. अवर कथासंग्रहगळॆंदरॆहुच्चु मुनसीफ मत्तु इतर कतॆगळु, आराधना, रुद्रप्पन रौद्र मत्तु इतर कतॆगळु.बागलोडि देवराय अवरु ऒट्टु 26 कतॆगळन्नु बरॆदिद्दारॆ. इवरु 1985 रल्लि निधनरादरु.
ashaya-1: प्रकृत गद्यभाग धार्मिक सहिष्णुतॆ, गुडिकैगारिकॆगळ विनाशक्कॆ कारणवाद अंश, शालॆगळल्लि औद्योगिक शिक्षण, मक्कळ आसक्तिगॆ पूरकवाद शिक्षण नीडुवुदु, स्वयं- उद्योगक्कॆ प्रेरणॆ मॊदलाद महत्वद अंशगळन्नु ऒळगॊंडिदॆ. तंदॆ मगनिगिद्द मग्गद बगॆगिन ऒलविगॆ विरोध व्यक्तपडिसिदरु. इदरिंद मननॊंद मग तन्न मार्गवन्नु स्वतंत्रवागि कंडुकॊंड आशयवन्नु हॊंदिदॆ ई पठ्यभाग. प्रकृत मग्गद साहेबकथॆयन्नुबागलोडि देवरायअवg समग्र कतॆगळुऎंब कथासंकलनदिंद (पुट 185-189) आय्द कथॆयन्नु संपादिसि निगदिपडिसिदॆ.
