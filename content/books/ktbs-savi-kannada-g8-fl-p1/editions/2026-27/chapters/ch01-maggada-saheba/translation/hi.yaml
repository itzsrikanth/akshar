intro-1: लोकप्रिय साहित्य प्रकारों में लघुकथा एक है। कहानी कहना-सुनना मनुष्य का स्वभाव है।
story-n1: मग्गद साहेब यानी अब्दुल रहीम साहेब। उन्होंने बीस से अधिक वर्षों से करघा नहीं छुआ, फिर भी उन्हें मग्गद साहेब कहते हैं।
ex-a-q1: रहीम ने करघा बिना छुए कितने वर्ष बिताए थे?
ex-a-q3: अब्दुल रहीम का हठ क्या था?
