intro-1: वैश्वीकरण के नाम पर प्रकृति से मुफ्त मिलने वाली हवा, रोशनी, पानी और भोजन को कमाने का मार्ग बनाना चिंताजनक है।
story-n1: भारत से बाहर कदम रखने पर बाकी सब 'पानी न देने वाले देश' हैं — अब तक का मेरा अनुभव।
