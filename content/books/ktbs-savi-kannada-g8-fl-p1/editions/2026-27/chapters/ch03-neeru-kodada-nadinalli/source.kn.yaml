segments:
- id: intro-1
  type: prose
  section: intro
  text: ವಿಶ್ವವು ಜಾಗತೀಕರಣದ ಹೆಸರಿನಲ್ಲಿ ಪ್ರಕೃತಿಯಿಂದ ಮಾನವನಿಗೆ ಉಚಿತವಾಗಿ ಲಭ್ಯವಾಗಬಹುದಾದ ಗಾಳಿ, ಬೆಳಕು, ನೀರು ಮತ್ತು ಆಹಾರಗಳಂಥ ಅತ್ಯವಶ್ಯಕವಾದ ವಸ್ತುಗಳನ್ನು ಹಣಗಳಿಸುವ ಮಾರ್ಗವನ್ನಾಗಿ ಪರಿವರ್ತಿಸಲು ಹೊರಟಿರುವುದು ಆತಂಕಕಾರಿ ವಿಷಯವಾಗಿದೆ.
- id: intro-2
  type: prose
  section: intro
  text: ಭಾರತೀಯರಾದ ನಾವು ಮಾನವೀಯತೆಗೆ ಬೆಲೆಕೊಟ್ಟು “ಬಳಲಿ ಬಂದವರಿಗೆ ನೀರು, ಹಸಿದು ಬಂದವರಿಗೆ ಅನ್ನವನ್ನಿಕ್ಕಿ” ಮೌಲ್ಯಯುತ ಸಂಸ್ಕøತಿಯನ್ನು ಕಾಪಾಡಿಕೊಂಡು ಬಂದಿರುವುದು ವಿಶ್ವವೇ ಹೆಮ್ಮೆಪಡುವ ಸಂಗತಿಯಾಗಿದೆ.
- id: story-n1
  type: prose
  section: story
  text: ಭಾರತದಿಂದ ಹೊರಗೆ ಕಾಲಿಟ್ಟರೆ, ಉಳಿದೆಲ್ಲವೂ ‘ನೀರು ಕೊಡದ ನಾಡುಗಳು’ ಎಂಬುದು ನನ್ನ ಇಲ್ಲಿಯವರೆಗಿನ ಅನುಭವ. ಎರಡು ವಾರ ಕಳೆದಿದೆ. ಊರೂರು ಅಲೆದಿದ್ದಾಯಿತು. ದಿನವೂ ಅಸಾಧ್ಯ ಬಾಯಾರಿಕೆ. ಕೋಲಾಗಳು, ಫ್ರೆಂಚ್ ವೈನ್, ಬಿಯರ್, ಬಾಟಲಿಯಲ್ಲಿ ಹಣ್ಣಿನ ರಸ ಧಾರಾಳವಾಗಿ ದೊರೆಯುತ್ತವೆ. ಕುಡಿಯಲು ನೀರು ಸಿಗದು.
- id: story-n2
  type: prose
  section: story
  text: ಇಲ್ಲಿ ಯೂರೋಪಿನಲ್ಲಾಗಲಿ, ಅಲ್ಲಿ ಅಮೇರಿಕದಲ್ಲಾಗಲಿ ನೀರು ಕೊಡುವ ಸಂಪ್ರದಾಯವಿಲ್ಲ. ಹಿಂದೆ ಇತ್ತೇನೋ, ಈಗಂತೂ ಇಲ್ಲ. ನೀರು ಸಲೀಸಾಗಿ ಎಲ್ಲೆಂದರಲ್ಲಿ ಪುಕ್ಕಟ್ಟೆಯಾಗಿ ನಿಮಗೆ ಖಂಡಿತ ಸಿಗದು. ನಮ್ಮಲ್ಲಿಯಂತೆ ರೈಲು ನಿಲ್ದಾಣಗಳಲ್ಲಿ, ಬಸ್ಸು ನಿಲ್ದಾಣಗಳಲ್ಲಿ, ವಿಮಾನ ನಿಲ್ದಾಣಗಳಲ್ಲೂ ‘ದುಡ್ಡಿಲ್ಲದೆ ಕುಡಿಯಬಲ್ಲ’ ನೀರನ್ನು ಇರಿಸುವುದಿಲ್ಲ. ಬಾಯಾರಿದಾಗ ಈಗಲೂ ಹೋಟೆಲ್ ಒಂದಕ್ಕೆ ಹೊಕ್ಕು, ನೀರು ಮಾತ್ರ ಕುಡಿದು ಹೊರ ಬರಬಹುದಾದ ಸವಲತ್ತು ಇಲ್ಲಿಲ್ಲ. ಮನೆಯ ಹೊರಗೆ ಕಾಂಪೌಂಡ್ ಗೋಡೆಗೆ ಸಣ್ಣ ತೊಟ್ಟಿ ಕಟ್ಟಿ, ‘ದನಕರುಗಳು ಕುಡಿದು ಹೋಗಲಿ’ ಎಂದು ನೀರು ತುಂಬಿಡುತ್ತಿದ್ದ ಬಾಲ್ಯದ ದಿನಗಳು ನನಗಿನ್ನೂ ನೆನಪಿವೆ. ನಾನು ದಿಲ್ಲಿಗೆ ಬಂದು, ವಿದೇಶಕ್ಕೆ ಹಾರಿದ್ದೆ. ದಿಲ್ಲಿಯಲ್ಲೋ ಧಗೆಧಗೆ ಬಿಸಿಲು. ಆದರೆ ಯಾರೋ ಪುಣ್ಯಾತ್ಮರು ಅಲ್ಲಿ ದೊಡ್ಡ ಮಣ್ಣಿನ ಮಡಕೆಗಳಲ್ಲಿ ನೀರು ತುಂಬಿಟ್ಟಿರುತ್ತಿದ್ದರು. ಅನೇಕ ಗುರುದ್ವಾರಗಳ ಬಳಿ, ಸ್ವಯಂ ಸೇವಕರು ನೀರಿನ ದೊಡ್ಡ ಕೊಳಾಯಿ ಹಿಡಿದು, ನಿಲ್ಲಿಸಿದ ಆಟೋ, ಬಸ್ಸು ಹಾಗೂ ದಾರಿಹೋಕರಿಗೆಲ್ಲ ನೀರು ತುಂಬಿ ತುಂಬಿ ಕುಡಿಸುವುದನ್ನೂ ನೋಡಿದ್ದೇನೆ. ರೋತಕ್ ರಸ್ತೆಯ ಅತ್ತೆಯ ಮನೆಯೊಳಗೆ ಕಾಲಿಡುತ್ತಿದ್ದಂತೆ, ‘ಬೇಟಾ ತಾಯಾಜಿ ಆಯೆ ಹೈ, ಥಂಡಾ ಪಾನಿ ಪಿಲಾವೋ’ ನನ್ನ ಮೈದುನನ ಮಗನಿಗೆ ಅತ್ತೆ ಕೂಗಿ ಹೇಳಿದರು. ಪುಟ್ಟ ಹುಡುಗ ತತ್ಕ್ಷಣ ‘ತಣ್ಣನೆಯ ನೀರು’ ತಂದು ಕೈಗಿಟ್ಟ.
- id: story-n3
  type: prose
  section: story
  text: ದಿಲ್ಲಿಯ ಧೂಳು ಹಾದಿಗಳೆಲ್ಲ ಮರೆತವು. ಮನೆಗೆ ಬಂದವರಿಗಂತು ‘ ಮೊದಲು ನೀರು ಕೊಡುವ’ ಸಂಪ್ರದಾಯ. ಡಾಬಾ ಆಗಲಿ, ದರ್ಶಿನಿ ಆಗಲಿ, ಪಂಚತಾರಾ ಹೋಟಲೇ ಆಗಲಿ ಮೊದಲು ನೀರು ಮೇಜಿನ ಮೇಲೆ ಕುಳಿತುಕೊಳ್ಳುತ್ತದೆ. ಪುಕ್ಕಟ್ಟೆಯಾಗಿ ಕೊಡುವ ನೀರು. ಆದರೆ ನಾನೀಗ ‘ನೀರು ಕೊಡದ ನಾಡು’ಗಳಲ್ಲಿ ಅಲೆಯುತ್ತಿದ್ದೇನೆ. ‘ಮ್ಯಾಗ್ಡೊನಾಲ್ಡ್’ ನಂತಹ ಅಗ್ಗದ ಫಾಸ್ಟ್ಪುಡ್ ಜಾಯಿಂಟ್ಸ್ಗೆ ಹೋಗಿ, ವೈಭವದ ಪಂಚತಾರಾ ಹೋಟೇಲುಗಳಿಗೇ ಹೋಗಿ, ನೀರು ಇಡುವ ಅಥವಾ ಕೊಡುವ ಸಂಪ್ರದಾಯವೇ ಇಲ್ಲಿಲ್ಲ. ಹೋಟೇಲುಗಳಲ್ಲಿ ವೈನ್, ಬಿಯರ್, ಇಲ್ಲವೇ ಕೋಲಾಗಳಿಂದಲೇ ಊಟ ಆರಂಭ. ‘ಮ್ಯಾಗ್ಡೊನಾಲ್ಡ್’ಗಳಲ್ಲಿ ಫ್ರೆಂಚ್ ಪ್ರೈಸ್ ಇರಲಿ, ಸ್ಯಾಂಡ್ವಿಚ್ ಆಗಲಿ, ಬರ್ಗರ್ ಆಗಲಿ ಜೊತೆಗೆ ದೊಡ್ಡ ಗಾತ್ರದ ಕೋಲಾದೊಡನೆಯೇ ನೀಡುತ್ತಾರೆ.
- id: story-n4
  type: prose
  section: story
  text: ಮಧ್ಯಾಹ್ನದ ಊಟದ ಸಮಯ, ನಾನು ‘ನೀರು, ನೀರು’ ಎಂದು ಬಡಬಡಿಸುವಾಗ, ಸಣ್ಣ ಬಾಟಲಿಯಲ್ಲಿ ನೀರು ಬರುತ್ತಿತ್ತು. ಕುಡಿದು ನೋಡಿದರೆ ಅದು ಬರೀ ಸೋಡಾ. ‘ಸೋಡಾ ಅಲ್ಲ ವಾಟರ್’ ಎನ್ನುತ್ತಿದ್ದೆ. ‘ಇದು ನೀರೆ, ಸ್ಪಾಕ್ರ್ಲಿಂಗ್ ವಾಟರ್’ ಎನ್ನುತ್ತಿದ್ರು. ‘ ಅಪ್ಪಾ ಮಹಾನಿಯರೇ, ನನಗೆ ಹೊಳೆಯುವ ನೀರು ಬೇಡ. ಸಾದಾ ನೀರು ಕೊಡಿ’ ಎಂದೆ ಪುಟ್ಟ ಬಾಟಲು ತರಿಸಿದರು. ಸ್ಟಲ್ ವಾಟರ್ ಹೊಸ ಪದಪುಂಜವನ್ನು ಕಲಿತೆ. ಅದನ್ನು ಕುಡಿದು ನೋಡಿದರೆ, ಅದರಲ್ಲೂ ಅಲ್ಪ ಮಟ್ಟದ ಸೋಡಾ, ಕಡೆಗೂ ದುಡ್ಡು ಕೊಟ್ಟರೂ, ಸೀದಾಸಾದಾ ನೀರು ಸಿಗುವುದು ಅಪರೂಪವಿತ್ತು. ಏಕೆ ಹೀಗೆ? ಉತ್ತರ ಹೊಳೆಯುವುದೇನೂ ಕಷ್ಟವಲ್ಲ. ಪುಕ್ಕಟ್ಟೆಯಾಗಿ ಏನನ್ನೂ ಕೊಡದಿದ್ದರೆ, ನೀವು ಕೊಳ್ಳುತ್ತೀರಿ. ಕೊಳ್ಳುತ್ತಿರುವುದು ಸೀದಾಸಾದಾ ಅಲ್ಲ ಎಂದು ನಂಬಿಸಿದರೆ, ಮತ್ತಷ್ಟು ಕೊಳ್ಳುತ್ತೀರಿ. ‘ಕೊಳ್ಳುತ್ತಿರುವುದು ಅದ್ಭುತವಾದದ್ದು’ ಎಂದರೆ ಇನ್ನಷ್ಟು ಕೊಳ್ಳುತ್ತೀರಿ. ಕೊಳ್ಳುಬಾಕ ಸಂಸ್ಕøತಿಯ ತಳಹದಿಯೇ ಇಲ್ಲಿದೆ. ನೀರು ನಿಮಗೆ ಧಾರಾಳವಾಗಿ ಎಲ್ಲೆಡೆ ಪುಕಟ್ಟೆಯಾಗಿ ದೊರತರೆ, ಕೋಲಾ ಕಂಪನಿಗಳ ಜಾಹೀರಾತಿಗೆ ಮಣಿಯುವುದು ಹೇಗೆ? ಇದು ಒಂದು ಬಗೆಯ ಸೂಕ್ಷ್ಮ ರೀತಿಯ ‘ಸೈಕಾಲಜಿಕಲ್ ವಾರ್ ಫೇರ್’. ಅಮೆರಿಕದ ಉದ್ದಗಲವನ್ನು ವಾರಗಟ್ಟಲೆ ಅಲೆವಾಗ, ಎಲ್ಲೆಡೆಯಲ್ಲಿ ಗಮನಿಸಿದ್ದೆ, ದೊಡ್ಡಗಾತ್ರದ ಕೋಲಾ ಬಾಟಲಿಗಳಿಗೆ 0.99 ಡಾಲರ್ ಬೆಲೆ, ಅದೇ ಸಣ್ಣಗಾತ್ರದ ನೀರಿನ ಬಾಟಲಿಗೂ ಅದಕ್ಕಿಂತ ಹೆಚ್ಚಿನ ಹಣ! ಕೊಳ್ಳುವ ಗ್ರಾಹಕನ
    ಮನಸಿನಲ್ಲಿ ‘ನೀರಿಗೇಕೆ ಅಷ್ಟು ಹಣ? ಅದಕ್ಕಿಂತ ಅಗ್ಗವಾಗಿ ಕೋಲಾ ಸಿಗುತ್ತದೆಯಲ್ಲ?, ಎಂಬ ತರ್ಕ ಹೊಳೆದು ಕೋಲಾ ಅಭ್ಯಾಸ ಮಾಡಿಕೊಳ್ಳುತ್ತಾನೆ. ಅಲ್ಲಿಗೆ ನೀರು ಕುಡಿಯುವ ಅಭ್ಯಾಸ ತಪ್ಪುತ್ತದೆ. ವಿದೇಶಗಳಲ್ಲಿ ಮನೆಯ ನಲ್ಲಿಯಲ್ಲಿ ಬರುವ ನೀರನ್ನು ಯಾರೂ ಕುಡಿಯುವುದಿಲ್ಲ. ಅದನ್ನು ಕುಡಿದರೇನು ಪ್ರಾಣ ಹೋಗುವುದಿಲ್ಲ. ಆದರೆ ‘ ಅದು ಶುದ್ಧವಲ್ಲ, ಶುದ್ಧ ನೀರನ್ನು ಬಾಟಲಿಯಲ್ಲಿ ಕೊಂಡು ಮಾತ್ರ ತರಬಹುದು’ ಎಂದು ಇಡೀ ದೇಶದ ತಲೆ ತೊಳೆದಿರುವಾಗ, ಪ್ರತಿಯೊಬ್ಬರೂ
- id: story-n5
  type: prose
  section: story
  text: ನೀರನ್ನು ಕೊಂಡು ಕುಡಿಯುತ್ತಾರೆ. ಇಂತಹುದೇ ಹುನ್ನಾರ ಭಾರತದಲ್ಲಿ ಅದಾಗಲೇ ಆರಂಭವಾಗಿದೆ. ಕೀಟನಾಶಕವಿರುವ ನೀರನ್ನೂ ಶುದ್ಧವೆಂದು ಮಾರಿ ಉದ್ಧಾರವಾದ ಕಂಪನಿಗಳು! ಕೊಳ್ಳುಬಾಕ ಸಂಸ್ಕøತಿಯ ಪರಾಕಾಷ್ಠೆಯಾಗಿ ನನಗೆ ‘ನೀರು ಕೊಡದ ನಾಡುಗಳು’ ಕಾಣುತ್ತವೆ. ಇಂತಹುದೇ ಮರಳುತನಕ್ಕೆ ಅದಾಗಲೇ ಭಾರತೀಯರು ಬಲಿಯಾಗಿದ್ದಾರೆ. ನಮ್ಮ ಎಳನೀರು, ಮಜ್ಜಿಗೆ, ಪಾನಕ, ಕಬ್ಬಿನ ಹಾಲು, ತಾಜಾ ಹಣ್ಣಿನ ರಸ ಎಲ್ಲವನ್ನು ತೊರೆದು ಕೋಲಾಗಳಿಗೆ ಮುಗಿಬೀಳುತ್ತಿರುವ ಜನರ ಸಂಖ್ಯೆ ಏರುತಿದೆ. ವೈಯಕ್ತಿಕ ವಿದೇಶ ಪ್ರವಾಸಗಳಲ್ಲಿ ನನಗೆ ಇಷ್ಟು ಕಷ್ಟವಾಗಿದ್ದಿಲ್ಲ. ತಿಂಗಳುಗಟ್ಟಲೆ ಅಲೆದರೂ ನಾವಿಳಿದುಕೊಳ್ಳುತ್ತಿದ್ದ ಅಗ್ಗದ ಹೋಟೇಲಿನಿಂದ ಬೆಳಗ್ಗೆ ಹೊರಡುವಾಗಲೇ ಬಾಟಲಿಯಲ್ಲಿ ನಲ್ಲಿ ನೀರನ್ನು ತುಂಬಿಸಿಕೊಂಡು ಹೊರಡುತ್ತಿದ್ದೆವು. ನಮ್ಮ ಭಾರತೀಯ ‘ನಿರೋಧಕ ಶಕ್ತಿಯ’ ಎದುರು ಯಾವ ನೀರಾದರೂ ಅಡ್ಡಿ ಇರಲಿಲ್ಲ. ಆದರೆ ಕೆಲಸದ ಮೇಲೆ ಬಂದ ಈ ಪ್ರವಾಸದಲ್ಲಿ ಮಣಮಣ ಫೈಲುಗಳನ್ನು ಹೊತ್ತು, ಅಲ್ಲಿಂದಿಲ್ಲಿಗೆ ಇಲ್ಲಿಂದಲ್ಲಿಗೆ ಅಲೆಯುವಾಗ ನೀರಿನ ಬಾಟಲಿ ಹಿಡಿದು ಹೋಗುವುದು ಅಸಾಧ್ಯವಾಗಿತ್ತು.
- id: story-n6
  type: prose
  section: story
  text: ಕೊಳ್ಳುಬಾಕತನ, ಲಾಭಕೋರತನದ ರೋಗಗಳು ಸಾಂಕ್ರಾಮಿಕವಾಗಿ ಎಲ್ಲ ನೆಲದಲ್ಲೂ ಹರಡಿ, ಭಾರತಕ್ಕೂ ಲಗ್ಗೆ ಇಟ್ಟಿವೆ ಎಂದು ತೀರಾ ಇತ್ತೀಚಿನ ದಿನಗಳಲ್ಲಿ ಗಾಢವಾಗಿ ನಮ್ಮೆಲ್ಲರಿಗೂ ಅನುಭವವಾಗಿದೆ. ‘ಸಂಸ್ಕøತಿಯ ಮೇಲೆ ದಾಳಿ’ ಎನ್ನುವಾಗ ನನಗೆ ‘ಮದರ್ಸ್ಡೇ,’ ‘ಫಾದರ್ಸ್ ಡೇ’, ‘ವ್ಯಾಲೆಂಟೈನ್ ಡೇ’ ಆಚರಿಸುವುದು ಅಷ್ಟು ದೊಡ್ಡ ಅನಾಹುತವಾಗಿ ಕಾಣುವುದಿಲ್ಲ. ಈ ಹೊಸ ಹೊಸ ದಿನಗಳೆಲ್ಲ ಉಕ್ಕಿದ ಪ್ರೀತಿಯ ದ್ಯೋತಕವಲ್ಲ. ‘ಗಿಫ್ಟ್’, ‘ಗ್ರೀಟಿಂಗ್ ಕಾರ್ಡ್’ ಮಾರುವ ಹೊಸ ಹುನ್ನಾರಗಳೆಂದು ಸರ್ವರಿಗೂ ವೇದ್ಯವಾಗಿದೆ. ಆದರೆ ನನಗೆ ಗಾಬರಿ ಹುಟ್ಟಿಸುವುದು ನಮ್ಮ ಭಾರತೀಯ ಸಂಸ್ಕøತಿಯ ಬುನಾದಿಯನ್ನು ಜೀವನಶೈಲಿಯನ್ನು, ನಂಬಿಕೆಗಳನ್ನು, ಮೌಲ್ಯಗಳನ್ನು, ಸಂಸ್ಕøತಿಯ ಬುನಾದಿಯನ್ನು ಅಲುಗಿಸುವ ‘ಕೊಳ್ಳುಬಾಕತನ’. ಅಗತ್ಯಗಳಲ್ಲಿ ನಡೆದು ಹೋಗುತ್ತಿದ್ದ ಬದುಕು, ಇಂದು ‘ಬೇಕು’ಗಳ ಬಲೆಗೆ ಬಿದ್ದಿದೆ. ಸರಕಾರಿ ಕಾಲೇಜಿನ ಪ್ರೊಫೆಸರ್ ಮತ್ತು ಪ್ರಾಂಶುಪಾಲರಾದ ನಮ್ಮ ತಂದೆಗೆ ಕಾಲೇಜಿಗೆ ಸೈಕಲಿನಲ್ಲಿ ಹೋಗುವುದು ಅಪಮಾನಕರವಾಗಿ ಕಂಡಿರಲೇ ಇಲ್ಲ. ಕೊಂಡ ಒಂದು ವಸ್ತುವನ್ನು ಬದುಕಿಡೀ ಬಳಸುವ ಪರಿಪಾಠವಿತ್ತು. ಇಂದು ಶಾಲೆಯಲ್ಲಿಯೇ ಬೈಕು ಬೇಕು ಎನ್ನುವ ಮಗ. ಇಂತಹುದೇ ಬ್ರಾಂಡಿನ ಶೂ ಬೇಕು ಎನ್ನುವ ಮಕ್ಕಳು. ಮಾರುತಿ ಕಾರಿದ್ದರೆ, ಸ್ಯಾಂತ್ರೋ ಬೇಕು ಎಂದು ಓಡುವ ಹಿರಿಯರು. ಮಾರುಕಟ್ಟೆಗೆ ಬಂದದ್ದೆಲ್ಲವು ಬೇಕು. ಬೇಕುಗಳನ್ನು ‘ಅಗತ್ಯ’ಗಳಾಗಿ, ಹಾಗೂ ‘ಅತ್ಯಗತ್ಯ’ಗಳಾಗಿ ಬಲು ಜಾಣತನದಿಂದ
    ಬದಲಿಸುವ ಜಾಹೀರಾತುಗಳು ಮತ್ತೆ ಮತ್ತೆ ಬಿತ್ತರಿಸುತ್ತವೆ. ಆರಾಮ, ಐಷಾರಾಮದ, ಅಪ್ಪಟ ಅನಗತ್ಯದ ವಸ್ತುಗಳನ್ನು ‘ಇವಿಲ್ಲದೆ ಬದುಕಿಲ್ಲ’ ಎಂಬಂತೆ ಬಿಂಬಿಸುತ್ತಾರೆ. ‘ಡಿಓಡರೆಂಟ್’ ಹಾಕಿಕೊಳ್ಳದೆ ಇದ್ದರೆ ‘ ತಾನು ನಾತ ಬಡಿಯುತ್ತೇನೆ’ ಎಂಬಷ್ಟು ಕೀಳರಿಮೆಯನ್ನು ಹುಟ್ಟಿಸಬಲ್ಲರು. ಕೊನೆಗೆ ಎಲ್ಲವೂ ನಿಮ್ಮನ್ನು ಕೊಳ್ಳುವಂತೆ ಪ್ರೇರೇಪಿಸುತ್ತವೆ.
- id: story-n7
  type: prose
  section: story
  text: ಕೆಲವು ವರ್ಷಗಳ ಹಿಂದೆ ದಿನಪತ್ರಿಕೆಯಲ್ಲಿ ಓದಿದ್ದೆ. ಜನಪ್ರಿಯ ಹೋಟೆಲಿನ ಮಾಲೀಕರೊಬ್ಬರು ಬರೆದಿದ್ದರು. ತಂಪು ಪಾನೀಯದ ಕಂಪನಿಯೊಂದು ಆತನನ್ನು ಸಂಪರ್ಕಿಸಿ ‘ನೀವು ಗ್ರಾಹಕರಿಗೆ ಬಂದೊಡನೆ ನೀರು ಕೊಡುವುದನ್ನು ನಿಲ್ಲಿಸಿದರೆ, ಇಷ್ಟು ಹಣ ಕೊಡುವುದಾಗಿ’ ಹೇಳಿತ್ತಂತೆ! ಈಗಾಗಲೇ ಬೆಂಗಳೂರಿನಲ್ಲೂ ನನಗೆ ‘ನೀರು ಕೊಡದ ಸಂಸ್ಕøತಿ’ಯ ಅನುಭವವಾಗಿದೆ. ಮಹಾತ್ಮಗಾಂಧಿ ರಸ್ತೆಯ ‘ಬಾಂಬೆ ಬಜಾರ್’ ಎದುರಿನ ಪುಟ್ಟ ಜಾಯಿಂಟ್ನಲ್ಲಿ ನಾನು ಮತ್ತು ಮಗಳು ಕುಳಿತಿದ್ದೆವು. ಇಲ್ಲಿ ನೀರು ತಂದಿಡಲಿಲ್ಲ. ಐಸ್ಕ್ರೀಂ ತಿಂದ ನಾವು ‘ನೀರು ಬೇಕು’ ಎಂದು ಕೇಳಿದೆವು. ‘ಮಿನರಲ್ ವಾಟರ್?’ ವೇಟರ್ ಪ್ರಶ್ನಿಸಿದ ‘ಇಲ್ಲಪ್ಪ ಸಾಮಾನ್ಯ ನೀರು’ ಎಂದೆ. ಮಾಯವಾದ ವೇಟರ್ ಹದಿನೈದು ನಿಮಿಷ ಕಾದರೂ ಬರಲೇ ಇಲ್ಲ. ಕಾದು ಕಾದು ಸುಸ್ತಾಗಿ ಕೊನೆಗೆ ಕೌಂಟರಿಗೇ ಹೋಗಿ, ಬಿಲ್ಲು ಕೊಟ್ಟು ಹೊರಬಿದ್ದೆವು. ಅದೇ ವೇಟರ್, ಪುಟ್ಟ ಪುಟ್ಟ ಬಾಟಲಿಗಳಲ್ಲಿ ಮಿನರಲ್ ವಾಟರುಗಳನ್ನು ಬೇರೆ ಬೇರೆ ಮೇಜಿಗೆ ಸರಬರಾಜು ಮಾಡುವುದು ಕಂಡಿತು. ‘ಮಿನರಲ್ ವಾಟರ್?’ ಎಂದ ಅವರು ಕೇಳುವ ಭಂಗಿ ಭಾವ ಹೇಗಿರುತ್ತದೆ ಎಂದರೆ ನಿಮಗೆ ‘ಆರ್ಡಿನರಿ ವಾಟರ್’ ಎಂದು ಹೇಳಲೂ ಹಿಂಜರಿಕೆಯಾಗಬೇಕು. ಆದರೆ ನಿಜಕ್ಕೂ ಆಘಾತವಾದದ್ದು, ತೀರಾ ಇತ್ತೀಚೆಗೆ ಮಾಲತಿಯೊಡನೆ ಇಂದಿರಾನಗರದ ಮುಖ್ಯ ರಸ್ತೆಯ ಪುಟ್ಟ ಜಾಯಿಂಟ್ಗೆ ಹೊಸ ಬಗೆಯ ಐಸ್ಕ್ರೀಂ ತಿನ್ನುವ ಬಯಕೆಯಲ್ಲಿ ಹೊಕ್ಕಾಗ. ‘ಮಿಸಿಸಿಪಿ ಮಡ್ ಪೀ’ ಎಂದು ಎಲ್ಲೋ ಪತ್ರಿಕೆಯಲ್ಲಿ
    ಓದಿದ್ದ ಮಾಲತಿ, ಆರ್ಡರ್ ಮಾಡಿದರು. ದೊಡ್ಡ ಬಿಳಿ ಪಿಂಗಾಣಿ ತಟ್ಟೆಯಲ್ಲಿ ಕೇಕ್ ಮತ್ತು ಐಸ್ಕ್ರೀಂ ಇರಿಸಿ, ಮೇಲೆ ಕೋಕೋ ಪುಡಿ ಉದುರಿಸಿ ಆಕರ್ಷಕವಾಗಿ ತಂದಿಟ್ಟರು. ಬೆಲೆ ನೂರು ರೂಪಾಯಿ ಎಂದಾಗ ಹೌಹಾರಿದ್ದುಂಟು! ಇಲ್ಲೂ ನೀರು ಕೊಟ್ಟಿರಲಿಲ್ಲ. ‘ನೀರು ಕೊಡಿ’ ಎಂದೆ, ‘ಮಿನಿರಲ್ ವಾಟರ್?’ ಎಂದಳು ಸರ್ವ್ ಮಾಡುತ್ತಿದ್ದ ಹುಡುಗಿ. ‘ಇಲ್ಲ ಸಾಧಾರಣ ನೀರು’ ಎಂದರೆ, ನಮ್ಮಲ್ಲಿ ಸಾಧಾರಣ ನೀರು
- id: story-n8
  type: prose
  section: story
  text: ಇಲ್ಲ ಎಂದು ಬಿಡುವುದೆ! ನೂರು ರೂಪಾಯಿ ಐಸ್ಕ್ರೀಂ ತಿಂದರೂ ಪುಕ್ಕಟ್ಟೆಯಾಗಿ ಒಂದು ಲೋಟ ನೀರು ಕೊಡದ ಜಾಯಿಂಟ್ಗಳಿವು. ಮತ್ತೆ ಹತ್ತೊ-ಇಪ್ಪತ್ತೋ ಪಡೆದು ಮಿನರಲ್ ವಾಟರ್ ಮಾರುವ ಹುನ್ನಾರ. ನನಗೆ ರೇಗಿಹೋಯಿತು. ಅಲ್ಲಿ ನೀರು ಕೊಡಲಿಲ್ಲ. ಹೊರಬಂದು ‘ಬನ್ನಿ ಮಾಲತಿ ಸಾಗರ್ಗೆ, ಪಾನಿಪುರಿ ತಿನ್ನೋಣ’ ಎಂದೆ. ಎದುರಿಗೊಂದು ‘ಸಾಗರ್’ ಹೋಟೆಲಿತ್ತು. ನುಗ್ಗಿದೆವು. ಕುಳಿತೊಡನೆ ವೇಟರ್ ಬಂದು ನಾಲ್ಕು ಲೋಟ ನೀರು ತಂದಿಟ್ಟ. ಬರೀ ಬಾಯಲ್ಲ ಮನಸ್ಸೂ ತಂಪಾಯಿತು. ಹೇಳಿ, ಕಾಯ್ದುಕೊಳ್ಳಬಲ್ಲವೇ ಮಾನವೀಯ ಮೌಲ್ಯಗಳನ್ನು, ಕೊಳ್ಳುಬಾಕತನದ ಕಪಿಮುಷ್ಠಿಯಿಂದ ಬಿಡಿಸಿಕೊಳ್ಳಬಲ್ಲವೇ? ಬಾಯಾರಿದವರಿಗೆ ನೀರು ಕೊಡಬಲ್ಲವೆ? ಹಸಿದವರಿಗೆ ಅನ್ನ ಕೊಡಬಲ್ಲವೆ? ಇನ್ನೊಬ್ಬರ ನೀರು-ಅನ್ನವನ್ನು ಕಸಿದುಕೊಳ್ಳದೆ ಬದುಕಬಲ್ಲವೆ? ನಮ್ಮ ಸಂಸ್ಕøತಿಯನ್ನು ಕಾಯ್ದುಕೊಳ್ಳುವ ಅಸ್ತ್ರ, ನಮ್ಮ ಕೈಯಲ್ಲೇ ಇದೆಯಲ್ಲವೇ? ‘ಮತ್ತೆಂದೂ ನೀರು ಕೊಡದ ಆ ಜಾಯಿಂಟ್ಗೆ ಹೋಗುವುದಿಲ್ಲ. ನನ್ನಿಂದಂತೂ ಇಂತಹ ಜಾಯಿಂಟ್ಗಳು ಉದ್ಧಾರವಾಗುವುದು ಬೇಡ’ ಎಂದುಕೊಂಡಿದ್ದೇನೆ.
- id: author-1
  type: prose
  section: author
  text: ಶ್ರೀಮತಿ ನೇಮಿಚಂದ್ರಅವರುಚಿತ್ರದುರ್ಗದಲ್ಲಿ ಜುಲೈ 16, 1959 ರಂದು ಜನಿಸಿದರು. ತಂದೆ ಪ್ರೊ. ಜಿ. ಗುಂಡಣ್ಣ, ತಾಯಿ ತಿಮ್ಮಕ್ಕ. ಪ್ರಾರಂಭಿಕ ಶಿಕ್ಷಣ ತುಮಕೂರು, ಮೈಸೂರಿನಲ್ಲಿ ಪೂರೈಸಿದರು. ಮೈಸೂರಿನ ನ್ಯಾಷನಲ್ ಇನ್ಸ್ಟಿಟ್ಯೂಟ್ ಆಫ್ ಎಂಜನಿಯರಿಂಗ್ನಿಂದ ಬಿ.ಎಸ್.ಸಿ. ಪದವಿಯನ್ನು ಬೆಂಗಳೂರಿನ ಇಂಡಿಯನ್ ಇನ್ಸ್ಟಿಟ್ಯೂಟ್ ಆಫ್ ಸೈನ್ಸ್ನಿಂದ ಎಂ.ಎಸ್. ಪದವಿಯನ್ನು ಗಳಿಸಿದರು. ಬೆಂಗಳೂರಿನ ಎಚ್.ಎ.ಎಲ್. ಸಂಸ್ಥೆಯಲ್ಲಿ ಉನ್ನತ ತಂತ್ರಜ್ಞ ಅಧಿಕಾರಿಯಾಗಿ ಕೆಲಸ ನಿರ್ವಹಿಸುತ್ತಿದ್ದಾರೆ. ಕನ್ನಡದಲ್ಲಿ ಚಿಂತನ ಪೂರ್ಣ ಲೇಖನ, ಪುಸ್ತಕಗಳನ್ನು ಬರೆಯುತ್ತಿದ್ದಾರೆ. ಇವರ ಪ್ರಮುಖ ಕೃತಿಗಳೆಂದರೆಯಾದ್ ವಶೇಮ್ - ಕಾದಂಬರಿ, ನಮ್ಮ ಕನಸುಗಳಲ್ಲಿ ನೀವಿದ್ದೀರಿ, ಮತ್ತೆ ಬರೆದ ಕಥೆಗಳು, ನೇಮಿಚಂದ್ರರ ಕಥೆಗಳು ಮುಂತಾದ ಕಥಾಸಂಕಲನಗಳು.ಒಂದು ಕನಸಿನ ಪಯಣ, ಪೆರುವಿನ ಪವಿತ್ರ ಕಣಿವೆಯಲ್ಲಿ - ಪ್ರವಾಸ ಕಥನಗಳು. ಬದುಕು ಬದಲಿಸಬಹುದು ಅಂಕಣ ಬರಹಗಳುಮೊದಲಾದವುಗಳು. ಪೆರುವಿನ ಪವಿತ್ರ ಕಣಿವೆಯಲ್ಲಿ ಕೃತಿಗೆ ಕರ್ನಾಟಕ ಸಾಹಿತ್ಯ ಪ್ರಶಸ್ತಿ. ನೃಪತುಂಗ ಪ್ರಶಸ್ತಿ, ಅತ್ತಿಮಬ್ಬೆ ಪ್ರಶಸ್ತಿಗಳುಸಂದಿವೆ. ಪ್ರಸ್ತುತ‘ನೀರು ಕೊಡದ ನಾಡಿನಲ್ಲಿ’ಅಂಕಣ ಬರೆಹವನ್ನು ಶ್ರೀಮತಿ ನೇಮಿಚಂದ್ರ ಅವರ‘ಬದುಕು ಬದಲಿಸಬಹುದು’ಕೃತಿಯಿಂದ ಆಯ್ದು ಸಂಪಾದಿಸಿ ನಿಗದಿಪಡಿಸಿದೆ.
- id: ashaya-1
  type: prose
  section: ashaya
  text: ವಿಶ್ವದ ಜಾಗತೀಕರಣದ ಹೊಡೆತಕ್ಕೆ ಸಿಲುಕಿದ ನಮ್ಮ ನಗರಗಳಿಂದು ಕೊಳ್ಳುಬಾಕತನವನ್ನು, ಲಾಭಕೋರತನವನ್ನು ಹುಟ್ಟುಹಾಕಿ ವಿಶ್ವದ ಮಾರುಕಟ್ಟೆಯಾಗಲು ಹೊರಟಿರುವುದು ಬಲು ಅಪಾಯಕಾರಿ ಎಂಬ ವೈಚಾರಿಕ ಚಿಂತನೆಯನ್ನು ಹಾಗೂ ನಮ್ಮ ಸಂಸ್ಕøತಿಯ ಹಿರಿಮೆಯನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳುವ ಅನಿವಾರ್ಯತೆಯನ್ನು “ನೀರು ಕೊಡದ ನಾಡಿನಲ್ಲಿ” ಈ ಗದ್ಯಭಾಗದಲ್ಲಿ ಅತ್ಯುತ್ತಮವಾಗಿ ಚಿತ್ರಿಸಿದೆ.
