intro-1: viśvavu jāgatīkaraṇada hèsarinalli prakṛtiyiṃda mānavanigè ucitavāgi labhyavāgabahudāda gāḻi, bèḻaku, nīru mattu āhāragaḻaṃtha atyavaśyakavāda vastugaḻannu haṇagaḻisuva mārgavannāgi parivartisalu hòraṭiruvudu ātaṃkakāri viṣayavāgidè.
intro-2: bhāratīyarāda nāvu mānavīyatègè bèlèkòṭṭu “baḻali baṃdavarigè nīru, hasidu baṃdavarigè annavannikki” maulyayuta saṃskaøtiyannu kāpāḍikòṃḍu baṃdiruvudu viśvave hèmmèpaḍuva saṃgatiyāgidè.
story-n1: bhāratadiṃda hòragè kāliṭṭarè, uḻidèllavū ‘nīru kòḍada nāḍugaḻu’ èṃbudu nanna illiyavarègina anubhava. èraḍu vāra kaḻèdidè. ūrūru alèdiddāyitu. dinavū asādhya bāyārikè. kolāgaḻu, phrèṃc vain, biyar, bāṭaliyalli haṇṇina rasa dhārāḻavāgi dòrèyuttavè. kuḍiyalu nīru sigadu.
story-n2: illi yūropinallāgali, alli amerikadallāgali nīru kòḍuva saṃpradāyavilla. hiṃdè itteno, īgaṃtū illa. nīru salīsāgi èllèṃdaralli pukkaṭṭèyāgi nimagè khaṃḍita sigadu. nammalliyaṃtè railu nildāṇagaḻalli, bassu nildāṇagaḻalli, vimāna nildāṇagaḻallū ‘duḍḍilladè kuḍiyaballa’ nīrannu irisuvudilla. bāyāridāga īgalū hoṭèl òṃdakkè hòkku, nīru mātra kuḍidu hòra barabahudāda savalattu illilla. manèya hòragè kāṃpauṃḍ goḍègè saṇṇa tòṭṭi kaṭṭi, ‘danakarugaḻu kuḍidu hogali’ èṃdu nīru tuṃbiḍuttidda bālyada dinagaḻu nanaginnū nènapivè. nānu dilligè baṃdu, videśakkè hāriddè. dilliyallo dhagèdhagè bisilu. ādarè yāro puṇyātmaru alli dòḍḍa maṇṇina maḍakègaḻalli nīru tuṃbiṭṭiruttiddaru. aneka gurudvāragaḻa baḻi, svayaṃ sevakaru nīrina dòḍḍa kòḻāyi hiḍidu, nillisida āṭo, bassu hāgū dārihokarigèlla nīru tuṃbi tuṃbi kuḍisuvudannū noḍiddenè. rotak rastèya attèya manèyòḻagè kāliḍuttiddaṃtè, ‘beṭā tāyāji āyè hai, thaṃḍā pāni pilāvo’ nanna maidunana maganigè attè kūgi heḻidaru. puṭṭa huḍuga tatkṣaṇa ‘taṇṇanèya
  nīru’ taṃdu kaigiṭṭa.
story-n3: dilliya dhūḻu hādigaḻèlla marètavu. manègè baṃdavarigaṃtu ‘ mòdalu nīru kòḍuva’ saṃpradāya. ḍābā āgali, darśini āgali, paṃcatārā hoṭale āgali mòdalu nīru mejina melè kuḻitukòḻḻuttadè. pukkaṭṭèyāgi kòḍuva nīru. ādarè nānīga ‘nīru kòḍada nāḍu’gaḻalli alèyuttiddenè. ‘myāgḍònālḍ’ naṃtaha aggada phāsṭpuḍ jāyiṃṭsgè hogi, vaibhavada paṃcatārā hoṭelugaḻige hogi, nīru iḍuva athavā kòḍuva saṃpradāyave illilla. hoṭelugaḻalli vain, biyar, illave kolāgaḻiṃdale ūṭa āraṃbha. ‘myāgḍònālḍ’gaḻalli phrèṃc prais irali, syāṃḍvic āgali, bargar āgali jòtègè dòḍḍa gātrada kolādòḍanèye nīḍuttārè.
story-n4: madhyāhnada ūṭada samaya, nānu ‘nīru, nīru’ èṃdu baḍabaḍisuvāga, saṇṇa bāṭaliyalli nīru baruttittu. kuḍidu noḍidarè adu barī soḍā. ‘soḍā alla vāṭar’ ènnuttiddè. ‘idu nīrè, spākrliṃg vāṭar’ ènnuttidru. ‘ appā mahāniyare, nanagè hòḻèyuva nīru beḍa. sādā nīru kòḍi’ èṃdè puṭṭa bāṭalu tarisidaru. sṭal vāṭar hòsa padapuṃjavannu kalitè. adannu kuḍidu noḍidarè, adarallū alpa maṭṭada soḍā, kaḍègū duḍḍu kòṭṭarū, sīdāsādā nīru siguvudu aparūpavittu. ekè hīgè? uttara hòḻèyuvudenū kaṣṭavalla. pukkaṭṭèyāgi enannū kòḍadiddarè, nīvu kòḻḻuttīri. kòḻḻuttiruvudu sīdāsādā alla èṃdu naṃbisidarè, mattaṣṭu kòḻḻuttīri. ‘kòḻḻuttiruvudu adbhutavādaddu’ èṃdarè innaṣṭu kòḻḻuttīri. kòḻḻubāka saṃskaøtiya taḻahadiye illidè. nīru nimagè dhārāḻavāgi èllèḍè pukaṭṭèyāgi dòratarè, kolā kaṃpanigaḻa jāhīrātigè maṇiyuvudu hegè? idu òṃdu bagèya sūkṣma rītiya ‘saikālajikal vār pher’. amèrikada uddagalavannu vāragaṭṭalè alèvāga, èllèḍèyalli gamanisiddè, dòḍḍagātrada kolā bāṭaligaḻigè 0.99 ḍālar bèlè, ade saṇṇagātrada nīrina
  bāṭaligū adakkiṃta hèccina haṇa! kòḻḻuva grāhakana manasinalli ‘nīrigekè aṣṭu haṇa? adakkiṃta aggavāgi kolā siguttadèyalla?, èṃba tarka hòḻèdu kolā abhyāsa māḍikòḻḻuttānè. alligè nīru kuḍiyuva abhyāsa tapputtadè. videśagaḻalli manèya nalliyalli baruva nīrannu yārū kuḍiyuvudilla. adannu kuḍidarenu prāṇa hoguvudilla. ādarè ‘ adu śuddhavalla, śuddha nīrannu bāṭaliyalli kòṃḍu mātra tarabahudu’ èṃdu iḍī deśada talè tòḻèdiruvāga, pratiyòbbarū
story-n5: nīrannu kòṃḍu kuḍiyuttārè. iṃtahude hunnāra bhāratadalli adāgale āraṃbhavāgidè. kīṭanāśakaviruva nīrannū śuddhavèṃdu māri uddhāravāda kaṃpanigaḻu! kòḻḻubāka saṃskaøtiya parākāṣṭhèyāgi nanagè ‘nīru kòḍada nāḍugaḻu’ kāṇuttavè. iṃtahude maraḻutanakkè adāgale bhāratīyaru baliyāgiddārè. namma èḻanīru, majjigè, pānaka, kabbina hālu, tājā haṇṇina rasa èllavannu tòrèdu kolāgaḻigè mugibīḻuttiruva janara saṃkhyè erutidè. vaiyaktika videśa pravāsagaḻalli nanagè iṣṭu kaṣṭavāgiddilla. tiṃgaḻugaṭṭalè alèdarū nāviḻidukòḻḻuttidda aggada hoṭeliniṃda bèḻaggè hòraḍuvāgale bāṭaliyalli nalli nīrannu tuṃbisikòṃḍu hòraḍuttiddèvu. namma bhāratīya ‘nirodhaka śaktiya’ èduru yāva nīrādarū aḍḍi iralilla. ādarè kèlasada melè baṃda ī pravāsadalli maṇamaṇa phailugaḻannu hòttu, alliṃdilligè illiṃdalligè alèyuvāga nīrina bāṭali hiḍidu hoguvudu asādhyavāgittu.
story-n6: kòḻḻubākatana, lābhakoratanada rogagaḻu sāṃkrāmikavāgi èlla nèladallū haraḍi, bhāratakkū laggè iṭṭivè èṃdu tīrā ittīcina dinagaḻalli gāḍhavāgi nammèllarigū anubhavavāgidè. ‘saṃskaøtiya melè dāḻi’ ènnuvāga nanagè ‘madarsḍe,’ ‘phādars ḍe’, ‘vyālèṃṭain ḍe’ ācarisuvudu aṣṭu dòḍḍa anāhutavāgi kāṇuvudilla. ī hòsa hòsa dinagaḻèlla ukkida prītiya dyotakavalla. ‘giphṭ’, ‘grīṭiṃg kārḍ’ māruva hòsa hunnāragaḻèṃdu sarvarigū vedyavāgidè. ādarè nanagè gābari huṭṭisuvudu namma bhāratīya saṃskaøtiya bunādiyannu jīvanaśailiyannu, naṃbikègaḻannu, maulyagaḻannu, saṃskaøtiya bunādiyannu alugisuva ‘kòḻḻubākatana’. agatyagaḻalli naḍèdu hoguttidda baduku, iṃdu ‘beku’gaḻa balègè biddidè. sarakāri kālejina pròphèsar mattu prāṃśupālarāda namma taṃdègè kālejigè saikalinalli hoguvudu apamānakaravāgi kaṃḍirale illa. kòṃḍa òṃdu vastuvannu badukiḍī baḻasuva paripāṭhavittu. iṃdu śālèyalliye baiku beku ènnuva maga. iṃtahude brāṃḍina śū beku ènnuva makkaḻu. māruti kāriddarè, syāṃtro beku èṃdu oḍuva hiriyaru. mārukaṭṭègè
  baṃdaddèllavu beku. bekugaḻannu ‘agatya’gaḻāgi, hāgū ‘atyagatya’gaḻāgi balu jāṇatanadiṃda badalisuva jāhīrātugaḻu mattè mattè bittarisuttavè. ārāma, aiṣārāmada, appaṭa anagatyada vastugaḻannu ‘ivilladè badukilla’ èṃbaṃtè biṃbisuttārè. ‘ḍioḍarèṃṭ’ hākikòḻḻadè iddarè ‘ tānu nāta baḍiyuttenè’ èṃbaṣṭu kīḻarimèyannu huṭṭisaballaru. kònègè èllavū nimmannu kòḻḻuvaṃtè prerepisuttavè.
story-n7: kèlavu varṣagaḻa hiṃdè dinapatrikèyalli odiddè. janapriya hoṭèlina mālīkaròbbaru barèdiddaru. taṃpu pānīyada kaṃpaniyòṃdu ātanannu saṃparkisi ‘nīvu grāhakarigè baṃdòḍanè nīru kòḍuvudannu nillisidarè, iṣṭu haṇa kòḍuvudāgi’ heḻittaṃtè! īgāgale bèṃgaḻūrinallū nanagè ‘nīru kòḍada saṃskaøti’ya anubhavavāgidè. mahātmagāṃdhi rastèya ‘bāṃbè bajār’ èdurina puṭṭa jāyiṃṭnalli nānu mattu magaḻu kuḻitiddèvu. illi nīru taṃdiḍalilla. aiskrīṃ tiṃda nāvu ‘nīru beku’ èṃdu keḻidèvu. ‘minaral vāṭar?’ veṭar praśnisida ‘illappa sāmānya nīru’ èṃdè. māyavāda veṭar hadinaidu nimiṣa kādarū barale illa. kādu kādu sustāgi kònègè kauṃṭarige hogi, billu kòṭṭu hòrabiddèvu. ade veṭar, puṭṭa puṭṭa bāṭaligaḻalli minaral vāṭarugaḻannu berè berè mejigè sarabarāju māḍuvudu kaṃḍitu. ‘minaral vāṭar?’ èṃda avaru keḻuva bhaṃgi bhāva hegiruttadè èṃdarè nimagè ‘ārḍinari vāṭar’ èṃdu heḻalū hiṃjarikèyāgabeku. ādarè nijakkū āghātavādaddu, tīrā ittīcègè mālatiyòḍanè iṃdirānagarada mukhya rastèya puṭṭa jāyiṃṭgè hòsa bagèya aiskrīṃ
  tinnuva bayakèyalli hòkkāga. ‘misisipi maḍ pī’ èṃdu èllo patrikèyalli odidda mālati, ārḍar māḍidaru. dòḍḍa biḻi piṃgāṇi taṭṭèyalli kek mattu aiskrīṃ irisi, melè koko puḍi udurisi ākarṣakavāgi taṃdiṭṭaru. bèlè nūru rūpāyi èṃdāga hauhāridduṃṭu! illū nīru kòṭṭiralilla. ‘nīru kòḍi’ èṃdè, ‘miniral vāṭar?’ èṃdaḻu sarv māḍuttidda huḍugi. ‘illa sādhāraṇa nīru’ èṃdarè, nammalli sādhāraṇa nīru
story-n8: illa èṃdu biḍuvudè! nūru rūpāyi aiskrīṃ tiṃdarū pukkaṭṭèyāgi òṃdu loṭa nīru kòḍada jāyiṃṭgaḻivu. mattè hattò-ippatto paḍèdu minaral vāṭar māruva hunnāra. nanagè regihoyitu. alli nīru kòḍalilla. hòrabaṃdu ‘banni mālati sāgargè, pānipuri tinnoṇa’ èṃdè. èdurigòṃdu ‘sāgar’ hoṭèlittu. nuggidèvu. kuḻitòḍanè veṭar baṃdu nālku loṭa nīru taṃdiṭṭa. barī bāyalla manassū taṃpāyitu. heḻi, kāydukòḻḻaballave mānavīya maulyagaḻannu, kòḻḻubākatanada kapimuṣṭhiyiṃda biḍisikòḻḻaballave? bāyāridavarigè nīru kòḍaballavè? hasidavarigè anna kòḍaballavè? innòbbara nīru-annavannu kasidukòḻḻadè badukaballavè? namma saṃskaøtiyannu kāydukòḻḻuva astra, namma kaiyalle idèyallave? ‘mattèṃdū nīru kòḍada ā jāyiṃṭgè hoguvudilla. nanniṃdaṃtū iṃtaha jāyiṃṭgaḻu uddhāravāguvudu beḍa’ èṃdukòṃḍiddenè.
author-1: śrīmati nemicaṃdraavarucitradurgadalli julai 16, 1959 raṃdu janisidaru. taṃdè prò. ji. guṃḍaṇṇa, tāyi timmakka. prāraṃbhika śikṣaṇa tumakūru, maisūrinalli pūraisidaru. maisūrina nyāṣanal insṭiṭyūṭ āph èṃjaniyariṃgniṃda bi.ès.si. padaviyannu bèṃgaḻūrina iṃḍiyan insṭiṭyūṭ āph sainsniṃda èṃ.ès. padaviyannu gaḻisidaru. bèṃgaḻūrina èc.è.èl. saṃsthèyalli unnata taṃtrajña adhikāriyāgi kèlasa nirvahisuttiddārè. kannaḍadalli ciṃtana pūrṇa lekhana, pustakagaḻannu barèyuttiddārè. ivara pramukha kṛtigaḻèṃdarèyād vaśem - kādaṃbari, namma kanasugaḻalli nīviddīri, mattè barèda kathègaḻu, nemicaṃdrara kathègaḻu muṃtāda kathāsaṃkalanagaḻu.òṃdu kanasina payaṇa, pèruvina pavitra kaṇivèyalli - pravāsa kathanagaḻu. baduku badalisabahudu aṃkaṇa barahagaḻumòdalādavugaḻu. pèruvina pavitra kaṇivèyalli kṛtigè karnāṭaka sāhitya praśasti. nṛpatuṃga praśasti, attimabbè praśastigaḻusaṃdivè. prastuta‘nīru kòḍada nāḍinalli’aṃkaṇa barèhavannu śrīmati nemicaṃdra avara‘baduku badalisabahudu’kṛtiyiṃda āydu saṃpādisi
  nigadipaḍisidè.
ashaya-1: viśvada jāgatīkaraṇada hòḍètakkè silukida namma nagaragaḻiṃdu kòḻḻubākatanavannu, lābhakoratanavannu huṭṭuhāki viśvada mārukaṭṭèyāgalu hòraṭiruvudu balu apāyakāri èṃba vaicārika ciṃtanèyannu hāgū namma saṃskaøtiya hirimèyannu kāpāḍikòḻḻuva anivāryatèyannu “nīru kòḍada nāḍinalli” ī gadyabhāgadalli atyuttamavāgi citrisidè.
