ex-a-q1: èllèlli nīru kòḍuva saṃpradāyavilla?
ex-a-q2: manègè baṃdavarannu hegè satkarisuva saṃpradāya nammallidè?
ex-a-q3: videśagaḻalli nīrigiṃta aggavāgi siguvudenu?
ex-a-q4: bhāratadalli ittīcègè yāva hunnāra naḍèdidè?
ex-a-q5: sarvarigū vedyavāgiruva aṃśagaḻāvuvu?
ex-a-q6: lekhakigè hoṭèlnalli nālku loṭa nīru taṃdiṭṭāga āda anubhavavenu?
ex-b-q1: videśagaḻalli bāyārikègè dhārāḻavāgi enenu dòrèyuvavu?
ex-b-q2: gurudvāragaḻa baḻi svayaṃ sevakaru enu māḍuttiddaru?
ex-b-q3: kolāgaḻa āsèyiṃda nāvu enèllavannu tòrèyuttiddevè?
ex-b-q4: nāgarīkatèya dòḍḍa anāhutagaḻāgi kāṇisikòḻḻuttiruva ācaraṇègaḻāvuvu?
ex-b-q5: janapriya hoṭalina mālīkanigè taṃpupānīya kaṃpani heḻiddenu?
ex-c-q1: duḍḍillade kuḍiyaballa nīru siguttidda kālada baggè lekhakara abhiprāyavenu?
ex-c-q2: kaṃpanigaḻu appaṭa agatyada vastugaḻannu ‘ivilladè badukilla’ èṃbaṃtè hegè biṃbisuttivè?
ex-c-q3: lekhakigè bèṃgaḻūrinalli ‘nīru kòḍada saṃskaøtiya’ baggè āda anubhavavannu barèyiri.
