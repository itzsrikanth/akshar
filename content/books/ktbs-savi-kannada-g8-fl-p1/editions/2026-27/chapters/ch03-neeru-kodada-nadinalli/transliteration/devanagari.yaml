intro-1: विश्ववु जागतीकरणद हॆसरिनल्लि प्रकृतियिंद मानवनिगॆ उचितवागि लभ्यवागबहुदाद गाळि, बॆळकु, नीरु मत्तु आहारगळंथ अत्यवश्यकवाद वस्तुगळन्नु हणगळिसुव मार्गवन्नागि परिवर्तिसलु हॊरटिरुवुदु आतंककारि विषयवागिदॆ.
intro-2: भारतीयराद नावु मानवीयतॆगॆ बॆलॆकॊट्टु “बळलि बंदवरिगॆ नीरु, हसिदु बंदवरिगॆ अन्नवन्निक्कि” मौल्ययुत संस्कøतियन्नु कापाडिकॊंडु बंदिरुवुदु विश्ववे हॆम्मॆपडुव संगतियागिदॆ.
story-n1: भारतदिंद हॊरगॆ कालिट्टरॆ, उळिदॆल्लवू ‘नीरु कॊडद नाडुगळु’ ऎंबुदु नन्न इल्लियवरॆगिन अनुभव. ऎरडु वार कळॆदिदॆ. ऊरूरु अलॆदिद्दायितु. दिनवू असाध्य बायारिकॆ. कोलागळु, फ्रॆंच् वैन्, बियर्, बाटलियल्लि हण्णिन रस धाराळवागि दॊरॆयुत्तवॆ. कुडियलु नीरु सिगदु.
story-n2: इल्लि यूरोपिनल्लागलि, अल्लि अमेरिकदल्लागलि नीरु कॊडुव संप्रदायविल्ल. हिंदॆ इत्तेनो, ईगंतू इल्ल. नीरु सलीसागि ऎल्लॆंदरल्लि पुक्कट्टॆयागि निमगॆ खंडित सिगदु. नम्मल्लियंतॆ रैलु निल्दाणगळल्लि, बस्सु निल्दाणगळल्लि, विमान निल्दाणगळल्लू ‘दुड्डिल्लदॆ कुडियबल्ल’ नीरन्नु इरिसुवुदिल्ल. बायारिदाग ईगलू होटॆल् ऒंदक्कॆ हॊक्कु, नीरु मात्र कुडिदु हॊर बरबहुदाद सवलत्तु इल्लिल्ल. मनॆय हॊरगॆ कांपौंड् गोडॆगॆ सण्ण तॊट्टि कट्टि, ‘दनकरुगळु कुडिदु होगलि’ ऎंदु नीरु तुंबिडुत्तिद्द बाल्यद दिनगळु ननगिन्नू नॆनपिवॆ. नानु दिल्लिगॆ बंदु, विदेशक्कॆ हारिद्दॆ. दिल्लियल्लो धगॆधगॆ बिसिलु. आदरॆ यारो पुण्यात्मरु अल्लि दॊड्ड मण्णिन मडकॆगळल्लि नीरु तुंबिट्टिरुत्तिद्दरु. अनेक गुरुद्वारगळ बळि, स्वयं सेवकरु नीरिन दॊड्ड कॊळायि हिडिदु, निल्लिसिद आटो, बस्सु हागू दारिहोकरिगॆल्ल नीरु तुंबि तुंबि कुडिसुवुदन्नू नोडिद्देनॆ. रोतक् रस्तॆय अत्तॆय मनॆयॊळगॆ कालिडुत्तिद्दंतॆ, ‘बेटा तायाजि आयॆ है, थंडा पानि पिलावो’ नन्न मैदुनन मगनिगॆ अत्तॆ कूगि हेळिदरु. पुट्ट हुडुग तत्क्षण ‘तण्णनॆय नीरु’ तंदु कैगिट्ट.
story-n3: दिल्लिय धूळु हादिगळॆल्ल मरॆतवु. मनॆगॆ बंदवरिगंतु ‘ मॊदलु नीरु कॊडुव’ संप्रदाय. डाबा आगलि, दर्शिनि आगलि, पंचतारा होटले आगलि मॊदलु नीरु मेजिन मेलॆ कुळितुकॊळ्ळुत्तदॆ. पुक्कट्टॆयागि कॊडुव नीरु. आदरॆ नानीग ‘नीरु कॊडद नाडु’गळल्लि अलॆयुत्तिद्देनॆ. ‘म्याग्डॊनाल्ड्’ नंतह अग्गद फास्ट्पुड् जायिंट्स्गॆ होगि, वैभवद पंचतारा होटेलुगळिगे होगि, नीरु इडुव अथवा कॊडुव संप्रदायवे इल्लिल्ल. होटेलुगळल्लि वैन्, बियर्, इल्लवे कोलागळिंदले ऊट आरंभ. ‘म्याग्डॊनाल्ड्’गळल्लि फ्रॆंच् प्रैस् इरलि, स्यांड्विच् आगलि, बर्गर् आगलि जॊतॆगॆ दॊड्ड गात्रद कोलादॊडनॆये नीडुत्तारॆ.
story-n4: मध्याह्नद ऊटद समय, नानु ‘नीरु, नीरु’ ऎंदु बडबडिसुवाग, सण्ण बाटलियल्लि नीरु बरुत्तित्तु. कुडिदु नोडिदरॆ अदु बरी सोडा. ‘सोडा अल्ल वाटर्’ ऎन्नुत्तिद्दॆ. ‘इदु नीरॆ, स्पाक्र्लिंग् वाटर्’ ऎन्नुत्तिद्रु. ‘ अप्पा महानियरे, ननगॆ हॊळॆयुव नीरु बेड. सादा नीरु कॊडि’ ऎंदॆ पुट्ट बाटलु तरिसिदरु. स्टल् वाटर् हॊस पदपुंजवन्नु कलितॆ. अदन्नु कुडिदु नोडिदरॆ, अदरल्लू अल्प मट्टद सोडा, कडॆगू दुड्डु कॊट्टरू, सीदासादा नीरु सिगुवुदु अपरूपवित्तु. एकॆ हीगॆ? उत्तर हॊळॆयुवुदेनू कष्टवल्ल. पुक्कट्टॆयागि एनन्नू कॊडदिद्दरॆ, नीवु कॊळ्ळुत्तीरि. कॊळ्ळुत्तिरुवुदु सीदासादा अल्ल ऎंदु नंबिसिदरॆ, मत्तष्टु कॊळ्ळुत्तीरि. ‘कॊळ्ळुत्तिरुवुदु अद्भुतवादद्दु’ ऎंदरॆ इन्नष्टु कॊळ्ळुत्तीरि. कॊळ्ळुबाक संस्कøतिय तळहदिये इल्लिदॆ. नीरु निमगॆ धाराळवागि ऎल्लॆडॆ पुकट्टॆयागि दॊरतरॆ, कोला कंपनिगळ जाहीरातिगॆ मणियुवुदु हेगॆ? इदु ऒंदु बगॆय सूक्ष्म रीतिय ‘सैकालजिकल् वार् फेर्’. अमॆरिकद उद्दगलवन्नु वारगट्टलॆ अलॆवाग, ऎल्लॆडॆयल्लि गमनिसिद्दॆ, दॊड्डगात्रद कोला बाटलिगळिगॆ 0.99 डालर् बॆलॆ, अदे सण्णगात्रद नीरिन बाटलिगू अदक्किंत हॆच्चिन हण! कॊळ्ळुव ग्राहकन
  मनसिनल्लि ‘नीरिगेकॆ अष्टु हण? अदक्किंत अग्गवागि कोला सिगुत्तदॆयल्ल?, ऎंब तर्क हॊळॆदु कोला अभ्यास माडिकॊळ्ळुत्तानॆ. अल्लिगॆ नीरु कुडियुव अभ्यास तप्पुत्तदॆ. विदेशगळल्लि मनॆय नल्लियल्लि बरुव नीरन्नु यारू कुडियुवुदिल्ल. अदन्नु कुडिदरेनु प्राण होगुवुदिल्ल. आदरॆ ‘ अदु शुद्धवल्ल, शुद्ध नीरन्नु बाटलियल्लि कॊंडु मात्र तरबहुदु’ ऎंदु इडी देशद तलॆ तॊळॆदिरुवाग, प्रतियॊब्बरू
story-n5: नीरन्नु कॊंडु कुडियुत्तारॆ. इंतहुदे हुन्नार भारतदल्लि अदागले आरंभवागिदॆ. कीटनाशकविरुव नीरन्नू शुद्धवॆंदु मारि उद्धारवाद कंपनिगळु! कॊळ्ळुबाक संस्कøतिय पराकाष्ठॆयागि ननगॆ ‘नीरु कॊडद नाडुगळु’ काणुत्तवॆ. इंतहुदे मरळुतनक्कॆ अदागले भारतीयरु बलियागिद्दारॆ. नम्म ऎळनीरु, मज्जिगॆ, पानक, कब्बिन हालु, ताजा हण्णिन रस ऎल्लवन्नु तॊरॆदु कोलागळिगॆ मुगिबीळुत्तिरुव जनर संख्यॆ एरुतिदॆ. वैयक्तिक विदेश प्रवासगळल्लि ननगॆ इष्टु कष्टवागिद्दिल्ल. तिंगळुगट्टलॆ अलॆदरू नाविळिदुकॊळ्ळुत्तिद्द अग्गद होटेलिनिंद बॆळग्गॆ हॊरडुवागले बाटलियल्लि नल्लि नीरन्नु तुंबिसिकॊंडु हॊरडुत्तिद्दॆवु. नम्म भारतीय ‘निरोधक शक्तिय’ ऎदुरु याव नीरादरू अड्डि इरलिल्ल. आदरॆ कॆलसद मेलॆ बंद ई प्रवासदल्लि मणमण फैलुगळन्नु हॊत्तु, अल्लिंदिल्लिगॆ इल्लिंदल्लिगॆ अलॆयुवाग नीरिन बाटलि हिडिदु होगुवुदु असाध्यवागित्तु.
story-n6: कॊळ्ळुबाकतन, लाभकोरतनद रोगगळु सांक्रामिकवागि ऎल्ल नॆलदल्लू हरडि, भारतक्कू लग्गॆ इट्टिवॆ ऎंदु तीरा इत्तीचिन दिनगळल्लि गाढवागि नम्मॆल्लरिगू अनुभववागिदॆ. ‘संस्कøतिय मेलॆ दाळि’ ऎन्नुवाग ननगॆ ‘मदर्स्डे,’ ‘फादर्स् डे’, ‘व्यालॆंटैन् डे’ आचरिसुवुदु अष्टु दॊड्ड अनाहुतवागि काणुवुदिल्ल. ई हॊस हॊस दिनगळॆल्ल उक्किद प्रीतिय द्योतकवल्ल. ‘गिफ्ट्’, ‘ग्रीटिंग् कार्ड्’ मारुव हॊस हुन्नारगळॆंदु सर्वरिगू वेद्यवागिदॆ. आदरॆ ननगॆ गाबरि हुट्टिसुवुदु नम्म भारतीय संस्कøतिय बुनादियन्नु जीवनशैलियन्नु, नंबिकॆगळन्नु, मौल्यगळन्नु, संस्कøतिय बुनादियन्नु अलुगिसुव ‘कॊळ्ळुबाकतन’. अगत्यगळल्लि नडॆदु होगुत्तिद्द बदुकु, इंदु ‘बेकु’गळ बलॆगॆ बिद्दिदॆ. सरकारि कालेजिन प्रॊफॆसर् मत्तु प्रांशुपालराद नम्म तंदॆगॆ कालेजिगॆ सैकलिनल्लि होगुवुदु अपमानकरवागि कंडिरले इल्ल. कॊंड ऒंदु वस्तुवन्नु बदुकिडी बळसुव परिपाठवित्तु. इंदु शालॆयल्लिये बैकु बेकु ऎन्नुव मग. इंतहुदे ब्रांडिन शू बेकु ऎन्नुव मक्कळु. मारुति कारिद्दरॆ, स्यांत्रो बेकु ऎंदु ओडुव हिरियरु. मारुकट्टॆगॆ बंदद्दॆल्लवु बेकु. बेकुगळन्नु ‘अगत्य’गळागि, हागू ‘अत्यगत्य’गळागि बलु जाणतनदिंद
  बदलिसुव जाहीरातुगळु मत्तॆ मत्तॆ बित्तरिसुत्तवॆ. आराम, ऐषारामद, अप्पट अनगत्यद वस्तुगळन्नु ‘इविल्लदॆ बदुकिल्ल’ ऎंबंतॆ बिंबिसुत्तारॆ. ‘डिओडरॆंट्’ हाकिकॊळ्ळदॆ इद्दरॆ ‘ तानु नात बडियुत्तेनॆ’ ऎंबष्टु कीळरिमॆयन्नु हुट्टिसबल्लरु. कॊनॆगॆ ऎल्लवू निम्मन्नु कॊळ्ळुवंतॆ प्रेरेपिसुत्तवॆ.
story-n7: कॆलवु वर्षगळ हिंदॆ दिनपत्रिकॆयल्लि ओदिद्दॆ. जनप्रिय होटॆलिन मालीकरॊब्बरु बरॆदिद्दरु. तंपु पानीयद कंपनियॊंदु आतनन्नु संपर्किसि ‘नीवु ग्राहकरिगॆ बंदॊडनॆ नीरु कॊडुवुदन्नु निल्लिसिदरॆ, इष्टु हण कॊडुवुदागि’ हेळित्तंतॆ! ईगागले बॆंगळूरिनल्लू ननगॆ ‘नीरु कॊडद संस्कøति’य अनुभववागिदॆ. महात्मगांधि रस्तॆय ‘बांबॆ बजार्’ ऎदुरिन पुट्ट जायिंट्नल्लि नानु मत्तु मगळु कुळितिद्दॆवु. इल्लि नीरु तंदिडलिल्ल. ऐस्क्रीं तिंद नावु ‘नीरु बेकु’ ऎंदु केळिदॆवु. ‘मिनरल् वाटर्?’ वेटर् प्रश्निसिद ‘इल्लप्प सामान्य नीरु’ ऎंदॆ. मायवाद वेटर् हदिनैदु निमिष कादरू बरले इल्ल. कादु कादु सुस्तागि कॊनॆगॆ कौंटरिगे होगि, बिल्लु कॊट्टु हॊरबिद्दॆवु. अदे वेटर्, पुट्ट पुट्ट बाटलिगळल्लि मिनरल् वाटरुगळन्नु बेरॆ बेरॆ मेजिगॆ सरबराजु माडुवुदु कंडितु. ‘मिनरल् वाटर्?’ ऎंद अवरु केळुव भंगि भाव हेगिरुत्तदॆ ऎंदरॆ निमगॆ ‘आर्डिनरि वाटर्’ ऎंदु हेळलू हिंजरिकॆयागबेकु. आदरॆ निजक्कू आघातवादद्दु, तीरा इत्तीचॆगॆ मालतियॊडनॆ इंदिरानगरद मुख्य रस्तॆय पुट्ट जायिंट्गॆ हॊस बगॆय ऐस्क्रीं तिन्नुव बयकॆयल्लि हॊक्काग. ‘मिसिसिपि मड् पी’ ऎंदु ऎल्लो पत्रिकॆयल्लि ओदिद्द
  मालति, आर्डर् माडिदरु. दॊड्ड बिळि पिंगाणि तट्टॆयल्लि केक् मत्तु ऐस्क्रीं इरिसि, मेलॆ कोको पुडि उदुरिसि आकर्षकवागि तंदिट्टरु. बॆलॆ नूरु रूपायि ऎंदाग हौहारिद्दुंटु! इल्लू नीरु कॊट्टिरलिल्ल. ‘नीरु कॊडि’ ऎंदॆ, ‘मिनिरल् वाटर्?’ ऎंदळु सर्व् माडुत्तिद्द हुडुगि. ‘इल्ल साधारण नीरु’ ऎंदरॆ, नम्मल्लि साधारण नीरु
story-n8: इल्ल ऎंदु बिडुवुदॆ! नूरु रूपायि ऐस्क्रीं तिंदरू पुक्कट्टॆयागि ऒंदु लोट नीरु कॊडद जायिंट्गळिवु. मत्तॆ हत्तॊ-इप्पत्तो पडॆदु मिनरल् वाटर् मारुव हुन्नार. ननगॆ रेगिहोयितु. अल्लि नीरु कॊडलिल्ल. हॊरबंदु ‘बन्नि मालति सागर्गॆ, पानिपुरि तिन्नोण’ ऎंदॆ. ऎदुरिगॊंदु ‘सागर्’ होटॆलित्तु. नुग्गिदॆवु. कुळितॊडनॆ वेटर् बंदु नाल्कु लोट नीरु तंदिट्ट. बरी बायल्ल मनस्सू तंपायितु. हेळि, काय्दुकॊळ्ळबल्लवे मानवीय मौल्यगळन्नु, कॊळ्ळुबाकतनद कपिमुष्ठियिंद बिडिसिकॊळ्ळबल्लवे? बायारिदवरिगॆ नीरु कॊडबल्लवॆ? हसिदवरिगॆ अन्न कॊडबल्लवॆ? इन्नॊब्बर नीरु-अन्नवन्नु कसिदुकॊळ्ळदॆ बदुकबल्लवॆ? नम्म संस्कøतियन्नु काय्दुकॊळ्ळुव अस्त्र, नम्म कैयल्ले इदॆयल्लवे? ‘मत्तॆंदू नीरु कॊडद आ जायिंट्गॆ होगुवुदिल्ल. नन्निंदंतू इंतह जायिंट्गळु उद्धारवागुवुदु बेड’ ऎंदुकॊंडिद्देनॆ.
author-1: श्रीमति नेमिचंद्रअवरुचित्रदुर्गदल्लि जुलै 16, 1959 रंदु जनिसिदरु. तंदॆ प्रॊ. जि. गुंडण्ण, तायि तिम्मक्क. प्रारंभिक शिक्षण तुमकूरु, मैसूरिनल्लि पूरैसिदरु. मैसूरिन न्याषनल् इन्स्टिट्यूट् आफ् ऎंजनियरिंग्निंद बि.ऎस्.सि. पदवियन्नु बॆंगळूरिन इंडियन् इन्स्टिट्यूट् आफ् सैन्स्निंद ऎं.ऎस्. पदवियन्नु गळिसिदरु. बॆंगळूरिन ऎच्.ऎ.ऎल्. संस्थॆयल्लि उन्नत तंत्रज्ञ अधिकारियागि कॆलस निर्वहिसुत्तिद्दारॆ. कन्नडदल्लि चिंतन पूर्ण लेखन, पुस्तकगळन्नु बरॆयुत्तिद्दारॆ. इवर प्रमुख कृतिगळॆंदरॆयाद् वशेम् - कादंबरि, नम्म कनसुगळल्लि नीविद्दीरि, मत्तॆ बरॆद कथॆगळु, नेमिचंद्रर कथॆगळु मुंताद कथासंकलनगळु.ऒंदु कनसिन पयण, पॆरुविन पवित्र कणिवॆयल्लि - प्रवास कथनगळु. बदुकु बदलिसबहुदु अंकण बरहगळुमॊदलादवुगळु. पॆरुविन पवित्र कणिवॆयल्लि कृतिगॆ कर्नाटक साहित्य प्रशस्ति. नृपतुंग प्रशस्ति, अत्तिमब्बॆ प्रशस्तिगळुसंदिवॆ. प्रस्तुत‘नीरु कॊडद नाडिनल्लि’अंकण बरॆहवन्नु श्रीमति नेमिचंद्र अवर‘बदुकु बदलिसबहुदु’कृतियिंद आय्दु संपादिसि निगदिपडिसिदॆ.
ashaya-1: विश्वद जागतीकरणद हॊडॆतक्कॆ सिलुकिद नम्म नगरगळिंदु कॊळ्ळुबाकतनवन्नु, लाभकोरतनवन्नु हुट्टुहाकि विश्वद मारुकट्टॆयागलु हॊरटिरुवुदु बलु अपायकारि ऎंब वैचारिक चिंतनॆयन्नु हागू नम्म संस्कøतिय हिरिमॆयन्नु कापाडिकॊळ्ळुव अनिवार्यतॆयन्नु “नीरु कॊडद नाडिनल्लि” ई गद्यभागदल्लि अत्युत्तमवागि चित्रिसिदॆ.
