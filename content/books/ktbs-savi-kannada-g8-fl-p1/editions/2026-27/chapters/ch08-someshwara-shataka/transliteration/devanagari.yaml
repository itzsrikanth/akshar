intro-1: कन्नड साहित्य चरित्रॆयल्लि शतक साहित्य विशेषतॆयिंद कूडिद्दु. ई प्रकारदल्लि कृति रचनॆ माडिरुव कवि सोमनाथ. ईतन कृति सोमेश्वर शतकवॆंदे प्रसिद्धिपडॆदिदॆ. सोमेश्वर शतकवु कन्नड नाडिन जनपद काव्यवॆंबंतॆ जनमनदल्लि नॆलॆसिरुव काव्य. नीति बोधकवाद ई काव्यवु इंदिगू अनुकरणीयवादुदागिदॆ. “मातृदेवोभव, पितृदेवोभव, आचार्य देवोभव” ऎंबुदु नम्मॆल्ल धर्मगळ मूल मंत्र.
intro-2: इवरॆल्लरू तम्म तम्म कर्तव्यगळिंद तप्पिसिकॊळ्ळलु साध्यविल्ल. प्रतियॊब्बरू तम्म तम्म जवाब्दारिगळन्नु प्रामाणिकवागि निष्ठॆयिंद माडलेबेकु. राज्यवाळुव राजनागलि, मंत्रियागलि, रक्षकराद भटरागलि इदरिंद हॊरतागुवुदिल्ल. ई कर्तव्य प्रज्ञॆये दैवत्वद स्थान-मान पडॆयलु साध्यवागुत्तदॆ. दैवद अनुग्रहवु स्वाभाविकवागि एनॆल्ल परिवर्तनॆगॆ कारणवागुत्तदॆ ऎंबुदन्नु मनोज्ञवागि ई शतकदल्लि विवरिसलागिरुवुदरिंद इंदिगू प्रस्तुतवागिदॆ.
poem-s1l1: हितवं तोरुवनात्मबंधु पॊरॆवातं तंदॆ सद्धर्मदा |
poem-s1l2: सतिये सर्वकॆ साधनं कलिसिदातं वर्णमात्रं गुरु ||
poem-s1l3: श्रुतिमार्गं बिडदात सुव्रति महा सद्विद्यॆये पुण्यदं |
poem-s1l4: सुतने सद्गतिदातनै हरहरा श्रीचॆन्नसोमेश्वरा ||
poem-s2l1: प्रजॆयं पालिसबल्लॊडातनरसं कैयासॆयं माडदं |
poem-s2l2: निज मंत्रीश्वर तंदॆ ताय सलहल् बल्लातने धार्मिकं ||
poem-s2l3: भजकं दैवद भक्तियुळ्ळॊडॆ भटं निर्भीत तानादवं |
poem-s2l4: द्विजनाचारतॆयुळ्ळवं हरहरा श्रीचॆन्नसोमेश्वरा||
poem-s3l1: अति गंभीरनुदार धीरनु महा संपन्न सत्यात्मनू |
poem-s3l2: र्जित नानालिपिभाषॆयॊळ् परिचितं लंचक्कॆ कैनीडदं ||
poem-s3l3: व्रत सद्धर्म विचारशालि चतुरोपायंगळं बल्लवं |
poem-s3l4: पतिकार्यं वर मंत्रियै हरहरा श्रीचॆन्नसोमेश्वरा ||
poem-s4l1: उडुराजं कळॆगुंदि पॆर्चदिहने नृग्रोधबीजं कॆलं |
poem-s4l2: सिडिदुं पॆर्मरनागदे ऎळगरुं ऎत्तागदे लोकदॊळ् ||
poem-s4l3: मिडि पण्णागदॆ दैवनॊल्मॆयिरला कालानुकालक्कॆ तां |
poem-s4l4: बडवं बल्लिदनागने हरहरा श्रीचॆन्नसोमेश्वरा ||
author-1: पुलिगॆरॆ सोमनाथ सा.श. सुमारु 1299रल्लि धारवाड जिल्लॆय शिरहट्टि ताल्लूकिन पुलिगॆरॆयवनु. पुलिगॆरॆ सोमनाथनॆंदे प्रसिद्धि. कन्नड, संस्कृत भाषापंडितनाद ईतन अंकित हरहरा श्री चन्नसोमेश्वरा. कन्नड रत्नकरंडक काव्यवन्नु चंपुविनल्लियू सोमेश्वर शतकवन्नु वृत्त छंदस्सिनल्लियू रचिसिद्दानॆ. प्रकृत चौपदिगळन्नु कन्नड साहित्य परिषत्तु संपादिसिरुव सोमेश्वर शतक कृतियिंद आय्कॆमाडिकॊळ्ळलागिदॆ.
ashaya-1: समाजद अविभाज्य अंगवाद तंदॆ, तायि, मग, पत्नि, गुरुगळ जवाब्दारिगळन्नु, द्विज, राज, मंत्रि, भट मॊदलादवर कर्तव्यगळन्नु ई नीति शतकदल्लि मार्मिकवागि हेळलागिदॆ. निजवाद मंत्रिगॆ इरबेकाद लक्षण, देवर अनुग्रहदिंद कालानुक्रमदल्लि स्वाभाविकवागि आगुव बदलावणॆगळ बग्गॆयू विवरिसलागिदॆ. ई मूलक प्रतियॊब्बरू तम्म तम्म जवाब्दारिगळन्नरिताग सुखीसमाजद निर्माणवागुत्तदॆंबुदु ई नीति शतकद आशय.
