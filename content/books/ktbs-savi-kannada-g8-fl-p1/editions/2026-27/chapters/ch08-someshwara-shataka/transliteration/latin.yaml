ex-a-q1: nijavāda baṃdhu yāru?
ex-a-q2: dhārmikanèṃdu yārannu karèyalāgidè?
ex-a-q3: rājanādavana kartavyavenu?
ex-a-q4: ālada marada bīja siḍidu bhūmigè biddu enāguttadè?
ex-a-q5: puligèrè somanāthana aṃkitanāmavenu?
ex-b-q1: suvrati hāgū sutana bagègè kavi enu heḻiddānè?
ex-b-q2: bhaṭa mattu dvijara lakṣaṇagaḻenu?
ex-c-q1: śreṣṭha maṃtriyallirabekāda lakṣaṇagaḻenu?
ex-c-q2: baḍava ballidanāguvanu èṃbudakkè kavi nīḍiruva nidarśanagaḻāvuvu?
