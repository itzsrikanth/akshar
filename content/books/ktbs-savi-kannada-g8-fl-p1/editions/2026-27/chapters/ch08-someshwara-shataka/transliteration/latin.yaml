labels:
  intro: praveśa
  poem: padya
  author: kṛtikārara paricaya
  ashaya: āśaya
  vocab: padagaḻa artha
  exercise-A: a. kòṭṭiruva praśnègaḻigè òṃdu vākyadalli uttarisi.
  exercise-B: ā. kòṭṭiruva praśnègaḻigè èraḍu-mūru vākyagaḻalli uttarisi.
  exercise-C: i. kòṭṭiruva praśnègaḻigè aidu-āru vākyagaḻalli uttarisi.
  exercise-D: ī. saṃdarbhasahita svārasyavannu vivarisi.
intro-1: kannaḍa sāhitya caritrèyalli śataka sāhitya viśeṣatèyiṃda kūḍiddu. ī prakāradalli kṛti racanè māḍiruva kavi somanātha. ītana kṛti someśvara śatakavèṃde prasiddhipaḍèdidè. someśvara śatakavu kannaḍa nāḍina janapada kāvyavèṃbaṃtè janamanadalli nèlèsiruva kāvya. nīti bodhakavāda ī kāvyavu iṃdigū anukaraṇīyavādudāgidè. “mātṛdevobhava, pitṛdevobhava, ācārya devobhava” èṃbudu nammèlla dharmagaḻa mūla maṃtra.
intro-2: ivarèllarū tamma tamma kartavyagaḻiṃda tappisikòḻḻalu sādhyavilla. pratiyòbbarū tamma tamma javābdārigaḻannu prāmāṇikavāgi niṣṭhèyiṃda māḍalebeku. rājyavāḻuva rājanāgali, maṃtriyāgali, rakṣakarāda bhaṭarāgali idariṃda hòratāguvudilla. ī kartavya prajñèye daivatvada sthāna-māna paḍèyalu sādhyavāguttadè. daivada anugrahavu svābhāvikavāgi enèlla parivartanègè kāraṇavāguttadè èṃbudannu manojñavāgi ī śatakadalli vivarisalāgiruvudariṃda iṃdigū prastutavāgidè.
poem-s1l1: hitavaṃ toruvanātmabaṃdhu pòrèvātaṃ taṃdè saddharmadā |
poem-s1l2: satiye sarvakè sādhanaṃ kalisidātaṃ varṇamātraṃ guru ||
poem-s1l3: śrutimārgaṃ biḍadāta suvrati mahā sadvidyèye puṇyadaṃ |
poem-s1l4: sutane sadgatidātanai haraharā śrīcènnasomeśvarā ||
poem-s2l1: prajèyaṃ pālisaballòḍātanarasaṃ kaiyāsèyaṃ māḍadaṃ |
poem-s2l2: nija maṃtrīśvara taṃdè tāya salahal ballātane dhārmikaṃ ||
poem-s2l3: bhajakaṃ daivada bhaktiyuḻḻòḍè bhaṭaṃ nirbhīta tānādavaṃ |
poem-s2l4: dvijanācāratèyuḻḻavaṃ haraharā śrīcènnasomeśvarā||
poem-s3l1: ati gaṃbhīranudāra dhīranu mahā saṃpanna satyātmanū |
poem-s3l2: rjita nānālipibhāṣèyòḻ paricitaṃ laṃcakkè kainīḍadaṃ ||
poem-s3l3: vrata saddharma vicāraśāli caturopāyaṃgaḻaṃ ballavaṃ |
poem-s3l4: patikāryaṃ vara maṃtriyai haraharā śrīcènnasomeśvarā ||
poem-s4l1: uḍurājaṃ kaḻèguṃdi pèrcadihane nṛgrodhabījaṃ kèlaṃ |
poem-s4l2: siḍiduṃ pèrmaranāgade èḻagaruṃ èttāgade lokadòḻ ||
poem-s4l3: miḍi paṇṇāgadè daivanòlmèyiralā kālānukālakkè tāṃ |
poem-s4l4: baḍavaṃ ballidanāgane haraharā śrīcènnasomeśvarā ||
author-1: puligèrè somanātha sā.śa. sumāru 1299ralli dhāravāḍa jillèya śirahaṭṭi tāllūkina puligèrèyavanu. puligèrè somanāthanèṃde prasiddhi. kannaḍa, saṃskṛta bhāṣāpaṃḍitanāda ītana aṃkita haraharā śrī cannasomeśvarā. kannaḍa ratnakaraṃḍaka kāvyavannu caṃpuvinalliyū someśvara śatakavannu vṛtta chaṃdassinalliyū racisiddānè. prakṛta caupadigaḻannu kannaḍa sāhitya pariṣattu saṃpādisiruva someśvara śataka kṛtiyiṃda āykèmāḍikòḻḻalāgidè.
ashaya-1: samājada avibhājya aṃgavāda taṃdè, tāyi, maga, patni, gurugaḻa javābdārigaḻannu, dvija, rāja, maṃtri, bhaṭa mòdalādavara kartavyagaḻannu ī nīti śatakadalli mārmikavāgi heḻalāgidè. nijavāda maṃtrigè irabekāda lakṣaṇa, devara anugrahadiṃda kālānukramadalli svābhāvikavāgi āguva badalāvaṇègaḻa baggèyū vivarisalāgidè. ī mūlaka pratiyòbbarū tamma tamma javābdārigaḻannaritāga sukhīsamājada nirmāṇavāguttadèṃbudu ī nīti śatakada āśaya.
