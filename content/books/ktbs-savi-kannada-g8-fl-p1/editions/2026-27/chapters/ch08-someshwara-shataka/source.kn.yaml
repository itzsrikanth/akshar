segments:
- id: intro-1
  type: prose
  section: intro
  text: ಕನ್ನಡ ಸಾಹಿತ್ಯ ಚರಿತ್ರೆಯಲ್ಲಿ ಶತಕ ಸಾಹಿತ್ಯ ವಿಶೇಷತೆಯಿಂದ ಕೂಡಿದ್ದು. ಈ ಪ್ರಕಾರದಲ್ಲಿ ಕೃತಿ ರಚನೆ ಮಾಡಿರುವ ಕವಿ ಸೋಮನಾಥ. ಈತನ ಕೃತಿ ಸೋಮೇಶ್ವರ ಶತಕವೆಂದೇ ಪ್ರಸಿದ್ಧಿಪಡೆದಿದೆ. ಸೋಮೇಶ್ವರ ಶತಕವು ಕನ್ನಡ ನಾಡಿನ ಜನಪದ ಕಾವ್ಯವೆಂಬಂತೆ ಜನಮನದಲ್ಲಿ ನೆಲೆಸಿರುವ ಕಾವ್ಯ. ನೀತಿ ಬೋಧಕವಾದ ಈ ಕಾವ್ಯವು ಇಂದಿಗೂ ಅನುಕರಣೀಯವಾದುದಾಗಿದೆ. “ಮಾತೃದೇವೋಭವ, ಪಿತೃದೇವೋಭವ, ಆಚಾರ್ಯ ದೇವೋಭವ” ಎಂಬುದು ನಮ್ಮೆಲ್ಲ ಧರ್ಮಗಳ ಮೂಲ ಮಂತ್ರ.
- id: intro-2
  type: prose
  section: intro
  text: ಇವರೆಲ್ಲರೂ ತಮ್ಮ ತಮ್ಮ ಕರ್ತವ್ಯಗಳಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳಲು ಸಾಧ್ಯವಿಲ್ಲ. ಪ್ರತಿಯೊಬ್ಬರೂ ತಮ್ಮ ತಮ್ಮ ಜವಾಬ್ದಾರಿಗಳನ್ನು ಪ್ರಾಮಾಣಿಕವಾಗಿ ನಿಷ್ಠೆಯಿಂದ ಮಾಡಲೇಬೇಕು. ರಾಜ್ಯವಾಳುವ ರಾಜನಾಗಲಿ, ಮಂತ್ರಿಯಾಗಲಿ, ರಕ್ಷಕರಾದ ಭಟರಾಗಲಿ ಇದರಿಂದ ಹೊರತಾಗುವುದಿಲ್ಲ. ಈ ಕರ್ತವ್ಯ ಪ್ರಜ್ಞೆಯೇ ದೈವತ್ವದ ಸ್ಥಾನ-ಮಾನ ಪಡೆಯಲು ಸಾಧ್ಯವಾಗುತ್ತದೆ. ದೈವದ ಅನುಗ್ರಹವು ಸ್ವಾಭಾವಿಕವಾಗಿ ಏನೆಲ್ಲ ಪರಿವರ್ತನೆಗೆ ಕಾರಣವಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಮನೋಜ್ಞವಾಗಿ ಈ ಶತಕದಲ್ಲಿ ವಿವರಿಸಲಾಗಿರುವುದರಿಂದ ಇಂದಿಗೂ ಪ್ರಸ್ತುತವಾಗಿದೆ.
- id: poem-s1l1
  type: poem_line
  section: poem
  stanza: 1
  text: ಹಿತವಂ ತೋರುವನಾತ್ಮಬಂಧು ಪೊರೆವಾತಂ ತಂದೆ ಸದ್ಧರ್ಮದಾ |
- id: poem-s1l2
  type: poem_line
  section: poem
  stanza: 1
  text: ಸತಿಯೇ ಸರ್ವಕೆ ಸಾಧನಂ ಕಲಿಸಿದಾತಂ ವರ್ಣಮಾತ್ರಂ ಗುರು ||
- id: poem-s1l3
  type: poem_line
  section: poem
  stanza: 1
  text: ಶ್ರುತಿಮಾರ್ಗಂ ಬಿಡದಾತ ಸುವ್ರತಿ ಮಹಾ ಸದ್ವಿದ್ಯೆಯೇ ಪುಣ್ಯದಂ |
- id: poem-s1l4
  type: poem_line
  section: poem
  stanza: 1
  text: ಸುತನೇ ಸದ್ಗತಿದಾತನೈ ಹರಹರಾ ಶ್ರೀಚೆನ್ನಸೋಮೇಶ್ವರಾ ||
- id: poem-s2l1
  type: poem_line
  section: poem
  stanza: 2
  text: ಪ್ರಜೆಯಂ ಪಾಲಿಸಬಲ್ಲೊಡಾತನರಸಂ ಕೈಯಾಸೆಯಂ ಮಾಡದಂ |
- id: poem-s2l2
  type: poem_line
  section: poem
  stanza: 2
  text: ನಿಜ ಮಂತ್ರೀಶ್ವರ ತಂದೆ ತಾಯ ಸಲಹಲ್ ಬಲ್ಲಾತನೇ ಧಾರ್ಮಿಕಂ ||
- id: poem-s2l3
  type: poem_line
  section: poem
  stanza: 2
  text: ಭಜಕಂ ದೈವದ ಭಕ್ತಿಯುಳ್ಳೊಡೆ ಭಟಂ ನಿರ್ಭೀತ ತಾನಾದವಂ |
- id: poem-s2l4
  type: poem_line
  section: poem
  stanza: 2
  text: ದ್ವಿಜನಾಚಾರತೆಯುಳ್ಳವಂ ಹರಹರಾ ಶ್ರೀಚೆನ್ನಸೋಮೇಶ್ವರಾ||
- id: poem-s3l1
  type: poem_line
  section: poem
  stanza: 3
  text: ಅತಿ ಗಂಭೀರನುದಾರ ಧೀರನು ಮಹಾ ಸಂಪನ್ನ ಸತ್ಯಾತ್ಮನೂ |
- id: poem-s3l2
  type: poem_line
  section: poem
  stanza: 3
  text: ರ್ಜಿತ ನಾನಾಲಿಪಿಭಾಷೆಯೊಳ್ ಪರಿಚಿತಂ ಲಂಚಕ್ಕೆ ಕೈನೀಡದಂ ||
- id: poem-s3l3
  type: poem_line
  section: poem
  stanza: 3
  text: ವ್ರತ ಸದ್ಧರ್ಮ ವಿಚಾರಶಾಲಿ ಚತುರೋಪಾಯಂಗಳಂ ಬಲ್ಲವಂ |
- id: poem-s3l4
  type: poem_line
  section: poem
  stanza: 3
  text: ಪತಿಕಾರ್ಯಂ ವರ ಮಂತ್ರಿಯೈ ಹರಹರಾ ಶ್ರೀಚೆನ್ನಸೋಮೇಶ್ವರಾ ||
- id: poem-s4l1
  type: poem_line
  section: poem
  stanza: 4
  text: ಉಡುರಾಜಂ ಕಳೆಗುಂದಿ ಪೆರ್ಚದಿಹನೇ ನೃಗ್ರೋಧಬೀಜಂ ಕೆಲಂ |
- id: poem-s4l2
  type: poem_line
  section: poem
  stanza: 4
  text: ಸಿಡಿದುಂ ಪೆರ್ಮರನಾಗದೇ ಎಳಗರುಂ ಎತ್ತಾಗದೇ ಲೋಕದೊಳ್ ||
- id: poem-s4l3
  type: poem_line
  section: poem
  stanza: 4
  text: ಮಿಡಿ ಪಣ್ಣಾಗದೆ ದೈವನೊಲ್ಮೆಯಿರಲಾ ಕಾಲಾನುಕಾಲಕ್ಕೆ ತಾಂ |
- id: poem-s4l4
  type: poem_line
  section: poem
  stanza: 4
  text: ಬಡವಂ ಬಲ್ಲಿದನಾಗನೇ ಹರಹರಾ ಶ್ರೀಚೆನ್ನಸೋಮೇಶ್ವರಾ ||
- id: author-1
  type: prose
  section: author
  text: ಪುಲಿಗೆರೆ ಸೋಮನಾಥ ಸಾ.ಶ. ಸುಮಾರು 1299ರಲ್ಲಿ ಧಾರವಾಡ ಜಿಲ್ಲೆಯ ಶಿರಹಟ್ಟಿ ತಾಲ್ಲೂಕಿನ ಪುಲಿಗೆರೆಯವನು. ಪುಲಿಗೆರೆ ಸೋಮನಾಥನೆಂದೇ ಪ್ರಸಿದ್ಧಿ. ಕನ್ನಡ, ಸಂಸ್ಕೃತ ಭಾಷಾಪಂಡಿತನಾದ ಈತನ ಅಂಕಿತ ಹರಹರಾ ಶ್ರೀ ಚನ್ನಸೋಮೇಶ್ವರಾ. ಕನ್ನಡ ರತ್ನಕರಂಡಕ ಕಾವ್ಯವನ್ನು ಚಂಪುವಿನಲ್ಲಿಯೂ ಸೋಮೇಶ್ವರ ಶತಕವನ್ನು ವೃತ್ತ ಛಂದಸ್ಸಿನಲ್ಲಿಯೂ ರಚಿಸಿದ್ದಾನೆ. ಪ್ರಕೃತ ಚೌಪದಿಗಳನ್ನು ಕನ್ನಡ ಸಾಹಿತ್ಯ ಪರಿಷತ್ತು ಸಂಪಾದಿಸಿರುವ ಸೋಮೇಶ್ವರ ಶತಕ ಕೃತಿಯಿಂದ ಆಯ್ಕೆಮಾಡಿಕೊಳ್ಳಲಾಗಿದೆ.
- id: ashaya-1
  type: prose
  section: ashaya
  text: ಸಮಾಜದ ಅವಿಭಾಜ್ಯ ಅಂಗವಾದ ತಂದೆ, ತಾಯಿ, ಮಗ, ಪತ್ನಿ, ಗುರುಗಳ ಜವಾಬ್ದಾರಿಗಳನ್ನು, ದ್ವಿಜ, ರಾಜ, ಮಂತ್ರಿ, ಭಟ ಮೊದಲಾದವರ ಕರ್ತವ್ಯಗಳನ್ನು ಈ ನೀತಿ ಶತಕದಲ್ಲಿ ಮಾರ್ಮಿಕವಾಗಿ ಹೇಳಲಾಗಿದೆ. ನಿಜವಾದ ಮಂತ್ರಿಗೆ ಇರಬೇಕಾದ ಲಕ್ಷಣ, ದೇವರ ಅನುಗ್ರಹದಿಂದ ಕಾಲಾನುಕ್ರಮದಲ್ಲಿ ಸ್ವಾಭಾವಿಕವಾಗಿ ಆಗುವ ಬದಲಾವಣೆಗಳ ಬಗ್ಗೆಯೂ ವಿವರಿಸಲಾಗಿದೆ. ಈ ಮೂಲಕ ಪ್ರತಿಯೊಬ್ಬರೂ ತಮ್ಮ ತಮ್ಮ ಜವಾಬ್ದಾರಿಗಳನ್ನರಿತಾಗ ಸುಖೀಸಮಾಜದ ನಿರ್ಮಾಣವಾಗುತ್ತದೆಂಬುದು ಈ ನೀತಿ ಶತಕದ ಆಶಯ.
