- id: author-1
  type: prose
  section: author
  text: "ಪುರಂದರದಾಸರು: ಹರಿದಾಸ ಸಾಹಿತ್ಯದ ಅಶ್ವಿನಿದೇವತೆಗಳಲ್ಲಿ ಒಬ್ಬರು. ಈಗಿನ ಮಹಾರಾಷ್ಟ್ರದ ಪುರಂದರಗಡದಲ್ಲಿ ಸಾ.ಶ. ಸುಮಾರು 1480 ರಲ್ಲಿ ಜನಿಸಿದರು. ಪೂರ್ವದ ಹೆಸರು ಶ್ರೀನಿವಾಸನಾಯಕ. ಆಭರಣ ವ್ಯಾಪಾರಿಯಾಗಿದ್ದ ಇವರು ಜೀವನದಲ್ಲಿ ನಡೆದ ಘಟನೆಯಿಂದಾಗಿ ವೈರಾಗ್ಯ ತಾಳಿದರು. ಹರಿಭಕ್ತರಾಗಿ ನೂರಾರು ಕೀರ್ತನೆಗಳನ್ನು ರಚಿಸಿದರು. ‘ದಾಸರೆಂದರೆ ಪುರಂದರದಾಸರಯ್ಯ’ ಎಂದು ತಮ್ಮ ಗುರುಗಳಾದ ವ್ಯಾಸರಾಯರಿಂದಲೇ ಹೊಗಳಿಕೆಗೆ ಪಾತ್ರರಾದರು. ಪುರಂದರದಾಸರು ಕರ್ನಾಟಕ ಸಂಗೀತದ ಪಿಳ್ಳಾರಿ ಗೀತೆಗಳನ್ನು ರಚಿಸಿ ‘ಕರ್ನಾಟಕ ಸಂಗೀತದ ಪಿತಾಮಹ’ ಎನಿಸಿಕೊಂಡರು. ಇವರ ಅಂಕಿತ ‘ಪುರಂದರವಿಠಲ.’"
- id: ashaya-1
  type: prose
  section: ashaya
  text: ಹುಟ್ಟುಗುಣ ಸುಟ್ಟರೂ ಹೋಗುವುದಿಲ್ಲ. ಯಾವುದೇ ಕೆಲಸ ನಿರ್ವಹಿಸಿದರೂ ಅದರಿಂದ ಫಲಾಫಲವನ್ನು ಅಪೇಕ್ಷಿಸಬಾರದು. ನಿರ್ಮಲ ಭಕ್ತಿ ಇಲ್ಲದಿದ್ದರೆ ಮಾಡಿದ ಕೆಲಸ ಕೂಡ ನಿಷ್ಫಲವಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಪುರಂದರದಾಸರು ಸರಳ ಉದಾಹರಣೆಗಳ ಮೂಲಕ ಇಲ್ಲಿ ನಿರೂಪಿಸಿದ್ದಾರೆ.
