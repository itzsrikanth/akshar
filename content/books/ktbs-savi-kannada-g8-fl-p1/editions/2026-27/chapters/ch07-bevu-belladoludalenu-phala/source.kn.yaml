segments:
- id: intro-1
  type: prose
  section: intro
  text: ಕನ್ನಡ ಸಾಹಿತ್ಯ ಪರಂಪರೆಯಲ್ಲಿ 15-16ನೆಯ ಶತಮಾನದಲ್ಲಿ ಜ್ಞಾನ ಮತ್ತು ಭಕ್ತಿಯ ಮೂಲಕ ಮುಕ್ತಿಯನ್ನು ಕಾಣಬಯಸಿ, ವಿಷ್ಣುವನ್ನು ಆರಾಧ್ಯ ದೈವನನ್ನಾಗಿಸಿಕೊಂಡು, ಆಧ್ಯಾತ್ಮಿಕ, ಧಾರ್ಮಿಕ, ಸಾಮಾಜಿಕ, ಸಾಂಸ್ಕೃತಿಕ ಸುಧಾರಣೆಗಾಗಿ ಶ್ರಮಿಸಿದ ಸಾಹಿತ್ಯ ಪ್ರಕಾರವೇ ದಾಸ ಸಾಹಿತ್ಯ. ದಾಸ ಸಾಹಿತ್ಯವನ್ನು ದಾಸವಾಙ್ಮಯ, ಹರಿದಾಸ ಸಾಹಿತ್ಯವೆಂತಲೂ ಕರೆಯುತ್ತಾರೆ. ‘ದಾಸ’ ಎಂದರೆ ‘ಸೇವಕ’ ಎಂದರ್ಥ. ಶ್ರೀಹರಿಯಲ್ಲಿ ಭಕ್ತಿಯನ್ನಿಟ್ಟು, ಮನಸ್ಸನ್ನು ನಿರ್ಮಲಮಾಡಿಕೊಂಡು, ತ್ಯಾಗ ಜೀವನ ನಡೆಸುತ್ತಾ, ಹರಿನಾಮ ಜಪಿಸುತ್ತಾ ರಚಿಸಿದ ಸಾಹಿತ್ಯ ಇದಾಗಿದೆ.
- id: intro-2
  type: prose
  section: intro
  text: ಈ ಸಾಹಿತ್ಯ ಪ್ರಕಾರದಲ್ಲಿ ಬರುವ ನರಹರಿತೀರ್ಥರು, ಶ್ರೀಪಾದರಾಜರು, ವ್ಯಾಸರು, ವಿಜಯದಾಸರು, ಕನಕ - ಪುರಂದರದಾಸರು, ರಾಘವೇಂದ್ರತೀರ್ಥರೇ ಮೊದಲಾದವರು. ಭಕ್ತಿ-ಆಧ್ಯಾತ್ಮಿಕ ವಿಷಯಗಳನ್ನು ಸುಂದರ ಕಾವ್ಯವನ್ನಾಗಿಸುವ ಮೂಲಕ ಕೀರ್ತನೆಗಳು, ಉಗಾಭೋಗ, ಸುಳಾದಿ, ಮಂಡಿಗೆ ಮೊದಲಾದ ರಚನೆಗಳನ್ನು ರಚಿಸುವ ಮೂಲಕ ಕನ್ನಡ ಸಾಹಿತ್ಯಕ್ಕೆ ಕೊಡುಗೆ ನೀಡಿದ್ದಾರೆ.
