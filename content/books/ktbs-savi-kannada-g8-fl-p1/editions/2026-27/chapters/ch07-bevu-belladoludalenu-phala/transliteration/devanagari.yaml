author-1: 'पुरंदरदासरु: हरिदास साहित्यद अश्विनिदेवतॆगळल्लि ऒब्बरु. ईगिन महाराष्ट्रद पुरंदरगडदल्लि सा.श. सुमारु 1480 रल्लि जनिसिदरु. पूर्वद हॆसरु श्रीनिवासनायक. आभरण व्यापारियागिद्द इवरु जीवनदल्लि नडॆद घटनॆयिंदागि वैराग्य ताळिदरु. हरिभक्तरागि नूरारु कीर्तनॆगळन्नु रचिसिदरु. ‘दासरॆंदरॆ पुरंदरदासरय्य’ ऎंदु तम्म गुरुगळाद व्यासरायरिंदले हॊगळिकॆगॆ पात्ररादरु. पुरंदरदासरु कर्नाटक संगीतद पिळ्ळारि गीतॆगळन्नु रचिसि ‘कर्नाटक संगीतद पितामह’ ऎनिसिकॊंडरु. इवर अंकित ‘पुरंदरविठल.’'
ashaya-1: हुट्टुगुण सुट्टरू होगुवुदिल्ल. यावुदे कॆलस निर्वहिसिदरू अदरिंद फलाफलवन्नु अपेक्षिसबारदु. निर्मल भक्ति इल्लदिद्दरॆ माडिद कॆलस कूड निष्फलवागुत्तदॆ ऎंबुदन्नु पुरंदरदासरु सरळ उदाहरणॆगळ मूलक इल्लि निरूपिसिद्दारॆ.
