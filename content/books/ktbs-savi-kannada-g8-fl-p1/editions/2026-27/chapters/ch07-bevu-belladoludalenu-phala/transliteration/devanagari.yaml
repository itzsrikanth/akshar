intro-1: कन्नड साहित्य परंपरॆयल्लि 15-16नॆय शतमानदल्लि ज्ञान मत्तु भक्तिय मूलक मुक्तियन्नु काणबयसि, विष्णुवन्नु आराध्य दैवनन्नागिसिकॊंडु, आध्यात्मिक, धार्मिक, सामाजिक, सांस्कृतिक सुधारणॆगागि श्रमिसिद साहित्य प्रकारवे दास साहित्य. दास साहित्यवन्नु दासवाङ्मय, हरिदास साहित्यवॆंतलू करॆयुत्तारॆ. ‘दास’ ऎंदरॆ ‘सेवक’ ऎंदर्थ. श्रीहरियल्लि भक्तियन्निट्टु, मनस्सन्नु निर्मलमाडिकॊंडु, त्याग जीवन नडॆसुत्ता, हरिनाम जपिसुत्ता रचिसिद साहित्य इदागिदॆ.
intro-2: ई साहित्य प्रकारदल्लि बरुव नरहरितीर्थरु, श्रीपादराजरु, व्यासरु, विजयदासरु, कनक - पुरंदरदासरु, राघवेंद्रतीर्थरे मॊदलादवरु. भक्ति-आध्यात्मिक विषयगळन्नु सुंदर काव्यवन्नागिसुव मूलक कीर्तनॆगळु, उगाभोग, सुळादि, मंडिगॆ मॊदलाद रचनॆगळन्नु रचिसुव मूलक कन्नड साहित्यक्कॆ कॊडुगॆ नीडिद्दारॆ.
