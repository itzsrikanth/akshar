labels:
  intro: praveśa
  poem: padya
  author: kṛtikārara paricaya
  ashaya: āśaya
  vocab: padagaḻa artha
  exercise-A: a. kèḻagina praśnègaḻigè òṃdu vākyadalli uttarisi.
  exercise-B: ā. kèḻagina praśnègaḻigè mūru-nālku vākyadalli uttarisi.
  exercise-C: i. kèḻagina heḻikègaḻigè saṃdarbhasahita svārasyavannu barèyiri.
  exercise-D: ī. kèḻagina praśnègaḻigè èṃṭu hattu vākyagaḻalli uttarisi.
intro-1: kannaḍa sāhitya paraṃparèyalli 15-16nèya śatamānadalli jñāna mattu bhaktiya mūlaka muktiyannu kāṇabayasi, viṣṇuvannu ārādhya daivanannāgisikòṃḍu, ādhyātmika, dhārmika, sāmājika, sāṃskṛtika sudhāraṇègāgi śramisida sāhitya prakārave dāsa sāhitya. dāsa sāhityavannu dāsavāṅmaya, haridāsa sāhityavèṃtalū karèyuttārè. ‘dāsa’ èṃdarè ‘sevaka’ èṃdartha. śrīhariyalli bhaktiyanniṭṭu, manassannu nirmalamāḍikòṃḍu, tyāga jīvana naḍèsuttā, harināma japisuttā racisida sāhitya idāgidè.
intro-2: ī sāhitya prakāradalli baruva naraharitīrtharu, śrīpādarājaru, vyāsaru, vijayadāsaru, kanaka - puraṃdaradāsaru, rāghaveṃdratīrthare mòdalādavaru. bhakti-ādhyātmika viṣayagaḻannu suṃdara kāvyavannāgisuva mūlaka kīrtanègaḻu, ugābhoga, suḻādi, maṃḍigè mòdalāda racanègaḻannu racisuva mūlaka kannaḍa sāhityakkè kòḍugè nīḍiddārè.
poem-s1l1: bevu bèlladòḻiḍalenu phala
poem-s1l2: hāvigè hālèrèdarenu phala
