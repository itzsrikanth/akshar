author-1: 'puraṃdaradāsaru: haridāsa sāhityada aśvinidevatègaḻalli òbbaru. īgina mahārāṣṭrada puraṃdaragaḍadalli sā.śa. sumāru 1480 ralli janisidaru. pūrvada hèsaru śrīnivāsanāyaka. ābharaṇa vyāpāriyāgidda ivaru jīvanadalli naḍèda ghaṭanèyiṃdāgi vairāgya tāḻidaru. haribhaktarāgi nūrāru kīrtanègaḻannu racisidaru. ‘dāsarèṃdarè puraṃdaradāsarayya’ èṃdu tamma gurugaḻāda vyāsarāyariṃdale hògaḻikègè pātrarādaru. puraṃdaradāsaru karnāṭaka saṃgītada piḻḻāri gītègaḻannu racisi ‘karnāṭaka saṃgītada pitāmaha’ ènisikòṃḍaru. ivara aṃkita ‘puraṃdaraviṭhala.’'
ashaya-1: huṭṭuguṇa suṭṭarū hoguvudilla. yāvude kèlasa nirvahisidarū adariṃda phalāphalavannu apekṣisabāradu. nirmala bhakti illadiddarè māḍida kèlasa kūḍa niṣphalavāguttadè èṃbudannu puraṃdaradāsaru saraḻa udāharaṇègaḻa mūlaka illi nirūpisiddārè.
