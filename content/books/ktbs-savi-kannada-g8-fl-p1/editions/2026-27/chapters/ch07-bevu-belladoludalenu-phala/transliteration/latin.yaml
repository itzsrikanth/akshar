ex-a-q1: puraṃdaradāsara aṃkita yāvudu?
ex-a-q2: ‘japada phala’ namagè sigabekādarè yāvudannu biḍabeku?
ex-a-q3: maṃtra paṭhanèya phala sigabekèṃdarè manuja enannu biḍabeku?
ex-a-q4: gītèyannu odidaṣṭu phala yāvāga dòrèyuttadè?
ex-b-q1: yātrè māḍuvudu mattu gītèyannu odidarè dòrèyuva phalavenu?
ex-b-q2: japa hāgū upavāsa vratagaḻa phala yāvāga dòrèyuvudilla?
ex-c-q1: “maṃtrava paṭhanèya māḍidarenu phala”
ex-c-q2: “mātāpitaranu baḻalisuvātanu”
ex-c-q3: “snānava māḍidarenu phala”
ex-d-q1: puraṃdara dāsara dṛṣṭiyalli namma śramakkè phala dòrèyuvudu yāvāga? vivarisi.
