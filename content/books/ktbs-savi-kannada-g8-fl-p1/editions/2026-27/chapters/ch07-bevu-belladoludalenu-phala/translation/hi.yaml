intro-1: कन्नड़ साहित्य परंपरा में 15-16वीं शताब्दी में ज्ञान और भक्ति द्वारा मुक्ति चाहने वाले, विष्णु को आराध्य मानकर आध्यात्मिक-धार्मिक-सामाजिक-सांस्कृतिक सुधार के लिए श्रम करने वाले साहित्य प्रकार को दास साहित्य कहते हैं।
poem-s1l1: नीम को गुड़ में मिला देने से क्या फल?
poem-s1l2: साँप को दूध पिलाने से क्या फल?
poem-s2l1: कपट न छोड़ने वाले कुजन मंत्र पढ़ें तो
poem-s2l2: पाठ करने से क्या फल?
ashaya-1: जन्मजात स्वभाव जलाने पर भी नहीं जाता। बिना निर्मल भक्ति के किया काम भी निष्फल होता है — यह पुरंदरदास सरल उदाहरणों से कहते हैं।
vocab-kutila: कुटिल
vocab-kutila-def: धोखा, वंचना
ex-a-q1: पुरंदरदास का अंकित क्या है?
