ex-a-q1: parvata hima yāva èttarakkè èddu niṃtidè?
ex-a-q2: pèrdèrègaḻu yāvudakkè muttaniḍuttivè?
ex-a-q3: hasiru dīpavannu èlli haccalāgidè?
ex-a-q4: yaṃtraghoṣa eḻuttiruva bagè hegè?
ex-a-q5: namma dhvajavannu ètti hiḍidiruvavaru yāru?
ex-a-q6: namma payaṇa ètta sāgidè?
ex-b-q1: kaṇṇu berèyādarū noṭa òṃdāguva saṃdarbhagaḻannu tiḻisi.
ex-b-q2: ‘bhāṣè berèyādarū bhāva òṃdu’ - samarthisi.
ex-c-q1: nāvu bhāratīyaru èṃba abhimāna miḍiyuva sanniveśagaḻannu vivarisi.
