intro-1: आधुनिक कन्नड साहित्यद काव्यपरंपरॆयल्लि नवोदय, नव्य, प्रगतिशील, बंडाय मत्तु दलित ऎंब विविध मजलुगळिवॆ. नवोदय कवितॆगळल्लि प्रकृतिय वर्णनॆ, राष्ट्रीयतॆ मत्तु सांस्कृतिक हिरिमॆयन्नु कविगळु तम्म कवितॆगळल्लि अनावरणगॊळिसुवुदु ऒंदु मुख्य वस्तुवागिद्दु, अदक्कॊंदु उत्तम उदाहरणॆ ई कवितॆयागिदॆ.
poem-s1l1: आकाशक्कॆद्दु निंत पर्वत हिम मौनदल्लि
poem-s1l2: करावळिगॆ मुत्तनिडुव पॆर्दॆरॆगळ गानदल्लि
poem-s1l3: बयल तुंब हसिर दीप हच्चि हरिव नदिगळल्लि
poem-s1l4: नीलियल्लि हॊगॆय चॆल्लि यंत्रघोषवेळुवल्लि
poem-s1l5: कण्णु बेरॆ, नोटवॊंदु-
poem-s1l6: नावु भारतीयरु.
poem-s2l1: नाडिनॆल्ल गडिगळल्लि बानिनल्लि कडलिनल्लि
poem-s2l2: नम्म योधरॆत्ति हिडिद नम्म ध्वजद नॆरळिनल्लि
poem-s2l3: ऒंदॆ नॆलद तॊट्टिलल्लि बॆळॆद नम्म कॊरळिनल्लि
poem-s2l4: नम्म युगद दनिगळागि मूडिदॆल्ल हाडिनल्लि
poem-s2l5: भाषॆ बेरॆ, भाववॊंदु-
poem-s2l6: नावु भारतीयरु.
poem-s3l1: नाडिगागि तनुव तॆत्त हुतात्मर स्मरणॆयल्लि
poem-s3l2: नम्म कष्टदल्लु नॆरॆगॆ नॆरळनीव करुणॆयल्लि
poem-s3l3: दारि बळसि एरुवल्लि बिरुगाळियॆ मॊळगुवल्लि
poem-s3l4: नम्म गुरिय बॆळकिनॆडॆगॆ नडॆव धीर पयणदल्लि
poem-s3l5: ऎल्लॆ इरलि, नावु ऒंदु-
poem-s3l6: नावु भारतीयरु.
author-1: आधुनिक काव्य संदर्भद प्रमुख कविगळल्लि ऒब्बराद कॆ.ऎस्. नरसिंहस्वामि अवरु 26-01-1915 रल्लि मंड्य जिल्लॆय कृष्णराजपेटॆ तालूकिन किक्केरियल्लि जनिसिदरु. इवर मॊदल कवन संकलन मैसूरु मल्लिगॆ 1943रल्लि प्रकटवायितु. इवरु शिलालतॆ, ऐरावत, नवपल्लव, इरुवंतिगॆ, दीपद मल्लि, मनॆयिंद मनॆगॆ, तॆरॆद बागिलु मॊदलाद कवन संकलनगळन्नु रचिसिद्दारॆ. 1977रल्लि इवर तॆरॆद बागिलु ऎंब कवन संग्रहक्कॆ केंद्र साहित्य अकाडॆमि प्रशस्ति लभिसिदॆ. 1990रल्लि मैसूरिनल्लि नडॆद अखिल भारत कन्नड साहित्य सम्मेळनद अध्यक्षरागिद्दरु. इवर दुंडु मल्लिगॆ कवन संकलनक्कॆ कर्नाटक सर्कारद प्रतिष्ठित पंप प्रशस्ति लभिसिदॆ. इवरन्नु कन्नड साहित्य क्षेत्रदल्लि प्रेमकवि ऎंदे गुरुतिसलागिदॆ. 2004रल्लि दैवाधीनरादरु.
ashaya-1: भारतीयतॆ कवनदल्लि कवि भारतीयर एकतॆयन्नु कुरितु अभिमानदिंद हेळिद्दारॆ. भारत देशद प्राकृतिक सौंदर्य, जनर जीवन शैलि, सांस्कृतिक परंपरॆ, भिन्नतॆयल्लि एकताभाव, देशभक्ति, त्याग, परोपकारबुद्धि मुंताद उत्कृष्ट गुणगळन्नु कवि इल्लि विशदीकरिसिद्दारॆ.
