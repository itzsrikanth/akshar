intro-1: आधुनिक कन्नड़ काव्य परंपरा में नवोदय, नव्य, प्रगतिशील, बंडाय और दलित जैसे पड़ाव हैं। नवोदय कविताओं में प्रकृति वर्णन, राष्ट्रीयता और सांस्कृतिक गौरव मुख्य विषय हैं; यह कविता उसका अच्छा उदाहरण है।
poem-s1l5: आँखें अलग, दृष्टि एक—
poem-s1l6: हम भारतीय हैं।
poem-s2l5: भाषाएँ अलग, भाव एक—
poem-s2l6: हम भारतीय हैं।
poem-s3l5: कहीं भी हों, हम एक हैं—
poem-s3l6: हम भारतीय हैं।
ashaya-1: भारतीयता में कवि भारतीयों की एकता पर गर्व से कहते हैं।
ex-a-q5: हमारा ध्वज कौन ऊँचा उठाए हुए हैं?
