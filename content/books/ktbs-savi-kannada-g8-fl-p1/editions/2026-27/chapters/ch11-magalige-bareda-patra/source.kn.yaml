  exercise-A: ಅ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ.
segments:
- id: story-n1
  type: prose
  section: story
  text: |-
    ಇಂದಿರಾ ಪ್ರಿಯದರ್ಶಿನಿಗೆ,
    ಸೆಂಟ್ರಲ್ ಜೈಲ್, ನೈನಿ.
    ಅವಳು ಹುಟ್ಟಿದ ಹಬ್ಬದ ದಿನ
    26.10.1930
- id: story-n2
  type: prose
  section: story
  text: ನಿನ್ನ ಹುಟ್ಟಿದ ಹಬ್ಬದ ದಿನ ಆಶೀರ್ವಾದಗಳನ್ನು, ಉಡುಗೊರೆಗಳನ್ನು ಪಡೆಯುವುದು ನಿನ್ನ ಅಭ್ಯಾಸ. ಆಶೀರ್ವಾದಗಳಿಗೇನು ಕಡಿಮೆ; ಬೇಕಾದಷ್ಟನ್ನು ಕಳಿಸುತ್ತೇನೆ. ಆದರೆ ನೈನಿ ಸೆರೆಮನೆಯಿಂದ ನಾನು ನಿನಗೇನು ಬಹುಮಾನ ಕಳಿಸಲಿ, ಹೇಳು? ನನ್ನ ಬಹುಮಾನಗಳು ನಿಸ್ಸಾರ, ನಿರ್ಘನ. ಯಕ್ಷಿಣಿಯೋ, ಕಿನ್ನರಿಯೋ ನೀಡುವ - ಕೋಟೆಯ ಗೋಡೆಗಳಂತಿರುವ ಸೆರೆಮನೆಯ ಗೋಡೆಗಳು ಸಹ ತಡೆಯಲಾರದ - ಗಾಳಿಯ, ಮನಸ್ಸಿನ, ನಿರಾಕಾರದ ವಸ್ತುವದು.
- id: story-n3
  type: prose
  section: story
  text: ಪ್ರಿಯ! ನೀ ಚೆನ್ನಾಗಿ ಬಲ್ಲೆ; ಉಪದೇಶ ಮಾಡುವುದೆನಗೆ ಇಷ್ಟವಿಲ್ಲ; ಬುದ್ಧಿವಾದ ಕೊಡುವುದೆಂದರೆ ನನಗೆ ಬೇಸರ. ಯಾವಾಗಲಾದರೂ ಹಾಗೆ ಮಾಡಬೇಕೆಂಬಾಸೆಯಾದಾಗಲೆಲ್ಲ ನಾನೆಂದೋ ಓದಿದ “ಬಹಳ ಬುದ್ಧಿವಂತ”ನ ಕತೆ ನೆನಪಿಗೆ ಬರುತ್ತದೆ. ಜ್ಞಾನಾರ್ಜನೆಗಾಗಿ, ವಿವೇಕಸಾಧನೆಗಾಗಿ ಚೀನಾದೇಶದಿಂದ ಪ್ರಯಾಣಿಕನೊಬ್ಬ ಬಂದ ಭರತ ಖಂಡಕ್ಕೆ. ಹಿಯಾನ್ತ್ಸಾಂಗ್ ಎಂಬುದವನ ಹೆಸರು. ಉತ್ತರ ಮೇರುಗಿರಿಗಳೇನು, ಮರುಭೂಮಿಗಳೇನು; ಅವುಗಳನ್ನೆಲ್ಲ ದಾಟಿ ಬಂದ; ಅವನ ಜ್ಞಾನದಾಹವಂತಹುದು! ಭಾರತದಲ್ಲವನು ಬಹುಕಾಲವಿದ್ದ; ಇದ್ದಷ್ಟುಕಾಲ ನಲಂದಾ ಎಂಬ ಮಹಾಘಟಿಕಾಸ್ಥಾನದಲ್ಲಿ ತಾನು ಕಲಿತ, ಪರರಿಗೂ ಕಲಿಸಿದ. ನಲಂದಾ ಆಗ ಪಾಟಲೀಪುತ್ರದ ಬಳಿ ಇತ್ತು. ಈಗ ಅದನ್ನು ಪಾಟ್ನಾ ಎಂದು ಕರೆಯುವರು. ಹಿಯಾನ್ತ್ಸಾಂಗನು ವಿದ್ಯಾಪಾರಂಗತನಾದ ‘ಧರ್ಮಜ್ಞ ಚಕ್ರೇಶ್ವರ’ ನೆಂಬ ಬಿರುದನ್ನು ಪಡೆದ. ಅವನು ಆಸೇತು ಹಿಮಾಚಲ ಪ್ರವಾಸಮಾಡಿದ; ದೇಶವನ್ನೆಲ್ಲ ನೋಡಿದ. ಪೂರ್ವಕಾಲದಲ್ಲಿ ಈ ದೇಶದಲ್ಲಿ ವಾಸವಾಗಿದ್ದ ಜೀವನವನ್ನೆಲ್ಲ ಗ್ರಹಿಸಿದ. ಆಮೇಲೆ ತನ್ನ ಪ್ರವಾಸ ಕುರಿತೊಂದು ಪುಸ್ತಕವನ್ನು ಬರೆದ. ನನ್ನ ಮನಸ್ಸಿಗೆ ಬಂದ ಕತೆ ಈ ಪುಸ್ತಕದಲ್ಲಿದೆ.
- id: story-n4
  type: prose
  section: story
  text: ದಕ್ಷಿಣ ದೇಶದಿಂದ ಕರ್ಣಸುವರ್ಣವೆಂಬ ನಗರಕ್ಕೆ ಒಬ್ಬ ಬಂದನಂತೆ, ಬಿಹಾರದಲ್ಲಿ ಈಗ ಭಾಗಲ್ಪುರವೆಂಬ ಊರಿದೆಯಲ್ಲ; ಅದರ ಬಳಿ ಇತ್ತಂತೆ ನಗರ. ಈ ಮನುಷ್ಯ ತನ್ನ ನಡುವಿಗೆ ತಾಮ್ರದ ಹಲಗೆಗಳನ್ನು ಬಿಗಿದಿದ್ದನಂತೆ. ತಲೆಯ ಮೇಲೊಂದು ಉರಿಯುವ ಪಂಜನ್ನು ಹೊತ್ತಿದ್ದನಂತೆ. ಶೋಭಾಯಮಾನವಾದ ಮುಖಮುದ್ರೆ, ಗಂಭೀರವಾದ ಗತಿ; ಕೈಲಿ ಕಟ್ಟಿಗೆ ಹಿಡಿದು, ಈ ವಿಚಿತ್ರ ವೇಷಧಾರಿ ಲೋಕಸಂಚಾರ ಮಾಡುತ್ತಿದ್ದಾನೆ. ‘ಇದೇನು ವೇಷ’ವೆಂದು ಯಾರಾದರೂ ಕೇಳಿದರೆ “ನನ್ನ ಜ್ಞಾನವಷ್ಟಿದೆ. ಈ ತಾಮ್ರದ ರೇಕುಗಳನ್ನು ಬಿಗಿಸದೆಹೋದೆನಾದರೆ ನನ್ನ ಹೊಟ್ಟೆ ಬಿರಿದೀತು. ನನ್ನ ಸುತ್ತ ಸುಳಿವ ಅಜ್ಞಾನಿಗಳ ಕಂಡೆನಗೆ ‘ಅಯ್ಯೊ’ ಅನಿಸುತ್ತದೆ. ಅವರೆಲ್ಲ ಕತ್ತಲೆಯಲ್ಲಿ ತಡವಿ ಆಡುತ್ತಿದ್ದಾರೆ. ಅವರಿಗಾಗಿ ನಾ ನನ್ನ ನೆತ್ತಿಯ ಮೇಲೆ ದೀಪ ಹೊತ್ತಿದ್ದೇನೆ” ಅನ್ನುವನು.
- id: story-n5
  type: prose
  section: story
  text: ಈ ಲೋಕ ವಿಸ್ತಾರ. ನಮ್ಮ ಈ ಲೋಕದಿಂದಾಚೆ ಅತ್ಯಾಶ್ಚರ್ಯಕರವಾದ, ದೃಗ್ಗೋಚರವಲ್ಲದ ಲೋಕಗಳೆಷ್ಟೋ. ಅಹಂಕಾರಿಯಂತೆ ನಾವೆಲ್ಲ ಜ್ಞಾನಭಂಡಾರಗಳು, ನಾವು ತಿಳಿದುಕೊಳ್ಳಬೇಕಾದದ್ದೇನೂ ಇಲ್ಲವೆಂಬ ಭಯದ ಕಲ್ಪನೆಗೆ ಕಾರಣವಿಲ್ಲ. ಅಂತಹವರು ಹೊಸ ವಿಷಯಗಳನ್ನು ತಿಳಿದುಕೊಳ್ಳುವುದರಿಂದಾಗುವ, ಶೋಧನೆಯಿಂದಾಗುವ ಆನಂದವನ್ನೇನು ಬಲ್ಲರು? ಆ ಮಹಾ ಸಾಹಸದ ಸುಖ ಅವರಿಗೇನು ಗೊತ್ತು?
- id: story-n6
  type: prose
  section: story
  text: ನೀನು ಹುಟ್ಟಿದ್ದು 1917ನೆಯ ವರ್ಷ. ಇತಿಹಾಸದೊಳಗದು ಮಹಾ ವರ್ಷ. ಆ ವರ್ಷ ಮಹಾನಾಯಕನೊಬ್ಬ ಬಂದ. ಬಡವರೆಂದರೆ, ನೋವು ತಿನ್ನುವವರೆಂದರೆ ಆತನ ಹೃದಯ ಪೂರ್ಣ ಪ್ರೇಮಪಾತ್ರ. ಆತನ ಸಹಾನುಭೂತಿ ಅತ್ಯಪೂರ್ವ. ಆತ ಬಂದು ತನ್ನ ಜನರಿಗೆಲ್ಲ “ಇತಿಹಾಸದಲ್ಲಿ ಉತ್ಕೃಷ್ಟವೂ, ಆಚಂದ್ರಾರ್ಕಸ್ಥಾಯಿಯೂ ಆದ ಅಧ್ಯಾಯವನ್ನು ಬರೆಯಿರಿ” ಎಂದು ಹೇಳಿ ಅವರ ಕೈಯಿಂದ ಬರೆಯಿಸಿದ. ನೀನು ಹುಟ್ಟಿದ ತಿಂಗಳಲ್ಲೇ ಲೆನಿನ್ ಮಹಾವಿಪ್ಲವ ಕಾರ್ಯವನ್ನಾರಂಭಿಸಿದ್ದು; ಆರಂಭಿಸಿ ರಷ್ಯಾ ಸೈಬೀರಿಯಾ ದೇಶಗಳ ರೂಪುರೇಖೆಗಳನ್ನೇ ಪರಿವರ್ತನಗೊಳಿಸಿಬಿಟ್ಟ.
- id: story-n7
  type: prose
  section: story
  text: ಇಂದು ಭಾರತದಲ್ಲಿ ಮತ್ತೊಬ್ಬ ಮಹಾನಾಯಕ ಬಂದ; ಕಷ್ಟನಿಷ್ಠುರಗಳಿಗೆ ಸಿಕ್ಕಿದವರೆಂದರೆ ಆತನ ಪ್ರೇಮ ಅಪಾರ; ಅವರಿಗೆ ಸಹಾಯಮಾಡಲು ಉಗ್ರ ಆವೇಶದ ಆತುರ ಅವನಿಗೆ. ಆತ ನಮ್ಮ ಜನರಿಗೆಲ್ಲ ಮಹಾತ್ಕಾರ್ಯ ಸಾಧನೆಮಾಡಲೂ, ಗಂಭೀರ ಬಲಿದಾನಮಾಡಲು ಸ್ಫೂರ್ತಿಕೊಡುತ್ತಿದ್ದಾನೆ, ಬಲಿದಾನ ಮಾಡಿ ನಾವು ಸ್ವಾತಂತ್ರ್ಯ ಪಡೆಯಬೇಕು, ಹಸಿವಿನಿಂದ ಕೊರಗುತ್ತಿರುವವರು, ಬಡವರು, ಅನ್ಯಾಯಕ್ಕೆ ತುತ್ತಾದವರೇ ಮೊದಲಾದವರ ದುಃಖದ ಭಾರವಿಳಿಸಬೇಕು; ಇದು ಆತನಾಸೆ. ಬಾಪೂಜಿ ಈಗ ಸೆರೆಮನೆಯಲ್ಲಿದ್ದಾರೆ. ಆದರೇನು? ಅವರ ಸಂದೇಶದ ಯಕ್ಷಿಣಿಯು ಕೋಟ್ಯನುಕೋಟಿ ಭಾರತೀಯರ ಹೃದಯಗಳನ್ನು ಸೂರೆಗೊಂಡಿದೆ. ಗಂಡಸರು, ಹೆಂಗಸರು, ಮಕ್ಕಳು ಸಹ ತಮ್ಮ ಮುರುಕು ಗುಡಿಸಲುಗಳಿಂದ ಹೊರಬಿದ್ದು ಸ್ವಾತಂತ್ರ್ಯ ಸೈನಿಕರಾಗಿದ್ದಾರೆ. ಭಾರತದಲ್ಲಿ ನಾವಿಂದು ಚರಿತ್ರೆಯನ್ನು ನಿರ್ಮಿಸುತ್ತಿದ್ದೇವೆ. ನಾನು ನೀನು ಎಂಥಹ ಭಾಗ್ಯಶಾಲಿಗಳು, ನಡೆಯುತ್ತಿರುವುದನ್ನೆಲ್ಲ ನಮ್ಮ ಕಣ್ಣಾರೆ ನೋಡುತ್ತಿದ್ದೇವೆ. ಈ ಮಹಾನಾಟಕದಲ್ಲಿ ನಾನು ಸಹ ಕೊಂಚ ಪಾತ್ರವಹಿಸುತ್ತಿದ್ದೇನೆ. ಈ ಮಹೋದ್ಯಮದಲ್ಲಿ ಯಾವುದೇ ಪಾತ್ರ ದೊರೆಯಲಿ ಅಪಕೀರ್ತಿ ಬರುವಂಥಹ ಕಾರ್ಯವೊಂದನ್ನು, ಜನರಿಗೆ ಅವಮಾನವಾಗುವಂತಹ ಕೆಲಸವೊಂದನ್ನು ನಾವು ಮಾಡಲಾಗದು. ನಾವು ಭಾರತದ ಯೋಧರೆನಿಸುವುದಾದರೆ, ಭಾರತದ ಮಾನ ಮರ್ಯಾದೆ ನಮ್ಮ ಕೈಯಲ್ಲಿದೆ; ಆ ಮಾನ ಮರ್ಯಾದೆಯೂ ಪವಿತ್ರವಾದ ಧರ್ಮಸ್ಥೇಯ.
- id: story-n8
  type: prose
  section: story
  text: ಸರಿ ಯಾವುದು, ತಪ್ಪು ಯಾವುದೆಂದು ನಿರ್ಣಯಮಾಡುವುದು ಸುಲಭವಲ್ಲ. ನೀನು ರಹಸ್ಯದಲ್ಲಿ ಒಂದನ್ನೂ ಮಾಡಬೇಡ; ಮರೆಮಾಡಬೇಕೆಂದೆನಿಸುವ ಯಾವ ಕಾರ್ಯಕ್ಕೂ ಕೈಹಾಕಬೇಡ. ತೆರೆಯಮರೆಯಲ್ಲಿ ಕೆಲಸಮಾಡಬೇಕೆಂದು ನಿನಗೆ ಅನಿಸಿದರೆ ಭಯವಿದೆ ಎಂದರ್ಥ. ಭಯವು ಒಳ್ಳೆಯದಲ್ಲ; ನಿನಗೆ ಯೋಗ್ಯವಾದುದಲ್ಲ. ನಿರ್ಭಯವಾಗಿರು, ಆಗಬೇಕಾದುದ್ದೆಲ್ಲ ಆಗುತ್ತದೆ; ನಡೆಯಬೇಕಾದುದ್ದೆಲ್ಲ ನಡೆಯುತ್ತದೆ. ನೀನು ಧೈರ್ಯಶಾಲಿಯಾದರೆ ನಿನಗೆ ಭಯವಾಗುವುದಿಲ್ಲ. ತಲೆತಗ್ಗಿಸುವಂಥ ಕೆಲಸ ಮಾಡುವುದಿಲ್ಲ. ರಹಸ್ಯದಲ್ಲಿ ಒಂದು ಕೆಲಸವೂ ಬೇಡ; ಕಣ್ಮರೆಯ ಕೆಲಸ ಬೇಡವೇಬೇಡ. ಏಕಾಂತವಿರಲಿ, ಇರಬೇಕು; ಏಕಾಂತಕ್ಕೂ ರಹಸ್ಯಕ್ಕೂ ವ್ಯತ್ಯಾಸವಿದೆ. ಪ್ರಿಯಾ! ನೀನು ಹಾಗೇ ಮಾಡಿದ್ದಾದರೆ ನೀನು ಜ್ಯೋತಿಯ ಮಗುವೆನಿಸುವೆ. ಏನೇ ಬಂದೊದಗಲಿ ನಿರ್ಭಯಳೆನಿಸುವೆ, ನಿರ್ಮಲೆ ಎನಿಸುವೆ, ನಿಶ್ಚಲಳೆನಿಸುವೆ. ಮಗೂ, ಇಂದಿಗಿಷ್ಟು ಸಾಕು. ನೀನು ದೊಡ್ಡವಳಾಗಿ ವೀರರಮಣಿಯೆನಿಸು; ಭಾರತಮಾತೆಯ ಸೇವೆ ಸಲಿಸು. ಪೂರ್ಣವಾತ್ಸಲ್ಯದಿಂದ ಹರಸುವೆನು.
- id: author-1
  type: prose
  section: author
  text: ಭಾರತದ ಪ್ರಥಮ ಪ್ರಧಾನಿಗಳಾದ ಜವಾಹರಲಾಲ್ ನೆಹರುರವರು ತಮ್ಮ “ಗ್ಲಿಂಪ್ಸಸ್ ಆಫ್ ವರ್ಲ್ಡ್ ಹಿಸ್ಟ್ರಿ” (Glimpses of World History) ಎಂಬ ಕೃತಿಯನ್ನು ಭಾರತದ ಸ್ವಾತಂತ್ರ್ಯದ ಹೋರಾಟದ ಕಾಲದಲ್ಲಿ ಬಂಧಿಯಾಗಿ ಬೇರೆಬೇರೆ ಸೆರೆಮನೆಗಳಲ್ಲಿ ವಾಸಮಾಡುವ ಸಂದರ್ಭದಲ್ಲಿ ತಮ್ಮ ಮಗಳಿಗೆ ಪತ್ರರೂಪದಲ್ಲಿ ಪ್ರಪಂಚದ ಇತಿಹಾಸ ಹಾಗೂ ಮಹಾನ್ ನಾಯಕರ ಪರಿಚಯವನ್ನು ಮಾಡಿಕೊಡುವ ಪ್ರಯತ್ನವಿದು. ಈ ಎಲ್ಲಾ ಪತ್ರಗಳನ್ನು ಸಂಗ್ರಹಿಸಿದ ಇವರ ತಂಗಿ ವಿಜಯಲಕ್ಷ್ಮಿ ಪಂಡಿತ್ರವರು ಪುಸ್ತಕರೂಪದಲ್ಲಿ ಪ್ರಕಟಿಸಿದರು. ಈ ಕೃತಿಯನ್ನು ತಿರುಮಲೆ ತಾತಾಚಾರ್ಯ ಶರ್ಮ ಅವರು ಹಾಗೂ ಸಿದ್ಧವನಹಳ್ಳಿ ಕೃಷ್ಣಶರ್ಮರವರು “ಜಗತ್ ಕಥಾವಲ್ಲರಿ” ಎಂಬ ಕೃತಿಯಾಗಿ ಕನ್ನಡಕ್ಕೆ ಅನುವಾದಿಸಿದ್ದಾರೆ.
- id: ex-a-q1
  type: question
  exercise: A
  text: ಈ ಪತ್ರವನ್ನು ನೆಹರುರವರು ಯಾರಿಗೆ ಬರೆದಿದ್ದಾರೆ?
- id: ex-a-q2
  type: question
  exercise: A
  text: ಹಿಯಾನ್ತ್ಸಾಂಗ್ ಭರತಖಂಡಕ್ಕೆ ಏಕೆ ಬಂದನು?
- id: ex-a-q3
  type: question
  exercise: A
  text: ನಲಂದ ವಿಶ್ವವಿದ್ಯಾನಿಲಯವು ಎಲ್ಲಿತ್ತು?
- id: ex-a-q4
  type: question
  exercise: A
  text: ದಕ್ಷಿಣ ದೇಶದಿಂದ ಬಂದ ಯಾತ್ರಿಕ ಅವನ ವೇಷದ ಬಗ್ಗೆ ಏನು ಹೇಳುತ್ತಿದ್ದನು?
- id: ex-a-q5
  type: question
  exercise: A
  text: ಬಾಪೂಜಿಯವರ ವ್ಯಕ್ತಿತ್ವದ ಬಗ್ಗೆ ನೆಹರೂರವರು ಏನು ಹೇಳಿದ್ದಾರೆ?
- id: ex-a-q6
  type: question
  exercise: A
  text: ತೆರೆಮರೆಯಲ್ಲಿ ಕೆಲಸ ಮಾಡಿದರೆ ಯಾವ ಅರ್ಥ ಬರುತ್ತದೆ?
