  exercise-A: अ. निम्नलिखित प्रश्नों के उत्तर दीजिए।
story-n1: |-
  इंदिरा प्रियदर्शिनी को,
  सेंट्रल जेल, नैनी।
  उनके जन्मदिन पर
  26.10.1930
story-n2: जन्मदिन पर आशीर्वाद और उपहार पाना तुम्हारी आदत है। आशीर्वाद तो जितने चाहो भेज सकता हूँ। पर नैनी जेल से क्या इनाम भेजूँ?
story-n8: सही-गलत तय करना आसान नहीं। छिपकर कुछ मत करो। निर्भय रहो। प्रिया! ऐसा करोगी तो ज्योति की संतान कहलाओगी। भारतमाता की सेवा करो।
ex-a-q1: नेहरू ने यह पत्र किसे लिखा?
ex-a-q5: बापूजी के व्यक्तित्व के बारे में नेहरू क्या कहते हैं?
