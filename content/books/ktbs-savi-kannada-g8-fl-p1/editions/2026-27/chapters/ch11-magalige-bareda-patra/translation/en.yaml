story-n1: |-
  To Indira Priyadarshini,
  Central Jail, Naini.
  On her birthday
  26.10.1930
story-n2: It is your habit to receive blessings and gifts on your birthday. Blessings I can send in plenty. But from Naini prison, what prize can I send you? My prizes are empty and worthless. It is something of wind, of mind, of the formless — that even prison walls like fort walls cannot stop — as a yakshini or kinnari might give.
story-n8: It is not easy to decide what is right and wrong. Do nothing in secret; do not take up any work you would wish to hide. If you feel you must work behind a curtain, it means there is fear. Fear is not good; it is not worthy of you. Be fearless. Dear one, if you do so you will be called a child of light. Grow up to be a heroine and serve Mother India. I bless you with full affection.
ex-a-q1: To whom did Nehru write this letter?
ex-a-q5: What does Nehru say about Bapuji's personality?
