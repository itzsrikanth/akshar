  exercise-A: a. kòṭṭiruva praśnègaḻigè uttarisi.
story-n1: 'iṃdirā priyadarśinigè,

  sèṃṭral jail, naini.

  avaḻu huṭṭida habbada dina

  26.10.1930'
story-n2: ninna huṭṭida habbada dina āśīrvādagaḻannu, uḍugòrègaḻannu paḍèyuvudu ninna abhyāsa. āśīrvādagaḻigenu kaḍimè; bekādaṣṭannu kaḻisuttenè. ādarè naini sèrèmanèyiṃda nānu ninagenu bahumāna kaḻisali, heḻu? nanna bahumānagaḻu nissāra, nirghana. yakṣiṇiyo, kinnariyo nīḍuva - koṭèya goḍègaḻaṃtiruva sèrèmanèya goḍègaḻu saha taḍèyalārada - gāḻiya, manassina, nirākārada vastuvadu.
story-n3: priya! nī cènnāgi ballè; upadeśa māḍuvudènagè iṣṭavilla; buddhivāda kòḍuvudèṃdarè nanagè besara. yāvāgalādarū hāgè māḍabekèṃbāsèyādāgalèlla nānèṃdo odida “bahaḻa buddhivaṃta”na katè nènapigè baruttadè. jñānārjanègāgi, vivekasādhanègāgi cīnādeśadiṃda prayāṇikanòbba baṃda bharata khaṃḍakkè. hiyāntsāṃg èṃbudavana hèsaru. uttara merugirigaḻenu, marubhūmigaḻenu; avugaḻannèlla dāṭi baṃda; avana jñānadāhavaṃtahudu! bhāratadallavanu bahukālavidda; iddaṣṭukāla nalaṃdā èṃba mahāghaṭikāsthānadalli tānu kalita, pararigū kalisida. nalaṃdā āga pāṭalīputrada baḻi ittu. īga adannu pāṭnā èṃdu karèyuvaru. hiyāntsāṃganu vidyāpāraṃgatanāda ‘dharmajña cakreśvara’ nèṃba birudannu paḍèda. avanu āsetu himācala pravāsamāḍida; deśavannèlla noḍida. pūrvakāladalli ī deśadalli vāsavāgidda jīvanavannèlla grahisida. āmelè tanna pravāsa kuritòṃdu pustakavannu barèda. nanna manassigè baṃda katè ī pustakadallidè.
story-n4: dakṣiṇa deśadiṃda karṇasuvarṇavèṃba nagarakkè òbba baṃdanaṃtè, bihāradalli īga bhāgalpuravèṃba ūridèyalla; adara baḻi ittaṃtè nagara. ī manuṣya tanna naḍuvigè tāmrada halagègaḻannu bigididdanaṃtè. talèya melòṃdu uriyuva paṃjannu hòttiddanaṃtè. śobhāyamānavāda mukhamudrè, gaṃbhīravāda gati; kaili kaṭṭigè hiḍidu, ī vicitra veṣadhāri lokasaṃcāra māḍuttiddānè. ‘idenu veṣa’vèṃdu yārādarū keḻidarè “nanna jñānavaṣṭidè. ī tāmrada rekugaḻannu bigisadèhodènādarè nanna hòṭṭè biridītu. nanna sutta suḻiva ajñānigaḻa kaṃḍènagè ‘ayyò’ anisuttadè. avarèlla kattalèyalli taḍavi āḍuttiddārè. avarigāgi nā nanna nèttiya melè dīpa hòttiddenè” annuvanu.
story-n5: ī loka vistāra. namma ī lokadiṃdācè atyāścaryakaravāda, dṛggocaravallada lokagaḻèṣṭo. ahaṃkāriyaṃtè nāvèlla jñānabhaṃḍāragaḻu, nāvu tiḻidukòḻḻabekādaddenū illavèṃba bhayada kalpanègè kāraṇavilla. aṃtahavaru hòsa viṣayagaḻannu tiḻidukòḻḻuvudariṃdāguva, śodhanèyiṃdāguva ānaṃdavannenu ballaru? ā mahā sāhasada sukha avarigenu gòttu?
story-n6: nīnu huṭṭiddu 1917nèya varṣa. itihāsadòḻagadu mahā varṣa. ā varṣa mahānāyakanòbba baṃda. baḍavarèṃdarè, novu tinnuvavarèṃdarè ātana hṛdaya pūrṇa premapātra. ātana sahānubhūti atyapūrva. āta baṃdu tanna janarigèlla “itihāsadalli utkṛṣṭavū, ācaṃdrārkasthāyiyū āda adhyāyavannu barèyiri” èṃdu heḻi avara kaiyiṃda barèyisida. nīnu huṭṭida tiṃgaḻalle lènin mahāviplava kāryavannāraṃbhisiddu; āraṃbhisi raṣyā saibīriyā deśagaḻa rūpurekhègaḻanne parivartanagòḻisibiṭṭa.
story-n7: iṃdu bhāratadalli mattòbba mahānāyaka baṃda; kaṣṭaniṣṭhuragaḻigè sikkidavarèṃdarè ātana prema apāra; avarigè sahāyamāḍalu ugra āveśada ātura avanigè. āta namma janarigèlla mahātkārya sādhanèmāḍalū, gaṃbhīra balidānamāḍalu sphūrtikòḍuttiddānè, balidāna māḍi nāvu svātaṃtrya paḍèyabeku, hasiviniṃda kòraguttiruvavaru, baḍavaru, anyāyakkè tuttādavare mòdalādavara duḥkhada bhāraviḻisabeku; idu ātanāsè. bāpūji īga sèrèmanèyalliddārè. ādarenu? avara saṃdeśada yakṣiṇiyu koṭyanukoṭi bhāratīyara hṛdayagaḻannu sūrègòṃḍidè. gaṃḍasaru, hèṃgasaru, makkaḻu saha tamma muruku guḍisalugaḻiṃda hòrabiddu svātaṃtrya sainikarāgiddārè. bhāratadalli nāviṃdu caritrèyannu nirmisuttiddevè. nānu nīnu èṃthaha bhāgyaśāligaḻu, naḍèyuttiruvudannèlla namma kaṇṇārè noḍuttiddevè. ī mahānāṭakadalli nānu saha kòṃca pātravahisuttiddenè. ī mahodyamadalli yāvude pātra dòrèyali apakīrti baruvaṃthaha kāryavòṃdannu, janarigè avamānavāguvaṃtaha kèlasavòṃdannu nāvu māḍalāgadu. nāvu bhāratada yodharènisuvudādarè, bhāratada
  māna maryādè namma kaiyallidè; ā māna maryādèyū pavitravāda dharmastheya.
story-n8: sari yāvudu, tappu yāvudèṃdu nirṇayamāḍuvudu sulabhavalla. nīnu rahasyadalli òṃdannū māḍabeḍa; marèmāḍabekèṃdènisuva yāva kāryakkū kaihākabeḍa. tèrèyamarèyalli kèlasamāḍabekèṃdu ninagè anisidarè bhayavidè èṃdartha. bhayavu òḻḻèyadalla; ninagè yogyavādudalla. nirbhayavāgiru, āgabekāduddèlla āguttadè; naḍèyabekāduddèlla naḍèyuttadè. nīnu dhairyaśāliyādarè ninagè bhayavāguvudilla. talètaggisuvaṃtha kèlasa māḍuvudilla. rahasyadalli òṃdu kèlasavū beḍa; kaṇmarèya kèlasa beḍavebeḍa. ekāṃtavirali, irabeku; ekāṃtakkū rahasyakkū vyatyāsavidè. priyā! nīnu hāge māḍiddādarè nīnu jyotiya maguvènisuvè. ene baṃdòdagali nirbhayaḻènisuvè, nirmalè ènisuvè, niścalaḻènisuvè. magū, iṃdigiṣṭu sāku. nīnu dòḍḍavaḻāgi vīraramaṇiyènisu; bhāratamātèya sevè salisu. pūrṇavātsalyadiṃda harasuvènu.
author-1: bhāratada prathama pradhānigaḻāda javāharalāl nèharuravaru tamma “gliṃpsas āph varlḍ hisṭri” (Glimpses of World History) èṃba kṛtiyannu bhāratada svātaṃtryada horāṭada kāladalli baṃdhiyāgi berèberè sèrèmanègaḻalli vāsamāḍuva saṃdarbhadalli tamma magaḻigè patrarūpadalli prapaṃcada itihāsa hāgū mahān nāyakara paricayavannu māḍikòḍuva prayatnavidu. ī èllā patragaḻannu saṃgrahisida ivara taṃgi vijayalakṣmi paṃḍitravaru pustakarūpadalli prakaṭisidaru. ī kṛtiyannu tirumalè tātācārya śarma avaru hāgū siddhavanahaḻḻi kṛṣṇaśarmaravaru “jagat kathāvallari” èṃba kṛtiyāgi kannaḍakkè anuvādisiddārè.
ex-a-q1: ī patravannu nèharuravaru yārigè barèdiddārè?
ex-a-q2: hiyāntsāṃg bharatakhaṃḍakkè ekè baṃdanu?
ex-a-q3: nalaṃda viśvavidyānilayavu èllittu?
ex-a-q4: dakṣiṇa deśadiṃda baṃda yātrika avana veṣada baggè enu heḻuttiddanu?
ex-a-q5: bāpūjiyavara vyaktitvada baggè nèharūravaru enu heḻiddārè?
ex-a-q6: tèrèmarèyalli kèlasa māḍidarè yāva artha baruttadè?
