  story: पत्र
  author: कृतिकारर परिचय
  exercise-A: अ. कॊट्टिरुव प्रश्नॆगळिगॆ उत्तरिसि.
story-n1: 'इंदिरा प्रियदर्शिनिगॆ,

  सॆंट्रल् जैल्, नैनि.

  अवळु हुट्टिद हब्बद दिन

  26.10.1930'
story-n2: निन्न हुट्टिद हब्बद दिन आशीर्वादगळन्नु, उडुगॊरॆगळन्नु पडॆयुवुदु निन्न अभ्यास. आशीर्वादगळिगेनु कडिमॆ; बेकादष्टन्नु कळिसुत्तेनॆ. आदरॆ नैनि सॆरॆमनॆयिंद नानु निनगेनु बहुमान कळिसलि, हेळु? नन्न बहुमानगळु निस्सार, निर्घन. यक्षिणियो, किन्नरियो नीडुव - कोटॆय गोडॆगळंतिरुव सॆरॆमनॆय गोडॆगळु सह तडॆयलारद - गाळिय, मनस्सिन, निराकारद वस्तुवदु.
story-n3: प्रिय! नी चॆन्नागि बल्लॆ; उपदेश माडुवुदॆनगॆ इष्टविल्ल; बुद्धिवाद कॊडुवुदॆंदरॆ ननगॆ बेसर. यावागलादरू हागॆ माडबेकॆंबासॆयादागलॆल्ल नानॆंदो ओदिद “बहळ बुद्धिवंत”न कतॆ नॆनपिगॆ बरुत्तदॆ. ज्ञानार्जनॆगागि, विवेकसाधनॆगागि चीनादेशदिंद प्रयाणिकनॊब्ब बंद भरत खंडक्कॆ. हियान्त्सांग् ऎंबुदवन हॆसरु. उत्तर मेरुगिरिगळेनु, मरुभूमिगळेनु; अवुगळन्नॆल्ल दाटि बंद; अवन ज्ञानदाहवंतहुदु! भारतदल्लवनु बहुकालविद्द; इद्दष्टुकाल नलंदा ऎंब महाघटिकास्थानदल्लि तानु कलित, पररिगू कलिसिद. नलंदा आग पाटलीपुत्रद बळि इत्तु. ईग अदन्नु पाट्ना ऎंदु करॆयुवरु. हियान्त्सांगनु विद्यापारंगतनाद ‘धर्मज्ञ चक्रेश्वर’ नॆंब बिरुदन्नु पडॆद. अवनु आसेतु हिमाचल प्रवासमाडिद; देशवन्नॆल्ल नोडिद. पूर्वकालदल्लि ई देशदल्लि वासवागिद्द जीवनवन्नॆल्ल ग्रहिसिद. आमेलॆ तन्न प्रवास कुरितॊंदु पुस्तकवन्नु बरॆद. नन्न मनस्सिगॆ बंद कतॆ ई पुस्तकदल्लिदॆ.
story-n4: दक्षिण देशदिंद कर्णसुवर्णवॆंब नगरक्कॆ ऒब्ब बंदनंतॆ, बिहारदल्लि ईग भागल्पुरवॆंब ऊरिदॆयल्ल; अदर बळि इत्तंतॆ नगर. ई मनुष्य तन्न नडुविगॆ ताम्रद हलगॆगळन्नु बिगिदिद्दनंतॆ. तलॆय मेलॊंदु उरियुव पंजन्नु हॊत्तिद्दनंतॆ. शोभायमानवाद मुखमुद्रॆ, गंभीरवाद गति; कैलि कट्टिगॆ हिडिदु, ई विचित्र वेषधारि लोकसंचार माडुत्तिद्दानॆ. ‘इदेनु वेष’वॆंदु यारादरू केळिदरॆ “नन्न ज्ञानवष्टिदॆ. ई ताम्रद रेकुगळन्नु बिगिसदॆहोदॆनादरॆ नन्न हॊट्टॆ बिरिदीतु. नन्न सुत्त सुळिव अज्ञानिगळ कंडॆनगॆ ‘अय्यॊ’ अनिसुत्तदॆ. अवरॆल्ल कत्तलॆयल्लि तडवि आडुत्तिद्दारॆ. अवरिगागि ना नन्न नॆत्तिय मेलॆ दीप हॊत्तिद्देनॆ” अन्नुवनु.
story-n5: ई लोक विस्तार. नम्म ई लोकदिंदाचॆ अत्याश्चर्यकरवाद, दृग्गोचरवल्लद लोकगळॆष्टो. अहंकारियंतॆ नावॆल्ल ज्ञानभंडारगळु, नावु तिळिदुकॊळ्ळबेकादद्देनू इल्लवॆंब भयद कल्पनॆगॆ कारणविल्ल. अंतहवरु हॊस विषयगळन्नु तिळिदुकॊळ्ळुवुदरिंदागुव, शोधनॆयिंदागुव आनंदवन्नेनु बल्लरु? आ महा साहसद सुख अवरिगेनु गॊत्तु?
story-n6: नीनु हुट्टिद्दु 1917नॆय वर्ष. इतिहासदॊळगदु महा वर्ष. आ वर्ष महानायकनॊब्ब बंद. बडवरॆंदरॆ, नोवु तिन्नुववरॆंदरॆ आतन हृदय पूर्ण प्रेमपात्र. आतन सहानुभूति अत्यपूर्व. आत बंदु तन्न जनरिगॆल्ल “इतिहासदल्लि उत्कृष्टवू, आचंद्रार्कस्थायियू आद अध्यायवन्नु बरॆयिरि” ऎंदु हेळि अवर कैयिंद बरॆयिसिद. नीनु हुट्टिद तिंगळल्ले लॆनिन् महाविप्लव कार्यवन्नारंभिसिद्दु; आरंभिसि रष्या सैबीरिया देशगळ रूपुरेखॆगळन्ने परिवर्तनगॊळिसिबिट्ट.
story-n7: इंदु भारतदल्लि मत्तॊब्ब महानायक बंद; कष्टनिष्ठुरगळिगॆ सिक्किदवरॆंदरॆ आतन प्रेम अपार; अवरिगॆ सहायमाडलु उग्र आवेशद आतुर अवनिगॆ. आत नम्म जनरिगॆल्ल महात्कार्य साधनॆमाडलू, गंभीर बलिदानमाडलु स्फूर्तिकॊडुत्तिद्दानॆ, बलिदान माडि नावु स्वातंत्र्य पडॆयबेकु, हसिविनिंद कॊरगुत्तिरुववरु, बडवरु, अन्यायक्कॆ तुत्तादवरे मॊदलादवर दुःखद भारविळिसबेकु; इदु आतनासॆ. बापूजि ईग सॆरॆमनॆयल्लिद्दारॆ. आदरेनु? अवर संदेशद यक्षिणियु कोट्यनुकोटि भारतीयर हृदयगळन्नु सूरॆगॊंडिदॆ. गंडसरु, हॆंगसरु, मक्कळु सह तम्म मुरुकु गुडिसलुगळिंद हॊरबिद्दु स्वातंत्र्य सैनिकरागिद्दारॆ. भारतदल्लि नाविंदु चरित्रॆयन्नु निर्मिसुत्तिद्देवॆ. नानु नीनु ऎंथह भाग्यशालिगळु, नडॆयुत्तिरुवुदन्नॆल्ल नम्म कण्णारॆ नोडुत्तिद्देवॆ. ई महानाटकदल्लि नानु सह कॊंच पात्रवहिसुत्तिद्देनॆ. ई महोद्यमदल्लि यावुदे पात्र दॊरॆयलि अपकीर्ति बरुवंथह कार्यवॊंदन्नु, जनरिगॆ अवमानवागुवंतह कॆलसवॊंदन्नु नावु माडलागदु. नावु भारतद योधरॆनिसुवुदादरॆ, भारतद मान मर्यादॆ नम्म कैयल्लिदॆ; आ मान मर्यादॆयू पवित्रवाद धर्मस्थेय.
story-n8: सरि यावुदु, तप्पु यावुदॆंदु निर्णयमाडुवुदु सुलभवल्ल. नीनु रहस्यदल्लि ऒंदन्नू माडबेड; मरॆमाडबेकॆंदॆनिसुव याव कार्यक्कू कैहाकबेड. तॆरॆयमरॆयल्लि कॆलसमाडबेकॆंदु निनगॆ अनिसिदरॆ भयविदॆ ऎंदर्थ. भयवु ऒळ्ळॆयदल्ल; निनगॆ योग्यवादुदल्ल. निर्भयवागिरु, आगबेकादुद्दॆल्ल आगुत्तदॆ; नडॆयबेकादुद्दॆल्ल नडॆयुत्तदॆ. नीनु धैर्यशालियादरॆ निनगॆ भयवागुवुदिल्ल. तलॆतग्गिसुवंथ कॆलस माडुवुदिल्ल. रहस्यदल्लि ऒंदु कॆलसवू बेड; कण्मरॆय कॆलस बेडवेबेड. एकांतविरलि, इरबेकु; एकांतक्कू रहस्यक्कू व्यत्यासविदॆ. प्रिया! नीनु हागे माडिद्दादरॆ नीनु ज्योतिय मगुवॆनिसुवॆ. एने बंदॊदगलि निर्भयळॆनिसुवॆ, निर्मलॆ ऎनिसुवॆ, निश्चलळॆनिसुवॆ. मगू, इंदिगिष्टु साकु. नीनु दॊड्डवळागि वीररमणियॆनिसु; भारतमातॆय सेवॆ सलिसु. पूर्णवात्सल्यदिंद हरसुवॆनु.
author-1: भारतद प्रथम प्रधानिगळाद जवाहरलाल् नॆहरुरवरु तम्म “ग्लिंप्सस् आफ् वर्ल्ड् हिस्ट्रि” (Glimpses of World History) ऎंब कृतियन्नु भारतद स्वातंत्र्यद होराटद कालदल्लि बंधियागि बेरॆबेरॆ सॆरॆमनॆगळल्लि वासमाडुव संदर्भदल्लि तम्म मगळिगॆ पत्ररूपदल्लि प्रपंचद इतिहास हागू महान् नायकर परिचयवन्नु माडिकॊडुव प्रयत्नविदु. ई ऎल्ला पत्रगळन्नु संग्रहिसिद इवर तंगि विजयलक्ष्मि पंडित्रवरु पुस्तकरूपदल्लि प्रकटिसिदरु. ई कृतियन्नु तिरुमलॆ ताताचार्य शर्म अवरु हागू सिद्धवनहळ्ळि कृष्णशर्मरवरु “जगत् कथावल्लरि” ऎंब कृतियागि कन्नडक्कॆ अनुवादिसिद्दारॆ.
ex-a-q1: ई पत्रवन्नु नॆहरुरवरु यारिगॆ बरॆदिद्दारॆ?
ex-a-q2: हियान्त्सांग् भरतखंडक्कॆ एकॆ बंदनु?
ex-a-q3: नलंद विश्वविद्यानिलयवु ऎल्लित्तु?
ex-a-q4: दक्षिण देशदिंद बंद यात्रिक अवन वेषद बग्गॆ एनु हेळुत्तिद्दनु?
ex-a-q5: बापूजियवर व्यक्तित्वद बग्गॆ नॆहरूरवरु एनु हेळिद्दारॆ?
ex-a-q6: तॆरॆमरॆयल्लि कॆलस माडिदरॆ याव अर्थ बरुत्तदॆ?
