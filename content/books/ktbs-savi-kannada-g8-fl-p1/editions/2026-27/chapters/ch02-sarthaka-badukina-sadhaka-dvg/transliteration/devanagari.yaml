intro-1: मानवन जन्मद सार्थकतॆ, मौल्ययुत जीवनवन्नु नडॆसुवुदरिंद मात्र रूपुगॊळ्ळबल्लुदु. प्रतियॊब्बरिगू साधनॆय मॆट्टिलेरुव विपुल अवकाशगळिद्दरू साधनॆयन्नु साध्यवागिसि कॊंडवरु कॆलवरु मात्र. इंथ सार्थक बदुकन्नु कट्टिकॊंडु मौल्ययुत जीवन नडॆसिद महान् व्यक्तिगळ जीवनद प्रमुख घटनॆगळ स्थूल विचारगळन्नु कलात्मकवागि दाखलिसुवुदे ‘व्यक्तिचित्र’.
intro-2: इंदु आत्मकथन, जीवनचरित्रॆगळंतॆ व्यक्तिचित्रवु सह कन्नड साहित्यदल्लि प्रमुख स्थान पडॆदुकॊंडिदॆ. ‘अधिकार’ ऎंबुदु मनुष्यन व्यक्तित्वद सत्वपरीक्षॆ ऎन्नुत्तारॆ. लौकिक आसॆ आमिषगळिगॆ ऒळगागद व्यक्ति आदर्श व्यक्तित्व हॊंदबल्ल ऎन्नुव मातिगनुगुणवागि, कन्नड साहित्यदल्लि अप्रतिम धीमंतरागि बॆळॆदवरु डि.वि.जियवरु. साहितियागि, पत्रकर्तरागि, संपादकरागि मत्तु राजकारणियागिद्दरू सह बदुकिन मौल्यगळिगॆ बॆलॆ कॊट्टु जीवनवन्नु सार्थकगॊळिसिकॊंड ई महान् साधकन आदर्श बदुकिन चित्रणवन्नु प्रकृत गद्यभागदल्लि स्मरिसलागिदॆ.
story-n1: डिविजि अवरु तम्मॊडनॆ मातु निल्लिसिबिट्टरॆंदु दिवान् मिर्जा साहेबरिगॆ कळवळवागि होगित्तु. आप्तरॆदुरु अदन्नु तोडिकॊंडरु. तम्मदु एनू तप्पिल्ल ऎंदरु. अदक्कागि अवरिवर मूलक प्रयत्न कूड माडिदरु. आ कालद दॊड्ड दिवानरन्नू तम्म स्नेहक्कागि हीगॆ हातॊरॆयुवंतॆ माडिद व्यक्तियेनु सामान्यरॆ? हागॆंदु अवरेनु दॊड्डदॊड्ड डिग्रि पडॆदवरल्ल, ऎस्.ऎस्. ऎल्.सि. कूड दाटद ओदु. भारि श्रीमंतरो ऎंदरॆ दिनदिनद अगत्य पूरैसिद्दे हॆच्चु ऎन्नुवंथ कॆलस. सर्कारि उद्योगवल्लवागि दॊड्ड अधिकारद मातंतू इल्लवे इल्ल. आदरॆ मैसूरु राज्यद परमोच्च अधिकार हिडिदिद्द मिर्जा साहेबरू अवर स्नेह तप्पितॆनिसि कळवळगॊंडिद्दरु.
story-n2: इंथा सत्वशालि व्यक्तित्व डिविजिगॆ बंदद्दु हेगॆ? केवल शील, विवेक, निस्पøहतॆ, स्वयं आर्जित पांडित्य, सार्वजनिक हितासक्तिगळ बलदिंद, मिर्जार कालक्कॆ डिविजि दॊड्ड मेधावियॆंदु विद्यावंतर वलयदल्लि हॆसरागिद्दरु. डिविजि अवर हुट्टूरु कोलार जिल्लॆगॆ सेरिद मुळबागिलु. अवरदु वेदशास्त्र संपन्नराद हिरियरिद्द कुटुंब. अवर तंदॆ वॆंकटरमणय्य, तायि अलमेलम्म. डिविजि अवर मनस्सिन मेलॆ बहळ प्रभाव बीरिद व्यक्तिगळु इब्बरु. ऒब्बरु अवर अज्जि, ऎंदरॆ तायिय तायि साकम्म. महर्षिप्रायराद चेतन ऎंदु डिविजि अवरन्नु वर्णिसिद्दारॆ. इन्नॊब्बरु अवर सोदरमाव तिम्मप्प. प्रसिद्ध कृतियाद मंकुतिम्मन कग्गदल्लि तिम्म अवर हृदयस्पर्शियाद चित्रणविदॆ. आ चित्रणक्कॆ आधारवाद व्यक्तित्व ई तिम्मप्पनवरदे. डिविजि मुळबागिलिन आंग्लो वर्नाक्युलर् शालॆयल्लि लोवर् सॆकॆंडरि शिक्षणवन्नु पूर्णगॊळिसिदरु. मुंदिन ओदिगॆ बेरॆ ऊरिगे होगबेकु; आदरॆ हणद अनुकूलविल्ल. ओदु इल्लिगॆ साकु ऎंदु तंदॆ, अज्जि तीर्मानिसिदरु. आदरॆ डिविजि अवर भाग्य ऎंबंतॆ अवर सहायक्कॆ बंदवनु रसूल्खान्. आतनॊब्ब बंडि हॊडॆयुव व्यक्ति. बडव, प्रामाणिक. डिविजि अवर तंदॆगॆ बेकागिद्दवनु. “गुंडण्ण
  तुंब चुरुकाद हुडुग. अवनु मुंदॆ ओदलेबेकु”, अंत रसूल्खान् हट हिडिदुबिट्ट. “नीवॆल्ल एनादरु हेळि. अवनन्नु नन्न बंडियल्लि कूरिसिकॊंडु बौरिंग् पेटॆ (बंगारपेटॆ) गॆ होग्तिनि. बॆंगळूरिन रैलिनल्लि कूरिसि टिकॆट् कॊडिसि, ऒंदु रूपायि कै खर्चिगॆ कॊट्टुबिड्तीनि. अवन ओदु मात्र नडीलेबेकु”. रसूल्खान्न ई निर्धार ऎल्लरन्नू दंगुबडिसितु. ऎल्ल अवनु हेळिदंतॆये नडॆयितु. डिविजि बॆंगळूरन्नु कंडद्दु हीगॆ रसूल्खानन दयॆयिंद.
story-n3: विश्वेश्वरय्य अवरु दिवानरागिद्द काल. डिविजि आग युव पत्रकर्त. दसरा उत्सव बंतु. राज्यद ऎल्ल पत्रिकॆगळू अदर विशेष वरदि नीडिदवु. इदाद नाल्कु दिनक्कॆ पत्रकर्तरिगॆल्ल सर्कारदिंद दॊड्ड मॊत्त संभावनॆ रूपदल्लि होयितु. डिविजि तमगॆ बंदिद्द हणद सहित दिवानरल्लिगॆ बंदरु. “एनु बंदिरि गुंडप्प?” “ननगॆ ई हण याकॆ कळिसिद्दारॆ?” दसरा उत्सववन्नु चॆन्नागि वरदि माडिद्दीरि, अदक्कॆ.
story-n4: “अदक्कॆ हण याकॆ कळिसबेकु?” “पत्रकर्तरिगॆ ओडाट, खर्चु इरुत्तदॆ. अल्लदॆ हिंदिनिंद बंद पद्धति” “वरदि माडुवुदु पत्रकर्तर कर्तव्य. अदक्कॆ खर्चादरॆ पत्रिकॆयवरु कॊडबेकु, सर्कारवल्ल. ननगॆ ई हण खंडित बेड. बेडवे बेड”. ऎंदरु डिविजि. विश्वेश्वरय्य अवरु तम्म कार्यदर्शिगॆ हेळिदरु. “ई मनुष्यन रीतिये बेरॆ. इवरिगॆ नावु हण कॊडलु बरुवुदिल्ल. अदन्नु हिंदक्कॆ तॆगॆदुकॊंडु बिडि!” विश्वेश्वरय्य अवरु तम्म कॆलस कार्यगळल्लि ऎष्टो जन मेधाविगळ सहाय पडॆयुत्तिद्दरु. प्रतियागि अदक्कॆ तक्क संभावनॆयन्नु कॊडुत्तिद्दरु. डिविजि अवरिंदलू अवरु अनेक कॆलस माडिसिकॊंडिद्दुंटु. मॊदल सल अवरिगॆ संभावनॆ कॊडलु होदाग डिविजि ऒप्पलिल्ल. इदु राज्यद कॆलस. अल्लदॆ विश्वेश्वरय्य ऎंथ महाव्यक्ति! अवर जॊतॆगॆ व्यवहरिसिद्दे तमगॊंदु हॆम्मॆ. हागिरुवाग अदक्कॆ संभावनॆये? ऎंदिगू कूडदु. इदु अवर तर्क. आदरॆ ई तर्क नडॆयलिल्ल. डिविजि मॊंडादरॆ विश्वेश्वरय्य जगमॊंडु. इदु नन्न वैयक्तिक कॆलस. ननगॆ इदक्कॆ हण बरुत्तदॆ. नीवु तॆगॆदुकॊळ्ळलेबेकु. इल्लदिद्दरॆ मुंदॆ निम्म सहायवे बेड ऎंदु कोपिसिकॊंडरु. आयितु; तॆगॆदुकॊळ्ळलु डिविजि ऒप्पिदरु. मुंदॆ विश्वेश्वरय्य
  अवरिगॆ प्रतिसलवू चॆक्कु कॊडुत्ता होदरु. डिविजि पडॆयुत्ता होदरु. आदरॆ आ चॆक्कुगळु ब्यांकिन मॆट्टिलन्नु हत्तिदरॆ तानॆ?
story-n5: हणवन्नु सर्कारद सहायवन्नु इष्टु उदासीन माडिद व्यक्ति ऎंथ ‘श्रीमंत’रिद्दिरबहुदु. ऒम्मॆ डिविजिय बंधुगळॊब्बर मनॆयल्लि ऒंदु उत्सव नडॆयितु. डिविजिगॆ होगलु आगलिल्ल. मक्कळन्नु कळिसिदरु. आरति अक्षतॆय हॊत्तादरू हॆंडति मनॆयल्ले इद्दारॆ. गंड असमाधानदिंद केळिदरु. “नीनु उत्सवक्कॆ होगुवुदिल्लवे?” ‘इल्ल’ ‘याकॆ’? ‘मक्कळन्नु कळिसिद्देनल्ल’
story-n6: “अदु सरि नीनू होगबेकष्टॆ. अवरु नमगॆ बहळ बेकादवरु नीनु होगदिद्दरॆ बेसरपडुवुदिल्लवे?” “मनॆयल्लि यारादरू इरबेकल्ल” “नानु इरुत्तेनॆ. नीनु होगि बा.” अवर हॆंडति एनेनो सबूबु हेळिदरु. डिविजि अदक्कॆ उत्तर कॊडुत्तले होदरु. निजवाद कारण कडॆगॆ हॊरबरलेबेकायितु. “नानु हेळबारदॆंदिद्दॆ. नीवु पट्टुहिडिदु नन्न बायि बिडिसुत्तिद्दीरि. नन्न हत्तिर इरुवुदु इदॊंदे सीरॆ. इदू ऒंदॆरडु कडॆ हरिदिदॆ. नानु ई बट्टॆयल्लि हॊरगॆ काणिसिकॊंडरॆ जन निम्मन्नु कुरितु आडिकॊळ्ळुवुदिल्लवे? बंधुगळ मनॆगॆ होगिबरुवुदु हेगॆ ननगॆ कर्तव्यवो हागे निम्म मर्यादॆगॆ ऊनबारदंतॆ नडॆदुकॊळ्ळुवुदू ननगॆ कर्तव्यवे अल्लवे?” डिविजि अवरु आधुनिक कन्नड साहित्यद दिग्गजरल्लि ऒब्बरु. कन्नड सारस्वत लोकद भीष्म ऎंदु करॆसिकॊंडवरु. अवरद्दु होलिकॆ इल्लद अपूर्व व्यक्तित्व. इतर साहितिगळंतॆ अवरु साहिति मात्रवागिरलिल्ल. हॆसरांत पत्रकर्तरागिद्दरु. हिरिय वेदांतियागिद्दरु. राज्यशास्त्रदल्लि आळवाद तिळिवळिकॆयुळ्ळवरागिद्दरु. सार्वजनिक जीवनक्कॆ संबंधिसिद ऎल्ल विचारगळ मंथनक्कागि गोखलॆ सार्वजनिक संस्थॆयंथ प्रसिद्ध संस्थॆयन्नु कट्टिद साहिति बेरॆ यारिद्दारॆ? अवरन्नु ‘महा
  धीमंत’ ऎंब मातिनिंद वर्णिसुवुदु सरियादीतेनो. अवर व्यक्तित्ववन्नु अवरु बरॆद कवितॆगळ सालुगळु बहळ सॊगसागि वर्णिसुत्तवॆ. ई सालुगळन्नु गमनिसि.
story-n7: वनसुमदॊलॆन्न जी वनवु विकसिसुवंतॆ मनवननुगॊळिसु गुरुवे - हे देव || काननदि मल्लिगॆयु मौनदिं बिरिदु निज सौरभव सूसि नलविं तानॆलॆय पिंतिर्दु दीनतॆय तोरि अभि मानवनु तॊरॆदु कृतकृत्यतॆय पडॆवंतॆ
story-n8: इळॆयिंद मॊळकॆ ऒगॆवंदु तमटॆगळिल्ल फल मागुवंदु तुत्तूरि दनियिल्ल बॆळकीव सूर्यचंद्ररदॊंदु सद्दिल्ल हॊलि निन्न तुटिगळनु - मंकुतिम्म हुल्लागु बॆट्टदडि मनॆगॆ मल्लिगॆयागु कल्लागु कष्टगळ मळॆय विधि सुरियॆ बॆल्ल सक्करॆयागु दीन दुर्बलरिंगॆ ऎल्लरॊळगॊंदागु मंकुतिम्म.
author-1: डा. ऎन्.ऎस्. लक्ष्मीनारायण भट्ट अवरु29. 10. 1936रल्लि शिवमॊग्गदल्लि जनिसिदरु. तंदॆ शिवराम भट्ट, तायि मूकांबिकॆ. बॆंगळूरु विश्वविद्यानिलयद कन्नड अध्ययन केंद्रदल्लि प्राध्यापकरागि, निर्देशकरागि, आट्र्स् फ्याकल्टिय डीन् आगि दुडिदिद्दारॆ. इवरु श्रेष्ठ साहिति, प्रौढ विमर्शक, जनप्रिय भावगीतकार, समर्थ अनुवादक, विद्वांस मत्तु वाग्मि. इवर कवन संकलनगळुवृत्त, चित्रकूट, सुळि.इवर प्रसिद्ध ध्वनि सुरुळिगळुदीपिका, भावसंगम, बंदे बरताव काल, बारो वसंत, अभिनंदन, भावोत्सव, प्रेमधारॆ.मक्कळ ध्वनि सुरुळिगळुनंदन, किन्नरि, नविलुगरि, किशोरिमुंतादवु. हत्तारु साहित्य साधकर जीवन घटनॆगळ बगॆगॆ बॆळकु चॆल्लुव साहित्य रत्नसंपुटकृतियन्नु रचिसिद्दारॆ. 2000दल्लि हूस्टन्निनल्लि नडॆद प्रथम अमॆरिका विश्व कन्नड सम्मेळनद कविगोष्ठिय अध्यक्षतॆ वहिसिद्दरु.राज्य साहित्य अकाडॆमि प्रशस्ति, शिवराम कारंत प्रशस्ति, राज्योत्सव प्रशस्ति, मास्ति प्रशस्ति, आळ्वास् नुडिसिरि प्रशस्ति, आर्यभट प्रशस्तिइवॆल्लवू इवर साहित्य सेवॆगॆ संदिवॆ. डा. ऎन्. ऎस्. लक्ष्मीनारायण भट्ट अवर साहित्य रत्न संपुटकृतियिंद प्रस्तुत गद्य भागवन्नु आय्दु संपादिसि
  निगदिपडिसिदॆ.
ashaya-1: भाव कन्नड नाडु रस ऋषिगळ बीडु. साधु सत्पुरुषर नॆलॆवीडु. कन्नड नाडिनल्लि हलवारु सत्पुरुषरु जनिसि, त्यागजीवन नडॆसि, इतररिगॆ आदर्शप्रायरागिद्दारॆ. इंतह ऋषिप्रायरादवरल्लि डिविजि अवरू ऒब्बरु. सुसंस्कøत विद्यावंतराद डिविजि अवरु सुमारु 66 कृतिगळन्नु ऎंदरॆ सुमारु 8000 पुटगळ साहित्यवन्नु 1500 पुटगळ बिडि लेखनगळन्नु कन्नड साहित्यक्कॆ नीडिद सिरिवंत साहिति. लेखक, पत्रकर्त, संपादक, साहिति मत्तु राजकारणियागि ऎल्लदक्कू मिगिलागि लौकिक आसॆ आमिषगळिगॆ ऒळगागदे मेरु व्यक्तित्वद आदर्श व्यक्तियागि बाळि बदुकिदवरु डा. डि.वि.गुंडप्प अवरु. तनगागि आस्ति, हण मुंतादुवन्नु गळिसदॆ सदा समाजमुखियागि, आदर्श राष्ट्र निर्माणक्कागि दणियदे दुडिदवरु डिविजि. अवर सार्थक बदुकु, आदर्श जीवन नम्मॆल्लर बदुकिन सूत्रवागलि ऎंबुदे पठ्यद आशय. * * *
