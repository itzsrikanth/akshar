intro-1: mānavana janmada sārthakatè, maulyayuta jīvanavannu naḍèsuvudariṃda mātra rūpugòḻḻaballudu. pratiyòbbarigū sādhanèya mèṭṭileruva vipula avakāśagaḻiddarū sādhanèyannu sādhyavāgisi kòṃḍavaru kèlavaru mātra. iṃtha sārthaka badukannu kaṭṭikòṃḍu maulyayuta jīvana naḍèsida mahān vyaktigaḻa jīvanada pramukha ghaṭanègaḻa sthūla vicāragaḻannu kalātmakavāgi dākhalisuvude ‘vyakticitra’.
intro-2: iṃdu ātmakathana, jīvanacaritrègaḻaṃtè vyakticitravu saha kannaḍa sāhityadalli pramukha sthāna paḍèdukòṃḍidè. ‘adhikāra’ èṃbudu manuṣyana vyaktitvada satvaparīkṣè ènnuttārè. laukika āsè āmiṣagaḻigè òḻagāgada vyakti ādarśa vyaktitva hòṃdaballa ènnuva mātiganuguṇavāgi, kannaḍa sāhityadalli apratima dhīmaṃtarāgi bèḻèdavaru ḍi.vi.jiyavaru. sāhitiyāgi, patrakartarāgi, saṃpādakarāgi mattu rājakāraṇiyāgiddarū saha badukina maulyagaḻigè bèlè kòṭṭu jīvanavannu sārthakagòḻisikòṃḍa ī mahān sādhakana ādarśa badukina citraṇavannu prakṛta gadyabhāgadalli smarisalāgidè.
story-n1: ḍiviji avaru tammòḍanè mātu nillisibiṭṭarèṃdu divān mirjā sāhebarigè kaḻavaḻavāgi hogittu. āptarèduru adannu toḍikòṃḍaru. tammadu enū tappilla èṃdaru. adakkāgi avarivara mūlaka prayatna kūḍa māḍidaru. ā kālada dòḍḍa divānarannū tamma snehakkāgi hīgè hātòrèyuvaṃtè māḍida vyaktiyenu sāmānyarè? hāgèṃdu avarenu dòḍḍadòḍḍa ḍigri paḍèdavaralla, ès.ès. èl.si. kūḍa dāṭada odu. bhāri śrīmaṃtaro èṃdarè dinadinada agatya pūraisidde hèccu ènnuvaṃtha kèlasa. sarkāri udyogavallavāgi dòḍḍa adhikārada mātaṃtū illave illa. ādarè maisūru rājyada paramocca adhikāra hiḍididda mirjā sāhebarū avara sneha tappitènisi kaḻavaḻagòṃḍiddaru.
story-n2: iṃthā satvaśāli vyaktitva ḍivijigè baṃdaddu hegè? kevala śīla, viveka, nispaøhatè, svayaṃ ārjita pāṃḍitya, sārvajanika hitāsaktigaḻa baladiṃda, mirjāra kālakkè ḍiviji dòḍḍa medhāviyèṃdu vidyāvaṃtara valayadalli hèsarāgiddaru. ḍiviji avara huṭṭūru kolāra jillègè serida muḻabāgilu. avaradu vedaśāstra saṃpannarāda hiriyaridda kuṭuṃba. avara taṃdè vèṃkaṭaramaṇayya, tāyi alamelamma. ḍiviji avara manassina melè bahaḻa prabhāva bīrida vyaktigaḻu ibbaru. òbbaru avara ajji, èṃdarè tāyiya tāyi sākamma. maharṣiprāyarāda cetana èṃdu ḍiviji avarannu varṇisiddārè. innòbbaru avara sodaramāva timmappa. prasiddha kṛtiyāda maṃkutimmana kaggadalli timma avara hṛdayasparśiyāda citraṇavidè. ā citraṇakkè ādhāravāda vyaktitva ī timmappanavarade. ḍiviji muḻabāgilina āṃglo varnākyular śālèyalli lovar sèkèṃḍari śikṣaṇavannu pūrṇagòḻisidaru. muṃdina odigè berè ūrige hogabeku; ādarè haṇada anukūlavilla. odu illigè sāku èṃdu taṃdè, ajji tīrmānisidaru. ādarè ḍiviji avara bhāgya èṃbaṃtè avara sahāyakkè baṃdavanu
  rasūlkhān. ātanòbba baṃḍi hòḍèyuva vyakti. baḍava, prāmāṇika. ḍiviji avara taṃdègè bekāgiddavanu. “guṃḍaṇṇa tuṃba curukāda huḍuga. avanu muṃdè odalebeku”, aṃta rasūlkhān haṭa hiḍidubiṭṭa. “nīvèlla enādaru heḻi. avanannu nanna baṃḍiyalli kūrisikòṃḍu bauriṃg peṭè (baṃgārapeṭè) gè hogtini. bèṃgaḻūrina railinalli kūrisi ṭikèṭ kòḍisi, òṃdu rūpāyi kai kharcigè kòṭṭubiḍtīni. avana odu mātra naḍīlebeku”. rasūlkhānna ī nirdhāra èllarannū daṃgubaḍisitu. èlla avanu heḻidaṃtèye naḍèyitu. ḍiviji bèṃgaḻūrannu kaṃḍaddu hīgè rasūlkhānana dayèyiṃda.
story-n3: viśveśvarayya avaru divānarāgidda kāla. ḍiviji āga yuva patrakarta. dasarā utsava baṃtu. rājyada èlla patrikègaḻū adara viśeṣa varadi nīḍidavu. idāda nālku dinakkè patrakartarigèlla sarkāradiṃda dòḍḍa mòtta saṃbhāvanè rūpadalli hoyitu. ḍiviji tamagè baṃdidda haṇada sahita divānaralligè baṃdaru. “enu baṃdiri guṃḍappa?” “nanagè ī haṇa yākè kaḻisiddārè?” dasarā utsavavannu cènnāgi varadi māḍiddīri, adakkè.
story-n4: “adakkè haṇa yākè kaḻisabeku?” “patrakartarigè oḍāṭa, kharcu iruttadè. alladè hiṃdiniṃda baṃda paddhati” “varadi māḍuvudu patrakartara kartavya. adakkè kharcādarè patrikèyavaru kòḍabeku, sarkāravalla. nanagè ī haṇa khaṃḍita beḍa. beḍave beḍa”. èṃdaru ḍiviji. viśveśvarayya avaru tamma kāryadarśigè heḻidaru. “ī manuṣyana rītiye berè. ivarigè nāvu haṇa kòḍalu baruvudilla. adannu hiṃdakkè tègèdukòṃḍu biḍi!” viśveśvarayya avaru tamma kèlasa kāryagaḻalli èṣṭo jana medhāvigaḻa sahāya paḍèyuttiddaru. pratiyāgi adakkè takka saṃbhāvanèyannu kòḍuttiddaru. ḍiviji avariṃdalū avaru aneka kèlasa māḍisikòṃḍidduṃṭu. mòdala sala avarigè saṃbhāvanè kòḍalu hodāga ḍiviji òppalilla. idu rājyada kèlasa. alladè viśveśvarayya èṃtha mahāvyakti! avara jòtègè vyavaharisidde tamagòṃdu hèmmè. hāgiruvāga adakkè saṃbhāvanèye? èṃdigū kūḍadu. idu avara tarka. ādarè ī tarka naḍèyalilla. ḍiviji mòṃḍādarè viśveśvarayya jagamòṃḍu. idu nanna vaiyaktika kèlasa. nanagè idakkè haṇa baruttadè. nīvu tègèdukòḻḻalebeku. illadiddarè
  muṃdè nimma sahāyave beḍa èṃdu kopisikòṃḍaru. āyitu; tègèdukòḻḻalu ḍiviji òppidaru. muṃdè viśveśvarayya avarigè pratisalavū cèkku kòḍuttā hodaru. ḍiviji paḍèyuttā hodaru. ādarè ā cèkkugaḻu byāṃkina mèṭṭilannu hattidarè tānè?
story-n5: haṇavannu sarkārada sahāyavannu iṣṭu udāsīna māḍida vyakti èṃtha ‘śrīmaṃta’riddirabahudu. òmmè ḍivijiya baṃdhugaḻòbbara manèyalli òṃdu utsava naḍèyitu. ḍivijigè hogalu āgalilla. makkaḻannu kaḻisidaru. ārati akṣatèya hòttādarū hèṃḍati manèyalle iddārè. gaṃḍa asamādhānadiṃda keḻidaru. “nīnu utsavakkè hoguvudillave?” ‘illa’ ‘yākè’? ‘makkaḻannu kaḻisiddenalla’
story-n6: “adu sari nīnū hogabekaṣṭè. avaru namagè bahaḻa bekādavaru nīnu hogadiddarè besarapaḍuvudillave?” “manèyalli yārādarū irabekalla” “nānu iruttenè. nīnu hogi bā.” avara hèṃḍati eneno sabūbu heḻidaru. ḍiviji adakkè uttara kòḍuttale hodaru. nijavāda kāraṇa kaḍègè hòrabaralebekāyitu. “nānu heḻabāradèṃdiddè. nīvu paṭṭuhiḍidu nanna bāyi biḍisuttiddīri. nanna hattira iruvudu idòṃde sīrè. idū òṃdèraḍu kaḍè harididè. nānu ī baṭṭèyalli hòragè kāṇisikòṃḍarè jana nimmannu kuritu āḍikòḻḻuvudillave? baṃdhugaḻa manègè hogibaruvudu hegè nanagè kartavyavo hāge nimma maryādègè ūnabāradaṃtè naḍèdukòḻḻuvudū nanagè kartavyave allave?” ḍiviji avaru ādhunika kannaḍa sāhityada diggajaralli òbbaru. kannaḍa sārasvata lokada bhīṣma èṃdu karèsikòṃḍavaru. avaraddu holikè illada apūrva vyaktitva. itara sāhitigaḻaṃtè avaru sāhiti mātravāgiralilla. hèsarāṃta patrakartarāgiddaru. hiriya vedāṃtiyāgiddaru. rājyaśāstradalli āḻavāda tiḻivaḻikèyuḻḻavarāgiddaru. sārvajanika jīvanakkè saṃbaṃdhisida èlla vicāragaḻa maṃthanakkāgi
  gokhalè sārvajanika saṃsthèyaṃtha prasiddha saṃsthèyannu kaṭṭida sāhiti berè yāriddārè? avarannu ‘mahā dhīmaṃta’ èṃba mātiniṃda varṇisuvudu sariyādīteno. avara vyaktitvavannu avaru barèda kavitègaḻa sālugaḻu bahaḻa sògasāgi varṇisuttavè. ī sālugaḻannu gamanisi.
story-n7: vanasumadòlènna jī vanavu vikasisuvaṃtè manavananugòḻisu guruve - he deva || kānanadi malligèyu maunadiṃ biridu nija saurabhava sūsi nalaviṃ tānèlèya piṃtirdu dīnatèya tori abhi mānavanu tòrèdu kṛtakṛtyatèya paḍèvaṃtè
story-n8: iḻèyiṃda mòḻakè ògèvaṃdu tamaṭègaḻilla phala māguvaṃdu tuttūri daniyilla bèḻakīva sūryacaṃdraradòṃdu saddilla hòli ninna tuṭigaḻanu - maṃkutimma hullāgu bèṭṭadaḍi manègè malligèyāgu kallāgu kaṣṭagaḻa maḻèya vidhi suriyè bèlla sakkarèyāgu dīna durbalariṃgè èllaròḻagòṃdāgu maṃkutimma.
author-1: ḍā. èn.ès. lakṣmīnārāyaṇa bhaṭṭa avaru29. 10. 1936ralli śivamòggadalli janisidaru. taṃdè śivarāma bhaṭṭa, tāyi mūkāṃbikè. bèṃgaḻūru viśvavidyānilayada kannaḍa adhyayana keṃdradalli prādhyāpakarāgi, nirdeśakarāgi, āṭrs phyākalṭiya ḍīn āgi duḍididdārè. ivaru śreṣṭha sāhiti, prauḍha vimarśaka, janapriya bhāvagītakāra, samartha anuvādaka, vidvāṃsa mattu vāgmi. ivara kavana saṃkalanagaḻuvṛtta, citrakūṭa, suḻi.ivara prasiddha dhvani suruḻigaḻudīpikā, bhāvasaṃgama, baṃde baratāva kāla, bāro vasaṃta, abhinaṃdana, bhāvotsava, premadhārè.makkaḻa dhvani suruḻigaḻunaṃdana, kinnari, navilugari, kiśorimuṃtādavu. hattāru sāhitya sādhakara jīvana ghaṭanègaḻa bagègè bèḻaku cèlluva sāhitya ratnasaṃpuṭakṛtiyannu racisiddārè. 2000dalli hūsṭanninalli naḍèda prathama amèrikā viśva kannaḍa sammeḻanada kavigoṣṭhiya adhyakṣatè vahisiddaru.rājya sāhitya akāḍèmi praśasti, śivarāma kāraṃta praśasti, rājyotsava praśasti, māsti praśasti, āḻvās nuḍisiri praśasti, āryabhaṭa praśastiivèllavū ivara sāhitya sevègè
  saṃdivè. ḍā. èn. ès. lakṣmīnārāyaṇa bhaṭṭa avara sāhitya ratna saṃpuṭakṛtiyiṃda prastuta gadya bhāgavannu āydu saṃpādisi nigadipaḍisidè.
ashaya-1: bhāva kannaḍa nāḍu rasa ṛṣigaḻa bīḍu. sādhu satpuruṣara nèlèvīḍu. kannaḍa nāḍinalli halavāru satpuruṣaru janisi, tyāgajīvana naḍèsi, itararigè ādarśaprāyarāgiddārè. iṃtaha ṛṣiprāyarādavaralli ḍiviji avarū òbbaru. susaṃskaøta vidyāvaṃtarāda ḍiviji avaru sumāru 66 kṛtigaḻannu èṃdarè sumāru 8000 puṭagaḻa sāhityavannu 1500 puṭagaḻa biḍi lekhanagaḻannu kannaḍa sāhityakkè nīḍida sirivaṃta sāhiti. lekhaka, patrakarta, saṃpādaka, sāhiti mattu rājakāraṇiyāgi èlladakkū migilāgi laukika āsè āmiṣagaḻigè òḻagāgade meru vyaktitvada ādarśa vyaktiyāgi bāḻi badukidavaru ḍā. ḍi.vi.guṃḍappa avaru. tanagāgi āsti, haṇa muṃtāduvannu gaḻisadè sadā samājamukhiyāgi, ādarśa rāṣṭra nirmāṇakkāgi daṇiyade duḍidavaru ḍiviji. avara sārthaka baduku, ādarśa jīvana nammèllara badukina sūtravāgali èṃbude paṭhyada āśaya. * * *
