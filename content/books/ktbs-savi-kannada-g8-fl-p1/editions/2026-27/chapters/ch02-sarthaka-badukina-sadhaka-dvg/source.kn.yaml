segments:
- id: intro-1
  type: prose
  section: intro
  text: ಮಾನವನ ಜನ್ಮದ ಸಾರ್ಥಕತೆ, ಮೌಲ್ಯಯುತ ಜೀವನವನ್ನು ನಡೆಸುವುದರಿಂದ ಮಾತ್ರ ರೂಪುಗೊಳ್ಳಬಲ್ಲುದು. ಪ್ರತಿಯೊಬ್ಬರಿಗೂ ಸಾಧನೆಯ ಮೆಟ್ಟಿಲೇರುವ ವಿಪುಲ ಅವಕಾಶಗಳಿದ್ದರೂ ಸಾಧನೆಯನ್ನು ಸಾಧ್ಯವಾಗಿಸಿ ಕೊಂಡವರು ಕೆಲವರು ಮಾತ್ರ. ಇಂಥ ಸಾರ್ಥಕ ಬದುಕನ್ನು ಕಟ್ಟಿಕೊಂಡು ಮೌಲ್ಯಯುತ ಜೀವನ ನಡೆಸಿದ ಮಹಾನ್ ವ್ಯಕ್ತಿಗಳ ಜೀವನದ ಪ್ರಮುಖ ಘಟನೆಗಳ ಸ್ಥೂಲ ವಿಚಾರಗಳನ್ನು ಕಲಾತ್ಮಕವಾಗಿ ದಾಖಲಿಸುವುದೇ ‘ವ್ಯಕ್ತಿಚಿತ್ರ’.
- id: intro-2
  type: prose
  section: intro
  text: ಇಂದು ಆತ್ಮಕಥನ, ಜೀವನಚರಿತ್ರೆಗಳಂತೆ ವ್ಯಕ್ತಿಚಿತ್ರವು ಸಹ ಕನ್ನಡ ಸಾಹಿತ್ಯದಲ್ಲಿ ಪ್ರಮುಖ ಸ್ಥಾನ ಪಡೆದುಕೊಂಡಿದೆ. ‘ಅಧಿಕಾರ’ ಎಂಬುದು ಮನುಷ್ಯನ ವ್ಯಕ್ತಿತ್ವದ ಸತ್ವಪರೀಕ್ಷೆ ಎನ್ನುತ್ತಾರೆ. ಲೌಕಿಕ ಆಸೆ ಆಮಿಷಗಳಿಗೆ ಒಳಗಾಗದ ವ್ಯಕ್ತಿ ಆದರ್ಶ ವ್ಯಕ್ತಿತ್ವ ಹೊಂದಬಲ್ಲ ಎನ್ನುವ ಮಾತಿಗನುಗುಣವಾಗಿ, ಕನ್ನಡ ಸಾಹಿತ್ಯದಲ್ಲಿ ಅಪ್ರತಿಮ ಧೀಮಂತರಾಗಿ ಬೆಳೆದವರು ಡಿ.ವಿ.ಜಿಯವರು. ಸಾಹಿತಿಯಾಗಿ, ಪತ್ರಕರ್ತರಾಗಿ, ಸಂಪಾದಕರಾಗಿ ಮತ್ತು ರಾಜಕಾರಣಿಯಾಗಿದ್ದರೂ ಸಹ ಬದುಕಿನ ಮೌಲ್ಯಗಳಿಗೆ ಬೆಲೆ ಕೊಟ್ಟು ಜೀವನವನ್ನು ಸಾರ್ಥಕಗೊಳಿಸಿಕೊಂಡ ಈ ಮಹಾನ್ ಸಾಧಕನ ಆದರ್ಶ ಬದುಕಿನ ಚಿತ್ರಣವನ್ನು ಪ್ರಕೃತ ಗದ್ಯಭಾಗದಲ್ಲಿ ಸ್ಮರಿಸಲಾಗಿದೆ.
- id: story-n1
  type: prose
  section: story
  text: ಡಿವಿಜಿ ಅವರು ತಮ್ಮೊಡನೆ ಮಾತು ನಿಲ್ಲಿಸಿಬಿಟ್ಟರೆಂದು ದಿವಾನ್ ಮಿರ್ಜಾ ಸಾಹೇಬರಿಗೆ ಕಳವಳವಾಗಿ ಹೋಗಿತ್ತು. ಆಪ್ತರೆದುರು ಅದನ್ನು ತೋಡಿಕೊಂಡರು. ತಮ್ಮದು ಏನೂ ತಪ್ಪಿಲ್ಲ ಎಂದರು. ಅದಕ್ಕಾಗಿ ಅವರಿವರ ಮೂಲಕ ಪ್ರಯತ್ನ ಕೂಡ ಮಾಡಿದರು. ಆ ಕಾಲದ ದೊಡ್ಡ ದಿವಾನರನ್ನೂ ತಮ್ಮ ಸ್ನೇಹಕ್ಕಾಗಿ ಹೀಗೆ ಹಾತೊರೆಯುವಂತೆ ಮಾಡಿದ ವ್ಯಕ್ತಿಯೇನು ಸಾಮಾನ್ಯರೆ? ಹಾಗೆಂದು ಅವರೇನು ದೊಡ್ಡದೊಡ್ಡ ಡಿಗ್ರಿ ಪಡೆದವರಲ್ಲ, ಎಸ್.ಎಸ್. ಎಲ್.ಸಿ. ಕೂಡ ದಾಟದ ಓದು. ಭಾರಿ ಶ್ರೀಮಂತರೋ ಎಂದರೆ ದಿನದಿನದ ಅಗತ್ಯ ಪೂರೈಸಿದ್ದೇ ಹೆಚ್ಚು ಎನ್ನುವಂಥ ಕೆಲಸ. ಸರ್ಕಾರಿ ಉದ್ಯೋಗವಲ್ಲವಾಗಿ ದೊಡ್ಡ ಅಧಿಕಾರದ ಮಾತಂತೂ ಇಲ್ಲವೇ ಇಲ್ಲ. ಆದರೆ ಮೈಸೂರು ರಾಜ್ಯದ ಪರಮೋಚ್ಚ ಅಧಿಕಾರ ಹಿಡಿದಿದ್ದ ಮಿರ್ಜಾ ಸಾಹೇಬರೂ ಅವರ ಸ್ನೇಹ ತಪ್ಪಿತೆನಿಸಿ ಕಳವಳಗೊಂಡಿದ್ದರು.
- id: story-n2
  type: prose
  section: story
  text: ಇಂಥಾ ಸತ್ವಶಾಲಿ ವ್ಯಕ್ತಿತ್ವ ಡಿವಿಜಿಗೆ ಬಂದದ್ದು ಹೇಗೆ? ಕೇವಲ ಶೀಲ, ವಿವೇಕ, ನಿಸ್ಪøಹತೆ, ಸ್ವಯಂ ಆರ್ಜಿತ ಪಾಂಡಿತ್ಯ, ಸಾರ್ವಜನಿಕ ಹಿತಾಸಕ್ತಿಗಳ ಬಲದಿಂದ, ಮಿರ್ಜಾರ ಕಾಲಕ್ಕೆ ಡಿವಿಜಿ ದೊಡ್ಡ ಮೇಧಾವಿಯೆಂದು ವಿದ್ಯಾವಂತರ ವಲಯದಲ್ಲಿ ಹೆಸರಾಗಿದ್ದರು. ಡಿವಿಜಿ ಅವರ ಹುಟ್ಟೂರು ಕೋಲಾರ ಜಿಲ್ಲೆಗೆ ಸೇರಿದ ಮುಳಬಾಗಿಲು. ಅವರದು ವೇದಶಾಸ್ತ್ರ ಸಂಪನ್ನರಾದ ಹಿರಿಯರಿದ್ದ ಕುಟುಂಬ. ಅವರ ತಂದೆ ವೆಂಕಟರಮಣಯ್ಯ, ತಾಯಿ ಅಲಮೇಲಮ್ಮ. ಡಿವಿಜಿ ಅವರ ಮನಸ್ಸಿನ ಮೇಲೆ ಬಹಳ ಪ್ರಭಾವ ಬೀರಿದ ವ್ಯಕ್ತಿಗಳು ಇಬ್ಬರು. ಒಬ್ಬರು ಅವರ ಅಜ್ಜಿ, ಎಂದರೆ ತಾಯಿಯ ತಾಯಿ ಸಾಕಮ್ಮ. ಮಹರ್ಷಿಪ್ರಾಯರಾದ ಚೇತನ ಎಂದು ಡಿವಿಜಿ ಅವರನ್ನು ವರ್ಣಿಸಿದ್ದಾರೆ. ಇನ್ನೊಬ್ಬರು ಅವರ ಸೋದರಮಾವ ತಿಮ್ಮಪ್ಪ. ಪ್ರಸಿದ್ಧ ಕೃತಿಯಾದ ಮಂಕುತಿಮ್ಮನ ಕಗ್ಗದಲ್ಲಿ ತಿಮ್ಮ ಅವರ ಹೃದಯಸ್ಪರ್ಶಿಯಾದ ಚಿತ್ರಣವಿದೆ. ಆ ಚಿತ್ರಣಕ್ಕೆ ಆಧಾರವಾದ ವ್ಯಕ್ತಿತ್ವ ಈ ತಿಮ್ಮಪ್ಪನವರದೇ. ಡಿವಿಜಿ ಮುಳಬಾಗಿಲಿನ ಆಂಗ್ಲೋ ವರ್ನಾಕ್ಯುಲರ್ ಶಾಲೆಯಲ್ಲಿ ಲೋವರ್ ಸೆಕೆಂಡರಿ ಶಿಕ್ಷಣವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿದರು. ಮುಂದಿನ ಓದಿಗೆ ಬೇರೆ ಊರಿಗೇ ಹೋಗಬೇಕು; ಆದರೆ ಹಣದ ಅನುಕೂಲವಿಲ್ಲ. ಓದು ಇಲ್ಲಿಗೆ ಸಾಕು ಎಂದು ತಂದೆ, ಅಜ್ಜಿ ತೀರ್ಮಾನಿಸಿದರು. ಆದರೆ ಡಿವಿಜಿ ಅವರ ಭಾಗ್ಯ ಎಂಬಂತೆ ಅವರ ಸಹಾಯಕ್ಕೆ ಬಂದವನು ರಸೂಲ್ಖಾನ್. ಆತನೊಬ್ಬ ಬಂಡಿ ಹೊಡೆಯುವ ವ್ಯಕ್ತಿ. ಬಡವ, ಪ್ರಾಮಾಣಿಕ. ಡಿವಿಜಿ ಅವರ ತಂದೆಗೆ ಬೇಕಾಗಿದ್ದವನು. “ಗುಂಡಣ್ಣ
    ತುಂಬ ಚುರುಕಾದ ಹುಡುಗ. ಅವನು ಮುಂದೆ ಓದಲೇಬೇಕು”, ಅಂತ ರಸೂಲ್ಖಾನ್ ಹಟ ಹಿಡಿದುಬಿಟ್ಟ. “ನೀವೆಲ್ಲ ಏನಾದರು ಹೇಳಿ. ಅವನನ್ನು ನನ್ನ ಬಂಡಿಯಲ್ಲಿ ಕೂರಿಸಿಕೊಂಡು ಬೌರಿಂಗ್ ಪೇಟೆ (ಬಂಗಾರಪೇಟೆ) ಗೆ ಹೋಗ್ತಿನಿ. ಬೆಂಗಳೂರಿನ ರೈಲಿನಲ್ಲಿ ಕೂರಿಸಿ ಟಿಕೆಟ್ ಕೊಡಿಸಿ, ಒಂದು ರೂಪಾಯಿ ಕೈ ಖರ್ಚಿಗೆ ಕೊಟ್ಟುಬಿಡ್ತೀನಿ. ಅವನ ಓದು ಮಾತ್ರ ನಡೀಲೇಬೇಕು”. ರಸೂಲ್ಖಾನ್ನ ಈ ನಿರ್ಧಾರ ಎಲ್ಲರನ್ನೂ ದಂಗುಬಡಿಸಿತು. ಎಲ್ಲ ಅವನು ಹೇಳಿದಂತೆಯೇ ನಡೆಯಿತು. ಡಿವಿಜಿ ಬೆಂಗಳೂರನ್ನು ಕಂಡದ್ದು ಹೀಗೆ ರಸೂಲ್ಖಾನನ ದಯೆಯಿಂದ.
- id: story-n3
  type: prose
  section: story
  text: ವಿಶ್ವೇಶ್ವರಯ್ಯ ಅವರು ದಿವಾನರಾಗಿದ್ದ ಕಾಲ. ಡಿವಿಜಿ ಆಗ ಯುವ ಪತ್ರಕರ್ತ. ದಸರಾ ಉತ್ಸವ ಬಂತು. ರಾಜ್ಯದ ಎಲ್ಲ ಪತ್ರಿಕೆಗಳೂ ಅದರ ವಿಶೇಷ ವರದಿ ನೀಡಿದವು. ಇದಾದ ನಾಲ್ಕು ದಿನಕ್ಕೆ ಪತ್ರಕರ್ತರಿಗೆಲ್ಲ ಸರ್ಕಾರದಿಂದ ದೊಡ್ಡ ಮೊತ್ತ ಸಂಭಾವನೆ ರೂಪದಲ್ಲಿ ಹೋಯಿತು. ಡಿವಿಜಿ ತಮಗೆ ಬಂದಿದ್ದ ಹಣದ ಸಹಿತ ದಿವಾನರಲ್ಲಿಗೆ ಬಂದರು. “ಏನು ಬಂದಿರಿ ಗುಂಡಪ್ಪ?” “ನನಗೆ ಈ ಹಣ ಯಾಕೆ ಕಳಿಸಿದ್ದಾರೆ?” ದಸರಾ ಉತ್ಸವವನ್ನು ಚೆನ್ನಾಗಿ ವರದಿ ಮಾಡಿದ್ದೀರಿ, ಅದಕ್ಕೆ.
- id: story-n4
  type: prose
  section: story
  text: “ಅದಕ್ಕೆ ಹಣ ಯಾಕೆ ಕಳಿಸಬೇಕು?” “ಪತ್ರಕರ್ತರಿಗೆ ಓಡಾಟ, ಖರ್ಚು ಇರುತ್ತದೆ. ಅಲ್ಲದೆ ಹಿಂದಿನಿಂದ ಬಂದ ಪದ್ಧತಿ” “ವರದಿ ಮಾಡುವುದು ಪತ್ರಕರ್ತರ ಕರ್ತವ್ಯ. ಅದಕ್ಕೆ ಖರ್ಚಾದರೆ ಪತ್ರಿಕೆಯವರು ಕೊಡಬೇಕು, ಸರ್ಕಾರವಲ್ಲ. ನನಗೆ ಈ ಹಣ ಖಂಡಿತ ಬೇಡ. ಬೇಡವೇ ಬೇಡ”. ಎಂದರು ಡಿವಿಜಿ. ವಿಶ್ವೇಶ್ವರಯ್ಯ ಅವರು ತಮ್ಮ ಕಾರ್ಯದರ್ಶಿಗೆ ಹೇಳಿದರು. “ಈ ಮನುಷ್ಯನ ರೀತಿಯೇ ಬೇರೆ. ಇವರಿಗೆ ನಾವು ಹಣ ಕೊಡಲು ಬರುವುದಿಲ್ಲ. ಅದನ್ನು ಹಿಂದಕ್ಕೆ ತೆಗೆದುಕೊಂಡು ಬಿಡಿ!” ವಿಶ್ವೇಶ್ವರಯ್ಯ ಅವರು ತಮ್ಮ ಕೆಲಸ ಕಾರ್ಯಗಳಲ್ಲಿ ಎಷ್ಟೋ ಜನ ಮೇಧಾವಿಗಳ ಸಹಾಯ ಪಡೆಯುತ್ತಿದ್ದರು. ಪ್ರತಿಯಾಗಿ ಅದಕ್ಕೆ ತಕ್ಕ ಸಂಭಾವನೆಯನ್ನು ಕೊಡುತ್ತಿದ್ದರು. ಡಿವಿಜಿ ಅವರಿಂದಲೂ ಅವರು ಅನೇಕ ಕೆಲಸ ಮಾಡಿಸಿಕೊಂಡಿದ್ದುಂಟು. ಮೊದಲ ಸಲ ಅವರಿಗೆ ಸಂಭಾವನೆ ಕೊಡಲು ಹೋದಾಗ ಡಿವಿಜಿ ಒಪ್ಪಲಿಲ್ಲ. ಇದು ರಾಜ್ಯದ ಕೆಲಸ. ಅಲ್ಲದೆ ವಿಶ್ವೇಶ್ವರಯ್ಯ ಎಂಥ ಮಹಾವ್ಯಕ್ತಿ! ಅವರ ಜೊತೆಗೆ ವ್ಯವಹರಿಸಿದ್ದೇ ತಮಗೊಂದು ಹೆಮ್ಮೆ. ಹಾಗಿರುವಾಗ ಅದಕ್ಕೆ ಸಂಭಾವನೆಯೇ? ಎಂದಿಗೂ ಕೂಡದು. ಇದು ಅವರ ತರ್ಕ. ಆದರೆ ಈ ತರ್ಕ ನಡೆಯಲಿಲ್ಲ. ಡಿವಿಜಿ ಮೊಂಡಾದರೆ ವಿಶ್ವೇಶ್ವರಯ್ಯ ಜಗಮೊಂಡು. ಇದು ನನ್ನ ವೈಯಕ್ತಿಕ ಕೆಲಸ. ನನಗೆ ಇದಕ್ಕೆ ಹಣ ಬರುತ್ತದೆ. ನೀವು ತೆಗೆದುಕೊಳ್ಳಲೇಬೇಕು. ಇಲ್ಲದಿದ್ದರೆ ಮುಂದೆ ನಿಮ್ಮ ಸಹಾಯವೇ ಬೇಡ ಎಂದು ಕೋಪಿಸಿಕೊಂಡರು. ಆಯಿತು; ತೆಗೆದುಕೊಳ್ಳಲು ಡಿವಿಜಿ ಒಪ್ಪಿದರು. ಮುಂದೆ ವಿಶ್ವೇಶ್ವರಯ್ಯ ಅವರಿಗೆ
    ಪ್ರತಿಸಲವೂ ಚೆಕ್ಕು ಕೊಡುತ್ತಾ ಹೋದರು. ಡಿವಿಜಿ ಪಡೆಯುತ್ತಾ ಹೋದರು. ಆದರೆ ಆ ಚೆಕ್ಕುಗಳು ಬ್ಯಾಂಕಿನ ಮೆಟ್ಟಿಲನ್ನು ಹತ್ತಿದರೆ ತಾನೆ?
- id: story-n5
  type: prose
  section: story
  text: ಹಣವನ್ನು ಸರ್ಕಾರದ ಸಹಾಯವನ್ನು ಇಷ್ಟು ಉದಾಸೀನ ಮಾಡಿದ ವ್ಯಕ್ತಿ ಎಂಥ ‘ಶ್ರೀಮಂತ’ರಿದ್ದಿರಬಹುದು. ಒಮ್ಮೆ ಡಿವಿಜಿಯ ಬಂಧುಗಳೊಬ್ಬರ ಮನೆಯಲ್ಲಿ ಒಂದು ಉತ್ಸವ ನಡೆಯಿತು. ಡಿವಿಜಿಗೆ ಹೋಗಲು ಆಗಲಿಲ್ಲ. ಮಕ್ಕಳನ್ನು ಕಳಿಸಿದರು. ಆರತಿ ಅಕ್ಷತೆಯ ಹೊತ್ತಾದರೂ ಹೆಂಡತಿ ಮನೆಯಲ್ಲೇ ಇದ್ದಾರೆ. ಗಂಡ ಅಸಮಾಧಾನದಿಂದ ಕೇಳಿದರು. “ನೀನು ಉತ್ಸವಕ್ಕೆ ಹೋಗುವುದಿಲ್ಲವೇ?” ‘ಇಲ್ಲ’ ‘ಯಾಕೆ’? ‘ಮಕ್ಕಳನ್ನು ಕಳಿಸಿದ್ದೇನಲ್ಲ’
- id: story-n6
  type: prose
  section: story
  text: “ಅದು ಸರಿ ನೀನೂ ಹೋಗಬೇಕಷ್ಟೆ. ಅವರು ನಮಗೆ ಬಹಳ ಬೇಕಾದವರು ನೀನು ಹೋಗದಿದ್ದರೆ ಬೇಸರಪಡುವುದಿಲ್ಲವೇ?” “ಮನೆಯಲ್ಲಿ ಯಾರಾದರೂ ಇರಬೇಕಲ್ಲ” “ನಾನು ಇರುತ್ತೇನೆ. ನೀನು ಹೋಗಿ ಬಾ.” ಅವರ ಹೆಂಡತಿ ಏನೇನೋ ಸಬೂಬು ಹೇಳಿದರು. ಡಿವಿಜಿ ಅದಕ್ಕೆ ಉತ್ತರ ಕೊಡುತ್ತಲೇ ಹೋದರು. ನಿಜವಾದ ಕಾರಣ ಕಡೆಗೆ ಹೊರಬರಲೇಬೇಕಾಯಿತು. “ನಾನು ಹೇಳಬಾರದೆಂದಿದ್ದೆ. ನೀವು ಪಟ್ಟುಹಿಡಿದು ನನ್ನ ಬಾಯಿ ಬಿಡಿಸುತ್ತಿದ್ದೀರಿ. ನನ್ನ ಹತ್ತಿರ ಇರುವುದು ಇದೊಂದೇ ಸೀರೆ. ಇದೂ ಒಂದೆರಡು ಕಡೆ ಹರಿದಿದೆ. ನಾನು ಈ ಬಟ್ಟೆಯಲ್ಲಿ ಹೊರಗೆ ಕಾಣಿಸಿಕೊಂಡರೆ ಜನ ನಿಮ್ಮನ್ನು ಕುರಿತು ಆಡಿಕೊಳ್ಳುವುದಿಲ್ಲವೇ? ಬಂಧುಗಳ ಮನೆಗೆ ಹೋಗಿಬರುವುದು ಹೇಗೆ ನನಗೆ ಕರ್ತವ್ಯವೋ ಹಾಗೇ ನಿಮ್ಮ ಮರ್ಯಾದೆಗೆ ಊನಬಾರದಂತೆ ನಡೆದುಕೊಳ್ಳುವುದೂ ನನಗೆ ಕರ್ತವ್ಯವೇ ಅಲ್ಲವೇ?” ಡಿವಿಜಿ ಅವರು ಆಧುನಿಕ ಕನ್ನಡ ಸಾಹಿತ್ಯದ ದಿಗ್ಗಜರಲ್ಲಿ ಒಬ್ಬರು. ಕನ್ನಡ ಸಾರಸ್ವತ ಲೋಕದ ಭೀಷ್ಮ ಎಂದು ಕರೆಸಿಕೊಂಡವರು. ಅವರದ್ದು ಹೋಲಿಕೆ ಇಲ್ಲದ ಅಪೂರ್ವ ವ್ಯಕ್ತಿತ್ವ. ಇತರ ಸಾಹಿತಿಗಳಂತೆ ಅವರು ಸಾಹಿತಿ ಮಾತ್ರವಾಗಿರಲಿಲ್ಲ. ಹೆಸರಾಂತ ಪತ್ರಕರ್ತರಾಗಿದ್ದರು. ಹಿರಿಯ ವೇದಾಂತಿಯಾಗಿದ್ದರು. ರಾಜ್ಯಶಾಸ್ತ್ರದಲ್ಲಿ ಆಳವಾದ ತಿಳಿವಳಿಕೆಯುಳ್ಳವರಾಗಿದ್ದರು. ಸಾರ್ವಜನಿಕ ಜೀವನಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಎಲ್ಲ ವಿಚಾರಗಳ ಮಂಥನಕ್ಕಾಗಿ ಗೋಖಲೆ ಸಾರ್ವಜನಿಕ ಸಂಸ್ಥೆಯಂಥ ಪ್ರಸಿದ್ಧ ಸಂಸ್ಥೆಯನ್ನು ಕಟ್ಟಿದ ಸಾಹಿತಿ ಬೇರೆ ಯಾರಿದ್ದಾರೆ? ಅವರನ್ನು ‘ಮಹಾ
    ಧೀಮಂತ’ ಎಂಬ ಮಾತಿನಿಂದ ವರ್ಣಿಸುವುದು ಸರಿಯಾದೀತೇನೋ. ಅವರ ವ್ಯಕ್ತಿತ್ವವನ್ನು ಅವರು ಬರೆದ ಕವಿತೆಗಳ ಸಾಲುಗಳು ಬಹಳ ಸೊಗಸಾಗಿ ವರ್ಣಿಸುತ್ತವೆ. ಈ ಸಾಲುಗಳನ್ನು ಗಮನಿಸಿ.
- id: story-n7
  type: prose
  section: story
  text: ವನಸುಮದೊಲೆನ್ನ ಜೀ ವನವು ವಿಕಸಿಸುವಂತೆ ಮನವನನುಗೊಳಿಸು ಗುರುವೇ - ಹೇ ದೇವ || ಕಾನನದಿ ಮಲ್ಲಿಗೆಯು ಮೌನದಿಂ ಬಿರಿದು ನಿಜ ಸೌರಭವ ಸೂಸಿ ನಲವಿಂ ತಾನೆಲೆಯ ಪಿಂತಿರ್ದು ದೀನತೆಯ ತೋರಿ ಅಭಿ ಮಾನವನು ತೊರೆದು ಕೃತಕೃತ್ಯತೆಯ ಪಡೆವಂತೆ
- id: story-n8
  type: prose
  section: story
  text: ಇಳೆಯಿಂದ ಮೊಳಕೆ ಒಗೆವಂದು ತಮಟೆಗಳಿಲ್ಲ ಫಲ ಮಾಗುವಂದು ತುತ್ತೂರಿ ದನಿಯಿಲ್ಲ ಬೆಳಕೀವ ಸೂರ್ಯಚಂದ್ರರದೊಂದು ಸದ್ದಿಲ್ಲ ಹೊಲಿ ನಿನ್ನ ತುಟಿಗಳನು - ಮಂಕುತಿಮ್ಮ ಹುಲ್ಲಾಗು ಬೆಟ್ಟದಡಿ ಮನೆಗೆ ಮಲ್ಲಿಗೆಯಾಗು ಕಲ್ಲಾಗು ಕಷ್ಟಗಳ ಮಳೆಯ ವಿಧಿ ಸುರಿಯೆ ಬೆಲ್ಲ ಸಕ್ಕರೆಯಾಗು ದೀನ ದುರ್ಬಲರಿಂಗೆ ಎಲ್ಲರೊಳಗೊಂದಾಗು ಮಂಕುತಿಮ್ಮ.
- id: author-1
  type: prose
  section: author
  text: ಡಾ. ಎನ್.ಎಸ್. ಲಕ್ಷ್ಮೀನಾರಾಯಣ ಭಟ್ಟ ಅವರು29. 10. 1936ರಲ್ಲಿ ಶಿವಮೊಗ್ಗದಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಶಿವರಾಮ ಭಟ್ಟ, ತಾಯಿ ಮೂಕಾಂಬಿಕೆ. ಬೆಂಗಳೂರು ವಿಶ್ವವಿದ್ಯಾನಿಲಯದ ಕನ್ನಡ ಅಧ್ಯಯನ ಕೇಂದ್ರದಲ್ಲಿ ಪ್ರಾಧ್ಯಾಪಕರಾಗಿ, ನಿರ್ದೇಶಕರಾಗಿ, ಆಟ್ರ್ಸ್ ಫ್ಯಾಕಲ್ಟಿಯ ಡೀನ್ ಆಗಿ ದುಡಿದಿದ್ದಾರೆ. ಇವರು ಶ್ರೇಷ್ಠ ಸಾಹಿತಿ, ಪ್ರೌಢ ವಿಮರ್ಶಕ, ಜನಪ್ರಿಯ ಭಾವಗೀತಕಾರ, ಸಮರ್ಥ ಅನುವಾದಕ, ವಿದ್ವಾಂಸ ಮತ್ತು ವಾಗ್ಮಿ. ಇವರ ಕವನ ಸಂಕಲನಗಳುವೃತ್ತ, ಚಿತ್ರಕೂಟ, ಸುಳಿ.ಇವರ ಪ್ರಸಿದ್ಧ ಧ್ವನಿ ಸುರುಳಿಗಳುದೀಪಿಕಾ, ಭಾವಸಂಗಮ, ಬಂದೇ ಬರತಾವ ಕಾಲ, ಬಾರೋ ವಸಂತ, ಅಭಿನಂದನ, ಭಾವೋತ್ಸವ, ಪ್ರೇಮಧಾರೆ.ಮಕ್ಕಳ ಧ್ವನಿ ಸುರುಳಿಗಳುನಂದನ, ಕಿನ್ನರಿ, ನವಿಲುಗರಿ, ಕಿಶೋರಿಮುಂತಾದವು. ಹತ್ತಾರು ಸಾಹಿತ್ಯ ಸಾಧಕರ ಜೀವನ ಘಟನೆಗಳ ಬಗೆಗೆ ಬೆಳಕು ಚೆಲ್ಲುವ ಸಾಹಿತ್ಯ ರತ್ನಸಂಪುಟಕೃತಿಯನ್ನು ರಚಿಸಿದ್ದಾರೆ. 2000ದಲ್ಲಿ ಹೂಸ್ಟನ್ನಿನಲ್ಲಿ ನಡೆದ ಪ್ರಥಮ ಅಮೆರಿಕಾ ವಿಶ್ವ ಕನ್ನಡ ಸಮ್ಮೇಳನದ ಕವಿಗೋಷ್ಠಿಯ ಅಧ್ಯಕ್ಷತೆ ವಹಿಸಿದ್ದರು.ರಾಜ್ಯ ಸಾಹಿತ್ಯ ಅಕಾಡೆಮಿ ಪ್ರಶಸ್ತಿ, ಶಿವರಾಮ ಕಾರಂತ ಪ್ರಶಸ್ತಿ, ರಾಜ್ಯೋತ್ಸವ ಪ್ರಶಸ್ತಿ, ಮಾಸ್ತಿ ಪ್ರಶಸ್ತಿ, ಆಳ್ವಾಸ್ ನುಡಿಸಿರಿ ಪ್ರಶಸ್ತಿ, ಆರ್ಯಭಟ ಪ್ರಶಸ್ತಿಇವೆಲ್ಲವೂ ಇವರ ಸಾಹಿತ್ಯ ಸೇವೆಗೆ ಸಂದಿವೆ. ಡಾ. ಎನ್. ಎಸ್. ಲಕ್ಷ್ಮೀನಾರಾಯಣ ಭಟ್ಟ ಅವರ ಸಾಹಿತ್ಯ ರತ್ನ ಸಂಪುಟಕೃತಿಯಿಂದ ಪ್ರಸ್ತುತ ಗದ್ಯ ಭಾಗವನ್ನು ಆಯ್ದು ಸಂಪಾದಿಸಿ ನಿಗದಿಪಡಿಸಿದೆ.
- id: ashaya-1
  type: prose
  section: ashaya
  text: ಭಾವ ಕನ್ನಡ ನಾಡು ರಸ ಋಷಿಗಳ ಬೀಡು. ಸಾಧು ಸತ್ಪುರುಷರ ನೆಲೆವೀಡು. ಕನ್ನಡ ನಾಡಿನಲ್ಲಿ ಹಲವಾರು ಸತ್ಪುರುಷರು ಜನಿಸಿ, ತ್ಯಾಗಜೀವನ ನಡೆಸಿ, ಇತರರಿಗೆ ಆದರ್ಶಪ್ರಾಯರಾಗಿದ್ದಾರೆ. ಇಂತಹ ಋಷಿಪ್ರಾಯರಾದವರಲ್ಲಿ ಡಿವಿಜಿ ಅವರೂ ಒಬ್ಬರು. ಸುಸಂಸ್ಕøತ ವಿದ್ಯಾವಂತರಾದ ಡಿವಿಜಿ ಅವರು ಸುಮಾರು 66 ಕೃತಿಗಳನ್ನು ಎಂದರೆ ಸುಮಾರು 8000 ಪುಟಗಳ ಸಾಹಿತ್ಯವನ್ನು 1500 ಪುಟಗಳ ಬಿಡಿ ಲೇಖನಗಳನ್ನು ಕನ್ನಡ ಸಾಹಿತ್ಯಕ್ಕೆ ನೀಡಿದ ಸಿರಿವಂತ ಸಾಹಿತಿ. ಲೇಖಕ, ಪತ್ರಕರ್ತ, ಸಂಪಾದಕ, ಸಾಹಿತಿ ಮತ್ತು ರಾಜಕಾರಣಿಯಾಗಿ ಎಲ್ಲದಕ್ಕೂ ಮಿಗಿಲಾಗಿ ಲೌಕಿಕ ಆಸೆ ಆಮಿಷಗಳಿಗೆ ಒಳಗಾಗದೇ ಮೇರು ವ್ಯಕ್ತಿತ್ವದ ಆದರ್ಶ ವ್ಯಕ್ತಿಯಾಗಿ ಬಾಳಿ ಬದುಕಿದವರು ಡಾ. ಡಿ.ವಿ.ಗುಂಡಪ್ಪ ಅವರು. ತನಗಾಗಿ ಆಸ್ತಿ, ಹಣ ಮುಂತಾದುವನ್ನು ಗಳಿಸದೆ ಸದಾ ಸಮಾಜಮುಖಿಯಾಗಿ, ಆದರ್ಶ ರಾಷ್ಟ್ರ ನಿರ್ಮಾಣಕ್ಕಾಗಿ ದಣಿಯದೇ ದುಡಿದವರು ಡಿವಿಜಿ. ಅವರ ಸಾರ್ಥಕ ಬದುಕು, ಆದರ್ಶ ಜೀವನ ನಮ್ಮೆಲ್ಲರ ಬದುಕಿನ ಸೂತ್ರವಾಗಲಿ ಎಂಬುದೇ ಪಠ್ಯದ ಆಶಯ. * * *
