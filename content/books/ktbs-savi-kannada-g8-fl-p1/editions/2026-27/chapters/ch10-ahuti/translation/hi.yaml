  exercise-A: अ. निम्नलिखित प्रश्नों के उत्तर दीजिए।
story-n1: मैं एम.ए. पास कर चुका था। माता-पिता मेरे लिए लड़की ढूँढ रहे थे। आखिर एक लड़की तय हुई। वे बहुत गरीब थे। मैं अमीरों का दामाद बनना चाहता था ताकि इंग्लैंड जा सकूँ।
story-d8: अण्णा, तुम एम.ए. हो — मुँह से ऐसे शब्द? खुद को बेचना चाहते हो?
author-1: कोडगिन गौरम्मा कन्नड़ की प्रथम कथाकार मानी जाती हैं। 3 मार्च 1912 को मडिकेरी में जन्म।
ex-a-q4: दहेज के पिशाच ने किसे बलि लिया?
