  exercise-A: A. Answer the following questions.
story-n1: I had passed my M.A. My parents were looking for a bride for me. At last a girl was settled. Her house was in a village twelve miles from ours. She had parents, but they were very poor. I badly wanted to become the son-in-law of rich people. I strongly wished to go to England and become a barrister. Going to England needed money. My father could not afford to spend so much on me. If I became a rich man's son-in-law I could go to England easily. So I had no mind to marry that poor girl.
story-d8: Brother, you are an M.A. graduate — can such words come from your mouth? Why do you want to sell yourself?
author-1: Kodagina Gouramma is known as the first woman short-story writer in Kannada. Born in Madikeri on 3 March 1912. During the freedom movement she hosted Gandhi in Coorg and donated her jewellery. She wrote stories as Mrs T.G. Krishna. Collections include Kambani, Chiguru and Gourammana Kathegalu.
ex-a-q4: Whom has the demon of dowry sacrificed?
