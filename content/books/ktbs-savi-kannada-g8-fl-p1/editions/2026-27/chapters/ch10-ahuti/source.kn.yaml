  exercise-A: ಅ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ.
segments:
- id: story-n1
  type: prose
  section: story
  text: ನಾನು ಎಂ.ಎ. ಪಾಸಾಗಿದ್ದೆ. ನನ್ನ ತಂದೆತಾಯಿಯವರು ನನಗೆ ಮದುವೆ ಮಾಡಬೇಕೆಂದು ಹೆಣ್ಣು ಹುಡುಕುತ್ತಿದ್ದರು. ಅಂತೂ ಕಡೆಗೆ ಹುಡುಗಿಯೂ ನಿಶ್ಚಯವಾದಳು. ನಮ್ಮ ಮನೆಯಿಂದ ಹನ್ನೆರಡು ಮೈಲಿ ದೂರದಲ್ಲಿದ್ದ ಒಂದು ಹಳ್ಳಿಯಲ್ಲಿ ಅವಳ ಮನೆ. ಅವಳಿಗೂ ತಂದೆ ತಾಯಿ ಇದ್ದರು. ಆದರೆ ಅವರು ಬಹಳ ಬಡವರಂತೆ. ನನಗೇನೋ ಐಶ್ವರ್ಯವಂತರ ಅಳಿಯನಾಗಬೇಕೆಂದು ಬಹಳ ಆಸೆಯಿತ್ತು. ಇಂಗ್ಲೆಂಡಿಗೆ ಹೋಗಿ ಬ್ಯಾರಿಸ್ಟರನಾಗಬೇಕೆಂದು ಬಲವಾದ ಇಚ್ಛೆ. ಇಂಗ್ಲೆಂಡಿಗೆ ಹೋಗಬೇಕಾದರೆ ಹಣಬೇಕು. ನನಗಾಗಿ ತುಂಬಾ ಹಣ ಖರ್ಚು ಮಾಡುವಷ್ಟು ಅನುಕೂಲವು ನನ್ನ ತಂದೆಗಿರಲಿಲ್ಲ. ಐಶ್ವರ್ಯವಂತರ ಅಳಿಯನಾದರೆ ನಾನು ಇಂಗ್ಲೆಂಡಿಗೆ ಸುಲಭವಾಗಿ ಹೋಗಬಹುದಾಗಿತ್ತು. ಆದುದರಿಂದ ಆ ಬಡವರ ಹುಡುಗಿಯನ್ನು ಮದುವೆಯಾಗಲು ನನಗೆ ಮನಸ್ಸಿರಲಿಲ್ಲ.
- id: story-n2
  type: prose
  section: story
  text: ನನ್ನ ತಂಗಿ ವಿಜಯ. ಆಕೆಯನ್ನು ನಾನು ‘ವಿ’ ಎಂದು ಕರೆಯುತ್ತಿದ್ದೆ.
- id: story-d1
  type: dialogue
  section: story
  speaker: ವಿಜಯ
  text: ಅಣ್ಣಾ ‘ಆ ಹುಡುಗಿಯನ್ನು ಮದುವೆಯಾಗಲು ಒಪ್ಪಿಗೆಯೇ ಎಂದು ಅಪ್ಪ ಕೇಳಿದರೆ ಏನು ಎನ್ನುತ್ತಿ’
- id: story-d2
  type: dialogue
  section: story
  speaker: ನಾನು
  text: ನಾನು ಅವಳನ್ನು ನೋಡಿಯೇ ಇಲ್ಲ, ನಾನು ಏನೆಂದು ಉತ್ತರ ಕೊಡಲಿ?
- id: story-d3
  type: dialogue
  section: story
  speaker: ವಿಜಯ
  text: ಅಣ್ಣ ನಾನು ಅವಳನ್ನು ನೋಡಿರುವೆ. ಅವಳು ಎಲ್ಲಾ ತರದಲ್ಲೂ ನಿನಗೆ ಯೋಗ್ಯಳಾಗಿದ್ದಾಳೆ. ಓದು ಬರೆಹ ಗೊತ್ತಿದೆ. ನೋಡುವುದಕ್ಕೆ ಅತಿ ಚೆಲುವೆ.
- id: story-d4
  type: dialogue
  section: story
  speaker: ನಾನು
  text: ವರದಕ್ಷಿಣೆ ಎಷ್ಟು ಕೊಡುತ್ತಾರೆ?
- id: story-d5
  type: dialogue
  section: story
  speaker: ವಿಜಯ
  text: ಅಣ್ಣ, ಅಪ್ಪನಿಗೆ ವರದಕ್ಷಿಣೆಯನ್ನು ತೆಗೆದುಕೊಳ್ಳಲಿಕ್ಕೆ ಇಷ್ಟ ಇಲ್ಲ. ಅವರು ಬಹಳ ಬಡವರು ಆದರೆ ಹುಡುಗಿ ರತಿದೇವಿಯಂತೆ ಇದ್ದಾಳೆ. ಅವರೇ ಐನೂರು ರೂಪಾಯಿ ಕೊಡುವೆವೆಂದು ಹೇಳಿದ್ದಾರೆ. ಅದನ್ನು ತೆಗೆದು ಕೊಳ್ಳುವುದಕ್ಕೂ ಅಪ್ಪನಿಗೆ ಒಪ್ಪಿಗೆ ಇಲ್ಲ.
- id: story-d6
  type: dialogue
  section: story
  speaker: ನಾನು
  text: ವಿ, ನನಗೆ ಲಂಡನ್ನಿಗೆ ಹೋಗಿ ಲಾ ಕಲಿಯಬೇಕೆಂದು ಇಚ್ಛೆಯಿದೆ. ಅದಕ್ಕಾಗುವ ಖರ್ಚನ್ನು ಕೊಡುವುದಾದರೆ ಮಾತ್ರ ನಾನು ಆ ಹುಡುಗಿಯನ್ನು ಮದುವೆಯಾಗುತ್ತೇನೆ. ಇಲ್ಲದಿದ್ದರೆ ಇಲ್ಲ.
- id: story-d7
  type: dialogue
  section: story
  speaker: ವಿಜಯ
  text: ಅಣ್ಣ, ನೀನು ಎಂ.ಎ. ಪದವೀಧರ, ನಿನ್ನ ಬಾಯಿಂದ ಇಂತಹ ಮಾತು ಹೊರಡಬಹುದೇ? ನಿನ್ನನ್ನು ನೀನು ಮಾರಿಕೊಳ್ಳ ಬಯಸುವಿಯೇಕೆ?
- id: story-n3
  type: prose
  section: story
  text: ಎಂದು ಸ್ವಲ್ಪ ಕೋಪದಿಂದಲೇ ಹೇಳಿ ಒಳಗೆ ಹೊರಟುಹೋದಳು.
- id: story-n4
  type: prose
  section: story
  text: ಜಪಮಾಡಿ ಹೊರಗೆ ಬಂದು ಕುಳಿತಿದ್ದೆ. ನನ್ನ ತಂದೆಯೂ ಜಪ ತೀರಿಸಿ ಹೊರಗೆ ಬಂದರು.
- id: story-d8
  type: dialogue
  section: story
  speaker: ತಂದೆ
  text: ನೀನು ವಿಜಯಳ ಹತ್ತಿರ ಮುಂದೆ ಓದಿನ ಖರ್ಚಿಗೆ ಹಣ ಕೊಟ್ಟರೆ ಮದುವೆಯಾಗುತ್ತೇನೆ ಎಂದೆಯಂತೆ. ಅವರು ಬಡವರು. ಆರೇಳು ಹೆಣ್ಣು ಮಕ್ಕಳು ಇದ್ದಾರೆ. ಎಲ್ಲಿಂದ ತಾನೆ ಹಣ ತರಬಲ್ಲರು? ಹುಡುಗಿ ಲಕ್ಷಣವಾಗಿದ್ದಾಳೆ. ನೀನು ದೊಡ್ಡವರ ಅಳಿಯನಾಗಿ ಲಂಡನ್ನಿಗೆ ಹೋಗುವುದಕ್ಕೆ ನನಗೆ ಒಪ್ಪಿಗೆ ಇಲ್ಲ. ಈ ಹುಡುಗಿಯನ್ನು ಮದುವೆಯಾದರೆ ಇಲ್ಲೇ ಲಾ ಓದುವ ಖರ್ಚನ್ನು ಹೇಗಾದರು ಮಾಡಿ ನಾನು ಕೊಡುತ್ತೇನೆ.
- id: story-n5
  type: prose
  section: story
  text: ಎಂದು ಹೇಳಿ ಒಳಗೆ ಹೊರಟು ಹೋದರು.
- id: story-n6
  type: prose
  section: story
  text: ಅಂದಿನ ರಾತ್ರಿ ಎಲ್ಲರೂ ಮಲಗಿದ ಮೇಲೆ ನಾನು ಹೊರಗೆ ಹೊರಟೆ. ನನ್ನ ಮನಸ್ಸು ಸಿಟ್ಟಿನಿಂದ ಚಂಚಲವಾಗಿತ್ತು. ಆ ಹುಡುಗಿಯನ್ನು ಮದುವೆಯಾಗುವ ಇಚ್ಛೆ ನನಗೆ ಸ್ವಲ್ಪವೂ ಇರಲಿಲ್ಲ. ತಂದೆಯಿದಿರು ನಿಂತು ಹಾಗೆ ಹೇಳುವ ಧೈರ್ಯ ನನಗಿರಲಿಲ್ಲ. ಆದುದರಿಂದ ಅಂದಿನ ರಾತ್ರಿಯೇ ಮನೆ ಬಿಟ್ಟುಹೊರಟೆ. ನಮ್ಮ ಹಳ್ಳಿಯಿಂದ ರೈಲ್ವೆ ನಿಲ್ದಾಣಕ್ಕೆ ಬಂದು ರೈಲು ಹೊರಡಲು ಹತ್ತು ನಿಮಿಷವಿದ್ದ ಕಾರಣ ಮದರಾಸಿಗೆ ಒಂದು ಟಿಕೆಟ್ಟನ್ನು ತೆಗೆದುಕೊಂಡು ಒಂದು ಕಂಪಾರ್ಟಮೆಂಟಿನಲ್ಲಿ ಹೋಗಿ ಕುಳಿತೆ. ನಾನು ಕುಳಿತಲ್ಲಿ ಬೇರೆ ಯಾರು ಇರಲಿಲ್ಲ. ಮುಂದೇನು ಗತಿಯೇನೆಂದು ಆಲೋಚಿಸುತ್ತ ಕುಳಿತಿದ್ದಂತೆಯೇ ನಿದ್ರೆ ಬಂದು ಬಿಟ್ಟಿತು. ಏನೋ ಶಬ್ದವಾದಂತಾಗಿ ಕಣ್ಣು ತೆರೆದು ನೋಡಿದೆ. ನನ್ನಿದಿರು ಒಬ್ಬ ಮುದುಕ ಕುಳಿತಿದ್ದನು. ಮುದುಕನಾದರೂ ಹುಡುಗನಂತೆ ಡ್ರೆಸ್ ಮಾಡಿಕೊಂಡಿದ್ದ. ನೋಡಿದ ಕೂಡಲೇ ಮುದುಕನೆಂದು ಗೊತ್ತಾಗುತ್ತಿರಲಿಲ್ಲ. ಅವನು ಹಣವಂತನಾಗಿರಬೇಕೆಂದು ಅವನ ವೇಷಭೂಷಣಗಳಿಂದ ವ್ಯಕ್ತವಾಗುತ್ತಿತ್ತು. ಅವನು ನನ್ನನ್ನೇ ನೋಡುತ್ತಾ ಕುಳಿತಿದ್ದರೂ ಮಾತನಾಡುವಂತೆ ತೋರಲಿಲ್ಲ. ನಾನೇ ಮಾತನಾಡಬೇಕಾಗಿ ಬಂತು.
- id: story-d9
  type: dialogue
  section: story
  speaker: ನಾನು
  text: ಸ್ವಾಮಿ ದಯಮಾಡಿ ಗಂಟೆ ಎಷ್ಟೆಂದು ಹೇಳುವಿರಾ?
- id: story-d10
  type: dialogue
  section: story
  speaker: ಮುದುಕ
  text: ಎರಡು ಗಂಟೆಗೆ ಹತ್ತು ನಿಮಿಷವಿದೆ
- id: story-n7
  type: prose
  section: story
  text: ಆ ಮುದುಕ ತುಂಬಾ ಮಾತುಗಾರ. ಅವನು ಮಾತಿಗೆ ಪ್ರಾರಂಭಿಸಿದ. ಅಂತೂ ಮದರಾಸಿಗೆ ತಲುಪುವಷ್ಟರಲ್ಲೇ ನಾವಿಬ್ಬರೂ ಸ್ನೇಹಿತರಾಗಿಬಿಟ್ಟೆವು.
- id: story-n8
  type: prose
  section: story
  text: ಆ ಮುದುಕ ಒಬ್ಬ ರತ್ನದ ವ್ಯಾಪಾರಿ. ನಾನು ಯಾರೆಂದು ಕೇಳಿದ್ದಕ್ಕೆ - ನಾನೊಬ್ಬ ಬಡವರ ಮಗನೆಂದೂ ಎಂ.ಎ. ಪಾಸಾಗಿದೆಯೆಂದೂ ಕೆಲಸ ಹುಡುಕುವ ಸಲುವಾಗಿ ಮದರಾಸಿಗೆ ಹೊರಟಿದ್ದೇನೆಂದೂ ಹೇಳಿದೆ. ಕೆಲಸವೇನು ಸಿಕ್ಕದಿದ್ದರೆ ಬಂದು ತನ್ನನ್ನು ಕಾಣಬೇಕೆಂದು ಹೇಳಿದ. ಅಷ್ಟು ಹೊತ್ತಿಗಾಗಲೇ ಮದರಾಸು ತಲುಪಿದೆವು. ನಾನು ಓದುವಾಗ ವಾಸವಿದ್ದ ವೈ.ಎಂ.ಸಿ.ಎ. ಗೇ ಹೋಗಿ ಅಲ್ಲಿದ್ದ ಸ್ನೇಹಿತರ ಜೊತೆಯಲ್ಲಿ ಉಳಿದೆ.
- id: story-n9
  type: prose
  section: story
  text: ಮರುದಿನದಿಂದ ಕೆಲಸ ಹುಡುಕಲು ಪ್ರಾರಂಭಿಸಿ ಎಲ್ಲಿಯೂ ಕೆಲಸ ಸಿಗದೇ ಕೈಯಲ್ಲಿದ್ದ ಕೆಲವು ರೂಪಾಯಿಗಳು ಖರ್ಚಾಗಿದ್ದವು. ಊಟಕ್ಕೆ ತೊಂದರೆಯಾದಾಗ ಬೇರೇನೂ ದಿಕ್ಕು ತೋಚದೇ, ರೈಲಿನಲ್ಲಿ ಸ್ನೇಹಿತನಾದ ಆ ಮುದುಕನ ಮನೆಗೆ ಹೋದೆ. ದೇವರ ದಯೆಯಿಂದ ಅವರು ಮನೆಯಲ್ಲಿದ್ದರು. ಮಾತುಕತೆಯ ಬಳಿಕ ಕೆಲಸ ಸಿಗಲಿಲ್ಲವೆಂದವನಿಗೆ ಗೊತ್ತಾಯಿತು. ಅವನಿಗೊಬ್ಬ ಮಗಳೂ ದೂರ ಸಂಬಂಧದ ಸೊಸೆಯೂ ಇದ್ದರು. ಅವರಿಬ್ಬರಿಗೂ ಪಾಠ ಹೇಳಿಕೊಡಲು ಆಗುತ್ತದೆಯೇ ಎಂದು ನನ್ನನ್ನು ಕೇಳಿದ. ಏನೂ ಕೆಲಸವಿಲ್ಲದ ನನಗೆ ಅದೇ ಬಲು ದೊಡ್ಡ ಕೆಲಸವಾಯಿತು. ಮರುದಿನದಿಂದ ಪಾಠ ಹೇಳಲು ಉಪಕ್ರಮಿಸಿದೆ. ಮಗಳ ಹೆಸರು ಸೀತೆ, ಶಾಂತಿ ಎಂದು ಸೊಸೆಯ ಹೆಸರು.
- id: story-n10
  type: prose
  section: story
  text: ನಾನು ಪಾಠ ಹೇಳಲು ಮೊದಲು ಮಾಡಿ ಆರು ತಿಂಗಳುಗಳು ಸಂದಿದ್ದವು. ಹುಡುಗಿಯರಿಬ್ಬರೂ ಚೆನ್ನಾಗಿಯೇ ಪಾಠ ಕಲಿಯುತ್ತಿದ್ದರು. ಆದರೆ, ಶಾಂತಿಯಷ್ಟು ಚುರುಕಾಗಿ ಸೀತೆ ಕಲಿಯುತ್ತಿರಲಿಲ್ಲ. ಶಾಂತಿಯ ಸೌಂದರ್ಯ, ಸೌಂದರ್ಯವನ್ನಾವರಿಸಿದ್ದ ದುಃಖ, ವಿದ್ಯೆಗಳಲ್ಲಿ ಅವಳಿಗಿದ್ದ ಅಭಿರುಚಿ ಮಿತವಾದ ಮಾತು ಇವೆಲ್ಲವೂ ಸೇರಿ ನನ್ನ ಮನಸ್ಸನ್ನು ಅವಳೆಡೆಗೆ ಎಳೆಯತೊಡಗಿದವು. ಅವಳ ತಂದೆ ತಾಯಿಯರು ಅಷ್ಟೇನೂ ಅನುಕೂಲಸ್ಥರಾಗಿರಲಿಲ್ಲ. ಮಗಳ ಮದುವೆಗೆ ಬಹಳ ಪ್ರಯತ್ನ ಮಾಡುತ್ತಿದ್ದರು. ಬಡತನದ ದೆಸೆಯಿಂದ ವರದಕ್ಷಿಣೆ ಕೊಡಲಾರದೆ ಇನ್ನೂ ಮದುವೆಯಾಗಿರಲಿಲ್ಲ. ನನಗಂತು ಯಾವಾಗಲೂ ಶಾಂತಿಯ ಜಪವೇ ಆಯಿತು. ಮದುವೆಯಾದರೆ ಅವಳನ್ನು ಮದುವೆಯಾಗಬೇಕೆನಿಸಿತು; ಅವಳನ್ನು ಮದುವೆಯಾದರೆ ಲಂಡನ್ನಿಗೆ ಹೋಗಲಾಗುತ್ತಿರಲಿಲ್ಲ. ಆದುದರಿಂದ ಅವಳನ್ನು ಮರೆಯಲು ಪ್ರಯತ್ನಿಸತೊಡಗಿದೆ. ಎಷ್ಟೆಷ್ಟೂ ಪ್ರಯತ್ನಿಸಿದರೂ ಅವಳ ಸದ್ಗುಣಗಳು ನನ್ನ ಮನಸ್ಸನ್ನು ಅವಳೆಡೆಗೆ ಎಳೆಯತೊಡಗಿದವು. ನಾನು ಸೀತೆಯನ್ನು ಮದುವೆಯಾಗಬಹುದಿತ್ತು. ಎಷ್ಟೋ ಸಾರಿ ಅವಳ ತಂದೆ ನನ್ನನ್ನು ಹಾಸ್ಯಕ್ಕಾಗಿ ‘ಅಳಿಯ’ ಎಂದು ಕರೆಯುತ್ತಿದ್ದರು. ನಾನು ಅವರ ಅಳಿಯನಾದರೆ ಲಂಡನ್ನಿಗೆ ಹೋಗಬಹುದಿತ್ತು. ಆದರೆ ಎಂದಿನಿಂದ ಶಾಂತಿಯನ್ನು ಪ್ರೀತಿಸತೊಡಗಿದೆನೋ ಅಂದಿನಿಂದ ಹಣಕ್ಕಾಗಿ ಪ್ರೇಮವನ್ನು ಬಲಿಕೊಡಬಾರದೆಂದು ನನ್ನ ಮನಸ್ಸು ಹೇಳುತ್ತಿತ್ತು.
- id: story-n11
  type: prose
  section: story
  text: ಒಂಬತ್ತು ಗಂಟೆಯಾಗಿತ್ತು ನಾನು ಪಾಠದ ಕೋಣೆಯಲ್ಲಿ ಕುಳಿತು ನನ್ನ ಶಿಷ್ಯೆಯರಿಬ್ಬರನ್ನು ಇದಿರು ನೋಡುತ್ತಿದ್ದೆ. ಬಾಗಿಲ ತೆರೆದ ಶಬ್ದವಾಯಿತು. ತೆರೆದ ಬಾಗಿಲಿನಿಂದ ಒಳಗೆ ಹೊಕ್ಕಳು ಸೀತೆ. ಶಾಂತಿಯ ಸುಳಿವಿಲ್ಲ. ಅವಳನ್ನು ಕಾಣದೆ ಮನಸ್ಸಿಗೆ ವಿಷಾದವಾಯಿತು. ಆದರೆ ಕೇಳುವ ಮೊದಲೇ ಅವಳೇ ಹೇಳಿದಳು.
- id: story-d11
  type: dialogue
  section: story
  speaker: ಸೀತೆ
  text: ನೋಡಿ ಮೇಷ್ಟ್ರೆ ನಿನ್ನೆ ರಾತ್ರಿಯೇ ಶಾಂತಿಯ ತಂದೆ ಬಂದು ಅವಳನ್ನು ಊರಿಗೆ ಕರೆದುಕೊಂಡು ಹೋದರು. ಯಾಕೆಂತ ಗೊತ್ತಿದೆಯೇ? ಮದುವೆಗೆ?
- id: story-n12
  type: prose
  section: story
  text: ಆಗ ನನಗೆ ತಿಳಿಯಿತು. ಶಾಂತಿ ಇಲ್ಲದೆ ನಾನು ಬದುಕಲಾರೆನೆಂದು. ಮೊದಲೇ ಅವಳ ತಂದೆತಾಯಿಯರನ್ನು ಕೇಳದಿದ್ದುದಕ್ಕಾಗಿ ನನ್ನನ್ನು ನಾನೆ ಹಳಿದುಕೊಂಡೆ. ಹಣದಾಸೆಯಿಂದ ನನ್ನ ಜೀವನವನ್ನು ನಾನೇ ಮಣ್ಣುಗೂಡಿಸಿಕೊಂಡ ಮೇಲೆ ಗೊತ್ತಾಯಿತು. ಶಾಂತಿ ವಿಹೀನ ಪ್ರಪಂಚದಲ್ಲಿ ಜೀವಿಸುವುದು ಅಸಾಧ್ಯವೆಂದು. ಶಾಂತಿಯನ್ನು ಕಳೆದುಕೊಂಡು ಅಂದಿನ ದಿನವನ್ನೆಲ್ಲ ಅಶಾಂತಿಯಲ್ಲಿ ಕಳೆದನು. ಮರುದಿನ ಪಾಠದ ಹೊತ್ತಿನಲ್ಲಿ ಸೀತೆ ನನಗೊಂದು ಕಾಗದ ತೋರಿಸಿದಳು. ಶಾಂತಿಯ ಕಾಗದವನ್ನು ಓದಿದೆ. ವರದಕ್ಷಿಣೆಯನ್ನು ಕೊಡಲಾರದ ತಂದೆತಾಯಿಯರು ನಾಲ್ಕು ಜನ ಮೊಮ್ಮಕ್ಕಳಿರುವ ಮುದುಕನ್ನು ಮದುವೆಯಾಗಲಾರದೆ ಆತ್ಮಹತ್ಯೆಮಾಡಿಕೊಂಡದ್ದನ್ನು ಓದಿ, ಶಾಂತಿಯಂತಹ ಸ್ವರ್ಣಪುತ್ಥಳಿಯನ್ನು ಕೊಡುವುದೂ ಅಲ್ಲದೆ ಅವಳೊಡನೆ ವರದಕ್ಷಿಣೆಯನ್ನು ಕೊಡಬೇಕೆಂದು ಕೇಳಿದ ನೀಚನನ್ನು ಶಪಿಸಿದೆ. ಹಿಂದೊಂದು ಬಾರಿ ನಾನು ಬಡವರ ಹುಡುಗಿಯನ್ನು ಮದುವೆಯಾಗಲು ತಿರಸ್ಕರಿಸಿದ್ದುದು ದುಃಖದ ಭರದಲ್ಲಿ ಮರೆತೇ ಹೋಗಿತ್ತು. ವಿಧಿಯನ್ನು ದೂರುವ ಬದಲು ನಾನೇ ನನ್ನ ದುರಾಶೆಯನ್ನು ಬಿಟ್ಟು ಶಾಂತಿಯನ್ನು ಮದುವೆಯಾಗಿದ್ದರೆ ಆ ಮುದ್ದು ಬಾಲೆ ಈಗ ಸುಖವಾಗಿರುತ್ತಿದ್ದಳು. ನನ್ನ ತಪ್ಪಿಗಾಗಿ ನನ್ನನ್ನು ನಾನೆ ಜರಿದುಕೊಂಡೆ. ವರದಕ್ಷಿಣೆ ಎಂಬ ಪಿಶಾಚಿಯು ಅದೆಷ್ಟು ಸುಕುಮಾರಿಯರನ್ನು ಬಲಿ ತೆಗೆದುಕೊಳ್ಳುವುದೋ ದೇವರೇ ಬಲ್ಲ! ಆದರೆ ನನ್ನ ಶಾಂತಿಯನ್ನು ಅದು ಬಲಿತೆಗೆದುಕೊಂಡ ಮೇಲೆ ನನಗದರ ನಿಜಸ್ವರೂಪ ಗೊತ್ತಾಯಿತು.
- id: story-n13
  type: prose
  section: story
  text: ಅಂದಿನ ರಾತ್ರಿಯೇ ಊರಿಗೆ ಹೊರಟೆ. ಮರುದಿನ ಬೆಳಗಿನ ಹೊತ್ತಿನಲ್ಲಿ ಮನೆಗೆ ತಲುಪಿದೆ. ನಾನು ಹೋಗುವಾಗ ಅಮ್ಮ ಅಂಗಳ ಸಾರಿಸಿ ರಂಗವಲ್ಲಿ ಇಡುತ್ತಿದ್ದಳು. ನನ್ನ ತಂದೆಯೂ ‘ವಿ’ಯೂ ಒಳಗಿದ್ದರು. ಅಮ್ಮನೊಡನೆ ಮಾತನಾಡಿ ಒಳಗೆ ಹೋದೆ. ನಾನು ಅಲ್ಲಿ ನಿಲ್ಲದೆ ನನ್ನ ಕೋಣೆಗೆ ಹೋದೆ. ಅಲ್ಲಿ ವಿಜಯ ಒಂದು ಚಿತ್ರವನ್ನು ನೋಡುತ್ತಾ ನಿಂತಿದ್ದಳು. ನನ್ನನ್ನು ಕಂಡು ಆ ಚಿತ್ರವನ್ನು ಬಚ್ಚಿಟ್ಟಳು. ಆಗವಳು ತಾನು ನೋಡುತ್ತಿದ್ದ ಪೇಪರನ್ನು ನನ್ನೆದುರು ಎಳೆದು ಹೇಳಿದಳು.
- id: story-d12
  type: dialogue
  section: story
  speaker: ವಿಜಯ
  text: ನೋಡುತ್ತಿದ್ದುದು ನೀನು ಕೊಂದ ಹುಡುಗಿಯನ್ನು
- id: story-n14
  type: prose
  section: story
  text: ನನಗೆ ಬಹಳ ಆಶ್ಚರ್ಯವಾಯಿತು. ಪತ್ರಿಕೆಯನ್ನು ಆತುರದಿಂದ ತೆಗೆದು ನೋಡಿದೆ. ಶಾಂತಿಯ ಚಿತ್ರ. - ಅದರ ಕೆಳಗಡೆ ವರದಕ್ಷಿಣೆಗೆ ಆಹುತಿ. ಶಾಂತಿಯೇ ನಾನು ಮೊದಲು ಕೈಬಿಟ್ಟ ಕನ್ಯೆ? ಈಗ . . . . . . ಏನು ಪ್ರಯೋಜನ!
- id: author-1
  type: prose
  section: author
  text: ಕೊಡಗಿನ ಗೌರಮ್ಮನವರು ಕನ್ನಡದ ಪ್ರಥಮ ಕತೆಗಾರ್ತಿ ಎಂದು ಹೆಸರಾಗಿದ್ದಾರೆ. ಇವರು 1912 ಮಾರ್ಚ್ 3ರಂದು ಮಡಿಕೇರಿಯಲ್ಲಿ ಜನಿಸಿದರು. ಸ್ವಾತಂತ್ರ್ಯ ಆಂದೋಲನದ ಸಂದರ್ಭದಲ್ಲಿ ಮಹಾತ್ಮ ಗಾಂಧೀಜಿಯವರು ಕೊಡಗಿನಲ್ಲಿ ಪ್ರವಾಸ ಕೈಗೊಂಡಾಗ ಅವರನ್ನು ತಮ್ಮ ಮನೆಗೆ ಬರಮಾಡಿಕೊಂಡು ತಮ್ಮ ಆಭರಣಗಳನ್ನೆಲ್ಲ ದಾನ ನೀಡಿದರು. ಗೌರಮ್ಮನವರು ಮಿಸೆಸ್ ಟಿ.ಜಿ. ಕೃಷ್ಣ ಎನ್ನುವ ಹೆಸರಿನಲ್ಲಿ ಕತೆಗಳನ್ನು ಬರೆದಿದ್ದಾರೆ. ಕಂಬನಿ, ಚಿಗುರು ಹಾಗೂ ಗೌರಮ್ಮನ ಕತೆಗಳು ಅವರ ಕಥಾ ಸಂಕಲನಗಳು.
- id: ex-a-q1
  type: question
  exercise: A
  text: ರೈಲಿನಲ್ಲಿ ಸಿಕ್ಕಿದ ಮುದುಕನ ಉದ್ಯೋಗವೇನು?
- id: ex-a-q2
  type: question
  exercise: A
  text: ಯುವಕನು ರೈಲಿನಲ್ಲಿ ಸಿಕ್ಕಿದ ಮುದುಕನ ಮನೆಗೆ ಏಕೆ ಬಂದನು?
- id: ex-a-q3
  type: question
  exercise: A
  text: ಮುದುಕನ ಮಗಳು ಮತ್ತು ಸೊಸೆಯ ಹೆಸರೇನು?
