  type: question
  exercise: A
  text: ವರದಕ್ಷಿಣೆಯ ಪಿಶಾಚಿ ಯಾರನ್ನು ಬಲಿ ತೆಗೆದುಕೊಂಡಿದೆ?
- id: ex-a-q5
  type: question
  exercise: A
  text: ಯುವಕನು ಬಡವರ ಹುಡುಗಿಯನ್ನು ಮದುವೆಯಾಗದಿರಲು ಕಾರಣಗಳೇನು?
- id: ex-a-q6
