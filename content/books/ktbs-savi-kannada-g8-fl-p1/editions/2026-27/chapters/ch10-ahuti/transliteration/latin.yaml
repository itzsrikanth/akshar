labels:
  story: kathè
  author: kṛtikārara paricaya
  exercise-A: a. kòṭṭiruva praśnègaḻigè uttarisi.
story-n1: nānu èṃ.è. pāsāgiddè. nanna taṃdètāyiyavaru nanagè maduvè māḍabekèṃdu hèṇṇu huḍukuttiddaru. aṃtū kaḍègè huḍugiyū niścayavādaḻu. namma manèyiṃda hannèraḍu maili dūradallidda òṃdu haḻḻiyalli avaḻa manè. avaḻigū taṃdè tāyi iddaru. ādarè avaru bahaḻa baḍavaraṃtè. nanageno aiśvaryavaṃtara aḻiyanāgabekèṃdu bahaḻa āsèyittu. iṃglèṃḍigè hogi byārisṭaranāgabekèṃdu balavāda icchè. iṃglèṃḍigè hogabekādarè haṇabeku. nanagāgi tuṃbā haṇa kharcu māḍuvaṣṭu anukūlavu nanna taṃdègiralilla. aiśvaryavaṃtara aḻiyanādarè nānu iṃglèṃḍigè sulabhavāgi hogabahudāgittu. ādudariṃda ā baḍavara huḍugiyannu maduvèyāgalu nanagè manassiralilla.
story-n2: nanna taṃgi vijaya. ākèyannu nānu ‘vi’ èṃdu karèyuttiddè.
story-d1: aṇṇā ‘ā huḍugiyannu maduvèyāgalu òppigèye èṃdu appa keḻidarè enu ènnutti’
story-d2: nānu avaḻannu noḍiye illa, nānu enèṃdu uttara kòḍali?
story-d3: aṇṇa nānu avaḻannu noḍiruvè. avaḻu èllā taradallū ninagè yogyaḻāgiddāḻè. odu barèha gòttidè. noḍuvudakkè ati cèluvè.
story-d4: varadakṣiṇè èṣṭu kòḍuttārè?
story-d5: aṇṇa, appanigè varadakṣiṇèyannu tègèdukòḻḻalikkè iṣṭa illa. avaru bahaḻa baḍavaru ādarè huḍugi ratideviyaṃtè iddāḻè. avare ainūru rūpāyi kòḍuvèvèṃdu heḻiddārè. adannu tègèdu kòḻḻuvudakkū appanigè òppigè illa.
story-d6: vi, nanagè laṃḍannigè hogi lā kaliyabekèṃdu icchèyidè. adakkāguva kharcannu kòḍuvudādarè mātra nānu ā huḍugiyannu maduvèyāguttenè. illadiddarè illa.
story-d7: aṇṇa, nīnu èṃ.è. padavīdhara, ninna bāyiṃda iṃtaha mātu hòraḍabahude? ninnannu nīnu mārikòḻḻa bayasuviyekè?
story-n3: èṃdu svalpa kopadiṃdale heḻi òḻagè hòraṭuhodaḻu.
story-n4: japamāḍi hòragè baṃdu kuḻitiddè. nanna taṃdèyū japa tīrisi hòragè baṃdaru.
story-d8: nīnu vijayaḻa hattira muṃdè odina kharcigè haṇa kòṭṭarè maduvèyāguttenè èṃdèyaṃtè. avaru baḍavaru. āreḻu hèṇṇu makkaḻu iddārè. èlliṃda tānè haṇa taraballaru? huḍugi lakṣaṇavāgiddāḻè. nīnu dòḍḍavara aḻiyanāgi laṃḍannigè hoguvudakkè nanagè òppigè illa. ī huḍugiyannu maduvèyādarè ille lā oduva kharcannu hegādaru māḍi nānu kòḍuttenè.
story-n5: èṃdu heḻi òḻagè hòraṭu hodaru.
story-n6: aṃdina rātri èllarū malagida melè nānu hòragè hòraṭè. nanna manassu siṭṭiniṃda caṃcalavāgittu. ā huḍugiyannu maduvèyāguva icchè nanagè svalpavū iralilla. taṃdèyidiru niṃtu hāgè heḻuva dhairya nanagiralilla. ādudariṃda aṃdina rātriye manè biṭṭuhòraṭè. namma haḻḻiyiṃda railvè nildāṇakkè baṃdu railu hòraḍalu hattu nimiṣavidda kāraṇa madarāsigè òṃdu ṭikèṭṭannu tègèdukòṃḍu òṃdu kaṃpārṭamèṃṭinalli hogi kuḻitè. nānu kuḻitalli berè yāru iralilla. muṃdenu gatiyenèṃdu ālocisutta kuḻitiddaṃtèye nidrè baṃdu biṭṭitu. eno śabdavādaṃtāgi kaṇṇu tèrèdu noḍidè. nannidiru òbba muduka kuḻitiddanu. mudukanādarū huḍuganaṃtè ḍrès māḍikòṃḍidda. noḍida kūḍale mudukanèṃdu gòttāguttiralilla. avanu haṇavaṃtanāgirabekèṃdu avana veṣabhūṣaṇagaḻiṃda vyaktavāguttittu. avanu nannanne noḍuttā kuḻitiddarū mātanāḍuvaṃtè toralilla. nāne mātanāḍabekāgi baṃtu.
story-d9: svāmi dayamāḍi gaṃṭè èṣṭèṃdu heḻuvirā?
story-d10: èraḍu gaṃṭègè hattu nimiṣavidè
story-n7: ā muduka tuṃbā mātugāra. avanu mātigè prāraṃbhisida. aṃtū madarāsigè talupuvaṣṭaralle nāvibbarū snehitarāgibiṭṭèvu.
story-n8: ā muduka òbba ratnada vyāpāri. nānu yārèṃdu keḻiddakkè - nānòbba baḍavara maganèṃdū èṃ.è. pāsāgidèyèṃdū kèlasa huḍukuva saluvāgi madarāsigè hòraṭiddenèṃdū heḻidè. kèlasavenu sikkadiddarè baṃdu tannannu kāṇabekèṃdu heḻida. aṣṭu hòttigāgale madarāsu talupidèvu. nānu oduvāga vāsavidda vai.èṃ.si.è. ge hogi allidda snehitara jòtèyalli uḻidè.
story-n9: marudinadiṃda kèlasa huḍukalu prāraṃbhisi èlliyū kèlasa sigade kaiyallidda kèlavu rūpāyigaḻu kharcāgiddavu. ūṭakkè tòṃdarèyādāga berenū dikku tocade, railinalli snehitanāda ā mudukana manègè hodè. devara dayèyiṃda avaru manèyalliddaru. mātukatèya baḻika kèlasa sigalillavèṃdavanigè gòttāyitu. avanigòbba magaḻū dūra saṃbaṃdhada sòsèyū iddaru. avaribbarigū pāṭha heḻikòḍalu āguttadèye èṃdu nannannu keḻida. enū kèlasavillada nanagè ade balu dòḍḍa kèlasavāyitu. marudinadiṃda pāṭha heḻalu upakramisidè. magaḻa hèsaru sītè, śāṃti èṃdu sòsèya hèsaru.
story-n10: nānu pāṭha heḻalu mòdalu māḍi āru tiṃgaḻugaḻu saṃdiddavu. huḍugiyaribbarū cènnāgiye pāṭha kaliyuttiddaru. ādarè, śāṃtiyaṣṭu curukāgi sītè kaliyuttiralilla. śāṃtiya sauṃdarya, sauṃdaryavannāvarisidda duḥkha, vidyègaḻalli avaḻigidda abhiruci mitavāda mātu ivèllavū seri nanna manassannu avaḻèḍègè èḻèyatòḍagidavu. avaḻa taṃdè tāyiyaru aṣṭenū anukūlastharāgiralilla. magaḻa maduvègè bahaḻa prayatna māḍuttiddaru. baḍatanada dèsèyiṃda varadakṣiṇè kòḍalāradè innū maduvèyāgiralilla. nanagaṃtu yāvāgalū śāṃtiya japave āyitu. maduvèyādarè avaḻannu maduvèyāgabekènisitu; avaḻannu maduvèyādarè laṃḍannigè hogalāguttiralilla. ādudariṃda avaḻannu marèyalu prayatnisatòḍagidè. èṣṭèṣṭū prayatnisidarū avaḻa sadguṇagaḻu nanna manassannu avaḻèḍègè èḻèyatòḍagidavu. nānu sītèyannu maduvèyāgabahudittu. èṣṭo sāri avaḻa taṃdè nannannu hāsyakkāgi ‘aḻiya’ èṃdu karèyuttiddaru. nānu avara aḻiyanādarè laṃḍannigè hogabahudittu. ādarè èṃdiniṃda śāṃtiyannu prītisatòḍagidèno aṃdiniṃda haṇakkāgi premavannu balikòḍabāradèṃdu
  nanna manassu heḻuttittu.
story-n11: òṃbattu gaṃṭèyāgittu nānu pāṭhada koṇèyalli kuḻitu nanna śiṣyèyaribbarannu idiru noḍuttiddè. bāgila tèrèda śabdavāyitu. tèrèda bāgiliniṃda òḻagè hòkkaḻu sītè. śāṃtiya suḻivilla. avaḻannu kāṇadè manassigè viṣādavāyitu. ādarè keḻuva mòdale avaḻe heḻidaḻu.
story-d11: noḍi meṣṭrè ninnè rātriye śāṃtiya taṃdè baṃdu avaḻannu ūrigè karèdukòṃḍu hodaru. yākèṃta gòttidèye? maduvègè?
story-n12: āga nanagè tiḻiyitu. śāṃti illadè nānu badukalārènèṃdu. mòdale avaḻa taṃdètāyiyarannu keḻadiddudakkāgi nannannu nānè haḻidukòṃḍè. haṇadāsèyiṃda nanna jīvanavannu nāne maṇṇugūḍisikòṃḍa melè gòttāyitu. śāṃti vihīna prapaṃcadalli jīvisuvudu asādhyavèṃdu. śāṃtiyannu kaḻèdukòṃḍu aṃdina dinavannèlla aśāṃtiyalli kaḻèdanu. marudina pāṭhada hòttinalli sītè nanagòṃdu kāgada torisidaḻu. śāṃtiya kāgadavannu odidè. varadakṣiṇèyannu kòḍalārada taṃdètāyiyaru nālku jana mòmmakkaḻiruva mudukannu maduvèyāgalāradè ātmahatyèmāḍikòṃḍaddannu odi, śāṃtiyaṃtaha svarṇaputthaḻiyannu kòḍuvudū alladè avaḻòḍanè varadakṣiṇèyannu kòḍabekèṃdu keḻida nīcanannu śapisidè. hiṃdòṃdu bāri nānu baḍavara huḍugiyannu maduvèyāgalu tiraskarisiddudu duḥkhada bharadalli marète hogittu. vidhiyannu dūruva badalu nāne nanna durāśèyannu biṭṭu śāṃtiyannu maduvèyāgiddarè ā muddu bālè īga sukhavāgiruttiddaḻu. nanna tappigāgi nannannu nānè jaridukòṃḍè. varadakṣiṇè èṃba piśāciyu adèṣṭu sukumāriyarannu bali tègèdukòḻḻuvudo devare
  balla! ādarè nanna śāṃtiyannu adu balitègèdukòṃḍa melè nanagadara nijasvarūpa gòttāyitu.
story-n13: aṃdina rātriye ūrigè hòraṭè. marudina bèḻagina hòttinalli manègè talupidè. nānu hoguvāga amma aṃgaḻa sārisi raṃgavalli iḍuttiddaḻu. nanna taṃdèyū ‘vi’yū òḻagiddaru. ammanòḍanè mātanāḍi òḻagè hodè. nānu alli nilladè nanna koṇègè hodè. alli vijaya òṃdu citravannu noḍuttā niṃtiddaḻu. nannannu kaṃḍu ā citravannu bacciṭṭaḻu. āgavaḻu tānu noḍuttidda peparannu nannèduru èḻèdu heḻidaḻu.
story-d12: noḍuttiddudu nīnu kòṃda huḍugiyannu
story-n14: nanagè bahaḻa āścaryavāyitu. patrikèyannu āturadiṃda tègèdu noḍidè. śāṃtiya citra. - adara kèḻagaḍè varadakṣiṇègè āhuti. śāṃtiye nānu mòdalu kaibiṭṭa kanyè? īga . . . . . . enu prayojana!
author-1: kòḍagina gaurammanavaru kannaḍada prathama katègārti èṃdu hèsarāgiddārè. ivaru 1912 mārc 3raṃdu maḍikeriyalli janisidaru. svātaṃtrya āṃdolanada saṃdarbhadalli mahātma gāṃdhījiyavaru kòḍaginalli pravāsa kaigòṃḍāga avarannu tamma manègè baramāḍikòṃḍu tamma ābharaṇagaḻannèlla dāna nīḍidaru. gaurammanavaru misès ṭi.ji. kṛṣṇa ènnuva hèsarinalli katègaḻannu barèdiddārè. kaṃbani, ciguru hāgū gaurammana katègaḻu avara kathā saṃkalanagaḻu.
ex-a-q1: railinalli sikkida mudukana udyogavenu?
ex-a-q2: yuvakanu railinalli sikkida mudukana manègè ekè baṃdanu?
ex-a-q3: mudukana magaḻu mattu sòsèya hèsarenu?
ex-a-q4: varadakṣiṇèya piśāci yārannu bali tègèdukòṃḍidè?
ex-a-q5: yuvakanu baḍavara huḍugiyannu maduvèyāgadiralu kāraṇagaḻenu?
ex-a-q6: patrikèyannu torisi vijayaḻu aṇṇanigè enu heḻidaḻu?
