labels:
  story: कथॆ
  author: कृतिकारर परिचय
  exercise-A: अ. कॊट्टिरुव प्रश्नॆगळिगॆ उत्तरिसि.
story-n1: नानु ऎं.ऎ. पासागिद्दॆ. नन्न तंदॆतायियवरु ननगॆ मदुवॆ माडबेकॆंदु हॆण्णु हुडुकुत्तिद्दरु. अंतू कडॆगॆ हुडुगियू निश्चयवादळु. नम्म मनॆयिंद हन्नॆरडु मैलि दूरदल्लिद्द ऒंदु हळ्ळियल्लि अवळ मनॆ. अवळिगू तंदॆ तायि इद्दरु. आदरॆ अवरु बहळ बडवरंतॆ. ननगेनो ऐश्वर्यवंतर अळियनागबेकॆंदु बहळ आसॆयित्तु. इंग्लॆंडिगॆ होगि ब्यारिस्टरनागबेकॆंदु बलवाद इच्छॆ. इंग्लॆंडिगॆ होगबेकादरॆ हणबेकु. ननगागि तुंबा हण खर्चु माडुवष्टु अनुकूलवु नन्न तंदॆगिरलिल्ल. ऐश्वर्यवंतर अळियनादरॆ नानु इंग्लॆंडिगॆ सुलभवागि होगबहुदागित्तु. आदुदरिंद आ बडवर हुडुगियन्नु मदुवॆयागलु ननगॆ मनस्सिरलिल्ल.
story-n2: नन्न तंगि विजय. आकॆयन्नु नानु ‘वि’ ऎंदु करॆयुत्तिद्दॆ.
story-d1: अण्णा ‘आ हुडुगियन्नु मदुवॆयागलु ऒप्पिगॆये ऎंदु अप्प केळिदरॆ एनु ऎन्नुत्ति’
story-d2: नानु अवळन्नु नोडिये इल्ल, नानु एनॆंदु उत्तर कॊडलि?
story-d3: अण्ण नानु अवळन्नु नोडिरुवॆ. अवळु ऎल्ला तरदल्लू निनगॆ योग्यळागिद्दाळॆ. ओदु बरॆह गॊत्तिदॆ. नोडुवुदक्कॆ अति चॆलुवॆ.
story-d4: वरदक्षिणॆ ऎष्टु कॊडुत्तारॆ?
story-d5: अण्ण, अप्पनिगॆ वरदक्षिणॆयन्नु तॆगॆदुकॊळ्ळलिक्कॆ इष्ट इल्ल. अवरु बहळ बडवरु आदरॆ हुडुगि रतिदेवियंतॆ इद्दाळॆ. अवरे ऐनूरु रूपायि कॊडुवॆवॆंदु हेळिद्दारॆ. अदन्नु तॆगॆदु कॊळ्ळुवुदक्कू अप्पनिगॆ ऒप्पिगॆ इल्ल.
story-d6: वि, ननगॆ लंडन्निगॆ होगि ला कलियबेकॆंदु इच्छॆयिदॆ. अदक्कागुव खर्चन्नु कॊडुवुदादरॆ मात्र नानु आ हुडुगियन्नु मदुवॆयागुत्तेनॆ. इल्लदिद्दरॆ इल्ल.
story-d7: अण्ण, नीनु ऎं.ऎ. पदवीधर, निन्न बायिंद इंतह मातु हॊरडबहुदे? निन्नन्नु नीनु मारिकॊळ्ळ बयसुवियेकॆ?
story-n3: ऎंदु स्वल्प कोपदिंदले हेळि ऒळगॆ हॊरटुहोदळु.
story-n4: जपमाडि हॊरगॆ बंदु कुळितिद्दॆ. नन्न तंदॆयू जप तीरिसि हॊरगॆ बंदरु.
story-d8: नीनु विजयळ हत्तिर मुंदॆ ओदिन खर्चिगॆ हण कॊट्टरॆ मदुवॆयागुत्तेनॆ ऎंदॆयंतॆ. अवरु बडवरु. आरेळु हॆण्णु मक्कळु इद्दारॆ. ऎल्लिंद तानॆ हण तरबल्लरु? हुडुगि लक्षणवागिद्दाळॆ. नीनु दॊड्डवर अळियनागि लंडन्निगॆ होगुवुदक्कॆ ननगॆ ऒप्पिगॆ इल्ल. ई हुडुगियन्नु मदुवॆयादरॆ इल्ले ला ओदुव खर्चन्नु हेगादरु माडि नानु कॊडुत्तेनॆ.
story-n5: ऎंदु हेळि ऒळगॆ हॊरटु होदरु.
story-n6: अंदिन रात्रि ऎल्लरू मलगिद मेलॆ नानु हॊरगॆ हॊरटॆ. नन्न मनस्सु सिट्टिनिंद चंचलवागित्तु. आ हुडुगियन्नु मदुवॆयागुव इच्छॆ ननगॆ स्वल्पवू इरलिल्ल. तंदॆयिदिरु निंतु हागॆ हेळुव धैर्य ननगिरलिल्ल. आदुदरिंद अंदिन रात्रिये मनॆ बिट्टुहॊरटॆ. नम्म हळ्ळियिंद रैल्वॆ निल्दाणक्कॆ बंदु रैलु हॊरडलु हत्तु निमिषविद्द कारण मदरासिगॆ ऒंदु टिकॆट्टन्नु तॆगॆदुकॊंडु ऒंदु कंपार्टमॆंटिनल्लि होगि कुळितॆ. नानु कुळितल्लि बेरॆ यारु इरलिल्ल. मुंदेनु गतियेनॆंदु आलोचिसुत्त कुळितिद्दंतॆये निद्रॆ बंदु बिट्टितु. एनो शब्दवादंतागि कण्णु तॆरॆदु नोडिदॆ. नन्निदिरु ऒब्ब मुदुक कुळितिद्दनु. मुदुकनादरू हुडुगनंतॆ ड्रॆस् माडिकॊंडिद्द. नोडिद कूडले मुदुकनॆंदु गॊत्तागुत्तिरलिल्ल. अवनु हणवंतनागिरबेकॆंदु अवन वेषभूषणगळिंद व्यक्तवागुत्तित्तु. अवनु नन्नन्ने नोडुत्ता कुळितिद्दरू मातनाडुवंतॆ तोरलिल्ल. नाने मातनाडबेकागि बंतु.
story-d9: स्वामि दयमाडि गंटॆ ऎष्टॆंदु हेळुविरा?
story-d10: ऎरडु गंटॆगॆ हत्तु निमिषविदॆ
story-n7: आ मुदुक तुंबा मातुगार. अवनु मातिगॆ प्रारंभिसिद. अंतू मदरासिगॆ तलुपुवष्टरल्ले नाविब्बरू स्नेहितरागिबिट्टॆवु.
story-n8: आ मुदुक ऒब्ब रत्नद व्यापारि. नानु यारॆंदु केळिद्दक्कॆ - नानॊब्ब बडवर मगनॆंदू ऎं.ऎ. पासागिदॆयॆंदू कॆलस हुडुकुव सलुवागि मदरासिगॆ हॊरटिद्देनॆंदू हेळिदॆ. कॆलसवेनु सिक्कदिद्दरॆ बंदु तन्नन्नु काणबेकॆंदु हेळिद. अष्टु हॊत्तिगागले मदरासु तलुपिदॆवु. नानु ओदुवाग वासविद्द वै.ऎं.सि.ऎ. गे होगि अल्लिद्द स्नेहितर जॊतॆयल्लि उळिदॆ.
story-n9: मरुदिनदिंद कॆलस हुडुकलु प्रारंभिसि ऎल्लियू कॆलस सिगदे कैयल्लिद्द कॆलवु रूपायिगळु खर्चागिद्दवु. ऊटक्कॆ तॊंदरॆयादाग बेरेनू दिक्कु तोचदे, रैलिनल्लि स्नेहितनाद आ मुदुकन मनॆगॆ होदॆ. देवर दयॆयिंद अवरु मनॆयल्लिद्दरु. मातुकतॆय बळिक कॆलस सिगलिल्लवॆंदवनिगॆ गॊत्तायितु. अवनिगॊब्ब मगळू दूर संबंधद सॊसॆयू इद्दरु. अवरिब्बरिगू पाठ हेळिकॊडलु आगुत्तदॆये ऎंदु नन्नन्नु केळिद. एनू कॆलसविल्लद ननगॆ अदे बलु दॊड्ड कॆलसवायितु. मरुदिनदिंद पाठ हेळलु उपक्रमिसिदॆ. मगळ हॆसरु सीतॆ, शांति ऎंदु सॊसॆय हॆसरु.
story-n10: नानु पाठ हेळलु मॊदलु माडि आरु तिंगळुगळु संदिद्दवु. हुडुगियरिब्बरू चॆन्नागिये पाठ कलियुत्तिद्दरु. आदरॆ, शांतियष्टु चुरुकागि सीतॆ कलियुत्तिरलिल्ल. शांतिय सौंदर्य, सौंदर्यवन्नावरिसिद्द दुःख, विद्यॆगळल्लि अवळिगिद्द अभिरुचि मितवाद मातु इवॆल्लवू सेरि नन्न मनस्सन्नु अवळॆडॆगॆ ऎळॆयतॊडगिदवु. अवळ तंदॆ तायियरु अष्टेनू अनुकूलस्थरागिरलिल्ल. मगळ मदुवॆगॆ बहळ प्रयत्न माडुत्तिद्दरु. बडतनद दॆसॆयिंद वरदक्षिणॆ कॊडलारदॆ इन्नू मदुवॆयागिरलिल्ल. ननगंतु यावागलू शांतिय जपवे आयितु. मदुवॆयादरॆ अवळन्नु मदुवॆयागबेकॆनिसितु; अवळन्नु मदुवॆयादरॆ लंडन्निगॆ होगलागुत्तिरलिल्ल. आदुदरिंद अवळन्नु मरॆयलु प्रयत्निसतॊडगिदॆ. ऎष्टॆष्टू प्रयत्निसिदरू अवळ सद्गुणगळु नन्न मनस्सन्नु अवळॆडॆगॆ ऎळॆयतॊडगिदवु. नानु सीतॆयन्नु मदुवॆयागबहुदित्तु. ऎष्टो सारि अवळ तंदॆ नन्नन्नु हास्यक्कागि ‘अळिय’ ऎंदु करॆयुत्तिद्दरु. नानु अवर अळियनादरॆ लंडन्निगॆ होगबहुदित्तु. आदरॆ ऎंदिनिंद शांतियन्नु प्रीतिसतॊडगिदॆनो अंदिनिंद हणक्कागि प्रेमवन्नु बलिकॊडबारदॆंदु नन्न मनस्सु हेळुत्तित्तु.
story-n11: ऒंबत्तु गंटॆयागित्तु नानु पाठद कोणॆयल्लि कुळितु नन्न शिष्यॆयरिब्बरन्नु इदिरु नोडुत्तिद्दॆ. बागिल तॆरॆद शब्दवायितु. तॆरॆद बागिलिनिंद ऒळगॆ हॊक्कळु सीतॆ. शांतिय सुळिविल्ल. अवळन्नु काणदॆ मनस्सिगॆ विषादवायितु. आदरॆ केळुव मॊदले अवळे हेळिदळु.
story-d11: नोडि मेष्ट्रॆ निन्नॆ रात्रिये शांतिय तंदॆ बंदु अवळन्नु ऊरिगॆ करॆदुकॊंडु होदरु. याकॆंत गॊत्तिदॆये? मदुवॆगॆ?
story-n12: आग ननगॆ तिळियितु. शांति इल्लदॆ नानु बदुकलारॆनॆंदु. मॊदले अवळ तंदॆतायियरन्नु केळदिद्दुदक्कागि नन्नन्नु नानॆ हळिदुकॊंडॆ. हणदासॆयिंद नन्न जीवनवन्नु नाने मण्णुगूडिसिकॊंड मेलॆ गॊत्तायितु. शांति विहीन प्रपंचदल्लि जीविसुवुदु असाध्यवॆंदु. शांतियन्नु कळॆदुकॊंडु अंदिन दिनवन्नॆल्ल अशांतियल्लि कळॆदनु. मरुदिन पाठद हॊत्तिनल्लि सीतॆ ननगॊंदु कागद तोरिसिदळु. शांतिय कागदवन्नु ओदिदॆ. वरदक्षिणॆयन्नु कॊडलारद तंदॆतायियरु नाल्कु जन मॊम्मक्कळिरुव मुदुकन्नु मदुवॆयागलारदॆ आत्महत्यॆमाडिकॊंडद्दन्नु ओदि, शांतियंतह स्वर्णपुत्थळियन्नु कॊडुवुदू अल्लदॆ अवळॊडनॆ वरदक्षिणॆयन्नु कॊडबेकॆंदु केळिद नीचनन्नु शपिसिदॆ. हिंदॊंदु बारि नानु बडवर हुडुगियन्नु मदुवॆयागलु तिरस्करिसिद्दुदु दुःखद भरदल्लि मरॆते होगित्तु. विधियन्नु दूरुव बदलु नाने नन्न दुराशॆयन्नु बिट्टु शांतियन्नु मदुवॆयागिद्दरॆ आ मुद्दु बालॆ ईग सुखवागिरुत्तिद्दळु. नन्न तप्पिगागि नन्नन्नु नानॆ जरिदुकॊंडॆ. वरदक्षिणॆ ऎंब पिशाचियु अदॆष्टु सुकुमारियरन्नु बलि तॆगॆदुकॊळ्ळुवुदो देवरे बल्ल! आदरॆ नन्न शांतियन्नु अदु बलितॆगॆदुकॊंड मेलॆ ननगदर निजस्वरूप गॊत्तायितु.
story-n13: अंदिन रात्रिये ऊरिगॆ हॊरटॆ. मरुदिन बॆळगिन हॊत्तिनल्लि मनॆगॆ तलुपिदॆ. नानु होगुवाग अम्म अंगळ सारिसि रंगवल्लि इडुत्तिद्दळु. नन्न तंदॆयू ‘वि’यू ऒळगिद्दरु. अम्मनॊडनॆ मातनाडि ऒळगॆ होदॆ. नानु अल्लि निल्लदॆ नन्न कोणॆगॆ होदॆ. अल्लि विजय ऒंदु चित्रवन्नु नोडुत्ता निंतिद्दळु. नन्नन्नु कंडु आ चित्रवन्नु बच्चिट्टळु. आगवळु तानु नोडुत्तिद्द पेपरन्नु नन्नॆदुरु ऎळॆदु हेळिदळु.
story-d12: नोडुत्तिद्दुदु नीनु कॊंद हुडुगियन्नु
story-n14: ननगॆ बहळ आश्चर्यवायितु. पत्रिकॆयन्नु आतुरदिंद तॆगॆदु नोडिदॆ. शांतिय चित्र. - अदर कॆळगडॆ वरदक्षिणॆगॆ आहुति. शांतिये नानु मॊदलु कैबिट्ट कन्यॆ? ईग . . . . . . एनु प्रयोजन!
author-1: कॊडगिन गौरम्मनवरु कन्नडद प्रथम कतॆगार्ति ऎंदु हॆसरागिद्दारॆ. इवरु 1912 मार्च् 3रंदु मडिकेरियल्लि जनिसिदरु. स्वातंत्र्य आंदोलनद संदर्भदल्लि महात्म गांधीजियवरु कॊडगिनल्लि प्रवास कैगॊंडाग अवरन्नु तम्म मनॆगॆ बरमाडिकॊंडु तम्म आभरणगळन्नॆल्ल दान नीडिदरु. गौरम्मनवरु मिसॆस् टि.जि. कृष्ण ऎन्नुव हॆसरिनल्लि कतॆगळन्नु बरॆदिद्दारॆ. कंबनि, चिगुरु हागू गौरम्मन कतॆगळु अवर कथा संकलनगळु.
ex-a-q1: रैलिनल्लि सिक्किद मुदुकन उद्योगवेनु?
ex-a-q2: युवकनु रैलिनल्लि सिक्किद मुदुकन मनॆगॆ एकॆ बंदनु?
ex-a-q3: मुदुकन मगळु मत्तु सॊसॆय हॆसरेनु?
ex-a-q4: वरदक्षिणॆय पिशाचि यारन्नु बलि तॆगॆदुकॊंडिदॆ?
ex-a-q5: युवकनु बडवर हुडुगियन्नु मदुवॆयागदिरलु कारणगळेनु?
ex-a-q6: पत्रिकॆयन्नु तोरिसि विजयळु अण्णनिगॆ एनु हेळिदळु?
