intro-1: विश्व की सभी भाषाओं में नाडु-नुडि पर अभिमान साहित्य में व्यक्त होता है। कर्नाटक एकीकरण के पहले कन्नड़ माता की स्तुति में लिखा यह काव्य उनमें एक है।
poem-s1l1: आओ माता, मुख दिखाओ, कन्नड़ियों की माता!
poem-s1l7: तन कन्नड़, मन कन्नड़, वाणी कन्नड़ — हमारे हैं।
ex-a-q1: हम पर शासन कौन करती है?
