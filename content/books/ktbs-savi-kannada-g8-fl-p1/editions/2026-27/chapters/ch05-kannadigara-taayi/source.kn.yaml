  notes: ಟಿಪ್ಪಣಿ
  exercise-A: ಅ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-B: ಆ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎರಡು-ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-C: ಇ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ನಾಲ್ಕು-ಐದು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-D: ಈ. ಕೊಟ್ಟಿರುವ ಪ್ರಶ್ನೆಗಳಿಗೆ ಎಂಟು-ಹತ್ತು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸಿ.
  exercise-E: ಉ. ಈ ಹೇಳಿಕೆಗಳಿಗೆ ಸಂದರ್ಭಸಹಿತ ಸ್ವಾರಸ್ಯವನ್ನು ವಿವರಿಸಿ.
segments:
- id: intro-1
  type: prose
  section: intro
  text: ಜಗತ್ತಿನಲ್ಲಿರುವ ಎಲ್ಲಾ ಭಾಷೆಗಳಲ್ಲಿಯೂ ನಾಡು - ನುಡಿಯ ಮೇಲಿನ ಅಭಿಮಾನವು ಆಯಾಯ ಭಾಷೆಯ ಸಾಹಿತ್ಯದ ಎಲ್ಲಾ ಪ್ರಕಾರಗಳಲ್ಲಿಯೂ ಅಭಿವ್ಯಕ್ತಗೊಂಡಿದೆ. ಇವು ಜನಮಾನಸದ ಅಮೃತಧಾರೆಗಳಾಗಿವೆ. ನಾಡು-ನುಡಿಯ ಆತ್ಮಾಭಿಮಾನದಿಂದ ಕೂಡಿದ ದೇಶಾಭಿಮಾನವು ನಾಡಿನ ಏಳಿಗೆಗಾಗಿ ದುಡಿಯುವಂತೆ ನಮ್ಮೆಲ್ಲರನ್ನು ಪ್ರೇರೇಪಿಸುತ್ತವೆ. ಭವ್ಯ ಪರಂಪರೆಯುಳ್ಳ ಕರುನಾಡು ಅನೇಕ ಪ್ರಾಂತ್ಯಗಳಲ್ಲಿ ಹರಿದು ಹಂಚಿ ಹೋಗಿದ್ದ ಕಾಲದಲ್ಲಿ ಕರ್ನಾಟಕ ಏಕೀಕರಣದ ಕನಸನ್ನು ಕಂಡವರು ಅನೇಕರು. ಕನ್ನಡದ ಮಕ್ಕಳೆಲ್ಲ ಒಂದಾಗಿ ಬನ್ನಿ, ಉದಯವಾಗಲಿ ಚೆಲುವ ಕನ್ನಡ ನಾಡು, ಬಾರಿಸು ಕನ್ನಡ ಡಿಂಡಿಮವ, ಹಚ್ಚೇವು ಕನ್ನಡದ ದೀಪ ಎಂದೆಲ್ಲ ಅನೇಕರು ನಾಡು ನುಡಿಯ ಶ್ರೇಷ್ಠತೆ, ಪಾವಿತ್ರ್ಯತೆಯನ್ನು ಸಾರುವ ಮೂಲಕ ನವೋದಯ ಸಾಹಿತ್ಯಕ್ಕೆ ನಾಂದಿ ಹಾಡಿದರು. ಜೊತೆಗೆ ಕನ್ನಡಿಗರನ್ನು ಒಗ್ಗೂಡಿಸುವ ಕಾರ್ಯದಲ್ಲಿ ತೊಡಗಿದರು. ಈ ನಿಟ್ಟಿನಲ್ಲಿ ಮೂಡಿಬಂದ ಕವನಗಳಲ್ಲಿ ಇದು ಒಂದಾಗಿದೆ.
- id: poem-s1l1
  type: poem_line
  section: poem
  stanza: 1
  text: ತಾಯೆ ಬಾರ, ಮೊಗವ ತೋರ, ಕನ್ನಡಿಗರ ಮಾತೆಯೆ!
