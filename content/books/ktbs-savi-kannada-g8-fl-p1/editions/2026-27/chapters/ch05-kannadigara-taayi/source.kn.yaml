- id: author-1
  type: prose
  section: author
  text: "ರಾಷ್ಟ್ರಕವಿ ಎಂ. ಗೋವಿಂದ ಪೈ ಅವರು ಕಾಸರಗೋಡು ಜಿಲ್ಲೆಯ ಮಂಜೇಶ್ವರದಲ್ಲಿ 23.03.1883ರಲ್ಲಿ ಜನಿಸಿದರು. ತಂದೆ ಸಾಹುಕಾರ ತಿಮ್ಮಪೈ, ತಾಯಿ ದೇವಕಿಯಮ್ಮ. ಬಿ.ಎ. ಪದವಿಯನ್ನು ಪಡೆದಿದ್ದ ಗೋವಿಂದ ಪೈ ಅವರು ದೇಶೀ ಭಾಷೆಗಳಲ್ಲಲ್ಲದೆ ವಿದೇಶಿ ಭಾಷೆಗಳ ಪಾಂಡಿತ್ಯವನ್ನುಳ್ಳವರಾಗಿದ್ದರು. ಪ್ರಾಸ ಬಿಟ್ಟು ಪದ್ಯ ರಚಿಸಿದ ಮೊದಲ ಕವಿ ಎಂಬ ಹೆಗ್ಗಳಿಕೆಗೂ ಪಾತ್ರರಾದವರು. ಸಂಶೋಧಕ, ವಿಮರ್ಶಕ, ಅನುವಾದಕರಾಗಿಯೂ ಜನಪ್ರಿಯರಾದ ರಾಷ್ಟ್ರಕವಿ ಗೋವಿಂದ ಪೈ ಅವರ (‘ಸುವಾಸಿನಿ’) ಮೊದಲ ಕವಿತೆ 1900ರಲ್ಲಿ ಸುವಾಸಿನಿ ಪತ್ರಿಕೆಯಲ್ಲಿ ಪ್ರಕಟವಾಯಿತು. ಅವರ ಕವನ ಸಂಕಲನಗಳು ಇಂತಿವೆ: ಗಿಳಿವಿಂಡು, ನಂದಾದೀಪ ಮೊದಲಾದವು. 1949ರಲ್ಲಿ ಮದ್ರಾಸ್ ಸರ್ಕಾರ ರಾಷ್ಟ್ರಕವಿ ಬಿರುದು ನೀಡಿ ಗೌರವಿಸಿದೆ. ಇವರು ಕನ್ನಡದ ಮೊದಲ ರಾಷ್ಟ್ರಕವಿ ಹೆಗ್ಗಳಿಕೆಗೆ ಪಾತ್ರರಾದವರು. 06.09.1963 ರಲ್ಲಿ ಗೋವಿಂದ ಪೈ ಅವರು ದೈವಾಧೀನರಾದರು."
- id: ashaya-1
  type: prose
  section: ashaya
  text: ಇದು ಕರ್ನಾಟಕ ಏಕೀಕರಣದ ಪೂರ್ವದಲ್ಲಿ ಕನ್ನಡತಾಯಿಯನ್ನು ಸ್ತುತಿಸಿ ಬರೆದ ಕವನ. ಕನ್ನಡತಾಯಿ ತನ್ನ ಮುಖವನ್ನು ತೋರುವ ಮೂಲಕ ಕನ್ನಡದ ಮಕ್ಕಳನ್ನು ಒಂದಾಗಿಸಬೇಕು ಎನ್ನುವುದು ಪದ್ಯದ ಮುಖ್ಯ ಆಶಯ. ಕನ್ನಡನಾಡಿನಲ್ಲಿ ಎಲ್ಲಾ ಸಂಪತ್ತು ಇದೆ. ತಾಯಿಯ ಮುಖ ಕಂಡಾಗ ಅದೆಲ್ಲವೂ ಗೋಚರವಾಗುತ್ತದೆ. ಹೀಗೆ ಗೋಚರಿಸಿದಾಗ ಮಾತ್ರ ಕನ್ನಡ ತಾಯಿಯ ಕೀರ್ತಿ ಜಗತ್ತಿನಾದ್ಯಂತ ಪಸರಿಸಲು ಸಾಧ್ಯ. ಅದಕ್ಕಾಗಿ ಕನ್ನಡತಾಯಿ ಎಲ್ಲರ ನಡೆ-ನುಡಿ, ಆಚಾರ-ವಿಚಾರಗಳಲ್ಲಿ ನೆಲೆಯಾಗಬೇಕು. ಕನ್ನಡಿಗರಿಗೆ ಕನ್ನಡವೇ ಉಸಿರು, ಕನ್ನಡಿಗರ ಧಮನಿಧಮನಿಗಳಲ್ಲಿಯೂ ಕನ್ನಡವೇ ಉಸಿರಾಗಬೇಕು. ಕನ್ನಡ ನಾಡು ನುಡಿಯ ಶ್ರೇಷ್ಠತೆ, ಭವ್ಯಪರಂಪರೆ, ಇತಿಹಾಸ, ಪ್ರಾಕೃತಿಕ, ಸಾಹಿತ್ಯಿಕ, ವಾಸ್ತುಶಿಲ್ಪಗಳ ಭವ್ಯತೆಯಿಂದ ಜಗತ್ತಿನೆಲ್ಲಡೆ ಹರಡಬೇಕೆಂಬುದು ಕವಿಯ ಆಶಯವಾಗಿದೆ.
