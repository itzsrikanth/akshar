ex-a-q1: नम्मन्नु आळुववळु यारु?
ex-a-q2: लतॆ यावुदनॆल्ला नीडुत्तदॆ?
ex-a-q3: कन्नड तायिय बसिर हॊन्नगनि यारु?
ex-a-q4: कन्नड तायिय हाडन्नु यावुदरिंद उक्किसबेकु?
ex-a-q5: कन्नडिगर पाडु एनु?
ex-b-q1: कन्नड नाडिन प्रकृति वैशिष्ट्यवेनु?
ex-b-q2: कन्नडद कविश्रेष्ठर हिरिमॆयेनु?
ex-b-q3: कन्नडद हॆसरन्नु हेगॆ हब्बिसबेकॆंदु कवि आशिसुत्तारॆ?
ex-c-q1: कन्नड तायियन्नु मरॆयलु साध्यविल्ल एकॆ?
ex-c-q2: कवि कन्नड तायियल्लि एनॆंदु कोरुत्तारॆ?
ex-c-q3: गोविंद पै अवर प्रमुख कृतिगळावुवु?
ex-d-q1: कन्नडिगर तायि मॊग तोरबेकॆंदु कवि एकॆ बयसुत्तारॆ? विवरिसि.
ex-d-q2: कन्नड नाडिन कवि हागू कलॆय महत्ववेनु? - विवरिसि.
