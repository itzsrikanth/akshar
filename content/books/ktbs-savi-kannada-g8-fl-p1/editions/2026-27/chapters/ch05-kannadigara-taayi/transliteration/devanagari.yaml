intro-1: जगत्तिनल्लिरुव ऎल्ला भाषॆगळल्लियू नाडु - नुडिय मेलिन अभिमानवु आयाय भाषॆय साहित्यद ऎल्ला प्रकारगळल्लियू अभिव्यक्तगॊंडिदॆ. इवु जनमानसद अमृतधारॆगळागिवॆ. नाडु-नुडिय आत्माभिमानदिंद कूडिद देशाभिमानवु नाडिन एळिगॆगागि दुडियुवंतॆ नम्मॆल्लरन्नु प्रेरेपिसुत्तवॆ. भव्य परंपरॆयुळ्ळ करुनाडु अनेक प्रांत्यगळल्लि हरिदु हंचि होगिद्द कालदल्लि कर्नाटक एकीकरणद कनसन्नु कंडवरु अनेकरु. कन्नडद मक्कळॆल्ल ऒंदागि बन्नि, उदयवागलि चॆलुव कन्नड नाडु, बारिसु कन्नड डिंडिमव, हच्चेवु कन्नडद दीप ऎंदॆल्ल अनेकरु नाडु नुडिय श्रेष्ठतॆ, पावित्र्यतॆयन्नु सारुव मूलक नवोदय साहित्यक्कॆ नांदि हाडिदरु. जॊतॆगॆ कन्नडिगरन्नु ऒग्गूडिसुव कार्यदल्लि तॊडगिदरु. ई निट्टिनल्लि मूडिबंद कवनगळल्लि इदु ऒंदागिदॆ.
poem-s1l1: तायॆ बार, मॊगव तोर, कन्नडिगर मातॆयॆ!
poem-s1l2: हरसु तायॆ, सुतर कायॆ, नम्म जन्मदातॆयॆ!
poem-s1l3: नम्म तप्पनॆनितॊ ताळ्वॆ,
poem-s1l4: अक्करॆयिंदॆम्मनाळ्वॆ,
poem-s1l5: नीनॆ कणा नम्म बाळ्वॆ,
poem-s1l6: निन्न मरॆयलम्मॆवु!
poem-s1l7: तनु कन्नड, मन कन्नड, नुडि कन्नडवॆम्मवु.
poem-s2l1: हण्णनीव कायनीव परिपरिय मरंगळॊ,
poem-s2l2: पत्रमीव पुष्पमीव लतॆय तरतरंगळॊ,
poem-s2l3: तॆनॆय कॆनॆय गाळियॊ,
poem-s2l4: खगमृगोरगाळियॊ,
poem-s2l5: नदि नगर नगाळियॊ!
poem-s2l6: इल्लिल्लदुदुळिदुदॆ?
poem-s2l7: जेनु सुरिव हालु हरिव दिवं भूमिगिळिदुदॆ?
poem-s3l1: जैनराद पूज्यपाद कॊंडकुंदवर्यर,
poem-s3l2: मध्वयतियॆ बसवपतियॆ मुख्य मताचार्यर,
poem-s3l3: शर्व पंप रन्नर,
poem-s3l4: लक्ष्मीपति जन्नर,
poem-s3l5: षडक्षरि मुद्दण्णर,
poem-s3l6: पुरंदरवरेण्यर,
poem-s3l7: तायॆ, निन्न बसिरॆ हॊन्नगनि विद्यारण्यर!
poem-s4l1: हळॆय बीड बेलनाड माडमॆनितॊ सुंदरं!
poem-s4l2: बिळिय कॊळद कारकळद निडुकरॆनितॊ बंधुरं!
poem-s4l3: इल्लिल्लद शिल्पमिल्ल;
poem-s4l4: निन्न कल्लॆ नुडिवुदल्ल!
poem-s4l5: हिंगतॆयिनिवाल सॊल्ल
poem-s4l6: नॆम्मतृषॆगॆ दक्किसु!
poem-s4l7: हॊसतु किन्नरियलि निन्न हळॆय हाडनुक्किसु!
poem-s5l1: तन्न मरॆय कंपनरियददनॆ हॊरगॆ हुडुकुव
poem-s5l2: मृगद सेडु नम्म पाडु परर नुडिगॆ मिडुकुव!
poem-s5l3: कन्नड कस्तूरियन्न
poem-s5l4: हॊसतुसिरिं तीडदन्न
poem-s5l5: सुरभि ऎल्लि? नीनदन्न
poem-s5l6: नवशक्तियिनॆब्बिसु-
poem-s5l7: हॊस सुगंधदॊसगॆयिंद जगदि हॆसर हब्बिसु|
poem-s6l1: नम्मॆदॆयं तायॆ बलिसु,
poem-s6l2: ऎल्लर बायल्लि नॆलसु,
poem-s6l3: नम्म मनमनॊंदॆ कलसु!
poem-s6l4: इदनॊंदनॆ कोरुवॆ!
poem-s6l5: निन्न मूर्ति जगत्कीर्ति ऎंदिगॆमगॆ तोरुवॆ?
author-1: 'राष्ट्रकवि ऎं. गोविंद पै अवरु कासरगोडु जिल्लॆय मंजेश्वरदल्लि 23.03.1883रल्लि जनिसिदरु. तंदॆ साहुकार तिम्मपै, तायि देवकियम्म. बि.ऎ. पदवियन्नु पडॆदिद्द गोविंद पै अवरु देशी भाषॆगळल्लल्लदॆ विदेशि भाषॆगळ पांडित्यवन्नुळ्ळवरागिद्दरु. प्रास बिट्टु पद्य रचिसिद मॊदल कवि ऎंब हॆग्गळिकॆगू पात्ररादवरु. संशोधक, विमर्शक, अनुवादकरागियू जनप्रियराद राष्ट्रकवि गोविंद पै अवर (‘सुवासिनि’) मॊदल कवितॆ 1900रल्लि सुवासिनि पत्रिकॆयल्लि प्रकटवायितु. अवर कवन संकलनगळु इंतिवॆ: गिळिविंडु, नंदादीप मॊदलादवु. 1949रल्लि मद्रास् सर्कार राष्ट्रकवि बिरुदु नीडि गौरविसिदॆ. इवरु कन्नडद मॊदल राष्ट्रकवि हॆग्गळिकॆगॆ पात्ररादवरु. 06.09.1963 रल्लि गोविंद पै अवरु दैवाधीनरादरु.'
ashaya-1: इदु कर्नाटक एकीकरणद पूर्वदल्लि कन्नडतायियन्नु स्तुतिसि बरॆद कवन. कन्नडतायि तन्न मुखवन्नु तोरुव मूलक कन्नडद मक्कळन्नु ऒंदागिसबेकु ऎन्नुवुदु पद्यद मुख्य आशय. कन्नडनाडिनल्लि ऎल्ला संपत्तु इदॆ. तायिय मुख कंडाग अदॆल्लवू गोचरवागुत्तदॆ. हीगॆ गोचरिसिदाग मात्र कन्नड तायिय कीर्ति जगत्तिनाद्यंत पसरिसलु साध्य. अदक्कागि कन्नडतायि ऎल्लर नडॆ-नुडि, आचार-विचारगळल्लि नॆलॆयागबेकु. कन्नडिगरिगॆ कन्नडवे उसिरु, कन्नडिगर धमनिधमनिगळल्लियू कन्नडवे उसिरागबेकु. कन्नड नाडु नुडिय श्रेष्ठतॆ, भव्यपरंपरॆ, इतिहास, प्राकृतिक, साहित्यिक, वास्तुशिल्पगळ भव्यतॆयिंद जगत्तिनॆल्लडॆ हरडबेकॆंबुदु कविय आशयवागिदॆ.
