ex-a-q1: nammannu āḻuvavaḻu yāru?
ex-a-q2: latè yāvudanèllā nīḍuttadè?
ex-a-q3: kannaḍa tāyiya basira hònnagani yāru?
ex-a-q4: kannaḍa tāyiya hāḍannu yāvudariṃda ukkisabeku?
ex-a-q5: kannaḍigara pāḍu enu?
ex-b-q1: kannaḍa nāḍina prakṛti vaiśiṣṭyavenu?
ex-b-q2: kannaḍada kaviśreṣṭhara hirimèyenu?
ex-b-q3: kannaḍada hèsarannu hegè habbisabekèṃdu kavi āśisuttārè?
ex-c-q1: kannaḍa tāyiyannu marèyalu sādhyavilla ekè?
ex-c-q2: kavi kannaḍa tāyiyalli enèṃdu koruttārè?
ex-c-q3: goviṃda pai avara pramukha kṛtigaḻāvuvu?
ex-d-q1: kannaḍigara tāyi mòga torabekèṃdu kavi ekè bayasuttārè? vivarisi.
ex-d-q2: kannaḍa nāḍina kavi hāgū kalèya mahatvavenu? - vivarisi.
ex-e-q1: “khaga mṛgoragāḻiyo”
ex-e-q2: “ninna kallè nuḍivudalla!”
ex-e-q3: “namma manamanòṃdè kalasu!”
