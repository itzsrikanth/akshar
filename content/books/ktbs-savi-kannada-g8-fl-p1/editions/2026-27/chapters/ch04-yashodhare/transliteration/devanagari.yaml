intro-1: कन्नड साहित्य प्रकारगळल्लि नाटकवु ऒंदु. “काव्यगळल्लि नाटक मनोहरवादद्दु” नाटकदल्लि पात्रगळ अभिनय, दृश्यावळिगळु, संभाषणॆ, संगीत मॊदलादवु नोडुगर मनस्सन्नु सूरॆगॊळ्ळुत्तवॆ.
intro-2: इतिहासदल्लि बरुव महापुरुषरु, युगप्रवर्तकरु मॊदलादवर परिचयवन्नु हागू अंदिन सामाजिक व्यवस्थॆगळ प्रतिबिंबवागि मूडिबंदवुगळे ऐतिहासिक नाटकगळु. ई निट्टिनल्लि कपिलवस्तुविन राजकुमार ‘सिद्धार्थ’, बुद्धनाग बयसि रात्रोरात्रि यारिगू तिळिसदॆ राज्यवन्नु परित्याग माडि होगुत्तानॆ. आदरॆ इत्त आतन मडदि ‘यशोधरॆ’ अनुभविसुत्तिद्द भय, आतंक हागू मानसिक तुमुलगळन्नु ई नाटकदल्लि प्रेक्षकर मनमुट्टुवंतॆ मनोज्ञवागि चित्रिसलागिदॆ.
story-n1: (यशोधरॆ पठद अडिगॆ तलॆयिट्टु दुःखिसुवळु. राहुलनु हूगळन्नु तॆगॆदु पीठद मेलॆ हाकुवनु. ताय हॆरळिगॆ ऒंदु हूवनिट्टु सॊगसु नोडुवनु. अदे वेळॆगॆ राजनू, अंबिकॆयू बरुवरु)
story-d1: अम्माजि, बंदिहॆनु.
story-d2: (ऎद्दु बंदु नमस्करिसि) पीठवनु कॊळबेकु. नानु बहुदिनदिंद निम्म बेडुतलिद्दॆ. सोदरिय सुतॆयॆंदु ऎळॆतनदले नन्न करॆतंदिरि, साकि सलहिदिरि; सॊसॆयागि मनॆगॆ होगिसिदिरि, बाळुवॆयनुद्धरिसिदिरि. कनसिरलि ऎणिसलागद सौख्यगळ नानु निम्म अरमनॆयल्लि अनुभविसि सुखिसिदॆनु.
story-d3: नन्न अरमनॆयल्लि ?
story-d4: नम्म अरमनॆयल्लि. निम्म ऐश्वर्यदलि कणमात्रवनु ननगॆ इल्लवॆन्नदॆ नन्न परिपालिसिदिरि. पतियनित्तरि ; बाल देवरागिरलॆंदु ; पतियनिन्नॊम्मॆ नीडिरि ; नन्न रक्षिसिरि.
story-d5: एनमाडॆंदु केळुवॆ ?
story-d6: नम्म अण्णाजि तंदॆयनु करॆतरलु होगुवॆनु ऎनलागि नीवु ऒप्पिदिरंतॆ. नानु निम्मनु मॊदलॆ बेडिकॊंडिद्दॆ. नानवरॆडॆगॆ होगुवॆनु इवनन्निल्लिये निलिसिकॊळ्ळिरि.
story-d7: अम्माजि, बालकनु तंदॆयनु करॆतरुवॆनॆंदॆनलु केवल विनोददलि आगबहुदॆंदॆनु. नम्म कुवरन करॆदुतरबेकु ऎनलागि होह बेहिल्लवे? ऎळॆयननु कळुहुवरॆ?
story-d8: एनु तात, मुन्न होहबहुदॆंदवरु ईग उंटे ऎंदु हेळुविरि ? दॊड्डवरु ननगॊंदु मातनाडुत तायि केळिदरॆ बेरॊंदु मात हेळुविरॊ ? ना होहुवॆनु. अम्म इंदळुतलिद्दरु. अण्ण बारदिरॆ अळुतले इरुवरु. ना होगि करतरुवॆनु.
story-d9: केळिदिर हसुळॆयाडुव मात ? ननगो निन्नॆ नोडिद ऒंदु कनसु मनवु तुडुकि उसिरिंद उसिरु कळवागि चेतनवॆल्ल बॆंडागि होगिहुदु ; ऒणगि तरगागिहुदु.
story-d10: हौदु. अंबिकॆ कनस मात हेळिदळॆनगॆ. निजदिंद बंदिरुव नोवु साकागिरलु कनसॊंदु बेरॆ निन्ननु हिंसॆपडिसुतिदॆ.
story-d11: इंदु इरुळागुवुदु ; इन्नेन माडुव ; निद्दॆयलि मुळुगलिन्नाव कनसिन मॊसळॆ हिडियुवुदॊ; इन्नॆनितु तॊळलबेको, ऎंदु चेतनगळॆल्ल भीतियलि कलकिहवॆनगॆ. नन्ननुद्धरिसबेकु. (मंडियूरि नमस्करिसुवळु.)
story-d12: एळु, अम्माजि ; निन्न दुःखव नानु काणॆने ? एळम्म,
story-n2: (यशोधरा ऎद्दु कुळितुकॊळ्ळुवळु)
story-d13: होगि केळुवॆनु.
story-d14: संन्यासियादवनु सतिय नोडुव मातु संप्रदायकॆ विरोध.
story-d15: पूर्वदलि गार्गि संन्यासदलि तन्न पतियॊडनॆ काननकॆ तॆरळिदळु ऎंदु केळिहॆनु. नानंतॆये संन्यासवनु कॊंडु पतियॆडॆगॆ सारिदरॆ.....
story-d16: ईग नीनिह रीति संन्यासवल्लवॆ ?
story-d17: आण्म संन्यासियागिहरॆंबुदनु नॆनॆव साधनॆय वेषविदु. इंदु निजदलि नानु. संन्यासवनु कॊंडु पतियॆडॆगॆ सारिदरॆ.....
story-d18: पतियॆडॆगॆ सारुवरॆ संन्यासनु कॊळलु अदनु संन्यासवॆन्नुवुदॆंतु अम्माजि ? यशोधरॆ :ननगॆ कविदिरुव मंकनु नॆनॆयॆ ननगे नगॆ बरुतलिदॆ, अंतॆ अळु बरुतलिदॆ. इन्नु एनमाडुवुदो तोरदु. ऎंतु नडॆयलि ? नीवॆ अप्पणॆमाडि. अदरंतॆ नडॆयुवॆनु.
story-d19: कुवरनिगॆ हेळि कळुहिसुव, अवनिष्टवनु तिळिदु अदरंतॆ नडॆयुव.
story-d20: आगबहुदु, इंदॆ बेहनु कळुहि.
story-d21: कळुहुवॆनु, यारल्लि ?
story-d22: तात अण्णन नोडॆ यारनो कळुहुविर ? ना होगिबरुवॆ. नन्ननु कळुहि.
story-d23: अण्णय्य मॊदलु बेहिन जनरु होगि अवरिच्छॆयनु तिळिदु मरळलि.
story-d24: 'मत्तॆ होगुवुदंतॆ ! मत्तॆ ! नानॊल्लॆ. नानीगले होगबेकु. निमगेनु ? अण्णननु नोडिहिरि : नोडबेकॆंदासॆ अष्टु बलवागिल्ल. नानवर नोडिल्ल. इन्नॆष्टु दिनकॆ नोडुवुदु ? अम्माजि, निनगॆ भय बेडम्म, ना मरळि बहॆनम्म ; निजवागियू बहॆनु, अल्लिये निलॆनम्म ; नन्न कळुहिसम्म ; अवर ना करॆतरुवॆनु. तात नन्ननु कळुहि ; ना मरळि बरुवॆनु. अण्णननु नोडबेकॆंदु, अवरॊडनिद्दु माताडबेकॆंदु, ननगॆ बहु आसॆयिदॆ.'
story-d25: इरलि सुम्मनिरण्ण.
story-d26: कनसु निजवायितु. कनसिनलि कंड हुलि निजदॊळॆदुरिगॆ बंदु, कॊडु निन्न जीववनु, ऎंदु केळुतलिहुदु.
story-d27: अम्माजि, नानु बरुवॆनॊ इल्लवो ऎंदु निनगॆ भयविहुदागॆ नन्न जॊतॆयलि नम्म अंबिकॆय कळुहम्म. नाविब्बरू होगि अण्णननु करॆदहॆवम्म. ऒप्पम्म.
story-d28: अंबिकॆ. अंबिक :स्वामि.
story-d29: बालनाडिद मात केळिदॆय? एनॆंबॆ ? अंबिक :केळिदॆ. अम्माजि भयपडुतलिहरु. तावरियदिहदेनुंटु ?
story-d30: अम्माजि एनॆंबॆ ? अंबिकॆय जॊतॆयल्लि राहुलन कळुहिसलु धैर्यवागिरबहुदु. एनहेळुवॆ ?
story-d31: ननगॆ यावुदू तोचदिदॆ. अवर नोडुव पुण्य नन्न ई कण्गळिगॆ इरुवुदो इल्लवो नानरियॆ. बालकनु तन्न तंदॆय नोडबेकॆंदु आशिसलु बेडवॆन्नुवुदु सरिये ऎंदु आंतर्य संदेहदॊळगिहुदु. कळुहुवुदु सरियॆंदु. निमगॆ तोरिदरॆ कळुहिरि. बेडवॆनॆ नानु.
story-d32: अम्मा, ऎष्टु ऒळ्ळॆयवळम्मा नीनु ! अंबिके, नडॆ, होगि अण्णननु करॆतरुव. ताता ना होगिबरलॆ ? अम्माजी. नावु होगि बरोणवेनम्म ?
story-d33: आहा, एनु उत्साहविदु ! अप्पाजि होगिबा. अण्णय्य, नन्न मरॆयदिरण्ण. निम्मण्ण नम्म मरॆतरु, नन्न बदुकॆल्ल बयलाय्तु. अवरु बिट्टंतॆ नीनॆन्न कै बिडबेड. होगिबा. होगिबा ; अंबिकॆ, जॊतॆयॊळिरु; नन्न मरॆयदिरु.
story-d34: नन्नाणॆ मरॆयुवॆनॆ तायि ?
story-d35: मरॆतरू तप्पल्ल. अदु नन्न विधि ऎंबॆ.
story-d36: निन्न विधि कॆट्टुदॆंदॆणिसदिरु अम्माजि. निन्नरसनीग लोककॆ पूज्यनॆनिसिहनु. राज्यवाळुवुदॆंब किरिय हिरिमॆयनु. जगद जीवगळ उद्धरिप हिरिहिरिमॆयनु अळवट्टु, राज अधिराज वृंदगळिंद ओलैसिकॊळ्ळुत्त चक्राधिपतियंतॆ निंदिहनु. एकॆ चिंतिसुवॆ ? ई बालकनु निन्न ई हत्तु वरुषद तपवॆ मॆय्वॆत्तु निन्नाण्मननु करॆयहॊरटंतॆ हॊरटिहनु. विधियरितु नडॆव हवनदलि उद्गातृगळु स्वरहिडिदु सॊगसागि नुडिद शक्तिय मंत्र देवरनु तरुवंतॆ नम्म ई बालकनु नम्म सिद्धार्थननु बिडदॆ तंदेतहनु. बा नन्न अण्णय्य, तायिगभिवंदिसु. बहु हिरिय जीववय्या निन्न तायियदु ; बहु हिरिय तप पुण्य, बीळ्कॊळुव मॊदलल्लि हरकॆयनु कॊळु. इल्लि बा, ऒम्मॆ वंदिसु. ताय्तंदॆगळ पुण्य निन्नल्लि फलिसलि. सिद्धार्थननु करॆदुतह कार्यदलि नीनु सिद्धार्थनप्पंतॆ देवर्कळॆसगलि.
story-n3: (राहुलनु इवरिगॆ नमिसुवनु. तॆरॆ बीळुवुदु)
author-1: न्नड साहित्य लोकदल्लि‘सण्णकथॆगळ जनक’रॆंदे ख्यातिपडॆदु, ‘श्रीनिवास’काव्यनामदिंद हॆसरांत मास्ति वॆंकटेश अय्यंगाररु कोलार जिल्लॆय मालूरु ताल्लूकिन मास्तिऎंब ग्रामदल्लि6-6-1891रल्लि जनिसिदरु. तुंबु बडतनविद्दरू कष्टपट्टु विद्याभ्यास माडि उत्तम दर्जॆयल्लि इंग्लिष् ऎं.ऎ. पदवि पडॆदरु.‘मैसूरु सिविल् सर्विस्’परीक्षॆयल्लि मॊदल स्थान पडॆदु असिस्टॆंट् कमिषनर् आगि राज्यद विविधॆडॆ सेवॆ सल्लिसिरुत्तारॆ. इवरु काव्य, नाटक, कादंबरि विमर्शॆ - हीगॆ कन्नड साहित्य विविध प्रकारगळल्लि कृति रचिसिद्दारॆ. इवर सण्णकथॆगळु ऒट्टु हदिमूरु संपुटगळल्लि प्रकटवागिवॆ.`गौतमि हेळिद कथॆ’, `सारिपुत्रन कॊनॆय दिनगळु’, `कुचेलन भाग्य, `हेमकूटदिंद बंद मेलॆ’, `चिकवीर राजेंद्र’मॊदलादवु प्रमुख कृतिगळु. इवर चिकवीर राजेंद्र कादंबरिगॆ 1983 रल्लि ज्ञानपीठ प्रशस्ति दॊरॆतिदॆ. इवरु 6-6-1986रल्लि निधनरादरु.
ashaya-1: मास्ति वॆंकटेश अय्यंगारर‘यशोधरॆ’नाटकदिंद संपादिसि निगदिपडिसिदॆ. पूर्व कथॆ सिद्धार्थ राज्यवन्नु परित्याग माडि होगि हत्तु वर्षगळु कळॆदिवॆ. तंदॆयन्ने काणद मगु राहुलनिगू हत्तु वर्षगळागिवॆ. इत्त कपिलवस्तुविन अरमनॆय अंतःपुरदल्लि यशोधरा ऒब्बळे चिंतामग्नळागि सिद्धार्थन पठवन्नु नोडुत्ता कण्णीरिडुत्ता कुळितिरुत्ताळॆ. दुःखिसलु कारणवन्नु आकॆय सखि अंबिकॆ केळलागि हिंदिन रात्रि अमंगळवन्नु सूचिसुव कनसॊंदन्नु कंडॆनॆंदु हेळुत्ता, हत्तु वर्षगळ हिंदॆ इंथह कनसॊंदन्नु कंडु ऎच्चरवागि नोडिदरॆ नन्न मनदन्न इरदे राज्य तॊरॆदु होगिद्द. इंदु कनसिनिंद ऎच्चॆत्तु नोडिदरॆ मग इद्दानॆ. आदरॆ ऎल्लि नन्नन्नु तॊरॆदु होगुत्तानॆंदु व्याकुलतॆगॆ ऒळगागिरुवुदागि तिळिसुत्ताळॆ. अभ्यासक्कॆ होगिद्द राहुलनु बंदु अम्म तंदॆयन्नु नानु नोडिये इल्ल, आतनन्नु करॆतरलु नानु होगुवुदागि तिळिसुत्ता इदक्कॆ तातन अनुमति पडॆदिरुवुदागि तिळिसुत्तानॆ. इदरिंद आतंकगॊंडु राजनन्नु करॆयलु सखि अंबिकॆयन्नु कळिसुत्ताळॆ. राज अंतःपुरक्कॆ अंबिकॆयॊंदिगॆ आगमिसुत्ताÉ.
