ex-a-q1: यशोधरॆ मत्तॊम्मॆ यारन्नु नीडबेकॆंदु राजनल्लि बेडुत्ताळॆ?
ex-a-q2: तंदॆयन्नु करॆतरलु होगुवॆनॆंदु हेळिदवरारु?
ex-a-q3: राजनिगॆ कनसिन विचारवन्नु तिळिसिदवरारु?
ex-a-q4: संप्रदायक्कॆ विरुद्धवादद्दु यावुदु?
ex-a-q5: ईग नीनिरुव रीति यावुदॆंदु यशोधरॆयन्नु राज केळिदनु?
ex-b-q1: राजनन्नु पीठदल्लि कुळ्ळिरिसि यशोधरॆ एनॆंदु विनंतिसुत्ताळॆ?
ex-b-q2: यशोधरॆ मंडियूरि नमस्करिसुत्ता एनु हेळुत्ताळॆ?
ex-b-q3: राजनु ईग नीनिरुव रीति सन्यासवल्लवॆ ऎन्नलु कारणवेनु?
ex-b-q4: यशोधरॆय आंतर्यदल्लिरुव संदेहवेनु?
ex-c-q1: बेहिनवरन्नु कळिसुव विचारदल्लि राहुलन अभिप्रायवेनु?
ex-c-q2: यशोधरॆय विधिय बग्गॆ राजनु एनॆंदु हेळिदनु?
ex-d-q1: “सोदरिय सुतॆयॆंदु ऎळॆतनदले नन्न करॆतंदु साकिदिरि”
ex-d-q2: “अम्माजि, निनगॆ भय बेडम्म ना मरळि बहॆनम्म”
ex-d-q3: “निन्न विधि कॆट्टुदॆंदॆणिसदिरु अम्माजि”
ex-d-q4: “निद्दॆयलि मुळुगलिन्नाव कनसिन मॊसळॆ हिडियुवुदो”
ex-f-q1: यशोधरॆ - सखि
ex-f-q2: शुद्धोदन - बुद्धन मग
ex-f-q3: अंबिकॆ - राज
