ex-f-q2: śuddhodana - buddhana maga
ex-f-q3: aṃbikè - rāja
ex-f-q4: rāhula - gautama buddha
ex-f-q5: siddhārtha - yuvarāṇi ṛ. ī kèḻagina padagaḻigè tadbhava padagaḻannu barèyiri. vinoda, duḥkha, rāja, kārya. è. ī padagaḻannu biḍisi saṃdhiyannu hèsarisi. ninnāṇma , cakrādhipati, harakèyanu, patiyòḍanè, iṃdaḻuta,
