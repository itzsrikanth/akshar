ex-d-q2: “ammāji, ninagè bhaya beḍamma nā maraḻi bahènamma”
ex-d-q3: “ninna vidhi kèṭṭudèṃdèṇisadiru ammāji”
ex-d-q4: “niddèyali muḻugalinnāva kanasina mòsaḻè hiḍiyuvudo”
