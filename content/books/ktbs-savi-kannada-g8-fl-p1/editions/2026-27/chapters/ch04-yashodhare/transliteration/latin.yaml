ex-a-q1: yaśodharè mattòmmè yārannu nīḍabekèṃdu rājanalli beḍuttāḻè?
ex-a-q2: taṃdèyannu karètaralu hoguvènèṃdu heḻidavarāru?
ex-a-q3: rājanigè kanasina vicāravannu tiḻisidavarāru?
ex-a-q4: saṃpradāyakkè viruddhavādaddu yāvudu?
ex-a-q5: īga nīniruva rīti yāvudèṃdu yaśodharèyannu rāja keḻidanu?
ex-b-q1: rājanannu pīṭhadalli kuḻḻirisi yaśodharè enèṃdu vinaṃtisuttāḻè?
ex-b-q2: yaśodharè maṃḍiyūri namaskarisuttā enu heḻuttāḻè?
ex-b-q3: rājanu īga nīniruva rīti sanyāsavallavè ènnalu kāraṇavenu?
ex-b-q4: yaśodharèya āṃtaryadalliruva saṃdehavenu?
ex-c-q1: behinavarannu kaḻisuva vicāradalli rāhulana abhiprāyavenu?
ex-c-q2: yaśodharèya vidhiya baggè rājanu enèṃdu heḻidanu?
