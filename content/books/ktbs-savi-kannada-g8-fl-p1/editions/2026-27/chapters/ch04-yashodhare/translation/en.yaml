intro-1: Among Kannada literary forms, drama is one. 'Among poems, drama is delightful.' Acting, scenery, dialogue and music captivate the audience. Historical plays introduce great figures and reflect social systems of their time. In this spirit the play portrays prince Siddhartha of Kapilavastu leaving the kingdom by night to become the Buddha, and the fear, anxiety and turmoil of his wife Yashodhara.
story-d1: Mother, I have come.
ex-a-q1: Whom does Yashodhara beg the king to give once more?
