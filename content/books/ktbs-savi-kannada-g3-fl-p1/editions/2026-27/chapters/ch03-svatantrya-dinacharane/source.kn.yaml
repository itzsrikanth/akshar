labels:
  title: ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ
  competency: ಸಾಮರ್ಥ್ಯ
  intro: ಪ್ರವೇಶ
  story: ಪಾಠ
  vocab: ಪದಗಳ ಅರ್ಥ
  notes: ಟಿಪ್ಪಣಿ
  exercise-A: ಅಭ್ಯಾಸ ಅ — ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸು.
  exercise-B: ಅಭ್ಯಾಸ ಆ — ಎರಡು/ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸು.
  exercise-C: ಅಭ್ಯಾಸ ಇ — ಕಾರಣ ಕೊಡು.
  exercise-D: ಅಭ್ಯಾಸ ಈ — ಈ ಮಾತುಗಳನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು? ಎಂದು ಬರೆ.
  exercise-E: ಅಭ್ಯಾಸ ಉ — ಈ ಪದಗಳನ್ನು ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸು.
  exercise-F: ಸಾಮರ್ಥ್ಯಾಧಾರಿತ ಅಭ್ಯಾಸ ಅ — ಸರಿ-ತಪ್ಪು ಗುರುತಿಸು.
  exercise-G: ಸಾಮರ್ಥ್ಯಾಧಾರಿತ ಅಭ್ಯಾಸ ಆ — ಉತ್ತರಿಸು.
  exercise-H: ಸಾಮರ್ಥ್ಯಾಧಾರಿತ ಅಭ್ಯಾಸ ಇ
  exercise-I: ಭಾಷಾಭ್ಯಾಸ ಅ
  exercise-J: ಭಾಷಾಭ್ಯಾಸ ಆ
  exercise-K: ಭಾಷಾ ಚಟುವಟಿಕೆ ಅ
  exercise-L: ಭಾಷಾ ಚಟುವಟಿಕೆ ಆ
segments:
- id: competency
  type: competency
  text: ತರಗತಿಯಲ್ಲಿ ನಡೆಯುವ ಸಂವಾದದಲ್ಲಿ ಭಾಗವಹಿಸುವುದು. ಗುಂಪಿನಲ್ಲಿ ಮಾತನಾಡುವಾಗ ಸರದಿಯನ್ನು ಅನುಸರಿಸುವುದು.
- id: intro-1
  type: prose
  text: ನಾವು ಹಬ್ಬಗಳನ್ನು ಆಚರಿಸುತ್ತೇವೆ. ಹಬ್ಬ ಆಚರಿಸಲು ಕೆಲವು ಸಿದ್ಧತೆಗಳು ಬೇಕು.
  section: intro
- id: intro-2
  type: prose
  text: ಎಲ್ಲ ಸಿದ್ಧತೆಗಳನ್ನು ಒಬ್ಬರೇ ಮಾಡಬೇಕಾದರೆ ತೊಂದರೆ ಅಲ್ಲವೇ? ಹಾಗಾದರೆ ಆ ತೊಂದರೆ ನಿವಾರಿಸಲು ಏನು ಮಾಡಬೇಕು ಎಂಬ ಕುತೂಹಲವೇ?
  section: intro
- id: intro-3
  type: prose
  text: ಶಾಲೆಯಲ್ಲಿ ಗುರುಗಳು ಹಾಗೂ ವಿದ್ಯಾರ್ಥಿಗಳು ಅನುಸರಿಸಿದ ಕ್ರಮವನ್ನು ಗಮನಿಸಿ ತಿಳಿ.
  section: intro
- id: story-n1
  type: prose
  text: ಬಿಡುವಿನ ಸಮಯ. ಮುಖ್ಯ ಗುರುಗಳು ಶಾಲಾ ವಿದ್ಯಾರ್ಥಿ ಮಂತ್ರಿಮಂಡಲದ ಸಭೆ ಕರೆದರು. ಮಂತ್ರಿಗಳು ಸಭೆಗೆ ಬಂದರು.
  section: story
- id: story-d1
  type: dialogue
  text: ಮಕ್ಕಳೇ, ಇದು ಆಗಸ್ಟ್ ತಿಂಗಳು. ಈ ತಿಂಗಳಲ್ಲಿ ಆಚರಿಸುವ ರಾಷ್ಟ್ರೀಯ ಹಬ್ಬ ಯಾವುದು? ನೀ ಹೇಳಬಲ್ಲೆಯಾ ರಾಜು?
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d2
  type: dialogue
  text: ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ ಸರ್.
  section: story
  speaker: ಎಲ್ಲರೂ
- id: story-d3
  type: dialogue
  text: ಹೀಗೆ ಎಲ್ಲರೂ ಒಟ್ಟಾಗಿ ಮಾತನಾಡಬಾರದು. ಸರದಿ ಅನುಸರಿಸಬೇಕು ತಿಳಿಯಿತೇ? ಸರಿ, ರಾಜು ನೀನು ಹೇಳು, ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ ಎಂದರೇನು?
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d4
  type: dialogue
  text: ನಮ್ಮ ದೇಶ ಸ್ವತಂತ್ರವಾದ ದಿನದ ನೆನಪಿಗಾಗಿ ಪ್ರತಿ ವರ್ಷ ದೇಶದಾದ್ಯಂತ ಆಚರಿಸುವ ಹಬ್ಬ.
  section: story
  speaker: ರಾಜು (ಮುಖ್ಯಮಂತ್ರಿ)
- id: story-d5
  type: dialogue
  text: ಸ್ವತಂತ್ರವಾದ ದಿನ! ಹಾಗೆಂದರೇನು ಸರ್?
  section: story
  speaker: ಮೇರಿ (ಆರೋಗ್ಯ ಮಂತ್ರಿ)
- id: story-d6
  type: dialogue
  text: ಹಿಂದೆ ನಮ್ಮ ದೇಶವನ್ನು ಬ್ರಿಟಿಷರು ಆಳುತ್ತಿದ್ದರು. ದೇಶದ ಸ್ವಾಭಿಮಾನಿ ಜನರು ಗಾಂಧೀಜಿಯವರ ನೇತೃತ್ವದಲ್ಲಿ ಅವರ ವಿರುದ್ಧ ಹೋರಾಡಿ
    ಸ್ವಾತಂತ್ರ್ಯ ತಂದುಕೊಟ್ಟರು. ಅವರ ದೇಶಾಭಿಮಾನ, ತ್ಯಾಗ ಹಾಗೂ ಬಲಿದಾನದಿಂದ 1947 ಆಗಸ್ಟ್ 15 ರಂದು ನಮ್ಮ ದೇಶ ಸ್ವತಂತ್ರವಾಯಿತು. ದೇಶ
    ಸ್ವತಂತ್ರವಾದ ಸವಿ ನೆನಪಿಗೆ ಪ್ರತಿ ವರ್ಷ ದೇಶಾದ್ಯಂತ ಆಚರಿಸುವ ಹಬ್ಬವೇ ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆ.
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d7
  type: dialogue
  text: ನಮ್ಮ ಶಾಲೆಯಲ್ಲೂ ಆಚರಿಸುತ್ತೇವಲ್ಲ ಸರ್?
  section: story
  speaker: ಷರೀಫ್ (ಉಪ ಮುಖ್ಯಮಂತ್ರಿ)
- id: story-d8
  type: dialogue
  text: ಹೌದು, ಅದಕ್ಕಾಗಿ ಈಗಿನಿಂದಲೇ ಸಿದ್ಧತೆ ಮಾಡಿಕೊಳ್ಳಬೇಕು.
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d9
  type: dialogue
  text: ಏನೇನು ಸಿದ್ಧತೆ ಮಾಡಬೇಕಿದೆ? ಹೇಳಿ ಸರ್.
  section: story
  speaker: ಷಾಹಿನ್ (ಗೃಹ ಮಂತ್ರಿ)
- id: story-d10
  type: dialogue
  text: ಆಟೋಟ ಸ್ಪರ್ಧೆ ಏರ್ಪಡಿಸಬೇಕು. ಸಾಂಸ್ಕೃತಿಕ ಕಾರ್ಯಕ್ರಮ ನಡೆಸಿಕೊಡುವವರನ್ನು ಗುರುತಿಸಬೇಕು. ಮೈದಾನವನ್ನು ಸ್ವಚ್ಛಗೊಳಿಸಬೇಕು.
    ಶಾಲೆಯನ್ನು ತಳಿರು ತೋರಣಗಳಿಂದ ಅಲಂಕರಿಸಬೇಕು.
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d11
  type: dialogue
  text: ಗುರುಗಳೇ, ನಾವು ಕೆಲಸ ಹಂಚಿಕೊಂಡು ಸಿದ್ಧತೆ ಮಾಡುತ್ತೇವೆ.
  section: story
  speaker: ಐಶ್ವರ್ಯ (ಸಂಸ್ಕೃತಿ ಮಂತ್ರಿ)
- id: story-d12
  type: dialogue
  text: ಸಂತೋಷ. ಯಾರು ಯಾರು, ಯಾವ ಯಾವ ಕೆಲಸಗಳನ್ನು ಹಂಚಿಕೊಳ್ಳುವಿರಿ?
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d13
  type: dialogue
  text: ಸರ್, ಮಂತ್ರಿ ಮಂಡಲದ ಎಲ್ಲ ಸದಸ್ಯರು ಸೇರಿ ಆಟೋಟ ಸ್ಪರ್ಧೆ ನಡೆಸಿ ವಿಜೇತರ ಪಟ್ಟಿಯನ್ನು ಸಿದ್ಧಪಡಿಸುತ್ತೇವೆ.
  section: story
  speaker: ವಿವೇಕ್ (ಕ್ರೀಡಾ ಮಂತ್ರಿ)
- id: story-n2
  type: prose
  text: (ಷಾಹಿನ್ ಮತ್ತು ಐಶ್ವರ್ಯ ಮಾತನಾಡುತ್ತಿದ್ದರು)
  section: story
- id: story-d14
  type: dialogue
  text: ಷಾಹಿನ್, ಐಶ್ವರ್ಯ ಒಬ್ಬರು ಮಾತಾಡುವಾಗ ನಿಮ್ಮ ನಿಮ್ಮೊಳಗೆ ಮಾತಾಡಬಾರದು. ಇತರರ ಅಭಿಪ್ರಾಯವನ್ನು ಕೇಳಿಸಿಕೊಳ್ಳಬೇಕು.
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d15
  type: dialogue
  text: ಕ್ಷಮಿಸಿ ಸರ್, ಇನ್ನು ಮೇಲೆ ಗಮನವಿಟ್ಟು ಕೇಳುತ್ತೇವೆ.
  section: story
  speaker: ಐಶ್ವರ್ಯ (ಸಂಸ್ಕೃತಿ ಮಂತ್ರಿ)
- id: story-d16
  type: dialogue
  text: ಹ್ಞಾ! ಜಾಣ ಮಕ್ಕಳು.
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d17
  type: dialogue
  text: ಸರ್, ನಾವು ನಾಲ್ಕನೆಯ ತರಗತಿಯವರು ಶಾಲೆಯ ಮೈದಾನವನ್ನು ಸ್ವಚ್ಛಗೊಳಿಸುತ್ತೇವೆ.
  section: story
  speaker: ಕಾರ್ತಿಕ್ (ಪೌರಾಡಳಿತ ಮಂತ್ರಿ)
- id: story-d18
  type: dialogue
  text: ನಾನು ಸಾಂಸ್ಕೃತಿಕ ಕಾರ್ಯಕ್ರಮ ನೀಡುವವರ ಪಟ್ಟಿ ಸಿದ್ಧಪಡಿಸುತ್ತೇನೆ.
  section: story
  speaker: ಐಶ್ವರ್ಯ (ಸಂಸ್ಕೃತಿ ಮಂತ್ರಿ)
- id: story-d19
  type: dialogue
  text: ನಾವು ಎರಡನೆಯ ತರಗತಿಯವರು ಬಣ್ಣದ ಕಾಗದದಿಂದ ತೋರಣ ಕಟ್ಟುತ್ತೇವೆ.
  section: story
  speaker: ಮೇರಿ (ಆರೋಗ್ಯ ಮಂತ್ರಿ)
- id: story-d20
  type: dialogue
  text: ನಾವು ಮೂರನೆಯ ತರಗತಿಯವರು ಧ್ವಜಸ್ತಂಭವನ್ನು ಸಿಂಗರಿಸುತ್ತೇವೆ ಸರ್.
  section: story
  speaker: ಪಂಕಜ (ಹಣಕಾಸು ಮಂತ್ರಿ)
- id: story-d21
  type: dialogue
  text: ಧ್ವಜ ಸ್ತಂಭದ ಸುತ್ತ ರಂಗವಲ್ಲಿ ಹಾಕಿದರೆ ಚೆನ್ನಾಗಿರುತ್ತದೆ.
  section: story
  speaker: ಐಶ್ವರ್ಯ (ಸಂಸ್ಕೃತಿ ಮಂತ್ರಿ)
- id: story-d22
  type: dialogue
  text: ಒಳ್ಳೆಯ ಸಲಹೆ, ಪಂಕಜ ಚೆನ್ನಾಗಿ ರಂಗವಲ್ಲಿ ಹಾಕುತ್ತಾಳೆ. ಅವಳಿಂದ ಹಾಕಿಸೋಣವೇ ಸರ್?
  section: story
  speaker: ಮೇರಿ (ಆರೋಗ್ಯ ಮಂತ್ರಿ)
- id: story-d23
  type: dialogue
  text: ಒಳ್ಳೆಯದು, ಮೇರಿಯ ಸಲಹೆ ಎಲ್ಲರಿಗೂ ಒಪ್ಪಿಗೆಯೇ?
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d24
  type: dialogue
  text: ಓ.... ಆಗಬಹುದು ಸರ್.
  section: story
  speaker: ಎಲ್ಲರೂ
- id: story-d25
  type: dialogue
  text: ಅಲಂಕಾರಕ್ಕೆ ಸಾಮಗ್ರಿಗಳನ್ನು ತರುವವರು ಯಾರು?
  section: story
  speaker: ಕಾರ್ತಿಕ್ (ಪೌರಾಡಳಿತ ಮಂತ್ರಿ)
- id: story-d26
  type: dialogue
  text: ನಮ್ಮ ತೋಟದಿಂದ ಮಾವಿನ ತಳಿರು, ಬಾಳೆಕಂಬ ತರುತ್ತೇನೆ. ಎಲ್ಲರೂ ಸೇರಿ ಶಾಲೆಯನ್ನು ಸಿಂಗರಿಸೋಣ.
  section: story
  speaker: ರಾಜು (ಮುಖ್ಯಮಂತ್ರಿ)
- id: story-d27
  type: dialogue
  text: ನಾವು ಐದನೆಯ ತರಗತಿಯವರು ರಾಷ್ಟ್ರ ನಾಯಕರ ಭಾವ ಚಿತ್ರಗಳಿಗೆ ಹೂವಿನ ಹಾರ ಹಾಕಿ ಅಲಂಕರಿಸುತ್ತೇವೆ. ಸರ್ ಮತ್ತೇ... (ಮಾತು ಮುಂದುವರಿಸುವಳು)
  section: story
  speaker: ಐಶ್ವರ್ಯ (ಸಂಸ್ಕೃತಿ ಮಂತ್ರಿ)
- id: story-d28
  type: dialogue
  text: ಐಶ್ವರ್ಯಾ, ಇತರರಿಗೂ ಮಾತನಾಡಲು ಅವಕಾಶ ಕೊಡಬೇಕಲ್ಲವೇ?
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-d29
  type: dialogue
  text: ನಾನು ಒಂದನೆಯ ತರಗತಿಯವರೊಡನೆ ಸೇರಿ ಶಾಲಾ ಕೈತೋಟದಿಂದ ಹೂಗಳನ್ನು ಬಿಡಿಸಿ ತರುತ್ತೇನೆ.
  section: story
  speaker: ರಮಾ (ವಿದ್ಯಾ ಮಂತ್ರಿ)
- id: story-d30
  type: dialogue
  text: ಸರಿ, ಹಾಗಾದರೆ ನಾನು ಕಾರ್ಯಕ್ರಮಕ್ಕೆ ಬರುವಂತೆ ಅತಿಥಿಗಳನ್ನು ಆಮಂತ್ರಿಸುತ್ತೇನೆ. ನಿಮ್ಮ ಕೆಲಸಗಳಲ್ಲಿ ಶಿಕ್ಷಕರು ಮಾರ್ಗದರ್ಶನ
    ನೀಡುತ್ತಾರೆ. ಮುಂದಿನ ಸಿದ್ಧತೆ ಮಾಡಿಕೊಳ್ಳಿ.
  section: story
  speaker: ಮುಖ್ಯ ಗುರುಗಳು
- id: story-n3
  type: prose
  text: (ಎಲ್ಲರೂ ಶಿಕ್ಷಕರ ಮಾರ್ಗದರ್ಶನದಲ್ಲಿ ತಮ್ಮ ಕೆಲಸಕ್ಕೆ ಪೂರ್ವ ತಯಾರಿ ಮಾಡಿಕೊಂಡರು.)
  section: story
- id: story-n4
  type: prose
  text: ಸ್ವಾತಂತ್ರ್ಯ ದಿನಾಚರಣೆಯ ದಿನದಂದು ಮಕ್ಕಳು ನಸುಕಿನಲ್ಲಿಯೇ ಎದ್ದು ಸಿದ್ಧರಾದರು. ಸಮವಸ್ತ್ರ ಧರಿಸಿ ಶಾಲೆಗೆ ಬಂದರು.
  section: story
- id: story-n5
  type: prose
  text: ಎಲ್ಲರೂ ತಾವು ವಹಿಸಿಕೊಂಡಿದ್ದ ಕೆಲಸವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿದರು. ಗುರುಗಳೊಂದಿಗೆ ಜಯಘೋಷ ಹಾಕುತ್ತ ಪ್ರಭಾತಫೇರಿಯಲ್ಲಿ ಪಾಲ್ಗೊಂಡರು.
    ಮಕ್ಕಳ ಶಿಸ್ತನ್ನು ನೋಡಿ ಗ್ರಾಮಸ್ಥರು ಸಂತೋಷಪಟ್ಟರು.
  section: story
- id: story-n6
  type: prose
  text: ಶಾಲಾ ಮೈದಾನದಲ್ಲಿ ಪಂಚಾಯಿತಿ ಅಧ್ಯಕ್ಷರು ಧ್ವಜಾರೋಹಣ ಮಾಡಿದರು. ಎಲ್ಲರೂ ರಾಷ್ಟ್ರಗೀತೆ ಹಾಡಿದರು. ಅನಂತರ ನಡೆದ ಸಭಾ ಕಾರ್ಯಕ್ರಮದಲ್ಲಿ
    ಮುಖ್ಯ ಗುರುಗಳು ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟಗಾರರ ತ್ಯಾಗ ಮತ್ತು ದೇಶಭಕ್ತಿಯ ಕುರಿತು ಮಾತನಾಡಿದರು.
  section: story
- id: story-n7
  type: prose
  text: ಆಟೋಟ ಸ್ಪರ್ಧೆಯಲ್ಲಿ ವಿಜೇತರಾದವರಿಗೆ ಮುಖ್ಯ ಅತಿಥಿಗಳು ಬಹುಮಾನ ವಿತರಿಸಿದರು. ಕೊನೆಯಲ್ಲಿ ಮಕ್ಕಳು ಸಾಂಸ್ಕೃತಿಕ ಕಾರ್ಯಕ್ರಮ
    ನಡೆಸಿಕೊಟ್ಟರು. ನೆರೆದಿದ್ದ ಜನರು ಸಂತೋಷದಿಂದ ಚಪ್ಪಾಳೆ ತಟ್ಟಿದರು. ಎಲ್ಲರೂ ಸಿಹಿ ಸವಿದು ಕಾರ್ಯಕ್ರಮ ಮೆಲುಕು ಹಾಕುತ್ತಾ ತೆರಳಿದರು.
  section: story
