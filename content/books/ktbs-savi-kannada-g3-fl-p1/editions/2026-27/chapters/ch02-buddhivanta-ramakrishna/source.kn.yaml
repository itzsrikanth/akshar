segments:
  - id: intro-1
    type: prose
    section: intro
    text: ನೀನು ಓದಿರುವ ಕಥೆ, ಕವನ, ಚುಟುಕು ಅಥವಾ ನಗೆಹನಿಗಳಲ್ಲಿ ಯಾವುದಾದರೊಂದನ್ನು ತರಗತಿಯಲ್ಲಿ ಹೇಳು.
  - id: story-n1
    type: prose
    section: story
    text: ಒಂದು ಸಲ ವಿದ್ಯಾಸಾಗರನೆಂಬ ಮಹಾನ್ ಪಂಡಿತ ಕೃಷ್ಣದೇವರಾಯನ ಆಸ್ಥಾನಕ್ಕೆ ಬಂದನು. ಅವನ ಖ್ಯಾತಿ ಎಲ್ಲ ಕಡೆ ಹಬ್ಬಿತ್ತು. ಸಂಸ್ಕೃತದಲ್ಲಿ ಅವನು ಮಹಾಮೇಧಾವಿಯಾಗಿದ್ದನು. ವಿದ್ಯಾಭಿಮಾನಿಯಾದ ಕೃಷ್ಣದೇವರಾಯ ಅವನನ್ನು ಸ್ವಾಗತಿಸಿ ಸತ್ಕರಿಸಿದನು.
  - id: story-n2
    type: prose
    section: story
    text: “ಮಹಾಪ್ರಭು ನಾನು ನಿಮ್ಮ ಆಸ್ಥಾನದ ಪಂಡಿತರೊಡನೆ ವಾದ ಮಾಡಲು ಬಂದಿದ್ದೇನೆ” ಎಂದನು ವಿದ್ಯಾಸಾಗರ. ಕೃಷ್ಣದೇವರಾಯ ಅದಕ್ಕೊಪ್ಪಿ ತನ್ನ ಆಸ್ಥಾನದ ಪಂಡಿತರ ಕಡೆ ನೋಡಿದ. ಅವರಾರೂ ವಾದ ಮಾಡಲು ಆಸಕ್ತಿ ತೋರಿಸಲಿಲ್ಲ.
  - id: story-n3
    type: prose
    section: story
    text: ಎಲ್ಲರೂ ಮೌನವಾಗಿರುವುದನ್ನು ಕಂಡ ವಿದ್ಯಾಸಾಗರ “ಇಂಥ ದೊಡ್ಡ ರಾಜನ ಆಸ್ಥಾನದಲ್ಲಿ ನನ್ನನ್ನು ಸೋಲಿಸುವ ಒಬ್ಬ ಪಂಡಿತನೂ ಇಲ್ಲವೆನ್ನುವುದು ಬೇಸರದ ಸಂಗತಿ. ಈ ವಿಷಯ ಮೊದಲೇ ತಿಳಿದಿದ್ದರೆ ನಾನು ಇಲ್ಲಿಗೆ ಬರುತ್ತಲೇ ಇರಲಿಲ್ಲ” ಎಂದನು.
  - id: story-n4
    type: prose
    section: story
    text: ಆಗ ತೆನಾಲಿರಾಮಕೃಷ್ಣ ಎದ್ದು ನಿಂತು “ಇಷ್ಟು ಬೇಗನೆ ನೀವು ಈ ತೀರ್ಮಾನಕ್ಕೆ ಬರಬೇಡಿ” ಎಂದನು. ವಿದ್ಯಾಸಾಗರ ಅವನತ್ತ ನೋಡಿ, “ನೀವು ಯಾರು?” ಎಂದು ಕೇಳಿದನು. “ನಾನು ಒಂದೆರಡು ಗ್ರಂಥಗಳನ್ನು ಬರೆದಿದ್ದೇನೆ. ನನ್ನನ್ನು ತೆನಾಲಿ ರಾಮಕೃಷ್ಣ ಎನ್ನುತ್ತಾರೆ” ಎಂದನು.
  - id: story-n5
    type: prose
    section: story
    text: ವಿದ್ಯಾಸಾಗರನ ಮುಖ ಅರಳಿತು. “ಹೌದೇನು? ನಾನು ನಿಮ್ಮ ಬುದ್ಧಿವಂತಿಕೆ ಬಗ್ಗೆ ಕೇಳಿದ್ದೇನೆ. ಆದರೆ ಬುದ್ಧಿಚಾತುರ್ಯಕ್ಕಿಂತ ಮುಖ್ಯವಾಗಿ ಆಳವಾದ ಅಧ್ಯಯನ ಮಾಡಿದವರು ಮಾತ್ರ ನನ್ನೊಂದಿಗೆ ವಾದ ಮಾಡಲು ಸಾಧ್ಯ” ಎಂದನು.
  - id: story-n6
    type: prose
    section: story
    text: “ಅದು ನನಗೂ ತಿಳಿದಿದೆ. ನೀವು ಯಾವ ಗ್ರಂಥದ ಮೇಲೆ ವಾದ ಮಾಡುತ್ತೀರಿ?” ಪ್ರಶ್ನಿಸಿದ ರಾಮಕೃಷ್ಣ. ಇದಕ್ಕೆ ವಿದ್ಯಾಸಾಗರ “ನಿಮಗೆ ಇಷ್ಟವಾದ ಯಾವುದೇ ಸಂಸ್ಕೃತ ಗ್ರಂಥವಾಗಬಹುದು” ಎಂದನು.
  - id: story-n7
    type: prose
    section: story
    text: “ಹಾಗಾದರೆ ನಾಳೆ ಸಂಜೆ ಇದೇ ಹೊತ್ತಿಗೆ ನಿಮ್ಮೊಂದಿಗೆ ವಾದ ಮಾಡಲು ಸಿದ್ಧನಾಗಿ ಬರುತ್ತೇನೆ” ಎಂದನು ರಾಮಕೃಷ್ಣ.
  - id: story-n8
    type: prose
    section: story
    text: ಮಾರನೆಯ ದಿನ ವಿದ್ಯಾಸಾಗರ ಹೆಮ್ಮೆಯಿಂದ ಆಸ್ಥಾನವನ್ನು ಪ್ರವೇಶಿಸಿ ತನ್ನ ಪೀಠದಲ್ಲಿ ಕುಳಿತನು. ಇವನೆಂಥ ವಾದ ಮಾಡುತ್ತಾನೆಂದು ಎಲ್ಲರೂ ಅಚ್ಚರಿಯಿಂದ ಕಾದು ಕುಳಿತಿದ್ದರು. ರಾಮಕೃಷ್ಣ ಸ್ವಲ್ಪ ಹೊತ್ತಿನ ಅನಂತರ ಬಟ್ಟೆಯಲ್ಲಿ ಸುತ್ತಿದ ಕಟ್ಟನ್ನು ಸೇವಕನ ಹತ್ತಿರ ಹಿಡಿಸಿಕೊಂಡು ಸಭೆಗೆ ಬಂದನು. ಆ ಕಟ್ಟಿನಲ್ಲಿ ಏನಿದೆಯೆಂದು ಯಾರಿಗೂ ಊಹೆ ಮಾಡಲಾಗಲಿಲ್ಲ.
  - id: story-n9
    type: prose
    section: story
    text: ರಾಮಕೃಷ್ಣ ತನ್ನ ಪೀಠದಲ್ಲಿ ಕುಳಿತು ವಿದ್ಯಾಸಾಗರನಿಗೆ ಹೇಳಿದನು. “ನಾನು ಸಿದ್ಧನಾಗಿದ್ದೇನೆ ಸ್ವಾಮಿ.” “ನಾನೂ ಸಿದ್ಧ. ಪ್ರಾರಂಭಿಸೋಣ” ಎಂದನು ವಿದ್ಯಾಸಾಗರ. “ವಾದಕ್ಕೆ ಯಾವುದೇ ಗ್ರಂಥವನ್ನು ನಾನು ಆರಿಸಿಕೊಳ್ಳಬಹುದೆಂದು ತಾವು ಹೇಳಿದ್ದಿರಿ” ಎಂದನು ರಾಮಕೃಷ್ಣ. ಇದಕ್ಕೆ ವಿದ್ಯಾಸಾಗರ “ಹೌದು! ಯಾವುದನ್ನು ಬೇಕಾದರೂ ಆರಿಸಿಕೊಳ್ಳಿ” ಎಂದನು.
  - id: story-n10
    type: prose
    section: story
    text: ರಾಮಕೃಷ್ಣ ತನ್ನ ಎದುರಿಗಿದ್ದ ಕಟ್ಟನ್ನು ತೋರಿಸಿ “ನಾನು ಈಗ ಈ ‘ತಿಲಕಾಷ್ಠಮಹಿಷಬಂಧನ’ದ ಮೇಲೆ ವಾದ ಮಾಡುತ್ತೇನೆ. ಆರಂಭಿಸಲೇ?” ಎಂದನು. ‘ತಿಲಕಾಷ್ಠಮಹಿಷಬಂಧನ!’ ವಿದ್ಯಾಸಾಗರ ಕಣ್ಣರಳಿಸಿ “ಅದು...! ಅದು...!” ಎಂದು ತೊದಲಿದನು.
  - id: story-n11
    type: prose
    section: story
    text: “ಏಕೆ? ನಿಮಗೆ ‘ತಿಲಕಾಷ್ಠಮಹಿಷಬಂಧನ’ ತಿಳಿದಿಲ್ಲವೆ? ಇದು ನಮ್ಮೂರಿನಲ್ಲಿ ದನ ಕಾಯುವ ಹುಡುಗರಿಗೂ ಗೊತ್ತು” ಎಂದು ಹೆಮ್ಮೆಯಿಂದ ಹೇಳಿದನು ರಾಮಕೃಷ್ಣ.
  - id: story-n12
    type: prose
    section: story
    text: ವಿದ್ಯಾಸಾಗರ ತಲೆ ಕೆರೆದುಕೊಂಡನು. ಮುಖ ಮಂಕಾಯಿತು. ಎಷ್ಟು ಯೋಚಿಸಿದರೂ ತಿಲಕಾಷ್ಠಮಹಿಷಬಂಧನ ಗ್ರಂಥ ಅವನ ನೆನಪಿಗೆ ಬರಲಿಲ್ಲ. ‘ಇದೊಂದು ಹೇಗೆ ನನ್ನ ಕಣ್ಣು ತಪ್ಪಿಸಿಕೊಂಡಿತು’ ಎಂದು ಅವನು ಪೇಚಾಡಿಕೊಂಡನು.
  - id: story-n13
    type: prose
    section: story
    text: “ಮಹಾಪ್ರಭು, ಏಕೋ ನನ್ನ ದೇಹಾರೋಗ್ಯ ಸರಿಯಿಲ್ಲ. ವಾದವನ್ನು ನಾಳೆ ಆರಂಭಿಸಲು ಅಪ್ಪಣೆ ಕೊಡಿ” ಎಂದು ವಿದ್ಯಾಸಾಗರನು ಮಹಾರಾಜನನ್ನು ಬೇಡಿಕೊಂಡನು. “ಆಗಬಹುದು” ರಾಜ ಅಪ್ಪಣೆ ಕೊಟ್ಟನು. ತಕ್ಷಣ ವಿದ್ಯಾಸಾಗರ ಜಾಗ ಖಾಲಿ ಮಾಡಿದನು. ರಾಮಕೃಷ್ಣನೂ ಏನೂ ಮಾತನಾಡದೆ ಮನೆಗೆ ಹೋದನು.
  - id: story-n14
    type: prose
    section: story
    text: ಮರುದಿನ ಅದೇ ಸಮಯಕ್ಕೆ ಅದೇ ಕಟ್ಟನ್ನು ತೆಗೆದುಕೊಂಡು ರಾಮಕೃಷ್ಣ ಗಂಭೀರವಾಗಿ ಸಭೆಗೆ ಬಂದನು. ಆದರೆ ಬಹಳ ಹೊತ್ತಾದರೂ ವಿದ್ಯಾಸಾಗರ ಬರಲೇ ಇಲ್ಲ. ಅವನನ್ನು ಕರೆತರಲು ಆಳುಗಳು ಹೋದರು. ಆದರೆ ವಿದ್ಯಾಸಾಗರ ರಾತ್ರೋರಾತ್ರಿ ಅಲ್ಲಿಂದ ಪಲಾಯನ ಮಾಡಿರುವ ವಿಷಯ ತಿಳಿಯಿತು.
  - id: story-n15
    type: prose
    section: story
    text: ಇಡೀ ಸಭೆ ರಾಮಕೃಷ್ಣನಿಗೆ ಜಯಕಾರ ಹಾಕಿತು. “ನಿನ್ನಿಂದ ನನ್ನ ಆಸ್ಥಾನದ ಮರ್ಯಾದೆ ಉಳಿಯಿತು. ನಾನೂ ‘ತಿಲಕಾಷ್ಠಮಹಿಷಬಂಧನ’ ಎಂಬ ಗ್ರಂಥವನ್ನು ಕೇಳಿಯೇ ಇಲ್ಲ. ಎಲ್ಲಿ ಅದನ್ನು ಕೊಡು ನೋಡೋಣ” ಎಂದು ಕೃಷ್ಣದೇವರಾಯನು ಮೆಚ್ಚುಗೆಯಿಂದ ನುಡಿದನು.
  - id: story-n16
    type: prose
    section: story
    text: ರಾಮಕೃಷ್ಣನು ಕಟ್ಟನ್ನು ಬಿಚ್ಚಿದನು. ಅದರಲ್ಲಿ ಒಂದಷ್ಟು ಕಟ್ಟಿಗೆಗಳನ್ನು ಒಂದು ಹಗ್ಗದಿಂದ ಕಟ್ಟಲಾಗಿತ್ತು. ರಾಜ ಆಶ್ಚರ್ಯದಿಂದ “ಇದೇನಿದು?” ಎಂದನು.
  - id: story-n17
    type: prose
    section: story
    text: ಆಗ ರಾಮಕೃಷ್ಣನು “ಇದು ಎಳ್ಳಿನ ಕಡ್ಡಿಗಳು, ಅಂದರೆ ತಿಲಕಾಷ್ಠ. ಇದು ಎಮ್ಮೆ ಕಟ್ಟುವ ಹಗ್ಗ. ಅಂದರೆ ಮಹಿಷಬಂಧನ. ಅದೇ ‘ತಿಲಕಾಷ್ಠಮಹಿಷಬಂಧನ’. ಇದಾವುದೋ ಮಹಾಗ್ರಂಥವಿರಬೇಕೆಂದು ಹೆದರಿ ಪಾಪ ವಿದ್ಯಾಸಾಗರ ಓಡಿಹೋದನು” ಎಂದನು.
  - id: story-n18
    type: prose
    section: story
    text: ಎಲ್ಲರ ನಗು ಬಹಳ ಹೊತ್ತು ಸಭಾಸ್ಥಾನವನ್ನು ತುಂಬಿತು. ರಾಮಕೃಷ್ಣನ ಬುದ್ಧಿವಂತಿಕೆಯನ್ನು ಮೆಚ್ಚಿದ ಕೃಷ್ಣದೇವರಾಯ ಅವನನ್ನು ಸನ್ಮಾನಿಸಿದನು.
  - id: intro-2
    type: prose
    section: intro
    text: ವಿದ್ಯೆ ವಿನಯವನ್ನು ಕಲಿಸುತ್ತದೆ. ಬುದ್ಧಿ ವಿವೇಕವನ್ನು ಕಲಿಸುತ್ತದೆ.
