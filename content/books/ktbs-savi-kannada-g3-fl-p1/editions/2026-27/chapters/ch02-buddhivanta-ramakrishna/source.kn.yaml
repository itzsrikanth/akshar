  exercise-B: ಅಭ್ಯಾಸ ಆ — ಎರಡು/ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ
  exercise-C: ಅಭ್ಯಾಸ ಇ — ಕೊಟ್ಟಿರುವ ಮಾತನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು?
