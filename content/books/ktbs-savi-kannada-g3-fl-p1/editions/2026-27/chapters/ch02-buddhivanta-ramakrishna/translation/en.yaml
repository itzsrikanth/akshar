intro-1: Tell the class a story, poem, short verse or joke that you have read.
story-n1: Once, a great scholar named Vidyasagara came to Krishnadevaraya's court. His fame had spread everywhere. He was a brilliant Sanskrit scholar. Krishnadevaraya, who valued learning, welcomed him and treated him with honour.
story-n2: '“Your Majesty, I have come to debate with the scholars of your court,” said Vidyasagara. Krishnadevaraya agreed and looked towards his court scholars. None of them showed any interest in debating.'
story-n3: 'Seeing everyone remain silent, Vidyasagara said, “It is a pity that not even one scholar in such a great king’s court can defeat me. Had I known this earlier, I would never have come here.”'
story-n4: 'Then Tenali Ramakrishna stood up and said, “Do not come to that conclusion so quickly.” Vidyasagara looked at him and asked, “Who are you?” “I have written a book or two. I am called Tenali Ramakrishna,” he replied.'
story-n5: 'Vidyasagara’s face lit up. “Really? I have heard about your cleverness. But more than a quick wit, it takes deep study to be able to debate with me,” he said.'
story-n6: '“I know that too. Which book will you debate?” asked Ramakrishna. Vidyasagara replied, “It can be any Sanskrit book you like.”'
story-n7: '“Then I shall come prepared to debate with you at this same time tomorrow evening,” said Ramakrishna.'
story-n8: The next day, Vidyasagara proudly entered the court and took his seat. Everyone waited, wondering how he would debate. A little later, Ramakrishna arrived at the assembly with a servant carrying a bundle wrapped in cloth. Nobody could guess what was inside it.
story-n9: 'Ramakrishna sat down and told Vidyasagara, “I am ready, sir.” “So am I. Let us begin,” said Vidyasagara. “You said I could choose any book for the debate,” said Ramakrishna. Vidyasagara replied, “Yes! Choose whichever you wish.”'
story-n10: 'Pointing to the bundle in front of him, Ramakrishna said, “I shall now debate this ‘Tilakashtha Mahishabandhana’. Shall I begin?” ‘Tilakashtha Mahishabandhana!’ Vidyasagara’s eyes widened. “That…! That…!” he stammered.'
story-n11: '“Why? Have you not heard of ‘Tilakashtha Mahishabandhana’? Even the boys who look after cattle in our village know it,” said Ramakrishna proudly.'
story-n12: Vidyasagara scratched his head. His face fell. However hard he thought, he could not remember the book Tilakashtha Mahishabandhana. He worried, ‘How did this one escape my notice?’
story-n13: '“Your Majesty, for some reason I am not feeling well. Please allow us to begin the debate tomorrow,” Vidyasagara pleaded with the king. “Very well,” the king agreed. Vidyasagara left at once. Ramakrishna too went home without saying anything.'
story-n14: At the same time the next day, Ramakrishna came solemnly to the assembly carrying the same bundle. But even after a long wait, Vidyasagara did not arrive. Servants went to fetch him, only to discover that he had fled during the night.
story-n15: 'The whole assembly cheered Ramakrishna. “You have saved the honour of my court. I too have never heard of a book called ‘Tilakashtha Mahishabandhana’. Let me see it,” said Krishnadevaraya appreciatively.'
story-n16: 'Ramakrishna opened the bundle. Inside were some sticks tied with a rope. “What is this?” asked the king in surprise.'
story-n17: 'Ramakrishna explained, “These are sesame stalks, or tilakashtha. This is a rope used to tie a buffalo, or mahishabandhana. Together, they are ‘Tilakashtha Mahishabandhana’. Poor Vidyasagara was frightened that it must be some great book and ran away.”'
story-n18: Everyone's laughter filled the assembly hall for a long time. Impressed by Ramakrishna's cleverness, Krishnadevaraya honoured him.
intro-2: Learning teaches humility. Intelligence teaches good judgement.
vocab-satkarisu: Honour
vocab-satkarisu-def: Treat with care and hospitality
vocab-vaada: Debate
vocab-vaada-def: Discussion
vocab-pechaadu: Fret
vocab-pechaadu-def: Struggle in distress
vocab-appane: Permission
vocab-appane-def: Consent
vocab-pandita: Scholar
vocab-pandita-def: A learned person
vocab-peetha: Seat
vocab-peetha-def: A seat or throne
note-palaayana: Fleeing
note-palaayana-def: Leaving a place without telling anyone or being seen.
note-pakshapaati: A biased person
note-pakshapaati-def: Someone who treats one person differently from another and shows favouritism.
note-mukha-aralitu: The face lit up
note-mukha-aralitu-def: A smile filled the face, making the person's happiness clearly visible.
