poem-s1l1: A monkey came along
poem-s1l2: And brought a pot.॥
poem-s2l1: It went to the shop
poem-s2l2: And brought lentils and jaggery.॥
poem-s3l1: It put the pot on the stove
poem-s3l2: And made payasa, a sweet pudding.॥
poem-s4l1: There was no ladle,
poem-s4l2: So it dipped in its tail and stirred.॥
poem-s5l1: Its tail got burnt,
poem-s5l2: And it sat down crying.॥
ex-g-q1: Read the conversation and rewrite it as a story.
ex-g-p1: Soldier, I have come to see the prisoners in the jail.
ex-g-p2: As you command, my lord. Come this way. I shall show you each of them.
ex-g-p3: Who is this young man?
ex-g-p4: A criminal who arrived just yesterday, my lord.
ex-g-p5: Young man! What crime did you commit?
ex-g-p6: Sir! As I was walking along the street, I saw a piece of rope lying on the ground. Thinking that nobody wanted it, I picked it up and walked home.
ex-g-p7: What? Such a punishment for picking up a piece of rope?
ex-g-p8: Sir! Ask him what was at the end of the rope.
ex-g-p9: It was my bad luck, sir. A cow was tied to the end of the rope.
