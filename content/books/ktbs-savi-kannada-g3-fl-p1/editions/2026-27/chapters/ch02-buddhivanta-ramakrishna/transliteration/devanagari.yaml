ex-g-q1: संभाषणे ओदि, इदन्नु कथेय रूपदल्लि बरेयिरि
ex-g-p1: सैनिकरे, सेरेमनेयल्लिरुव खैदिगळन्नु नोडलु बंदिद्देने.
ex-g-p2: अप्पणे प्रभु, इत्त बन्नि. प्रतियोब्बरन्नू तोरिसुत्तेने.
ex-g-p3: ई युवक यारु?
ex-g-p4: निन्ने ताने बंद अपराधि, प्रभुगळे.
ex-g-p5: अय्या! नीनु माडिद अपराध एनु?
ex-g-p6: स्वामि! नानु बीदियल्लि बरुवाग नेलद मेले बिद्दिद्द हग्गद तुंडन्नु कंडे. यारिगू अदु बेकिल्लवेंदु तिळिदु कैगेत्तिकोंडु मनेगे नडेदे.
ex-g-p7: एनय्या? हग्गद तुंडन्नु तेगेदुकोंडिद्दक्के इंतह शिक्षेये?
ex-g-p8: स्वामि! हग्गद तुदियल्लि एनित्तेंदु अवनन्ने केळि.
ex-g-p9: नन्न ग्रहचार स्वामि. हग्गद तुदियल्लि हसुवन्नु कट्टित्तु.
ex-h-q1: पत्रिकेगळल्लि बरुव मक्कळ विभागदिंद कथेगळन्नु संग्रहिसि तरगतियल्लि शिक्षकर सहायदिंद ओदि.
