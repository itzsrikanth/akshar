intro-1: नीनु ओदिरुव कथे, कवन, चुटुकु अथवा नगेहनिगळल्लि यावुदादरोंदन्नु तरगतियल्लि हेळु.
story-n1: ओंदु सल विद्यासागरनेंब महान् पंडित कृष्णदेवरायन आस्थानक्के बंदनु. अवन ख्याति एल्ल कडे हब्बित्तु. संस्कृतदल्लि अवनु महामेधावियागिद्दनु. विद्याभिमानियाद कृष्णदेवराय अवनन्नु स्वागतिसि सत्करिसिदनु.
story-n2: “महाप्रभु नानु निम्म आस्थानद पंडितरोडने वाद माडलु बंदिद्देने” एंदनु विद्यासागर. कृष्णदेवराय अदक्कोप्पि तन्न आस्थानद पंडितर कडे नोडिद. अवरारू वाद माडलु आसक्ति तोरिसलिल्ल.
story-n3: एल्लरू मौनवागिरुवुदन्नु कंड विद्यासागर “इंथ दोड्ड राजन आस्थानदल्लि नन्नन्नु सोलिसुव ओब्ब पंडितनू इल्लवेन्नुवुदु बेसरद संगति. ई विषय मोदले तिळिदिद्दरे नानु इल्लिगे बरुत्तले इरलिल्ल” एंदनु.
story-n4: आग तेनालिरामकृष्ण एद्दु निंतु “इष्टु बेगने नीवु ई तीर्मानक्के बरबेडि” एंदनु. विद्यासागर अवनत्त नोडि, “नीवु यारु?” एंदु केळिदनु. “नानु ओंदेरडु ग्रंथगळन्नु बरेदिद्देने. नन्नन्नु तेनालि रामकृष्ण एन्नुत्तारे” एंदनु.
story-n5: विद्यासागरन मुख अरळितु. “हौदेनु? नानु निम्म बुद्धिवंतिके बग्गे केळिद्देने. आदरे बुद्धिचातुर्यक्किंत मुख्यवागि आळवाद अध्ययन माडिदवरु मात्र नन्नोंदिगे वाद माडलु साध्य” एंदनु.
story-n6: “अदु ननगू तिळिदिदे. नीवु याव ग्रंथद मेले वाद माडुत्तीरि?” प्रश्निसिद रामकृष्ण. इदक्के विद्यासागर “निमगे इष्टवाद यावुदे संस्कृत ग्रंथवागबहुदु” एंदनु.
story-n7: “हागादरे नाळे संजे इदे होत्तिगे निम्मोंदिगे वाद माडलु सिद्धनागि बरुत्तेने” एंदनु रामकृष्ण.
story-n8: मारनेय दिन विद्यासागर हेम्मेयिंद आस्थानवन्नु प्रवेशिसि तन्न पीठदल्लि कुळितनु. इवनेंथ वाद माडुत्तानेंदु एल्लरू अच्चरियिंद कादु कुळितिद्दरु. रामकृष्ण स्वल्प होत्तिन अनंतर बट्टेयल्लि सुत्तिद कट्टन्नु सेवकन हत्तिर हिडिसिकोंडु सभेगे बंदनु. आ कट्टिनल्लि एनिदेयेंदु यारिगू ऊहे माडलागलिल्ल.
story-n9: रामकृष्ण तन्न पीठदल्लि कुळितु विद्यासागरनिगे हेळिदनु. “नानु सिद्धनागिद्देने स्वामि.” “नानू सिद्ध. प्रारंभिसोण” एंदनु विद्यासागर. “वादक्के यावुदे ग्रंथवन्नु नानु आरिसिकोळ्ळबहुदेंदु तावु हेळिद्दिरि” एंदनु रामकृष्ण. इदक्के विद्यासागर “हौदु! यावुदन्नु बेकादरू आरिसिकोळ्ळि” एंदनु.
story-n10: रामकृष्ण तन्न एदुरिगिद्द कट्टन्नु तोरिसि “नानु ईग ई ‘तिलकाष्ठमहिषबंधन’द मेले वाद माडुत्तेने. आरंभिसले?” एंदनु. ‘तिलकाष्ठमहिषबंधन!’ विद्यासागर कण्णरळिसि “अदु...! अदु...!” एंदु तोदलिदनु.
story-n11: “एके? निमगे ‘तिलकाष्ठमहिषबंधन’ तिळिदिल्लवे? इदु नम्मूरिनल्लि दन कायुव हुडुगरिगू गोत्तु” एंदु हेम्मेयिंद हेळिदनु रामकृष्ण.
story-n12: विद्यासागर तले केरेदुकोंडनु. मुख मंकायितु. एष्टु योचिसिदरू तिलकाष्ठमहिषबंधन ग्रंथ अवन नेनपिगे बरलिल्ल. ‘इदोंदु हेगे नन्न कण्णु तप्पिसिकोंडितु’ एंदु अवनु पेचाडिकोंडनु.
story-n13: “महाप्रभु, एको नन्न देहारोग्य सरियिल्ल. वादवन्नु नाळे आरंभिसलु अप्पणे कोडि” एंदु विद्यासागरनु महाराजनन्नु बेडिकोंडनु. “आगबहुदु” राज अप्पणे कोट्टनु. तक्षण विद्यासागर जाग खालि माडिदनु. रामकृष्णनू एनू मातनाडदे मनेगे होदनु.
story-n14: मरुदिन अदे समयक्के अदे कट्टन्नु तेगेदुकोंडु रामकृष्ण गंभीरवागि सभेगे बंदनु. आदरे बहळ होत्तादरू विद्यासागर बरले इल्ल. अवनन्नु करेतरलु आळुगळु होदरु. आदरे विद्यासागर रात्रोरात्रि अल्लिंद पलायन माडिरुव विषय तिळियितु.
story-n15: इडी सभे रामकृष्णनिगे जयकार हाकितु. “निन्निंद नन्न आस्थानद मर्यादे उळियितु. नानू ‘तिलकाष्ठमहिषबंधन’ एंब ग्रंथवन्नु केळिये इल्ल. एल्लि अदन्नु कोडु नोडोण” एंदु कृष्णदेवरायनु मेच्चुगेयिंद नुडिदनु.
story-n16: रामकृष्णनु कट्टन्नु बिच्चिदनु. अदरल्लि ओंदष्टु कट्टिगेगळन्नु ओंदु हग्गदिंद कट्टलागित्तु. राज आश्चर्यदिंद “इदेनिदु?” एंदनु.
story-n17: आग रामकृष्णनु “इदु एळ्ळिन कड्डिगळु, अंदरे तिलकाष्ठ. इदु एम्मे कट्टुव हग्ग. अंदरे महिषबंधन. अदे ‘तिलकाष्ठमहिषबंधन’. इदावुदो महाग्रंथविरबेकेंदु हेदरि पाप विद्यासागर ओडिहोदनु” एंदनु.
story-n18: एल्लर नगु बहळ होत्तु सभास्थानवन्नु तुंबितु. रामकृष्णन बुद्धिवंतिकेयन्नु मेच्चिद कृष्णदेवराय अवनन्नु सन्मानिसिदनु.
intro-2: विद्ये विनयवन्नु कलिसुत्तदे. बुद्धि विवेकवन्नु कलिसुत्तदे.
