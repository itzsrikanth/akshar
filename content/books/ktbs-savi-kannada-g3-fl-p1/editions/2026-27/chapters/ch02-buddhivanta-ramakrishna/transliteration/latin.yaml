ex-g-q1: Sambhaashane odi, idannu katheya roopadalli bareyiri
ex-g-p1: Sainikare, seremaneyalliruva khaidigalannu nodalu bandiddene.
ex-g-p2: Appane prabhu, itta banni. Pratiyobbarannoo torisuttene.
ex-g-p3: Ee yuvaka yaaru?
ex-g-p4: Ninne taane banda aparaadhi, prabhugale.
ex-g-p5: Ayyaa! Neenu maadida aparaadha enu?
ex-g-p6: Svaami! Naanu beediyalli baruvaaga nelada mele biddidda haggada tundannu kande. Yaarigoo adu bekillavendu tilidu kaigettikondu manege nadede.
ex-g-p7: Enayyaa? Haggada tundannu tegedukondiddakke intaha shiksheye?
ex-g-p8: Svaami! Haggada tudiyalli enittendu avananne keli.
ex-g-p9: Nanna grahachaara svaami. Haggada tudiyalli hasuvannu kattittu.
ex-h-q1: Patrikegalalli baruva makkala vibhaagadinda kathegalannu sangrahisi taragatiyalli shikshakara sahaayadinda odi.
competency: Neenu makkala niyatakaalikegalannu odi arthaisikollaballeyallave?
