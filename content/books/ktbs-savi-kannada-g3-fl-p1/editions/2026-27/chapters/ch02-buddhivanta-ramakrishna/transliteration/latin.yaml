intro-1: Neenu odiruva kathe, kavana, chutuku athavaa nagehanigalalli yaavudaadarondannu taragatiyalli helu.
story-n1: Ondu sala Vidyaasaagaranemba mahaan pandita Krishnadevaraayana aasthaanakke bandanu. Avana khyaati ella kade habbittu. Samskritadalli avanu mahaamedhaaviyaagiddanu. Vidyaabhimaaniyaada Krishnadevaraaya avanannu svaagatisi satkarisidanu.
story-n2: '“Mahaaprabhu naanu nimma aasthaanada panditarodane vaada maadalu bandiddene” endanu Vidyaasaagara. Krishnadevaraaya adakkoppi tanna aasthaanada panditara kade nodida. Avaraaroo vaada maadalu aasakti torisalilla.'
story-n3: 'Ellaroo maunavaagiruvudannu kanda Vidyaasaagara “Intha dodda raajana aasthaanadalli nannannu solisuva obba panditanoo illavennuvudu besarada sangati. Ee vishaya modale tilididdare naanu illige baruttale iralilla” endanu.'
story-n4: 'Aaga Tenaaliraamakrishna eddu nintu “Ishtu begane neevu ee teermaanakke barabedi” endanu. Vidyaasaagara avanatta nodi, “Neevu yaaru?” endu kelidanu. “Naanu onderadu granthagalannu barediddene. Nannannu Tenaali Raamakrishna ennuttaare” endanu.'
story-n5: 'Vidyaasaagarana mukha aralitu. “Haudenu? Naanu nimma buddhivantike bagge keliddene. Aadare buddhichaaturyakkinta mukhyavaagi aalavaada adhyayana maadidavaru maatra nannondige vaada maadalu saadhya” endanu.'
story-n6: '“Adu nanagoo tilidide. Neevu yaava granthada mele vaada maadutteeri?” prashnisida Raamakrishna. Idakke Vidyaasaagara “Nimage ishtavaada yaavude Samskrita granthavaagabahudu” endanu.'
story-n7: '“Haagaadare naale sanje ide hottige nimmondige vaada maadalu siddhanaagi baruttene” endanu Raamakrishna.'
story-n8: Maaraneya dina Vidyaasaagara hemmeyinda aasthaanavannu praveshisi tanna peethadalli kulitanu. Ivanentha vaada maaduttaanendu ellaroo achchariyinda kaadu kulitiddaru. Raamakrishna svalpa hottina anantara batteyalli suttida kattannu sevakana hattira hidisikondu sabhege bandanu. Aa kattinalli enideyendu yaarigoo oohe maadalaagalilla.
story-n9: 'Raamakrishna tanna peethadalli kulitu Vidyaasaagaranige helidanu. “Naanu siddhanaagiddene svaami.” “Naanoo siddha. Praarambhisona” endanu Vidyaasaagara. “Vaadakke yaavude granthavannu naanu aarisikollabahudendu taavu heliddiri” endanu Raamakrishna. Idakke Vidyaasaagara “Haudu! Yaavudannu bekaadaroo aarisikolli” endanu.'
story-n10: 'Raamakrishna tanna edurigidda kattannu torisi “Naanu eega ee ‘Tilakaashthamahishabandhana’da mele vaada maaduttene. Aarambhisale?” endanu. ‘Tilakaashthamahishabandhana!’ Vidyaasaagara kannaralisi “Adu...! Adu...!” endu todalidanu.'
story-n11: '“Eke? Nimage ‘Tilakaashthamahishabandhana’ tilidillave? Idu nammoorinalli dana kaayuva hudugarigoo gottu” endu hemmeyinda helidanu Raamakrishna.'
story-n12: Vidyaasaagara tale keredukondanu. Mukha mankaayitu. Eshtu yochisidaroo Tilakaashthamahishabandhana grantha avana nenapige baralilla. ‘Idondu hege nanna kannu tappisikonditu’ endu avanu pechaadikondanu.
story-n13: '“Mahaaprabhu, eko nanna dehaarogya sariyilla. Vaadavannu naale aarambhisalu appane kodi” endu Vidyaasaagaranu mahaaraajanannu bedikondanu. “Aagabahudu” raaja appane kottanu. Takshana Vidyaasaagara jaaga khaali maadidanu. Raamakrishnanoo enoo maatanaadade manege hodanu.'
story-n14: Marudina ade samayakke ade kattannu tegedukondu Raamakrishna gambheeravaagi sabhege bandanu. Aadare bahala hottaadaroo Vidyaasaagara barale illa. Avanannu karetaralu aalugalu hodaru. Aadare Vidyaasaagara raatroraatri allinda palaayana maadiruva vishaya tiliyitu.
story-n15: 'Idee sabhe Raamakrishnanige jayakaara haakitu. “Ninninda nanna aasthaanada maryaade uliyitu. Naanoo ‘Tilakaashthamahishabandhana’ emba granthavannu keliye illa. Elli adannu kodu nodona” endu Krishnadevaraayanu mechchugeyinda nudidanu.'
story-n16: 'Raamakrishnanu kattannu bichchidanu. Adaralli ondashtu kattigegalannu ondu haggadinda kattalaagittu. Raaja aashcharyadinda “Idenidu?” endanu.'
story-n17: 'Aaga Raamakrishnanu “Idu ellina kaddigalu, andare tilakaashtha. Idu emme kattuva hagga. Andare mahishabandhana. Ade ‘Tilakaashthamahishabandhana’. Idaavudo mahaagranthavirabekendu hedari paapa Vidyaasaagara odihodanu” endanu.'
story-n18: Ellara nagu bahala hottu sabhaasthaanavannu tumbitu. Raamakrishnana buddhivantikeyannu mechchida Krishnadevaraaya avanannu sanmaanisidanu.
intro-2: Vidye vinayavannu kalisuttade. Buddhi vivekavannu kalisuttade.
