competency: Sahapaathigala kai barehavannu oduvudu.
intro-1: Pathya pustaka, maduve, gruhapravesha muntaada aamantrana patrike, samaachaara patrikegalannu nodiruve.
  Ivu mudrita roopadallive. Naavu ivugalallina mudrita vishayagalannu odi tiliyutteve.
intro-2: Naavu mudrita vishayagalannu maatra oduvudilla. Kelavu vele kaibarehadalliruva vishayagalannu odi tiliyutteve.
  Allade helabekaadudannu athavaa aalochisiddannu kaibarehadalli bareyutteve allave?
intro-3: Ninna shaalaa patrikeyalli ninna lekhana prakatavaagirabahudu. Ee shaalaa patrikeyalliruva kaibarehada
  lekhanavannu odi tili. Kaibarehadallina vaividhyateyannu gurutisu.
story-n1: Andu shanivaara. Sampaadaka mandaliyavaru vidyaarthigalinda banda lekhanagalannu parisheelisidaru. Uttama
  lekhanagalannu aaydu patrikeyannu siddhapadisi prakatisidaru.
story-n2: Raadhaa patrikeyannu nodidalu. Kutoohaladinda odalu mundaadalu. Kelavu lekhanagalannu saraagavaagi odidalu.
  Aadare kelavu lekhanagalannu odalu kashtapattalu. Ekirabahudu? Helaballeyaa? Haagiddare modalige ee patrikeyannu
  odu.
story-n3: Shaalaa patrike — chiguru — joon 2024
story-n4: 'Maavu: maavu hannugala raaja. Idaralli baadaami, rasa, malagoba muntaada vidhagalive. — yoosuph, 4ne
  taragati'
poem-s1l1: Chikka makkalige bari bhaanangalada
poem-s1l2: Chendu,
poem-s1l3: Vijnyaanigaligilli bari kallu gundu
story-n5: 'Chutuku sangraha: jaahnavi, 3ne taragati'
story-n6: 'Chitrakke banna haaki. Chitra sangraha: vinaayaka, 3ne taragati. [sampaadakeeya chitra ullekha: 3rd_KANNADA_FL_Part_1_2026-27.pdf,
  mudrita puta 30, PDF puta 43 (1rinda enike), shaalaa patrikeya edabhaagada sinhada chitra.]'
story-n7: 'Subhaashita: tyaaga, preeti, karune mattu praamaanikateye nijavaada shikshana. — svaami vivekaananda.
  Sangraha: jaaved, 5ne taragati'
story-n8: 'Nudigattu — artha: ellashtu — atyalpa; kambi keelu — odi hogu. — vivek, 5ne taragati'
story-n9: 'Vyavakalana maadu — gunalabdha tili! Udaa: 36 × 9 = 324. 36ra munde sonne serisi bare: 360. 36nnu kale:
  −36. Ulike (Iduve 36 × 9ra gunalabdha): 324.'
story-n10: 'Gamanisu: 9rinda gunisabekaada yaavude sankhyeya gunalabdha tiliyalu ee krama anusarisi nodu. — harshini,
  5ne taragati'
story-n11: 'Chitragalalli vyatyaasa huduki. [sampaadakeeya chitra ullekha: 3rd_KANNADA_FL_Part_1_2026-27.pdf, mudrita
  puta 30, PDF puta 43 (1rinda enike), balakelagina eradu pakshigala chitragalu.]'
story-n12: 'Nimagidu tilidirali: sar. Em. Vishveshvarayyanavara dooradrushtiya yojaneyinda mandya jilleya shreerangapattana
  taallookinalli krushnaraaja anekattu kattalaagide. Idarinda aa bhaagada raitarige tumbaa anukoolavaagide. — maala,
  4ne taragati'
story-n13: 'Jalapaata: joga jalapaata loka vikhyaata. Kannada naadina hemmeya taana. Malenaadina shivamogga jilleya
  saagara taallookina jog halliyalli ide. — sateesh, 5ne taragati'
story-n14: 'Svaami vivekaananda: amerikaadalli hindoo dharmada hirimeyannu etti saaridaru. Ivara baalyada hesaru
  narendra. Tande vishvanaatha datta. Taayi bhuvaneshvari devi. — vinaayaka, 3ne taragati'
story-n15: 'Naadahabba: namma naada habba dasaraa. Idannu sharannavaraatri endoo kareyuttaare. Maisoorina dasaraa
  raajyada parampareyannu pratibimbisuttade. Illina jamboo savaari aakarshaneeya. — thaamas, 5ne taragati'
story-n16: 'Gaade: dudidavanige duhkhavilla, somaarige sukhavilla. — begam, 3ne taragati'
story-n17: 'Mane maddu: toleda seebe hannina ele mattu uppannu neerige haaki kudisabeku. Kudisida neerannu hitavaada
  shaakhadalli mukkalisidare hallu novu shamanavaaguttade. — gaayatri, 5ne taragati'
story-d1: Raadhaa neenu kelavu lekhanagalannu odalu kashtapatte eke?
story-n18: Endu shikshaki prashnisidaru.
story-d2: Kelavara kaibareha chennaagiralilla. Aaddarinda odalu kashtavaayitu medam.
story-n23: Endu raadhaa helidalu.
story-d3: Bareha chennaagiralilla endare adu hegittu?
story-n24: Endu shikshaki kelidaru.
story-d4: Maalaa barediruvudu spashtavaagi kaanisuttilla medam. Aadare gaayatri barediruva aksharagalu mudrita aakaaradallilla,
  innu yoosuphnu tanna barehadalli padagala naduve sthalavanne bittilla.
story-n19: Endalu. Itararu tamma anisikeyannu hanchikondaru. Shikshaki charcheyalli banda abhipraayavannu ottugoodisidaru.
story-n20: Barevanigeyu chennaagirabekaadare adu hegirabeku ennuva bagge tilisuttaa... Naavu tappillade chennaagi
  kaanuva reetiyalli bareyabeku. Sulabhavaagi odalu mattu odiddu arthavaaguvante bareyabeku. Aksharagalannu onde
  gaatradalli bareyabeku.
story-n21: Bareyuva prati aksharavu mudrita aksharagala aakaaradalli irabeku. Ondu padadallina aksharagalu ondakkondu
  taakadante haagoo naduve sthala bidadante bareyabeku. Padagalannu gurtisalu sahaayavaaguvante padagala naduve
  svalpa sthalavannu bittu bareyabeku.
story-n22: Ondu saalina aksharagalu mattondu saalina aksharagalige taagadante saalugala naduve sookta sthalavannu
  bittu bareyabeku. Akshara haagoo saalugalu oreyaagirabaaradu endu helidaru. Vidyaarthigalu chennaagi bareyuva
  krama tilidu santasagondaru.
