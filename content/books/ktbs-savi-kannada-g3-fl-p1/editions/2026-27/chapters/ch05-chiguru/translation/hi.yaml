competency: सहपाठियों की लिखावट पढ़ना।
intro-1: तुमने पाठ्यपुस्तकें, विवाह और गृहप्रवेश के निमंत्रण-पत्र तथा समाचार-पत्र देखे हैं। ये छपे हुए होते हैं।
  हम इनमें छपी बातें पढ़कर जानते हैं।
intro-2: हम केवल छपी बातें ही नहीं पढ़ते। कभी-कभी हाथ से लिखी बातें भी पढ़ते हैं। जो कहना चाहते हैं या सोचते हैं,
  उसे हाथ से लिखते भी हैं, है ना?
intro-3: तुम्हारा लेख तुम्हारी विद्यालय पत्रिका में छपा होगा। इस विद्यालय पत्रिका के हस्तलिखित लेख पढ़ो। लिखावट
  में भिन्नताएँ पहचानो।
story-n1: उस दिन शनिवार था। संपादक मंडल ने विद्यार्थियों के लेखों की जाँच की। अच्छे लेख चुनकर पत्रिका तैयार की और
  प्रकाशित की।
story-n2: राधा ने पत्रिका देखी और उत्सुकता से पढ़ने लगी। उसने कुछ लेख आसानी से पढ़े, पर कुछ पढ़ने में कठिनाई हुई।
  क्यों हुई होगी? क्या तुम बता सकते हो? पहले यह पत्रिका पढ़ो।
story-n3: विद्यालय पत्रिका — चिगुरु (कोंपल) — जून 2024
story-n4: 'आम: आम फलों का राजा है। इसकी बादामी, रस, मलगोबा आदि किस्में हैं। — यूसुफ़, कक्षा 4'
poem-s1l1: छोटे बच्चों के लिए आकाश की
poem-s1l2: गेंद,
poem-s1l3: वैज्ञानिकों के लिए यहाँ पत्थर का गोला।
story-n5: 'लघु कविता का संग्रह: जाह्नवी, कक्षा 3'
story-n6: 'चित्र में रंग भरो। चित्र-संग्रह: विनायक, कक्षा 3। [संपादकीय चित्र-संदर्भ: 3rd_KANNADA_FL_Part_1_2026-27.pdf,
  मुद्रित पृष्ठ 30, PDF पृष्ठ 43 (गिनती 1 से), विद्यालय पत्रिका के बाईं ओर शेर का चित्र।]'
story-n7: 'सुभाषित: त्याग, प्रेम, करुणा और ईमानदारी ही सच्ची शिक्षा हैं। — स्वामी विवेकानंद। संग्रह: जावेद, कक्षा
  5'
story-n8: 'मुहावरे — अर्थ: तिल भर — बहुत थोड़ा; सलाखें उखाड़ना — भाग जाना। — विवेक, कक्षा 5'
story-n9: 'घटाकर गुणनफल जानो! उदाहरण: 36 × 9 = 324। 36 के बाद शून्य लगाओ: 360। 36 घटाओ: −36। शेष (यही 36 × 9 का
  गुणनफल है): 324।'
story-n10: 'ध्यान दो: किसी भी संख्या को 9 से गुणा करने का गुणनफल जानने के लिए यह तरीका आज़माओ। — हर्षिणी, कक्षा
  5'
story-n11: 'चित्रों में अंतर खोजो। [संपादकीय चित्र-संदर्भ: 3rd_KANNADA_FL_Part_1_2026-27.pdf, मुद्रित पृष्ठ 30,
  PDF पृष्ठ 43 (गिनती 1 से), नीचे दाईं ओर पक्षियों वाले दो चित्र।]'
story-n12: 'यह जान लो: सर एम. विश्वेश्वरैया की दूरदर्शी योजना से मंड्या ज़िले के श्रीरंगपट्टण तालुक में कृष्णराज
  बाँध बनाया गया। इससे उस क्षेत्र के किसानों को बहुत सुविधा हुई है। — माला, कक्षा 4'
story-n13: 'जलप्रपात: जोग जलप्रपात विश्वप्रसिद्ध है और कर्नाटक का गौरव है। यह मलेनाडु के शिवमोग्गा ज़िले के सागर
  तालुक के जोग गाँव में है। — सतीश, कक्षा 5'
story-n14: 'स्वामी विवेकानंद: उन्होंने अमेरिका में हिंदू धर्म की महिमा बताई। उनका बचपन का नाम नरेंद्र था। पिता विश्वनाथ
  दत्त और माता भुवनेश्वरी देवी थीं। — विनायक, कक्षा 3'
story-n15: 'राज्य का पर्व: दशहरा हमारे राज्य का पर्व है। इसे शरन्नवरात्रि भी कहते हैं। मैसूर का दशहरा राज्य की परंपरा
  दर्शाता है। यहाँ की जंबू सवारी, हाथियों की शोभायात्रा, आकर्षक होती है। — थॉमस, कक्षा 5'
story-n16: 'कहावत: मेहनत करने वाले को दुख नहीं, आलसी को सुख नहीं। — बेगम, कक्षा 3'
story-n17: 'घरेलू उपचार: धुले हुए अमरूद के पत्ते और नमक पानी में डालकर उबालें। पानी आरामदायक गुनगुना होने पर उससे
  कुल्ला करने से दाँत का दर्द कम होता है। — गायत्री, कक्षा 5'
story-d1: राधा, तुम्हें कुछ लेख पढ़ने में कठिनाई क्यों हुई?
story-n18: शिक्षिका ने पूछा।
story-d2: कुछ लोगों की लिखावट अच्छी नहीं थी। इसलिए पढ़ने में कठिनाई हुई, मैडम।
story-n23: राधा ने कहा।
story-d3: लिखावट अच्छी नहीं थी, तो कैसी थी?
story-n24: शिक्षिका ने पूछा।
story-d4: माला की लिखावट साफ़ नहीं दिखती, मैडम। गायत्री के अक्षर छपे हुए अक्षरों जैसे नहीं हैं, और यूसुफ़ ने शब्दों
  के बीच जगह ही नहीं छोड़ी।
story-n19: उसने कहा। दूसरों ने भी अपनी राय बताई। शिक्षिका ने चर्चा में आए विचारों को समेटा।
story-n20: 'अच्छी लिखावट कैसी होनी चाहिए, यह समझाते हुए उन्होंने कहा: हमें बिना गलती के साफ़-सुंदर लिखना चाहिए।
  लिखावट आसानी से पढ़ी और समझी जा सके। अक्षर एक ही आकार के होने चाहिए।'
story-n21: हर अक्षर छपे हुए अक्षर के आकार जैसा होना चाहिए। एक शब्द के अक्षर न आपस में छुएँ, न उनके बीच खाली जगह
  हो। शब्द पहचानने में आसानी हो, इसलिए शब्दों के बीच थोड़ी जगह छोड़नी चाहिए।
story-n22: पंक्तियों के बीच उचित जगह छोड़नी चाहिए ताकि एक पंक्ति के अक्षर दूसरी के अक्षरों से न छुएँ। अक्षर और पंक्तियाँ
  तिरछी नहीं होनी चाहिए, उन्होंने कहा। अच्छी तरह लिखने का तरीका जानकर विद्यार्थी खुश हुए।
