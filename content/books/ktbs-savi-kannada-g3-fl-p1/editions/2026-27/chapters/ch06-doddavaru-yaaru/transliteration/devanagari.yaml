intro-1: कुंबळकयि, पडुवलकायि मत्तु हागलकायि नडुवे दोड्डवरु यारु एंब बग्गे वाद नडेयितु. अवर नडुवे एनु वाद नडेदिरबहुदु एंदु ऊहिसिकोंडु तरगतियल्लि स्नेहितर जोते सेरि चर्चिसि.
story-n1: ओंदु ऊरु, अल्लोंदु इलिगळ संसार. आ संसारदल्लि ओब्ब मगळिद्दळु.
story-n2: मगळिगे तक्क वरनन्नु हुडुकबेकेंदु तंदे तायि इलिगळु योचिसिदवु.
story-n3: जगत्तन्ने बेळगुव सूर्य बहळ दोड्डवनु. अवने नम्म मगळिगे तक्क वर, एंदु तायि इलि हेळितु.
story-n4: सूर्यन बळिगे इलिगळु होदवु. मदुवे विचार तिळिसिदवु. ई विचारवन्नु केळिद सूर्यनु ननगिंतलू दोड्डवनु इन्नोब्बनद्दाने. अवनन्नु केळि एंदु हेळिदनु.
story-n6: "हागादरे ‘अवनु यारु?’ एंदु तंदे इलि केळितु. अदक्के सूर्यनु 'मोड ननगिंतलू दोड्डवनु' एंदु हेळिदनु. एल्लरू सेरि मोडद बळिगे होदवु."
story-n5: "मदुवे विचार केळिद मोडवु 'इल्ला! इल्ला! ननगिंत दोड्डवनु बेट्टद राजनद्दाने. अवनल्लि होगि' एंदु हेळितु."
story-n7: "बेट्टद राजन बळिगे इलिगळु होगि विषय तिळिसिदवु. आग बेट्टद राज 'ननगिंतलू दोड्डवनु मत्तोब्बनद्दाने. अवने इलिराय अवनल्लिगे होगि' एंदनु."
story-n8: "'नम्मल्ले वरनन्नु इट्टुकोंडु सुम्मने परदाडिदेवु' एंदु तंदे इलि हेळितु. 'नम्म मगळिगे इलिरायने तक्क वर' एंदु तीरमानिसि, मगळन्नु इलिरायनिंगे कोट्टु वैभवदिंद मदुवे माडिदवु."
story-proverb: अंगैयल्लि बेण्णे इट्टुकोंडु तुप्पक्कागि ऊरु अलेदंते.
