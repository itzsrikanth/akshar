  exercise-A: abhyasa a — ondondu vakyadalli uttara bare.
  exercise-B: abhyasa aa — kottiruva maatannu yaaru? yaarige helidaru?
  exercise-C: abhyasa i — vakyagalannu gamanisi. sari/tappugalannu gurutisu, tappiddare saripadisi bareyiri.
  exercise-D: abhyasa ee — kottiruva padagalannu sariyagi jodisi vakya rachisi.
  exercise-E: abhyasa u — ee kelagina padagalannu balasi svantavakya rachisi.
  exercise-F: bhasha chatuvatike a — kottiruva padagalalli sariyada pada aarisi bitta sthaladalli bareyiri
  exercise-G: bhasha chatuvatike aa — kottiruva aksharagalannu balasi, pranigala hesaru patti maadi.
  exercise-H: bhasha chatuvatike i — prani-pakshigala koogannu anusarisi sooktavadudakke gere eledu hondisi.
  exercise-I: bhasha chatuvatike ee — kottiruva padagalalli sariyada roopavannu gurutisi bare.
  exercise-J: bhasha chatuvatike u — ee kelagina padagalannu oodi bare.
  exercise-K: balake chatuvatike a — ee kelagina vakyagala madarigalannu nakalumaadi.
  exercise-L: balake chatuvatike aa
  exercise-M: balake chatuvatike i
  exercise-N: balake chatuvatike ee
  competency: samarthya
intro-1: kumbalakayi, paduvalakayi mattu hagalakayi naduve doddavaru yaaru emba bagge vaada nadeyitu. avara naduve eenu vaada nadedirabahudu endu oohisikondu taragatiyalli snehitara jote seri charchisi.
story-n1: ondu ooru, allondu iligala samsara. aa samsaradalli obba magaliddalu.
story-n2: magalige takka varanannu hudukabekendu tande taayi iligalu yochisidavu.
story-n3: jagattanne belaguva soorya bahala doddavanu. avane namma magalige takka vara, endu taayi ili helitu.
story-n4: sooryana balige iligalu hodavu. maduve vichara tilisidavu. ee vicharavannu kelida sooryanu nanigintaloo doddavanu innobbaniddane. avanannu keli endu helidanu.
story-n6: "hagadare ‘avanu yaaru?’ endu tande ili kelitu. adakke sooryanu 'moda nanigintaloo doddavanu' endu helidanu. ellaroo seri modada balige hodavu."
story-n5: "maduve vichara kelida modavu 'illa! illa! naniginta doddavanu bettada rajaniddane. avanalli hogi' endu helitu."
story-n7: "bettada rajana balige iligalu hogi vishaya tilisidavu. aaga bettada raja 'nanigintaloo doddavanu mattobbaniddane. avane iliraya avanallige hogi' endanu."
story-n8: "'nammalle varanannu ittukondu summane paradaadidevu' endu tande ili helitu. 'namma magalige ilirayane takka vara' endu teermanisi, magalannu ilirayanige kottu vaibhavadinda maduve maadidavu."
story-proverb: angaiyalli benne ittukondu tuppakkagi ooru aledante.
