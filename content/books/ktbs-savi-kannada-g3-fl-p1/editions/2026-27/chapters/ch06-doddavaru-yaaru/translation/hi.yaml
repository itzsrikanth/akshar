intro-1: कद्दू, चिचिंडा और करेले के बीच इस बात पर बहस हुई कि उनमें से महान कौन है। कक्षा में अपने दोस्तों के साथ मिलकर चर्चा करें कि उनके बीच क्या बहस हुई होगी।
story-n1: एक गाँव था, वहाँ चूहों का एक परिवार रहता था। उस परिवार में एक बेटी थी।
story-n2: माता-पिता चूहों ने अपनी बेटी के लिए एक योग्य वर खोजने की सोची।
story-n3: 'माँ चुहिया ने कहा, "पूरी दुनिया को रोशन करने वाला सूरज बहुत महान है। वही हमारी बेटी के लिए योग्य वर है।"'
story-n4: 'चूहे सूरज के पास गए। उन्होंने शादी की बात बताई। यह बात सुनकर सूरज ने कहा, "मुझसे भी महान कोई और है। उससे पूछो।"'
story-n6: '"तो फिर वह कौन है?" पिता चूहे ने पूछा। उस पर सूरज ने कहा, "बादल मुझसे भी महान है।" सब मिलकर बादल के पास गए।'
story-n5: 'शादी की बात सुनकर बादल ने कहा, "नहीं! नहीं! मुझसे महान पहाड़ों का राजा है। उसके पास जाओ।"'
story-n7: 'चूहे पहाड़ों के राजा के पास गए और उसे बात बताई। तब पहाड़ों के राजा ने कहा, "मुझसे भी महान एक और है। वह चूहों का राजा है, उसके पास जाओ।"'
story-n8: 'पिता चूहे ने कहा, "हमने वर को अपने पास ही रखकर व्यर्थ ही इधर-उधर भटके।" यह तय करके कि "हमारी बेटी के लिए चूहों का राजा ही योग्य वर है", उन्होंने अपनी बेटी को चूहों के राजा को दे दिया और धूमधाम से शादी कर दी।'
story-proverb: हथेली में मक्खन रखकर घी के लिए गाँव भर में भटकने के समान।
