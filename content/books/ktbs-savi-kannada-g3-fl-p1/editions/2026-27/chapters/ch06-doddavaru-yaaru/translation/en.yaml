intro-1: An argument took place between a pumpkin, a snake gourd, and a bitter gourd about who among them is great. Guess what their argument might have been and discuss it with your friends in class.
story-n1: In a town, there lived a family of mice. They had a daughter in their family.
story-n2: The parent mice thought of finding a suitable groom for their daughter.
story-n3: 'The mother mouse said, "The sun, who lights up the whole world, is very great. He is the suitable groom for our daughter."'
story-n4: 'The mice went to the sun. They informed him about the marriage. Hearing this, the sun said, "There is someone else greater than me. Ask him."'
story-n6: '"Then who is he?" asked the father mouse. To that, the sun said, "The cloud is greater than me." Everyone together went to the cloud.'
story-n5: 'Hearing about the marriage, the cloud said, "No! No! The king of the mountains is greater than me. Go to him."'
story-n7: 'The mice went to the king of the mountains and told him the matter. Then the king of the mountains said, "There is another person greater than me. He is the mouse king, go to him."'
story-n8: 'The father mouse said, "We had the groom right here with us and wandered around for nothing." Deciding that "The mouse king is the suitable groom for our daughter", they gave their daughter to the mouse king and celebrated the marriage grandly.'
story-proverb: Like wandering around town for ghee while holding butter in the palm.
