  title: ದೊಡ್ಡವರು ಯಾರು?
  intro: ಕಲಿಕೆಗೆ ದಾರಿ
  story: ದೊಡ್ಡವರು ಯಾರು?
  vocab: ಪದಗಳ ಅರ್ಥ
  exercise-A: ಅಭ್ಯಾಸ ಅ — ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆ.
  exercise-B: ಅಭ್ಯಾಸ ಆ — ಕೊಟ್ಟಿರುವ ಮಾತನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು?
  exercise-C: ಅಭ್ಯಾಸ ಇ — ವಾಕ್ಯಗಳನ್ನು ಗಮನಿಸಿ. ಸರಿ/ತಪ್ಪುಗಳನ್ನು ಗುರುತಿಸು, ತಪ್ಪಿದ್ದರೆ ಸರಿಪಡಿಸಿ ಬರೆಯಿರಿ.
  exercise-D: ಅಭ್ಯಾಸ ಈ — ಕೊಟ್ಟಿರುವ ಪದಗಳನ್ನು ಸರಿಯಾಗಿ ಜೋಡಿಸಿ ವಾಕ್ಯ ರಚಿಸಿ.
  exercise-E: ಅಭ್ಯಾಸ ಉ — ಈ ಕೆಳಗಿನ ಪದಗಳನ್ನು ಬಳಸಿ ಸ್ವಂತವಾಕ್ಯ ರಚಿಸಿ.
  exercise-F: ಭಾಷಾ ಚಟುವಟಿಕೆ ಅ — ಕೊಟ್ಟಿರುವ ಪದಗಳಲ್ಲಿ ಸರಿಯಾದ ಪದ ಆರಿಸಿ ಬಿಟ್ಟ ಸ್ಥಳದಲ್ಲಿ ಬರೆಯಿರಿ
  exercise-G: ಭಾಷಾ ಚಟುವಟಿಕೆ ಆ — ಕೊಟ್ಟಿರುವ ಅಕ್ಷರಗಳನ್ನು ಬಳಸಿ, ಪ್ರಾಣಿಗಳ ಹೆಸರು ಪಟ್ಟಿ ಮಾಡಿ.
  exercise-H: ಭಾಷಾ ಚಟುವಟಿಕೆ ಇ — ಪ್ರಾಣಿ-ಪಕ್ಷಿಗಳ ಕೂಗನ್ನು ಅನುಸರಿಸಿ ಸೂಕ್ತವಾದುದಕ್ಕೆ ಗೆರೆ ಎಳೆದು ಹೊಂದಿಸಿ.
  exercise-I: ಭಾಷಾ ಚಟುವಟಿಕೆ ಈ — ಕೊಟ್ಟಿರುವ ಪದಗಳಲ್ಲಿ ಸರಿಯಾದ ರೂಪವನ್ನು ಗುರುತಿಸಿ ಬರೆ.
  exercise-J: ಭಾಷಾ ಚಟುವಟಿಕೆ ಉ — ಈ ಕೆಳಗಿನ ಪದಗಳನ್ನು ಓದಿ ಬರೆ.
