intro-1: Paatha - 5
intro-2: Ajjiya Totadalli Ondu Dina
intro-3: "Kalikege Daari"
intro-4: Ee belegala hesarenenndu nimage gotte? Gurutisi heli.
story-p1: Malenaada tappalinalliruva ondu ooru Kanabooru. Allondu hiriya prathamika shaale. Aa shaleya makkalu kishorana ajjiya totakke gurugalondige hora sanchara horataru. Kishorana ajjiya mane bettada tappalinallide. Maneya hindina guddadalli geru maragalive. Adike tota daati munde hodare bhattada gaddegalive. Makkalellaru gaddeya hattira bandu talupidaru.
story-p2: '"Idu yaava bele?" endu peetar prashnisida. "Idu bhattada bele" endaru gurugalu. "O idenaa! Bhattada pairu?" Tenegalannu kaiyinda mutti prashnisida peetar. Ondu bhattada teneyannu kittukottu "Tago idannu bidisinodu" endaru gurugalu. Sheela taanu ondu tene keelalu baagidaaga ondu kappe changane kuppalisitu. Sarasara ondu haavu hattiradalle saridu hoyitu. Makkalu bhayadinda hinde negedaru. "Hedarabedi, avu namage enu maduvudilla. Haavu, kappe, keeta, hakki, mola, handi, mungusi muntada pranigalu samanyavagi totada suttamutta iruttave" endaru gurugalu.'
story-p3: 'Makkalu matanadutta gaddeya baduvinalli nadedu todu daati adike totakke bandaru. Totada naduve biddidda ondu hannannu hekkida meri "O! Illi nodi soute kaayi!" endalu. "Allalla! Adu heerekayi" endanu rafeeq. "Eradu alla. Adu koko hannu. Idannu chakletu tayarisalu balayuttare. Yavudo prani adannu kittu haakide. Bahushaha alile irabeku" endaru gurugalu.'
story-p4: 'Ashtaralli ajji totadalli eno maduttiruvudannu kanda makkalu allige odidaru. "Nidhanavagi banni. Mullugalu irabahudu" endu echcharisidaru ajji. "Idenu? Ishtondu gundi todiddiri?" endu mahesha prashnisidanu. "Neevella nimma kaiyaare ondondu hannina gida idaralli nedabeku" endu ajji uttarisidaru. "Bedappa, namma kai koleyaguttade. Nanna amma baiyuttale" endalu ashwini. "Chokkada chikkamma baare" endu tamashe madida mahammad, "Kai kesaradare baayi mosaru" endu helutta ondu gida tegedukondu nedalu aarambhisidanu. Anteye ella makkalu ondondu gida nettaru. Kai toledu ajji kotta hannannu tindu totadallella suttaadidaru. Totadallidda baale, adike, tengu, kalumenasu, kaafi, elakki modalada gidagalannu nodidaru.'
story-p5: '"Ajjee! Haavinamari" endu kiruchidalu sheela. "Adu haavalla, erehulu. Idannu raitana mitra endu kareyuttare. Idara sahayadinda ere gobbara tayarisuttare" endaru gurugalu. "Naavu rasayanika gobbara balasuvudilla. Eregobbara, hattigobbara, koligobbara modalada savayava gobbara balasi uttama belegalannu beleyutteve" endaru ajji. Ellavannu gamanisuttidda sharanappa "Sir namma ooru ballari. Alli jola, menasu, shenga mattu togari beleyuttare" endanu. "Houdu mannina guna hagu havamanakke anugunavagi bere bere bele beleyuttare" endaru shikshakaru.'
story-p6: '"Namma ooru pashima ghattada tappalinallide. Bettagudda maragalinda koodiruva pradeshavadudarinda illi heralavagi male beeluttade. Aadudarinda hechu neeru bekada belegalannu naavu beleyutteve. Nimma oorina kade male kadime beeluvudarinda aa belegalannu beleyuttare" endaru ajji.'
story-p7: Ashtu hottige ajjiya maneyalli makkaligagi ruchiyada aduge siddhavagittu. "Kai kaalu toledu ootakke banni" endu ajji karedalu. Makkalu ajjiya jote ootakke horataru.
story-p8: Ajjiya maneya angaladallidda yantravannu kanda sheela "Idenu gurugale?" endalu. "Idu gadde uluva yantra. Hinde negilu, noga, ettu, kona balasi hola uluttiddaru. Eega hosa sadhanagalu bandive" endaru gurugalu.
story-p9: Ellaru ruchi ruchiyada oota mugisidaru. Kai toleyalu hoda ashwini "Ido nodi. Illu sanna sanna gundigalu ive" endalu. "Ivu ingu gundigalu. Ee gundigala moolaka maleya neerannu ingisutteve. Idu antarjala hechisuttade. Idarinda namma baaviyalli neeru endu kadime aagilla" endaru ajji.
story-p10: '"Makkale, naavu male koylu mattu antarjalada bagge taragatiyalli charchisona. Eega ajjige dhanyavada heli horadona" endaru gurugalu. Ashtaralli ajji ellarigu godambi hanchidaru. Makkalu tinnutta shaale kade hejje haakidaru.'
story-p11: Raita nammellara annadaata
