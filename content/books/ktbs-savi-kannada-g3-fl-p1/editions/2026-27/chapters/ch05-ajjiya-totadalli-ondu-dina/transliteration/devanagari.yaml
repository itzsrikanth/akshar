intro-4: ई बॆळॆगळ हॆसरेनॆंदु निमगॆ गॊत्तॆ? गुरुतिसि हेळि.
story-p1: मलॆनाड तप्पलिनल्लिरुव ऒंदु ऊरु कणबूरु. अल्लॊंदु हिरिय प्राथमिक शालॆ. आ शालॆय
  मक्कळु किशोरन अज्जिय तोटक्कॆ गुरुगळॊंदिगॆ हॊर संचार हॊरटरु. किशोरन अज्जिय मनॆ बॆट्टद
  तप्पलिनल्लिदॆ. मनॆय हिंदिन गुड्डदल्लि गेरु मरगळिवॆ. अडिकॆ तोट दाटि मुंदॆ होदरॆ भत्तद
  गद्दॆगळिवॆ. मक्कळॆल्लरू गद्दॆय हत्तिर बंदु तलुपिदरु.
story-p2: ‘‘इदु याव बॆळॆ?’’ ऎंदु पीटर् प्रश्निसिद. ‘‘इदु भत्तद बॆळॆ’’ ऎंदरु गुरुगळु.
  ‘‘ओ इदेना! भत्तद पैरु?” तॆनॆगळन्नु कैयिंद मुट्टि प्रश्निसिद पीटर्. ऒंदु भत्तद तॆनॆयन्नु
  कित्तुकॊट्टु ‘‘तगो इदन्नु बिडिसिनोडु’’ ऎंदरु गुरुगळु. शीला तानु ऒंदु तॆनॆ कीळलु
  बागिदाग ऒंदु कप्पॆ चंगनॆ कुप्पळिसितु. सरसर ऒंदु हावु हत्तिरदल्लॆ सरिदु होयितु. मक्कळु
  भयदिंद हिंदॆ नॆगॆदरु. ‘‘हॆदरबेडि, अवु नमगॆ एनु माडुवुदिल्ल. हावु, कप्पॆ, कीट, हक्कि,
  मॊल, हंदि, मुंगुसि मुंताद प्राणिगळु सामान्यवागि तोटद सुत्तमुत्त इरुत्तवॆ’’ ऎंदरु
  गुरुगळु.
story-p3: मक्कळु मातनाडुत्ता गद्दॆय बदुविनल्लि नडॆदु तोडु दाटि अडिकॆ तोटक्कॆ बंदरु.
  तोटद नडुवॆ बिद्दिद्द ऒंदु हण्णन्नु हॆक्किद मेरि ‘‘ओ! इल्लि नोडि सौतॆ कायि!” ऎंदळु.
  “अल्लल्ल! अदु हीरॆकायि” ऎंदनु रफीक्. ‘‘ऎरडू अल्ल. अदु कॊकॊ हण्णु. इदन्नु चाकलेटु
  तयारिसलु बळसुत्तारॆ. यावुदो प्राणि अदन्नु कित्तु हाकिदॆ. बहुशः अळिले इरबेकु’’ ऎंदरु
  गुरुगळु.
story-p4: अष्टरल्लि अज्जि तोटदल्लि एनो माडुत्तिरुवुदन्नु कंड मक्कळु अल्लिगॆ ओडिदरु.
  ‘‘निधानवागि बन्नि. मुळ्ळुगळु इरबहुदु’’ ऎंदु ऎच्चरिसिदरु अज्जि. ‘‘इदेनु? इष्टॊंदु
  गुंडि तोडिद्दीरि?’’ ऎंदु महेश प्रश्निसिदनु. ‘‘नीवॆल्ला निम्म कैयारॆ ऒंदॊंदु हण्णिन
  गिड इदरल्लि नॆडबेकु’’ ऎंदु अज्जि उत्तरिसिदरु. “बेडप्प, नम्म कै कॊळॆयागुत्तदॆ. नन्न
  अम्म बैय्युत्ताळॆ” ऎंदळु अश्विनि. “चॊक्कद चिक्कम्म बारॆ” ऎंदु तमाषॆ माडिद महम्मद्,
  ‘‘कै कॆसरादरॆ बायि मॊसरु’’ ऎंदु हेळुत्ता ऒंदु गिड तॆगॆदुकॊंडु नॆडलु आरंभिसिदनु.
  अंतॆये ऎल्ला मक्कळु ऒंदॊंदु गिड नॆट्टरु. कै तॊळॆदु अज्जि कॊट्ट हण्णन्नु तिंदु तोटदल्लॆल्ला
  सुत्ताडिदरु. तोटदल्लिद्द बाळॆ, अडिकॆ, तॆंगु, काळुमॆणसु, काफि, एलक्कि मॊदलाद गिडगळन्नु
  नोडिदरु.
story-p5: “अज्जी! हाविनमरि” ऎंदु किरुचिदळु शीला. ‘‘अदु हावल्ल, ऎरॆहुळु. इदन्नु रैतन
  मित्र'' ऎंदु करॆयुत्तारॆ. इदर सहायदिंद ऎरॆ गॊब्बर तयारिसुत्तारॆ’’ ऎंदरु गुरुगळु.
  ‘‘नावु रासायनिक गॊब्बर बळसुवुदिल्ल. ऎरॆगॊब्बर, हट्टिगॊब्बर, कोळिगॊब्बर मॊदलाद सावयव
  गॊब्बर बळसि उत्तम बॆळॆगळन्नु बॆळॆयुत्तेवॆ’’ ऎंदरु अज्जि. ऎल्लवन्नु गमनिसुत्तिद्द
  शरणप्प ‘‘सर् नम्म ऊरु बळ्ळारि. अल्लि जोळ, मॆणसु, शेंगा मत्तु तॊगरि बॆळॆयुत्तारॆ’’
  ऎंदनु. ‘‘हौदु मण्णिन गुण हागू हवामानक्कॆ अनुगुणवागि बेरॆ बेरॆ बॆळॆ बॆळॆयुत्तारॆ”
  ऎंदरु शिक्षकरु.
story-p6: ‘‘नम्म ऊरु पश्चिम घट्टद तप्पलिनल्लिदॆ. बॆट्टगुड्ड मरगळिंद कूडिरुव प्रदेशवादुदरिंद
  इल्लि हेरळवागि मळॆ बीळुत्तदॆ. आदुदरिंद हॆच्चु नीरु बेकाद बॆळॆगळन्नु नावु बॆळॆयुत्तेवॆ.
  निम्म ऊरिन कडॆ मळॆ कडिमॆ बीळुवुदरिंद आ बॆळॆगळन्नु बॆळॆयुत्तारॆ'' ऎंदरु अज्जि.
story-p7: अष्टु हॊत्तिगॆ अज्जिय मनॆयल्लि मक्कळिगागि रुचियाद अडुगॆ सिद्धवागित्तु. ‘‘कै
  कालु तॊळॆदु ऊटक्कॆ बन्नि’’ ऎंदु अज्जि करॆदळु. मक्कळु अज्जिय जॊतॆ ऊटक्कॆ हॊरटरु.
story-p8: अज्जिय मनॆय अंगळदल्लिद्द यंत्रवन्नु कंड शीला ‘‘इदेनु गुरुगळे?” ऎंदळु. ‘‘इदु
  गद्दॆ उळुव यंत्र. हिंदॆ नेगिलु, नॊग, ऎत्तु, कोण बळसि हॊल उळुत्तिद्दरु. ईग हॊस साधनगळु
  बंदिवॆ’’ ऎंदरु गुरुगळु.
story-p9: ऎल्लरू रुचि रुचियाद ऊट मुगिसिदरु. कै तॊळॆयलु होद अश्विनि ‘‘इदो नोडि. इल्लू
  सण्ण सण्ण गुंडिगळु इवॆ’’ ऎंदळु. “इवु इंगु गुंडिगळु. ई गुंडिगळ मूलक मळॆय नीरन्नु
  इंगिसुत्तेवॆ. इदु अंतर्जल हॆच्चिसुत्तदॆ. इदरिंद नम्म बावियल्लि नीरु ऎंदू कडिमॆ आगिल्ल”
  ऎंदरु अज्जि.
story-p10: “मक्कळे, नावु मळॆ कॊय्लु मत्तु अंतर्जलद बग्गॆ तरगतियल्लि चर्चिसोण. ईग अज्जिगॆ
  धन्यवाद हेळि हॊरडोण” ऎंदरु गुरुगळु. अष्टरल्लि अज्जि ऎल्लरिगू गोडंबि हंचिदरु. मक्कळु
  तिन्नुत्ता शालॆ कडॆ हॆज्जॆ हाकिदरु.
story-p11: रैत नम्मॆल्लर अन्नदात
