ex-m-q2: अड्ड मरदल्लि बॊड्ड कुळितिद्दानॆ.
ex-m-q3: हसिरु गिडदल्लि मॊसरु चॆल्लिदॆ.
ex-m-q4: मण्णु कॊरॆदॆ कल्लु सिक्कितु, कल्लु कॊरॆदॆ बॆळ्ळि सिक्कितु, बॆळ्ळि कॊरॆदॆ
  नीरु सिक्कितु.
ex-m-p2: (नीवु सस्यगळिगॆ संबंधिसिद इंतह ऒगटुगळन्नु संग्रहिसि)
