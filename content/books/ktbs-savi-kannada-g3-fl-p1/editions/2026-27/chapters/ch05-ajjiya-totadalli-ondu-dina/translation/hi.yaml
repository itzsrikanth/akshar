intro-1: पाठ - 5
intro-2: दादी के बगीचे में एक दिन
intro-3: "सीखने का मार्ग:"
intro-4: क्या आपको इन फसलों के नाम पता हैं? पहचानकर बताइए।
story-p1: मलनाड की तलहटी में कणाबूर नामक एक गाँव है। वहाँ एक उच्च प्राथमिक विद्यालय है। उस विद्यालय के बच्चे किशोर की दादी के बगीचे में शिक्षकों के साथ भ्रमण के लिए निकले। किशोर की दादी का घर पहाड़ी की तलहटी में है। घर के पीछे की पहाड़ी पर काजू के पेड़ हैं। सुपारी के बगीचे को पार करके आगे जाने पर धान के खेत हैं। सभी बच्चे खेत के पास पहुँच गए।
story-p2: '"यह कौन-सी फसल है?" पीटर ने पूछा। "यह धान की फसल है," शिक्षकों ने कहा। "ओह, क्या यही है! धान के पौधे?" पीटर ने अपने हाथ से बालियों को छूते हुए पूछा। धान की एक बाली तोड़कर देते हुए शिक्षकों ने कहा, "लो, इसे छीलकर देखो।" जब शीला एक बाली तोड़ने के लिए झुकी, तो एक मेंढक अचानक उछल पड़ा। पास में ही एक साँप तेजी से खिसक गया। बच्चे डर के मारे पीछे हट गए। "डरो मत, वे हमें कुछ नहीं करेंगे। साँप, मेंढक, कीड़े, पक्षी, खरगोश, सुअर, और नेवले जैसे जानवर आमतौर पर बगीचे के आसपास होते हैं," शिक्षकों ने कहा।'
story-p3: 'बच्चे आपस में बात करते हुए खेत की मेड़ पर चले, नाला पार किया और सुपारी के बगीचे में आ गए। बगीचे के बीच में गिरे एक फल को उठाते हुए मैरी ने कहा, "ओह! यहाँ देखो, ककड़ी!" "नहीं, नहीं! वह तोरई है," रफ़ीक ने कहा। "दोनों नहीं हैं। यह कोको फल है। इसका उपयोग चॉकलेट बनाने के लिए किया जाता है। किसी जानवर ने इसे तोड़कर फेंक दिया है। शायद वह गिलहरी ही होगी," शिक्षकों ने कहा।'
story-p4: 'इतने में, बच्चों ने दादी को बगीचे में कुछ करते हुए देखा और वहाँ दौड़ पड़े। "धीरे-धीरे आओ। काँटे हो सकते हैं," दादी ने चेतावनी दी। "यह क्या है? आपने इतने सारे गड्ढे खोदे हैं?" महेश ने पूछा। "तुम सभी को अपने हाथों से इनमें एक-एक फलों का पौधा लगाना है," दादी ने उत्तर दिया। "नहीं, हमारे हाथ गंदे हो जाएँगे। मेरी माँ मुझे डाँटेगी," अश्विनी ने कहा। मोहम्मद ने उसे चिढ़ाते हुए कहा, "इधर आओ, साफ-सुथरी चाची," और "अगर हाथ मिट्टी से सने हों, तो मुँह में दही (कड़ी मेहनत का फल मीठा होता है)" कहते हुए एक पौधा लिया और उसे लगाना शुरू कर दिया। इसी तरह, सभी बच्चों ने एक-एक पौधा लगाया। हाथ धोकर और दादी द्वारा दिए गए फलों को खाकर, वे पूरे बगीचे में घूमे। उन्होंने बगीचे में केला, सुपारी, नारियल, काली मिर्च, कॉफ़ी और इलायची जैसे पौधे देखे।'
story-p5: '"दादी! एक छोटा साँप," शीला चिल्लाई। "वह साँप नहीं है, वह केंचुआ है। इसे किसान का मित्र कहा जाता है। इसकी मदद से केंचुआ खाद तैयार की जाती है," शिक्षकों ने कहा। "हम रासायनिक खादों का उपयोग नहीं करते हैं। हम केंचुआ खाद, गोबर की खाद, और मुर्गी की खाद जैसी जैविक खादों का उपयोग करके अच्छी फसलें उगाते हैं," दादी ने कहा। सब कुछ देख रहे शरणप्पा ने कहा, "सर, हमारा शहर बल्लारी है। वहाँ ज्वार, मिर्च, मूंगफली और अरहर उगाई जाती है।" "हाँ, मिट्टी की प्रकृति और जलवायु के अनुसार अलग-अलग फसलें उगाई जाती हैं," शिक्षकों ने कहा।'
story-p6: '"हमारा गाँव पश्चिमी घाट की तलहटी में है। चूँकि पहाड़ियाँ और पहाड़ पेड़ों से ढके हुए हैं, इसलिए यहाँ भारी बारिश होती है। इसलिए, हम ऐसी फसलें उगाते हैं जिन्हें अधिक पानी की आवश्यकता होती है। चूँकि आपके शहर की ओर बारिश कम होती है, इसलिए वहाँ वे फसलें उगाई जाती हैं," दादी ने कहा।'
story-p7: तब तक, बच्चों के लिए दादी के घर में स्वादिष्ट भोजन तैयार था। "अपने हाथ-पैर धो लो और खाने के लिए आ जाओ," दादी ने बुलाया। बच्चे दादी के साथ खाने के लिए गए।
story-p8: दादी के घर के आँगन में एक मशीन देखकर शीला ने पूछा, "यह क्या है, सर?" "यह खेत जोतने की मशीन है। अतीत में, वे खेत जोतने के लिए हल, जुआ, बैल और भैंस का उपयोग करते थे। अब नए उपकरण आ गए हैं," शिक्षकों ने कहा।
story-p9: सभी ने स्वादिष्ट भोजन समाप्त किया। अश्विनी, जो अपने हाथ धोने गई थी, ने कहा, "यहाँ देखो। यहाँ भी छोटे-छोटे गड्ढे हैं।" "ये रिसाव गड्ढे (परकोलेशन पिट्स) हैं। हम इन गड्ढों के माध्यम से वर्षा जल को रिसने देते हैं। इससे भूजल बढ़ता है। इस वजह से, हमारे कुएँ का पानी कभी कम नहीं हुआ है," दादी ने कहा।
story-p10: '"बच्चों, आइए हम कक्षा में वर्षा जल संचयन और भूजल के बारे में चर्चा करें। अब दादी को धन्यवाद देते हैं और चलते हैं," शिक्षकों ने कहा। इस बीच, दादी ने सभी को काजू बांटे। उन्हें खाते हुए, बच्चे स्कूल की ओर चल पड़े।'
story-p11: किसान हम सभी का अन्नदाता है
