ex-m-q1: बहन के पौधे को देखो, पौधे पर फल देखो। जिसने फल खाया उसका मुँह देखो।
ex-m-q2: आड़े पेड़ पर एक मोटा बैठा है।
ex-m-q3: हरे पौधे पर दही छलक गया है।
ex-m-q4: मैंने मिट्टी खोदी तो पत्थर मिला, मैंने पत्थर खोदा तो चाँदी मिली, मैंने चाँदी खोदी तो पानी मिला।
ex-m-p2: (पौधों से संबंधित ऐसी पहेलियाँ एकत्र करें)
poem-s1l1: बीज बोना
poem-s1l2: पौधे उगाना |
poem-s1l3: देश को जल-समृद्ध बनाना
poem-s1l4: इसे फलदायी बनाना ||
poem-s2l1: नारियल और सुपारी के पौधे
poem-s2l2: ताड़ और केले के पेड़ |
poem-s2l3: उन्हें बिना किसी बाधा के उगाना
poem-s2l4: प्रचुर मात्रा में फल प्राप्त करना ||
poem-s3l1: आम, कटहल, जामुन
poem-s3l2: नींबू, अंगूर, अमरूद |
poem-s3l3: सेब, चीकू, संतरे
poem-s3l4: हम खुद ही उगाएँगे ||
poem-s4l1: बैंगन, ककड़ी, कद्दू
poem-s4l2: तोरई, चिचिंडा |
poem-s4l3: खुशी से हम शकरकंद, मिर्च
poem-s4l4: और चौलाई उगाएँगे ||
poem-s5l1: विभिन्न अनाज की फसलें
poem-s5l2: सब्जियों के पौधे |
poem-s5l3: उन्हें विभिन्न तरीकों से उगाना
poem-s5l4: प्रचुर मात्रा में फल प्राप्त करना ||
poem-s6l1: प्रचुर मात्रा में बोना
poem-s6l2: प्रचुर मात्रा में उगाना |
poem-s6l3: प्रचुर मात्रा में फल प्राप्त करना
poem-s6l4: संतोष के साथ जीना ||
poem-author: "- अम्मेम्बल अनंतय्या नावडा"
competency: क्या अब आप कक्षा में होने वाले सभी सरल संवादों और विभिन्न चर्चाओं में भाग नहीं लेंगे?
