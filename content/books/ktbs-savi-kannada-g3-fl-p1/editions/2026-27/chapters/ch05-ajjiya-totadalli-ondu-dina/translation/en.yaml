note-malenadu: Malenadu
note-malenadu-def: A land region of Karnataka covered with the Western Ghats.
note-pairu: Crop
note-pairu-def: A crop that yields ears of grain.
note-noga: Yoke
note-noga-def: A long wooden log placed on the ox's neck to pull the plough.
note-negilu: Plough
note-negilu-def: An implement used to plough the land.
note-yantra: Machine
note-yantra-def: An implement that does work.
note-sukshma: Micro
note-sukshma-def: That which is extremely small.
note-totagarike: Gardening
note-totagarike-def: Cultivating a garden.
note-antarjala: Groundwater
note-antarjala-def: Water inside the earth.
note-badu: Ridge
note-badu-def: An earthen bank created at the edge of fields.
note-honda: Pond / Pit
note-honda-def: A low-lying area filled with water.
