intro-1: Lesson - 5
intro-2: A Day in Grandma's Garden
intro-3: "Path to Learning:"
intro-4: Do you know the names of these crops? Identify and tell.
story-p1: Kanaburu is a village at the foothills of Malenadu. There is a higher primary school there. The children of that school went on an excursion to Kishora's grandmother's garden along with their teachers. Kishora's grandmother's house is at the foothills of a mountain. There are cashew trees on the hill behind the house. If you cross the areca nut garden and go further, there are paddy fields. All the children reached near the field.
story-p2: '"Which crop is this?" asked Peter. "This is the paddy crop," said the teachers. "Oh, is this the one! Paddy seedlings?" Peter asked, touching the ears of grain with his hand. Plucking an ear of paddy and giving it to him, the teachers said, "Take this, peel it and see." When Sheela bent down to pluck an ear, a frog suddenly jumped. A snake slithered away quickly nearby. The children jumped back in fear. "Do not be afraid, they will not do anything to us. Animals like snakes, frogs, insects, birds, rabbits, pigs, and mongooses are usually found around the garden," said the teachers.'
story-p3: 'Talking among themselves, the children walked along the ridge of the field, crossed a stream, and came to the areca nut garden. Picking up a fruit that had fallen in the middle of the garden, Mary said, "Oh! Look here, a cucumber!" "No, no! That is a ridge gourd," said Rafiq. "It is neither. It is a cocoa fruit. This is used to make chocolate. Some animal has plucked and dropped it. It must probably be a squirrel," said the teachers.'
story-p4: 'Meanwhile, the children saw Grandma doing something in the garden and ran there. "Come slowly. There might be thorns," Grandma warned. "What is this? You have dug so many pits?" asked Mahesha. "All of you must plant one fruit sapling each in these with your own hands," Grandma replied. "No way, our hands will get dirty. My mother will scold me," said Ashwini. Mohammad teased her saying, "Come here, clean little aunt," and saying "If hands get muddy, the mouth gets curd (hard work pays off)," he took a sapling and started planting it. Similarly, all the children planted one sapling each. After washing their hands and eating the fruits given by Grandma, they wandered all around the garden. They saw plants like banana, areca nut, coconut, black pepper, coffee, and cardamom in the garden.'
story-p5: '"Grandma! A baby snake," screamed Sheela. "That is not a snake, it is an earthworm. It is called the farmer''s friend. Vermicompost is prepared with its help," said the teachers. "We do not use chemical fertilizers. We grow good crops using organic fertilizers like vermicompost, cow dung manure, and poultry manure," said Grandma. Observing everything, Sharanappa said, "Sir, our town is Ballari. Sorghum, chilli, peanuts, and pigeon peas are grown there." "Yes, different crops are grown according to the nature of the soil and the climate," said the teachers.'
story-p6: '"Our village is at the foothills of the Western Ghats. Since the hills and mountains are covered with trees, it rains heavily here. Therefore, we grow crops that need more water. Since it rains less towards your town, those crops are grown there," said Grandma.'
story-p7: By that time, a tasty meal was ready for the children at Grandma's house. "Wash your hands and feet and come for the meal," called Grandma. The children went for the meal with Grandma.
story-p8: Seeing a machine in the courtyard of Grandma's house, Sheela asked, "What is this, sir?" "This is a field ploughing machine. In the past, they used to plough the field using a plough, yoke, ox, and buffalo. Now new equipment has come," said the teachers.
story-p9: Everyone finished the delicious meal. Ashwini, who went to wash her hands, said, "Look here. There are small pits here too." "These are percolation pits. We let the rainwater percolate through these pits. This increases the groundwater. Because of this, the water in our well has never decreased," said Grandma.
story-p10: '"Children, let us discuss rainwater harvesting and groundwater in the class. Now let us thank Grandma and leave," said the teachers. Meanwhile, Grandma distributed cashew nuts to everyone. Eating them, the children walked towards the school.'
story-p11: The farmer is the food provider for all of us
