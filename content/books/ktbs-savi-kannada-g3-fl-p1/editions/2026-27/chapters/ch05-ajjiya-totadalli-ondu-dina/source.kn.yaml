  exercise-A: ಅಭ್ಯಾಸ ಅ — ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-B: ಅಭ್ಯಾಸ ಆ — ಎರಡು-ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-C: ಅಭ್ಯಾಸ ಇ — ವಾಕ್ಯದಲ್ಲಿ ಬಿಟ್ಟಿರುವ ಸ್ಥಳಕ್ಕೆ ಸರಿಯಾದ ಪದ ತುಂಬಿ.
  exercise-D: ಅಭ್ಯಾಸ ಈ — ಹೊಂದಿಸಿ ಬರೆಯಿರಿ.
  exercise-E: ಭಾಷಾ ಚಟುವಟಿಕೆ ಅ — ಕೊಟ್ಟಿರುವ ಪದಗಳನ್ನು ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ರಚಿಸಿ.
  exercise-F: ಭಾಷಾ ಚಟುವಟಿಕೆ ಆ — ಗುಂಪಿಗೆ ಸೇರದ ಪದ ಆರಿಸಿ ಬರೆಯಿರಿ.
  exercise-G: ಭಾಷಾ ಚಟುವಟಿಕೆ ಇ — ಕೆಳಗಿನವುಗಳನ್ನು ಕೂಡಿಸಿ ಬರೆಯಿರಿ.
  exercise-H: ಬಳಕೆ ಚಟುವಟಿಕೆ ಅ — ಕೆಳಗಿನ ಮನೆಗಳಿಂದ ಅಕ್ಷರಗಳನ್ನು ಆರಿಸಿ ನೀರಿನ ಮೂಲಗಳನ್ನು ಕಂಡುಹಿಡಿದು ಬರೆಯಿರಿ.
  exercise-I: ಬಳಕೆ ಚಟುವಟಿಕೆ ಆ — ತರಗತಿಯಲ್ಲಿ ಚರ್ಚಿಸಿ ತೀರ್ಮಾನವನ್ನು ಬರೆಯಿರಿ.
  exercise-J: ಬಳಕೆ ಚಟುವಟಿಕೆ ಇ — ಭಾಷಣವನ್ನು ಇಲ್ಲಿ ಬರೆ.
  exercise-K: ಬಳಕೆ ಚಟುವಟಿಕೆ ಈ — ಗೆಳೆಯರೊಂದಿಗೆ ಚರ್ಚಿಸಿ ಉತ್ತರಿಸಿರಿ.
  exercise-L: ಬಳಕೆ ಚಟುವಟಿಕೆ ಉ — ಆಟ ಆಡೋಣ ಬಾ (ಅನುಕರಣೆ ಆಟ)
  exercise-M: ಬಳಕೆ ಚಟುವಟಿಕೆ ಊ — ಒಗಟು ಓದಿ ಆನಂದಿಸಿ.
