- id: intro-2
  type: prose
  section: intro
  text: ಅಜ್ಜಿಯ ತೋಟದಲ್ಲಿ ಒಂದು ದಿನ
- id: intro-3
  type: prose
  section: intro
  text: "ಕಲಿಕೆಗೆ ದಾರಿ:"
- id: intro-4
  type: question
  section: intro
  text: ಈ ಬೆಳೆಗಳ ಹೆಸರೇನೆಂದು ನಿಮಗೆ ಗೊತ್ತೆ? ಗುರುತಿಸಿ ಹೇಳಿ.
- id: story-p1
  type: prose
  section: story
  text: ಮಲೆನಾಡ ತಪ್ಪಲಿನಲ್ಲಿರುವ ಒಂದು ಊರು ಕಣಬೂರು. ಅಲ್ಲೊಂದು ಹಿರಿಯ ಪ್ರಾಥಮಿಕ ಶಾಲೆ. ಆ ಶಾಲೆಯ ಮಕ್ಕಳು ಕಿಶೋರನ ಅಜ್ಜಿಯ ತೋಟಕ್ಕೆ ಗುರುಗಳೊಂದಿಗೆ ಹೊರ ಸಂಚಾರ ಹೊರಟರು. ಕಿಶೋರನ ಅಜ್ಜಿಯ ಮನೆ ಬೆಟ್ಟದ ತಪ್ಪಲಿನಲ್ಲಿದೆ. ಮನೆಯ ಹಿಂದಿನ ಗುಡ್ಡದಲ್ಲಿ ಗೇರು ಮರಗಳಿವೆ. ಅಡಿಕೆ ತೋಟ ದಾಟಿ ಮುಂದೆ ಹೋದರೆ ಭತ್ತದ ಗದ್ದೆಗಳಿವೆ. ಮಕ್ಕಳೆಲ್ಲರೂ ಗದ್ದೆಯ ಹತ್ತಿರ ಬಂದು ತಲುಪಿದರು.
- id: story-p2
  type: prose
  section: story
  text: "‘‘ಇದು ಯಾವ ಬೆಳೆ?’’ ಎಂದು ಪೀಟರ್ ಪ್ರಶ್ನಿಸಿದ. ‘‘ಇದು ಭತ್ತದ ಬೆಳೆ’’ ಎಂದರು ಗುರುಗಳು. ‘‘ಓ ಇದೇನಾ! ಭತ್ತದ ಪೈರು?” ತೆನೆಗಳನ್ನು ಕೈಯಿಂದ ಮುಟ್ಟಿ ಪ್ರಶ್ನಿಸಿದ ಪೀಟರ್. ಒಂದು ಭತ್ತದ ತೆನೆಯನ್ನು ಕಿತ್ತುಕೊಟ್ಟು ‘‘ತಗೋ ಇದನ್ನು ಬಿಡಿಸಿನೋಡು’’ ಎಂದರು ಗುರುಗಳು. ಶೀಲಾ ತಾನು ಒಂದು ತೆನೆ ಕೀಳಲು ಬಾಗಿದಾಗ ಒಂದು ಕಪ್ಪೆ ಚಂಗನೆ ಕುಪ್ಪಳಿಸಿತು. ಸರಸರ ಒಂದು ಹಾವು ಹತ್ತಿರದಲ್ಲೆ ಸರಿದು ಹೋಯಿತು. ಮಕ್ಕಳು ಭಯದಿಂದ ಹಿಂದೆ ನೆಗೆದರು. ‘‘ಹೆದರಬೇಡಿ, ಅವು ನಮಗೆ ಏನು ಮಾಡುವುದಿಲ್ಲ. ಹಾವು, ಕಪ್ಪೆ, ಕೀಟ, ಹಕ್ಕಿ, ಮೊಲ, ಹಂದಿ, ಮುಂಗುಸಿ ಮುಂತಾದ ಪ್ರಾಣಿಗಳು ಸಾಮಾನ್ಯವಾಗಿ ತೋಟದ ಸುತ್ತಮುತ್ತ ಇರುತ್ತವೆ’’ ಎಂದರು ಗುರುಗಳು."
- id: story-p3
  type: prose
  section: story
  text: "ಮಕ್ಕಳು ಮಾತನಾಡುತ್ತಾ ಗದ್ದೆಯ ಬದುವಿನಲ್ಲಿ ನಡೆದು ತೋಡು ದಾಟಿ ಅಡಿಕೆ ತೋಟಕ್ಕೆ ಬಂದರು. ತೋಟದ ನಡುವೆ ಬಿದ್ದಿದ್ದ ಒಂದು ಹಣ್ಣನ್ನು ಹೆಕ್ಕಿದ ಮೇರಿ ‘‘ಓ! ಇಲ್ಲಿ ನೋಡಿ ಸೌತೆ ಕಾಯಿ!” ಎಂದಳು. “ಅಲ್ಲಲ್ಲ! ಅದು ಹೀರೆಕಾಯಿ” ಎಂದನು ರಫೀಕ್. ‘‘ಎರಡೂ ಅಲ್ಲ. ಅದು ಕೊಕೊ ಹಣ್ಣು. ಇದನ್ನು ಚಾಕಲೇಟು ತಯಾರಿಸಲು ಬಳಸುತ್ತಾರೆ. ಯಾವುದೋ ಪ್ರಾಣಿ ಅದನ್ನು ಕಿತ್ತು ಹಾಕಿದೆ. ಬಹುಶಃ ಅಳಿಲೇ ಇರಬೇಕು’’ ಎಂದರು ಗುರುಗಳು."
- id: story-p4
  type: prose
  section: story
  text: "ಅಷ್ಟರಲ್ಲಿ ಅಜ್ಜಿ ತೋಟದಲ್ಲಿ ಏನೋ ಮಾಡುತ್ತಿರುವುದನ್ನು ಕಂಡ ಮಕ್ಕಳು ಅಲ್ಲಿಗೆ ಓಡಿದರು. ‘‘ನಿಧಾನವಾಗಿ ಬನ್ನಿ. ಮುಳ್ಳುಗಳು ಇರಬಹುದು’’ ಎಂದು ಎಚ್ಚರಿಸಿದರು ಅಜ್ಜಿ. ‘‘ಇದೇನು? ಇಷ್ಟೊಂದು ಗುಂಡಿ ತೋಡಿದ್ದೀರಿ?’’ ಎಂದು ಮಹೇಶ ಪ್ರಶ್ನಿಸಿದನು. ‘‘ನೀವೆಲ್ಲಾ ನಿಮ್ಮ ಕೈಯಾರೆ ಒಂದೊಂದು ಹಣ್ಣಿನ ಗಿಡ ಇದರಲ್ಲಿ ನೆಡಬೇಕು’’ ಎಂದು ಅಜ್ಜಿ ಉತ್ತರಿಸಿದರು. “ಬೇಡಪ್ಪ, ನಮ್ಮ ಕೈ ಕೊಳೆಯಾಗುತ್ತದೆ. ನನ್ನ ಅಮ್ಮ ಬೈಯ್ಯುತ್ತಾಳೆ” ಎಂದಳು ಅಶ್ವಿನಿ. “ಚೊಕ್ಕದ ಚಿಕ್ಕಮ್ಮ ಬಾರೆ” ಎಂದು ತಮಾಷೆ ಮಾಡಿದ ಮಹಮ್ಮದ್, ‘‘ಕೈ ಕೆಸರಾದರೆ ಬಾಯಿ ಮೊಸರು’’ ಎಂದು ಹೇಳುತ್ತಾ ಒಂದು ಗಿಡ ತೆಗೆದುಕೊಂಡು ನೆಡಲು ಆರಂಭಿಸಿದನು. ಅಂತೆಯೇ ಎಲ್ಲಾ ಮಕ್ಕಳು ಒಂದೊಂದು ಗಿಡ ನೆಟ್ಟರು. ಕೈ ತೊಳೆದು ಅಜ್ಜಿ ಕೊಟ್ಟ ಹಣ್ಣನ್ನು ತಿಂದು ತೋಟದಲ್ಲೆಲ್ಲಾ ಸುತ್ತಾಡಿದರು. ತೋಟದಲ್ಲಿದ್ದ ಬಾಳೆ, ಅಡಿಕೆ, ತೆಂಗು, ಕಾಳುಮೆಣಸು, ಕಾಫಿ, ಏಲಕ್ಕಿ ಮೊದಲಾದ ಗಿಡಗಳನ್ನು ನೋಡಿದರು."
- id: story-p5
  type: prose
  section: story
  text: "“ಅಜ್ಜೀ! ಹಾವಿನಮರಿ” ಎಂದು ಕಿರುಚಿದಳು ಶೀಲಾ. ‘‘ಅದು ಹಾವಲ್ಲ, ಎರೆಹುಳು. ಇದನ್ನು ರೈತನ ಮಿತ್ರ'' ಎಂದು ಕರೆಯುತ್ತಾರೆ. ಇದರ ಸಹಾಯದಿಂದ ಎರೆ ಗೊಬ್ಬರ ತಯಾರಿಸುತ್ತಾರೆ’’ ಎಂದರು ಗುರುಗಳು. ‘‘ನಾವು ರಾಸಾಯನಿಕ ಗೊಬ್ಬರ ಬಳಸುವುದಿಲ್ಲ. ಎರೆಗೊಬ್ಬರ, ಹಟ್ಟಿಗೊಬ್ಬರ, ಕೋಳಿಗೊಬ್ಬರ ಮೊದಲಾದ ಸಾವಯವ ಗೊಬ್ಬರ ಬಳಸಿ ಉತ್ತಮ ಬೆಳೆಗಳನ್ನು ಬೆಳೆಯುತ್ತೇವೆ’’ ಎಂದರು ಅಜ್ಜಿ. ಎಲ್ಲವನ್ನು ಗಮನಿಸುತ್ತಿದ್ದ ಶರಣಪ್ಪ ‘‘ಸರ್ ನಮ್ಮ ಊರು ಬಳ್ಳಾರಿ. ಅಲ್ಲಿ ಜೋಳ, ಮೆಣಸು, ಶೇಂಗಾ ಮತ್ತು ತೊಗರಿ ಬೆಳೆಯುತ್ತಾರೆ’’ ಎಂದನು. ‘‘ಹೌದು ಮಣ್ಣಿನ ಗುಣ ಹಾಗೂ ಹವಾಮಾನಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಬೇರೆ ಬೇರೆ ಬೆಳೆ ಬೆಳೆಯುತ್ತಾರೆ” ಎಂದರು ಶಿಕ್ಷಕರು."
- id: story-p6
  type: prose
  section: story
  text: "‘‘ನಮ್ಮ ಊರು ಪಶ್ಚಿಮ ಘಟ್ಟದ ತಪ್ಪಲಿನಲ್ಲಿದೆ. ಬೆಟ್ಟಗುಡ್ಡ ಮರಗಳಿಂದ ಕೂಡಿರುವ ಪ್ರದೇಶವಾದುದರಿಂದ ಇಲ್ಲಿ ಹೇರಳವಾಗಿ ಮಳೆ ಬೀಳುತ್ತದೆ. ಆದುದರಿಂದ ಹೆಚ್ಚು ನೀರು ಬೇಕಾದ ಬೆಳೆಗಳನ್ನು ನಾವು ಬೆಳೆಯುತ್ತೇವೆ. ನಿಮ್ಮ ಊರಿನ ಕಡೆ ಮಳೆ ಕಡಿಮೆ ಬೀಳುವುದರಿಂದ ಆ ಬೆಳೆಗಳನ್ನು ಬೆಳೆಯುತ್ತಾರೆ'' ಎಂದರು ಅಜ್ಜಿ."
- id: story-p7
  type: prose
  section: story
  text: "ಅಷ್ಟು ಹೊತ್ತಿಗೆ ಅಜ್ಜಿಯ ಮನೆಯಲ್ಲಿ ಮಕ್ಕಳಿಗಾಗಿ ರುಚಿಯಾದ ಅಡುಗೆ ಸಿದ್ಧವಾಗಿತ್ತು. ‘‘ಕೈ ಕಾಲು ತೊಳೆದು ಊಟಕ್ಕೆ ಬನ್ನಿ’’ ಎಂದು ಅಜ್ಜಿ ಕರೆದಳು. ಮಕ್ಕಳು ಅಜ್ಜಿಯ ಜೊತೆ ಊಟಕ್ಕೆ ಹೊರಟರು."
- id: story-p8
  type: prose
  section: story
  text: "ಅಜ್ಜಿಯ ಮನೆಯ ಅಂಗಳದಲ್ಲಿದ್ದ ಯಂತ್ರವನ್ನು ಕಂಡ ಶೀಲಾ ‘‘ಇದೇನು ಗುರುಗಳೇ?” ಎಂದಳು. ‘‘ಇದು ಗದ್ದೆ ಉಳುವ ಯಂತ್ರ. ಹಿಂದೆ ನೇಗಿಲು, ನೊಗ, ಎತ್ತು, ಕೋಣ ಬಳಸಿ ಹೊಲ ಉಳುತ್ತಿದ್ದರು. ಈಗ ಹೊಸ ಸಾಧನಗಳು ಬಂದಿವೆ’’ ಎಂದರು ಗುರುಗಳು."
- id: story-p9
  type: prose
  section: story
  text: "ಎಲ್ಲರೂ ರುಚಿ ರುಚಿಯಾದ ಊಟ ಮುಗಿಸಿದರು. ಕೈ ತೊಳೆಯಲು ಹೋದ ಅಶ್ವಿನಿ ‘‘ಇದೋ ನೋಡಿ. ಇಲ್ಲೂ ಸಣ್ಣ ಸಣ್ಣ ಗುಂಡಿಗಳು ಇವೆ’’ ಎಂದಳು. “ಇವು ಇಂಗು ಗುಂಡಿಗಳು. ಈ ಗುಂಡಿಗಳ ಮೂಲಕ ಮಳೆಯ ನೀರನ್ನು ಇಂಗಿಸುತ್ತೇವೆ. ಇದು ಅಂತರ್ಜಲ ಹೆಚ್ಚಿಸುತ್ತದೆ. ಇದರಿಂದ ನಮ್ಮ ಬಾವಿಯಲ್ಲಿ ನೀರು ಎಂದೂ ಕಡಿಮೆ ಆಗಿಲ್ಲ” ಎಂದರು ಅಜ್ಜಿ."
- id: story-p10
  type: prose
  section: story
  text: "“ಮಕ್ಕಳೇ, ನಾವು ಮಳೆ ಕೊಯ್ಲು ಮತ್ತು ಅಂತರ್ಜಲದ ಬಗ್ಗೆ ತರಗತಿಯಲ್ಲಿ ಚರ್ಚಿಸೋಣ. ಈಗ ಅಜ್ಜಿಗೆ ಧನ್ಯವಾದ ಹೇಳಿ ಹೊರಡೋಣ” ಎಂದರು ಗುರುಗಳು. ಅಷ್ಟರಲ್ಲಿ ಅಜ್ಜಿ ಎಲ್ಲರಿಗೂ ಗೋಡಂಬಿ ಹಂಚಿದರು. ಮಕ್ಕಳು ತಿನ್ನುತ್ತಾ ಶಾಲೆ ಕಡೆ ಹೆಜ್ಜೆ ಹಾಕಿದರು."
- id: story-p11
  type: prose
  section: story
  text: ರೈತ ನಮ್ಮೆಲ್ಲರ ಅನ್ನದಾತ
