ex-e-p1: 'Remember: Words denoting males are masculine, words denoting females are feminine, and words denoting
  neither are neuter.'
ex-e-p2: Rewrite the sentences according to the instructions in brackets.
ex-e-q1: The girl brought vegetables. (Write this in the masculine form.)
ex-e-q2: Raju pulled the cart. (Replace “Raju” with “bullock” and form the sentence.)
ex-e-q3: The elder and younger brothers were like friends. (Write this in the feminine form.)
ex-f-q1: Classify these Kannada words as masculine, feminine or neuter. (book, queen, younger brother, table, wall,
