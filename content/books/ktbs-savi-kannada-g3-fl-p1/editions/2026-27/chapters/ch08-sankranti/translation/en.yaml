competency: Reading a text, identifying its main idea, and recounting events in order.
intro-1: There are many festivals. Each is celebrated differently and has something special about it.
intro-2: Learn how the festival described here is celebrated. Compare it with a festival you celebrate and share
  the differences with your friends.
poem-s1l1: The festival is here, the festival is here,
poem-s1l2: The festival, the festival is here!
poem-s1l3: At last it has brought us
poem-s1l4: Bundles and bundles of sugarcane!
poem-s2l1: A crisp, rustling, zari-bordered
poem-s2l2: Skirt she wears!
poem-s2l3: Her little ankle bells
poem-s2l4: Go jingle, jingle!
poem-s3l1: Sesame, sugarcane, moulded sugar sweets,
poem-s3l2: Bananas and jaggery too!
poem-s3l3: Little sister has set off to share them
poem-s3l4: With everyone in the neighbourhood.
poem-s4l1: Off goes our tiny little sister,
poem-s4l2: Together with her friend!
poem-s4l3: A colourful doll from Rangenahalli—
poem-s4l4: Look to your heart's content!
poem-s5l1: Scraping the horns and painting them,
poem-s5l2: The bullocks, cows and calves—
poem-s5l3: Father leads them across the fire, then gives them
poem-s5l4: Rice, jaggery and fruit!
poem-s6l1: Seating all the children on a ceremonial seat,
poem-s6l2: Sesame, jujubes and sugar sweets—
poem-s6l3: Mother and Grandmother shower them over the children;
poem-s6l4: Oh, how the children love it!
