note-dasare: Dasara
note-dasare-def: A ten-day festival from the first day to the tenth day of the bright fortnight.
note-ambari: Ambari (Howdah)
note-ambari-def: A pavilion-like secure seat placed on an elephant for sitting.
note-panju: Panju (Torch)
note-panju-def: A lamp made by wrapping thick cloth around a stick, pouring oil or ghee, and lighting it.
note-kavayatu: Kavayatu (Parade/Drill)
note-kavayatu-def: Drill performed by soldiers, police, and home guards.
note-phalaka: Phalaka (Board/Plaque)
note-phalaka-def: A thin sheet of metal, wood, glass, etc.
note-panjara: Panjara (Cage)
note-panjara-def: An enclosure for keeping birds, animals, etc.
