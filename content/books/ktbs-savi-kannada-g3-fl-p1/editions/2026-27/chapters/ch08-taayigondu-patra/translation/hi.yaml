intro-1: अपने किसी पसंदीदा जानवर के बारे में चार-पाँच वाक्य लिखकर अपने दोस्त से पढ़वाओ।
story-n1: कुशल
story-n2: श्री
story-n3: 9 अक्टूबर-2024
story-n4: बसवना बागेवाड़ी
story-n5: प्यारी माँ को आपके बेटे उल्लास का प्रणाम। मैं, दादाजी, दादीजी, मामाजी, तेजस्विनी और धनुष सभी यहाँ कुशल-मंगल हैं। आप सभी की कुशलता जानने के लिए, मुझे विश्वास है कि यह पत्र मिलते ही आप पत्र लिखेंगी।
story-n6: माँ, इस दशहरा की छुट्टियों में दादाजी हमें मैसूर दशहरा दिखाने ले गए थे। दशहरा जुलूस में झांकियाँ और कला मंडलियों के प्रदर्शन बहुत आकर्षक थे। हाथी पर हौदे में विराजमान चामुंडेश्वरी देवी को देखकर बहुत खुशी हुई। शाम को देखी गई मशाल परेड अब भी आँखों के सामने है।
story-n7: दशहरा खत्म होने के अगले दिन हम चामुंडी पहाड़ी गए और देवी की पूजा की। दादीजी ने मेरे और धनुष के लिए खिलौने खरीदे। तेजस्विनी दीदी के लिए हार और चूड़ियाँ खरीदीं। वहाँ से हम सिटी बस में चढ़कर चिड़ियाघर आ गए।
story-n8: श्री जयचामराजेंद्र चिड़ियाघर में हमने विभिन्न प्रकार के पक्षी देखे। रंग-बिरंगे पक्षियों की 'चीं-चीं' की आवाज़ सुनने में बहुत मीठी लग रही थी। वहाँ से आगे हमने लाल और काले मुँह वाले बंदर देखे। धनुष को उन्हें खाने की चीज़ें देते देख गार्ड ने कहा, 'ऐसा नहीं करना चाहिए।' उसने जगह-जगह लगे 'छूना मना है', 'जानवरों को खाने की चीज़ें न दें' जैसे सूचना बोर्ड दिखाए और पढ़ने को कहा। उसी समय एक शेर दहाड़ा और हमारा ध्यान अपनी ओर खींचा। मामाजी ने कहा, 'शोर किए बिना चुपचाप आओ।'
story-n9: हम मूंगफली खाते हुए एक तरफ से हाथी, हिरणों का झुंड, बाघ, तेंदुआ, शेर और गैंडा देखकर बहुत खुश हुए। पास के एक पेड़ की डाल पर एक वनमानुष हमारी तरह ही चल रहा था। आगे साँपों का साम्राज्य था। वहाँ किंग कोबरा, अजगर जैसे अलग-अलग प्रजातियों के साँपों को देखकर रोंगटे खड़े हो गए! जब पूछा, 'इन साँपों को कहाँ से लाया गया है?', तो वहाँ मौजूद गार्ड ने कहा, 'बांदीपुर के जंगल से।' वहाँ से आगे हमने जिराफ़ देखा। वह अपने बच्चे को दूध पिला रहा था। जिराफ़ की गर्दन देखकर आश्चर्य हुआ। हम वहीं स्थित संग्रहालय भी गए। वहाँ रखे जानवरों के मॉडल असली जानवरों जैसे ही लग रहे थे। यह सब देखते-देखते शाम हो गई।
story-n10: उसके बाद हमने महल देखा और अपने शहर लौट आए।
story-n11: माँ, बहुत खुशी हुई। जब मैं शहर आऊँगा, तो हम सब एक बार फिर मैसूर चलेंगे।
story-n12: मैं बहुत खुशी से यह पत्र लिख रहा हूँ। सभी को मेरा नमस्कार कहिएगा।
