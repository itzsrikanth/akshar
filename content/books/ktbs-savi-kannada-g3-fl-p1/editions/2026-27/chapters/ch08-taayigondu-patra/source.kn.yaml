segments:
- id: intro-1
  type: prose
  section: intro
  text: ನಿನಗಿಷ್ಟವಾದ ಒಂದು ಪ್ರಾಣಿಯ ಬಗ್ಗೆ ನಾಲ್ಕೈದು ವಾಕ್ಯ ಬರೆದು ಸ್ನೇಹಿತನಿಂದ ಓದಿಸು.
- id: story-n1
  type: prose
  section: story
  text: ಕ್ಷೇಮ
- id: story-n2
  type: prose
  section: story
  text: ಶ್ರೀ
- id: story-n3
  type: prose
  section: story
  text: 9ನೆಯ ಅಕ್ಟೋಬರ್-2024
- id: story-n4
  type: prose
  section: story
  text: ಬಸವನ ಬಾಗೇವಾಡಿ
- id: story-n5
  type: prose
  section: story
  text: ಪ್ರೀತಿಯ ಅಮ್ಮನಿಗೆ ನಿಮ್ಮ ಮಗನಾದ ಉಲ್ಲಾಸ ಬೇಡುವ ಆಶೀರ್ವಾದಗಳು. ನಾನು, ಅಜ್ಜ, ಅಜ್ಜಿ, ಮಾವಂದಿರು, ತೇಜಸ್ವಿನಿ ಹಾಗೂ ಧನುಷ ಎಲ್ಲರೂ ಕ್ಷೇಮವಾಗಿದ್ದೇವೆ. ನಿಮ್ಮೆಲ್ಲರ ಕ್ಷೇಮ ಸಮಾಚಾರಕ್ಕಾಗಿ ಈ ಕಾಗದ ತಲುಪಿದ ಕೂಡಲೇ ಕಾಗದ ಬರೆಯುತ್ತೀರೆಂದು ನಂಬಿರುತ್ತೇನೆ.
- id: story-n6
  type: prose
  section: story
  text: ಅಮ್ಮ, ಈ ದಸರೆ ರಜೆಯಲ್ಲಿ ಅಜ್ಜ ನಮ್ಮನ್ನು ಮೈಸೂರು ದಸರೆಗೆ ಕರೆದುಕೊಂಡು ಹೋಗಿದ್ದರು. ದಸರೆ ಮೆರವಣಿಗೆಯಲ್ಲಿನ ಸ್ತಬ್ಧ ಚಿತ್ರಗಳು, ಕಲಾ ತಂಡಗಳ ಪ್ರದರ್ಶನಗಳು ಆಕರ್ಷಕವಾಗಿದ್ದವು. ಆನೆ ಮೇಲೆ ಅಂಬಾರಿಯಲ್ಲಿದ್ದ ಚಾಮುಂಡೇಶ್ವರಿ ದೇವಿ ನೋಡಿ ತುಂಬಾ ಸಂತೋಷವಾಯಿತು. ಸಂಜೆ ನೋಡಿದ ಪಂಜಿನ ಕವಾಯತು ಈಗಲೂ ಕಣ್ಣಿಗೆ ಕಟ್ಟಿದಂತಿದೆ.
- id: story-n7
  type: prose
  section: story
  text: ದಸರೆ ಮುಗಿದ ಮರುದಿನ ಚಾಮುಂಡಿಬೆಟ್ಟಕ್ಕೆ ಹೋಗಿ ದೇವಿಗೆ ಪೂಜೆ ಮಾಡಿಸಿದೆವು. ಅಜ್ಜಿ ನನಗೆ ಮತ್ತು ಧನುಷನಿಗೆ ಆಟದ ಸಾಮಾನು ಕೊಡಿಸಿದರು. ತೇಜಸ್ವಿನಿ ಅಕ್ಕನಿಗೆ ಸರ, ಬಳೆ ಕೊಡಿಸಿದರು. ಅಲ್ಲಿಂದ ನಗರ ಸಾರಿಗೆ ಬಸ್ಸು ಹತ್ತಿ ಪ್ರಾಣಿ ಸಂಗ್ರಹಾಲಯಕ್ಕೆ ಬಂದೆವು.
- id: story-n8
  type: prose
  section: story
  text: ಶ್ರೀ ಜಯಚಾಮರಾಜೇಂದ್ರ ಮೃಗಾಲಯದಲ್ಲಿ ವಿವಿಧ ರೀತಿಯ ಪಕ್ಷಿಗಳನ್ನು ನೋಡಿದೆವು. ಬಣ್ಣ ಬಣ್ಣದ ಹಕ್ಕಿಗಳು ಅವುಗಳ 'ಚಿಂವ್ ಚಿಂವ್' ಧ್ವನಿ ಕೇಳಲು ಸುಮಧುರವಾಗಿತ್ತು. ಅಲ್ಲಿಂದ ಮುಂದೆ ಕೆಂಪು ಮತ್ತು ಕಪ್ಪು ಮುಖದ ಕೋತಿಗಳನ್ನು ಕಂಡೆವು. ಧನುಷನು ಅವುಗಳಿಗೆ ತಿಂಡಿ ಪದಾರ್ಥ ಕೊಡುವುದನ್ನು ನೋಡಿದ ಕಾವಲುಗಾರ 'ಹಾಗೆ ಮಾಡಬಾರದು' ಎಂದನು. ಅಲ್ಲಲ್ಲಿ ಬರೆದು ಹಾಕಿರುವ 'ಮುಟ್ಟಬೇಡಿ', 'ಪ್ರಾಣಿಗಳಿಗೆ ತಿಂಡಿ ಪದಾರ್ಥ ಕೊಡಬೇಡಿ' ಎಂಬ ಸೂಚನಾ ಫಲಕಗಳನ್ನು ನೋಡಿ ಎಂದು ತೋರಿಸಿದನು. ಅದೇ ಸಮಯದಲ್ಲಿ ಸಿಂಹ ಘರ್ಜಿಸಿ ನಮ್ಮನ್ನು ಆ ಕಡೆಗೆ ಸೆಳೆಯಿತು. ಮಾವನವರು 'ಗಲಾಟೆ ಮಾಡದೆ ಮೌನವಾಗಿ ಬನ್ನಿ' ಎಂದರು.
- id: story-n9
  type: prose
  section: story
  text: ನಾವು ಶೇಂಗಾ ತಿನ್ನುತ್ತಾ ಒಂದು ಕಡೆಯಿಂದ ಆನೆ, ಜಿಂಕೆ ಹಿಂಡು, ಹುಲಿ, ಚಿರತೆ, ಸಿಂಹ, ಘೇಂಡಾಮೃಗ ನೋಡಿ ಖುಷಿಪಟ್ಟೆವು. ಪಕ್ಕದ ಮರದ ಕೊಂಬೆಯ ಮೇಲೆ ಕಾಡು ಮನುಷ್ಯ ನಮ್ಮ ಹಾಗೇ ನಡೆದಾಡುತ್ತಿತ್ತು. ಮುಂದೆ ಹಾವುಗಳ ಸಾಮ್ರಾಜ್ಯ. ಅಲ್ಲಿ ಕಾಳಿಂಗ ಸರ್ಪ, ಹೆಬ್ಬಾವು ಮುಂತಾದ ಬೇರೆಬೇರೆ ಜಾತಿಯ ಹಾವುಗಳನ್ನು ಕಂಡು ಮೈ ಜುಮ್! ಎಂದಿತು. 'ಈ ಹಾವುಗಳನ್ನು ಎಲ್ಲಿಂದ ತಂದದ್ದು?' ಎಂದಾಗ, ಅಲ್ಲಿದ್ದ ಕಾವಲುಗಾರ 'ಬಂಡೀಪುರದ ಕಾಡಿನಿಂದ' ಎಂದನು. ಅಲ್ಲಿಂದ ಮುಂದೆ ಜಿರಾಫೆ ನೋಡಿದೆವು. ಅದು ತನ್ನ ಮರಿಗೆ ಹಾಲು ಉಣಿಸುತ್ತಿತ್ತು. ಜಿರಾಫೆಯ ಕತ್ತು ನೋಡಿ ಆಶ್ಚರ್ಯವಾಯಿತು. ಅಲ್ಲಿಯೇ ಇದ್ದ ವಸ್ತು ಸಂಗ್ರಹಾಲಯಕ್ಕೆ ಭೇಟಿ ನೀಡಿದೆವು. ಅಲ್ಲಿಟ್ಟಿದ್ದ ಪ್ರಾಣಿಗಳ ಮಾದರಿಗಳು ನಿಜವಾದ ಪ್ರಾಣಿಗಳೇ ಎಂಬಂತಿದ್ದವು. ಇವೆಲ್ಲವನ್ನು ನೋಡುವಷ್ಟರಲ್ಲಿ ಸಂಜೆ ಆಯಿತು.
- id: story-n10
  type: prose
  section: story
  text: ಆಮೇಲೆ ಅರಮನೆಯನ್ನು ನೋಡಿಕೊಂಡು ಊರಿಗೆ ಹಿಂದಿರುಗಿದೆವು.
- id: story-n11
  type: prose
  section: story
  text: ಅಮ್ಮ, ಬಹಳ ಸಂತೋಷವಾಯಿತು. ನಾನು ಊರಿಗೆ ಬಂದಾಗ ಎಲ್ಲರೂ ಮತ್ತೊಮ್ಮೆ ಮೈಸೂರಿಗೆ ಹೋಗೋಣ.
- id: story-n12
  type: prose
  section: story
  text: ತುಂಬಾ ಖುಷಿಯಿಂದ ಈ ಕಾಗದ ಬರೆದಿರುತ್ತೇನೆ. ಎಲ್ಲರಿಗೂ ನನ್ನ ನಮಸ್ಕಾರಗಳನ್ನು ತಿಳಿಸಿ.
- id: story-n13
  type: prose
  section: story
  text: ಇತಿ ನಿಮ್ಮ ಪ್ರೀತಿಯ ಮಗ
- id: story-n14
