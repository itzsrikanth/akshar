  exercise-B: ಅಭ್ಯಾಸ ಆ — ಎರಡು - ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-C: ಅಭ್ಯಾಸ ಇ — ಖಾಲಿ ಬಿಟ್ಟಿರುವ ಜಾಗದಲ್ಲಿ ಸರಿಯಾದ ಪದ ತುಂಬಿ.
