intro-1: निनगिष्टवाद ऒंदु प्राणिय बग्गॆ नाल्कैदु वाक्य बरॆदु स्नेहितनिंद ओदिसु.
story-n1: क्षेम
story-n2: श्री
story-n3: 9नॆय अक्टोबर्-2024
story-n4: बसवन बागेवाडि
story-n5: प्रीतिय अम्मनिगॆ निम्म मगनाद उल्लास बेडुव आशीर्वादगळु. नानु, अज्ज, अज्जि, मावंदिरु, तेजस्विनि हागू धनुष ऎल्लरू क्षेमवागिद्देवॆ. निम्मॆल्लर क्षेम समाचारक्कागि ई कागद तलुपिद कूडले कागद बरॆयुत्तीरॆंदु नंबिरुत्तेनॆ.
story-n6: अम्म, ई दसरॆ रजॆयल्लि अज्ज नम्मन्नु मैसूरु दसरॆगॆ करॆदुकॊंडु होगिद्दरु. दसरॆ मॆरवणिगॆयल्लिन स्तब्ध चित्रगळु, कला तंडगळ प्रदर्शनगळु आकर्षकवागिद्दवु. आनॆ मेलॆ अंबारियल्लिद्द चामुंडेश्वरि देवि नोडि तुंबा संतोषवायितु. संजॆ नोडिद पंजिन कवायतु ईगलू कण्णिगॆ कट्टिदंतिदॆ.
story-n7: दसरॆ मुगिद मरुदिन चामुंडिबॆट्टक्कॆ होगि देविगॆ पूजॆ माडिसिदॆवु. अज्जि ननगॆ मत्तु धनुषनिगॆ आटद सामानु कॊडिसिदरु. तेजस्विनि अक्कनिगॆ सर, बळॆ कॊडिसिदरु. अल्लिंद नगर सारिगॆ बस्सु हत्ति प्राणि संग्रहालयक्कॆ बंदॆवु.
story-n8: श्री जयचामराजेंद्र मृगालयदल्लि विविध रीतिय पक्षिगळन्नु नोडिदॆवु. बण्ण बण्णद हक्किगळु अवुगळ 'चिंव् चिंव्' ध्वनि केळलु सुमधुरवागित्तु. अल्लिंद मुंदॆ कॆंपु मत्तु कप्पु मुखद कोतिगळन्नु कंडॆवु. धनुषनु अवुगळिगॆ तिंडि पदार्थ कॊडुवुदन्नु नोडिद कावलुगार 'हागॆ माडबारदु' ऎंदनु. अल्लल्लि बरॆदु हाकिरुव 'मुट्टबेडि', 'प्राणिगळिगॆ तिंडि पदार्थ कॊडबेडि' ऎंब सूचना फलकगळन्नु नोडि ऎंदु तोरिसिदनु. अदे समयदल्लि सिंह घर्जिसि नम्मन्नु आ कडॆगॆ सॆळॆयितु. मावनवरु 'गलाटॆ माडदॆ मौनवागि बन्नि' ऎंदरु.
story-n9: नावु शेंगा तिन्नुत्ता ऒंदु कडॆयिंद आनॆ, जिंकॆ हिंडु, हुलि, चिरतॆ, सिंह, घेंडामृग नोडि खुषिपट्टॆवु. पक्कद मरद कॊंबॆय मेलॆ काडु मनुष्य नम्म हागे नडॆदाडुत्तित्तु. मुंदॆ हावुगळ साम्राज्य. अल्लि काळिंग सर्प, हॆब्बावु मुंताद बेरॆबेरॆ जातिय हावुगळन्नु कंडु मै जुम्! ऎंदितु. 'ई हावुगळन्नु ऎल्लिंद तंदद्दु?' ऎंदाग, अल्लिद्द कावलुगार 'बंडीपुरद काडिनिंद' ऎंदनु. अल्लिंद मुंदॆ जिराफॆ नोडिदॆवु. अदु तन्न मरिगॆ हालु उणिसुत्तित्तु. जिराफॆय कत्तु नोडि आश्चर्यवायितु. अल्लिये इद्द वस्तु संग्रहालयक्कॆ भेटि नीडिदॆवु. अल्लिट्टिद्द प्राणिगळ मादरिगळु निजवाद प्राणिगळे ऎंबंतिद्दवु. इवॆल्लवन्नु नोडुवष्टरल्लि संजॆ आयितु.
story-n10: आमेलॆ अरमनॆयन्नु नोडिकॊंडु ऊरिगॆ हिंदिरुगिदॆवु.
story-n11: अम्म, बहळ संतोषवायितु. नानु ऊरिगॆ बंदाग ऎल्लरू मत्तॊम्मॆ मैसूरिगॆ होगोण.
story-n12: तुंबा खुषियिंद ई कागद बरॆदिरुत्तेनॆ. ऎल्लरिगू नन्न नमस्कारगळन्नु तिळिसि.
story-n13: इति निम्म प्रीतिय मग
story-n14: उल्लास
