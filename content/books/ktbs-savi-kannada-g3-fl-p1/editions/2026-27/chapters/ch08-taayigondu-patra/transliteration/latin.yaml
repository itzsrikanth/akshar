intro-1: Ninagishtavaada omdu praaniya bagge naalkaidu vaakya baredu snehitanimda oodisu.
story-n1: Kshema
story-n2: Shree
story-n3: 9neya aktoobar-2024
story-n4: Basavana baagevaadi
story-n5: Preetiya ammanige nimma maganaada ullaasa beduva aasheervaadagalu. naanu, ajja, ajji, maavamdiru, tejasvini haagoo dhanusha ellaroo kshemavaagiddeve. nimmellara kshema samaachaarakkaagi ee kaagada talupida koodale kaagada bareyutteeremdu nambiruttene.
story-n6: Amma, ee dasare rajeyalli ajja nammannu maisooru dasarege karedukomdu hoogiddaru. dasare meravanigeyallina stabdha chitragalu, kalaa tamdagala pradarshanagalu aakarshakavaagiddavu. aane mele ambaariyallidda chaamumdeshvari devi noodi tumbaa samtooshavaayitu. samje noodida pamjina kavaayatu eegaloo kannige kattidamtide.
story-n7: Dasare mugida marudina chaamumdibettakke hoogi devige pooje maadisidevu. ajji nanage mattu dhanushanige aatada saamaanu kodisidaru. tejasvini akkanige sara, bale kodisidaru. allimda nagara saarige bassu hatti praani samgrahaalayakke bamdevu.
story-n8: Shree jayachaamaraajemdra mrugaalayadalli vividha reetiya pakshigalannu noodidevu. banna bannada hakkigalu avugala 'chimv chimv' dhvani kelalu sumadhuravaagittu. allimda mumde kempu mattu kappu mukhada kootigalannu kamdevu. dhanushanu avugalige timdi padaartha koduvudannu noodida kaavalugaara 'haage maadabaaradu' emdanu. allalli baredu haakiruva 'muttabedi', 'praanigalige timdi padaartha kodabedi' emba soochanaa phalakagalannu noodi emdu toorisidanu. ade samayadalli simha gharjisi nammannu aa kadege seleyitu. maavanavaru 'galaate maadade maunavaagi banni' emdaru.
story-n9: Naavu shemgaa tinnuttaa omdu kadeyimda aane, jimke himdu, huli, chirate, simha, ghemdaamruga noodi khushipattevu. pakkada marada kombeya mele kaadu manushya namma haage nadedaaduttittu. mumde haavugala saamraajya. alli kaalimga sarpa, hebbaavu mumtaada berebere jaatiya haavugalannu kamdu mai jum! emditu. 'ee haavugalannu ellimda tamdaddu?' emdaaga, allidda kaavalugaara 'bamdeepurada kaadinimda' emdanu. allimda mumde jiraaphe noodidevu. adu tanna marige haalu unisuttittu. jiraapheya kattu noodi aashcharyavaayitu. alliye idda vastu samgrahaalayakke bheti needidevu. allittidda praanigala maadarigalu nijavaada praanigale embamtiddavu. ivellavannu nooduvashtaralli samje aayitu.
story-n10: Aamele aramaneyannu noodikomdu oorige himdirugidevu.
story-n11: Amma, bahala samtooshavaayitu. naanu oorige bamdaaga ellaroo mattomme maisoorige hoogoona.
story-n12: Tumbaa khushiyimda ee kaagada barediruttene. ellarigoo nanna namaskaaragalannu tilisi.
story-n13: Iti nimma preetiya maga
