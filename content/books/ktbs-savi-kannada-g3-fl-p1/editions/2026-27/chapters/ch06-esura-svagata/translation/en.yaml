intro-1: You are a pupil. You have some belongings of your own, don't you? If someone tries to take them away, who
  should protect them? Why? How would you protect them?
intro-2: What would you do if someone tried to take away your home, field or other belongings?
intro-3: If someone came to harm your village, who should protect it? Read about the struggle described here.
story-n1: “Whatever villages we may give up, we will not give up Esuru.”
story-n2: 'You heard the brave words of my children! What? Are you curious to know who I am? Listen: I am the village
  of Esuru, in Shikaripura taluk of Shivamogga district, on the right bank of the Kumudvati River. My children loved
  freedom. They formed their own government, fought the British and brought honour to our land.'
story-n3: It was the time of British rule. As their subjects, we suffered much pain and oppression. Indians became
  determined to drive the British out and be free. Mahatma Gandhi began the movement, “British, Quit India.”
story-n4: Inspired by this, my people launched a movement to refuse taxes to the British government. They urged
  people not to fear officials and raised slogans against government officials and offices. On 25 September 1942,
  they defied British authority. Their cry, “Whatever villages we may give up, we will not give up Esuru,” reached
  the skies. They declared me an “independent village” and pledged to form their own government and run the village.
story-n5: The next day, British officials Patel Channabasavayya and village accountant Ranganath Rao came to collect
  revenue with their account books. Young protesters opposed them and requested, “Resign and wear Gandhi caps.”
  An argument followed. When the officials refused, the protesters took away their account books. The officials
  were defeated and returned without retrieving them.
story-n6: The struggle did not end there. On the evening of 27 September 1942, the villagers held a secret meeting
  under the flag in the courtyard before the Veerabhadra temple. They formed their own government, including children—the
  citizens of the future—to protect me. They appointed the children Sahukar Jayanna as revenue officer and Mallappayya
  as police officer. Other children joined them.
story-n7: 'At the village gateway they hung a sign: “Irresponsible government officials may not enter Esuru.” They
  opened their office there. Did you notice the courage of my children?'
story-n8: Patel Channabasavayya and Ranganath Rao returned for their account books. The child officials of the new
  government stopped them and ordered them to resign, wear Gandhi caps and work for the new government. They refused.
  They were fined fifty rupees. When they did not pay, they were punished by being made to stand on one leg for
  three hours.
story-n9: I must tell you of the suffering my children faced because of this.
story-n10: The British officials were angered by the children's bold action. The taluk revenue officer raided the
  village with a police officer and staff. The people protested to prevent them from entering. The angry officials
  struck the unarmed people with batons, beating everyone they could catch.
story-n11: The enraged people's protest grew stronger. Again the slogan “Whatever villages we may give up, we will
  not give up Esuru” rang out. The police lost patience and fired on the people. The furious villagers rushed at
  them. Revenue officer Channakrishnappa and police officer Kenchegowda died.
story-n12: The British government heard the news. It sent more police and troops and had Esuru plundered. Many people,
  including women and children, were tortured. Cases were filed against several people for rebelling against the
  government. Later, five of those brave people were sentenced to death.
story-n13: My people's love of freedom and my children's courage became known in every Kannada home. I am blessed
  to have been the first in all India to be called an “independent village” before independence.
