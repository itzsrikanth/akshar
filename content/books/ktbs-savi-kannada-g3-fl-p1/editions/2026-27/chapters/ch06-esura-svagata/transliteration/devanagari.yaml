competency: अक्षरगळन्नु मत्तु पदगळन्नु सरियाद विन्यास, अनुक्रमणिके हागू सूक्त अंतरदोंदिगे बरेयुवुदु.
intro-1: नीनु विद्यार्थि. निन्नल्लि निन्नदे आद केलवु वस्तुगळिवे अल्लवे? निन्न वस्तुगळन्नु यारादरू कसिदुकोळ्ळलु बंदरे
  अदन्नु यारु रक्षिसबेकु? एके रक्षिसबेकु? हेगे रक्षिसिकोळ्ळुवे?
intro-2: निम्म मने, होल मत्तितर सामग्रिगळन्नु यारादरू कसिदुकोळ्ळलु बंदरे नीनु एनु माडुवे?
intro-3: निम्म ऊरिगे यारादरू केडु माडलु बंदरे ऊरन्नु यारु रक्षिसबेकु? ई बग्गे इल्लिन होराटवन्नु गमनिसु.
story-n1: “एसूरु कोट्टरू ईसूरु बिडेवु”
story-n2: केळिदिरल्ल! नन्न मडिल मक्कळ धीर मातुगळन्न. एनु? नानु यारेंदु तिळियुव कुतूहलवे? केळि नानु ईसूरु एंब ग्राम.
  नानु शिवमोग्ग जिल्ले शिकारिपुर ताल्लूकिनल्लिद्देने. कुमुद्वति नदिय बलदंडेय मेलिरुव नन्न मडिलिन मक्कळु तम्मदे सर्कार
  रचिसिकोंडु ब्रिटिषर विरुद्ध होराडिद स्वातंत्र्य प्रेमिगळु, नाडिगे कीर्ति तंदवरु.
story-n3: नम्मन्नु ब्रिटिषरु आळुत्तिद्द काल. नावु अवर गुलामरागि, तुंबा नोवु, हिंसे अनुभविसबेकागित्तु. ब्रिटिषरन्नु
  भारतदिंद ओडिसबेकु, नावु स्वतंत्ररागबेकु एंब छल भारतीयरल्लि मूडितु. महात्म गांधियवरु “ब्रिटिषरे, भारत बिट्टु तोलगि”
  एंब चळुवळि आरंभिसिदरु.
story-n4: इदरिंद प्रेरितराद नन्न जनते ब्रिटिष् सर्कारक्के तेरिगे कोडदंते चळुवळि नडेसिदरु. अधिकारिगळिगे हेदरदंते
  जनरिगे करे कोट्टरु. सर्कारि अधिकारिगळिगे, कछेरिगळिगे धिक्कार कूगिदरु. 25 सेप्टंबर् 1942रंदु ब्रिटिष् सर्कारद अधिकारवन्नु
  धिक्करिसिदरु. “एसूरु कोट्टरू ईसूरु बिडेवु” एंब जनर घोषणे मुगिलु मुट्टितु. नन्नन्नु ‘स्वतंत्र हळ्ळि’ एंदु सारिदरु.
  तम्मदे आद सर्कार रचिसिकोंडु ग्रामद आडळित नडेसलु पणतोट्टरु.
story-n5: मरुदिन ब्रिटिष् सर्कारि अधिकारिगळाद पटेल् चन्नबसवय्य मत्तु शानुभोग रंगनाथराव् कंदायद वसूलिगे नन्नल्लिगे
  बंदरु. खाते-किर्दि पुस्तकगळोंदिगे कंदाय वसूलिगे बंद अधिकारिगळन्नु होराटगार युवकरु विरोधिसिदरु. “राजीनामे कोडि,
  गांधि टोपि धरिसि” एंदु विनंतिसिदरु. मातिन चकमकि नडेयितु. विनंतिगे ओप्पद अधिकारिगळिंद होराटगाररु खाते-किर्दि पुस्तकगळन्नु
  कसिदुकोंडरु. अधिकारिगळु सोतरु. तावु तंद पुस्तकगळन्नु पडेयलागदे हिंदिरुगिदरु.
story-n6: होराट अल्लिगे निल्ललिल्ल. 1942 सेप्टंबर् 27 रंदु संजे ग्रामस्थरु वीरभद्र देवस्थानद मुंदिन अंगळदल्लि हारिसिद्द
  ध्वजद केळगे गुप्त सभे नडेसिदरु. भविष्यद प्रजेगळाद मक्कळन्नु ओळगोंड तम्मदे सर्कारवन्नु रचिसि नन्न रक्षणेगे निंतरु.
  मक्कळाद साहुकार् जयण्णनन्नु अमल्दारनन्नागियू, मल्लप्पय्यनन्नु पोलीस् अधिकारियन्नागियू नेमिसिदरु. इवरोंदिगे इतरे
  मक्कळू सेरिकोंडरु.
story-n7: ऊरिन अगसे बागिलिनल्लि “बेजवाब्दारि सर्कारि अधिकारिगळिगे ईसूरिनल्लि प्रवेशविल्ल” एंब फलकवन्नु तूगुहाकिदरु.
  अल्ले कछेरियन्नु प्रारंभिसिदरु. गमनिसिदिरा नन्न मडिलिन मक्कळ साहसवन्नु?
story-n8: खाते-किर्दि पुस्तकवन्नु पडेयलु पटेल् चन्नबसवय्य मत्तु शानुभोग रंगनाथराव् मत्ते बंदरु. मक्कळिंद रचनेयाद
  होस सर्कारद अधिकारिगळु अवरिब्बरन्नु तडेदरु. राजीनामे कोट्टु, गांधि टोपि हाकिकोंडु, तावु रचिसिद सर्कारदल्लि केलस
  माडबेकेंदु अवरिगे आज्ञे माडिदरु. इदक्के अवरु ओप्पलिल्ल. अवरिगे ऐवत्तु रूपायि दंड विधिसलायितु. दंड कट्टद अवरिगे
  मूरु गंटे काल ओंटि कालिनल्लि निल्लुवंते शिक्षे विधिसलायितु.
story-n9: इदरिंद नन्न मडिलिन मक्कळु अनुभविसिद नोवन्नु निमगे हेळलेबेकु.
story-n10: नन्न मक्कळ ई साहसवन्नु तिळिद ब्रिटिष् अधिकारिगळु कोपगोंडरु. ताल्लूकिन अमल्दाररु, पोलीस् अधिकारि मत्तु
  सिब्बंदियोंदिगे ग्रामक्के दाळियिट्टरु. ब्रिटिष् अधिकारिगळु ग्राम प्रवेशिसदंते जनरु प्रतिभटिसिदरु. कोपगोंड अधिकारिगळु
  निरायुध जनर मेले लाठि बीसिदरु. सिक्कवरन्नेल्ल चच्चिदरु.
story-n11: रोच्चिगेद्द जनर प्रतिभटने हेच्चायितु. “एसूरु कोट्टरू ईसूरु बिडेवु” एंब घोषणे मत्तोम्मे मुगिलु मुट्टितु.
  पोलीसरु ताळ्मे कळेदुकोंडु, जनर मेले गुंडु हारिसिदरु. रोच्चिगेद्द नम्म जनरु अवर मेले मुगिबिद्दरु. अमल्दार चन्नकृष्णप्प
  मत्तु पोलीस् अधिकारि केंचेगौड सत्तरु.
story-n12: ब्रिटिष् सर्कारक्के विषय मुट्टितु. हेच्चिन पोलीस् मत्तु सैन्यदळवन्नु कळिसि ईसूरन्नु लूटि माडिसितु. हेंगसरु
  मक्कळेन्नदे अनेकरु चित्रहिंसेगे गुरियादरु. सर्कारद विरुद्ध बंडेद्दरेंदु हलवर विरुद्ध मोकद्दमे हूडलायितु. मुंदे
  आ वीररल्लि ऐवरु मरणदंडनेगे गुरियादरु.
story-n13: नन्न जनर स्वातंत्र्य प्रेम हागू मक्कळ धैर्यवु कन्नडिगर मने मातायितु. इडी भारतदल्ले स्वातंत्र्य पूर्वदल्लि
  मोट्ट मोदलिगे ‘स्वतंत्र हळ्ळि’ एंब हेसरन्नु पडेद नाने धन्य.
