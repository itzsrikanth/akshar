ex-h-q1: Kannadada kavigala bhaavachitra sangrahisi ‘bhaavachitra kosha’ tayaarisiri
ex-i-q1: Tagarige taragu tandu haaku.
ex-i-q2: Tarikere eri mele mooru kari kurimari.
ex-i-q3: Kappu kunkuma kempu kunkuma.
ex-i-q4: Kaage pukka goobe pukka.
