ex-a-q1: Kannadada kanda yaavudakkaagi horaadabeku?
ex-a-q2: Kannadavannu maretare yaarannu maretante?
ex-a-q3: Kannadada kanda yaavudannu mareyabaaradu?
ex-a-q4: Kannada nudiya sogasannu yaavudakke holisalaagide?
ex-b-q1: Kannadake horaadu kannadada ________. (1. Veera 2. Shoora 3. Dheera 4. Kandaa)
ex-b-q2: Mareteyaadare ________ maretante nanna. (1. Dammayya 2. Ayyo 3. Kandayya 4. Nanna)
ex-b-q3: Moleya haalentante ________ baayge. (1. Hejjenu 2. Kirujenu 3. Savijenu 4. Haaljenu)
ex-b-q4: Horaadu kannadake ________ rannaa. (1. Veeranaagi 2. Shooranaagi 3. Kaliyaagi 4. Dheeranaagi)
