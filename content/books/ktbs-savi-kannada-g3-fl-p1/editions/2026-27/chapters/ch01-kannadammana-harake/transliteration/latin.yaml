ex-f-q1: Kottiruva ottaksharagalannu gamanisi. Vruttadolage sajaati ottakshara haagoo chaukadalli vijaati ottaksharagalannu bareyiri. Nna, sno, shta, hra, bba, yya, sta, ṭṭa, tta, mma, shre, ksha, ppa, shne. [Sampaadakeeya chitra ullekha — g04-fl-p1-2026-27.pdf, mudrita puta 4, PDF puta 18 (1rinda enike); ottaksharagala kelagina saalinalliruva khaali vruttagalu mattu chaukagalu.]
