intro-1: Sing a song you know about the land of Kannada to a tune in class.
poem-s1l1: Strive for Kannada,
poem-s1l2: O child of Kannada;
poem-s1l3: Protect Kannada,
poem-s1l4: You who are my joy.
poem-s2l1: This is a blessing in a lullaby;
poem-s2l2: Do not forget it, my precious child.
poem-s2l3: If you forget it, alas,
poem-s2l4: It is as though you have forgotten me.
poem-s3l1: Like a mother's milk,
poem-s3l2: It is sweet honey to the mouth;
poem-s3l3: Like a mother's embrace,
poem-s3l4: It brings great comfort to the body.
poem-s4l1: Like a teacher's good words,
poem-s4l2: It brings well-being to life;
poem-s4l3: Work for your mother tongue till you die,
poem-s4l4: For well-being in this world and the next.
poem-s5l1: I implore you, dear child,
poem-s5l2: I plead with you;
poem-s5l3: Mother Kannada's blessing—
poem-s5l4: Do not forget it, my precious child.
poem-s6l1: If you forget it, alas,
poem-s6l2: It is as though you have forgotten me;
poem-s6l3: Strive for Kannada
poem-s6l4: Like a brave hero, my jewel.
intro-2: A child who learns Kannada will keep moving forward.
vocab-kaapaadu: Protect
vocab-kaapaadu-def: Safeguard, nurture
vocab-dudi: Work
vocab-dudi-def: Do work, make an effort
vocab-bedu: Plead
vocab-bedu-def: Ask, beg
vocab-madi: Die
vocab-madi-def: Die, meet one's death
vocab-shreyassu: Well-being
vocab-shreyassu-def: Progress, development
vocab-horaadu: Strive
vocab-horaadu-def: Struggle, fight
vocab-appuge: Embrace
vocab-appuge-def: A hug
vocab-kali: Hero
vocab-kali-def: A brave person, a warrior
vocab-savi: Taste
vocab-savi-def: Flavour
note-ihapara: This world and the next
note-ihapara-def: Earthly and spiritual life; this world and the next world.
note-jogula: Lullaby
note-jogula-def: A song sung to put children to sleep.
note-taaynudi: Mother tongue
note-taaynudi-def: A mother's language, one's native language, the language spoken at home.
note-dammayya: I implore you
note-dammayya-def: Pleading humbly.
ex-a-q1: What should the child of Kannada strive for?
ex-a-q2: Whom is one said to have forgotten if one forgets Kannada?
ex-a-q3: What must the child of Kannada not forget?
ex-a-q4: What is the sweetness of the Kannada language compared to?
ex-b-q1: Strive for Kannada, O ________ of Kannada. (1. ವೀರ 2. ಶೂರ 3. ಧೀರ 4. ಕಂದಾ)
ex-b-q2: If you forget it, ________, it is as though you have forgotten me. (1. ದಮ್ಮಯ್ಯ 2. ಅಯ್ಯೊ 3. ಕಂದಯ್ಯ 4. ನನ್ನ)
ex-b-q3: Like a mother's milk, it is ________ to the mouth. (1. ಹೆಜ್ಜೇನು 2. ಕಿರುಜೇನು 3. ಸವಿಜೇನು 4. ಹಾಲ್ಜೇನು)
ex-b-q4: Strive for Kannada ________, my jewel. (1. ವೀರನಾಗಿ 2. ಶೂರನಾಗಿ 3. ಕಲಿಯಾಗಿ 4. ಧೀರನಾಗಿ)
