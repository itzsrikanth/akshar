intro-1: कन्नड़ प्रदेश के बारे में तुम्हें जो गीत आता है, उसे कक्षा में सुर में गाओ।
poem-s1l1: कन्नड़ के लिए संघर्ष करो,
poem-s1l2: कन्नड़ के प्यारे बच्चे;
poem-s1l3: कन्नड़ की रक्षा करो,
poem-s1l4: मेरे आनंद, मेरे लाल।
poem-s2l1: यह लोरी में दिया आशीर्वाद है,
poem-s2l2: इसे मत भूलना, मेरे प्यारे;
poem-s2l3: अगर भूल गए, तो हाय,
poem-s2l4: मानो मुझे ही भूल गए।
poem-s3l1: माँ के दूध की तरह,
poem-s3l2: यह मुँह में मीठा शहद है;
poem-s3l3: माँ की बाँहों की तरह,
poem-s3l4: यह तन को बड़ा सुख देती है।
poem-s4l1: गुरु के अच्छे वचनों की तरह,
poem-s4l2: यह जीवन का कल्याण करती है;
poem-s4l3: जीवन के अंत तक मातृभाषा के लिए काम करो,
poem-s4l4: इस लोक और परलोक के कल्याण के लिए।
poem-s5l1: विनती करती हूँ, मेरे बच्चे,
poem-s5l2: तुमसे प्रार्थना करती हूँ;
poem-s5l3: कन्नड़ माँ का आशीर्वाद,
poem-s5l4: मत भूलना, मेरे प्यारे।
poem-s6l1: अगर भूल गए, तो हाय,
poem-s6l2: मानो मुझे ही भूल गए;
poem-s6l3: कन्नड़ के लिए संघर्ष करो,
poem-s6l4: वीर बनकर, मेरे रतन।
intro-2: कन्नड़ सीखने वाला बच्चा सदा आगे बढ़ेगा।
vocab-kaapaadu: रक्षा करना
vocab-kaapaadu-def: बचाना, पालन-पोषण करना
