ex-f-q1: दिए गए संयुक्त अक्षरों को देखिए। एक ही व्यंजन को जोड़कर बने संयुक्त अक्षर गोलों में और अलग-अलग व्यंजनों को जोड़कर बने संयुक्त अक्षर वर्गों में लिखिए। ನ್ನ, ಸ್ನೊ, ಷ್ಟ, ಹ್ರ, ಬ್ಬ, ಯ್ಯ, ಸ್ತ, ಟ್ಟ, ತ್ತ, ಮ್ಮ, ಶ್ರೇ, ಕ್ಷ, ಪ್ಪ, ಶ್ನೆ. [संपादकीय चित्र संदर्भ — g04-fl-p1-2026-27.pdf, मुद्रित पृष्ठ ४, PDF पृष्ठ १८ (१ से गिनती); संयुक्त अक्षरों के नीचे खाली गोलों और वर्गों की पंक्ति।]
ex-g-q1: बड़ों से लोरियाँ सीखकर इकट्ठा कीजिए और उनका अभ्यास कीजिए।
ex-h-q1: कन्नड़ कवियों के चित्र इकट्ठा करके एक चित्र-संग्रह बनाइए।
ex-i-q1: मेढ़े के लिए सूखी पत्तियाँ लाकर डालो।
ex-i-q2: तरिकेरे की मेड़ पर तीन काले मेमने।
ex-i-q3: काला कुमकुम, लाल कुमकुम।
ex-i-q4: कौए का पंख, उल्लू का पंख।
ex-j-q1: कविता में तुम्हें जो चार पंक्तियाँ पसंद हैं, उन्हें लिखो।
ex-k-q1: इस कविता की पंक्तियाँ याद करके अपनी धुन में गाओ।
competency: अब तुम याद की हुई कविता अपनी धुन में गा सकते हो, है न?
