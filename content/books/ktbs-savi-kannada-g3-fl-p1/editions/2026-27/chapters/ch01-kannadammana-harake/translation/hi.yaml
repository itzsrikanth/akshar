note-dammayya-def: विनम्रता से प्रार्थना करना।
ex-a-q1: कन्नड़ के बच्चे को किसके लिए संघर्ष करना चाहिए?
ex-a-q2: कन्नड़ को भूलने पर किसे भूल जाने जैसा होता है?
ex-a-q3: कन्नड़ के बच्चे को क्या नहीं भूलना चाहिए?
ex-a-q4: कन्नड़ भाषा की मधुरता की तुलना किससे की गई है?
ex-b-q1: कन्नड़ के लिए संघर्ष करो, कन्नड़ के ________। (१. ವೀರ २. ಶೂರ ३. ಧೀರ ४. ಕಂದಾ)
ex-b-q2: अगर भूल गए, तो ________, मानो मुझे ही भूल गए। (१. ದಮ್ಮಯ್ಯ २. ಅಯ್ಯೊ ३. ಕಂದಯ್ಯ ४. ನನ್ನ)
ex-b-q3: माँ के दूध की तरह, मुँह में ________। (१. ಹೆಜ್ಜೇನು २. ಕಿರುಜೇನು ३. ಸವಿಜೇನು ४. ಹಾಲ್ಜೇನು)
ex-b-q4: कन्नड़ के लिए संघर्ष करो, ________, मेरे रतन। (१. ವೀರನಾಗಿ २. ಶೂರನಾಗಿ ३. ಕಲಿಯಾಗಿ ४. ಧೀರನಾಗಿ)
