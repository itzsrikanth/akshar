competency: Pathyadallina mukhya vishayavannu gurutisuvudu. Eke emba prashnege uttarisuvudu.
intro-1: 'Ee chitragalalliruva vyaktigalannu gurutisu. Ee mahaneeyaru deshakkaagi mattu samaaja sevegaagi horaadidavaru.
  [sampaadakeeya chitra ullekha: 3rd_KANNADA_FL_Part_1_2026-27.pdf, mudrita puta 48, PDF puta 61 (1rinda enike),
  pravesha bhaagada bhaavachitragalu.]'
intro-2: Ivara baalyavannu hintirugi nodidare sahaja tuntaatada naduve kelavu aadarshada gunagalu kandubaruttave.
  Aadarsha gunagalannu maigoodisikondu beleda obba netaarana baalya mattu badukannu tiliyona.
story-n1: Shaaleya gante baarisitu. Shaaleyinda hora banda makkalella maneyatta horataru. Daaribadiya maavina topinalli
  beledu pakvavaagidda maavina hannugalu makkalannu aakarshisidavu. Hannu tinnuva aaseyinda makkalu topannu praveshisidaru.
story-n2: Kelavaru maravanneridare matte kelavaru kallu beesidaru. Sikka hannugalannu khushiyinda hanchikondu tinnatodagidaru.
  Aaga makkala gaddala kelida totada maaleeka dhaavisi bandanu. Anireekshitavaagi banda avanannu kandu makkalu galibiligondu
  challaapilliyaagi odidaru.
story-n3: Aadare obba huduga maatra odade alliye ninta. Hattira banda maaleeka huduganannu hididu
story-d1: Ninna appa, amma, gurugalu idanne enu ninage kalisiddu?
story-n10: Endu gadarisida. Huduga alatodagida. Aaga maaleeka
story-d2: Eke aluve? Naanenu ninage hodedene?
story-n4: Endanu. Adakke baalaka vinayadinda
story-d3: Naanu maadiddu tappu. Innendoo intaha tappannu maaduvudilla. Aadare naanu maadida tappige nanna tande,
  taayi mattu gurugalu nindanege guriyaadarallaa endu duhkhisuttiruve.
story-n11: Endanu.
story-n5: Baalakana mugdha haagoo praamaanika maatugalannu keli maaleekana manassu karagitu. Aaga maaleeka
story-d4: Magu, ninna tappannu neenu oppikondiruve. Ninna praamaanikate nanage ishtavaayitu. Tappannu ariyuva, tiddikolluva
  ninna ee guna, ninnannu dodda vyaktiyannaagi maaduttade.
story-n12: Endu heli mattashtu maavinahannugalannu needi samaadhaanapadisi kaluhisida. Heege tanna praamaanikateyinda
  maaleekana manassannu gedda aa baalakane laal bahaddoor shaastri.
story-n6: Adu bhaaratada svaatantrya horaatada kaala. Svaatantryakkaagi gaandheejiyavara netrutvadalli nadeda chaluvaligalu
  shaastriyavarannu aakarshisidavu. Deshaprema avaralli putidedditu. Aaga gaandheejiyavara odanaatadalli shaastriyavaru
  aneka chaluvaligalalli paalgondaru. Antoo 1947 aagast 15randu bhaarata desha svatantra deshavaayitu.
story-n7: Svatantra bhaaratada prathama pradhaaniyaada javaaharlaal neharu avara mantrimandaladalli railve mantriyaagi
  shaastriyavaru kaarya nirvahisidaru. Aa samayadalli railve apaghaatavondakke taave hone hottu tappu tammadalladiddaroo
  mantri padavige raajeenaame kottu dheemantike mereda ivaru neharooravara nantara deshada pradhaaniyaagi seve sallisidaru.
story-n8: Kevala hadinentu tingala avadhiyalli tamma praamaanikate haagoo deshapremada nadavalikegalinda deshadellede
  manemaataadaru.
story-n9: Shaastriyavaru daksha aadalitagaararaagi, shaantidootaraagi, desha premigalaagi deshada keertipataake
  haarisidaru. Ivaru needida ‘jai javaan jai kisaan’ emba ghoshavaakya janamanadalli uliyitu. Ivara sevege bhaarata
  sarkaaravu ‘bhaarataratna’ prashasti needi gauravisitu.
