competency: पाठ का मुख्य विषय पहचानना। “क्यों” के प्रश्न का उत्तर देना।
intro-1: 'इन चित्रों के व्यक्तियों को पहचानो। इन महान लोगों ने देश और समाज की सेवा के लिए संघर्ष किया। [संपादकीय
  चित्र-संदर्भ: 3rd_KANNADA_FL_Part_1_2026-27.pdf, मुद्रित पृष्ठ 48, PDF पृष्ठ 61 (गिनती 1 से), प्रवेश भाग के चित्र।]'
intro-2: उनके बचपन पर नज़र डालें तो सहज शरारतों के बीच कुछ आदर्श गुण दिखाई देते हैं। ऐसे गुण अपनाकर बड़े हुए एक
  नेता के बचपन और जीवन को जानें।
story-n1: विद्यालय की घंटी बजी। सभी बच्चे बाहर निकलकर घर की ओर चले। सड़क किनारे के आम के बाग़ में पके फल उन्हें
  लुभाने लगे। आम खाने की इच्छा से वे बाग़ में घुस गए।
story-n2: कुछ पेड़ों पर चढ़े, कुछ ने पत्थर फेंके। मिले फल खुशी से बाँटकर खाने लगे। शोर सुनकर बाग़ का मालिक दौड़ा
  आया। उसे अचानक देखकर बच्चे घबरा गए और इधर-उधर भागे।
story-n3: लेकिन एक लड़का भागने के बजाय वहीं खड़ा रहा। मालिक ने पास आकर उसे पकड़ लिया।
story-d1: क्या तुम्हारे माता-पिता और शिक्षकों ने तुम्हें यही सिखाया है?
story-n10: 'उसने डाँटा। लड़का रोने लगा। तब मालिक ने कहा:'
story-d2: क्यों रो रहे हो? क्या मैंने तुम्हें मारा?
story-n4: 'इस पर लड़के ने विनम्रता से कहा:'
story-d3: मैंने गलती की। फिर कभी ऐसी गलती नहीं करूँगा। पर मेरी गलती के लिए मेरे माता-पिता और शिक्षकों को दोष दिया
  गया, इसलिए दुखी हूँ।
story-n11: उसने कहा।
story-n5: 'लड़के की भोली और सच्ची बातें सुनकर मालिक का मन पिघल गया। तब मालिक ने कहा:'
story-d4: बेटा, तुमने अपनी गलती मान ली। तुम्हारी ईमानदारी मुझे अच्छी लगी। गलती पहचानकर सुधारने का यह गुण तुम्हें
  महान व्यक्ति बनाएगा।
story-n12: यह कहकर उसने लड़के को और आम दिए, समझाया और भेज दिया। अपनी ईमानदारी से मालिक का दिल जीतने वाला वह बालक
  लाल बहादुर शास्त्री था।
story-n6: वह भारत के स्वतंत्रता संघर्ष का समय था। गांधीजी के नेतृत्व में हुए आंदोलनों ने शास्त्रीजी को आकर्षित किया।
  उनमें देशप्रेम उमड़ पड़ा। गांधीजी के साथ रहकर उन्होंने अनेक आंदोलनों में भाग लिया। अंततः 15 अगस्त 1947 को भारत
  स्वतंत्र हुआ।
story-n7: शास्त्रीजी ने स्वतंत्र भारत के पहले प्रधानमंत्री जवाहरलाल नेहरू के मंत्रिमंडल में रेल मंत्री के रूप में
  काम किया। एक रेल दुर्घटना की ज़िम्मेदारी लेते हुए, अपनी गलती न होने पर भी उन्होंने मंत्री पद से इस्तीफ़ा देकर
  महानता दिखाई। नेहरूजी के बाद उन्होंने देश के प्रधानमंत्री के रूप में सेवा की।
story-n8: केवल अठारह महीनों में अपनी ईमानदारी और देशप्रेम भरे आचरण से वे देश के घर-घर में प्रसिद्ध हो गए।
story-n9: कुशल प्रशासक, शांतिदूत और देशभक्त के रूप में शास्त्रीजी ने देश का यश बढ़ाया। उनका नारा “जय जवान, जय किसान”
  जन-जन के मन में बस गया। उनकी सेवा के लिए भारत सरकार ने उन्हें “भारत रत्न” से सम्मानित किया।
