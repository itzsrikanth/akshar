competency: Identifying the main idea in a text. Answering “why” questions.
intro-1: 'Identify the people in these pictures. These great people struggled for the country and to serve society.
  [Editorial image reference: 3rd_KANNADA_FL_Part_1_2026-27.pdf, printed page 48, PDF page 61 (counting from 1),
  portraits in the introduction.]'
intro-2: Looking back at their childhood, we see admirable qualities alongside ordinary mischief. Let us learn about
  the childhood and life of a leader who grew up with such qualities.
story-n1: The school bell rang. All the children came out and headed home. Ripe mangoes in a roadside grove attracted
  them. Wanting to eat the fruit, they entered the grove.
story-n2: Some climbed the trees; others threw stones. They happily shared and ate the fruit they got. Hearing their
  noise, the owner rushed over. Surprised by his sudden arrival, the children panicked and scattered.
story-n3: But one boy did not run; he stayed where he was. The owner came closer and caught him.
story-d1: Is this what your father, mother and teachers taught you?
story-n10: 'he scolded. The boy began to cry. Then the owner said:'
story-d2: Why are you crying? Have I hit you?
story-n4: 'The boy humbly replied:'
story-d3: What I did was wrong. I will never do it again. But I am sad that my father, mother and teachers have
  been blamed for my mistake.
story-n11: he said.
story-n5: 'The boy''s innocent, honest words melted the owner''s heart. The owner said:'
story-d4: Child, you have admitted your mistake. I like your honesty. Your ability to recognise and correct a mistake
  will make you a great person.
story-n12: Saying this, he comforted the boy, gave him more mangoes and sent him home. The boy who won the owner's
  heart with his honesty was Lal Bahadur Shastri.
story-n6: It was the time of India's freedom struggle. The movements led by Gandhiji attracted Shastri, and patriotism
  surged within him. Alongside Gandhiji, he took part in many movements. Finally, India became independent on 15
  August 1947.
story-n7: Shastri served as Railway Minister in the cabinet of Jawaharlal Nehru, independent India's first Prime
  Minister. Taking responsibility for a railway accident, even though it was not his fault, he showed nobility by
  resigning as minister. After Nehru, he served as the country's Prime Minister.
story-n8: In just eighteen months, his honesty and patriotic conduct made him known in homes across the country.
story-n9: As an able administrator, messenger of peace and patriot, Shastri brought glory to the country. His slogan
  “Jai Jawan, Jai Kisan”—hail the soldier, hail the farmer—remained in people's hearts. The Government of India
  honoured his service with the Bharat Ratna award.
