  exercise-B: ಅಭ್ಯಾಸ ಆ — ಒಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರಿಸು.
  exercise-C: ಅಭ್ಯಾಸ ಇ — ಎರಡು-ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರಿಸು.
