segments:
- id: competency
  type: competency
  text: ಪಠ್ಯದಲ್ಲಿನ ಮುಖ್ಯ ವಿಷಯವನ್ನು ಗುರುತಿಸುವುದು. ಏಕೆ ಎಂಬ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರಿಸುವುದು.
- id: intro-1
  type: prose
  text: 'ಈ ಚಿತ್ರಗಳಲ್ಲಿರುವ ವ್ಯಕ್ತಿಗಳನ್ನು ಗುರುತಿಸು. ಈ ಮಹನೀಯರು ದೇಶಕ್ಕಾಗಿ ಮತ್ತು ಸಮಾಜ ಸೇವೆಗಾಗಿ ಹೋರಾಡಿದವರು. [ಸಂಪಾದಕೀಯ
    ಚಿತ್ರ ಉಲ್ಲೇಖ: 3rd_KANNADA_FL_Part_1_2026-27.pdf, ಮುದ್ರಿತ ಪುಟ 48, PDF ಪುಟ 61 (1ರಿಂದ ಎಣಿಕೆ), ಪ್ರವೇಶ ಭಾಗದ ಭಾವಚಿತ್ರಗಳು.]'
  section: intro
- id: intro-2
  type: prose
  text: ಇವರ ಬಾಲ್ಯವನ್ನು ಹಿಂತಿರುಗಿ ನೋಡಿದರೆ ಸಹಜ ತುಂಟಾಟದ ನಡುವೆ ಕೆಲವು ಆದರ್ಶದ ಗುಣಗಳು ಕಂಡುಬರುತ್ತವೆ. ಆದರ್ಶ ಗುಣಗಳನ್ನು ಮೈಗೂಡಿಸಿಕೊಂಡು
    ಬೆಳೆದ ಒಬ್ಬ ನೇತಾರನ ಬಾಲ್ಯ ಮತ್ತು ಬದುಕನ್ನು ತಿಳಿಯೋಣ.
  section: intro
- id: story-n1
  type: prose
  text: ಶಾಲೆಯ ಗಂಟೆ ಬಾರಿಸಿತು. ಶಾಲೆಯಿಂದ ಹೊರ ಬಂದ ಮಕ್ಕಳೆಲ್ಲ ಮನೆಯತ್ತ ಹೊರಟರು. ದಾರಿಬದಿಯ ಮಾವಿನ ತೋಪಿನಲ್ಲಿ ಬೆಳೆದು ಪಕ್ವವಾಗಿದ್ದ
    ಮಾವಿನ ಹಣ್ಣುಗಳು ಮಕ್ಕಳನ್ನು ಆಕರ್ಷಿಸಿದವು. ಹಣ್ಣು ತಿನ್ನುವ ಆಸೆಯಿಂದ ಮಕ್ಕಳು ತೋಪನ್ನು ಪ್ರವೇಶಿಸಿದರು.
  section: story
- id: story-n2
  type: prose
  text: ಕೆಲವರು ಮರವನ್ನೇರಿದರೆ ಮತ್ತೆ ಕೆಲವರು ಕಲ್ಲು ಬೀಸಿದರು. ಸಿಕ್ಕ ಹಣ್ಣುಗಳನ್ನು ಖುಷಿಯಿಂದ ಹಂಚಿಕೊಂಡು ತಿನ್ನತೊಡಗಿದರು. ಆಗ ಮಕ್ಕಳ
    ಗದ್ದಲ ಕೇಳಿದ ತೋಟದ ಮಾಲೀಕ ಧಾವಿಸಿ ಬಂದನು. ಅನಿರೀಕ್ಷಿತವಾಗಿ ಬಂದ ಅವನನ್ನು ಕಂಡು ಮಕ್ಕಳು ಗಲಿಬಿಲಿಗೊಂಡು ಚಲ್ಲಾಪಿಲ್ಲಿಯಾಗಿ ಓಡಿದರು.
  section: story
- id: story-n3
  type: prose
  text: ಆದರೆ ಒಬ್ಬ ಹುಡುಗ ಮಾತ್ರ ಓಡದೇ ಅಲ್ಲಿಯೇ ನಿಂತ. ಹತ್ತಿರ ಬಂದ ಮಾಲೀಕ ಹುಡುಗನನ್ನು ಹಿಡಿದು
  section: story
- id: story-d1
  type: dialogue
  text: ನಿನ್ನ ಅಪ್ಪ, ಅಮ್ಮ, ಗುರುಗಳು ಇದನ್ನೇ ಏನು ನಿನಗೆ ಕಲಿಸಿದ್ದು?
  section: story
  speaker: ಮಾಲೀಕ
- id: story-n10
  type: prose
  text: ಎಂದು ಗದರಿಸಿದ. ಹುಡುಗ ಅಳತೊಡಗಿದ. ಆಗ ಮಾಲೀಕ
  section: story
- id: story-d2
  type: dialogue
  text: ಏಕೆ ಅಳುವೆ? ನಾನೇನು ನಿನಗೆ ಹೊಡೆದೆನೆ?
  section: story
  speaker: ಮಾಲೀಕ
- id: story-n4
  type: prose
  text: ಎಂದನು. ಅದಕ್ಕೆ ಬಾಲಕ ವಿನಯದಿಂದ
  section: story
- id: story-d3
  type: dialogue
  text: ನಾನು ಮಾಡಿದ್ದು ತಪ್ಪು. ಇನ್ನೆಂದೂ ಇಂತಹ ತಪ್ಪನ್ನು ಮಾಡುವುದಿಲ್ಲ. ಆದರೆ ನಾನು ಮಾಡಿದ ತಪ್ಪಿಗೆ ನನ್ನ ತಂದೆ, ತಾಯಿ ಮತ್ತು ಗುರುಗಳು
    ನಿಂದನೆಗೆ ಗುರಿಯಾದರಲ್ಲಾ ಎಂದು ದುಃಖಿಸುತ್ತಿರುವೆ.
  section: story
  speaker: ಬಾಲಕ
- id: story-n11
  type: prose
  text: ಎಂದನು.
  section: story
- id: story-n5
  type: prose
  text: ಬಾಲಕನ ಮುಗ್ಧ ಹಾಗೂ ಪ್ರಾಮಾಣಿಕ ಮಾತುಗಳನ್ನು ಕೇಳಿ ಮಾಲೀಕನ ಮನಸ್ಸು ಕರಗಿತು. ಆಗ ಮಾಲೀಕ
  section: story
- id: story-d4
  type: dialogue
  text: ಮಗು, ನಿನ್ನ ತಪ್ಪನ್ನು ನೀನು ಒಪ್ಪಿಕೊಂಡಿರುವೆ. ನಿನ್ನ ಪ್ರಾಮಾಣಿಕತೆ ನನಗೆ ಇಷ್ಟವಾಯಿತು. ತಪ್ಪನ್ನು ಅರಿಯುವ, ತಿದ್ದಿಕೊಳ್ಳುವ
    ನಿನ್ನ ಈ ಗುಣ, ನಿನ್ನನ್ನು ದೊಡ್ಡ ವ್ಯಕ್ತಿಯನ್ನಾಗಿ ಮಾಡುತ್ತದೆ.
  section: story
  speaker: ಮಾಲೀಕ
- id: story-n12
  type: prose
  text: ಎಂದು ಹೇಳಿ ಮತ್ತಷ್ಟು ಮಾವಿನಹಣ್ಣುಗಳನ್ನು ನೀಡಿ ಸಮಾಧಾನಪಡಿಸಿ ಕಳುಹಿಸಿದ. ಹೀಗೆ ತನ್ನ ಪ್ರಾಮಾಣಿಕತೆಯಿಂದ ಮಾಲೀಕನ ಮನಸ್ಸನ್ನು
    ಗೆದ್ದ ಆ ಬಾಲಕನೇ ಲಾಲ್ ಬಹದ್ದೂರ್ ಶಾಸ್ತ್ರಿ.
  section: story
- id: story-n6
  type: prose
  text: ಅದು ಭಾರತದ ಸ್ವಾತಂತ್ರ್ಯ ಹೋರಾಟದ ಕಾಲ. ಸ್ವಾತಂತ್ರ್ಯಕ್ಕಾಗಿ ಗಾಂಧೀಜಿಯವರ ನೇತೃತ್ವದಲ್ಲಿ ನಡೆದ ಚಳುವಳಿಗಳು ಶಾಸ್ತ್ರಿಯವರನ್ನು
    ಆಕರ್ಷಿಸಿದವು. ದೇಶಪ್ರೇಮ ಅವರಲ್ಲಿ ಪುಟಿದೆದ್ದಿತು. ಆಗ ಗಾಂಧೀಜಿಯವರ ಒಡನಾಟದಲ್ಲಿ ಶಾಸ್ತ್ರಿಯವರು ಅನೇಕ ಚಳುವಳಿಗಳಲ್ಲಿ ಪಾಲ್ಗೊಂಡರು.
    ಅಂತೂ 1947 ಆಗಸ್ಟ್ 15ರಂದು ಭಾರತ ದೇಶ ಸ್ವತಂತ್ರ ದೇಶವಾಯಿತು.
  section: story
- id: story-n7
  type: prose
  text: ಸ್ವತಂತ್ರ ಭಾರತದ ಪ್ರಥಮ ಪ್ರಧಾನಿಯಾದ ಜವಾಹರ್ಲಾಲ್ ನೆಹರು ಅವರ ಮಂತ್ರಿಮಂಡಲದಲ್ಲಿ ರೈಲ್ವೇ ಮಂತ್ರಿಯಾಗಿ ಶಾಸ್ತ್ರಿಯವರು ಕಾರ್ಯ
    ನಿರ್ವಹಿಸಿದರು. ಆ ಸಮಯದಲ್ಲಿ ರೈಲ್ವೇ ಅಪಘಾತವೊಂದಕ್ಕೆ ತಾವೇ ಹೊಣೆ ಹೊತ್ತು ತಪ್ಪು ತಮ್ಮದಲ್ಲದಿದ್ದರೂ ಮಂತ್ರಿ ಪದವಿಗೆ ರಾಜೀನಾಮೆ
    ಕೊಟ್ಟು ಧೀಮಂತಿಕೆ ಮೆರೆದ ಇವರು ನೆಹರೂರವರ ನಂತರ ದೇಶದ ಪ್ರಧಾನಿಯಾಗಿ ಸೇವೆ ಸಲ್ಲಿಸಿದರು.
  section: story
- id: story-n8
  type: prose
  text: ಕೇವಲ ಹದಿನೆಂಟು ತಿಂಗಳ ಅವಧಿಯಲ್ಲಿ ತಮ್ಮ ಪ್ರಾಮಾಣಿಕತೆ ಹಾಗೂ ದೇಶಪ್ರೇಮದ ನಡವಳಿಕೆಗಳಿಂದ ದೇಶದೆಲ್ಲೆಡೆ ಮನೆಮಾತಾದರು.
  section: story
- id: story-n9
  type: prose
  text: ಶಾಸ್ತ್ರಿಯವರು ದಕ್ಷ ಆಡಳಿತಗಾರರಾಗಿ, ಶಾಂತಿದೂತರಾಗಿ, ದೇಶ ಪ್ರೇಮಿಗಳಾಗಿ ದೇಶದ ಕೀರ್ತಿಪತಾಕೆ ಹಾರಿಸಿದರು. ಇವರು ನೀಡಿದ ‘ಜೈ
    ಜವಾನ್ ಜೈ ಕಿಸಾನ್’ ಎಂಬ ಘೋಷವಾಕ್ಯ ಜನಮನದಲ್ಲಿ ಉಳಿಯಿತು. ಇವರ ಸೇವೆಗೆ ಭಾರತ ಸರ್ಕಾರವು ‘ಭಾರತರತ್ನ’ ಪ್ರಶಸ್ತಿ ನೀಡಿ ಗೌರವಿಸಿತು.
  section: story
