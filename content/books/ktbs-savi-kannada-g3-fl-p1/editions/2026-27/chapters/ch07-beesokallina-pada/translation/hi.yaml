intro-1: लोरी, गीगी गीत, सोबाने गीत, इनमें से जो भी गीत आपको आता हो, उसे कक्षा में अपने दोस्तों के साथ मिलकर गाएं।
poem-s1l1: पत्थर माँ, कोमल माँ, रागी को
poem-s1l2: झमाझम गिरने दो | मैं तुम्हारी
poem-s1l3: गुड़ की आरती उतारूंगी ||
poem-s2l1: सुंदर नीचे का पत्थर और सुंदर ऊपर का पत्थर
poem-s2l2: चंद्रमती नामक मुठिया को | पकड़कर
poem-s2l3: मैं अपने माता-पिता को याद करूंगी ||
poem-s3l1: रागी खत्म हो जाएगी, सुगंधित चावल बढ़ेंगे
poem-s3l2: मेरे द्वारा लिया गया काम पूरा हो जाएगा | रागी के पत्थर,
poem-s3l3: मैं तुम्हें अपने दाहिने हाथ से झुलाकर छोड़ूंगी ||
poem-s4l1: पत्थर छोड़ दिया, ऐसा सोचकर क्यों गुस्सा हो सरस्वती
poem-s4l2: टोकरी में रागी बढ़ने दो | लेकर
poem-s4l3: मैं फिर रात को आऊंगी ||
poem-s5l1: पत्थर देने वाली माँ को सारा सौभाग्य मिले
poem-s5l2: बेटा पालकी पर आए | उस घर में
poem-s5l3: चमेली पहनने वाली बहू आए ||
poem-s6l1: -लोकगीत
poem-s7l1: जनवाणी जड़ है, कविवाणी फूल है।
