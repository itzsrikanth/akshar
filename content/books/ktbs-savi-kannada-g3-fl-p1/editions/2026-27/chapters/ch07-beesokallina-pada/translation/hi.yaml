usage-A-q1: 1. माँ का बिस्तर लपेटा नहीं जा सकता, पिता का पैसा गिना नहीं जा सकता।
usage-A-q2: 2. वह काली साड़ी पहनती है, बिछिया पहनती है, ऊपर जाती है, नीचे आती है।
usage-A-q3: 3. जब अप्पा कहते हैं तो बंद हो जाते हैं, जब अव्वा कहते हैं तो खुल जाते हैं।
usage-B-story1: एक गाँव में एक किसान रहता था। उसके दो आलसी बेटे थे। बीमारी के कारण किसान बिस्तर पर पड़ गया। बेटों को पास बुलाकर उसने कहा, "बच्चों, मैंने तुम्हारे लिए खेत में अपनी कमाई हुई संपत्ति गाड़ दी है।" दोनों बच्चे फावड़ा और कुदाल लेकर खेत गए। उन्होंने खोद-खोद कर खजाने की तलाश की। खजाना नहीं मिला। उसी दिन बारिश हुई। यह सोचकर कि अब क्या करें, उन्होंने अनाज बो दिया। अच्छी फसल हुई। उन्होंने खूब पैसे कमाए। किसान ने बच्चों को बुलाकर कहा, "यही वह संपत्ति है जिसे मैंने खेत में गाड़ा था।"
usage-C-q1: "*इधर-उधर घूमकर गाय चराने से क्या सूरज जल्दी डूब जाता है?"
usage-C-q2: "*जब चने होते हैं तो दांत नहीं होते, जब दांत होते हैं तो चने नहीं होते।"
usage-C-q3: "*जिसे कूटना नहीं आता, वह फटकने का दिखावा करती है।"
usage-D-sec1: अ. रवि स्कूल गया।
