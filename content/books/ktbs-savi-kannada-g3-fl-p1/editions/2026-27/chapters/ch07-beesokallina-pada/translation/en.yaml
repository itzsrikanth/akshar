usage-A-q1: 1. You can't roll up mother's bed, you can't count father's money.
usage-A-q2: 2. She wears a black saree, puts on a toe ring, goes up, comes down.
usage-A-q3: 3. When you say Appa they close, when you say Avva they open.
usage-B-story1: In a village, there lived a farmer. He had two lazy sons. Due to illness, the farmer became bedridden. Calling his sons near, he said, "Children, I have buried the wealth I earned in the field for you." The two children took spades and pickaxes and went to the field. They dug and dug, searching for the treasure. They didn't find the treasure. It rained the same day. Thinking what else to do, they sowed grains. A good crop grew. They earned a handful of money. The farmer called the children and said, "This is the wealth I buried in the field."
