intro-1: Sing a lullaby, gigi song, or sobane song, whichever you know among these, along with your friends in the class.
poem-s1l1: Mother stone, gentle mother, let the ragi
poem-s1l2: shower down jhalla-jhallane | I will
poem-s1l3: wave a jaggery aarti to you ||
poem-s2l1: Beautiful base stone and beautiful top stone
poem-s2l2: Holding the handle peg called Chandramati |
poem-s2l3: I shall remember my parents ||
poem-s3l1: The ragi will get over, the fragrant rice will increase
poem-s3l2: The work I have taken up will be done | Ragi stone,
poem-s3l3: I will swing and release you with my right arm ||
poem-s4l1: Why are you angry, Saraswati, thinking I left the stone?
poem-s4l2: Let the ragi grow in the basket | I will take it
poem-s4l3: and come back again at night ||
poem-s5l1: Let all fortunes come to the mother who gave the stone
poem-s5l2: Let a son come on a palanquin | To that house,
poem-s5l3: let a daughter-in-lock wearing jasmine come ||
poem-s6l1: -Folk
poem-s7l1: People's voice is the root, poet's voice is the flower.
