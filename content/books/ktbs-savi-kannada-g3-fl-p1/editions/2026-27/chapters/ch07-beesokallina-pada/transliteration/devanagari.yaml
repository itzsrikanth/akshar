intro-1: जोगुळ हाडु, गीगी पद, सोबाने पद, इवुगळल्लि निनगे गोत्तिरुव यावुदादरोंदु हाडन्नु तरगतियल्लि गेळेयरोडगूडि हाडु।
poem-s1l1: कल्लम्म तायि मेल्लम्म रागिय
poem-s1l2: झल्लझल्लाने उदुरम्म | ना निनगे
poem-s1l3: बेल्लादारतिया बेळगेनु ||
poem-s2l1: अंदुळ्ळ अडिगल्लु चंदुळ्ळ मेगल्लु
poem-s2l2: चंद्रमतियेंब हिडिगूट | हिडुकोंडु
poem-s2l3: तंदे तायिगळ नेनेदेन ||
poem-s3l1: रागियु मुगिदावु राजान्न हेच्च्यावु
poem-s3l2: नान्हिडिद केलस वदग्यावु | रागीकल्ले
poem-s3l3: ना तूगि बिडुतीनि बलदोळु ||
poem-s4l1: कल्लु बिट्टेनेंदु सिट्याके सरसतिये
poem-s4l2: कुक्केलि रागि बेळेयालि | तक्कोंडु
poem-s4l3: मत्ते रात्रीगे बरुतीनि ||
poem-s5l1: कल्लु कोट्टम्मगे एल्ला भाग्यवु बरलि
poem-s5l2: पल्लक्कि मेले मग बरलि | आ मनेगे
poem-s5l3: मल्लिगे मुडियो सोसि बरलि ||
poem-s6l1: -जनपद
poem-s7l1: जनवाणि बेरु, कविवाणि हूवु।
