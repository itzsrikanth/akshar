usage-A-q1: 1. अव्वन हासिगे सुत्ताकागोल्ल, अप्पन दुड्डु एणिसाकागोल्ल।
usage-A-q2: 2. करि सीरि उट्टाळ, कालुंगुर इट्टाळ, मेले होगताळ, केळगे बरताळ।
usage-A-q3: 3. अप्पा एंदरे मुच्चुताव, अव्व एंदरे तेरिताव।
usage-B-story1: ओंदु ऊरिनल्लि ओब्ब रैतनिद्दनु। अवनिगे इब्बरु सोमारि मक्क़ळिद्दरु। अनारोग्यदिंद रैत हासिगे हिडिदनु। मक्क़ळन्नु हत्तिर करेदु ‘‘मक्क़ळे नानु संपा दिसिद संपत्तन्नु निमगागि होलदल्लि हूतिट्टिद्देने’’ एंडु हेळिदनु। मक्क़ळिब्बरु हारे गुद्दलि हिडिदु होलक्के होदरु। अगेदु अगेदु निधिगागि हुडुकिरु। निधि सिगलिल्ल। अदे दिन मळे सुरियितु। इन्नेनु माडुवुदु एंडु धान्य बित्तिदिरु। उत्तम बेळे बंतु। कै तुंब हण संपा दिसिदरु। रैत मक्क़ळन्नु करेदु ‘‘इदे नानु होलदल्लि हूतिट्ट संपत्तु’’ एंडु हेळिदनु।
usage-C-q1: "*ओडाड्कोंडु दन काद्रे बेग्ने होत्तु मुळुगुत्ता?"
usage-C-q2: "*कड्ले इद्दाग हल्लिल्ल, हल्लिद्दाग कड़्लिल्ल।"
usage-C-q3: "*कुट्टाक बरदोळु केरि केरि नोडिदळंत।"
