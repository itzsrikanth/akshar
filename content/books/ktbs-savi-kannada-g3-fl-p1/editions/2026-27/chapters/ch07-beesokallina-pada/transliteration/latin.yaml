labels:
  intro: kalikege daari
  poem: beesokallina pada
  vocab: padagala artha
  notes: tippani
  exercise-A: ondondu vakyadalli uttara bareyiri.
  exercise-B: eradu-mooru vakyagalalli uttara bareyiri.
  exercise-C: padyada modalardha saalige eradaneya ardha saalannu hondisi bareyiri.
  exercise-D: maudariyante kottiruva padagalige bhinna arthadalli swanta vakya bareyiri.
  language-activity: bhasha chatuvatike
  language-activity-A: aadumaatu mattu barehada maatina naduvina vyatyasa gamanisi.
  language-activity-B: akshara balasi pada bare.
  language-activity-C: kelagina aadunudigalannu maudariyante barehada bhashayalli bareyiri.
  usage-activity: balake chatuvatike
  usage-activity-A: ogatu bidisi.
  usage-activity-B: kottiruva kate oodi, idakke sambandhisida gadegalannu bareyiri.
  usage-activity-C: kottiruva gade maatannu barehada bhashage badalayisi.
  usage-activity-D: kelagina aadunudigalannu oodi bareyiri.
  competency: samarthya

intro-1: jogula haadu, geegi pada, sobane pada, ivugalalli ninage gottiruva yavudadarondu haadannu taragatiyalli geleyarodagoodi haadu.
poem-s1l1: kallamma taayi mellamma ragiya
poem-s1l2: jhallajhallane uduramma | naa ninage
poem-s1l3: belladaaratiya belagenu ||
poem-s2l1: andulla adigallu chandulla meegallu
poem-s2l2: chandramatiyemba hidigoota | hidukondu
poem-s2l3: tande taayigala nenedena ||
poem-s3l1: raagiyu mugidaavu raajanna heccyaavu
poem-s3l2: naanhidida kelasa vadagyaavu | raagikalle
poem-s3l3: naa toogi biduteeni baladolu ||
poem-s4l1: kallu bittenedu sittyake sarasatiye
poem-s4l2: kukkeli ragi beleyali | takkondu
poem-s4l3: matte raatrige baruteeni ||
poem-s5l1: kallu kottammage ella bhagyavu barali
poem-s5l2: pallakki mele maga barali | aa manege
poem-s5l3: mallige mudiyo sosi barali ||
poem-s6l1: -janapada
poem-s7l1: janavaani beeru, kavivaani hoovu.
