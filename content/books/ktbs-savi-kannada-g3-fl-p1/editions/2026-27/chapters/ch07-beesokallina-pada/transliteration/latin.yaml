usage-A-q1: 1. avvana haasige suttaakagolla, appana duddu enisaakagolla.
usage-A-q2: 2. kari seeri uttaala, kaalungura ittaala, meele hogataala, kelage barataala.
usage-A-q3: 3. appa endare mucchutaava, avva endare teritaava.
usage-B-story1: ondu oorinalli obba raitaniddanu. avanige ibbaru soomaari makkaliddaru. anarogyadinda raita haasige hididanu. makkalannu hattira karedu ‘‘makkale naanu sampadisida sampattannu nimagagi holadalli hootittiddene’’ endu helidanu. makkalibbaru haare guddali hididu holakke hodaru. agedu agedu nidhigaagi hudukidaru. nidhi sigalilla. aade dina male suriyitu. innenu maaduvudu endu dhaanya bittidaru. uttama bele bantu. kai tumba hana sampadisidaru. raita makkalannu karedu ‘‘idee naanu holadalli hootitta sampattu’’ endu helidanu.
usage-C-q1: "*odaadkondu dana kaadre beegne hottu muluguttaa?"
usage-C-q2: "*kadle iddaga hallilla, halliddaga kadlilla."
usage-C-q3: "*kuttaaka baradolu keeri keeri nodidalanta."
usage-D-sec1: a. ravi shaalege hoodanu.
usage-D-sec2: ravi saalige hooda.
usage-D-sec3: ravi saalige hogyaanri.
usage-D-sec4: aa. kirana tindi tinnuttiddane.
usage-D-sec5: kirana tindi tintaana.
comp-1: neeneega aadubhasha hagu barehada bhashagala naduvina vyatyasavannu gurutisaballeyallave?