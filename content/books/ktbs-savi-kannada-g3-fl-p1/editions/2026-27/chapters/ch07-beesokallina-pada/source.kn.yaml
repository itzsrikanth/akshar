  - id: ex-A-q1
    type: question
    section: exercise-A
    text: 1. ರಾಗಿ ಹೇಗೆ ಉದುರುತ್ತದೆ?
  - id: ex-A-q2
    type: question
    section: exercise-A
    text: 2. ಬೀಸುವ ಕಲ್ಲಿನ ಹಿಡಿಗೂಟ ಹಿಡಿದು ಯಾರನ್ನು ನೆನೆಯುತ್ತಾರೆ?
  - id: ex-A-q3
    type: question
    section: exercise-A
    text: 3. ಸರಸತಿಗೆ ಸಿಟ್ಟು ಬಂತು ಏಕೆ?

  - id: ex-B-q1
    type: question
    section: exercise-B
    text: 1. ಕಲ್ಲು ಕೊಟ್ಟಮ್ಮನನ್ನು ಏನೆಂದು ಹರಸುವಳು?
  - id: ex-B-q2
    type: question
    section: exercise-B
    text: 2. ಸಿಟ್ಟುಗೊಂಡ ಸರಸತಿಯನ್ನು ಸಮಾಧಾನ ಮಾಡಿದ ಬಗೆ ಹೇಗೆ?

