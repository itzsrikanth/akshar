labels:
  intro: ಕಲಿಕೆಗೆ ದಾರಿ
  poem: ಬೀಸೋಕಲ್ಲಿನ ಪದ
  vocab: ಪದಗಳ ಅರ್ಥ
  notes: ಟಿಪ್ಪಣಿ
  exercise-A: ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-B: ಎರಡು-ಮೂರು ವಾಕ್ಯಗಳಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-C: ಪದ್ಯದ ಮೊದಲರ್ಧ ಸಾಲಿಗೆ ಎರಡನೆಯ ಅರ್ಧ ಸಾಲನ್ನು ಹೊಂದಿಸಿ ಬರೆಯಿರಿ.
  exercise-D: ಮಾದರಿಯಂತೆ ಕೊಟ್ಟಿರುವ ಪದಗಳಿಗೆ ಭಿನ್ನ ಅರ್ಥದಲ್ಲಿ ಸ್ವಂತ ವಾಕ್ಯ ಬರೆಯಿರಿ.
  language-activity: ಭಾಷಾ ಚಟುವಟಿಕೆ
  language-activity-A: ಆಡುಮಾತು ಮತ್ತು ಬರೆಹದ ಮಾತಿನ ನಡುವಿನ ವ್ಯತ್ಯಾಸ ಗಮನಿಸಿ.
  language-activity-B: ಅಕ್ಷರ ಬಳಸಿ ಪದ ಬರೆ.
  language-activity-C: ಕೆಳಗಿನ ಆಡುನುಡಿಗಳನ್ನು ಮಾದರಿಯಂತೆ ಬರೆಹದ ಭಾಷೆಯಲ್ಲಿ ಬರೆಯಿರಿ.
  usage-activity: ಬಳಕೆ ಚಟುವಟಿಕೆ
  usage-activity-A: ಒಗಟು ಬಿಡಿಸಿ.
  usage-activity-B: ಕೊಟ್ಟಿರುವ ಕತೆ ಓದಿ, ಇದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಗಾದೆಗಳನ್ನು ಬರೆಯಿರಿ.
  usage-activity-C: ಕೊಟ್ಟಿರುವ ಗಾದೆ ಮಾತನ್ನು ಬರೆಹದ ಭಾಷೆಗೆ ಬದಲಾಯಿಸಿ.
  usage-activity-D: ಕೆಳಗಿನ ಆಡುನುಡಿಗಳನ್ನು ಓದಿ ಬರೆಯಿರಿ.
  competency: ಸಾಮರ್ಥ್ಯ

segments:
  - id: intro-1
    type: prose
    section: intro
    text: ಜೋಗುಳ ಹಾಡು, ಗೀಗೀ ಪದ, ಸೋಬಾನೆ ಪದ, ಇವುಗಳಲ್ಲಿ ನಿನಗೆ ಗೊತ್ತಿರುವ ಯಾವುದಾದರೊಂದು ಹಾಡನ್ನು ತರಗತಿಯಲ್ಲಿ ಗೆಳೆಯರೊಡಗೂಡಿ ಹಾಡು.

  - id: poem-s1l1
    type: poem_line
    section: poem
    stanza: 1
    text: ಕಲ್ಲಮ್ಮ ತಾಯಿ ಮೆಲ್ಲಮ್ಮ ರಾಗಿಯ
  - id: poem-s1l2
    type: poem_line
    section: poem
    stanza: 1
    text: ಜಲ್ಲಜಲ್ಲಾನೆ ಉದುರಮ್ಮ | ನಾ ನಿನಗೆ
  - id: poem-s1l3
    type: poem_line
    section: poem
    stanza: 1
    text: ಬೆಲ್ಲಾದಾರತಿಯಾ ಬೆಳಗೇನು ||

  - id: poem-s2l1
    type: poem_line
    section: poem
    stanza: 2
    text: ಅಂದುಳ್ಳ ಅಡಿಗಲ್ಲು ಚಂದುಳ್ಳ ಮೇಗಲ್ಲು
  - id: poem-s2l2
    type: poem_line
    section: poem
    stanza: 2
    text: ಚಂದ್ರಮತಿಯೆಂಬ ಹಿಡಿಗೂಟ | ಹಿಡುಕೊಂಡು
  - id: poem-s2l3
    type: poem_line
    section: poem
    stanza: 2
    text: ತಂದೆ ತಾಯಿಗಳ ನೆನೆದೇನ ||

  - id: poem-s3l1
    type: poem_line
    section: poem
    stanza: 3
    text: ರಾಗಿಯು ಮುಗಿದಾವು ರಾಜಾನ್ನ ಹೆಚ್ಚ್ಯಾವು
  - id: poem-s3l2
    type: poem_line
    section: poem
    stanza: 3
    text: ನಾನ್ಹಿಡಿದ ಕೆಲಸ ವದಗ್ಯಾವು | ರಾಗೀಕಲ್ಲೆ
  - id: poem-s3l3
    type: poem_line
    section: poem
    stanza: 3
    text: ನಾ ತೂಗಿ ಬಿಡುತೀನಿ ಬಲದೋಳು ||

  - id: poem-s4l1
    type: poem_line
    section: poem
    stanza: 4
    text: ಕಲ್ಲು ಬಿಟ್ಟೇನೆಂದು ಸಿಟ್ಯಾಕೆ ಸರಸತಿಯೇ
  - id: poem-s4l2
    type: poem_line
    section: poem
    stanza: 4
    text: ಕುಕ್ಕೇಲಿ ರಾಗಿ ಬೆಳೆಯಾಲಿ | ತಕ್ಕೊಂಡು
  - id: poem-s4l3
    type: poem_line
    section: poem
    stanza: 4
    text: ಮತ್ತೆ ರಾತ್ರೀಗೆ ಬರುತೀನಿ ||

  - id: poem-s5l1
    type: poem_line
    section: poem
    stanza: 5
    text: ಕಲ್ಲು ಕೊಟ್ಟಮ್ಮಗೆ ಎಲ್ಲಾ ಭಾಗ್ಯವು ಬರಲಿ
  - id: poem-s5l2
    type: poem_line
    section: poem
    stanza: 5
    text: ಪಲ್ಲಕ್ಕಿ ಮೇಲೆ ಮಗ ಬರಲಿ | ಆ ಮನೆಗೆ
  - id: poem-s5l3
    type: poem_line
    section: poem
    stanza: 5
    text: ಮಲ್ಲಿಗೆ ಮುಡಿಯೋ ಸೊಸಿ ಬರಲಿ ||

  - id: poem-s6l1
    type: poem_line
    section: poem
    stanza: 6
    text: -ಜನಪದ

  - id: poem-s7l1
    type: poem_line
    section: poem
    stanza: 7
    text: ಜನವಾಣಿ ಬೇರು, ಕವಿವಾಣಿ ಹೂವು.

