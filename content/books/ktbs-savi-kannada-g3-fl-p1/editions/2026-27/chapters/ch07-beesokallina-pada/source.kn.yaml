    text: "ಮಾದರಿ : ಅತ್ತೆ - ನನ್ನ ಕಾಲಿಗೆ ಮುಳ್ಳು ಚುಚ್ಚಿದಾಗ ಅತ್ತೆನು."
  - id: ex-D-ex1-term2
    type: prose
    section: exercise-D
    text: ಅತ್ತೆ - ನಮ್ಮ ಅತ್ತೆ ನನಗೆ ಹೊಸ ಬಟ್ಟೆ ತಂದರು.
  - id: ex-D-q1-term1
