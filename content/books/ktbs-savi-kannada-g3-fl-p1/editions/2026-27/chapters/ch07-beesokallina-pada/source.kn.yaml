  - id: usage-A-q1
    type: question
    section: usage-activity-A
    text: 1. ಅವ್ವನ ಹಾಸಿಗೆ ಸುತ್ತಾಕಾಗೋಲ್ಲ, ಅಪ್ಪನ ದುಡ್ಡು ಎಣಿಸಾಕಾಗೋಲ್ಲ.
  - id: usage-A-q2
    type: question
    section: usage-activity-A
    text: 2. ಕರಿ ಸೀರಿ ಉಟ್ಟಾಳ, ಕಾಲುಂಗುರ ಇಟ್ಟಾಳ, ಮೇಲೆ ಹೋಗತಾಳ, ಕೆಳಗೆ ಬರತಾಳ.
  - id: usage-A-q3
    type: question
    section: usage-activity-A
    text: 3. ಅಪ್ಪಾ ಎಂದರೆ ಮುಚ್ಚುತಾವ, ಅವ್ವ ಎಂದರೆ ತೆರಿತಾವ.

  - id: usage-B-story1
    type: prose
    section: usage-activity-B
    text: ಒಂದು ಊರಿನಲ್ಲಿ ಒಬ್ಬ ರೈತನಿದ್ದನು. ಅವನಿಗೆ ಇಬ್ಬರು ಸೋಮಾರಿ ಮಕ್ಕಳಿದ್ದರು. ಅನಾರೋಗ್ಯದಿಂದ ರೈತ ಹಾಸಿಗೆ ಹಿಡಿದನು. ಮಕ್ಕಳನ್ನು ಹತ್ತಿರ ಕರೆದು ‘‘ಮಕ್ಕಳೇ ನಾನು ಸಂಪಾದಿಸಿದ ಸಂಪತ್ತನ್ನು ನಿಮಗಾಗಿ ಹೊಲದಲ್ಲಿ ಹೂತಿಟ್ಟಿದ್ದೇನೆ’’ ಎಂದು ಹೇಳಿದನು. ಮಕ್ಕಳಿಬ್ಬರು ಹಾರೆ ಗುದ್ದಲಿ ಹಿಡಿದು ಹೊಲಕ್ಕೆ ಹೋದರು. ಅಗೆದು ಅಗೆದು ನಿಧಿಗಾಗಿ ಹುಡುಕಿದರು. ನಿಧಿ ಸಿಗಲಿಲ್ಲ. ಅದೇ ದಿನ ಮಳೆ ಸುರಿಯಿತು. ಇನ್ನೇನು ಮಾಡುವುದು ಎಂದು ಧಾನ್ಯ ಬಿತ್ತಿದರು. ಉತ್ತಮ ಬೆಳೆ ಬಂತು. ಕೈ ತುಂಬ ಹಣ ಸಂಪಾದಿಸಿದರು. ರೈತ ಮಕ್ಕಳನ್ನು ಕರೆದು ‘‘ಇದೇ ನಾನು ಹೊಲದಲ್ಲಿ ಹೂತಿಟ್ಟ ಸಂಪತ್ತು’’ ಎಂದು ಹೇಳಿದನು.

  - id: usage-C-q1
    type: question
    section: usage-activity-C
    text: "*ಒಡಾಡ್ಕೊಂಡು ದನ ಕಾದ್ರೆ ಬೇಗ್ನೆ ಹೊತ್ತು ಮುಳುಗುತ್ತಾ?"
  - id: usage-C-q2
    type: question
    section: usage-activity-C
    text: "*ಕಡ್ಲೆ ಇದ್ದಾಗ ಹಲ್ಲಿಲ್ಲ, ಹಲ್ಲಿದ್ದಾಗ ಕಡ್ಲಿಲ್ಲ."
  - id: usage-C-q3
    type: question
    section: usage-activity-C
    text: "*ಕುಟ್ಟಾಕ ಬರದೋಳು ಕೇರಿ ಕೇರಿ ನೋಡಿದಳಂತ."

  - id: usage-D-sec1
    type: prose
    section: usage-activity-D
    text: ಅ. ರವಿ ಶಾಲೆಗೆ ಹೋದನು.
  - id: usage-D-sec2
    type: prose
    section: usage-activity-D
    text: ರವಿ ಸಾಲಿಗೆ ಹೋದ.
  - id: usage-D-sec3
    type: prose
    section: usage-activity-D
    text: ರವಿ ಸಾಲಿಗೆ ಹೊಗ್ಯಾನ್ರೀ.
  - id: usage-D-sec4
    type: prose
    section: usage-activity-D
    text: ಆ. ಕಿರಣ ತಿಂಡಿ ತಿನ್ನುತ್ತಿದ್ದಾನೆ.
  - id: usage-D-sec5
    type: prose
    section: usage-activity-D
    text: ಕಿರಣ ತಿಂಡಿ ತಿಂತಾನ.

  - id: comp-1
    type: prose
    section: competency
    text: ನೀನೀಗ ಆಡುಭಾಷೆ ಹಾಗೂ ಬರೆಹದ ಭಾಷೆಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸವನ್ನು ಗುರುತಿಸಬಲ್ಲೆಯಲ್ಲವೇ?