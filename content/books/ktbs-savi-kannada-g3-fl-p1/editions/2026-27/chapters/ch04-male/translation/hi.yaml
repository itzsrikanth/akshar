labels:
  title: वर्षा
  intro: सीखने की तैयारी
  poem: कविता
  vocab: शब्दार्थ
  notes: टिप्पणी
  exercise-A: अभ्यास अ — प्रत्येक उत्तर एक वाक्य में लिखिए।
  exercise-B: अभ्यास आ — सही शब्द चुनकर रिक्त स्थान भरिए।
  exercise-C: अभ्यास इ — कविता की छूटी पंक्तियाँ लिखिए।
  exercise-D: अभ्यास ई — समूह में न आने वाला शब्द पहचानकर लिखिए।
  exercise-E: अभ्यास उ — दिए शब्दों के समानार्थी लिखिए।
  exercise-F: भाषा गतिविधि अ — अक्षरों से शब्द बनाओ, उलटा पढ़कर आनंद लो।
  exercise-G: भाषा गतिविधि आ — संकेत समझकर शब्दबंध पूरा करो।
  exercise-H: भाषा गतिविधि इ — उदाहरण की तरह तुक वाले शब्द लिखो।
  exercise-I: भाषा गतिविधि ई — उदाहरण की तरह जोड़ी शब्द लिखो।
  exercise-J: प्रयोग गतिविधि अ
  exercise-K: प्रयोग गतिविधि आ — सोचकर लिखो।
  competency: चतुर बच्चा — सामर्थ्य
intro-1: इंद्रधनुष कहाँ? कब? कैसे दिखाई देता है — शिक्षक के मार्गदर्शन में कक्षा में चर्चा करो।
poem-s1l1: धूप की तपन से समुद्र का पानी
poem-s1l2: वाष्प बन गया |
poem-s1l3: वाष्प बनकर धरती की ओर
poem-s1l4: बहकर आया॥
poem-s2l1: धरती पर पहाड़-पहाड़ियाँ
poem-s2l2: आड़े आ गईं |
poem-s2l3: रुककर खड़े सारे बादल
poem-s2l4: ऊपर चढ़ गए॥
poem-s3l1: एक घड़ी में आकाश भर
poem-s3l2: बादल छा गए |
poem-s3l3: बिजली चमककर जग प्रकाशित
poem-s3l4: और गर्जन हुआ॥
poem-s4l1: बादल ऊपर चढ़े तब
poem-s4l2: ठंडक लगी |
poem-s4l3: वाष्प ठंडी होकर भारी हुई
poem-s4l4: और गिरने लगी॥
poem-s5l1: मोती जैसा वर्षा का जल
poem-s5l2: नीचे बरस पड़ा |
poem-s5l3: तालाब, झरना, नाला, नदी
poem-s5l4: भरकर बहने लगे॥
intro-2: भूजल की रक्षा करो — जीवजगत बचाओ
