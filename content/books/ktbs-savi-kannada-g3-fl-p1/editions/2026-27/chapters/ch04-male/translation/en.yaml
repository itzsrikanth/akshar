intro-1: Where is the rainbow? When? Discuss in class under the teacher’s guidance how it appears.
poem-s1l1: Sea water in the heat of the sun
poem-s1l2: became vapour |
poem-s1l3: As vapour, towards the land
poem-s1l4: it blew and came॥
poem-s2l1: On the land, hills and mountains
poem-s2l2: stood in the way |
poem-s2l3: All the clouds that were stopped
poem-s2l4: rose upward॥
poem-s3l1: Within a ghalige the whole sky
poem-s3l2: was covered with cloud |
poem-s3l3: Lightning flashed, lighting the world
poem-s3l4: and thunder roared॥
poem-s4l1: When the cloud rose upward
poem-s4l2: coolness touched it |
poem-s4l3: The vapour cooled, grew heavy
poem-s4l4: and began to fall॥
poem-s5l1: Pearl-like rain water
poem-s5l2: poured down |
poem-s5l3: Lake and stream, brook and river
poem-s5l4: filled and flowed॥
intro-2: Protect groundwater — save living beings
