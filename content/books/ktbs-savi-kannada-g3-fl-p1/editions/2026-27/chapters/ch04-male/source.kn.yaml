- id: competency
  type: competency
  text: ನೀನೀಗ ಪಠ್ಯವನ್ನು ಓದಿದ ಅನಂತರ ಅದರಲ್ಲಿನ ವಿಚಾರ ಸರಣಿ ಮತ್ತು ಘಟನಾವಳಿಗಳಿಗೆ ಇರುವ ಸರಳ ಕಾರ್ಯ ಕಾರಣ ಸಂಬಂಧಗಳನ್ನು ಗುರುತಿಸಿ ಹೇಳಬಲ್ಲೆಯಲ್ಲವೆ?
