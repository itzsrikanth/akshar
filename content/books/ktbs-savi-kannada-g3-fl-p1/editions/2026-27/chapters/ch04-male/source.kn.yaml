labels:
  title: ಮಳೆ
  intro: ಕಲಿಕೆಗೆ ದಾರಿ
  poem: ಪದ್ಯ
  vocab: ಪದಗಳ ಅರ್ಥ
  notes: ಟಿಪ್ಪಣಿ
  exercise-A: ಅಭ್ಯಾಸ ಅ — ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-B: ಅಭ್ಯಾಸ ಆ — ಕೊಟ್ಟಿರುವ ಪದಗಳಲ್ಲಿ ಸರಿಯಾದುದನ್ನು ಆಯ್ದು ಬಿಟ್ಟ ಸ್ಥಳದಲ್ಲಿ ಬರೆಯಿರಿ.
  exercise-C: ಅಭ್ಯಾಸ ಇ — ಪದ್ಯದಲ್ಲಿ ಬಿಟ್ಟಿರುವ ಸಾಲುಗಳನ್ನು ಬರೆಯಿರಿ.
  exercise-D: ಅಭ್ಯಾಸ ಈ — ಗುಂಪಿಗೆ ಸೇರದ ಪದ ಗುರುತಿಸಿ ಬರೆಯಿರಿ.
  exercise-E: ಅಭ್ಯಾಸ ಉ — ಕೊಟ್ಟಿರುವ ಪದಗಳಿಗೆ ಸಮಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ.
  exercise-F: ಭಾಷಾ ಚಟುವಟಿಕೆ ಅ — ಅಕ್ಷರ ಬಳಸಿ ಪದ ರಚಿಸು, ತಿರುಗಿಸಿ ಓದಿ ಆನಂದಿಸಿ.
  exercise-G: ಭಾಷಾ ಚಟುವಟಿಕೆ ಆ — ಸೂಚನೆಗಳನ್ನು ಅರ್ಥೈಸಿಕೊಂಡು ಪದಬಂಧ ಪೂರ್ಣಗೊಳಿಸಿ.
  exercise-H: ಭಾಷಾ ಚಟುವಟಿಕೆ ಇ — ಮಾದರಿಯಂತೆ ಪ್ರಾಸ ಪದಗಳನ್ನು ಬರೆಯಿರಿ.
  exercise-I: ಭಾಷಾ ಚಟುವಟಿಕೆ ಈ — ಮಾದರಿಯಂತೆ ಜೋಡುನುಡಿಗಳನ್ನು ಬರೆಯಿರಿ.
  exercise-J: ಬಳಕೆ ಚಟುವಟಿಕೆ ಅ
  exercise-K: ಬಳಕೆ ಚಟುವಟಿಕೆ ಆ — ಯೋಚಿಸಿ ಬರೆಯಿರಿ.
  competency: ಜಾಣ ಮರಿ — ಸಾಮರ್ಥ್ಯ
segments:
- id: intro-1
  type: prose
  section: intro
  text: ಕಾಮನಬಿಲ್ಲು ಎಲ್ಲಿ? ಯಾವಾಗ? ಹೇಗೆ ಕಾಣಿಸುತ್ತದೆ ಎಂದು ಶಿಕ್ಷಕರ ಮಾರ್ಗದರ್ಶನದಲ್ಲಿ ತರಗತಿಯಲ್ಲಿ ಚರ್ಚಿಸಿ.
- id: poem-s1l1
  type: poem_line
  section: poem
  stanza: 1
  text: ಬಿಸಿಲ ಝಳಕೆ ಕಡಲ ನೀರು
- id: poem-s1l2
  type: poem_line
  section: poem
  stanza: 1
  text: ಆವಿಯಾಯಿತು |
- id: poem-s1l3
  type: poem_line
  section: poem
  stanza: 1
  text: ಆವಿಯಾಗಿ ನೆಲದ ಕಡೆಗೆ
- id: poem-s1l4
  type: poem_line
  section: poem
  stanza: 1
  text: ಬೀಸಿ ಬಂದಿತು॥
- id: poem-s2l1
  type: poem_line
  section: poem
  stanza: 2
  text: ನೆಲದ ಮೇಲೆ ಗುಡ್ಡಬೆಟ್ಟ
- id: poem-s2l2
  type: poem_line
  section: poem
  stanza: 2
  text: ಅಡ್ಡವಾಯಿತು |
- id: poem-s2l3
  type: poem_line
  section: poem
  stanza: 2
  text: ತಡೆದು ನಿಂತ ಮೋಡವೆಲ್ಲ
- id: poem-s2l4
  type: poem_line
  section: poem
  stanza: 2
  text: ಮೇಲಕೇರಿತು॥
- id: poem-s3l1
  type: poem_line
  section: poem
  stanza: 3
  text: ಘಳಿಗೆಯೊಳಗೆ ಬಾನು ತುಂಬ
- id: poem-s3l2
  type: poem_line
  section: poem
  stanza: 3
  text: ಮೋಡ ಕವಿಯಿತು |
- id: poem-s3l3
  type: poem_line
  section: poem
  stanza: 3
  text: ಮಿಂಚು ಮಿಂಚಿ ಜಗವು ಬೆಳಗಿ
- id: poem-s3l4
  type: poem_line
  section: poem
  stanza: 3
  text: ಗುಡುಗು ಗುಡುಗಿತು॥
- id: poem-s4l1
  type: poem_line
  section: poem
  stanza: 4
  text: ಮೋಡ ಮೇಲಕೇರಿದಾಗ
- id: poem-s4l2
  type: poem_line
  section: poem
  stanza: 4
  text: ತಂಪು ತಗುಲಿತು |
- id: poem-s4l3
  type: poem_line
  section: poem
  stanza: 4
  text: ಆವಿ ತಣಿದು ಭಾರವಾಗಿ
- id: poem-s4l4
  type: poem_line
  section: poem
  stanza: 4
  text: ಕುಸಿಯತೊಡಗಿತು॥
- id: poem-s5l1
  type: poem_line
  section: poem
  stanza: 5
  text: ಮುತ್ತಿನಂಥ ಮಳೆಯ ನೀರು
- id: poem-s5l2
  type: poem_line
  section: poem
  stanza: 5
  text: ಕೆಳಗೆ ಸುರಿಯಿತು |
- id: poem-s5l3
  type: poem_line
  section: poem
  stanza: 5
  text: ಕೆರೆಯು ತೊರೆಯು ಹಳ್ಳ ಹೊಳೆಯು
- id: poem-s5l4
  type: poem_line
  section: poem
  stanza: 5
  text: ತುಂಬಿ ಹರಿಯಿತು॥
- id: intro-2
  type: prose
  section: intro
  text: ಅಂತರ್ಜಲ ಸಂರಕ್ಷಿಸು - ಜೀವಕುಲ ಉಳಿಸು
