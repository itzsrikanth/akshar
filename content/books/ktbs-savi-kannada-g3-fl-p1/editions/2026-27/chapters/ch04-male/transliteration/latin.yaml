labels:
  title: Male
  intro: Kalikege Daari
  poem: Padya
  vocab: Padagala Artha
  notes: Tippani
  exercise-A: Abhyaasa A — Ondondu vaakyadalli uttara bareyiri.
  exercise-B: Abhyaasa Aa — Kottiruva padagalalli sariyaadudannu aaydu bitti sthaladalli bareyiri.
  exercise-C: Abhyaasa I — Padyadalli bittiruva saalugalannu bareyiri.
  exercise-D: Abhyaasa Ee — Gumpige serada pada gurutisi bareyiri.
  exercise-E: Abhyaasa U — Kottiruva padagalige samaanaarthaka padagalannu bareyiri.
  exercise-F: Bhaashaa Chatuvatike A — Akshara balasi pada rachisu, tirugisi oodi aanandisi.
  exercise-G: Bhaashaa Chatuvatike Aa — Soochanegalannu arthaishikondu padabandha poornagolisi.
  exercise-H: Bhaashaa Chatuvatike I — Maadariyante praasa padagalannu bareyiri.
  exercise-I: Bhaashaa Chatuvatike Ee — Maadariyante joodunudigalannu bareyiri.
  exercise-J: Balake Chatuvatike A
  exercise-K: Balake Chatuvatike Aa — Yochisi bareyiri.
  competency: Jaana Mari — Saamarthya
intro-1: Kaamanabillu elli? yaavaaga? hege kaanisuttade endu shikshakara maargadarshanadalli taragatiyalli charchisi.
poem-s1l1: Bisila jhalake kadala neeru
poem-s1l2: Aaviyaayitu |
poem-s1l3: Aaviyaagi nelada kadege
poem-s1l4: Beesi banditu॥
