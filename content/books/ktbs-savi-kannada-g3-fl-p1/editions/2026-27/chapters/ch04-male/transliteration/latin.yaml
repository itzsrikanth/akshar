poem-s2l2: Addavaayitu |
poem-s2l3: Tadedu ninta modavella
poem-s2l4: Melakeritu॥
poem-s3l1: Ghaligeyolage baanu tunba
poem-s3l2: Moda kaviyitu |
poem-s3l3: Minchu minchi jagavu belagi
poem-s3l4: Gudugu gudugitu॥
