poem-s2l3: तडॆदु निंत मोडवॆल्ल
poem-s2l4: मेलकेरितु॥
poem-s3l1: घळिगॆयॊळगॆ बानु तुंब
poem-s3l2: मोड कवियितु |
poem-s3l3: मिंचु मिंचि जगवु बॆळगि
poem-s3l4: गुडुगु गुडुगितु॥
poem-s4l1: मोड मेलकेरिदाग
poem-s4l2: तंपु तगुलितु |
poem-s4l3: आवि तणिदु भारवागि
