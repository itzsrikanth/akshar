labels:
  title: मळॆ
  intro: कलिकॆगॆ दारि
  poem: पद्य
  vocab: पदगळ अर्थ
  notes: टिप्पणि
  exercise-A: अभ्यास अ — ऒंदॊंदु वाक्यदल्लि उत्तर बरॆयिरि.
  exercise-B: अभ्यास आ — कॊट्टिरुव पदगळल्लि सरियादुदन्नु आय्दु बिट्ट स्थळदल्लि बरॆयिरि.
  exercise-C: अभ्यास इ — पद्यदल्लि बिट्टिरुव सालुगळन्नु बरॆयिरि.
  exercise-D: अभ्यास ई — गुंपिगॆ सेरद पद गुरुतिसि बरॆयिरि.
  exercise-E: अभ्यास उ — कॊट्टिरुव पदगळिगॆ समानार्थक पदगळन्नु बरॆयिरि.
  exercise-F: भाषा चटुवटिकॆ अ — अक्षर बळसि पद रचिसु, तिरुगिसि ओदि आनंदिसि.
  exercise-G: भाषा चटुवटिकॆ आ — सूचनॆगळन्नु अर्थैसिकॊंडु पदबंध पूर्णगॊळिसि.
  exercise-H: भाषा चटुवटिकॆ इ — मादरियंतॆ प्रास पदगळन्नु बरॆयिरि.
  exercise-I: भाषा चटुवटिकॆ ई — मादरियंतॆ जोडुनुडिगळन्नु बरॆयिरि.
  exercise-J: बळकॆ चटुवटिकॆ अ
  exercise-K: बळकॆ चटुवटिकॆ आ — योचिसि बरॆयिरि.
  competency: जाण मरि — सामर्थ्य
intro-1: कामनबिल्लु ऎल्लि? यावाग? हेगॆ काणिसुत्तदॆ ऎंदु शिक्षकर मार्गदर्शनदल्लि तरगतियल्लि चर्चिसि.
