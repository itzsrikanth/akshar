intro-1: With your teacher's help, learn about these heroic mothers.
intro-2: Chennabhairadevi
intro-3: Belavadi Mallamma
intro-4: Rani Lakshmibai of Jhansi
intro-5: Rani Chennamma of Kittur
intro-6: Rani Abbakka
intro-7: Keladi Chennamma
story-n1: '"My salutations to Mataji," said the brave boy with a budding mustache, speaking humbly. Smiling gently, his mother said, "Come, my child, sit here." "All right, Mother," said the boy, and he sat down.'
story-n2: '"Mother, why did you call me? Tell me, Mother, what should I do?" asked the boy. "Will you give me what I ask, my son?" said the mother proudly.'
story-n3: '"Very well, Mataji… I swear by Mother Bhavani. I will give what you ask," said the son.'
story-n4: Thinking to herself, the mother said, "My son, as you have promised, you must give me what I ask."
story-n5: '"Tell me, Mother; I will certainly give it," said the son happily. "I am blessed, my child. Now listen to what I say. Kondana Fort is in the hands of the Mughals. You must conquer it and give it to me as a gift," said the mother proudly, looking at her son.'
story-n6: Do you know who this mother and son were who spoke like this? They were the heroic mother Jijabai, who holds an everlasting place in India's history, and her son Chhatrapati Shivaji, who raised the Maratha Empire to greatness.
story-n7: Jijabai was born in 1594 CE as the daughter of Lakhuji Jadhavrao. In 1603 CE she married Shahaji. Shahaji served in the Adil Shahi of Bijapur. In 1627 CE, Shivaji was born to this couple at Shivneri Fort. Shahaji sent his son Shivaji to study under the teacher Dadaji Kondadev. Guru Dadaji Kondadev taught Shivaji swordsmanship, horse riding, and other arts of war.
story-n8: When Shahaji had to stay away from her, Jijabai was deeply hurt. Even so, without losing heart, she began to live independently.
story-n9: With the golden dream of raising her son as a brave warrior, she came to Pune and settled with him. Jijabai was a shrewd woman. She was not a woman who merely remembered life's ups and downs like an ordinary person and grieved. She vowed to end Mughal rule across undivided India. She decided that the victory flag of the Maratha Empire should fly throughout India. She resolved that people should come out of foreign slavery and live freely.
story-n10: Every day she told Shivaji sacred stories from the Ramayana, the Mahabharata, and other puranas. From childhood she nurtured in her son qualities such as justice and ethics, respect for women, and endurance. From his early years she sowed in Shivaji the ideals of listening to stories of brave men and doing daring deeds. In this way, from childhood itself, Jijabai filled her son with values such as courage, self-respect, daring, service, and sacrifice. She raised him to be a fine patriot. She became the guiding light for the rise of the whole Maratha Empire.
story-n11: Later Shivaji fought the powerful Mughal emperor Aurangzeb and won. Jijabai was very happy at her son's victory celebration. Shivaji's coronation at Raigad was held with great splendour. Swami Ramadas came and placed the crown on Shivaji with his own hands. Jijabai was delighted that the dream she had seen when Shivaji was a child had come true, and she blessed him. That day she too came to be known as the queen mother. Jijabai did not get much chance to enjoy those happy days. Only a few days after Shivaji ascended the throne, she took to her bed.
story-n12: Jijabai, who lived for about eighty years, saw the prosperity of the Marathas. Later, in 1674 CE, she passed away in the village of Pachad near Raigad.
story-n13: Home is the first school; the mother herself is the first teacher. Blessed are those who learn their lessons from their mother.
