story-n1: '"माताजी को मेरे प्रणाम," हल्की मूँछ वाले वीर बालक ने विनम्रता से कहा। मुस्कान बिखेरती हुई उसकी माँ बोली, "आओ बेटा, यहाँ बैठो।" "अच्छा माँ," कहकर बालक बैठ गया।'
story-n2: '"अम्मा, आपने मुझे क्यों बुलाया? बताओ माँ, मुझसे क्या चाहिए?" बालक ने पूछा। "मैं जो माँगूँगी, क्या तुम दे दोगे, बेटा?" माँ ने गर्व से कहा।'
story-n3: '"ठीक है माताजी… भवानी माँ की कसम। तुम जो माँगोगी, वह दूँगा," बेटे ने कहा।'
story-n4: मन ही मन सोचती हुई माँ बोली, "कुमार, जैसे तुमने कहा है, वैसा ही जो मैं माँगूँ वह तुम्हें देना होगा।"
story-n5: '"कहिए माँ, अवश्य दूँगा," बेटे ने खुशी से कहा। "धन्य हूँ मैं, बेटा। अब सुनो। कोंडाणा दुर्ग मुगलों के कब्जे में है। तुम्हें उसे जीतकर मुझे पुरस्कार के रूप में देना होगा," गर्व से बेटे की ओर देखती हुई माँ ने कहा।'
story-n6: क्या पता है, इस तरह बात करने वाले माँ-बेटे कौन थे? यही भारत के इतिहास में शाश्वत स्थान पाने वाली वीरमाता जीजाबाई और उनके पुत्र छत्रपति शिवाजी थे, जिन्होंने मराठा साम्राज्य की उन्नति का मार्ग खोला।
story-n7: जीजाबाई का जन्म सन् 1594 में लखूजी जाधवराव की पुत्री के रूप में हुआ। सन् 1603 में उनका विवाह शहाजी से हुआ। शहाजी बीजापुर की आदिलशाही में सेवा करते थे। सन् 1627 में शिवनेरी दुर्ग में इन दंपति के पुत्र शिवाजी का जन्म हुआ। शहाजी ने पुत्र शिवाजी को गुरु दादाजी कोंडदेव के पास विद्याध्ययन के लिए भेजा। गुरु दादाजी कोंडदेव ने शिवाजी को तलवारबाजी, घुड़सवारी और अन्य युद्धकलाएँ सिखाईं।
story-n8: जब शहाजी को अनिवार्य रूप से उनसे दूर रहना पड़ा, तो जीजाबाई बहुत दुखी हुईं। फिर भी हिम्मत न हारकर उन्होंने स्वतंत्र रूप से जीना आरंभ किया।
story-n9: पुत्र को एक वीर योद्धा बनाने के सुंदर सपने के साथ वे पुणे आईं और उनके साथ बस गईं। जीजाबाई चतुर स्त्री थीं। वे सामान्य स्त्री की तरह जीवन के उतार-चढ़ाव याद कर केवल दुखी रहने वाली नहीं थीं। उन्होंने अखंड भारत में मुगल शासन समाप्त करने की प्रतिज्ञा की। उन्होंने निश्चय किया कि पूरे भारत में मराठा साम्राज्य का विजय पताका फहराना चाहिए। उन्होंने ठाना कि विदेशी गुलामी से निकलकर स्वतंत्र जीवन जीना चाहिए।
story-n10: वे प्रतिदिन शिवाजी को रामायण, महाभारत और अन्य पुराण-पुण्यकथाएँ सुनाती थीं। न्याय-नीति, स्त्रियों के प्रति सम्मान, कष्टसहिष्णुता आदि गुण बचपन से ही पुत्र में विकसित किए। शिवाजी में वीर पुरुषों की कथाएँ सुनने और साहसिक कार्य करने के आदर्श बचपन से ही बोए। इस प्रकार जीजाबाई ने पुत्र में धैर्य, स्वाभिमान, साहस, सेवा, त्याग आदि मूल्य बचपन में ही भर दिए। उन्होंने उन्हें उत्तम देशभक्त बनाया। वे अखंड मराठा साम्राज्य की उन्नति की दीपशिखा बनीं।
story-n11: आगे चलकर शिवाजी ने प्रबल मुगल सम्राट औरंगजेब के विरुद्ध लड़कर विजय प्राप्त की। जीजाबाई पुत्र के विजयोत्सव पर बहुत प्रसन्न हुईं। रायगढ़ में शिवाजी का राज्याभिषेक अत्यंत वैभव के साथ हुआ। स्वामी रामदास आए और अपने हाथों से शिवाजी को मुकुट पहनाया। जीजाबाई खुश हुईं कि शिवाजी के बचपन में देखा उनका सपना सच हो गया, और उन्होंने शिवाजी को आशीर्वाद दिया। उस दिन वे भी राजमाता कहलाईं। उन सुख के दिनों का अधिक आनंद लेने का अवसर जीजाबाई को नहीं मिला। शिवाजी के गद्दी पर बैठने के कुछ ही दिनों बाद वे बीमार पड़ गईं।
story-n12: लगभग अस्सी वर्ष जीवित रहने वाली जीजाबाई ने मराठों का अभ्युदय देखा। इसके बाद सन् 1674 में रायगढ़ के पास पाचाड नामक गाँव में उनका निधन हुआ।
story-n13: घर ही पहली पाठशाला है, जननी स्वयं पहली गुरु है। जननी से पाठ सीखने वाले ही धन्य हैं।
