  title: ವೀರಮಾತೆ ಜೀಜಾಬಾಯಿ
  intro: ಕಲಿಕೆಗೆ ದಾರಿ
  story: ಕಥೆ
  vocab: ಪದಗಳ ಅರ್ಥ
  notes: ಟಿಪ್ಪಣಿ
  exercise-A: ಅಭ್ಯಾಸ ಅ — ಒಂದೊಂದು ವಾಕ್ಯದಲ್ಲಿ ಉತ್ತರ ಬರೆಯಿರಿ.
  exercise-B: ಅಭ್ಯಾಸ ಆ — ಕೊಟ್ಟಿರುವ ಪದಗಳಲ್ಲಿ ಸರಿಯಾದ ಪದ ಆರಿಸಿ ಬಿಟ್ಟ ಸ್ಥಳದಲ್ಲಿ ಬರೆಯಿರಿ.
  exercise-C: ಅಭ್ಯಾಸ ಇ — ಕೊಟ್ಟಿರುವ ಪದ ಗಮನಿಸಿ ವಿರುದ್ಧಾರ್ಥಕ ಪದ ಬರೆಯಿರಿ.
  exercise-D: ಅಭ್ಯಾಸ ಈ — ಮಾದರಿಯಂತೆ ಕೊಟ್ಟಿರುವ ಪದ ಗಮನಿಸಿ ಎರಡೆರಡು ಸಮಾನಾರ್ಥಕ ಪದಗಳನ್ನು ಬರೆಯಿರಿ.
  exercise-E: ಅಭ್ಯಾಸ ಉ — ಕೊಟ್ಟಿರುವ ಪದ ಬಳಸಿ ಸ್ವಂತ ವಾಕ್ಯ ಬರೆಯಿರಿ.
  exercise-F: ಅಭ್ಯಾಸ ಊ — ಕೊಟ್ಟಿರುವ ಮಾತನ್ನು ಯಾರು? ಯಾರಿಗೆ ಹೇಳಿದರು?
  exercise-G: ಅಭ್ಯಾಸ ಋ — ಪದಗಳನ್ನು ಸರಿಯಾಗಿ ಜೋಡಿಸಿ ವಾಕ್ಯ ರಚಿಸಿ ಬರೆಯಿರಿ.
  exercise-H: ಭಾಷಾ ಚಟುವಟಿಕೆ ಅ — ಮಾದರಿಯಲ್ಲಿ ಸೂಚಿಸಿರುವಂತೆ ಸೂಕ್ತ ಪದ ರಚಿಸಿ ಬರೆಯಿರಿ.
  exercise-I: ಭಾಷಾ ಚಟುವಟಿಕೆ ಆ — ಕೊಟ್ಟಿರುವ ಪದಗಳನ್ನು ಗಮನಿಸಿ ಓದಿ.
  exercise-J: ಭಾಷಾ ಚಟುವಟಿಕೆ ಇ — ಆವರಣದಲ್ಲಿರುವ ಪದಗಳನ್ನು ಗಮನಿಸಿ. ಅವುಗಳ ಸಹಾಯದಿಂದ ಗಾದೆಗಳನ್ನು ಪೂರ್ಣ ಮಾಡಿ.
  exercise-K: ಬಳಕೆ ಚಟುವಟಿಕೆ
  competency: ಜಾಣ ಮರಿ — ಸಾಮರ್ಥ್ಯ
