- id: intro-1
  type: prose
  section: intro
  text: ಶಿಕ್ಷಕರ ಸಹಾಯದಿಂದ ಈ ವೀರಮಾತೆಯರ ಬಗ್ಗೆ ತಿಳಿಯಿರಿ.
- id: intro-2
  type: prose
  section: intro
  text: ಚೆನ್ನಭೈರಾದೇವಿ
- id: intro-3
  type: prose
  section: intro
  text: ಬೆಳವಡಿ ಮಲ್ಲಮ್ಮ
- id: intro-4
  type: prose
  section: intro
  text: ಝಾನ್ಸಿ ರಾಣಿ ಲಕ್ಷೀಬಾಯಿ
- id: intro-5
  type: prose
  section: intro
  text: ಕಿತ್ತೂರು ರಾಣಿ ಚೆನ್ನಮ್ಮ
- id: intro-6
  type: prose
  section: intro
  text: ರಾಣಿ ಅಬ್ಬಕ್ಕ
- id: intro-7
  type: prose
  section: intro
  text: ಕೆಳದಿ ಚೆನ್ನಮ್ಮ
- id: story-n1
  type: prose
  section: story
  text: '"ಮಾತಾಜಿಯವರಿಗೆ ನನ್ನ ಪ್ರಣಾಮಗಳು" ಚಿಗುರು ಮೀಸೆಯ ವೀರಬಾಲಕ ನಮ್ರತೆಯಿಂದ ನುಡಿದನು. ಹುಸಿನಗೆ ಬೀರುತ್ತಾ ಅವನ ತಾಯಿ "ಬಾ ಕಂದ ಇಲ್ಲಿ ಕುಳಿತುಕೊ". "ಆಗಲಿ ತಾಯಿ" ಎಂದು ಬಾಲಕ ಕುಳಿತುಕೊಂಡನು.'
- id: story-n2
  type: prose
  section: story
  text: '"ಅಮ್ಮಾ ನನ್ನನ್ನು ಕರೆಸಿದ ಕಾರಣವೇನು? ನನ್ನಿಂದ ಏನಾಗಬೇಕು ಕೇಳು ತಾಯಿ?" ಎಂದನು ಬಾಲಕ. "ನಾನು ಕೇಳಿದ್ದನ್ನು ಕೊಡುವೆಯಾ ಮಗನೆ?" ಎಂದು ತಾಯಿ ಅಭಿಮಾನದಿಂದ ನುಡಿದಳು.'
- id: story-n3
  type: prose
  section: story
  text: '"ಆಗಲಿ ಮಾತಾಜಿ... ಭವಾನಿ ತಾಯಿಯ ಮೇಲೆ ಆಣೆ. ನೀನು ಕೇಳಿದ್ದನ್ನು ಕೊಡುವೆ" ಎಂದನು ಮಗ.'
- id: story-n4
  type: prose
  section: story
  text: ತಾಯಿ ಮನಸ್ಸಿನಲ್ಲೆ ಯೋಚಿಸುತ್ತಾ "ಕುಮಾರ, ಆಡಿದ ಮಾತಿನಂತೆ ನಾನು ಕೇಳಿದ್ದನ್ನು ಕೊಡಬೇಕು" ಎಂದಳು.
- id: story-n5
  type: prose
  section: story
  text: '"ಕೇಳು ತಾಯಿ ಅಗತ್ಯವಾಗಿ ನೀಡುತ್ತೇನೆ" ಎಂದನು ಮಗ ಸಂತೋಷದಿಂದ. "ನಾನು ಧನ್ಯ ಕಂದಾ, ಈಗ ಹೇಳುವೆನು ಕೇಳು. ಕೊಂಡಾಣದುರ್ಗವು ಮೊಘಲರ ವಶದಲ್ಲಿದೆ. ಅದನ್ನು ನೀನು ಗೆದ್ದು ನನಗೆ ಬಹುಮಾನವಾಗಿ ಕೊಡಬೇಕು" ಎಂದಳು ಹೆಮ್ಮೆಯಿಂದ ಮಗನನ್ನು ನೋಡುತ್ತಾ ತಾಯಿ.'
- id: story-n6
  type: prose
  section: story
  text: ಈ ರೀತಿ ಸಂಭಾಷಣೆ ನಡೆಸಿದ ತಾಯಿಮಗ ಯಾರು ಗೊತ್ತೇ? ಇವರೇ ಭಾರತದ ಇತಿಹಾಸದಲ್ಲಿ ಶಾಶ್ವತ ಸ್ಥಾನ ಪಡೆದಿರುವ ವೀರಮಾತೆ ಜೀಜಾಬಾಯಿ ಹಾಗೂ ಅವಳ ಪುತ್ರ ಮರಾಠ ಸಾಮ್ರಾಜ್ಯದ ಉನ್ನತಿಗೆ ಕಾರಣನಾದ 'ಛತ್ರಪತಿ ಶಿವಾಜಿ'.
- id: story-n7
  type: prose
  section: story
  text: ಜೀಜಾಬಾಯಿ ಕ್ರಿ.ಶ. 1594ರಲ್ಲಿ ಲಖೂಜಿ ಜಾಧವರಾವ್ ಅವರ ಮಗಳಾಗಿ ಜನಿಸಿದಳು. ಕ್ರಿ.ಶ. 1603ರಲ್ಲಿ ಷಹಾಜಿಯನ್ನು ವಿವಾಹವಾದಳು. ಷಹಾಜಿಯು ಬಿಜಾಪುರದ ಆದಿಲ್ ಶಾಹಿಯಲ್ಲಿ ಉದ್ಯೋಗ ಮಾಡುತ್ತಿದ್ದನು. ಕ್ರಿ.ಶ. 1627ರಲ್ಲಿ ಶಿವನೇರಿ ದುರ್ಗದಲ್ಲಿ ಈ ದಂಪತಿಗಳ ಮಗನಾಗಿ ಶಿವಾಜಿಯು ಜನಿಸಿದನು. ಷಹಾಜಿಯು ಮಗ ಶಿವಾಜಿಯನ್ನು ಗುರುವಾದ ದಾದಾಜಿಕೊಂಡದೇವನಲ್ಲಿ ವಿದ್ಯಾಭ್ಯಾಸಕ್ಕಾಗಿ ಕಳುಹಿಸಿದನು. ಗುರು ದಾದಾಜಿಕೊಂಡದೇವನು ಶಿವಾಜಿಗೆ ಕತ್ತಿವರಸೆ, ಕುದುರೆ ಸವಾರಿ ಮುಂತಾದ ಯುದ್ಧಕಲೆಗಳನ್ನು ಕಲಿಸಿದನು.
- id: story-n8
  type: prose
  section: story
  text: ಷಹಾಜಿ ಅನಿವಾರ್ಯವಾಗಿ ತನ್ನಿಂದ ದೂರವಾದಾಗ ಜೀಜಾಬಾಯಿ ಬಹಳ ನೊಂದುಕೊಂಡಳು. ಆದರೂ ಎದೆಗುಂದದೆ ಸ್ವತಂತ್ರವಾಗಿ ಬದುಕಲು ಪ್ರಾರಂಭಿಸಿದಳು.
- id: story-n9
  type: prose
  section: story
  text: ಮಗನನ್ನು ಓರ್ವ ವೀರಯೋಧನನ್ನಾಗಿ ಬೆಳೆಸುವ ಹೊಂಗನಸಿನೊಂದಿಗೆ ಪುಣೆಗೆ ಬಂದು ಅವನೊಂದಿಗೆ ನೆಲೆಸಿದಳು. ಜೀಜಾಬಾಯಿ ಚಾಣಾಕ್ಷ ಹೆಣ್ಣುಮಗಳು. ಕೇವಲ ಓರ್ವ ಸಾಮಾನ್ಯ ಮಹಿಳೆಯಂತೆ ಬದುಕಿನ ಆಗುಹೋಗುಗಳನ್ನು ನೆನೆದು ದುಃಖಿಸುವ ಹೆಣ್ಣಾಗಿರಲಿಲ್ಲ. ಅಖಂಡ ಭಾರತದಲ್ಲಿ ಮೊಘಲರ ಆಳ್ವಿಕೆಯನ್ನು ಕೊನೆಗೊಳಿಸಲು ಪಣತೊಟ್ಟಳು. ಭಾರತದಾದ್ಯಂತ ಮರಾಠ ಸಾಮ್ರಾಜ್ಯದ ವಿಜಯ ಪತಾಕೆಯನ್ನು ಹಾರಿಸಬೇಕು ಎಂದು ತೀರ್ಮಾನಿಸಿದಳು. ಪರಕೀಯರ ಗುಲಾಮಗಿರಿಯಿಂದ ಹೊರಬಂದು ಸ್ವತಂತ್ರವಾಗಿ ಬಾಳಬೇಕು ಎಂದು ನಿರ್ಧರಿಸಿದಳು.
- id: story-n10
  type: prose
  section: story
  text: ಶಿವಾಜಿಗೆ ಪ್ರತಿನಿತ್ಯ ರಾಮಾಯಣ - ಮಹಾಭಾರತ ಮುಂತಾದ ಪುರಾಣ ಪುಣ್ಯಕಥೆಗಳನ್ನು ಹೇಳುತ್ತಿದ್ದಳು. ನ್ಯಾಯ-ನೀತಿ, ಸ್ತ್ರೀಯರಲ್ಲಿ ಗೌರವ, ಕಷ್ಟಸಹಿಷ್ಣುತೆ ಇತ್ಯಾದಿ ಗುಣಗಳನ್ನು ಚಿಕ್ಕಂದಿನಿಂದಲೇ ಮಗನಲ್ಲಿ ಬೆಳೆಸಿದಳು. ಶಿವಾಜಿಗೆ ವೀರಪುರುಷರ ಕಥೆಗಳನ್ನು ಕೇಳುವ, ಸಾಹಸಿ ಕೆಲಸಗಳನ್ನು ಮಾಡುವ ಆದರ್ಶಗಳನ್ನು ಬಾಲ್ಯದಿಂದಲೇ ಬಿತ್ತಿದಳು. ಹೀಗೆ ಜೀಜಾಬಾಯಿ ಮಗನಲ್ಲಿ ಧೈರ್ಯ, ಸ್ವಾಭಿಮಾನ, ಸಾಹಸ, ಸೇವೆ, ತ್ಯಾಗ ಮುಂತಾದ ಮೌಲ್ಯಗಳನ್ನು ಬಾಲ್ಯದಲ್ಲಿಯೇ ತುಂಬಿದಳು. ಅವನನ್ನು ಉತ್ತಮ ದೇಶಭಕ್ತನನ್ನಾಗಿ ಬೆಳೆಸಿದಳು. ಅಖಂಡ ಮರಾಠ ಸಾಮ್ರಾಜ್ಯದ ಉನ್ನತಿಗೆ ದಾರಿದೀಪವಾದಳು.
- id: story-n11
  type: prose
  section: story
  text: ಮುಂದೆ ಶಿವಾಜಿಯು ಪ್ರಬಲ ಮೊಘಲ ಸಾಮ್ರಾಟ ಔರಂಗಜೇಬನ ವಿರುದ್ಧ ಹೋರಾಡಿ ಜಯಗಳಿಸಿದನು. ಜೀಜಾಬಾಯಿ ಮಗನ ವಿಜಯೋತ್ಸವಕ್ಕೆ ಬಹಳ ಸಂತೋಷಪಟ್ಟಳು. ರಾಯಗಡದಲ್ಲಿ ಶಿವಾಜಿಯ ಪಟ್ಟಾಭಿಷೇಕವು ಅತ್ಯಂತ ವೈಭವದಿಂದ ನಡೆಯಿತು. ಸ್ವಾಮಿ ರಾಮದಾಸರು ಬಂದು ತಮ್ಮ ಹಸ್ತದಿಂದ ಶಿವಾಜಿಗೆ ಮುಕುಟ ಧಾರಣೆ ಮಾಡಿದರು. ಜೀಜಾಬಾಯಿ ಶಿವಾಜಿಯು ಬಾಲ್ಯದಲ್ಲಿದ್ದಾಗ ತಾನು ಕಂಡ ಕನಸು ನನಸಾಯಿತು ಎಂದು ಖುಷಿಪಟ್ಟು ಶಿವಾಜಿಯನ್ನು ಆಶೀರ್ವದಿಸಿದಳು. ಅಂದು ಅವಳೂ ಸಹ ರಾಜಮಾತೆ ಎನಿಸಿಕೊಂಡಳು. ಈ ಸಂತೋಷದ ದಿನಗಳನ್ನು ಅನುಭವಿಸಲು ಹೆಚ್ಚು ಅವಕಾಶ ಜೀಜಾಬಾಯಿಗೆ ಲಭಿಸಲಿಲ್ಲ. ಶಿವಾಜಿ ಗದ್ದಿಗೆಯನ್ನೇರಿದ ಕೆಲವೇ ದಿನಗಳಲ್ಲಿ ಹಾಸಿಗೆ ಹಿಡಿದಳು.
- id: story-n12
  type: prose
  section: story
  text: ಸುಮಾರು ಎಂಬತ್ತು ವರ್ಷಗಳ ಕಾಲ ಜೀವಿಸಿದ್ದ ಜೀಜಾಬಾಯಿ ಮರಾಠರ ಅಭ್ಯುದಯ ಕಂಡಳು. ಅನಂತರ ರಾಯಗಡದ ಬಳಿಯಿರುವ ಪಾಚಾಡ ಎಂಬ ಹಳ್ಳಿಯಲ್ಲಿ ಕ್ರಿ.ಶ. 1674ರಲ್ಲಿ ನಿಧನ ಹೊಂದಿದಳು.
- id: story-n13
  type: prose
  section: story
  text: ಮನೆಯೇ ಮೊದಲ ಪಾಠಶಾಲೆ, ಜನನಿ ತಾನೇ ಮೊದಲ ಗುರುವು. ಜನನಿಯಿಂದ ಪಾಠ ಕಲಿತ ಜನರೇ ಧನ್ಯರು.
