story-n1: '"माताजियवरिगॆ नन्न प्रणामगळु" चिगुरु मीसॆय वीरबालक नम्रतॆयिंद नुडिदनु. हुसिनगॆ बीरुत्ता अवन तायि "बा कंद इल्लि कुळितुकॊ". "आगलि तायि" ऎंदु बालक कुळितुकॊंडनु.'
story-n2: '"अम्मा नन्नन्नु करॆसिद कारणवेनु? नन्निंद एनागबेकु केळु तायि?" ऎंदनु बालक. "नानु केळिद्दन्नु कॊडुवॆया मगनॆ?" ऎंदु तायि अभिमानदिंद नुडिदळु.'
story-n3: '"आगलि माताजि... भवानि तायिय मेलॆ आणॆ. नीनु केळिद्दन्नु कॊडुवॆ" ऎंदनु मग.'
story-n4: तायि मनस्सिनल्लॆ योचिसुत्ता "कुमार, आडिद मातिनंतॆ नानु केळिद्दन्नु कॊडबेकु" ऎंदळु.
story-n5: '"केळु तायि अगत्यवागि नीडुत्तेनॆ" ऎंदनु मग संतोषदिंद. "नानु धन्य कंदा, ईग हेळुवॆनु केळु. कॊंडाणदुर्गवु मॊघलर वशदल्लिदॆ. अदन्नु नीनु गॆद्दु ननगॆ बहुमानवागि कॊडबेकु" ऎंदळु हॆम्मॆयिंद मगनन्नु नोडुत्ता तायि.'
story-n6: ई रीति संभाषणॆ नडॆसिद तायिमग यारु गॊत्ते? इवरे भारतद इतिहासदल्लि शाश्वत स्थान पडॆदिरुव वीरमातॆ जीजाबायि हागू अवळ पुत्र मराठ साम्राज्यद उन्नतिगॆ कारणनाद 'छत्रपति शिवाजि'.
story-n7: जीजाबायि क्रि.श. 1594रल्लि लखूजि जाधवराव् अवर मगळागि जनिसिदळु. क्रि.श. 1603रल्लि षहाजियन्नु विवाहवादळु. षहाजियु बिजापुरद आदिल् शाहियल्लि उद्योग माडुत्तिद्दनु. क्रि.श. 1627रल्लि शिवनेरि दुर्गदल्लि ई दंपतिगळ मगनागि शिवाजियु जनिसिदनु. षहाजियु मग शिवाजियन्नु गुरुवाद दादाजिकॊंडदेवनल्लि विद्याभ्यासक्कागि कळुहिसिदनु. गुरु दादाजिकॊंडदेवनु शिवाजिगॆ कत्तिवरसॆ, कुदुरॆ सवारि मुंताद युद्धकलॆगळन्नु कलिसिदनु.
story-n8: षहाजि अनिवार्यवागि तन्निंद दूरवादाग जीजाबायि बहळ नॊंदुकॊंडळु. आदरू ऎदॆगुंददॆ स्वतंत्रवागि बदुकलु प्रारंभिसिदळु.
story-n9: मगनन्नु ओर्व वीरयोधनन्नागि बॆळॆसुव हॊंगनसिनॊंदिगॆ पुणॆगॆ बंदु अवनॊंदिगॆ नॆलॆसिदळु. जीजाबायि चाणाक्ष हॆण्णुमगळु. केवल ओर्व सामान्य महिळॆयंतॆ बदुकिन आगुहोगुगळन्नु नॆनॆदु दुःखिसुव हॆण्णागिरलिल्ल. अखंड भारतदल्लि मॊघलर आळ्विकॆयन्नु कॊनॆगॊळिसलु पणतॊट्टळु. भारतदाद्यंत मराठ साम्राज्यद विजय पताकॆयन्नु हारिसबेकु ऎंदु तीर्मानिसिदळु. परकीयर गुलामगिरियिंद हॊरबंदु स्वतंत्रवागि बाळबेकु ऎंदु निर्धरिसिदळु.
story-n10: शिवाजिगॆ प्रतिनित्य रामायण - महाभारत मुंताद पुराण पुण्यकथॆगळन्नु हेळुत्तिद्दळु. न्याय-नीति, स्त्रीयरल्लि गौरव, कष्टसहिष्णुतॆ इत्यादि गुणगळन्नु चिक्कंदिनिंदले मगनल्लि बॆळॆसिदळु. शिवाजिगॆ वीरपुरुषर कथॆगळन्नु केळुव, साहसि कॆलसगळन्नु माडुव आदर्शगळन्नु बाल्यदिंदले बित्तिदळु. हीगॆ जीजाबायि मगनल्लि धैर्य, स्वाभिमान, साहस, सेवॆ, त्याग मुंताद मौल्यगळन्नु बाल्यदल्लिये तुंबिदळु. अवनन्नु उत्तम देशभक्तनन्नागि बॆळॆसिदळु. अखंड मराठ साम्राज्यद उन्नतिगॆ दारिदीपवादळु.
story-n11: मुंदॆ शिवाजियु प्रबल मॊघल साम्राट औरंगजेबन विरुद्ध होराडि जयगळिसिदनु. जीजाबायि मगन विजयोत्सवक्कॆ बहळ संतोषपट्टळु. रायगडदल्लि शिवाजिय पट्टाभिषेकवु अत्यंत वैभवदिंद नडॆयितु. स्वामि रामदासरु बंदु तम्म हस्तदिंद शिवाजिगॆ मुकुट धारणॆ माडिदरु. जीजाबायि शिवाजियु बाल्यदल्लिद्दाग तानु कंड कनसु ननसायितु ऎंदु खुषिपट्टु शिवाजियन्नु आशीर्वदिसिदळु. अंदु अवळू सह राजमातॆ ऎनिसिकॊंडळु. ई संतोषद दिनगळन्नु अनुभविसलु हॆच्चु अवकाश जीजाबायिगॆ लभिसलिल्ल. शिवाजि गद्दिगॆयन्नेरिद कॆलवे दिनगळल्लि हासिगॆ हिडिदळु.
story-n12: सुमारु ऎंबत्तु वर्षगळ काल जीविसिद्द जीजाबायि मराठर अभ्युदय कंडळु. अनंतर रायगडद बळियिरुव पाचाड ऎंब हळ्ळियल्लि क्रि.श. 1674रल्लि निधन हॊंदिदळु.
story-n13: मनॆये मॊदल पाठशालॆ, जननि ताने मॊदल गुरुवु. जननियिंद पाठ कलित जनरे धन्यरु.
