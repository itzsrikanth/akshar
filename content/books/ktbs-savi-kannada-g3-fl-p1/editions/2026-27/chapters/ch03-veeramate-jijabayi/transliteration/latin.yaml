labels:
  title: Veeramate Jijabayyi
  intro: Kalikege Daari
  story: Kathe
  vocab: Padagala Artha
  notes: Tippani
  exercise-A: Abhyaasa A — Ondondu vaakyadalli uttara bareyiri.
  exercise-B: Abhyaasa Aa — Kottiruva padagalalli sariyaada pada aarisi bitti sthaladalli bareyiri.
  exercise-C: Abhyaasa I — Kottiruva pada gamanisi viruddhaarthaka pada bareyiri.
  exercise-D: Abhyaasa Ee — Maadariyante kottiruva pada gamanisi eradereadu samaanaarthaka padagalannu bareyiri.
  exercise-E: Abhyaasa U — Kottiruva pada balasi swanta vaakya bareyiri.
  exercise-F: Abhyaasa Oo — Kottiruva maatannu yaaru? Yaarige helidaru?
  exercise-G: Abhyaasa Ru — Padagalannu sariyaagi joodisi vaakya rachisi bareyiri.
  exercise-H: Bhaashaa Chatuvatike A — Maadariyalli soochisiruvante sookta pada rachisi bareyiri.
  exercise-I: Bhaashaa Chatuvatike Aa — Kottiruva padagalannu gamanisi oodi.
  exercise-J: Bhaashaa Chatuvatike I — Aavaranadalliruva padagalannu gamanisi. Avugala sahaayadinda gaadegalannu poorna maadi.
  exercise-K: Balake Chatuvatike
  competency: Jaana Mari — Saamarthya
intro-1: Shikshakara sahaayadinda ee veeramaateyara bagge tiliyiri.
intro-2: Chennabhairaadevi
intro-3: Belavadi mallamma
intro-4: Jhaansi raani laksheebaayi
intro-5: Kittooru raani chennamma
intro-6: Raani abbakka
intro-7: Keladi chennamma
story-n1: '"Maataajiyavarige nanna pranaamagalu" chiguru meeseya veerabaalaka namrateyinda nudidanu. husinage beeruttaa avana taayi "baa kanda illi kulituko". "aagali taayi" endu baalaka kulitukondanu.'
story-n2: '"Ammaa nannannu karesida kaaranavenu? nanninda enaagabeku kelu taayi?" endanu baalaka. "naanu keliddannu koduveyaa magane?" endu taayi abhimaanadinda nudidalu.'
story-n3: '"Aagali maataaji... bhavaani taayiya mele aane. neenu keliddannu koduve" endanu maga.'
story-n4: Taayi manassinalle yochisuttaa "kumaara, aadida maatinante naanu keliddannu kodabeku" endalu.
story-n5: '"Kelu taayi agatyavaagi needuttene" endanu maga santoshadinda. "naanu dhanya kandaa, eega heluvenu kelu. kondaanadurgavu moghalara vashadallide. adannu neenu geddu nanage bahumaanavaagi kodabeku" endalu hemmeyinda maganannu noduttaa taayi.'
story-n6: Ee reeti sanbhaashane nadesida taayimaga yaaru gotte? ivare bhaaratada itihaasadalli shaashvata sthaana padediruva veeramaate jeejaabaayi haagoo avala putra maraatha saamraajyada unnatige kaarananaada 'chhatrapati shivaaji'.
story-n7: Jeejaabaayi kri.sha. 1594ralli lakhooji jaadhavaraav avara magalaagi janisidalu. kri.sha. 1603ralli shahaajiyannu vivaahavaadalu. shahaajiyu bijaapurada aadil shaahiyalli udyoga maaduttiddanu. kri.sha. 1627ralli shivaneri durgadalli ee danpatigala maganaagi shivaajiyu janisidanu. shahaajiyu maga shivaajiyannu guruvaada daadaajikondadevanalli vidyaabhyaasakkaagi kaluhisidanu. guru daadaajikondadevanu shivaajige kattivarase, kudure savaari muntaada yuddhakalegalannu kalisidanu.
story-n8: Shahaaji anivaaryavaagi tanninda dooravaadaaga jeejaabaayi bahala nondukondalu. aadaroo edegundade svatantravaagi badukalu praaranbhisidalu.
story-n9: Maganannu orva veerayodhanannaagi belesuva honganasinondige punege bandu avanondige nelesidalu. jeejaabaayi chaanaaksha hennumagalu. kevala orva saamaanya mahileyante badukina aaguhogugalannu nenedu duhkhisuva hennaagiralilla. akhanda bhaaratadalli moghalara aalvikeyannu konegolisalu panatottalu. bhaaratadaadyanta maraatha saamraajyada vijaya pataakeyannu haarisabeku endu teermaanisidalu. parakeeyara gulaamagiriyinda horabandu svatantravaagi baalabeku endu nirdharisidalu.
story-n10: Shivaajige pratinitya raamaayana - mahaabhaarata muntaada puraana punyakathegalannu heluttiddalu. nyaaya-neeti, streeyaralli gaurava, kashtasahishnute ityaadi gunagalannu chikkandinindale maganalli belesidalu. shivaajige veerapurushara kathegalannu keluva, saahasi kelasagalannu maaduva aadarshagalannu baalyadindale bittidalu. heege jeejaabaayi maganalli dhairya, svaabhimaana, saahasa, seve, tyaaga muntaada maulyagalannu baalyadalliye tunbidalu. avanannu uttama deshabhaktanannaagi belesidalu. akhanda maraatha saamraajyada unnatige daarideepavaadalu.
story-n11: Munde shivaajiyu prabala moghala saamraata aurangajebana viruddha horaadi jayagalisidanu. jeejaabaayi magana vijayotsavakke bahala santoshapattalu. raayagadadalli shivaajiya pattaabhishekavu atyanta vaibhavadinda nadeyitu. svaami raamadaasaru bandu tamma hastadinda shivaajige mukuta dhaarane maadidaru. jeejaabaayi shivaajiyu baalyadalliddaaga taanu kanda kanasu nanasaayitu endu khushipattu shivaajiyannu aasheervadisidalu. andu avaloo saha raajamaate enisikondalu. ee santoshada dinagalannu anubhavisalu hechchu avakaasha jeejaabaayige labhisalilla. shivaaji gaddigeyannerida kelave dinagalalli haasige hididalu.
story-n12: Sumaaru enbattu varshagala kaala jeevisidda jeejaabaayi maraathara abhyudaya kandalu. anantara raayagadada baliyiruva paachaada enba halliyalli kri.sha. 1674ralli nidhana hondidalu.
story-n13: Maneye modala paathashaale, janani taane modala guruvu. jananiyinda paatha kalita janare dhanyaru.
