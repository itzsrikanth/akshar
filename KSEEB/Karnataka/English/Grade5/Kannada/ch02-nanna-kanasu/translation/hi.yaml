# ── ಸಾಮರ್ಥ್ಯ
competency: सही उच्चारण के साथ बोलना। सही स्वराघात और अभिनय के माध्यम से जानी-पहचानी सरल कहानियाँ सुनाना।

# ── ಪ್ರವೇಶ
intro-1: "हम सपने देखते हैं, है ना?"
intro-2: अगर हाँ, तो अपना देखा हुआ कोई एक सपना याद करो।
intro-3: यहाँ एक विद्यार्थी का देखा हुआ सपना है।
intro-4: जानने की उत्सुकता है कि वह क्या हो सकता है?
intro-5: अगर हाँ, तो जानकर अपने दोस्तों के साथ साझा करो।

# ── ಕಥೆ
story-n1: >-
  एक घना जंगल। विशाल क्षेत्र में उगे ऊँचे-ऊँचे पेड़-पौधे, पेड़ों के सहारे आकाश तक फैलती बेलें, हरियाली
  के बीच रंग-बिरंगी छटा बिखेरते फूल और फल, भौंरों की गुनगुनाहट, पक्षियों की चहचहाहट, बीच-बीच में तैरकर
  आती कोयल की आवाज़, कल-कल बहती झरने की ध्वनि। ऐसा सुंदर वातावरण पशु-पक्षियों के लिए शांति भरा आश्रय
  स्थान था।
story-n2: >-
  एक सुबह। जंगल की चहचहाहट के बीच पैरों की आहट ने जानवरों के कान खड़े कर दिए। कुछ समझ पाते, इससे पहले
  पेड़ की जड़ पर पड़ी चोट से पक्षी चीखते हुए उड़ गए। पास खड़े जानवर डर-मिश्रित जिज्ञासा से "यह कौन है?"
  कहकर मुड़कर देखने लगे। मनुष्य को देखकर वे गुस्से में आ गए और बहस के लिए आगे बढ़े।
story-d1: >-
  अरे मनुष्य! तुझे अभी तक अक्ल नहीं आई? अति वृष्टि और अनावृष्टि से मौतें और तकलीफ़ें भी हो चुकी हैं।
  फिर भी तू जंगल को नष्ट करने पर तुला है, छी, मूर्ख!
story-d2: >-
  डरपोक जानवर! तू मनुष्य को मूर्ख कहता है? हमारी बुद्धिमानी के बारे में तुझे क्या पता? (कुल्हाड़ी को
  कंधे पर रखकर घमंड से कहा)
story-d3: बता तो अपनी होशियारी... हम भी थोड़ा जान लें।
story-d4: >-
  आकाश में उड़ने वाला हवाई जहाज़, पानी पर चलने वाली नाव और जहाज़ हमने बनाए हैं। क्या यह हमारी बुद्धिमानी
  के लिए काफ़ी नहीं है?
story-d5: >-
  (गर्दन उठाकर ताना मारते हुए) पक्षी को देखकर हवाई जहाज़, जलचरों को देखकर नाव और जहाज़ बनाए हैं। इसमें
  तुम्हारा अपना क्या है?
story-d6: >-
  (लोमड़ी की बात से हतोत्साहित मनुष्य, बिना जताए) सुंदर दिखने के लिए हमने कपड़े और वस्त्र बनाए हैं। क्या
  तुम्हें यह नहीं पता?
story-d7: >-
  याद करो, पहले तुम हमारी ही खाल पहना करते थे। तुम्हारे कपड़ों में क्या ख़ास है? जानवरों, पक्षियों,
  कीड़ों के शरीर के रंगों पर मोहित होकर हमारी ही तरह सुंदर दिखने के लिए तुमने कपड़े बनाए हैं। स्वाभाविक
  सुंदरता हमारी है, समझे?
story-d8: >-
  (डाल पकड़कर झूलते हुए) हिरण जैसी आँखें, मोर जैसी चाल, कोयल जैसी आवाज़ होनी चाहिए — ऐसा कहने वाले तुम,
  बताओ तुम सुंदर हो या हम सुंदर हैं?
story-d9: >-
  (गुर्राते हुए) ज़रूरी चीज़ें बनाने वाले तुम्हारे कारखाने धुआँ और गंदगी बाहर छोड़ते हैं। इससे हवा, मिट्टी,
  पानी दूषित होते हैं। यह तुम्हें क्यों नहीं समझ आता?
story-d10: >-
  (जानवरों की एकता और बुद्धिमानी देखकर मनुष्य को अपनी हार का एहसास हो गया, फिर भी बिना जताए) खुले में
  रहने वाले तुम्हें क्या पता हमने कैसे सुंदर घर बनाए हैं? आकर देखो, तुम्हें हमारी बुद्धिमानी समझ आएगी।
story-d11: >-
  बया पक्षी का घोंसला, मधुमक्खी का छत्ता, दीमकों द्वारा बनाई गई बांबी — कितने सुंदर और सुरक्षित हैं!
  कचरे से बनाई हमारी उपलब्धि के आगे प्रकृति को नष्ट करने वाली तुम्हारी उपलब्धि शून्य है। (जानवरों और
  पक्षियों की बुद्धिमानी देखकर मनुष्य चकित रह गया)
story-d12: (आश्चर्य से) तुम्हें यह सब कैसे पता चला?
story-d13: >-
  (लहराते हुए) हममें से कुछ हर साल कुछ महीनों के लिए देश-विदेश में प्रवास करते हैं। वहाँ दोस्तों के साथ
  चर्चा करते हैं। क्या तुम्हें यह नहीं पता?
story-d14: >-
  (धैर्यपूर्वक सुन रहा पेड़) अरे मनुष्य, तूने जो भी किया है या आगे करेगा, वह इस प्रकृति के प्रभाव से
  जुड़ा है — पहले यह समझ ले कि प्रकृति के अंग जंगल के विनाश से तेरी ही आने वाली पीढ़ियों का विनाश होगा।
  जंगल की रक्षा के लिए आगे आ, सालुमरदा तिम्मक्का से सीख ले। अपने जीवन के साथ-साथ प्रकृति को बचाने के लिए
  अपनी बुद्धिमानी दिखा। जाग, सचेत हो, समय बीतने से पहले उठ खड़ा हो।
story-d15: >-
  राजू, उठ जा, स्कूल के लिए देर हो जाएगी। ('उठो, जागो' की पुकार सुनकर राजू जाग गया, बिस्तर पर उठकर बैठ
  गया)
story-d16: >-
  अम्मा। अम्मा। मुझे सपना आया था। कैसा सपना पता है? जंगल में सारे जानवर मिलकर पेड़ काटने गए एक आदमी का
  मन बदल दिया। वहाँ कितने सारे जानवर थे, पता है?
story-d17: >-
  अच्छा, सच में यह बहुत अच्छा सपना है! राजू, तूने कल रात 'जंगल की कहानी' पढ़कर सोया था ना, इसीलिए ऐसा
  सपना आया। हमें जानवरों से बहुत कुछ सीखना है। देख, वह मुर्गा बांग देकर सबको जगा रहा है। जल्दी उठ जा।

