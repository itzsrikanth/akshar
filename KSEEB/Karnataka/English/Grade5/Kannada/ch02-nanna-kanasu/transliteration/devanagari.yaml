# ── ಸಾಮರ್ಥ್ಯ
competency: सरियाद उच्चारदोंदिगे मातनाडुवुदु. सरियाद स्वरभार मत्तु अभिनयद मूलक गोत्तिरुव सरळ कथेगळन्नु हेळुवुदु.

# ── ಪ್ರವೇಶ
intro-1: नावु कनसन्नु काणुत्तेवे अल्लवे?
intro-2: हागिद्दरे नीनु कंड कनसोंदन्नु नेनपु माडिको.
intro-3: इल्लि विद्यार्थियोब्ब कंड कनसिदे.
intro-4: अदु एनिरबहुदु एंब कुतूहलवे?
intro-5: हागिद्दरे अदन्नु तिळिदु गेळेयरोंदिगे हंचिको.

# ── ಕಥೆ
story-n1: >-
  ओंदु दट्टवाद काडु. विशाल प्रदेशदल्लि बेळेदिरुव एत्तरवाद मर गिडगळु, मरगळन्नु बळसि मुगिलेत्तरक्के
  हब्बुत्तिरुव बळ्ळिगळु, हसिरिन नडुवे बण्णद चित्तार मूडिसिरुव हू, हण्णुगळु, दुंबिय झेंकार, पक्षिगळ
  कलरव, नडुवे तेलि बरुत्तिरुव कोगिलेय ध्वनि, जुळु जुळु हरियुत्तिरुव झरिय निनाद. इंतह सुंदर परिसरवु
  प्राणि पक्षिगळिगे नेम्मदिय आश्रय ताणवागित्तु.
story-n2: >-
  ओंदु मुंजाने. काडिन कलरवद नडुवे हेज्जेय सप्पळवु प्राणिगळ किवियन्नु निमिरुवंते माडितु. एनेंदु
  नोडुवष्टरल्लि मरद बुडक्के बिद्द होडेतदिंद पक्षिगळु चीरुत्ता हारिदवु. सनिहदल्लिद्द प्राणिगळु
  भयमिश्रित कुतूहलदिंद "यारदु?" एंदु तिरुगि नोडिदवु. मानवनन्नु कंडु सिट्टुगोंडु वादक्के मुंदादवु.
story-d1: >-
  ए मानव. निनगिन्नू बुद्दि बरलिल्लवे? अतिवृष्टि हागू अनावृष्टि यिंद सावु नोवुगळू संभविसिवे. आदरू
  काडिन नाशक्के मुंदागिरुवेयल्ला, छी अविवेकि!
story-d2: >-
  अंजुबुरुक प्राणिये! नीनु मानवनन्नु अविवेकि एन्नुवेया? नम्म बुद्दिवंतिके निनगेनु गोत्तु? (कोडलियन्नु
  हेगल मेलिट्टु गत्तिनिंद हेळिदनु)
story-d3: हेळप्प निम्म जाणतनवन्नु... नावू स्वल्प तिळियुत्तेवे.
story-d4: आकाशदल्लि हारुव विमान, नीरिन मेले चलिसुव दोणि, हडगुगळन्नु सृष्टिसिद्देवे. इदिष्टु साकल्लवे नम्म बुद्धिवंतिकेगे?
story-d5: >-
  (कत्तन्नु मेलेत्ति मूदलिसुत्ता) पक्षियन्नु नोडि विमानवन्नु, जलचरगळन्नु नोडि दोणि, हडगुगळन्नु
  निर्मिसिरुवे. इदरल्लि निम्म स्वंतिके एनु?
story-d6: >-
  (नरिय मातिगे मंकाद मानव, तोर्पडिसिकोळ्ळदे) सुंदरवागि काणलु उडुगे तोडुगेगळन्नु सृष्टिसिद्देवे.
  निमगिदु तिळियदे?
story-d7: >-
  मोदलिगे नम्म चर्मवन्ने धरिसुत्तिद्दुदन्नु नेनपिसिको. निम्म बट्टेयल्लेनु विशेष? प्राणि, पक्षि,
  कीटगळ मैबण्णक्के मनसोतु नम्मंते सुंदरवागि काणलु बट्टेगळन्नु सिद्धपडिसिरुवे. सहज सौंदर्य नम्मदु,
  तिळियिते?
story-d8: >-
  (कोंबेयन्नु हिडिदु जोताडुत्त) जिंकेय कण्णिनंतह कण्णु, नविलिन नडिगेयंतह नडिगे, कोगिलेय दनियंतह दनि
  इरबेकु एंदेल्ल हेळुव नीवु सुंदरवो अथवा नावु सुंदरवो?
story-d9: >-
  (गुटुरु हाकुत्ता) अगत्य वस्तुगळन्नु उत्पादिसुव निम्म कार्खानेगळु होगे मत्तु कल्मशवन्नु होर
  हाकुत्तवे. इदरिंद गाळि, मण्णु, नीरु मलिनवागुत्तवे. इदेके निनगे तिळियुत्तिल्ल?
story-d10: >-
  (प्राणिगळ ओग्गट्टु मत्तु बुद्दिवंतिकेयन्नु कंड मानवनिगे तानु सोलुत्तिरुवुदु मनवरिकेयायितु. आदरू
  तोर्पडिसिकोळ्ळदे) बयलिनल्लि वास माडुव निमगेनु गोत्तु नावु कट्टिरुव सुंदरवाद मनेगळ बग्गे बंदु
  नोडि. नम्म बुद्धिवंतिके तिळियुत्तदे.
story-d11: >-
  गीजगन गूडु, जेनुगूडु, गेद्दलुहुळु कट्टुव हुत्तगळु एष्टु सुंदर, सुरक्षित! कसदिंद माडिरुव नम्म
  साधनेय मुंदे प्रकृतिय नाशद निम्म साधने शून्य. (प्राणि पक्षिगळ बुद्दिवंतिकेगे मानव बेरगाद)
story-d12: (आश्चर्यदिंद) निमगे इदेल्ल हेगे तिळियितु?
story-d13: >-
  (बळुकुत्ता) नम्मल्लि केलवरु वर्षदल्लि केलवु तिंगळु देश विदेशगळिगे वलसे होगुत्तेवे. अल्लि
  गेळेयरोंदिगे चर्चिसुत्तेवे. निनगिदु तिळियदे?
story-d14: >-
  (सहनेयिंद आलिसुत्तिद्द मरवु) ए मानव, नीनु एने माडिद्दरू अथवा मुंदे माडिदरू अदु ई प्रकृतिय
  प्रभावदिंद, प्रकृतिय अंगवाद काडिन नाशदिंद निन्न संततिय नाशवेंबुदन्नु मोदलु अरितुको. काडिन
  संरक्षणेगे मुंदागु, सालुमरद तिम्मक्कनन्नु नोडि कलि. नीनु बदुकुव जोतेगे प्रकृतिय उळिविगे निन्न
  बुद्दिवंतिकेयन्नु तोरिसु. एळु एच्चरगोळ्ळु, समय मीरुव मुन्न एद्देळु.
story-d15: >-
  राजु, एळो, शालेगे तडवागुत्ते. (एळु, एद्देळु एंब कूगिगे राजु एच्चरगोंड, हासिगेय मेले कुळित)
story-d16: >-
  अम्म. अम्मा. ननगे कनसु बिद्दित्तु. एंथा कनसु गोत्ता? काडिनल्लि प्राणिगळेल्ल सेरि मर कडियलु होद
  मनुष्यन मनःपरिवर्तने माडिदवु. अल्लि एष्टेल्ल प्राणिगळिद्दवु गोत्ता?
story-d17: >-
  हौदा, निजवागियू इदु ओळ्ळेय कनसे! राजु, निन्ने रात्रि 'काडिन कथे' ओदि मलगिदेयल्ला, अदक्के ई रीति
  कनसु बिद्दिदे. नावु प्राणिगळिंद कलियोदु बहळष्टिदे. नोडु, आ कोळि कूगि एल्लरन्नू एच्चरिसुत्तिदे.
  एळु बेग.

