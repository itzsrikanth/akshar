# ── ಸಾಮರ್ಥ್ಯ
competency: To write down unfamiliar words through dictation.

# ── ಪ್ರವೇಶ
intro-1: You may have seen father, mother, grandfather, grandmother, and others at home cuddling children with loving words.
intro-2: Recall that you too may have been cuddled the same way.
intro-3: Here there is a scene of being cuddled with loving words.
intro-4: Match it with your own experience and see.

# ── ಪದ್ಯ: ಕಂದ
# This is a traditional North-Karnataka-dialect folk lullaby (ಜನಪದ), so the
# translation below favors the sense of each verse-half over a literal
# word-for-word rendering. One word in the last line, "ಚಂಜೀಯ", is read as a
# dialectal form of "ಸಂಜೆಯ" (of the evening) — flagged here for a native
# speaker to double-check rather than treated as certain.
poem-s1l1: Why would a house with a little one need a hand-fan, with the dear child moving in and out —
poem-s1l2: as it plays, the breeze stirs on its own, like a fan.

poem-s2l1: Come, play, my child — I will wash your little feet with clear coconut water,
poem-s2l2: and with the same, I will wash your golden face too.

poem-s3l1: The crying child's lips are like a coral sprout, its tender brows like neem leaves,
poem-s3l2: and its glance shines like the blade in Lord Shiva's hand.

poem-s4l1: What can I say of the child's fussing today — while I was pouring out a pot of milk,
poem-s4l2: it said, "bring the evening moon and set it here!"

# ── ಪದಗಳ ಅರ್ಥ
vocab-kudi: sprout / shoot
vocab-kudi-def: sprout / young shoot
vocab-alagu: blade
vocab-alagu-def: edge of a knife/sword
vocab-esalu: petal
vocab-esalu-def: petal of a flower
vocab-kirikiri: fussing / irritation
vocab-kirikiri-def: trouble / nuisance
vocab-bangara: gold
vocab-bangara-def: gold
vocab-chanjeeya: of the evening (dialectal)
vocab-chanjeeya-def: of the evening

# ── ಟಿಪ್ಪಣಿ
note-beesanige: hand-fan
note-beesanige-def: An instrument used to fan oneself with air.
note-havala: coral
note-havala-def: >-
  A type of red-colored gem/bead; one of the nine gems (navaratna) — diamond,
  ruby, emerald, topaz, sapphire, hessonite (gomedhika), cat's eye (vaidurya),
  pearl, and coral.

# ── ಅಭ್ಯಾಸ ಅ)
ex-a-q1: What does the mother say she will wash the child's soles with?
ex-a-q1-ans: She says she will wash the child's soles with clear coconut water.
ex-a-q2: What is the crying child's lip compared to?
ex-a-q2-ans: The crying child's lip is compared to a coral sprout.
ex-a-q3: What is the crying child's glance like?
ex-a-q3-ans: The crying child's glance shines like the blade in Shiva's hand.
ex-a-q4: What does the child ask to be brought and set before it?
ex-a-q4-ans: The child asks for the evening moon to be brought and set before it.

# ── ಅಭ್ಯಾಸ ಆ)
ex-b-q1: The crying child's lips are like a coral ________
ex-b-q1-ans: sprout
ex-b-q2: "Come play, my child — I will ________ your little feet,"
ex-b-q2-ans: wash
ex-b-q3: "________, does a house with a little one need a hand-fan?"
ex-b-q3-ans: Why
ex-b-q4: What can I ________ of the child's fussing today —
ex-b-q4-ans: say

# ── ಅಭ್ಯಾಸ ಇ)
ex-c-q1: A house with a baby doesn't need a hand-fan. Why?
ex-c-q1-ans: It's enough that the baby plays in and out — that itself creates a breeze, as if a fan were blowing. So a house with a baby has no need for a hand-fan.
ex-c-q2: How does the mother take care of the child who comes back from playing?
ex-c-q2-ans: The mother washes the returning child's feet with clear coconut water. With the same water, she also washes his golden-like face.

# ── ಭಾಷಾಭ್ಯಾಸ ಆ)
ex-d-q1: Why might the baby be laughing?

# ── ಭಾಷಾ ಚಟುವಟಿಕೆ ಅ)
ex-e-q1: gold
ex-e-q1-ans: chinna, kanaka (both mean gold)
ex-e-q2: baby

# ── ಭಾಷಾ ಚಟುವಟಿಕೆ ಆ)
ex-f-q1: Why would a house with a little one need a hand-fan?
ex-f-q1-ans: to the house — standard form of the dialect ಮನಿಗೆ
ex-f-q2: I will wash your golden face
ex-f-q3: the breeze stirs like a fan
ex-f-q4: it said to bring and set up the evening moon
ex-f-q4-ans: of the evening — standard form of the dialect ಚಂಜೀಯ

# ── ಭಾಷಾ ಚಟುವಟಿಕೆ ಇ)
ex-g-q0: shone (dialect form)
ex-g-q0-ans: as if it shone
ex-g-q1: sprout (dialect form)
ex-g-q1-ans: like a sprout
ex-g-q2: petal (dialect form)
ex-g-q2-ans: like a petal
ex-g-q3: soaked (dialect form)
ex-g-q3-ans: as if it soaked
ex-g-q4: came (dialect form)
ex-g-q4-ans: as if it came
