# ── ಸಾಮರ್ಥ್ಯ
competency: अपरिचित शब्दों को श्रुतलेख (डिक्टेशन) के माध्यम से लिखना।

# ── ಪ್ರವೇಶ
intro-1: तुमने घर में पापा, अम्मा, दादा, दादी और अन्य लोगों को बच्चों को प्यार भरे शब्दों से दुलारते हुए देखा होगा।
intro-2: याद करो कि तुम्हें भी उसी तरह दुलारा गया होगा।
intro-3: यहाँ प्यार भरे शब्दों से दुलारे जाने का एक दृश्य है।
intro-4: उसे अपने अनुभव से मिलाकर देखो।

# ── ಪದ್ಯ: ಕಂದ
# यह उत्तर-कर्नाटक बोली की एक पारंपरिक जनपद लोरी (ಜನಪದ) है, इसलिए यह अनुवाद शब्दशः के बजाय हर पंक्ति के
# भाव पर आधारित है, ठीक वैसे ही जैसे इसी चरण के अंग्रेज़ी अनुवाद (translation/en.yaml) में किया गया है।
poem-s1l1: "जिस घर में बच्चा है, उसे पंखे की क्या ज़रूरत, प्यारा बच्चा भीतर-बाहर आता-जाता है —"
poem-s1l2: जब वह खेलता है, हवा अपने आप पंखे जैसी बहने लगती है।

poem-s2l1: "आ जा, खेल ले, मेरे बच्चे — मैं तेरे नन्हे पैर नारियल के निर्मल पानी से धोऊँगी,"
poem-s2l2: और उसी पानी से तेरा सुनहरा चेहरा भी धोऊँगी।

poem-s3l1: "रोते हुए बच्चे के होंठ मूँगे की कोंपल जैसे हैं, उसकी कोमल भौहें नीम की पत्तियों जैसी हैं,"
poem-s3l2: और उसकी नज़र भगवान शिव के हाथ की तलवार जैसी चमकती है।

poem-s4l1: "आज बच्चे की ज़िद के बारे में क्या कहूँ — जब मैं एक घड़ा दूध उड़ेल रही थी,"
poem-s4l2: "तो उसने कहा, 'शाम का चाँद लाकर यहाँ रख दो!'"

