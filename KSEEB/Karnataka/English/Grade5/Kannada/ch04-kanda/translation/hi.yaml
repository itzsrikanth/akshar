# ── ಟಿಪ್ಪಣಿ
note-beesanige: हाथ का पंखा
note-beesanige-def: हवा करने के लिए इस्तेमाल किया जाने वाला यंत्र।
note-havala: मूँगा
note-havala-def: >-
  एक प्रकार का लाल रंग का रत्न/मणि; नवरत्नों में से एक — हीरा, माणिक्य, पन्ना (मरकत), पुखराज, नीलम,
  गोमेद, वैडूर्य (लहसुनिया), मोती और मूँगा।

# ── ಅಭ್ಯಾಸ ಅ)
ex-a-q1: माँ कहती है कि वह बच्चे के तलवे किससे धोएगी?
ex-a-q1-ans: वह कहती है कि वह बच्चे के तलवे नारियल के निर्मल पानी से धोएगी।
ex-a-q2: रोते हुए बच्चे के होंठ की तुलना किससे की गई है?
ex-a-q2-ans: रोते हुए बच्चे के होंठ की तुलना मूँगे की कोंपल से की गई है।
ex-a-q3: रोते हुए बच्चे की नज़र कैसी है?
ex-a-q3-ans: रोते हुए बच्चे की नज़र शिव के हाथ की तलवार जैसी चमकती है।
ex-a-q4: बच्चा क्या लाकर सामने रखने के लिए कहता है?
ex-a-q4-ans: बच्चा शाम का चाँद लाकर सामने रखने के लिए कहता है।

# ── ಅಭ್ಯಾಸ ಆ)
ex-b-q1: रोते हुए बच्चे के होंठ मूँगे की ________ जैसे हैं
ex-b-q1-ans: कोंपल
ex-b-q2: आ खेल मेरे बच्चे — मैं तेरे नन्हे पैर ________
ex-b-q2-ans: धोऊँगी
ex-b-q3: "________, बच्चे वाले घर को पंखे की ज़रूरत है क्या?"
ex-b-q3-ans: क्यों
ex-b-q4: बच्चे की ज़िद के बारे में आज मैं क्या ________
ex-b-q4-ans: कहूँ

# ── ಅಭ್ಯಾಸ ಇ)
ex-c-q1: बच्चे वाले घर को पंखे की ज़रूरत नहीं होती। क्यों?
ex-c-q1-ans: >-
  बच्चे का भीतर-बाहर खेलना ही काफ़ी है, उसी से हवा ऐसे बहती है जैसे पंखा चल रहा हो। इसलिए बच्चे वाले
  घर को पंखे की ज़रूरत नहीं होती।
ex-c-q2: खेलकर लौटे बच्चे की माँ किस तरह देखभाल करती है?
ex-c-q2-ans: >-
  माँ लौटे हुए बच्चे के पैर नारियल के निर्मल पानी से धोती है। उसी पानी से वह उसका सुनहरे जैसा चेहरा
  भी धोती है।

