# ── ಟಿಪ್ಪಣಿ
note-beesanige: बीसणिगे
note-beesanige-def: गाळि बीसिकोळ्ळलु बळसुव साधन.
note-havala: हवळ
note-havala-def: ओंदु जातिय केंपु बण्णद मणि, नवरत्नगळल्लि ओंदु. (वज्र, माणिक्य, मरकत, पुष्यराग, नील, गोमेधिक, वैडूर्य, मुत्तु, हवळ)

# ── ಅಭ್ಯಾಸ ಅ)
ex-a-q1: तायियु कंदन अंगालन्नु यावुदरिंद तोळेयुवुदागि हेळुत्ताळे?
ex-a-q1-ans: कंदन अंगालन्नु तेंगिनकायि तिळिनीरिनिंद तोळेयुवुदागि हेळुत्ताळे.
ex-a-q2: अळुव कंदन तुटियन्नु यावुदक्के होलिसलागिदे?
ex-a-q2-ans: अळुव कंदन तुटियन्नु हवळद कुडिगे होलिसलागिदे.
ex-a-q3: अळुव कंदन कणोट हेगिरुत्तदे?
ex-a-q3-ans: अळुव कंदन कणोट शिवन कैयलगिनंते होळेयुत्तदे.
ex-a-q4: मगु एनन्नु तंदु निल्लिसेंदु केळुत्तदे?
ex-a-q4-ans: मगु संजेय चंद्रमनन्नु तंदु निल्लिसेंदु केळुत्तदे.

# ── ಅಭ್ಯಾಸ ಆ)
ex-b-q1: अळुव कंदन तुटियु हवळद ________
ex-b-q1-ans: कुडिहंग
ex-b-q2: आडि बा नन कंद अंगाल ________
ex-b-q2-ans: तोळेदेन
ex-b-q3: कूसु इद्द मनिगे बीसणिगे ________
ex-b-q3-ans: यातक
ex-b-q4: कंदान किरिकिरि इंदेनु ________
ex-b-q4-ans: हेळलि

# ── ಅಭ್ಯಾಸ ಇ)
ex-c-q1: कूसु इद्द मनेगे बीसणिगे बेड. एके?
ex-c-q1-ans: कूसु ओळगे होरगे आडुत्तिद्दरे साकु, अदरिंदले गाळि बीसिदंते आगुत्तदे. आद्दरिंद कूसु इद्द मनेगे बीसणिगेय अगत्यविल्ल.
ex-c-q2: आडि बरुव कंदनन्नु तायि हेगे उपचरिसुवळु?
ex-c-q2-ans: आडि बरुव कंदन अंगालन्नु तायि तेंगिनकायि तिळिनीरिनिंद तोळेयुत्ताळे. अदे नीरिनिंद अवन बंगारदंतह मुखवन्नू तोळेयुत्ताळे.

