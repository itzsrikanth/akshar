# ── ಸಾಮರ್ಥ್ಯ
competency: उक्तलेखनद मूलक अपरिचित पदगळन्नु बरेयुवुदु.

# ── ಪ್ರವೇಶ
intro-1: मनेयल्लि अप्प, अम्म, अज्ज, अज्जि मत्तितरर मक्कळन्नु प्रीति मातुगळिंद मुद्दिसुवुदन्नु नीनु नोडिरबहुदु.
intro-2: अदे रीति निन्नन्नू मुद्दु माडिरबहुदु नेनेपिसिको.
intro-3: इल्लि प्रीति मातुगळिंद मुद्दिसुव संदर्भविदे.
intro-4: अदन्नु निन्न अनुभवदोंदिगे होंदिसि नोडु.

# ── ಪದ್ಯ: ಕಂದ
poem-s1l1: कूसु इद्द मनिगे बीसणिगे यातक कूसु कंदय्य ओळ होरग ।
poem-s1l2: आडिदर बीसणिगे गाळि सुळिदाव ॥

poem-s2l1: आडि बा नन कंद अंगाल तोळेदेन तेंगिन कायि तिळिनीर |
poem-s2l2: तक्कोंडु बंगार मारि तोळेदेन |

poem-s3l1: अळुव कंदन तुटियु हवळद कुडिहंग कुडिहुब्बु बेविनेसळंग ।
poem-s3l2: कणोट शिवन कैयलगु होळेद्दंग |

poem-s4l1: कंदान किरिकिरि इंदेनु हेळलि बिंदिगे हालु सुरिवंद |
poem-s4l2: चंजीय 'चंद्रमन तंदु निलिसेंदा |
