# ── ಸಾಮರ್ಥ್ಯ
competency: Pathyavannu oodida mele yaaru? Yaavaaga? Elli? Enu? Eke? Emba prashnegalige uttarisuvudu.

# ── ಪ್ರವೇಶ
intro-1: "Santosha, duhkha, novu — ee anubhavagalu ninagoo aagirabahudallave?"
intro-2: Ninna ondu anubhavavannu nenepisiko.
intro-3: Adakke ondu kaaranavoo irabekallave?
intro-4: Eega illina ghataneyannu gamanisu.
intro-5: Santosha haagoo duhkhakke kaaranavaada sandarbhagalannu gurutisu.

# ── ಕವನ: ಬಣ್ಣದ ತಗಡಿನ ತುತ್ತೂರಿ
poem-s1l1: Bannada tagadina tutturi
poem-s1l2: Kaasige kondanu Kasturi
poem-s1l3: Sarigamapadanisa oodidanu
poem-s1l4: Sanidapa magarisa oodidanu

poem-s2l1: Tanagee tutturi ideyenda
poem-s2l2: Beraarigu adu illenda
poem-s2l3: Kasturi nadedanu biidiyali
poem-s2l4: Jambhada koliya riitiyali

poem-s3l1: Tutturiyooduta kolada bali
poem-s3l2: Nadedanu Kasturi sanjeyali
poem-s3l3: Jaaritu neerige tutturi
poem-s3l4: Gantalu kattitu neeroori

poem-s4l1: Sarigama oodalu nodidanu
poem-s4l2: Gagagaga saddanu maadidanu
poem-s4l3: Bannavu neerina paalaaytu
poem-s4l4: Bannada tutturi bolaaytu

poem-s5l1: Bannada tutturi haalaaytu
poem-s5l2: Jambhada kolige golaaytu

