# ── ಅಭ್ಯಾಸ ಅ)
ex-a-q1: Kasturiyu enannu kondanu?
ex-a-q1-ans: Kasturiyu bannada tagadina tutturiyannu kondanu.
ex-a-q2: Kasturi elli tutturi oodidanu?
ex-a-q2-ans: Kasturi kolada bali tutturi oodidanu.
ex-a-q3: Kasturiyu tutturiyannu yaavaaga oodidanu?
ex-a-q3-ans: Kasturiyu tutturiyannu sanjeyali oodidanu.
ex-a-q4: Jambhada koli yaaru?
ex-a-q4-ans: Jambhada koli Kasturiye.
ex-a-q5: Jambhada kolige eke golaayitu?
ex-a-q5-ans: Tutturi neerige jaari haalaaddarinda jambhada kolige golaayitu.
ex-a-q6: Tutturi enaayitu?
ex-a-q6-ans: "Tutturi neerige jaari, banna kaledukondu haalaayitu."

# ── ಅಭ್ಯಾಸ ಆ)
ex-b-q1: Bannada tagadina ________
ex-b-q1-ans: Tutturi
ex-b-q2: Kasturi nadedanu ________
ex-b-q2-ans: Biidiyali
ex-b-q3: ________ neerige tutturi
ex-b-q3-ans: Jaaritu
ex-b-q4: Bannada tutturi ________
ex-b-q4-ans: Haalaaytu

# ── ಅಭ್ಯಾಸ ಇ) passage
ex-c-p1: Beerurinalli Ramanna emba kattige vyaapaariyu vaasisuttiddanu.
ex-c-p2: Avanu tumbaa badavanaagiddanu.
ex-c-p3: Avanu prati dina belagge kaadige hogi ona maravannu kadidu taruttiddanu.
ex-c-p4: Peteyalli kattige maari jeevana nadesuttiddanu.
ex-c-p5: Avanu endoo hasi maravannu kadidavanalla.
ex-c-p6: Idakkaagi ivanige vanadevateyu akshaya paatreyannu needidalu.
ex-c-p7: Idarinda Ramanna shreemantanaadanu.

ex-c-q1: Ramanna yaaru?
ex-c-q1-ans: Ramanna Beeruriina obba kattige vyaapaari.
ex-c-q2: Ramanna elli vaasisuttiddanu?
ex-c-q2-ans: Beeruru
ex-c-q3: Ramanna yaavaaga kaadige hoguttiddanu?
ex-c-q3-ans: Pratidina belagge
ex-c-q4: Vanadevateyu Ramannanige akshaya paatreyannu eke needidalu?
ex-c-q4-ans: Avanu endoo hasi maravannu kadidavanalla.
