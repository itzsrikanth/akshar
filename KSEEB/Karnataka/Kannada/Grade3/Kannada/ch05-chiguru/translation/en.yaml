competency: Reading classmates' handwriting.
intro-1: You have seen textbooks, invitations to weddings and housewarmings, and newspapers. These are printed.
  We read their printed contents to learn what they say.
intro-2: We do not read only printed material. Sometimes we read things written by hand. We also write down by hand
  what we wish to say or what we have thought, don't we?
intro-3: Your article may have appeared in your school magazine. Read the handwritten articles in this school magazine
  and notice the different styles of handwriting.
story-n1: It was Saturday. The editorial board examined the articles sent in by pupils. They chose good articles,
  prepared the magazine and published it.
story-n2: Radha saw the magazine and eagerly began reading. She read some articles easily, but found others difficult.
  Why might that be? Can you tell? First, read this magazine.
story-n3: School magazine — Chiguru (New Shoot) — June 2024
story-n4: 'Mango: The mango is the king of fruits. Its varieties include Badami, Rasa and Malagoba. — Yusuf, Class
  4'
poem-s1l1: For little children, just the sky's
poem-s1l2: Ball,
poem-s1l3: For scientists here, just a ball of rock.
story-n5: Short verse collected by Jahnavi, Class 3
story-n6: 'Colour the picture. Picture collected by Vinayaka, Class 3. [Editorial image reference: 3rd_KANNADA_FL_Part_1_2026-27.pdf,
  printed page 30, PDF page 43 (counting from 1), lion illustration on the left of the school magazine.]'
story-n7: 'Wise saying: Sacrifice, love, compassion and honesty are true education. — Swami Vivekananda. Collected
  by Javed, Class 5'
story-n8: 'Idioms — meanings: As much as a sesame seed — very little; pull out the bars — run away. — Vivek, Class
  5'
story-n9: 'Subtract to find the product! Example: 36 × 9 = 324. Add a zero after 36 to make 360. Subtract 36. The
  remainder (the product of 36 × 9) is 324.'
story-n10: 'Notice: Try this method to find the product of any number multiplied by 9. — Harshini, Class 5'
story-n11: 'Find the differences between the pictures. [Editorial image reference: 3rd_KANNADA_FL_Part_1_2026-27.pdf,
  printed page 30, PDF page 43 (counting from 1), the two bird scenes at the lower right.]'
story-n12: Did you know? The Krishnaraja dam in Srirangapatna taluk of Mandya district was built through Sir M.
  Visvesvaraya's far-sighted planning. It has greatly helped the farmers of that region. — Mala, Class 4
story-n13: 'Waterfall: Jog Falls is world-famous, a place of pride for Karnataka. It is in Jog village, Sagara taluk,
  Shivamogga district, in Malenadu. — Satish, Class 5'
story-n14: 'Swami Vivekananda: He proclaimed the greatness of Hinduism in America. His childhood name was Narendra.
  His father was Vishwanath Datta and his mother was Bhuvaneshwari Devi. — Vinayaka, Class 3'
story-n15: 'State festival: Dasara is our state festival. It is also called Sharannavaratri. Mysuru Dasara reflects
  the state''s traditions. Its Jamboo Savari elephant procession is attractive. — Thomas, Class 5'
story-n16: 'Proverb: A worker has no sorrow; a lazy person has no happiness. — Begum, Class 3'
story-n17: 'Home remedy: Put washed guava leaves and salt in water and boil it. Rinsing the mouth with this water
  when comfortably warm relieves toothache. — Gayatri, Class 5'
story-d1: Radha, why did you find some articles difficult to read?
story-n18: asked the teacher.
story-d2: Some people's handwriting was not good. That made it difficult to read, madam.
story-n23: Radha replied.
story-d3: What was it like when you say the handwriting wasn't good?
story-n24: asked the teacher.
story-d4: Mala's writing is not clear, madam. Gayatri's letters do not have printed shapes, and Yusuf has left no
  spaces between words.
story-n19: she said. Others shared their thoughts. The teacher brought together the views expressed in the discussion.
story-n20: 'Explaining what good handwriting should be like, she said: We must write without mistakes and make our
  writing neat. It should be easy to read and understand. Letters should be of the same size.'
story-n21: Every letter should have the shape of a printed letter. Within a word, letters should neither touch each
  other nor have gaps between them. Leave a little space between words to help identify them.
story-n22: Leave enough space between lines so the letters in one line do not touch those in another. Letters and
  lines should not be slanted, she said. The pupils were happy to learn how to write neatly.
