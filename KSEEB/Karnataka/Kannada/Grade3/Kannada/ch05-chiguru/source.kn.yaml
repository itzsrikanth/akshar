segments:
- id: competency
  type: competency
  text: ಸಹಪಾಠಿಗಳ ಕೈ ಬರೆಹವನ್ನು ಓದುವುದು.
- id: intro-1
  type: prose
  text: ಪಠ್ಯ ಪುಸ್ತಕ, ಮದುವೆ, ಗೃಹಪ್ರವೇಶ ಮುಂತಾದ ಆಮಂತ್ರಣ ಪತ್ರಿಕೆ, ಸಮಾಚಾರ ಪತ್ರಿಕೆಗಳನ್ನು ನೋಡಿರುವೆ. ಇವು ಮುದ್ರಿತ ರೂಪದಲ್ಲಿವೆ.
    ನಾವು ಇವುಗಳಲ್ಲಿನ ಮುದ್ರಿತ ವಿಷಯಗಳನ್ನು ಓದಿ ತಿಳಿಯುತ್ತೇವೆ.
  section: intro
- id: intro-2
  type: prose
  text: ನಾವು ಮುದ್ರಿತ ವಿಷಯಗಳನ್ನು ಮಾತ್ರ ಓದುವುದಿಲ್ಲ. ಕೆಲವು ವೇಳೆ ಕೈಬರೆಹದಲ್ಲಿರುವ ವಿಷಯಗಳನ್ನು ಓದಿ ತಿಳಿಯುತ್ತೇವೆ. ಅಲ್ಲದೆ
    ಹೇಳಬೇಕಾದುದನ್ನು ಅಥವಾ ಆಲೋಚಿಸಿದ್ದನ್ನು ಕೈಬರೆಹದಲ್ಲಿ ಬರೆಯುತ್ತೇವೆ ಅಲ್ಲವೇ?
  section: intro
- id: intro-3
  type: prose
  text: ನಿನ್ನ ಶಾಲಾ ಪತ್ರಿಕೆಯಲ್ಲಿ ನಿನ್ನ ಲೇಖನ ಪ್ರಕಟವಾಗಿರಬಹುದು. ಈ ಶಾಲಾ ಪತ್ರಿಕೆಯಲ್ಲಿರುವ ಕೈಬರೆಹದ ಲೇಖನವನ್ನು ಓದಿ ತಿಳಿ. ಕೈಬರೆಹದಲ್ಲಿನ
    ವೈವಿಧ್ಯತೆಯನ್ನು ಗುರುತಿಸು.
  section: intro
- id: story-n1
  type: prose
  text: ಅಂದು ಶನಿವಾರ. ಸಂಪಾದಕ ಮಂಡಳಿಯವರು ವಿದ್ಯಾರ್ಥಿಗಳಿಂದ ಬಂದ ಲೇಖನಗಳನ್ನು ಪರಿಶೀಲಿಸಿದರು. ಉತ್ತಮ ಲೇಖನಗಳನ್ನು ಆಯ್ದು ಪತ್ರಿಕೆಯನ್ನು
    ಸಿದ್ಧಪಡಿಸಿ ಪ್ರಕಟಿಸಿದರು.
  section: story
- id: story-n2
  type: prose
  text: ರಾಧಾ ಪತ್ರಿಕೆಯನ್ನು ನೋಡಿದಳು. ಕುತೂಹಲದಿಂದ ಓದಲು ಮುಂದಾದಳು. ಕೆಲವು ಲೇಖನಗಳನ್ನು ಸರಾಗವಾಗಿ ಓದಿದಳು. ಆದರೆ ಕೆಲವು ಲೇಖನಗಳನ್ನು
    ಓದಲು ಕಷ್ಟಪಟ್ಟಳು. ಏಕಿರಬಹುದು? ಹೇಳಬಲ್ಲೆಯಾ? ಹಾಗಿದ್ದರೆ ಮೊದಲಿಗೆ ಈ ಪತ್ರಿಕೆಯನ್ನು ಓದು.
  section: story
- id: story-n3
  type: prose
  text: ಶಾಲಾ ಪತ್ರಿಕೆ — ಚಿಗುರು — ಜೂನ್ 2024
  section: story
- id: story-n4
  type: prose
  text: 'ಮಾವು: ಮಾವು ಹಣ್ಣುಗಳ ರಾಜ. ಇದರಲ್ಲಿ ಬಾದಾಮಿ, ರಸ, ಮಲಗೋಬ ಮುಂತಾದ ವಿಧಗಳಿವೆ. — ಯೂಸುಫ್, 4ನೇ ತರಗತಿ'
  section: story
- id: poem-s1l1
  type: poem_line
  text: ಚಿಕ್ಕ ಮಕ್ಕಳಿಗೆ ಬರಿ ಭಾನಂಗಳದ
  stanza: 1
- id: poem-s1l2
  type: poem_line
  text: ಚೆಂಡು,
  stanza: 1
- id: poem-s1l3
  type: poem_line
  text: ವಿಜ್ಞಾನಿಗಳಿಗಿಲ್ಲಿ ಬರಿ ಕಲ್ಲು ಗುಂಡು
  stanza: 1
- id: story-n5
  type: prose
  text: 'ಚುಟುಕು ಸಂಗ್ರಹ: ಜಾಹ್ನವಿ, 3ನೇ ತರಗತಿ'
  section: story
- id: story-n6
  type: prose
  text: 'ಚಿತ್ರಕ್ಕೆ ಬಣ್ಣ ಹಾಕಿ. ಚಿತ್ರ ಸಂಗ್ರಹ: ವಿನಾಯಕ, 3ನೇ ತರಗತಿ. [ಸಂಪಾದಕೀಯ ಚಿತ್ರ ಉಲ್ಲೇಖ: 3rd_KANNADA_FL_Part_1_2026-27.pdf,
    ಮುದ್ರಿತ ಪುಟ 30, PDF ಪುಟ 43 (1ರಿಂದ ಎಣಿಕೆ), ಶಾಲಾ ಪತ್ರಿಕೆಯ ಎಡಭಾಗದ ಸಿಂಹದ ಚಿತ್ರ.]'
  section: story
- id: story-n7
  type: prose
  text: 'ಸುಭಾಷಿತ: ತ್ಯಾಗ, ಪ್ರೀತಿ, ಕರುಣೆ ಮತ್ತು ಪ್ರಾಮಾಣಿಕತೆಯೇ ನಿಜವಾದ ಶಿಕ್ಷಣ. — ಸ್ವಾಮಿ ವಿವೇಕಾನಂದ. ಸಂಗ್ರಹ: ಜಾವೇದ್, 5ನೇ
    ತರಗತಿ'
  section: story
- id: story-n8
  type: prose
  text: 'ನುಡಿಗಟ್ಟು — ಅರ್ಥ: ಎಳ್ಳಷ್ಟು — ಅತ್ಯಲ್ಪ; ಕಂಬಿ ಕೀಳು — ಓಡಿ ಹೋಗು. — ವಿವೇಕ್, 5ನೇ ತರಗತಿ'
  section: story
- id: story-n9
  type: prose
  text: 'ವ್ಯವಕಲನ ಮಾಡು — ಗುಣಲಬ್ಧ ತಿಳಿ! ಉದಾ: 36 × 9 = 324. 36ರ ಮುಂದೆ ಸೊನ್ನೆ ಸೇರಿಸಿ ಬರೆ: 360. 36ನ್ನು ಕಳೆ: −36. ಉಳಿಕೆ
    (ಇದುವೇ 36 × 9ರ ಗುಣಲಬ್ಧ): 324.'
  section: story
- id: story-n10
  type: prose
  text: 'ಗಮನಿಸು: 9ರಿಂದ ಗುಣಿಸಬೇಕಾದ ಯಾವುದೇ ಸಂಖ್ಯೆಯ ಗುಣಲಬ್ಧ ತಿಳಿಯಲು ಈ ಕ್ರಮ ಅನುಸರಿಸಿ ನೋಡು. — ಹರ್ಷಿಣಿ, 5ನೇ ತರಗತಿ'
  section: story
- id: story-n11
  type: prose
  text: 'ಚಿತ್ರಗಳಲ್ಲಿ ವ್ಯತ್ಯಾಸ ಹುಡುಕಿ. [ಸಂಪಾದಕೀಯ ಚಿತ್ರ ಉಲ್ಲೇಖ: 3rd_KANNADA_FL_Part_1_2026-27.pdf, ಮುದ್ರಿತ ಪುಟ 30,
    PDF ಪುಟ 43 (1ರಿಂದ ಎಣಿಕೆ), ಬಲಕೆಳಗಿನ ಎರಡು ಪಕ್ಷಿಗಳ ಚಿತ್ರಗಳು.]'
  section: story
- id: story-n12
  type: prose
  text: 'ನಿಮಗಿದು ತಿಳಿದಿರಲಿ: ಸರ್. ಎಂ. ವಿಶ್ವೇಶ್ವರಯ್ಯನವರ ದೂರದೃಷ್ಟಿಯ ಯೋಜನೆಯಿಂದ ಮಂಡ್ಯ ಜಿಲ್ಲೆಯ ಶ್ರೀರಂಗಪಟ್ಟಣ ತಾಲ್ಲೂಕಿನಲ್ಲಿ
    ಕೃಷ್ಣರಾಜ ಅಣೆಕಟ್ಟು ಕಟ್ಟಲಾಗಿದೆ. ಇದರಿಂದ ಆ ಭಾಗದ ರೈತರಿಗೆ ತುಂಬಾ ಅನುಕೂಲವಾಗಿದೆ. — ಮಾಲ, 4ನೇ ತರಗತಿ'
  section: story
- id: story-n13
  type: prose
  text: 'ಜಲಪಾತ: ಜೋಗ ಜಲಪಾತ ಲೋಕ ವಿಖ್ಯಾತ. ಕನ್ನಡ ನಾಡಿನ ಹೆಮ್ಮೆಯ ತಾಣ. ಮಲೆನಾಡಿನ ಶಿವಮೊಗ್ಗ ಜಿಲ್ಲೆಯ ಸಾಗರ ತಾಲ್ಲೂಕಿನ ಜೋಗ್ ಹಳ್ಳಿಯಲ್ಲಿ
    ಇದೆ. — ಸತೀಶ್, 5ನೇ ತರಗತಿ'
  section: story
- id: story-n14
  type: prose
  text: 'ಸ್ವಾಮಿ ವಿವೇಕಾನಂದ: ಅಮೇರಿಕಾದಲ್ಲಿ ಹಿಂದೂ ಧರ್ಮದ ಹಿರಿಮೆಯನ್ನು ಎತ್ತಿ ಸಾರಿದರು. ಇವರ ಬಾಲ್ಯದ ಹೆಸರು ನರೇಂದ್ರ. ತಂದೆ ವಿಶ್ವನಾಥ
    ದತ್ತ. ತಾಯಿ ಭುವನೇಶ್ವರಿ ದೇವಿ. — ವಿನಾಯಕ, 3ನೇ ತರಗತಿ'
  section: story
- id: story-n15
  type: prose
  text: 'ನಾಡಹಬ್ಬ: ನಮ್ಮ ನಾಡ ಹಬ್ಬ ದಸರಾ. ಇದನ್ನು ಶರನ್ನವರಾತ್ರಿ ಎಂದೂ ಕರೆಯುತ್ತಾರೆ. ಮೈಸೂರಿನ ದಸರಾ ರಾಜ್ಯದ ಪರಂಪರೆಯನ್ನು ಪ್ರತಿಬಿಂಬಿಸುತ್ತದೆ.
    ಇಲ್ಲಿನ ಜಂಬೂ ಸವಾರಿ ಆಕರ್ಷಣೀಯ. — ಥಾಮಸ್, 5ನೇ ತರಗತಿ'
  section: story
- id: story-n16
  type: prose
  text: 'ಗಾದೆ: ದುಡಿದವನಿಗೆ ದುಃಖವಿಲ್ಲ, ಸೋಮಾರಿಗೆ ಸುಖವಿಲ್ಲ. — ಬೇಗಂ, 3ನೇ ತರಗತಿ'
  section: story
- id: story-n17
  type: prose
  text: 'ಮನೆ ಮದ್ದು: ತೊಳೆದ ಸೀಬೆ ಹಣ್ಣಿನ ಎಲೆ ಮತ್ತು ಉಪ್ಪನ್ನು ನೀರಿಗೆ ಹಾಕಿ ಕುದಿಸಬೇಕು. ಕುದಿಸಿದ ನೀರನ್ನು ಹಿತವಾದ ಶಾಖದಲ್ಲಿ
    ಮುಕ್ಕಳಿಸಿದರೆ ಹಲ್ಲು ನೋವು ಶಮನವಾಗುತ್ತದೆ. — ಗಾಯತ್ರಿ, 5ನೇ ತರಗತಿ'
  section: story
- id: story-d1
  type: dialogue
  text: ರಾಧಾ ನೀನು ಕೆಲವು ಲೇಖನಗಳನ್ನು ಓದಲು ಕಷ್ಟಪಟ್ಟೆ ಏಕೆ?
  section: story
  speaker: ಶಿಕ್ಷಕಿ
- id: story-n18
  type: prose
  text: ಎಂದು ಶಿಕ್ಷಕಿ ಪ್ರಶ್ನಿಸಿದರು.
  section: story
- id: story-d2
  type: dialogue
  text: ಕೆಲವರ ಕೈಬರೆಹ ಚೆನ್ನಾಗಿರಲಿಲ್ಲ. ಆದ್ದರಿಂದ ಓದಲು ಕಷ್ಟವಾಯಿತು ಮೇಡಂ.
  section: story
  speaker: ರಾಧಾ
- id: story-n23
  type: prose
  text: ಎಂದು ರಾಧಾ ಹೇಳಿದಳು.
  section: story
- id: story-d3
  type: dialogue
  text: ಬರೆಹ ಚೆನ್ನಾಗಿರಲಿಲ್ಲ ಎಂದರೆ ಅದು ಹೇಗಿತ್ತು?
  section: story
  speaker: ಶಿಕ್ಷಕಿ
- id: story-n24
  type: prose
  text: ಎಂದು ಶಿಕ್ಷಕಿ ಕೇಳಿದರು.
  section: story
- id: story-d4
  type: dialogue
  text: ಮಾಲಾ ಬರೆದಿರುವುದು ಸ್ಪಷ್ಟವಾಗಿ ಕಾಣಿಸುತ್ತಿಲ್ಲ ಮೇಡಂ. ಆದರೆ ಗಾಯತ್ರಿ ಬರೆದಿರುವ ಅಕ್ಷರಗಳು ಮುದ್ರಿತ ಆಕಾರದಲ್ಲಿಲ್ಲ, ಇನ್ನು
    ಯೂಸುಫ್ನು ತನ್ನ ಬರೆಹದಲ್ಲಿ ಪದಗಳ ನಡುವೆ ಸ್ಥಳವನ್ನೇ ಬಿಟ್ಟಿಲ್ಲ.
  section: story
  speaker: ರಾಧಾ
- id: story-n19
  type: prose
  text: ಎಂದಳು. ಇತರರು ತಮ್ಮ ಅನಿಸಿಕೆಯನ್ನು ಹಂಚಿಕೊಂಡರು. ಶಿಕ್ಷಕಿ ಚರ್ಚೆಯಲ್ಲಿ ಬಂದ ಅಭಿಪ್ರಾಯವನ್ನು ಒಟ್ಟುಗೂಡಿಸಿದರು.
  section: story
- id: story-n20
  type: prose
  text: ಬರೆವಣಿಗೆಯು ಚೆನ್ನಾಗಿರಬೇಕಾದರೆ ಅದು ಹೇಗಿರಬೇಕು ಎನ್ನುವ ಬಗ್ಗೆ ತಿಳಿಸುತ್ತಾ... ನಾವು ತಪ್ಪಿಲ್ಲದೆ ಚೆನ್ನಾಗಿ ಕಾಣುವ ರೀತಿಯಲ್ಲಿ
    ಬರೆಯಬೇಕು. ಸುಲಭವಾಗಿ ಓದಲು ಮತ್ತು ಓದಿದ್ದು ಅರ್ಥವಾಗುವಂತೆ ಬರೆಯಬೇಕು. ಅಕ್ಷರಗಳನ್ನು ಒಂದೇ ಗಾತ್ರದಲ್ಲಿ ಬರೆಯಬೇಕು.
  section: story
- id: story-n21
  type: prose
  text: ಬರೆಯುವ ಪ್ರತಿ ಅಕ್ಷರವು ಮುದ್ರಿತ ಅಕ್ಷರಗಳ ಆಕಾರದಲ್ಲಿ ಇರಬೇಕು. ಒಂದು ಪದದಲ್ಲಿನ ಅಕ್ಷರಗಳು ಒಂದಕ್ಕೊಂದು ತಾಕದಂತೆ ಹಾಗೂ ನಡುವೆ
    ಸ್ಥಳ ಬಿಡದಂತೆ ಬರೆಯಬೇಕು. ಪದಗಳನ್ನು ಗುರ್ತಿಸಲು ಸಹಾಯವಾಗುವಂತೆ ಪದಗಳ ನಡುವೆ ಸ್ವಲ್ಪ ಸ್ಥಳವನ್ನು ಬಿಟ್ಟು ಬರೆಯಬೇಕು.
  section: story
- id: story-n22
  type: prose
  text: ಒಂದು ಸಾಲಿನ ಅಕ್ಷರಗಳು ಮತ್ತೊಂದು ಸಾಲಿನ ಅಕ್ಷರಗಳಿಗೆ ತಾಗದಂತೆ ಸಾಲುಗಳ ನಡುವೆ ಸೂಕ್ತ ಸ್ಥಳವನ್ನು ಬಿಟ್ಟು ಬರೆಯಬೇಕು. ಅಕ್ಷರ
    ಹಾಗೂ ಸಾಲುಗಳು ಓರೆಯಾಗಿರಬಾರದು ಎಂದು ಹೇಳಿದರು. ವಿದ್ಯಾರ್ಥಿಗಳು ಚೆನ್ನಾಗಿ ಬರೆಯುವ ಕ್ರಮ ತಿಳಿದು ಸಂತಸಗೊಂಡರು.
  section: story
