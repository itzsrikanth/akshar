competency: सहपाठिगळ कै बरेहवन्नु ओदुवुदु.
intro-1: पठ्य पुस्तक, मदुवे, गृहप्रवेश मुंताद आमंत्रण पत्रिके, समाचार पत्रिकेगळन्नु नोडिरुवे. इवु मुद्रित रूपदल्लिवे.
  नावु इवुगळल्लिन मुद्रित विषयगळन्नु ओदि तिळियुत्तेवे.
intro-2: नावु मुद्रित विषयगळन्नु मात्र ओदुवुदिल्ल. केलवु वेळे कैबरेहदल्लिरुव विषयगळन्नु ओदि तिळियुत्तेवे. अल्लदे
  हेळबेकादुदन्नु अथवा आलोचिसिद्दन्नु कैबरेहदल्लि बरेयुत्तेवे अल्लवे?
intro-3: निन्न शाला पत्रिकेयल्लि निन्न लेखन प्रकटवागिरबहुदु. ई शाला पत्रिकेयल्लिरुव कैबरेहद लेखनवन्नु ओदि तिळि.
  कैबरेहदल्लिन वैविध्यतेयन्नु गुरुतिसु.
story-n1: अंदु शनिवार. संपादक मंडळियवरु विद्यार्थिगळिंद बंद लेखनगळन्नु परिशीलिसिदरु. उत्तम लेखनगळन्नु आय्दु पत्रिकेयन्नु
  सिद्धपडिसि प्रकटिसिदरु.
story-n2: राधा पत्रिकेयन्नु नोडिदळु. कुतूहलदिंद ओदलु मुंदादळु. केलवु लेखनगळन्नु सरागवागि ओदिदळु. आदरे केलवु लेखनगळन्नु
  ओदलु कष्टपट्टळु. एकिरबहुदु? हेळबल्लेया? हागिद्दरे मोदलिगे ई पत्रिकेयन्नु ओदु.
story-n3: शाला पत्रिके — चिगुरु — जून् 2024
story-n4: 'मावु: मावु हण्णुगळ राज. इदरल्लि बादामि, रस, मलगोब मुंताद विधगळिवे. — यूसुफ्, 4ने तरगति'
poem-s1l1: चिक्क मक्कळिगे बरि भानंगळद
poem-s1l2: चेंडु,
poem-s1l3: विज्ञानिगळिगिल्लि बरि कल्लु गुंडु
story-n5: 'चुटुकु संग्रह: जाह्नवि, 3ने तरगति'
story-n6: 'चित्रक्के बण्ण हाकि. चित्र संग्रह: विनायक, 3ने तरगति. [संपादकीय चित्र उल्लेख: 3rd_KANNADA_FL_Part_1_2026-27.pdf,
  मुद्रित पुट 30, PDF पुट 43 (1रिंद एणिके), शाला पत्रिकेय एडभागद सिंहद चित्र.]'
story-n7: 'सुभाषित: त्याग, प्रीति, करुणे मत्तु प्रामाणिकतेये निजवाद शिक्षण. — स्वामि विवेकानंद. संग्रह: जावेद्,
  5ने तरगति'
story-n8: 'नुडिगट्टु — अर्थ: एळ्ळष्टु — अत्यल्प; कंबि कीळु — ओडि होगु. — विवेक्, 5ने तरगति'
story-n9: 'व्यवकलन माडु — गुणलब्ध तिळि! उदा: 36 × 9 = 324. 36र मुंदे सोन्ने सेरिसि बरे: 360. 36न्नु कळे: −36. उळिके
  (इदुवे 36 × 9र गुणलब्ध): 324.'
story-n10: 'गमनिसु: 9रिंद गुणिसबेकाद यावुदे संख्येय गुणलब्ध तिळियलु ई क्रम अनुसरिसि नोडु. — हर्षिणि, 5ने तरगति'
story-n11: 'चित्रगळल्लि व्यत्यास हुडुकि. [संपादकीय चित्र उल्लेख: 3rd_KANNADA_FL_Part_1_2026-27.pdf, मुद्रित पुट
  30, PDF पुट 43 (1रिंद एणिके), बलकेळगिन एरडु पक्षिगळ चित्रगळु.]'
story-n12: 'निमगिदु तिळिदिरलि: सर्. एं. विश्वेश्वरय्यनवर दूरदृष्टिय योजनेयिंद मंड्य जिल्लेय श्रीरंगपट्टण ताल्लूकिनल्लि
  कृष्णराज अणेकट्टु कट्टलागिदे. इदरिंद आ भागद रैतरिगे तुंबा अनुकूलवागिदे. — माल, 4ने तरगति'
story-n13: 'जलपात: जोग जलपात लोक विख्यात. कन्नड नाडिन हेम्मेय ताण. मलेनाडिन शिवमोग्ग जिल्लेय सागर ताल्लूकिन जोग्
  हळ्ळियल्लि इदे. — सतीश्, 5ने तरगति'
story-n14: 'स्वामि विवेकानंद: अमेरिकादल्लि हिंदू धर्मद हिरिमेयन्नु एत्ति सारिदरु. इवर बाल्यद हेसरु नरेंद्र. तंदे
  विश्वनाथ दत्त. तायि भुवनेश्वरि देवि. — विनायक, 3ने तरगति'
story-n15: 'नाडहब्ब: नम्म नाड हब्ब दसरा. इदन्नु शरन्नवरात्रि एंदू करेयुत्तारे. मैसूरिन दसरा राज्यद परंपरेयन्नु प्रतिबिंबिसुत्तदे.
  इल्लिन जंबू सवारि आकर्षणीय. — थामस्, 5ने तरगति'
story-n16: 'गादे: दुडिदवनिगे दुःखविल्ल, सोमारिगे सुखविल्ल. — बेगं, 3ने तरगति'
story-n17: 'मने मद्दु: तोळेद सीबे हण्णिन एले मत्तु उप्पन्नु नीरिगे हाकि कुदिसबेकु. कुदिसिद नीरन्नु हितवाद शाखदल्लि
  मुक्कळिसिदरे हल्लु नोवु शमनवागुत्तदे. — गायत्रि, 5ने तरगति'
story-d1: राधा नीनु केलवु लेखनगळन्नु ओदलु कष्टपट्टे एके?
story-n18: एंदु शिक्षकि प्रश्निसिदरु.
story-d2: केलवर कैबरेह चेन्नागिरलिल्ल. आद्दरिंद ओदलु कष्टवायितु मेडं.
story-n23: एंदु राधा हेळिदळु.
story-d3: बरेह चेन्नागिरलिल्ल एंदरे अदु हेगित्तु?
story-n24: एंदु शिक्षकि केळिदरु.
story-d4: माला बरेदिरुवुदु स्पष्टवागि काणिसुत्तिल्ल मेडं. आदरे गायत्रि बरेदिरुव अक्षरगळु मुद्रित आकारदल्लिल्ल, इन्नु
  यूसुफ्नु तन्न बरेहदल्लि पदगळ नडुवे स्थळवन्ने बिट्टिल्ल.
story-n19: एंदळु. इतररु तम्म अनिसिकेयन्नु हंचिकोंडरु. शिक्षकि चर्चेयल्लि बंद अभिप्रायवन्नु ओट्टुगूडिसिदरु.
story-n20: बरेवणिगेयु चेन्नागिरबेकादरे अदु हेगिरबेकु एन्नुव बग्गे तिळिसुत्ता... नावु तप्पिल्लदे चेन्नागि काणुव रीतियल्लि
  बरेयबेकु. सुलभवागि ओदलु मत्तु ओदिद्दु अर्थवागुवंते बरेयबेकु. अक्षरगळन्नु ओंदे गात्रदल्लि बरेयबेकु.
story-n21: बरेयुव प्रति अक्षरवु मुद्रित अक्षरगळ आकारदल्लि इरबेकु. ओंदु पददल्लिन अक्षरगळु ओंदक्कोंदु ताकदंते हागू
  नडुवे स्थळ बिडदंते बरेयबेकु. पदगळन्नु गुर्तिसलु सहायवागुवंते पदगळ नडुवे स्वल्प स्थळवन्नु बिट्टु बरेयबेकु.
story-n22: ओंदु सालिन अक्षरगळु मत्तोंदु सालिन अक्षरगळिगे तागदंते सालुगळ नडुवे सूक्त स्थळवन्नु बिट्टु बरेयबेकु. अक्षर
  हागू सालुगळु ओरेयागिरबारदु एंदु हेळिदरु. विद्यार्थिगळु चेन्नागि बरेयुव क्रम तिळिदु संतसगोंडरु.
