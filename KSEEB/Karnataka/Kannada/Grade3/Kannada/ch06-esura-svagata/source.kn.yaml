segments:
- id: competency
  type: competency
  text: ಅಕ್ಷರಗಳನ್ನು ಮತ್ತು ಪದಗಳನ್ನು ಸರಿಯಾದ ವಿನ್ಯಾಸ, ಅನುಕ್ರಮಣಿಕೆ ಹಾಗೂ ಸೂಕ್ತ ಅಂತರದೊಂದಿಗೆ ಬರೆಯುವುದು.
- id: intro-1
  type: prose
  text: ನೀನು ವಿದ್ಯಾರ್ಥಿ. ನಿನ್ನಲ್ಲಿ ನಿನ್ನದೇ ಆದ ಕೆಲವು ವಸ್ತುಗಳಿವೆ ಅಲ್ಲವೇ? ನಿನ್ನ ವಸ್ತುಗಳನ್ನು ಯಾರಾದರೂ ಕಸಿದುಕೊಳ್ಳಲು ಬಂದರೆ
    ಅದನ್ನು ಯಾರು ರಕ್ಷಿಸಬೇಕು? ಏಕೆ ರಕ್ಷಿಸಬೇಕು? ಹೇಗೆ ರಕ್ಷಿಸಿಕೊಳ್ಳುವೆ?
  section: intro
- id: intro-2
  type: prose
  text: ನಿಮ್ಮ ಮನೆ, ಹೊಲ ಮತ್ತಿತರ ಸಾಮಗ್ರಿಗಳನ್ನು ಯಾರಾದರೂ ಕಸಿದುಕೊಳ್ಳಲು ಬಂದರೆ ನೀನು ಏನು ಮಾಡುವೆ?
  section: intro
- id: intro-3
  type: prose
  text: ನಿಮ್ಮ ಊರಿಗೆ ಯಾರಾದರೂ ಕೇಡು ಮಾಡಲು ಬಂದರೆ ಊರನ್ನು ಯಾರು ರಕ್ಷಿಸಬೇಕು? ಈ ಬಗ್ಗೆ ಇಲ್ಲಿನ ಹೋರಾಟವನ್ನು ಗಮನಿಸು.
  section: intro
- id: story-n1
  type: prose
  text: “ಏಸೂರು ಕೊಟ್ಟರೂ ಈಸೂರು ಬಿಡೆವು”
  section: story
- id: story-n2
  type: prose
  text: ಕೇಳಿದಿರಲ್ಲ! ನನ್ನ ಮಡಿಲ ಮಕ್ಕಳ ಧೀರ ಮಾತುಗಳನ್ನ. ಏನು? ನಾನು ಯಾರೆಂದು ತಿಳಿಯುವ ಕುತೂಹಲವೇ? ಕೇಳಿ ನಾನು ಈಸೂರು ಎಂಬ ಗ್ರಾಮ.
    ನಾನು ಶಿವಮೊಗ್ಗ ಜಿಲ್ಲೆ ಶಿಕಾರಿಪುರ ತಾಲ್ಲೂಕಿನಲ್ಲಿದ್ದೇನೆ. ಕುಮುದ್ವತಿ ನದಿಯ ಬಲದಂಡೆಯ ಮೇಲಿರುವ ನನ್ನ ಮಡಿಲಿನ ಮಕ್ಕಳು ತಮ್ಮದೇ
    ಸರ್ಕಾರ ರಚಿಸಿಕೊಂಡು ಬ್ರಿಟಿಷರ ವಿರುದ್ಧ ಹೋರಾಡಿದ ಸ್ವಾತಂತ್ರ್ಯ ಪ್ರೇಮಿಗಳು, ನಾಡಿಗೆ ಕೀರ್ತಿ ತಂದವರು.
  section: story
- id: story-n3
  type: prose
  text: ನಮ್ಮನ್ನು ಬ್ರಿಟಿಷರು ಆಳುತ್ತಿದ್ದ ಕಾಲ. ನಾವು ಅವರ ಗುಲಾಮರಾಗಿ, ತುಂಬಾ ನೋವು, ಹಿಂಸೆ ಅನುಭವಿಸಬೇಕಾಗಿತ್ತು. ಬ್ರಿಟಿಷರನ್ನು
    ಭಾರತದಿಂದ ಓಡಿಸಬೇಕು, ನಾವು ಸ್ವತಂತ್ರರಾಗಬೇಕು ಎಂಬ ಛಲ ಭಾರತೀಯರಲ್ಲಿ ಮೂಡಿತು. ಮಹಾತ್ಮ ಗಾಂಧಿಯವರು “ಬ್ರಿಟಿಷರೇ, ಭಾರತ ಬಿಟ್ಟು
    ತೊಲಗಿ” ಎಂಬ ಚಳುವಳಿ ಆರಂಭಿಸಿದರು.
  section: story
- id: story-n4
  type: prose
  text: ಇದರಿಂದ ಪ್ರೇರಿತರಾದ ನನ್ನ ಜನತೆ ಬ್ರಿಟಿಷ್ ಸರ್ಕಾರಕ್ಕೆ ತೆರಿಗೆ ಕೊಡದಂತೆ ಚಳುವಳಿ ನಡೆಸಿದರು. ಅಧಿಕಾರಿಗಳಿಗೆ ಹೆದರದಂತೆ ಜನರಿಗೆ
    ಕರೆ ಕೊಟ್ಟರು. ಸರ್ಕಾರಿ ಅಧಿಕಾರಿಗಳಿಗೆ, ಕಛೇರಿಗಳಿಗೆ ಧಿಕ್ಕಾರ ಕೂಗಿದರು. 25 ಸೆಪ್ಟಂಬರ್ 1942ರಂದು ಬ್ರಿಟಿಷ್ ಸರ್ಕಾರದ ಅಧಿಕಾರವನ್ನು
    ಧಿಕ್ಕರಿಸಿದರು. “ಏಸೂರು ಕೊಟ್ಟರೂ ಈಸೂರು ಬಿಡೆವು” ಎಂಬ ಜನರ ಘೋಷಣೆ ಮುಗಿಲು ಮುಟ್ಟಿತು. ನನ್ನನ್ನು ‘ಸ್ವತಂತ್ರ ಹಳ್ಳಿ’ ಎಂದು ಸಾರಿದರು.
    ತಮ್ಮದೇ ಆದ ಸರ್ಕಾರ ರಚಿಸಿಕೊಂಡು ಗ್ರಾಮದ ಆಡಳಿತ ನಡೆಸಲು ಪಣತೊಟ್ಟರು.
  section: story
- id: story-n5
  type: prose
  text: ಮರುದಿನ ಬ್ರಿಟಿಷ್ ಸರ್ಕಾರಿ ಅಧಿಕಾರಿಗಳಾದ ಪಟೇಲ್ ಚನ್ನಬಸವಯ್ಯ ಮತ್ತು ಶಾನುಭೋಗ ರಂಗನಾಥರಾವ್ ಕಂದಾಯದ ವಸೂಲಿಗೆ ನನ್ನಲ್ಲಿಗೆ
    ಬಂದರು. ಖಾತೆ-ಕಿರ್ದಿ ಪುಸ್ತಕಗಳೊಂದಿಗೆ ಕಂದಾಯ ವಸೂಲಿಗೆ ಬಂದ ಅಧಿಕಾರಿಗಳನ್ನು ಹೋರಾಟಗಾರ ಯುವಕರು ವಿರೋಧಿಸಿದರು. “ರಾಜೀನಾಮೆ ಕೊಡಿ,
    ಗಾಂಧಿ ಟೋಪಿ ಧರಿಸಿ” ಎಂದು ವಿನಂತಿಸಿದರು. ಮಾತಿನ ಚಕಮಕಿ ನಡೆಯಿತು. ವಿನಂತಿಗೆ ಒಪ್ಪದ ಅಧಿಕಾರಿಗಳಿಂದ ಹೋರಾಟಗಾರರು ಖಾತೆ-ಕಿರ್ದಿ
    ಪುಸ್ತಕಗಳನ್ನು ಕಸಿದುಕೊಂಡರು. ಅಧಿಕಾರಿಗಳು ಸೋತರು. ತಾವು ತಂದ ಪುಸ್ತಕಗಳನ್ನು ಪಡೆಯಲಾಗದೆ ಹಿಂದಿರುಗಿದರು.
  section: story
- id: story-n6
  type: prose
  text: ಹೋರಾಟ ಅಲ್ಲಿಗೇ ನಿಲ್ಲಲಿಲ್ಲ. 1942 ಸೆಪ್ಟಂಬರ್ 27 ರಂದು ಸಂಜೆ ಗ್ರಾಮಸ್ಥರು ವೀರಭದ್ರ ದೇವಸ್ಥಾನದ ಮುಂದಿನ ಅಂಗಳದಲ್ಲಿ ಹಾರಿಸಿದ್ದ
    ಧ್ವಜದ ಕೆಳಗೆ ಗುಪ್ತ ಸಭೆ ನಡೆಸಿದರು. ಭವಿಷ್ಯದ ಪ್ರಜೆಗಳಾದ ಮಕ್ಕಳನ್ನು ಒಳಗೊಂಡ ತಮ್ಮದೇ ಸರ್ಕಾರವನ್ನು ರಚಿಸಿ ನನ್ನ ರಕ್ಷಣೆಗೆ ನಿಂತರು.
    ಮಕ್ಕಳಾದ ಸಾಹುಕಾರ್ ಜಯಣ್ಣನನ್ನು ಅಮಲ್ದಾರನನ್ನಾಗಿಯೂ, ಮಲ್ಲಪ್ಪಯ್ಯನನ್ನು ಪೊಲೀಸ್ ಅಧಿಕಾರಿಯನ್ನಾಗಿಯೂ ನೇಮಿಸಿದರು. ಇವರೊಂದಿಗೆ ಇತರೆ
    ಮಕ್ಕಳೂ ಸೇರಿಕೊಂಡರು.
  section: story
- id: story-n7
  type: prose
  text: ಊರಿನ ಅಗಸೆ ಬಾಗಿಲಿನಲ್ಲಿ “ಬೇಜವಾಬ್ದಾರಿ ಸರ್ಕಾರಿ ಅಧಿಕಾರಿಗಳಿಗೆ ಈಸೂರಿನಲ್ಲಿ ಪ್ರವೇಶವಿಲ್ಲ” ಎಂಬ ಫಲಕವನ್ನು ತೂಗುಹಾಕಿದರು.
    ಅಲ್ಲೇ ಕಛೇರಿಯನ್ನು ಪ್ರಾರಂಭಿಸಿದರು. ಗಮನಿಸಿದಿರಾ ನನ್ನ ಮಡಿಲಿನ ಮಕ್ಕಳ ಸಾಹಸವನ್ನು?
  section: story
- id: story-n8
  type: prose
  text: ಖಾತೆ-ಕಿರ್ದಿ ಪುಸ್ತಕವನ್ನು ಪಡೆಯಲು ಪಟೇಲ್ ಚನ್ನಬಸವಯ್ಯ ಮತ್ತು ಶಾನುಭೋಗ ರಂಗನಾಥರಾವ್ ಮತ್ತೆ ಬಂದರು. ಮಕ್ಕಳಿಂದ ರಚನೆಯಾದ ಹೊಸ
    ಸರ್ಕಾರದ ಅಧಿಕಾರಿಗಳು ಅವರಿಬ್ಬರನ್ನು ತಡೆದರು. ರಾಜೀನಾಮೆ ಕೊಟ್ಟು, ಗಾಂಧಿ ಟೋಪಿ ಹಾಕಿಕೊಂಡು, ತಾವು ರಚಿಸಿದ ಸರ್ಕಾರದಲ್ಲಿ ಕೆಲಸ
    ಮಾಡಬೇಕೆಂದು ಅವರಿಗೆ ಆಜ್ಞೆ ಮಾಡಿದರು. ಇದಕ್ಕೆ ಅವರು ಒಪ್ಪಲಿಲ್ಲ. ಅವರಿಗೆ ಐವತ್ತು ರೂಪಾಯಿ ದಂಡ ವಿಧಿಸಲಾಯಿತು. ದಂಡ ಕಟ್ಟದ ಅವರಿಗೆ
    ಮೂರು ಗಂಟೆ ಕಾಲ ಒಂಟಿ ಕಾಲಿನಲ್ಲಿ ನಿಲ್ಲುವಂತೆ ಶಿಕ್ಷೆ ವಿಧಿಸಲಾಯಿತು.
  section: story
- id: story-n9
  type: prose
  text: ಇದರಿಂದ ನನ್ನ ಮಡಿಲಿನ ಮಕ್ಕಳು ಅನುಭವಿಸಿದ ನೋವನ್ನು ನಿಮಗೆ ಹೇಳಲೇಬೇಕು.
  section: story
- id: story-n10
  type: prose
  text: ನನ್ನ ಮಕ್ಕಳ ಈ ಸಾಹಸವನ್ನು ತಿಳಿದ ಬ್ರಿಟಿಷ್ ಅಧಿಕಾರಿಗಳು ಕೋಪಗೊಂಡರು. ತಾಲ್ಲೂಕಿನ ಅಮಲ್ದಾರರು, ಪೊಲೀಸ್ ಅಧಿಕಾರಿ ಮತ್ತು ಸಿಬ್ಬಂದಿಯೊಂದಿಗೆ
    ಗ್ರಾಮಕ್ಕೆ ದಾಳಿಯಿಟ್ಟರು. ಬ್ರಿಟಿಷ್ ಅಧಿಕಾರಿಗಳು ಗ್ರಾಮ ಪ್ರವೇಶಿಸದಂತೆ ಜನರು ಪ್ರತಿಭಟಿಸಿದರು. ಕೋಪಗೊಂಡ ಅಧಿಕಾರಿಗಳು ನಿರಾಯುಧ
    ಜನರ ಮೇಲೆ ಲಾಠಿ ಬೀಸಿದರು. ಸಿಕ್ಕವರನ್ನೆಲ್ಲ ಚಚ್ಚಿದರು.
  section: story
- id: story-n11
  type: prose
  text: ರೊಚ್ಚಿಗೆದ್ದ ಜನರ ಪ್ರತಿಭಟನೆ ಹೆಚ್ಚಾಯಿತು. “ಏಸೂರು ಕೊಟ್ಟರೂ ಈಸೂರು ಬಿಡೆವು” ಎಂಬ ಘೋಷಣೆ ಮತ್ತೊಮ್ಮೆ ಮುಗಿಲು ಮುಟ್ಟಿತು.
    ಪೊಲೀಸರು ತಾಳ್ಮೆ ಕಳೆದುಕೊಂಡು, ಜನರ ಮೇಲೆ ಗುಂಡು ಹಾರಿಸಿದರು. ರೊಚ್ಚಿಗೆದ್ದ ನಮ್ಮ ಜನರು ಅವರ ಮೇಲೆ ಮುಗಿಬಿದ್ದರು. ಅಮಲ್ದಾರ ಚನ್ನಕೃಷ್ಣಪ್ಪ
    ಮತ್ತು ಪೊಲೀಸ್ ಅಧಿಕಾರಿ ಕೆಂಚೇಗೌಡ ಸತ್ತರು.
  section: story
- id: story-n12
  type: prose
  text: ಬ್ರಿಟಿಷ್ ಸರ್ಕಾರಕ್ಕೆ ವಿಷಯ ಮುಟ್ಟಿತು. ಹೆಚ್ಚಿನ ಪೊಲೀಸ್ ಮತ್ತು ಸೈನ್ಯದಳವನ್ನು ಕಳಿಸಿ ಈಸೂರನ್ನು ಲೂಟಿ ಮಾಡಿಸಿತು. ಹೆಂಗಸರು
    ಮಕ್ಕಳೆನ್ನದೆ ಅನೇಕರು ಚಿತ್ರಹಿಂಸೆಗೆ ಗುರಿಯಾದರು. ಸರ್ಕಾರದ ವಿರುದ್ಧ ಬಂಡೆದ್ದರೆಂದು ಹಲವರ ವಿರುದ್ಧ ಮೊಕದ್ದಮೆ ಹೂಡಲಾಯಿತು. ಮುಂದೆ
    ಆ ವೀರರಲ್ಲಿ ಐವರು ಮರಣದಂಡನೆಗೆ ಗುರಿಯಾದರು.
  section: story
- id: story-n13
  type: prose
  text: ನನ್ನ ಜನರ ಸ್ವಾತಂತ್ರ್ಯ ಪ್ರೇಮ ಹಾಗೂ ಮಕ್ಕಳ ಧೈರ್ಯವು ಕನ್ನಡಿಗರ ಮನೆ ಮಾತಾಯಿತು. ಇಡೀ ಭಾರತದಲ್ಲೇ ಸ್ವಾತಂತ್ರ್ಯ ಪೂರ್ವದಲ್ಲಿ
    ಮೊಟ್ಟ ಮೊದಲಿಗೆ ‘ಸ್ವತಂತ್ರ ಹಳ್ಳಿ’ ಎಂಬ ಹೆಸರನ್ನು ಪಡೆದ ನಾನೇ ಧನ್ಯ.
  section: story
