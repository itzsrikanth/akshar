- id: ex-l-p4
  type: prose
  text: 'ಹಿಂದೂಸ್ಥಾನಿ: ಟೋಪಿ, ಗಡಿಯಾರ, ಗಾಡಿ, ಗಿರಾಕಿ, ಗಾಬರಿ.'
  exercise: L
- id: ex-l-p5
  type: prose
  text: 'ನಿನಗಿದು ತಿಳಿದಿರಲಿ: ಒಂದು ಭಾಷೆಯ ಮೂಲ ಪದಗಳನ್ನು ದೇಶ್ಯ ಶಬ್ದಗಳೆಂದು, ಬೇರೆ ಭಾಷೆಗಳಿಂದ ತೆಗೆದುಕೊಂಡ ಶಬ್ದಗಳನ್ನು ಅನ್ಯದೇಶ್ಯ
    ಶಬ್ದಗಳೆಂದು ಕರೆಯುವರು.'
  exercise: L
- id: ex-m-p1
  type: prose
  text: ನುಡಿಗಟ್ಟುಗಳ ಅರ್ಥ ತಿಳಿ.
  exercise: M
- id: ex-m-p2
  type: prose
  text: ಎತ್ತಿದ ಕೈ — ಪ್ರವೀಣ; ನಿಪುಣ
  exercise: M
- id: ex-m-p3
  type: prose
  text: ಕಬ್ಬಿಣದ ಕಡಲೆ — ಕಠಿಣವಾದ ವಿಷಯ
  exercise: M
- id: ex-m-p4
  type: prose
  text: ತಲೆ ಹಾಕು — ಮಧ್ಯೆ ಪ್ರವೇಶಿಸು
  exercise: M
- id: ex-m-p5
  type: prose
  text: ಎಳ್ಳಷ್ಟು — ಅತ್ಯಲ್ಪ
  exercise: M
- id: ex-m-p6
  type: prose
  text: ರೈಲುಬಿಡು — ಸುಳ್ಳು ಹೇಳು
  exercise: M
- id: ex-m-p7
  type: prose
  text: ಕಾಲುತೆಗೆ — ಹೊರಡು
  exercise: M
- id: ex-n-p1
  type: prose
  text: ವಾಕ್ಯದಲ್ಲಿನ ಬಿಟ್ಟ ಸ್ಥಳವನ್ನು ಹಿಂದೆ ಕೊಟ್ಟಿರುವ ನುಡಿಗಟ್ಟುಗಳಲ್ಲಿ ಸೂಕ್ತವಾದುದನ್ನು ಆರಿಸಿ ಬರೆದು ವಾಕ್ಯ ಪೂರ್ಣ ಮಾಡು.
  exercise: N
- id: ex-n-q1
  type: fill_blank
  text: ರಾಜು ಕೆಲಸ ಮಾಡುವುದರಲ್ಲಿ ___
  exercise: N
- id: ex-n-q2
  type: fill_blank
  text: ಅವರು ಮಾತನಾಡುವಾಗ ನಾನು ಅನವಶ್ಯಕವಾಗಿ ___
  exercise: N
- id: ex-n-q3
  type: fill_blank
  text: ಕೆಲವರು ತಮಗೆ ಗೊತ್ತಿಲ್ಲದಿದ್ದರೂ ಸುಮ್ಮನೆ ___
  exercise: N
- id: ex-n-q4
  type: fill_blank
  text: ಅಮ್ಮ ಕೆಲಸ ಹೇಳಿದರೆ ನನ್ನ ತಮ್ಮ ___
  exercise: N
- id: ex-n-p2
  type: prose
  text: 'ನಿನಗಿದು ತಿಳಿದಿರಲಿ: ನುಡಿಗಟ್ಟು ಎಂದರೆ ವಿಶಿಷ್ಟವಾದ ಮಾತಿನ ಜೋಡಣೆ.'
  exercise: N
- id: ex-n-q5
  type: question
  text: ವೃತ್ತ ಪತ್ರಿಕೆಯಲ್ಲಿರುವ ಮುದ್ರಿತ ಅಕ್ಷರಗಳು, ದಪ್ಪ ಅಕ್ಷರಗಳು, ಸಣ್ಣ ಅಕ್ಷರಗಳು, ಪದಗಳನ್ನು ಕತ್ತರಿಸಿ ಅಂಟಿಸುವುದು.
  exercise: N
