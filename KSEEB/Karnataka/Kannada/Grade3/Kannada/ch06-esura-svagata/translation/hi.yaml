ex-k-p1: 'याद रखो: एक का बोध कराने वाले शब्द एकवचन हैं।'
ex-k-p2: एक से अधिक का बोध कराने वाले और आदर-सूचक शब्द बहुवचन हैं।
ex-l-p1: दूसरी भाषाओं से लिए गए ये शब्द पढ़कर जानो।
ex-l-p2: 'अरबी शब्द: खाता-किर्दि, अमलदार, मुकदमा, कचहरी, कुर्सी।'
ex-l-p3: 'अंग्रेज़ी: स्कूटर, बाल्टी (बकेट), निकर, पैंट, बैंक।'
ex-l-p4: 'हिंदुस्तानी: टोपी, घड़ी, गाड़ी, ग्राहक, घबराहट।'
ex-l-p5: 'याद रखो: किसी भाषा के मूल शब्द देशज और दूसरी भाषाओं से लिए गए शब्द विदेशी शब्द कहलाते हैं।'
ex-m-p1: मुहावरों के अर्थ जानो।
ex-m-p2: उठा हुआ हाथ — प्रवीण, कुशल
ex-m-p3: लोहे का चना — कठिन विषय
ex-m-p4: सिर डालना — बीच में दखल देना
ex-m-p5: तिल भर — बहुत थोड़ा
ex-m-p6: रेल छोड़ना — झूठ बोलना
ex-m-p7: पाँव उठाना — निकलना
ex-n-p1: ऊपर दिए मुहावरों में से सही मुहावरा चुनकर खाली स्थान भरो और वाक्य पूरा करो।
ex-n-q1: राजू काम करने में ___।
ex-n-q2: जब वे बात कर रहे थे, मैंने अनावश्यक रूप से ___।
ex-n-q3: कुछ लोग जानकारी न होने पर भी यूँ ही ___।
ex-n-q4: माँ काम करने को कहे तो मेरा छोटा भाई ___।
ex-n-p2: 'याद रखो: मुहावरा शब्दों का विशेष संयोजन है।'
ex-n-q5: समाचार-पत्र से छपे अक्षर, मोटे अक्षर, छोटे अक्षर और शब्द काटकर चिपकाओ।
