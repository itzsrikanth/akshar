competency: अक्षरों और शब्दों को सही बनावट, क्रम और उचित अंतर के साथ लिखना।
intro-1: तुम विद्यार्थी हो। तुम्हारे पास अपनी कुछ चीज़ें हैं ना? कोई उन्हें छीनने आए तो उनकी रक्षा कौन करे? क्यों
  करे? तुम उनकी रक्षा कैसे करोगे?
intro-2: कोई तुम्हारा घर, खेत या दूसरी चीज़ें छीनने आए तो तुम क्या करोगे?
intro-3: कोई तुम्हारे गाँव को नुकसान पहुँचाने आए तो उसकी रक्षा कौन करे? इस बारे में यहाँ दिए संघर्ष को समझो।
story-n1: “चाहे कितने गाँव दे दें, ईसूरु नहीं छोड़ेंगे।”
story-n2: सुने ना मेरे बच्चों के बहादुरी भरे शब्द! क्या? जानना चाहते हो कि मैं कौन हूँ? सुनो, मैं ईसूरु गाँव हूँ।
  मैं शिवमोग्गा ज़िले के शिकारिपुर तालुक में, कुमुद्वती नदी के दाएँ किनारे पर हूँ। मेरी गोद के बच्चे स्वतंत्रता-प्रेमी
  थे। उन्होंने अपनी सरकार बनाकर अंग्रेज़ों से संघर्ष किया और अपने प्रदेश का नाम रोशन किया।
story-n3: वह अंग्रेज़ों के शासन का समय था। उनके गुलाम बनकर हमें बहुत दुख और अत्याचार सहने पड़ते थे। भारतीयों में
  अंग्रेज़ों को भारत से निकालकर स्वतंत्र होने का संकल्प जगा। महात्मा गांधी ने “अंग्रेज़ो, भारत छोड़ो” आंदोलन शुरू
  किया।
story-n4: इससे प्रेरित मेरे लोगों ने ब्रिटिश सरकार को कर न देने का आंदोलन किया। उन्होंने लोगों से अधिकारियों से
  न डरने को कहा और सरकारी अधिकारियों तथा दफ़्तरों के विरुद्ध नारे लगाए। 25 सितंबर 1942 को उन्होंने ब्रिटिश सत्ता
  को चुनौती दी। “चाहे कितने गाँव दे दें, ईसूरु नहीं छोड़ेंगे” का नारा आकाश में गूँजा। उन्होंने मुझे “स्वतंत्र गाँव”
  घोषित किया और अपनी सरकार बनाकर गाँव चलाने का संकल्प लिया।
story-n5: अगले दिन ब्रिटिश अधिकारी पटेल चन्नबसवय्या और ग्राम लेखाकार रंगनाथ राव राजस्व वसूलने आए। बहीखाते लेकर आए
  अधिकारियों का युवा आंदोलनकारियों ने विरोध किया। उन्होंने कहा, “इस्तीफ़ा दीजिए और गांधी टोपी पहनिए।” बहस हुई। अधिकारी
  नहीं माने तो आंदोलनकारियों ने उनके बहीखाते छीन लिए। अधिकारी हार गए और किताबें वापस लिए बिना लौटे।
story-n6: संघर्ष यहीं नहीं रुका। 27 सितंबर 1942 की शाम गाँववालों ने वीरभद्र मंदिर के सामने आँगन में फहराए ध्वज के
  नीचे गुप्त बैठक की। उन्होंने भविष्य के नागरिकों, बच्चों को शामिल करके अपनी सरकार बनाई और मेरी रक्षा में जुट गए।
  साहुकार जयण्णा को अमलदार और मल्लप्पय्या को पुलिस अधिकारी बनाया। दूसरे बच्चे भी उनसे जुड़ गए।
story-n7: 'गाँव के मुख्य द्वार पर उन्होंने तख्ती टाँगी: “गैरज़िम्मेदार सरकारी अधिकारियों का ईसूरु में प्रवेश वर्जित
  है।” वहीं दफ़्तर शुरू किया। देखा तुमने मेरे बच्चों का साहस?'
story-n8: पटेल चन्नबसवय्या और रंगनाथ राव बहीखाते लेने फिर आए। बच्चों की नई सरकार के अधिकारियों ने उन्हें रोका। उन्हें
  इस्तीफ़ा देकर गांधी टोपी पहनने और नई सरकार में काम करने का आदेश दिया। वे नहीं माने। उन पर पचास रुपये का जुर्माना
  लगाया गया। जुर्माना न देने पर उन्हें तीन घंटे एक पैर पर खड़ा रहने की सज़ा दी गई।
story-n9: इसके कारण मेरे बच्चों ने जो दुख सहे, वे तुम्हें बताने ही होंगे।
story-n10: बच्चों के इस साहस से ब्रिटिश अधिकारी क्रोधित हो गए। तालुक के अमलदार ने पुलिस अधिकारी और कर्मचारियों के
  साथ गाँव पर धावा बोला। लोगों ने उनका प्रवेश रोकने के लिए विरोध किया। क्रोधित अधिकारियों ने निहत्थे लोगों पर लाठियाँ
  चलाईं। जो मिला, उसे पीटा।
story-n11: क्रोधित लोगों का विरोध बढ़ा। “चाहे कितने गाँव दे दें, ईसूरु नहीं छोड़ेंगे” का नारा फिर गूँजा। पुलिस ने
  धैर्य खोकर लोगों पर गोली चलाई। क्रोधित गाँववाले उन पर टूट पड़े। अमलदार चन्नकृष्णप्प और पुलिस अधिकारी केंचेगौड़ा
  की मृत्यु हो गई।
story-n12: ब्रिटिश सरकार तक खबर पहुँची। उसने और पुलिस तथा सैनिक भेजकर ईसूरु को लुटवाया। महिलाओं और बच्चों सहित अनेक
  लोगों को यातनाएँ दी गईं। सरकार के विरुद्ध विद्रोह करने पर कई लोगों पर मुकदमे चले। बाद में उन वीरों में से पाँच
  को मृत्युदंड दिया गया।
story-n13: मेरे लोगों का स्वतंत्रता-प्रेम और बच्चों का साहस कन्नड़भाषियों के घर-घर में प्रसिद्ध हुआ। स्वतंत्रता
  से पहले पूरे भारत में सबसे पहले “स्वतंत्र गाँव” कहलाकर मैं धन्य हुआ।
