competency: Aksharagalannu mattu padagalannu sariyaada vinyaasa, anukramanike haagoo sookta antaradondige bareyuvudu.
intro-1: Neenu vidyaarthi. Ninnalli ninnade aada kelavu vastugalive allave? Ninna vastugalannu yaaraadaroo kasidukollalu
  bandare adannu yaaru rakshisabeku? Eke rakshisabeku? Hege rakshisikolluve?
intro-2: Nimma mane, hola mattitara saamagrigalannu yaaraadaroo kasidukollalu bandare neenu enu maaduve?
intro-3: Nimma oorige yaaraadaroo kedu maadalu bandare oorannu yaaru rakshisabeku? Ee bagge illina horaatavannu
  gamanisu.
story-n1: “Esooru kottaroo eesooru bidevu”
story-n2: Kelidiralla! Nanna madila makkala dheera maatugalanna. Enu? Naanu yaarendu tiliyuva kutoohalave? Keli
  naanu eesooru emba graama. Naanu shivamogga jille shikaaripura taallookinalliddene. Kumudvati nadiya baladandeya
  meliruva nanna madilina makkalu tammade sarkaara rachisikondu britishara viruddha horaadida svaatantrya premigalu,
  naadige keerti tandavaru.
story-n3: Nammannu britisharu aaluttidda kaala. Naavu avara gulaamaraagi, tumbaa novu, hinse anubhavisabekaagittu.
  Britisharannu bhaaratadinda odisabeku, naavu svatantraraagabeku emba chhala bhaarateeyaralli mooditu. Mahaatma
  gaandhiyavaru “Britishare, bhaarata bittu tolagi” emba chaluvali aarambhisidaru.
story-n4: Idarinda preritaraada nanna janate british sarkaarakke terige kodadante chaluvali nadesidaru. Adhikaarigalige
  hedaradante janarige kare kottaru. Sarkaari adhikaarigalige, kachherigalige dhikkaara koogidaru. 25 septambar
  1942randu british sarkaarada adhikaaravannu dhikkarisidaru. “Esooru kottaroo eesooru bidevu” emba janara ghoshane
  mugilu muttitu. Nannannu ‘svatantra halli’ endu saaridaru. Tammade aada sarkaara rachisikondu graamada aadalita
  nadesalu panatottaru.
story-n5: Marudina british sarkaari adhikaarigalaada patel channabasavayya mattu shaanubhoga ranganaatharaav kandaayada
  vasoolige nannallige bandaru. Khaate-kirdi pustakagalondige kandaaya vasoolige banda adhikaarigalannu horaatagaara
  yuvakaru virodhisidaru. “Raajeenaame kodi, gaandhi topi dharisi” endu vinantisidaru. Maatina chakamaki nadeyitu.
  Vinantige oppada adhikaarigalinda horaatagaararu khaate-kirdi pustakagalannu kasidukondaru. Adhikaarigalu sotaru.
  Taavu tanda pustakagalannu padeyalaagade hindirugidaru.
story-n6: Horaata allige nillalilla. 1942 septambar 27 randu sanje graamastharu veerabhadra devasthaanada mundina
  angaladalli haarisidda dhvajada kelage gupta sabhe nadesidaru. Bhavishyada prajegalaada makkalannu olagonda tammade
  sarkaaravannu rachisi nanna rakshanege nintaru. Makkalaada saahukaar jayannanannu amaldaaranannaagiyoo, mallappayyanannu
  polees adhikaariyannaagiyoo nemisidaru. Ivarondige itare makkaloo serikondaru.
story-n7: Oorina agase baagilinalli “Bejavaabdaari sarkaari adhikaarigalige eesoorinalli praveshavilla” emba phalakavannu
  tooguhaakidaru. Alle kachheriyannu praarambhisidaru. Gamanisidiraa nanna madilina makkala saahasavannu?
story-n8: Khaate-kirdi pustakavannu padeyalu patel channabasavayya mattu shaanubhoga ranganaatharaav matte bandaru.
  Makkalinda rachaneyaada hosa sarkaarada adhikaarigalu avaribbarannu tadedaru. Raajeenaame kottu, gaandhi topi
  haakikondu, taavu rachisida sarkaaradalli kelasa maadabekendu avarige aajnye maadidaru. Idakke avaru oppalilla.
  Avarige aivattu roopaayi danda vidhisalaayitu. Danda kattada avarige mooru gante kaala onti kaalinalli nilluvante
  shikshe vidhisalaayitu.
story-n9: Idarinda nanna madilina makkalu anubhavisida novannu nimage helalebeku.
story-n10: Nanna makkala ee saahasavannu tilida british adhikaarigalu kopagondaru. Taallookina amaldaararu, polees
  adhikaari mattu sibbandiyondige graamakke daaliyittaru. British adhikaarigalu graama praveshisadante janaru pratibhatisidaru.
  Kopagonda adhikaarigalu niraayudha janara mele laathi beesidaru. Sikkavarannella chachchidaru.
story-n11: Rochchigedda janara pratibhatane hechchaayitu. “Esooru kottaroo eesooru bidevu” emba ghoshane mattomme
  mugilu muttitu. Poleesaru taalme kaledukondu, janara mele gundu haarisidaru. Rochchigedda namma janaru avara mele
  mugibiddaru. Amaldaara channakrushnappa mattu polees adhikaari kenchegauda sattaru.
story-n12: British sarkaarakke vishaya muttitu. Hechchina polees mattu sainyadalavannu kalisi eesoorannu looti maadisitu.
  Hengasaru makkalennade anekaru chitrahinsege guriyaadaru. Sarkaarada viruddha bandeddarendu halavara viruddha
  mokaddame hoodalaayitu. Munde aa veeraralli aivaru maranadandanege guriyaadaru.
story-n13: Nanna janara svaatantrya prema haagoo makkala dhairyavu kannadigara mane maataayitu. Idee bhaaratadalle
  svaatantrya poorvadalli motta modalige ‘svatantra halli’ emba hesarannu padeda naane dhanya.
