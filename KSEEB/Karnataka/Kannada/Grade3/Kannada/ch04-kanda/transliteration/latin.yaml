ex-b-q1-ans: Kudihanga
ex-b-q2: Aadi baa nana kanda angaala ________
ex-b-q2-ans: Toledena
ex-b-q3: Koosu idda manige beesanige ________
ex-b-q3-ans: Yaataka
ex-b-q4: Kandaana kirikiri indenu ________
ex-b-q4-ans: Heelali

# ── ಅಭ್ಯಾಸ ಇ)
ex-c-q1: Koosu idda manege beesanige beda. Eke?
ex-c-q1-ans: >-
  Koosu olage horage aaduttiddare saaku, adarindalee gaali beesidante aaguttade. Addarinda
  koosu idda manege beesanigeya agatyavilla.
ex-c-q2: Aadi baruva kandanannu taayi hege upacharisuvalu?
ex-c-q2-ans: >-
  Aadi baruva kandana angaalannu taayi tenginakaayi tilineerininda toleyuttaale. Adee
  neerininda avana bangaaradantaha mukhavannoo toleyuttaale.

