# ── ಸಾಮರ್ಥ್ಯ
competency: Uktalekhanada moolaka aparichita padagalannu bareyuvudu.

# ── ಪ್ರವೇಶ
intro-1: Maneyalli appa, amma, ajja, ajji mattitararu makkalannu preeti maatugalinda muddisuvudannu neenu nodirabahudu.
intro-2: Adee reeti ninnannoo muddu maadirabahudu nenapisiko.
intro-3: Illi preeti maatugalinda muddisuva sandarbhavide.
intro-4: Adannu ninna anubhavadondige hondisi nodu.

# ── ಪದ್ಯ: ಕಂದ
poem-s1l1: Koosu idda manige beesanige yaataka koosu kandayya ola horaga.
poem-s1l2: Aadidara beesanige gaali suliidaava.

poem-s2l1: Aadi baa nana kanda angaala toledena tengina kaayi tilineera.
poem-s2l2: Takkondu bangaara maari toledena.

poem-s3l1: Aluva kandana tutiyu havalada kudihanga kudihubbu bevinesalanga.
poem-s3l2: Kanota Shivana kaiyalagu holeddanga.

poem-s4l1: Kandaana kirikiri indenu heelali bindige haalu surivanda.
poem-s4l2: Chanjeeya 'chandramana tandu nilisendaa.

