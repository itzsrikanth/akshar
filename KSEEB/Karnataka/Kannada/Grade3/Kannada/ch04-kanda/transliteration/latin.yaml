# ── ಟಿಪ್ಪಣಿ
note-beesanige: Beesanige
note-beesanige-def: Gaali beesikollalu balasuva saadhana.
note-havala: Havala
note-havala-def: >-
  Ondu jaatiya kempu bannada mani, navaratnagalalli ondu. (Vajra, maanikya, marakata,
  pushyaraaga, neela, gomedhika, vaidoorya, muttu, havala)

# ── ಅಭ್ಯಾಸ ಅ)
ex-a-q1: Taayiyu kandana angaalannu yaavudarinda toleyuvudaagi heluttaale?
ex-a-q1-ans: Kandana angaalannu tenginakaayi tilineerininda toleyuvudaagi heluttaale.
ex-a-q2: Aluva kandana tutiyannu yaavudakke holisalaagide?
ex-a-q2-ans: Aluva kandana tutiyannu havalada kudige holisalaagide.
ex-a-q3: Aluva kandana kanota hegiruttade?
ex-a-q3-ans: Aluva kandana kanota Shivana kaiyalaginante holeyuttade.
ex-a-q4: Magu enannu tandu nillisendu keluttade?
ex-a-q4-ans: Magu sanjeya chandramanannu tandu nillisendu keluttade.

# ── ಅಭ್ಯಾಸ ಆ)
