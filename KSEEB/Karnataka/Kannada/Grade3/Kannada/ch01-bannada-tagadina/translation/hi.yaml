# ── ಅಭ್ಯಾಸ ಅ)
ex-a-q1: कस्तूरी ने क्या खरीदा?
ex-a-q1-ans: कस्तूरी ने रंग-बिरंगी टीन की तुरही खरीदी।
ex-a-q2: कस्तूरी ने तुरही कहाँ बजाई?
ex-a-q2-ans: कस्तूरी ने तालाब के पास तुरही बजाई।
ex-a-q3: कस्तूरी ने तुरही कब बजाई?
ex-a-q3-ans: कस्तूरी ने शाम को तुरही बजाई।
ex-a-q4: "'घमंडी मुर्गा' कौन है?"
ex-a-q4-ans: "'घमंडी मुर्गा' कस्तूरी खुद है।"
ex-a-q5: घमंडी मुर्गे को दुःख क्यों हुआ?
ex-a-q5-ans: "तुरही पानी में फिसलकर बर्बाद हो गई, इसलिए घमंडी मुर्गे को दुःख हुआ।"
ex-a-q6: तुरही का क्या हुआ?
ex-a-q6-ans: "तुरही पानी में फिसल गई, उसका रंग उतर गया और वह बर्बाद हो गई।"

# ── ಅಭ್ಯಾಸ ಆ)
ex-b-q1: रंग-बिरंगी टीन की ________
ex-b-q1-ans: तुरही
ex-b-q2: कस्तूरी ________ में चला
ex-b-q2-ans: गली
ex-b-q3: पानी में ________
ex-b-q3-ans: फिसल गई
ex-b-q4: रंग-बिरंगी तुरही ________
ex-b-q4-ans: बर्बाद हो गई

# ── ಅಭ್ಯಾಸ ಇ) passage
ex-c-p1: बीरूरु में रामण्णा नाम का एक लकड़हारा (लकड़ी बेचने वाला) रहता था।
ex-c-p2: वह बहुत गरीब था।
ex-c-p3: वह हर सुबह जंगल जाकर सूखी लकड़ी काटकर लाता था।
ex-c-p4: वह बाज़ार में लकड़ी बेचकर अपना जीवन चलाता था।
ex-c-p5: उसने कभी भी हरा (जीवित) पेड़ नहीं काटा था।
ex-c-p6: "इसी गुण के कारण वनदेवी ने उसे अक्षय पात्र (कभी न खाली होने वाला पात्र) दिया।"
ex-c-p7: इससे रामण्णा धनवान बन गया।

ex-c-q1: रामण्णा कौन है?
ex-c-q1-ans: रामण्णा बीरूरु का एक लकड़हारा है।
ex-c-q2: रामण्णा कहाँ रहता था?
ex-c-q2-ans: बीरूरु
ex-c-q3: रामण्णा जंगल कब जाता था?
ex-c-q3-ans: हर सुबह
ex-c-q4: वनदेवी ने रामण्णा को अक्षय पात्र क्यों दिया?
ex-c-q4-ans: क्योंकि उसने कभी हरा (जीवित) पेड़ नहीं काटा था।
