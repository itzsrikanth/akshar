# ── ಸಾಮರ್ಥ್ಯ
competency: "पाठ पढ़ने के बाद कौन? कब? कहाँ? क्या? क्यों? इन प्रश्नों के उत्तर देना."

# ── ಪ್ರವೇಶ
intro-1: "खुशी, दुःख, दर्द — ये अनुभव तुम्हें भी हुए होंगे, है ना?"
intro-2: अपने एक अनुभव को याद करो.
intro-3: "उसके पीछे कोई कारण भी होगा, है ना?"
intro-4: अब यहाँ दी गई घटना को ध्यान से देखो.
intro-5: खुशी और दुःख का कारण बनी परिस्थितियों को पहचानो.

# ── ಕವನ: ಬಣ್ಣದ ತಗಡಿನ ತುತ್ತೂರಿ
poem-s1l1: "रंग-बिरंगी टीन की तुरही,"
poem-s1l2: कस्तूरी ने एक सिक्के में खरीदी।
poem-s1l3: "उसने सा-रि-ग-म-प-द-नि-सा (आरोही स्वर) बजाई,"
poem-s1l4: उसने सा-नि-द-प-म-ग-रि-सा (अवरोही स्वर) बजाई।

poem-s2l1: "उसने घमंड से कहा कि तुरही सिर्फ़ उसी के पास है,"
poem-s2l2: और किसी के पास नहीं है, ऐसा कहा।
poem-s2l3: "कस्तूरी गली में इतराते हुए चला,"
poem-s2l4: घमंडी मुर्गे की तरह।

poem-s3l1: "तालाब के पास तुरही बजाते हुए,"
poem-s3l2: कस्तूरी शाम को चला।
poem-s3l3: तुरही पानी में फिसल गई,
poem-s3l4: "उसका गला रुँध गया, आँखों में पानी भर आया।"

poem-s4l1: "उसने फिर से सा-रि-ग-म बजाने की कोशिश की,"
poem-s4l2: पर सिर्फ़ ग-ग-ग-ग जैसी गड़गड़ाहट की आवाज़ आई।
poem-s4l3: "रंग पानी में धुल गया,"
poem-s4l4: रंग-बिरंगी तुरही बेरंग हो गई।

poem-s5l1: "रंग-बिरंगी तुरही बर्बाद हो गई,"
poem-s5l2: घमंडी मुर्गे को दुःख हुआ।

