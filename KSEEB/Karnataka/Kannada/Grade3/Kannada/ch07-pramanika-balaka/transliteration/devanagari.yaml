competency: पठ्यदल्लिन मुख्य विषयवन्नु गुरुतिसुवुदु. एके एंब प्रश्नेगे उत्तरिसुवुदु.
intro-1: 'ई चित्रगळल्लिरुव व्यक्तिगळन्नु गुरुतिसु. ई महनीयरु देशक्कागि मत्तु समाज सेवेगागि होराडिदवरु. [संपादकीय
  चित्र उल्लेख: 3rd_KANNADA_FL_Part_1_2026-27.pdf, मुद्रित पुट 48, PDF पुट 61 (1रिंद एणिके), प्रवेश भागद भावचित्रगळु.]'
intro-2: इवर बाल्यवन्नु हिंतिरुगि नोडिदरे सहज तुंटाटद नडुवे केलवु आदर्शद गुणगळु कंडुबरुत्तवे. आदर्श गुणगळन्नु मैगूडिसिकोंडु
  बेळेद ओब्ब नेतारन बाल्य मत्तु बदुकन्नु तिळियोण.
story-n1: शालेय गंटे बारिसितु. शालेयिंद होर बंद मक्कळेल्ल मनेयत्त होरटरु. दारिबदिय माविन तोपिनल्लि बेळेदु पक्ववागिद्द
  माविन हण्णुगळु मक्कळन्नु आकर्षिसिदवु. हण्णु तिन्नुव आसेयिंद मक्कळु तोपन्नु प्रवेशिसिदरु.
story-n2: केलवरु मरवन्नेरिदरे मत्ते केलवरु कल्लु बीसिदरु. सिक्क हण्णुगळन्नु खुषियिंद हंचिकोंडु तिन्नतोडगिदरु. आग
  मक्कळ गद्दल केळिद तोटद मालीक धाविसि बंदनु. अनिरीक्षितवागि बंद अवनन्नु कंडु मक्कळु गलिबिलिगोंडु चल्लापिल्लियागि
  ओडिदरु.
story-n3: आदरे ओब्ब हुडुग मात्र ओडदे अल्लिये निंत. हत्तिर बंद मालीक हुडुगनन्नु हिडिदु
story-d1: निन्न अप्प, अम्म, गुरुगळु इदन्ने एनु निनगे कलिसिद्दु?
story-n10: एंदु गदरिसिद. हुडुग अळतोडगिद. आग मालीक
story-d2: एके अळुवे? नानेनु निनगे होडेदेने?
story-n4: एंदनु. अदक्के बालक विनयदिंद
story-d3: नानु माडिद्दु तप्पु. इन्नेंदू इंतह तप्पन्नु माडुवुदिल्ल. आदरे नानु माडिद तप्पिगे नन्न तंदे, तायि मत्तु
  गुरुगळु निंदनेगे गुरियादरल्ला एंदु दुःखिसुत्तिरुवे.
story-n11: एंदनु.
story-n5: बालकन मुग्ध हागू प्रामाणिक मातुगळन्नु केळि मालीकन मनस्सु करगितु. आग मालीक
story-d4: मगु, निन्न तप्पन्नु नीनु ओप्पिकोंडिरुवे. निन्न प्रामाणिकते ननगे इष्टवायितु. तप्पन्नु अरियुव, तिद्दिकोळ्ळुव
  निन्न ई गुण, निन्नन्नु दोड्ड व्यक्तियन्नागि माडुत्तदे.
story-n12: एंदु हेळि मत्तष्टु माविनहण्णुगळन्नु नीडि समाधानपडिसि कळुहिसिद. हीगे तन्न प्रामाणिकतेयिंद मालीकन मनस्सन्नु
  गेद्द आ बालकने लाल् बहद्दूर् शास्त्रि.
story-n6: अदु भारतद स्वातंत्र्य होराटद काल. स्वातंत्र्यक्कागि गांधीजियवर नेतृत्वदल्लि नडेद चळुवळिगळु शास्त्रियवरन्नु
  आकर्षिसिदवु. देशप्रेम अवरल्लि पुटिदेद्दितु. आग गांधीजियवर ओडनाटदल्लि शास्त्रियवरु अनेक चळुवळिगळल्लि पाल्गोंडरु.
  अंतू 1947 आगस्ट् 15रंदु भारत देश स्वतंत्र देशवायितु.
story-n7: स्वतंत्र भारतद प्रथम प्रधानियाद जवाहर्लाल् नेहरु अवर मंत्रिमंडलदल्लि रैल्वे मंत्रियागि शास्त्रियवरु कार्य
  निर्वहिसिदरु. आ समयदल्लि रैल्वे अपघातवोंदक्के तावे होणे होत्तु तप्पु तम्मदल्लदिद्दरू मंत्रि पदविगे राजीनामे कोट्टु
  धीमंतिके मेरेद इवरु नेहरूरवर नंतर देशद प्रधानियागि सेवे सल्लिसिदरु.
story-n8: केवल हदिनेंटु तिंगळ अवधियल्लि तम्म प्रामाणिकते हागू देशप्रेमद नडवळिकेगळिंद देशदेल्लेडे मनेमातादरु.
story-n9: शास्त्रियवरु दक्ष आडळितगाररागि, शांतिदूतरागि, देश प्रेमिगळागि देशद कीर्तिपताके हारिसिदरु. इवरु नीडिद ‘जै
  जवान् जै किसान्’ एंब घोषवाक्य जनमनदल्लि उळियितु. इवर सेवेगे भारत सर्कारवु ‘भारतरत्न’ प्रशस्ति नीडि गौरविसितु.
