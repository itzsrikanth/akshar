ex-a-q1: Tangiyu yaava langa haakikondiddalu?
ex-a-q2: Gelatiya jote tangi kerige horatiddu eke?
ex-a-q3: Appa danakarugalige enu kottaru?
ex-a-q4: Makkalannu haseyalli koorisi enu maaduvaru?
ex-a-q5: ‘sankraanti’ padyavannu bareda kaviya hesarenu?
ex-b-p1: '‘a’ pattiyalliruva vaakyagalannu ‘ba’ pattiyalliruva vaakyagalondige hondisi bare. ‘ba’: 1. Tangi kerigella;
  2. Akki-bella-hannu; 3. Makkaligachchu mechchu; 4. Langa haakikondu; 5. Kanna tumba nodi.'
ex-b-q1: Garimuri jarataari
ex-b-q2: Beerokanta horatiddaale
ex-b-q3: Rangenalli rangina gombe
ex-b-q4: Kichchanu haayisi koduvaru appa
ex-b-q5: Suriyuvaaga amma ajji
ex-c-p1: Pathyavannu aadharisi ee ghatanegalannu anukramavaagi gurutisi bare.
ex-c-q1: Makkalannu haseyalli koorisi, ellu-elachi-achchugalannu amma ajji suriyuvaru.
ex-c-q2: Putaani tangi tanna gelati jote ellu, bella beeralu horatalu.
ex-c-q3: Tangiyu garimuri jarataari langa haakikondalu.
ex-c-q4: Ettu hasu karugalannu kombu heredu bannava balidu shrungaara maadidaru.
ex-d-q1: Nimma maneyalli neenu belagge edda nantara shaalege hoguvavaregina naalku ghatanegalannu nenapisikondu,
  anukramavaagi bare.
ex-e-p1: 'Ninagidu tilidirali: ‘gandu’ emba artha baruva padagalige ‘pullinga’ endoo ‘hennu’ emba artha baruva padagalige
  ‘streelinga’ endoo haagoo ‘gandu’ ‘hennu’ emba eradoo artha barada padagalige ‘napunsakalinga’ endu hesaru.'
ex-e-p2: Kelagina vaakyagalannu aavaranadalli kottiruva soochanegalige anusaaravaagi bareyiri.
ex-e-q1: Hudugiyu tarakaariyannu tandalu. (Idannu pullinga roopadalli bare)
ex-e-q2: Raaju gaadiyannu eledanu. (‘raaju’ emba padada badalige ‘ettu’ emba pada balasi, vaakya rachisi)
ex-e-q3: Anna tammandiru snehitarante iddaru. (Idannu streelinga roopadalli bare.)
ex-f-q1: Kelage kottiruva padagalannu pullinga, streelinga, napunsaka lingagalaagi vingadisi bare. (Pustaka, raani,
  tamma, meju, gode, raaja, tangi, akka, tamma, shaale, anna, tangi, tande, taayi, sahodari, geleya, kurchi, gelati)
ex-g-q1: Sankraanti padyadalli baruva praasa padagalannu aarisi bare.
