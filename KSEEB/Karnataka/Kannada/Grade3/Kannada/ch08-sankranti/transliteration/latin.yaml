competency: Pathyavannu odi mukhya vishaya gurutisi ghatanegalannu anukramavaagi heluvudu.
intro-1: Habbagalu halavu. Prati habbada aacharaneyoo bhinna. Ondondu habbadalloo ondondu visheshate iruttade.
intro-2: Illi kottiruva habbada aacharaneya vivaragalannu tili. Neenu aacharisuva habbadondige holisi, vyatyaasagalannu
  geleyarondige hanchiko.
poem-s1l1: Habba bantu, habba bantu
poem-s1l2: Habba bantu habba!
poem-s1l3: Antoo intoo tande tantu
poem-s1l4: Kante kante kabba!
poem-s2l1: Garimuri jarataari
poem-s2l2: Langa haakikondu!
poem-s2l3: Giligili kaalagejje
poem-s2l4: Dani maadikondu!
poem-s3l1: Ellu, kabbu, sakre achchu
poem-s3l2: Baale hannu, bella!
poem-s3l3: Beerokanta horatiddaale
poem-s3l4: Tangi kerigella.
poem-s4l1: Horatiddaale putaani tangi
poem-s4l2: Tanna gelati jodi!
poem-s4l3: Rangenalli rangina gombi
poem-s4l4: Kanna tumba nodi!
poem-s5l1: Kombanu heredu, bannava balidu
poem-s5l2: Ettu-hasu-karuvannu!
poem-s5l3: Kichchanu haayisi koduvaru appa
poem-s5l4: Akki-bella-hannu!
poem-s6l1: Makkalanella haseyali koodisi
poem-s6l2: Ellu-elachi-achchu!
poem-s6l3: Suriyuvaaga amma ajji
poem-s6l4: Makkaligachchu mechchu!
vocab-biru: Beeru
