ex-a-q1: तंगियु याव लंग हाकिकोंडिद्दळु?
ex-a-q2: गेळतिय जोते तंगि केरिगे होरटिद्दु एके?
ex-a-q3: अप्प दनकरुगळिगे एनु कोट्टरु?
ex-a-q4: मक्कळन्नु हसेयल्लि कूरिसि एनु माडुवरु?
ex-a-q5: ‘संक्रांति’ पद्यवन्नु बरेद कविय हेसरेनु?
ex-b-p1: '‘अ’ पट्टियल्लिरुव वाक्यगळन्नु ‘ब’ पट्टियल्लिरुव वाक्यगळोंदिगे होंदिसि बरे. ‘ब’: 1. तंगि केरिगेल्ल; 2.
  अक्कि-बेल्ल-हण्णु; 3. मक्कळिगच्चु मेच्चु; 4. लंग हाकिकोंडु; 5. कण्ण तुंब नोडि.'
ex-b-q1: गरिमुरि जरतारि
ex-b-q2: बीरोकंत होरटिद्दाळे
ex-b-q3: रंगेनळ्ळि रंगिन गोंबे
ex-b-q4: किच्चनु हायिसि कोडुवरु अप्प
ex-b-q5: सुरियुवाग अम्म अज्जि
ex-c-p1: पठ्यवन्नु आधरिसि ई घटनेगळन्नु अनुक्रमवागि गुरुतिसि बरे.
ex-c-q1: मक्कळन्नु हसेयल्लि कूरिसि, एळ्ळु-एलचि-अच्चुगळन्नु अम्म अज्जि सुरियुवरु.
ex-c-q2: पुटाणि तंगि तन्न गेळति जोते एळ्ळु, बेल्ल बीरलु होरटळु.
ex-c-q3: तंगियु गरिमुरि जरतारि लंग हाकिकोंडळु.
ex-c-q4: एत्तु हसु करुगळन्नु कोंबु हेरेदु बण्णव बळिदु शृंगार माडिदरु.
ex-d-q1: निम्म मनेयल्लि नीनु बेळग्गे एद्द नंतर शालेगे होगुववरेगिन नाल्कु घटनेगळन्नु नेनपिसिकोंडु, अनुक्रमवागि बरे.
ex-e-p1: 'निनगिदु तिळिदिरलि: ‘गंडु’ एंब अर्थ बरुव पदगळिगे ‘पुल्लिंग’ एंदू ‘हेण्णु’ एंब अर्थ बरुव पदगळिगे ‘स्त्रीलिंग’
  एंदू हागू ‘गंडु’ ‘हेण्णु’ एंब एरडू अर्थ बरद पदगळिगे ‘नपुंसकलिंग’ एंदु हेसरु.'
ex-e-p2: केळगिन वाक्यगळन्नु आवरणदल्लि कोट्टिरुव सूचनेगळिगे अनुसारवागि बरेयिरि.
ex-e-q1: हुडुगियु तरकारियन्नु तंदळु. (इदन्नु पुल्लिंग रूपदल्लि बरे)
ex-e-q2: राजु गाडियन्नु एळेदनु. (‘राजु’ एंब पदद बदलिगे ‘एत्तु’ एंब पद बळसि, वाक्य रचिसि)
ex-e-q3: अण्ण तम्मंदिरु स्नेहितरंते इद्दरु. (इदन्नु स्त्रीलिंग रूपदल्लि बरे.)
ex-f-q1: केळगे कोट्टिरुव पदगळन्नु पुल्लिंग, स्त्रीलिंग, नपुंसक लिंगगळागि विंगडिसि बरे. (पुस्तक, राणि, तम्म, मेजु,
  गोडे, राज, तंगि, अक्क, तम्म, शाले, अण्ण, तंगि, तंदे, तायि, सहोदरि, गेळेय, कुर्चि, गेळति)
ex-g-q1: संक्रांति पद्यदल्लि बरुव प्रास पदगळन्नु आरिसि बरे.
