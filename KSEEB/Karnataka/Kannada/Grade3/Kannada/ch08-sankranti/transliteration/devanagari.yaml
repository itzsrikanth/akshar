competency: पठ्यवन्नु ओदि मुख्य विषय गुरुतिसि घटनेगळन्नु अनुक्रमवागि हेळुवुदु.
intro-1: हब्बगळु हलवु. प्रति हब्बद आचरणेयू भिन्न. ओंदोंदु हब्बदल्लू ओंदोंदु विशेषते इरुत्तदे.
intro-2: इल्लि कोट्टिरुव हब्बद आचरणेय विवरगळन्नु तिळि. नीनु आचरिसुव हब्बदोंदिगे होलिसि, व्यत्यासगळन्नु गेळेयरोंदिगे
  हंचिको.
poem-s1l1: हब्ब बंतु, हब्ब बंतु
poem-s1l2: हब्ब बंतु हब्ब!
poem-s1l3: अंतू इंतू तंदे तंतु
poem-s1l4: कंते कंते कब्ब!
poem-s2l1: गरिमुरि जरतारि
poem-s2l2: लंग हाकिकोंडु!
poem-s2l3: गिलिगिलि कालगेज्जे
poem-s2l4: दनि माडिकोंडु!
poem-s3l1: एळ्ळु, कब्बु, सक्रे अच्चु
poem-s3l2: बाळे हण्णु, बेल्ल!
poem-s3l3: बीरोकंत होरटिद्दाळे
poem-s3l4: तंगि केरिगेल्ल.
poem-s4l1: होरटिद्दाळे पुटाणि तंगि
poem-s4l2: तन्न गेळति जोडि!
poem-s4l3: रंगेनळ्ळि रंगिन गोंबि
poem-s4l4: कण्ण तुंब नोडि!
poem-s5l1: कोंबनु हेरेदु, बण्णव बळिदु
poem-s5l2: एत्तु-हसु-करुवन्नु!
poem-s5l3: किच्चनु हायिसि कोडुवरु अप्प
poem-s5l4: अक्कि-बेल्ल-हण्णु!
poem-s6l1: मक्कळनेल्ल हसेयलि कूडिसि
poem-s6l2: एळ्ळु-एलचि-अच्चु!
poem-s6l3: सुरियुवाग अम्म अज्जि
poem-s6l4: मक्कळिगच्चु मेच्चु!
