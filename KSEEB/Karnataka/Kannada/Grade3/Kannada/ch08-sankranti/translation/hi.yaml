competency: पाठ पढ़कर मुख्य विषय पहचानना और घटनाएँ क्रम से बताना।
intro-1: त्योहार अनेक हैं। हर त्योहार अलग ढंग से मनाया जाता है। हर एक की अपनी विशेषता होती है।
intro-2: यहाँ बताए त्योहार के उत्सव को जानो। अपने मनाए हुए त्योहार से तुलना करो और अंतर मित्रों को बताओ।
poem-s1l1: त्योहार आया, त्योहार आया,
poem-s1l2: आया रे त्योहार!
poem-s1l3: आख़िर साथ में ले ही आया
poem-s1l4: गन्नों के गट्ठर अपार!
poem-s2l1: करारी, सरसराती, ज़री वाली
poem-s2l2: घाघरी पहनकर!
poem-s2l3: पैरों के घुँघरू छन-छन
poem-s2l4: बजाती चलकर!
poem-s3l1: तिल, गन्ना, साँचे की मिठाई,
poem-s3l2: केला और गुड़ साथ!
poem-s3l3: बाँटने निकली है छोटी बहन
poem-s3l4: पूरे मोहल्ले के पास।
poem-s4l1: निकल पड़ी नन्ही बहना,
poem-s4l2: अपनी सहेली के संग!
poem-s4l3: रंगेनहळ्ळि की रंगीन गुड़िया—
poem-s4l4: जी भर देखो उसके रंग!
poem-s5l1: सींगों को घिसकर रंग लगाएँ,
poem-s5l2: बैल, गाय और बछड़ों को!
poem-s5l3: आग पार कराकर पिताजी दें
poem-s5l4: चावल, गुड़ और फल!
poem-s6l1: सब बच्चों को आसन पर बिठाकर,
poem-s6l2: तिल, बेर, साँचे की मिठाई!
poem-s6l3: जब माँ और दादी बरसातीं,
poem-s6l4: बच्चों को बहुत सुहाई!
