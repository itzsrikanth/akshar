ex-a-q1: छोटी बहन ने कैसा घाघरा पहना था?
ex-a-q2: छोटी बहन सहेली के साथ मोहल्ले में क्यों निकली?
ex-a-q3: पिताजी ने गाय-बछड़ों को क्या दिया?
ex-a-q4: बच्चों को आसन पर बिठाकर क्या करते हैं?
ex-a-q5: “संक्रांति” कविता के कवि का नाम क्या है?
ex-b-p1: 'सूची अ के वाक्यांशों का सूची ब से मिलान करो। ब: 1. छोटी बहन पूरे मोहल्ले में; 2. चावल, गुड़ और फल; 3.
  बच्चों को बहुत पसंद; 4. घाघरा पहनकर; 5. जी भर देखो।'
ex-b-q1: करारी ज़री वाली
ex-b-q2: बाँटने निकली है
ex-b-q3: रंगेनहळ्ळि की रंगीन गुड़िया
ex-b-q4: आग पार कराकर पिताजी देते
ex-b-q5: जब माँ और दादी बरसाती हैं
ex-c-p1: पाठ के आधार पर घटनाओं का क्रम पहचानकर लिखो।
ex-c-q1: माँ और दादी बच्चों को आसन पर बिठाकर उन पर तिल, बेर और साँचे की मिठाइयाँ बरसाती हैं।
ex-c-q2: नन्ही बहन सहेली के साथ तिल और गुड़ बाँटने निकली।
ex-c-q3: छोटी बहन ने करारा ज़री वाला घाघरा पहना।
ex-c-q4: बैल, गाय और बछड़ों के सींग घिसकर और रंग लगाकर उन्हें सजाया।
ex-d-q1: सुबह उठने से विद्यालय जाने तक घर में होने वाली चार घटनाएँ याद करके क्रम से लिखो।
ex-e-p1: 'याद रखो: पुरुष का बोध कराने वाले शब्द पुल्लिंग, स्त्री का बोध कराने वाले स्त्रीलिंग और दोनों में से किसी
  का बोध न कराने वाले नपुंसकलिंग कहलाते हैं।'
ex-e-p2: कोष्ठक के निर्देशों के अनुसार वाक्य दोबारा लिखो।
ex-e-q1: लड़की सब्ज़ी लाई। (इसे पुल्लिंग में लिखो।)
ex-e-q2: राजू ने गाड़ी खींची। (“राजू” की जगह “बैल” लगाकर वाक्य बनाओ।)
ex-e-q3: बड़े और छोटे भाई मित्रों की तरह थे। (इसे स्त्रीलिंग में लिखो।)
ex-f-q1: इन कन्नड़ शब्दों को पुल्लिंग, स्त्रीलिंग और नपुंसकलिंग में बाँटकर लिखो। (पुस्तक, रानी, छोटा भाई, मेज़,
  दीवार, राजा, छोटी बहन, बड़ी बहन, छोटा भाई, विद्यालय, बड़ा भाई, छोटी बहन, पिता, माता, बहन, मित्र, कुर्सी, सहेली)
ex-g-q1: “संक्रांति” कविता के तुकवाले शब्द चुनकर लिखो।
