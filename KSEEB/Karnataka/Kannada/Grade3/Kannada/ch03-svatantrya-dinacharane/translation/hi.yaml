competency: कक्षा में होने वाले संवाद में भाग लेना। समूह में बात करते समय अपनी बारी का पालन करना।
intro-1: हम त्योहार मनाते हैं। त्योहार मनाने के लिए कुछ तैयारियाँ करनी पड़ती हैं।
intro-2: अगर सारी तैयारियाँ अकेले करनी पड़ें तो कठिनाई होगी, है ना? क्या तुम जानना चाहते हो कि वह कठिनाई कैसे दूर
  की जाए?
intro-3: देखो और जानो कि विद्यालय में शिक्षकों और विद्यार्थियों ने क्या तरीका अपनाया।
story-n1: खाली समय था। प्रधानाध्यापक ने विद्यालय के विद्यार्थी मंत्रिमंडल की बैठक बुलाई। मंत्री बैठक में आए।
story-d1: बच्चो, यह अगस्त का महीना है। इस महीने हम कौन-सा राष्ट्रीय पर्व मनाते हैं? राजू, क्या तुम बता सकते हो?
story-d2: स्वतंत्रता दिवस, सर।
story-d3: इस तरह सबको एक साथ नहीं बोलना चाहिए। अपनी बारी से बोलना चाहिए, समझे? अच्छा राजू, तुम बताओ, स्वतंत्रता
  दिवस क्या है?
story-d4: हमारा देश जिस दिन स्वतंत्र हुआ था, उसकी याद में हर साल पूरे देश में मनाया जाने वाला पर्व।
story-d5: स्वतंत्र होने का दिन! इसका क्या मतलब है, सर?
story-d6: पहले हमारे देश पर अंग्रेज़ शासन करते थे। देश के स्वाभिमानी लोगों ने गांधीजी के नेतृत्व में उनके विरुद्ध
  लड़कर स्वतंत्रता दिलाई। उनकी देशभक्ति, त्याग और बलिदान से हमारा देश 15 अगस्त 1947 को स्वतंत्र हुआ। देश की स्वतंत्रता
  की सुखद याद में हर साल पूरे देश में मनाया जाने वाला पर्व ही स्वतंत्रता दिवस है।
story-d7: हम अपने विद्यालय में भी मनाते हैं ना, सर?
story-d8: हाँ, उसकी तैयारी अभी से करनी चाहिए।
story-d9: क्या-क्या तैयारियाँ करनी हैं? बताइए, सर।
story-d10: खेल प्रतियोगिताएँ आयोजित करनी हैं। सांस्कृतिक कार्यक्रम प्रस्तुत करने वालों को चुनना है। मैदान साफ़ करना
  है। विद्यालय को हरे पत्तों के तोरणों से सजाना है।
story-d11: गुरुजी, हम काम बाँटकर तैयारी करेंगे।
story-d12: बहुत अच्छा। कौन-कौन से काम किस-किस के हिस्से में आएँगे?
story-d13: सर, मंत्रिमंडल के सभी सदस्य मिलकर खेल प्रतियोगिताएँ करवाएँगे और विजेताओं की सूची तैयार करेंगे।
story-n2: (शाहिन और ऐश्वर्य बात कर रहे थे।)
story-d14: शाहिन, ऐश्वर्य, जब कोई बोल रहा हो तो आपस में बात नहीं करनी चाहिए। दूसरों के विचार सुनने चाहिए।
story-d15: क्षमा कीजिए, सर। अब से हम ध्यान से सुनेंगे।
story-d16: अच्छा! समझदार बच्चे।
story-d17: सर, हम चौथी कक्षा के विद्यार्थी विद्यालय का मैदान साफ़ करेंगे।
story-d18: मैं सांस्कृतिक कार्यक्रम प्रस्तुत करने वालों की सूची तैयार करूँगी।
story-d19: हम दूसरी कक्षा के विद्यार्थी रंगीन कागज़ से तोरण बनाएँगे।
story-d20: हम तीसरी कक्षा के विद्यार्थी ध्वजस्तंभ सजाएँगे, सर।
story-d21: ध्वजस्तंभ के चारों ओर रंगोली बनाने से अच्छा लगेगा।
story-d22: अच्छा सुझाव है। पंकज अच्छी रंगोली बनाती है। क्या उससे बनवाएँ, सर?
story-d23: अच्छा, क्या सबको मेरी का सुझाव मंज़ूर है?
story-d24: ओ… हाँ, सर।
story-d25: सजावट की सामग्री कौन लाएगा?
story-d26: मैं अपने बगीचे से आम की कोमल पत्तियाँ और केले के तने लाऊँगा। हम सब मिलकर विद्यालय सजाएँ।
story-d27: हम पाँचवीं कक्षा के विद्यार्थी राष्ट्रनेताओं के चित्रों को फूलों की मालाओं से सजाएँगे। सर, और… (वह बोलती
  रहती है।)
story-d28: ऐश्वर्य, दूसरों को भी बोलने का अवसर देना चाहिए ना?
story-d29: मैं पहली कक्षा के विद्यार्थियों के साथ विद्यालय के बगीचे से फूल तोड़कर लाऊँगी।
story-d30: ठीक है, तो मैं अतिथियों को कार्यक्रम में आने का निमंत्रण दूँगा। शिक्षक तुम्हारे कामों में मार्गदर्शन
  करेंगे। आगे की तैयारी करो।
story-n3: (सबने शिक्षकों के मार्गदर्शन में अपने काम की तैयारी की।)
story-n4: स्वतंत्रता दिवस पर बच्चे भोर में ही उठकर तैयार हुए। वे वर्दी पहनकर विद्यालय आए।
story-n5: सबने अपना-अपना काम पूरा किया। शिक्षकों के साथ जयकारे लगाते हुए प्रभातफेरी में भाग लिया। बच्चों का अनुशासन
  देखकर गाँववाले खुश हुए।
story-n6: विद्यालय के मैदान में पंचायत अध्यक्ष ने ध्वजारोहण किया। सबने राष्ट्रगान गाया। उसके बाद हुई सभा में प्रधानाध्यापक
  ने स्वतंत्रता सेनानियों के त्याग और देशभक्ति के बारे में बताया।
story-n7: मुख्य अतिथियों ने खेल प्रतियोगिताओं के विजेताओं को पुरस्कार दिए। अंत में बच्चों ने सांस्कृतिक कार्यक्रम
  प्रस्तुत किया। इकट्ठे हुए लोगों ने खुशी से तालियाँ बजाईं। सब मिठाई खाकर कार्यक्रम को याद करते हुए चले गए।
