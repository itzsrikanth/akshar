competency: Taking part in classroom discussions. Taking turns when speaking in a group.
intro-1: We celebrate festivals. Some preparations are needed to celebrate a festival.
intro-2: Wouldn't it be difficult for one person to make all the preparations? Are you curious about how to overcome
  that difficulty?
intro-3: Observe and learn how the teachers and pupils at a school went about it.
story-n1: It was free time. The headteacher called a meeting of the school's student cabinet. The ministers came
  to the meeting.
story-d1: Children, this is August. Which national festival do we celebrate this month? Can you tell us, Raju?
story-d2: Independence Day, sir.
story-d3: 'You must not all speak at once like this. Take turns, understood? All right, Raju, tell us: what is Independence
  Day?'
story-d4: It is the festival celebrated across the country every year to remember the day our country became independent.
story-d5: The day it became independent! What does that mean, sir?
story-d6: The British once ruled our country. Our self-respecting people fought against them under Gandhiji's leadership
  and won freedom. Through their patriotism, sacrifice and the giving of their lives, our country became independent
  on 15 August 1947. Independence Day is the festival celebrated throughout the country each year in happy remembrance
  of that freedom.
story-d7: We celebrate it at our school too, don't we, sir?
story-d8: Yes. We must start preparing for it now.
story-d9: What preparations are needed? Please tell us, sir.
story-d10: We must arrange sports competitions, identify those who will present the cultural programme, clean the
  grounds, and decorate the school with fresh-leaf festoons.
story-d11: Teacher, we will share the work and make the preparations.
story-d12: Good. Who will take on which tasks?
story-d13: Sir, all the cabinet members will together conduct the sports competitions and prepare a list of winners.
story-n2: (Shahin and Aishwarya were talking.)
story-d14: Shahin, Aishwarya, you must not talk among yourselves while someone else is speaking. You should listen
  to others' opinions.
story-d15: Sorry, sir. We will listen carefully from now on.
story-d16: Ah! Good children.
story-d17: Sir, we in Class Four will clean the school grounds.
story-d18: I will prepare the list of cultural programme participants.
story-d19: We in Class Two will make festoons from coloured paper.
story-d20: We in Class Three will decorate the flagpole, sir.
story-d21: It would look nice to make a rangoli around the flagpole.
story-d22: Good suggestion. Pankaja makes lovely rangolis. Shall we ask her to do it, sir?
story-d23: Good. Does everyone agree with Mary's suggestion?
story-d24: Oh… yes, sir.
story-d25: Who will bring the decoration materials?
story-d26: I will bring tender mango leaves and banana stems from our garden. Let us all decorate the school together.
story-d27: We in Class Five will decorate the national leaders' portraits with flower garlands. Sir, also… (She
  continues speaking.)
story-d28: Aishwarya, shouldn't you give others a chance to speak too?
story-d29: I will join the Class One pupils and bring flowers picked from the school garden.
story-d30: All right. I will invite the guests to the programme. The teachers will guide you in your work. Go ahead
  with the preparations.
story-n3: (Everyone prepared for their tasks under the teachers' guidance.)
story-n4: On Independence Day, the children got up at dawn and got ready. They wore their uniforms and came to school.
story-n5: Everyone completed their assigned work. They joined the morning procession with their teachers, raising
  cheers. The villagers were pleased to see the children's discipline.
story-n6: The panchayat president hoisted the flag in the school grounds. Everyone sang the national anthem. At
  the gathering afterwards, the headteacher spoke about the freedom fighters' sacrifice and patriotism.
story-n7: The chief guests distributed prizes to the sports winners. Finally, the children presented a cultural
  programme. The gathered people clapped happily. Everyone enjoyed sweets and left, recalling the programme.
