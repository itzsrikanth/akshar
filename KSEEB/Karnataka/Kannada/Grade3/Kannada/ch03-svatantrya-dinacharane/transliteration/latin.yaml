competency: Taragatiyalli nadeyuva samvaadadalli bhaagavahisuvudu. Gumpinalli maatanaaduvaaga saradiyannu anusarisuvudu.
intro-1: Naavu habbagalannu aacharisutteve. Habba aacharisalu kelavu siddhategalu beku.
intro-2: Ella siddhategalannu obbare maadabekaadare tondare allave? Haagaadare aa tondare nivaarisalu enu maadabeku
  emba kutoohalave?
intro-3: Shaaleyalli gurugalu haagoo vidyaarthigalu anusarisida kramavannu gamanisi tili.
story-n1: Biduvina samaya. Mukhya gurugalu shaalaa vidyaarthi mantrimandalada sabhe karedaru. Mantrigalu sabhege
  bandaru.
story-d1: Makkale, idu aagast tingalu. Ee tingalalli aacharisuva raashtreeya habba yaavudu? Nee helaballeyaa raaju?
story-d2: Svaatantrya dinaacharane sar.
story-d3: Heege ellaroo ottaagi maatanaadabaaradu. Saradi anusarisabeku tiliyite? Sari, raaju neenu helu, svaatantrya
  dinaacharane endarenu?
story-d4: Namma desha svatantravaada dinada nenapigaagi prati varsha deshadaadyanta aacharisuva habba.
story-d5: Svatantravaada dina! Haagendarenu sar?
story-d6: Hinde namma deshavannu britisharu aaluttiddaru. Deshada svaabhimaani janaru gaandheejiyavara netrutvadalli
  avara viruddha horaadi svaatantrya tandukottaru. Avara deshaabhimaana, tyaaga haagoo balidaanadinda 1947 aagast
  15 randu namma desha svatantravaayitu. Desha svatantravaada savi nenapige prati varsha deshaadyanta aacharisuva
  habbave svaatantrya dinaacharane.
story-d7: Namma shaaleyalloo aacharisuttevalla sar?
story-d8: Haudu, adakkaagi eeginindale siddhate maadikollabeku.
story-d9: Enenu siddhate maadabekide? Heli sar.
story-d10: Aatota spardhe erpadisabeku. Saanskrutika kaaryakrama nadesikoduvavarannu gurutisabeku. Maidaanavannu
  svachchhagolisabeku. Shaaleyannu taliru toranagalinda alankarisabeku.
story-d11: Gurugale, naavu kelasa hanchikondu siddhate maadutteve.
story-d12: Santosha. Yaaru yaaru, yaava yaava kelasagalannu hanchikolluviri?
story-d13: Sar, mantri mandalada ella sadasyaru seri aatota spardhe nadesi vijetara pattiyannu siddhapadisutteve.
story-n2: (Shaahin mattu aishvarya maatanaaduttiddaru)
story-d14: Shaahin, aishvarya obbaru maataaduvaaga nimma nimmolage maataadabaaradu. Itarara abhipraayavannu kelisikollabeku.
story-d15: Kshamisi sar, innu mele gamanavittu kelutteve.
story-d16: Hnyaa! Jaana makkalu.
story-d17: Sar, naavu naalkaneya taragatiyavaru shaaleya maidaanavannu svachchhagolisutteve.
story-d18: Naanu saanskrutika kaaryakrama needuvavara patti siddhapadisuttene.
story-d19: Naavu eradaneya taragatiyavaru bannada kaagadadinda torana kattutteve.
story-d20: Naavu mooraneya taragatiyavaru dhvajastambhavannu singarisutteve sar.
story-d21: Dhvaja stambhada sutta rangavalli haakidare chennaagiruttade.
story-d22: Olleya salahe, pankaja chennaagi rangavalli haakuttaale. Avalinda haakisonave sar?
story-d23: Olleyadu, meriya salahe ellarigoo oppigeye?
story-d24: O.... Aagabahudu sar.
story-d25: Alankaarakke saamagrigalannu taruvavaru yaaru?
story-d26: Namma totadinda maavina taliru, baalekamba taruttene. Ellaroo seri shaaleyannu singarisona.
story-d27: Naavu aidaneya taragatiyavaru raashtra naayakara bhaava chitragalige hoovina haara haaki alankarisutteve.
  Sar matte... (Maatu munduvarisuvalu)
story-d28: Aishvaryaa, itararigoo maatanaadalu avakaasha kodabekallave?
story-d29: Naanu ondaneya taragatiyavarodane seri shaalaa kaitotadinda hoogalannu bidisi taruttene.
story-d30: Sari, haagaadare naanu kaaryakramakke baruvante atithigalannu aamantrisuttene. Nimma kelasagalalli shikshakaru
  maargadarshana needuttaare. Mundina siddhate maadikolli.
story-n3: (Ellaroo shikshakara maargadarshanadalli tamma kelasakke poorva tayaari maadikondaru.)
story-n4: Svaatantrya dinaacharaneya dinadandu makkalu nasukinalliye eddu siddharaadaru. Samavastra dharisi shaalege
  bandaru.
story-n5: Ellaroo taavu vahisikondidda kelasavannu poornagolisidaru. Gurugalondige jayaghosha haakutta prabhaatapheriyalli
  paalgondaru. Makkala shistannu nodi graamastharu santoshapattaru.
story-n6: Shaalaa maidaanadalli panchaayiti adhyaksharu dhvajaarohana maadidaru. Ellaroo raashtrageete haadidaru.
  Anantara nadeda sabhaa kaaryakramadalli mukhya gurugalu svaatantrya horaatagaarara tyaaga mattu deshabhaktiya
  kuritu maatanaadidaru.
story-n7: Aatota spardheyalli vijetaraadavarige mukhya atithigalu bahumaana vitarisidaru. Koneyalli makkalu saanskrutika
  kaaryakrama nadesikottaru. Neredidda janaru santoshadinda chappaale tattidaru. Ellaroo sihi savidu kaaryakrama
  meluku haakuttaa teralidaru.
