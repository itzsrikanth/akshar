competency: तरगतियल्लि नडेयुव संवाददल्लि भागवहिसुवुदु. गुंपिनल्लि मातनाडुवाग सरदियन्नु अनुसरिसुवुदु.
intro-1: नावु हब्बगळन्नु आचरिसुत्तेवे. हब्ब आचरिसलु केलवु सिद्धतेगळु बेकु.
intro-2: एल्ल सिद्धतेगळन्नु ओब्बरे माडबेकादरे तोंदरे अल्लवे? हागादरे आ तोंदरे निवारिसलु एनु माडबेकु एंब कुतूहलवे?
intro-3: शालेयल्लि गुरुगळु हागू विद्यार्थिगळु अनुसरिसिद क्रमवन्नु गमनिसि तिळि.
story-n1: बिडुविन समय. मुख्य गुरुगळु शाला विद्यार्थि मंत्रिमंडलद सभे करेदरु. मंत्रिगळु सभेगे बंदरु.
story-d1: मक्कळे, इदु आगस्ट् तिंगळु. ई तिंगळल्लि आचरिसुव राष्ट्रीय हब्ब यावुदु? नी हेळबल्लेया राजु?
story-d2: स्वातंत्र्य दिनाचरणे सर्.
story-d3: हीगे एल्लरू ओट्टागि मातनाडबारदु. सरदि अनुसरिसबेकु तिळियिते? सरि, राजु नीनु हेळु, स्वातंत्र्य दिनाचरणे
  एंदरेनु?
story-d4: नम्म देश स्वतंत्रवाद दिनद नेनपिगागि प्रति वर्ष देशदाद्यंत आचरिसुव हब्ब.
story-d5: स्वतंत्रवाद दिन! हागेंदरेनु सर्?
story-d6: हिंदे नम्म देशवन्नु ब्रिटिषरु आळुत्तिद्दरु. देशद स्वाभिमानि जनरु गांधीजियवर नेतृत्वदल्लि अवर विरुद्ध होराडि
  स्वातंत्र्य तंदुकोट्टरु. अवर देशाभिमान, त्याग हागू बलिदानदिंद 1947 आगस्ट् 15 रंदु नम्म देश स्वतंत्रवायितु. देश
  स्वतंत्रवाद सवि नेनपिगे प्रति वर्ष देशाद्यंत आचरिसुव हब्बवे स्वातंत्र्य दिनाचरणे.
story-d7: नम्म शालेयल्लू आचरिसुत्तेवल्ल सर्?
story-d8: हौदु, अदक्कागि ईगिनिंदले सिद्धते माडिकोळ्ळबेकु.
story-d9: एनेनु सिद्धते माडबेकिदे? हेळि सर्.
story-d10: आटोट स्पर्धे एर्पडिसबेकु. सांस्कृतिक कार्यक्रम नडेसिकोडुववरन्नु गुरुतिसबेकु. मैदानवन्नु स्वच्छगोळिसबेकु.
  शालेयन्नु तळिरु तोरणगळिंद अलंकरिसबेकु.
story-d11: गुरुगळे, नावु केलस हंचिकोंडु सिद्धते माडुत्तेवे.
story-d12: संतोष. यारु यारु, याव याव केलसगळन्नु हंचिकोळ्ळुविरि?
story-d13: सर्, मंत्रि मंडलद एल्ल सदस्यरु सेरि आटोट स्पर्धे नडेसि विजेतर पट्टियन्नु सिद्धपडिसुत्तेवे.
story-n2: (षाहिन् मत्तु ऐश्वर्य मातनाडुत्तिद्दरु)
story-d14: षाहिन्, ऐश्वर्य ओब्बरु माताडुवाग निम्म निम्मोळगे माताडबारदु. इतरर अभिप्रायवन्नु केळिसिकोळ्ळबेकु.
story-d15: क्षमिसि सर्, इन्नु मेले गमनविट्टु केळुत्तेवे.
story-d16: ह्ञा! जाण मक्कळु.
story-d17: सर्, नावु नाल्कनेय तरगतियवरु शालेय मैदानवन्नु स्वच्छगोळिसुत्तेवे.
story-d18: नानु सांस्कृतिक कार्यक्रम नीडुववर पट्टि सिद्धपडिसुत्तेने.
story-d19: नावु एरडनेय तरगतियवरु बण्णद कागददिंद तोरण कट्टुत्तेवे.
story-d20: नावु मूरनेय तरगतियवरु ध्वजस्तंभवन्नु सिंगरिसुत्तेवे सर्.
story-d21: ध्वज स्तंभद सुत्त रंगवल्लि हाकिदरे चेन्नागिरुत्तदे.
story-d22: ओळ्ळेय सलहे, पंकज चेन्नागि रंगवल्लि हाकुत्ताळे. अवळिंद हाकिसोणवे सर्?
story-d23: ओळ्ळेयदु, मेरिय सलहे एल्लरिगू ओप्पिगेये?
story-d24: ओ.... आगबहुदु सर्.
story-d25: अलंकारक्के सामग्रिगळन्नु तरुववरु यारु?
story-d26: नम्म तोटदिंद माविन तळिरु, बाळेकंब तरुत्तेने. एल्लरू सेरि शालेयन्नु सिंगरिसोण.
story-d27: नावु ऐदनेय तरगतियवरु राष्ट्र नायकर भाव चित्रगळिगे हूविन हार हाकि अलंकरिसुत्तेवे. सर् मत्ते... (मातु मुंदुवरिसुवळु)
story-d28: ऐश्वर्या, इतररिगू मातनाडलु अवकाश कोडबेकल्लवे?
story-d29: नानु ओंदनेय तरगतियवरोडने सेरि शाला कैतोटदिंद हूगळन्नु बिडिसि तरुत्तेने.
story-d30: सरि, हागादरे नानु कार्यक्रमक्के बरुवंते अतिथिगळन्नु आमंत्रिसुत्तेने. निम्म केलसगळल्लि शिक्षकरु मार्गदर्शन
  नीडुत्तारे. मुंदिन सिद्धते माडिकोळ्ळि.
story-n3: (एल्लरू शिक्षकर मार्गदर्शनदल्लि तम्म केलसक्के पूर्व तयारि माडिकोंडरु.)
story-n4: स्वातंत्र्य दिनाचरणेय दिनदंदु मक्कळु नसुकिनल्लिये एद्दु सिद्धरादरु. समवस्त्र धरिसि शालेगे बंदरु.
story-n5: एल्लरू तावु वहिसिकोंडिद्द केलसवन्नु पूर्णगोळिसिदरु. गुरुगळोंदिगे जयघोष हाकुत्त प्रभातफेरियल्लि पाल्गोंडरु.
  मक्कळ शिस्तन्नु नोडि ग्रामस्थरु संतोषपट्टरु.
story-n6: शाला मैदानदल्लि पंचायिति अध्यक्षरु ध्वजारोहण माडिदरु. एल्लरू राष्ट्रगीते हाडिदरु. अनंतर नडेद सभा कार्यक्रमदल्लि
  मुख्य गुरुगळु स्वातंत्र्य होराटगारर त्याग मत्तु देशभक्तिय कुरितु मातनाडिदरु.
story-n7: आटोट स्पर्धेयल्लि विजेतरादवरिगे मुख्य अतिथिगळु बहुमान वितरिसिदरु. कोनेयल्लि मक्कळु सांस्कृतिक कार्यक्रम
  नडेसिकोट्टरु. नेरेदिद्द जनरु संतोषदिंद चप्पाळे तट्टिदरु. एल्लरू सिहि सविदु कार्यक्रम मेलुकु हाकुत्ता तेरळिदरु.
