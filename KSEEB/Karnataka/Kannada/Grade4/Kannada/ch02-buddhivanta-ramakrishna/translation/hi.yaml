intro-1: तुमने जो कहानी, कविता, छोटी पद्य-रचना या चुटकुला पढ़ा है, उनमें से कोई एक कक्षा में सुनाओ।
story-n1: एक बार विद्यासागर नाम का एक महान पंडित कृष्णदेवराय के दरबार में आया। उसकी ख्याति चारों ओर फैली हुई थी। वह संस्कृत का बहुत बड़ा विद्वान था। विद्या से प्रेम करने वाले कृष्णदेवराय ने उसका स्वागत और सत्कार किया।
story-n2: '“महाराज, मैं आपके दरबार के पंडितों से शास्त्रार्थ करने आया हूँ,” विद्यासागर ने कहा। कृष्णदेवराय ने सहमति दी और अपने दरबार के पंडितों की ओर देखा। उनमें से किसी ने भी शास्त्रार्थ करने में रुचि नहीं दिखाई।'
story-n3: 'सबको चुप देखकर विद्यासागर ने कहा, “दुख की बात है कि इतने बड़े राजा के दरबार में मुझे हराने वाला एक भी पंडित नहीं है। यदि यह बात मुझे पहले ही मालूम होती, तो मैं यहाँ आता ही नहीं।”'
story-n4: 'तब तेनाली रामकृष्ण ने खड़े होकर कहा, “आप इतनी जल्दी इस नतीजे पर मत पहुँचिए।” विद्यासागर ने उसकी ओर देखकर पूछा, “आप कौन हैं?” उसने कहा, “मैंने एक-दो ग्रंथ लिखे हैं। मुझे तेनाली रामकृष्ण कहते हैं।”'
story-n5: 'विद्यासागर का चेहरा खिल उठा। उसने कहा, “अच्छा? मैंने आपकी बुद्धिमानी के बारे में सुना है। लेकिन केवल हाजिरजवाबी से काम नहीं चलता; गहरा अध्ययन करने वाला ही मुझसे शास्त्रार्थ कर सकता है।”'
story-n6: 'रामकृष्ण ने पूछा, “यह मुझे भी मालूम है। आप किस ग्रंथ पर शास्त्रार्थ करेंगे?” विद्यासागर ने उत्तर दिया, “आपकी पसंद का कोई भी संस्कृत ग्रंथ हो सकता है।”'
story-n7: 'रामकृष्ण ने कहा, “तो मैं कल शाम इसी समय आपसे शास्त्रार्थ करने के लिए तैयार होकर आऊँगा।”'
story-n8: अगले दिन विद्यासागर गर्व से दरबार में आया और अपने आसन पर बैठ गया। सभी यह जानने को उत्सुक थे कि वह कैसा शास्त्रार्थ करेगा। कुछ देर बाद रामकृष्ण सभा में आया। उसके सेवक के हाथ में कपड़े में लिपटी एक पोटली थी। किसी को अंदाजा नहीं था कि उस पोटली में क्या है।
story-n9: 'रामकृष्ण ने अपने आसन पर बैठकर विद्यासागर से कहा, “मैं तैयार हूँ, महोदय।” विद्यासागर ने कहा, “मैं भी तैयार हूँ। चलिए, शुरू करें।” रामकृष्ण ने कहा, “आपने कहा था कि शास्त्रार्थ के लिए मैं कोई भी ग्रंथ चुन सकता हूँ।” विद्यासागर ने उत्तर दिया, “हाँ! जो चाहें चुन लीजिए।”'
story-n10: 'रामकृष्ण ने सामने रखी पोटली की ओर इशारा करते हुए कहा, “अब मैं इस ‘तिलकाष्ठमहिषबंधन’ पर शास्त्रार्थ करूँगा। शुरू करूँ?” ‘तिलकाष्ठमहिषबंधन!’ विद्यासागर की आँखें फैल गईं। वह हकलाने लगा, “वह...! वह...!”'
story-n11: 'रामकृष्ण ने गर्व से कहा, “क्यों? क्या आप ‘तिलकाष्ठमहिषबंधन’ नहीं जानते? हमारे गाँव में मवेशी चराने वाले लड़के भी इसे जानते हैं।”'
story-n12: विद्यासागर सिर खुजलाने लगा। उसका चेहरा उतर गया। बहुत सोचने पर भी उसे तिलकाष्ठमहिषबंधन नाम का ग्रंथ याद नहीं आया। वह परेशान होकर सोचने लगा, ‘यह ग्रंथ मेरी नजर से कैसे बच गया?’
story-n13: 'विद्यासागर ने महाराज से विनती की, “महाराज, न जाने क्यों मेरी तबीयत ठीक नहीं है। कृपया शास्त्रार्थ कल शुरू करने की अनुमति दीजिए।” राजा ने कहा, “ठीक है।” विद्यासागर तुरंत वहाँ से चला गया। रामकृष्ण भी बिना कुछ कहे घर चला गया।'
story-n14: अगले दिन उसी समय रामकृष्ण वही पोटली लेकर गंभीर भाव से सभा में आया। लेकिन बहुत देर तक विद्यासागर नहीं आया। सेवक उसे बुलाने गए। तब पता चला कि विद्यासागर रातोंरात वहाँ से भाग गया था।
story-n15: 'पूरी सभा ने रामकृष्ण की जय-जयकार की। कृष्णदेवराय ने प्रशंसा करते हुए कहा, “तुमने मेरे दरबार की प्रतिष्ठा बचा ली। मैंने भी ‘तिलकाष्ठमहिषबंधन’ नाम का ग्रंथ कभी नहीं सुना। लाओ, मुझे भी देखने दो।”'
story-n16: 'रामकृष्ण ने पोटली खोली। उसमें कुछ लकड़ियाँ एक रस्सी से बँधी थीं। राजा ने आश्चर्य से पूछा, “यह क्या है?”'
story-n17: 'तब रामकृष्ण ने कहा, “ये तिल के डंठल हैं, यानी तिलकाष्ठ। यह भैंस बाँधने की रस्सी है, यानी महिषबंधन। यही है ‘तिलकाष्ठमहिषबंधन’। इसे कोई बड़ा ग्रंथ समझकर बेचारा विद्यासागर डर गया और भाग निकला।”'
story-n18: बहुत देर तक सबकी हँसी से सभा गूँजती रही। रामकृष्ण की बुद्धिमानी से प्रसन्न होकर कृष्णदेवराय ने उसका सम्मान किया।
intro-2: विद्या विनम्रता सिखाती है। बुद्धि विवेक सिखाती है।
