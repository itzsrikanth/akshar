ex-g-q1: संवाद पढ़िए और उसे कहानी के रूप में लिखिए।
ex-g-p1: सैनिक, मैं जेल के कैदियों को देखने आया हूँ।
ex-g-p2: आज्ञा, स्वामी। इधर आइए। मैं एक-एक करके सबको दिखाता हूँ।
ex-g-p3: यह युवक कौन है?
ex-g-p4: कल ही आया हुआ अपराधी है, स्वामी।
ex-g-p5: अरे युवक! तुमने क्या अपराध किया?
ex-g-p6: स्वामी! मैं सड़क से आ रहा था। मैंने जमीन पर गिरा रस्सी का एक टुकड़ा देखा। यह सोचकर कि किसी को उसकी जरूरत नहीं है, मैंने उसे उठाया और घर की ओर चल दिया।
ex-g-p7: क्या? रस्सी का टुकड़ा उठाने पर इतनी बड़ी सजा?
ex-g-p8: स्वामी! उसी से पूछिए कि रस्सी के सिरे पर क्या था।
ex-g-p9: मेरी किस्मत खराब थी, स्वामी। रस्सी के सिरे पर एक गाय बँधी थी।
ex-h-q1: अखबारों में आने वाले बच्चों के पन्नों से कहानियाँ इकट्ठी कीजिए और शिक्षक की सहायता से कक्षा में पढ़िए।
competency: तुम बच्चों की पत्रिकाएँ पढ़कर समझ सकते हो, है न?
